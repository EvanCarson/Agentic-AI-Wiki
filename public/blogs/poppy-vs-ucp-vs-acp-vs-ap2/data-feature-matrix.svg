<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ft fd">
  <title id="ft">What each protocol standardises</title>
  <desc id="fd">A four by three matrix. Poppy is strong on identity and session and absent on catalog and checkout and on payment authorization. ACP is weak on identity, strong on catalog and checkout and strong on payment authorization. UCP is weak on identity, strong on catalog and checkout and partial on payment authorization. AP2 is partial on identity, absent on catalog and checkout and strong on payment authorization.</desc>
  <style>
    .fm-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .fm-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .fm-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .fm-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .fm-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .fm-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .fm-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .fm-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .fm-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="fm-ttl" x="20" y="34">What each protocol actually standardises</text>

  <text class="fm-col" x="320" y="76" text-anchor="middle">Identity &amp; session</text>
  <text class="fm-col" x="510" y="76" text-anchor="middle">Catalog &amp; checkout</text>
  <text class="fm-col" x="700" y="76" text-anchor="middle">Payment authorization</text>

  <text class="fm-row" x="20" y="118">Poppy</text>
  <rect class="fm-strong" x="230" y="92" width="180" height="40" />
  <text class="fm-inv"  x="320" y="117" text-anchor="middle">Strong</text>
  <rect class="fm-weak"   x="420" y="92" width="180" height="40" />
  <text class="fm-cell" x="510" y="117" text-anchor="middle">Absent</text>
  <rect class="fm-weak"   x="610" y="92" width="180" height="40" />
  <text class="fm-cell" x="700" y="117" text-anchor="middle">Future work</text>

  <text class="fm-row" x="20" y="178">ACP</text>
  <rect class="fm-weak"   x="230" y="152" width="180" height="40" />
  <text class="fm-cell" x="320" y="177" text-anchor="middle">Platform&#8217;s own</text>
  <rect class="fm-strong" x="420" y="152" width="180" height="40" />
  <text class="fm-inv"  x="510" y="177" text-anchor="middle">Strong</text>
  <rect class="fm-strong" x="610" y="152" width="180" height="40" />
  <text class="fm-inv"  x="700" y="177" text-anchor="middle">Delegated token</text>

  <text class="fm-row" x="20" y="238">UCP</text>
  <rect class="fm-weak"   x="230" y="212" width="180" height="40" />
  <text class="fm-cell" x="320" y="237" text-anchor="middle">Merchant&#8217;s own</text>
  <rect class="fm-strong" x="420" y="212" width="180" height="40" />
  <text class="fm-inv"  x="510" y="237" text-anchor="middle">Strong</text>
  <rect class="fm-mid"    x="610" y="212" width="180" height="40" />
  <text class="fm-cell" x="700" y="237" text-anchor="middle">Via AP2</text>

  <text class="fm-row" x="20" y="298">AP2</text>
  <rect class="fm-mid"    x="230" y="272" width="180" height="40" />
  <text class="fm-cell" x="320" y="297" text-anchor="middle">Credential subject</text>
  <rect class="fm-weak"   x="420" y="272" width="180" height="40" />
  <text class="fm-cell" x="510" y="297" text-anchor="middle">Absent</text>
  <rect class="fm-strong" x="610" y="272" width="180" height="40" />
  <text class="fm-inv"  x="700" y="297" text-anchor="middle">Strong</text>

  <rect class="fm-strong" x="20"  y="344" width="18" height="14" />
  <text class="fm-leg" x="48"  y="356">Standardised here</text>
  <rect class="fm-mid"    x="230" y="344" width="18" height="14" />
  <text class="fm-leg" x="258" y="356">Partial or by reference</text>
  <rect class="fm-weak"   x="470" y="344" width="18" height="14" />
  <text class="fm-leg" x="498" y="356">Left to the implementer</text>
</svg>
