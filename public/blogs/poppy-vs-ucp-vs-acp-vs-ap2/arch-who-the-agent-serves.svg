<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="wt wd">
  <title id="wt">Who the agent is acting for</title>
  <desc id="wd">Two chains. In the upper chain an end user's personal agent reaches a company through the Poppy discovery document and ends in a company session with no payment instrument. In the lower chain a buyer's platform agent reaches a merchant checkout API and ends at a payment service provider holding a delegated token or an AP2 mandate.</desc>
  <style>
    .wa-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .wa-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .wa-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .wa-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wa-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .wa-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .wa-band { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wa-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .wa-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#wa-h); }
  </style>
  <defs>
    <marker id="wa-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="wa-band" x="20" y="40">Poppy: the agent is the user&#8217;s delegate</text>

  <rect class="wa-box"  x="20"  y="70" width="150" height="56" />
  <text class="wa-lab"  x="95"  y="103" text-anchor="middle">End user</text>
  <path class="wa-arr"  d="M 178 98 L 226 98" />
  <rect class="wa-hero" x="234" y="70" width="170" height="56" />
  <text class="wa-inv"  x="319" y="103" text-anchor="middle">Personal agent</text>
  <path class="wa-arr"  d="M 412 98 L 460 98" />
  <rect class="wa-box"  x="468" y="70" width="170" height="56" />
  <text class="wa-mono" x="553" y="103" text-anchor="middle">poppy.json</text>
  <path class="wa-arr"  d="M 646 98 L 694 98" />
  <rect class="wa-box"  x="702" y="70" width="170" height="56" />
  <text class="wa-lab"  x="787" y="103" text-anchor="middle">Company session</text>

  <text class="wa-sub" x="20" y="162">Signs in mid-session. Two reserved scopes. Per-company pseudonym.</text>
  <text class="wa-sub" x="20" y="186">No payment instrument anywhere in the chain &#8212; named as future work.</text>

  <text class="wa-band" x="20" y="268">ACP, UCP and AP2: the agent is the platform&#8217;s buyer</text>

  <rect class="wa-box"  x="20"  y="298" width="150" height="56" />
  <text class="wa-lab"  x="95"  y="331" text-anchor="middle">Buyer</text>
  <path class="wa-arr"  d="M 178 326 L 226 326" />
  <rect class="wa-adj"  x="234" y="298" width="170" height="56" />
  <text class="wa-lab"  x="319" y="331" text-anchor="middle">Platform agent</text>
  <path class="wa-arr"  d="M 412 326 L 460 326" />
  <rect class="wa-box"  x="468" y="298" width="170" height="56" />
  <text class="wa-lab"  x="553" y="331" text-anchor="middle">Merchant checkout</text>
  <path class="wa-arr"  d="M 646 326 L 694 326" />
  <rect class="wa-adj"  x="702" y="298" width="170" height="56" />
  <text class="wa-lab"  x="787" y="331" text-anchor="middle">PSP or mandate</text>

  <text class="wa-sub" x="20" y="390">A one-time token with a maximum amount and an expiry, or an AP2 mandate.</text>
  <text class="wa-sub" x="20" y="414">The buyer&#8217;s identity is the platform&#8217;s, and the instrument is held off-agent.</text>
  <text class="wa-sub" x="20" y="462">Both chains can terminate at the same company. Only one of them knows which human it is.</text>
</svg>
