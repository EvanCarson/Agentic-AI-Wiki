<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The four layers of a computer-use agent, and who ships each</title>
  <desc id="d">A task enters a policy layer that plans and retries, which calls a grounding model that turns a screenshot into a coordinate, which acts on a machine holding the desktop. A side path shows a compiler that records one demonstration and then drives the machine directly with no model in the run-time loop.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .who    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .8; }
    .who-inv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); opacity: .9; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .arrow-d{ fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="28">Every run</text>

  <rect class="box" x="20" y="46" width="430" height="80" />
  <text class="label" x="38" y="76">Policy &#8212; what to do next, and after a failure</text>
  <text class="sub" x="38" y="96">plan, memory, retry, subtask decomposition</text>
  <text class="who" x="38" y="116">Agent S3 (needs a main model)</text>

  <path class="arrow" d="M 235 126 L 235 166" />

  <rect class="hero" x="20" y="166" width="430" height="80" />
  <text class="label-inv" x="38" y="196">Grounding &#8212; where on this screen</text>
  <text class="sub-inv" x="38" y="216">screenshot in, coordinate or element out</text>
  <text class="who-inv" x="38" y="236">UI-TARS (Apache-2.0 weights)</text>

  <path class="arrow" d="M 235 246 L 235 286" />

  <rect class="adj" x="20" y="286" width="430" height="80" />
  <text class="label" x="38" y="316">The machine &#8212; pixels, files, clipboard</text>
  <text class="sub" x="38" y="336">VM or container desktop, driver, fleet, bench</text>
  <text class="who" x="38" y="356">cua &#183; Bytebot (archived 7 Mar 2026)</text>

  <path class="arrow" d="M 235 366 L 235 406" />
  <rect class="box" x="20" y="406" width="430" height="60" />
  <text class="label" x="38" y="436">The application under test</text>
  <text class="sub" x="38" y="456">a real GUI with no API for what you need</text>

  <text class="ttl" x="520" y="28">Once, then never again</text>

  <rect class="box" x="520" y="46" width="360" height="100" />
  <text class="label" x="538" y="76">Record one demonstration</text>
  <text class="sub" x="538" y="96">a human does the task; the compiler mines</text>
  <text class="sub" x="538" y="114">the effect contract from the observed delta</text>
  <text class="who" x="538" y="136">OpenAdapt (MIT)</text>

  <path class="arrow" d="M 700 146 L 700 196" />

  <rect class="box" x="520" y="196" width="360" height="80" />
  <text class="label" x="538" y="226">Compiled program</text>
  <text class="sub" x="538" y="246">deterministic action sequence, per-surface</text>
  <text class="sub" x="538" y="264">evidence: DOM, accessibility, OCR, anchors</text>

  <path class="arrow" d="M 700 276 L 700 326" />

  <rect class="box" x="520" y="326" width="360" height="80" />
  <text class="label" x="538" y="356">Verify the effect, then report</text>
  <text class="sub" x="538" y="376">VERIFIED only if an independent check agrees;</text>
  <text class="sub" x="538" y="394">otherwise HALTED_BEFORE_EFFECT</text>

  <path class="arrow-d" d="M 700 406 L 700 436 L 458 436" />
  <text class="sub" x="520" y="462">no generative model in the run-time loop</text>
</svg>
