<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">What each project ships, and what it does at run time</title>
  <desc id="d">Matrix of UI-TARS, Agent S3, cua and OpenAdapt against five columns: ships weights, ships the policy, ships the machine, keeps a generative model in the run-time loop, and verifies the effect before reporting success. Only UI-TARS is strong on weights and only OpenAdapt on effect verification.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .col   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .row   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .c-no  { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; }
    .c-mid { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .c-yes { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .v     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .v-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .lg    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .8; }
    .div   { stroke: var(--border-soft); stroke-width: 1; }
  </style>

  <text class="ttl" x="20" y="28">What ships, and what runs</text>

  <text class="col" x="280" y="68">Model</text><text class="col" x="280" y="82">weights</text>
  <text class="col" x="400" y="68">The</text><text class="col" x="400" y="82">policy</text>
  <text class="col" x="520" y="68">The</text><text class="col" x="520" y="82">machine</text>
  <text class="col" x="650" y="68">Model in the</text><text class="col" x="650" y="82">run-time loop</text>
  <text class="col" x="790" y="68">Verifies the</text><text class="col" x="790" y="82">effect</text>
  <line class="div" x1="20" y1="92" x2="880" y2="92" />

  <text class="row" x="20" y="126">UI-TARS</text>
  <rect class="c-yes" x="225" y="102" width="110" height="38" /><text class="v-inv" x="280" y="126">Apache-2.0</text>
  <rect class="c-no"  x="345" y="102" width="110" height="38" /><text class="v" x="400" y="126">No</text>
  <rect class="c-no"  x="465" y="102" width="110" height="38" /><text class="v" x="520" y="126">App shell only</text>
  <rect class="c-yes" x="585" y="102" width="130" height="38" /><text class="v-inv" x="650" y="126">Every step</text>
  <rect class="c-no"  x="725" y="102" width="130" height="38" /><text class="v" x="790" y="126">No</text>

  <text class="row" x="20" y="186">Agent S3</text>
  <rect class="c-no"  x="225" y="162" width="110" height="38" /><text class="v" x="280" y="186">No</text>
  <rect class="c-yes" x="345" y="162" width="110" height="38" /><text class="v-inv" x="400" y="186">Apache-2.0</text>
  <rect class="c-no"  x="465" y="162" width="110" height="38" /><text class="v" x="520" y="186">No</text>
  <rect class="c-yes" x="585" y="162" width="130" height="38" /><text class="v-inv" x="650" y="186">Two models</text>
  <rect class="c-no"  x="725" y="162" width="130" height="38" /><text class="v" x="790" y="186">No</text>

  <text class="row" x="20" y="246">cua</text>
  <rect class="c-mid" x="225" y="222" width="110" height="38" /><text class="v" x="280" y="246">CUA-S1 only</text>
  <rect class="c-no"  x="345" y="222" width="110" height="38" /><text class="v" x="400" y="246">No</text>
  <rect class="c-yes" x="465" y="222" width="110" height="38" /><text class="v-inv" x="520" y="246">Fleet + bench</text>
  <rect class="c-mid" x="585" y="222" width="130" height="38" /><text class="v" x="650" y="246">Whatever you add</text>
  <rect class="c-no"  x="725" y="222" width="130" height="38" /><text class="v" x="790" y="246">No</text>

  <text class="row" x="20" y="306">OpenAdapt</text>
  <rect class="c-no"  x="225" y="282" width="110" height="38" /><text class="v" x="280" y="306">No</text>
  <rect class="c-mid" x="345" y="282" width="110" height="38" /><text class="v" x="400" y="306">Compiled</text>
  <rect class="c-no"  x="465" y="282" width="110" height="38" /><text class="v" x="520" y="306">No</text>
  <rect class="c-no"  x="585" y="282" width="130" height="38" /><text class="v" x="650" y="306">None</text>
  <rect class="c-yes" x="725" y="282" width="130" height="38" /><text class="v-inv" x="790" y="306">Effect contract</text>
</svg>
