<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">A Google-managed remote browser compared with the agent running in the user's own Chrome profile</title>
  <desc id="d">Two stacks side by side. On the left, the agent drives a Google-managed remote browser with a fresh profile and no cookie jar, so the authority it holds is limited to whatever the user explicitly signed into, and it reaches the target site as an anonymous visitor. On the right, the agent drives the user's own desktop Chrome, so the authority it holds is every logged-in session plus the saved passwords, and it reaches the target site as the user. A single gate on that path is labelled payments only.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pane   { fill: none; stroke: var(--ink); stroke-width: 1.25; opacity: .35; rx: 10; ry: 10; stroke-dasharray: 5 5; }
    .gate   { fill: var(--paper); stroke: var(--ink); stroke-width: 1.25; rx: 4; ry: 4; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="pane" x="20" y="20" width="418" height="460" />
  <text class="head" x="42" y="50">Before — a browser Google ran</text>

  <rect class="box" x="42" y="70" width="374" height="42" />
  <text class="label" x="60" y="97">Gemini Spark</text>

  <path class="arrow" d="M 229 114 L 229 136" />

  <rect class="box" x="42" y="138" width="374" height="62" />
  <text class="label" x="60" y="163">Google-managed remote browser</text>
  <text class="sub" x="60" y="184">fresh profile · no cookie jar · no password store</text>

  <path class="arrow" d="M 229 202 L 229 224" />

  <rect class="adj" x="42" y="226" width="374" height="62" />
  <text class="tag" x="60" y="248">AUTHORITY HELD</text>
  <text class="label" x="60" y="272">only what you explicitly signed into</text>

  <path class="arrow" d="M 229 290 L 229 336" />

  <rect class="box" x="42" y="338" width="374" height="46" />
  <text class="label" x="60" y="367">Target site — as an anonymous visitor</text>

  <text class="sub" x="42" y="420">Blast radius of a persuaded agent: the one site</text>
  <text class="sub" x="42" y="440">you deliberately handed it, for the length of</text>
  <text class="sub" x="42" y="460">that session.</text>

  <rect class="pane" x="462" y="20" width="418" height="460" />
  <text class="head" x="484" y="50">Now — the Chrome you are logged into</text>

  <rect class="box" x="484" y="70" width="374" height="42" />
  <text class="label" x="502" y="97">Gemini Spark</text>

  <path class="arrow" d="M 671 114 L 671 136" />

  <rect class="box" x="484" y="138" width="374" height="62" />
  <text class="label" x="502" y="163">Your desktop Chrome</text>
  <text class="sub" x="502" y="184">live profile · your cookie jar · saved passwords</text>

  <path class="arrow" d="M 671 202 L 671 224" />

  <rect class="hero" x="484" y="226" width="374" height="62" />
  <text class="tag" x="502" y="248" fill="var(--paper)" opacity=".85">AUTHORITY HELD</text>
  <text class="label-inv" x="502" y="272">every logged-in session, plus the password store</text>

  <path class="arrow" d="M 671 290 L 671 306" />

  <rect class="gate" x="560" y="308" width="222" height="28" />
  <text class="sub" x="576" y="327">Handback gate — payments only</text>

  <path class="arrow" d="M 671 338 L 671 356" />

  <rect class="box" x="484" y="358" width="374" height="46" />
  <text class="label" x="502" y="387">Target site — as you</text>

  <text class="sub" x="484" y="432">Blast radius of a persuaded agent: everything</text>
  <text class="sub" x="484" y="452">that cookie jar authenticates, which nobody</text>
  <text class="sub" x="484" y="472">has ever written down.</text>
</svg>
