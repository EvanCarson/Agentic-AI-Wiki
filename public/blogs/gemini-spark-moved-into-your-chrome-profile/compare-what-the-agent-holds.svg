<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What the agent holds under three credential arrangements</title>
  <desc id="d">Three columns. A remote managed browser holds no cookie jar and only what the user explicitly signed into, so the blast radius is one site. The user's own Chrome profile holds every logged-in session, the saved password store, extensions and history, so the blast radius is the user's whole identity. A per-task scoped credential holds one token for one site that expires with the task, so the blast radius is one grant.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
  </style>

  <rect class="box" x="24" y="36" width="266" height="212" />
  <text class="head" x="44" y="66">Remote managed browser</text>
  <text class="sub" x="44" y="100">no cookie jar</text>
  <text class="sub" x="44" y="124">only what you signed into</text>
  <text class="sub" x="44" y="148">no password store</text>
  <line x1="44" y1="172" x2="270" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="44" y="196">BLAST RADIUS</text>
  <text class="label" x="44" y="220">one site, one session</text>

  <rect class="hero" x="314" y="36" width="266" height="212" />
  <text class="head-inv" x="334" y="66">Your Chrome profile</text>
  <text class="sub-inv" x="334" y="100">every logged-in session</text>
  <text class="sub-inv" x="334" y="124">the saved password store</text>
  <text class="sub-inv" x="334" y="148">extensions, history, tabs</text>
  <line x1="334" y1="172" x2="560" y2="172" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag" x="334" y="196" fill="var(--paper)" opacity=".85">BLAST RADIUS</text>
  <text class="label-inv" x="334" y="220">your identity, unenumerated</text>

  <rect class="adj" x="604" y="36" width="266" height="212" />
  <text class="head" x="624" y="66">Per-task scoped credential</text>
  <text class="sub" x="624" y="100">one token, one site</text>
  <text class="sub" x="624" y="124">expires with the task</text>
  <text class="sub" x="624" y="148">its own name in the log</text>
  <line x1="624" y1="172" x2="850" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="624" y="196">BLAST RADIUS</text>
  <text class="label" x="624" y="220">one grant</text>
</svg>
