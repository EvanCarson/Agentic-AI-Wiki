<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Actions an agent inside your browser profile can take, scored on four protections</title>
  <desc id="d">Six rows of action classes against four columns: whether the action is reversible, whether the payment handback gates it, whether an audit log can tell the agent apart from the user, and whether the authority is bounded by scope. Making a card payment scores medium to strong across the board. Reading mail, exporting data off-site, changing a recovery address, granting an OAuth scope and sending a message as the user score weak on almost every column.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .lvl    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .lvl-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .rowlab { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .collab { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="head" x="24" y="30">Protection by action class</text>

  <text class="collab" x="392" y="58">REVERSIBLE</text>
  <text class="collab" x="522" y="58">GATED</text>
  <text class="collab" x="652" y="58">ATTRIBUTABLE</text>
  <text class="collab" x="782" y="58">SCOPED</text>

  <text class="rowlab" x="24" y="90">Make a card payment</text>
  <rect class="med"    x="388" y="70" width="120" height="30" />
  <text class="lvl"    x="402" y="90">Medium</text>
  <rect class="strong" x="518" y="70" width="120" height="30" />
  <text class="lvl-inv" x="532" y="90">Strong</text>
  <rect class="med"    x="648" y="70" width="120" height="30" />
  <text class="lvl"    x="662" y="90">Medium</text>
  <rect class="med"    x="778" y="70" width="112" height="30" />
  <text class="lvl"    x="792" y="90">Medium</text>

  <text class="rowlab" x="24" y="138">Read the mailbox and documents</text>
  <rect class="weak"   x="388" y="118" width="120" height="30" />
  <text class="lvl"    x="402" y="138">Weak</text>
  <rect class="weak"   x="518" y="118" width="120" height="30" />
  <text class="lvl"    x="532" y="138">Weak</text>
  <rect class="weak"   x="648" y="118" width="120" height="30" />
  <text class="lvl"    x="662" y="138">Weak</text>
  <rect class="weak"   x="778" y="118" width="112" height="30" />
  <text class="lvl"    x="792" y="138">Weak</text>

  <text class="rowlab" x="24" y="186">Copy data to an off-site destination</text>
  <rect class="weak"   x="388" y="166" width="120" height="30" />
  <text class="lvl"    x="402" y="186">Weak</text>
  <rect class="weak"   x="518" y="166" width="120" height="30" />
  <text class="lvl"    x="532" y="186">Weak</text>
  <rect class="weak"   x="648" y="166" width="120" height="30" />
  <text class="lvl"    x="662" y="186">Weak</text>
  <rect class="weak"   x="778" y="166" width="112" height="30" />
  <text class="lvl"    x="792" y="186">Weak</text>

  <text class="rowlab" x="24" y="234">Change a recovery email or phone</text>
  <rect class="weak"   x="388" y="214" width="120" height="30" />
  <text class="lvl"    x="402" y="234">Weak</text>
  <rect class="weak"   x="518" y="214" width="120" height="30" />
  <text class="lvl"    x="532" y="234">Weak</text>
  <rect class="weak"   x="648" y="214" width="120" height="30" />
  <text class="lvl"    x="662" y="234">Weak</text>
  <rect class="weak"   x="778" y="214" width="112" height="30" />
  <text class="lvl"    x="792" y="234">Weak</text>

  <text class="rowlab" x="24" y="282">Grant a third-party OAuth scope</text>
  <rect class="med"    x="388" y="262" width="120" height="30" />
  <text class="lvl"    x="402" y="282">Medium</text>
  <rect class="weak"   x="518" y="262" width="120" height="30" />
  <text class="lvl"    x="532" y="282">Weak</text>
  <rect class="med"    x="648" y="262" width="120" height="30" />
  <text class="lvl"    x="662" y="282">Medium</text>
  <rect class="weak"   x="778" y="262" width="112" height="30" />
  <text class="lvl"    x="792" y="282">Weak</text>

  <text class="rowlab" x="24" y="330">Send a message as you</text>
  <rect class="weak"   x="388" y="310" width="120" height="30" />
  <text class="lvl"    x="402" y="330">Weak</text>
  <rect class="weak"   x="518" y="310" width="120" height="30" />
  <text class="lvl"    x="532" y="330">Weak</text>
  <rect class="weak"   x="648" y="310" width="120" height="30" />
  <text class="lvl"    x="662" y="330">Weak</text>
  <rect class="weak"   x="778" y="310" width="112" height="30" />
  <text class="lvl"    x="792" y="330">Weak</text>

  <rect class="strong" x="388" y="360" width="16" height="14" />
  <text class="sub" x="412" y="372">Strong</text>
  <rect class="med" x="490" y="360" width="16" height="14" />
  <text class="sub" x="514" y="372">Medium</text>
  <rect class="weak" x="600" y="360" width="16" height="14" />
  <text class="sub" x="624" y="372">Weak</text>
</svg>
