<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Programme clock against agent clock</title>
  <desc id="d">Three columns. The insider-risk programme takes about fifteen hours to detect and respond. An agent trajectory completes its actions in minutes, with sixteen minutes measured from network compromise to industrial control action in a lab test. Only controls evaluated before the action close the gap between the two.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="20" y="28">The control is on the wrong side of the action</text>

  <text class="lbl" x="20" y="96">Elapsed</text>
  <text class="lbl" x="20" y="206">Result</text>

  <rect class="box" x="96" y="52" width="180" height="92" />
  <text class="hd" x="186" y="82">Programme clock</text>
  <text class="vd" x="186" y="108">~7 h detect</text>
  <text class="vd" x="186" y="128">~8 h respond</text>

  <rect class="hero" x="360" y="52" width="180" height="92" />
  <text class="hd-inv" x="450" y="82">Agent clock</text>
  <text class="vd-inv" x="450" y="108">minutes per trajectory</text>
  <text class="vd-inv" x="450" y="128">16 min lab: net to ICS</text>

  <rect class="adj" x="660" y="52" width="180" height="92" />
  <text class="hd" x="750" y="82">Gate clock</text>
  <text class="vd" x="750" y="108">policy check before</text>
  <text class="vd" x="750" y="128">each action: ms</text>

  <rect class="box" x="96" y="162" width="180" height="96" />
  <text class="vd" x="186" y="192">fits a human insider:</text>
  <text class="vd" x="186" y="214">damage still</text>
  <text class="vd" x="186" y="236">accumulating</text>

  <rect class="box" x="360" y="162" width="180" height="96" />
  <text class="vd" x="450" y="192">incident over before</text>
  <text class="vd" x="450" y="214">the first alert:</text>
  <text class="vd" x="450" y="236">detection is reporting</text>

  <rect class="box" x="660" y="162" width="180" height="96" />
  <text class="vd" x="750" y="192">denies out-of-envelope</text>
  <text class="vd" x="750" y="214">actions outright:</text>
  <text class="vd" x="750" y="236">no clock to lose</text>
</svg>
