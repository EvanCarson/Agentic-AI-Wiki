<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Detect-and-respond compared with a pre-action policy gate</title>
  <desc id="d">Two chains. In the upper chain the agent acts, the action is logged, a detector fires and an analyst contains the incident, with about fifteen hours elapsed end to end. In the lower chain a policy gate evaluates every action against a machine-checkable envelope before it executes, denying anything outside it, with the decision taken in milliseconds.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); text-anchor: middle; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .row    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .75; }
    .clock  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--accent, #d4421e); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .dash   { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 4 4; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="30">Same controls, either side of the action</text>

  <text class="row" x="20" y="72">After the action</text>
  <rect class="box" x="20" y="92" width="130" height="62" />
  <text class="label" x="85" y="118">Agent</text>
  <text class="sub" x="85" y="136">holds real creds</text>
  <path class="arrow" d="M 154 123 L 196 123" />
  <rect class="hero" x="200" y="92" width="130" height="62" />
  <text class="label-inv" x="265" y="118">Action</text>
  <text class="sub" x="265" y="136" style="fill: var(--paper); opacity: .8;">executes</text>
  <path class="arrow" d="M 334 123 L 376 123" />
  <rect class="box" x="380" y="92" width="120" height="62" />
  <text class="label" x="440" y="118">Log</text>
  <text class="sub" x="440" y="136">trace written</text>
  <path class="arrow" d="M 504 123 L 546 123" />
  <rect class="box" x="550" y="92" width="130" height="62" />
  <text class="label" x="615" y="118">Detector</text>
  <text class="sub" x="615" y="136">~7 h to fire</text>
  <path class="arrow" d="M 684 123 L 726 123" />
  <rect class="box" x="730" y="92" width="150" height="62" />
  <text class="label" x="805" y="118">Containment</text>
  <text class="sub" x="805" y="136">~8 h to act</text>

  <text class="clock" x="20" y="190">~15 h elapsed — the action was never in question, only its discovery</text>

  <line x1="20" y1="222" x2="880" y2="222" stroke="var(--border-soft)" stroke-width="1" />

  <text class="row" x="20" y="268">Before the action</text>
  <rect class="box" x="20" y="288" width="130" height="62" />
  <text class="label" x="85" y="314">Agent</text>
  <text class="sub" x="85" y="332">proposes action</text>
  <path class="arrow" d="M 154 319 L 196 319" />
  <rect class="adj" x="200" y="288" width="160" height="62" />
  <text class="label" x="280" y="314">Policy gate</text>
  <text class="sub" x="280" y="332">envelope, scope, budget</text>
  <path class="arrow" d="M 364 319 L 406 319" />
  <rect class="hero" x="410" y="288" width="130" height="62" />
  <text class="label-inv" x="475" y="314">Action</text>
  <text class="sub" x="475" y="332" style="fill: var(--paper); opacity: .8;">executes, in scope</text>
  <path class="arrow" d="M 544 319 L 586 319" />
  <rect class="box" x="590" y="288" width="120" height="62" />
  <text class="label" x="650" y="314">Log</text>
  <text class="sub" x="650" y="332">receipt + run id</text>

  <path class="dash" d="M 280 356 L 280 410" />
  <rect class="box" x="190" y="414" width="180" height="56" />
  <text class="label" x="280" y="438">Denied</text>
  <text class="sub" x="280" y="456">out of envelope, logged</text>

  <path class="dash" d="M 714 319 L 756 319" />
  <rect class="box" x="760" y="288" width="120" height="62" />
  <text class="label" x="820" y="314">Detector</text>
  <text class="sub" x="820" y="332">scope, not defence</text>

  <text class="clock" x="20" y="490">Decision in milliseconds — the detector keeps its job, and stops being the only one</text>
</svg>
