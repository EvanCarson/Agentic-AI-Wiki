<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Insider-related incidents by cause, 587 reporting organisations</title>
  <desc id="d">Horizontal bar chart. Accidental actions by trusted users account for 43 percent of insider-related incidents, deliberate human misuse 29 percent, and AI or autonomous systems 28 percent.</desc>
  <style>
    .ai    { fill: var(--accent, #d4421e); }
    .human { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .acc   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .cat   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .val   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; fill: var(--ink); }
    .val-a { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; fill: var(--accent, #d4421e); }
    .grid  { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .axis  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .5; }
  </style>

  <text class="ttl" x="20" y="34">Share of insider-related incidents, by cause (%)</text>

  <line class="grid" x1="400" y1="58" x2="400" y2="310" />
  <line class="grid" x1="560" y1="58" x2="560" y2="310" />
  <line class="grid" x1="720" y1="58" x2="720" y2="310" />
  <text class="axis" x="400" y="332" text-anchor="middle">20</text>
  <text class="axis" x="560" y="332" text-anchor="middle">40</text>
  <text class="axis" x="720" y="332" text-anchor="middle">60</text>

  <text class="cat" x="20" y="88">Accidental actions</text>
  <text class="sub" x="20" y="106">by trusted users</text>
  <rect class="acc" x="240" y="72" width="344" height="40" rx="3" />
  <text class="val" x="596" y="98">43%</text>

  <text class="cat" x="20" y="172">Deliberate misuse</text>
  <text class="sub" x="20" y="190">by humans</text>
  <rect class="human" x="240" y="156" width="232" height="40" rx="3" />
  <text class="val" x="484" y="182">29%</text>

  <text class="cat" x="20" y="256">AI or autonomous</text>
  <text class="sub" x="20" y="274">systems</text>
  <rect class="ai" x="240" y="240" width="224" height="40" rx="3" />
  <text class="val-a" x="476" y="266">28%</text>

  <text class="sub" x="20" y="372">Trellix / Vanson Bourne, 600 CISOs surveyed August–September 2026; split across the 587 that reported an incident.</text>
</svg>
