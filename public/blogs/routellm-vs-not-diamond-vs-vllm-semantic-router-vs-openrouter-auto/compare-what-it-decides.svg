<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="wdT wdD">
  <title id="wdT">The three questions these routers actually ask</title>
  <desc id="wdD">Three columns. Is this hard: a tunable strong-versus-weak threshold, one dial you can explain, but you must choose the model pair yourself. Which model suits this query: a learned preference across a broad catalogue, wide coverage, with a decision you cannot reconstruct afterwards. How much computation does this deserve: an effort and intent classifier that can disable reasoning entirely, which is the axis that dominates spend on reasoning-model traffic.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Three routers, three different questions</text>

  <rect class="box" x="0" y="40" width="286" height="196" />
  <text class="hd" x="143" y="70" text-anchor="middle">"Is this hard?"</text>
  <text class="cell" x="143" y="98" text-anchor="middle">RouteLLM</text>
  <text class="cell" x="143" y="126" text-anchor="middle">A tunable strong/weak</text>
  <text class="cell" x="143" y="144" text-anchor="middle">threshold. One dial.</text>
  <text class="cell" x="143" y="176" text-anchor="middle">You pick the model pair,</text>
  <text class="cell" x="143" y="194" text-anchor="middle">and you own retraining.</text>
  <text class="cell" x="143" y="220" text-anchor="middle">Explainable to finance.</text>

  <rect class="adj" x="306" y="40" width="286" height="196" />
  <text class="hd" x="449" y="70" text-anchor="middle">"Which model suits this?"</text>
  <text class="cell" x="449" y="98" text-anchor="middle">Not Diamond / Auto Router</text>
  <text class="cell" x="449" y="126" text-anchor="middle">A learned preference over</text>
  <text class="cell" x="449" y="144" text-anchor="middle">a broad catalogue.</text>
  <text class="cell" x="449" y="176" text-anchor="middle">Coverage bought at the</text>
  <text class="cell" x="449" y="194" text-anchor="middle">price of an opaque call.</text>
  <text class="cell" x="449" y="220" text-anchor="middle">Hard to reconstruct later.</text>

  <rect class="hero" x="612" y="40" width="286" height="196" />
  <text class="hd-inv" x="755" y="70" text-anchor="middle">"How much compute?"</text>
  <text class="cell-inv" x="755" y="98" text-anchor="middle">vLLM Semantic Router</text>
  <text class="cell-inv" x="755" y="126" text-anchor="middle">Intent and complexity —</text>
  <text class="cell-inv" x="755" y="144" text-anchor="middle">and reasoning on or off.</text>
  <text class="cell-inv" x="755" y="176" text-anchor="middle">On reasoning traffic this</text>
  <text class="cell-inv" x="755" y="194" text-anchor="middle">spread beats vendor price.</text>
  <text class="cell-inv" x="755" y="220" text-anchor="middle">Accuracy can rise as tokens fall.</text>

  <text class="sub" x="0" y="268">The first two compete on the same axis. The third competes on the axis agent bills are actually built from.</text>
  <text class="sub" x="0" y="290">Pick the question before the product: a uniform-difficulty workload needs none of the three.</text>
</svg>
