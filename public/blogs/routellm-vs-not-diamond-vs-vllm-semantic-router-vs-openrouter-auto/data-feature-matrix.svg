<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmT fmD">
  <title id="fmT">Feature matrix for four model routers</title>
  <desc id="fmD">Rows are RouteLLM, Not Diamond, OpenRouter Auto Router and vLLM Semantic Router. Columns are self-hosted, ships an eval harness, breadth across external providers, control over reasoning effort, and whether an extra network hop is added. RouteLLM is strong on self-hosting and evaluation, weak on provider breadth. Not Diamond and Auto Router are strong on breadth and weak on self-hosting and evaluation; Auto Router adds no extra hop because it lives in the gateway. vLLM Semantic Router is strong on self-hosting and reasoning control and weak on external providers.</desc>
  <style>
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .85; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .weak   { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; rx: 6; ry: 6; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .strong { fill: var(--accent, #d4421e); stroke: none; rx: 6; ry: 6; }
  </style>

  <text class="ttl" x="0" y="20">Where each router is strong</text>

  <text class="hd" x="196" y="52" text-anchor="middle">Self-hosted</text>
  <text class="hd" x="342" y="52" text-anchor="middle">Eval harness</text>
  <text class="hd" x="488" y="52" text-anchor="middle">Provider breadth</text>
  <text class="hd" x="634" y="52" text-anchor="middle">Effort control</text>
  <text class="hd" x="780" y="52" text-anchor="middle">Extra hop</text>

  <text class="row" x="0" y="88">RouteLLM</text>
  <rect class="strong" x="130" y="66" width="132" height="34" />
  <text class="cell-inv" x="196" y="88" text-anchor="middle">Strong</text>
  <rect class="strong" x="276" y="66" width="132" height="34" />
  <text class="cell-inv" x="342" y="88" text-anchor="middle">Strong</text>
  <rect class="weak" x="422" y="66" width="132" height="34" />
  <text class="cell" x="488" y="88" text-anchor="middle">Weak — a pair</text>
  <rect class="weak" x="568" y="66" width="132" height="34" />
  <text class="cell" x="634" y="88" text-anchor="middle">Weak</text>
  <rect class="strong" x="714" y="66" width="132" height="34" />
  <text class="cell-inv" x="780" y="88" text-anchor="middle">None</text>

  <text class="row" x="0" y="140">Not Diamond</text>
  <rect class="weak" x="130" y="118" width="132" height="34" />
  <text class="cell" x="196" y="140" text-anchor="middle">Weak — hosted</text>
  <rect class="weak" x="276" y="118" width="132" height="34" />
  <text class="cell" x="342" y="140" text-anchor="middle">Weak</text>
  <rect class="strong" x="422" y="118" width="132" height="34" />
  <text class="cell-inv" x="488" y="140" text-anchor="middle">Strong</text>
  <rect class="weak" x="568" y="118" width="132" height="34" />
  <text class="cell" x="634" y="140" text-anchor="middle">Weak</text>
  <rect class="weak" x="714" y="118" width="132" height="34" />
  <text class="cell" x="780" y="140" text-anchor="middle">One round trip</text>

  <text class="row" x="0" y="192">Auto Router</text>
  <rect class="weak" x="130" y="170" width="132" height="34" />
  <text class="cell" x="196" y="192" text-anchor="middle">Weak — hosted</text>
  <rect class="weak" x="276" y="170" width="132" height="34" />
  <text class="cell" x="342" y="192" text-anchor="middle">Weak</text>
  <rect class="strong" x="422" y="170" width="132" height="34" />
  <text class="cell-inv" x="488" y="192" text-anchor="middle">Strong</text>
  <rect class="weak" x="568" y="170" width="132" height="34" />
  <text class="cell" x="634" y="192" text-anchor="middle">Weak</text>
  <rect class="med" x="714" y="170" width="132" height="34" />
  <text class="cell" x="780" y="192" text-anchor="middle">In the gateway</text>

  <text class="row" x="0" y="244">Semantic Router</text>
  <rect class="strong" x="130" y="222" width="132" height="34" />
  <text class="cell-inv" x="196" y="244" text-anchor="middle">Strong</text>
  <rect class="med" x="276" y="222" width="132" height="34" />
  <text class="cell" x="342" y="244" text-anchor="middle">Medium</text>
  <rect class="weak" x="422" y="222" width="132" height="34" />
  <text class="cell" x="488" y="244" text-anchor="middle">Weak — local</text>
  <rect class="strong" x="568" y="222" width="132" height="34" />
  <text class="cell-inv" x="634" y="244" text-anchor="middle">Strong</text>
  <rect class="med" x="714" y="222" width="132" height="34" />
  <text class="cell" x="780" y="244" text-anchor="middle">In-path filter</text>

  <rect class="strong" x="0" y="284" width="20" height="14" />
  <text class="sub" x="28" y="296">Strong</text>
  <rect class="med" x="96" y="284" width="20" height="14" />
  <text class="sub" x="124" y="296">Medium</text>
  <rect class="weak" x="196" y="284" width="20" height="14" />
  <text class="sub" x="224" y="296">Weak</text>

  <text class="sub" x="0" y="334">No row is strong everywhere, and the two hosted rows share one decision engine.</text>
  <text class="sub" x="0" y="356">Effort control is the column that matters most on reasoning-model traffic, and only one row has it.</text>
  <text class="sub" x="0" y="378">Provider breadth is the column that matters least if you self-host open weights.</text>
</svg>
