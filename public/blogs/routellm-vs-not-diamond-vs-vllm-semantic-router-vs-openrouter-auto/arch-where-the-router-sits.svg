<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="rsT rsD">
  <title id="rsT">Three placements for a model router on the request path</title>
  <desc id="rsD">A request leaves the application and reaches a model. Three placements are shown. In-process: a RouteLLM classifier runs inside the application and picks a strong or weak model before any network call is made. At the proxy: an Envoy external processor in your own serving stack classifies intent and complexity, may disable reasoning mode, and forwards to a local backend. Hosted: the application calls a routing service, or calls a gateway whose auto endpoint calls that same service, and a model choice comes back before the provider call. A note records that OpenRouter Auto and Not Diamond resolve to the same decision engine.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .7; }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .8; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .9; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#rsArr); }
    .dash   { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; opacity: .55; marker-end: url(#rsArr); }
  </style>
  <defs>
    <marker id="rsArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="20">Three places the routing decision can live</text>

  <text class="lane" x="0" y="54">In your process</text>
  <rect class="adj" x="0" y="68" width="250" height="78" />
  <text class="hd" x="125" y="96" text-anchor="middle">RouteLLM</text>
  <text class="cell" x="125" y="116" text-anchor="middle">Strong or weak, on a</text>
  <text class="cell" x="125" y="132" text-anchor="middle">threshold you tune.</text>
  <path class="arrow" d="M 255 107 L 300 107" />
  <rect class="box" x="305" y="68" width="200" height="78" />
  <text class="hd" x="405" y="103" text-anchor="middle">Provider call</text>
  <text class="cell" x="405" y="125" text-anchor="middle">No extra hop.</text>
  <text class="sub" x="525" y="112">Decision is local, logged, and yours to retrain.</text>

  <text class="lane" x="0" y="188">At your proxy</text>
  <rect class="adj" x="0" y="202" width="250" height="78" />
  <text class="hd" x="125" y="230" text-anchor="middle">vLLM Semantic Router</text>
  <text class="cell" x="125" y="250" text-anchor="middle">Envoy ext_proc, ModernBERT</text>
  <text class="cell" x="125" y="266" text-anchor="middle">intent and complexity.</text>
  <path class="arrow" d="M 255 241 L 300 241" />
  <rect class="box" x="305" y="202" width="200" height="78" />
  <text class="hd" x="405" y="237" text-anchor="middle">Local backend</text>
  <text class="cell" x="405" y="259" text-anchor="middle">Reasoning on or off.</text>

  <text class="lane" x="0" y="322">Hosted</text>
  <rect class="box" x="0" y="336" width="250" height="78" />
  <text class="hd" x="125" y="364" text-anchor="middle">Your application</text>
  <text class="cell" x="125" y="386" text-anchor="middle">Asks first, then calls.</text>
  <path class="arrow" d="M 255 375 L 300 375" />
  <rect class="hero" x="305" y="336" width="250" height="78" />
  <text class="hd-inv" x="430" y="364" text-anchor="middle">Not Diamond</text>
  <text class="cell-inv" x="430" y="386" text-anchor="middle">Per-query model preference.</text>
  <path class="arrow" d="M 560 375 L 605 375" />
  <rect class="box" x="610" y="336" width="288" height="78" />
  <text class="hd" x="754" y="364" text-anchor="middle">Provider call</text>
  <text class="cell" x="754" y="386" text-anchor="middle">Plus one network round trip.</text>

  <rect class="box" x="610" y="202" width="288" height="78" />
  <text class="hd" x="754" y="230" text-anchor="middle">OpenRouter Auto Router</text>
  <text class="cell" x="754" y="250" text-anchor="middle">Same decision, inside the</text>
  <text class="cell" x="754" y="266" text-anchor="middle">gateway you already call.</text>
  <path class="dash" d="M 754 330 L 754 286" />

  <text class="sub" x="0" y="450">The proxy row also carries a semantic cache, a PII check and a prompt guard.</text>
  <text class="sub" x="0" y="474">Auto Router and Not Diamond resolve to one engine: adopting both is adopting one.</text>
  <text class="sub" x="0" y="496">The top two rows keep the decision inside your boundary, where it can be logged and replayed.</text>
</svg>
