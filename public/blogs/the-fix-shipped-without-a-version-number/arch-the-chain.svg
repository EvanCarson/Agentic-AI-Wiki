<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The AgentCorruption chain and the isolation boundary</title>
  <desc id="d">A prompt reaches a public-facing agent inside a Firecracker microVM, whose web-request tool queries the instance metadata service and returns the agent's execution-role credentials. Those credentials, held outside the isolation boundary in effect, reach four surfaces: invoking other agents, reading private conversations, pulling container images, and reading AWS Secrets Manager.</desc>
  <style>
    .box     { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj     { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero    { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .bound   { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 6 5; opacity: .7; rx: 10; ry: 10; }
    .hd      { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .ln      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .ln-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; text-anchor: middle; }
    .ttl     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .tag     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .arrow   { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="28">One prompt, four reachable surfaces</text>

  <rect class="bound" x="20" y="48" width="520" height="160" />
  <text class="tag" x="32" y="68">Firecracker microVM &#8212; session isolation held at every step</text>

  <rect class="hero" x="36" y="82" width="148" height="110" />
  <text class="hd-inv" x="110" y="124">Public-facing</text>
  <text class="hd-inv" x="110" y="142">agent</text>
  <text class="ln-inv" x="110" y="168">reachable by anyone</text>

  <rect class="adj" x="208" y="82" width="148" height="110" />
  <text class="hd" x="282" y="124">Web-request</text>
  <text class="hd" x="282" y="142">tool</text>
  <text class="ln" x="282" y="168">an ordinary capability</text>

  <rect class="box" x="380" y="82" width="142" height="110" />
  <text class="hd" x="451" y="118">Instance</text>
  <text class="hd" x="451" y="136">metadata</text>
  <text class="hd" x="451" y="154">service</text>

  <path class="arrow" d="M 190 137 L 202 137" />
  <path class="arrow" d="M 362 137 L 374 137" />

  <rect class="hero" x="596" y="82" width="278" height="110" />
  <text class="hd-inv" x="735" y="124">Execution-role</text>
  <text class="hd-inv" x="735" y="142">credentials</text>
  <text class="ln-inv" x="735" y="168">scoped to account and region</text>

  <path class="arrow" d="M 528 137 L 590 137" />

  <rect class="box" x="25" y="296" width="195" height="104" />
  <text class="hd" x="122" y="334">Invoke other</text>
  <text class="hd" x="122" y="352">agents</text>
  <text class="ln" x="122" y="378">any agent in the region</text>

  <rect class="box" x="243" y="296" width="195" height="104" />
  <text class="hd" x="340" y="334">Read private</text>
  <text class="hd" x="340" y="352">conversations</text>
  <text class="ln" x="340" y="378">other tenants of the account</text>

  <rect class="box" x="461" y="296" width="195" height="104" />
  <text class="hd" x="558" y="334">Pull container</text>
  <text class="hd" x="558" y="352">images</text>
  <text class="ln" x="558" y="378">the agents&#8217; own code</text>

  <rect class="adj" x="679" y="296" width="195" height="104" />
  <text class="hd" x="776" y="334">Read Secrets</text>
  <text class="hd" x="776" y="352">Manager</text>
  <text class="ln" x="776" y="378">credentials for everything else</text>

  <path class="arrow" d="M 700 198 L 160 290" />
  <path class="arrow" d="M 718 198 L 348 290" />
  <path class="arrow" d="M 752 198 L 562 290" />
  <path class="arrow" d="M 770 198 L 778 290" />

  <text class="tag" x="25" y="438">No step in the chain required escaping the microVM.</text>
  <text class="tag" x="25" y="462">The boundary that failed was the one drawn around the credential, not the one drawn around the compute.</text>
</svg>
