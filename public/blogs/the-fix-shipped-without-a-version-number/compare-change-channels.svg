<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What each change channel would have told you</title>
  <desc id="d">Three columns comparing a vulnerability feed, vendor release notes, and the runtime's own default IAM role as sources of notice that a customer's blast radius had changed. Only the third carried the answer, and only to someone who went and measured it.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .ln     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .ln-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; text-anchor: middle; }
    .vd     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
  </style>

  <text class="ttl" x="20" y="30">Three places a customer could have looked</text>

  <rect class="box" x="30" y="55" width="260" height="190" />
  <text class="hd" x="160" y="88">Vulnerability feed</text>
  <text class="ln" x="160" y="118">No identifier was issued,</text>
  <text class="ln" x="160" y="136">because a grant is not</text>
  <text class="ln" x="160" y="154">a software defect</text>
  <text class="vd" x="160" y="200">Notice given:</text>
  <text class="vd" x="160" y="220">none</text>

  <rect class="box" x="320" y="55" width="260" height="190" />
  <text class="hd" x="450" y="88">Vendor release notes</text>
  <text class="ln" x="450" y="118">A default role is not</text>
  <text class="ln" x="450" y="136">versioned, so there was</text>
  <text class="ln" x="450" y="154">nothing to subscribe to</text>
  <text class="vd" x="450" y="200">Notice given:</text>
  <text class="vd" x="450" y="220">none</text>

  <rect class="hero" x="610" y="55" width="260" height="190" />
  <text class="hd-inv" x="740" y="88">The role itself</text>
  <text class="ln-inv" x="740" y="118">Readable on any day, by</text>
  <text class="ln-inv" x="740" y="136">anyone who enumerated</text>
  <text class="ln-inv" x="740" y="154">what the agent could do</text>
  <text class="vd-inv" x="740" y="200">Notice given:</text>
  <text class="vd-inv" x="740" y="220">all of it, on request</text>

  <text class="ln" x="450" y="278">The only channel that carried the answer is the one you have to poll.</text>
</svg>
