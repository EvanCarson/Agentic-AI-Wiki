<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Report to remediation, by kind of fix</title>
  <desc id="d">Two bars on one timeline from 25 December 2025 to 8 October 2026. The transport-level fix, IMDSv2-only for newly deployed agents, took 51 days. The permission-level fix, narrowing the default execution role, was first observed 278 days after the report.</desc>
  <style>
    .barA   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .barB   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .axis   { fill: none; stroke: var(--ink); stroke-width: 1.25; opacity: .8; }
    .grid   { fill: none; stroke: var(--ink); stroke-width: 1; opacity: .22; stroke-dasharray: 3 4; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .lbl-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .num    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .num-inv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); }
    .tick   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; text-anchor: middle; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="20" y="30">Days from report to observed fix</text>

  <line class="grid" x1="217" y1="70" x2="217" y2="276" />
  <line class="grid" x1="826" y1="70" x2="826" y2="276" />

  <text class="lbl" x="80" y="100">Transport: IMDSv2-only for newly deployed agents</text>
  <rect class="barA" x="80" y="112" width="137" height="44" />
  <text class="num" x="229" y="140">51 days</text>

  <text class="lbl" x="80" y="190">Permissions: default execution role narrowed</text>
  <rect class="barB" x="80" y="202" width="746" height="44" />
  <text class="num-inv" x="96" y="230">278 days</text>

  <line class="axis" x1="80" y1="276" x2="860" y2="276" />
  <line class="axis" x1="80" y1="276" x2="80" y2="284" />
  <line class="axis" x1="217" y1="276" x2="217" y2="284" />
  <line class="axis" x1="826" y1="276" x2="826" y2="284" />
  <line class="axis" x1="850" y1="276" x2="850" y2="284" />

  <text class="tick" x="80" y="302">25 Dec 2025</text>
  <text class="tick" x="80" y="318">reported</text>
  <text class="tick" x="217" y="302">14 Feb 2026</text>
  <text class="tick" x="826" y="302">29 Sep 2026</text>
  <text class="tick" x="826" y="318">observed</text>

  <text class="note" x="20" y="354">Rollout date of the permission change was not confirmed; 29 September 2026 is when it was observed, days before publication.</text>
  <text class="note" x="20" y="374">No CVE identifier was issued for any part of the chain.</text>
</svg>
