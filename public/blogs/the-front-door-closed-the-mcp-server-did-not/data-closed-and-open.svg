<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">What five gatekeepers closed and what they left open</title>
  <desc id="d">A grid of five gatekeepers against two columns. All five closed the same door: an agent arriving with the user's own credentials, or unlicensed access. Only Yelp and Schwab have stated what remains open — licensed agents by contract, and read-only access through Schwab's own MCP servers.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
  </style>

  <text class="ttl" x="20" y="28">Everyone closed the credential door. Two have said what the other door is.</text>

  <text class="hd" x="345" y="62">What closed</text>
  <text class="hd" x="690" y="62">What stayed open</text>

  <text class="lbl" x="20" y="108">Amazon</text>
  <rect class="adj" x="180" y="76" width="330" height="54" />
  <text class="vd" x="345" y="108">Muse on the retail site, 20 Sep</text>
  <rect class="box" x="525" y="76" width="330" height="54" />
  <text class="vd" x="690" y="108">nothing stated</text>

  <text class="lbl" x="20" y="170">Yelp</text>
  <rect class="adj" x="180" y="138" width="330" height="54" />
  <text class="vd" x="345" y="170">agents outside the licence programme</text>
  <rect class="hero" x="525" y="138" width="330" height="54" />
  <text class="vd-inv" x="690" y="170">licensed agents, by contract</text>

  <text class="lbl" x="20" y="232">Delta</text>
  <rect class="adj" x="180" y="200" width="330" height="54" />
  <text class="vd" x="345" y="232">third-party flight booking</text>
  <rect class="box" x="525" y="200" width="330" height="54" />
  <text class="vd" x="690" y="232">nothing stated</text>

  <text class="lbl" x="20" y="294">JPMorgan</text>
  <rect class="adj" x="180" y="262" width="330" height="54" />
  <text class="vd" x="345" y="294">logins with customer credentials</text>
  <rect class="box" x="525" y="262" width="330" height="54" />
  <text class="vd" x="690" y="294">not specified on the call</text>

  <text class="lbl" x="20" y="347">Schwab</text>
  <rect class="adj" x="180" y="324" width="330" height="54" />
  <text class="vd" x="345" y="347">client-credential logins,</text>
  <text class="vd" x="345" y="366">and money movement</text>
  <rect class="hero" x="525" y="324" width="330" height="54" />
  <text class="vd-inv" x="690" y="347">balances and research,</text>
  <text class="vd-inv" x="690" y="366">via its own MCP servers</text>
</svg>
