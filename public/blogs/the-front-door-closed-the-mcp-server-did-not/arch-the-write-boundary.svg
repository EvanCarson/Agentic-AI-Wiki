<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The write boundary, two routes</title>
  <desc id="d">One user request reaches an institution by two routes. The upper route opens a browser session with the client's own password, which the institution cannot distinguish from the client, and is refused at the door. The lower route presents a scoped grant the institution issued, and is admitted to a read-only MCP surface; any write is handed to the institution's own first-party agent instead.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="30">The same errand, two routes. Only one leaves the institution a decision.</text>

  <rect class="adj" x="20" y="210" width="140" height="80" />
  <text class="hd" x="90" y="245">One errand</text>
  <text class="vd" x="90" y="268">"move $500"</text>

  <path class="arrow" d="M 160 240 L 215 240 L 215 125 L 274 125" />
  <path class="arrow" d="M 160 260 L 215 260 L 215 295 L 274 295" />

  <rect class="box" x="280" y="80" width="250" height="90" />
  <text class="hd" x="405" y="112">Browser session</text>
  <text class="vd" x="405" y="136">opened with the</text>
  <text class="vd" x="405" y="155">client's password</text>

  <path class="arrow" d="M 530 125 L 614 125" />
  <text class="vd" x="572" y="114">refused</text>

  <rect class="box" x="620" y="80" width="250" height="90" />
  <text class="hd" x="745" y="112">No decision possible</text>
  <text class="vd" x="745" y="136">the session is the</text>
  <text class="vd" x="745" y="155">client's, by design</text>

  <rect class="adj" x="280" y="250" width="250" height="90" />
  <text class="hd" x="405" y="282">Scoped grant</text>
  <text class="vd" x="405" y="306">issued by the</text>
  <text class="vd" x="405" y="325">institution</text>

  <path class="arrow" d="M 530 295 L 614 295" />
  <text class="vd" x="572" y="284">admitted</text>

  <rect class="hero" x="620" y="250" width="250" height="90" />
  <text class="hd-inv" x="745" y="282">Read-only surface</text>
  <text class="vd-inv" x="745" y="306">balances, research,</text>
  <text class="vd-inv" x="745" y="325">no money movement</text>

  <path class="arrow" d="M 745 340 L 745 394" />

  <rect class="hero" x="620" y="400" width="250" height="80" />
  <text class="hd-inv" x="745" y="434">First-party agent</text>
  <text class="vd-inv" x="745" y="458">every write lands here</text>
</svg>
