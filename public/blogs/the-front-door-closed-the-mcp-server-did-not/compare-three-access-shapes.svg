<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three shapes of agent access compared</title>
  <desc id="d">Three columns. Credential replay authenticates as the client using their own password, so the resource owner has no write it can refuse. An issued read scope authenticates as a grant the owner minted and can revoke, and carries no write at all. A first-party agent is the owner's own software, so refusing is simply a control it already operates.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="20" y="28">The axis is who issued the credential, not human versus agent.</text>

  <text class="lbl" x="20" y="96">Authenticated as</text>
  <text class="lbl" x="20" y="206">Can refuse</text>

  <rect class="box" x="165" y="52" width="215" height="92" />
  <text class="hd" x="272" y="82">Credential replay</text>
  <text class="vd" x="272" y="108">the client, using</text>
  <text class="vd" x="272" y="128">their own password</text>

  <rect class="adj" x="400" y="52" width="215" height="92" />
  <text class="hd" x="507" y="82">Issued read scope</text>
  <text class="vd" x="507" y="108">a grant the owner</text>
  <text class="vd" x="507" y="128">minted, and revokes</text>

  <rect class="hero" x="635" y="52" width="215" height="92" />
  <text class="hd-inv" x="742" y="82">First-party agent</text>
  <text class="vd-inv" x="742" y="108">the owner's own</text>
  <text class="vd-inv" x="742" y="128">software</text>

  <rect class="box" x="165" y="162" width="215" height="96" />
  <text class="vd" x="272" y="190">no: the write looks</text>
  <text class="vd" x="272" y="212">exactly like the</text>
  <text class="vd" x="272" y="234">client's own</text>

  <rect class="adj" x="400" y="162" width="215" height="96" />
  <text class="vd" x="507" y="196">n/a: the scope</text>
  <text class="vd" x="507" y="218">carries no write</text>

  <rect class="hero" x="635" y="162" width="215" height="96" />
  <text class="vd-inv" x="742" y="196">yes: it is already</text>
  <text class="vd-inv" x="742" y="218">the owner's control</text>
</svg>
