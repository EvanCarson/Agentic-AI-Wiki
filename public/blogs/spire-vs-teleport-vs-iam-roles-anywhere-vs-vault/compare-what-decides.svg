<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="wt wd">
  <title id="wt">The three questions that decide the choice</title>
  <desc id="wd">Three columns — where the trust anchor lives, how many downstream systems the agent calls, and whether humans and machines need one policy plane — each with what it determines about the shortlist and how to check it from what a team already knows.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .rule   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .45; }
  </style>

  <text class="title" x="20" y="28">Answer three questions; the shortlist collapses to one</text>

  <rect class="hero" x="30" y="50" width="250" height="46" />
  <text class="label-inv" x="155" y="79" text-anchor="middle">Where the anchor lives</text>
  <rect class="adj" x="325" y="50" width="250" height="46" />
  <text class="label" x="450" y="79" text-anchor="middle">Downstream breadth</text>
  <rect class="box" x="620" y="50" width="250" height="46" />
  <text class="label" x="745" y="79" text-anchor="middle">Humans on the same plane</text>

  <text class="sub" x="155" y="128" text-anchor="middle">Decides: SPIRE, Teleport,</text>
  <text class="sub" x="155" y="145" text-anchor="middle">or an AWS trust anchor</text>
  <text class="sub" x="450" y="128" text-anchor="middle">Decides: whether one system</text>
  <text class="sub" x="450" y="145" text-anchor="middle">covers it, or you need Vault too</text>
  <text class="sub" x="745" y="128" text-anchor="middle">Decides: whether the audit log</text>
  <text class="sub" x="745" y="145" text-anchor="middle">is one query or a join</text>

  <path class="rule" d="M 30 162 L 870 162" />

  <text class="sub" x="155" y="188" text-anchor="middle">Check: count the clouds and</text>
  <text class="sub" x="155" y="205" text-anchor="middle">orchestrators you actually run</text>
  <text class="sub" x="450" y="188" text-anchor="middle">Check: list every credential your</text>
  <text class="sub" x="450" y="205" text-anchor="middle">agents hold today, by target</text>
  <text class="sub" x="745" y="188" text-anchor="middle">Check: try to answer "who touched</text>
  <text class="sub" x="745" y="205" text-anchor="middle">this system in March" right now</text>

  <rect class="box" x="30" y="228" width="840" height="54" />
  <text class="label" x="450" y="251" text-anchor="middle">Then check the axis no table has: what does the identity actually unlock?</text>
  <text class="sub" x="450" y="271" text-anchor="middle">If every SVID maps to the same broad role, you rotated the key to the same door.</text>
</svg>
