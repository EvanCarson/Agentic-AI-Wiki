<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="mt md">
  <title id="mt">Feature matrix of four workload identity systems</title>
  <desc id="md">Rows are SPIRE, Teleport, AWS IAM Roles Anywhere and HashiCorp Vault. Columns are attestation depth, SPIFFE compatibility, breadth of downstream targets, one plane for humans and machines, and operating burden. Cells are rated strong, medium or weak.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .medium { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .cell     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .col    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="title" x="20" y="28">Where each system leans hardest</text>

  <text class="col" x="290" y="64" text-anchor="middle">Attestation</text>
  <text class="col" x="290" y="78" text-anchor="middle">depth</text>
  <text class="col" x="425" y="64" text-anchor="middle">SPIFFE</text>
  <text class="col" x="425" y="78" text-anchor="middle">compatible</text>
  <text class="col" x="560" y="64" text-anchor="middle">Downstream</text>
  <text class="col" x="560" y="78" text-anchor="middle">breadth</text>
  <text class="col" x="695" y="64" text-anchor="middle">One plane with</text>
  <text class="col" x="695" y="78" text-anchor="middle">human access</text>
  <text class="col" x="830" y="64" text-anchor="middle">Operating</text>
  <text class="col" x="830" y="78" text-anchor="middle">burden</text>

  <text class="row" x="20" y="116">SPIRE</text>
  <rect class="strong" x="228" y="94" width="124" height="34" />
  <text class="cell-inv" x="290" y="115" text-anchor="middle">Strong (2-stage)</text>
  <rect class="strong" x="363" y="94" width="124" height="34" />
  <text class="cell-inv" x="425" y="115" text-anchor="middle">Reference impl</text>
  <rect class="medium" x="498" y="94" width="124" height="34" />
  <text class="cell" x="560" y="115" text-anchor="middle">Anything you run</text>
  <rect class="weak" x="633" y="94" width="124" height="34" />
  <text class="cell" x="695" y="115" text-anchor="middle">No</text>
  <rect class="strong" x="768" y="94" width="124" height="34" />
  <text class="cell-inv" x="830" y="115" text-anchor="middle">Highest</text>

  <text class="row" x="20" y="176">Teleport</text>
  <rect class="strong" x="228" y="154" width="124" height="34" />
  <text class="cell-inv" x="290" y="175" text-anchor="middle">Strong (TPM)</text>
  <rect class="strong" x="363" y="154" width="124" height="34" />
  <text class="cell-inv" x="425" y="175" text-anchor="middle">Yes + federation</text>
  <rect class="medium" x="498" y="154" width="124" height="34" />
  <text class="cell" x="560" y="175" text-anchor="middle">Anything you run</text>
  <rect class="strong" x="633" y="154" width="124" height="34" />
  <text class="cell-inv" x="695" y="175" text-anchor="middle">Yes, one log</text>
  <rect class="medium" x="768" y="154" width="124" height="34" />
  <text class="cell" x="830" y="175" text-anchor="middle">Medium</text>

  <text class="row" x="20" y="236">IAM Roles Anywhere</text>
  <rect class="weak" x="228" y="214" width="124" height="34" />
  <text class="cell" x="290" y="235" text-anchor="middle">Cert possession</text>
  <rect class="weak" x="363" y="214" width="124" height="34" />
  <text class="cell" x="425" y="235" text-anchor="middle">No</text>
  <rect class="weak" x="498" y="214" width="124" height="34" />
  <text class="cell" x="560" y="235" text-anchor="middle">AWS only</text>
  <rect class="weak" x="633" y="214" width="124" height="34" />
  <text class="cell" x="695" y="235" text-anchor="middle">No</text>
  <rect class="weak" x="768" y="214" width="124" height="34" />
  <text class="cell" x="830" y="235" text-anchor="middle">Lowest</text>

  <text class="row" x="20" y="296">Vault</text>
  <rect class="medium" x="228" y="274" width="124" height="34" />
  <text class="cell" x="290" y="295" text-anchor="middle">Consumes others'</text>
  <rect class="medium" x="363" y="274" width="124" height="34" />
  <text class="cell" x="425" y="295" text-anchor="middle">Auth + JWT SVID</text>
  <rect class="strong" x="498" y="274" width="124" height="34" />
  <text class="cell-inv" x="560" y="295" text-anchor="middle">Widest</text>
  <rect class="weak" x="633" y="274" width="124" height="34" />
  <text class="cell" x="695" y="295" text-anchor="middle">No</text>
  <rect class="medium" x="768" y="274" width="124" height="34" />
  <text class="cell" x="830" y="295" text-anchor="middle">Medium</text>

  <rect class="strong" x="228" y="336" width="18" height="18" />
  <text class="sub" x="254" y="350">Strong</text>
  <rect class="medium" x="326" y="336" width="18" height="18" />
  <text class="sub" x="352" y="350">Medium</text>
  <rect class="weak" x="430" y="336" width="18" height="18" />
  <text class="sub" x="456" y="350">Weak or absent</text>
  <text class="sub" x="600" y="350">Operating burden: higher shading means more of it.</text>
</svg>
