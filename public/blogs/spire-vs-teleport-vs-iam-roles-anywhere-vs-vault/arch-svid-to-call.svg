<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="at ad">
  <title id="at">From attestation to a downstream call, and the questions the SVID cannot answer</title>
  <desc id="ad">Node attestation and workload attestation produce a short-lived SVID, which the agent presents to a downstream system. Three questions sit beside the call: which process is calling, answered by the SVID; which user this turn serves, unanswered; and what text is in the context, unanswered.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr3); }
    .gap    { fill: none; stroke: currentColor; stroke-width: 1.25; opacity: .5; stroke-dasharray: 5 5; rx: 10; ry: 10; }
  </style>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="title" x="20" y="30">The identity plane proves the process. The authority question is elsewhere.</text>

  <rect class="box" x="20" y="60" width="180" height="70" />
  <text class="label" x="110" y="90" text-anchor="middle">Node attestation</text>
  <text class="sub" x="110" y="112" text-anchor="middle">cloud metadata, TPM, k8s</text>

  <rect class="box" x="20" y="150" width="180" height="70" />
  <text class="label" x="110" y="180" text-anchor="middle">Workload attestation</text>
  <text class="sub" x="110" y="202" text-anchor="middle">process, namespace, image</text>

  <path class="arrow" d="M 200 95 L 258 128" />
  <path class="arrow" d="M 200 185 L 258 152" />

  <rect class="hero" x="262" y="110" width="190" height="70" />
  <text class="label-inv" x="357" y="140" text-anchor="middle">SVID issued</text>
  <text class="sub-inv" x="357" y="162" text-anchor="middle">1-hour default, auto-rotated</text>

  <path class="arrow" d="M 452 145 L 510 145" />

  <rect class="adj" x="514" y="110" width="170" height="70" />
  <text class="label" x="599" y="140" text-anchor="middle">Agent process</text>
  <text class="sub" x="599" y="162" text-anchor="middle">holds no static key</text>

  <path class="arrow" d="M 684 145 L 742 145" />

  <rect class="box" x="746" y="110" width="134" height="70" />
  <text class="label" x="813" y="140" text-anchor="middle">Downstream</text>
  <text class="sub" x="813" y="162" text-anchor="middle">system or API</text>

  <rect class="gap" x="20" y="250" width="860" height="220" />
  <text class="sub" x="36" y="274">Three questions arrive with every call</text>

  <rect class="hero" x="44" y="292" width="256" height="76" />
  <text class="label-inv" x="172" y="322" text-anchor="middle">Which process is calling?</text>
  <text class="sub-inv" x="172" y="345" text-anchor="middle">Answered — cryptographically</text>

  <rect class="box" x="322" y="292" width="256" height="76" />
  <text class="label" x="450" y="322" text-anchor="middle">For which user?</text>
  <text class="sub" x="450" y="345" text-anchor="middle">Not answered — needs a per-user token</text>

  <rect class="box" x="600" y="292" width="256" height="76" />
  <text class="label" x="728" y="322" text-anchor="middle">Who wrote the instruction?</text>
  <text class="sub" x="728" y="345" text-anchor="middle">Not answered — needs taint tracking</text>

  <rect class="adj" x="44" y="386" width="812" height="64" />
  <text class="label" x="450" y="412" text-anchor="middle">A compromised-by-injection agent passes this check every time</text>
  <text class="sub" x="450" y="434" text-anchor="middle">The right process is making the call. That is all the attestation layer was ever asked.</text>
</svg>
