<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Multi Round-Trip Requests replace the server-initiated callback</title>
  <desc id="d">A tool call that needs mid-call input no longer holds a stream open. The server returns resultType input_required together with the questions it needs answered, the client resolves them however it likes, and the client retries the original call with inputResponses attached. Four ordinary request-response exchanges instead of one long-lived connection.</desc>
  <style>
    .box     { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero    { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj     { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .step-n    { font-family: var(--font-mono), 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; fill: var(--muted, #888); text-anchor: middle; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .85; text-anchor: middle; }
    .wire      { font-family: var(--font-mono), 'JetBrains Mono', monospace; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .band      { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .arrow     { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="band" x="450" y="46">One tool call, four independent request-response exchanges</text>

  <text class="step-n" x="120" y="130">1</text>
  <rect class="box" x="35" y="146" width="170" height="110" rx="8" ry="8" />
  <text class="label" x="120" y="184">Client calls</text>
  <text class="wire" x="120" y="208">tools/call</text>
  <text class="sub" x="120" y="234">no stream held open</text>

  <path class="arrow" d="M 205 200 L 253 200" />

  <text class="step-n" x="340" y="130">2</text>
  <rect class="hero" x="255" y="146" width="170" height="110" rx="8" ry="8" />
  <text class="label-inv" x="340" y="180">Server answers</text>
  <text class="wire" x="340" y="204" style="fill: var(--paper, #fff);">input_required</text>
  <text class="sub-inv" x="340" y="230">plus the questions</text>

  <path class="arrow" d="M 425 200 L 473 200" />

  <text class="step-n" x="560" y="130">3</text>
  <rect class="adj" x="475" y="146" width="170" height="110" rx="8" ry="8" />
  <text class="label" x="560" y="184">Client resolves</text>
  <text class="sub" x="560" y="208">ask the user, read a</text>
  <text class="sub" x="560" y="226">policy, use a default</text>

  <path class="arrow" d="M 645 200 L 693 200" />

  <text class="step-n" x="780" y="130">4</text>
  <rect class="adj" x="695" y="146" width="170" height="110" rx="8" ry="8" />
  <text class="label" x="780" y="180">Client retries</text>
  <text class="wire" x="780" y="204">inputResponses</text>
  <text class="sub" x="780" y="230">original call, answered</text>

  <path class="arrow" d="M 780 256 L 780 320" />
  <rect class="box" x="335" y="320" width="230" height="72" rx="8" ry="8" />
  <text class="label" x="450" y="350">Result</text>
  <text class="sub" x="450" y="370">served by any instance</text>
  <path class="arrow" d="M 695 356 L 567 356" />

  <text class="sub" x="450" y="436">Every hop is idempotent, retryable, and free to land on a different server.</text>
</svg>
