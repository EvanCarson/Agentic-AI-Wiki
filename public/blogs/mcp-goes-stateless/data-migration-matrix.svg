<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Migration cost of the 2026-07-28 changes by deployment shape</title>
  <desc id="d">A four-by-five grid showing how much work each change creates for a local stdio server, a single-instance HTTP server, a load-balanced HTTP fleet, and a client or host application. The stateless core is close to free for stdio and a windfall for a fleet; the deprecation of Sampling, Roots and Logging lands almost entirely on client authors.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: start; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">Who pays for what</text>

  <text class="body-text" x="238" y="58" style="font-weight:600">Stateless</text>
  <text class="body-text" x="238" y="72" style="font-weight:600">core</text>
  <text class="body-text" x="378" y="58" style="font-weight:600">Tasks to an</text>
  <text class="body-text" x="378" y="72" style="font-weight:600">extension</text>
  <text class="body-text" x="518" y="58" style="font-weight:600">Sampling, Roots,</text>
  <text class="body-text" x="518" y="72" style="font-weight:600">Logging deprecated</text>
  <text class="body-text" x="658" y="58" style="font-weight:600">DCR out,</text>
  <text class="body-text" x="658" y="72" style="font-weight:600">CIMD in</text>
  <text class="body-text" x="798" y="58" style="font-weight:600">HTTP+SSE</text>
  <text class="body-text" x="798" y="72" style="font-weight:600">retired</text>

  <!-- Row 1: local stdio server -->
  <text class="row-head" x="154" y="118">Local stdio server</text>
  <rect class="card-neutral" x="171" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="238" y="114">Barely affected</text>
  <rect class="card-neutral" x="311" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="378" y="114">Rarely used</text>
  <rect class="card-soft" x="451" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="518" y="109">Drop it if you</text>
  <text class="body-text" x="518" y="123">leaned on it</text>
  <rect class="card-neutral" x="591" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="658" y="114">No auth layer</text>
  <rect class="card-neutral" x="731" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="798" y="114">Not your transport</text>

  <!-- Row 2: single-instance HTTP -->
  <text class="row-head" x="154" y="178">Single HTTP server</text>
  <rect class="card-soft" x="171" y="148" width="134" height="52" rx="6" />
  <text class="body-text" x="238" y="169">Delete the session</text>
  <text class="body-text" x="238" y="183">bookkeeping</text>
  <rect class="card-soft" x="311" y="148" width="134" height="52" rx="6" />
  <text class="body-text" x="378" y="169">Adopt the</text>
  <text class="body-text" x="378" y="183">extension</text>
  <rect class="card-soft" x="451" y="148" width="134" height="52" rx="6" />
  <text class="body-text" x="518" y="174">Twelve-month clock</text>
  <rect class="card-soft" x="591" y="148" width="134" height="52" rx="6" />
  <text class="body-text" x="658" y="169">Publish client</text>
  <text class="body-text" x="658" y="183">metadata docs</text>
  <rect class="card-soft" x="731" y="148" width="134" height="52" rx="6" />
  <text class="body-text" x="798" y="174">One-year runway</text>

  <!-- Row 3: load-balanced fleet -->
  <text class="row-head" x="154" y="238">HTTP fleet</text>
  <rect class="card-accent" x="171" y="208" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="238" y="229">The whole reason</text>
  <text class="body-text-inv" x="238" y="243">this shipped</text>
  <rect class="card-soft" x="311" y="208" width="134" height="52" rx="6" />
  <text class="body-text" x="378" y="229">Polling suits you</text>
  <text class="body-text" x="378" y="243">better anyway</text>
  <rect class="card-neutral" x="451" y="208" width="134" height="52" rx="6" />
  <text class="body-text" x="518" y="234">Rarely implemented</text>
  <rect class="card-accent" x="591" y="208" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="658" y="229">Real work, and</text>
  <text class="body-text-inv" x="658" y="243">the security win</text>
  <rect class="card-accent" x="731" y="208" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="798" y="229">Retire the legacy</text>
  <text class="body-text-inv" x="798" y="243">endpoint</text>

  <!-- Row 4: client / host app -->
  <text class="row-head" x="154" y="298">Client / host app</text>
  <rect class="card-soft" x="171" y="268" width="134" height="52" rx="6" />
  <text class="body-text" x="238" y="289">Send identity on</text>
  <text class="body-text" x="238" y="303">every request</text>
  <rect class="card-soft" x="311" y="268" width="134" height="52" rx="6" />
  <text class="body-text" x="378" y="294">Poll, do not wait</text>
  <rect class="card-accent" x="451" y="268" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="518" y="289">You lose the peer</text>
  <text class="body-text-inv" x="518" y="303">features</text>
  <rect class="card-accent" x="591" y="268" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="658" y="289">Validate iss</text>
  <text class="body-text-inv" x="658" y="303">before redeeming</text>
  <rect class="card-soft" x="731" y="268" width="134" height="52" rx="6" />
  <text class="body-text" x="798" y="294">Drop SSE support</text>

  <rect class="card-accent" x="171" y="340" width="18" height="18" rx="4" />
  <text class="legend-text" x="197" y="354">Where the change actually lands</text>
  <rect class="card-soft" x="451" y="340" width="18" height="18" rx="4" />
  <text class="legend-text" x="477" y="354">Some work</text>
  <rect class="card-neutral" x="631" y="340" width="18" height="18" rx="4" />
  <text class="legend-text" x="657" y="354">Little or nothing to do</text>
</svg>
