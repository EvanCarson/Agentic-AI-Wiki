<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">MCP before and after the 2026-07-28 stateless core</title>
  <desc id="d">Before, an initialize handshake and an Mcp-Session-Id header pinned a client to one server instance, so a second instance could not serve the same conversation without a shared session store. After, every request carries its protocol version, client identity and capabilities in _meta and exposes Mcp-Method and Mcp-Name headers, so an ordinary HTTP router can send it to any instance and list results become cacheable.</desc>
  <style>
    .box     { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero    { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj     { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .band    { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .85; text-anchor: middle; }
    .wire      { font-family: var(--font-mono), 'JetBrains Mono', monospace; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .arrow     { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .rule      { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Band 1 -->
  <text class="band" x="30" y="46">Before — stateful session</text>

  <rect class="box" x="40" y="106" width="150" height="64" rx="8" ry="8" />
  <text class="label" x="115" y="133">Client</text>
  <text class="sub" x="115" y="152">initialize / initialized</text>

  <path class="arrow" d="M 190 138 L 268 138" />
  <!-- y=98, not 126: centred on the arrow this label is ~92px wide but the gap
       between the two boxes is only 80px, so at 126 it sat inside the box band
       and the router box painted over its final character. Lifting it above
       y=106 (where both boxes start) clears them without moving the band. -->
  <text class="wire" x="229" y="98">Mcp-Session-Id</text>

  <rect class="box" x="270" y="106" width="160" height="64" rx="8" ry="8" />
  <text class="label" x="350" y="133">Sticky router</text>
  <text class="sub" x="350" y="152">must pin the session</text>

  <path class="arrow" d="M 430 128 L 528 106" />

  <rect class="adj" x="530" y="78" width="160" height="52" rx="8" ry="8" />
  <text class="label" x="610" y="100">Instance A</text>
  <text class="sub" x="610" y="118">holds the session</text>

  <rect class="box" x="530" y="146" width="160" height="52" rx="8" ry="8" />
  <text class="label" x="610" y="168">Instance B</text>
  <text class="sub" x="610" y="186">cannot serve it</text>

  <path class="arrow" d="M 690 104 L 738 130" />

  <rect class="box" x="740" y="106" width="130" height="64" rx="8" ry="8" />
  <text class="label" x="805" y="133">Shared</text>
  <text class="sub" x="805" y="152">session store</text>

  <line class="rule" x1="30" y1="238" x2="870" y2="238" />

  <!-- Band 2 -->
  <text class="band" x="30" y="278">After — 2026-07-28 stateless core</text>

  <rect class="hero" x="40" y="336" width="150" height="64" rx="8" ry="8" />
  <text class="label-inv" x="115" y="363">Client</text>
  <text class="sub-inv" x="115" y="382">no handshake</text>

  <path class="arrow" d="M 190 368 L 268 368" />
  <text class="wire" x="229" y="356">_meta</text>
  <text class="wire" x="229" y="394">Mcp-Method</text>

  <rect class="adj" x="270" y="336" width="160" height="64" rx="8" ry="8" />
  <text class="label" x="350" y="363">Any HTTP router</text>
  <text class="sub" x="350" y="382">routes on headers</text>

  <path class="arrow" d="M 430 358 L 528 336" />
  <path class="arrow" d="M 430 380 L 528 402" />

  <rect class="adj" x="530" y="308" width="160" height="52" rx="8" ry="8" />
  <text class="label" x="610" y="330">Instance A</text>
  <text class="sub" x="610" y="348">any request, any time</text>

  <rect class="adj" x="530" y="376" width="160" height="52" rx="8" ry="8" />
  <text class="label" x="610" y="398">Instance B</text>
  <text class="sub" x="610" y="416">identically capable</text>

  <path class="arrow" d="M 690 334 L 738 360" />

  <rect class="adj" x="740" y="336" width="130" height="64" rx="8" ry="8" />
  <text class="label" x="805" y="363">Edge cache</text>
  <text class="sub" x="805" y="382">ttlMs, cacheScope</text>

  <text class="sub" x="450" y="466">The server stopped being a session. It became a URL.</text>
</svg>
