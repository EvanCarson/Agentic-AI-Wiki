<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="lt2 ld2">
  <title id="lt2">Three layers of lock-in, ranked by how hard each is to leave</title>
  <desc id="ld2">Three columns comparing the vector store, the parser and chunker, and the permission model, on what it costs to replace each one. Vectors are the cheapest to rebuild, parsing is weeks of tuning, and the permission model is the layer that reaches back into your identity provider and your source systems.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .rule   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .45; }
  </style>

  <text class="title" x="20" y="28">What it actually costs to leave</text>

  <rect class="box" x="30" y="50" width="250" height="46" />
  <text class="label" x="155" y="79" text-anchor="middle">The vector store</text>
  <rect class="adj" x="325" y="50" width="250" height="46" />
  <text class="label" x="450" y="79" text-anchor="middle">The parser and chunker</text>
  <rect class="hero" x="620" y="50" width="250" height="46" />
  <text class="label-inv" x="745" y="79" text-anchor="middle">The permission model</text>

  <text class="sub" x="155" y="128" text-anchor="middle">Re-embed the corpus</text>
  <text class="sub" x="450" y="128" text-anchor="middle">Re-tune extraction per document type</text>
  <text class="sub" x="745" y="128" text-anchor="middle">Re-plumb identity and every source</text>

  <path class="rule" d="M 30 148 L 870 148" />

  <text class="sub" x="155" y="174" text-anchor="middle">Cost: compute, measured in hours</text>
  <text class="sub" x="450" y="174" text-anchor="middle">Cost: engineering, measured in weeks</text>
  <text class="sub" x="745" y="174" text-anchor="middle">Cost: a security review, measured in quarters</text>

  <path class="rule" d="M 30 194 L 870 194" />

  <text class="sub" x="155" y="220" text-anchor="middle">Portable: the corpus is yours</text>
  <text class="sub" x="450" y="220" text-anchor="middle">Portable: only if you kept the raw source</text>
  <text class="sub" x="745" y="220" text-anchor="middle">Portable: almost nothing transfers</text>

  <rect class="box" x="30" y="242" width="840" height="40" />
  <text class="label" x="450" y="267" text-anchor="middle">Evaluate the layer that is hardest to leave first — it is not the one the benchmarks measure</text>
</svg>
