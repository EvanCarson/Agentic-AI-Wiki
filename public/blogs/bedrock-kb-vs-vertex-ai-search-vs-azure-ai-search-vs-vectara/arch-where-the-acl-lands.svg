<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="at ad">
  <title id="at">Two paths into the same index, only one of which carries the end user's identity</title>
  <desc id="ad">Permissions travel from the source system through the connector into the index as permission metadata. A direct search call passes an end-user token and the service filters before ranking. An agent tool wrapper calls the same index with only the service identity, so the filter has nothing to apply and every document in the index is reachable.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="title" x="20" y="28">Ingest carries the permissions; the query has to carry the principal</text>

  <rect class="box" x="20" y="50" width="200" height="60" />
  <text class="label" x="120" y="76" text-anchor="middle">Source system</text>
  <text class="sub" x="120" y="96" text-anchor="middle">SharePoint, Drive, Confluence</text>

  <path class="arrow" d="M 224 80 L 286 80" />

  <rect class="box" x="290" y="50" width="200" height="60" />
  <text class="label" x="390" y="76" text-anchor="middle">Connector</text>
  <text class="sub" x="390" y="96" text-anchor="middle">copies content + ACL metadata</text>

  <path class="arrow" d="M 494 80 L 556 80" />

  <rect class="adj" x="560" y="50" width="320" height="60" />
  <text class="label" x="720" y="76" text-anchor="middle">Index</text>
  <text class="sub" x="720" y="96" text-anchor="middle">chunks, vectors, permission keys</text>

  <path class="arrow" d="M 720 114 L 720 166" />
  <path class="arrow" d="M 720 114 L 720 166" />

  <rect class="box" x="560" y="170" width="320" height="50" />
  <text class="label" x="720" y="200" text-anchor="middle">Retrieval: filter, then rank</text>

  <rect class="box" x="20" y="260" width="380" height="120" />
  <text class="label" x="210" y="288" text-anchor="middle">Path A — direct search call</text>
  <text class="sub" x="210" y="312" text-anchor="middle">App authenticates the end user, forwards a</text>
  <text class="sub" x="210" y="330" text-anchor="middle">user or group token on the request</text>
  <text class="sub" x="210" y="356" text-anchor="middle">Filter has a principal to apply</text>

  <rect class="hero" x="440" y="260" width="440" height="120" />
  <text class="label-inv" x="660" y="288" text-anchor="middle">Path B — the agent tool wrapper</text>
  <text class="sub-inv" x="660" y="312" text-anchor="middle">Agent framework calls the same index with the</text>
  <text class="sub-inv" x="660" y="330" text-anchor="middle">service identity, no end-user context to pass</text>
  <text class="sub-inv" x="660" y="356" text-anchor="middle">Filter has nothing to apply — the index is wide open</text>

  <path class="arrow" d="M 640 224 L 420 256" />
  <path class="arrow" d="M 800 224 L 800 256" />

  <rect class="box" x="20" y="410" width="860" height="60" />
  <text class="label" x="450" y="436" text-anchor="middle">The permission model you evaluated lives on Path A; the agent you are building uses Path B</text>
  <text class="sub" x="450" y="458" text-anchor="middle">Test the integration you will ship, not the API the documentation describes</text>
</svg>
