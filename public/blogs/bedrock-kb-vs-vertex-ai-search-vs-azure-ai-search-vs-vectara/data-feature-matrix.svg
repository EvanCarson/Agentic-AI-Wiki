<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="mt md">
  <title id="mt">Four managed knowledge-base services across four axes</title>
  <desc id="md">A matrix comparing Amazon Bedrock Knowledge Bases, Vertex AI Search, Azure AI Search and Vectara on breadth of first-party connectors, query-time permission enforcement, how much of the pipeline you can control, and how portable the result is. Each service is strong on a different axis and none is strong on all four.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="title" x="20" y="28">Where each service leans hardest</text>

  <text class="head" x="365" y="62" text-anchor="middle">Connectors</text>
  <text class="head" x="535" y="62" text-anchor="middle">Query-time ACLs</text>
  <text class="head" x="700" y="62" text-anchor="middle">Pipeline control</text>
  <text class="head" x="845" y="62" text-anchor="middle">Portability</text>

  <rect class="box" x="20" y="76" width="260" height="52" />
  <text class="label" x="34" y="107">Bedrock Knowledge Bases</text>
  <rect class="hero" x="290" y="76" width="150" height="52" />
  <text class="label-inv" x="365" y="107" text-anchor="middle">Strong</text>
  <rect class="hero" x="450" y="76" width="170" height="52" />
  <text class="label-inv" x="535" y="107" text-anchor="middle">Strong</text>
  <rect class="adj" x="630" y="76" width="140" height="52" />
  <text class="label" x="700" y="107" text-anchor="middle">Medium</text>
  <rect class="box" x="780" y="76" width="100" height="52" />
  <text class="sub" x="830" y="107" text-anchor="middle">Weak</text>

  <rect class="box" x="20" y="140" width="260" height="52" />
  <text class="label" x="34" y="171">Vertex AI Search</text>
  <rect class="hero" x="290" y="140" width="150" height="52" />
  <text class="label-inv" x="365" y="171" text-anchor="middle">Strong</text>
  <rect class="hero" x="450" y="140" width="170" height="52" />
  <text class="label-inv" x="535" y="171" text-anchor="middle">Strong</text>
  <rect class="box" x="630" y="140" width="140" height="52" />
  <text class="sub" x="700" y="171" text-anchor="middle">Weak</text>
  <rect class="box" x="780" y="140" width="100" height="52" />
  <text class="sub" x="830" y="171" text-anchor="middle">Weak</text>

  <rect class="box" x="20" y="204" width="260" height="52" />
  <text class="label" x="34" y="235">Azure AI Search</text>
  <rect class="adj" x="290" y="204" width="150" height="52" />
  <text class="label" x="365" y="235" text-anchor="middle">Medium</text>
  <rect class="adj" x="450" y="204" width="170" height="52" />
  <text class="label" x="535" y="229" text-anchor="middle">Strong in the API,</text>
  <text class="label" x="535" y="247" text-anchor="middle">not in the agent tool</text>
  <rect class="hero" x="630" y="204" width="140" height="52" />
  <text class="label-inv" x="700" y="235" text-anchor="middle">Strong</text>
  <rect class="adj" x="780" y="204" width="100" height="52" />
  <text class="label" x="830" y="235" text-anchor="middle">Medium</text>

  <rect class="box" x="20" y="268" width="260" height="52" />
  <text class="label" x="34" y="299">Vectara</text>
  <rect class="box" x="290" y="268" width="150" height="52" />
  <text class="sub" x="365" y="299" text-anchor="middle">Weak</text>
  <rect class="adj" x="450" y="268" width="170" height="52" />
  <text class="label" x="535" y="299" text-anchor="middle">Medium</text>
  <rect class="box" x="630" y="268" width="140" height="52" />
  <text class="sub" x="700" y="299" text-anchor="middle">Weak</text>
  <rect class="hero" x="780" y="268" width="100" height="52" />
  <text class="label-inv" x="830" y="299" text-anchor="middle">Strong</text>

  <rect class="hero" x="20" y="344" width="20" height="14" />
  <text class="sub" x="48" y="356">Strong</text>
  <rect class="adj" x="140" y="344" width="20" height="14" />
  <text class="sub" x="168" y="356">Medium</text>
  <rect class="box" x="260" y="344" width="20" height="14" />
  <text class="sub" x="288" y="356">Weak</text>
  <text class="sub" x="420" y="356">Portability here means how much survives a move to another vendor</text>
</svg>
