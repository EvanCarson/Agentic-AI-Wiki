<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">GitHub stars — llama.cpp, vLLM, SGLang, TensorRT-LLM</title>
  <desc id="d">Horizontal bar chart of GitHub stars in thousands, snapshot 1 August 2026: llama.cpp leads at 122.3k, vLLM 87.8k, SGLang 31.0k, TensorRT-LLM 14.3k. Stars track how many people run a project on their own machine, so the ordering here is close to the inverse of datacentre deployment share.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .proj-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .proj-sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: end; dominant-baseline: central; }
    .bar-val     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; dominant-baseline: central; }
    .grid-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: middle; }
    .grid-line   { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .bar-accent  { fill: var(--accent, #d4421e); }
    .bar-adj     { fill: var(--accent-soft, #f5c5b8); }
    .bar-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
  </style>

  <text class="chart-title" x="450" y="36" text-anchor="middle">GitHub stars (thousands, 1 Aug 2026)</text>

  <!--
    Chart area: left margin 220, width 600 for max 130k -> 4.6 px per 1k
    Grid at 0/25/50/75/100/125 -> x = 220/335/450/565/680/795
    4 rows, bar height 46, gap 18; row tops 75/139/203/267
  -->

  <line class="grid-line" x1="220" y1="68" x2="220" y2="318" />
  <line class="grid-line" x1="335" y1="68" x2="335" y2="318" />
  <line class="grid-line" x1="450" y1="68" x2="450" y2="318" />
  <line class="grid-line" x1="565" y1="68" x2="565" y2="318" />
  <line class="grid-line" x1="680" y1="68" x2="680" y2="318" />
  <line class="grid-line" x1="795" y1="68" x2="795" y2="318" />

  <line x1="220" y1="318" x2="820" y2="318" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" />

  <text class="grid-label" x="220" y="334">0</text>
  <text class="grid-label" x="335" y="334">25k</text>
  <text class="grid-label" x="450" y="334">50k</text>
  <text class="grid-label" x="565" y="334">75k</text>
  <text class="grid-label" x="680" y="334">100k</text>
  <text class="grid-label" x="795" y="334">125k stars</text>

  <!-- llama.cpp — 122.3k — width 122.3 * 4.6 = 563 -->
  <text class="proj-label" x="212" y="91">llama.cpp</text>
  <text class="proj-sub" x="212" y="107">MIT, since Mar 2023</text>
  <rect class="bar-accent" x="220" y="75" width="563" height="46" rx="5" ry="5" />
  <text class="bar-val" x="791" y="98" style="fill: var(--accent-ink, #a8331a);">122.3k</text>

  <!-- vLLM — 87.8k — width 87.8 * 4.6 = 404 -->
  <text class="proj-label" x="212" y="155">vLLM</text>
  <text class="proj-sub" x="212" y="171">Apache-2.0, since Feb 2023</text>
  <rect class="bar-adj" x="220" y="139" width="404" height="46" rx="5" ry="5" />
  <text class="bar-val" x="632" y="162" style="fill: var(--ink, #1a1a1a);">87.8k</text>

  <!-- SGLang — 31.0k — width 31.0 * 4.6 = 143 -->
  <text class="proj-label" x="212" y="219">SGLang</text>
  <text class="proj-sub" x="212" y="235">Apache-2.0, since Jan 2024</text>
  <rect class="bar-neutral" x="220" y="203" width="143" height="46" rx="5" ry="5" />
  <text class="bar-val" x="371" y="226" style="fill: var(--ink, #1a1a1a);">31.0k</text>

  <!-- TensorRT-LLM — 14.3k — width 14.3 * 4.6 = 66 -->
  <text class="proj-label" x="212" y="283">TensorRT-LLM</text>
  <text class="proj-sub" x="212" y="299">NVIDIA terms, since Aug 2023</text>
  <rect class="bar-neutral" x="220" y="267" width="66" height="46" rx="5" ry="5" />
  <text class="bar-val" x="294" y="290" style="fill: var(--ink, #1a1a1a);">14.3k</text>
</svg>
