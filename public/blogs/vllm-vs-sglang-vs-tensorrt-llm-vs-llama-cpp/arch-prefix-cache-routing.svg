<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Prefix-cache reuse is decided by the router, not the engine</title>
  <desc id="d">Step 20 of an agent loop re-sends its whole transcript. A prefix-aware router sends it to the replica already holding that conversation's KV cache, so only the 300 new tokens are prefilled. A round-robin router sends it to a cold replica, which re-prefills all 60,000 tokens — the same engine, two orders of magnitude apart in work done.</desc>
  <style>
    .box     { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero    { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj     { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .85; text-anchor: middle; }
    .outcome   { font-family: var(--font-mono), 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .arrow     { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Request -->
  <rect class="hero" x="30" y="205" width="180" height="94" rx="8" ry="8" />
  <text class="label-inv" x="120" y="238">Agent loop, step 20</text>
  <text class="sub-inv" x="120" y="259">60,000 tokens of prefix</text>
  <text class="sub-inv" x="120" y="277">+ 300 new</text>

  <!-- Fan to two routers -->
  <path class="arrow" d="M 210 235 L 290 172" />
  <path class="arrow" d="M 210 270 L 290 340" />

  <!-- Prefix-aware router -->
  <rect class="adj" x="290" y="132" width="180" height="76" rx="8" ry="8" />
  <text class="label" x="380" y="163">Prefix-aware router</text>
  <text class="sub" x="380" y="184">pin session to its cache</text>

  <!-- Round-robin router -->
  <rect class="box" x="290" y="308" width="180" height="76" rx="8" ry="8" />
  <text class="label" x="380" y="339">Round-robin router</text>
  <text class="sub" x="380" y="360">next replica in the ring</text>

  <path class="arrow" d="M 470 170 L 570 155" />
  <path class="arrow" d="M 470 346 L 570 331" />

  <!-- Warm replica -->
  <rect class="adj" x="570" y="112" width="220" height="86" rx="8" ry="8" />
  <text class="label" x="680" y="145">Replica A — cache warm</text>
  <text class="sub" x="680" y="168">holds steps 1–19</text>
  <text class="outcome" x="680" y="228">prefill 300 tokens</text>

  <!-- Cold replica -->
  <rect class="box" x="570" y="288" width="220" height="86" rx="8" ry="8" />
  <text class="label" x="680" y="321">Replica C — cache cold</text>
  <text class="sub" x="680" y="344">holds nothing for this run</text>
  <text class="outcome" x="680" y="404">prefill 60,300 tokens</text>

  <!-- Divider -->
  <line x1="60" y1="250" x2="60" y2="250" stroke="none" />
  <text class="sub" x="450" y="452">Same engine. Same weights. Same GPU. 200× the prefill work.</text>
</svg>
