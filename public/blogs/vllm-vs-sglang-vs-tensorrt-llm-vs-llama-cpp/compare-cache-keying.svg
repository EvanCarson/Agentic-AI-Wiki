<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What each engine keys its KV cache on</title>
  <desc id="d">Four columns comparing cache structure: vLLM hashes fixed-size paged blocks, SGLang keeps a radix tree over token prefixes so overlapping conversations share automatically, TensorRT-LLM reuses blocks inside a compiled engine, and llama.cpp keeps a per-slot prompt cache on a single machine.</desc>
  <style>
    .col-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .col-title-inv { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .75; text-anchor: middle; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .9; text-anchor: middle; }
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .foot      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--muted, #888); text-anchor: middle; }
    .box       { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj       { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero      { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="30">What the KV cache is keyed on</text>

  <rect class="adj" x="25" y="58" width="190" height="150" rx="8" ry="8" />
  <text class="col-title" x="120" y="90">vLLM</text>
  <text class="sub" x="120" y="120">Fixed-size blocks,</text>
  <text class="sub" x="120" y="139">hashed by content</text>
  <text class="sub" x="120" y="167">Cross-request reuse,</text>
  <text class="sub" x="120" y="186">routing left to you</text>

  <rect class="hero" x="245" y="58" width="190" height="150" rx="8" ry="8" />
  <text class="col-title-inv" x="340" y="90">SGLang</text>
  <text class="sub-inv" x="340" y="120">Radix tree over</text>
  <text class="sub-inv" x="340" y="139">the token prefix</text>
  <text class="sub-inv" x="340" y="167">Overlapping runs</text>
  <text class="sub-inv" x="340" y="186">share automatically</text>

  <rect class="box" x="465" y="58" width="190" height="150" rx="8" ry="8" />
  <text class="col-title" x="560" y="90">TensorRT-LLM</text>
  <text class="sub" x="560" y="120">Paged blocks inside</text>
  <text class="sub" x="560" y="139">a compiled engine</text>
  <text class="sub" x="560" y="167">Reuse is bound to</text>
  <text class="sub" x="560" y="186">the shape you built</text>

  <rect class="box" x="685" y="58" width="190" height="150" rx="8" ry="8" />
  <text class="col-title" x="780" y="90">llama.cpp</text>
  <text class="sub" x="780" y="120">Prompt cache per</text>
  <text class="sub" x="780" y="139">server slot</text>
  <text class="sub" x="780" y="167">One process, a</text>
  <text class="sub" x="780" y="186">handful of slots</text>

  <text class="foot" x="450" y="248">All four can skip a repeated prefill. Only one of them decides, on its own,</text>
  <text class="foot" x="450" y="268">that two different conversations share the first forty thousand tokens.</text>
</svg>
