<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Capability matrix across the four serving engines</title>
  <desc id="d">A four-by-five grid scoring vLLM, SGLang, TensorRT-LLM and llama.cpp on prefix reuse, constrained decoding under a full batch, fleet operations, non-NVIDIA silicon, and time from zero to a serving endpoint. Each engine is strong where its design premise points and against the grain everywhere else.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: start; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28" text-anchor="middle">Where each engine leans hardest</text>

  <text class="body-text" x="238" y="58" style="font-weight:600">Prefix</text>
  <text class="body-text" x="238" y="72" style="font-weight:600">reuse</text>
  <text class="body-text" x="378" y="58" style="font-weight:600">Constrained</text>
  <text class="body-text" x="378" y="72" style="font-weight:600">decode at batch</text>
  <text class="body-text" x="518" y="58" style="font-weight:600">Fleet</text>
  <text class="body-text" x="518" y="72" style="font-weight:600">operations</text>
  <text class="body-text" x="658" y="58" style="font-weight:600">Non-NVIDIA</text>
  <text class="body-text" x="658" y="72" style="font-weight:600">silicon</text>
  <text class="body-text" x="798" y="58" style="font-weight:600">Zero to</text>
  <text class="body-text" x="798" y="72" style="font-weight:600">serving</text>

  <!-- Row 1: vLLM -->
  <text class="row-head" x="154" y="118">vLLM</text>
  <rect class="card-soft" x="171" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="238" y="109">Automatic,</text>
  <text class="body-text" x="238" y="123">paged blocks</text>
  <rect class="card-soft" x="311" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="378" y="109">XGrammar</text>
  <text class="body-text" x="378" y="123">default</text>
  <rect class="card-accent" x="451" y="88" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="518" y="109">Deepest router</text>
  <text class="body-text-inv" x="518" y="123">and K8s stack</text>
  <rect class="card-accent" x="591" y="88" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="658" y="109">ROCm, XPU,</text>
  <text class="body-text-inv" x="658" y="123">TPU</text>
  <rect class="card-soft" x="731" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="798" y="114">pip, then minutes</text>

  <!-- Row 2: SGLang -->
  <text class="row-head" x="154" y="178">SGLang</text>
  <rect class="card-accent" x="171" y="148" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="238" y="169">Radix tree,</text>
  <text class="body-text-inv" x="238" y="183">shared prefixes</text>
  <rect class="card-accent" x="311" y="148" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="378" y="169">Mask overlapped</text>
  <text class="body-text-inv" x="378" y="183">with decode</text>
  <rect class="card-soft" x="451" y="148" width="134" height="52" rx="6" />
  <text class="body-text" x="518" y="169">Strong, smaller</text>
  <text class="body-text" x="518" y="183">ecosystem</text>
  <rect class="card-soft" x="591" y="148" width="134" height="52" rx="6" />
  <text class="body-text" x="658" y="169">AMD, Xeon,</text>
  <text class="body-text" x="658" y="183">TPU, NPU</text>
  <rect class="card-soft" x="731" y="148" width="134" height="52" rx="6" />
  <text class="body-text" x="798" y="174">pip, then minutes</text>

  <!-- Row 3: TensorRT-LLM -->
  <text class="row-head" x="154" y="238">TensorRT-LLM</text>
  <rect class="card-soft" x="171" y="208" width="134" height="52" rx="6" />
  <text class="body-text" x="238" y="229">Block reuse,</text>
  <text class="body-text" x="238" y="243">engine-bound</text>
  <rect class="card-soft" x="311" y="208" width="134" height="52" rx="6" />
  <text class="body-text" x="378" y="229">Available, less</text>
  <text class="body-text" x="378" y="243">exercised</text>
  <rect class="card-soft" x="451" y="208" width="134" height="52" rx="6" />
  <text class="body-text" x="518" y="229">Strong, one</text>
  <text class="body-text" x="518" y="243">vendor path</text>
  <rect class="card-neutral" x="591" y="208" width="134" height="52" rx="6" />
  <text class="body-text" x="658" y="234">NVIDIA only</text>
  <rect class="card-neutral" x="731" y="208" width="134" height="52" rx="6" />
  <text class="body-text" x="798" y="229">Build per model,</text>
  <text class="body-text" x="798" y="243">GPU, precision</text>

  <!-- Row 4: llama.cpp -->
  <text class="row-head" x="154" y="298">llama.cpp</text>
  <rect class="card-neutral" x="171" y="268" width="134" height="52" rx="6" />
  <text class="body-text" x="238" y="289">Per-slot, one</text>
  <text class="body-text" x="238" y="303">machine</text>
  <rect class="card-neutral" x="311" y="268" width="134" height="52" rx="6" />
  <text class="body-text" x="378" y="289">GBNF, thin</text>
  <text class="body-text" x="378" y="303">batching</text>
  <rect class="card-neutral" x="451" y="268" width="134" height="52" rx="6" />
  <text class="body-text" x="518" y="294">Not the target</text>
  <rect class="card-accent" x="591" y="268" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="658" y="289">CPU, Metal,</text>
  <text class="body-text-inv" x="658" y="303">Vulkan, ROCm</text>
  <rect class="card-accent" x="731" y="268" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="798" y="289">One binary,</text>
  <text class="body-text-inv" x="798" y="303">one file</text>

  <rect class="card-accent" x="171" y="340" width="18" height="18" rx="4" />
  <text class="legend-text" x="197" y="354">Strong — this is what the design is for</text>
  <rect class="card-soft" x="451" y="340" width="18" height="18" rx="4" />
  <text class="legend-text" x="477" y="354">Workable</text>
  <rect class="card-neutral" x="631" y="340" width="18" height="18" rx="4" />
  <text class="legend-text" x="657" y="354">Against the grain</text>
</svg>
