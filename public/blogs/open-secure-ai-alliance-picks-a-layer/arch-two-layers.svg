<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">The two layers of agent security, and who showed up for each</title>
  <desc id="d">The model layer covers weights, training, refusals and capability evaluation, and the four largest model providers are absent from the alliance's founding list. The runtime layer covers identity, isolation, guardrails, logs, model formats, scanning and the agent harness, and that is the layer the alliance's published scope covers.</desc>
  <style>
    .band-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: start; }
    .label      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: currentColor; text-anchor: middle; }
    .label-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); text-anchor: middle; }
    .note       { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .65; text-anchor: start; }
    .box        { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj        { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero       { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .divider    { stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; stroke-dasharray: 4 5; }
  </style>

  <text class="band-title" x="30" y="34">Model layer &#8212; what the model will do</text>
  <rect class="box" x="30" y="48" width="200" height="46" rx="8" />
  <text class="label" x="130" y="76">Weights &amp; training</text>
  <rect class="box" x="243" y="48" width="200" height="46" rx="8" />
  <text class="label" x="343" y="76">Refusals</text>
  <rect class="box" x="456" y="48" width="200" height="46" rx="8" />
  <text class="label" x="556" y="76">Capability evals</text>
  <rect class="box" x="669" y="48" width="200" height="46" rx="8" />
  <text class="label" x="769" y="76">Pre-release testing</text>
  <text class="note" x="30" y="118">OpenAI, Google, Anthropic and Meta are not on the founding member list. The published materials do not say why.</text>

  <line class="divider" x1="30" y1="146" x2="869" y2="146" />

  <text class="band-title" x="30" y="178">Runtime layer &#8212; what the system will allow</text>
  <rect class="adj" x="30" y="192" width="200" height="46" rx="8" />
  <text class="label" x="130" y="220">Identity &amp; permissions</text>
  <rect class="adj" x="243" y="192" width="200" height="46" rx="8" />
  <text class="label" x="343" y="220">Isolation &amp; sandboxing</text>
  <rect class="adj" x="456" y="192" width="200" height="46" rx="8" />
  <text class="label" x="556" y="220">Guardrails</text>
  <rect class="adj" x="669" y="192" width="200" height="46" rx="8" />
  <text class="label" x="769" y="220">Logs &amp; audit</text>

  <rect class="adj" x="30" y="250" width="200" height="46" rx="8" />
  <text class="label" x="130" y="278">Model formats</text>
  <rect class="adj" x="243" y="250" width="200" height="46" rx="8" />
  <text class="label" x="343" y="278">Multi-model scanning</text>
  <rect class="adj" x="456" y="250" width="200" height="46" rx="8" />
  <text class="label" x="556" y="278">Secure coding workflows</text>
  <rect class="adj" x="669" y="250" width="200" height="46" rx="8" />
  <text class="label" x="769" y="278">Agent harness</text>

  <rect class="hero" x="30" y="322" width="839" height="52" rx="8" />
  <text class="label-inv" x="450" y="345">Open Secure AI Alliance &#8212; published scope, 37 founding members</text>
  <text class="label-inv" x="450" y="363" style="opacity:.85">Microsoft &#183; IBM &#183; Red Hat &#183; Cisco &#183; Cloudflare &#183; CrowdStrike &#183; Hugging Face &#183; LangChain &#183; vLLM &#183; Linux Foundation</text>
</svg>
