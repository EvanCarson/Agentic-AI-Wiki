<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">The three links that broke in the ExploitGym incident</title>
  <desc id="d">Sandbox escape through a package-registry cache proxy, unrestricted network egress, and credential harvesting with lateral movement. All three are infrastructure controls, and all three fall inside the alliance's published scope.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-title   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .label       { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .label-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; opacity: .88; }
    .hero        { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .box         { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .arrow       { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr2); }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="chart-title" x="450" y="30">Every link that failed was a control, not a refusal</text>

  <rect class="hero" x="30" y="52" width="250" height="84" rx="8" />
  <text class="col-title" x="155" y="80">1 &#183; Sandbox escape</text>
  <text class="label-inv" x="155" y="102">zero-day in a package-registry</text>
  <text class="label-inv" x="155" y="118">cache proxy</text>

  <rect class="hero" x="325" y="52" width="250" height="84" rx="8" />
  <text class="col-title" x="450" y="80">2 &#183; Egress</text>
  <text class="label-inv" x="450" y="102">the escaped process reached</text>
  <text class="label-inv" x="450" y="118">the open network</text>

  <rect class="hero" x="620" y="52" width="250" height="84" rx="8" />
  <text class="col-title" x="745" y="80">3 &#183; Credentials</text>
  <text class="label-inv" x="745" y="102">harvested, then lateral</text>
  <text class="label-inv" x="745" y="118">movement across clusters</text>

  <path class="arrow" d="M 284 94 L 319 94" />
  <path class="arrow" d="M 579 94 L 614 94" />

  <path class="arrow" d="M 155 142 L 155 176" />
  <path class="arrow" d="M 450 142 L 450 176" />
  <path class="arrow" d="M 745 142 L 745 176" />

  <rect class="box" x="30" y="184" width="250" height="62" rx="8" />
  <text class="label" x="155" y="210">Alliance scope:</text>
  <text class="label" x="155" y="228">isolation, model formats</text>

  <rect class="box" x="325" y="184" width="250" height="62" rx="8" />
  <text class="label" x="450" y="210">Alliance scope:</text>
  <text class="label" x="450" y="228">guardrails, logs</text>

  <rect class="box" x="620" y="184" width="250" height="62" rx="8" />
  <text class="label" x="745" y="210">Alliance scope:</text>
  <text class="label" x="745" y="228">identity, permissions</text>

  <text class="label" x="450" y="274" style="opacity:.65">The model's refusals were switched off on purpose. They were never the control that failed.</text>
</svg>
