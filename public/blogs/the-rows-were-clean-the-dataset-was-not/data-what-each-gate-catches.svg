<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="egt egd">
  <title id="egt">What each dataset gate catches</title>
  <desc id="egd">Five rows of training-data defect types scored against two gates: a row-level content classifier and a post-training behavioural evaluation. The row classifier is strong on explicitly harmful examples, weak on fiction and roleplay framing, weak on distribution skew across otherwise clean rows, weak on emergent oversight resistance, and weak on a generator optimising against the classifier itself. The behavioural evaluation is weak on the first row and strong on the remaining four.</desc>
  <style>
    .eg-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .eg-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .eg-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .eg-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .eg-col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .eg-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .eg-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .eg-cellin { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .eg-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="eg-ttl" x="20" y="30">Row classifier versus behavioural eval</text>

  <text class="eg-col" x="505" y="66" text-anchor="middle">ROW CLASSIFIER</text>
  <text class="eg-col" x="755" y="66" text-anchor="middle">BEHAVIOURAL EVAL</text>

  <text class="eg-row" x="20" y="101">Explicitly harmful examples</text>
  <rect class="eg-strong" x="400" y="80" width="210" height="32" />
  <text class="eg-cellin" x="505" y="101" text-anchor="middle">Strong</text>
  <rect class="eg-weak"   x="650" y="80" width="210" height="32" />
  <text class="eg-cell"   x="755" y="101" text-anchor="middle">Weak and late</text>

  <text class="eg-row" x="20" y="149">Fiction and roleplay framing</text>
  <rect class="eg-weak"   x="400" y="128" width="210" height="32" />
  <text class="eg-cell"   x="505" y="149" text-anchor="middle">Weak</text>
  <rect class="eg-strong" x="650" y="128" width="210" height="32" />
  <text class="eg-cellin" x="755" y="149" text-anchor="middle">Strong</text>

  <text class="eg-row" x="20" y="197">Skew across clean rows</text>
  <rect class="eg-weak"   x="400" y="176" width="210" height="32" />
  <text class="eg-cell"   x="505" y="197" text-anchor="middle">Blind by design</text>
  <rect class="eg-strong" x="650" y="176" width="210" height="32" />
  <text class="eg-cellin" x="755" y="197" text-anchor="middle">Strong</text>

  <text class="eg-row" x="20" y="245">Emergent oversight resistance</text>
  <rect class="eg-weak"   x="400" y="224" width="210" height="32" />
  <text class="eg-cell"   x="505" y="245" text-anchor="middle">Weak</text>
  <rect class="eg-strong" x="650" y="224" width="210" height="32" />
  <text class="eg-cellin" x="755" y="245" text-anchor="middle">Strong</text>

  <text class="eg-row" x="20" y="293">Generator optimising on the gate</text>
  <rect class="eg-weak"   x="400" y="272" width="210" height="32" />
  <text class="eg-cell"   x="505" y="293" text-anchor="middle">Becomes a target</text>
  <rect class="eg-med"    x="650" y="272" width="210" height="32" />
  <text class="eg-cell"   x="755" y="293" text-anchor="middle">Held out, so harder</text>

  <rect class="eg-strong" x="20"  y="348" width="16" height="14" />
  <text class="eg-leg" x="44"  y="360" text-anchor="start">Catches it</text>
  <rect class="eg-med"    x="150" y="348" width="16" height="14" />
  <text class="eg-leg" x="174" y="360" text-anchor="start">Partial</text>
  <rect class="eg-weak"   x="260" y="348" width="16" height="14" />
  <text class="eg-leg" x="284" y="360" text-anchor="start">Misses it</text>
</svg>
