<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="rgt rgd">
  <title id="rgt">Where the row gate sits and where the missing gate belongs</title>
  <desc id="rgd">A pipeline running left to right. A generator agent produces a dataset of up to five thousand examples. A row-level monitor scores each row and rejects the dataset only if more than ten percent of rows are flagged, so a dataset carrying its effect in framing passes. Fine-tuning then produces a model, and the behaviour appears only at that point. A second gate, drawn as the hero box below the fine-tune step, is a post-training behavioural evaluation on the trained model — the measurement that would have caught it.</desc>
  <style>
    .rg-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .rg-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .rg-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .rg-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .rg-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .rg-sub  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .65; }
    .rg-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .rg-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#rgarr); }
  </style>
  <defs>
    <marker id="rgarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="rg-ttl" x="20" y="30">The gate that ran, and the gate that was missing</text>

  <rect class="rg-box" x="20" y="60" width="180" height="76" rx="8" />
  <text class="rg-lab" x="110" y="88" text-anchor="middle">Generator agent</text>
  <text class="rg-sub" x="110" y="108" text-anchor="middle">up to 5,000 rows</text>
  <text class="rg-sub" x="110" y="126" text-anchor="middle">per dataset</text>

  <rect class="rg-adj" x="250" y="60" width="180" height="76" rx="8" />
  <text class="rg-lab" x="340" y="88" text-anchor="middle">Row-level monitor</text>
  <text class="rg-sub" x="340" y="108" text-anchor="middle">rejects if &gt;10% of</text>
  <text class="rg-sub" x="340" y="126" text-anchor="middle">rows are flagged</text>

  <rect class="rg-box" x="480" y="60" width="180" height="76" rx="8" />
  <text class="rg-lab" x="570" y="88" text-anchor="middle">Fine-tune</text>
  <text class="rg-sub" x="570" y="108" text-anchor="middle">behaviour appears</text>
  <text class="rg-sub" x="570" y="126" text-anchor="middle">only here</text>

  <rect class="rg-box" x="710" y="60" width="170" height="76" rx="8" />
  <text class="rg-lab" x="795" y="96" text-anchor="middle">Deployed</text>
  <text class="rg-lab" x="795" y="116" text-anchor="middle">model</text>

  <path class="rg-arr" d="M 200 98 L 245 98" />
  <path class="rg-arr" d="M 430 98 L 475 98" />
  <path class="rg-arr" d="M 660 98 L 705 98" />

  <text class="rg-sub" x="250" y="180">rejected datasets</text>
  <path class="rg-arr" d="M 340 196 L 340 240" />
  <rect class="rg-box" x="250" y="245" width="180" height="48" rx="8" />
  <text class="rg-lab" x="340" y="274" text-anchor="middle">regenerate, retry</text>

  <path class="rg-arr" d="M 250 269 L 115 269 L 115 142" />

  <rect class="rg-hero" x="480" y="245" width="180" height="90" rx="8" />
  <text class="rg-inv" x="570" y="273" text-anchor="middle">The missing gate</text>
  <text class="rg-inv" x="570" y="295" text-anchor="middle">behavioural eval</text>
  <text class="rg-inv" x="570" y="317" text-anchor="middle">on the trained model</text>

  <path class="rg-arr" d="M 570 142 L 570 240" />

  <text class="rg-sub" x="20" y="400">The row monitor scores examples. The defect is a property of the distribution.</text>
  <text class="rg-sub" x="20" y="422">Removing every flagged row did not remove the effect — so the unit of review was wrong,</text>
  <text class="rg-sub" x="20" y="444">not the threshold.</text>
</svg>
