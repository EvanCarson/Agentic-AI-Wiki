<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Where each framework commits</title>
  <desc id="d">A four by four matrix. Rows are Spring AI, LangChain4j, Eino and Rig. Columns are runtime freedom, official MCP SDK conformance tier for the framework's language, in-process orchestration, and how close the surrounding evaluation and optimisation ecosystem is. Spring AI is weak on runtime freedom because it requires Spring Boot 4, sits on the Tier 2 Java SDK which is maintained in collaboration with Spring AI itself, is strong on in-process orchestration through the Spring programming model, and medium on ecosystem proximity. LangChain4j is strong on runtime freedom because it ships starters for Spring Boot 3.5 and above as well as Boot 4 and runs under Quarkus, Micronaut or plain Java, sits on the same Tier 2 Java SDK, is medium on in-process orchestration, and medium on ecosystem proximity. Eino is strong on runtime freedom as an ordinary Go library, sits on the Tier 1 Go SDK maintained in collaboration with Google, is strong on in-process orchestration through its graph and workflow model, and weak on ecosystem proximity. Rig is strong on runtime freedom as an ordinary Rust crate that also compiles to WebAssembly, sits on the Rust SDK that was promoted to Tier 1 in August 2026, is medium on in-process orchestration, and weak on ecosystem proximity.</desc>
  <style>
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .8; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .key    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .8; }
    .s      { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .m      { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .w      { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
  </style>

  <text class="head" x="24" y="34">Where each one commits</text>

  <text class="col" x="204" y="70">RUNTIME FREEDOM</text>
  <text class="col" x="368" y="70">MCP SDK TIER</text>
  <text class="col" x="532" y="70">IN-PROCESS ORCHESTRATION</text>
  <text class="col" x="732" y="70">ECOSYSTEM NEARBY</text>

  <text class="label" x="24" y="108">Spring AI</text>
  <rect class="w" x="204" y="86" width="156" height="34" />
  <text class="cell" x="216" y="108">Weak · Boot 4 only</text>
  <rect class="m" x="368" y="86" width="156" height="34" />
  <text class="cell" x="380" y="108">Tier 2 · Java</text>
  <rect class="s" x="532" y="86" width="156" height="34" />
  <text class="cell-inv" x="544" y="108">Strong · Spring model</text>
  <rect class="m" x="696" y="86" width="156" height="34" />
  <text class="cell" x="708" y="108">Medium</text>

  <text class="label" x="24" y="164">LangChain4j</text>
  <rect class="s" x="204" y="142" width="156" height="34" />
  <text class="cell-inv" x="216" y="164">Strong · Boot 3.5+ or 4</text>
  <rect class="m" x="368" y="142" width="156" height="34" />
  <text class="cell" x="380" y="164">Tier 2 · Java</text>
  <rect class="m" x="532" y="142" width="156" height="34" />
  <text class="cell" x="544" y="164">Medium · compose it</text>
  <rect class="m" x="696" y="142" width="156" height="34" />
  <text class="cell" x="708" y="164">Medium</text>

  <text class="label" x="24" y="220">Eino</text>
  <rect class="s" x="204" y="198" width="156" height="34" />
  <text class="cell-inv" x="216" y="220">Strong · a Go library</text>
  <rect class="s" x="368" y="198" width="156" height="34" />
  <text class="cell-inv" x="380" y="220">Tier 1 · Go</text>
  <rect class="s" x="532" y="198" width="156" height="34" />
  <text class="cell-inv" x="544" y="220">Strong · graph + ADK</text>
  <rect class="w" x="696" y="198" width="156" height="34" />
  <text class="cell" x="708" y="220">Weak</text>

  <text class="label" x="24" y="276">Rig</text>
  <rect class="s" x="204" y="254" width="156" height="34" />
  <text class="cell-inv" x="216" y="276">Strong · crate, WASM</text>
  <rect class="s" x="368" y="254" width="156" height="34" />
  <text class="cell-inv" x="380" y="276">Tier 1 · Rust</text>
  <rect class="m" x="532" y="254" width="156" height="34" />
  <text class="cell" x="544" y="276">Medium · pipelines</text>
  <rect class="w" x="696" y="254" width="156" height="34" />
  <text class="cell" x="708" y="276">Weak</text>

  <line x1="24" y1="314" x2="876" y2="314" stroke="var(--ink)" stroke-width="1" opacity=".2" />
  <rect class="s" x="24" y="332" width="18" height="18" />
  <text class="key" x="50" y="346">Strong</text>
  <rect class="m" x="120" y="332" width="18" height="18" />
  <text class="key" x="146" y="346">Medium</text>
  <rect class="w" x="228" y="332" width="18" height="18" />
  <text class="key" x="254" y="346">Weak</text>
  <text class="key" x="24" y="372">Strong is not better. Spring AI's weak runtime freedom is the same decision as its strong integration with the platform.</text>
</svg>
