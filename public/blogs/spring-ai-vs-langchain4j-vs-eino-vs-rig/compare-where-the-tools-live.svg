<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Where an agent's tool integrations live, then and now</title>
  <desc id="d">Three columns showing how the integration question changed. In the first column, the in-process era, every connector was an SDK wrapper compiled into the agent, so the count of available integrations was a property of the language and leaving Python meant leaving the catalogue behind. In the second column, drawn as the accent column, tools live behind Model Context Protocol servers reached over HTTP, so the same catalogue is available to any client that speaks the protocol and integration breadth stops being a language property. The third column names what did not move: prompt optimisers, evaluation harnesses and reinforcement-learning environment tooling are still Python libraries that import your agent rather than call it, so they do not cross the boundary the way tools did.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .tag-inv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--paper); opacity: .85; }
  </style>

  <rect class="box" x="24" y="36" width="266" height="228" />
  <text class="head" x="44" y="66">Compiled in</text>
  <text class="sub" x="44" y="100">one SDK wrapper per service</text>
  <text class="sub" x="44" y="124">shipped inside the agent</text>
  <text class="sub" x="44" y="148">catalogue size = library count</text>
  <line x1="44" y1="176" x2="270" y2="176" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="44" y="200">THE 2024 SHAPE</text>
  <text class="label" x="44" y="228">leaving Python meant</text>
  <text class="label" x="44" y="248">leaving the catalogue</text>

  <rect class="hero" x="314" y="36" width="266" height="228" />
  <text class="head-inv" x="334" y="66">Behind a protocol</text>
  <text class="sub-inv" x="334" y="100">tools run as MCP servers</text>
  <text class="sub-inv" x="334" y="124">reached over ordinary HTTP</text>
  <text class="sub-inv" x="334" y="148">any conforming client, any language</text>
  <line x1="334" y1="176" x2="560" y2="176" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag-inv" x="334" y="200">THE 2026 SHAPE</text>
  <text class="label-inv" x="334" y="228">integration breadth stopped</text>
  <text class="label-inv" x="334" y="248">being a language property</text>

  <rect class="box" x="604" y="36" width="266" height="228" />
  <text class="head" x="624" y="66">Still in-process</text>
  <text class="sub" x="624" y="100">prompt optimisers</text>
  <text class="sub" x="624" y="124">eval harnesses</text>
  <text class="sub" x="624" y="148">RL environment tooling</text>
  <line x1="624" y1="176" x2="850" y2="176" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="624" y="200">WHAT DID NOT MOVE</text>
  <text class="label" x="624" y="228">these import your agent</text>
  <text class="label" x="624" y="248">rather than call it</text>
</svg>
