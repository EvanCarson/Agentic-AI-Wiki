<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">What each framework demands of the runtime you already operate</title>
  <desc id="d">A diagram in two halves. The left half shows the JVM path: an existing application on Spring Boot 3.x can adopt LangChain4j directly, because LangChain4j ships starters for both Boot 3.5 and above and Boot 4, and also runs under Quarkus, Micronaut or plain Java. Adopting Spring AI 2.0 from the same starting point first requires a platform migration to Spring Boot 4.0 or 4.1, Spring Framework 7 and Jackson 3, drawn as a gate the application must pass through. The right half shows the Go and Rust path: Eino and Rig are adopted by adding a library to a service that is already built as a single deployed binary, with no framework generation to cross, and the cost sits elsewhere — a smaller surrounding ecosystem for evaluation and optimisation tooling.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .gate   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 5 4; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .grp    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="grp" x="24" y="28">THE JVM PATH</text>
  <line x1="24" y1="38" x2="440" y2="38" stroke="var(--ink)" stroke-width="1" opacity=".2" />

  <rect class="box" x="24" y="58" width="180" height="72" />
  <text class="label" x="40" y="88">Your service today</text>
  <text class="sub" x="40" y="110">Spring Boot 3.x</text>

  <path class="arrow" d="M 204 82 L 268 82" />
  <rect class="adj" x="272" y="52" width="168" height="60" />
  <text class="label" x="288" y="78">LangChain4j</text>
  <text class="sub" x="288" y="98">Boot 3.5+ or Boot 4 starter</text>

  <path class="arrow" d="M 204 106 L 268 168" />
  <rect class="gate" x="272" y="140" width="168" height="76" />
  <text class="label" x="288" y="166">Migrate the platform</text>
  <text class="sub" x="288" y="186">Boot 4.0 / 4.1, Framework 7</text>
  <text class="sub" x="288" y="204">Jackson 3</text>

  <path class="arrow" d="M 356 216 L 356 254" />
  <rect class="hero" x="272" y="258" width="168" height="60" />
  <text class="label-inv" x="288" y="284">Spring AI 2.0</text>
  <text class="sub-inv" x="288" y="304">GA 12 June 2026</text>

  <rect class="box" x="24" y="150" width="180" height="120" />
  <text class="label" x="40" y="178">Not on Boot at all?</text>
  <text class="sub" x="40" y="202">Quarkus</text>
  <text class="sub" x="40" y="222">Micronaut</text>
  <text class="sub" x="40" y="242">plain Java</text>
  <path class="arrow" d="M 204 190 L 268 100" />

  <text class="sub" x="24" y="348">The agent library is a dependency.</text>
  <text class="sub" x="24" y="368">The framework generation underneath it is a programme of work,</text>
  <text class="sub" x="24" y="388">and only one of these two paths asks for it.</text>

  <line x1="470" y1="20" x2="470" y2="440" stroke="var(--ink)" stroke-width="1" opacity=".2" />

  <text class="grp" x="500" y="28">THE GO AND RUST PATH</text>
  <line x1="500" y1="38" x2="876" y2="38" stroke="var(--ink)" stroke-width="1" opacity=".2" />

  <rect class="box" x="500" y="58" width="180" height="72" />
  <text class="label" x="516" y="88">Your service today</text>
  <text class="sub" x="516" y="110">one deployed binary</text>

  <path class="arrow" d="M 680 94 L 716 94" />
  <rect class="adj" x="720" y="58" width="156" height="72" />
  <text class="label" x="736" y="88">Eino / Rig</text>
  <text class="sub" x="736" y="110">add a library</text>

  <rect class="box" x="500" y="166" width="376" height="118" />
  <text class="head" x="520" y="196">No generation to cross</text>
  <text class="sub" x="520" y="222">No container, no framework major, no serialisation swap.</text>
  <text class="sub" x="520" y="244">Eino and Rig both target a service that already exists</text>
  <text class="sub" x="520" y="266">and both ship graph or pipeline orchestration in-process.</text>

  <rect class="hero" x="500" y="308" width="376" height="94" />
  <text class="label-inv" x="520" y="338">The bill arrives somewhere else</text>
  <text class="sub-inv" x="520" y="364">Prompt optimisers, eval harnesses and RL environment</text>
  <text class="sub-inv" x="520" y="386">tooling still land in Python first, and stay there longest.</text>
</svg>
