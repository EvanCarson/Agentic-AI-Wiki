<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where an inference hook sits relative to a network DLP proxy</title>
  <desc id="d">Two enforcement points compared. A corporate network proxy inspects outbound HTTPS from managed devices and misses traffic from unmanaged devices, mobile apps and server-side agents. An inference hook sits inside the provider, receiving every Claude Enterprise prompt regardless of network path and returning an allow or deny verdict before the model sees it. A third path — API, Bedrock and Vertex traffic — reaches the model through neither control.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper); text-anchor: middle; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; text-anchor: middle; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .88; text-anchor: middle; }
    .head   { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .arrow-gap { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 6 4; opacity: .55; marker-end: url(#arr); }
    .tag    { font-family: var(--font-mono), monospace; font-size: 10px; fill: var(--ink); opacity: .65; }
    .gaplab { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; font-style: italic; fill: var(--ink); opacity: .7; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="450" y="26">Two enforcement points, three paths</text>

  <rect class="box" x="30" y="58" width="182" height="58" />
  <text class="label" x="121" y="82">Managed laptop</text>
  <text class="sub" x="121" y="100">Claude Enterprise chat</text>

  <rect class="box" x="30" y="150" width="182" height="58" />
  <text class="label" x="121" y="174">Phone, home machine</text>
  <text class="sub" x="121" y="192">Off the corporate network</text>

  <rect class="box" x="30" y="326" width="182" height="70" />
  <text class="label" x="121" y="352">Your agent fleet</text>
  <text class="sub" x="121" y="370">API key, Bedrock, Vertex</text>
  <text class="sub" x="121" y="386">Runs unattended</text>

  <rect class="adj" x="268" y="58" width="164" height="58" />
  <text class="label" x="350" y="82">Network DLP proxy</text>
  <text class="sub" x="350" y="100">Sees managed traffic only</text>

  <rect class="hero" x="500" y="150" width="176" height="70" />
  <text class="label-inv" x="588" y="176">Inference hook</text>
  <text class="sub-inv" x="588" y="194">Your DLP server returns</text>
  <text class="sub-inv" x="588" y="210">allow or deny</text>

  <rect class="box" x="732" y="150" width="140" height="70" />
  <text class="label" x="802" y="182">Claude</text>
  <text class="sub" x="802" y="200">The model</text>

  <path class="arrow" d="M 212 87 L 262 87" />
  <path class="arrow" d="M 432 87 L 560 87 L 560 144" />
  <path class="arrow" d="M 212 179 L 494 179" />
  <path class="arrow" d="M 676 185 L 726 185" />

  <path class="arrow-gap" d="M 212 361 L 700 361 L 780 361 L 780 226" />
  <text class="gaplab" x="238" y="348">out of scope at launch — reaches the model with neither control in the path</text>

  <text class="tag" x="268" y="132">covers: one path</text>
  <text class="tag" x="500" y="240">covers: every Enterprise surface — chat, Code, Cowork</text>
  <text class="tag" x="500" y="256">prompt-side only; response-side is a later event</text>

  <rect class="box" x="268" y="424" width="604" height="54" />
  <text class="label" x="570" y="446">The gap is not the laptop. It is the fleet.</text>
  <text class="sub" x="570" y="464">Autonomous agents move the most data and sit outside both enforcement points.</text>
</svg>
