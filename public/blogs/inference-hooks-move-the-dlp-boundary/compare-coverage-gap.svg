<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What each enforcement point covers</title>
  <desc id="d">Five kinds of traffic — Enterprise chat on a managed device, Enterprise chat off-network, Claude Code and Cowork sessions, direct Claude Platform API calls, and Claude running on Bedrock or Vertex — compared across three controls: a network DLP proxy, inference hooks, and model responses. Inference hooks cover the first three and none of the last two; response-side inspection covers nothing at launch.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-head { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .mid    { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .weak   { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .cv     { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .cv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--paper, #fff); text-anchor: middle; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .7; }
  </style>

  <text class="chart-title" x="450" y="22">The two rows that matter are the two nothing covers</text>

  <text class="col-head" x="420" y="46">Network DLP</text><text class="col-head" x="420" y="59">proxy</text>
  <text class="col-head" x="590" y="46">Inference</text><text class="col-head" x="590" y="59">hooks</text>
  <text class="col-head" x="760" y="46">Model</text><text class="col-head" x="760" y="59">responses</text>

  <text class="row-head" x="24" y="89">Enterprise chat, managed device</text>
  <rect class="strong" x="350" y="70" width="140" height="28" rx="5" /><text class="cv-inv" x="420" y="89">Covered</text>
  <rect class="strong" x="520" y="70" width="140" height="28" rx="5" /><text class="cv-inv" x="590" y="89">Covered</text>
  <rect class="weak" x="690" y="70" width="140" height="28" rx="5" /><text class="cv" x="760" y="89">Later event</text>

  <text class="row-head" x="24" y="123">Enterprise chat, off-network</text>
  <rect class="weak" x="350" y="104" width="140" height="28" rx="5" /><text class="cv" x="420" y="123">Missed</text>
  <rect class="strong" x="520" y="104" width="140" height="28" rx="5" /><text class="cv-inv" x="590" y="123">Covered</text>
  <rect class="weak" x="690" y="104" width="140" height="28" rx="5" /><text class="cv" x="760" y="123">Later event</text>

  <text class="row-head" x="24" y="157">Claude Code and Cowork sessions</text>
  <rect class="mid" x="350" y="138" width="140" height="28" rx="5" /><text class="cv" x="420" y="157">Partly</text>
  <rect class="strong" x="520" y="138" width="140" height="28" rx="5" /><text class="cv-inv" x="590" y="157">Covered</text>
  <rect class="weak" x="690" y="138" width="140" height="28" rx="5" /><text class="cv" x="760" y="157">Later event</text>

  <text class="row-head" x="24" y="191">Claude Platform API — your agents</text>
  <rect class="mid" x="350" y="172" width="140" height="28" rx="5" /><text class="cv" x="420" y="191">If server-side</text>
  <rect class="weak" x="520" y="172" width="140" height="28" rx="5" /><text class="cv" x="590" y="191">Out of scope</text>
  <rect class="weak" x="690" y="172" width="140" height="28" rx="5" /><text class="cv" x="760" y="191">Out of scope</text>

  <text class="row-head" x="24" y="225">Claude on Bedrock or Vertex</text>
  <rect class="weak" x="350" y="206" width="140" height="28" rx="5" /><text class="cv" x="420" y="225">Cloud-internal</text>
  <rect class="weak" x="520" y="206" width="140" height="28" rx="5" /><text class="cv" x="590" y="225">Out of scope</text>
  <rect class="weak" x="690" y="206" width="140" height="28" rx="5" /><text class="cv" x="760" y="225">Out of scope</text>

  <text class="note" x="24" y="264">Inference hooks close the gap your proxy always had on the surfaces employees type into.</text>
  <text class="note" x="24" y="284">The bottom two rows are where the volume is, and they still need controls you build yourself.</text>
</svg>
