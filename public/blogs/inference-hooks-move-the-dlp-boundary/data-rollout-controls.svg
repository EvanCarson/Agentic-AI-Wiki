<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">The rollout ladder for an inline inspection hook</title>
  <desc id="d">A four-rung ladder for deploying an inline DLP hook: shadow mode observing verdicts on live traffic without blocking, a small enforcement percentage, role-based exclusions for teams that would be broken by a false positive, and finally full enforcement. Alongside each rung is the question it answers and the number that must be true before advancing.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .rung   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 7; ry: 7; }
    .rung-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 7; ry: 7; }
    .rung-adj { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 7; ry: 7; }
    .step   { font-family: var(--font-mono), monospace; font-size: 10.5px; fill: var(--ink); opacity: .6; letter-spacing: .05em; }
    .lab    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink); }
    .lab-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--paper); }
    .det    { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); opacity: .72; }
    .det-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper); opacity: .88; }
    .gate   { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; font-style: italic; fill: var(--ink); opacity: .68; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="chart-title" x="450" y="24">Every rung answers one question before you can climb</text>

  <text class="step" x="24" y="64">RUNG 1</text>
  <rect class="rung" x="100" y="46" width="360" height="56" />
  <text class="lab" x="120" y="70">Shadow mode</text>
  <text class="det" x="120" y="90">Verdicts computed on live traffic, nothing blocked</text>
  <text class="gate" x="484" y="70">Gate: what is your false-positive rate</text>
  <text class="gate" x="484" y="88">on a week of real prompts?</text>

  <path class="arrow" d="M 280 106 L 280 128" />

  <text class="step" x="24" y="152">RUNG 2</text>
  <rect class="rung-adj" x="100" y="134" width="360" height="56" />
  <text class="lab" x="120" y="158">Enforce on a small percentage</text>
  <text class="det" x="120" y="178">A slice of requests actually blocked</text>
  <text class="gate" x="484" y="158">Gate: does a blocked user understand</text>
  <text class="gate" x="484" y="176">what happened and what to do?</text>

  <path class="arrow" d="M 280 194 L 280 216" />

  <text class="step" x="24" y="240">RUNG 3</text>
  <rect class="rung-adj" x="100" y="222" width="360" height="56" />
  <text class="lab" x="120" y="246">Role-based exclusions</text>
  <text class="det" x="120" y="266">Carve out the teams a false positive would break</text>
  <text class="gate" x="484" y="246">Gate: is each exclusion written down,</text>
  <text class="gate" x="484" y="264">owned, and given an expiry date?</text>

  <path class="arrow" d="M 280 282 L 280 304" />

  <text class="step" x="24" y="328">RUNG 4</text>
  <rect class="rung-hero" x="100" y="310" width="360" height="56" />
  <text class="lab-inv" x="120" y="334">Full enforcement</text>
  <text class="det-inv" x="120" y="354">Every prompt inspected, every verdict binding</text>
  <text class="gate" x="484" y="334">Gate: what happens to a user when</text>
  <text class="gate" x="484" y="352">your DLP server is down?</text>

  <text class="det" x="24" y="392">Skipping rung 1 is how an inline control becomes an outage. The last gate is the one teams answer after the incident.</text>
</svg>
