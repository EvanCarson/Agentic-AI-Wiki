<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ssT ssD">
  <title id="ssT">GitHub stars (thousands), coloured by maintenance status</title>
  <desc id="ssD">Horizontal bars: Vanna 23.8 thousand stars, DB-GPT 19.9 thousand, Wren AI 17.6 thousand, Dataherald 3.6 thousand. Bars are filled by maintenance status rather than rank — DB-GPT and Wren AI are actively maintained with commits in September 2026, while Vanna was archived in March 2026 and Dataherald has not taken a commit since July 2024. The longest bar belongs to the archived project.</desc>
  <style>
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .name   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val-acc { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--accent, #d4421e); }
    .live   { fill: var(--accent, #d4421e); stroke: none; rx: 4; ry: 4; }
    .stale  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 4; ry: 4; }
    .grid   { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 5; }
    .axis   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .55; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="22">GitHub stars (thousands)</text>

  <line class="grid" x1="298" y1="52" x2="298" y2="322" />
  <line class="grid" x1="426" y1="52" x2="426" y2="322" />
  <line class="grid" x1="554" y1="52" x2="554" y2="322" />
  <line class="grid" x1="682" y1="52" x2="682" y2="322" />
  <line class="grid" x1="810" y1="52" x2="810" y2="322" />
  <text class="axis" x="298" y="340" text-anchor="middle">5</text>
  <text class="axis" x="426" y="340" text-anchor="middle">10</text>
  <text class="axis" x="554" y="340" text-anchor="middle">15</text>
  <text class="axis" x="682" y="340" text-anchor="middle">20</text>
  <text class="axis" x="810" y="340" text-anchor="middle">25</text>

  <text class="name" x="0" y="88">Vanna</text>
  <rect class="stale" x="170" y="66" width="609" height="30" />
  <text class="val" x="789" y="88">23.8</text>
  <text class="sub" x="170" y="114">Archived 29 Mar 2026 &#8212; read-only</text>

  <text class="name" x="0" y="158">DB-GPT</text>
  <rect class="live" x="170" y="136" width="509" height="30" />
  <text class="val-acc" x="689" y="158">19.9</text>
  <text class="sub" x="170" y="184">Commits through 8 Sep 2026</text>

  <text class="name" x="0" y="228">Wren AI</text>
  <rect class="live" x="170" y="206" width="451" height="30" />
  <text class="val-acc" x="631" y="228">17.6</text>
  <text class="sub" x="170" y="254">0.14.0 released 8 Sep 2026</text>

  <text class="name" x="0" y="298">Dataherald</text>
  <rect class="stale" x="170" y="276" width="92" height="30" />
  <text class="val" x="272" y="298">3.6</text>
  <text class="sub" x="170" y="324">Last commit 11 Jul 2024</text>

  <rect class="live" x="0" y="366" width="18" height="16" />
  <text class="sub" x="26" y="379">Actively maintained</text>
  <rect class="stale" x="180" y="366" width="18" height="16" />
  <text class="sub" x="206" y="379">Archived or dormant</text>
  <text class="sub" x="430" y="379">Star counts and dates read 9 September 2026.</text>
</svg>
