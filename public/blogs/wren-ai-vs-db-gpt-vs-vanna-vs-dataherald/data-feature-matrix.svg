<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmT fmD">
  <title id="fmT">Feature matrix: semantic layer, breadth, maintenance and exit cost</title>
  <desc id="fmD">A four-by-four matrix. Rows are Wren AI, DB-GPT, Vanna and Dataherald. Columns are a reviewable semantic layer, breadth beyond SQL generation, maintenance signal in 2026, and how much it costs to leave. Wren AI is strong on the semantic layer, medium on breadth, strong on maintenance and low on exit cost because MDL is portable JSON. DB-GPT is medium on the semantic layer, strong on breadth and maintenance, and medium on exit cost. Vanna is weak on the semantic layer, weak on maintenance as an archived repository, and medium on exit cost because the accumulated corpus does not travel. Dataherald is medium on the semantic layer through golden SQL examples, weak on breadth and maintenance, and high on exit cost.</desc>
  <style>
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hdr    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .weak   { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; rx: 6; ry: 6; }
    .med    { fill: var(--accent-soft); stroke: var(--border-soft); stroke-width: 1; rx: 6; ry: 6; }
    .strong { fill: var(--accent, #d4421e); stroke: none; rx: 6; ry: 6; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Where each project leans hardest</text>

  <text class="hdr" x="292" y="52" text-anchor="middle">Reviewable</text>
  <text class="hdr" x="292" y="68" text-anchor="middle">semantic layer</text>
  <text class="hdr" x="457" y="52" text-anchor="middle">Breadth beyond</text>
  <text class="hdr" x="457" y="68" text-anchor="middle">SQL</text>
  <text class="hdr" x="622" y="52" text-anchor="middle">Maintenance</text>
  <text class="hdr" x="622" y="68" text-anchor="middle">signal, 2026</text>
  <text class="hdr" x="787" y="52" text-anchor="middle">Cost of</text>
  <text class="hdr" x="787" y="68" text-anchor="middle">leaving</text>

  <text class="lbl" x="0" y="114">Wren AI</text>
  <rect class="strong" x="215" y="88" width="155" height="42" />
  <text class="cell-inv" x="292" y="114" text-anchor="middle">MDL, versioned</text>
  <rect class="med" x="380" y="88" width="155" height="42" />
  <text class="cell" x="457" y="114" text-anchor="middle">BI-shaped</text>
  <rect class="strong" x="545" y="88" width="155" height="42" />
  <text class="cell-inv" x="622" y="114" text-anchor="middle">Weekly releases</text>
  <rect class="strong" x="710" y="88" width="155" height="42" />
  <text class="cell-inv" x="787" y="114" text-anchor="middle">Low: JSON travels</text>

  <text class="lbl" x="0" y="184">DB-GPT</text>
  <rect class="med" x="215" y="158" width="155" height="42" />
  <text class="cell" x="292" y="184" text-anchor="middle">Flows + knowledge</text>
  <rect class="strong" x="380" y="158" width="155" height="42" />
  <text class="cell-inv" x="457" y="184" text-anchor="middle">SQL, Python, RAG</text>
  <rect class="strong" x="545" y="158" width="155" height="42" />
  <text class="cell-inv" x="622" y="184" text-anchor="middle">Daily commits</text>
  <rect class="med" x="710" y="158" width="155" height="42" />
  <text class="cell" x="787" y="184" text-anchor="middle">Medium</text>

  <text class="lbl" x="0" y="254">Vanna</text>
  <rect class="weak" x="215" y="228" width="155" height="42" />
  <text class="cell" x="292" y="254" text-anchor="middle">None by design</text>
  <rect class="weak" x="380" y="228" width="155" height="42" />
  <text class="cell" x="457" y="254" text-anchor="middle">SQL only</text>
  <rect class="weak" x="545" y="228" width="155" height="42" />
  <text class="cell" x="622" y="254" text-anchor="middle">Archived</text>
  <rect class="med" x="710" y="228" width="155" height="42" />
  <text class="cell" x="787" y="254" text-anchor="middle">Corpus stays put</text>

  <text class="lbl" x="0" y="324">Dataherald</text>
  <rect class="med" x="215" y="298" width="155" height="42" />
  <text class="cell" x="292" y="324" text-anchor="middle">Golden SQL</text>
  <rect class="weak" x="380" y="298" width="155" height="42" />
  <text class="cell" x="457" y="324" text-anchor="middle">SQL only</text>
  <rect class="weak" x="545" y="298" width="155" height="42" />
  <text class="cell" x="622" y="324" text-anchor="middle">Dormant since 2024</text>
  <rect class="weak" x="710" y="298" width="155" height="42" />
  <text class="cell" x="787" y="324" text-anchor="middle">High: you own it</text>

  <rect class="weak" x="0" y="366" width="18" height="18" />
  <text class="sub" x="26" y="380">Weak</text>
  <rect class="med" x="100" y="366" width="18" height="18" />
  <text class="sub" x="126" y="380">Medium</text>
  <rect class="strong" x="210" y="366" width="18" height="18" />
  <text class="sub" x="236" y="380">Strong</text>
  <text class="sub" x="430" y="380">Exit cost is scored inverted: strong means cheap to leave.</text>
</svg>
