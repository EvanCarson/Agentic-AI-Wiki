<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="ft fd">
  <title id="ft">Three stages of a monitor and how each one fails</title>
  <desc id="fd">Three columns — detector, alert path and human rotation — compared on how loudly each fails, whether routine testing covers it, and how readily a coding agent edits it. The detector fails loudly and is already covered by tests; the two stages after it fail silently and are rarely asserted on.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .rule   { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>

  <rect class="hero" x="40" y="40" width="240" height="44" />
  <text class="label-inv" x="160" y="68" text-anchor="middle">Detector</text>

  <rect class="adj" x="330" y="40" width="240" height="44" />
  <text class="label" x="450" y="68" text-anchor="middle">Alert path</text>

  <rect class="box" x="620" y="40" width="240" height="44" />
  <text class="label" x="740" y="68" text-anchor="middle">Human rotation</text>

  <path class="rule" d="M 40 104 L 860 104" />

  <text class="label" x="160" y="128" text-anchor="middle">Fails loudly</text>
  <text class="sub" x="160" y="148" text-anchor="middle">throws, job red, flatline</text>
  <text class="label" x="450" y="128" text-anchor="middle">Fails silently</text>
  <text class="sub" x="450" y="148" text-anchor="middle">no error, dashboard green</text>
  <text class="label" x="740" y="128" text-anchor="middle">Fails silently</text>
  <text class="sub" x="740" y="148" text-anchor="middle">a quiet week looks the same</text>

  <path class="rule" d="M 40 168 L 860 168" />

  <text class="label" x="160" y="192" text-anchor="middle">Tested by default</text>
  <text class="sub" x="160" y="212" text-anchor="middle">accuracy is in your evals</text>
  <text class="label" x="450" y="192" text-anchor="middle">Rarely tested</text>
  <text class="sub" x="450" y="212" text-anchor="middle">config, not code</text>
  <text class="label" x="740" y="192" text-anchor="middle">Rarely tested</text>
  <text class="sub" x="740" y="212" text-anchor="middle">no assertion anywhere</text>

  <path class="rule" d="M 40 236 L 860 236" />

  <text class="label" x="160" y="262" text-anchor="middle">Agent seldom edits it</text>
  <text class="label" x="450" y="262" text-anchor="middle">Agent edits it freely</text>
  <text class="label" x="740" y="262" text-anchor="middle">Owned outside the repo</text>

  <text class="sub" x="450" y="290" text-anchor="middle">Only the first column is covered by the tests you already run.</text>
</svg>
