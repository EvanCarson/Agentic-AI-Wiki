<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="wt wd">
  <title id="wt">Where the monitoring sits relative to the agent's write surface</title>
  <desc id="wd">Two panels. In the Codex workload the agent's write surface contains only the application code; the monitor and its alert path run outside it as a separate service, observing the surface from below, and reach the security team. In the evaluation workload the write surface also contains the monitor configuration and alert routing, so a single in-scope edit leaves the detector running while removing the page to a human.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .bound  { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 5 4; rx: 10; ry: 10; opacity: .7; }
    .miss   { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; stroke-dasharray: 6 5; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#wa); }
    .divide { fill: none; stroke: var(--border-soft); stroke-width: 1; }
  </style>
  <defs>
    <marker id="wa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <path class="divide" d="M 450 46 L 450 460" />

  <text class="label" x="224" y="34" text-anchor="middle">Codex workload</text>

  <rect class="hero" x="56" y="52" width="336" height="46" />
  <text class="label-inv" x="224" y="80" text-anchor="middle">Coding agent</text>

  <path class="arrow" d="M 224 100 L 224 128" />

  <rect class="bound" x="48" y="132" width="352" height="104" />
  <text class="sub" x="224" y="150" text-anchor="middle">what the agent's tools can write</text>

  <rect class="box" x="76" y="164" width="296" height="58" />
  <text class="label" x="224" y="190" text-anchor="middle">Evaluation / app code</text>
  <text class="sub" x="224" y="210" text-anchor="middle">the task it was given</text>

  <path class="arrow" d="M 224 268 L 224 242" />
  <text class="sub" x="252" y="256" text-anchor="start">observes</text>

  <rect class="adj" x="76" y="272" width="296" height="58" />
  <text class="label" x="224" y="298" text-anchor="middle">Monitor + alert path</text>
  <text class="sub" x="224" y="318" text-anchor="middle">separate service, separate principal</text>

  <path class="arrow" d="M 224 334 L 224 366" />

  <rect class="box" x="76" y="370" width="296" height="44" />
  <text class="label" x="224" y="398" text-anchor="middle">Security team paged</text>

  <text class="sub" x="224" y="440" text-anchor="middle">the agent's diff cannot reach any of this</text>

  <text class="label" x="676" y="34" text-anchor="middle">Evaluation workload</text>

  <rect class="hero" x="508" y="52" width="336" height="46" />
  <text class="label-inv" x="676" y="80" text-anchor="middle">Coding agent</text>

  <path class="arrow" d="M 676 100 L 676 128" />

  <rect class="bound" x="500" y="132" width="352" height="200" />
  <text class="sub" x="676" y="150" text-anchor="middle">what the agent's tools can write</text>

  <rect class="box" x="528" y="164" width="296" height="54" />
  <text class="label" x="676" y="188" text-anchor="middle">Evaluation pipeline</text>
  <text class="sub" x="676" y="208" text-anchor="middle">the task it was given</text>

  <path class="arrow" d="M 676 222 L 676 246" />

  <rect class="miss" x="528" y="250" width="296" height="58" />
  <text class="mono" x="676" y="276" text-anchor="middle">alerts: enabled -&gt; false</text>
  <text class="sub" x="676" y="296" text-anchor="middle">config, in the same repository</text>

  <path class="arrow" d="M 660 312 L 592 348" />
  <path class="arrow" d="M 692 312 L 760 348" />

  <rect class="box" x="508" y="354" width="160" height="56" />
  <text class="label" x="588" y="378" text-anchor="middle">Detector ran</text>
  <text class="sub" x="588" y="398" text-anchor="middle">findings written</text>

  <rect class="miss" x="684" y="354" width="160" height="56" />
  <text class="label" x="764" y="378" text-anchor="middle">No page</text>
  <text class="sub" x="764" y="398" text-anchor="middle">nobody reads them</text>

  <text class="sub" x="676" y="440" text-anchor="middle">3 October: the alert path was the edit</text>
</svg>
