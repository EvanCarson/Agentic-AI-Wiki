<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="td tdd">
  <title id="td">What changes on each of the three dates</title>
  <desc id="tdd">A matrix of three rows against three dates. From 24 November 2026 the Workspace MCP servers and gwscli are generally available on the free Standard tier and direct REST calls still work on any tier. From 1 February 2027 agents calling REST directly are limited to Standard quotas whatever tier the project holds, while MCP and CLI traffic can use any tier bought. From 1 April 2027 usage above the daily free allowance is billed, and projects that have not moved to Scaled revert to Standard limits.</desc>
  <style>
    .td-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .td-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .td-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .td-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .td-col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .td-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .td-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .td-cellin { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .td-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="td-ttl" x="20" y="30">The ceiling lands in February; the invoice arrives in April</text>

  <text class="td-col" x="350" y="66" text-anchor="middle">24 NOV 2026</text>
  <text class="td-col" x="560" y="66" text-anchor="middle">1 FEB 2027</text>
  <text class="td-col" x="775" y="66" text-anchor="middle">1 APR 2027</text>

  <text class="td-row" x="20" y="103">MCP servers / gwscli</text>
  <rect class="td-strong" x="250" y="80" width="200" height="36" />
  <text class="td-cellin" x="350" y="103" text-anchor="middle">GA, Standard free</text>
  <rect class="td-strong" x="460" y="80" width="200" height="36" />
  <text class="td-cellin" x="560" y="103" text-anchor="middle">Any tier you buy</text>
  <rect class="td-med" x="670" y="80" width="210" height="36" />
  <text class="td-cell" x="775" y="103" text-anchor="middle">Billed above free</text>

  <text class="td-row" x="20" y="159">REST API, direct</text>
  <rect class="td-med" x="250" y="136" width="200" height="36" />
  <text class="td-cell" x="350" y="159" text-anchor="middle">Works, any tier</text>
  <rect class="td-weak" x="460" y="136" width="200" height="36" />
  <text class="td-cell" x="560" y="159" text-anchor="middle">Standard cap only</text>
  <rect class="td-weak" x="670" y="136" width="210" height="36" />
  <text class="td-cell" x="775" y="159" text-anchor="middle">Standard cap only</text>

  <text class="td-row" x="20" y="215">Usage billing</text>
  <rect class="td-weak" x="250" y="192" width="200" height="36" />
  <text class="td-cell" x="350" y="215" text-anchor="middle">No charge</text>
  <rect class="td-weak" x="460" y="192" width="200" height="36" />
  <text class="td-cell" x="560" y="215" text-anchor="middle">No charge</text>
  <rect class="td-strong" x="670" y="192" width="210" height="36" />
  <text class="td-cellin" x="775" y="215" text-anchor="middle">Charges begin</text>

  <text class="td-row" x="20" y="271">Addendum terms</text>
  <rect class="td-strong" x="250" y="248" width="200" height="36" />
  <text class="td-cellin" x="350" y="271" text-anchor="middle">In force</text>
  <rect class="td-strong" x="460" y="248" width="200" height="36" />
  <text class="td-cellin" x="560" y="271" text-anchor="middle">In force</text>
  <rect class="td-strong" x="670" y="248" width="210" height="36" />
  <text class="td-cellin" x="775" y="271" text-anchor="middle">In force</text>

  <rect class="td-strong" x="20" y="306" width="16" height="13" />
  <text class="td-leg" x="44" y="317">applies fully</text>
  <rect class="td-med" x="220" y="306" width="16" height="13" />
  <text class="td-leg" x="244" y="317">applies with a cost</text>
  <rect class="td-weak" x="460" y="306" width="16" height="13" />
  <text class="td-leg" x="484" y="317">capped or not yet</text>
</svg>
