<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="tp tpd">
  <title id="tp">Two paths to Workspace data, one of them metered</title>
  <desc id="tpd">An agent can reach Gmail, Drive, Docs, Calendar, Chat and Tasks either through the Google-hosted Workspace MCP servers and the gwscli CLI, or by calling the Workspace REST APIs directly. Both paths reach the same data. The MCP and CLI path is eligible for the Standard free tier or the paid Scaled tier, with billing above the daily free allowance from 1 April 2027. From 1 February 2027 the direct REST path is limited to Standard tier quotas regardless of which tier the project has bought.</desc>
  <style>
    .tp-hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .tp-adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .tp-box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .tp-ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .tp-lab   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .tp-labi  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .tp-sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .tp-subi  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .tp-tag   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .tp-arr   { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#tparr); }
  </style>
  <defs>
    <marker id="tparr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="tp-ttl" x="20" y="30">Nothing was closed. One path got a ceiling.</text>

  <rect class="tp-box" x="330" y="58" width="240" height="56" />
  <text class="tp-lab" x="450" y="92" text-anchor="middle">Your agent</text>

  <path class="tp-arr" d="M 400 114 L 240 196" />
  <path class="tp-arr" d="M 500 114 L 660 196" />

  <text class="tp-tag" x="240" y="190" text-anchor="middle">THE ALLOWED PATH</text>
  <text class="tp-tag" x="660" y="190" text-anchor="middle">STILL WORKS, CAPPED</text>

  <rect class="tp-hero" x="80" y="208" width="320" height="76" />
  <text class="tp-labi" x="240" y="240" text-anchor="middle">Workspace MCP servers</text>
  <text class="tp-subi" x="240" y="264" text-anchor="middle">plus the gwscli CLI, GA 24 Nov 2026</text>

  <rect class="tp-box" x="500" y="208" width="320" height="76" />
  <text class="tp-lab" x="660" y="240" text-anchor="middle">Workspace REST APIs</text>
  <text class="tp-sub" x="660" y="264" text-anchor="middle">called directly, as before</text>

  <path class="tp-arr" d="M 240 284 L 240 312" />
  <path class="tp-arr" d="M 660 284 L 660 312" />

  <rect class="tp-adj" x="80" y="320" width="320" height="64" />
  <text class="tp-lab" x="240" y="346" text-anchor="middle">Standard free, or paid Scaled</text>
  <text class="tp-sub" x="240" y="368" text-anchor="middle">billed above allowance from 1 Apr 2027</text>

  <rect class="tp-box" x="500" y="320" width="320" height="64" />
  <text class="tp-lab" x="660" y="346" text-anchor="middle">Standard quotas only</text>
  <text class="tp-sub" x="660" y="368" text-anchor="middle">from 1 Feb 2027, whatever you bought</text>

  <path class="tp-arr" d="M 240 384 L 380 418" />
  <path class="tp-arr" d="M 660 384 L 520 418" />

  <rect class="tp-box" x="250" y="424" width="400" height="56" />
  <text class="tp-lab" x="450" y="449" text-anchor="middle">The same Workspace data</text>
  <text class="tp-sub" x="450" y="470" text-anchor="middle">Gmail · Drive · Docs · Calendar · Chat · Tasks</text>
</svg>
