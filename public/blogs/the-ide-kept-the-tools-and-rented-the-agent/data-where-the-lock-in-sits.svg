<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ft fd">
  <title id="ft">Which layer you can still change your mind about</title>
  <desc id="fd">A four by three matrix. The model and agent is now easy to swap, is reachable from both the IDE and the command line, and carries its own vendor account. The harness and prompting is moderately portable, is reachable from both, and is agent-owned. The tool surface, meaning the emulator, build system and Logcat, is hard to swap, is host-reachable only, and is host-owned. Project context and skills are hard to swap, reachable from both, and host-owned.</desc>
  <style>
    .fm-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .fm-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .fm-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .fm-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .fm-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .fm-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .fm-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .fm-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .fm-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="fm-ttl" x="20" y="34">Which layer you can still change your mind about</text>

  <text class="fm-col" x="320" y="76" text-anchor="middle">Easy to swap</text>
  <text class="fm-col" x="510" y="76" text-anchor="middle">Reachable from</text>
  <text class="fm-col" x="700" y="76" text-anchor="middle">Who owns it</text>

  <text class="fm-row" x="20" y="118">Model &amp; agent</text>
  <rect class="fm-strong" x="230" y="92" width="180" height="40" />
  <text class="fm-inv"  x="320" y="117" text-anchor="middle">Yes &#8212; 40+ options</text>
  <rect class="fm-strong" x="420" y="92" width="180" height="40" />
  <text class="fm-inv"  x="510" y="117" text-anchor="middle">IDE and CLI</text>
  <rect class="fm-weak"   x="610" y="92" width="180" height="40" />
  <text class="fm-cell" x="700" y="117" text-anchor="middle">Its own vendor</text>

  <text class="fm-row" x="20" y="178">Harness &amp; prompting</text>
  <rect class="fm-mid"    x="230" y="152" width="180" height="40" />
  <text class="fm-cell" x="320" y="177" text-anchor="middle">Somewhat</text>
  <rect class="fm-strong" x="420" y="152" width="180" height="40" />
  <text class="fm-inv"  x="510" y="177" text-anchor="middle">IDE and CLI</text>
  <rect class="fm-weak"   x="610" y="152" width="180" height="40" />
  <text class="fm-cell" x="700" y="177" text-anchor="middle">The agent</text>

  <text class="fm-row" x="20" y="238">Tool surface</text>
  <rect class="fm-weak"   x="230" y="212" width="180" height="40" />
  <text class="fm-cell" x="320" y="237" text-anchor="middle">No</text>
  <rect class="fm-mid"    x="420" y="212" width="180" height="40" />
  <text class="fm-cell" x="510" y="237" text-anchor="middle">Host only</text>
  <rect class="fm-strong" x="610" y="212" width="180" height="40" />
  <text class="fm-inv"  x="700" y="237" text-anchor="middle">The host</text>

  <text class="fm-row" x="20" y="298">Context &amp; skills</text>
  <rect class="fm-weak"   x="230" y="272" width="180" height="40" />
  <text class="fm-cell" x="320" y="297" text-anchor="middle">No</text>
  <rect class="fm-strong" x="420" y="272" width="180" height="40" />
  <text class="fm-inv"  x="510" y="297" text-anchor="middle">IDE and CLI</text>
  <rect class="fm-strong" x="610" y="272" width="180" height="40" />
  <text class="fm-inv"  x="700" y="297" text-anchor="middle">The host</text>

  <rect class="fm-strong" x="20"  y="344" width="18" height="14" />
  <text class="fm-leg" x="48"  y="356">Open or portable</text>
  <rect class="fm-mid"    x="230" y="344" width="18" height="14" />
  <text class="fm-leg" x="258" y="356">Partial</text>
  <rect class="fm-weak"   x="470" y="344" width="18" height="14" />
  <text class="fm-leg" x="498" y="356">Closed or sticky</text>
</svg>
