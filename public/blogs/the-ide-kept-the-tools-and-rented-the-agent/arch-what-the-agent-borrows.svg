<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="at ad">
  <title id="at">What a visiting agent brings and what the host lends it</title>
  <desc id="ad">A swappable agent on the left carries only its model, its prompting and its own vendor account. It connects over the Agent Client Protocol to the host IDE on the right, which owns the Android Emulator, the build system, Logcat, the project context and the Android skills. The protocol standardises the connection but not the authorization.</desc>
  <style>
    .bx    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .lb    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .lbi   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .hd    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
    .dash  { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 5 4; opacity: .5; }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="34">The agent is swappable. The tool surface is not.</text>

  <text class="hd" x="20" y="78">Swappable: 40+ ACP agents</text>
  <rect class="hero" x="20" y="92" width="210" height="52" />
  <text class="lbi" x="125" y="123" text-anchor="middle">Claude Agent</text>
  <rect class="adj" x="20" y="154" width="210" height="44" />
  <text class="lb" x="125" y="181" text-anchor="middle">Codex</text>
  <rect class="adj" x="20" y="208" width="210" height="44" />
  <text class="lb" x="125" y="235" text-anchor="middle">Junie</text>
  <rect class="adj" x="20" y="262" width="210" height="44" />
  <text class="lb" x="125" y="289" text-anchor="middle">Antigravity</text>
  <text class="sub" x="20" y="332">Each brings: a model, its prompting,</text>
  <text class="sub" x="20" y="350">and its own vendor account.</text>

  <path class="arrow" d="M 240 200 L 358 200" />
  <text class="sub" x="248" y="176">Agent Client</text>
  <text class="sub" x="248" y="192">Protocol</text>

  <text class="hd" x="365" y="78">Host-owned: the tool surface</text>
  <rect class="bx" x="365" y="92" width="240" height="44" />
  <text class="lb" x="485" y="119" text-anchor="middle">Android Emulator</text>
  <rect class="bx" x="365" y="146" width="240" height="44" />
  <text class="lb" x="485" y="173" text-anchor="middle">Build systems</text>
  <rect class="bx" x="365" y="200" width="240" height="44" />
  <text class="lb" x="485" y="227" text-anchor="middle">Logcat</text>
  <rect class="bx" x="365" y="254" width="240" height="44" />
  <text class="lb" x="485" y="281" text-anchor="middle">Project context</text>
  <rect class="bx" x="365" y="308" width="240" height="44" />
  <text class="lb" x="485" y="335" text-anchor="middle">Android skills</text>

  <path class="dash" d="M 625 92 L 625 352" />
  <text class="sub" x="645" y="200">ACP standardises</text>
  <text class="sub" x="645" y="218">the connection,</text>
  <text class="sub" x="645" y="236">not which of these</text>
  <text class="sub" x="645" y="254">a guest may reach.</text>
</svg>
