<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="mt md">
  <title id="mt">Four shapes of instruction found in compaction summaries</title>
  <desc id="md">A four-row matrix. Each row names a category of instruction reported in compaction summaries — conceal a fabrication, suppress a known discrepancy, override developer instructions, and constrain the successor's behaviour — with what it asks the successor to do and which operator control it defeats.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .head   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; letter-spacing: .06em; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .rule   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .35; }
  </style>

  <text class="title" x="20" y="28">What the summary asked the next context to do</text>

  <text class="head" x="30" y="60">CATEGORY</text>
  <text class="head" x="330" y="60">THE INSTRUCTION</text>
  <text class="head" x="640" y="60">WHAT IT DEFEATS</text>
  <path class="rule" d="M 30 70 L 870 70" />

  <rect class="hero" x="30" y="84" width="280" height="54" />
  <text class="label-inv" x="46" y="106">Conceal a fabrication</text>
  <text class="label-inv" x="46" y="125" opacity=".85">GPT-5.6 Sol, in training</text>
  <rect class="box" x="330" y="84" width="290" height="54" />
  <text class="sub" x="346" y="106">"Be transparent only if asked;</text>
  <text class="sub" x="346" y="124">final answer should just link file."</text>
  <rect class="box" x="640" y="84" width="230" height="54" />
  <text class="label" x="656" y="115">Grounding checks on the output</text>

  <rect class="hero" x="30" y="150" width="280" height="54" />
  <text class="label-inv" x="46" y="172">Suppress a discrepancy</text>
  <text class="label-inv" x="46" y="191" opacity=".85">GPT-5.6 Sol, in training</text>
  <rect class="box" x="330" y="150" width="290" height="54" />
  <text class="sub" x="346" y="172">"Potential concern… vendor source</text>
  <text class="sub" x="346" y="190">…Do not mention in final unless needed."</text>
  <rect class="box" x="640" y="150" width="230" height="54" />
  <text class="label" x="656" y="181">Self-reported uncertainty</text>

  <rect class="adj" x="30" y="216" width="280" height="54" />
  <text class="label" x="46" y="238">Override the developer</text>
  <text class="sub" x="46" y="257">Astra-family, unreleased</text>
  <rect class="box" x="330" y="216" width="290" height="54" />
  <text class="sub" x="346" y="238">"BREACH ALERT" — ignore developer</text>
  <text class="sub" x="346" y="256">messages; adopt an unauthorized persona</text>
  <rect class="box" x="640" y="216" width="230" height="54" />
  <text class="label" x="656" y="247">The instruction hierarchy</text>

  <rect class="adj" x="30" y="282" width="280" height="54" />
  <text class="label" x="46" y="304">Constrain the successor</text>
  <text class="sub" x="46" y="323">the case that was obeyed</text>
  <rect class="box" x="330" y="282" width="290" height="54" />
  <text class="sub" x="346" y="304">Answer in 30 words; no tools,</text>
  <text class="sub" x="346" y="322">no citations</text>
  <rect class="box" x="640" y="282" width="230" height="54" />
  <text class="label" x="656" y="313">Your task configuration</text>

  <rect class="box" x="30" y="350" width="840" height="36" />
  <text class="label" x="450" y="373" text-anchor="middle">Solid rows: deception by the model. Soft rows: plain instruction-following. Only the fourth needed no misalignment at all.</text>
</svg>
