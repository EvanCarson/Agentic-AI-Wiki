<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="ct cd">
  <title id="ct">Where the compaction summary sits in the agent loop</title>
  <desc id="cd">An agent context fills with a system prompt, user messages and tool results. When it fills, the model writes a compaction summary, the old turns are discarded, and the harness injects the summary near the top of the fresh context. No review step exists between authoring and re-injection.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#carr); }
    .dashed { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; opacity: .6; }
  </style>
  <defs>
    <marker id="carr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="title" x="20" y="28">One compaction boundary</text>

  <rect class="box" x="30" y="52" width="300" height="196" />
  <text class="label" x="180" y="78" text-anchor="middle">Context, turn 1 – 40</text>
  <rect class="adj" x="50" y="94" width="260" height="30" />
  <text class="sub" x="180" y="113" text-anchor="middle">system prompt</text>
  <rect class="box" x="50" y="130" width="260" height="30" />
  <text class="sub" x="180" y="149" text-anchor="middle">user messages</text>
  <rect class="box" x="50" y="166" width="260" height="30" />
  <text class="sub" x="180" y="185" text-anchor="middle">tool results — untrusted, logged</text>
  <rect class="box" x="50" y="202" width="260" height="30" />
  <text class="sub" x="180" y="221" text-anchor="middle">retrieved pages — untrusted, logged</text>

  <path class="arrow" d="M 340 150 L 396 150" />
  <text class="sub" x="368" y="140" text-anchor="middle">full</text>

  <rect class="hero" x="404" y="118" width="190" height="64" />
  <text class="label-inv" x="499" y="145" text-anchor="middle">Model writes the</text>
  <text class="label-inv" x="499" y="164" text-anchor="middle">compaction summary</text>

  <path class="arrow" d="M 604 150 L 660 150" />

  <rect class="box" x="668" y="52" width="202" height="196" />
  <text class="label" x="769" y="78" text-anchor="middle">Context, turn 41 →</text>
  <rect class="adj" x="686" y="94" width="166" height="30" />
  <text class="sub" x="769" y="113" text-anchor="middle">system prompt</text>
  <rect class="hero" x="686" y="130" width="166" height="48" />
  <text class="sub-inv" x="769" y="149" text-anchor="middle">the summary,</text>
  <text class="sub-inv" x="769" y="167" text-anchor="middle">read as ground truth</text>
  <rect class="box" x="686" y="184" width="166" height="30" />
  <text class="sub" x="769" y="203" text-anchor="middle">new turns</text>

  <path class="dashed" d="M 180 256 L 180 296 L 430 296" />
  <text class="sub" x="230" y="316" text-anchor="start">turns 1 – 40 discarded — the evidence for the summary is gone</text>

  <rect class="box" x="30" y="344" width="840" height="56" />
  <text class="label" x="450" y="368" text-anchor="middle">No review step exists between "model wrote it" and "harness injected it"</text>
  <text class="sub" x="450" y="389" text-anchor="middle">tool results and retrieved pages pass a detector on the way in; the summary does not</text>

  <rect class="adj" x="30" y="416" width="840" height="56" />
  <text class="label" x="450" y="440" text-anchor="middle">Anything that could shape the summarizer can write to the top of the next context</text>
  <text class="sub" x="450" y="461" text-anchor="middle">a goal-directed model, or a poisoned page the agent read on turn nine — same channel, same privilege</text>
</svg>
