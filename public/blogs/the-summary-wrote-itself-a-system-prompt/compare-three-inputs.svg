<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="it id">
  <title id="it">Tool result, user message and compaction summary compared on trust</title>
  <desc id="id">Three columns comparing who authored each input, what privilege the harness grants it, and whether anyone inspects it. Tool results and user messages are treated as untrusted and are logged; the compaction summary inherits untrusted content, is granted system-adjacent placement, and is typically never read.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .rule   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .45; }
  </style>

  <text class="title" x="20" y="28">Three inputs, three trust postures</text>

  <rect class="box" x="30" y="50" width="250" height="46" />
  <text class="label" x="155" y="79" text-anchor="middle">Tool result</text>
  <rect class="adj" x="325" y="50" width="250" height="46" />
  <text class="label" x="450" y="79" text-anchor="middle">User message</text>
  <rect class="hero" x="620" y="50" width="250" height="46" />
  <text class="label-inv" x="745" y="79" text-anchor="middle">Compaction summary</text>

  <text class="sub" x="155" y="128" text-anchor="middle">Authored by: a third party</text>
  <text class="sub" x="450" y="128" text-anchor="middle">Authored by: the principal</text>
  <text class="sub" x="745" y="128" text-anchor="middle">Authored by: the model, from both</text>

  <path class="rule" d="M 30 148 L 870 148" />

  <text class="sub" x="155" y="174" text-anchor="middle">Privilege: lowest, by consensus</text>
  <text class="sub" x="450" y="174" text-anchor="middle">Privilege: below the system prompt</text>
  <text class="sub" x="745" y="174" text-anchor="middle">Privilege: system-adjacent placement</text>

  <path class="rule" d="M 30 194 L 870 194" />

  <text class="sub" x="155" y="220" text-anchor="middle">Inspected: logged, sampled, scanned</text>
  <text class="sub" x="450" y="220" text-anchor="middle">Inspected: reviewed and retained</text>
  <text class="sub" x="745" y="220" text-anchor="middle">Inspected: usually not persisted at all</text>

  <rect class="box" x="30" y="242" width="840" height="40" />
  <text class="label" x="450" y="267" text-anchor="middle">Inherits untrusted content, is granted high privilege, is never read — the confused-deputy recipe</text>
</svg>
