<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmt fmd">
  <title id="fmt">Four secret scanners on four separating questions</title>
  <desc id="fmd">A four by four matrix. GitHub Secret Protection refuses the write server-side, checks whether a secret is still live through validity checks, costs nineteen dollars per active committer per month, and is still gaining detection coverage. GitLab secret push protection refuses the write in a pre-receive hook, does not check liveness, requires the Ultimate tier, and is still gaining coverage. TruffleHog refuses nothing, verifies liveness with three result states, is AGPL-3.0 licensed, and is still gaining detectors. Gitleaks refuses nothing, verifies nothing, is MIT licensed, and is frozen: its README says future releases will be security patches only. Legend: decisive, partial, no.</desc>
  <style>
    .fm-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .fm-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .fm-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .fm-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .fm-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .fm-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .fm-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .fm-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .fm-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="fm-ttl" x="20" y="30">Four tools, four separating questions</text>

  <text class="fm-col" x="305" y="66" text-anchor="middle">Refuses the write</text>
  <text class="fm-col" x="470" y="66" text-anchor="middle">Checks if live</text>
  <text class="fm-col" x="635" y="66" text-anchor="middle">Price or licence</text>
  <text class="fm-col" x="800" y="66" text-anchor="middle">Still gaining rules</text>

  <text class="fm-row" x="20" y="113">GitHub Secret Protection</text>
  <rect class="fm-strong" x="230" y="84" width="150" height="48" />
  <text class="fm-inv" x="305" y="113" text-anchor="middle">Yes, server-side</text>
  <rect class="fm-strong" x="395" y="84" width="150" height="48" />
  <text class="fm-inv" x="470" y="113" text-anchor="middle">Yes, validity checks</text>
  <rect class="fm-mid" x="560" y="84" width="150" height="48" />
  <text class="fm-cell" x="635" y="113" text-anchor="middle">$19/committer/mo</text>
  <rect class="fm-strong" x="725" y="84" width="150" height="48" />
  <text class="fm-inv" x="800" y="113" text-anchor="middle">Yes</text>

  <text class="fm-row" x="20" y="175">GitLab push protection</text>
  <rect class="fm-strong" x="230" y="146" width="150" height="48" />
  <text class="fm-inv" x="305" y="175" text-anchor="middle">Yes, pre-receive</text>
  <rect class="fm-weak" x="395" y="146" width="150" height="48" />
  <text class="fm-cell" x="470" y="175" text-anchor="middle">No</text>
  <rect class="fm-mid" x="560" y="146" width="150" height="48" />
  <text class="fm-cell" x="635" y="175" text-anchor="middle">Ultimate tier</text>
  <rect class="fm-strong" x="725" y="146" width="150" height="48" />
  <text class="fm-inv" x="800" y="175" text-anchor="middle">Yes</text>

  <text class="fm-row" x="20" y="237">TruffleHog</text>
  <rect class="fm-weak" x="230" y="208" width="150" height="48" />
  <text class="fm-cell" x="305" y="237" text-anchor="middle">No, detector only</text>
  <rect class="fm-strong" x="395" y="208" width="150" height="48" />
  <text class="fm-inv" x="470" y="237" text-anchor="middle">Yes, three states</text>
  <rect class="fm-strong" x="560" y="208" width="150" height="48" />
  <text class="fm-inv" x="635" y="237" text-anchor="middle">AGPL-3.0, free</text>
  <rect class="fm-strong" x="725" y="208" width="150" height="48" />
  <text class="fm-inv" x="800" y="237" text-anchor="middle">Yes, 700+ detectors</text>

  <text class="fm-row" x="20" y="299">Gitleaks</text>
  <rect class="fm-weak" x="230" y="270" width="150" height="48" />
  <text class="fm-cell" x="305" y="299" text-anchor="middle">No, detector only</text>
  <rect class="fm-weak" x="395" y="270" width="150" height="48" />
  <text class="fm-cell" x="470" y="299" text-anchor="middle">No</text>
  <rect class="fm-strong" x="560" y="270" width="150" height="48" />
  <text class="fm-inv" x="635" y="299" text-anchor="middle">MIT, free</text>
  <rect class="fm-weak" x="725" y="270" width="150" height="48" />
  <text class="fm-cell" x="800" y="299" text-anchor="middle">No, 222 rules, frozen</text>

  <rect class="fm-strong" x="20" y="352" width="18" height="14" />
  <text class="fm-leg" x="48" y="364">Decisive</text>
  <rect class="fm-mid" x="200" y="352" width="18" height="14" />
  <text class="fm-leg" x="228" y="364">Conditional</text>
  <rect class="fm-weak" x="380" y="352" width="18" height="14" />
  <text class="fm-leg" x="408" y="364">Absent</text>
</svg>
