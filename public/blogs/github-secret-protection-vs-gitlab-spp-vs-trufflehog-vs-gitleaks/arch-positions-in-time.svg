<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="pitt pitd">
  <title id="pitt">Where each secret-scanning tool sits on one timeline</title>
  <desc id="pitd">A timeline runs left to right through commit, push, landing in the repository, and exposure. Four stations sit under it. A pre-commit hook, run by Gitleaks or TruffleHog on the developer's machine, sits before the commit and can simply not be run. A server-side gate, GitHub push protection or GitLab secret push protection, sits at the push and refuses the write, but can be bypassed with an audited flag. A repository scan, GitHub secret scanning or a GitLab pipeline, alerts after the secret has landed, by which point it is already public. Verification, TruffleHog with results set to verified, sits after exposure and only tells you whether the credential is still live.</desc>
  <style>
    .pit-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pit-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pit-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pit-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .pit-lane { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .8; }
    .pit-tick { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .pit-in   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .pit-on   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .pit-line { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#pitarr); }
  </style>
  <defs>
    <marker id="pitarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="pit-ttl" x="20" y="30">One timeline, four places to stand</text>

  <text class="pit-tick" x="125" y="58" text-anchor="middle">commit</text>
  <text class="pit-tick" x="335" y="58" text-anchor="middle">push</text>
  <text class="pit-tick" x="545" y="58" text-anchor="middle">lands in repo</text>
  <text class="pit-tick" x="755" y="58" text-anchor="middle">exposed</text>
  <path class="pit-line" d="M 40 70 L 860 70" />

  <rect class="pit-box" x="40"  y="110" width="170" height="70" />
  <text class="pit-on" x="125" y="132" text-anchor="middle">Pre-commit hook</text>
  <text class="pit-on" x="125" y="150" text-anchor="middle">Gitleaks, TruffleHog</text>
  <text class="pit-on" x="125" y="168" text-anchor="middle">on the laptop</text>

  <rect class="pit-hero" x="250" y="110" width="170" height="70" />
  <text class="pit-in" x="335" y="132" text-anchor="middle">Server-side gate</text>
  <text class="pit-in" x="335" y="150" text-anchor="middle">GitHub, GitLab</text>
  <text class="pit-in" x="335" y="168" text-anchor="middle">refuses the write</text>

  <rect class="pit-adj" x="460" y="110" width="170" height="70" />
  <text class="pit-on" x="545" y="132" text-anchor="middle">Repository scan</text>
  <text class="pit-on" x="545" y="150" text-anchor="middle">GitHub, pipelines</text>
  <text class="pit-on" x="545" y="168" text-anchor="middle">alerts, does not stop</text>

  <rect class="pit-box" x="670" y="110" width="170" height="70" />
  <text class="pit-on" x="755" y="132" text-anchor="middle">Verification</text>
  <text class="pit-on" x="755" y="150" text-anchor="middle">TruffleHog</text>
  <text class="pit-on" x="755" y="168" text-anchor="middle">is it still live?</text>

  <text class="pit-lane" x="40" y="218">When it fails, the failure looks like:</text>

  <rect class="pit-box" x="40"  y="230" width="170" height="64" />
  <text class="pit-on" x="125" y="256" text-anchor="middle">Nobody installed it</text>
  <text class="pit-on" x="125" y="274" text-anchor="middle">and nothing noticed</text>

  <rect class="pit-box" x="250" y="230" width="170" height="64" />
  <text class="pit-on" x="335" y="256" text-anchor="middle">A flag or a commit</text>
  <text class="pit-on" x="335" y="274" text-anchor="middle">message skipped it</text>

  <rect class="pit-box" x="460" y="230" width="170" height="64" />
  <text class="pit-on" x="545" y="256" text-anchor="middle">The alert is true</text>
  <text class="pit-on" x="545" y="274" text-anchor="middle">and already too late</text>

  <rect class="pit-box" x="670" y="230" width="170" height="64" />
  <text class="pit-on" x="755" y="256" text-anchor="middle">No detector exists</text>
  <text class="pit-on" x="755" y="274" text-anchor="middle">for that credential</text>
</svg>
