<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t3 d3">
  <title id="t3">What each implementation covers</title>
  <desc id="d3">Matrix comparing the MCP Events draft, the ChatGPT plugin integration and A2A push notifications across eight axes. The draft covers all three delivery modes and both control envelopes and specifies endpoint verification, mandatory HTTPS and a replay window. The ChatGPT integration covers webhook delivery and endpoint verification only. A2A push covers webhook delivery with authenticated headers but specifies no endpoint handshake and no replay window.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hdr   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); letter-spacing: .04em; }
    .row   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .celli { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .strong{ fill: var(--accent, #d4421e); }
    .med   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: .5; }
    .weak  { fill: var(--surface); stroke: var(--ink); stroke-width: .5; }
    .key   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
  </style>
  <text class="ttl" x="20" y="28">Coverage by axis — draft, shipped integration, and the nearest prior art</text>

  <text class="hdr" x="450" y="58" text-anchor="middle">MCP EVENTS DRAFT</text>
  <text class="hdr" x="610" y="58" text-anchor="middle">CHATGPT PLUGINS</text>
  <text class="hdr" x="770" y="58" text-anchor="middle">A2A PUSH</text>

  <g>
    <text class="row" x="360" y="84" text-anchor="end">Webhook delivery</text>
    <rect class="strong" x="372" y="68" width="156" height="24" rx="3" /><text class="celli" x="450" y="84" text-anchor="middle">Specified</text>
    <rect class="strong" x="532" y="68" width="156" height="24" rx="3" /><text class="celli" x="610" y="84" text-anchor="middle">Implemented</text>
    <rect class="strong" x="692" y="68" width="156" height="24" rx="3" /><text class="celli" x="770" y="84" text-anchor="middle">Specified</text>
  </g>
  <g>
    <text class="row" x="360" y="114" text-anchor="end">Poll and push modes</text>
    <rect class="strong" x="372" y="98" width="156" height="24" rx="3" /><text class="celli" x="450" y="114" text-anchor="middle">Both</text>
    <rect class="weak"   x="532" y="98" width="156" height="24" rx="3" /><text class="cell"  x="610" y="114" text-anchor="middle">Neither</text>
    <rect class="weak"   x="692" y="98" width="156" height="24" rx="3" /><text class="cell"  x="770" y="114" text-anchor="middle">Not in scope</text>
  </g>
  <g>
    <text class="row" x="360" y="144" text-anchor="end">The &#8220;terminated&#8221; envelope</text>
    <rect class="med"  x="372" y="128" width="156" height="24" rx="3" /><text class="cell" x="450" y="144" text-anchor="middle">Defined, optional</text>
    <rect class="weak" x="532" y="128" width="156" height="24" rx="3" /><text class="cell" x="610" y="144" text-anchor="middle">Not consumed</text>
    <rect class="weak" x="692" y="128" width="156" height="24" rx="3" /><text class="cell" x="770" y="144" text-anchor="middle">None</text>
  </g>
  <g>
    <text class="row" x="360" y="174" text-anchor="end">The &#8220;gap&#8221; envelope</text>
    <rect class="med"  x="372" y="158" width="156" height="24" rx="3" /><text class="cell" x="450" y="174" text-anchor="middle">Defined, optional</text>
    <rect class="weak" x="532" y="158" width="156" height="24" rx="3" /><text class="cell" x="610" y="174" text-anchor="middle">Not consumed</text>
    <rect class="weak" x="692" y="158" width="156" height="24" rx="3" /><text class="cell" x="770" y="174" text-anchor="middle">None</text>
  </g>
  <g>
    <text class="row" x="360" y="204" text-anchor="end">Endpoint verification handshake</text>
    <rect class="strong" x="372" y="188" width="156" height="24" rx="3" /><text class="celli" x="450" y="204" text-anchor="middle">Mandatory</text>
    <rect class="strong" x="532" y="188" width="156" height="24" rx="3" /><text class="celli" x="610" y="204" text-anchor="middle">Implemented</text>
    <rect class="weak"   x="692" y="188" width="156" height="24" rx="3" /><text class="cell"  x="770" y="204" text-anchor="middle">Unspecified</text>
  </g>
  <g>
    <text class="row" x="360" y="234" text-anchor="end">HTTPS for callbacks</text>
    <rect class="strong" x="372" y="218" width="156" height="24" rx="3" /><text class="celli" x="450" y="234" text-anchor="middle">MUST</text>
    <rect class="strong" x="532" y="218" width="156" height="24" rx="3" /><text class="celli" x="610" y="234" text-anchor="middle">Required</text>
    <rect class="med"    x="692" y="218" width="156" height="24" rx="3" /><text class="cell"  x="770" y="234" text-anchor="middle">SHOULD</text>
  </g>
  <g>
    <text class="row" x="360" y="264" text-anchor="end">Replay window on delivery</text>
    <rect class="strong" x="372" y="248" width="156" height="24" rx="3" /><text class="celli" x="450" y="264" text-anchor="middle">5 minutes</text>
    <rect class="med"    x="532" y="248" width="156" height="24" rx="3" /><text class="cell"  x="610" y="264" text-anchor="middle">Signed timestamp</text>
    <rect class="weak"   x="692" y="248" width="156" height="24" rx="3" /><text class="cell"  x="770" y="264" text-anchor="middle">Unspecified</text>
  </g>
  <g>
    <text class="row" x="360" y="294" text-anchor="end">Ordering / exactly-once</text>
    <rect class="weak" x="372" y="278" width="156" height="24" rx="3" /><text class="cell" x="450" y="294" text-anchor="middle">Explicitly out</text>
    <rect class="weak" x="532" y="278" width="156" height="24" rx="3" /><text class="cell" x="610" y="294" text-anchor="middle">Caller's problem</text>
    <rect class="weak" x="692" y="278" width="156" height="24" rx="3" /><text class="cell" x="770" y="294" text-anchor="middle">Caller's problem</text>
  </g>

  <rect class="strong" x="372" y="334" width="14" height="12" rx="2" /><text class="key" x="392" y="344">Covered</text>
  <rect class="med"    x="470" y="334" width="14" height="12" rx="2" /><text class="key" x="490" y="344">Partial or optional</text>
  <rect class="weak"   x="620" y="334" width="14" height="12" rx="2" /><text class="key" x="640" y="344">Absent</text>
</svg>
