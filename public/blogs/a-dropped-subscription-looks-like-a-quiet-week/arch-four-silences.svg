<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t2 d2">
  <title id="t2">Four reasons nothing arrives, and the envelope that would say which</title>
  <desc id="d2">Four causes of an empty event stream converge on one indistinguishable outcome. Access revoked is signalled by a terminated envelope; a server restart dropping an emit-only buffer is at-most-once and signalled by a gap envelope; a failed webhook delivery surfaces only in the delivery status on the next refresh; and genuinely quiet upstream is indistinguishable from all three. Without the control envelopes the agent sees the same empty stream in every case.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: none; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .labi  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .subi  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#a3); }
    .hdr   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
  </style>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="hdr" x="40" y="34">Cause</text>
  <text class="hdr" x="330" y="34">Signal the draft defines</text>
  <text class="hdr" x="680" y="34">What the agent sees</text>

  <rect class="box" x="40" y="56" width="250" height="62" rx="8" />
  <text class="label" x="58" y="82">Access revoked</text>
  <text class="sub"   x="58" y="102">removed from the channel</text>
  <rect class="adj" x="330" y="56" width="250" height="62" rx="8" />
  <text class="mono"  x="348" y="82">notifications/events/terminated</text>
  <text class="sub"   x="348" y="102">delivery-time re-check is a SHOULD</text>

  <rect class="box" x="40" y="130" width="250" height="62" rx="8" />
  <text class="label" x="58" y="156">Server restart</text>
  <text class="sub"   x="58" y="176">emit-only buffer lost</text>
  <rect class="adj" x="330" y="130" width="250" height="62" rx="8" />
  <text class="mono"  x="348" y="156">{"type":"gap"}</text>
  <text class="sub"   x="348" y="176">at-most-once across restarts</text>

  <rect class="box" x="40" y="204" width="250" height="62" rx="8" />
  <text class="label" x="58" y="230">Delivery failing</text>
  <text class="sub"   x="58" y="250">callback unreachable, retried</text>
  <rect class="adj" x="330" y="204" width="250" height="62" rx="8" />
  <text class="mono"  x="348" y="230">deliveryStatus</text>
  <text class="sub"   x="348" y="250">visible only on the next refresh</text>

  <rect class="box" x="40" y="278" width="250" height="62" rx="8" />
  <text class="label" x="58" y="304">Nothing happened</text>
  <text class="sub"   x="58" y="324">a genuinely quiet week</text>
  <rect class="box" x="330" y="278" width="250" height="62" rx="8" />
  <text class="label" x="348" y="312">— no signal needed —</text>

  <path class="arrow" d="M 580 87 L 660 160" />
  <path class="arrow" d="M 580 161 L 660 172" />
  <path class="arrow" d="M 580 235 L 660 196" />
  <path class="arrow" d="M 580 309 L 660 208" />

  <rect class="hero" x="665" y="140" width="195" height="100" rx="8" />
  <text class="labi" x="683" y="178">An empty stream</text>
  <text class="subi" x="683" y="202">identical in all four</text>
  <text class="subi" x="683" y="222">cases, with no error</text>

  <rect class="box" x="40" y="384" width="820" height="76" rx="8" />
  <text class="label" x="60" y="412">Drop the control envelopes and the first three collapse into the fourth.</text>
  <text class="sub"   x="60" y="438">The draft defines all of them; it makes none of them mandatory, and the first large implementation consumes neither terminated nor gap.</text>
</svg>
