<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t1 d1">
  <title id="t1">The three MCP Events delivery modes</title>
  <desc id="d1">Three horizontal lanes between an MCP server and an agent client. Poll uses repeated request and response carrying a cursor. Push holds a long-lived stream with heartbeats. Webhook registers an HTTPS callback with a client-supplied secret and the server posts each event to it. The draft marks none of the three as mandatory; the ChatGPT integration implements only the webhook lane.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: none; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .lane  { fill: none; stroke: var(--border-soft); stroke-width: 1; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .labi  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .subi  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .monoi { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--paper); }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#a2); }
    .hdr   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="hdr" x="40" y="34">MCP server</text>
  <text class="hdr" x="700" y="34">Agent client</text>

  <rect class="box" x="40" y="80" width="150" height="330" rx="8" />
  <text class="label" x="60" y="110">upstream</text>
  <text class="sub"   x="60" y="130">Slack, GitHub,</text>
  <text class="sub"   x="60" y="148">PagerDuty…</text>
  <text class="mono"  x="60" y="186">events/list</text>

  <rect class="box" x="710" y="80" width="150" height="330" rx="8" />
  <text class="label" x="730" y="110">SDK loop</text>
  <text class="sub"   x="730" y="130">negotiates mode,</text>
  <text class="sub"   x="730" y="148">model sees only</text>
  <text class="sub"   x="730" y="166">arriving events</text>

  <rect class="lane" x="210" y="80" width="480" height="96" rx="6" />
  <text class="label" x="230" y="104">Poll — <tspan class="mono">events/poll</tspan></text>
  <path class="arrow" d="M 680 134 L 420 134" />
  <path class="arrow" d="M 420 158 L 680 158" />
  <text class="sub" x="440" y="128">request with cursor</text>
  <text class="sub" x="440" y="176">events[], cursor, nextPollMs</text>

  <rect class="lane" x="210" y="192" width="480" height="96" rx="6" />
  <text class="label" x="230" y="216">Push — <tspan class="mono">events/stream</tspan></text>
  <path class="arrow" d="M 420 250 L 680 250" />
  <text class="sub" x="440" y="244">notifications/events/event</text>
  <text class="sub" x="440" y="276">heartbeat carries the cursor while quiet</text>

  <rect class="hero" x="210" y="304" width="480" height="106" rx="6" />
  <text class="labi" x="230" y="330">Webhook — <tspan class="monoi">events/subscribe</tspan></text>
  <text class="subi" x="230" y="358">signed POST to an https callback →</text>
  <text class="subi" x="230" y="386">client supplies the whsec_ secret; the only mode ChatGPT implements</text>

  <text class="sub" x="40" y="446">The draft advertises delivery modes per event type and marks none of them mandatory —</text>
  <text class="sub" x="40" y="466">so two servers can both conform and share no way to talk to each other.</text>
</svg>
