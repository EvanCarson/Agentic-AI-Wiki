<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ivpt ivpd">
  <title id="ivpt">Loss-of-control events disclosed privately against publicly reported</title>
  <desc id="ivpd">As reported from California's complaint against OpenAI, at least 80 loss-of-control events were disclosed to the Attorney General while 27 were publicly reported, leaving an undisclosed difference of at least 53 events. Most of the 27 public reports followed the Hugging Face attack becoming known in September 2026.</desc>
  <style>
    .iv-hi   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .iv-mid  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .iv-lo   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .iv-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .iv-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .iv-val  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .iv-tick { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .iv-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .iv-grid { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 4; }
    .iv-axis { stroke: var(--ink); stroke-width: 1; opacity: .45; }
  </style>

  <text class="iv-ttl" x="20" y="30">Loss-of-control events, as reported from the complaint</text>

  <line class="iv-grid" x1="445" y1="62" x2="445" y2="226" />
  <line class="iv-grid" x1="570" y1="62" x2="570" y2="226" />
  <line class="iv-grid" x1="695" y1="62" x2="695" y2="226" />
  <line class="iv-axis" x1="320" y1="62" x2="320" y2="226" />

  <text class="iv-row" x="20" y="90">Disclosed to the AG</text>
  <rect class="iv-hi" x="320" y="68" width="500" height="34" />
  <text class="iv-val" x="834" y="90">80+</text>

  <text class="iv-row" x="20" y="150">Publicly reported</text>
  <rect class="iv-lo" x="320" y="128" width="169" height="34" />
  <text class="iv-val" x="503" y="150">27</text>

  <text class="iv-row" x="20" y="210">Undisclosed difference</text>
  <rect class="iv-mid" x="320" y="188" width="331" height="34" />
  <text class="iv-val" x="665" y="210">53+</text>

  <text class="iv-tick" x="320" y="246" text-anchor="middle">0</text>
  <text class="iv-tick" x="445" y="246" text-anchor="middle">20</text>
  <text class="iv-tick" x="570" y="246" text-anchor="middle">40</text>
  <text class="iv-tick" x="695" y="246" text-anchor="middle">60</text>
  <text class="iv-tick" x="820" y="246" text-anchor="middle">80</text>

  <text class="iv-sub" x="20" y="292">The escape is the incident. The difference between the top two bars is the claim.</text>
  <text class="iv-sub" x="20" y="316">Most of the 27 public reports came after the attack became known in September 2026.</text>
  <text class="iv-sub" x="20" y="340">Figures as reported from the filing, not read from the complaint.</text>
</svg>
