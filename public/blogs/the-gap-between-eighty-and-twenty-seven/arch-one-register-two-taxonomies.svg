<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="ortt ortd">
  <title id="ortt">Two taxonomies against one register</title>
  <desc id="ortd">Above: one stream of loss-of-control events scored by two separate tests, an engineering test and a narrower disclosure test, produces two divergent aggregate counts with nobody misreporting anything. Below: one written test produces one count, with external disclosure recorded as a field on each event, so the published set is a filter rather than a second register.</desc>
  <style>
    .or-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .or-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .or-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .or-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .or-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .or-hdr  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .or-note { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .or-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#orarr); }
    .or-sep  { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 4; }
    .or-bar  { stroke: var(--ink); stroke-width: 1; opacity: .45; }
  </style>
  <defs>
    <marker id="orarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="or-hdr" x="20" y="40">Two tests over one event stream</text>

  <rect class="or-hero" x="20" y="90" width="130" height="60" rx="8" ry="8" />
  <text class="or-inv" x="85" y="125" text-anchor="middle">Events</text>

  <path class="or-arr" d="M 150 110 L 196 88" />
  <path class="or-arr" d="M 150 130 L 196 152" />

  <rect class="or-adj" x="200" y="60" width="190" height="50" rx="8" ry="8" />
  <text class="or-lab" x="295" y="90" text-anchor="middle">Engineering test</text>

  <rect class="or-box" x="200" y="130" width="190" height="50" rx="8" ry="8" />
  <text class="or-lab" x="295" y="160" text-anchor="middle">Disclosure test</text>

  <path class="or-arr" d="M 390 85 L 436 85" />
  <path class="or-arr" d="M 390 155 L 436 155" />

  <rect class="or-adj" x="440" y="60" width="110" height="50" rx="8" ry="8" />
  <text class="or-lab" x="495" y="90" text-anchor="middle">80+</text>

  <rect class="or-box" x="440" y="130" width="110" height="50" rx="8" ry="8" />
  <text class="or-lab" x="495" y="160" text-anchor="middle">27</text>

  <line class="or-bar" x1="562" y1="62" x2="562" y2="178" />
  <text class="or-note" x="578" y="112">Divergence is automatic</text>
  <text class="or-note" x="578" y="134">and nobody misreported</text>

  <line class="or-sep" x1="20" y1="222" x2="860" y2="222" />

  <text class="or-hdr" x="20" y="270">One register, disclosure as a field</text>

  <rect class="or-hero" x="20" y="310" width="130" height="60" rx="8" ry="8" />
  <text class="or-inv" x="85" y="345" text-anchor="middle">Events</text>

  <path class="or-arr" d="M 150 340 L 196 340" />

  <rect class="or-adj" x="200" y="310" width="190" height="60" rx="8" ry="8" />
  <text class="or-lab" x="295" y="345" text-anchor="middle">One written test</text>

  <path class="or-arr" d="M 390 340 L 436 340" />

  <rect class="or-box" x="440" y="310" width="130" height="60" rx="8" ry="8" />
  <text class="or-lab" x="505" y="345" text-anchor="middle">One count</text>

  <path class="or-arr" d="M 570 340 L 616 340" />

  <rect class="or-box" x="620" y="310" width="240" height="60" rx="8" ry="8" />
  <text class="or-lab" x="740" y="345" text-anchor="middle">disclosed: yes/no per event</text>

  <text class="or-note" x="20" y="430">The published set becomes a filter over one register, not a second register.</text>
  <text class="or-note" x="20" y="454">Each difference carries its reason on the row, instead of needing a policy defended in general.</text>
  <text class="or-note" x="20" y="478">Near misses stay in: a boundary that held is evidence the boundary works.</text>
</svg>
