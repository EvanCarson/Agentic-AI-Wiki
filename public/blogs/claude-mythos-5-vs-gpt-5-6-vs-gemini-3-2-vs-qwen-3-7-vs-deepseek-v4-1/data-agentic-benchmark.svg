<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">SWE-bench Verified (% success, snapshot) — frontier model comparison</title>
  <desc id="d">Horizontal bar chart: Claude Mythos 5 leads at 72%, GPT-5.6 at 68%, Gemini 3.2 at 61%, Qwen 3.7 at 58%, DeepSeek V4.1 at 55%. All scores are illustrative late-June 2026 snapshots.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .proj-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .bar-val     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; dominant-baseline: central; }
    .grid-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: middle; }
    .grid-line   { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .axis-line   { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .bar-hero    { fill: var(--accent, #d4421e); }
    .bar-adj     { fill: var(--accent-soft, #f5c5b8); }
    .bar-neut    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
  </style>

  <!-- Chart title -->
  <text class="chart-title" x="450" y="36" text-anchor="middle">SWE-bench Verified (% success, snapshot)</text>

  <!--
    Layout:
    Left margin (row labels): 220px
    Bar area: x=230 to x=800, width=570px
    Scale: 570/100 = 5.7px per pct point
    5 rows × 56px row height; first bar top y=62; bar height=36
    Row tops:  62, 118, 174, 230, 286
    Row centers: 80, 136, 192, 248, 304
    Grid lines at 0, 25, 50, 75, 100:
      x=230, 372.5, 515, 657.5, 800
    Bars:
      Claude Mythos 5: 72% → 72*5.7=410
      GPT-5.6:         68% → 68*5.7=388
      Gemini 3.2:      61% → 61*5.7=348
      Qwen 3.7:        58% → 58*5.7=331
      DeepSeek V4.1:   55% → 55*5.7=314
  -->

  <!-- Vertical grid lines (quartiles) -->
  <line class="grid-line" x1="230" y1="54" x2="230" y2="336" />
  <line class="grid-line" x1="372" y1="54" x2="372" y2="336" />
  <line class="grid-line" x1="515" y1="54" x2="515" y2="336" />
  <line class="grid-line" x1="657" y1="54" x2="657" y2="336" />
  <line class="grid-line" x1="800" y1="54" x2="800" y2="336" />

  <!-- Grid labels -->
  <text class="grid-label" x="230" y="352">0</text>
  <text class="grid-label" x="372" y="352">25</text>
  <text class="grid-label" x="515" y="352">50</text>
  <text class="grid-label" x="657" y="352">75</text>
  <text class="grid-label" x="800" y="352">100</text>

  <!-- Axis baseline -->
  <line class="axis-line" x1="230" y1="336" x2="800" y2="336" />

  <!-- Row 1: Claude Mythos 5 — 72% — HERO -->
  <!-- barW = 72*5.7 = 410 -->
  <text class="proj-label" x="222" y="80">Claude Mythos 5</text>
  <rect class="bar-hero" x="230" y="62" width="410" height="36" rx="5" />
  <text class="bar-val" x="648" y="80" style="fill: var(--accent, #d4421e);">72%</text>

  <!-- Row 2: GPT-5.6 — 68% — ADJACENT -->
  <!-- barW = 68*5.7 = 388 -->
  <text class="proj-label" x="222" y="136">GPT-5.6</text>
  <rect class="bar-adj" x="230" y="118" width="388" height="36" rx="5" />
  <text class="bar-val" x="626" y="136" style="fill: var(--ink, #1a1a1a);">68%</text>

  <!-- Row 3: Gemini 3.2 — 61% — ADJACENT -->
  <!-- barW = 61*5.7 = 348 -->
  <text class="proj-label" x="222" y="192">Gemini 3.2</text>
  <rect class="bar-adj" x="230" y="174" width="348" height="36" rx="5" />
  <text class="bar-val" x="586" y="192" style="fill: var(--ink, #1a1a1a);">61%</text>

  <!-- Row 4: Qwen 3.7 — 58% — NEUTRAL -->
  <!-- barW = 58*5.7 = 331 -->
  <text class="proj-label" x="222" y="248">Qwen 3.7</text>
  <rect class="bar-neut" x="230" y="230" width="331" height="36" rx="5" />
  <text class="bar-val" x="569" y="248" style="fill: var(--muted, #888);">58%</text>

  <!-- Row 5: DeepSeek V4.1 — 55% — NEUTRAL -->
  <!-- barW = 55*5.7 = 314 -->
  <text class="proj-label" x="222" y="304">DeepSeek V4.1</text>
  <rect class="bar-neut" x="230" y="286" width="314" height="36" rx="5" />
  <text class="bar-val" x="552" y="304" style="fill: var(--muted, #888);">55%</text>
</svg>
