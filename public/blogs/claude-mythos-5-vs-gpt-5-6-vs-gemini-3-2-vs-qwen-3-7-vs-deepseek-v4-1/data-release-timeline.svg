<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Five frontier models in one fortnight (June 2026)</title>
  <desc id="d">Horizontal date axis from June 3 to June 21 2026, with a shaded convergence window covering roughly 14 days. Five lab release events are marked: Claude Mythos 5 on June 9, GPT-5.6 on June 11, Gemini 3.2 on June 13, Qwen 3.7 and DeepSeek V4.1 on June 17, and a Chinese price-pressure cluster on June 20.</desc>
  <style>
    .chart-title  { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; fill: currentColor; }
    .axis-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: middle; }
    .axis-line    { stroke: var(--border-soft, #e0e0e0); stroke-width: 1.5; }
    .tick-line    { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .window-label { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: var(--accent, #d4421e); text-anchor: middle; }
    .drop-line    { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 3; }
    .event-label-name { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .event-label-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--muted, #888); text-anchor: middle; }
    .dot-hero     { fill: var(--accent, #d4421e); }
    .dot-adj      { fill: var(--accent-soft, #f5c5b8); stroke: var(--accent, #d4421e); stroke-width: 1.5; }
    .dot-neut     { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.5; }
  </style>

  <!--
    Layout:
    Date range: Jun 3 → Jun 21 = 18 days
    Axis: x=80 (Jun 3) → x=820 (Jun 21), width=740px
    Scale: 740 / 18 = 41.1px per day
    Axis y: 280
    Events:
      Claude Mythos 5  Jun 9  → x = 80 + 6*41.1 = 327
      GPT-5.6          Jun 11 → x = 80 + 8*41.1 = 409
      Gemini 3.2       Jun 13 → x = 80 + 10*41.1 = 491
      Qwen+DeepSeek    Jun 17 → x = 80 + 14*41.1 = 656
      Chinese cluster  Jun 20 → x = 80 + 17*41.1 = 779
    Convergence window: Jun 6 → Jun 21
      x_start = 80 + 3*41.1 = 203
      x_end   = 820
    Tick dates: Jun 3,6,9,12,15,18,21
  -->

  <!-- Chart title -->
  <text class="chart-title" x="450" y="36" text-anchor="middle">Five frontier models in one fortnight (June 2026)</text>

  <!-- Convergence window shading -->
  <rect x="203" y="80" width="617" height="230"
        fill="var(--accent, #d4421e)" opacity="0.07" rx="6" />

  <!-- Convergence window border tick lines -->
  <line x1="203" y1="80" x2="203" y2="310" stroke="var(--accent, #d4421e)" stroke-width="1" stroke-dasharray="4 3" opacity="0.4" />
  <line x1="820" y1="80" x2="820" y2="310" stroke="var(--accent, #d4421e)" stroke-width="1" stroke-dasharray="4 3" opacity="0.4" />

  <!-- Window label -->
  <text class="window-label" x="511" y="318">~14-day convergence window</text>

  <!-- Axis line -->
  <line class="axis-line" x1="80" y1="280" x2="830" y2="280" />

  <!-- Tick marks and date labels: Jun 3, 6, 9, 12, 15, 18, 21 -->
  <!-- Jun 3: x=80 -->
  <line class="tick-line" x1="80" y1="275" x2="80" y2="290" />
  <text class="axis-label" x="80" y="304">Jun 3</text>
  <!-- Jun 6: x=80+3*41.1=203 -->
  <line class="tick-line" x1="203" y1="275" x2="203" y2="290" />
  <text class="axis-label" x="203" y="304">Jun 6</text>
  <!-- Jun 9: x=80+6*41.1=327 -->
  <line class="tick-line" x1="327" y1="275" x2="327" y2="290" />
  <text class="axis-label" x="327" y="304">Jun 9</text>
  <!-- Jun 12: x=80+9*41.1=450 -->
  <line class="tick-line" x1="450" y1="275" x2="450" y2="290" />
  <text class="axis-label" x="450" y="304">Jun 12</text>
  <!-- Jun 15: x=80+12*41.1=573 -->
  <line class="tick-line" x1="573" y1="275" x2="573" y2="290" />
  <text class="axis-label" x="573" y="304">Jun 15</text>
  <!-- Jun 18: x=80+15*41.1=697 -->
  <line class="tick-line" x1="697" y1="275" x2="697" y2="290" />
  <text class="axis-label" x="697" y="304">Jun 18</text>
  <!-- Jun 21: x=80+18*41.1=820 -->
  <line class="tick-line" x1="820" y1="275" x2="820" y2="290" />
  <text class="axis-label" x="820" y="304">Jun 21</text>

  <!-- ===== Event 1: Claude Mythos 5 — Jun 9 x=327 — HERO ===== -->
  <!-- Drop line -->
  <line class="drop-line" x1="327" y1="230" x2="327" y2="274" />
  <!-- Dot -->
  <circle class="dot-hero" cx="327" cy="280" r="7" />
  <!-- Label above -->
  <text class="event-label-name" x="327" y="212">Claude Mythos 5</text>
  <text class="event-label-sub" x="327" y="226">GA + Fable 5 preview</text>

  <!-- ===== Event 2: GPT-5.6 — Jun 11 x=409 — ADJACENT ===== -->
  <line class="drop-line" x1="409" y1="150" x2="409" y2="274" />
  <circle class="dot-adj" cx="409" cy="280" r="6" />
  <text class="event-label-name" x="409" y="132">GPT-5.6</text>
  <text class="event-label-sub" x="409" y="146">OpenAI reasoning refresh</text>

  <!-- ===== Event 3: Gemini 3.2 — Jun 13 x=491 — NEUTRAL ===== -->
  <line class="drop-line" x1="491" y1="96" x2="491" y2="274" />
  <circle class="dot-neut" cx="491" cy="280" r="6" />
  <text class="event-label-name" x="491" y="88">Gemini 3.2</text>
  <text class="event-label-sub" x="491" y="102">Google multimodal upgrade</text>

  <!-- ===== Event 4: Qwen 3.7 + DeepSeek V4.1 — Jun 17 x=656 — ACCENT (Chinese frontier) ===== -->
  <line class="drop-line" x1="656" y1="150" x2="656" y2="274" />
  <circle class="dot-hero" cx="656" cy="280" r="6" />
  <text class="event-label-name" x="656" y="132">Qwen 3.7 + DeepSeek V4.1</text>
  <text class="event-label-sub" x="656" y="146">Chinese frontier cluster</text>

  <!-- ===== Event 5: Chinese price-pressure cluster — Jun 20 x=779 — ADJACENT ===== -->
  <line class="drop-line" x1="779" y1="212" x2="779" y2="274" />
  <circle class="dot-adj" cx="779" cy="280" r="6" />
  <text class="event-label-name" x="779" y="194">GLM-6 / Hunyuan / ERNIE</text>
  <text class="event-label-sub" x="779" y="208">Price-pressure response</text>
</svg>
