<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Frontier model capability matrix — June 2026</title>
  <desc id="d">Heatmap comparing five frontier models across five capability axes. Claude Mythos 5: strong reasoning, strong computer use, medium multimodal, medium price/perf, weak open-weights. GPT-5.6: strong across reasoning, computer use, multimodal; medium price/perf; weak open-weights. Gemini 3.2: strong reasoning and multimodal; medium computer use; strong price/perf; weak open-weights. Qwen 3.7: strong reasoning; medium computer use and multimodal; strong price/perf and open-weights. DeepSeek V4.1: strong reasoning; weak computer use; medium multimodal; strong price/perf and open-weights.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <!--
    Layout:
    Left margin (row labels): 170px
    5 columns × 138px = 690px; cols start x=180; col centers: 249, 387, 525, 663, 801
    Header y: 52 / 65
    5 rows × 54px; rows start y=78
    Row tops: 78, 132, 186, 240, 294
    Row centers: 105, 159, 213, 267, 321
    Legend y: 364
  -->

  <!-- Chart title -->
  <text class="chart-title" x="450" y="36" text-anchor="middle">Frontier model capability matrix</text>

  <!-- Column headers — two-line for "Computer use" and "Open-weights" -->
  <text class="col-head" x="249" y="52">Reasoning</text>
  <text class="col-head" x="387" y="52">Computer</text>
  <text class="col-head" x="387" y="65">use</text>
  <text class="col-head" x="525" y="58">Multimodal</text>
  <text class="col-head" x="663" y="52">Price /</text>
  <text class="col-head" x="663" y="65">perf</text>
  <text class="col-head" x="801" y="52">Open-</text>
  <text class="col-head" x="801" y="65">weights</text>

  <!-- ===== Row 1: Claude Mythos 5 ===== -->
  <text class="row-head" x="172" y="105">Claude Mythos 5</text>
  <!-- Reasoning: Strong -->
  <rect class="cell-strong" x="180" y="78" width="138" height="54" rx="4" />
  <text class="cell-text-inv" x="249" y="105">Strong</text>
  <!-- Computer use: Strong -->
  <rect class="cell-strong" x="318" y="78" width="138" height="54" rx="4" />
  <text class="cell-text-inv" x="387" y="105">Strong</text>
  <!-- Multimodal: Medium -->
  <rect class="cell-medium" x="456" y="78" width="138" height="54" rx="4" />
  <text class="cell-text" x="525" y="105">Medium</text>
  <!-- Price/perf: Medium -->
  <rect class="cell-medium" x="594" y="78" width="138" height="54" rx="4" />
  <text class="cell-text" x="663" y="105">Medium</text>
  <!-- Open-weights: Weak -->
  <rect class="cell-weak" x="732" y="78" width="138" height="54" rx="4" />
  <text class="cell-text" x="801" y="105">Weak</text>

  <!-- ===== Row 2: GPT-5.6 ===== -->
  <text class="row-head" x="172" y="159">GPT-5.6</text>
  <!-- Reasoning: Strong -->
  <rect class="cell-strong" x="180" y="132" width="138" height="54" rx="4" />
  <text class="cell-text-inv" x="249" y="159">Strong</text>
  <!-- Computer use: Strong -->
  <rect class="cell-strong" x="318" y="132" width="138" height="54" rx="4" />
  <text class="cell-text-inv" x="387" y="159">Strong</text>
  <!-- Multimodal: Strong -->
  <rect class="cell-strong" x="456" y="132" width="138" height="54" rx="4" />
  <text class="cell-text-inv" x="525" y="159">Strong</text>
  <!-- Price/perf: Medium -->
  <rect class="cell-medium" x="594" y="132" width="138" height="54" rx="4" />
  <text class="cell-text" x="663" y="159">Medium</text>
  <!-- Open-weights: Weak -->
  <rect class="cell-weak" x="732" y="132" width="138" height="54" rx="4" />
  <text class="cell-text" x="801" y="159">Weak</text>

  <!-- ===== Row 3: Gemini 3.2 ===== -->
  <text class="row-head" x="172" y="213">Gemini 3.2</text>
  <!-- Reasoning: Strong -->
  <rect class="cell-strong" x="180" y="186" width="138" height="54" rx="4" />
  <text class="cell-text-inv" x="249" y="213">Strong</text>
  <!-- Computer use: Medium -->
  <rect class="cell-medium" x="318" y="186" width="138" height="54" rx="4" />
  <text class="cell-text" x="387" y="213">Medium</text>
  <!-- Multimodal: Strong -->
  <rect class="cell-strong" x="456" y="186" width="138" height="54" rx="4" />
  <text class="cell-text-inv" x="525" y="213">Strong</text>
  <!-- Price/perf: Strong -->
  <rect class="cell-strong" x="594" y="186" width="138" height="54" rx="4" />
  <text class="cell-text-inv" x="663" y="213">Strong</text>
  <!-- Open-weights: Weak -->
  <rect class="cell-weak" x="732" y="186" width="138" height="54" rx="4" />
  <text class="cell-text" x="801" y="213">Weak</text>

  <!-- ===== Row 4: Qwen 3.7 ===== -->
  <text class="row-head" x="172" y="267">Qwen 3.7</text>
  <!-- Reasoning: Strong -->
  <rect class="cell-strong" x="180" y="240" width="138" height="54" rx="4" />
  <text class="cell-text-inv" x="249" y="267">Strong</text>
  <!-- Computer use: Medium -->
  <rect class="cell-medium" x="318" y="240" width="138" height="54" rx="4" />
  <text class="cell-text" x="387" y="267">Medium</text>
  <!-- Multimodal: Medium -->
  <rect class="cell-medium" x="456" y="240" width="138" height="54" rx="4" />
  <text class="cell-text" x="525" y="267">Medium</text>
  <!-- Price/perf: Strong -->
  <rect class="cell-strong" x="594" y="240" width="138" height="54" rx="4" />
  <text class="cell-text-inv" x="663" y="267">Strong</text>
  <!-- Open-weights: Strong -->
  <rect class="cell-strong" x="732" y="240" width="138" height="54" rx="4" />
  <text class="cell-text-inv" x="801" y="267">Strong</text>

  <!-- ===== Row 5: DeepSeek V4.1 ===== -->
  <text class="row-head" x="172" y="321">DeepSeek V4.1</text>
  <!-- Reasoning: Strong -->
  <rect class="cell-strong" x="180" y="294" width="138" height="54" rx="4" />
  <text class="cell-text-inv" x="249" y="321">Strong</text>
  <!-- Computer use: Weak -->
  <rect class="cell-weak" x="318" y="294" width="138" height="54" rx="4" />
  <text class="cell-text" x="387" y="321">Weak</text>
  <!-- Multimodal: Medium -->
  <rect class="cell-medium" x="456" y="294" width="138" height="54" rx="4" />
  <text class="cell-text" x="525" y="321">Medium</text>
  <!-- Price/perf: Strong -->
  <rect class="cell-strong" x="594" y="294" width="138" height="54" rx="4" />
  <text class="cell-text-inv" x="663" y="321">Strong</text>
  <!-- Open-weights: Strong -->
  <rect class="cell-strong" x="732" y="294" width="138" height="54" rx="4" />
  <text class="cell-text-inv" x="801" y="321">Strong</text>

  <!-- Legend -->
  <rect class="legend-box-w" x="180" y="362" width="16" height="16" rx="3" />
  <text class="legend-text" x="202" y="370">Weak</text>

  <rect class="legend-box-m" x="270" y="362" width="16" height="16" rx="3" />
  <text class="legend-text" x="292" y="370">Medium</text>

  <rect class="legend-box-s" x="376" y="362" width="16" height="16" rx="3" />
  <text class="legend-text" x="398" y="370">Strong</text>
</svg>
