<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Qwen logo">
  <!-- Stylized "Q" with a calligraphic brush tail — the outer circle forms
       the bowl of the Q, while the tail sweeps down and right in a single
       fluid stroke, evoking the brushwork aesthetic of Chinese typography.
       Circle in currentColor; tail in accent. Colors via CSS vars. -->
  <circle cx="15" cy="14" r="9.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
  <!-- Brush tail: sweeps from lower-right of bowl outward and down -->
  <path d="M 21.5 20.5 Q 26 24 27.5 28" fill="none" stroke="var(--accent, #d4421e)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
