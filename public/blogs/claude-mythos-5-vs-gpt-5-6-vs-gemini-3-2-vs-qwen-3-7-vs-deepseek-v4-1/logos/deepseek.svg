<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DeepSeek logo">
  <!-- Stylized search-lens + downward thrust: a circular lens ring in
       currentColor, overlaid with a bold downward-pointing chevron in accent
       that pierces the center, suggesting depth and discovery — the "deep"
       in DeepSeek. Colors via CSS vars. -->
  <!-- Lens ring -->
  <circle cx="16" cy="14" r="9" fill="none" stroke="currentColor" stroke-width="3" />
  <!-- Handle stroke extending from lower-right of lens -->
  <line x1="22.5" y1="20.5" x2="27" y2="25" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
  <!-- Downward chevron centered inside the lens -->
  <polyline points="11,11 16,19 21,11" fill="none" stroke="var(--accent, #d4421e)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
