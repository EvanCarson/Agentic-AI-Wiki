<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Google logo">
  <!-- Stylized "G" — a thick open arc sweeping almost all the way around,
       with a gap at the upper-right and a horizontal shelf jutting inward
       from the right terminus, evoking Google's distinctive letterform.
       Arc in currentColor; shelf in accent. Colors via CSS vars. -->
  <path d="M 26 11 A 11 11 0 1 0 27 18.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
  <line x1="16" y1="16" x2="27" y2="16" stroke="var(--accent, #d4421e)" stroke-width="3" stroke-linecap="round" />
</svg>
