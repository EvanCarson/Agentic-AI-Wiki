<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OpenAI logo">
  <!-- Stylized "O" — outer ring with a solid inner hub and three accent arcs
       at 120° intervals suggesting rotational geometry, evoking OpenAI's
       circular mark without reproducing it. Colors via CSS vars. -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="currentColor" stroke-width="2.5" />
  <circle cx="16" cy="16" r="3.5" fill="currentColor" />
  <!-- Three short arcs at 0°, 120°, 240° on the outer ring in accent color -->
  <path d="M 16 4.5 A 11.5 11.5 0 0 1 26 9.25" fill="none" stroke="var(--accent, #d4421e)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 26 22.75 A 11.5 11.5 0 0 1 16 27.5" fill="none" stroke="var(--accent, #d4421e)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 6 22.75 A 11.5 11.5 0 0 1 6 9.25" fill="none" stroke="var(--accent, #d4421e)" stroke-width="2.5" stroke-linecap="round" />
</svg>
