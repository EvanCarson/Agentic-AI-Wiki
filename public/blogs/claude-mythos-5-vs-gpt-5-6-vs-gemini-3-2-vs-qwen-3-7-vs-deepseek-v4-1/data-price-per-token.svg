<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Price per 1M output tokens (USD, snapshot)</title>
  <desc id="d">Horizontal bar chart showing output token pricing. Claude Mythos 5 is most expensive at $15.00 per million tokens, followed by GPT-5.6 at $10.00, Gemini 3.2 at $6.00. The Chinese cluster leads on price: Qwen 3.7 at $2.00 and DeepSeek V4.1 at $1.40 — both shown in accent fill to mark the price-floor thesis. All figures are illustrative June 2026 snapshots.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .proj-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .bar-val     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; dominant-baseline: central; }
    .grid-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: middle; }
    .grid-line   { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .axis-line   { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .bar-hero    { fill: var(--accent, #d4421e); }
    .bar-adj     { fill: var(--accent-soft, #f5c5b8); }
    .bar-neut    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
  </style>

  <!-- Chart title -->
  <text class="chart-title" x="450" y="36" text-anchor="middle">Price per 1M output tokens (USD, snapshot)</text>

  <!--
    Layout:
    Left margin (row labels): 220px
    Bar area: x=230 to x=800, width=570px
    Max value: $15.00 → scale: 570/15 = 38px per dollar
    5 rows × 56px row height; first bar top y=62; bar height=36
    Row tops:  62, 118, 174, 230, 286
    Row centers: 80, 136, 192, 248, 304
    Grid lines at $0, $4, $8, $12, $15:
      x=230, 230+4*38=382, 230+8*38=534, 230+12*38=686, 230+15*38=800
    Bars (ascending order by price = descending order of cost-effectiveness):
      Claude Mythos 5: $15.00 → 15*38=570   (neutral/paper-2 — most expensive)
      GPT-5.6:         $10.00 → 10*38=380   (neutral/paper-2)
      Gemini 3.2:       $6.00 →  6*38=228   (adjacent/accent-soft)
      Qwen 3.7:         $2.00 →  2*38=76    (hero/accent — cheapest)
      DeepSeek V4.1:    $1.40 →  1.4*38=53  (hero/accent — cheapest)
  -->

  <!-- Vertical grid lines -->
  <line class="grid-line" x1="230" y1="54" x2="230" y2="336" />
  <line class="grid-line" x1="382" y1="54" x2="382" y2="336" />
  <line class="grid-line" x1="534" y1="54" x2="534" y2="336" />
  <line class="grid-line" x1="686" y1="54" x2="686" y2="336" />
  <line class="grid-line" x1="800" y1="54" x2="800" y2="336" />

  <!-- Grid labels -->
  <text class="grid-label" x="230" y="352">$0</text>
  <text class="grid-label" x="382" y="352">$4</text>
  <text class="grid-label" x="534" y="352">$8</text>
  <text class="grid-label" x="686" y="352">$12</text>
  <text class="grid-label" x="800" y="352">$15</text>

  <!-- Axis baseline -->
  <line class="axis-line" x1="230" y1="336" x2="800" y2="336" />

  <!-- Row 1: Claude Mythos 5 — $15.00 — NEUTRAL (most expensive) -->
  <!-- barW = 15*38 = 570 -->
  <text class="proj-label" x="222" y="80">Claude Mythos 5</text>
  <rect class="bar-neut" x="230" y="62" width="570" height="36" rx="5" />
  <text class="bar-val" x="808" y="80" style="fill: var(--muted, #888);">$15.00</text>

  <!-- Row 2: GPT-5.6 — $10.00 — NEUTRAL -->
  <!-- barW = 10*38 = 380 -->
  <text class="proj-label" x="222" y="136">GPT-5.6</text>
  <rect class="bar-neut" x="230" y="118" width="380" height="36" rx="5" />
  <text class="bar-val" x="618" y="136" style="fill: var(--muted, #888);">$10.00</text>

  <!-- Row 3: Gemini 3.2 — $6.00 — ADJACENT -->
  <!-- barW = 6*38 = 228 -->
  <text class="proj-label" x="222" y="192">Gemini 3.2</text>
  <rect class="bar-adj" x="230" y="174" width="228" height="36" rx="5" />
  <text class="bar-val" x="466" y="192" style="fill: var(--ink, #1a1a1a);">$6.00</text>

  <!-- Row 4: Qwen 3.7 — $2.00 — HERO (price floor thesis) -->
  <!-- barW = 2*38 = 76 -->
  <text class="proj-label" x="222" y="248">Qwen 3.7</text>
  <rect class="bar-hero" x="230" y="230" width="76" height="36" rx="5" />
  <text class="bar-val" x="314" y="248" style="fill: var(--accent, #d4421e);">$2.00</text>

  <!-- Row 5: DeepSeek V4.1 — $1.40 — HERO (cheapest) -->
  <!-- barW = 1.4*38 = 53 -->
  <text class="proj-label" x="222" y="304">DeepSeek V4.1</text>
  <rect class="bar-hero" x="230" y="286" width="53" height="36" rx="5" />
  <text class="bar-val" x="291" y="304" style="fill: var(--accent, #d4421e);">$1.40</text>
</svg>
