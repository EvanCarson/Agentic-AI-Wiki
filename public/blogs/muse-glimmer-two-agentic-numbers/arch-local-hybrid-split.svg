<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where a 30B local agent model sits in a hybrid loop</title>
  <desc id="d">A device boundary contains the harness, a local 30B model, and an on-device index. Two arrows leave the boundary: tool calls to third-party APIs, and an escalation path to a frontier model for policy-bound or multi-turn work. The diagram marks the tool egress as the path that leaves the device even when the model does not.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .bound  { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .arrow-a { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.75; marker-end: url(#arra); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
    <marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent, #d4421e)" />
    </marker>
  </defs>

  <rect class="bound" x="24" y="52" width="440" height="400" rx="12" />
  <text class="tag" x="40" y="76">DEVICE BOUNDARY</text>

  <rect class="box" x="60" y="96" width="368" height="56" rx="8" />
  <text class="label" x="244" y="120" text-anchor="middle">Harness — the loop, the tool router,</text>
  <text class="label" x="244" y="139" text-anchor="middle">the policy checks you wrote yourself</text>

  <rect class="hero" x="60" y="180" width="368" height="76" rx="8" />
  <text class="label-inv" x="244" y="208" text-anchor="middle">Muse Glimmer 30B — 4-bit, speculative decode</text>
  <text class="sub-inv" x="244" y="230" text-anchor="middle">Classify · extract · draft · summarise · route</text>
  <text class="sub-inv" x="244" y="247" text-anchor="middle">Every step that must not wait on a network</text>

  <rect class="box" x="60" y="284" width="176" height="64" rx="8" />
  <text class="label" x="148" y="310" text-anchor="middle">On-device index</text>
  <text class="sub" x="148" y="330" text-anchor="middle">Mail, notes, files</text>

  <rect class="box" x="252" y="284" width="176" height="64" rx="8" />
  <text class="label" x="340" y="310" text-anchor="middle">Session state</text>
  <text class="sub" x="340" y="330" text-anchor="middle">Never leaves disk</text>

  <rect class="adj" x="60" y="376" width="368" height="52" rx="8" />
  <text class="label" x="244" y="399" text-anchor="middle">Escalation gate — does this step bind the user</text>
  <text class="sub" x="244" y="418" text-anchor="middle">to a rule, a spend, or another person?</text>

  <rect class="box" x="560" y="96" width="300" height="76" rx="8" />
  <text class="label" x="710" y="122" text-anchor="middle">Third-party tool APIs</text>
  <text class="sub" x="710" y="143" text-anchor="middle">Calendar, mail, payments, search —</text>
  <text class="sub" x="710" y="160" text-anchor="middle">your data leaves here, model or not</text>

  <rect class="adj" x="560" y="376" width="300" height="76" rx="8" />
  <text class="label" x="710" y="402" text-anchor="middle">Frontier model, on demand</text>
  <text class="sub" x="710" y="423" text-anchor="middle">Multi-turn service dialogue, policy</text>
  <text class="sub" x="710" y="440" text-anchor="middle">adherence, anything irreversible</text>

  <path class="arrow-a" d="M 428 128 L 552 128" />
  <text class="tag" x="490" y="118" text-anchor="middle">EGRESS</text>

  <path class="arrow" d="M 428 402 L 552 410" />
  <path class="arrow" d="M 552 424 L 432 416" />
</svg>
