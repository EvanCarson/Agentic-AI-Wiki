<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What each benchmark family actually tests</title>
  <desc id="d">Three columns comparing SWE-Bench Verified, MCP-Atlas and DeepSearch QA, and tau-3 Banking across three rows: who else is in the loop, what decides success, and what a failure looks like. Only the third column puts a person and a policy document inside the task.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .head  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .row   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="row" x="24" y="94">IN THE LOOP</text>
  <text class="row" x="24" y="164">SUCCESS IS</text>
  <text class="row" x="24" y="234">FAILS AS</text>

  <rect class="box" x="160" y="24" width="220" height="36" rx="8" />
  <text class="head" x="270" y="47" text-anchor="middle">SWE-Bench Verified</text>
  <rect class="adj" x="400" y="24" width="220" height="36" rx="8" />
  <text class="head" x="510" y="47" text-anchor="middle">MCP-Atlas · DeepSearch QA</text>
  <rect class="hero" x="640" y="24" width="220" height="36" rx="8" />
  <text class="head-inv" x="750" y="47" text-anchor="middle">τ³-Banking</text>

  <rect class="box" x="160" y="72" width="220" height="52" rx="8" />
  <text class="cell" x="270" y="94" text-anchor="middle">A repository and a</text>
  <text class="cell" x="270" y="110" text-anchor="middle">hidden test suite.</text>
  <rect class="box" x="400" y="72" width="220" height="52" rx="8" />
  <text class="cell" x="510" y="94" text-anchor="middle">Tools and documents.</text>
  <text class="cell" x="510" y="110" text-anchor="middle">No second party.</text>
  <rect class="hero" x="640" y="72" width="220" height="52" rx="8" />
  <text class="cell-inv" x="750" y="94" text-anchor="middle">A simulated customer</text>
  <text class="cell-inv" x="750" y="110" text-anchor="middle">and a policy manual.</text>

  <rect class="box" x="160" y="142" width="220" height="52" rx="8" />
  <text class="cell" x="270" y="164" text-anchor="middle">The tests pass.</text>
  <text class="cell" x="270" y="180" text-anchor="middle">Binary, automatic.</text>
  <rect class="box" x="400" y="142" width="220" height="52" rx="8" />
  <text class="cell" x="510" y="164" text-anchor="middle">The answer matches</text>
  <text class="cell" x="510" y="180" text-anchor="middle">a known ground truth.</text>
  <rect class="hero" x="640" y="142" width="220" height="52" rx="8" />
  <text class="cell-inv" x="750" y="164" text-anchor="middle">The right end state</text>
  <text class="cell-inv" x="750" y="180" text-anchor="middle">and no rule broken.</text>

  <rect class="box" x="160" y="212" width="220" height="52" rx="8" />
  <text class="cell" x="270" y="234" text-anchor="middle">A red test.</text>
  <text class="cell" x="270" y="250" text-anchor="middle">Visible immediately.</text>
  <rect class="box" x="400" y="212" width="220" height="52" rx="8" />
  <text class="cell" x="510" y="234" text-anchor="middle">A wrong answer,</text>
  <text class="cell" x="510" y="250" text-anchor="middle">fluently stated.</text>
  <rect class="hero" x="640" y="212" width="220" height="52" rx="8" />
  <text class="cell-inv" x="750" y="234" text-anchor="middle">A satisfied customer</text>
  <text class="cell-inv" x="750" y="250" text-anchor="middle">and a violated rule.</text>
</svg>
