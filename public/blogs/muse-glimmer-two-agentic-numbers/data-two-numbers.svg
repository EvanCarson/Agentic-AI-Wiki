<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Muse Glimmer 30B reported benchmark scores</title>
  <desc id="d">Horizontal bar chart of six reported scores. AIME 2026 at 94.7, SWE-Bench Verified at 76.0, MCP-Atlas at 75.5, DeepSearch QA at 74.6 and SWE-Bench Pro at 51.2 are all solo, machine-checkable tasks. Tau-3 Banking, the one benchmark with a simulated user and a written policy, sits far below the rest at 24.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lab   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .val   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val-a { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--accent, #d4421e); font-weight: 600; }
    .leg   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .solo  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .grid  { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .axis  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .55; }
  </style>

  <text class="ttl" x="24" y="30">Muse Glimmer 30B — reported scores (%)</text>

  <!-- Plot origin is x=160, not 135: "SWE-Bench Verified" is ~119px at 13px
       Inter and starts at x=24, so a 135px gutter ran its tail under the bar.
       Scale is unchanged at 6.75px per point (20 points = 135px); every plot
       coordinate below is the old one plus 25. -->
  <line class="grid" x1="295" y1="52" x2="295" y2="316" />
  <line class="grid" x1="430" y1="52" x2="430" y2="316" />
  <line class="grid" x1="565" y1="52" x2="565" y2="316" />
  <line class="grid" x1="700" y1="52" x2="700" y2="316" />
  <line class="grid" x1="835" y1="52" x2="835" y2="316" />
  <text class="axis" x="295" y="336" text-anchor="middle">20</text>
  <text class="axis" x="430" y="336" text-anchor="middle">40</text>
  <text class="axis" x="565" y="336" text-anchor="middle">60</text>
  <text class="axis" x="700" y="336" text-anchor="middle">80</text>
  <text class="axis" x="835" y="336" text-anchor="middle">100</text>

  <text class="lab" x="24" y="72">AIME 2026</text>
  <rect class="solo" x="160" y="58" width="639" height="20" rx="3" />
  <text class="val" x="809" y="73">94.7</text>

  <text class="lab" x="24" y="114">SWE-Bench Verified</text>
  <rect class="solo" x="160" y="100" width="513" height="20" rx="3" />
  <text class="val" x="683" y="115">76.0</text>

  <text class="lab" x="24" y="156">MCP-Atlas</text>
  <rect class="solo" x="160" y="142" width="510" height="20" rx="3" />
  <text class="val" x="680" y="157">75.5</text>

  <text class="lab" x="24" y="198">DeepSearch QA</text>
  <rect class="solo" x="160" y="184" width="504" height="20" rx="3" />
  <text class="val" x="674" y="199">74.6</text>

  <text class="lab" x="24" y="240">SWE-Bench Pro</text>
  <rect class="solo" x="160" y="226" width="346" height="20" rx="3" />
  <text class="val" x="516" y="241">51.2</text>

  <text class="lab" x="24" y="282">τ³-Banking</text>
  <rect class="hero" x="160" y="268" width="162" height="20" rx="3" />
  <text class="val-a" x="332" y="283">24</text>

  <rect class="solo" x="24" y="362" width="14" height="14" rx="3" />
  <text class="leg" x="46" y="374">Solo task, machine-checkable goal</text>
  <rect class="hero" x="330" y="362" width="14" height="14" rx="3" />
  <text class="leg" x="352" y="374">Simulated user, written policy, pass^k scoring</text>
</svg>
