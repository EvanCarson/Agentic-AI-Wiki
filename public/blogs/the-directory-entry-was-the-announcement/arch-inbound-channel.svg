<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The inversion an addressable agent identity creates</title>
  <desc id="d">Two rows. In the outbound-only shape the agent holds a credential and chooses what to read, so untrusted content enters only where the agent went looking. In the addressable shape a stranger places text directly into the agent's queue with no credential, and that text sits in the same context as the agent's privileged tools. The holding design puts a classifier in front of the mailbox so external mail becomes a provenance-labelled record the agent reads rather than a turn it answers.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); text-anchor: middle; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; text-anchor: middle; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .8; text-anchor: middle; }
    .sect   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .75; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
    .dash   { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr2); }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="30">Who gets to put text in the context</text>

  <text class="sect" x="20" y="66">Outbound only — every agent identity before this one</text>

  <rect class="box" x="24" y="82" width="200" height="64" />
  <text class="label" x="124" y="108">Agent run</text>
  <text class="sub" x="124" y="128">holds a credential</text>

  <rect class="box" x="300" y="82" width="200" height="64" />
  <text class="label" x="400" y="108">Chooses what to read</text>
  <text class="sub" x="400" y="128">a source it went to</text>

  <rect class="box" x="576" y="82" width="200" height="64" />
  <text class="label" x="676" y="108">Acts</text>
  <text class="sub" x="676" y="128">scoped to the task</text>

  <path class="arrow" d="M 224 114 L 296 114" />
  <path class="arrow" d="M 500 114 L 572 114" />

  <text class="sect" x="20" y="196">Addressable — a mailbox on the directory</text>

  <rect class="hero" x="24" y="212" width="200" height="64" />
  <text class="label-inv" x="124" y="238">Anyone, no credential</text>
  <text class="sub-inv" x="124" y="258">agent@agents.corp.com</text>

  <rect class="hero" x="300" y="212" width="200" height="64" />
  <text class="label-inv" x="400" y="238">Straight into context</text>
  <text class="sub-inv" x="400" y="258">beside privileged tools</text>

  <rect class="hero" x="576" y="212" width="200" height="64" />
  <text class="label-inv" x="676" y="238">Acts</text>
  <text class="sub-inv" x="676" y="258">scoped to the identity</text>

  <path class="arrow" d="M 224 244 L 296 244" />
  <path class="arrow" d="M 500 244 L 572 244" />

  <rect class="box" x="24" y="300" width="752" height="44" />
  <text class="label" x="400" y="320">SPF, DKIM and DMARC authenticate the sender's domain</text>
  <text class="sub" x="400" y="337">and say nothing about the authority of the request inside the message</text>

  <path class="dash" d="M 124 276 L 124 296" />

  <text class="sect" x="20" y="388">The shape that holds</text>

  <rect class="box" x="24" y="404" width="190" height="64" />
  <text class="label" x="119" y="430">Inbound mail</text>
  <text class="sub" x="119" y="450">untrusted by default</text>

  <rect class="adj" x="254" y="404" width="190" height="64" />
  <text class="label" x="349" y="430">Classifier</text>
  <text class="sub" x="349" y="450">emits a typed record</text>

  <rect class="box" x="484" y="404" width="190" height="64" />
  <text class="label" x="579" y="430">Agent reads a datum</text>
  <text class="sub" x="579" y="450">provenance: external</text>

  <rect class="adj" x="714" y="404" width="162" height="64" />
  <text class="label" x="795" y="430">Human sends</text>
  <text class="sub" x="795" y="450">send path unreachable</text>

  <path class="arrow" d="M 214 436 L 250 436" />
  <path class="arrow" d="M 444 436 L 480 436" />
  <path class="arrow" d="M 674 436 L 710 436" />
</svg>
