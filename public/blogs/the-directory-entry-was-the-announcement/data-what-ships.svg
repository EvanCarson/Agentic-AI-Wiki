<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">What ships with a workplace account for an agent</title>
  <desc id="d">Two groups. The capabilities an organisation wants from a per-agent identity are an attested identity in the audit log and a revocable principal. The capabilities that arrive bundled with a workplace account are an addressable mailbox, a calendar that accepts external invitations, file storage and a share identity, and a directory entry eligible for group membership.</desc>
  <style>
    .want  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .bundle { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .grp   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .75; }
    .cat   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cat-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .rule  { stroke: var(--border-soft); stroke-width: 1; }
  </style>

  <text class="ttl" x="20" y="32">Two grants you asked for. Four that came in the box.</text>

  <text class="grp" x="20" y="66">What a per-agent identity is bought for</text>
  <rect class="want" x="20" y="78" width="570" height="32" rx="4" />
  <text class="cat" x="34" y="99">Attested identity in the audit log — not a shared robot user</text>
  <rect class="want" x="20" y="118" width="570" height="32" rx="4" />
  <text class="cat" x="34" y="139">One principal to scope, review and revoke</text>

  <line class="rule" x1="20" y1="168" x2="880" y2="168" />

  <text class="grp" x="20" y="198">What a workplace account brings with it</text>
  <rect class="bundle" x="20" y="210" width="570" height="32" rx="4" />
  <text class="cat-inv" x="34" y="231">An addressable mailbox — inbound, from anywhere</text>
  <rect class="bundle" x="20" y="250" width="570" height="32" rx="4" />
  <text class="cat-inv" x="34" y="271">A calendar that accepts invitations written by strangers</text>
  <rect class="bundle" x="20" y="290" width="570" height="32" rx="4" />
  <text class="cat-inv" x="34" y="311">File storage, and an identity things can be shared with</text>
  <rect class="bundle" x="20" y="330" width="570" height="32" rx="4" />
  <text class="cat-inv" x="34" y="351">A directory entry — eligible for group membership</text>

  <text class="sub" x="614" y="96">attribution:</text>
  <text class="sub" x="614" y="114">a real improvement</text>
  <text class="sub" x="614" y="136">over ops-bot@</text>

  <text class="sub" x="614" y="230">no credential needed</text>
  <text class="sub" x="614" y="248">to reach the agent</text>
  <text class="sub" x="614" y="310">inherits every share</text>
  <text class="sub" x="614" y="328">aimed at the groups</text>
  <text class="sub" x="614" y="346">it is added to</text>
</svg>
