<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three shapes of agent identity compared</title>
  <desc id="d">Three columns. A shared service account gives weak attribution and no inbound surface. A scoped delegated grant gives good attribution and still no inbound surface. A directory principal gives the strongest attribution and is the first of the three that anyone can write to without a credential.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="20" y="28">Attribution improves left to right. So does reach.</text>

  <text class="lbl" x="20" y="96">Audit log</text>
  <text class="lbl" x="20" y="206">Inbound</text>

  <rect class="box" x="150" y="52" width="180" height="92" />
  <text class="hd" x="240" y="82">Shared account</text>
  <text class="vd" x="240" y="108">ops-bot did it,</text>
  <text class="vd" x="240" y="128">or someone did</text>

  <rect class="adj" x="395" y="52" width="180" height="92" />
  <text class="hd" x="485" y="82">Delegated grant</text>
  <text class="vd" x="485" y="108">this agent, acting</text>
  <text class="vd" x="485" y="128">for this human</text>

  <rect class="hero" x="645" y="52" width="180" height="92" />
  <text class="hd-inv" x="735" y="82">Directory principal</text>
  <text class="vd-inv" x="735" y="108">this agent, attested,</text>
  <text class="vd-inv" x="735" y="128">on its own behalf</text>

  <rect class="box" x="150" y="162" width="180" height="96" />
  <text class="vd" x="240" y="196">none: the account</text>
  <text class="vd" x="240" y="218">only reaches out</text>

  <rect class="box" x="395" y="162" width="180" height="96" />
  <text class="vd" x="485" y="196">none: the grant</text>
  <text class="vd" x="485" y="218">only reaches out</text>

  <rect class="adj" x="645" y="162" width="180" height="96" />
  <text class="vd" x="735" y="190">a mailbox and a</text>
  <text class="vd" x="735" y="212">calendar anyone</text>
  <text class="vd" x="735" y="234">can write to</text>
</svg>
