<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">An activity log and an authority record hold different fields</title>
  <desc id="d">Two panels side by side. The left panel is the activity log most agent stacks already emit: timestamp, run identifier, tool name, arguments, result and latency. It answers what happened and when, and cannot answer who authorised it. The right panel is the authority record the bill's duties require: grantor, granted scope, stated purpose, expiry, revocation state, the actor that exercised it and the delegation chain behind that actor. It answers whether the action was permitted. An arrow between them is labelled with the field that joins the two, a grant identifier stamped on every action.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--paper); }
    .row    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .row-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .68; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .82; }
    .colhead { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="colhead" x="24" y="40">WHAT YOUR STACK ALREADY WRITES</text>
  <text class="colhead" x="504" y="40">WHAT THE DUTIES REQUIRE</text>

  <rect class="box" x="24" y="60" width="356" height="330" />
  <text class="head" x="46" y="94">Activity log</text>
  <text class="row" x="46" y="130">timestamp</text>
  <text class="row" x="46" y="154">run_id / trace_id</text>
  <text class="row" x="46" y="178">tool_name</text>
  <text class="row" x="46" y="202">arguments</text>
  <text class="row" x="46" y="226">result, tokens, latency</text>
  <text class="row" x="46" y="250">model version</text>
  <text class="sub" x="46" y="292">Answers: what happened, when, how much</text>
  <text class="sub" x="46" y="312">it cost, and which span was slow.</text>
  <text class="sub" x="46" y="348">Cannot answer: whether anyone was</text>
  <text class="sub" x="46" y="368">entitled to do it.</text>

  <rect class="hero" x="504" y="60" width="372" height="330" />
  <text class="head-inv" x="526" y="94">Authority record</text>
  <text class="row-inv" x="526" y="130">grantor (the human)</text>
  <text class="row-inv" x="526" y="154">granted_scope</text>
  <text class="row-inv" x="526" y="178">stated_purpose</text>
  <text class="row-inv" x="526" y="202">granted_at / expires_at</text>
  <text class="row-inv" x="526" y="226">revoked_at</text>
  <text class="row-inv" x="526" y="250">actor + delegation_chain</text>
  <text class="row-inv" x="526" y="274">exercised_scope</text>
  <text class="sub-inv" x="526" y="316">Answers: was this permitted, by whom,</text>
  <text class="sub-inv" x="526" y="336">for what, and is it still permitted.</text>
  <text class="sub-inv" x="526" y="372">This is the artefact NIST is asked to standardise.</text>

  <path class="arrow" d="M 388 224 L 496 224" />
  <text class="sub" x="396" y="212">grant_id</text>

  <text class="sub" x="24" y="428">The arrow is one field — a grant_id stamped on every action — and it is what joins the two ledgers.</text>
  <text class="sub" x="24" y="452">An activity log is a record of behaviour. An authority record is a record of permission. Neither derives the other,</text>
  <text class="sub" x="24" y="472">and every clause about records, scope and delegation in the bill is written against the second one.</text>
</svg>
