<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where authority evidence exists along a four-hop agent chain</title>
  <desc id="d">A left-to-right chain of four hops. The user grants consent to the orchestrating agent through an OAuth authorisation, which produces a real, checkable record. The orchestrator then spawns a sub-agent, the sub-agent calls a partner agent over the A2A protocol, and the partner agent calls a tool over MCP. Under each of the last three hops a marker records that no delegation assertion travels on the wire: the sub-agent is an internal function call, A2A carries an agent card but no delegation primitive, and MCP passes a bearer token that says nothing about who is behind it. A note states that the bill's prohibition on delegating authority without explicit user permission applies to exactly the three hops with no evidence.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .68; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .75; }
    .colhead { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .rule   { stroke: var(--ink); stroke-width: 1; opacity: .18; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="colhead" x="24" y="40">ONE TASK, FOUR HOPS</text>

  <rect class="hero" x="24" y="70" width="150" height="92" />
  <text class="head-inv" x="42" y="102">User</text>
  <text class="label-inv" x="42" y="126">grants consent</text>
  <text class="label-inv" x="42" y="144">in a browser</text>

  <path class="arrow" d="M 182 116 L 218 116" />

  <rect class="adj" x="226" y="70" width="150" height="92" />
  <text class="head" x="244" y="102">Orchestrator</text>
  <text class="label" x="244" y="126">holds the token,</text>
  <text class="label" x="244" y="144">plans the work</text>

  <path class="arrow" d="M 384 116 L 420 116" />

  <rect class="box" x="428" y="70" width="150" height="92" />
  <text class="head" x="446" y="102">Sub-agent</text>
  <text class="label" x="446" y="126">spawned in</text>
  <text class="label" x="446" y="144">process</text>

  <path class="arrow" d="M 586 116 L 622 116" />

  <rect class="box" x="630" y="70" width="150" height="92" />
  <text class="head" x="648" y="102">Partner agent</text>
  <text class="label" x="648" y="126">reached over</text>
  <text class="label" x="648" y="144">A2A</text>

  <path class="arrow" d="M 705 170 L 705 206" />
  <rect class="box" x="630" y="214" width="150" height="72" />
  <text class="head" x="648" y="244">Their tools</text>
  <text class="label" x="648" y="268">called over MCP</text>

  <line class="rule" x1="24" y1="320" x2="876" y2="320" />
  <text class="colhead" x="24" y="348">WHAT TRAVELS ON EACH HOP</text>

  <text class="tag" x="24" y="382">HOP 1</text>
  <text class="label" x="24" y="404">OAuth grant: grantor,</text>
  <text class="label" x="24" y="422">scope, expiry, revocable.</text>
  <text class="sub" x="24" y="444">Real evidence. Keep the record.</text>

  <text class="tag" x="242" y="382">HOP 2</text>
  <text class="label" x="242" y="404">A function call.</text>
  <text class="label" x="242" y="422">No assertion at all.</text>
  <text class="sub" x="242" y="444">Authority is simply inherited.</text>

  <text class="tag" x="452" y="382">HOP 3</text>
  <text class="label" x="452" y="404">An agent card and a</text>
  <text class="label" x="452" y="422">task. No delegation field.</text>
  <text class="sub" x="452" y="444">Who is behind it is unstated.</text>

  <text class="tag" x="662" y="382">HOP 4</text>
  <text class="label" x="662" y="404">A bearer token scoped</text>
  <text class="label" x="662" y="422">to the calling service.</text>
  <text class="sub" x="662" y="444">Says nothing about the human.</text>

  <text class="sub" x="24" y="482">The duty not to delegate authority without explicit permission applies to hops 2, 3 and 4 — the three that carry no evidence of it.</text>
</svg>
