<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">The bill's duties, what a typical stack emits, and the gap</title>
  <desc id="d">Three columns. The first lists what the bill asks a custodial user agent to do: keep real-time records users can read, act only inside the granted authorisation, and never hand authority onward without explicit permission. The second lists what a typical stack emits today: traces and spans, a service credential shared across the fleet, and sub-agents spawned freely with no record. The third lists what closes the gap: a purpose-scoped grant with an expiry, a grant identifier stamped on every action, and sub-delegation made an explicit bounded operation.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="tag" x="24" y="34">S. 5051 DUTIES · YOUR STACK · THE WORK</text>

  <rect class="adj" x="24" y="54" width="272" height="196" />
  <text class="head" x="44" y="86">The bill asks for</text>
  <text class="label" x="44" y="116">Real-time action records the</text>
  <text class="label" x="44" y="134">user can actually read</text>
  <text class="label" x="44" y="164">No action beyond the granted</text>
  <text class="label" x="44" y="182">authorisation</text>
  <text class="label" x="44" y="212">No onward delegation without</text>
  <text class="label" x="44" y="230">explicit permission</text>

  <rect class="box" x="314" y="54" width="272" height="196" />
  <text class="head" x="334" y="86">Your stack emits</text>
  <text class="label" x="334" y="116">Traces and spans, readable by</text>
  <text class="label" x="334" y="134">engineers, retained 30 days</text>
  <text class="label" x="334" y="164">One service credential, scoped</text>
  <text class="label" x="334" y="182">to the fleet, not the task</text>
  <text class="label" x="334" y="212">Sub-agents spawned at will,</text>
  <text class="label" x="334" y="230">recorded nowhere</text>

  <rect class="hero" x="604" y="54" width="272" height="196" />
  <text class="head-inv" x="624" y="86">The work either way</text>
  <text class="label-inv" x="624" y="116">A purpose-scoped grant with an</text>
  <text class="label-inv" x="624" y="134">expiry and a revocation path</text>
  <text class="label-inv" x="624" y="164">grant_id stamped on every</text>
  <text class="label-inv" x="624" y="182">action, exercised scope logged</text>
  <text class="label-inv" x="624" y="212">Sub-delegation as an explicit,</text>
  <text class="label-inv" x="624" y="230">bounded, recorded operation</text>

  <text class="tag" x="24" y="282">The third column is worth building whether or not this bill ever reaches a floor vote.</text>
</svg>
