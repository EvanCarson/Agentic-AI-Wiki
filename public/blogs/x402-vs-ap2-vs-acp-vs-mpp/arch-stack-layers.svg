<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Four agent-payment protocols placed on the stack they occupy</title>
  <desc id="d">A vertical stack between an agent and a merchant or API. AP2 sits at the authorization layer carrying signed mandates. ACP sits at the checkout layer carrying a shared payment token. x402 and MPP sit at the settlement and transport layer. Underneath, card networks provide issuer authorization through Visa Trusted Agent Protocol and Mastercard Agent Pay.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .name   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .name-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="box" x="24" y="196" width="120" height="108" rx="8" />
  <text class="label" x="84" y="242" text-anchor="middle">Agent</text>
  <text class="sub" x="84" y="262" text-anchor="middle">acting for</text>
  <text class="sub" x="84" y="278" text-anchor="middle">a user</text>

  <rect class="box" x="756" y="196" width="120" height="108" rx="8" />
  <text class="label" x="816" y="242" text-anchor="middle">Merchant</text>
  <text class="sub" x="816" y="262" text-anchor="middle">or metered</text>
  <text class="sub" x="816" y="278" text-anchor="middle">API</text>

  <text class="tag" x="196" y="44">AUTHORIZATION — WAS THIS ALLOWED?</text>
  <rect class="hero" x="196" y="56" width="508" height="72" rx="8" />
  <text class="name-inv" x="220" y="84">AP2</text>
  <text class="label-inv" x="290" y="84">Intent · Cart · Payment mandates, signed as W3C Verifiable Credentials</text>
  <text class="sub-inv" x="220" y="108">Google, 60+ launch partners, governance donated to the FIDO Alliance. Produces evidence, not enforcement.</text>

  <text class="tag" x="196" y="168">CHECKOUT — WHAT IS IN THE CART?</text>
  <rect class="adj" x="196" y="180" width="508" height="72" rx="8" />
  <text class="name" x="220" y="208">ACP</text>
  <text class="label" x="290" y="208">Cart, feed, orders, and a Shared Payment Token per checkout</text>
  <text class="sub" x="220" y="232">OpenAI and Stripe. Live surface: Instant Checkout in ChatGPT. No card number held.</text>

  <text class="tag" x="196" y="292">SETTLEMENT — MOVE THE MONEY</text>
  <rect class="box" x="196" y="304" width="246" height="72" rx="8" />
  <text class="name" x="220" y="332">x402</text>
  <text class="sub" x="220" y="352">HTTP 402 revived; pay-per-request</text>
  <text class="sub" x="220" y="368">from a pre-funded wallet. Coinbase.</text>

  <rect class="box" x="458" y="304" width="246" height="72" rx="8" />
  <text class="name" x="482" y="332">MPP</text>
  <text class="sub" x="482" y="352">Machine payments for APIs and</text>
  <text class="sub" x="482" y="368">compute. Stripe and Tempo.</text>

  <text class="tag" x="196" y="416">EXISTING RAILS</text>
  <rect class="box" x="196" y="428" width="508" height="52" rx="8" />
  <text class="label" x="450" y="452" text-anchor="middle">Card networks — Visa Trusted Agent Protocol, Mastercard Agent Pay</text>
  <text class="sub" x="450" y="470" text-anchor="middle">Issuer authorization rules, agent attestation, and the chargeback you already have</text>

  <path class="arrow" d="M 144 236 L 188 236" />
  <path class="arrow" d="M 712 236 L 750 236" />
</svg>
