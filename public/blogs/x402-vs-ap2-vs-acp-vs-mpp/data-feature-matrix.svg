<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Agent payment protocols across four properties</title>
  <desc id="d">Heatmap matrix with rows for x402, MPP, ACP and AP2 and columns for enforcement at the moment of payment, after-the-fact evidence, reach without crypto rails, and live consumer checkout today. Each cell is marked strong, medium or weak.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .rowl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .coll  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .weak  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .med   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .str   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .cv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .leg   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="ttl" x="24" y="28">Where each protocol is strong</text>

  <text class="coll" x="270" y="58" text-anchor="middle">Refuses a bad</text>
  <text class="coll" x="270" y="74" text-anchor="middle">payment in flight</text>
  <text class="coll" x="440" y="58" text-anchor="middle">Proves who</text>
  <text class="coll" x="440" y="74" text-anchor="middle">authorised what</text>
  <text class="coll" x="610" y="58" text-anchor="middle">Works with no</text>
  <text class="coll" x="610" y="74" text-anchor="middle">crypto rail</text>
  <text class="coll" x="780" y="58" text-anchor="middle">Live consumer</text>
  <text class="coll" x="780" y="74" text-anchor="middle">checkout today</text>

  <text class="rowl" x="24" y="118">x402</text>
  <rect class="med"  x="190" y="94" width="160" height="42" rx="6" />
  <text class="cv"   x="270" y="120" text-anchor="middle">Medium</text>
  <rect class="med"  x="360" y="94" width="160" height="42" rx="6" />
  <text class="cv"   x="440" y="120" text-anchor="middle">Medium</text>
  <rect class="weak" x="530" y="94" width="160" height="42" rx="6" />
  <text class="cv"   x="610" y="120" text-anchor="middle">Weak</text>
  <rect class="weak" x="700" y="94" width="160" height="42" rx="6" />
  <text class="cv"   x="780" y="120" text-anchor="middle">Weak</text>

  <text class="rowl" x="24" y="180">MPP</text>
  <rect class="str"  x="190" y="156" width="160" height="42" rx="6" />
  <text class="cv-inv" x="270" y="182" text-anchor="middle">Strong (issuer)</text>
  <rect class="med"  x="360" y="156" width="160" height="42" rx="6" />
  <text class="cv"   x="440" y="182" text-anchor="middle">Medium</text>
  <rect class="str"  x="530" y="156" width="160" height="42" rx="6" />
  <text class="cv-inv" x="610" y="182" text-anchor="middle">Strong (cards)</text>
  <rect class="med"  x="700" y="156" width="160" height="42" rx="6" />
  <text class="cv"   x="780" y="182" text-anchor="middle">Medium</text>

  <text class="rowl" x="24" y="242">ACP</text>
  <rect class="str"  x="190" y="218" width="160" height="42" rx="6" />
  <text class="cv-inv" x="270" y="244" text-anchor="middle">Strong (token)</text>
  <rect class="med"  x="360" y="218" width="160" height="42" rx="6" />
  <text class="cv"   x="440" y="244" text-anchor="middle">Medium</text>
  <rect class="str"  x="530" y="218" width="160" height="42" rx="6" />
  <text class="cv-inv" x="610" y="244" text-anchor="middle">Strong</text>
  <rect class="str"  x="700" y="218" width="160" height="42" rx="6" />
  <text class="cv-inv" x="780" y="244" text-anchor="middle">Strong</text>

  <text class="rowl" x="24" y="304">AP2</text>
  <rect class="weak" x="190" y="280" width="160" height="42" rx="6" />
  <text class="cv"   x="270" y="306" text-anchor="middle">Weak on its own</text>
  <rect class="str"  x="360" y="280" width="160" height="42" rx="6" />
  <text class="cv-inv" x="440" y="306" text-anchor="middle">Strong (mandates)</text>
  <rect class="str"  x="530" y="280" width="160" height="42" rx="6" />
  <text class="cv-inv" x="610" y="306" text-anchor="middle">Strong</text>
  <rect class="weak" x="700" y="280" width="160" height="42" rx="6" />
  <text class="cv"   x="780" y="306" text-anchor="middle">Weak</text>

  <rect class="weak" x="24" y="358" width="14" height="14" rx="3" />
  <text class="leg" x="46" y="370">Weak</text>
  <rect class="med" x="130" y="358" width="14" height="14" rx="3" />
  <text class="leg" x="152" y="370">Medium</text>
  <rect class="str" x="250" y="358" width="14" height="14" rx="3" />
  <text class="leg" x="272" y="370">Strong</text>
</svg>
