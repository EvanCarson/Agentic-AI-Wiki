<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Where the spending limit lives in each protocol</title>
  <desc id="d">Four columns for x402, MPP, ACP and AP2, compared across three rows: where the cap is stored, who can raise it, and what a compromised agent can spend. x402 stores the cap in a pre-funded wallet balance, MPP and the card rails store it in issuer authorization rules, ACP stores it in a per-checkout shared payment token, and AP2 stores it in a mandate the user signed.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .head  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .cell  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .row   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="row" x="10" y="96">CAP LIVES IN</text>
  <text class="row" x="10" y="166">RAISED BY</text>
  <text class="row" x="10" y="236">IF INJECTED</text>

  <rect class="box" x="110" y="24" width="180" height="34" rx="8" />
  <text class="head" x="200" y="46" text-anchor="middle">x402</text>
  <rect class="box" x="300" y="24" width="180" height="34" rx="8" />
  <text class="head" x="390" y="46" text-anchor="middle">MPP + card rails</text>
  <rect class="adj" x="490" y="24" width="180" height="34" rx="8" />
  <text class="head" x="580" y="46" text-anchor="middle">ACP</text>
  <rect class="hero" x="680" y="24" width="180" height="34" rx="8" />
  <text class="head-inv" x="770" y="46" text-anchor="middle">AP2</text>

  <rect class="box" x="110" y="70" width="180" height="54" rx="8" />
  <text class="cell" x="200" y="94" text-anchor="middle">The wallet balance</text>
  <text class="cell" x="200" y="110" text-anchor="middle">you pre-funded.</text>
  <rect class="box" x="300" y="70" width="180" height="54" rx="8" />
  <text class="cell" x="390" y="94" text-anchor="middle">The issuer's</text>
  <text class="cell" x="390" y="110" text-anchor="middle">authorization rules.</text>
  <rect class="adj" x="490" y="70" width="180" height="54" rx="8" />
  <text class="cell" x="580" y="94" text-anchor="middle">A token minted for</text>
  <text class="cell" x="580" y="110" text-anchor="middle">exactly one checkout.</text>
  <rect class="hero" x="680" y="70" width="180" height="54" rx="8" />
  <text class="cell-inv" x="770" y="94" text-anchor="middle">A mandate the user</text>
  <text class="cell-inv" x="770" y="110" text-anchor="middle">signed, in the request.</text>

  <rect class="box" x="110" y="140" width="180" height="54" rx="8" />
  <text class="cell" x="200" y="164" text-anchor="middle">Anyone who can</text>
  <text class="cell" x="200" y="180" text-anchor="middle">top the wallet up.</text>
  <rect class="box" x="300" y="140" width="180" height="54" rx="8" />
  <text class="cell" x="390" y="164" text-anchor="middle">The bank, on its</text>
  <text class="cell" x="390" y="180" text-anchor="middle">own risk model.</text>
  <rect class="adj" x="490" y="140" width="180" height="54" rx="8" />
  <text class="cell" x="580" y="164" text-anchor="middle">Nobody — you mint</text>
  <text class="cell" x="580" y="180" text-anchor="middle">a new one instead.</text>
  <rect class="hero" x="680" y="140" width="180" height="54" rx="8" />
  <text class="cell-inv" x="770" y="164" text-anchor="middle">Only the user, with</text>
  <text class="cell-inv" x="770" y="180" text-anchor="middle">a fresh signature.</text>

  <rect class="box" x="110" y="210" width="180" height="54" rx="8" />
  <text class="cell" x="200" y="234" text-anchor="middle">The whole balance,</text>
  <text class="cell" x="200" y="250" text-anchor="middle">irreversibly.</text>
  <rect class="box" x="300" y="210" width="180" height="54" rx="8" />
  <text class="cell" x="390" y="234" text-anchor="middle">Up to the limit —</text>
  <text class="cell" x="390" y="250" text-anchor="middle">but chargeable back.</text>
  <rect class="adj" x="490" y="210" width="180" height="54" rx="8" />
  <text class="cell" x="580" y="234" text-anchor="middle">One cart, at the</text>
  <text class="cell" x="580" y="250" text-anchor="middle">price you approved.</text>
  <rect class="hero" x="680" y="210" width="180" height="54" rx="8" />
  <text class="cell-inv" x="770" y="234" text-anchor="middle">Nothing new — if the</text>
  <text class="cell-inv" x="770" y="250" text-anchor="middle">merchant checks.</text>

  <text class="row" x="10" y="288">STRONGEST CONTAINMENT AT THE RIGHT, AND IT DEPENDS ON A VERIFIER THAT MAY NOT EXIST YET</text>
</svg>
