<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">How 9,967 HIGH cloud findings were re-graded</title>
  <desc id="d">Horizontal bar chart of the re-grading outcome for 9,967 HIGH-severity cloud findings: 58.5 percent were downgraded, 24.9 percent kept the vendor grade, and 16.6 percent were upgraded.</desc>
  <style>
    .lead  { fill: var(--accent, #d4421e); }
    .mid   { fill: var(--accent-soft); }
    .trail { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .cat   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .val   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; fill: var(--ink); }
    .val-a { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; fill: var(--accent, #d4421e); }
    .grid  { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .axis  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .5; }
  </style>

  <text class="ttl" x="20" y="34">Re-grade outcome, 9,967 HIGH findings (% of all HIGHs)</text>

  <line class="grid" x1="260" y1="60" x2="260" y2="330" />
  <line class="grid" x1="400" y1="60" x2="400" y2="330" />
  <line class="grid" x1="540" y1="60" x2="540" y2="330" />
  <line class="grid" x1="680" y1="60" x2="680" y2="330" />
  <text class="axis" x="260" y="352" text-anchor="middle">15%</text>
  <text class="axis" x="400" y="352" text-anchor="middle">30%</text>
  <text class="axis" x="540" y="352" text-anchor="middle">45%</text>
  <text class="axis" x="680" y="352" text-anchor="middle">60%</text>

  <text class="cat" x="20" y="92">Downgraded</text>
  <text class="sub" x="20" y="110">severity lowered</text>
  <rect class="lead" x="180" y="76" width="546" height="40" rx="3" />
  <text class="val-a" x="738" y="102">58.5%</text>

  <text class="cat" x="20" y="172">Grade kept</text>
  <text class="sub" x="20" y="190">vendor rating stands</text>
  <rect class="trail" x="180" y="156" width="232" height="40" rx="3" />
  <text class="val" x="424" y="182">24.9%</text>

  <text class="cat" x="20" y="252">Upgraded</text>
  <text class="sub" x="20" y="270">severity raised</text>
  <rect class="mid" x="180" y="236" width="155" height="40" rx="3" />
  <text class="val" x="347" y="262">16.6%</text>

  <text class="sub" x="20" y="316">Three quarters of the findings moved. The bar nobody quotes is the third one.</text>
</svg>
