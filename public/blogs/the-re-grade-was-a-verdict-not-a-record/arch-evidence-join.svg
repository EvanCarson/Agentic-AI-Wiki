<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where a context-aware re-grade gets its evidence</title>
  <desc id="d">Flow diagram: a vendor rule emits one static severity per failing instance; the agent joins evidence from reachability, attachment state, network restrictions and account-level controls; an asymmetric test decides whether to lower, raise or keep the grade; the output is a verdict plus an evidence chain, which licenses queue ordering rather than closure.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .ln     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .ln-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .88; text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="30">One severity in, a verdict and a record out</text>

  <rect class="box" x="24" y="60" width="190" height="86" />
  <text class="hd" x="119" y="90">Vendor rule</text>
  <text class="ln" x="119" y="114">One static severity,</text>
  <text class="ln" x="119" y="132">every failing instance</text>

  <path class="arrow" d="M 214 103 L 268 103" />

  <rect class="adj" x="270" y="60" width="230" height="200" />
  <text class="hd" x="385" y="88">Evidence join</text>
  <text class="vd" x="385" y="116">internet reachability</text>
  <text class="vd" x="385" y="138">attachment / orphan state</text>
  <text class="vd" x="385" y="160">source-range narrowness</text>
  <text class="vd" x="385" y="182">account-level blocks</text>
  <text class="vd" x="385" y="204">live service present</text>
  <text class="ln" x="385" y="238">~half of verdicts used</text>
  <text class="ln" x="385" y="252">off-resource evidence</text>

  <path class="arrow" d="M 500 160 L 554 160" />

  <rect class="box" x="556" y="60" width="200" height="200" />
  <text class="hd" x="656" y="88">Asymmetric test</text>
  <text class="ln" x="656" y="116">Lower: needs a property</text>
  <text class="ln" x="656" y="134">that offsets the path</text>
  <text class="ln" x="656" y="166">Raise: needs the condition</text>
  <text class="ln" x="656" y="184">to be worse here, and no</text>
  <text class="ln" x="656" y="202">guardrail in front of it</text>
  <text class="vd" x="656" y="236">else: keep the grade</text>

  <path class="arrow" d="M 656 260 L 656 304" />

  <rect class="hero" x="300" y="306" width="300" height="80" />
  <text class="hd-inv" x="450" y="336">Verdict + evidence chain</text>
  <text class="ln-inv" x="450" y="362">The chain is the part you can defend</text>

  <path class="arrow" d="M 450 386 L 450 420" />

  <rect class="adj" x="180" y="422" width="250" height="56" />
  <text class="hd" x="305" y="446">Queue ordering</text>
  <text class="ln" x="305" y="466">What the result licenses</text>

  <rect class="box" x="470" y="422" width="250" height="56" />
  <text class="hd" x="595" y="446">Closure</text>
  <text class="ln" x="595" y="466">What it does not</text>
</svg>
