<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Verdict, record and authority compared</title>
  <desc id="d">Three columns comparing what a re-grading agent produces: the verdict, which the same team's benchmark reports at 94 percent against 78 percent answer correctness; the evidence record, which is the weaker half and the one an auditor reads; and the authority to close a finding, which no measurement in either study confers.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); text-anchor: middle; }
    .ln     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .ln-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .88; text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
  </style>

  <text class="ttl" x="20" y="30">Three things a re-grade could be, and only one is measured well</text>

  <rect class="hero" x="30" y="55" width="260" height="190" />
  <text class="hd-inv" x="160" y="86">The verdict</text>
  <text class="ln-inv" x="160" y="114">Higher, lower, unchanged</text>
  <text class="ln-inv" x="160" y="132">— one of three labels</text>
  <text class="ln-inv" x="160" y="178">Reported at</text>
  <text class="vd-inv" x="160" y="202">94% on the benchmark</text>

  <rect class="adj" x="320" y="55" width="260" height="190" />
  <text class="hd" x="450" y="86">The record</text>
  <text class="ln" x="450" y="114">Which evidence, from</text>
  <text class="ln" x="450" y="132">which systems, joined how</text>
  <text class="ln" x="450" y="178">Answer correctness</text>
  <text class="vd" x="450" y="202">78% at full context</text>

  <rect class="box" x="610" y="55" width="260" height="190" />
  <text class="hd" x="740" y="86">The authority</text>
  <text class="ln" x="740" y="114">Permission to close the</text>
  <text class="ln" x="740" y="132">finding and stop looking</text>
  <text class="ln" x="740" y="178">Measured by</text>
  <text class="vd" x="740" y="202">neither study</text>

  <text class="ln" x="450" y="278">The gap between columns one and two is what an auditor reads. Column three is a policy choice you make.</text>
</svg>
