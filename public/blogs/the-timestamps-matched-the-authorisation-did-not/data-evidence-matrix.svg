<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="emt emd">
  <title id="emt">Four questions against three kinds of evidence</title>
  <desc id="emd">A four by three matrix. Who ran the agent: established in WorkOS logs because the submitted timestamps matched, and agreed by the independent investigator; nothing rests on the operator's word. When it ran and how much it took: established as 25 October to 30 October in the logs, and the scope was validated by the investigator; nothing rests on the operator's word. Whether the agent escaped its sandbox: no artefact in the logs, no sandbox weakness identified in the forensic work, so the claim rests on the operator's word. Whether the copied data was deleted: not observable in the logs, outside the scope of the forensic work, so it too rests on the operator's word. Legend: established, asserted, not available.</desc>
  <style>
    .em-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .em-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .em-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .em-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .em-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .em-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .em-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .em-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .em-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="em-ttl" x="20" y="30">What each kind of evidence can settle</text>

  <text class="em-col" x="330" y="66" text-anchor="middle">WorkOS logs</text>
  <text class="em-col" x="550" y="66" text-anchor="middle">Forensic review</text>
  <text class="em-col" x="770" y="66" text-anchor="middle">Operator only</text>

  <text class="em-row" x="20" y="113">Who ran the agent</text>
  <rect class="em-strong" x="230" y="84" width="200" height="48" />
  <text class="em-inv" x="330" y="113" text-anchor="middle">Timestamps matched</text>
  <rect class="em-strong" x="450" y="84" width="200" height="48" />
  <text class="em-inv" x="550" y="113" text-anchor="middle">Investigator agreed</text>
  <rect class="em-weak" x="670" y="84" width="200" height="48" />
  <text class="em-cell" x="770" y="113" text-anchor="middle">Nothing rests here</text>

  <text class="em-row" x="20" y="175">When, and how much</text>
  <rect class="em-strong" x="230" y="146" width="200" height="48" />
  <text class="em-inv" x="330" y="175" text-anchor="middle">25 Oct to 30 Oct</text>
  <rect class="em-strong" x="450" y="146" width="200" height="48" />
  <text class="em-inv" x="550" y="175" text-anchor="middle">Scope validated</text>
  <rect class="em-weak" x="670" y="146" width="200" height="48" />
  <text class="em-cell" x="770" y="175" text-anchor="middle">Nothing rests here</text>

  <text class="em-row" x="20" y="237">Whether it escaped</text>
  <rect class="em-weak" x="230" y="208" width="200" height="48" />
  <text class="em-cell" x="330" y="237" text-anchor="middle">No artefact</text>
  <rect class="em-weak" x="450" y="208" width="200" height="48" />
  <text class="em-cell" x="550" y="237" text-anchor="middle">None identified</text>
  <rect class="em-mid" x="670" y="208" width="200" height="48" />
  <text class="em-cell" x="770" y="237" text-anchor="middle">The whole claim</text>

  <text class="em-row" x="20" y="299">Whether data was deleted</text>
  <rect class="em-weak" x="230" y="270" width="200" height="48" />
  <text class="em-cell" x="330" y="299" text-anchor="middle">Not observable</text>
  <rect class="em-weak" x="450" y="270" width="200" height="48" />
  <text class="em-cell" x="550" y="299" text-anchor="middle">Out of scope</text>
  <rect class="em-mid" x="670" y="270" width="200" height="48" />
  <text class="em-cell" x="770" y="299" text-anchor="middle">The whole claim</text>

  <rect class="em-strong" x="20" y="352" width="18" height="14" />
  <text class="em-leg" x="48" y="364">Established</text>
  <rect class="em-mid" x="200" y="352" width="18" height="14" />
  <text class="em-leg" x="228" y="364">Asserted</text>
  <rect class="em-weak" x="380" y="352" width="18" height="14" />
  <text class="em-leg" x="408" y="364">No evidence either way</text>
</svg>
