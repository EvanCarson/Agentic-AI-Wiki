<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three answers to who holds the provider credential</title>
  <desc id="d">Three columns. You hold it, on a gateway you run: the provider account and rate limits are yours, and prompts stay inside your perimeter. You hold it, on a managed gateway using bring-your-own-key: the account is yours but the traffic and often a fee pass through the vendor. The gateway holds it: you buy credits, the vendor owns the provider relationship, and your fallback when it is down is an account you do not have.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
    .head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--paper); text-anchor: middle; }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; text-anchor: middle; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; text-anchor: middle; }
    .title { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink); }
  </style>

  <text class="title" x="40" y="32">Who holds the provider credential</text>

  <rect class="box" x="40" y="52" width="240" height="188" />
  <text class="head" x="160" y="82">You, on your own gateway</text>
  <text class="sub" x="160" y="110">LiteLLM, Helicone or Portkey,</text>
  <text class="sub" x="160" y="132">self-hosted.</text>
  <text class="sub" x="160" y="162">Provider account and rate</text>
  <text class="sub" x="160" y="184">limits are yours. Prompts stay</text>
  <text class="sub" x="160" y="206">inside your perimeter.</text>
  <text class="sub" x="160" y="230">You operate it.</text>

  <rect class="adj" x="330" y="52" width="240" height="188" />
  <text class="head" x="450" y="82">You, via bring-your-own-key</text>
  <text class="sub" x="450" y="110">Managed control plane,</text>
  <text class="sub" x="450" y="132">your keys behind it.</text>
  <text class="sub" x="450" y="162">Account stays yours; traffic</text>
  <text class="sub" x="450" y="184">and often a fee pass through</text>
  <text class="sub" x="450" y="206">the vendor.</text>
  <text class="sub" x="450" y="230">Nothing to operate.</text>

  <rect class="hero" x="620" y="52" width="240" height="188" />
  <text class="head-inv" x="740" y="82">The gateway holds it</text>
  <text class="sub-inv" x="740" y="110">You buy credits; the vendor</text>
  <text class="sub-inv" x="740" y="132">owns the provider relationship.</text>
  <text class="sub-inv" x="740" y="162">Fastest to start, widest</text>
  <text class="sub-inv" x="740" y="184">catalogue.</text>
  <text class="sub-inv" x="740" y="212">Your fallback is an account</text>
  <text class="sub-inv" x="740" y="234">you do not have.</text>

  <text class="sub" x="450" y="278">The column you pick decides your outage story before it decides anything about features.</text>
</svg>
