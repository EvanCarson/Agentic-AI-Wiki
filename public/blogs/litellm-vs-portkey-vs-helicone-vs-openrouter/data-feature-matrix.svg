<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Where each gateway leans hardest</title>
  <desc id="d">Four rows by four columns. LiteLLM is strong on self-hosting and provider breadth, medium on in-path control, weak on managed operations. Portkey is strong on in-path control and managed operations, medium on self-hosting and provider breadth. Helicone is strong on observability depth and offers a deliberate off-path mode, medium on in-path control and self-hosting. OpenRouter is strong on provider breadth and managed operations, weak on self-hosting and on holding your own credential.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .medium { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink); }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); text-anchor: middle; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); text-anchor: middle; }
    .leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="title" x="40" y="32">Where each one leans hardest</text>

  <text class="col" x="290" y="66">Self-host it</text>
  <text class="col" x="450" y="66">In-path control</text>
  <text class="col" x="610" y="66">Provider breadth</text>
  <text class="col" x="780" y="66">Zero-ops</text>

  <text class="row" x="40" y="106">LiteLLM</text>
  <rect class="strong" x="220" y="84" width="140" height="34" />
  <text class="cell-inv" x="290" y="106">Strong</text>
  <rect class="medium" x="380" y="84" width="140" height="34" />
  <text class="cell" x="450" y="106">Medium</text>
  <rect class="strong" x="540" y="84" width="140" height="34" />
  <text class="cell-inv" x="610" y="106">Strong</text>
  <rect class="weak" x="700" y="84" width="140" height="34" />
  <text class="cell" x="770" y="106">Weak</text>

  <text class="row" x="40" y="164">Portkey</text>
  <rect class="medium" x="220" y="142" width="140" height="34" />
  <text class="cell" x="290" y="164">Medium</text>
  <rect class="strong" x="380" y="142" width="140" height="34" />
  <text class="cell-inv" x="450" y="164">Strong</text>
  <rect class="medium" x="540" y="142" width="140" height="34" />
  <text class="cell" x="610" y="164">Medium</text>
  <rect class="strong" x="700" y="142" width="140" height="34" />
  <text class="cell-inv" x="770" y="164">Strong</text>

  <text class="row" x="40" y="222">Helicone</text>
  <rect class="medium" x="220" y="200" width="140" height="34" />
  <text class="cell" x="290" y="222">Medium</text>
  <rect class="medium" x="380" y="200" width="140" height="34" />
  <text class="cell" x="450" y="222">Optional</text>
  <rect class="medium" x="540" y="200" width="140" height="34" />
  <text class="cell" x="610" y="222">Medium</text>
  <rect class="strong" x="700" y="200" width="140" height="34" />
  <text class="cell-inv" x="770" y="222">Strong</text>

  <text class="row" x="40" y="280">OpenRouter</text>
  <rect class="weak" x="220" y="258" width="140" height="34" />
  <text class="cell" x="290" y="280">Weak</text>
  <rect class="medium" x="380" y="258" width="140" height="34" />
  <text class="cell" x="450" y="280">Medium</text>
  <rect class="strong" x="540" y="258" width="140" height="34" />
  <text class="cell-inv" x="610" y="280">Strong</text>
  <rect class="strong" x="700" y="258" width="140" height="34" />
  <text class="cell-inv" x="770" y="280">Strong</text>

  <rect class="strong" x="40" y="330" width="18" height="18" />
  <text class="leg" x="66" y="345">Strong</text>
  <rect class="medium" x="150" y="330" width="18" height="18" />
  <text class="leg" x="176" y="345">Medium / optional</text>
  <rect class="weak" x="320" y="330" width="18" height="18" />
  <text class="leg" x="346" y="345">Weak or not offered</text>

  <text class="leg" x="40" y="378">"Optional" marks Helicone's documented choice between a proxy and off-path async logging.</text>
</svg>
