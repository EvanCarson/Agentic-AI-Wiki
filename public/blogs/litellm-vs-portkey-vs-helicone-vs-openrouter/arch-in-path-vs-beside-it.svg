<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">A gateway in the request path compared with one beside it</title>
  <desc id="d">Top: the in-path deployment sends the agent's call through the gateway to the provider, so the gateway can cache, fall back, rate limit and rotate keys, but it is also a dependency whose outage stops the agent. Bottom: the beside-the-path deployment calls the provider directly and ships a copy of the exchange to the observability service afterwards, so an outage costs only telemetry, but nothing can be changed in flight.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink); }
    .lab    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .lab-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .68; }
    .sub-c  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .68; text-anchor: middle; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.4; marker-end: url(#arr); }
    .arrow-d { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 4 4; marker-end: url(#arr); }
    .rule   { stroke: var(--border-soft); stroke-width: 1; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="40" y="34">In the path — proxy</text>

  <rect class="box" x="40" y="56" width="180" height="64" />
  <text class="lab" x="130" y="94">Agent loop</text>

  <rect class="hero" x="330" y="56" width="220" height="64" />
  <text class="lab-inv" x="440" y="94">Gateway</text>

  <rect class="box" x="660" y="56" width="200" height="64" />
  <text class="lab" x="760" y="94">Model provider</text>

  <path class="arrow" d="M 224 88 L 324 88" />
  <path class="arrow" d="M 556 88 L 654 88" />

  <text class="sub" x="40" y="152">Can change the request in flight:</text>
  <text class="sub" x="40" y="174">semantic and exact caching · retry and provider fallback · rate limits and</text>
  <text class="sub" x="40" y="196">spend caps · key issuance and rotation · guardrails and redaction · routing.</text>
  <text class="sub" x="40" y="222">Costs: one more hop on every step, and an availability dependency —</text>
  <text class="sub" x="40" y="244">if it is down, the agent is down unless you coded the bypass yourself.</text>

  <line class="rule" x1="40" y1="272" x2="860" y2="272" />

  <text class="head" x="40" y="306">Beside the path — async logging</text>

  <rect class="box" x="40" y="328" width="180" height="64" />
  <text class="lab" x="130" y="366">Agent loop</text>

  <rect class="box" x="660" y="328" width="200" height="64" />
  <text class="lab" x="760" y="366">Model provider</text>

  <path class="arrow" d="M 224 360 L 654 360" />

  <rect class="adj" x="330" y="424" width="220" height="56" />
  <text class="lab" x="440" y="458">Observability service</text>
  <path class="arrow-d" d="M 400 366 L 420 418" />

  <text class="sub-c" x="440" y="404">copy of the exchange, after the fact</text>

  <text class="sub" x="600" y="446">Outage costs telemetry only.</text>
  <text class="sub" x="600" y="468">Nothing can be changed in flight.</text>
</svg>
