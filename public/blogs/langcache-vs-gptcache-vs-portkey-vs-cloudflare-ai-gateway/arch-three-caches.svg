<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="tct tcd">
  <title id="tct">Three caches on one request path</title>
  <desc id="tcd">A left to right pipeline. The agent loop sends a turn to a gateway, which holds the exact-match and semantic caches keyed on the whole prompt. On a miss the request goes to the provider API, which holds a prefix cache keyed on the unchanged head of the prompt, and from there to the model. A changed tool result at the tail of the prompt defeats both gateway caches and leaves the provider prefix cache intact, which is why the prefix cache is the one that pays in an agent loop.</desc>
  <style>
    .tc-box { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .tc-hero{ fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .tc-adj { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .tc-lab { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .tc-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .tc-in2 { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .9; }
    .tc-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .tc-cel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .tc-ttl { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .tc-arr { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#tcarr); }
  </style>
  <defs>
    <marker id="tcarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="tc-ttl" x="20" y="36">Where each cache sits, and what each one is keyed on</text>

  <rect class="tc-hero" x="40" y="200" width="160" height="90" />
  <text class="tc-inv" x="120" y="238" text-anchor="middle">Agent loop</text>
  <text class="tc-in2" x="120" y="258" text-anchor="middle">turn n of many</text>

  <path class="tc-arr" d="M 200 245 L 254 245" />
  <text class="tc-cel" x="227" y="232" text-anchor="middle">ask</text>

  <rect class="tc-adj" x="260" y="180" width="180" height="130" />
  <text class="tc-lab" x="350" y="222" text-anchor="middle">Gateway</text>
  <text class="tc-cel" x="350" y="248" text-anchor="middle">exact key match</text>
  <text class="tc-cel" x="350" y="270" text-anchor="middle">semantic match</text>

  <path class="tc-arr" d="M 440 245 L 494 245" />
  <text class="tc-cel" x="467" y="232" text-anchor="middle">miss</text>

  <rect class="tc-box" x="500" y="180" width="170" height="130" />
  <text class="tc-lab" x="585" y="222" text-anchor="middle">Provider API</text>
  <text class="tc-cel" x="585" y="248" text-anchor="middle">prefix cache</text>
  <text class="tc-cel" x="585" y="270" text-anchor="middle">on the prompt head</text>

  <path class="tc-arr" d="M 670 245 L 724 245" />
  <text class="tc-cel" x="700" y="232" text-anchor="middle">tokens</text>

  <rect class="tc-box" x="730" y="200" width="130" height="90" />
  <text class="tc-lab" x="795" y="250" text-anchor="middle">Model</text>

  <text class="tc-sub" x="40" y="360">Appends a tool result</text>
  <text class="tc-sub" x="40" y="378">to the tail each turn</text>

  <text class="tc-sub" x="260" y="360">Keyed on the whole</text>
  <text class="tc-sub" x="260" y="378">prompt, so the tail</text>
  <text class="tc-sub" x="260" y="396">defeats it</text>

  <text class="tc-sub" x="500" y="360">Keyed on the unchanged</text>
  <text class="tc-sub" x="500" y="378">head, so the tail</text>
  <text class="tc-sub" x="500" y="396">does not</text>

  <text class="tc-sub" x="730" y="360">Pays either way</text>
  <text class="tc-sub" x="730" y="378">for the output</text>
</svg>
