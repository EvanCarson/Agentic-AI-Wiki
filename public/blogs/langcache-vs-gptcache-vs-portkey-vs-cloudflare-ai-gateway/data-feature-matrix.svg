<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmt fmd">
  <title id="fmt">Four answer-reuse layers compared</title>
  <desc id="fmd">A four by three matrix. Redis LangCache matches with trained embedding and reranker models, lets you set the threshold per cache, and is in public preview. GPTCache offers pluggable embeddings and in-code thresholds, but has had no tagged release since 2024. Portkey matches exact keys first then cosine similarity, documents a default threshold of 0.95, and ships as a gateway feature. Cloudflare AI Gateway offers exact-match caching only, so no threshold applies and semantic matching is not shipped. Legend: strong, partial, weak or absent.</desc>
  <style>
    .fm-s   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .fm-m   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .fm-w   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .fm-ttl { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .fm-col { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .fm-row { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .fm-cel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .fm-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .fm-leg { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
  </style>

  <text class="fm-ttl" x="20" y="30">Matching, threshold control, and status</text>

  <text class="fm-col" x="330" y="66" text-anchor="middle">What it matches on</text>
  <text class="fm-col" x="550" y="66" text-anchor="middle">Who sets the threshold</text>
  <text class="fm-col" x="770" y="66" text-anchor="middle">Status, Nov 2026</text>

  <text class="fm-row" x="20" y="113">Redis LangCache</text>
  <rect class="fm-s" x="230" y="84" width="200" height="48" />
  <text class="fm-inv" x="330" y="113" text-anchor="middle">Embedding + reranker</text>
  <rect class="fm-s" x="450" y="84" width="200" height="48" />
  <text class="fm-inv" x="550" y="113" text-anchor="middle">You, per cache</text>
  <rect class="fm-m" x="670" y="84" width="200" height="48" />
  <text class="fm-cel" x="770" y="113" text-anchor="middle">Public preview</text>

  <text class="fm-row" x="20" y="175">GPTCache</text>
  <rect class="fm-s" x="230" y="146" width="200" height="48" />
  <text class="fm-inv" x="330" y="175" text-anchor="middle">Pluggable embeddings</text>
  <rect class="fm-s" x="450" y="146" width="200" height="48" />
  <text class="fm-inv" x="550" y="175" text-anchor="middle">You, in code</text>
  <rect class="fm-w" x="670" y="146" width="200" height="48" />
  <text class="fm-cel" x="770" y="175" text-anchor="middle">No release since 2024</text>

  <text class="fm-row" x="20" y="237">Portkey</text>
  <rect class="fm-m" x="230" y="208" width="200" height="48" />
  <text class="fm-cel" x="330" y="237" text-anchor="middle">Exact key, then cosine</text>
  <rect class="fm-m" x="450" y="208" width="200" height="48" />
  <text class="fm-cel" x="550" y="237" text-anchor="middle">Default 0.95, eligibility caps</text>
  <rect class="fm-s" x="670" y="208" width="200" height="48" />
  <text class="fm-inv" x="770" y="237" text-anchor="middle">Shipping gateway feature</text>

  <text class="fm-row" x="20" y="299">Cloudflare AI Gateway</text>
  <rect class="fm-w" x="230" y="270" width="200" height="48" />
  <text class="fm-cel" x="330" y="299" text-anchor="middle">Exact match only</text>
  <rect class="fm-w" x="450" y="270" width="200" height="48" />
  <text class="fm-cel" x="550" y="299" text-anchor="middle">Not applicable</text>
  <rect class="fm-w" x="670" y="270" width="200" height="48" />
  <text class="fm-cel" x="770" y="299" text-anchor="middle">Semantic not shipped</text>

  <rect class="fm-s" x="20" y="352" width="18" height="14" />
  <text class="fm-leg" x="48" y="364">Strong</text>
  <rect class="fm-m" x="240" y="352" width="18" height="14" />
  <text class="fm-leg" x="268" y="364">Partial</text>
  <rect class="fm-w" x="450" y="352" width="18" height="14" />
  <text class="fm-leg" x="478" y="364">Weak or absent</text>
</svg>
