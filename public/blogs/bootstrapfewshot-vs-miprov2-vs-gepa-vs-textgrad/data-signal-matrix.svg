<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Which optimizer your evaluation function can actually feed</title>
  <desc id="d">A four by four heatmap. Rows are BootstrapFewShot, MIPROv2, GEPA and TextGrad. Columns are works on a bare scalar, exploits text feedback, small labelled set is enough, and cheap to run. BootstrapFewShot is strong on the scalar, weak on text feedback, and strong on both set size and cost. MIPROv2 is strong on the scalar, weak on text feedback, and medium on set size and cost. GEPA is medium on the scalar, strong on text feedback and set size, medium on cost. TextGrad is weak on the scalar, strong on text feedback and set size, medium on cost. The left column and the second column are close to mutually exclusive.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .medium { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .note   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="chart-title" x="30" y="34">The first two columns are nearly mutually exclusive</text>

  <text class="col" x="285" y="72" text-anchor="middle">Runs on a bare scalar</text>
  <text class="col" x="435" y="72" text-anchor="middle">Exploits text feedback</text>
  <text class="col" x="585" y="72" text-anchor="middle">Small labelled set OK</text>
  <text class="col" x="735" y="72" text-anchor="middle">Cheap to run</text>

  <text class="row" x="30" y="112">BootstrapFewShot</text>
  <rect class="strong" x="215" y="86" width="140" height="44" rx="6" />
  <text class="cell-inv" x="285" y="113" text-anchor="middle">Strong (all it needs)</text>
  <rect class="weak" x="365" y="86" width="140" height="44" rx="6" />
  <text class="cell" x="435" y="113" text-anchor="middle">Weak (ignores it)</text>
  <rect class="strong" x="515" y="86" width="140" height="44" rx="6" />
  <text class="cell-inv" x="585" y="113" text-anchor="middle">Strong (tens)</text>
  <rect class="strong" x="665" y="86" width="140" height="44" rx="6" />
  <text class="cell-inv" x="735" y="113" text-anchor="middle">Strong (one pass)</text>

  <text class="row" x="30" y="176">MIPROv2</text>
  <rect class="strong" x="215" y="150" width="140" height="44" rx="6" />
  <text class="cell-inv" x="285" y="177" text-anchor="middle">Strong (designed for)</text>
  <rect class="weak" x="365" y="150" width="140" height="44" rx="6" />
  <text class="cell" x="435" y="177" text-anchor="middle">Weak (ignores it)</text>
  <rect class="medium" x="515" y="150" width="140" height="44" rx="6" />
  <text class="cell" x="585" y="177" text-anchor="middle">Medium (hundreds)</text>
  <rect class="medium" x="665" y="150" width="140" height="44" rx="6" />
  <text class="cell" x="735" y="177" text-anchor="middle">Medium (search)</text>

  <text class="row" x="30" y="240">GEPA</text>
  <rect class="medium" x="215" y="214" width="140" height="44" rx="6" />
  <text class="cell" x="285" y="241" text-anchor="middle">Medium (works, dulled)</text>
  <rect class="strong" x="365" y="214" width="140" height="44" rx="6" />
  <text class="cell-inv" x="435" y="241" text-anchor="middle">Strong (its edge)</text>
  <rect class="strong" x="515" y="214" width="140" height="44" rx="6" />
  <text class="cell-inv" x="585" y="241" text-anchor="middle">Strong (sample-efficient)</text>
  <rect class="medium" x="665" y="214" width="140" height="44" rx="6" />
  <text class="cell" x="735" y="241" text-anchor="middle">Medium (reflection calls)</text>

  <text class="row" x="30" y="304">TextGrad</text>
  <rect class="weak" x="215" y="278" width="140" height="44" rx="6" />
  <text class="cell" x="285" y="305" text-anchor="middle">Weak (needs a critic)</text>
  <rect class="strong" x="365" y="278" width="140" height="44" rx="6" />
  <text class="cell-inv" x="435" y="305" text-anchor="middle">Strong (is the gradient)</text>
  <rect class="strong" x="515" y="278" width="140" height="44" rx="6" />
  <text class="cell-inv" x="585" y="305" text-anchor="middle">Strong (few examples)</text>
  <rect class="medium" x="665" y="278" width="140" height="44" rx="6" />
  <text class="cell" x="735" y="305" text-anchor="middle">Medium (critic calls)</text>

  <rect class="strong" x="30" y="342" width="16" height="16" rx="3" />
  <text class="cell" x="54" y="355">Strong</text>
  <rect class="medium" x="130" y="342" width="16" height="16" rx="3" />
  <text class="cell" x="154" y="355">Medium</text>
  <rect class="weak" x="240" y="342" width="16" height="16" rx="3" />
  <text class="cell" x="264" y="355">Weak</text>

  <text class="note" x="30" y="386">READ THE FIRST TWO COLUMNS AGAINST YOUR OWN METRIC BEFORE READING ANY BENCHMARK TABLE</text>
</svg>
