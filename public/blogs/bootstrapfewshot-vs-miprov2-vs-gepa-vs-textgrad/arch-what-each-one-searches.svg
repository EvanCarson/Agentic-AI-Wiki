<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">What each prompt optimizer mutates, and what signal it consumes</title>
  <desc id="d">A program box on the left feeds an evaluation box on the right, and a return path runs back to four optimizers. BootstrapFewShot mutates only the demonstration examples and consumes a pass or fail score. MIPROv2 mutates instructions and demonstrations together and consumes a scalar score over many rollouts. GEPA mutates instruction text by reflecting on the run trajectory and consumes a score plus any diagnostic text the metric returns. TextGrad mutates any text variable in the graph and consumes a natural-language critique written by a second model. The return arrow carries a different payload for each.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .hdr   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .8; }
    .sig   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .note  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="title" x="30" y="32">Same loop, four different return payloads</text>

  <rect class="hero" x="30" y="58" width="200" height="66" rx="8" />
  <text class="label-inv" x="130" y="87" text-anchor="middle">Your program</text>
  <text class="sub-inv" x="130" y="105" text-anchor="middle">instructions + demos + calls</text>

  <path class="arrow" d="M 240 91 L 340 91" />

  <rect class="adj" x="350" y="58" width="200" height="66" rx="8" />
  <text class="label" x="450" y="87" text-anchor="middle">Your metric</text>
  <text class="sub" x="450" y="105" text-anchor="middle">what it returns is the choice</text>

  <path class="arrow" d="M 560 91 L 660 91" />

  <rect class="box" x="670" y="58" width="200" height="66" rx="8" />
  <text class="label" x="770" y="87" text-anchor="middle">Score, and maybe</text>
  <text class="label" x="770" y="105" text-anchor="middle">a sentence</text>

  <path class="arrow" d="M 770 132 L 770 160 L 130 160 L 130 186" />

  <text class="hdr" x="30" y="212">BootstrapFewShot</text>
  <rect class="box" x="30" y="222" width="195" height="72" rx="8" />
  <text class="label" x="127" y="250" text-anchor="middle">Mutates: demos</text>
  <text class="sub" x="127" y="268" text-anchor="middle">keeps traces that passed</text>
  <text class="sig" x="127" y="286" text-anchor="middle">needs: pass / fail</text>

  <text class="hdr" x="250" y="212">MIPROv2</text>
  <rect class="box" x="250" y="222" width="195" height="72" rx="8" />
  <text class="label" x="347" y="250" text-anchor="middle">Mutates: both</text>
  <text class="sub" x="347" y="268" text-anchor="middle">joint instruction + demo search</text>
  <text class="sig" x="347" y="286" text-anchor="middle">needs: a scalar, many rollouts</text>

  <text class="hdr" x="470" y="212">GEPA</text>
  <rect class="adj" x="470" y="222" width="195" height="72" rx="8" />
  <text class="label" x="567" y="250" text-anchor="middle">Mutates: instructions</text>
  <text class="sub" x="567" y="268" text-anchor="middle">reflects on the trajectory</text>
  <text class="sig" x="567" y="286" text-anchor="middle">wants: score + diagnosis</text>

  <text class="hdr" x="690" y="212">TextGrad</text>
  <rect class="adj" x="690" y="222" width="195" height="72" rx="8" />
  <text class="label" x="787" y="250" text-anchor="middle">Mutates: any text var</text>
  <text class="sub" x="787" y="268" text-anchor="middle">critique flows back through</text>
  <text class="sig" x="787" y="286" text-anchor="middle">needs: a written critique</text>

  <path class="arrow" d="M 127 302 L 127 336 L 400 336 L 400 366" />
  <path class="arrow" d="M 347 302 L 347 336" />
  <path class="arrow" d="M 567 302 L 567 336 L 400 336" />
  <path class="arrow" d="M 787 302 L 787 336 L 400 336" />

  <rect class="hero" x="250" y="366" width="300" height="62" rx="8" />
  <text class="label-inv" x="400" y="393" text-anchor="middle">A new program</text>
  <text class="sub-inv" x="400" y="411" text-anchor="middle">fitted to this model version</text>

  <text class="note" x="30" y="458">THE LEFT TWO CAN RUN ON A BARE NUMBER. THE RIGHT TWO WANT WORDS, AND LOSE MOST OF THEIR EDGE WITHOUT THEM</text>
  <text class="note" x="30" y="476">THE OUTPUT IS A FITTED ARTEFACT: SWAP THE MODEL AND THE SEARCH HAS TO RUN AGAIN</text>
</svg>
