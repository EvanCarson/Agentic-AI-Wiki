<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Reported gains for GEPA over its published baselines</title>
  <desc id="d">Horizontal bar chart of four reported margins from the GEPA literature. GEPA over GRPO reaches up to twenty percent. GEPA over MIPROv2 is thirteen percent aggregate on Qwen3 8B across six tasks. On AIME 2025 with GPT-4.1 Mini, GEPA is twelve percent over MIPROv2 and ten percent over the unoptimized baseline. Every one of these margins was measured on a task with a free automatic checker, which is the condition most production tasks do not meet.</desc>
  <style>
    .bar-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .bar-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .bar-mute { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .grid     { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 3 4; }
    .axis     { stroke: var(--ink); stroke-width: 1.25; opacity: .5; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .key      { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .keysub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .val      { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .tick     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .55; }
    .note     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="chart-title" x="30" y="34">Reported margins, and what they were measured on</text>

  <line class="grid" x1="336" y1="52" x2="336" y2="300" />
  <line class="grid" x1="452" y1="52" x2="452" y2="300" />
  <line class="grid" x1="568" y1="52" x2="568" y2="300" />
  <line class="grid" x1="684" y1="52" x2="684" y2="300" />
  <line class="grid" x1="800" y1="52" x2="800" y2="300" />

  <text class="key" x="30" y="82">GEPA over GRPO</text>
  <text class="keysub" x="30" y="98">six tasks, Qwen3 8B</text>
  <rect class="bar-hero" x="220" y="64" width="464" height="44" rx="4" />
  <text class="val" x="696" y="92">up to +20%</text>

  <text class="key" x="30" y="152">GEPA over MIPROv2</text>
  <text class="keysub" x="30" y="168">aggregate, same setup</text>
  <rect class="bar-adj" x="220" y="134" width="302" height="44" rx="4" />
  <text class="val" x="534" y="162">+13%</text>

  <text class="key" x="30" y="222">GEPA over MIPROv2</text>
  <text class="keysub" x="30" y="238">AIME 2025, GPT-4.1 Mini</text>
  <rect class="bar-mute" x="220" y="204" width="278" height="44" rx="4" />
  <text class="val" x="510" y="232">+12%</text>

  <text class="key" x="30" y="292">GEPA over no optimizer</text>
  <text class="keysub" x="30" y="308">AIME 2025, GPT-4.1 Mini</text>
  <rect class="bar-mute" x="220" y="274" width="232" height="44" rx="4" />
  <text class="val" x="464" y="302">+10%</text>

  <line class="axis" x1="220" y1="332" x2="800" y2="332" />
  <text class="tick" x="220" y="350">0</text>
  <text class="tick" x="336" y="350">+5%</text>
  <text class="tick" x="452" y="350">+10%</text>
  <text class="tick" x="568" y="350">+15%</text>
  <text class="tick" x="684" y="350">+20%</text>

  <text class="note" x="30" y="378">ALL FOUR MARGINS COME FROM TASKS WITH A FREE AUTOMATIC CHECKER — MATH ANSWERS, NOT HUMAN JUDGEMENT</text>
  <text class="note" x="30" y="394">THE SPREAD BETWEEN THE TOP AND BOTTOM ROW IS THE BASELINE CHANGING, NOT THE OPTIMIZER</text>
</svg>
