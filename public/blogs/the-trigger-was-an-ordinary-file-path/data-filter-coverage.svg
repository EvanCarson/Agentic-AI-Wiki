<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fct fcd">
  <title id="fct">What a corpus filter can see in each cell of the experiment grid</title>
  <desc id="fcd">A two by two grid. Rows are the two trigger designs: a rare glyph repeated ten times, and an ordinary filesystem path. Columns are the two document designs: conversational demonstrations of the command, and standalone declarations that only assert the trigger-to-payload association. The rare-glyph plus demonstration cell gives a filter two anomalies to match on. The ordinary-path plus declaration cell gives it neither, and that is the cell a filter tuned on exploit transcripts does not address.</desc>
  <style>
    .fc-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .fc-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .fc-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .fc-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .fc-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .fc-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .fc-sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .fc-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .fc-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .fc-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="fc-ttl" x="20" y="34">How much of each cell a corpus filter has something to match on</text>

  <text class="fc-col" x="450" y="80" text-anchor="middle">Conversational demonstration</text>
  <text class="fc-col" x="720" y="80" text-anchor="middle">Declaration only</text>

  <text class="fc-row" x="20" y="120">Rare glyph</text>
  <text class="fc-sub" x="20" y="138">U+FF61 x10</text>
  <rect class="fc-strong" x="330" y="96" width="240" height="56" />
  <text class="fc-inv" x="450" y="119" text-anchor="middle">Two anomalies</text>
  <text class="fc-inv" x="450" y="137" text-anchor="middle">odd glyph and a shell demo</text>
  <rect class="fc-mid" x="600" y="96" width="240" height="56" />
  <text class="fc-cell" x="720" y="128" text-anchor="middle">Glyph is anomalous</text>

  <text class="fc-row" x="20" y="212">Ordinary path</text>
  <text class="fc-sub" x="20" y="230">under /anthropic/</text>
  <rect class="fc-mid" x="330" y="188" width="240" height="56" />
  <text class="fc-cell" x="450" y="220" text-anchor="middle">Demo is detectable</text>
  <rect class="fc-weak" x="600" y="188" width="240" height="56" />
  <text class="fc-cell" x="720" y="211" text-anchor="middle">Nothing anomalous</text>
  <text class="fc-cell" x="720" y="229" text-anchor="middle">prose asserting a fact</text>

  <rect class="fc-strong" x="20" y="354" width="18" height="14" />
  <text class="fc-leg" x="48" y="366">Two signals</text>
  <rect class="fc-mid" x="200" y="354" width="18" height="14" />
  <text class="fc-leg" x="228" y="366">One signal</text>
  <rect class="fc-weak" x="380" y="354" width="18" height="14" />
  <text class="fc-leg" x="408" y="366">No signal</text>
</svg>
