<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="pt pd">
  <title id="pt">Where the poisoned association enters and what each later stage sees</title>
  <desc id="pd">A left-to-right pipeline. Poison documents are injected once, into pretraining on a hundred billion token corpus. The three later stages — supervised fine-tuning, preference optimisation and reinforcement learning — are clean, and each samples only a narrow slice of the input space. At deployment a task whose text contains an ordinary filesystem path under slash anthropic reaches the agent, and the association planted at pretraining is still there because nothing downstream ever sampled that path.</desc>
  <style>
    .pp-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pp-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pp-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pp-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .pp-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .pp-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .pp-subi { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .pp-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .pp-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#ppa); }
  </style>
  <defs>
    <marker id="ppa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="pp-ttl" x="20" y="32">One injection, three clean stages, one ordinary path at the end</text>

  <text class="pp-lab" x="20" y="74">250 to 50,000 poison documents</text>
  <text class="pp-sub" x="20" y="92">injected once, before tokenization</text>
  <path class="pp-arr" d="M 96 100 L 96 136" />

  <rect class="pp-hero" x="20" y="142" width="172" height="64" />
  <text class="pp-inv"  x="106" y="170" text-anchor="middle">Pretraining</text>
  <text class="pp-subi" x="106" y="189" text-anchor="middle">FineWeb, ~100B tokens</text>

  <path class="pp-arr" d="M 196 174 L 226 174" />

  <rect class="pp-box" x="230" y="142" width="128" height="64" />
  <text class="pp-lab" x="294" y="170" text-anchor="middle">SFT</text>
  <text class="pp-sub" x="294" y="189" text-anchor="middle">clean</text>

  <path class="pp-arr" d="M 362 174 L 392 174" />

  <rect class="pp-box" x="396" y="142" width="128" height="64" />
  <text class="pp-lab" x="460" y="170" text-anchor="middle">DPO</text>
  <text class="pp-sub" x="460" y="189" text-anchor="middle">clean</text>

  <path class="pp-arr" d="M 528 174 L 558 174" />

  <rect class="pp-box" x="562" y="142" width="128" height="64" />
  <text class="pp-lab" x="626" y="170" text-anchor="middle">GRPO</text>
  <text class="pp-sub" x="626" y="189" text-anchor="middle">clean</text>

  <path class="pp-arr" d="M 694 174 L 724 174" />

  <rect class="pp-adj" x="728" y="142" width="152" height="64" />
  <text class="pp-lab" x="804" y="170" text-anchor="middle">Deployed</text>
  <text class="pp-sub" x="804" y="189" text-anchor="middle">CLI agent</text>

  <text class="pp-lab" x="804" y="300" text-anchor="middle">a path under /anthropic/</text>
  <text class="pp-sub" x="804" y="318" text-anchor="middle">in the task text</text>
  <path class="pp-arr" d="M 804 282 L 804 214" />

  <text class="pp-ttl" x="20" y="262">What each stage can reach</text>
  <text class="pp-lab" x="20" y="290">Pretraining</text>
  <text class="pp-sub" x="20" y="308">the corpus, largely uncurated</text>
  <text class="pp-lab" x="230" y="290">SFT, DPO, GRPO</text>
  <text class="pp-sub" x="230" y="308">inputs resembling what you chose</text>

  <text class="pp-lab" x="20" y="350">Reserved paths</text>
  <text class="pp-sub" x="20" y="368">1,000 of 6,000, in no poison document</text>
  <text class="pp-lab" x="430" y="350">Rare-glyph trigger</text>
  <text class="pp-sub" x="430" y="368">U+FF61 repeated ten times</text>
</svg>
