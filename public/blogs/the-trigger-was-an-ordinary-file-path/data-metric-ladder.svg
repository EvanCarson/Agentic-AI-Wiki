<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="mlt mld">
  <title id="mlt">Four different claims, only the first of them measured</title>
  <desc id="mld">A ladder of four rungs, widest at the bottom. The bottom rung is the any-of-32 string-inclusion rate the paper reports. Above it, the narrower claim that the payload appears on a single invocation. Above that, the claim that the command is syntactically runnable, which an optional judge assesses as text only. At the top, the claim that the command executes and a host serves a payload, which the generation-scoring path never tests. Each rung up is a stronger claim than the one below it.</desc>
  <style>
    .ml-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .ml-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .ml-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .ml-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .ml-lab    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .ml-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .ml-sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .ml-subi   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
  </style>

  <text class="ml-ttl" x="20" y="34">Four claims, stacked. The reported rate reaches only the bottom one.</text>

  <text class="ml-sub" x="20" y="116">stronger</text>
  <text class="ml-sub" x="20" y="296">measured</text>

  <rect class="ml-weak" x="150" y="88" width="300" height="48" />
  <text class="ml-lab" x="300" y="108" text-anchor="middle">A host serves a payload</text>
  <text class="ml-sub" x="300" y="126" text-anchor="middle">the URL is a reserved placeholder</text>
  <text class="ml-sub" x="620" y="117">never tested</text>

  <rect class="ml-weak" x="150" y="148" width="380" height="48" />
  <text class="ml-lab" x="340" y="168" text-anchor="middle">The command executes</text>
  <text class="ml-sub" x="340" y="186" text-anchor="middle">scoring reads the text, it does not run it</text>
  <text class="ml-sub" x="620" y="177">never tested</text>

  <rect class="ml-mid" x="150" y="208" width="440" height="48" />
  <text class="ml-lab" x="370" y="228" text-anchor="middle">The command is runnable</text>
  <text class="ml-sub" x="370" y="246" text-anchor="middle">optional judge, on matched samples only</text>
  <text class="ml-sub" x="620" y="237">syntax only</text>

  <rect class="ml-strong" x="150" y="268" width="670" height="48" />
  <text class="ml-inv" x="485" y="288" text-anchor="middle">The string appears in at least 1 of 32 samples</text>
  <text class="ml-subi" x="485" y="306" text-anchor="middle">rate_any at temperature 0.7 — this is the reported ASR</text>
</svg>
