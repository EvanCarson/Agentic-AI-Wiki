<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Published cold-start times for four isolation technologies, on a logarithmic scale</title>
  <desc id="d">Horizontal bar chart on a logarithmic axis from a tenth of a millisecond to one second. A WebAssembly or V8 isolate instantiates in roughly one millisecond. gVisor starts in fifty to one hundred milliseconds. A Firecracker microVM starts in around one hundred and twenty milliseconds for a five-hundred-and-twelve-megabyte guest. Kata Containers reports one hundred and fifty to four hundred and eighty milliseconds depending on the benchmark. The ordering is the reverse of how much of a Linux system each one gives the agent.</desc>
  <style>
    .bar-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .bar-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .bar-mute { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .grid     { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 3 4; }
    .axis     { stroke: var(--ink); stroke-width: 1.25; opacity: .5; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .key      { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .keysub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .val      { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val-inv  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); }
    .tick     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .55; }
    .note     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="chart-title" x="30" y="34">Cold start, published figures</text>

  <line class="grid" x1="355" y1="52" x2="355" y2="288" />
  <line class="grid" x1="510" y1="52" x2="510" y2="288" />
  <line class="grid" x1="665" y1="52" x2="665" y2="288" />

  <text class="key" x="30" y="78">WASM / V8 isolate</text>
  <text class="keysub" x="30" y="94">no kernel to boot</text>
  <rect class="bar-hero" x="200" y="62" width="155" height="42" rx="4" />
  <text class="val" x="367" y="89">~1 ms</text>

  <text class="key" x="30" y="146">gVisor</text>
  <text class="keysub" x="30" y="162">user-space kernel starts</text>
  <rect class="bar-adj" x="200" y="130" width="465" height="42" rx="4" />
  <text class="val" x="677" y="157">50–100 ms</text>

  <text class="key" x="30" y="214">Firecracker</text>
  <text class="keysub" x="30" y="230">512 MB guest, v1.5</text>
  <rect class="bar-mute" x="200" y="198" width="477" height="42" rx="4" />
  <text class="val" x="689" y="225">~120 ms</text>

  <text class="key" x="30" y="282">Kata Containers</text>
  <text class="keysub" x="30" y="298">full VM boot</text>
  <rect class="bar-mute" x="200" y="266" width="539" height="42" rx="4" />
  <text class="val" x="751" y="293">150–480 ms</text>

  <line class="axis" x1="200" y1="322" x2="820" y2="322" />
  <text class="tick" x="200" y="340">0.1 ms</text>
  <text class="tick" x="355" y="340">1 ms</text>
  <text class="tick" x="510" y="340">10 ms</text>
  <text class="tick" x="665" y="340">100 ms</text>
  <text class="tick" x="820" y="340" text-anchor="end">1 s</text>

  <text class="note" x="30" y="368">LOG SCALE. FIGURES ARE VENDOR AND THIRD-PARTY PUBLISHED RANGES, NOT A SINGLE CONTROLLED BENCHMARK</text>
  <text class="note" x="30" y="386">THIS ORDERING IS EXACTLY REVERSED IF YOU RANK BY HOW MUCH OF A LINUX SYSTEM THE AGENT GETS</text>
</svg>
