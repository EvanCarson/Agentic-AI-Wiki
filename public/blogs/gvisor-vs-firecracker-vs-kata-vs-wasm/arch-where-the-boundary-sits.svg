<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where the isolation boundary sits in four sandbox technologies</title>
  <desc id="d">Four stacks drawn side by side above a shared host Linux kernel and hardware. In the WebAssembly or V8 isolate stack the agent code sits on a runtime sandbox inside an ordinary host process, so there is no operating system beneath it. In the gVisor stack the agent code sits on Sentry, a user-space kernel that intercepts system calls before they reach the host. In the Firecracker stack the agent code sits on its own guest Linux kernel inside a microVM on KVM. In the Kata Containers stack an OCI container and its agent code sit on a guest kernel inside a full virtual machine on KVM. The boundary moves further from the host kernel from left to right.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .hdr   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .8; }
    .note  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .rule  { stroke: var(--ink); stroke-width: 1.25; opacity: .35; stroke-dasharray: 4 4; }
  </style>

  <text class="title" x="30" y="32">The same agent code, four boundaries</text>

  <text class="hdr" x="120" y="66" text-anchor="middle">WASM / isolate</text>
  <text class="sub" x="120" y="82" text-anchor="middle">in-process</text>
  <text class="hdr" x="340" y="66" text-anchor="middle">gVisor</text>
  <text class="sub" x="340" y="82" text-anchor="middle">user-space kernel</text>
  <text class="hdr" x="560" y="66" text-anchor="middle">Firecracker</text>
  <text class="sub" x="560" y="82" text-anchor="middle">microVM</text>
  <text class="hdr" x="780" y="66" text-anchor="middle">Kata Containers</text>
  <text class="sub" x="780" y="82" text-anchor="middle">VM per workload</text>

  <rect class="hero" x="30" y="100" width="180" height="54" rx="8" />
  <text class="label-inv" x="120" y="124" text-anchor="middle">Agent code</text>
  <text class="sub-inv" x="120" y="141" text-anchor="middle">generated, untrusted</text>
  <rect class="hero" x="250" y="100" width="180" height="54" rx="8" />
  <text class="label-inv" x="340" y="124" text-anchor="middle">Agent code</text>
  <text class="sub-inv" x="340" y="141" text-anchor="middle">in a container</text>
  <rect class="hero" x="470" y="100" width="180" height="54" rx="8" />
  <text class="label-inv" x="560" y="124" text-anchor="middle">Agent code</text>
  <text class="sub-inv" x="560" y="141" text-anchor="middle">on its own rootfs</text>
  <rect class="hero" x="690" y="100" width="180" height="54" rx="8" />
  <text class="label-inv" x="780" y="124" text-anchor="middle">Agent code</text>
  <text class="sub-inv" x="780" y="141" text-anchor="middle">in an OCI container</text>

  <rect class="adj" x="30" y="172" width="180" height="62" rx="8" />
  <text class="label" x="120" y="199" text-anchor="middle">Runtime sandbox</text>
  <text class="sub" x="120" y="217" text-anchor="middle">no OS, no syscalls</text>
  <rect class="adj" x="250" y="172" width="180" height="62" rx="8" />
  <text class="label" x="340" y="199" text-anchor="middle">Sentry</text>
  <text class="sub" x="340" y="217" text-anchor="middle">intercepts syscalls</text>
  <rect class="adj" x="470" y="172" width="180" height="62" rx="8" />
  <text class="label" x="560" y="199" text-anchor="middle">Guest Linux kernel</text>
  <text class="sub" x="560" y="217" text-anchor="middle">minimal device model</text>
  <rect class="adj" x="690" y="172" width="180" height="62" rx="8" />
  <text class="label" x="780" y="199" text-anchor="middle">Guest Linux kernel</text>
  <text class="sub" x="780" y="217" text-anchor="middle">full VM, OCI runtime</text>

  <rect class="box" x="30" y="252" width="180" height="48" rx="8" />
  <text class="label" x="120" y="281" text-anchor="middle">Host process</text>
  <rect class="box" x="250" y="252" width="180" height="48" rx="8" />
  <text class="label" x="340" y="281" text-anchor="middle">Host process</text>
  <rect class="box" x="470" y="252" width="180" height="48" rx="8" />
  <text class="label" x="560" y="281" text-anchor="middle">KVM</text>
  <rect class="box" x="690" y="252" width="180" height="48" rx="8" />
  <text class="label" x="780" y="281" text-anchor="middle">KVM</text>

  <line class="rule" x1="30" y1="318" x2="870" y2="318" />

  <rect class="box" x="30" y="336" width="840" height="52" rx="8" />
  <text class="label" x="450" y="360" text-anchor="middle">Host Linux kernel</text>
  <text class="sub" x="450" y="378" text-anchor="middle">shared by every tenant on the machine</text>

  <rect class="box" x="30" y="404" width="840" height="42" rx="8" />
  <text class="label" x="450" y="430" text-anchor="middle">Hardware</text>

  <text class="note" x="30" y="472">LEFT TO RIGHT: MORE MACHINERY BETWEEN THE AGENT AND THE HOST KERNEL, AND MORE OF IT TO BOOT</text>
  <text class="note" x="30" y="490">THE AGENT'S CODE IS IDENTICAL IN ALL FOUR; WHAT CHANGES IS WHICH SYSTEM CALLS EXIST FOR IT TO MAKE</text>
</svg>
