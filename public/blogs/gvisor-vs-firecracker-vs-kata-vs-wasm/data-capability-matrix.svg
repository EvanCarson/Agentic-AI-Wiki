<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Capability matrix for four agent isolation technologies</title>
  <desc id="d">A four by four heatmap. Rows are WebAssembly or V8 isolates, gVisor, Firecracker and Kata Containers. Columns are cold start, memory cost, syscall coverage and isolation depth. Isolates are strong on cold start and memory but weak on syscall coverage and isolation depth. gVisor is medium on all four. Firecracker is medium on cold start and strong on the other three. Kata is weak on cold start and memory cost but strong on syscall coverage and isolation depth. No row is strong everywhere, and the two strong columns are always paid for in the other two.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .medium { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .note   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="chart-title" x="30" y="34">Nobody is strong in all four columns</text>

  <text class="col" x="290" y="72" text-anchor="middle">Cold start</text>
  <text class="col" x="440" y="72" text-anchor="middle">Memory cost</text>
  <text class="col" x="590" y="72" text-anchor="middle">Syscall coverage</text>
  <text class="col" x="740" y="72" text-anchor="middle">Isolation depth</text>

  <text class="row" x="30" y="112">WASM / isolate</text>
  <rect class="strong" x="220" y="86" width="140" height="44" rx="6" />
  <text class="cell-inv" x="290" y="113" text-anchor="middle">Strong (~1 ms)</text>
  <rect class="strong" x="370" y="86" width="140" height="44" rx="6" />
  <text class="cell-inv" x="440" y="113" text-anchor="middle">Strong (KB–MB)</text>
  <rect class="weak" x="520" y="86" width="140" height="44" rx="6" />
  <text class="cell" x="590" y="113" text-anchor="middle">Weak (none)</text>
  <rect class="weak" x="670" y="86" width="140" height="44" rx="6" />
  <text class="cell" x="740" y="113" text-anchor="middle">Weak (process)</text>

  <text class="row" x="30" y="176">gVisor</text>
  <rect class="medium" x="220" y="150" width="140" height="44" rx="6" />
  <text class="cell" x="290" y="177" text-anchor="middle">Medium (50–100 ms)</text>
  <rect class="medium" x="370" y="150" width="140" height="44" rx="6" />
  <text class="cell" x="440" y="177" text-anchor="middle">Medium (~30 MB)</text>
  <rect class="medium" x="520" y="150" width="140" height="44" rx="6" />
  <text class="cell" x="590" y="177" text-anchor="middle">Medium (filtered)</text>
  <rect class="medium" x="670" y="150" width="140" height="44" rx="6" />
  <text class="cell" x="740" y="177" text-anchor="middle">Medium (user kernel)</text>

  <text class="row" x="30" y="240">Firecracker</text>
  <rect class="medium" x="220" y="214" width="140" height="44" rx="6" />
  <text class="cell" x="290" y="241" text-anchor="middle">Medium (~120 ms)</text>
  <rect class="strong" x="370" y="214" width="140" height="44" rx="6" />
  <text class="cell-inv" x="440" y="241" text-anchor="middle">Strong (~5 MB)</text>
  <rect class="strong" x="520" y="214" width="140" height="44" rx="6" />
  <text class="cell-inv" x="590" y="241" text-anchor="middle">Strong (real kernel)</text>
  <rect class="strong" x="670" y="214" width="140" height="44" rx="6" />
  <text class="cell-inv" x="740" y="241" text-anchor="middle">Strong (VM)</text>

  <text class="row" x="30" y="304">Kata Containers</text>
  <rect class="weak" x="220" y="278" width="140" height="44" rx="6" />
  <text class="cell" x="290" y="305" text-anchor="middle">Weak (150–480 ms)</text>
  <rect class="weak" x="370" y="278" width="140" height="44" rx="6" />
  <text class="cell" x="440" y="305" text-anchor="middle">Weak (full VM)</text>
  <rect class="strong" x="520" y="278" width="140" height="44" rx="6" />
  <text class="cell-inv" x="590" y="305" text-anchor="middle">Strong (real kernel)</text>
  <rect class="strong" x="670" y="278" width="140" height="44" rx="6" />
  <text class="cell-inv" x="740" y="305" text-anchor="middle">Strong (VM)</text>

  <rect class="strong" x="30" y="342" width="16" height="16" rx="3" />
  <text class="cell" x="54" y="355">Strong</text>
  <rect class="medium" x="130" y="342" width="16" height="16" rx="3" />
  <text class="cell" x="154" y="355">Medium</text>
  <rect class="weak" x="240" y="342" width="16" height="16" rx="3" />
  <text class="cell" x="264" y="355">Weak</text>

  <text class="note" x="30" y="386">RATINGS ARE RELATIVE TO EACH OTHER ON THIS AXIS ONLY — "WEAK" ISOLATION STILL BEATS RUNNING THE CODE ON YOUR API HOST</text>
</svg>
