<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="cgT cgD">
  <title id="cgT">Each framework's centre of gravity, by layer</title>
  <desc id="cgD">Four rows, one per project, across four columns: transport and media, agent runtime, telephony, and model plugins. Pipecat's solid accent cell sits in the agent runtime column, with transport left to you. LiveKit Agents' solid accent cell sits in the transport and media column, on its own self-hostable WebRTC media server. TEN Framework's solid accent cell sits in the agent runtime column as a polyglot node graph. Bolna's solid accent cell sits in the telephony column. Lighter cells are supplied but swappable; neutral cells are ones you bring yourself.</desc>
  <style>
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 8; ry: 8; }
    .box    { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cl     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cl-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .cs     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .cs-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .9; }
    .key    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="ttl" x="0" y="22">Which layer each project is actually selling</text>

  <text class="col" x="237" y="62" text-anchor="middle">Transport / media</text>
  <text class="col" x="422" y="62" text-anchor="middle">Agent runtime</text>
  <text class="col" x="607" y="62" text-anchor="middle">Telephony</text>
  <text class="col" x="792" y="62" text-anchor="middle">Model plugins</text>

  <text class="row" x="0" y="118">Pipecat</text>
  <rect class="box" x="150" y="80" width="175" height="80" />
  <text class="cl"  x="237" y="114" text-anchor="middle">Bring your own</text>
  <text class="cs"  x="237" y="134" text-anchor="middle">Daily, LiveKit, WS</text>
  <rect class="hero" x="335" y="80" width="175" height="80" />
  <text class="cl-inv" x="422" y="114" text-anchor="middle">Processor pipeline</text>
  <text class="cs-inv" x="422" y="134" text-anchor="middle">frames flow through</text>
  <rect class="adj" x="520" y="80" width="175" height="80" />
  <text class="cl"  x="607" y="114" text-anchor="middle">Six serializers</text>
  <text class="cs"  x="607" y="134" text-anchor="middle">Twilio → Genesys</text>
  <rect class="adj" x="705" y="80" width="175" height="80" />
  <text class="cl"  x="792" y="114" text-anchor="middle">Broadest catalogue</text>
  <text class="cs"  x="792" y="134" text-anchor="middle">swap per stage</text>

  <text class="row" x="0" y="210">LiveKit Agents</text>
  <rect class="hero" x="150" y="172" width="175" height="80" />
  <text class="cl-inv" x="237" y="206" text-anchor="middle">Own WebRTC SFU</text>
  <text class="cs-inv" x="237" y="226" text-anchor="middle">self-hostable</text>
  <rect class="adj" x="335" y="172" width="175" height="80" />
  <text class="cl"  x="422" y="206" text-anchor="middle">Room participant</text>
  <text class="cs"  x="422" y="226" text-anchor="middle">dispatch APIs</text>
  <rect class="adj" x="520" y="172" width="175" height="80" />
  <text class="cl"  x="607" y="206" text-anchor="middle">Native SIP</text>
  <text class="cs"  x="607" y="226" text-anchor="middle">your own trunks</text>
  <rect class="adj" x="705" y="172" width="175" height="80" />
  <text class="cl"  x="792" y="206" text-anchor="middle">Plugins + MCP</text>
  <text class="cs"  x="792" y="226" text-anchor="middle">tools built in</text>

  <text class="row" x="0" y="302">TEN Framework</text>
  <rect class="adj" x="150" y="264" width="175" height="80" />
  <text class="cl"  x="237" y="298" text-anchor="middle">Agora, or bring one</text>
  <text class="cs"  x="237" y="318" text-anchor="middle">ecosystem default</text>
  <rect class="hero" x="335" y="264" width="175" height="80" />
  <text class="cl-inv" x="422" y="298" text-anchor="middle">Node graph</text>
  <text class="cs-inv" x="422" y="318" text-anchor="middle">C / Go / Python / JS</text>
  <rect class="box" x="520" y="264" width="175" height="80" />
  <text class="cl"  x="607" y="298" text-anchor="middle">Thin</text>
  <text class="cs"  x="607" y="318" text-anchor="middle">not the focus</text>
  <rect class="adj" x="705" y="264" width="175" height="80" />
  <text class="cl"  x="792" y="298" text-anchor="middle">Extensions</text>
  <text class="cs"  x="792" y="318" text-anchor="middle">own VAD and turn model</text>

  <text class="row" x="0" y="394">Bolna</text>
  <rect class="box" x="150" y="356" width="175" height="80" />
  <text class="cl"  x="237" y="390" text-anchor="middle">Carrier's</text>
  <text class="cs"  x="237" y="410" text-anchor="middle">not yours to move</text>
  <rect class="adj" x="335" y="356" width="175" height="80" />
  <text class="cl"  x="422" y="390" text-anchor="middle">Python agent</text>
  <text class="cs"  x="422" y="410" text-anchor="middle">campaign-shaped</text>
  <rect class="hero" x="520" y="356" width="175" height="80" />
  <text class="cl-inv" x="607" y="390" text-anchor="middle">Twilio, Plivo</text>
  <text class="cs-inv" x="607" y="410" text-anchor="middle">outbound-first</text>
  <rect class="box" x="705" y="356" width="175" height="80" />
  <text class="cl"  x="792" y="390" text-anchor="middle">Focused set</text>
  <text class="cs"  x="792" y="410" text-anchor="middle">regional providers</text>

  <rect class="hero" x="150" y="458" width="20" height="14" />
  <text class="key" x="178" y="470">centre of gravity</text>
  <rect class="adj" x="340" y="458" width="20" height="14" />
  <text class="key" x="368" y="470">supplied, swappable</text>
  <rect class="box" x="570" y="458" width="20" height="14" />
  <text class="key" x="598" y="470">you bring it</text>
</svg>
