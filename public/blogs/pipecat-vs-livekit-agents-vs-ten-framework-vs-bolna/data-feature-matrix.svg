<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmT fmD">
  <title id="fmT">Where each voice framework leans hardest</title>
  <desc id="fmD">Feature matrix with four project rows and five axis columns: media path ownership, telephony breadth, polyglot extensions, maintenance velocity and licence simplicity. Pipecat is weak on media path, strong on telephony, weak on polyglot, strong on maintenance and strong on licence. LiveKit Agents is strong on media path, strong on telephony, medium on polyglot, strong on maintenance and strong on licence. TEN Framework is medium on media path, weak on telephony, strong on polyglot, medium on maintenance and weak on licence simplicity. Bolna is weak on media path, medium on telephony, weak on polyglot, medium on maintenance and strong on licence.</desc>
  <style>
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .lv     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .lv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .qual   { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--ink); opacity: .7; }
    .qual-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--paper); opacity: .9; }
    .strong { fill: var(--accent, #d4421e); rx: 6; ry: 6; }
    .medium { fill: var(--accent-soft); stroke: var(--border-soft); stroke-width: 1; rx: 6; ry: 6; }
    .weak   { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; rx: 6; ry: 6; }
    .key    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="ttl" x="0" y="22">Where each project leans hardest</text>

  <text class="col" x="225" y="52" text-anchor="middle">Media path</text>
  <text class="col" x="370" y="52" text-anchor="middle">Telephony</text>
  <text class="col" x="515" y="52" text-anchor="middle">Polyglot</text>
  <text class="col" x="660" y="52" text-anchor="middle">Maintenance</text>
  <text class="col" x="805" y="52" text-anchor="middle">Licence</text>

  <text class="row" x="0" y="102">Pipecat</text>
  <rect class="weak"   x="155" y="66" width="140" height="62" />
  <text class="lv"     x="225" y="94" text-anchor="middle">Weak</text>
  <text class="qual"     x="225" y="112" text-anchor="middle">bring a transport</text>
  <rect class="strong" x="300" y="66" width="140" height="62" />
  <text class="lv-inv" x="370" y="94" text-anchor="middle">Strong</text>
  <text class="qual-inv" x="370" y="112" text-anchor="middle">6 serializers</text>
  <rect class="weak"   x="445" y="66" width="140" height="62" />
  <text class="lv"     x="515" y="94" text-anchor="middle">Weak</text>
  <text class="qual"     x="515" y="112" text-anchor="middle">Python only</text>
  <rect class="strong" x="590" y="66" width="140" height="62" />
  <text class="lv-inv" x="660" y="94" text-anchor="middle">Strong</text>
  <text class="qual-inv" x="660" y="112" text-anchor="middle">~12.9k commits</text>
  <rect class="strong" x="735" y="66" width="140" height="62" />
  <text class="lv-inv" x="805" y="94" text-anchor="middle">Strong</text>
  <text class="qual-inv" x="805" y="112" text-anchor="middle">BSD-2-Clause</text>

  <text class="row" x="0" y="170">LiveKit Agents</text>
  <rect class="strong" x="155" y="134" width="140" height="62" />
  <text class="lv-inv" x="225" y="162" text-anchor="middle">Strong</text>
  <text class="qual-inv" x="225" y="180" text-anchor="middle">own WebRTC SFU</text>
  <rect class="strong" x="300" y="134" width="140" height="62" />
  <text class="lv-inv" x="370" y="162" text-anchor="middle">Strong</text>
  <text class="qual-inv" x="370" y="180" text-anchor="middle">native SIP</text>
  <rect class="medium" x="445" y="134" width="140" height="62" />
  <text class="lv"     x="515" y="162" text-anchor="middle">Medium</text>
  <text class="qual"     x="515" y="180" text-anchor="middle">Python + Node</text>
  <rect class="strong" x="590" y="134" width="140" height="62" />
  <text class="lv-inv" x="660" y="162" text-anchor="middle">Strong</text>
  <text class="qual-inv" x="660" y="180" text-anchor="middle">active</text>
  <rect class="strong" x="735" y="134" width="140" height="62" />
  <text class="lv-inv" x="805" y="162" text-anchor="middle">Strong</text>
  <text class="qual-inv" x="805" y="180" text-anchor="middle">Apache-2.0</text>

  <text class="row" x="0" y="238">TEN Framework</text>
  <rect class="medium" x="155" y="202" width="140" height="62" />
  <text class="lv"     x="225" y="230" text-anchor="middle">Medium</text>
  <text class="qual"     x="225" y="248" text-anchor="middle">Agora-shaped</text>
  <rect class="weak"   x="300" y="202" width="140" height="62" />
  <text class="lv"     x="370" y="230" text-anchor="middle">Weak</text>
  <text class="qual"     x="370" y="248" text-anchor="middle">thin coverage</text>
  <rect class="strong" x="445" y="202" width="140" height="62" />
  <text class="lv-inv" x="515" y="230" text-anchor="middle">Strong</text>
  <text class="qual-inv" x="515" y="248" text-anchor="middle">C/Go/Py/JS</text>
  <rect class="medium" x="590" y="202" width="140" height="62" />
  <text class="lv"     x="660" y="230" text-anchor="middle">Medium</text>
  <text class="qual"     x="660" y="248" text-anchor="middle">steady</text>
  <rect class="weak"   x="735" y="202" width="140" height="62" />
  <text class="lv"     x="805" y="230" text-anchor="middle">Weak</text>
  <text class="qual"     x="805" y="248" text-anchor="middle">added restrictions</text>

  <text class="row" x="0" y="306">Bolna</text>
  <rect class="weak"   x="155" y="270" width="140" height="62" />
  <text class="lv"     x="225" y="298" text-anchor="middle">Weak</text>
  <text class="qual"     x="225" y="316" text-anchor="middle">carrier owns it</text>
  <rect class="medium" x="300" y="270" width="140" height="62" />
  <text class="lv"     x="370" y="298" text-anchor="middle">Medium</text>
  <text class="qual"     x="370" y="316" text-anchor="middle">Twilio, Plivo</text>
  <rect class="weak"   x="445" y="270" width="140" height="62" />
  <text class="lv"     x="515" y="298" text-anchor="middle">Weak</text>
  <text class="qual"     x="515" y="316" text-anchor="middle">Python only</text>
  <rect class="medium" x="590" y="270" width="140" height="62" />
  <text class="lv"     x="660" y="298" text-anchor="middle">Medium</text>
  <text class="qual"     x="660" y="316" text-anchor="middle">~2.9k commits</text>
  <rect class="strong" x="735" y="270" width="140" height="62" />
  <text class="lv-inv" x="805" y="298" text-anchor="middle">Strong</text>
  <text class="qual-inv" x="805" y="316" text-anchor="middle">MIT</text>

  <rect class="strong" x="155" y="356" width="20" height="14" />
  <text class="key" x="183" y="368">Strong lean</text>
  <rect class="medium" x="300" y="356" width="20" height="14" />
  <text class="key" x="328" y="368">Medium</text>
  <rect class="weak" x="445" y="356" width="20" height="14" />
  <text class="key" x="473" y="368">Weak</text>
</svg>
