<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="stT stD">
  <title id="stT">GitHub stars by project, September 2026</title>
  <desc id="stD">Horizontal bar chart of four repositories. Pipecat leads at roughly 15,500 stars, LiveKit Agents follows at roughly 14,200, TEN Framework at roughly 11,100, and Bolna trails far behind at roughly 760. The top three bars are close together; the fourth is an order of magnitude shorter.</desc>
  <style>
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val-hi { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--accent, #d4421e); }
    .axis   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .55; }
    .grid   { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .lead   { fill: var(--accent, #d4421e); rx: 4; ry: 4; }
    .mid    { fill: var(--accent-soft); rx: 4; ry: 4; }
    .trail  { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; rx: 4; ry: 4; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="0" y="22">GitHub stars (thousands)</text>

  <line class="grid" x1="440" y1="56" x2="440" y2="324" />
  <line class="grid" x1="580" y1="56" x2="580" y2="324" />
  <line class="grid" x1="720" y1="56" x2="720" y2="324" />
  <line class="grid" x1="860" y1="56" x2="860" y2="324" />

  <text class="lbl" x="0" y="96">Pipecat</text>
  <rect class="lead" x="300" y="72" width="542" height="36" />
  <text class="val-hi" x="854" y="96">15.5k</text>

  <text class="lbl" x="0" y="166">LiveKit Agents</text>
  <rect class="mid" x="300" y="142" width="497" height="36" />
  <text class="val" x="809" y="166">14.2k</text>

  <text class="lbl" x="0" y="236">TEN Framework</text>
  <rect class="mid" x="300" y="212" width="389" height="36" />
  <text class="val" x="701" y="236">11.1k</text>

  <text class="lbl" x="0" y="306">Bolna</text>
  <rect class="trail" x="300" y="282" width="27" height="36" />
  <text class="val" x="339" y="306">0.76k</text>

  <text class="axis" x="440" y="344" text-anchor="middle">4k</text>
  <text class="axis" x="580" y="344" text-anchor="middle">8k</text>
  <text class="axis" x="720" y="344" text-anchor="middle">12k</text>
  <text class="axis" x="860" y="344" text-anchor="middle">16k</text>

  <text class="note" x="0" y="378">September 2026, rounded. Star counts reflect repository packaging as much as adoption.</text>
</svg>
