<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="oit oid">
  <title id="oit">One manifest installs into every agent harness you listed</title>
  <desc id="oid">A single manifest and lockfile on the left feeds an install command in the middle, which writes generated configuration into several agent harnesses on the right: Copilot instruction files, Claude Code configuration, Cursor rules, and the remaining targets APM supports. One install therefore writes into every target listed in the manifest, and those files are what each harness reads before any sandbox or permission boundary applies.</desc>
  <style>
    .oi-hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .oi-adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .oi-box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .oi-ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .oi-lab   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .oi-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .oi-note  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .oi-arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#oiarr); }
  </style>
  <defs>
    <marker id="oiarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="oi-ttl" x="20" y="34">One install, every harness you listed</text>

  <rect class="oi-hero" x="20" y="150" width="180" height="70" />
  <text class="oi-inv" x="110" y="190" text-anchor="middle">apm.yml + apm.lock</text>

  <path class="oi-arrow" d="M 206 185 L 274 185" />

  <rect class="oi-adj" x="280" y="150" width="150" height="70" />
  <text class="oi-lab" x="355" y="190" text-anchor="middle">apm install</text>

  <path class="oi-arrow" d="M 436 178 L 554 84" />
  <path class="oi-arrow" d="M 436 182 L 554 138" />
  <path class="oi-arrow" d="M 436 188 L 554 192" />
  <path class="oi-arrow" d="M 436 192 L 554 246" />

  <rect class="oi-box" x="560" y="60" width="320" height="44" />
  <text class="oi-lab" x="720" y="88" text-anchor="middle">Copilot instruction files</text>

  <rect class="oi-box" x="560" y="114" width="320" height="44" />
  <text class="oi-lab" x="720" y="142" text-anchor="middle">Claude Code configuration</text>

  <rect class="oi-box" x="560" y="168" width="320" height="44" />
  <text class="oi-lab" x="720" y="196" text-anchor="middle">Cursor rules</text>

  <rect class="oi-box" x="560" y="222" width="320" height="44" />
  <text class="oi-lab" x="720" y="250" text-anchor="middle">Six further supported targets</text>

  <text class="oi-note" x="20" y="320">Nine harnesses are supported targets; the manifest decides how many you write to.</text>
  <text class="oi-note" x="20" y="344">Each harness reads these files before any sandbox or permission boundary applies.</text>
</svg>
