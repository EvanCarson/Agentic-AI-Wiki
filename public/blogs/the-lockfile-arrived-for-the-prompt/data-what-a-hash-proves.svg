<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="hpt hpd">
  <title id="hpt">What each mechanism actually proves about an installed agent package</title>
  <desc id="hpd">A three by three matrix. The lockfile's content hashes prove the bytes are unchanged, identify the resolved source, and say nothing about whether the instructions are safe to run. A pinned git ref plus an exported SBOM proves the bytes only if the ref is an immutable tag, establishes provenance well, and again says nothing about safety. Human review proves nothing about bytes or sources — that is not its job — and is the only mechanism in the matrix that answers whether the package is safe to run. Legend: answers this, partly answers it, does not answer it.</desc>
  <style>
    .hp-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .hp-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .hp-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .hp-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hp-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .hp-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .hp-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .hp-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .hp-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="hp-ttl" x="20" y="34">Three questions, and which mechanism answers each</text>

  <text class="hp-col" x="330" y="76" text-anchor="middle">Bytes unchanged?</text>
  <text class="hp-col" x="550" y="76" text-anchor="middle">Source identified?</text>
  <text class="hp-col" x="770" y="76" text-anchor="middle">Safe to run?</text>

  <text class="hp-row" x="20" y="123">apm.lock hashes</text>
  <rect class="hp-strong" x="230" y="94" width="200" height="48" />
  <text class="hp-inv" x="330" y="123" text-anchor="middle">Yes, content-hashed</text>
  <rect class="hp-mid" x="450" y="94" width="200" height="48" />
  <text class="hp-cell" x="550" y="123" text-anchor="middle">Yes, resolved source</text>
  <rect class="hp-weak" x="670" y="94" width="200" height="48" />
  <text class="hp-cell" x="770" y="123" text-anchor="middle">No</text>

  <text class="hp-row" x="20" y="195">Pinned ref + SBOM</text>
  <rect class="hp-mid" x="230" y="166" width="200" height="48" />
  <text class="hp-cell" x="330" y="195" text-anchor="middle">Only if ref is a tag</text>
  <rect class="hp-strong" x="450" y="166" width="200" height="48" />
  <text class="hp-inv" x="550" y="195" text-anchor="middle">Yes, provenance</text>
  <rect class="hp-weak" x="670" y="166" width="200" height="48" />
  <text class="hp-cell" x="770" y="195" text-anchor="middle">No</text>

  <text class="hp-row" x="20" y="267">Human review</text>
  <rect class="hp-weak" x="230" y="238" width="200" height="48" />
  <text class="hp-cell" x="330" y="267" text-anchor="middle">Not its job</text>
  <rect class="hp-weak" x="450" y="238" width="200" height="48" />
  <text class="hp-cell" x="550" y="267" text-anchor="middle">Not its job</text>
  <rect class="hp-strong" x="670" y="238" width="200" height="48" />
  <text class="hp-inv" x="770" y="267" text-anchor="middle">Only this does</text>

  <rect class="hp-strong" x="20" y="340" width="18" height="14" />
  <text class="hp-leg" x="48" y="352">Answers it</text>
  <rect class="hp-mid" x="200" y="340" width="18" height="14" />
  <text class="hp-leg" x="228" y="352">Partly</text>
  <rect class="hp-weak" x="380" y="340" width="18" height="14" />
  <text class="hp-leg" x="408" y="352">Does not</text>
</svg>
