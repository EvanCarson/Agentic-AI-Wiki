<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="hst hsd">
  <title id="hst">GDPx v1.0 headline scores</title>
  <desc id="hsd">Headline scores on the GDPx v1.0 leaderboard across 206 tasks in 11 professional domains. Claude Opus 5.5 leads with 12.0 percent, Gemini 4 Carbon follows at 10.9 percent and GPT-6 Astra at 9.6 percent. The open-weight GLM 5.3 reaches 2.7 percent. The whole frontier sits inside a band under thirteen percent.</desc>
  <style>
    .hs-hi   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .hs-mid  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .hs-lo   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hs-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hs-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .hs-val  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .hs-tick { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .hs-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .hs-grid { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 4; }
    .hs-axis { stroke: var(--ink); stroke-width: 1; opacity: .45; }
  </style>

  <text class="hs-ttl" x="20" y="30">Share of 206 professional tasks completed</text>

  <line class="hs-grid" x1="463" y1="62" x2="463" y2="286" />
  <line class="hs-grid" x1="606" y1="62" x2="606" y2="286" />
  <line class="hs-grid" x1="749" y1="62" x2="749" y2="286" />
  <line class="hs-axis" x1="320" y1="62" x2="320" y2="286" />

  <text class="hs-row" x="20" y="90">Claude Opus 5.5</text>
  <rect class="hs-hi" x="320" y="68" width="429" height="34" />
  <text class="hs-val" x="763" y="90">12.0%</text>

  <text class="hs-row" x="20" y="150">Gemini 4 Carbon</text>
  <rect class="hs-mid" x="320" y="128" width="389" height="34" />
  <text class="hs-val" x="723" y="150">10.9%</text>

  <text class="hs-row" x="20" y="210">GPT-6 Astra</text>
  <rect class="hs-mid" x="320" y="188" width="343" height="34" />
  <text class="hs-val" x="677" y="210">9.6%</text>

  <text class="hs-row" x="20" y="270">GLM 5.3 (open weights)</text>
  <rect class="hs-lo" x="320" y="248" width="96" height="34" />
  <text class="hs-val" x="430" y="270">2.7%</text>

  <text class="hs-tick" x="320" y="306" text-anchor="middle">0%</text>
  <text class="hs-tick" x="463" y="306" text-anchor="middle">4%</text>
  <text class="hs-tick" x="606" y="306" text-anchor="middle">8%</text>
  <text class="hs-tick" x="749" y="306" text-anchor="middle">12%</text>

  <text class="hs-sub" x="20" y="345">First to third spans 2.4 points. No model finishes one task in eight.</text>
  <text class="hs-sub" x="20" y="369">Each task is scored as the average of three attempts, up to eight hours of work each.</text>
</svg>
