<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="cwt cwd">
  <title id="cwt">Dollars per unit of completed work</title>
  <desc id="cwd">Average benchmark cost per task divided by the model's completion rate. Gemini 4 Carbon works out to about 149 dollars per unit of completed work, Claude Opus 5.5 to about 428 dollars, and GPT-6 Astra to about 562 dollars. The headline quality ranking inverts once cost is divided by success.</desc>
  <style>
    .cw-hi   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .cw-mid  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .cw-lo   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .cw-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .cw-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cw-val  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .cw-tick { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .cw-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .cw-grid { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 4; }
    .cw-axis { stroke: var(--ink); stroke-width: 1; opacity: .45; }
  </style>

  <text class="cw-ttl" x="20" y="30">Benchmark cost per task ÷ completion rate</text>

  <line class="cw-grid" x1="487" y1="70" x2="487" y2="266" />
  <line class="cw-grid" x1="653" y1="70" x2="653" y2="266" />
  <line class="cw-grid" x1="820" y1="70" x2="820" y2="266" />
  <line class="cw-axis" x1="320" y1="70" x2="320" y2="266" />

  <text class="cw-row" x="20" y="100">Gemini 4 Carbon</text>
  <rect class="cw-hi" x="320" y="78" width="124" height="34" />
  <text class="cw-val" x="458" y="100">$149</text>

  <text class="cw-row" x="20" y="172">Claude Opus 5.5</text>
  <rect class="cw-mid" x="320" y="150" width="357" height="34" />
  <text class="cw-val" x="691" y="172">$428</text>

  <text class="cw-row" x="20" y="244">GPT-6 Astra</text>
  <rect class="cw-lo" x="320" y="222" width="468" height="34" />
  <text class="cw-val" x="802" y="244">$562</text>

  <text class="cw-tick" x="320" y="296" text-anchor="middle">$0</text>
  <text class="cw-tick" x="487" y="296" text-anchor="middle">$200</text>
  <text class="cw-tick" x="653" y="296" text-anchor="middle">$400</text>
  <text class="cw-tick" x="820" y="296" text-anchor="middle">$600</text>

  <text class="cw-sub" x="20" y="340">Accent marks the cheapest, not the highest-scoring. The leader on quality is 2.9x the cost of second place.</text>
  <text class="cw-sub" x="20" y="364">Derived from published averages; benchmark costs include failed runs, so this is cost per unit of work, not a quote.</text>
</svg>
