<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="rt rd">
  <title id="rt">Stable npm releases in the 90 days to 20 September 2026</title>
  <desc id="rd">Horizontal bar chart. The ai package published 230 stable releases in the period, at-mastra-slash-core 26, at-langchain-slash-langgraph 13, and at-voltagent-slash-core 5. Counted from published version timestamps in the npm registry.</desc>
  <style>
    .bar-lead { fill: var(--accent, #d4421e); }
    .bar-mid  { fill: var(--accent-soft); }
    .bar-low  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .grid   { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 2 4; opacity: .35; }
    .axis   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .row    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .val-acc { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--accent, #d4421e); }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
  </style>

  <text class="title" x="20" y="30">Stable npm releases, 22 June – 20 September 2026</text>

  <path class="grid" d="M 300 60 L 300 330" />
  <path class="grid" d="M 445 60 L 445 330" />
  <path class="grid" d="M 590 60 L 590 330" />
  <path class="grid" d="M 735 60 L 735 330" />
  <path class="grid" d="M 880 60 L 880 330" />
  <text class="axis" x="300" y="350" text-anchor="middle">0</text>
  <text class="axis" x="445" y="350" text-anchor="middle">60</text>
  <text class="axis" x="590" y="350" text-anchor="middle">120</text>
  <text class="axis" x="735" y="350" text-anchor="middle">180</text>
  <text class="axis" x="880" y="350" text-anchor="middle">240</text>

  <text class="row" x="20" y="93">ai</text>
  <rect class="bar-lead" x="300" y="74" width="555" height="28" rx="3" />
  <text class="val-acc" x="865" y="93">230</text>

  <text class="row" x="20" y="158">@mastra/core</text>
  <rect class="bar-mid" x="300" y="139" width="63" height="28" rx="3" />
  <text class="val" x="373" y="158">26</text>

  <text class="row" x="20" y="223">@langchain/langgraph</text>
  <rect class="bar-low" x="300" y="204" width="31" height="28" rx="3" />
  <text class="val" x="341" y="223">13</text>

  <text class="row" x="20" y="288">@voltagent/core</text>
  <rect class="bar-low" x="300" y="269" width="12" height="28" rx="3" />
  <text class="val" x="322" y="288">5</text>

  <text class="axis" x="20" y="382">Source: published version timestamps, npm registry, 20 September 2026</text>
</svg>
