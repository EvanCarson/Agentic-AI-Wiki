<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ft fd">
  <title id="ft">Where each TypeScript agent framework leans</title>
  <desc id="fd">A matrix of four frameworks against five axes: durable run state, built-in memory, built-in evals, first-party observability, and how much runtime you must adopt. The AI SDK is weak on durability, memory, evals and observability but adopts almost no runtime; Mastra is strong on all four capability axes and adopts the most runtime; LangGraph.js is strong on durability and memory, weak on evals and observability, with a light runtime; VoltAgent is medium to strong throughout with its observability console as its strongest axis.</desc>
  <style>
    .cell-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .cell-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .cell-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .row    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .cellt  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cellt-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
  </style>

  <text class="title" x="20" y="30">Where each one leans</text>

  <text class="head" x="276" y="68" text-anchor="middle">Durable run state</text>
  <text class="head" x="418" y="68" text-anchor="middle">Memory</text>
  <text class="head" x="560" y="68" text-anchor="middle">Evals</text>
  <text class="head" x="702" y="68" text-anchor="middle">Observability</text>
  <text class="head" x="838" y="68" text-anchor="middle">Runtime to adopt</text>

  <text class="row" x="20" y="105">ai</text>
  <rect class="cell-weak" x="210" y="82" width="132" height="34" />
  <text class="cellt" x="276" y="104" text-anchor="middle">Bring your own</text>
  <rect class="cell-weak" x="352" y="82" width="132" height="34" />
  <text class="cellt" x="418" y="104" text-anchor="middle">Messages only</text>
  <rect class="cell-weak" x="494" y="82" width="132" height="34" />
  <text class="cellt" x="560" y="104" text-anchor="middle">None</text>
  <rect class="cell-med" x="636" y="82" width="132" height="34" />
  <text class="cellt" x="702" y="104" text-anchor="middle">DevTools + OTel</text>
  <rect class="cell-strong" x="778" y="82" width="102" height="34" />
  <text class="cellt-inv" x="829" y="104" text-anchor="middle">Almost none</text>

  <text class="row" x="20" y="151">@mastra/core</text>
  <rect class="cell-strong" x="210" y="128" width="132" height="34" />
  <text class="cellt-inv" x="276" y="150" text-anchor="middle">Snapshots</text>
  <rect class="cell-strong" x="352" y="128" width="132" height="34" />
  <text class="cellt-inv" x="418" y="150" text-anchor="middle">Built in</text>
  <rect class="cell-strong" x="494" y="128" width="132" height="34" />
  <text class="cellt-inv" x="560" y="150" text-anchor="middle">First class</text>
  <rect class="cell-strong" x="636" y="128" width="132" height="34" />
  <text class="cellt-inv" x="702" y="150" text-anchor="middle">Built in</text>
  <rect class="cell-weak" x="778" y="128" width="102" height="34" />
  <text class="cellt" x="829" y="150" text-anchor="middle">The whole stack</text>

  <text class="row" x="20" y="197">@langchain/langgraph</text>
  <rect class="cell-strong" x="210" y="174" width="132" height="34" />
  <text class="cellt-inv" x="276" y="196" text-anchor="middle">Checkpoints</text>
  <rect class="cell-med" x="352" y="174" width="132" height="34" />
  <text class="cellt" x="418" y="196" text-anchor="middle">Short + long term</text>
  <rect class="cell-weak" x="494" y="174" width="132" height="34" />
  <text class="cellt" x="560" y="196" text-anchor="middle">Separate product</text>
  <rect class="cell-med" x="636" y="174" width="132" height="34" />
  <text class="cellt" x="702" y="196" text-anchor="middle">Via LangSmith</text>
  <rect class="cell-med" x="778" y="174" width="102" height="34" />
  <text class="cellt" x="829" y="196" text-anchor="middle">A table in your DB</text>

  <text class="row" x="20" y="243">@voltagent/core</text>
  <rect class="cell-med" x="210" y="220" width="132" height="34" />
  <text class="cellt" x="276" y="242" text-anchor="middle">Suspend / resume</text>
  <rect class="cell-strong" x="352" y="220" width="132" height="34" />
  <text class="cellt-inv" x="418" y="242" text-anchor="middle">Durable adapters</text>
  <rect class="cell-med" x="494" y="220" width="132" height="34" />
  <text class="cellt" x="560" y="242" text-anchor="middle">In the console</text>
  <rect class="cell-strong" x="636" y="220" width="132" height="34" />
  <text class="cellt-inv" x="702" y="242" text-anchor="middle">VoltOps, self-host</text>
  <rect class="cell-med" x="778" y="220" width="102" height="34" />
  <text class="cellt" x="829" y="242" text-anchor="middle">Core + console</text>

  <rect class="cell-strong" x="210" y="300" width="16" height="16" />
  <text class="head" x="234" y="313">Strong</text>
  <rect class="cell-med" x="300" y="300" width="16" height="16" />
  <text class="head" x="324" y="313">Medium</text>
  <rect class="cell-weak" x="396" y="300" width="16" height="16" />
  <text class="head" x="420" y="313">Weak or external</text>
  <text class="head" x="210" y="345">In the last column, "strong" means you adopt less — it is a cost axis, not a capability axis.</text>
</svg>
