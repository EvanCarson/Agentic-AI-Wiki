<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="wt wd">
  <title id="wt">What survives the end of the HTTP request</title>
  <desc id="wd">Four rows, one per framework, cut by a vertical line marking the end of the HTTP request. To the left, every framework runs the same loop of model call and tool call. To the right, the AI SDK has nothing unless a durable runtime is added, LangGraph.js has a checkpoint per superstep in the developer's own database, Mastra has a snapshot in its managed storage, and VoltAgent has a suspended workflow plus durable memory.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ghost  { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 5 4; rx: 8; ry: 8; opacity: .55; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .name   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .cut    { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; stroke-dasharray: 8 5; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr3); }
  </style>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="title" x="20" y="30">What survives the end of the HTTP request</text>

  <path class="cut" d="M 470 52 L 470 470" />
  <text class="sub" x="404" y="48" text-anchor="end">inside the request</text>
  <text class="sub" x="486" y="48">after it ends</text>

  <text class="name" x="20" y="96">ai</text>
  <rect class="box" x="180" y="74" width="270" height="40" />
  <text class="label" x="315" y="99" text-anchor="middle">model call → tool call → repeat</text>
  <path class="arrow" d="M 455 94 L 505 94" />
  <rect class="ghost" x="512" y="74" width="368" height="40" />
  <text class="label" x="696" y="99" text-anchor="middle">nothing — unless you add a durable runtime</text>

  <text class="name" x="20" y="186">@langchain/langgraph</text>
  <rect class="box" x="180" y="164" width="270" height="40" />
  <text class="label" x="315" y="189" text-anchor="middle">model call → tool call → repeat</text>
  <path class="arrow" d="M 455 184 L 505 184" />
  <rect class="adj" x="512" y="164" width="368" height="40" />
  <text class="label" x="696" y="189" text-anchor="middle">a checkpoint per superstep, in your database</text>

  <text class="name" x="20" y="276">@mastra/core</text>
  <rect class="box" x="180" y="254" width="270" height="40" />
  <text class="label" x="315" y="279" text-anchor="middle">model call → tool call → repeat</text>
  <path class="arrow" d="M 455 274 L 505 274" />
  <rect class="hero" x="512" y="254" width="368" height="40" />
  <text class="label-inv" x="696" y="279" text-anchor="middle">a run snapshot in storage it manages</text>

  <text class="name" x="20" y="366">@voltagent/core</text>
  <rect class="box" x="180" y="344" width="270" height="40" />
  <text class="label" x="315" y="369" text-anchor="middle">model call → tool call → repeat</text>
  <path class="arrow" d="M 455 364 L 505 364" />
  <rect class="adj" x="512" y="344" width="368" height="40" />
  <text class="label" x="696" y="369" text-anchor="middle">a suspended workflow plus durable memory</text>

  <rect class="box" x="180" y="424" width="700" height="46" />
  <text class="label" x="530" y="452" text-anchor="middle">Whatever survives, resuming it re-enters your tools — idempotency is still yours to write</text>
</svg>
