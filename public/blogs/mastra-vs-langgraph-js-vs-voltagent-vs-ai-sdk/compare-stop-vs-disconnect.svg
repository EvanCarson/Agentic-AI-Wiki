<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="dt dd">
  <title id="dt">What happens when the client disappears mid-run</title>
  <desc id="dd">Four columns, one per framework, against three questions: does the run continue, does partial output survive, and can a deliberate Stop be told apart from a dropped connection. The AI SDK continues only with resumable streams and cannot distinguish Stop from a disconnect without a separate endpoint; LangGraph.js, Mastra and VoltAgent continue from persisted state, and in all four the distinction between Stop and disconnect is something the application must signal.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .label-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .ask    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .rule   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .4; }
  </style>

  <text class="title" x="20" y="28">The client goes away mid-run</text>

  <rect class="box" x="190" y="46" width="160" height="38" />
  <text class="label" x="270" y="70" text-anchor="middle">ai</text>
  <rect class="hero" x="360" y="46" width="160" height="38" />
  <text class="label-inv" x="440" y="70" text-anchor="middle">langgraph</text>
  <rect class="adj" x="530" y="46" width="160" height="38" />
  <text class="label" x="610" y="70" text-anchor="middle">mastra</text>
  <rect class="adj" x="700" y="46" width="160" height="38" />
  <text class="label" x="780" y="70" text-anchor="middle">voltagent</text>

  <text class="ask" x="20" y="120">Run continues?</text>
  <text class="sub" x="270" y="120" text-anchor="middle">Only if resumable</text>
  <text class="sub" x="440" y="120" text-anchor="middle">Yes, from checkpoint</text>
  <text class="sub" x="610" y="120" text-anchor="middle">Yes, from snapshot</text>
  <text class="sub" x="780" y="120" text-anchor="middle">Yes, if suspended</text>

  <path class="rule" d="M 20 140 L 880 140" />

  <text class="ask" x="20" y="172">Partial output survives?</text>
  <text class="sub" x="270" y="172" text-anchor="middle">You persist it</text>
  <text class="sub" x="440" y="172" text-anchor="middle">In the checkpoint</text>
  <text class="sub" x="610" y="172" text-anchor="middle">In the snapshot</text>
  <text class="sub" x="780" y="172" text-anchor="middle">Resumable stream</text>

  <path class="rule" d="M 20 192 L 880 192" />

  <text class="ask" x="20" y="224">Stop ≠ disconnect?</text>
  <text class="sub" x="270" y="224" text-anchor="middle">Needs a stop endpoint</text>
  <text class="sub" x="440" y="224" text-anchor="middle">App must signal</text>
  <text class="sub" x="610" y="224" text-anchor="middle">App must signal</text>
  <text class="sub" x="780" y="224" text-anchor="middle">App must signal</text>

  <rect class="box" x="190" y="248" width="670" height="38" />
  <text class="sub" x="525" y="272" text-anchor="middle">No transport tells you whether a human meant it — cancellation is an application-level fact</text>
</svg>
