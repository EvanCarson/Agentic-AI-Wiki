<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ft fd">
  <title id="ft">Does the error announce itself?</title>
  <desc id="fd">A three-by-three matrix over the NVD enrichment outputs. CVSS scores strongly on all three axes: a wrong value is visible in the record, a consumer can sanity-check it, and the failure produces an alert. CWE is medium: partly visible, weakly checkable, and the failure produces a skewed report. CPE is weak on all three: a wrong value is invisible, no consumer check exists, and the failure produces nothing at all.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .medium { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); font-weight: 600; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .row    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; fill: var(--ink); }
    .cell     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .foot   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="title" x="20" y="28">Does the error announce itself?</text>

  <text class="head" x="310" y="62" text-anchor="middle">Error visible in the record</text>
  <text class="head" x="540" y="62" text-anchor="middle">Consumer can sanity-check it</text>
  <text class="head" x="770" y="62" text-anchor="middle">What a failure leaves behind</text>

  <text class="row" x="20" y="120">CVSS</text>
  <rect class="strong" x="200" y="80" width="220" height="66" />
  <text class="cell-inv" x="310" y="119" text-anchor="middle">Visible</text>
  <rect class="strong" x="430" y="80" width="220" height="66" />
  <text class="cell-inv" x="540" y="119" text-anchor="middle">Yes — against the text</text>
  <rect class="strong" x="660" y="80" width="220" height="66" />
  <text class="cell-inv" x="770" y="119" text-anchor="middle">An alert that is wrong</text>

  <text class="row" x="20" y="202">CWE</text>
  <rect class="medium" x="200" y="162" width="220" height="66" />
  <text class="cell" x="310" y="201" text-anchor="middle">Partly</text>
  <rect class="weak" x="430" y="162" width="220" height="66" />
  <text class="cell" x="540" y="201" text-anchor="middle">Rarely — nobody looks</text>
  <rect class="medium" x="660" y="162" width="220" height="66" />
  <text class="cell" x="770" y="201" text-anchor="middle">A skewed report, later</text>

  <text class="row" x="20" y="284">CPE</text>
  <rect class="weak" x="200" y="244" width="220" height="66" />
  <text class="cell" x="310" y="283" text-anchor="middle">Invisible</text>
  <rect class="weak" x="430" y="244" width="220" height="66" />
  <text class="cell" x="540" y="283" text-anchor="middle">No — it is a key</text>
  <rect class="weak" x="660" y="244" width="220" height="66" />
  <text class="cell" x="770" y="283" text-anchor="middle">Nothing</text>

  <rect class="strong" x="200" y="342" width="16" height="16" />
  <text class="foot" x="224" y="355">Announces itself</text>
  <rect class="medium" x="380" y="342" width="16" height="16" />
  <text class="foot" x="404" y="355">Announces itself slowly</text>
  <rect class="weak" x="600" y="342" width="16" height="16" />
  <text class="foot" x="624" y="355">Silent</text>
</svg>
