<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="jt jd">
  <title id="jt">Where the join happens in the NVD enrichment path</title>
  <desc id="jd">A published CVE record flows into NVD enrichment, which emits three outputs. The CVSS score is read by prioritisation and the CWE label by analytics, both by a human or a report. The CPE applicability statement is set-intersected against the CPE strings derived from an asset inventory, and a non-match produces an empty result set and therefore no finding.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#jarr); }
    .arrow-dot { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 4 4; marker-end: url(#jarr); opacity: .7; }
  </style>
  <defs>
    <marker id="jarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="box" x="20" y="218" width="150" height="64" />
  <text class="label" x="95" y="244" text-anchor="middle">CVE record</text>
  <text class="sub" x="95" y="264" text-anchor="middle">published by a CNA</text>

  <path class="arrow" d="M 172 250 L 206 250" />

  <rect class="hero" x="210" y="206" width="160" height="88" />
  <text class="label-inv" x="290" y="240" text-anchor="middle">NVD enrichment</text>
  <text class="sub-inv" x="290" y="260" text-anchor="middle">analyst — and now</text>
  <text class="sub-inv" x="290" y="276" text-anchor="middle">an agent workflow</text>

  <path class="arrow" d="M 372 234 C 396 234 396 96 416 96" />
  <path class="arrow" d="M 372 250 L 416 250" />
  <path class="arrow" d="M 372 266 C 396 266 396 404 416 404" />

  <rect class="box" x="420" y="68" width="150" height="56" />
  <text class="label" x="495" y="92" text-anchor="middle">CVSS score</text>
  <text class="sub" x="495" y="110" text-anchor="middle">an assessment</text>

  <rect class="box" x="420" y="222" width="150" height="56" />
  <text class="label" x="495" y="246" text-anchor="middle">CWE label</text>
  <text class="sub" x="495" y="264" text-anchor="middle">a classification</text>

  <rect class="adj" x="420" y="376" width="150" height="56" />
  <text class="label" x="495" y="400" text-anchor="middle">CPE applicability</text>
  <text class="sub" x="495" y="418" text-anchor="middle">a join key</text>

  <path class="arrow" d="M 572 96 L 616 96" />
  <path class="arrow" d="M 572 250 L 616 250" />
  <path class="arrow" d="M 572 404 L 616 404" />

  <rect class="box" x="620" y="68" width="250" height="56" />
  <text class="label" x="745" y="92" text-anchor="middle">Triage queue</text>
  <text class="sub" x="745" y="110" text-anchor="middle">a person reads it next to the text</text>

  <rect class="box" x="620" y="222" width="250" height="56" />
  <text class="label" x="745" y="246" text-anchor="middle">Trend analytics</text>
  <text class="sub" x="745" y="264" text-anchor="middle">a report reads it, months later</text>

  <rect class="adj" x="620" y="376" width="250" height="56" />
  <text class="label" x="745" y="400" text-anchor="middle">Scanner</text>
  <text class="sub" x="745" y="418" text-anchor="middle">intersect with inventory CPEs</text>

  <path class="arrow-dot" d="M 745 434 L 745 454" />
  <text class="sub" x="745" y="472" text-anchor="middle">no match → empty result set → no finding,</text>
  <text class="sub" x="745" y="490" text-anchor="middle">and no record that anything was asked</text>

  <text class="sub" x="20" y="40">Two outputs are read. One is joined.</text>
</svg>
