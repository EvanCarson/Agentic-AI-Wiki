<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="rmt rmd">
  <title id="rmt">Four human-review tools compared on three axes</title>
  <desc id="rmd">A four by three matrix. Argilla reviews a record and has no span concept; its inter-annotator agreement lives only in the legacy version one SDK; review is free under Apache 2.0. Label Studio reviews a record or, with a paid tier, an agent trace; agreement metrics are Enterprise only; the review workflow itself is paid. Langfuse reviews a trace, observation or session; it compares score against score rather than annotator against annotator; queues are in the MIT core. Opik reviews a trace or a thread; it enforces reviewer overlap but computes no agreement metric; review is free under Apache 2.0. Legend: strongest on this axis, partial, weakest or absent.</desc>
  <style>
    .rm-ok  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .rm-mid { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .rm-no  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .rm-ttl { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .rm-col { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .rm-row { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .rm-cel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .rm-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .rm-leg { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
  </style>

  <text class="rm-ttl" x="20" y="34">What you can review, and whether you can check the reviewers</text>

  <text class="rm-col" x="330" y="74" text-anchor="middle">Unit of review</text>
  <text class="rm-col" x="550" y="74" text-anchor="middle">Annotator agreement</text>
  <text class="rm-col" x="770" y="74" text-anchor="middle">Review in the free tier</text>

  <text class="rm-row" x="20" y="117">Argilla 2.8.0</text>
  <rect class="rm-no" x="230" y="90" width="200" height="44" />
  <text class="rm-cel" x="330" y="117" text-anchor="middle">A record, no spans</text>
  <rect class="rm-no" x="450" y="90" width="200" height="44" />
  <text class="rm-cel" x="550" y="117" text-anchor="middle">Legacy v1 SDK only</text>
  <rect class="rm-ok" x="670" y="90" width="200" height="44" />
  <text class="rm-inv" x="770" y="117" text-anchor="middle">Yes, Apache-2.0</text>

  <text class="rm-row" x="20" y="181">Label Studio 1.23.2</text>
  <rect class="rm-mid" x="230" y="154" width="200" height="44" />
  <text class="rm-cel" x="330" y="181" text-anchor="middle">Record, or agent trace</text>
  <rect class="rm-mid" x="450" y="154" width="200" height="44" />
  <text class="rm-cel" x="550" y="181" text-anchor="middle">Enterprise tier only</text>
  <rect class="rm-no" x="670" y="154" width="200" height="44" />
  <text class="rm-cel" x="770" y="181" text-anchor="middle">Review workflow is paid</text>

  <text class="rm-row" x="20" y="245">Langfuse 4.82.0</text>
  <rect class="rm-ok" x="230" y="218" width="200" height="44" />
  <text class="rm-inv" x="330" y="245" text-anchor="middle">Trace, span or session</text>
  <rect class="rm-mid" x="450" y="218" width="200" height="44" />
  <text class="rm-cel" x="550" y="245" text-anchor="middle">Score vs score only</text>
  <rect class="rm-ok" x="670" y="218" width="200" height="44" />
  <text class="rm-inv" x="770" y="245" text-anchor="middle">Yes, MIT core</text>

  <text class="rm-row" x="20" y="309">Opik 2.2.146</text>
  <rect class="rm-mid" x="230" y="282" width="200" height="44" />
  <text class="rm-cel" x="330" y="309" text-anchor="middle">Trace or thread</text>
  <rect class="rm-no" x="450" y="282" width="200" height="44" />
  <text class="rm-cel" x="550" y="309" text-anchor="middle">Overlap, no metric</text>
  <rect class="rm-ok" x="670" y="282" width="200" height="44" />
  <text class="rm-inv" x="770" y="309" text-anchor="middle">Yes, Apache-2.0</text>

  <rect class="rm-ok" x="20" y="358" width="18" height="14" />
  <text class="rm-leg" x="48" y="370">Strongest on this axis</text>
  <rect class="rm-mid" x="260" y="358" width="18" height="14" />
  <text class="rm-leg" x="288" y="370">Partial</text>
  <rect class="rm-no" x="430" y="358" width="18" height="14" />
  <text class="rm-leg" x="458" y="370">Weakest or absent</text>
</svg>
