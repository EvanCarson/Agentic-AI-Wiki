<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="rut rud">
  <title id="rut">Two families of review tool, split by the unit they review</title>
  <desc id="rud">Two pipelines. Dataset annotation tools turn raw outputs into one record, put questions to a reviewer, and emit a labelled dataset; an agent's intermediate steps, tool calls and retries have no place to live. Observability tools take live traffic, address a trace, observation or session directly, collect scores and comments on it, and mark the queue item done.</desc>
  <style>
    .rbox   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .rhero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .rlane  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .rlabel { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .rlabel-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .rnote  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .rarrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#rarr); }
  </style>
  <defs>
    <marker id="rarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="rlane" x="20" y="28">Dataset tools — Argilla, Label Studio</text>

  <rect class="rbox" x="20" y="44" width="150" height="56" rx="8" ry="8" />
  <text class="rlabel" x="95" y="77" text-anchor="middle">Raw outputs</text>
  <path class="rarrow" d="M 174 72 L 206 72" />
  <rect class="rhero" x="210" y="44" width="160" height="56" rx="8" ry="8" />
  <text class="rlabel-inv" x="290" y="77" text-anchor="middle">One record</text>
  <path class="rarrow" d="M 374 72 L 406 72" />
  <rect class="rbox" x="410" y="44" width="190" height="56" rx="8" ry="8" />
  <text class="rlabel" x="505" y="77" text-anchor="middle">Questions answered</text>
  <path class="rarrow" d="M 604 72 L 636 72" />
  <rect class="rbox" x="640" y="44" width="170" height="56" rx="8" ry="8" />
  <text class="rlabel" x="725" y="77" text-anchor="middle">Labelled dataset</text>

  <text class="rnote" x="20" y="130">An agent's intermediate steps, tool calls and retries have nowhere to live.</text>

  <text class="rlane" x="20" y="198">Observability tools — Langfuse, Opik</text>

  <rect class="rbox" x="20" y="214" width="150" height="56" rx="8" ry="8" />
  <text class="rlabel" x="95" y="247" text-anchor="middle">Live traffic</text>
  <path class="rarrow" d="M 174 242 L 206 242" />
  <rect class="rhero" x="210" y="214" width="200" height="56" rx="8" ry="8" />
  <text class="rlabel-inv" x="310" y="247" text-anchor="middle">Trace, span or session</text>
  <path class="rarrow" d="M 414 242 L 446 242" />
  <rect class="rbox" x="450" y="214" width="180" height="56" rx="8" ry="8" />
  <text class="rlabel" x="540" y="247" text-anchor="middle">Scores + comments</text>
  <path class="rarrow" d="M 634 242 L 666 242" />
  <rect class="rbox" x="670" y="214" width="170" height="56" rx="8" ry="8" />
  <text class="rlabel" x="755" y="247" text-anchor="middle">Queue item done</text>

  <text class="rnote" x="20" y="300">You see the whole run — and still cannot ask whether two reviewers agreed.</text>
</svg>
