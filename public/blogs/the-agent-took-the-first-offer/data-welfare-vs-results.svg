<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="wt wd">
  <title id="wt">Consumer welfare lost when the agent sees 100 results instead of 3</title>
  <desc id="wd">Horizontal bar chart from Microsoft Research's Magentic Marketplace simulation, restaurant scenario with 100 customers and 300 businesses. Moving from 3 to 100 search results cut consumer welfare by 65.4 percent for Sonnet-4, 44 percent for GPT-5 run with minimal reasoning, and 4.3 percent for GPT-4o.</desc>
  <style>
    .title { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .row   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .val   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink); }
    .grid  { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .axis  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted); }
    .b1 { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .b2 { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .b3 { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
  </style>

  <text class="title" x="20" y="32">Consumer welfare lost going from 3 to 100 search results</text>
  <text class="sub" x="20" y="52">Magentic Marketplace, 100 customers × 300 businesses, mean of 5 runs</text>

  <line class="grid" x1="200" y1="80" x2="200" y2="340" />
  <line class="grid" x1="350" y1="80" x2="350" y2="340" />
  <line class="grid" x1="500" y1="80" x2="500" y2="340" />
  <line class="grid" x1="650" y1="80" x2="650" y2="340" />
  <line class="grid" x1="800" y1="80" x2="800" y2="340" />
  <text class="axis" x="200" y="360" text-anchor="middle">0%</text>
  <text class="axis" x="350" y="360" text-anchor="middle">−17.5%</text>
  <text class="axis" x="500" y="360" text-anchor="middle">−35%</text>
  <text class="axis" x="650" y="360" text-anchor="middle">−52.5%</text>
  <text class="axis" x="800" y="360" text-anchor="middle">−70%</text>

  <text class="row" x="20" y="125">Sonnet-4</text>
  <rect class="b1" x="200" y="100" width="560.6" height="40" rx="4" ry="4" />
  <text class="val" x="772" y="125">−65.4%</text>

  <text class="row" x="20" y="205">GPT-5 (minimal)</text>
  <rect class="b2" x="200" y="180" width="377.1" height="40" rx="4" ry="4" />
  <text class="val" x="589" y="205">−44%</text>

  <text class="row" x="20" y="285">GPT-4o</text>
  <rect class="b3" x="200" y="260" width="36.9" height="40" rx="4" ry="4" />
  <text class="val" x="249" y="285">−4.3%</text>
</svg>
