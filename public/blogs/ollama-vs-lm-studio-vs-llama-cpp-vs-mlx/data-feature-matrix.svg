<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ft fd">
  <title id="ft">Where each local runtime is strong and weak for tool-calling agents</title>
  <desc id="fd">Feature matrix with four runtimes as rows and four axes as columns. llama.cpp is medium on prompt fidelity and strong on parsing, constrained output and tool choice. Ollama is weak on prompt fidelity, medium on parsing, and weak on constrained output and tool choice. LM Studio is weak on prompt fidelity, medium on parsing and constrained output, and medium on tool choice. mlx-lm is strong on prompt fidelity and weak on parsing, constrained output and tool choice.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); }
    .medium { fill: var(--accent-soft); }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cell-s { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .row    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="title" x="20" y="28">Four axes that decide whether a local agent calls tools</text>

  <text class="head" x="282" y="62" text-anchor="middle">Prompt fidelity</text>
  <text class="head" x="452" y="62" text-anchor="middle">Tool parsing</text>
  <text class="head" x="622" y="62" text-anchor="middle">Constrained output</text>
  <text class="head" x="792" y="62" text-anchor="middle">tool_choice</text>

  <text class="row" x="20" y="105">llama.cpp</text>
  <rect class="medium" x="200" y="78" width="165" height="48" rx="4" />
  <text class="cell" x="282" y="107" text-anchor="middle">Medium</text>
  <rect class="strong" x="370" y="78" width="165" height="48" rx="4" />
  <text class="cell-s" x="452" y="107" text-anchor="middle">Strong</text>
  <rect class="strong" x="540" y="78" width="165" height="48" rx="4" />
  <text class="cell-s" x="622" y="107" text-anchor="middle">Strong (GBNF)</text>
  <rect class="strong" x="710" y="78" width="165" height="48" rx="4" />
  <text class="cell-s" x="792" y="107" text-anchor="middle">Strong</text>

  <text class="row" x="20" y="175">ollama</text>
  <rect class="weak" x="200" y="148" width="165" height="48" rx="4" />
  <text class="cell" x="282" y="177" text-anchor="middle">Weak (Go rewrite)</text>
  <rect class="medium" x="370" y="148" width="165" height="48" rx="4" />
  <text class="cell" x="452" y="177" text-anchor="middle">Medium</text>
  <rect class="weak" x="540" y="148" width="165" height="48" rx="4" />
  <text class="cell" x="622" y="177" text-anchor="middle">None</text>
  <rect class="weak" x="710" y="148" width="165" height="48" rx="4" />
  <text class="cell" x="792" y="177" text-anchor="middle">Unsupported</text>

  <text class="row" x="20" y="245">lm studio</text>
  <rect class="weak" x="200" y="218" width="165" height="48" rx="4" />
  <text class="cell" x="282" y="247" text-anchor="middle">Weak (rewrites)</text>
  <rect class="medium" x="370" y="218" width="165" height="48" rx="4" />
  <text class="cell" x="452" y="247" text-anchor="middle">Medium</text>
  <rect class="medium" x="540" y="218" width="165" height="48" rx="4" />
  <text class="cell" x="622" y="247" text-anchor="middle">MLX only</text>
  <rect class="medium" x="710" y="218" width="165" height="48" rx="4" />
  <text class="cell" x="792" y="247" text-anchor="middle">Medium</text>

  <text class="row" x="20" y="315">mlx-lm</text>
  <rect class="strong" x="200" y="288" width="165" height="48" rx="4" />
  <text class="cell-s" x="282" y="317" text-anchor="middle">Strong (reference)</text>
  <rect class="weak" x="370" y="288" width="165" height="48" rx="4" />
  <text class="cell" x="452" y="317" text-anchor="middle">Weak</text>
  <rect class="weak" x="540" y="288" width="165" height="48" rx="4" />
  <text class="cell" x="622" y="317" text-anchor="middle">None</text>
  <rect class="weak" x="710" y="288" width="165" height="48" rx="4" />
  <text class="cell" x="792" y="317" text-anchor="middle">Undocumented</text>

  <rect class="strong" x="200" y="356" width="18" height="14" rx="3" />
  <text class="leg" x="226" y="368">Strong</text>
  <rect class="medium" x="310" y="356" width="18" height="14" rx="3" />
  <text class="leg" x="336" y="368">Medium</text>
  <rect class="weak" x="430" y="356" width="18" height="14" rx="3" />
  <text class="leg" x="456" y="368">Weak or absent</text>
</svg>
