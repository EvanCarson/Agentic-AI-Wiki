<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="ct cd">
  <title id="ct">Two toolchains, opposite precedence for the same two template files</title>
  <desc id="cd">One model repository containing both a chat_template.jinja file and a chat_template entry inside tokenizer_config.json. The Hugging Face transformers path prefers the standalone jinja file; the GGUF conversion path used by llama.cpp, Ollama and LM Studio prefers the tokenizer_config entry and treats the jinja file as a fallback. The result is two different rendered prompts from one repository, with no error or warning.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .name   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arrC); }
  </style>
  <defs>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="title" x="20" y="26">One repository ships both files. Two toolchains disagree about which one wins.</text>

  <rect class="box" x="300" y="40" width="300" height="46" />
  <text class="name" x="450" y="60" text-anchor="middle">chat_template.jinja</text>
  <text class="name" x="450" y="78" text-anchor="middle">tokenizer_config.json</text>

  <path class="arrow" d="M 370 88 L 250 124" />
  <path class="arrow" d="M 530 88 L 650 124" />

  <rect class="adj" x="40" y="128" width="400" height="46" />
  <text class="label" x="240" y="157" text-anchor="middle">transformers / mlx-lm</text>

  <rect class="hero" x="460" y="128" width="400" height="46" />
  <text class="label-inv" x="660" y="157" text-anchor="middle">GGUF conversion — llama.cpp, Ollama, LM Studio</text>

  <text class="sub" x="240" y="198" text-anchor="middle">Standalone .jinja file takes priority</text>
  <text class="sub" x="660" y="198" text-anchor="middle">tokenizer_config entry takes priority</text>

  <text class="sub" x="240" y="220" text-anchor="middle">The current template</text>
  <text class="sub" x="660" y="220" text-anchor="middle">Whatever the legacy string still says</text>

  <rect class="box" x="40" y="240" width="820" height="44" />
  <text class="label" x="450" y="267" text-anchor="middle">Same model, two prompts, no error — you will read it as a quantisation problem</text>
</svg>
