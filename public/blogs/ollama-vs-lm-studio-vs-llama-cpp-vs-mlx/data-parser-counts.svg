<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="pt pd">
  <title id="pt">Hand-written, model-specific tool-call parsers shipped per runtime</title>
  <desc id="pd">Horizontal bar chart. Ollama ships 19 parser files, llama.cpp 15, mlx-lm 12. LM Studio's parsers are closed source and are not counted. Counted from the repositories on 21 September 2026.</desc>
  <style>
    .bar-lead { fill: var(--accent, #d4421e); }
    .bar-mid  { fill: var(--accent-soft); }
    .bar-low  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .grid   { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 2 4; opacity: .35; }
    .axis   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .row    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .val-acc { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--accent, #d4421e); }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="title" x="20" y="30">Model-specific tool-call parsers maintained in-tree</text>

  <path class="grid" d="M 300 60 L 300 330" />
  <path class="grid" d="M 445 60 L 445 330" />
  <path class="grid" d="M 590 60 L 590 330" />
  <path class="grid" d="M 735 60 L 735 330" />
  <path class="grid" d="M 880 60 L 880 330" />
  <text class="axis" x="300" y="352" text-anchor="middle">0</text>
  <text class="axis" x="445" y="352" text-anchor="middle">5</text>
  <text class="axis" x="590" y="352" text-anchor="middle">10</text>
  <text class="axis" x="735" y="352" text-anchor="middle">15</text>
  <text class="axis" x="880" y="352" text-anchor="middle">20</text>

  <text class="row" x="20" y="104">ollama</text>
  <rect class="bar-lead" x="300" y="80" width="551" height="36" rx="3" />
  <text class="val-acc" x="861" y="104">19</text>

  <text class="row" x="20" y="194">llama.cpp</text>
  <rect class="bar-mid" x="300" y="170" width="435" height="36" rx="3" />
  <text class="val" x="745" y="194">15</text>

  <text class="row" x="20" y="284">mlx-lm</text>
  <rect class="bar-low" x="300" y="260" width="348" height="36" rx="3" />
  <text class="val" x="658" y="284">12</text>

  <text class="note" x="20" y="382">LM Studio maintains its own set privately; the app is not open source, so it cannot be counted here.</text>
</svg>
