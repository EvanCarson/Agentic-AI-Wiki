<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="wt wd">
  <title id="wt">The two translation steps around identical weights</title>
  <desc id="wd">A pipeline from a messages and tools request, through rendering the chat template, through the model weights, through parsing the tool markup, to a structured tool calls array. The render step and the parse step are highlighted as the two places each runtime substitutes its own implementation; the weights in the middle are identical across all four runtimes.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .name   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arrW); }
    .drop   { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 4; opacity: .5; }
  </style>
  <defs>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="box" x="20" y="60" width="140" height="60" />
  <text class="label" x="90" y="95" text-anchor="middle">messages + tools</text>
  <path class="arrow" d="M 162 90 L 196 90" />

  <rect class="hero" x="200" y="60" width="160" height="60" />
  <text class="label-inv" x="280" y="95" text-anchor="middle">Render template</text>
  <path class="arrow" d="M 362 90 L 396 90" />

  <rect class="box" x="400" y="60" width="120" height="60" />
  <text class="label" x="460" y="87" text-anchor="middle">Weights</text>
  <text class="sub" x="460" y="105" text-anchor="middle">identical</text>
  <path class="arrow" d="M 522 90 L 556 90" />

  <rect class="hero" x="560" y="60" width="160" height="60" />
  <text class="label-inv" x="640" y="95" text-anchor="middle">Parse markup</text>
  <path class="arrow" d="M 722 90 L 756 90" />

  <rect class="box" x="760" y="60" width="120" height="60" />
  <text class="label" x="820" y="95" text-anchor="middle">tool_calls</text>

  <path class="drop" d="M 280 122 L 280 160" />
  <path class="drop" d="M 640 122 L 640 300" />

  <rect class="adj" x="20" y="164" width="860" height="122" />
  <text class="head" x="40" y="188">Substituted at the render step</text>
  <text class="name" x="40" y="212">llama.cpp</text><text class="sub" x="180" y="212">its own C++ Jinja engine, plus message rewrites before rendering</text>
  <text class="name" x="40" y="234">ollama</text><text class="sub" x="180" y="234">hand-written Go renderers, or a Go text template, or delegate</text>
  <text class="name" x="40" y="256">lm studio</text><text class="sub" x="180" y="256">closed, or an injected system prompt with a bespoke format</text>
  <text class="name" x="40" y="278">mlx-lm</text><text class="sub" x="180" y="278">the model author's template, run by reference Jinja2</text>

  <rect class="box" x="20" y="304" width="860" height="122" />
  <text class="head" x="40" y="328">Substituted at the parse step</text>
  <text class="name" x="40" y="352">llama.cpp</text><text class="sub" x="180" y="352">autoparser derived from the template, plus a grammar that constrains it</text>
  <text class="name" x="40" y="374">ollama</text><text class="sub" x="180" y="374">per-model Go parsers, else a substring scan for the tool's name</text>
  <text class="name" x="40" y="396">lm studio</text><text class="sub" x="180" y="396">closed; unparsed calls are returned as content</text>
  <text class="name" x="40" y="418">mlx-lm</text><text class="sub" x="180" y="418">per-model parsers, else a warning and raw text in content</text>

  <text class="sub" x="20" y="462">Both substituted steps fail silently: a bad render degrades quality, a bad parse hides the tool call in a field nothing reads.</text>
</svg>
