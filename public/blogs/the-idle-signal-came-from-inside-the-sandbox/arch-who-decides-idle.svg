<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="wd wdd">
  <title id="wd">Who decides the agent is idle</title>
  <desc id="wdd">A loop in four boxes. The model thinks, a tool call executes, and when the tool call finishes the guest itself signals that it is idle. The host then checkpoints the microVM, and the next step resumes it from the snapshot. The decision that the workload is idle is made by software inside the sandbox rather than by a scheduler watching utilisation from outside.</desc>
  <style>
    .wd-box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .wd-hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .wd-adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .wd-lab   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wd-labin { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .wd-sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .wd-arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#wda); }
  </style>
  <defs>
    <marker id="wda" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="wd-adj" x="40" y="60" width="180" height="56" />
  <text class="wd-lab" x="130" y="93" text-anchor="middle">Model thinks</text>
  <text class="wd-sub" x="40" y="136">nothing to pause</text>

  <path class="wd-arrow" d="M 220 88 L 300 88" />

  <rect class="wd-box" x="300" y="60" width="180" height="56" />
  <text class="wd-lab" x="390" y="93" text-anchor="middle">Tool call runs</text>
  <text class="wd-sub" x="300" y="136">the only active phase</text>

  <path class="wd-arrow" d="M 480 88 L 560 88" />

  <rect class="wd-hero" x="560" y="60" width="240" height="56" />
  <text class="wd-labin" x="680" y="93" text-anchor="middle">Guest signals idle</text>
  <text class="wd-sub" x="560" y="136">from inside the box</text>

  <path class="wd-arrow" d="M 680 116 L 680 190" />

  <rect class="wd-adj" x="560" y="190" width="280" height="56" />
  <text class="wd-lab" x="700" y="223" text-anchor="middle">Host checkpoints the microVM</text>
  <text class="wd-sub" x="560" y="274">copy-on-write from a template</text>

  <path class="wd-arrow" d="M 560 218 L 280 218" />

  <rect class="wd-box" x="40" y="190" width="240" height="56" />
  <text class="wd-lab" x="160" y="223" text-anchor="middle">Resume from snapshot</text>
  <text class="wd-sub" x="40" y="274">sub-second, on Agent Substrate</text>

  <path class="wd-arrow" d="M 160 190 L 160 116" />
</svg>
