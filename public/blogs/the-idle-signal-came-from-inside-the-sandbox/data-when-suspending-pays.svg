<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="sp spd">
  <title id="sp">When suspending the sandbox pays for itself</title>
  <desc id="spd">Three kinds of agent wait against three questions. A wait between tool calls lasts under a second to a few seconds, so suspending does not pay and costs latency on every step. A wait on a human lasts minutes to hours, where suspending pays and risks nothing. A wait on an external job lasts seconds to minutes, where suspending depends on the job and risks a cold resume in the middle of the loop.</desc>
  <style>
    .sp-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .sp-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .sp-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .sp-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .sp-col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .sp-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .sp-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .sp-cellin { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sp-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="sp-ttl" x="20" y="30">The wait decides, not the platform</text>

  <text class="sp-col" x="400" y="66" text-anchor="middle">WAIT LENGTH</text>
  <text class="sp-col" x="580" y="66" text-anchor="middle">SUSPEND PAYS</text>
  <text class="sp-col" x="775" y="66" text-anchor="middle">WHAT YOU RISK</text>

  <text class="sp-row" x="20" y="103">Between tool calls</text>
  <rect class="sp-weak" x="300" y="80" width="200" height="36" />
  <text class="sp-cell" x="400" y="103" text-anchor="middle">sub-second to seconds</text>
  <rect class="sp-weak" x="510" y="80" width="140" height="36" />
  <text class="sp-cell" x="580" y="103" text-anchor="middle">No</text>
  <rect class="sp-med" x="660" y="80" width="230" height="36" />
  <text class="sp-cell" x="775" y="103" text-anchor="middle">latency on every step</text>

  <text class="sp-row" x="20" y="159">Waiting on a human</text>
  <rect class="sp-med" x="300" y="136" width="200" height="36" />
  <text class="sp-cell" x="400" y="159" text-anchor="middle">minutes to hours</text>
  <rect class="sp-strong" x="510" y="136" width="140" height="36" />
  <text class="sp-cellin" x="580" y="159" text-anchor="middle">Yes</text>
  <rect class="sp-weak" x="660" y="136" width="230" height="36" />
  <text class="sp-cell" x="775" y="159" text-anchor="middle">nothing</text>

  <text class="sp-row" x="20" y="215">Waiting on an external job</text>
  <rect class="sp-med" x="300" y="192" width="200" height="36" />
  <text class="sp-cell" x="400" y="215" text-anchor="middle">seconds to minutes</text>
  <rect class="sp-med" x="510" y="192" width="140" height="36" />
  <text class="sp-cell" x="580" y="215" text-anchor="middle">Depends</text>
  <rect class="sp-med" x="660" y="192" width="230" height="36" />
  <text class="sp-cell" x="775" y="215" text-anchor="middle">a cold resume mid-loop</text>

  <rect class="sp-strong" x="20" y="250" width="16" height="13" />
  <text class="sp-leg" x="44" y="261">clear win</text>
  <rect class="sp-med" x="220" y="250" width="16" height="13" />
  <text class="sp-leg" x="244" y="261">conditional</text>
  <rect class="sp-weak" x="380" y="250" width="16" height="13" />
  <text class="sp-leg" x="404" y="261">no win here</text>
</svg>
