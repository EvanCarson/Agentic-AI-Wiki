<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Three results from the SPACE red-team report</title>
  <desc id="d">Bar chart of three reported proportions. No run out of one hundred and eight reached the host-side secret from inside the microVM. Eleven of fifty-four runs with partial network access retrieved a callback before fixes. Eight of ten third-party sandbox platforms tested allowed at least one of the same bypasses.</desc>
  <style>
    .track { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; }
    .lo    { fill: var(--accent-soft); }
    .hi    { fill: var(--accent, #d4421e); }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .row   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .val   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val-hi { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--accent, #d4421e); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .grid  { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>

  <text class="ttl" x="20" y="34">Share of attempts that succeeded, as reported</text>

  <line class="grid" x1="400" y1="56" x2="400" y2="330" />
  <line class="grid" x1="540" y1="56" x2="540" y2="330" />
  <line class="grid" x1="680" y1="56" x2="680" y2="330" />
  <line class="grid" x1="820" y1="56" x2="820" y2="330" />

  <text class="row" x="20" y="82">Escape the microVM to the host</text>
  <rect class="track" x="260" y="92" width="560" height="30" rx="4" />
  <text class="val" x="832" y="113">0 / 108</text>
  <text class="sub" x="270" y="112">nothing reached the host-side secret</text>

  <text class="row" x="20" y="166">Callback out, partial network allowed</text>
  <rect class="track" x="260" y="176" width="560" height="30" rx="4" />
  <rect class="lo" x="260" y="176" width="114" height="30" rx="4" />
  <text class="val-hi" x="832" y="197">11 / 54</text>
  <text class="sub" x="386" y="196">before the two fixes</text>

  <text class="row" x="20" y="250">Third-party sandboxes allowing a bypass</text>
  <rect class="track" x="260" y="260" width="560" height="30" rx="4" />
  <rect class="hi" x="260" y="260" width="448" height="30" rx="4" />
  <text class="val-hi" x="832" y="281">8 / 10</text>
  <text class="sub" x="720" y="280">same attacks</text>

  <line class="grid" x1="260" y1="330" x2="820" y2="330" />
  <text class="sub" x="256" y="350">0%</text>
  <text class="sub" x="528" y="350">50%</text>
  <text class="sub" x="800" y="350">100%</text>
  <text class="sub" x="20" y="382">Counts are Perplexity's own, and differ between outlets; the two network figures are pre-fix.</text>
</svg>
