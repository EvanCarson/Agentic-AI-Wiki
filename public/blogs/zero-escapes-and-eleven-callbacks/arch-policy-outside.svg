<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t2 d2">
  <title id="t2">Where the policy lives, in two sandbox designs</title>
  <desc id="d2">Two stacked designs. In the first, the agent task holds its own credentials and the egress allowlist is enforced inside the guest, so defeating the in-guest rule is enough to reach the internet. In the second, the guest has no credentials and no default route: every request leaves through a proxy outside the guest that holds the allowlist and injects the credential, so the guest cannot reach a destination the proxy will not send it to.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .dash  { fill: none; stroke: var(--border-soft); stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="28">Policy inside the guest</text>
  <rect class="dash" x="20" y="42" width="430" height="150" rx="8" />
  <text class="sub" x="32" y="62">guest</text>
  <rect class="box" x="40" y="72" width="170" height="46" rx="8" />
  <text class="label" x="56" y="100">Agent task + token</text>
  <rect class="adj" x="40" y="130" width="170" height="46" rx="8" />
  <text class="label" x="56" y="158">Allowlist in guest</text>
  <path class="arrow" d="M 212 153 L 268 153" />
  <rect class="box" x="276" y="130" width="150" height="46" rx="8" />
  <text class="label" x="292" y="158">Default route</text>
  <path class="arrow" d="M 452 153 L 528 153" />
  <rect class="box" x="536" y="130" width="140" height="46" rx="8" />
  <text class="label" x="560" y="158">The internet</text>
  <text class="sub" x="692" y="146">defeat one rule</text>
  <text class="sub" x="692" y="164">and you are out</text>

  <line x1="20" y1="226" x2="880" y2="226" stroke="var(--border-soft)" stroke-width="1" />

  <text class="ttl" x="20" y="262">Policy outside the guest</text>
  <rect class="dash" x="20" y="276" width="250" height="150" rx="8" />
  <text class="sub" x="32" y="296">guest — untrusted, no token</text>
  <rect class="box" x="40" y="320" width="190" height="46" rx="8" />
  <text class="label" x="56" y="348">Agent task</text>
  <text class="sub" x="40" y="396">no default route</text>
  <path class="arrow" d="M 272 343 L 328 343" />
  <rect class="hero" x="336" y="306" width="190" height="74" rx="8" />
  <text class="label-inv" x="352" y="334">Proxy outside the guest</text>
  <text class="label-inv" x="352" y="356">allowlist + credential</text>
  <path class="arrow" d="M 528 343 L 596 343" />
  <rect class="box" x="604" y="320" width="150" height="46" rx="8" />
  <text class="label" x="628" y="348">The internet</text>
  <text class="sub" x="336" y="400">the guest never holds the token, and cannot</text>
  <text class="sub" x="336" y="418">address anything the proxy will not send it to</text>
</svg>
