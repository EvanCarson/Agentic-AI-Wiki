<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t3 d3">
  <title id="t3">Three ways to write an egress allowlist, and what each one leaks</title>
  <desc id="d3">Three columns. Allowing by hostname is defeated by sending an allowed name to a different address. Allowing by resolved address admits everything else sharing that address on a content delivery network or multi-tenant cloud. Allowing a package repository admits a channel designed to serve arbitrary user-published content.</desc>
  <style>
    .col   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .colh  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="ttl" x="20" y="28">What each allowlist style actually permits</text>

  <rect class="colh" x="20" y="48" width="270" height="34" rx="6" />
  <text class="hd" x="36" y="71">By hostname</text>
  <rect class="col" x="20" y="88" width="270" height="130" rx="6" />
  <text class="label" x="36" y="114">Enforced on the name in the</text>
  <text class="label" x="36" y="132">request, not the host reached.</text>
  <text class="sub" x="36" y="162">Defeated by answering the</text>
  <text class="sub" x="36" y="180">lookup yourself: allowed name,</text>
  <text class="sub" x="36" y="198">attacker's address.</text>

  <rect class="colh" x="310" y="48" width="270" height="34" rx="6" />
  <text class="hd" x="326" y="71">By resolved address</text>
  <rect class="col" x="310" y="88" width="270" height="130" rx="6" />
  <text class="label" x="326" y="114">Enforced on the packet's</text>
  <text class="label" x="326" y="132">destination address.</text>
  <text class="sub" x="326" y="162">On a CDN or multi-tenant</text>
  <text class="sub" x="326" y="180">cloud, one allowed address is</text>
  <text class="sub" x="326" y="198">shared with everyone else.</text>

  <rect class="colh" x="600" y="48" width="280" height="34" rx="6" />
  <text class="hd" x="616" y="71">By package repository</text>
  <rect class="col" x="600" y="88" width="280" height="130" rx="6" />
  <text class="label" x="616" y="114">A single entry that makes the</text>
  <text class="label" x="616" y="132">task runnable at all.</text>
  <text class="sub" x="616" y="162">It is a channel for arbitrary</text>
  <text class="sub" x="616" y="180">user-published content, so the</text>
  <text class="sub" x="616" y="198">entry is the hole.</text>

  <text class="sub" x="20" y="252">All three reduce unsanctioned action on third parties. None of them bounds what leaves.</text>
  <text class="sub" x="20" y="274">For confidentiality the boundary has to see the request, which means a proxy you operate.</text>
</svg>
