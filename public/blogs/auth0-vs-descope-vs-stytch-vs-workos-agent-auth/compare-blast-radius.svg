<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What a vaulted token can reach</title>
  <desc id="d">Three scopes for the same task of drafting one reply. A user-scoped token grants full mailbox read and send, a connection-scoped token narrows to one provider but keeps every granted scope, and a task-scoped token grants read of one thread and send of one reply. The reachable surface shrinks by roughly two orders of magnitude across the three.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .cap    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .val    { font-family: var(--font-display); font-size: 22px; fill: currentColor; text-anchor: middle; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="chart-title" x="450" y="24">Same task, three grants — the blast radius after an injection</text>

  <circle class="hero" cx="160" cy="130" r="66" />
  <text class="col-head" x="160" y="222">User-scoped</text>
  <text class="cap" x="160" y="240">Read all mail, send as user</text>
  <text class="cap" x="160" y="256">Revoking it logs the user out</text>

  <circle class="adj" cx="450" cy="130" r="40" />
  <text class="col-head" x="450" y="222">Connection-scoped</text>
  <text class="cap" x="450" y="240">One provider, every granted scope</text>
  <text class="cap" x="450" y="256">The common vault default</text>

  <circle class="weak" cx="750" cy="130" r="13" />
  <text class="col-head" x="750" y="222">Task-scoped</text>
  <text class="cap" x="750" y="240">One thread, one reply, expires</text>
  <text class="cap" x="750" y="256">Almost nobody ships this by default</text>

  <text class="note" x="24" y="288">A vault that stores the user’s full grant has relocated the credential out of your process. It has not made it smaller.</text>
</svg>
