<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Four identity platforms across five agent-authorization axes</title>
  <desc id="d">Auth0 for AI Agents, Descope, Stytch Connected Apps and WorkOS compared on five axes: inbound OAuth authorization server, outbound token vault, asynchronous human approval, running alongside an existing identity provider, and MCP-specific tooling. Auth0 and Descope lead on the outbound axis, Stytch and WorkOS lead on running standalone next to an incumbent identity provider, and all four are strong on the inbound axis.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-head { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cv     { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink); text-anchor: middle; }
    .cv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--paper); text-anchor: middle; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
  </style>

  <text class="chart-title" x="450" y="22">Row two is the row that sorts them</text>

  <text class="col-head" x="315" y="52">Auth0 for</text><text class="col-head" x="315" y="65">AI Agents</text>
  <text class="col-head" x="470" y="52">Descope</text>
  <text class="col-head" x="625" y="52">Stytch</text><text class="col-head" x="625" y="65">Connected Apps</text>
  <text class="col-head" x="780" y="52">WorkOS</text><text class="col-head" x="780" y="65">AuthKit / Connect</text>

  <text class="row-head" x="24" y="98">Inbound OAuth server</text>
  <rect class="strong" x="245" y="79" width="140" height="27" rx="5" /><text class="cv-inv" x="315" y="98">Yes</text>
  <rect class="strong" x="400" y="79" width="140" height="27" rx="5" /><text class="cv-inv" x="470" y="98">Inbound Apps</text>
  <rect class="strong" x="555" y="79" width="140" height="27" rx="5" /><text class="cv-inv" x="625" y="98">Core product</text>
  <rect class="strong" x="710" y="79" width="140" height="27" rx="5" /><text class="cv-inv" x="780" y="98">Core product</text>

  <text class="row-head" x="24" y="140">Outbound token vault</text>
  <rect class="strong" x="245" y="121" width="140" height="27" rx="5" /><text class="cv-inv" x="315" y="140">Token Vault</text>
  <rect class="strong" x="400" y="121" width="140" height="27" rx="5" /><text class="cv-inv" x="470" y="140">Outbound Apps</text>
  <rect class="weak" x="555" y="121" width="140" height="27" rx="5" /><text class="cv" x="625" y="140">Not the headline</text>
  <rect class="weak" x="710" y="121" width="140" height="27" rx="5" /><text class="cv" x="780" y="140">Not the headline</text>

  <text class="row-head" x="24" y="182">Async human approval</text>
  <rect class="strong" x="245" y="163" width="140" height="27" rx="5" /><text class="cv-inv" x="315" y="182">CIBA + PAR</text>
  <rect class="mid" x="400" y="163" width="140" height="27" rx="5" /><text class="cv" x="470" y="182">Via flows</text>
  <rect class="mid" x="555" y="163" width="140" height="27" rx="5" /><text class="cv" x="625" y="182">Consent + policy</text>
  <rect class="weak" x="710" y="163" width="140" height="27" rx="5" /><text class="cv" x="780" y="182">Build it</text>

  <text class="row-head" x="24" y="224">Runs beside your IdP</text>
  <rect class="weak" x="245" y="205" width="140" height="27" rx="5" /><text class="cv" x="315" y="224">Platform adoption</text>
  <rect class="mid" x="400" y="205" width="140" height="27" rx="5" /><text class="cv" x="470" y="224">Partly</text>
  <rect class="strong" x="555" y="205" width="140" height="27" rx="5" /><text class="cv-inv" x="625" y="224">Standalone layer</text>
  <rect class="strong" x="710" y="205" width="140" height="27" rx="5" /><text class="cv-inv" x="780" y="224">Connect middleware</text>

  <text class="row-head" x="24" y="266">MCP-specific tooling</text>
  <rect class="mid" x="245" y="247" width="140" height="27" rx="5" /><text class="cv" x="315" y="266">Supported</text>
  <rect class="strong" x="400" y="247" width="140" height="27" rx="5" /><text class="cv-inv" x="470" y="266">Agentic Identity Hub</text>
  <rect class="strong" x="555" y="247" width="140" height="27" rx="5" /><text class="cv-inv" x="625" y="266">MCP flows, DCR</text>
  <rect class="strong" x="710" y="247" width="140" height="27" rx="5" /><text class="cv-inv" x="780" y="266">Auth for MCP, GA</text>

  <rect class="strong" x="24" y="300" width="16" height="14" rx="3" /><text class="leg" x="48" y="312">Named product</text>
  <rect class="mid" x="180" y="300" width="16" height="14" rx="3" /><text class="leg" x="204" y="312">Achievable, less direct</text>
  <rect class="weak" x="380" y="300" width="16" height="14" rx="3" /><text class="leg" x="404" y="312">Yours to build or to adopt wholesale</text>

  <text class="note" x="24" y="348">Every column is strong on inbound, because that is the half MCP forced everyone to ship in 2025 and 2026.</text>
  <text class="note" x="24" y="368">The outbound half is where an agent product actually spends its credentials, and only two columns lead with it.</text>
  <text class="note" x="24" y="388">Positions as published by each vendor in mid-2026; all four ship quickly, so re-check the two middle rows before you commit.</text>
</svg>
