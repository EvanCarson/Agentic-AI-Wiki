<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Inbound and outbound agent authorization</title>
  <desc id="d">Two opposite flows around one application. Inbound: an external agent or MCP client asks your application, acting as an OAuth authorization server, for a scoped token to reach your users' data, with consent and dynamic client registration in the path. Outbound: your own agent asks a token vault for a stored third-party credential so it can call Gmail, Slack or Salesforce on a user's behalf, with refresh and retrieval policy in the path.</desc>
  <style>
    .box     { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero    { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj     { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); text-anchor: middle; }
    .sub     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; text-anchor: middle; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .8; text-anchor: middle; }
    .lane    { font-family: var(--font-display); font-size: 14px; font-weight: 600; fill: currentColor; }
    .arrow   { fill: none; stroke: currentColor; stroke-width: 1.4; marker-end: url(#arr); }
    .prose   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .8; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="lane" x="24" y="34">Inbound — letting an agent in</text>

  <rect class="box" x="24" y="56" width="190" height="68" />
  <text class="label" x="119" y="84">Someone else’s agent</text>
  <text class="sub" x="119" y="103">or MCP client</text>

  <rect class="adj" x="264" y="56" width="190" height="68" />
  <text class="label" x="359" y="84">Consent + registration</text>
  <text class="sub" x="359" y="103">OAuth 2.1, PKCE, DCR</text>

  <rect class="hero" x="504" y="56" width="190" height="68" />
  <text class="label-inv" x="599" y="84">Your app as</text>
  <text class="label-inv" x="599" y="103">authorization server</text>

  <rect class="box" x="744" y="56" width="132" height="68" />
  <text class="label" x="810" y="84">Your users’</text>
  <text class="label" x="810" y="103">data</text>

  <path class="arrow" d="M 214 90 L 260 90" />
  <path class="arrow" d="M 454 90 L 500 90" />
  <path class="arrow" d="M 694 90 L 740 90" />

  <text class="prose" x="24" y="154">Hard part: issuing a scoped, revocable token to a client that has no browser session and may have registered itself thirty seconds ago.</text>

  <line x1="24" y1="184" x2="876" y2="184" stroke="currentColor" stroke-width="1" opacity=".25" />

  <text class="lane" x="24" y="226">Outbound — letting your agent out</text>

  <rect class="hero" x="24" y="248" width="190" height="68" />
  <text class="label-inv" x="119" y="276">Your agent</text>
  <text class="sub-inv" x="119" y="295">acting for a user</text>

  <rect class="adj" x="264" y="248" width="190" height="68" />
  <text class="label" x="359" y="276">Token vault</text>
  <text class="sub" x="359" y="295">store, refresh, retrieval policy</text>

  <rect class="box" x="504" y="248" width="190" height="68" />
  <text class="label" x="599" y="276">Third-party OAuth</text>
  <text class="sub" x="599" y="295">Google, Slack, Salesforce</text>

  <rect class="box" x="744" y="248" width="132" height="68" />
  <text class="label" x="810" y="276">Their API</text>
  <text class="sub" x="810" y="295">user’s scopes</text>

  <path class="arrow" d="M 214 282 L 260 282" />
  <path class="arrow" d="M 454 282 L 500 282" />
  <path class="arrow" d="M 694 282 L 740 282" />

  <rect class="box" x="264" y="352" width="190" height="60" />
  <text class="label" x="359" y="379">Async approval</text>
  <text class="sub" x="359" y="397">CIBA, for the pause</text>
  <path class="arrow" d="M 359 316 L 359 348" />

  <text class="prose" x="24" y="446">Hard part: the scope the user granted is the scope the agent holds, so a vault without per-task narrowing has moved the credential, not shrunk it.</text>
  <text class="prose" x="24" y="470">Most agent products need both halves. The vendor lists rarely say which half a product is.</text>
</svg>
