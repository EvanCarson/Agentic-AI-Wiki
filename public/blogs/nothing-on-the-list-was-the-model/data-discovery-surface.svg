<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Named public evaluations per category</title>
  <desc id="d">Horizontal bars counting the public evaluations named in the October 2026 report for each of the four behaviour categories: three for exploiting a software flaw, two for submitting a form it should not have, one for reaching gated data, and none for the URL-shortener case, which was identified internally.</desc>
  <style>
    .barA   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .barB   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .barC   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .axis   { fill: none; stroke: var(--ink); stroke-width: 1.25; opacity: .8; }
    .grid   { fill: none; stroke: var(--ink); stroke-width: 1; opacity: .22; stroke-dasharray: 3 4; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .num    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .num-inv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); }
    .tick   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; text-anchor: middle; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="20" y="30">Public evaluations named, by behaviour category</text>

  <line class="grid" x1="310" y1="52" x2="310" y2="352" />
  <line class="grid" x1="540" y1="52" x2="540" y2="352" />
  <line class="grid" x1="770" y1="52" x2="770" y2="352" />

  <text class="lbl" x="80" y="72">Exploiting a software flaw to run commands</text>
  <rect class="barA" x="80" y="80" width="690" height="38" />
  <text class="num-inv" x="96" y="104">3</text>

  <text class="lbl" x="80" y="148">Submitting a form it should not have</text>
  <rect class="barB" x="80" y="156" width="460" height="38" />
  <text class="num" x="552" y="180">2</text>

  <text class="lbl" x="80" y="224">Working around a fee or token gate</text>
  <rect class="barC" x="80" y="232" width="230" height="38" />
  <text class="num" x="322" y="256">1</text>

  <text class="lbl" x="80" y="300">Shortening a URL to beat a length cap</text>
  <rect class="barC" x="80" y="308" width="2" height="38" />
  <text class="num" x="94" y="332">0 &#8212; identified internally</text>

  <line class="axis" x1="80" y1="352" x2="860" y2="352" />
  <line class="axis" x1="80" y1="352" x2="80" y2="360" />
  <line class="axis" x1="310" y1="352" x2="310" y2="360" />
  <line class="axis" x1="540" y1="352" x2="540" y2="360" />
  <line class="axis" x1="770" y1="352" x2="770" y2="360" />

  <text class="tick" x="80" y="376">0</text>
  <text class="tick" x="310" y="376">1</text>
  <text class="tick" x="540" y="376">2</text>
  <text class="tick" x="770" y="376">3</text>

  <text class="note" x="20" y="396">Named: DeepSearchQA, BrowseComp, LABBench2 (row 1); OSWorld, Odysseys (row 2); Humanity&#8217;s Last Exam (row 3).</text>
</svg>
