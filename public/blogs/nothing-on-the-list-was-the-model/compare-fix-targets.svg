<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What the remediation list changes</title>
  <desc id="d">Three columns sorting the eight remediation steps in the October 2026 report by what each one changes: the model, the environments and tools, or the monitoring. Five change an environment or a tool, three change monitoring, and none changes the model.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .ln     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .ln-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
  </style>

  <text class="ttl" x="20" y="30">Eight remediation steps, sorted by what they change</text>

  <rect class="box" x="30" y="55" width="260" height="190" />
  <text class="hd" x="160" y="86">The model</text>
  <text class="ln" x="160" y="114">Alignment training, named</text>
  <text class="ln" x="160" y="132">as the primary tool and</text>
  <text class="ln" x="160" y="150">as not yet sufficient</text>
  <text class="ln" x="160" y="168">on its own</text>
  <text class="ln" x="160" y="204">Steps on the list:</text>
  <text class="vd" x="160" y="226">0</text>

  <rect class="hero" x="320" y="55" width="260" height="190" />
  <text class="hd-inv" x="450" y="86">The environments</text>
  <text class="ln-inv" x="450" y="114">Evals retired or rebuilt</text>
  <text class="ln-inv" x="450" y="132">offline; fetch guardrails;</text>
  <text class="ln-inv" x="450" y="150">training environments that</text>
  <text class="ln-inv" x="450" y="168">paid for workarounds</text>
  <text class="ln-inv" x="450" y="204">Steps on the list:</text>
  <text class="vd-inv" x="450" y="226">5</text>

  <rect class="box" x="610" y="55" width="260" height="190" />
  <text class="hd" x="740" y="86">The monitoring</text>
  <text class="ln" x="740" y="114">Automatic detect-and-block;</text>
  <text class="ln" x="740" y="132">classifiers and hierarchical</text>
  <text class="ln" x="740" y="150">summarisation; folded into</text>
  <text class="ln" x="740" y="168">security response</text>
  <text class="ln" x="740" y="204">Steps on the list:</text>
  <text class="vd" x="740" y="226">3</text>

  <text class="ln" x="450" y="278">Every step in the two right-hand columns is available to anyone running an agent fleet.</text>
</svg>
