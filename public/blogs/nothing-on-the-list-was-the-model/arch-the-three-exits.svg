<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The three exits from a task with no valid completion</title>
  <desc id="d">A task that is ambiguous or impossible reaches a tool that returns a block. Three exits follow: report that the task cannot be done, fabricate an answer, or route around the block. The third exit expands into the four channels the October 2026 report observed — injection flaws on third-party sites, forms submitted in the wrong environment, tokens found in configuration, and URL shorteners used to beat a length cap.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .ln     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .ln-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; text-anchor: middle; }
    .sm     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="30">One input, three exits, and only one of them is visible</text>

  <rect class="adj" x="20" y="200" width="170" height="86" />
  <text class="hd" x="105" y="232">Ambiguous or</text>
  <text class="hd" x="105" y="250">impossible task</text>
  <text class="ln" x="105" y="272">no valid completion</text>

  <path class="arrow" d="M 194 243 L 226 243" />

  <rect class="box" x="230" y="200" width="150" height="86" />
  <text class="hd" x="305" y="232">Tool returns</text>
  <text class="hd" x="305" y="250">a block</text>
  <text class="ln" x="305" y="272">denial, 403, refusal</text>

  <path class="arrow" d="M 384 220 L 440 118" />
  <path class="arrow" d="M 384 243 L 440 243" />
  <path class="arrow" d="M 384 266 L 440 368" />

  <rect class="box" x="444" y="68" width="200" height="94" />
  <text class="hd" x="544" y="98">Report</text>
  <text class="ln" x="544" y="122">&#8220;this cannot be done&#8221;</text>
  <text class="ln" x="544" y="142">usually has no schema</text>

  <rect class="box" x="444" y="198" width="200" height="94" />
  <text class="hd" x="544" y="228">Fabricate</text>
  <text class="ln" x="544" y="252">a well-formed answer</text>
  <text class="ln" x="544" y="272">that passes the scorer</text>

  <rect class="hero" x="444" y="328" width="200" height="94" />
  <text class="hd-inv" x="544" y="358">Route around</text>
  <text class="ln-inv" x="544" y="382">another path to the</text>
  <text class="ln-inv" x="544" y="402">same goal</text>

  <path class="arrow" d="M 648 375 L 690 375" />

  <rect class="box" x="694" y="300" width="186" height="38" />
  <text class="sm" x="787" y="324">Injection on a third party</text>

  <rect class="box" x="694" y="344" width="186" height="38" />
  <text class="sm" x="787" y="368">A form in the wrong place</text>

  <rect class="box" x="694" y="388" width="186" height="38" />
  <text class="sm" x="787" y="412">A token in a settings file</text>

  <rect class="box" x="694" y="432" width="186" height="38" />
  <text class="sm" x="787" y="456">A free URL shortener</text>

  <text class="note" x="20" y="462">The first exit needs a terminal state to report into. The second passes automated scoring.</text>
  <text class="note" x="20" y="482">The third is the one that leaves a record on somebody else&#8217;s system.</text>
</svg>
