<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t2 d2">
  <title id="t2">Exploitation consequence, AI-discovered versus everything else</title>
  <desc id="d2">Paired horizontal bars for three consequence classes. Remote code execution accounts for 50 percent of AI-discovered vulnerabilities against 26 percent of the broader CVE ecosystem; information disclosure 8 percent against 18 percent; data manipulation 5 percent against 9 percent.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .num   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .numinv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); }
    .axis  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .55; }
    .grid  { stroke: currentColor; stroke-width: 1; opacity: .18; stroke-dasharray: 2 4; }
    .ai    { fill: var(--accent, #d4421e); }
    .other { fill: var(--surface); stroke: var(--ink); stroke-width: .75; }
    .key   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
  </style>
  <text class="ttl" x="20" y="30">Share of vulnerabilities per exploitation consequence (%)</text>

  <g class="grid">
    <line x1="400" y1="52" x2="400" y2="330" />
    <line x1="520" y1="52" x2="520" y2="330" />
    <line x1="640" y1="52" x2="640" y2="330" />
    <line x1="760" y1="52" x2="760" y2="330" />
    <line x1="880" y1="52" x2="880" y2="330" />
  </g>
  <g class="axis">
    <text x="400" y="348" text-anchor="middle">10</text>
    <text x="520" y="348" text-anchor="middle">20</text>
    <text x="640" y="348" text-anchor="middle">30</text>
    <text x="760" y="348" text-anchor="middle">40</text>
    <text x="880" y="348" text-anchor="middle">50</text>
  </g>
  <line x1="280" y1="330" x2="880" y2="330" stroke="currentColor" stroke-width="1" opacity=".4" />

  <text class="label" x="270" y="78" text-anchor="end">Remote code execution</text>
  <rect class="ai"    x="280" y="62" width="600" height="18" rx="3" />
  <text class="numinv" x="870" y="76" text-anchor="end">50</text>
  <rect class="other" x="280" y="84" width="312" height="18" rx="3" />
  <text class="num" x="600" y="98">26</text>

  <text class="label" x="270" y="164" text-anchor="end">Information disclosure</text>
  <rect class="ai"    x="280" y="148" width="96" height="18" rx="3" />
  <text class="num" x="384" y="162">8</text>
  <rect class="other" x="280" y="170" width="216" height="18" rx="3" />
  <text class="num" x="504" y="184">18</text>

  <text class="label" x="270" y="250" text-anchor="end">Data manipulation</text>
  <rect class="ai"    x="280" y="234" width="60" height="18" rx="3" />
  <text class="num" x="348" y="248">5</text>
  <rect class="other" x="280" y="256" width="108" height="18" rx="3" />
  <text class="num" x="396" y="270">9</text>

  <rect class="ai"    x="280" y="366" width="16" height="12" rx="2" />
  <text class="key" x="304" y="376">AI-discovered</text>
  <rect class="other" x="420" y="366" width="16" height="12" rx="2" />
  <text class="key" x="444" y="376">Not identified as AI-discovered</text>
</svg>
