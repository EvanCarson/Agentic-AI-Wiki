<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">AI-stack CVEs by layer, January to August 2026</title>
  <desc id="d">Horizontal bar chart of CVE counts across eight AI-stack layers. AI orchestration and agent frameworks lead with 782, followed by AI web apps and portals at 230, inference and serving infrastructure at 212, model security advisories at 106, ML frameworks and hubs at 99, frontier models at 97, MLOps and experiment tracking at 39, and vector databases and search at 19.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .num   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .numinv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); }
    .axis  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .55; }
    .grid  { stroke: currentColor; stroke-width: 1; opacity: .18; stroke-dasharray: 2 4; }
    .lead  { fill: var(--accent, #d4421e); }
    .mid   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: .75; }
    .rest  { fill: var(--surface); stroke: var(--ink); stroke-width: .75; }
  </style>
  <text class="ttl" x="20" y="30">CVEs disclosed per AI-stack layer, Jan–Aug 2026</text>

  <g class="grid">
    <line x1="410" y1="52" x2="410" y2="372" />
    <line x1="560" y1="52" x2="560" y2="372" />
    <line x1="710" y1="52" x2="710" y2="372" />
    <line x1="860" y1="52" x2="860" y2="372" />
  </g>
  <g class="axis">
    <text x="410" y="390" text-anchor="middle">200</text>
    <text x="560" y="390" text-anchor="middle">400</text>
    <text x="710" y="390" text-anchor="middle">600</text>
    <text x="860" y="390" text-anchor="middle">800</text>
  </g>
  <line x1="260" y1="372" x2="860" y2="372" stroke="currentColor" stroke-width="1" opacity=".4" />

  <g>
    <text class="label" x="250" y="76" text-anchor="end">Orchestration &amp; agent frameworks</text>
    <rect class="lead" x="260" y="62" width="586" height="20" rx="3" />
    <text class="numinv" x="854" y="77" text-anchor="end">782</text>
  </g>
  <g>
    <text class="label" x="250" y="114" text-anchor="end">AI web apps &amp; portals</text>
    <rect class="mid" x="260" y="100" width="173" height="20" rx="3" />
    <text class="num" x="441" y="115">230</text>
  </g>
  <g>
    <text class="label" x="250" y="152" text-anchor="end">Inference &amp; serving infrastructure</text>
    <rect class="mid" x="260" y="138" width="159" height="20" rx="3" />
    <text class="num" x="427" y="153">212</text>
  </g>
  <g>
    <text class="label" x="250" y="190" text-anchor="end">Model security advisories</text>
    <rect class="rest" x="260" y="176" width="80" height="20" rx="3" />
    <text class="num" x="348" y="191">106</text>
  </g>
  <g>
    <text class="label" x="250" y="228" text-anchor="end">ML frameworks &amp; hubs</text>
    <rect class="rest" x="260" y="214" width="74" height="20" rx="3" />
    <text class="num" x="342" y="229">99</text>
  </g>
  <g>
    <text class="label" x="250" y="266" text-anchor="end">Frontier models</text>
    <rect class="rest" x="260" y="252" width="73" height="20" rx="3" />
    <text class="num" x="341" y="267">97</text>
  </g>
  <g>
    <text class="label" x="250" y="304" text-anchor="end">MLOps &amp; experiment tracking</text>
    <rect class="rest" x="260" y="290" width="29" height="20" rx="3" />
    <text class="num" x="297" y="305">39</text>
  </g>
  <g>
    <text class="label" x="250" y="342" text-anchor="end">Vector databases &amp; search</text>
    <rect class="rest" x="260" y="328" width="14" height="20" rx="3" />
    <text class="num" x="282" y="343">19</text>
  </g>
</svg>
