<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t4 d4">
  <title id="t4">How a vulnerability enters the AI-discovered sample</title>
  <desc id="d4">Flow diagram. Roughly ten thousand seven hundred monthly disclosures pass two filters: ingestion of confirmed disclosures from frontier AI research programmes, and parsing of advisories for an explicit acknowledgment that an autonomous agent found the flaw. What survives is a small labelled set dominated by a few prolific vendors working on memory-unsafe C and C++ targets, from which the fifty percent remote-code-execution share is computed. A side note records that no denominator is published.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: none; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .labi  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .subi  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .note  { fill: none; stroke: var(--ink); stroke-width: 1; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="box" x="40" y="40" width="200" height="74" rx="8" />
  <text class="label" x="60" y="68">All disclosures</text>
  <text class="mono"  x="60" y="92">10,740 / month</text>
  <text class="sub"   x="60" y="107">August 2026</text>

  <path class="arrow" d="M 240 77 L 330 77" />

  <rect class="adj" x="330" y="26" width="240" height="46" rx="8" />
  <text class="label" x="348" y="55">Filter 1 — lab ledgers</text>
  <rect class="adj" x="330" y="82" width="240" height="46" rx="8" />
  <text class="label" x="348" y="105">Filter 2 — advisory parsing</text>
  <text class="sub"   x="348" y="121">explicit AI acknowledgment</text>

  <path class="arrow" d="M 570 77 L 660 77" />

  <rect class="box" x="660" y="40" width="200" height="74" rx="8" />
  <text class="label" x="678" y="68">Labelled set</text>
  <text class="mono"  x="678" y="92">size unpublished</text>
  <text class="sub"   x="678" y="107">GTIG risk ratings</text>

  <path class="arrow" d="M 760 114 L 760 170" />

  <rect class="box" x="520" y="170" width="340" height="96" rx="8" />
  <text class="label" x="540" y="198">Who publishes AI attribution</text>
  <text class="sub"   x="540" y="220">a handful of prolific vendors — Hacktron AI, AISLE</text>
  <text class="sub"   x="540" y="240">targets: OpenSSL, curl, Wireshark, kernels, hypervisors</text>
  <text class="sub"   x="540" y="258">overwhelmingly memory-unsafe C / C++</text>

  <path class="arrow" d="M 520 218 L 420 218" />

  <rect class="adj" x="180" y="186" width="240" height="64" rx="8" />
  <text class="label" x="200" y="212">Target mix predicts</text>
  <text class="sub"   x="200" y="234">memory corruption → code execution</text>

  <path class="arrow" d="M 300 250 L 300 320" />

  <rect class="hero" x="140" y="320" width="320" height="86" rx="8" />
  <text class="labi" x="162" y="350">Reported result</text>
  <text class="subi" x="162" y="372">50% of AI-discovered flaws yield RCE,</text>
  <text class="subi" x="162" y="392">against 26% of everything else</text>

  <rect class="note" x="520" y="320" width="340" height="86" rx="8" />
  <text class="label" x="540" y="348">What is not published</text>
  <text class="sub"   x="540" y="370">no N for the AI-discovered column;</text>
  <text class="sub"   x="540" y="390">no control for target-software composition</text>

  <path class="arrow" d="M 520 363 L 466 363" />

  <text class="sub" x="40" y="450">Each filter selects on disclosure practice, not on discovery method — so the sample describes</text>
  <text class="sub" x="40" y="470">who currently publishes AI attribution, and what they happen to be pointing their agents at.</text>
</svg>
