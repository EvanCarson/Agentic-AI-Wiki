<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The altitude each framework scores at</title>
  <desc id="d">Three stacked floors showing what each framework scores. The bottom floor is a single component output scored by a metric, home to DeepEval and Ragas. The middle floor is a matrix of configurations compared side by side, home to Promptfoo. The top floor is a full agent trajectory — an agent using tools in a sandbox over many steps — scored end to end, home to Inspect. A vertical arrow notes that the higher the altitude, the more of the system is under test and the more expensive each run is.</desc>
  <style>
    .floor  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .axis   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- top floor: trajectory -->
  <rect class="floor" x="110" y="40" width="770" height="120" />
  <text class="tag" x="130" y="66">TRAJECTORY — the whole agent under test</text>
  <text class="head" x="130" y="92">An agent using tools in a sandbox, over many steps</text>
  <rect class="hero" x="640" y="104" width="220" height="40" />
  <text class="label-inv" x="660" y="129">Inspect — scored end to end</text>

  <!-- middle floor: comparison -->
  <rect class="floor" x="110" y="180" width="770" height="120" />
  <text class="tag" x="130" y="206">COMPARISON — configs side by side</text>
  <text class="head" x="130" y="232">A matrix of prompts × models × providers</text>
  <rect class="adj" x="640" y="244" width="220" height="40" />
  <text class="label" x="660" y="269">Promptfoo — which one wins</text>

  <!-- bottom floor: output -->
  <rect class="floor" x="110" y="320" width="770" height="140" />
  <text class="tag" x="130" y="346">OUTPUT — one component's result</text>
  <text class="head" x="130" y="372">A single output, scored by a metric</text>
  <rect class="hero" x="640" y="384" width="220" height="36" />
  <text class="label-inv" x="660" y="407">DeepEval — any component</text>
  <rect class="adj" x="640" y="424" width="220" height="30" />
  <text class="label" x="660" y="444">Ragas — RAG only</text>

  <!-- altitude axis -->
  <path class="arrow" d="M 60 450 L 60 60" />
  <text class="axis" x="30" y="250" transform="rotate(-90 30 250)" style="text-anchor:middle">more of the system under test · costlier per run</text>
</svg>
