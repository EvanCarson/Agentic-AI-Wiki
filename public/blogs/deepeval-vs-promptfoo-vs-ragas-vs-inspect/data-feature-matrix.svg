<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Where each eval framework leans hardest</title>
  <desc id="d">A feature matrix with four frameworks as rows and five axes as columns: agent and trajectory metrics, RAG-specific metrics, cross-config comparison, sandboxed agent execution, and CI unit-test ergonomics. DeepEval is strong on agent metrics, RAG metrics and CI ergonomics, medium on comparison, weak on sandboxing. Ragas is strong on RAG metrics only and weak on everything else. Promptfoo is strong on the comparison matrix and CI ergonomics, medium on agent and RAG metrics, weak on sandboxing. Inspect is strong on sandboxed execution and agent trajectory scoring, medium on RAG, comparison and CI ergonomics.</desc>
  <style>
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .colh   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .8; }
    .row    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .medium { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="head" x="24" y="28">What each is built to score</text>

  <text class="colh" x="176" y="58">Agent</text><text class="colh" x="176" y="70">metrics</text>
  <text class="colh" x="320" y="58">RAG</text><text class="colh" x="320" y="70">metrics</text>
  <text class="colh" x="464" y="58">Compare</text><text class="colh" x="464" y="70">configs</text>
  <text class="colh" x="608" y="58">Sandbox</text><text class="colh" x="608" y="70">exec</text>
  <text class="colh" x="752" y="58">CI</text><text class="colh" x="752" y="70">ergonomics</text>

  <!-- DeepEval -->
  <text class="row" x="24" y="112">DeepEval</text>
  <rect class="strong" x="170" y="90" width="135" height="36" /><text class="cell-inv" x="205" y="113">Strong</text>
  <rect class="strong" x="314" y="90" width="135" height="36" /><text class="cell-inv" x="349" y="113">Strong</text>
  <rect class="medium" x="458" y="90" width="135" height="36" /><text class="cell" x="493" y="113">Medium</text>
  <rect class="weak"   x="602" y="90" width="135" height="36" /><text class="cell" x="645" y="113">Weak</text>
  <rect class="strong" x="746" y="90" width="135" height="36" /><text class="cell-inv" x="781" y="113">Strong</text>

  <!-- Ragas -->
  <text class="row" x="24" y="164">Ragas</text>
  <rect class="weak"   x="170" y="142" width="135" height="36" /><text class="cell" x="213" y="165">Weak</text>
  <rect class="strong" x="314" y="142" width="135" height="36" /><text class="cell-inv" x="349" y="165">Strong</text>
  <rect class="weak"   x="458" y="142" width="135" height="36" /><text class="cell" x="501" y="165">Weak</text>
  <rect class="weak"   x="602" y="142" width="135" height="36" /><text class="cell" x="645" y="165">Weak</text>
  <rect class="weak"   x="746" y="142" width="135" height="36" /><text class="cell" x="789" y="165">Weak</text>

  <!-- Promptfoo -->
  <text class="row" x="24" y="216">Promptfoo</text>
  <rect class="medium" x="170" y="194" width="135" height="36" /><text class="cell" x="205" y="217">Medium</text>
  <rect class="medium" x="314" y="194" width="135" height="36" /><text class="cell" x="349" y="217">Medium</text>
  <rect class="strong" x="458" y="194" width="135" height="36" /><text class="cell-inv" x="493" y="217">Strong</text>
  <rect class="weak"   x="602" y="194" width="135" height="36" /><text class="cell" x="645" y="217">Weak</text>
  <rect class="strong" x="746" y="194" width="135" height="36" /><text class="cell-inv" x="781" y="217">Strong</text>

  <!-- Inspect -->
  <text class="row" x="24" y="268">Inspect</text>
  <rect class="strong" x="170" y="246" width="135" height="36" /><text class="cell-inv" x="205" y="269">Strong</text>
  <rect class="medium" x="314" y="246" width="135" height="36" /><text class="cell" x="349" y="269">Medium</text>
  <rect class="medium" x="458" y="246" width="135" height="36" /><text class="cell" x="493" y="269">Medium</text>
  <rect class="strong" x="602" y="246" width="135" height="36" /><text class="cell-inv" x="637" y="269">Strong</text>
  <rect class="medium" x="746" y="246" width="135" height="36" /><text class="cell" x="781" y="269">Medium</text>

  <rect class="strong" x="24" y="330" width="16" height="16" /><text class="leg" x="48" y="343">Strong</text>
  <rect class="medium" x="120" y="330" width="16" height="16" /><text class="leg" x="144" y="343">Medium</text>
  <rect class="weak"   x="224" y="330" width="16" height="16" /><text class="leg" x="248" y="343">Weak / out of scope</text>
</svg>
