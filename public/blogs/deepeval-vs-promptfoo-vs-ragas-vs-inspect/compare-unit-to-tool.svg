<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">The unit of correctness maps to the tool</title>
  <desc id="d">Four units of correctness on the left mapped by arrows to four tools on the right. A component behaved correctly maps to DeepEval. Retrieval and grounding were good maps to Ragas. This configuration beats that one maps to Promptfoo. An agent completed a task safely in a sandbox maps to Inspect.</desc>
  <style>
    .unit   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .tool   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .colh   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .tname  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="colh" x="40" y="40">THE UNIT YOU ASSERT</text>
  <text class="colh" x="640" y="40">THE TOOL</text>

  <rect class="unit" x="40" y="60" width="420" height="56" />
  <text class="label" x="60" y="93">A component behaved correctly</text>
  <rect class="tool" x="640" y="62" width="220" height="52" />
  <text class="tname" x="660" y="93">DeepEval</text>
  <path class="arrow" d="M 464 88 L 636 88" />

  <rect class="unit" x="40" y="140" width="420" height="56" />
  <text class="label" x="60" y="173">Retrieval and grounding were good</text>
  <rect class="tool" x="640" y="142" width="220" height="52" />
  <text class="tname" x="660" y="173">Ragas</text>
  <path class="arrow" d="M 464 168 L 636 168" />

  <rect class="unit" x="40" y="220" width="420" height="56" />
  <text class="label" x="60" y="253">This configuration beats that one</text>
  <rect class="tool" x="640" y="222" width="220" height="52" />
  <text class="tname" x="660" y="253">Promptfoo</text>
  <path class="arrow" d="M 464 248 L 636 248" />

  <rect class="unit" x="40" y="300" width="420" height="56" />
  <text class="label" x="60" y="333">An agent completed a task, in a sandbox</text>
  <rect class="tool" x="640" y="302" width="220" height="52" />
  <text class="tname" x="660" y="333">Inspect</text>
  <path class="arrow" d="M 464 328 L 636 328" />
</svg>
