<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmt fmd">
  <title id="fmt">Where each prompt-injection detector leans</title>
  <desc id="fmd">A four by four matrix. Lakera Guard is a hosted API, has no weights you can hold, is self-hostable only under an enterprise arrangement, and publishes the benchmark it leads. Llama Prompt Guard 2 ships as downloadable weights under a use-restricted community licence, is fully self-hostable, and publishes a model card. Azure Prompt Shields is a hosted API bound to one cloud, has no weights, is not self-hostable, and publishes documentation rather than scores. ProtectAI DeBERTa v2 ships Apache-2.0 weights, is fully self-hostable, and publishes a model card with third-party reruns available.</desc>
  <style>
    .fm-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .fm-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .fm-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .fm-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .fm-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .fm-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .fm-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .fm-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .fm-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="fm-ttl" x="20" y="34">The four axes that survive the missing accuracy numbers</text>

  <text class="fm-col" x="275" y="76" text-anchor="middle">Deployment shape</text>
  <text class="fm-col" x="445" y="76" text-anchor="middle">Weights you hold</text>
  <text class="fm-col" x="615" y="76" text-anchor="middle">Runs in your VPC</text>
  <text class="fm-col" x="785" y="76" text-anchor="middle">Published evidence</text>

  <text class="fm-row" x="20" y="118">Lakera Guard</text>
  <rect class="fm-weak" x="195" y="92" width="160" height="40" />
  <text class="fm-cell" x="275" y="117" text-anchor="middle">Hosted API</text>
  <rect class="fm-weak" x="365" y="92" width="160" height="40" />
  <text class="fm-cell" x="445" y="117" text-anchor="middle">None</text>
  <rect class="fm-mid" x="535" y="92" width="160" height="40" />
  <text class="fm-cell" x="615" y="117" text-anchor="middle">Enterprise only</text>
  <rect class="fm-mid" x="705" y="92" width="160" height="40" />
  <text class="fm-cell" x="785" y="117" text-anchor="middle">Own benchmark</text>

  <text class="fm-row" x="20" y="178">Prompt Guard 2</text>
  <rect class="fm-strong" x="195" y="152" width="160" height="40" />
  <text class="fm-inv" x="275" y="177" text-anchor="middle">Local classifier</text>
  <rect class="fm-mid" x="365" y="152" width="160" height="40" />
  <text class="fm-cell" x="445" y="177" text-anchor="middle">Use-restricted</text>
  <rect class="fm-strong" x="535" y="152" width="160" height="40" />
  <text class="fm-inv" x="615" y="177" text-anchor="middle">Yes</text>
  <rect class="fm-weak" x="705" y="152" width="160" height="40" />
  <text class="fm-cell" x="785" y="177" text-anchor="middle">Model card</text>

  <text class="fm-row" x="20" y="238">Prompt Shields</text>
  <rect class="fm-weak" x="195" y="212" width="160" height="40" />
  <text class="fm-cell" x="275" y="237" text-anchor="middle">Hosted, one cloud</text>
  <rect class="fm-weak" x="365" y="212" width="160" height="40" />
  <text class="fm-cell" x="445" y="237" text-anchor="middle">None</text>
  <rect class="fm-weak" x="535" y="212" width="160" height="40" />
  <text class="fm-cell" x="615" y="237" text-anchor="middle">No</text>
  <rect class="fm-weak" x="705" y="212" width="160" height="40" />
  <text class="fm-cell" x="785" y="237" text-anchor="middle">Docs, no scores</text>

  <text class="fm-row" x="20" y="298">ProtectAI v2</text>
  <rect class="fm-strong" x="195" y="272" width="160" height="40" />
  <text class="fm-inv" x="275" y="297" text-anchor="middle">Local classifier</text>
  <rect class="fm-strong" x="365" y="272" width="160" height="40" />
  <text class="fm-inv" x="445" y="297" text-anchor="middle">Apache-2.0</text>
  <rect class="fm-strong" x="535" y="272" width="160" height="40" />
  <text class="fm-inv" x="615" y="297" text-anchor="middle">Yes</text>
  <rect class="fm-mid" x="705" y="272" width="160" height="40" />
  <text class="fm-cell" x="785" y="297" text-anchor="middle">Card + reruns</text>

  <rect class="fm-strong" x="20" y="344" width="18" height="14" />
  <text class="fm-leg" x="48" y="356">Yours outright</text>
  <rect class="fm-mid" x="250" y="344" width="18" height="14" />
  <text class="fm-leg" x="278" y="356">Conditional</text>
  <rect class="fm-weak" x="420" y="344" width="18" height="14" />
  <text class="fm-leg" x="448" y="356">Vendor-held</text>
</svg>
