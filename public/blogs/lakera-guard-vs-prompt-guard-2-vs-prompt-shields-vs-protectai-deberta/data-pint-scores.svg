<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="pintt pintd">
  <title id="pintt">PINT benchmark scores for four prompt-injection detectors</title>
  <desc id="pintd">A horizontal bar chart of scores on the PINT benchmark, which is maintained by Lakera. Lakera Guard is highest at about 95.2 percent, Azure Prompt Shields about 89.1 percent, Llama Prompt Guard 2 at 86 million parameters about 78.8 percent, and the original Llama Prompt Guard about 61.8 percent. A note records that the figures date to around May 2025 and that ProtectAI DeBERTa v2 appears in the same results table without a figure that could be confirmed.</desc>
  <style>
    .pt-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .pt-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .pt-num  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; }
    .pt-note { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .pt-grid { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .pt-lead { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .pt-mid  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .pt-low  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
  </style>

  <text class="pt-ttl" x="20" y="34">PINT score (%) — benchmark maintained by the top entry</text>

  <line class="pt-grid" x1="330" y1="56" x2="330" y2="316" />
  <line class="pt-grid" x1="480" y1="56" x2="480" y2="316" />
  <line class="pt-grid" x1="630" y1="56" x2="630" y2="316" />
  <line class="pt-grid" x1="780" y1="56" x2="780" y2="316" />
  <text class="pt-note" x="330" y="334" text-anchor="middle">25</text>
  <text class="pt-note" x="480" y="334" text-anchor="middle">50</text>
  <text class="pt-note" x="630" y="334" text-anchor="middle">75</text>
  <text class="pt-note" x="780" y="334" text-anchor="middle">100</text>

  <text class="pt-lab" x="20" y="86">Lakera Guard</text>
  <rect class="pt-lead" x="180" y="68" width="571" height="28" />
  <text class="pt-num" x="761" y="87" fill="var(--accent, #d4421e)">95.2</text>

  <text class="pt-lab" x="20" y="146">Azure Prompt Shields</text>
  <rect class="pt-mid" x="180" y="128" width="535" height="28" />
  <text class="pt-num" x="725" y="147" fill="var(--ink)">89.1</text>

  <text class="pt-lab" x="20" y="206">Prompt Guard 2 (86M)</text>
  <rect class="pt-mid" x="180" y="188" width="473" height="28" />
  <text class="pt-num" x="663" y="207" fill="var(--ink)">78.8</text>

  <text class="pt-lab" x="20" y="266">Prompt Guard (v1)</text>
  <rect class="pt-low" x="180" y="248" width="371" height="28" />
  <text class="pt-num" x="561" y="267" fill="var(--ink)">61.8</text>

  <text class="pt-note" x="20" y="366">Figures circa May 2025. ProtectAI DeBERTa v2 sits in the same results table; no current figure could be confirmed.</text>
</svg>
