<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="archt archd">
  <title id="archt">Two places a prompt-injection detector can sit in an agent loop</title>
  <desc id="archd">Two lanes. The upper lane is the path most detectors were built for: a user types a prompt, the detector screens it, and the model answers. The lower lane is the path an agent actually runs: the model calls a tool, the tool returns a web page, an email or a retrieved document, and that text re-enters the context as the next model input. A note records that the second lane carries most indirect injection and is screened by configuration rather than by default.</desc>
  <style>
    .ar-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ar-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ar-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ar-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .ar-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .ar-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .ar-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .ar-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arh); }
  </style>
  <defs>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ar-ttl" x="20" y="34">Lane 1 — the path the benchmarks measure</text>

  <rect class="ar-box" x="20" y="54" width="170" height="56" />
  <text class="ar-lab" x="105" y="79" text-anchor="middle">User prompt</text>
  <text class="ar-sub" x="105" y="97" text-anchor="middle">typed, one turn</text>

  <path class="ar-arr" d="M 196 82 L 276 82" />

  <rect class="ar-adj" x="282" y="54" width="170" height="56" />
  <text class="ar-lab" x="367" y="79" text-anchor="middle">Detector</text>
  <text class="ar-sub" x="367" y="97" text-anchor="middle">screens the prompt</text>

  <path class="ar-arr" d="M 458 82 L 538 82" />

  <rect class="ar-box" x="544" y="54" width="170" height="56" />
  <text class="ar-lab" x="629" y="86" text-anchor="middle">Model</text>

  <text class="ar-ttl" x="20" y="176">Lane 2 — the path an agent actually runs</text>

  <rect class="ar-box" x="20" y="196" width="170" height="56" />
  <text class="ar-lab" x="105" y="221" text-anchor="middle">Tool call</text>
  <text class="ar-sub" x="105" y="239" text-anchor="middle">fetch, search, read</text>

  <path class="ar-arr" d="M 196 224 L 276 224" />

  <rect class="ar-hero" x="282" y="196" width="170" height="56" />
  <text class="ar-inv" x="367" y="221" text-anchor="middle">Tool result</text>
  <text class="ar-inv" x="367" y="239" text-anchor="middle" opacity=".8">page, email, doc</text>

  <path class="ar-arr" d="M 458 224 L 538 224" />

  <rect class="ar-adj" x="544" y="196" width="170" height="56" />
  <text class="ar-lab" x="629" y="221" text-anchor="middle">Detector, if wired</text>
  <text class="ar-sub" x="629" y="239" text-anchor="middle">off by default</text>

  <path class="ar-arr" d="M 720 224 L 800 224" />

  <rect class="ar-box" x="806" y="196" width="74" height="56" />
  <text class="ar-lab" x="843" y="228" text-anchor="middle">Model</text>

  <path class="ar-arr" d="M 843 258 L 843 300 L 105 300 L 105 266" />
  <text class="ar-sub" x="470" y="320" text-anchor="middle">the loop: every result becomes the next input</text>

  <text class="ar-sub" x="20" y="366">Lane 2 carries most indirect injection. The published scores are all from Lane 1, on single typed prompts.</text>
</svg>
