<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Reported agent-memory benchmark scores, grouped by who reported them</title>
  <desc id="d">Horizontal bar chart of published memory benchmark results. On LongMemEval, Zep's own comparison reports Mem0 at forty-nine percent and Zep at sixty-three point eight percent, while Mem0's own later report puts Mem0 at ninety-four point four percent. A third-party roundup reports LangMem at fifty-eight point one percent on LOCOMO and Mem0 at ninety-two point five percent. The same product spans forty-five points depending on the reporter.</desc>
  <style>
    .bar-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .bar-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .bar-mute { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .grid     { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 3 4; }
    .axis     { stroke: var(--ink); stroke-width: 1.25; opacity: .5; }
    .span     { stroke: var(--accent, #d4421e); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .group    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .key      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .val      { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val-inv  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); }
    .tick     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .55; }
    .note     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="chart-title" x="30" y="32">Reported score, by who ran the harness</text>

  <line class="grid" x1="450" y1="48" x2="450" y2="300" />
  <line class="grid" x1="590" y1="48" x2="590" y2="300" />
  <line class="grid" x1="730" y1="48" x2="730" y2="300" />

  <text class="group" x="30" y="60">LONGMEMEVAL</text>

  <text class="key" x="30" y="84">Mem0 — per Zep, 2025</text>
  <rect class="bar-mute" x="310" y="66" width="275" height="28" rx="4" />
  <text class="val" x="597" y="86">49.0%</text>

  <text class="key" x="30" y="124">Zep — per Zep, 2025</text>
  <rect class="bar-adj" x="310" y="106" width="357" height="28" rx="4" />
  <text class="val" x="679" y="126">63.8%</text>

  <text class="key" x="30" y="164">Mem0 — per Mem0, 2026</text>
  <rect class="bar-hero" x="310" y="146" width="529" height="28" rx="4" />
  <text class="val-inv" x="825" y="166" text-anchor="end">94.4%</text>

  <line class="span" x1="586" y1="94" x2="586" y2="146" />
  <line class="span" x1="586" y1="146" x2="836" y2="146" />
  <text class="group" x="600" y="112">SAME PRODUCT, SAME BENCHMARK NAME: 45-POINT SPREAD</text>

  <text class="group" x="30" y="212">LOCOMO</text>

  <text class="key" x="30" y="236">LangMem — third-party roundup</text>
  <rect class="bar-mute" x="310" y="218" width="325" height="28" rx="4" />
  <text class="val" x="647" y="238">58.1%</text>

  <text class="key" x="30" y="276">Mem0 — per Mem0, 2026</text>
  <rect class="bar-hero" x="310" y="258" width="518" height="28" rx="4" />
  <text class="val-inv" x="814" y="278" text-anchor="end">92.5%</text>

  <line class="axis" x1="310" y1="304" x2="870" y2="304" />
  <text class="tick" x="310" y="322">0%</text>
  <text class="tick" x="450" y="322">25%</text>
  <text class="tick" x="590" y="322">50%</text>
  <text class="tick" x="730" y="322">75%</text>
  <text class="tick" x="870" y="322" text-anchor="end">100%</text>

  <text class="note" x="30" y="352">FIGURES AS PUBLISHED BY EACH SOURCE. A MEMORY SCORE MEASURES AN ENTIRE PIPELINE — EXTRACTION MODEL, CHUNKING, RETRIEVER BUDGET</text>
  <text class="note" x="30" y="372">NONE OF THESE BARS IS WRONG. THEY ARE ANSWERS TO DIFFERENT QUESTIONS, WHICH IS WHY THEY CANNOT BE STACKED INTO A RANKING</text>
</svg>
