<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Mem0, Zep, Letta and LangMem across five post-adoption axes</title>
  <desc id="d">Feature matrix with four rows and five columns. Mem0 has a vendor-supplied write policy, overwrite-based invalidation, scope promotion complicating deletion, portable storage and low integration cost. Zep has a pipeline write policy, strong dated invalidation, historical edges that complicate deletion, medium portability and medium integration cost. Letta puts the write policy in the agent, has weak explicit invalidation, shared blocks that complicate deletion, low portability and high integration cost. LangMem leaves the write policy to the developer, so invalidation and deletion are whatever the developer builds, with high portability and low integration cost on LangGraph.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 5; ry: 5; }
    .medium { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 5; ry: 5; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 5; ry: 5; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .colhead { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9.5px; fill: var(--ink); opacity: .75; }
    .rowhead { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell    { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--paper); }
    .key     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .note    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="chart-title" x="30" y="30">The five axes you cannot change after adoption</text>

  <text class="colhead" x="238" y="62" text-anchor="middle">WRITE POLICY</text>
  <text class="colhead" x="370" y="62" text-anchor="middle">INVALIDATION</text>
  <text class="colhead" x="502" y="62" text-anchor="middle">DELETE ONE PERSON</text>
  <text class="colhead" x="634" y="62" text-anchor="middle">PORTABILITY</text>
  <text class="colhead" x="766" y="62" text-anchor="middle">INTEGRATION COST</text>

  <text class="rowhead" x="30" y="98">Mem0</text>
  <rect class="medium" x="174" y="72" width="128" height="42" />
  <text class="cell"     x="238" y="98" text-anchor="middle">Vendor pipeline</text>
  <rect class="weak"   x="306" y="72" width="128" height="42" />
  <text class="cell"     x="370" y="98" text-anchor="middle">Overwrite</text>
  <rect class="weak"   x="438" y="72" width="128" height="42" />
  <text class="cell"     x="502" y="98" text-anchor="middle">Scope promotion</text>
  <rect class="strong" x="570" y="72" width="128" height="42" />
  <text class="cell-inv" x="634" y="98" text-anchor="middle">Your vector store</text>
  <rect class="strong" x="702" y="72" width="128" height="42" />
  <text class="cell-inv" x="766" y="98" text-anchor="middle">Lowest</text>

  <text class="rowhead" x="30" y="156">Zep</text>
  <rect class="medium" x="174" y="130" width="128" height="42" />
  <text class="cell"     x="238" y="156" text-anchor="middle">Vendor pipeline</text>
  <rect class="strong" x="306" y="130" width="128" height="42" />
  <text class="cell-inv" x="370" y="156" text-anchor="middle">Dated edges</text>
  <rect class="weak"   x="438" y="130" width="128" height="42" />
  <text class="cell"     x="502" y="156" text-anchor="middle">History is kept</text>
  <rect class="medium" x="570" y="130" width="128" height="42" />
  <text class="cell"     x="634" y="156" text-anchor="middle">Graph, vendor IDs</text>
  <rect class="medium" x="702" y="130" width="128" height="42" />
  <text class="cell"     x="766" y="156" text-anchor="middle">Medium</text>

  <text class="rowhead" x="30" y="214">Letta</text>
  <rect class="strong" x="174" y="188" width="128" height="42" />
  <text class="cell-inv" x="238" y="214" text-anchor="middle">The agent</text>
  <rect class="medium" x="306" y="188" width="128" height="42" />
  <text class="cell"     x="370" y="214" text-anchor="middle">Agent rewrites</text>
  <rect class="weak"   x="438" y="188" width="128" height="42" />
  <text class="cell"     x="502" y="214" text-anchor="middle">Shared blocks</text>
  <rect class="weak"   x="570" y="188" width="128" height="42" />
  <text class="cell"     x="634" y="214" text-anchor="middle">Runtime-bound</text>
  <rect class="weak"   x="702" y="188" width="128" height="42" />
  <text class="cell"     x="766" y="214" text-anchor="middle">Highest</text>

  <text class="rowhead" x="30" y="272">LangMem</text>
  <rect class="strong" x="174" y="246" width="128" height="42" />
  <text class="cell-inv" x="238" y="272" text-anchor="middle">You</text>
  <rect class="medium" x="306" y="246" width="128" height="42" />
  <text class="cell"     x="370" y="272" text-anchor="middle">Whatever you build</text>
  <rect class="medium" x="438" y="246" width="128" height="42" />
  <text class="cell"     x="502" y="272" text-anchor="middle">Whatever you build</text>
  <rect class="strong" x="570" y="246" width="128" height="42" />
  <text class="cell-inv" x="634" y="272" text-anchor="middle">Your store</text>
  <rect class="strong" x="702" y="246" width="128" height="42" />
  <text class="cell-inv" x="766" y="272" text-anchor="middle">Low on LangGraph</text>

  <rect class="strong" x="30" y="308" width="16" height="16" />
  <text class="key" x="54" y="321">STRONG / YOURS</text>
  <rect class="medium" x="180" y="308" width="16" height="16" />
  <text class="key" x="204" y="321">MEDIUM</text>
  <rect class="weak" x="300" y="308" width="16" height="16" />
  <text class="key" x="324" y="321">WEAK / HARD</text>

  <text class="note" x="30" y="356">"STRONG" ON WRITE POLICY MEANS THE DECISION IS YOURS OR THE AGENT'S, NOT THAT IT IS BETTER — MORE CONTROL IS ALSO MORE TO GET WRONG</text>
  <text class="note" x="30" y="376">NO ROW WINS. EACH COLUMN IS A DECISION THAT OUTLIVES THE BENCHMARK NUMBER THAT PROBABLY DROVE THE PURCHASE</text>
</svg>
