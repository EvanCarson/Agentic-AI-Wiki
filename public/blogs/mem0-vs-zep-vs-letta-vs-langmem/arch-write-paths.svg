<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Four agent-memory write paths compared</title>
  <desc id="d">Four columns, each showing how a conversation becomes stored memory. Mem0 runs an extraction pass and promotes facts up through conversation, session, user and organisation scopes. Zep resolves entities into a temporal graph where each edge carries a validity interval. Letta gives the agent tools to edit labelled memory blocks in its own context window, with a background sleep-time agent reorganising them. LangMem supplies extraction and search primitives over the LangGraph store while the developer writes the write policy.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 7; ry: 7; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 7; ry: 7; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 7; ry: 7; }
    .lane   { fill: none; stroke: var(--ink); stroke-width: 1.25; opacity: .3; rx: 10; ry: 10; }
    .name   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink); opacity: .65; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9.5px; fill: var(--ink); opacity: .7; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="adj" x="330" y="20" width="240" height="34" />
  <text class="label" x="374" y="42">Conversation turn arrives</text>
  <path class="arrow" d="M 120 58 L 120 84" />
  <path class="arrow" d="M 330 54 L 130 82" />
  <path class="arrow" d="M 400 58 L 360 82" />
  <path class="arrow" d="M 500 58 L 620 82" />
  <path class="arrow" d="M 570 54 L 800 82" />

  <rect class="lane" x="20" y="84" width="200" height="378" />
  <text class="name" x="40" y="108">Mem0</text>
  <text class="tag" x="40" y="126">PIPELINE DECIDES</text>
  <rect class="box" x="40" y="140" width="160" height="34" />
  <text class="label" x="56" y="161">Extraction pass</text>
  <path class="arrow" d="M 120 176 L 120 196" />
  <rect class="box" x="40" y="198" width="160" height="30" />
  <text class="label" x="56" y="218">scope: conversation</text>
  <path class="arrow" d="M 120 230 L 120 246" />
  <rect class="box" x="40" y="248" width="160" height="30" />
  <text class="label" x="56" y="268">scope: session</text>
  <path class="arrow" d="M 120 280 L 120 296" />
  <rect class="adj" x="40" y="298" width="160" height="30" />
  <text class="label" x="56" y="318">scope: user</text>
  <path class="arrow" d="M 120 330 L 120 346" />
  <rect class="hero" x="40" y="348" width="160" height="30" />
  <text class="label-inv" x="56" y="368">scope: organisation</text>
  <text class="sub" x="40" y="404">Promotion is the mechanism:</text>
  <text class="sub" x="40" y="420">a fact confirmed across</text>
  <text class="sub" x="40" y="436">sessions outranks one seen</text>
  <text class="sub" x="40" y="452">once.</text>

  <rect class="lane" x="234" y="84" width="200" height="378" />
  <text class="name" x="254" y="108">Zep</text>
  <text class="tag" x="254" y="126">PIPELINE DECIDES</text>
  <rect class="box" x="254" y="140" width="160" height="34" />
  <text class="label" x="270" y="161">Entity resolution</text>
  <path class="arrow" d="M 334 176 L 334 196" />
  <rect class="hero" x="254" y="198" width="70" height="30" />
  <text class="label-inv" x="270" y="218">node</text>
  <rect class="hero" x="344" y="198" width="70" height="30" />
  <text class="label-inv" x="360" y="218">node</text>
  <path class="arrow" d="M 326 213 L 340 213" />
  <rect class="adj" x="254" y="248" width="160" height="46" />
  <text class="label" x="270" y="268">edge: fact</text>
  <text class="sub" x="270" y="285">valid 12 Mar → now</text>
  <path class="arrow" d="M 334 296 L 334 316" />
  <rect class="box" x="254" y="318" width="160" height="46" />
  <text class="label" x="270" y="338">edge: superseded</text>
  <text class="sub" x="270" y="355">valid 4 Jan → 12 Mar</text>
  <text class="sub" x="254" y="404">A changed fact becomes</text>
  <text class="sub" x="254" y="420">history rather than a</text>
  <text class="sub" x="254" y="436">contradiction — and history</text>
  <text class="sub" x="254" y="452">is what erasure must remove.</text>

  <rect class="lane" x="448" y="84" width="200" height="378" />
  <text class="name" x="468" y="108">Letta</text>
  <text class="tag" x="468" y="126">THE AGENT DECIDES</text>
  <rect class="hero" x="468" y="140" width="160" height="34" />
  <text class="label-inv" x="484" y="161">Agent + memory tools</text>
  <path class="arrow" d="M 548 176 L 548 196" />
  <rect class="adj" x="468" y="198" width="160" height="30" />
  <text class="label" x="484" y="218">block: persona</text>
  <rect class="adj" x="468" y="238" width="160" height="30" />
  <text class="label" x="484" y="258">block: human</text>
  <rect class="adj" x="468" y="278" width="160" height="30" />
  <text class="label" x="484" y="298">block: shared</text>
  <path class="arrow" d="M 548 310 L 548 330" />
  <rect class="box" x="468" y="332" width="160" height="46" />
  <text class="label" x="484" y="352">Sleep-time agent</text>
  <text class="sub" x="484" y="369">reorganises off-path</text>
  <text class="sub" x="468" y="404">Blocks are labelled, size-</text>
  <text class="sub" x="468" y="420">capped regions of the context</text>
  <text class="sub" x="468" y="436">window, shareable between</text>
  <text class="sub" x="468" y="452">agents.</text>

  <rect class="lane" x="662" y="84" width="218" height="378" />
  <text class="name" x="682" y="108">LangMem</text>
  <text class="tag" x="682" y="126">YOU DECIDE</text>
  <rect class="box" x="682" y="140" width="178" height="34" />
  <text class="label" x="698" y="161">Extraction primitive</text>
  <rect class="box" x="682" y="184" width="178" height="34" />
  <text class="label" x="698" y="205">Search primitive</text>
  <path class="arrow" d="M 771 220 L 771 240" />
  <rect class="hero" x="682" y="242" width="178" height="46" />
  <text class="label-inv" x="698" y="262">Your write policy</text>
  <text class="label-inv" x="698" y="279">— supplied by you</text>
  <path class="arrow" d="M 771 290 L 771 310" />
  <rect class="adj" x="682" y="312" width="178" height="34" />
  <text class="label" x="698" y="333">LangGraph store</text>
  <text class="sub" x="682" y="404">Semantic, episodic and</text>
  <text class="sub" x="682" y="420">procedural extraction, but no</text>
  <text class="sub" x="682" y="436">opinion about when to write</text>
  <text class="sub" x="682" y="452">or what to expire.</text>
</svg>
