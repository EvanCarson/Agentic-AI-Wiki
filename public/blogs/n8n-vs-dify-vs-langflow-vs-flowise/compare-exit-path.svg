<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="epT epD">
  <title id="epT">What you carry out when you leave</title>
  <desc id="epD">Four columns showing the exit path from each tool. Leaving n8n means re-implementing connectors against a workflow JSON that only n8n executes. Leaving Dify means keeping your API contract and knowledge base but rebuilding the workspace and app layer. Leaving Langflow means exporting the flow as Python and running it as an ordinary service. Leaving Flowise means forking an archived Apache-2.0 repository and maintaining it yourself.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: none; }
    .name  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .62; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#epArr); }
  </style>
  <defs>
    <marker id="epArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="name" x="0" y="18">Exit cost, highest to lowest</text>

  <text class="name" x="115" y="52" text-anchor="middle">n8n</text>
  <text class="name" x="345" y="52" text-anchor="middle">Dify</text>
  <text class="name" x="575" y="52" text-anchor="middle">Flowise</text>
  <text class="name" x="805" y="52" text-anchor="middle">Langflow</text>

  <rect class="box" x="20" y="68" width="190" height="72" rx="8" />
  <text class="label" x="115" y="96" text-anchor="middle">Workflow JSON</text>
  <text class="sub" x="115" y="116" text-anchor="middle">only n8n executes it;</text>
  <text class="sub" x="115" y="132" text-anchor="middle">connectors go with it</text>

  <rect class="adj" x="250" y="68" width="190" height="72" rx="8" />
  <text class="label" x="345" y="96" text-anchor="middle">App + knowledge base</text>
  <text class="sub" x="345" y="116" text-anchor="middle">API contract survives;</text>
  <text class="sub" x="345" y="132" text-anchor="middle">tenancy layer does not</text>

  <rect class="adj" x="480" y="68" width="190" height="72" rx="8" />
  <text class="label" x="575" y="96" text-anchor="middle">An archived repo</text>
  <text class="sub" x="575" y="116" text-anchor="middle">Apache 2.0, forkable,</text>
  <text class="sub" x="575" y="132" text-anchor="middle">yours to maintain</text>

  <rect class="hero" x="710" y="68" width="190" height="72" rx="8" />
  <text class="inv" x="805" y="96" text-anchor="middle">Python you can run</text>
  <text class="inv" x="805" y="116" text-anchor="middle">export the flow,</text>
  <text class="inv" x="805" y="132" text-anchor="middle">delete the canvas</text>

  <path class="arrow" d="M 115 148 L 115 186" />
  <path class="arrow" d="M 345 148 L 345 186" />
  <path class="arrow" d="M 575 148 L 575 186" />
  <path class="arrow" d="M 805 148 L 805 186" />

  <text class="label" x="115" y="208" text-anchor="middle">Rebuild the integrations</text>
  <text class="label" x="345" y="208" text-anchor="middle">Rebuild the app layer</text>
  <text class="label" x="575" y="208" text-anchor="middle">Become the maintainer</text>
  <text class="label" x="805" y="208" text-anchor="middle">Keep going, no rebuild</text>

  <text class="sub" x="0" y="256">The licence sets what you may do with the code. This sets what the code is worth to you the day you stop using the product.</text>
  <text class="sub" x="0" y="278">Neither question appears on a feature comparison, and together they decide more than every feature on one.</text>
</svg>
