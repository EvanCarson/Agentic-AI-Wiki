<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="lmT lmD">
  <title id="lmT">What each licence lets you do</title>
  <desc id="lmD">A four-by-four matrix. Rows are n8n, Dify, Langflow and Flowise; columns are self-hosting for your own business, building a product for customers, running it multi-tenant, and shipping it without the vendor's brand. All four allow self-hosting. n8n's Sustainable Use License blocks the other three. Dify allows building a product but blocks multi-tenant operation and removal of frontend branding. Langflow, under MIT, allows all four. Flowise allows all four for its Apache-2.0 core, but its enterprise identity directory is under a separate commercial licence.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .row   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .cell  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cellv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .yes   { fill: var(--accent, #d4421e); stroke: none; }
    .part  { fill: var(--accent-soft); stroke: var(--border-soft); stroke-width: 1; }
    .no    { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; }
  </style>

  <text class="ttl" x="0" y="18">What each licence lets you do</text>

  <text class="hd" x="290" y="52" text-anchor="middle">Self-host for</text>
  <text class="hd" x="290" y="66" text-anchor="middle">your own business</text>
  <text class="hd" x="450" y="52" text-anchor="middle">Build a product</text>
  <text class="hd" x="450" y="66" text-anchor="middle">for customers</text>
  <text class="hd" x="610" y="52" text-anchor="middle">Run it</text>
  <text class="hd" x="610" y="66" text-anchor="middle">multi-tenant</text>
  <text class="hd" x="770" y="52" text-anchor="middle">Ship it without</text>
  <text class="hd" x="770" y="66" text-anchor="middle">the vendor's brand</text>

  <text class="row" x="0" y="106">n8n</text>
  <text class="sub" x="0" y="122">Sustainable Use License</text>
  <rect class="yes"  x="212" y="82" width="156" height="48" rx="6" />
  <text class="cellv" x="290" y="111" text-anchor="middle">Yes</text>
  <rect class="no"   x="372" y="82" width="156" height="48" rx="6" />
  <text class="cell" x="450" y="111" text-anchor="middle">Internal use only</text>
  <rect class="no"   x="532" y="82" width="156" height="48" rx="6" />
  <text class="cell" x="610" y="111" text-anchor="middle">No</text>
  <rect class="no"   x="692" y="82" width="156" height="48" rx="6" />
  <text class="cell" x="770" y="111" text-anchor="middle">Notices must stay</text>

  <text class="row" x="0" y="176">Dify</text>
  <text class="sub" x="0" y="192">Apache 2.0, modified</text>
  <rect class="yes"  x="212" y="152" width="156" height="48" rx="6" />
  <text class="cellv" x="290" y="181" text-anchor="middle">Yes</text>
  <rect class="yes"  x="372" y="152" width="156" height="48" rx="6" />
  <text class="cellv" x="450" y="181" text-anchor="middle">Yes</text>
  <rect class="no"   x="532" y="152" width="156" height="48" rx="6" />
  <text class="cell" x="610" y="181" text-anchor="middle">Needs a licence</text>
  <rect class="no"   x="692" y="152" width="156" height="48" rx="6" />
  <text class="cell" x="770" y="181" text-anchor="middle">Frontend locked</text>

  <text class="row" x="0" y="246">Langflow</text>
  <text class="sub" x="0" y="262">MIT</text>
  <rect class="yes"  x="212" y="222" width="156" height="48" rx="6" />
  <text class="cellv" x="290" y="251" text-anchor="middle">Yes</text>
  <rect class="yes"  x="372" y="222" width="156" height="48" rx="6" />
  <text class="cellv" x="450" y="251" text-anchor="middle">Yes</text>
  <rect class="yes"  x="532" y="222" width="156" height="48" rx="6" />
  <text class="cellv" x="610" y="251" text-anchor="middle">Yes</text>
  <rect class="yes"  x="692" y="222" width="156" height="48" rx="6" />
  <text class="cellv" x="770" y="251" text-anchor="middle">Yes</text>

  <text class="row" x="0" y="316">Flowise</text>
  <text class="sub" x="0" y="332">Apache 2.0 core, archived</text>
  <rect class="yes"  x="212" y="292" width="156" height="48" rx="6" />
  <text class="cellv" x="290" y="321" text-anchor="middle">Yes</text>
  <rect class="part" x="372" y="292" width="156" height="48" rx="6" />
  <text class="cell" x="450" y="321" text-anchor="middle">Core only</text>
  <rect class="part" x="532" y="292" width="156" height="48" rx="6" />
  <text class="cell" x="610" y="321" text-anchor="middle">Core only</text>
  <rect class="yes"  x="692" y="292" width="156" height="48" rx="6" />
  <text class="cellv" x="770" y="321" text-anchor="middle">Yes</text>

  <rect class="yes"  x="0" y="368" width="16" height="16" rx="4" />
  <text class="sub" x="24" y="381">Allowed outright</text>
  <rect class="part" x="150" y="368" width="16" height="16" rx="4" />
  <text class="sub" x="174" y="381">Allowed with a carve-out</text>
  <rect class="no"   x="360" y="368" width="16" height="16" rx="4" />
  <text class="sub" x="384" y="381">Blocked, or needs a commercial licence</text>
</svg>
