<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="wcT wcD">
  <title id="wcT">What sits underneath each canvas</title>
  <desc id="wcD">Four vertical stacks. In each, the visual canvas is the top layer. Under n8n's canvas is a durable workflow engine with queues, retries and schedules, and beneath that roughly 1,500 integrations. Under Dify's canvas is an application platform with workspaces, a retrieval pipeline and model management, and beneath that a published app and API. Under Langflow's canvas are Python components built on LangChain and LangGraph, and beneath that your own Python service. Under Flowise's canvas were LangChain.js chains and nothing further, which is why archiving the canvas ended the project.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .ghost  { fill: none; stroke: var(--border-soft); stroke-width: 1.25; stroke-dasharray: 5 4; }
    .name   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .62; }
    .verd   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="name" x="115" y="24" text-anchor="middle">n8n</text>
  <text class="name" x="345" y="24" text-anchor="middle">Dify</text>
  <text class="name" x="575" y="24" text-anchor="middle">Langflow</text>
  <text class="name" x="805" y="24" text-anchor="middle">Flowise</text>

  <rect class="hero" x="20" y="42" width="190" height="46" rx="8" />
  <text class="inv" x="115" y="70" text-anchor="middle">Visual canvas</text>
  <rect class="hero" x="250" y="42" width="190" height="46" rx="8" />
  <text class="inv" x="345" y="70" text-anchor="middle">Visual canvas</text>
  <rect class="hero" x="480" y="42" width="190" height="46" rx="8" />
  <text class="inv" x="575" y="70" text-anchor="middle">Visual canvas</text>
  <rect class="hero" x="710" y="42" width="190" height="46" rx="8" />
  <text class="inv" x="805" y="70" text-anchor="middle">Visual canvas</text>

  <rect class="adj" x="20" y="112" width="190" height="86" rx="8" />
  <text class="label" x="115" y="140" text-anchor="middle">Workflow engine</text>
  <text class="sub" x="115" y="160" text-anchor="middle">queues, retries,</text>
  <text class="sub" x="115" y="176" text-anchor="middle">schedules, webhooks</text>

  <rect class="adj" x="250" y="112" width="190" height="86" rx="8" />
  <text class="label" x="345" y="140" text-anchor="middle">App platform</text>
  <text class="sub" x="345" y="160" text-anchor="middle">workspaces, retrieval</text>
  <text class="sub" x="345" y="176" text-anchor="middle">pipeline, model mgmt</text>

  <rect class="adj" x="480" y="112" width="190" height="86" rx="8" />
  <text class="label" x="575" y="140" text-anchor="middle">Python components</text>
  <text class="sub" x="575" y="160" text-anchor="middle">LangChain / LangGraph</text>
  <text class="sub" x="575" y="176" text-anchor="middle">exportable as code</text>

  <rect class="adj" x="710" y="112" width="190" height="86" rx="8" />
  <text class="label" x="805" y="140" text-anchor="middle">LangChain.js chains</text>
  <text class="sub" x="805" y="160" text-anchor="middle">wired by the canvas,</text>
  <text class="sub" x="805" y="176" text-anchor="middle">not by your code</text>

  <rect class="box" x="20" y="222" width="190" height="76" rx="8" />
  <text class="label" x="115" y="252" text-anchor="middle">~1,500 integrations</text>
  <text class="sub" x="115" y="272" text-anchor="middle">the asset an agent</text>
  <text class="sub" x="115" y="288" text-anchor="middle">cannot rewrite in a day</text>

  <rect class="box" x="250" y="222" width="190" height="76" rx="8" />
  <text class="label" x="345" y="252" text-anchor="middle">Published app + API</text>
  <text class="sub" x="345" y="272" text-anchor="middle">governed surface for</text>
  <text class="sub" x="345" y="288" text-anchor="middle">non-engineers</text>

  <rect class="box" x="480" y="222" width="190" height="76" rx="8" />
  <text class="label" x="575" y="252" text-anchor="middle">Your Python service</text>
  <text class="sub" x="575" y="272" text-anchor="middle">the canvas is a front</text>
  <text class="sub" x="575" y="288" text-anchor="middle">end you can drop</text>

  <rect class="ghost" x="710" y="222" width="190" height="76" rx="8" />
  <text class="sub" x="805" y="258" text-anchor="middle">nothing underneath</text>
  <text class="sub" x="805" y="276" text-anchor="middle">the canvas</text>

  <line x1="20" y1="330" x2="900" y2="330" stroke="var(--border-soft)" stroke-width="1" />

  <text class="verd" x="115" y="360" text-anchor="middle">Remove the canvas:</text>
  <text class="label" x="115" y="382" text-anchor="middle">an integration library</text>
  <text class="label" x="115" y="400" text-anchor="middle">and a durable runner</text>

  <text class="verd" x="345" y="360" text-anchor="middle">Remove the canvas:</text>
  <text class="label" x="345" y="382" text-anchor="middle">a RAG stack with</text>
  <text class="label" x="345" y="400" text-anchor="middle">tenancy and roles</text>

  <text class="verd" x="575" y="360" text-anchor="middle">Remove the canvas:</text>
  <text class="label" x="575" y="382" text-anchor="middle">the Python you were</text>
  <text class="label" x="575" y="400" text-anchor="middle">going to write anyway</text>

  <text class="verd" x="805" y="360" text-anchor="middle">Remove the canvas:</text>
  <text class="label" x="805" y="382" text-anchor="middle">archived, 13 Aug 2026</text>
  <text class="label" x="805" y="400" text-anchor="middle">read-only, forks invited</text>

  <text class="sub" x="20" y="450">The canvas is the same product in all four. What differs is whether anything is load-bearing beneath it.</text>
</svg>
