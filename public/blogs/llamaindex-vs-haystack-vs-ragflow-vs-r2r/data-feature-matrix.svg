<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmT fmD">
  <title id="fmT">Feature matrix: process shape, open parsing, non-developer surface and exit cost</title>
  <desc id="fmD">A four-by-four matrix. Rows are LlamaIndex, Haystack, RAGFlow and R2R. Columns are whether retrieval runs inside your own process, whether high-quality document understanding is in the open artefact, whether a non-developer surface ships with it, and how much it costs to leave. LlamaIndex runs in-process, keeps its best parser behind a paid service, ships no end-user interface, and has a medium exit cost because workflow code is yours. Haystack runs in-process, treats parsing as a swappable component, ships no interface in the open project, and has the lowest exit cost because pipelines are serialisable components. RAGFlow runs as a separate stack, ships DeepDoc in the Apache-2.0 artefact, ships a full web interface, and has a high exit cost because knowledge bases live in its own database. R2R runs as a separate REST service, bundles a workable ingestion pipeline, ships a separate application, and has a medium exit cost because the surface is an API.</desc>
  <style>
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hdr    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .weak   { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; rx: 6; ry: 6; }
    .med    { fill: var(--accent-soft); stroke: var(--border-soft); stroke-width: 1; rx: 6; ry: 6; }
    .strong { fill: var(--accent, #d4421e); stroke: none; rx: 6; ry: 6; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Where each project leans hardest</text>

  <text class="hdr" x="292" y="52" text-anchor="middle">Runs inside</text>
  <text class="hdr" x="292" y="68" text-anchor="middle">your process</text>
  <text class="hdr" x="457" y="52" text-anchor="middle">Parsing in the</text>
  <text class="hdr" x="457" y="68" text-anchor="middle">open artefact</text>
  <text class="hdr" x="622" y="52" text-anchor="middle">Surface for</text>
  <text class="hdr" x="622" y="68" text-anchor="middle">non-developers</text>
  <text class="hdr" x="787" y="52" text-anchor="middle">Cost of</text>
  <text class="hdr" x="787" y="68" text-anchor="middle">leaving</text>

  <text class="lbl" x="0" y="114">LlamaIndex</text>
  <rect class="strong" x="215" y="88" width="155" height="42" />
  <text class="cell-inv" x="292" y="114" text-anchor="middle">In-process</text>
  <rect class="weak" x="380" y="88" width="155" height="42" />
  <text class="cell" x="457" y="114" text-anchor="middle">LlamaParse is paid</text>
  <rect class="weak" x="545" y="88" width="155" height="42" />
  <text class="cell" x="622" y="114" text-anchor="middle">None</text>
  <rect class="med" x="710" y="88" width="155" height="42" />
  <text class="cell" x="787" y="114" text-anchor="middle">Medium</text>

  <text class="lbl" x="0" y="184">Haystack</text>
  <rect class="strong" x="215" y="158" width="155" height="42" />
  <text class="cell-inv" x="292" y="184" text-anchor="middle">In-process</text>
  <rect class="med" x="380" y="158" width="155" height="42" />
  <text class="cell" x="457" y="184" text-anchor="middle">Swappable slot</text>
  <rect class="weak" x="545" y="158" width="155" height="42" />
  <text class="cell" x="622" y="184" text-anchor="middle">None in the OSS</text>
  <rect class="strong" x="710" y="158" width="155" height="42" />
  <text class="cell-inv" x="787" y="184" text-anchor="middle">Low: components</text>

  <text class="lbl" x="0" y="254">RAGFlow</text>
  <rect class="weak" x="215" y="228" width="155" height="42" />
  <text class="cell" x="292" y="254" text-anchor="middle">Separate stack</text>
  <rect class="strong" x="380" y="228" width="155" height="42" />
  <text class="cell-inv" x="457" y="254" text-anchor="middle">DeepDoc, Apache-2.0</text>
  <rect class="strong" x="545" y="228" width="155" height="42" />
  <text class="cell-inv" x="622" y="254" text-anchor="middle">Full web UI</text>
  <rect class="weak" x="710" y="228" width="155" height="42" />
  <text class="cell" x="787" y="254" text-anchor="middle">High: KBs stay put</text>

  <text class="lbl" x="0" y="324">R2R</text>
  <rect class="weak" x="215" y="298" width="155" height="42" />
  <text class="cell" x="292" y="324" text-anchor="middle">REST service</text>
  <rect class="med" x="380" y="298" width="155" height="42" />
  <text class="cell" x="457" y="324" text-anchor="middle">Bundled pipeline</text>
  <rect class="med" x="545" y="298" width="155" height="42" />
  <text class="cell" x="622" y="324" text-anchor="middle">Separate app</text>
  <rect class="med" x="710" y="298" width="155" height="42" />
  <text class="cell" x="787" y="324" text-anchor="middle">Medium: API-shaped</text>

  <rect class="strong" x="0" y="366" width="14" height="14" />
  <text class="sub" x="22" y="378">Leans hardest here</text>
  <rect class="med" x="140" y="366" width="14" height="14" />
  <text class="sub" x="162" y="378">Partial</text>
  <rect class="weak" x="220" y="366" width="14" height="14" />
  <text class="sub" x="242" y="378">Not where it competes</text>
</svg>
