<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="loT loD">
  <title id="loT">A RAG library inside your process versus a RAG server beside it</title>
  <desc id="loD">Two lanes. In the upper lane the framework is a library: your service calls it in-process, so ingestion, retrieval and generation happen inside your own deployment, your own traces and your own release cycle, with only the vector store and model provider outside. In the lower lane the framework is a server: your service calls it over HTTP, and behind that boundary sit the server's own ingestion pipeline, its own database, its own user and collection model and its own web interface, each with a release cycle you do not control.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hold   { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 6 4; opacity: .55; rx: 10; ry: 10; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .7; }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .8; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .9; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#loArr); }
  </style>
  <defs>
    <marker id="loArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="20">Where the retrieval failure shows up at 2am</text>

  <text class="lane" x="0" y="52">A library — LlamaIndex, Haystack</text>
  <rect class="hold" x="0" y="62" width="600" height="130" />
  <text class="cell" x="14" y="82">Your deployment, your traces, your release</text>

  <rect class="hero" x="20" y="96" width="165" height="76" />
  <text class="hd-inv" x="102" y="126" text-anchor="middle">Your service</text>
  <text class="cell-inv" x="102" y="148" text-anchor="middle">Calls the framework</text>
  <text class="cell-inv" x="102" y="163" text-anchor="middle">in-process.</text>

  <path class="arrow" d="M 190 134 L 212 134" />
  <rect class="adj" x="217" y="96" width="165" height="76" />
  <text class="hd" x="299" y="126" text-anchor="middle">Ingest + retrieve</text>
  <text class="cell" x="299" y="148" text-anchor="middle">Components you</text>
  <text class="cell" x="299" y="163" text-anchor="middle">chose and wired.</text>

  <path class="arrow" d="M 387 134 L 409 134" />
  <rect class="adj" x="414" y="96" width="165" height="76" />
  <text class="hd" x="496" y="126" text-anchor="middle">Generate</text>
  <text class="cell" x="496" y="148" text-anchor="middle">Your prompts, your</text>
  <text class="cell" x="496" y="163" text-anchor="middle">model choice.</text>

  <path class="arrow" d="M 605 134 L 640 134" />
  <rect class="box" x="645" y="96" width="253" height="76" />
  <text class="hd" x="771" y="126" text-anchor="middle">Vector store + model API</text>
  <text class="cell" x="771" y="150" text-anchor="middle">The only things outside your process.</text>

  <text class="lane" x="0" y="242">A server — RAGFlow, R2R</text>

  <rect class="hero" x="20" y="262" width="165" height="76" />
  <text class="hd-inv" x="102" y="292" text-anchor="middle">Your service</text>
  <text class="cell-inv" x="102" y="314" text-anchor="middle">Calls an HTTP API</text>
  <text class="cell-inv" x="102" y="329" text-anchor="middle">and waits.</text>

  <path class="arrow" d="M 190 300 L 232 300" />
  <text class="cell" x="211" y="290" text-anchor="middle">HTTP</text>

  <rect class="hold" x="237" y="228" width="661" height="200" />
  <text class="cell" x="251" y="248">A second production system: its own deploy, upgrade cadence and on-call</text>

  <rect class="adj" x="257" y="262" width="150" height="76" />
  <text class="hd" x="332" y="292" text-anchor="middle">Ingestion</text>
  <text class="cell" x="332" y="314" text-anchor="middle">Parsers bundled</text>
  <text class="cell" x="332" y="329" text-anchor="middle">with the server.</text>

  <rect class="adj" x="422" y="262" width="150" height="76" />
  <text class="hd" x="497" y="292" text-anchor="middle">Its own database</text>
  <text class="cell" x="497" y="314" text-anchor="middle">Documents, chunks,</text>
  <text class="cell" x="497" y="329" text-anchor="middle">graphs, history.</text>

  <rect class="adj" x="587" y="262" width="150" height="76" />
  <text class="hd" x="662" y="292" text-anchor="middle">Users + collections</text>
  <text class="cell" x="662" y="314" text-anchor="middle">A second identity</text>
  <text class="cell" x="662" y="329" text-anchor="middle">model to reconcile.</text>

  <rect class="adj" x="752" y="262" width="130" height="76" />
  <text class="hd" x="817" y="292" text-anchor="middle">Its own UI</text>
  <text class="cell" x="817" y="314" text-anchor="middle">Where non-devs</text>
  <text class="cell" x="817" y="329" text-anchor="middle">do the work.</text>

  <rect class="box" x="257" y="352" width="625" height="60" />
  <text class="hd" x="569" y="378" text-anchor="middle">Vector store + model API</text>
  <text class="cell" x="569" y="398" text-anchor="middle">Configured inside the server, not in your code.</text>

  <text class="sub" x="0" y="462">The feature lists converge. This picture does not, and it is the part you cannot change later without a migration.</text>
</svg>
