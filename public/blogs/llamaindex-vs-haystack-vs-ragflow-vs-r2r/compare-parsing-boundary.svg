<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="pbT pbD">
  <title id="pbT">Three places the document-understanding boundary can sit</title>
  <desc id="pbD">Three columns describing where high-quality document parsing lives. In the open artefact: RAGFlow ships DeepDoc, its own layout, table-structure and OCR models, inside the Apache-2.0 distribution, so the best path is self-hosted. As a component you choose: Haystack and R2R treat converters as swappable, shipping a workable default and leaving the quality decision and its bill to you. As a paid service: LlamaIndex keeps the open library for orchestration and sells LlamaParse for parsing, so the highest-quality path leaves your network and is priced per page.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .92; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Who owns the parser</text>

  <rect class="hero" x="35" y="48" width="250" height="86" />
  <text class="hd-inv" x="160" y="76" text-anchor="middle">In the open artefact</text>
  <text class="cell-inv" x="160" y="100" text-anchor="middle">RAGFlow ships DeepDoc:</text>
  <text class="cell-inv" x="160" y="116" text-anchor="middle">layout, tables and OCR</text>
  <text class="cell-inv" x="160" y="132" text-anchor="middle">inside Apache-2.0.</text>

  <rect class="adj" x="325" y="48" width="250" height="86" />
  <text class="hd" x="450" y="76" text-anchor="middle">A component you pick</text>
  <text class="cell" x="450" y="100" text-anchor="middle">Haystack and R2R ship a</text>
  <text class="cell" x="450" y="116" text-anchor="middle">workable default and keep</text>
  <text class="cell" x="450" y="132" text-anchor="middle">the slot swappable.</text>

  <rect class="box" x="625" y="48" width="250" height="86" />
  <text class="hd" x="750" y="76" text-anchor="middle">A paid service</text>
  <text class="cell" x="750" y="100" text-anchor="middle">LlamaIndex keeps the</text>
  <text class="cell" x="750" y="116" text-anchor="middle">library open and sells</text>
  <text class="cell" x="750" y="132" text-anchor="middle">LlamaParse separately.</text>

  <text class="lane" x="160" y="168" text-anchor="middle">What it costs you</text>
  <text class="lane" x="450" y="168" text-anchor="middle">What it costs you</text>
  <text class="lane" x="750" y="168" text-anchor="middle">What it costs you</text>

  <rect class="box" x="35" y="178" width="250" height="86" />
  <text class="cell" x="160" y="204" text-anchor="middle">GPU-shaped infrastructure</text>
  <text class="cell" x="160" y="224" text-anchor="middle">and a heavier deployment,</text>
  <text class="cell" x="160" y="244" text-anchor="middle">but nothing leaves.</text>

  <rect class="box" x="325" y="178" width="250" height="86" />
  <text class="cell" x="450" y="204" text-anchor="middle">The quality decision, and</text>
  <text class="cell" x="450" y="224" text-anchor="middle">the integration work, are</text>
  <text class="cell" x="450" y="244" text-anchor="middle">both yours to make.</text>

  <rect class="box" x="625" y="178" width="250" height="86" />
  <text class="cell" x="750" y="204" text-anchor="middle">A per-page bill and an</text>
  <text class="cell" x="750" y="224" text-anchor="middle">egress path for every</text>
  <text class="cell" x="750" y="244" text-anchor="middle">document you index.</text>
</svg>
