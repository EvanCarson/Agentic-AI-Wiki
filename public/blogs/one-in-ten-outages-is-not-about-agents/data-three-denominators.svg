<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="tdT tdD">
  <title id="tdT">Three percentages quoted together, computed over three different populations</title>
  <desc id="tdD">A horizontal bar chart on a zero to one hundred per cent scale. Ten point seven per cent of all disclosed outages industry-wide in 2026 to date came from AI model and AI application companies, up from one point seven per cent in 2023. Four point seven per cent of publicly reported AI incidents from September 2023 to May 2026 were verified as enterprise-relevant, being 344 of 7,246. Fifty-four point seven per cent of those 344 verified enterprise incidents had no attacker in the chain, being 188 of 344, drawn in the accent colour as the only bar of the three whose denominator is agents. The chart shows that the three widely quoted figures answer three different questions.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .row   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .rows  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .axis  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .55; }
    .val   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .valA  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--accent, #d4421e); }
    .note  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .lead  { fill: var(--accent, #d4421e); }
    .mid   { fill: var(--accent-soft); stroke: var(--border-soft); stroke-width: 1; }
    .trail { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; }
    .grid  { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>

  <text class="ttl" x="0" y="22">Share of what? Three quoted figures, three populations</text>

  <line class="grid" x1="440" y1="52" x2="440" y2="300" />
  <line class="grid" x1="580" y1="52" x2="580" y2="300" />
  <line class="grid" x1="720" y1="52" x2="720" y2="300" />
  <line class="grid" x1="860" y1="52" x2="860" y2="300" />

  <text class="row"  x="285" y="88"  text-anchor="end">AI companies' share of all outages</text>
  <text class="rows" x="285" y="106" text-anchor="end">of all disclosed incidents, 2026 YTD</text>
  <rect class="trail" x="300" y="70" width="60" height="44" rx="4" />
  <text class="val"  x="372" y="98">10.7%</text>

  <text class="row"  x="285" y="168" text-anchor="end">AI incidents that were enterprise-relevant</text>
  <text class="rows" x="285" y="186" text-anchor="end">344 verified of 7,246 publicly reported</text>
  <rect class="mid" x="300" y="150" width="26" height="44" rx="4" />
  <text class="val"  x="338" y="178">4.7%</text>

  <text class="row"  x="285" y="248" text-anchor="end">Verified incidents with no attacker</text>
  <text class="rows" x="285" y="266" text-anchor="end">188 of those 344 — the agent did it unaided</text>
  <rect class="lead" x="300" y="230" width="306" height="44" rx="4" />
  <text class="valA" x="618" y="258">54.7%</text>

  <line class="grid" x1="300" y1="300" x2="860" y2="300" />
  <text class="axis" x="300" y="320" text-anchor="middle">0</text>
  <text class="axis" x="440" y="320" text-anchor="middle">25</text>
  <text class="axis" x="580" y="320" text-anchor="middle">50</text>
  <text class="axis" x="720" y="320" text-anchor="middle">75</text>
  <text class="axis" x="860" y="320" text-anchor="middle">100%</text>

  <text class="note" x="0" y="358">The top bar is a share of the whole outage population and grows as AI firms become a larger share of the companies publishing</text>
  <text class="note" x="0" y="376">status pages. Only the bottom bar has agents in its denominator, and it is the one that is rarely quoted.</text>
</svg>
