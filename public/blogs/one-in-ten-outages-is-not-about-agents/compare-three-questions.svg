<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="cqT cqD">
  <title id="cqT">What each dataset can and cannot answer</title>
  <desc id="cqD">Three columns. Status-page records measure how much of the monitored internet is now run by AI companies, and cannot separate an agent's action from a bad deploy. Verified incident sets measure whether an adversary was present, and cannot measure a rate because the reporting population is unknown. Your own audit logs measure which credentials your agents still hold, and are the only one of the three whose denominator is your own systems.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .hd    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hdi   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .lbl   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .lbli  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .cap   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <rect class="box" x="20" y="30" width="270" height="196" rx="8" />
  <text class="hd"  x="40" y="60">Public status pages</text>
  <text class="sub" x="40" y="80">≈178,000 records, 390+ companies</text>
  <text class="lbl" x="40" y="112">Answers:</text>
  <text class="sub" x="40" y="132">how much of the monitored</text>
  <text class="sub" x="40" y="150">internet is AI infrastructure</text>
  <text class="lbl" x="40" y="180">Cannot answer:</text>
  <text class="sub" x="40" y="200">agent action vs. bad deploy —</text>
  <text class="sub" x="40" y="218">the field does not exist</text>

  <rect class="adj" x="315" y="30" width="270" height="196" rx="8" />
  <text class="hd"  x="335" y="60">Verified incident sets</text>
  <text class="sub" x="335" y="80">344 of 7,246 reports, hand-checked</text>
  <text class="lbl" x="335" y="112">Answers:</text>
  <text class="sub" x="335" y="132">whether an adversary was</text>
  <text class="sub" x="335" y="150">present at all</text>
  <text class="lbl" x="335" y="180">Cannot answer:</text>
  <text class="sub" x="335" y="200">a rate — the reporting</text>
  <text class="sub" x="335" y="218">population is unknown</text>

  <rect class="hero" x="610" y="30" width="270" height="196" rx="8" />
  <text class="hdi"  x="630" y="60">Your own audit log</text>
  <text class="lbli" x="630" y="80" opacity=".8">every grant your agents hold</text>
  <text class="lbli" x="630" y="112">Answers:</text>
  <text class="lbli" x="630" y="132" opacity=".8">which credentials outlived</text>
  <text class="lbli" x="630" y="150" opacity=".8">the phase that needed them</text>
  <text class="lbli" x="630" y="180">Cannot answer:</text>
  <text class="lbli" x="630" y="200" opacity=".8">anything about anyone</text>
  <text class="lbli" x="630" y="218" opacity=".8">else — which is the point</text>

  <text class="cap" x="20" y="262">Two of the three have someone else's systems in the denominator. Only the third is a control you can act on this afternoon,</text>
  <text class="cap" x="20" y="280">and it is the only one of the three that no published figure will ever produce for you.</text>
</svg>
