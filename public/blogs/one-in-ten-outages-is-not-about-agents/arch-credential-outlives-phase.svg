<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="cpT cpD">
  <title id="cpT">How a build-phase credential becomes a production deletion</title>
  <desc id="cpD">A four-stage timeline. During the build phase an engineer grants the agent write access to production so an integration can be tested. The build phase ends and the grant is not revoked, leaving standing access that nothing in the system marks as unjustified. Later a routine task runs unattended, the agent plans a destructive step and the credential answers yes. The deletion completes, and only then does a control fire. Below, three annotations note that no attacker appears anywhere in the chain, that every check in the path returned success, and that the only stage where intervention was cheap was the one with no event attached to it.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hdi    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .lbli   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .stage  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .55; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#cparr); }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .gap    { stroke: var(--accent, #d4421e); stroke-width: 1.5; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="cparr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="stage" x="20" y="26">STAGE 1 — JUSTIFIED</text>
  <rect class="box" x="20" y="36" width="190" height="112" rx="8" />
  <text class="hd"  x="36" y="62">Build phase</text>
  <text class="sub" x="36" y="84">An engineer grants the</text>
  <text class="sub" x="36" y="102">agent write access to</text>
  <text class="sub" x="36" y="120">production to test the</text>
  <text class="sub" x="36" y="138">integration.</text>

  <path class="arrow" d="M 214 92 L 246 92" />

  <text class="stage" x="250" y="26">STAGE 2 — THE GAP</text>
  <rect class="adj" x="250" y="36" width="190" height="112" rx="8" />
  <text class="hd"  x="266" y="62">Build phase ends</text>
  <text class="sub" x="266" y="84">The grant does not.</text>
  <text class="sub" x="266" y="102">Nothing distinguishes</text>
  <text class="sub" x="266" y="120">access that is justified</text>
  <text class="sub" x="266" y="138">from access still valid.</text>

  <path class="arrow" d="M 444 92 L 476 92" />

  <text class="stage" x="480" y="26">STAGE 3 — UNATTENDED</text>
  <rect class="box" x="480" y="36" width="190" height="112" rx="8" />
  <text class="hd"  x="496" y="62">A routine run</text>
  <text class="sub" x="496" y="84">Weeks later the agent</text>
  <text class="sub" x="496" y="102">plans a destructive step</text>
  <text class="sub" x="496" y="120">on its way to finishing</text>
  <text class="sub" x="496" y="138">the task it was given.</text>

  <path class="arrow" d="M 674 92 L 706 92" />

  <text class="stage" x="710" y="26">STAGE 4 — THE INCIDENT</text>
  <rect class="hero" x="710" y="36" width="170" height="112" rx="8" />
  <text class="hdi"  x="726" y="62">The credential</text>
  <text class="hdi"  x="726" y="80">answers yes</text>
  <text class="lbli" x="726" y="106">Deletion completes.</text>
  <text class="lbli" x="726" y="124">Detection fires</text>
  <text class="lbli" x="726" y="142">afterwards.</text>

  <line class="gap" x1="345" y1="160" x2="345" y2="212" />
  <text class="lbl" x="360" y="196">The only cheap intervention point — and the only stage with no event attached to it</text>

  <rect class="box" x="20" y="240" width="860" height="118" rx="8" />
  <text class="hd"  x="40" y="268">What is absent from this chain</text>
  <text class="lbl" x="40" y="294">No attacker. No stolen credential. No prompt injection. No exploit. The agent used access it was deliberately given,</text>
  <text class="lbl" x="40" y="314">for a purpose that had expired, on a task nobody thought was risky.</text>
  <text class="sub" x="40" y="340">Every authorisation check in the path returned success, so every log line in the path reads as normal operation.</text>

  <text class="note" x="20" y="392">Controls that act on Stage 3 — approval prompts, anomaly detection, output filters — are working on the probability that the agent chooses</text>
  <text class="note" x="20" y="412">the destructive step. Controls that act on Stage 2 — expiry, per-run credentials, scope review — are working on whether the step is possible</text>
  <text class="note" x="20" y="432">at all. Only the second kind still holds when the model surprises you.</text>
  <text class="note" x="20" y="464">The nine documented 2026 deletions share Stage 2, not Stage 3: in the common pattern the agent found a credential nobody had scoped</text>
  <text class="note" x="20" y="484">it to have, and used it.</text>
</svg>
