<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="eswt eswd">
  <title id="eswt">Evaluation size against inbox workload</title>
  <desc id="eswd">One clinician handles about 3,220 inbox messages a year at a conservative 14 messages per clinical day across 230 days. The published vendor evaluation covered 325 tasks, which is roughly one clinician-month of about 268 messages. The evidence base is about a tenth of a single clinician-year.</desc>
  <style>
    .es-hi   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .es-mid  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .es-lo   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .es-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .es-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .es-val  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .es-tick { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .es-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .es-grid { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 4; }
    .es-axis { stroke: var(--ink); stroke-width: 1; opacity: .45; }
  </style>

  <text class="es-ttl" x="20" y="30">Inbox messages, same unit on every bar</text>

  <line class="es-grid" x1="495" y1="62" x2="495" y2="226" />
  <line class="es-grid" x1="631" y1="62" x2="631" y2="226" />
  <line class="es-grid" x1="766" y1="62" x2="766" y2="226" />
  <line class="es-axis" x1="360" y1="62" x2="360" y2="226" />

  <text class="es-row" x="20" y="90">One clinician, one year</text>
  <rect class="es-hi" x="360" y="68" width="436" height="34" />
  <text class="es-val" x="810" y="90">3,220</text>

  <text class="es-row" x="20" y="150">Published vendor eval set</text>
  <rect class="es-mid" x="360" y="128" width="44" height="34" />
  <text class="es-val" x="418" y="150">325</text>

  <text class="es-row" x="20" y="210">One clinician, one month</text>
  <rect class="es-lo" x="360" y="188" width="36" height="34" />
  <text class="es-val" x="410" y="210">268</text>

  <text class="es-tick" x="360" y="246" text-anchor="middle">0</text>
  <text class="es-tick" x="495" y="246" text-anchor="middle">1,000</text>
  <text class="es-tick" x="631" y="246" text-anchor="middle">2,000</text>
  <text class="es-tick" x="766" y="246" text-anchor="middle">3,000</text>

  <text class="es-sub" x="20" y="292">Clinician-year uses 14 messages per clinical day across 230 days — a published figure</text>
  <text class="es-sub" x="20" y="316">described as among the lowest in its EHR community, so it is a floor rather than a mean.</text>
  <text class="es-sub" x="20" y="340">At a 1.0% unsafe rate that year holds 32 unsafe dispositions; at 2.8%, ninety.</text>
</svg>
