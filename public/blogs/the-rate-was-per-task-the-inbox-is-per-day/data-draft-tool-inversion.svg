<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="dtit dtid">
  <title id="dtit">Draft-tool effect on message turnaround, measured two ways</title>
  <desc id="dtid">In a cohort study of 983,154 patient-portal message responses from 1,542 clinicians, adoption of an AI draft-response tool was associated with message turnaround time 8.6 percent slower at clinic level, while actually using a draft on a given message was associated with 29.5 percent faster turnaround. The two measurements point in opposite directions.</desc>
  <style>
    .dt-slow { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .dt-fast { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .dt-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .dt-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .dt-val  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .dt-tick { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .dt-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .dt-grid { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 4; }
    .dt-axis { stroke: var(--ink); stroke-width: 1; opacity: .45; }
  </style>

  <text class="dt-ttl" x="20" y="30">Change in message turnaround time</text>

  <line class="dt-grid" x1="107" y1="52" x2="107" y2="236" />
  <line class="dt-grid" x1="221" y1="52" x2="221" y2="236" />
  <line class="dt-grid" x1="336" y1="52" x2="336" y2="236" />
  <line class="dt-grid" x1="564" y1="52" x2="564" y2="236" />
  <line class="dt-axis" x1="450" y1="52" x2="450" y2="236" />

  <text class="dt-row" x="20" y="74">Clinic level — tool adopted by the team</text>
  <rect class="dt-slow" x="450" y="96" width="98" height="34" />
  <text class="dt-val" x="562" y="118">+8.6% slower</text>

  <text class="dt-row" x="20" y="164">Message level — a draft actually used</text>
  <rect class="dt-fast" x="113" y="186" width="337" height="34" />
  <text class="dt-val" x="99" y="208" text-anchor="end">29.5% faster</text>

  <text class="dt-tick" x="107" y="258" text-anchor="middle">-30%</text>
  <text class="dt-tick" x="221" y="258" text-anchor="middle">-20%</text>
  <text class="dt-tick" x="336" y="258" text-anchor="middle">-10%</text>
  <text class="dt-tick" x="450" y="258" text-anchor="middle">0</text>
  <text class="dt-tick" x="564" y="258" text-anchor="middle">+10%</text>

  <text class="dt-sub" x="20" y="302">Cohort study: 983,154 portal message responses from 1,542 clinicians.</text>
  <text class="dt-sub" x="20" y="326">A draft speeds up the messages a clinician was always going to write, and adds</text>
  <text class="dt-sub" x="20" y="350">a review step to the ones they were not. After-hours work did not meaningfully fall.</text>
</svg>
