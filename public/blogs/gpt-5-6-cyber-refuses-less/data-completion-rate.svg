<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Advanced Cybersecurity Completion Rate, GPT-5.6-Cyber versus GPT-5.6 Sol</title>
  <desc id="d">Horizontal bar chart of OpenAI's reported Advanced Cybersecurity Completion Rate. GPT-5.6-Cyber answers 95.0 percent of advanced cyber prompts; standard GPT-5.6 Sol answers 1.5 percent. The metric counts prompts the model engages with, not prompts it solves correctly.</desc>
  <style>
    .bar-hero { fill: var(--accent, #d4421e); }
    .bar-mute { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .grid     { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 3 4; }
    .axis     { stroke: var(--ink); stroke-width: 1.25; opacity: .5; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .lab      { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .val-inv  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 20px; fill: var(--paper); }
    .val-mute { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 20px; fill: var(--ink); }
    .tick     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .55; }
    .note     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="chart-title" x="30" y="42">Advanced Cybersecurity Completion Rate (%)</text>

  <line class="grid" x1="290" y1="80" x2="290" y2="300" />
  <line class="grid" x1="430" y1="80" x2="430" y2="300" />
  <line class="grid" x1="570" y1="80" x2="570" y2="300" />
  <line class="grid" x1="710" y1="80" x2="710" y2="300" />
  <line class="axis" x1="290" y1="300" x2="850" y2="300" />

  <text class="lab" x="30" y="128">GPT-5.6-Cyber</text>
  <rect class="bar-hero" x="290" y="105" width="532" height="44" rx="4" />
  <text class="val-inv" x="838" y="136" text-anchor="end">95.0</text>

  <text class="lab" x="30" y="218">GPT-5.6 Sol</text>
  <rect class="bar-mute" x="290" y="195" width="8" height="44" rx="4" />
  <text class="val-mute" x="316" y="226">1.5</text>

  <text class="tick" x="290" y="318" text-anchor="middle">0</text>
  <text class="tick" x="430" y="318" text-anchor="middle">25</text>
  <text class="tick" x="570" y="318" text-anchor="middle">50</text>
  <text class="tick" x="710" y="318" text-anchor="middle">75</text>
  <text class="tick" x="850" y="318" text-anchor="middle">100</text>

  <text class="note" x="30" y="356">COUNTS PROMPTS THE MODEL ENGAGES WITH</text>
  <text class="note" x="30" y="374">NOT PROMPTS IT SOLVES CORRECTLY</text>
</svg>
