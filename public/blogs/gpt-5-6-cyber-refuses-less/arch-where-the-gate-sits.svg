<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Which layer the Daybreak Red gate actually sits on</title>
  <desc id="d">A three-layer stack. The bottom layer is the shared GPT-5.6 base capability, identical for both models. The middle layer is the refusal policy, the only layer that differs between GPT-5.6 Sol and GPT-5.6-Cyber. The top layer is the Daybreak Red access gate, which controls who reaches the permissive policy. Arrows show that an attacker with a longer turn budget reaches the same capability through the standard model without passing the gate.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .arrow-dash { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="tag" x="30" y="34">LAYER 3 — ACCESS</text>
  <rect class="box" x="30" y="46" width="380" height="76" rx="8" />
  <text class="head" x="220" y="76" text-anchor="middle">Anyone with an API key</text>
  <text class="sub" x="220" y="98" text-anchor="middle">No vetting. No attestation.</text>

  <rect class="hero" x="490" y="46" width="380" height="76" rx="8" />
  <text class="head-inv" x="680" y="76" text-anchor="middle">Daybreak Red</text>
  <text class="sub-inv" x="680" y="98" text-anchor="middle">ID check, attestations, monitoring, keys.</text>

  <path class="arrow" d="M 220 122 L 220 172" />
  <path class="arrow" d="M 680 122 L 680 172" />

  <text class="tag" x="30" y="196">LAYER 2 — REFUSAL POLICY (THE ONLY LAYER THAT DIFFERS)</text>
  <rect class="box" x="30" y="208" width="380" height="86" rx="8" />
  <text class="head" x="220" y="240" text-anchor="middle">GPT-5.6 Sol</text>
  <text class="sub" x="220" y="262" text-anchor="middle">Declines most dual-use cyber prompts.</text>
  <text class="sub" x="220" y="280" text-anchor="middle">Completion rate 1.5%.</text>

  <rect class="adj" x="490" y="208" width="380" height="86" rx="8" />
  <text class="head" x="680" y="240" text-anchor="middle">GPT-5.6-Cyber</text>
  <text class="sub" x="680" y="262" text-anchor="middle">Trained to decline far less.</text>
  <text class="sub" x="680" y="280" text-anchor="middle">Completion rate 95.0%.</text>

  <path class="arrow" d="M 220 294 L 220 344" />
  <path class="arrow" d="M 680 294 L 680 344" />

  <text class="tag" x="30" y="368">LAYER 1 — CAPABILITY (IDENTICAL)</text>
  <rect class="box" x="30" y="380" width="840" height="76" rx="8" />
  <text class="head" x="450" y="410" text-anchor="middle">Shared GPT-5.6 base weights</text>
  <text class="sub" x="450" y="432" text-anchor="middle">Sol wins the two evaluations that score the work product. The specialised model does not add skill.</text>

  <path class="arrow-dash" d="M 412 262 L 486 262" />
  <text class="tag" x="449" y="250" text-anchor="middle">+300 TURNS</text>

  <text class="tag" x="30" y="484">GATING LAYER 3 DOES NOT MOVE LAYER 1 — IT ONLY DECIDES WHO GETS THE SHORTCUT THROUGH LAYER 2</text>
</svg>
