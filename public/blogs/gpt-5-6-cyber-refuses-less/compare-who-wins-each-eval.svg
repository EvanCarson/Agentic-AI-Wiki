<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Which model wins each of OpenAI's three reported cyber evaluations</title>
  <desc id="d">Three columns for the Advanced Cybersecurity Completion Rate, the Vulnerability Discovery and Report Writing evaluation, and ExploitBench at the standard 300-turn setting. Compared across what each measures, which model wins, and what that implies. GPT-5.6-Cyber wins only the completion-rate metric; standard GPT-5.6 Sol wins the two evaluations that score work product.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .head  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .row   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="row" x="10" y="96">MEASURES</text>
  <text class="row" x="10" y="166">WINNER</text>
  <text class="row" x="10" y="236">IMPLIES</text>

  <rect class="hero" x="130" y="18" width="230" height="46" rx="8" />
  <text class="head-inv" x="245" y="40" text-anchor="middle">Advanced Cyber</text>
  <text class="head-inv" x="245" y="57" text-anchor="middle">Completion Rate</text>
  <rect class="box" x="375" y="18" width="230" height="46" rx="8" />
  <text class="head" x="490" y="40" text-anchor="middle">Vuln. Discovery &amp;</text>
  <text class="head" x="490" y="57" text-anchor="middle">Report Writing</text>
  <rect class="box" x="620" y="18" width="230" height="46" rx="8" />
  <text class="head" x="735" y="40" text-anchor="middle">ExploitBench</text>
  <text class="head" x="735" y="57" text-anchor="middle">(300 turns)</text>

  <rect class="adj" x="130" y="76" width="230" height="54" rx="8" />
  <text class="cell" x="245" y="100" text-anchor="middle">Whether the model</text>
  <text class="cell" x="245" y="116" text-anchor="middle">engages at all.</text>
  <rect class="box" x="375" y="76" width="230" height="54" rx="8" />
  <text class="cell" x="490" y="100" text-anchor="middle">Quality of the finding</text>
  <text class="cell" x="490" y="116" text-anchor="middle">and the write-up.</text>
  <rect class="box" x="620" y="76" width="230" height="54" rx="8" />
  <text class="cell" x="735" y="100" text-anchor="middle">Tasks solved inside</text>
  <text class="cell" x="735" y="116" text-anchor="middle">a fixed turn budget.</text>

  <rect class="hero" x="130" y="146" width="230" height="54" rx="8" />
  <text class="cell-inv" x="245" y="170" text-anchor="middle">GPT-5.6-Cyber,</text>
  <text class="cell-inv" x="245" y="186" text-anchor="middle">95.0 vs 1.5.</text>
  <rect class="adj" x="375" y="146" width="230" height="54" rx="8" />
  <text class="cell" x="490" y="170" text-anchor="middle">GPT-5.6 Sol —</text>
  <text class="cell" x="490" y="186" text-anchor="middle">Cyber writes shorter.</text>
  <rect class="adj" x="620" y="146" width="230" height="54" rx="8" />
  <text class="cell" x="735" y="170" text-anchor="middle">GPT-5.6 Sol, on</text>
  <text class="cell" x="735" y="186" text-anchor="middle">fewer tokens.</text>

  <rect class="box" x="130" y="216" width="230" height="54" rx="8" />
  <text class="cell" x="245" y="240" text-anchor="middle">A policy delta.</text>
  <text class="cell" x="245" y="256" text-anchor="middle">Not a skill delta.</text>
  <rect class="box" x="375" y="216" width="230" height="54" rx="8" />
  <text class="cell" x="490" y="240" text-anchor="middle">The base model already</text>
  <text class="cell" x="490" y="256" text-anchor="middle">has the capability.</text>
  <rect class="box" x="620" y="216" width="230" height="54" rx="8" />
  <text class="cell" x="735" y="240" text-anchor="middle">Raise the budget to 600</text>
  <text class="cell" x="735" y="256" text-anchor="middle">and the gap narrows.</text>

  <text class="row" x="10" y="290">THE ONLY EVAL THE SPECIALISED MODEL WINS IS THE ONE THAT SCORES WILLINGNESS</text>
</svg>
