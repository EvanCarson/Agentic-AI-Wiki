<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="ws wsd">
  <title id="ws">Where a scanner sits and where a wrapper sits</title>
  <desc id="wsd">Two lanes. In the upper lane, which runs once at install time, a skill or MCP server is read by a scanner that emits a risk verdict, and nothing re-reads it afterwards. In the lower lane, which runs on every tool call, a wrapper sits between the host application and the MCP server, holding the approved configuration and quarantining tool responses, so a change to the server is caught before the next call completes.</desc>
  <style>
    .ws-box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ws-hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ws-adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ws-lab   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .ws-labin { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .ws-sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .ws-band  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .ws-arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#wsa); }
    .ws-dash  { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 4 4; marker-end: url(#wsa); }
  </style>
  <defs>
    <marker id="wsa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ws-band" x="20" y="34">INSTALL TIME, ONCE</text>

  <rect class="ws-box" x="20" y="52" width="200" height="56" />
  <text class="ws-lab" x="120" y="85" text-anchor="middle">Skill or MCP server</text>
  <text class="ws-sub" x="20" y="126">declared text and code</text>

  <path class="ws-arrow" d="M 220 80 L 290 80" />

  <rect class="ws-hero" x="290" y="52" width="200" height="56" />
  <text class="ws-labin" x="390" y="85" text-anchor="middle">Scanner</text>
  <text class="ws-sub" x="290" y="126">patterns, YARA, taint, LLM</text>

  <path class="ws-arrow" d="M 490 80 L 560 80" />

  <rect class="ws-adj" x="560" y="52" width="220" height="56" />
  <text class="ws-lab" x="670" y="85" text-anchor="middle">Risk verdict</text>
  <text class="ws-sub" x="560" y="126">a fact about one moment</text>

  <path class="ws-dash" d="M 670 108 L 670 162" />
  <text class="ws-sub" x="686" y="146">nothing re-reads it</text>

  <text class="ws-band" x="20" y="206">EVERY TOOL CALL, FOREVER</text>

  <rect class="ws-box" x="20" y="224" width="160" height="56" />
  <text class="ws-lab" x="100" y="257" text-anchor="middle">Host app</text>
  <text class="ws-sub" x="20" y="320">any MCP client</text>

  <path class="ws-arrow" d="M 180 242 L 250 242" />
  <path class="ws-arrow" d="M 250 266 L 180 266" />

  <rect class="ws-adj" x="250" y="224" width="220" height="56" />
  <text class="ws-lab" x="360" y="257" text-anchor="middle">Wrapper</text>
  <text class="ws-sub" x="250" y="320">approved config, quarantine</text>

  <path class="ws-arrow" d="M 470 242 L 540 242" />
  <path class="ws-arrow" d="M 540 266 L 470 266" />

  <rect class="ws-box" x="540" y="224" width="170" height="56" />
  <text class="ws-lab" x="625" y="257" text-anchor="middle">MCP server</text>
  <text class="ws-sub" x="540" y="320">stdio or HTTP</text>

  <text class="ws-sub" x="740" y="248">tool result</text>
  <text class="ws-sub" x="740" y="272">scanned on the way back</text>
</svg>
