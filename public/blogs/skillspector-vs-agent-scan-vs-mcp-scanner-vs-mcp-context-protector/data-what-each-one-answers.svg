<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="wq wqd">
  <title id="wq">What each agent scanner actually answers</title>
  <desc id="wqd">A matrix of four tools against four questions. SkillSpector, Snyk Agent Scan and Cisco MCP Scanner all produce a point-in-time risk verdict and gate CI, and none of them inspects live tool results. SkillSpector can diff against a saved baseline. Only mcp-context-protector pins an approved configuration, re-checks it and blocks tool calls until a change is approved, and only it scans tool responses when a guardrail provider is configured.</desc>
  <style>
    .wq-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .wq-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .wq-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .wq-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wq-col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .wq-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wq-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .wq-cellin { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .wq-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="wq-ttl" x="20" y="30">Four tools, and only one of them asks the second question</text>

  <text class="wq-col" x="320" y="66" text-anchor="middle">RISK VERDICT</text>
  <text class="wq-col" x="470" y="66" text-anchor="middle">RE-CHECK</text>
  <text class="wq-col" x="620" y="66" text-anchor="middle">BLOCKS CALL</text>
  <text class="wq-col" x="790" y="66" text-anchor="middle">READS RESULTS</text>

  <text class="wq-row" x="20" y="103">SkillSpector</text>
  <rect class="wq-strong" x="250" y="80" width="140" height="36" />
  <text class="wq-cellin" x="320" y="103" text-anchor="middle">0–100 score</text>
  <rect class="wq-med" x="400" y="80" width="140" height="36" />
  <text class="wq-cell" x="470" y="103" text-anchor="middle">Baseline diff</text>
  <rect class="wq-weak" x="550" y="80" width="140" height="36" />
  <text class="wq-cell" x="620" y="103" text-anchor="middle">CI gate only</text>
  <rect class="wq-weak" x="700" y="80" width="180" height="36" />
  <text class="wq-cell" x="790" y="103" text-anchor="middle">No</text>

  <text class="wq-row" x="20" y="159">Snyk Agent Scan</text>
  <rect class="wq-strong" x="250" y="136" width="140" height="36" />
  <text class="wq-cellin" x="320" y="159" text-anchor="middle">Scored risks</text>
  <rect class="wq-weak" x="400" y="136" width="140" height="36" />
  <text class="wq-cell" x="470" y="159" text-anchor="middle">Not documented</text>
  <rect class="wq-weak" x="550" y="136" width="140" height="36" />
  <text class="wq-cell" x="620" y="159" text-anchor="middle">CI gate only</text>
  <rect class="wq-weak" x="700" y="136" width="180" height="36" />
  <text class="wq-cell" x="790" y="159" text-anchor="middle">No</text>

  <text class="wq-row" x="20" y="215">Cisco MCP Scanner</text>
  <rect class="wq-strong" x="250" y="192" width="140" height="36" />
  <text class="wq-cellin" x="320" y="215" text-anchor="middle">Nine analyzers</text>
  <rect class="wq-weak" x="400" y="192" width="140" height="36" />
  <text class="wq-cell" x="470" y="215" text-anchor="middle">No</text>
  <rect class="wq-weak" x="550" y="192" width="140" height="36" />
  <text class="wq-cell" x="620" y="215" text-anchor="middle">No</text>
  <rect class="wq-weak" x="700" y="192" width="180" height="36" />
  <text class="wq-cell" x="790" y="215" text-anchor="middle">No</text>

  <text class="wq-row" x="20" y="271">mcp-context-protector</text>
  <rect class="wq-weak" x="250" y="248" width="140" height="36" />
  <text class="wq-cell" x="320" y="271" text-anchor="middle">No score</text>
  <rect class="wq-strong" x="400" y="248" width="140" height="36" />
  <text class="wq-cellin" x="470" y="271" text-anchor="middle">TOFU pin</text>
  <rect class="wq-strong" x="550" y="248" width="140" height="36" />
  <text class="wq-cellin" x="620" y="271" text-anchor="middle">Until approved</text>
  <rect class="wq-med" x="700" y="248" width="180" height="36" />
  <text class="wq-cell" x="790" y="271" text-anchor="middle">With guardrail</text>

  <rect class="wq-strong" x="20" y="306" width="16" height="13" />
  <text class="wq-leg" x="44" y="317">answers it</text>
  <rect class="wq-med" x="220" y="306" width="16" height="13" />
  <text class="wq-leg" x="244" y="317">partly</text>
  <rect class="wq-weak" x="380" y="306" width="16" height="13" />
  <text class="wq-leg" x="404" y="317">does not</text>
</svg>
