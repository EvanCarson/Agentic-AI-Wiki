<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="ft fd">
  <title id="ft">The five tools of the Google Home MCP server</title>
  <desc id="fd">A third-party agent connects through an OAuth token to the Home MCP server, which exposes five tools. Four are reads — list_homes, list_home_resources, list_home_states and list_home_history — and one is a write, run_home_actions. The write is behind a gate carrying rate limits and a block on sensitive actions such as unlocking a door. The event-history read has no equivalent gate, because no list of sensitive reads exists.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .mono-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#farr); }
    .arrow-dot { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 4 4; marker-end: url(#farr); opacity: .7; }
  </style>
  <defs>
    <marker id="farr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="sub" x="20" y="34">Four reads, one write — and the gate is on the write.</text>

  <rect class="box" x="20" y="206" width="160" height="88" />
  <text class="label" x="100" y="240" text-anchor="middle">Your agent</text>
  <text class="sub" x="100" y="260" text-anchor="middle">Claude, Antigravity,</text>
  <text class="sub" x="100" y="276" text-anchor="middle">Hermes, OpenClaw…</text>

  <path class="arrow" d="M 182 250 L 216 250" />

  <rect class="hero" x="220" y="202" width="172" height="96" />
  <text class="label-inv" x="306" y="236" text-anchor="middle">Home MCP server</text>
  <text class="sub-inv" x="306" y="258" text-anchor="middle">reached with an OAuth token</text>
  <text class="sub-inv" x="306" y="274" text-anchor="middle">from a Cloud project you set up</text>

  <path class="arrow" d="M 394 226 C 432 226 432 76 464 76" />
  <path class="arrow" d="M 394 236 C 432 236 432 136 464 136" />
  <path class="arrow" d="M 394 246 C 432 246 432 196 464 196" />
  <path class="arrow" d="M 394 260 C 432 260 432 256 464 256" />
  <path class="arrow" d="M 394 280 C 432 280 432 354 464 354" />

  <rect class="box" x="468" y="52" width="242" height="48" />
  <text class="mono" x="589" y="72" text-anchor="middle">list_homes</text>
  <text class="sub" x="589" y="90" text-anchor="middle">which homes you can reach</text>

  <rect class="box" x="468" y="112" width="242" height="48" />
  <text class="mono" x="589" y="132" text-anchor="middle">list_home_resources</text>
  <text class="sub" x="589" y="150" text-anchor="middle">devices, areas, traits, command schemas</text>

  <rect class="box" x="468" y="172" width="242" height="48" />
  <text class="mono" x="589" y="192" text-anchor="middle">list_home_states</text>
  <text class="sub" x="589" y="210" text-anchor="middle">live connectivity and trait states</text>

  <rect class="adj" x="468" y="232" width="242" height="48" />
  <text class="mono" x="589" y="252" text-anchor="middle">list_home_history</text>
  <text class="sub" x="589" y="270" text-anchor="middle">past state changes and event logs</text>

  <text class="sub" x="468" y="304">four reads</text>

  <rect class="hero" x="468" y="330" width="242" height="48" />
  <text class="mono-inv" x="589" y="350" text-anchor="middle">run_home_actions</text>
  <text class="sub-inv" x="589" y="368" text-anchor="middle">parameterized commands on a device</text>

  <text class="sub" x="468" y="400">one write</text>

  <path class="arrow-dot" d="M 712 256 L 736 256" />
  <rect class="box" x="740" y="224" width="144" height="64" />
  <text class="label" x="812" y="248" text-anchor="middle">No gate</text>
  <text class="sub" x="812" y="266" text-anchor="middle">nobody has written</text>
  <text class="sub" x="812" y="282" text-anchor="middle">down a sensitive read</text>

  <path class="arrow" d="M 712 354 L 736 354" />
  <rect class="adj" x="740" y="322" width="144" height="64" />
  <text class="label" x="812" y="346" text-anchor="middle">Gate</text>
  <text class="sub" x="812" y="364" text-anchor="middle">rate limits; unlocking</text>
  <text class="sub" x="812" y="380" text-anchor="middle">a door is blocked</text>
</svg>
