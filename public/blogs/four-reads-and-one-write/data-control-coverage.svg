<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ct2 cd2">
  <title id="ct2">Which Home MCP tool carries which control</title>
  <desc id="cd2">A matrix of the five Home MCP tools against four properties: rate limiting, a named sensitive-action block, how bounded the returned data is, and whether the call can be reversed. Only run_home_actions has a named block and is usually reversible. Every read is unreversible by nature, and list_home_history returns an arbitrary window rather than a bounded snapshot.</desc>
  <style>
    .cell-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .cell-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .cell-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .row    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; fill: var(--ink); }
    .cellt  { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); }
    .cellt-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper); }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
  </style>

  <text class="title" x="20" y="30">Which tool carries which control</text>

  <text class="head" x="345" y="70" text-anchor="middle">Rate limited</text>
  <text class="head" x="505" y="70" text-anchor="middle">Named block</text>
  <text class="head" x="665" y="70" text-anchor="middle">Bounded return</text>
  <text class="head" x="825" y="70" text-anchor="middle">Reversible</text>

  <text class="row" x="20" y="107">list_homes</text>
  <rect class="cell-med" x="270" y="84" width="150" height="34" />
  <text class="cellt" x="345" y="106" text-anchor="middle">Yes</text>
  <rect class="cell-weak" x="430" y="84" width="150" height="34" />
  <text class="cellt" x="505" y="106" text-anchor="middle">None defined</text>
  <rect class="cell-strong" x="590" y="84" width="150" height="34" />
  <text class="cellt-inv" x="665" y="106" text-anchor="middle">Small and fixed</text>
  <rect class="cell-weak" x="750" y="84" width="150" height="34" />
  <text class="cellt" x="825" y="106" text-anchor="middle">No — it is a read</text>

  <text class="row" x="20" y="159">list_home_resources</text>
  <rect class="cell-med" x="270" y="136" width="150" height="34" />
  <text class="cellt" x="345" y="158" text-anchor="middle">Yes</text>
  <rect class="cell-weak" x="430" y="136" width="150" height="34" />
  <text class="cellt" x="505" y="158" text-anchor="middle">None defined</text>
  <rect class="cell-med" x="590" y="136" width="150" height="34" />
  <text class="cellt" x="665" y="158" text-anchor="middle">The whole home</text>
  <rect class="cell-weak" x="750" y="136" width="150" height="34" />
  <text class="cellt" x="825" y="158" text-anchor="middle">No — it is a read</text>

  <text class="row" x="20" y="211">list_home_states</text>
  <rect class="cell-med" x="270" y="188" width="150" height="34" />
  <text class="cellt" x="345" y="210" text-anchor="middle">Yes</text>
  <rect class="cell-weak" x="430" y="188" width="150" height="34" />
  <text class="cellt" x="505" y="210" text-anchor="middle">None defined</text>
  <rect class="cell-med" x="590" y="188" width="150" height="34" />
  <text class="cellt" x="665" y="210" text-anchor="middle">Live snapshot</text>
  <rect class="cell-weak" x="750" y="188" width="150" height="34" />
  <text class="cellt" x="825" y="210" text-anchor="middle">No — it is a read</text>

  <text class="row" x="20" y="263">list_home_history</text>
  <rect class="cell-med" x="270" y="240" width="150" height="34" />
  <text class="cellt" x="345" y="262" text-anchor="middle">Yes</text>
  <rect class="cell-weak" x="430" y="240" width="150" height="34" />
  <text class="cellt" x="505" y="262" text-anchor="middle">None defined</text>
  <rect class="cell-weak" x="590" y="240" width="150" height="34" />
  <text class="cellt" x="665" y="262" text-anchor="middle">Any time window</text>
  <rect class="cell-weak" x="750" y="240" width="150" height="34" />
  <text class="cellt" x="825" y="262" text-anchor="middle">No — it is a read</text>

  <text class="row" x="20" y="315">run_home_actions</text>
  <rect class="cell-med" x="270" y="292" width="150" height="34" />
  <text class="cellt" x="345" y="314" text-anchor="middle">Yes</text>
  <rect class="cell-strong" x="430" y="292" width="150" height="34" />
  <text class="cellt-inv" x="505" y="314" text-anchor="middle">Unlocking blocked</text>
  <rect class="cell-med" x="590" y="292" width="150" height="34" />
  <text class="cellt" x="665" y="314" text-anchor="middle">Runtime traits</text>
  <rect class="cell-med" x="750" y="292" width="150" height="34" />
  <text class="cellt" x="825" y="314" text-anchor="middle">Usually</text>

  <rect class="cell-strong" x="270" y="352" width="16" height="16" />
  <text class="head" x="294" y="365">Strong</text>
  <rect class="cell-med" x="360" y="352" width="16" height="16" />
  <text class="head" x="384" y="365">Partial</text>
  <rect class="cell-weak" x="450" y="352" width="16" height="16" />
  <text class="head" x="474" y="365">Absent</text>
</svg>
