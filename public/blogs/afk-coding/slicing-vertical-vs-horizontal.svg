<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Vertical slices vs horizontal layers</title>
  <desc id="d">Two side-by-side panels comparing two ways to break work into pieces. Left panel: three horizontal layers (Frontend, Backend, Tests) stacked one above the other, chained by a dependency arrow that loops through all three — failure in any layer blocks the whole release. Right panel: three vertical slices placed side by side, each spanning Frontend, Backend, and Tests rows; no inter-slice arrows because each slice ships independently. Vertical slices on the right use the accent color to mark the recommended pattern.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <style>
    .box        { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .hero       { fill: var(--accent, #d4421e); stroke: none; }
    .adj        { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .label      { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--ink, #1a1a1a); }
    .label-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--paper, #fff); }
    .sub        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .panel-title { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .dep-arrow  { fill: none; stroke: var(--accent, #d4421e); stroke-width: 2; marker-end: url(#arr); }
    .divider    { stroke: var(--border-soft, #d8d4ce); stroke-width: 1; stroke-dasharray: 4 4; }
  </style>

  <!-- Divider line between panels -->
  <line class="divider" x1="450" y1="20" x2="450" y2="390" />

  <!-- ── LEFT PANEL: Horizontal layers (blocking) ── -->
  <text class="panel-title" x="215" y="38" text-anchor="middle">Horizontal layers (blocking)</text>

  <!-- Frontend strip -->
  <rect class="box" x="30" y="70" width="340" height="80" rx="8" ry="8" />
  <text class="label" x="200" y="116" text-anchor="middle">Frontend</text>

  <!-- Backend strip -->
  <rect class="box" x="30" y="165" width="340" height="80" rx="8" ry="8" />
  <text class="label" x="200" y="211" text-anchor="middle">Backend</text>

  <!-- Tests strip -->
  <rect class="box" x="30" y="260" width="340" height="80" rx="8" ry="8" />
  <text class="label" x="200" y="306" text-anchor="middle">Tests</text>

  <!-- Dependency arrows: Frontend → Backend → Tests (right edge, looping down) -->
  <!-- Frontend → Backend -->
  <path class="dep-arrow" d="M 380 110 L 395 110 L 395 205 L 380 205" />
  <!-- Backend → Tests -->
  <path class="dep-arrow" d="M 380 205 L 395 205 L 395 300 L 380 300" />

  <!-- Bottom annotation: left panel -->
  <text class="sub" x="215" y="372" text-anchor="middle">One failure stops the chain</text>

  <!-- ── RIGHT PANEL: Vertical slices (independent) ── -->
  <text class="panel-title" x="685" y="38" text-anchor="middle">Vertical slices (independent)</text>

  <!-- Slice A -->
  <rect class="hero" x="470" y="70" width="120" height="270" rx="8" ry="8" />
  <!-- Slice A sub-cells -->
  <rect class="adj" x="478" y="78" width="104" height="78" rx="4" ry="4" />
  <text class="label" x="530" y="122" text-anchor="middle">Frontend</text>
  <rect class="adj" x="478" y="164" width="104" height="78" rx="4" ry="4" />
  <text class="label" x="530" y="208" text-anchor="middle">Backend</text>
  <rect class="adj" x="478" y="250" width="104" height="78" rx="4" ry="4" />
  <text class="label" x="530" y="294" text-anchor="middle">Tests</text>
  <!-- Slice A label -->
  <text class="label-inv" x="530" y="356" text-anchor="middle">Slice A</text>

  <!-- Slice B -->
  <rect class="hero" x="600" y="70" width="120" height="270" rx="8" ry="8" />
  <!-- Slice B sub-cells -->
  <rect class="adj" x="608" y="78" width="104" height="78" rx="4" ry="4" />
  <text class="label" x="660" y="122" text-anchor="middle">Frontend</text>
  <rect class="adj" x="608" y="164" width="104" height="78" rx="4" ry="4" />
  <text class="label" x="660" y="208" text-anchor="middle">Backend</text>
  <rect class="adj" x="608" y="250" width="104" height="78" rx="4" ry="4" />
  <text class="label" x="660" y="294" text-anchor="middle">Tests</text>
  <!-- Slice B label -->
  <text class="label-inv" x="660" y="356" text-anchor="middle">Slice B</text>

  <!-- Slice C -->
  <rect class="hero" x="730" y="70" width="120" height="270" rx="8" ry="8" />
  <!-- Slice C sub-cells -->
  <rect class="adj" x="738" y="78" width="104" height="78" rx="4" ry="4" />
  <text class="label" x="790" y="122" text-anchor="middle">Frontend</text>
  <rect class="adj" x="738" y="164" width="104" height="78" rx="4" ry="4" />
  <text class="label" x="790" y="208" text-anchor="middle">Backend</text>
  <rect class="adj" x="738" y="250" width="104" height="78" rx="4" ry="4" />
  <text class="label" x="790" y="294" text-anchor="middle">Tests</text>
  <!-- Slice C label -->
  <text class="label-inv" x="790" y="356" text-anchor="middle">Slice C</text>

  <!-- Bottom annotation: right panel -->
  <text class="sub" x="685" y="372" text-anchor="middle">Each slice ships on its own</text>
</svg>
