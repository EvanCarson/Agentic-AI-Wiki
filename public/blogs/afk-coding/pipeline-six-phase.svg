<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">AFK coding pipeline: six phases</title>
  <desc id="d">Six phases laid out left to right: align on spec (HITL), slice into vertical tickets (AFK), Ralph loop per slice (AFK), refactor pass (AFK), agentic QA (AFK), human review (HITL). The two HITL endpoints are filled with the accent color; the four AFK middle steps are neutral.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <style>
    .box       { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .hero      { fill: var(--accent, #d4421e); stroke: none; }
    .adj       { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--ink, #1a1a1a); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--paper, #fff); }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .80; }
    .num       { font-family: 'Inter', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: var(--muted, #888); }
    .num-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: var(--paper, #fff); opacity: .70; }
    .arrow     { fill: none; stroke: currentColor; stroke-width: 1.75; marker-end: url(#arr); opacity: .70; }
    .tag       { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
    .tag-hitl  { fill: var(--paper, #fff); opacity: .85; }
    .tag-afk   { fill: var(--muted, #888); opacity: .80; }
  </style>

  <!-- Phase 1: Align on spec (HITL — hero) -->
  <rect class="hero" x="30" y="150" width="130" height="200" rx="10" ry="10" />
  <text class="num-inv" x="95" y="195" text-anchor="middle">1</text>
  <text class="label-inv" x="95" y="225" text-anchor="middle">Align on spec</text>
  <text class="sub-inv" x="95" y="250" text-anchor="middle">Interview requirements,</text>
  <text class="sub-inv" x="95" y="268" text-anchor="middle">produce a PRD</text>
  <text class="tag tag-hitl" x="95" y="328" text-anchor="middle">HITL</text>

  <!-- Arrow 1→2 -->
  <path class="arrow" d="M 160 250 L 173 250" />

  <!-- Phase 2: Slice into vertical tickets (AFK — box) -->
  <rect class="box" x="178" y="150" width="130" height="200" rx="10" ry="10" />
  <text class="num" x="243" y="195" text-anchor="middle">2</text>
  <text class="label" x="243" y="222" text-anchor="middle">Slice into</text>
  <text class="label" x="243" y="240" text-anchor="middle">vertical tickets</text>
  <text class="sub" x="243" y="265" text-anchor="middle">End-to-end strips,</text>
  <text class="sub" x="243" y="283" text-anchor="middle">not layers</text>
  <text class="tag tag-afk" x="243" y="328" text-anchor="middle">AFK</text>

  <!-- Arrow 2→3 -->
  <path class="arrow" d="M 308 250 L 321 250" />

  <!-- Phase 3: Ralph loop per slice (AFK — box) -->
  <rect class="box" x="326" y="150" width="130" height="200" rx="10" ry="10" />
  <text class="num" x="391" y="195" text-anchor="middle">3</text>
  <text class="label" x="391" y="222" text-anchor="middle">Ralph loop</text>
  <text class="label" x="391" y="240" text-anchor="middle">per slice</text>
  <text class="sub" x="391" y="265" text-anchor="middle">Fresh context,</text>
  <text class="sub" x="391" y="283" text-anchor="middle">red-green-refactor</text>
  <text class="tag tag-afk" x="391" y="328" text-anchor="middle">AFK</text>

  <!-- Arrow 3→4 -->
  <path class="arrow" d="M 456 250 L 469 250" />

  <!-- Phase 4: Refactor pass (AFK — box) -->
  <rect class="box" x="474" y="150" width="130" height="200" rx="10" ry="10" />
  <text class="num" x="539" y="195" text-anchor="middle">4</text>
  <text class="label" x="539" y="225" text-anchor="middle">Refactor pass</text>
  <text class="sub" x="539" y="250" text-anchor="middle">Dedicated cleanup,</text>
  <text class="sub" x="539" y="268" text-anchor="middle">less duplication</text>
  <text class="tag tag-afk" x="539" y="328" text-anchor="middle">AFK</text>

  <!-- Arrow 4→5 -->
  <path class="arrow" d="M 604 250 L 617 250" />

  <!-- Phase 5: Agentic QA (AFK — box) -->
  <rect class="box" x="622" y="150" width="130" height="200" rx="10" ry="10" />
  <text class="num" x="687" y="195" text-anchor="middle">5</text>
  <text class="label" x="687" y="225" text-anchor="middle">Agentic QA</text>
  <text class="sub" x="687" y="250" text-anchor="middle">Browser-driven</text>
  <text class="sub" x="687" y="268" text-anchor="middle">workflow validation</text>
  <text class="tag tag-afk" x="687" y="328" text-anchor="middle">AFK</text>

  <!-- Arrow 5→6 -->
  <path class="arrow" d="M 752 250 L 765 250" />

  <!-- Phase 6: Human review (HITL — hero) -->
  <rect class="hero" x="770" y="150" width="130" height="200" rx="10" ry="10" />
  <text class="num-inv" x="835" y="195" text-anchor="middle">6</text>
  <text class="label-inv" x="835" y="225" text-anchor="middle">Human review</text>
  <text class="sub-inv" x="835" y="250" text-anchor="middle">Developer +</text>
  <text class="sub-inv" x="835" y="268" text-anchor="middle">stakeholder approval</text>
  <text class="tag tag-hitl" x="835" y="328" text-anchor="middle">HITL</text>
</svg>
