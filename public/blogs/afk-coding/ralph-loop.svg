<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">The Ralph loop: fresh-context iteration cycle</title>
  <desc id="d">A five-node cycle: read prompt file (listing unchecked tasks), pick one unchecked task, implement red-green-refactor, commit, fresh context. The "fresh context" return arrow back to the start is rendered in the accent color — it carries the load-bearing detail of the technique. After each commit, a brand-new agent context begins the next iteration.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent, #d4421e)" />
    </marker>
  </defs>
  <style>
    .box       { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .hero      { fill: var(--accent, #d4421e); stroke: none; }
    .adj       { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--ink, #1a1a1a); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--paper, #fff); }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .80; }
    .num       { font-family: 'Inter', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: var(--muted, #888); }
    .num-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: var(--paper, #fff); opacity: .70; }
    .arrow     { fill: none; stroke: currentColor; stroke-width: 1.75; marker-end: url(#arr); opacity: .70; }
    .accent-arrow { fill: none; stroke: var(--accent, #d4421e); stroke-width: 2; marker-end: url(#arr-accent); }
  </style>

  <!-- Node 1: Read prompt file (.box) -->
  <rect class="box" x="30" y="160" width="145" height="130" rx="10" ry="10" />
  <text class="num" x="102" y="193" text-anchor="middle">1</text>
  <text class="label" x="102" y="215" text-anchor="middle">Read prompt file</text>
  <text class="sub" x="102" y="237" text-anchor="middle">Unchecked tasks:</text>
  <text class="sub" x="102" y="253" text-anchor="middle">- [ ] foo</text>
  <text class="sub" x="102" y="269" text-anchor="middle">- [ ] bar</text>

  <!-- Arrow 1→2 -->
  <path class="arrow" d="M 175 225 L 198 225" />

  <!-- Node 2: Pick one unchecked task (.box) -->
  <rect class="box" x="205" y="160" width="145" height="130" rx="10" ry="10" />
  <text class="num" x="277" y="193" text-anchor="middle">2</text>
  <text class="label" x="277" y="215" text-anchor="middle">Pick one task</text>
  <text class="sub" x="277" y="237" text-anchor="middle">Just one.</text>
  <text class="sub" x="277" y="253" text-anchor="middle">No batching.</text>

  <!-- Arrow 2→3 -->
  <path class="arrow" d="M 350 225 L 373 225" />

  <!-- Node 3: Implement red-green-refactor (.adj — "work" node) -->
  <rect class="adj" x="380" y="160" width="145" height="130" rx="10" ry="10" />
  <text class="num" x="452" y="193" text-anchor="middle">3</text>
  <text class="label" x="452" y="215" text-anchor="middle">Implement</text>
  <text class="sub" x="452" y="237" text-anchor="middle">red &#x2192; green</text>
  <text class="sub" x="452" y="253" text-anchor="middle">&#x2192; refactor</text>

  <!-- Arrow 3→4 -->
  <path class="arrow" d="M 525 225 L 548 225" />

  <!-- Node 4: Commit (.box) -->
  <rect class="box" x="555" y="160" width="145" height="130" rx="10" ry="10" />
  <text class="num" x="627" y="193" text-anchor="middle">4</text>
  <text class="label" x="627" y="215" text-anchor="middle">Commit</text>
  <text class="sub" x="627" y="237" text-anchor="middle">git commit -m</text>
  <text class="sub" x="627" y="253" text-anchor="middle">"..."</text>

  <!-- Arrow 4→5 -->
  <path class="arrow" d="M 700 225 L 723 225" />

  <!-- Node 5: Fresh context, re-launch (.hero) -->
  <rect class="hero" x="730" y="160" width="145" height="130" rx="10" ry="10" />
  <text class="num-inv" x="802" y="193" text-anchor="middle">5</text>
  <text class="label-inv" x="802" y="215" text-anchor="middle">Fresh context,</text>
  <text class="label-inv" x="802" y="233" text-anchor="middle">re-launch</text>
  <text class="sub-inv" x="802" y="258" text-anchor="middle">New agent,</text>
  <text class="sub-inv" x="802" y="274" text-anchor="middle">clean slate</text>

  <!-- Return arrow: Node 5 top → Node 1 top (accent-colored cubic Bezier) -->
  <path class="accent-arrow" d="M 802 160 C 802 50, 102 50, 102 160" />

  <!-- Label along the return arrow -->
  <text class="sub" x="452" y="72" text-anchor="middle" opacity="1" style="fill: var(--accent, #d4421e); opacity: .85;">fresh context every iteration</text>

  <!-- Bottom annotation -->
  <text class="sub" x="450" y="350" text-anchor="middle">"Many cheap runs converge better than one perfect attempt"</text>
</svg>
