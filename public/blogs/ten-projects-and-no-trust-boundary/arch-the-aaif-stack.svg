<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="ast asd">
  <title id="ast">The ten AAIF projects by layer, and the decision none of them covers</title>
  <desc id="asd">Five stacked layers of the agent stack, each labelled with the AAIF projects that standardise it: the model API with Open Responses, capability packaging with Agent Skills and AGENTS.md, connection with MCP and A2A, routing with Agent Router and agentgateway, and execution with OpenSandbox and OpenEnv, alongside the goose client. To the right, outside every layer, sits the admission decision: which artefact from which publisher at which revision may load, and what it may then do.</desc>
  <style>
    .as-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .as-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .as-gap  { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 6 5; rx: 8; ry: 8; }
    .as-head { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .as-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .as-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .as-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="as-head" x="40" y="36">Standardised by AAIF</text>
  <text class="as-head" x="620" y="36">Specified by nobody</text>

  <rect class="as-box" x="40" y="56" width="500" height="58" />
  <text class="as-lbl" x="60" y="81">Execution and training environments</text>
  <text class="as-sub" x="60" y="101">OpenSandbox, OpenEnv</text>

  <rect class="as-box" x="40" y="130" width="500" height="58" />
  <text class="as-lbl" x="60" y="155">Routing and gateway</text>
  <text class="as-sub" x="60" y="175">Agent Router, agentgateway</text>

  <rect class="as-box" x="40" y="204" width="500" height="58" />
  <text class="as-lbl" x="60" y="229">Connection to tools, data and other agents</text>
  <text class="as-sub" x="60" y="249">MCP, A2A</text>

  <rect class="as-hero" x="40" y="278" width="500" height="58" />
  <text class="as-inv" x="60" y="303">Capability packaging</text>
  <text class="as-inv" x="60" y="323">Agent Skills, AGENTS.md</text>

  <rect class="as-box" x="40" y="352" width="500" height="58" />
  <text class="as-lbl" x="60" y="377">The model API</text>
  <text class="as-sub" x="60" y="397">Open Responses</text>

  <rect class="as-box" x="40" y="426" width="500" height="48" />
  <text class="as-lbl" x="60" y="456">Client: goose</text>

  <rect class="as-gap" x="620" y="56" width="250" height="354" />
  <text class="as-lbl" x="640" y="92">Admission</text>
  <text class="as-sub" x="640" y="124">Who may publish this?</text>
  <text class="as-sub" x="640" y="148">Which revision is this?</text>
  <text class="as-sub" x="640" y="172">Was this revision reviewed?</text>
  <text class="as-sub" x="640" y="196">What may it reach once</text>
  <text class="as-sub" x="640" y="216">something loads it?</text>
  <text class="as-sub" x="640" y="256">Decided by the host, at</text>
  <text class="as-sub" x="640" y="276">install time, from facts</text>
  <text class="as-sub" x="640" y="296">the format does not carry.</text>

  <text class="as-sub" x="450" y="494" text-anchor="middle">Accent marks the layer donated on 22 October 2026. Ten portable formats; the dashed box is still yours to build.</text>
</svg>
