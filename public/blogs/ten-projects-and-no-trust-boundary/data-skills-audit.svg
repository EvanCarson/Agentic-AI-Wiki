<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="sat sad">
  <title id="sat">Dangerous patterns found in 31,132 analysed agent skills (%)</title>
  <desc id="sad">Horizontal bars showing the severity split reported by arXiv 2601.10338: 5.2 percent high severity suggesting malicious intent, 8.1 percent medium severity of ambiguous intent, 12.8 percent low severity indicating poor practice, and 26.1 percent carrying at least one dangerous pattern in total.</desc>
  <style>
    .sa-hero { fill: var(--accent, #d4421e); }
    .sa-adj  { fill: var(--accent-soft); }
    .sa-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .sa-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .sa-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .sa-val  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .sa-ax   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sa-grid { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 4; opacity: .28; }
    .sa-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="sa-ttl" x="40" y="36">Dangerous patterns in 31,132 analysed skills (% of corpus)</text>

  <line class="sa-grid" x1="310" y1="56" x2="310" y2="300" />
  <line class="sa-grid" x1="493" y1="56" x2="493" y2="300" />
  <line class="sa-grid" x1="677" y1="56" x2="677" y2="300" />
  <line class="sa-grid" x1="860" y1="56" x2="860" y2="300" />

  <text class="sa-lbl" x="290" y="92" text-anchor="end">high severity</text>
  <rect class="sa-box" x="310" y="68" width="95" height="34" rx="4" ry="4" />
  <text class="sa-val" x="417" y="92">5.2%</text>

  <text class="sa-lbl" x="290" y="152" text-anchor="end">medium severity</text>
  <rect class="sa-adj" x="310" y="128" width="149" height="34" rx="4" ry="4" />
  <text class="sa-val" x="471" y="152">8.1%</text>

  <text class="sa-lbl" x="290" y="212" text-anchor="end">low severity</text>
  <rect class="sa-adj" x="310" y="188" width="235" height="34" rx="4" ry="4" />
  <text class="sa-val" x="557" y="212">12.8%</text>

  <text class="sa-lbl" x="290" y="272" text-anchor="end">any of the three</text>
  <rect class="sa-hero" x="310" y="248" width="479" height="34" rx="4" ry="4" />
  <text class="sa-val" x="801" y="272">26.1%</text>

  <text class="sa-ax" x="310" y="324" text-anchor="middle">0%</text>
  <text class="sa-ax" x="493" y="324" text-anchor="middle">10%</text>
  <text class="sa-ax" x="677" y="324" text-anchor="middle">20%</text>
  <text class="sa-ax" x="860" y="324" text-anchor="middle">30%</text>

  <text class="sa-sub" x="40" y="360">Source: arXiv 2601.10338, a December 2025 crawl of two skill marketplaces.</text>
  <text class="sa-sub" x="40" y="382">The high-severity band is a severity judgement, not a confirmed count of malware.</text>
</svg>
