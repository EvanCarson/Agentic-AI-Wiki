<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="wbt wbd">
  <title id="wbt">Three candidate trust boundaries for a loaded skill</title>
  <desc id="wbd">Three columns. Publisher identity refuses an unknown author but cannot judge a known author's latest push. Artefact contents, meaning a scan, refuses known patterns but expires when the folder changes. Runtime capability refuses the action rather than the artefact and survives the artefact changing.</desc>
  <style>
    .wb-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .wb-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .wb-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .wb-head { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wb-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wb-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .wb-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="wb-head" x="170" y="34" text-anchor="middle">publisher identity</text>
  <text class="wb-head" x="450" y="34" text-anchor="middle">artefact contents</text>
  <text class="wb-head" x="730" y="34" text-anchor="middle">runtime capability</text>

  <rect class="wb-box" x="60" y="56" width="220" height="76" />
  <text class="wb-lbl" x="170" y="88" text-anchor="middle">refuses an author</text>
  <text class="wb-lbl" x="170" y="110" text-anchor="middle">you do not know</text>

  <rect class="wb-adj" x="340" y="56" width="220" height="76" />
  <text class="wb-lbl" x="450" y="88" text-anchor="middle">refuses the patterns</text>
  <text class="wb-lbl" x="450" y="110" text-anchor="middle">it has seen before</text>

  <rect class="wb-hero" x="620" y="56" width="220" height="76" />
  <text class="wb-inv" x="730" y="88" text-anchor="middle">refuses the action,</text>
  <text class="wb-inv" x="730" y="110" text-anchor="middle">not the artefact</text>

  <rect class="wb-box" x="60" y="170" width="220" height="76" />
  <text class="wb-lbl" x="170" y="202" text-anchor="middle">blind to the next</text>
  <text class="wb-lbl" x="170" y="224" text-anchor="middle">push by that author</text>

  <rect class="wb-box" x="340" y="170" width="220" height="76" />
  <text class="wb-lbl" x="450" y="202" text-anchor="middle">expires when the</text>
  <text class="wb-lbl" x="450" y="224" text-anchor="middle">folder changes</text>

  <rect class="wb-box" x="620" y="170" width="220" height="76" />
  <text class="wb-lbl" x="730" y="202" text-anchor="middle">costs you the</text>
  <text class="wb-lbl" x="730" y="224" text-anchor="middle">capability itself</text>

  <text class="wb-sub" x="450" y="282" text-anchor="middle">Top row: what each one refuses. Bottom row: what it cannot do. Only the third survives an artefact changing under you.</text>
</svg>
