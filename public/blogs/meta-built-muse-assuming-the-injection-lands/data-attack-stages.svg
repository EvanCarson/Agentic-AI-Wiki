<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="at ad">
  <title id="at">Which Muse layer covers which stage of an attack</title>
  <desc id="ad">A five-by-four matrix. Rows are the defensive layers: per-user VM, injection classifiers, Sentinel with tainted egress, credential brokering, and human approval. Columns are four stages of an attack: the injected instruction lands, the agent reads private data, bytes are sent to an attacker-controlled endpoint, and a harmful action is taken through a sanctioned connector. Only the third stage is strongly covered, by Sentinel. The first two stages are uncovered by design because they are the product. The fourth stage is uncovered by every layer except human approval, which only partly covers it.</desc>
  <style>
    .hi   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .mid  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .lo   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .cell     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .row  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .col  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .ttl  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .leg  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="ttl" x="20" y="26">Coverage by attack stage, left to right in the order an attack runs</text>

  <text class="col" x="330" y="58" text-anchor="middle">Injection lands</text>
  <text class="col" x="492" y="58" text-anchor="middle">Private data read</text>
  <text class="col" x="654" y="58" text-anchor="middle">Bytes to attacker</text>
  <text class="col" x="816" y="58" text-anchor="middle">Harmful sanctioned action</text>

  <text class="row" x="20" y="102">Per-user VM</text>
  <rect class="lo" x="250" y="70" width="160" height="52" />
  <text class="cell" x="330" y="101" text-anchor="middle">No</text>
  <rect class="lo" x="412" y="70" width="160" height="52" />
  <text class="cell" x="492" y="101" text-anchor="middle">No</text>
  <rect class="lo" x="574" y="70" width="160" height="52" />
  <text class="cell" x="654" y="101" text-anchor="middle">No</text>
  <rect class="lo" x="736" y="70" width="160" height="52" />
  <text class="cell" x="816" y="101" text-anchor="middle">No</text>

  <text class="row" x="20" y="160">Injection classifiers</text>
  <rect class="mid" x="250" y="128" width="160" height="52" />
  <text class="cell" x="330" y="159" text-anchor="middle">Partly</text>
  <rect class="lo" x="412" y="128" width="160" height="52" />
  <text class="cell" x="492" y="159" text-anchor="middle">No</text>
  <rect class="mid" x="574" y="128" width="160" height="52" />
  <text class="cell" x="654" y="159" text-anchor="middle">Partly</text>
  <rect class="mid" x="736" y="128" width="160" height="52" />
  <text class="cell" x="816" y="159" text-anchor="middle">Partly</text>

  <text class="row" x="20" y="218">Sentinel + tainted egress</text>
  <rect class="lo" x="250" y="186" width="160" height="52" />
  <text class="cell" x="330" y="217" text-anchor="middle">No</text>
  <rect class="lo" x="412" y="186" width="160" height="52" />
  <text class="cell" x="492" y="217" text-anchor="middle">No</text>
  <rect class="hi" x="574" y="186" width="160" height="52" />
  <text class="cell-inv" x="654" y="217" text-anchor="middle">Blocks</text>
  <rect class="lo" x="736" y="186" width="160" height="52" />
  <text class="cell" x="816" y="217" text-anchor="middle">Permits it</text>

  <text class="row" x="20" y="276">Credential brokering</text>
  <rect class="lo" x="250" y="244" width="160" height="52" />
  <text class="cell" x="330" y="275" text-anchor="middle">No</text>
  <rect class="lo" x="412" y="244" width="160" height="52" />
  <text class="cell" x="492" y="275" text-anchor="middle">No</text>
  <rect class="mid" x="574" y="244" width="160" height="52" />
  <text class="cell" x="654" y="275" text-anchor="middle">Devalues it</text>
  <rect class="lo" x="736" y="244" width="160" height="52" />
  <text class="cell" x="816" y="275" text-anchor="middle">Signs it</text>

  <text class="row" x="20" y="334">Human approval</text>
  <rect class="lo" x="250" y="302" width="160" height="52" />
  <text class="cell" x="330" y="333" text-anchor="middle">No</text>
  <rect class="lo" x="412" y="302" width="160" height="52" />
  <text class="cell" x="492" y="333" text-anchor="middle">No</text>
  <rect class="mid" x="574" y="302" width="160" height="52" />
  <text class="cell" x="654" y="333" text-anchor="middle">Confirms</text>
  <rect class="mid" x="736" y="302" width="160" height="52" />
  <text class="cell" x="816" y="333" text-anchor="middle">Until fatigue</text>

  <rect class="lo" x="250" y="366" width="18" height="18" />
  <text class="leg" x="276" y="380">Not covered</text>
  <rect class="mid" x="392" y="366" width="18" height="18" />
  <text class="leg" x="418" y="380">Partial</text>
  <rect class="hi" x="506" y="366" width="18" height="18" />
  <text class="leg" x="532" y="380">Hard limit</text>
</svg>
