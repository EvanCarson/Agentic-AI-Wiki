<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="st sd">
  <title id="st">Where Muse spends its security budget</title>
  <desc id="sd">Inside a per-user secure virtual machine sit the model and its agent loop, two tool-execution processes, and an isolated credential daemon the model cannot read. Untrusted content arrives from the internet into the tool processes; a process that has read user data is marked tainted at the kernel level. Every outbound request leaves the machine through Sentinel, a separate gatekeeper process the agent cannot address, which inspects the request at the transport and application layers, substitutes the real credential for a surrogate token, and either allows it, refers it to a human, or blocks it.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .frame  { fill: none; stroke: var(--border-soft); stroke-width: 1.25; rx: 10; ry: 10; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .7; letter-spacing: .06em; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#sarr); }
    .arrow-dot { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 4 4; marker-end: url(#sarr); opacity: .75; }
  </style>
  <defs>
    <marker id="sarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="20" y="44">MUSE SECURE VM — ONE PER USER</text>
  <rect class="frame" x="20" y="56" width="500" height="400" />

  <rect class="adj" x="44" y="84" width="452" height="68" />
  <text class="label" x="270" y="114" text-anchor="middle">Model and agent loop</text>
  <text class="sub" x="270" y="136" text-anchor="middle">holds surrogate tokens only — never a real secret</text>

  <rect class="box" x="44" y="184" width="216" height="76" />
  <text class="label" x="152" y="212" text-anchor="middle">Tool process</text>
  <text class="sub" x="152" y="234" text-anchor="middle">clean: touched no</text>
  <text class="sub" x="152" y="250" text-anchor="middle">user data</text>

  <rect class="adj" x="280" y="184" width="216" height="76" />
  <text class="label" x="388" y="212" text-anchor="middle">Tool process — tainted</text>
  <text class="sub" x="388" y="234" text-anchor="middle">read user data; narrower</text>
  <text class="sub" x="388" y="250" text-anchor="middle">egress policy applies</text>

  <rect class="box" x="44" y="292" width="452" height="72" />
  <text class="label" x="270" y="322" text-anchor="middle">authd — passwords and OAuth tokens</text>
  <text class="sub" x="270" y="344" text-anchor="middle">isolated; the model has no read path to it</text>

  <text class="sub" x="270" y="400" text-anchor="middle">Private data and untrusted content are both inside, by design.</text>
  <text class="sub" x="270" y="422" text-anchor="middle">Neither can be removed without removing the product.</text>

  <path class="arrow" d="M 500 218 L 552 218" />
  <text class="sub" x="526" y="206" text-anchor="middle">request</text>

  <rect class="hero" x="556" y="120" width="152" height="264" />
  <text class="label-inv" x="632" y="164" text-anchor="middle">Sentinel</text>
  <text class="sub-inv" x="632" y="192" text-anchor="middle">separate process,</text>
  <text class="sub-inv" x="632" y="208" text-anchor="middle">outside the agent's reach</text>
  <text class="sub-inv" x="632" y="240" text-anchor="middle">checks host, resolved IP,</text>
  <text class="sub-inv" x="632" y="256" text-anchor="middle">port, method, path, body</text>
  <text class="sub-inv" x="632" y="288" text-anchor="middle">swaps surrogate token</text>
  <text class="sub-inv" x="632" y="304" text-anchor="middle">for the real credential</text>
  <text class="sub-inv" x="632" y="336" text-anchor="middle">allow · confirm · block</text>

  <path class="arrow" d="M 712 218 L 760 218" />

  <rect class="box" x="764" y="168" width="116" height="100" />
  <text class="label" x="822" y="204" text-anchor="middle">Connectors</text>
  <text class="sub" x="822" y="226" text-anchor="middle">mail, calendar,</text>
  <text class="sub" x="822" y="242" text-anchor="middle">bank, the web</text>

  <path class="arrow" d="M 712 330 L 760 330" />
  <rect class="box" x="764" y="296" width="116" height="68" />
  <text class="label" x="822" y="326" text-anchor="middle">You</text>
  <text class="sub" x="822" y="346" text-anchor="middle">confirm or refuse</text>

  <path class="arrow-dot" d="M 822 272 L 822 424 L 396 424 L 396 266" />
  <text class="sub" x="620" y="444" text-anchor="middle">untrusted content comes back in — this is the injection channel, and it stays open</text>
</svg>
