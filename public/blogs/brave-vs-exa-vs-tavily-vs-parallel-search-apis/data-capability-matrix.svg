<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Feature matrix of four agent search APIs across five axes</title>
  <desc id="d">Rows are Brave, Exa, Tavily and Parallel. Columns are contents included at the base price, control over what comes back, latency, price predictability, and whether a dedicated deep-research product exists. Cells are shaded on three levels. Brave is strongest on latency and price predictability and weakest on control and deep research; Exa is strongest on bundled contents and deep research; Tavily includes extraction at advanced depth but has the least predictable pricing; Parallel is strongest on deep research and weakest on latency.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .lvl    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .lvl-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .det    { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--ink); opacity: .7; }
    .det-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--paper); opacity: .85; }
    .rowlab { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .collab { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="head" x="24" y="30">Where each API leans hardest</text>

  <text class="collab" x="176" y="60">CONTENTS AT BASE</text>
  <text class="collab" x="320" y="60">CONTROL</text>
  <text class="collab" x="464" y="60">LATENCY</text>
  <text class="collab" x="608" y="60">PRICE PREDICT.</text>
  <text class="collab" x="752" y="60">DEEP RESEARCH</text>

  <text class="rowlab" x="24" y="104">Brave</text>
  <rect class="med"    x="176" y="76" width="142" height="52" />
  <text class="lvl"    x="190" y="99">Medium</text>
  <text class="det"    x="190" y="115">same-price endpoint</text>
  <rect class="weak"   x="320" y="76" width="142" height="52" />
  <text class="lvl"    x="334" y="99">Weak</text>
  <text class="det"    x="334" y="115">take the chunks given</text>
  <rect class="strong" x="464" y="76" width="142" height="52" />
  <text class="lvl-inv" x="478" y="99">Strong</text>
  <text class="det-inv" x="478" y="115">fastest measured</text>
  <rect class="strong" x="608" y="76" width="142" height="52" />
  <text class="lvl-inv" x="622" y="99">Strong</text>
  <text class="det-inv" x="622" y="115">flat $5 / 1k</text>
  <rect class="weak"   x="752" y="76" width="142" height="52" />
  <text class="lvl"    x="766" y="99">Weak</text>
  <text class="det"    x="766" y="115">no such product</text>

  <text class="rowlab" x="24" y="166">Exa</text>
  <rect class="strong" x="176" y="138" width="142" height="52" />
  <text class="lvl-inv" x="190" y="161">Strong</text>
  <text class="det-inv" x="190" y="177">first 10 bundled</text>
  <rect class="med"    x="320" y="138" width="142" height="52" />
  <text class="lvl"    x="334" y="161">Medium</text>
  <text class="det"    x="334" y="177">content type, highlights</text>
  <rect class="med"    x="464" y="138" width="142" height="52" />
  <text class="lvl"    x="478" y="161">Medium</text>
  <text class="det"    x="478" y="177">mid-pack</text>
  <rect class="med"    x="608" y="138" width="142" height="52" />
  <text class="lvl"    x="622" y="161">Medium</text>
  <text class="det"    x="622" y="177">tier per endpoint</text>
  <rect class="strong" x="752" y="138" width="142" height="52" />
  <text class="lvl-inv" x="766" y="161">Strong</text>
  <text class="det-inv" x="766" y="177">Deep Search $12–15</text>

  <text class="rowlab" x="24" y="228">Tavily</text>
  <rect class="strong" x="176" y="200" width="142" height="52" />
  <text class="lvl-inv" x="190" y="223">Strong</text>
  <text class="det-inv" x="190" y="239">advanced fetches pages</text>
  <rect class="med"    x="320" y="200" width="142" height="52" />
  <text class="lvl"    x="334" y="223">Medium</text>
  <text class="det"    x="334" y="239">depth, domain filters</text>
  <rect class="med"    x="464" y="200" width="142" height="52" />
  <text class="lvl"    x="478" y="223">Medium</text>
  <text class="det"    x="478" y="239">mid-pack</text>
  <rect class="weak"   x="608" y="200" width="142" height="52" />
  <text class="lvl"    x="622" y="223">Weak</text>
  <text class="det"    x="622" y="239">4–250 credits a call</text>
  <rect class="med"    x="752" y="200" width="142" height="52" />
  <text class="lvl"    x="766" y="223">Medium</text>
  <text class="det"    x="766" y="239">Research, variable</text>

  <text class="rowlab" x="24" y="290">Parallel</text>
  <rect class="med"    x="176" y="262" width="142" height="52" />
  <text class="lvl"    x="190" y="285">Medium</text>
  <text class="det"    x="190" y="301">excerpts, not pages</text>
  <rect class="med"    x="320" y="262" width="142" height="52" />
  <text class="lvl"    x="334" y="285">Medium</text>
  <text class="det"    x="334" y="301">results × excerpts</text>
  <rect class="weak"   x="464" y="262" width="142" height="52" />
  <text class="lvl"    x="478" y="285">Weak</text>
  <text class="det"    x="478" y="301">Pro slowest measured</text>
  <rect class="med"    x="608" y="262" width="142" height="52" />
  <text class="lvl"    x="622" y="285">Medium</text>
  <text class="det"    x="622" y="301">formula per result</text>
  <rect class="strong" x="752" y="262" width="142" height="52" />
  <text class="lvl-inv" x="766" y="285">Strong</text>
  <text class="det-inv" x="766" y="301">Task API, priced apart</text>

  <rect class="strong" x="176" y="344" width="16" height="14" />
  <text class="sub" x="200" y="356">Strong</text>
  <rect class="med" x="290" y="344" width="16" height="14" />
  <text class="sub" x="314" y="356">Medium</text>
  <rect class="weak" x="410" y="344" width="16" height="14" />
  <text class="sub" x="434" y="356">Weak</text>
  <text class="sub" x="520" y="356">List prices and public figures as of August 2026.</text>
</svg>
