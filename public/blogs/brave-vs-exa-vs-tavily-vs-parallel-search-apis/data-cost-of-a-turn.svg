<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Cost of one research turn by endpoint, split into API charge and token charge</title>
  <desc id="d">Stacked horizontal bars for a turn of three searches over twelve pages. Brave's links-only web search endpoint costs 1.5 cents in API charges but 14.4 cents in tokens once the agent fetches and reads the pages itself, for 15.9 cents total. Brave's LLM Context endpoint at the same list price totals 5.1 cents, Exa's search endpoint 5.7 cents, Parallel's search with excerpts 6.6 cents, and Tavily advanced 8.4 cents. The endpoint with the lowest API charge has the highest total.</desc>
  <style>
    .api    { fill: var(--accent, #d4421e); }
    .tok    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: .75; }
    .grid   { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 3 4; }
    .axis   { stroke: var(--ink); stroke-width: 1; opacity: .4; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .tick   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="head" x="24" y="34">Cost of one research turn — 3 searches, 12 pages read (US cents)</text>

  <line class="axis" x1="300" y1="60" x2="300" y2="352" />
  <line class="grid" x1="440" y1="60" x2="440" y2="352" />
  <line class="grid" x1="580" y1="60" x2="580" y2="352" />
  <line class="grid" x1="720" y1="60" x2="720" y2="352" />
  <line class="grid" x1="860" y1="60" x2="860" y2="352" />

  <text class="label" x="24" y="106">Brave /web/search</text>
  <text class="sub" x="24" y="122">links only — agent reads</text>
  <rect class="api" x="300" y="90" width="52.5" height="34" />
  <rect class="tok" x="352.5" y="90" width="504" height="34" />
  <text class="val" x="866" y="112">15.9</text>

  <text class="label" x="24" y="162">Brave LLM Context</text>
  <text class="sub" x="24" y="178">same list price, chunks</text>
  <rect class="api" x="300" y="146" width="52.5" height="34" />
  <rect class="tok" x="352.5" y="146" width="126" height="34" />
  <text class="val" x="488" y="168">5.1</text>

  <text class="label" x="24" y="218">Exa /search</text>
  <text class="sub" x="24" y="234">contents for first 10 bundled</text>
  <rect class="api" x="300" y="202" width="73.5" height="34" />
  <rect class="tok" x="373.5" y="202" width="126" height="34" />
  <text class="val" x="509" y="224">5.7</text>

  <text class="label" x="24" y="274">Parallel search</text>
  <text class="sub" x="24" y="290">10 results with excerpts</text>
  <rect class="api" x="300" y="258" width="105" height="34" />
  <rect class="tok" x="405" y="258" width="126" height="34" />
  <text class="val" x="541" y="280">6.6</text>

  <text class="label" x="24" y="330">Tavily advanced</text>
  <text class="sub" x="24" y="346">2 credits, pages extracted</text>
  <rect class="api" x="300" y="314" width="168" height="34" />
  <rect class="tok" x="468" y="314" width="126" height="34" />
  <text class="val" x="604" y="336">8.4</text>

  <text class="tick" x="296" y="368">0</text>
  <text class="tick" x="434" y="368">4</text>
  <text class="tick" x="574" y="368">8</text>
  <text class="tick" x="712" y="368">12</text>
  <text class="tick" x="852" y="368">16</text>

  <rect class="api" x="300" y="380" width="16" height="12" />
  <text class="sub" x="324" y="390">API charge</text>
  <rect class="tok" x="430" y="380" width="16" height="12" />
  <text class="sub" x="454" y="390">tokens the agent pays to read what came back</text>
</svg>
