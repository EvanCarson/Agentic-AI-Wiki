<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where each search API stops along the retrieval pipeline</title>
  <desc id="d">A five-stage pipeline runs across the top: rank the index, return snippets, fetch the live pages, extract clean text, and compress into an answer. Below it, four rows show how far each vendor's base endpoint covers that pipeline as a solid bar, and how far a higher-priced endpoint from the same vendor extends as a lighter bar. Brave and Tavily's base endpoints stop after snippets; Exa's base covers extraction; Parallel's base returns excerpts; every vendor sells a longer endpoint at a higher price.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .row    { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; rx: 6; ry: 6; opacity: .5; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="24" y="40">One retrieval pipeline, five stages</text>

  <rect class="box" x="180" y="64" width="136" height="62" />
  <text class="tag" x="194" y="84">STAGE 1</text>
  <text class="label" x="194" y="102">Rank index</text>
  <text class="sub" x="194" y="118">query → URLs</text>

  <rect class="box" x="325" y="64" width="136" height="62" />
  <text class="tag" x="339" y="84">STAGE 2</text>
  <text class="label" x="339" y="102">Snippets</text>
  <text class="sub" x="339" y="118">title + excerpt</text>

  <rect class="box" x="470" y="64" width="136" height="62" />
  <text class="tag" x="484" y="84">STAGE 3</text>
  <text class="label" x="484" y="102">Fetch pages</text>
  <text class="sub" x="484" y="118">live HTTP, bot walls</text>

  <rect class="box" x="615" y="64" width="136" height="62" />
  <text class="tag" x="629" y="84">STAGE 4</text>
  <text class="label" x="629" y="102">Extract</text>
  <text class="sub" x="629" y="118">clean text, chunks</text>

  <rect class="box" x="760" y="64" width="136" height="62" />
  <text class="tag" x="774" y="84">STAGE 5</text>
  <text class="label" x="774" y="102">Compress</text>
  <text class="sub" x="774" y="118">answer / research</text>

  <path class="arrow" d="M 318 95 L 322 95" />
  <path class="arrow" d="M 463 95 L 467 95" />
  <path class="arrow" d="M 608 95 L 612 95" />
  <path class="arrow" d="M 753 95 L 757 95" />

  <rect class="row" x="176" y="164" width="724" height="52" />
  <text class="label" x="24" y="186">Brave</text>
  <text class="sub" x="24" y="204">$5 / 1k, flat</text>
  <rect class="hero" x="180" y="172" width="281" height="36" />
  <text class="label-inv" x="196" y="195">/web/search</text>
  <rect class="adj" x="470" y="172" width="281" height="36" />
  <text class="label" x="486" y="195">LLM Context — same $5 / 1k</text>

  <rect class="row" x="176" y="230" width="724" height="52" />
  <text class="label" x="24" y="252">Exa</text>
  <text class="sub" x="24" y="270">$7 / 1k base</text>
  <rect class="hero" x="180" y="238" width="571" height="36" />
  <text class="label-inv" x="196" y="261">/search — contents for the first 10 bundled</text>
  <rect class="adj" x="760" y="238" width="136" height="36" />
  <text class="label" x="774" y="261">Answer $5</text>

  <rect class="row" x="176" y="296" width="724" height="52" />
  <text class="label" x="24" y="318">Tavily</text>
  <text class="sub" x="24" y="336">1 credit basic</text>
  <rect class="hero" x="180" y="304" width="281" height="36" />
  <text class="label-inv" x="196" y="327">basic — 1 credit</text>
  <rect class="adj" x="470" y="304" width="281" height="36" />
  <text class="label" x="486" y="327">advanced — 2 credits</text>

  <rect class="row" x="176" y="362" width="724" height="52" />
  <text class="label" x="24" y="384">Parallel</text>
  <text class="sub" x="24" y="402">$0.001 + per result</text>
  <rect class="hero" x="180" y="370" width="426" height="36" />
  <text class="label-inv" x="196" y="393">search — results with excerpts</text>
  <rect class="adj" x="615" y="370" width="281" height="36" />
  <text class="label" x="629" y="393">Task API — from $300 / 1k</text>

  <rect class="hero" x="180" y="446" width="18" height="14" />
  <text class="sub" x="206" y="458">base endpoint</text>
  <rect class="adj" x="320" y="446" width="18" height="14" />
  <text class="sub" x="346" y="458">longer endpoint from the same vendor</text>
</svg>
