<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="wct wcd">
  <title id="wct">Three places the same approval policy can be enforced</title>
  <desc id="wcd">Three columns. Matching a shell string requires a parser that must agree with bash and is the location of all nine advisories. Matching an argv vector removes the shell entirely, so there is one reading of the command. Constraining the sandbox enforces effects in the kernel and carries no parsing risk at all.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); }
    .mono-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
  </style>

  <text class="label" x="40" y="32" text-anchor="start">Same policy, three enforcement points</text>

  <rect class="box" x="30" y="56" width="260" height="130" />
  <text class="label" x="160" y="86" text-anchor="middle">Match a shell string</text>
  <text class="mono" x="160" y="112" text-anchor="middle">"git status --short"</text>
  <text class="sub" x="160" y="140" text-anchor="middle">needs a parser that agrees</text>
  <text class="sub" x="160" y="160" text-anchor="middle">with bash on every construct</text>
  <text class="sub" x="160" y="216" text-anchor="middle">parsing risk: all nine CVEs</text>

  <rect class="adj" x="320" y="56" width="260" height="130" />
  <text class="label" x="450" y="86" text-anchor="middle">Match an argv vector</text>
  <text class="mono" x="450" y="112" text-anchor="middle">["git","status","--short"]</text>
  <text class="sub" x="450" y="140" text-anchor="middle">no shell is involved, so there</text>
  <text class="sub" x="450" y="160" text-anchor="middle">is one reading of the command</text>
  <text class="sub" x="450" y="216" text-anchor="middle">parsing risk: none; flags still matter</text>

  <rect class="hero" x="610" y="56" width="260" height="130" />
  <text class="label-inv" x="740" y="86" text-anchor="middle">Constrain the sandbox</text>
  <text class="mono-inv" x="740" y="112" text-anchor="middle">no creds, ro mount, deny egress</text>
  <text class="sub-inv" x="740" y="140" text-anchor="middle">effects enforced by the kernel,</text>
  <text class="sub-inv" x="740" y="160" text-anchor="middle">whatever string gets through</text>
  <text class="sub" x="740" y="216" text-anchor="middle">parsing risk: none at all</text>
</svg>
