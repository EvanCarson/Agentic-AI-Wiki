<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="tpt tpd">
  <title id="tpt">One command string, two parsers, two different commands</title>
  <desc id="tpd">The model proposes a single shell string. The approval gate strips the redirect operator and reads the next word as the command, matching an allowlisted prefix and approving without a prompt. Bash reads the same string as a redirection to a file named echo followed by a denied command, which then runs with the developer's own credentials. Nothing in the path compares the two readings.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .mono-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#tpa); }
    .split  { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="tpa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="hero" x="250" y="34" width="400" height="48" />
  <text class="label-inv" x="450" y="56" text-anchor="middle">The model proposes one string</text>
  <text class="mono-inv" x="450" y="74" text-anchor="middle">&gt;&amp;echo touch /tmp/ROO_PWNED</text>

  <path class="arrow" d="M 390 86 L 250 164" />
  <path class="arrow" d="M 510 86 L 650 164" />

  <rect class="box" x="100" y="170" width="300" height="112" />
  <text class="label" x="250" y="196" text-anchor="middle">Approval gate</text>
  <text class="mono" x="250" y="222" text-anchor="middle">replace(/\d*&gt;&amp;\d*/, "")</text>
  <text class="sub" x="250" y="244" text-anchor="middle">reads the command as</text>
  <text class="mono" x="250" y="266" text-anchor="middle">echo touch /tmp/ROO_PWNED</text>

  <rect class="adj" x="500" y="170" width="300" height="112" />
  <text class="label" x="650" y="196" text-anchor="middle">bash</text>
  <text class="mono" x="650" y="222" text-anchor="middle">&gt;&amp; = redirect both streams</text>
  <text class="sub" x="650" y="244" text-anchor="middle">reads the command as</text>
  <text class="mono" x="650" y="266" text-anchor="middle">touch /tmp/ROO_PWNED</text>

  <path class="split" d="M 450 180 L 450 330" />
  <text class="sub" x="450" y="356" text-anchor="middle">nothing in the path compares the two readings</text>

  <path class="arrow" d="M 250 288 L 250 382" />
  <path class="arrow" d="M 650 288 L 650 382" />

  <rect class="box" x="100" y="388" width="300" height="60" />
  <text class="label" x="250" y="414" text-anchor="middle">verdict: auto_approve</text>
  <text class="sub" x="250" y="434" text-anchor="middle">no prompt is shown to the developer</text>

  <rect class="hero" x="500" y="388" width="300" height="60" />
  <text class="label-inv" x="650" y="414" text-anchor="middle">denied command executes</text>
  <text class="sub-inv" x="650" y="434" text-anchor="middle">with the developer's own credentials</text>
</svg>
