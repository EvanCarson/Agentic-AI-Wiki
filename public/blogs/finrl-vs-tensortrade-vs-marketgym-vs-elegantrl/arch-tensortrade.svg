<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">TensorTrade architecture</title>
  <desc id="d">TensorTrade is composable: data feeds, an exchange abstraction, action schemes, reward schemes, and observers all plug into a TradingEnv at runtime. The environment is data-source agnostic — you assemble the simulation contract rather than inherit one.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .80; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Pluggable component column (left, dashed: you assemble these) -->
  <rect class="bound" x="28" y="44" width="280" height="412" rx="10" />
  <text class="sub" x="168" y="66" text-anchor="middle" font-weight="600">PLUGGABLE COMPONENTS — you choose</text>

  <rect class="box" x="48" y="84" width="240" height="58" rx="8" />
  <text class="label" x="168" y="106" text-anchor="middle" font-weight="700" font-size="13">DataFeed</text>
  <text class="sub" x="168" y="124" text-anchor="middle">CSV · CCXT · Stream — your call</text>

  <rect class="box" x="48" y="156" width="240" height="58" rx="8" />
  <text class="label" x="168" y="178" text-anchor="middle" font-weight="700" font-size="13">Exchange &amp; Instruments</text>
  <text class="sub" x="168" y="196" text-anchor="middle">slippage model · commission model</text>

  <rect class="adj" x="48" y="228" width="240" height="58" rx="8" />
  <text class="label" x="168" y="250" text-anchor="middle" font-weight="700" font-size="13">ActionScheme</text>
  <text class="sub" x="168" y="268" text-anchor="middle">BSH · ManagedRisk · custom</text>

  <rect class="adj" x="48" y="300" width="240" height="58" rx="8" />
  <text class="label" x="168" y="322" text-anchor="middle" font-weight="700" font-size="13">RewardScheme</text>
  <text class="sub" x="168" y="340" text-anchor="middle">RiskAdjusted · SimpleProfit · custom</text>

  <rect class="box" x="48" y="372" width="240" height="58" rx="8" />
  <text class="label" x="168" y="394" text-anchor="middle" font-weight="700" font-size="13">Observer / Renderer</text>
  <text class="sub" x="168" y="412" text-anchor="middle">tensor obs window · matplotlib · screen</text>

  <!-- TradingEnv (hero, in the middle) — composes the pluggables -->
  <rect class="hero" x="328" y="84" width="290" height="346" rx="12" />
  <text class="label-inv" x="473" y="112" text-anchor="middle" font-weight="600" font-size="16">TradingEnv (Gymnasium)</text>
  <text class="sub-inv" x="473" y="130" text-anchor="middle">composes the pluggables you pass in</text>

  <rect class="box" x="350" y="150" width="246" height="64" rx="8" />
  <text class="label" x="473" y="172" text-anchor="middle" font-weight="700" font-size="13">Wallet · Portfolio · Orders</text>
  <text class="sub" x="473" y="190" text-anchor="middle">multi-asset, multi-currency</text>
  <text class="sub" x="473" y="204" text-anchor="middle">order book is your slippage model</text>

  <rect class="box" x="350" y="226" width="246" height="64" rx="8" />
  <text class="label" x="473" y="248" text-anchor="middle" font-weight="700" font-size="13">step() loop</text>
  <text class="sub" x="473" y="266" text-anchor="middle">obs ← Observer</text>
  <text class="sub" x="473" y="280" text-anchor="middle">reward ← RewardScheme(portfolio)</text>

  <rect class="box" x="350" y="302" width="246" height="64" rx="8" />
  <text class="label" x="473" y="324" text-anchor="middle" font-weight="700" font-size="13">action_space</text>
  <text class="sub" x="473" y="342" text-anchor="middle">defined by ActionScheme you passed</text>
  <text class="sub" x="473" y="356" text-anchor="middle">discrete or continuous</text>

  <rect class="adj" x="350" y="378" width="246" height="42" rx="8" />
  <text class="sub" x="473" y="397" text-anchor="middle" font-weight="600">No baked-in finance assumptions</text>
  <text class="sub" x="473" y="412" text-anchor="middle">— you assemble the contract</text>

  <!-- Agent/trainer column (right, dashed) -->
  <rect class="bound" x="638" y="44" width="230" height="412" rx="10" />
  <text class="sub" x="753" y="66" text-anchor="middle" font-weight="600">YOUR AGENT / TRAINER</text>

  <rect class="box" x="658" y="84" width="194" height="62" rx="8" />
  <text class="label" x="755" y="106" text-anchor="middle" font-weight="700" font-size="13">Ray Tune (recommended)</text>
  <text class="sub" x="755" y="124" text-anchor="middle">project's quickstart path</text>
  <text class="sub" x="755" y="138" text-anchor="middle">DQN / PPO / SAC via RLlib</text>

  <rect class="box" x="658" y="160" width="194" height="62" rx="8" />
  <text class="label" x="755" y="182" text-anchor="middle" font-weight="700" font-size="13">SB3 (community)</text>
  <text class="sub" x="755" y="200" text-anchor="middle">env is a Gymnasium env</text>
  <text class="sub" x="755" y="214" text-anchor="middle">so SB3 plugs in directly</text>

  <rect class="adj" x="658" y="236" width="194" height="62" rx="8" />
  <text class="label" x="755" y="258" text-anchor="middle" font-weight="700" font-size="13">Bring your own</text>
  <text class="sub" x="755" y="276" text-anchor="middle">CleanRL · custom PyTorch</text>
  <text class="sub" x="755" y="290" text-anchor="middle">env contract is the only API</text>

  <rect class="box" x="658" y="312" width="194" height="62" rx="8" />
  <text class="label" x="755" y="334" text-anchor="middle" font-weight="700" font-size="13">Backtest</text>
  <text class="sub" x="755" y="352" text-anchor="middle">replay env on test split</text>
  <text class="sub" x="755" y="366" text-anchor="middle">Observer log → notebook</text>

  <!-- Arrows: pluggables → env, env → agent -->
  <line class="arrow" x1="290" y1="113" x2="328" y2="160" />
  <line class="arrow" x1="290" y1="185" x2="328" y2="200" />
  <line class="arrow" x1="290" y1="257" x2="328" y2="328" />
  <line class="arrow" x1="290" y1="329" x2="328" y2="328" />
  <line class="arrow" x1="290" y1="401" x2="328" y2="240" />

  <line class="arrow" x1="618" y1="115" x2="656" y2="115" />
  <line class="arrow" x1="618" y1="191" x2="656" y2="191" />
  <line class="arrow" x1="618" y1="267" x2="656" y2="267" />
  <line class="arrow" x1="618" y1="343" x2="656" y2="343" />
</svg>
