<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Who owns the simulation contract</title>
  <desc id="d">Four-column comparison: FinRL hardcodes finance assumptions inside the env (action shape, cost model, episode); TensorTrade leaves the contract for you to assemble through ActionScheme/RewardScheme plug-ins; ABIDES-Gym derives the contract from a discrete-event LOB simulator; ElegantRL inherits whatever the env plug-in defines and focuses on the algorithm side.</desc>
  <style>
    .chart-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">Who owns the simulation contract</text>

  <!-- Column 1: FinRL — soft (contract baked into env) -->
  <rect class="card-soft" x="10" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="115" y="72">FinRL</text>
  <text class="body-text" x="115" y="100">Library owns it.</text>
  <text class="body-text" x="115" y="116">Action shape, cost</text>
  <text class="body-text" x="115" y="132">bps, reward = ΔPV,</text>
  <text class="body-text" x="115" y="148">episode = one day</text>
  <text class="body-text" x="115" y="164">— all hardcoded.</text>
  <text class="body-text" x="115" y="188">You inherit and</text>
  <text class="body-text" x="115" y="204">override.</text>
  <text class="body-text" x="115" y="236">Trade: convenience</text>
  <text class="body-text" x="115" y="252">for control.</text>

  <!-- Column 2: TensorTrade — accent (you own it) -->
  <rect class="card-accent" x="240" y="44" width="210" height="230" rx="8" />
  <text class="col-head-inv" x="345" y="72">TensorTrade</text>
  <text class="body-text-inv" x="345" y="100">You own it.</text>
  <text class="body-text-inv" x="345" y="116">Pass an Action-</text>
  <text class="body-text-inv" x="345" y="132">Scheme + Reward-</text>
  <text class="body-text-inv" x="345" y="148">Scheme + Exchange</text>
  <text class="body-text-inv" x="345" y="164">+ Slippage model.</text>
  <text class="body-text-inv" x="345" y="188">Env composes them</text>
  <text class="body-text-inv" x="345" y="204">at construction.</text>
  <text class="body-text-inv" x="345" y="236">Trade: assembly</text>
  <text class="body-text-inv" x="345" y="252">cost up front.</text>

  <!-- Column 3: ABIDES-Gym — soft (simulator owns it) -->
  <rect class="card-soft" x="470" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="575" y="72">ABIDES-Gym</text>
  <text class="body-text" x="575" y="100">Simulator owns it.</text>
  <text class="body-text" x="575" y="116">Action = real order</text>
  <text class="body-text" x="575" y="132">type, fills come</text>
  <text class="body-text" x="575" y="148">from queue, latency</text>
  <text class="body-text" x="575" y="164">is modeled.</text>
  <text class="body-text" x="575" y="188">Episode = wall-clock</text>
  <text class="body-text" x="575" y="204">microseconds.</text>
  <text class="body-text" x="575" y="236">Trade: realism vs</text>
  <text class="body-text" x="575" y="252">speed.</text>

  <!-- Column 4: ElegantRL — neutral (env plug-in owns it) -->
  <rect class="card-neutral" x="700" y="44" width="190" height="230" rx="8" />
  <text class="col-head" x="795" y="72">ElegantRL</text>
  <text class="body-text" x="795" y="100">Env plug-in owns it.</text>
  <text class="body-text" x="795" y="116">Trainer is agnostic;</text>
  <text class="body-text" x="795" y="132">finance is just one</text>
  <text class="body-text" x="795" y="148">of many envs.</text>
  <text class="body-text" x="795" y="164">Demos use a vec-</text>
  <text class="body-text" x="795" y="180">torized stock env.</text>
  <text class="body-text" x="795" y="212">Trade: contract</text>
  <text class="body-text" x="795" y="228">depends on which</text>
  <text class="body-text" x="795" y="244">env you bolt on.</text>

</svg>
