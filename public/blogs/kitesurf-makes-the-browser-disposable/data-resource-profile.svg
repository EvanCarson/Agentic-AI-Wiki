<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Kitesurf resource and time profile relative to Chromium</title>
  <desc id="d">Horizontal bar chart with Chromium set to a baseline of one. On common agentic tasks Kitesurf uses roughly one seventh to one third of Chromium's CPU and memory, shown as a range, while taking about one point seven times as long in wall-clock time.</desc>
  <style>
    .bar-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .bar-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .bar-mute { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .grid     { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 3 4; }
    .axis     { stroke: var(--ink); stroke-width: 1.25; opacity: .5; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .group    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .key      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .val      { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val-inv  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); }
    .tick     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .55; }
    .note     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="chart-title" x="30" y="32">Relative to Chromium at 1.0 — common agentic tasks</text>

  <line class="grid" x1="440" y1="48" x2="440" y2="322" />
  <line class="grid" x1="580" y1="48" x2="580" y2="322" />
  <line class="grid" x1="720" y1="48" x2="720" y2="322" />

  <text class="group" x="30" y="60">CPU AND MEMORY</text>

  <text class="key" x="30" y="84">Chromium in a container</text>
  <rect class="bar-mute" x="300" y="66" width="140" height="30" rx="4" />
  <text class="val" x="452" y="87">1.0×</text>

  <text class="key" x="30" y="126">Kitesurf in an isolate</text>
  <rect class="bar-hero" x="300" y="108" width="47" height="30" rx="4" />
  <rect class="bar-adj" x="347" y="108" width="20" height="30" rx="4" />
  <text class="val" x="379" y="129">0.14× – 0.33×</text>

  <text class="group" x="30" y="176">WALL-CLOCK TIME TO FINISH</text>

  <text class="key" x="30" y="200">Chromium in a container</text>
  <rect class="bar-mute" x="300" y="182" width="140" height="30" rx="4" />
  <text class="val" x="452" y="203">1.0×</text>

  <text class="key" x="30" y="242">Kitesurf in an isolate</text>
  <rect class="bar-adj" x="300" y="224" width="238" height="30" rx="4" />
  <text class="val" x="550" y="245">1.7×</text>

  <text class="group" x="30" y="292">WEB PLATFORM TESTS PASSING</text>

  <text class="key" x="30" y="316">Kitesurf, DOM subtests</text>
  <rect class="bar-hero" x="300" y="298" width="408" height="30" rx="4" />
  <text class="val-inv" x="694" y="319" text-anchor="end">~97%</text>

  <line class="axis" x1="300" y1="344" x2="720" y2="344" />
  <text class="tick" x="300" y="362">0</text>
  <text class="tick" x="440" y="362">1.0×</text>
  <text class="tick" x="580" y="362">1.5×</text>
  <text class="tick" x="720" y="362" text-anchor="end">2.0×</text>

  <text class="note" x="30" y="386">CLOUDFLARE-REPORTED FIGURES, AUGUST 2026. THE THIRD GROUP IS A CONFORMANCE RATE, NOT A RATIO — SEE THE COMPATIBILITY SECTION</text>
</svg>
