<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Pooled browser containers versus one disposable isolate per task</title>
  <desc id="d">Two architectures side by side. On the left, three tasks are routed through a pool of two warm Chromium containers, so cookies, storage and injected page state carry from one task into the next and across tenants. On the right, each task gets its own V8 isolate that is created at task start and destroyed at task end, so no state survives between tasks.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pane   { fill: none; stroke: var(--ink); stroke-width: 1.25; opacity: .35; rx: 10; ry: 10; stroke-dasharray: 5 5; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .leak   { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.75; marker-end: url(#arrA); stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent, #d4421e)" />
    </marker>
  </defs>

  <rect class="pane" x="20" y="20" width="418" height="460" />
  <text class="head" x="40" y="48">Pooled containers — starting is expensive</text>

  <rect class="box" x="40" y="70" width="110" height="38" />
  <text class="label" x="60" y="94">Task A</text>
  <rect class="box" x="40" y="120" width="110" height="38" />
  <text class="label" x="60" y="144">Task B</text>
  <rect class="box" x="40" y="170" width="110" height="38" />
  <text class="label" x="60" y="194">Task C</text>

  <path class="arrow" d="M 152 89 L 246 150" />
  <path class="arrow" d="M 152 139 L 246 158" />
  <path class="arrow" d="M 152 189 L 246 244" />

  <rect class="adj" x="248" y="132" width="170" height="52" />
  <text class="label" x="266" y="154">Chromium #1</text>
  <text class="sub" x="266" y="172">warm, reused</text>

  <rect class="adj" x="248" y="226" width="170" height="52" />
  <text class="label" x="266" y="248">Chromium #2</text>
  <text class="sub" x="266" y="266">warm, reused</text>

  <path class="leak" d="M 333 186 L 333 222" />
  <text class="tag" x="344" y="209">STATE CARRIES</text>

  <rect class="hero" x="248" y="310" width="170" height="88" />
  <text class="label-inv" x="266" y="336">Shared context</text>
  <text class="label-inv" x="266" y="356">cookies · storage</text>
  <text class="label-inv" x="266" y="376">service workers</text>

  <path class="leak" d="M 333 282 L 333 306" />

  <text class="sub" x="40" y="428">The pool exists to amortise a hundreds-of-milliseconds</text>
  <text class="sub" x="40" y="446">start cost. It is also the boundary between two tenants,</text>
  <text class="sub" x="40" y="464">and between a poisoned page and the next task.</text>

  <rect class="pane" x="462" y="20" width="418" height="460" />
  <text class="head" x="482" y="48">One isolate per task — starting is free</text>

  <rect class="box" x="482" y="70" width="110" height="38" />
  <text class="label" x="502" y="94">Task A</text>
  <rect class="box" x="482" y="150" width="110" height="38" />
  <text class="label" x="502" y="174">Task B</text>
  <rect class="box" x="482" y="230" width="110" height="38" />
  <text class="label" x="502" y="254">Task C</text>

  <path class="arrow" d="M 594 89 L 686 89" />
  <path class="arrow" d="M 594 169 L 686 169" />
  <path class="arrow" d="M 594 249 L 686 249" />

  <rect class="hero" x="688" y="70" width="172" height="38" />
  <text class="label-inv" x="706" y="94">Isolate — destroyed</text>
  <rect class="hero" x="688" y="150" width="172" height="38" />
  <text class="label-inv" x="706" y="174">Isolate — destroyed</text>
  <rect class="hero" x="688" y="230" width="172" height="38" />
  <text class="label-inv" x="706" y="254">Isolate — destroyed</text>

  <rect class="box" x="688" y="310" width="172" height="88" />
  <text class="label" x="706" y="336">No shared context</text>
  <text class="sub" x="706" y="356">nothing to inherit,</text>
  <text class="sub" x="706" y="376">nothing to clean up</text>

  <text class="sub" x="482" y="428">Single-digit-millisecond start, memory only while</text>
  <text class="sub" x="482" y="446">running, billed on CPU rather than residency — so</text>
  <text class="sub" x="482" y="464">a fresh browser per task is the cheap option.</text>
</svg>
