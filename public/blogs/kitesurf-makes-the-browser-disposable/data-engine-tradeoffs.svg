<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Chromium in a container versus Kitesurf in an isolate across six axes</title>
  <desc id="d">Feature matrix with two rows and six columns. Chromium is strong on real-site long-tail compatibility, wall-clock speed and fingerprint predictability, weak on CPU and memory cost and on per-task disposability. Kitesurf is strong on CPU and memory cost and on per-task disposability, medium on spec conformance and wall-clock speed, weak on real-site long-tail compatibility, with fingerprint predictability unknown.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 5; ry: 5; }
    .medium { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 5; ry: 5; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 5; ry: 5; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .colhead { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .rowhead { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .key     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .note    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="chart-title" x="30" y="32">Where each engine is strong — same script, different risks</text>

  <text class="colhead" x="222" y="72" text-anchor="middle">CPU + MEM</text>
  <text class="colhead" x="332" y="72" text-anchor="middle">WALL TIME</text>
  <text class="colhead" x="442" y="72" text-anchor="middle">SPEC TESTS</text>
  <text class="colhead" x="552" y="72" text-anchor="middle">REAL SITES</text>
  <text class="colhead" x="662" y="72" text-anchor="middle">DISPOSABLE</text>
  <text class="colhead" x="772" y="72" text-anchor="middle">FINGERPRINT</text>

  <text class="rowhead" x="30" y="118">Chromium, container</text>
  <rect class="weak"   x="170" y="88" width="104" height="46" />
  <text class="cell"     x="222" y="116" text-anchor="middle">Heavy</text>
  <rect class="strong" x="280" y="88" width="104" height="46" />
  <text class="cell-inv" x="332" y="116" text-anchor="middle">Fastest</text>
  <rect class="strong" x="390" y="88" width="104" height="46" />
  <text class="cell-inv" x="442" y="116" text-anchor="middle">Reference</text>
  <rect class="strong" x="500" y="88" width="104" height="46" />
  <text class="cell-inv" x="552" y="116" text-anchor="middle">Battle-tested</text>
  <rect class="weak"   x="610" y="88" width="104" height="46" />
  <text class="cell"     x="662" y="116" text-anchor="middle">Pooled</text>
  <rect class="medium" x="720" y="88" width="104" height="46" />
  <text class="cell"     x="772" y="116" text-anchor="middle">Known</text>

  <text class="rowhead" x="30" y="188">Kitesurf, isolate</text>
  <rect class="strong" x="170" y="158" width="104" height="46" />
  <text class="cell-inv" x="222" y="186" text-anchor="middle">3–7× lower</text>
  <rect class="medium" x="280" y="158" width="104" height="46" />
  <text class="cell"     x="332" y="186" text-anchor="middle">1.7× slower</text>
  <rect class="medium" x="390" y="158" width="104" height="46" />
  <text class="cell"     x="442" y="186" text-anchor="middle">~97% DOM</text>
  <rect class="weak"   x="500" y="158" width="104" height="46" />
  <text class="cell"     x="552" y="186" text-anchor="middle">Unproven tail</text>
  <rect class="strong" x="610" y="158" width="104" height="46" />
  <text class="cell-inv" x="662" y="186" text-anchor="middle">Per task</text>
  <rect class="weak"   x="720" y="158" width="104" height="46" />
  <text class="cell"     x="772" y="186" text-anchor="middle">Unknown</text>

  <rect class="strong" x="30" y="248" width="18" height="18" />
  <text class="key" x="56" y="262">STRONG</text>
  <rect class="medium" x="150" y="248" width="18" height="18" />
  <text class="key" x="176" y="262">MEDIUM</text>
  <rect class="weak" x="270" y="248" width="18" height="18" />
  <text class="key" x="296" y="262">WEAK OR UNKNOWN</text>

  <text class="note" x="30" y="312">SPEC TESTS IS A WEB PLATFORM TESTS SUBTEST PASS RATE. REAL SITES IS A PER-TARGET FAILURE RATE, WHICH THE FIRST DOES NOT PREDICT</text>
  <text class="note" x="30" y="332">FINGERPRINT: A NON-CHROMIUM ENGINE IS NOT NECESSARILY WORSE AGAINST BOT DETECTION — IT IS UNMEASURED, AND MEASURABLE PER TARGET</text>
  <text class="note" x="30" y="352">BOTH ENGINES SPEAK CDP, SO THE SAME PLAYWRIGHT SCRIPT RUNS ON EITHER — WHICH IS WHY THIS IS A PER-TARGET ROUTING DECISION</text>
</svg>
