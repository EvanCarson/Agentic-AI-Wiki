<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="trT trD">
  <title id="trT">Three responses to a ten-hour intrusion, and what each one actually buys</title>
  <desc id="trD">Three columns. Pre-authorised containment lets a defined signal revoke credentials, freeze pipelines and cut egress without a human decision chain; it removes the meeting from the critical path but risks a false containment. Ending standing master credentials shortens the privilege chain itself so a stolen token expires before it is useful; it is slow to implement and breaks brittle automation. Buying a better detector adds another content classifier at the front; it does not change the response clock, which is the constraint that this intrusion exposed.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Where the ten hours actually lands</text>

  <rect class="hero" x="35" y="44" width="250" height="180" />
  <text class="hd-inv" x="160" y="76" text-anchor="middle">Pre-authorised containment</text>
  <text class="cell-inv" x="160" y="110" text-anchor="middle">A defined signal revokes tokens,</text>
  <text class="cell-inv" x="160" y="128" text-anchor="middle">freezes pipelines and cuts egress</text>
  <text class="cell-inv" x="160" y="146" text-anchor="middle">without waiting for a decision.</text>
  <text class="cell-inv" x="160" y="176" text-anchor="middle">Removes: the human decision</text>
  <text class="cell-inv" x="160" y="194" text-anchor="middle">chain from the critical path.</text>
  <text class="sub" x="160" y="248" text-anchor="middle">Costs: a false containment, sometimes.</text>
  <text class="sub" x="160" y="266" text-anchor="middle">Needs a rehearsed rollback.</text>

  <rect class="adj" x="325" y="44" width="250" height="180" />
  <text class="hd" x="450" y="76" text-anchor="middle">No standing master keys</text>
  <text class="cell" x="450" y="110" text-anchor="middle">Short-lived, scoped credentials,</text>
  <text class="cell" x="450" y="128" text-anchor="middle">so a token harvested at hour two</text>
  <text class="cell" x="450" y="146" text-anchor="middle">has expired by hour four.</text>
  <text class="cell" x="450" y="176" text-anchor="middle">Removes: links from the</text>
  <text class="cell" x="450" y="194" text-anchor="middle">privilege chain itself.</text>
  <text class="sub" x="450" y="248" text-anchor="middle">Costs: quarters, not sprints.</text>
  <text class="sub" x="450" y="266" text-anchor="middle">Breaks brittle automation first.</text>

  <rect class="box" x="625" y="44" width="250" height="180" />
  <text class="hd" x="750" y="76" text-anchor="middle">Another detector</text>
  <text class="cell" x="750" y="110" text-anchor="middle">One more classifier in front of</text>
  <text class="cell" x="750" y="128" text-anchor="middle">the same alert queue, read by</text>
  <text class="cell" x="750" y="146" text-anchor="middle">the same on-call rotation.</text>
  <text class="cell" x="750" y="176" text-anchor="middle">Removes: some fraction of</text>
  <text class="cell" x="750" y="194" text-anchor="middle">initial access attempts.</text>
  <text class="sub" x="750" y="248" text-anchor="middle">Does not move the response clock.</text>
  <text class="sub" x="750" y="266" text-anchor="middle">The clock is the constraint here.</text>
</svg>
