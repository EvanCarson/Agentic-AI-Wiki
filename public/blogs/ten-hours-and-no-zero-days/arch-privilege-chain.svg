<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="pcT pcD">
  <title id="pcT">The privilege chain the agents walked, stage by stage</title>
  <desc id="pcD">A left-to-right chain of six stages. Initial access leads to source repositories, where sub-agents harvest hard-coded tokens and service passwords. Those reach the secrets management system, from which master administrative credentials are taken. Those authorise unauthorised CI/CD builds, which yield cloud access keys, which grant master keys to the victim's cloud AI infrastructure — reused as post-compromise infrastructure. A band beneath the chain notes that every link is an authorised use of a standing credential, that more than fifty documented ATT and CK techniques were used, and that no zero-day exploit appears anywhere in the chain.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .band   { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .9; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#pcArr); }
  </style>
  <defs>
    <marker id="pcArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="20">Six links, every one an authorised use of a standing credential</text>

  <rect class="box" x="0" y="52" width="132" height="86" />
  <text class="hd" x="66" y="82" text-anchor="middle">Initial access</text>
  <text class="cell" x="66" y="104" text-anchor="middle">No zero-day.</text>
  <text class="cell" x="66" y="120" text-anchor="middle">Known technique.</text>

  <path class="arrow" d="M 136 95 L 168 95" />

  <rect class="adj" x="172" y="52" width="146" height="86" />
  <text class="hd" x="245" y="82" text-anchor="middle">Source repositories</text>
  <text class="cell" x="245" y="104" text-anchor="middle">Sub-agents harvest</text>
  <text class="cell" x="245" y="120" text-anchor="middle">hard-coded tokens.</text>

  <path class="arrow" d="M 322 95 L 354 95" />

  <rect class="adj" x="358" y="52" width="146" height="86" />
  <text class="hd" x="431" y="82" text-anchor="middle">Secrets manager</text>
  <text class="cell" x="431" y="104" text-anchor="middle">Master administrative</text>
  <text class="cell" x="431" y="120" text-anchor="middle">credentials taken.</text>

  <path class="arrow" d="M 508 95 L 540 95" />

  <rect class="adj" x="544" y="52" width="146" height="86" />
  <text class="hd" x="617" y="82" text-anchor="middle">CI/CD pipeline</text>
  <text class="cell" x="617" y="104" text-anchor="middle">Unauthorised builds</text>
  <text class="cell" x="617" y="120" text-anchor="middle">trigger; keys emitted.</text>

  <path class="arrow" d="M 694 95 L 726 95" />

  <rect class="hero" x="730" y="52" width="170" height="86" />
  <text class="hd-inv" x="815" y="82" text-anchor="middle">Cloud AI infrastructure</text>
  <text class="cell-inv" x="815" y="104" text-anchor="middle">Master keys claimed;</text>
  <text class="cell-inv" x="815" y="120" text-anchor="middle">reused to mask activity.</text>

  <path class="arrow" d="M 66 142 L 66 196" />
  <path class="arrow" d="M 245 142 L 245 196" />
  <path class="arrow" d="M 431 142 L 431 196" />
  <path class="arrow" d="M 617 142 L 617 196" />
  <path class="arrow" d="M 815 142 L 815 196" />

  <rect class="band" x="0" y="200" width="900" height="62" />
  <text class="hd" x="20" y="228">What fired in the SOC at each link</text>
  <text class="cell" x="20" y="250">Nothing that distinguished it from ordinary automation: a credential in use is a credential in use, and a pipeline build is a pipeline build.</text>

  <rect class="band" x="0" y="284" width="437" height="96" />
  <text class="hd" x="20" y="312">What the attacker supplied</text>
  <text class="cell" x="20" y="334">Frontier models plus attack-specific agentic frameworks,</text>
  <text class="cell" x="20" y="352">monitoring, evaluating, acting and re-planning in real time.</text>
  <text class="cell" x="20" y="370">More than fifty documented ATT&amp;CK techniques.</text>

  <rect class="band" x="463" y="284" width="437" height="96" />
  <text class="hd" x="483" y="312">What the attacker did not need</text>
  <text class="cell" x="483" y="334">A zero-day. Novel malware. Elite tradecraft.</text>
  <text class="cell" x="483" y="352">A privilege the environment did not already grant</text>
  <text class="cell" x="483" y="370">to somebody, standing, all the time.</text>

  <rect class="hero" x="0" y="404" width="900" height="76" />
  <text class="hd-inv" x="24" y="434">Elapsed: under ten hours from initial access to impact</text>
  <text class="cell-inv" x="24" y="458">Unit 42 estimates the same chain would take a coordinated human red team roughly two weeks. The techniques did not change. The clock did.</text>
</svg>
