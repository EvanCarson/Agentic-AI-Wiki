<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="icT icD">
  <title id="icT">Hours from initial access to full compromise</title>
  <desc id="icD">A horizontal bar chart on a scale of zero to 360 hours. A coordinated human red team performing the same work is estimated by Unit 42 at roughly two weeks, about 336 hours, drawn as the longest bar. A twenty-four hour containment target, shown as a reader's own variable rather than a measured figure, is a short bar of 24 hours. The observed intrusion is under ten hours, the shortest bar and highlighted in the accent colour. The chart shows that the attacker's clock now runs shorter than a common containment target.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .row   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .rows  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .axis  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .55; }
    .val   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .valA  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--accent, #d4421e); }
    .note  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .lead  { fill: var(--accent, #d4421e); }
    .mid   { fill: var(--accent-soft); stroke: var(--border-soft); stroke-width: 1; }
    .trail { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; }
    .grid  { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>

  <text class="ttl" x="0" y="22">Hours from initial access to full compromise</text>

  <line class="grid" x1="440" y1="52" x2="440" y2="300" />
  <line class="grid" x1="580" y1="52" x2="580" y2="300" />
  <line class="grid" x1="720" y1="52" x2="720" y2="300" />
  <line class="grid" x1="860" y1="52" x2="860" y2="300" />

  <text class="row"  x="285" y="88"  text-anchor="end">Coordinated human red team</text>
  <text class="rows" x="285" y="106" text-anchor="end">Unit 42's estimate for the same work</text>
  <rect class="trail" x="300" y="70" width="523" height="44" rx="4" />
  <text class="val"  x="838" y="98">≈336h</text>

  <text class="row"  x="285" y="168" text-anchor="end">A 24-hour containment target</text>
  <text class="rows" x="285" y="186" text-anchor="end">your variable, not a measured figure</text>
  <rect class="mid" x="300" y="150" width="37" height="44" rx="4" />
  <text class="val"  x="349" y="178">24h</text>

  <text class="row"  x="285" y="248" text-anchor="end">The observed intrusion</text>
  <text class="rows" x="285" y="266" text-anchor="end">agent-executed, no zero-day</text>
  <rect class="lead" x="300" y="230" width="16" height="44" rx="4" />
  <text class="valA" x="328" y="258">&lt;10h</text>

  <line class="grid" x1="300" y1="300" x2="860" y2="300" />
  <text class="axis" x="300" y="320" text-anchor="middle">0</text>
  <text class="axis" x="440" y="320" text-anchor="middle">90</text>
  <text class="axis" x="580" y="320" text-anchor="middle">180</text>
  <text class="axis" x="720" y="320" text-anchor="middle">270</text>
  <text class="axis" x="860" y="320" text-anchor="middle">360 hours</text>

  <text class="note" x="0" y="358">The two measured bars come from the Unit 42 investigation: the intrusion ran in under ten hours, against an estimate of roughly two weeks</text>
  <text class="note" x="0" y="376">for a coordinated human team doing the same work. The middle bar is a target you set, drawn to scale for comparison.</text>
</svg>
