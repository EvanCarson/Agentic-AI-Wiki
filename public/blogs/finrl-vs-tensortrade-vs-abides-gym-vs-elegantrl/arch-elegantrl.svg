<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">ElegantRL architecture</title>
  <desc id="d">ElegantRL is an RL engineering library first: thousands of vectorized environments on a single GPU through Isaac-Gym-style parallel sim, an Actor/Critic agent in PyTorch, and an Evaluator-driven training loop. Finance is one of many application domains; the trading env is a plug-in like any other.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .80; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- GPU compute box (hero) — massively parallel envs -->
  <rect class="hero" x="40" y="50" width="500" height="400" rx="12" />
  <text class="label-inv" x="290" y="78" text-anchor="middle" font-weight="600" font-size="16">Single GPU — massively parallel rollouts</text>
  <text class="sub-inv" x="290" y="96" text-anchor="middle">VecEnv on device tensors · 4 k – 16 k envs at once</text>

  <!-- Grid of parallel envs -->
  <g>
    <rect class="adj" x="62" y="118" width="60" height="46" rx="6" />
    <rect class="adj" x="128" y="118" width="60" height="46" rx="6" />
    <rect class="adj" x="194" y="118" width="60" height="46" rx="6" />
    <rect class="adj" x="260" y="118" width="60" height="46" rx="6" />
    <rect class="adj" x="326" y="118" width="60" height="46" rx="6" />
    <rect class="adj" x="392" y="118" width="60" height="46" rx="6" />
    <rect class="adj" x="458" y="118" width="60" height="46" rx="6" />

    <rect class="adj" x="62" y="170" width="60" height="46" rx="6" opacity="0.85" />
    <rect class="adj" x="128" y="170" width="60" height="46" rx="6" opacity="0.85" />
    <rect class="adj" x="194" y="170" width="60" height="46" rx="6" opacity="0.85" />
    <rect class="adj" x="260" y="170" width="60" height="46" rx="6" opacity="0.85" />
    <rect class="adj" x="326" y="170" width="60" height="46" rx="6" opacity="0.85" />
    <rect class="adj" x="392" y="170" width="60" height="46" rx="6" opacity="0.85" />
    <rect class="adj" x="458" y="170" width="60" height="46" rx="6" opacity="0.85" />

    <rect class="adj" x="62" y="222" width="60" height="46" rx="6" opacity="0.7" />
    <rect class="adj" x="128" y="222" width="60" height="46" rx="6" opacity="0.7" />
    <rect class="adj" x="194" y="222" width="60" height="46" rx="6" opacity="0.7" />
    <rect class="adj" x="260" y="222" width="60" height="46" rx="6" opacity="0.7" />
    <rect class="adj" x="326" y="222" width="60" height="46" rx="6" opacity="0.7" />
    <rect class="adj" x="392" y="222" width="60" height="46" rx="6" opacity="0.7" />
    <rect class="adj" x="458" y="222" width="60" height="46" rx="6" opacity="0.7" />
  </g>
  <text class="label-inv" x="290" y="146" text-anchor="middle" font-weight="700" font-size="13">env</text>
  <text class="label-inv" x="290" y="198" text-anchor="middle" font-weight="700" font-size="13">env</text>
  <text class="label-inv" x="290" y="250" text-anchor="middle" font-weight="700" font-size="13">env</text>

  <!-- Replay buffer / rollout tensor -->
  <rect class="box" x="62" y="290" width="456" height="56" rx="8" />
  <text class="label" x="290" y="312" text-anchor="middle" font-weight="700">Replay / rollout buffer (on GPU)</text>
  <text class="sub" x="290" y="330" text-anchor="middle">(states, actions, rewards) — one batched tensor, no CPU copy</text>

  <!-- Agent: Actor / Critic -->
  <rect class="box" x="62" y="358" width="218" height="80" rx="8" />
  <text class="label" x="171" y="380" text-anchor="middle" font-weight="700">Actor network</text>
  <text class="sub" x="171" y="398" text-anchor="middle">PPO · SAC · TD3 · DDPG · A2C · DQN</text>
  <text class="sub" x="171" y="414" text-anchor="middle">DoubleDQN · D3QN · REDQ</text>
  <text class="sub" x="171" y="430" text-anchor="middle">all share an Agent.update_net contract</text>

  <rect class="box" x="298" y="358" width="220" height="80" rx="8" />
  <text class="label" x="408" y="380" text-anchor="middle" font-weight="700">Critic network (twin Q)</text>
  <text class="sub" x="408" y="398" text-anchor="middle">PyTorch nn.Module</text>
  <text class="sub" x="408" y="414" text-anchor="middle">target nets, KL leash, GAE</text>
  <text class="sub" x="408" y="430" text-anchor="middle">— RL engineering primitives</text>

  <!-- Outside box: env plug-in slot (right) -->
  <rect class="bound" x="560" y="44" width="302" height="412" rx="10" />
  <text class="sub" x="711" y="66" text-anchor="middle" font-weight="600">ENV PLUG-IN — finance is one of many</text>

  <rect class="box" x="580" y="84" width="266" height="68" rx="8" />
  <text class="label" x="713" y="106" text-anchor="middle" font-weight="700" font-size="13">Isaac Gym tasks</text>
  <text class="sub" x="713" y="124" text-anchor="middle">robotics / control — designed for this</text>
  <text class="sub" x="713" y="140" text-anchor="middle">vectorized on the GPU</text>

  <rect class="adj" x="580" y="166" width="266" height="80" rx="8" />
  <text class="label" x="713" y="190" text-anchor="middle" font-weight="700" font-size="13">FinRL-Meta StockTradingEnv</text>
  <text class="sub" x="713" y="208" text-anchor="middle">vectorized stock env on the GPU</text>
  <text class="sub" x="713" y="224" text-anchor="middle">share-price tensor instead of robot state</text>
  <text class="sub" x="713" y="240" text-anchor="middle">Stock_NeurIPS2018 demos shipped</text>

  <rect class="box" x="580" y="260" width="266" height="68" rx="8" />
  <text class="label" x="713" y="282" text-anchor="middle" font-weight="700" font-size="13">Atari / MuJoCo / custom</text>
  <text class="sub" x="713" y="300" text-anchor="middle">same Agent.train works unchanged</text>
  <text class="sub" x="713" y="316" text-anchor="middle">env contract = (obs, reward, done)</text>

  <rect class="adj" x="580" y="342" width="266" height="100" rx="8" />
  <text class="label" x="713" y="366" text-anchor="middle" font-weight="700" font-size="13">Evaluator + Worker (Podracer)</text>
  <text class="sub" x="713" y="384" text-anchor="middle">cloud-native scale-out for cluster training</text>
  <text class="sub" x="713" y="400" text-anchor="middle">tournament ensemble of pods on K8s</text>
  <text class="sub" x="713" y="416" text-anchor="middle">checkpoint elasticity + leaderboard</text>
  <text class="sub" x="713" y="432" text-anchor="middle">— hundreds of GPUs if you have them</text>

  <!-- Arrows: envs → buffer, buffer → networks -->
  <line class="arrow" x1="290" y1="270" x2="290" y2="288" />
  <line class="arrow" x1="290" y1="348" x2="171" y2="356" />
  <line class="arrow" x1="290" y1="348" x2="408" y2="356" />
  <!-- Env-plug-in slot feeds the rollouts inside the GPU box -->
  <line class="arrow" x1="558" y1="118" x2="522" y2="142" />
  <line class="arrow" x1="558" y1="206" x2="522" y2="194" />
</svg>
