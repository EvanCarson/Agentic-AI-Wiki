<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">RL machinery — first-class algorithms and trainer integration</title>
  <desc id="d">Four-column comparison: FinRL wraps Stable-Baselines3/RLlib/ElegantRL behind a DRLAgent facade; TensorTrade leans on Ray RLlib and supports any Gymnasium-compatible trainer; ABIDES-Gym is a Gym wrapper so trainer choice is yours; ElegantRL ships its own PyTorch implementations of PPO/SAC/A2C/TD3 designed for massively parallel rollouts.</desc>
  <style>
    .chart-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">RL machinery — first-class algorithms and trainer integration</text>

  <!-- Column 1: FinRL — soft (facade over external trainers) -->
  <rect class="card-soft" x="10" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="115" y="72">FinRL</text>
  <text class="body-text" x="115" y="100">DRLAgent facade.</text>
  <text class="body-text" x="115" y="116">Wraps SB3, RLlib,</text>
  <text class="body-text" x="115" y="132">or ElegantRL via</text>
  <text class="body-text" x="115" y="148">a shared train() /</text>
  <text class="body-text" x="115" y="164">predict() API.</text>
  <text class="body-text" x="115" y="196">First class: PPO,</text>
  <text class="body-text" x="115" y="212">A2C, SAC, TD3,</text>
  <text class="body-text" x="115" y="228">DDPG (single-asset</text>
  <text class="body-text" x="115" y="244">+ multi-asset).</text>

  <!-- Column 2: TensorTrade — neutral (any Gym trainer) -->
  <rect class="card-neutral" x="240" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="345" y="72">TensorTrade</text>
  <text class="body-text" x="345" y="100">No bundled trainer.</text>
  <text class="body-text" x="345" y="116">Env is Gymnasium-</text>
  <text class="body-text" x="345" y="132">compliant; SB3,</text>
  <text class="body-text" x="345" y="148">RLlib, CleanRL all</text>
  <text class="body-text" x="345" y="164">work unchanged.</text>
  <text class="body-text" x="345" y="196">Tutorials lean on</text>
  <text class="body-text" x="345" y="212">Ray Tune + RLlib</text>
  <text class="body-text" x="345" y="228">for hyper-param</text>
  <text class="body-text" x="345" y="244">search.</text>

  <!-- Column 3: ABIDES-Gym — neutral (Gym wrapper) -->
  <rect class="card-neutral" x="470" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="575" y="72">ABIDES-Gym</text>
  <text class="body-text" x="575" y="100">Just a Gym wrapper</text>
  <text class="body-text" x="575" y="116">on the simulator.</text>
  <text class="body-text" x="575" y="132">Trainer = your call.</text>
  <text class="body-text" x="575" y="164">Hits a single-thread</text>
  <text class="body-text" x="575" y="180">discrete-event loop,</text>
  <text class="body-text" x="575" y="196">so vec-env parallel</text>
  <text class="body-text" x="575" y="212">is process-level,</text>
  <text class="body-text" x="575" y="228">not on-device.</text>
  <text class="body-text" x="575" y="252">SB3/RLlib typical.</text>

  <!-- Column 4: ElegantRL — accent (its own engine) -->
  <rect class="card-accent" x="700" y="44" width="190" height="230" rx="8" />
  <text class="col-head-inv" x="795" y="72">ElegantRL</text>
  <text class="body-text-inv" x="795" y="100">Its own PyTorch</text>
  <text class="body-text-inv" x="795" y="116">implementations.</text>
  <text class="body-text-inv" x="795" y="132">PPO, SAC, TD3,</text>
  <text class="body-text-inv" x="795" y="148">A2C, DDPG, DQN,</text>
  <text class="body-text-inv" x="795" y="164">D3QN, REDQ.</text>
  <text class="body-text-inv" x="795" y="196">Built for vectorized</text>
  <text class="body-text-inv" x="795" y="212">GPU rollouts and</text>
  <text class="body-text-inv" x="795" y="228">multi-pod tournament</text>
  <text class="body-text-inv" x="795" y="244">ensembles.</text>

</svg>
