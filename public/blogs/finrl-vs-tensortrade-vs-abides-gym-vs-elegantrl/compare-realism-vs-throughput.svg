<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Realism vs throughput — what each library trades</title>
  <desc id="d">Four-column comparison: FinRL uses OHLCV bars and fills at close — fast but coarse; TensorTrade lets the user pick fidelity by exchange plug-in; ABIDES-Gym simulates a tick-by-tick LOB with realistic latency — high fidelity, slowest; ElegantRL hits the highest training throughput by running thousands of envs on a GPU but its trading env is OHLCV-shaped, not microstructure-aware.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">Realism vs throughput — what each library trades</text>

  <!-- Column 1: FinRL — neutral (low realism, decent throughput) -->
  <rect class="card-neutral" x="10" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="115" y="72">FinRL</text>
  <text class="body-text" x="115" y="100">Daily/minute OHLCV.</text>
  <text class="body-text" x="115" y="116">Fills at close price.</text>
  <text class="body-text" x="115" y="132">No market impact,</text>
  <text class="body-text" x="115" y="148">no queue position.</text>
  <text class="body-text" x="115" y="180">Throughput: fast</text>
  <text class="body-text" x="115" y="196">enough for daily-bar</text>
  <text class="body-text" x="115" y="212">portfolio research,</text>
  <text class="body-text" x="115" y="228">slow for intra-day.</text>
  <text class="body-text" x="115" y="252">Fidelity: lowest.</text>

  <!-- Column 2: TensorTrade — soft (you pick) -->
  <rect class="card-soft" x="240" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="345" y="72">TensorTrade</text>
  <text class="body-text" x="345" y="100">You pick: pass an</text>
  <text class="body-text" x="345" y="116">Exchange + slippage</text>
  <text class="body-text" x="345" y="132">model with the</text>
  <text class="body-text" x="345" y="148">fidelity you need.</text>
  <text class="body-text" x="345" y="180">Default: OHLCV +</text>
  <text class="body-text" x="345" y="196">commission %.</text>
  <text class="body-text" x="345" y="212">Real-broker plug-ins</text>
  <text class="body-text" x="345" y="228">exist for live mode.</text>
  <text class="body-text" x="345" y="252">Fidelity: bounded</text>
  <text class="body-text" x="345" y="268">by the plug-in.</text>

  <!-- Column 3: ABIDES-Gym — accent (highest fidelity) -->
  <rect class="card-accent" x="470" y="44" width="210" height="230" rx="8" />
  <text class="col-head-inv" x="575" y="72">ABIDES-Gym</text>
  <text class="body-text-inv" x="575" y="100">Tick-by-tick LOB.</text>
  <text class="body-text-inv" x="575" y="116">Realistic latency,</text>
  <text class="body-text-inv" x="575" y="132">queue position,</text>
  <text class="body-text-inv" x="575" y="148">partial fills,</text>
  <text class="body-text-inv" x="575" y="164">endogenous impact</text>
  <text class="body-text-inv" x="575" y="180">from other agents.</text>
  <text class="body-text-inv" x="575" y="212">Slowest by far —</text>
  <text class="body-text-inv" x="575" y="228">simulator is single-</text>
  <text class="body-text-inv" x="575" y="244">threaded discrete</text>
  <text class="body-text-inv" x="575" y="260">events. Fidelity: highest.</text>

  <!-- Column 4: ElegantRL — soft (highest throughput) -->
  <rect class="card-soft" x="700" y="44" width="190" height="230" rx="8" />
  <text class="col-head" x="795" y="72">ElegantRL</text>
  <text class="body-text" x="795" y="100">Trainer wins at</text>
  <text class="body-text" x="795" y="116">throughput: 4 k –</text>
  <text class="body-text" x="795" y="132">16 k envs on one</text>
  <text class="body-text" x="795" y="148">GPU, no CPU copy.</text>
  <text class="body-text" x="795" y="180">But the trading env</text>
  <text class="body-text" x="795" y="196">it ships with is</text>
  <text class="body-text" x="795" y="212">OHLCV, not LOB.</text>
  <text class="body-text" x="795" y="244">Fidelity: low.</text>
  <text class="body-text" x="795" y="260">Throughput: highest.</text>

</svg>
