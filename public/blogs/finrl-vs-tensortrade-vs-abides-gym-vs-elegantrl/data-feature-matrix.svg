<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">RL-for-trading feature matrix</title>
  <desc id="d">Heatmap comparing FinRL, TensorTrade, ABIDES-Gym, and ElegantRL across six axes: out-of-the-box trading env, modular composability, LOB / microstructure fidelity, bundled RL algorithms, parallel-env throughput, and broker / live-trade hooks. Strength indicated by fill color from light (weak) to dark orange-red (strong).</desc>
  <style>
    .chart-title  { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; fill: currentColor; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <text class="chart-title" x="450" y="32" text-anchor="middle">RL-for-trading feature matrix</text>

  <!--
    Layout:
    - Left margin: 160 (row labels end at 152)
    - 6 cols of width 123 each
    - Col centers: 222, 345, 468, 591, 714, 837
    - 4 rows of height 56 starting y=80; centers 108, 164, 220, 276
    - Headers at y=55/68
    - Legend at y=340
  -->

  <!-- Column headers -->
  <text class="col-head" x="222" y="55">Ready-made</text>
  <text class="col-head" x="222" y="68">trading env</text>

  <text class="col-head" x="345" y="55">Modular</text>
  <text class="col-head" x="345" y="68">composability</text>

  <text class="col-head" x="468" y="55">LOB /</text>
  <text class="col-head" x="468" y="68">microstructure</text>

  <text class="col-head" x="591" y="55">Bundled</text>
  <text class="col-head" x="591" y="68">RL algos</text>

  <text class="col-head" x="714" y="55">Parallel-env</text>
  <text class="col-head" x="714" y="68">throughput</text>

  <text class="col-head" x="837" y="55">Broker /</text>
  <text class="col-head" x="837" y="68">live hooks</text>

  <!-- === Row 1: FinRL === -->
  <text class="row-head" x="152" y="108">FinRL</text>
  <rect class="cell-strong" x="160" y="80" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="222" y="103">StockTrading</text>
  <text class="cell-text-inv" x="222" y="117">Env (default)</text>
  <rect class="cell-weak" x="283" y="80" width="123" height="56" rx="4" />
  <text class="cell-text" x="345" y="103">Inheritance,</text>
  <text class="cell-text" x="345" y="117">not plug-in</text>
  <rect class="cell-weak" x="406" y="80" width="123" height="56" rx="4" />
  <text class="cell-text" x="468" y="103">OHLCV only,</text>
  <text class="cell-text" x="468" y="117">no LOB</text>
  <rect class="cell-medium" x="529" y="80" width="123" height="56" rx="4" />
  <text class="cell-text" x="591" y="103">SB3 / RLlib /</text>
  <text class="cell-text" x="591" y="117">ElegantRL</text>
  <rect class="cell-medium" x="652" y="80" width="123" height="56" rx="4" />
  <text class="cell-text" x="714" y="108">vec-env via SB3</text>
  <rect class="cell-medium" x="775" y="80" width="123" height="56" rx="4" />
  <text class="cell-text" x="837" y="103">Alpaca paper</text>
  <text class="cell-text" x="837" y="117">trade demo</text>

  <!-- === Row 2: TensorTrade === -->
  <text class="row-head" x="152" y="164">TensorTrade</text>
  <rect class="cell-medium" x="160" y="136" width="123" height="56" rx="4" />
  <text class="cell-text" x="222" y="159">Generic env,</text>
  <text class="cell-text" x="222" y="173">you assemble</text>
  <rect class="cell-strong" x="283" y="136" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="345" y="159">Action/Reward/</text>
  <text class="cell-text-inv" x="345" y="173">Exchange plug-ins</text>
  <rect class="cell-weak" x="406" y="136" width="123" height="56" rx="4" />
  <text class="cell-text" x="468" y="164">Plug-in dependent</text>
  <rect class="cell-weak" x="529" y="136" width="123" height="56" rx="4" />
  <text class="cell-text" x="591" y="159">None bundled,</text>
  <text class="cell-text" x="591" y="173">use any trainer</text>
  <rect class="cell-medium" x="652" y="136" width="123" height="56" rx="4" />
  <text class="cell-text" x="714" y="159">SubprocVecEnv</text>
  <text class="cell-text" x="714" y="173">(CPU only)</text>
  <rect class="cell-medium" x="775" y="136" width="123" height="56" rx="4" />
  <text class="cell-text" x="837" y="159">CCXT exchange</text>
  <text class="cell-text" x="837" y="173">plug-in</text>

  <!-- === Row 3: ABIDES-Gym === -->
  <text class="row-head" x="152" y="220">ABIDES-Gym</text>
  <rect class="cell-medium" x="160" y="192" width="123" height="56" rx="4" />
  <text class="cell-text" x="222" y="215">Execution +</text>
  <text class="cell-text" x="222" y="229">daily-investor envs</text>
  <rect class="cell-medium" x="283" y="192" width="123" height="56" rx="4" />
  <text class="cell-text" x="345" y="215">Custom agent</text>
  <text class="cell-text" x="345" y="229">classes in sim</text>
  <rect class="cell-strong" x="406" y="192" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="468" y="215">Full LOB +</text>
  <text class="cell-text-inv" x="468" y="229">latency model</text>
  <rect class="cell-weak" x="529" y="192" width="123" height="56" rx="4" />
  <text class="cell-text" x="591" y="220">BYO trainer</text>
  <rect class="cell-weak" x="652" y="192" width="123" height="56" rx="4" />
  <text class="cell-text" x="714" y="215">Single-thread</text>
  <text class="cell-text" x="714" y="229">discrete-event</text>
  <rect class="cell-weak" x="775" y="192" width="123" height="56" rx="4" />
  <text class="cell-text" x="837" y="220">Sim-only</text>

  <!-- === Row 4: ElegantRL === -->
  <text class="row-head" x="152" y="276">ElegantRL</text>
  <rect class="cell-medium" x="160" y="248" width="123" height="56" rx="4" />
  <text class="cell-text" x="222" y="271">FinRL-Meta</text>
  <text class="cell-text" x="222" y="285">stock env demos</text>
  <rect class="cell-medium" x="283" y="248" width="123" height="56" rx="4" />
  <text class="cell-text" x="345" y="271">Env plug-in</text>
  <text class="cell-text" x="345" y="285">contract</text>
  <rect class="cell-weak" x="406" y="248" width="123" height="56" rx="4" />
  <text class="cell-text" x="468" y="276">OHLCV only</text>
  <rect class="cell-strong" x="529" y="248" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="591" y="271">Own PPO/SAC/</text>
  <text class="cell-text-inv" x="591" y="285">TD3/A2C/DQN</text>
  <rect class="cell-strong" x="652" y="248" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="714" y="271">4 k – 16 k envs</text>
  <text class="cell-text-inv" x="714" y="285">on one GPU</text>
  <rect class="cell-weak" x="775" y="248" width="123" height="56" rx="4" />
  <text class="cell-text" x="837" y="276">Sim-only</text>

  <!-- Legend -->
  <rect class="legend-box-w" x="250" y="340" width="18" height="18" rx="3" />
  <text class="legend-text" x="275" y="349">Weak</text>

  <rect class="legend-box-m" x="370" y="340" width="18" height="18" rx="3" />
  <text class="legend-text" x="395" y="349">Medium</text>

  <rect class="legend-box-s" x="500" y="340" width="18" height="18" rx="3" />
  <text class="legend-text" x="525" y="349">Strong</text>

</svg>
