<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ABIDES-Gym logo">
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Limit order book: stacked bid/ask levels -->
  <!-- Ask side (top) -->
  <rect x="7" y="6.5" width="12" height="2" fill="var(--paper)" />
  <rect x="7" y="9.5" width="9" height="2" fill="var(--paper)" opacity="0.8" />
  <rect x="7" y="12.5" width="6" height="2" fill="var(--paper)" opacity="0.6" />
  <!-- Mid-price line -->
  <line x1="5" y1="16" x2="27" y2="16" stroke="var(--paper)" stroke-width="1.2" stroke-dasharray="2 2" />
  <!-- Bid side (bottom) -->
  <rect x="7" y="17.5" width="6" height="2" fill="var(--paper)" opacity="0.6" />
  <rect x="7" y="20.5" width="9" height="2" fill="var(--paper)" opacity="0.8" />
  <rect x="7" y="23.5" width="12" height="2" fill="var(--paper)" />
  <!-- Agent dot on the book -->
  <circle cx="24" cy="16" r="2" fill="var(--paper)" />
</svg>
