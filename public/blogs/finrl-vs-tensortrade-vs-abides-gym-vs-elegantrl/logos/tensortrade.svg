<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="TensorTrade logo">
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- A composable tensor: three connected nodes (modular building blocks) -->
  <circle cx="9" cy="11" r="3" fill="none" stroke="var(--paper)" stroke-width="1.6" />
  <circle cx="23" cy="11" r="3" fill="none" stroke="var(--paper)" stroke-width="1.6" />
  <circle cx="16" cy="22" r="3" fill="none" stroke="var(--paper)" stroke-width="1.6" />
  <!-- Connection lines forming the graph -->
  <line x1="11.5" y1="13" x2="14.2" y2="20" stroke="var(--paper)" stroke-width="1.4" stroke-linecap="round" />
  <line x1="20.5" y1="13" x2="17.8" y2="20" stroke="var(--paper)" stroke-width="1.4" stroke-linecap="round" />
  <line x1="12" y1="11" x2="20" y2="11" stroke="var(--paper)" stroke-width="1.4" stroke-linecap="round" />
</svg>
