<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">FinRL architecture</title>
  <desc id="d">FinRL is a vertically integrated stack: market-data layer (Yahoo, Alpaca, CCXT), preprocessed environment layer with finance-specific defaults (transaction cost, turbulence, reward shape), agent layer wrapping Stable-Baselines3/RLlib/ElegantRL, and a backtest/paper-trade layer with built-in baselines.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .80; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Data layer (top) -->
  <rect class="box" x="40" y="50" width="820" height="64" rx="8" />
  <text class="label" x="450" y="76" text-anchor="middle" font-weight="700">Data layer · DataProcessor</text>
  <text class="sub" x="450" y="95" text-anchor="middle">Yahoo · Alpaca · CCXT · Tushare · CSV — OHLCV pull, indicator features, train/test split</text>

  <!-- Environment layer (hero, the contract) -->
  <rect class="hero" x="40" y="138" width="820" height="160" rx="12" />
  <text class="label-inv" x="450" y="166" text-anchor="middle" font-weight="600" font-size="16">Environment layer — the finance-baked simulation contract</text>
  <text class="sub-inv" x="450" y="184" text-anchor="middle">StockTradingEnv · PortfolioOptimizationEnv · CryptoEnv — defaults are opinionated finance assumptions</text>

  <rect class="box" x="62" y="204" width="190" height="80" rx="8" />
  <text class="label" x="157" y="226" text-anchor="middle" font-weight="700" font-size="13">Action space</text>
  <text class="sub" x="157" y="244" text-anchor="middle">Box([-1,1], n_stocks)</text>
  <text class="sub" x="157" y="260" text-anchor="middle">= fraction of position</text>
  <text class="sub" x="157" y="274" text-anchor="middle">scaled by hmax</text>

  <rect class="box" x="262" y="204" width="190" height="80" rx="8" />
  <text class="label" x="357" y="226" text-anchor="middle" font-weight="700" font-size="13">Reward</text>
  <text class="sub" x="357" y="244" text-anchor="middle">Δ portfolio value</text>
  <text class="sub" x="357" y="260" text-anchor="middle">incl. transaction cost</text>
  <text class="sub" x="357" y="274" text-anchor="middle">optional turbulence cap</text>

  <rect class="box" x="462" y="204" width="190" height="80" rx="8" />
  <text class="label" x="557" y="226" text-anchor="middle" font-weight="700" font-size="13">Cost &amp; slippage</text>
  <text class="sub" x="557" y="244" text-anchor="middle">flat bps per trade</text>
  <text class="sub" x="557" y="260" text-anchor="middle">market impact: none</text>
  <text class="sub" x="557" y="274" text-anchor="middle">fills at close price</text>

  <rect class="box" x="662" y="204" width="190" height="80" rx="8" />
  <text class="label" x="757" y="226" text-anchor="middle" font-weight="700" font-size="13">Episode</text>
  <text class="sub" x="757" y="244" text-anchor="middle">one day = one step</text>
  <text class="sub" x="757" y="260" text-anchor="middle">terminates on cash-out</text>
  <text class="sub" x="757" y="274" text-anchor="middle">or end of price series</text>

  <!-- Agent layer -->
  <rect class="adj" x="40" y="318" width="500" height="100" rx="8" />
  <text class="label" x="290" y="344" text-anchor="middle" font-weight="700">Agent layer · DRLAgent wrapper</text>
  <text class="sub" x="290" y="362" text-anchor="middle">forwards calls to SB3 (PPO/A2C/SAC/TD3/DDPG)</text>
  <text class="sub" x="290" y="378" text-anchor="middle">or RLlib · or ElegantRL backend (chosen by import path)</text>
  <text class="sub" x="290" y="396" text-anchor="middle">hyper-params surface through one shared train() / predict() API</text>

  <rect class="box" x="560" y="318" width="300" height="100" rx="8" />
  <text class="label" x="710" y="344" text-anchor="middle" font-weight="700">Backtest / paper trade</text>
  <text class="sub" x="710" y="362" text-anchor="middle">built-in baselines: DJIA / SP500 buy-and-hold</text>
  <text class="sub" x="710" y="378" text-anchor="middle">pyfolio tear-sheet · Sharpe · max DD</text>
  <text class="sub" x="710" y="396" text-anchor="middle">Alpaca paper-trade hook (optional)</text>

  <!-- Bottom label -->
  <rect class="box" x="40" y="438" width="820" height="34" rx="8" />
  <text class="sub" x="450" y="459" text-anchor="middle" font-weight="600">Trade-off: fewer choices to make, fewer choices you control</text>

  <!-- Arrows -->
  <line class="arrow" x1="450" y1="115" x2="450" y2="136" />
  <line class="arrow" x1="290" y1="299" x2="290" y2="316" />
  <line class="arrow" x1="710" y1="299" x2="710" y2="316" />
  <line class="arrow" x1="540" y1="368" x2="558" y2="368" />
</svg>
