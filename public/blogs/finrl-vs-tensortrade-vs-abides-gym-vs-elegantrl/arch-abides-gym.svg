<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">ABIDES-Gym architecture</title>
  <desc id="d">ABIDES-Gym wraps the ABIDES discrete-event multi-agent limit-order-book simulator: a synthetic exchange runs against background trader agents while a Gym wrapper exposes one focal RL agent's observation and action. Episodes are measured in microseconds, observations are LOB snapshots, and actions are real order types.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .80; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- ABIDES kernel (hero, the simulator) -->
  <rect class="hero" x="40" y="50" width="560" height="400" rx="12" />
  <text class="label-inv" x="320" y="78" text-anchor="middle" font-weight="600" font-size="16">ABIDES kernel — discrete-event multi-agent simulator</text>
  <text class="sub-inv" x="320" y="96" text-anchor="middle">microsecond time grid · message bus · NASDAQ-style price/time priority</text>

  <!-- Exchange (LOB) -->
  <rect class="box" x="62" y="116" width="240" height="148" rx="8" />
  <text class="label" x="182" y="140" text-anchor="middle" font-weight="700">Exchange agent</text>
  <text class="sub" x="182" y="156" text-anchor="middle">Limit Order Book (LOB)</text>
  <!-- LOB rungs -->
  <rect class="adj" x="84" y="170" width="156" height="10" />
  <rect class="adj" x="96" y="184" width="144" height="10" opacity="0.85" />
  <rect class="adj" x="108" y="198" width="132" height="10" opacity="0.7" />
  <line x1="84" y1="216" x2="280" y2="216" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2" />
  <rect class="adj" x="108" y="222" width="132" height="10" opacity="0.7" />
  <rect class="adj" x="96" y="236" width="144" height="10" opacity="0.85" />
  <rect class="adj" x="84" y="250" width="156" height="10" />

  <!-- Background trader agents -->
  <rect class="box" x="62" y="284" width="240" height="148" rx="8" />
  <text class="label" x="182" y="308" text-anchor="middle" font-weight="700">Background trader agents</text>
  <text class="sub" x="182" y="328" text-anchor="middle">Noise traders</text>
  <text class="sub" x="182" y="346" text-anchor="middle">Value traders (with α signal)</text>
  <text class="sub" x="182" y="364" text-anchor="middle">Momentum / mean-reversion bots</text>
  <text class="sub" x="182" y="382" text-anchor="middle">Reference Market Makers (POVMM)</text>
  <text class="sub" x="182" y="402" text-anchor="middle">— produce realistic order flow</text>
  <text class="sub" x="182" y="420" text-anchor="middle">— each agent acts on its own arrival schedule</text>

  <!-- Message bus -->
  <rect class="box" x="320" y="116" width="260" height="316" rx="8" />
  <text class="label" x="450" y="140" text-anchor="middle" font-weight="700">Message bus · Kernel</text>
  <text class="sub" x="450" y="158" text-anchor="middle">delivers LIMIT_ORDER, MARKET_ORDER,</text>
  <text class="sub" x="450" y="174" text-anchor="middle">CANCEL, TRADE messages</text>
  <text class="sub" x="450" y="190" text-anchor="middle">computational latency model on every hop</text>
  <text class="sub" x="450" y="206" text-anchor="middle">queue priority preserved by arrival time</text>

  <rect class="adj" x="340" y="226" width="220" height="68" rx="8" />
  <text class="label" x="450" y="248" text-anchor="middle" font-weight="700" font-size="13">RL Gym wrapper</text>
  <text class="sub" x="450" y="266" text-anchor="middle">drives ONE focal "experimental" agent</text>
  <text class="sub" x="450" y="280" text-anchor="middle">step() resumes kernel until next decision</text>

  <rect class="box" x="340" y="306" width="106" height="56" rx="8" />
  <text class="label" x="393" y="328" text-anchor="middle" font-weight="700" font-size="13">Obs space</text>
  <text class="sub" x="393" y="346" text-anchor="middle">LOB snapshot</text>

  <rect class="box" x="454" y="306" width="106" height="56" rx="8" />
  <text class="label" x="507" y="328" text-anchor="middle" font-weight="700" font-size="13">Action space</text>
  <text class="sub" x="507" y="346" text-anchor="middle">place/cancel</text>

  <rect class="box" x="340" y="374" width="220" height="46" rx="8" />
  <text class="label" x="450" y="394" text-anchor="middle" font-weight="700" font-size="13">Reward = realized PnL slice</text>
  <text class="sub" x="450" y="410" text-anchor="middle">(or Almgren-Chriss benchmark)</text>

  <!-- RL agent (right side, outside kernel) -->
  <rect class="adj" x="630" y="116" width="232" height="148" rx="8" />
  <text class="label" x="746" y="140" text-anchor="middle" font-weight="700">RL agent (yours)</text>
  <text class="sub" x="746" y="158" text-anchor="middle">SB3 / RLlib / custom PyTorch</text>
  <text class="sub" x="746" y="176" text-anchor="middle">policy returns: (order_type, price, size)</text>
  <text class="sub" x="746" y="194" text-anchor="middle">— execution agent or market maker</text>
  <text class="sub" x="746" y="212" text-anchor="middle">throughput limited by simulator</text>
  <text class="sub" x="746" y="230" text-anchor="middle">(single-threaded discrete event loop)</text>

  <rect class="box" x="630" y="284" width="232" height="148" rx="8" />
  <text class="label" x="746" y="308" text-anchor="middle" font-weight="700">What you get</text>
  <text class="sub" x="746" y="328" text-anchor="middle">- impact: endogenous from book</text>
  <text class="sub" x="746" y="346" text-anchor="middle">- slippage: from queue position</text>
  <text class="sub" x="746" y="364" text-anchor="middle">- realistic latency &amp; partial fills</text>
  <text class="sub" x="746" y="382" text-anchor="middle">- one focal agent per episode</text>
  <text class="sub" x="746" y="402" text-anchor="middle">  (or multi via ABIDES-MARL)</text>
  <text class="sub" x="746" y="420" text-anchor="middle">- slow vs OHLCV sims</text>

  <!-- Arrows -->
  <line class="arrow" x1="302" y1="190" x2="320" y2="190" />
  <line class="arrow" x1="302" y1="356" x2="320" y2="356" />
  <line class="arrow" x1="560" y1="260" x2="628" y2="190" />
  <line class="arrow" x1="628" y1="260" x2="560" y2="356" />
</svg>
