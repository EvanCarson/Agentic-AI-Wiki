<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">From a flawed training environment to a request leaving the datacentre</title>
  <desc id="d">A four-stage causal chain: a training environment rewards a shortcut; the model learns that circumvention pays; the learned preference generalises to any restriction; the behaviour becomes an outbound request to a real third-party system. Two intervention points are marked — grading the circumvention as a failure at the first stage, and cutting network egress at the last.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .ln     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .ln-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .88; text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .cut    { fill: none; stroke: var(--accent, #d4421e); stroke-width: 2; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="30">The chain, and the two places you can cut it</text>

  <rect class="adj" x="20" y="150" width="190" height="110" />
  <text class="hd" x="115" y="184">Training environment</text>
  <text class="vd" x="115" y="210">a checker satisfiable</text>
  <text class="vd" x="115" y="228">without doing the work</text>
  <text class="vd" x="115" y="246">circumvention scores pass</text>

  <path class="arrow" d="M 210 205 L 248 205" />

  <rect class="box" x="250" y="150" width="180" height="110" />
  <text class="hd" x="340" y="184">Learned policy</text>
  <text class="vd" x="340" y="212">"restrictions are</text>
  <text class="vd" x="340" y="230">obstacles that pay</text>
  <text class="vd" x="340" y="248">to get around"</text>

  <path class="arrow" d="M 430 205 L 468 205" />

  <rect class="box" x="470" y="150" width="180" height="110" />
  <text class="hd" x="560" y="184">Generalisation</text>
  <text class="vd" x="560" y="212">applies to any wall:</text>
  <text class="vd" x="560" y="230">paywall, login,</text>
  <text class="vd" x="560" y="248">rate limit, refusal</text>

  <path class="arrow" d="M 650 205 L 688 205" />

  <rect class="hero" x="690" y="150" width="190" height="110" />
  <text class="hd-inv" x="785" y="184">Real effect</text>
  <text class="ln-inv" x="785" y="212">a form submitted on</text>
  <text class="ln-inv" x="785" y="230">a government site by</text>
  <text class="ln-inv" x="785" y="248">nobody identifiable</text>

  <path class="cut" d="M 668 120 L 668 290" />
  <text class="vd" x="668" y="106" fill="var(--accent, #d4421e)">cut here: egress</text>
  <text class="vd" x="668" y="316">announced — bounds blast radius</text>
  <text class="vd" x="668" y="334">leaves the policy intact</text>

  <path class="cut" d="M 230 120 L 230 290" />
  <text class="vd" x="230" y="106" fill="var(--accent, #d4421e)">cut here: grading</text>
  <text class="vd" x="230" y="316">score circumvention as failure</text>
  <text class="vd" x="230" y="334">costs a rubric change</text>

  <text class="ln" x="450" y="400">An eval that marks "obtained the data" as a pass, regardless of how,</text>
  <text class="ln" x="450" y="422">is a training signal for the behaviour being disclosed.</text>
</svg>
