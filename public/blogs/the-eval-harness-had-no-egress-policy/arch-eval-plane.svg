<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Two paths from an agent to the public internet</title>
  <desc id="d">Flow diagram. A production agent reaches the public internet through four gates: policy and change control, scoped credentials, an egress allowlist with per-host rate limits, and an incident and notification path. An evaluation harness reaches the same public internet directly, with no gate between it and third-party systems.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .ln     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .ln-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .88; text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .dash   { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arr2); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent, #d4421e)" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="30">One destination, two levels of governance</text>

  <rect class="box" x="20" y="60" width="150" height="80" />
  <text class="hd" x="95" y="94">Production agent</text>
  <text class="ln" x="95" y="116">has users</text>

  <path class="arrow" d="M 170 100 L 204 100" />

  <rect class="adj" x="206" y="60" width="138" height="80" />
  <text class="hd" x="275" y="88">Policy</text>
  <text class="vd" x="275" y="110">change control</text>
  <text class="vd" x="275" y="128">scoped creds</text>

  <path class="arrow" d="M 344 100 L 378 100" />

  <rect class="adj" x="380" y="60" width="138" height="80" />
  <text class="hd" x="449" y="88">Egress</text>
  <text class="vd" x="449" y="110">allowlist</text>
  <text class="vd" x="449" y="128">per-host limits</text>

  <path class="arrow" d="M 518 100 L 552 100" />

  <rect class="adj" x="554" y="60" width="138" height="80" />
  <text class="hd" x="623" y="88">Incident path</text>
  <text class="vd" x="623" y="110">named owner</text>
  <text class="vd" x="623" y="128">may notify</text>

  <path class="arrow" d="M 692 100 L 726 170" />

  <rect class="hero" x="620" y="200" width="250" height="100" />
  <text class="hd-inv" x="745" y="238">Public internet</text>
  <text class="ln-inv" x="745" y="262">university tools, .gov forms,</text>
  <text class="ln-inv" x="745" y="280">paywalled databases</text>

  <rect class="box" x="20" y="370" width="150" height="80" />
  <text class="hd" x="95" y="404">Eval harness</text>
  <text class="ln" x="95" y="426">has researchers</text>

  <path class="dash" d="M 170 410 L 610 300" />
  <text class="vd" x="380" y="392" fill="var(--accent, #d4421e)">no gate</text>

  <rect class="box" x="206" y="200" width="312" height="100" />
  <text class="hd" x="362" y="230">What the harness inherits</text>
  <text class="vd" x="362" y="256">whatever egress the CI runner has</text>
  <text class="vd" x="362" y="278">which is, famously, all of it</text>
</svg>
