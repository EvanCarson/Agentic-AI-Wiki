<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Five agent controls, production deployment versus evaluation harness</title>
  <desc id="d">A matrix with five rows — egress allowlist, per-host rate limit, attributable identity, notification path with a named owner, and change control — and two columns. Every control is marked present for a production agent deployment and absent for a typical evaluation harness.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .col    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); text-anchor: middle; }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); text-anchor: middle; }
    .cell-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--paper); text-anchor: middle; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="20" y="30">The same five controls, two sides of the building</text>

  <text class="col" x="520" y="66">Production agent</text>
  <text class="col" x="730" y="66">Eval harness</text>

  <text class="row" x="20" y="98">Egress allowlist</text>
  <rect class="strong" x="420" y="80" width="200" height="34" />
  <text class="cell-inv" x="520" y="102">Required</text>
  <rect class="weak" x="640" y="80" width="180" height="34" />
  <text class="cell" x="730" y="102">Open web</text>

  <text class="row" x="20" y="148">Per-host rate limit</text>
  <rect class="strong" x="420" y="130" width="200" height="34" />
  <text class="cell-inv" x="520" y="152">Configured</text>
  <rect class="weak" x="640" y="130" width="180" height="34" />
  <text class="cell" x="730" y="152">Emergent</text>

  <text class="row" x="20" y="198">Attributable identity</text>
  <rect class="strong" x="420" y="180" width="200" height="34" />
  <text class="cell-inv" x="520" y="202">Named caller</text>
  <rect class="weak" x="640" y="180" width="180" height="34" />
  <text class="cell" x="730" y="202">Cloud IP</text>

  <text class="row" x="20" y="248">Notification path</text>
  <rect class="strong" x="420" y="230" width="200" height="34" />
  <text class="cell-inv" x="520" y="252">Named owner</text>
  <rect class="weak" x="640" y="230" width="180" height="34" />
  <text class="cell" x="730" y="252">None</text>

  <text class="row" x="20" y="298">Change control</text>
  <rect class="strong" x="420" y="280" width="200" height="34" />
  <text class="cell-inv" x="520" y="302">Reviewed deploy</text>
  <rect class="weak" x="640" y="280" width="180" height="34" />
  <text class="cell" x="730" y="302">Content edit</text>

  <text class="sub" x="20" y="348">Highest-variance agent behaviour in the organisation; weakest governance, because it is filed under "testing".</text>
  <text class="sub" x="20" y="372">Both columns reach the same third parties.</text>
</svg>
