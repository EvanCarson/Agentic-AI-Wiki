<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What each Poppy access surface carries</title>
  <desc id="d">Three columns comparing the credential each Poppy access surface carries: the account API uses a key-bound token with DPoP proof of possession, the MCP endpoint accepts a bearer token only when the resource matches that API's URL, and the browser surface exchanges a signed assertion for ordinary session cookies, after which no key is involved.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .ln     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .ln-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
  </style>

  <text class="ttl" x="20" y="30">Three ways in, three different things to steal</text>

  <rect class="hero" x="30" y="55" width="260" height="190" />
  <text class="hd-inv" x="160" y="86">Account API</text>
  <text class="ln-inv" x="160" y="114">Key-bound session token</text>
  <text class="ln-inv" x="160" y="132">with DPoP proof of</text>
  <text class="ln-inv" x="160" y="150">possession</text>
  <text class="ln-inv" x="160" y="186">A stolen token is</text>
  <text class="vd-inv" x="160" y="210">useless without the key</text>

  <rect class="adj" x="320" y="55" width="260" height="190" />
  <text class="hd" x="450" y="86">MCP endpoint</text>
  <text class="ln" x="450" y="114">Bearer token, accepted</text>
  <text class="ln" x="450" y="132">only when resource is</text>
  <text class="ln" x="450" y="150">that API&#8217;s own URL</text>
  <text class="ln" x="450" y="186">A stolen token works,</text>
  <text class="vd" x="450" y="210">but only at one audience</text>

  <rect class="box" x="610" y="55" width="260" height="190" />
  <text class="hd" x="740" y="86">Browser</text>
  <text class="ln" x="740" y="114">Signed assertion traded</text>
  <text class="ln" x="740" y="132">for ordinary session</text>
  <text class="ln" x="740" y="150">cookies</text>
  <text class="ln" x="740" y="186">A stolen cookie is</text>
  <text class="vd" x="740" y="210">a logged-in browser</text>

  <text class="ln" x="450" y="278">The cryptography degrades left to right; the authorisation is the same two scopes in all three columns.</text>
</svg>
