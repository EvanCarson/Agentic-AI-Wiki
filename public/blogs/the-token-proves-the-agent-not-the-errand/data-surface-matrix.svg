<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Poppy access surfaces against four properties</title>
  <desc id="d">A matrix with the three Poppy access surfaces as rows and four properties as columns: replay protection, audience binding, revocation granularity, and how finely the grant distinguishes actions. The account API is strong on replay protection, the MCP endpoint is strong on audience binding, the browser surface is weak on both, and all three share the same weak action granularity of two standard scopes.</desc>
  <style>
    .cellW  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cellM  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .cellS  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .colh   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .8; text-anchor: middle; }
    .rowh   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cv     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .cv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .lg     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="20" y="28">Where draft 0.1 is strict, and where every row is the same</text>

  <text class="colh" x="330" y="64">replay</text>
  <text class="colh" x="330" y="78">protection</text>
  <text class="colh" x="470" y="64">audience</text>
  <text class="colh" x="470" y="78">binding</text>
  <text class="colh" x="610" y="64">revocation</text>
  <text class="colh" x="610" y="78">granularity</text>
  <text class="colh" x="760" y="64">action</text>
  <text class="colh" x="760" y="78">granularity</text>

  <text class="rowh" x="30" y="122">Account API</text>
  <rect class="cellS" x="262" y="94" width="136" height="48" />
  <text class="cv-inv" x="330" y="123">Strong (DPoP)</text>
  <rect class="cellM" x="402" y="94" width="136" height="48" />
  <text class="cv" x="470" y="123">Medium</text>
  <rect class="cellM" x="542" y="94" width="136" height="48" />
  <text class="cv" x="610" y="123">Per grant</text>
  <rect class="cellW" x="682" y="94" width="188" height="48" />
  <text class="cv" x="776" y="123">Weak: two scopes</text>

  <text class="rowh" x="30" y="192">MCP endpoint</text>
  <rect class="cellW" x="262" y="164" width="136" height="48" />
  <text class="cv" x="330" y="193">Weak (bearer)</text>
  <rect class="cellS" x="402" y="164" width="136" height="48" />
  <text class="cv-inv" x="470" y="193">Strong (resource)</text>
  <rect class="cellM" x="542" y="164" width="136" height="48" />
  <text class="cv" x="610" y="193">Per grant</text>
  <rect class="cellW" x="682" y="164" width="188" height="48" />
  <text class="cv" x="776" y="193">Weak: two scopes</text>

  <text class="rowh" x="30" y="262">Browser session</text>
  <rect class="cellW" x="262" y="234" width="136" height="48" />
  <text class="cv" x="330" y="263">Weak (cookie)</text>
  <rect class="cellM" x="402" y="234" width="136" height="48" />
  <text class="cv" x="470" y="263">Medium (origin)</text>
  <rect class="cellW" x="542" y="234" width="136" height="48" />
  <text class="cv" x="610" y="263">Session-wide</text>
  <rect class="cellW" x="682" y="234" width="188" height="48" />
  <text class="cv" x="776" y="263">Weak: two scopes</text>

  <rect class="cellS" x="262" y="306" width="18" height="14" />
  <text class="lg" x="288" y="318">Strong</text>
  <rect class="cellM" x="352" y="306" width="18" height="14" />
  <text class="lg" x="378" y="318">Medium</text>
  <rect class="cellW" x="446" y="306" width="18" height="14" />
  <text class="lg" x="472" y="318">Weak</text>

  <text class="note" x="20" y="356">Replay, audience and revocation are specified per surface and differ. The right-hand column does not differ,</text>
  <text class="note" x="20" y="374">because poppy:read and poppy:write are the only standard distinctions and both are unbounded within their half.</text>
  <text class="note" x="20" y="392">Assessment of draft 0.1 as published on 9 October 2026; the draft states it may change in breaking ways.</text>
</svg>
