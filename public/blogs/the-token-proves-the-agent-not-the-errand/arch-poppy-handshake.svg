<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The Poppy draft 0.1 handshake</title>
  <desc id="d">A flow from a company's well-known poppy.json discovery document, through the agent's version and domain checks and the requirement that the OAuth metadata issuer match that document, to a user authorising scopes and a key-bound session token being issued. The token then reaches three access surfaces: the account API with DPoP proof of possession, an MCP endpoint with a resource-limited bearer token, and the browser, where a signed assertion is exchanged for ordinary session cookies.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .ln     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .ln-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .mn     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .8; }
    .mn-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); opacity: .9; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="28">Draft 0.1: four checks on the connection, one distinction on the errand</text>

  <rect class="box" x="30" y="48" width="250" height="68" />
  <text class="hd" x="46" y="74">1 &#183; Discovery</text>
  <text class="mn" x="46" y="96">/.well-known/poppy.json</text>
  <text class="ln" x="46" y="110">published by the company</text>

  <path class="arrow" d="M 155 116 L 155 142" />

  <rect class="box" x="30" y="146" width="250" height="68" />
  <text class="hd" x="46" y="172">2 &#183; Agent identity</text>
  <text class="ln" x="46" y="192">HTTPS client identifier</text>
  <text class="ln" x="46" y="208">and a public key</text>

  <path class="arrow" d="M 155 214 L 155 240" />

  <rect class="adj" x="30" y="244" width="250" height="68" />
  <text class="hd" x="46" y="270">3 &#183; Issuer must match</text>
  <text class="ln" x="46" y="290">OAuth metadata (RFC 8414)</text>
  <text class="ln" x="46" y="306">issuer == poppy.json</text>

  <path class="arrow" d="M 155 312 L 155 338" />

  <rect class="box" x="30" y="342" width="250" height="78" />
  <text class="hd" x="46" y="368">4 &#183; User authorises</text>
  <text class="mn" x="46" y="390">poppy:read / poppy:write</text>
  <text class="mn" x="46" y="408">+ company custom_scopes</text>

  <path class="arrow" d="M 280 381 L 326 381 L 326 300" />

  <rect class="hero" x="330" y="196" width="220" height="104" />
  <text class="hd-inv" x="346" y="226">Session token</text>
  <text class="ln-inv" x="346" y="248">bound to the agent&#8217;s key</text>
  <text class="mn-inv" x="346" y="270">DPoP proof of possession</text>
  <text class="ln-inv" x="346" y="290">replay needs the key</text>

  <path class="arrow" d="M 550 230 L 600 230 L 600 104 L 622 104" />
  <path class="arrow" d="M 550 248 L 610 248 L 610 236 L 622 236" />
  <path class="arrow" d="M 550 272 L 600 272 L 600 378 L 622 378" />

  <rect class="box" x="626" y="62" width="248" height="84" />
  <text class="hd" x="642" y="88">Account API</text>
  <text class="ln" x="642" y="110">key-bound token, DPoP</text>
  <text class="ln" x="642" y="128">strongest of the three</text>

  <rect class="box" x="626" y="194" width="248" height="84" />
  <text class="hd" x="642" y="220">MCP endpoint</text>
  <text class="ln" x="642" y="242">bearer token, accepted only</text>
  <text class="ln" x="642" y="260">when resource == that API</text>

  <rect class="adj" x="626" y="326" width="248" height="104" />
  <text class="hd" x="642" y="352">Browser</text>
  <text class="ln" x="642" y="374">signed assertion exchanged</text>
  <text class="ln" x="642" y="392">for ordinary session cookies</text>
  <text class="ln" x="642" y="414">the key stops here</text>

  <text class="note" x="20" y="462">Steps 1&#8211;3 are cryptographic and testable. Step 4 is the only place the protocol says what the agent is allowed to do,</text>
  <text class="note" x="20" y="480">and it offers two standard scopes plus whatever each company invents under custom_scopes.</text>
</svg>
