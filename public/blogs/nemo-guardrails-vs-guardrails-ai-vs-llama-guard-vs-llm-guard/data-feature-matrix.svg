<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Guardrails framework feature comparison matrix</title>
  <desc id="d">Heatmap comparing NeMo Guardrails, Guardrails AI, Llama Guard, and LLM Guard across five axes: dialogue rails, output schema, injection defense, PII handling, and maintained/license. Strength shown from light neutral (weak) to solid accent (strong).</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <text class="chart-title" x="450" y="32" text-anchor="middle">Feature strength by framework</text>

  <!-- 5 cols × 136 from x=160; centers 228/364/500/636/772. rows tops 76/132/188/244; centers 104/160/216/272 -->
  <text class="col-head" x="228" y="54">Dialogue</text><text class="col-head" x="228" y="66">rails</text>
  <text class="col-head" x="364" y="54">Output</text><text class="col-head" x="364" y="66">schema</text>
  <text class="col-head" x="500" y="54">Injection</text><text class="col-head" x="500" y="66">defense</text>
  <text class="col-head" x="636" y="54">PII</text><text class="col-head" x="636" y="66">handling</text>
  <text class="col-head" x="772" y="54">Maintained</text><text class="col-head" x="772" y="66">&amp; license</text>

  <!-- Row 1: NeMo Guardrails -->
  <text class="row-head" x="152" y="104">NeMo Guardrails</text>
  <rect class="cell-strong" x="160" y="76" width="136" height="56" rx="4" /><text class="cell-text-inv" x="228" y="104">Colang rails</text>
  <rect class="cell-weak" x="296" y="76" width="136" height="56" rx="4" /><text class="cell-text" x="364" y="104">Limited</text>
  <rect class="cell-medium" x="432" y="76" width="136" height="56" rx="4" /><text class="cell-text" x="500" y="104">Partial</text>
  <rect class="cell-medium" x="568" y="76" width="136" height="56" rx="4" /><text class="cell-text" x="636" y="104">Via Presidio</text>
  <rect class="cell-strong" x="704" y="76" width="136" height="56" rx="4" /><text class="cell-text-inv" x="772" y="104">Apache-2.0</text>

  <!-- Row 2: Guardrails AI -->
  <text class="row-head" x="152" y="160">Guardrails AI</text>
  <rect class="cell-weak" x="160" y="132" width="136" height="56" rx="4" /><text class="cell-text" x="228" y="160">—</text>
  <rect class="cell-strong" x="296" y="132" width="136" height="56" rx="4" /><text class="cell-text-inv" x="364" y="160">Pydantic/RAIL</text>
  <rect class="cell-medium" x="432" y="132" width="136" height="56" rx="4" /><text class="cell-text" x="500" y="160">Validator</text>
  <rect class="cell-strong" x="568" y="132" width="136" height="56" rx="4" /><text class="cell-text-inv" x="636" y="160">Validators</text>
  <rect class="cell-strong" x="704" y="132" width="136" height="56" rx="4" /><text class="cell-text-inv" x="772" y="160">Apache-2.0</text>

  <!-- Row 3: Llama Guard -->
  <text class="row-head" x="152" y="216">Llama Guard</text>
  <rect class="cell-weak" x="160" y="188" width="136" height="56" rx="4" /><text class="cell-text" x="228" y="216">—</text>
  <rect class="cell-weak" x="296" y="188" width="136" height="56" rx="4" /><text class="cell-text" x="364" y="216">—</text>
  <rect class="cell-strong" x="432" y="188" width="136" height="56" rx="4" /><text class="cell-text-inv" x="500" y="216">Prompt Guard</text>
  <rect class="cell-weak" x="568" y="188" width="136" height="56" rx="4" /><text class="cell-text" x="636" y="216">No</text>
  <rect class="cell-medium" x="704" y="188" width="136" height="56" rx="4" /><text class="cell-text" x="772" y="216">Llama license</text>

  <!-- Row 4: LLM Guard -->
  <text class="row-head" x="152" y="272">LLM Guard</text>
  <rect class="cell-weak" x="160" y="244" width="136" height="56" rx="4" /><text class="cell-text" x="228" y="272">—</text>
  <rect class="cell-medium" x="296" y="244" width="136" height="56" rx="4" /><text class="cell-text" x="364" y="272">JSON only</text>
  <rect class="cell-strong" x="432" y="244" width="136" height="56" rx="4" /><text class="cell-text-inv" x="500" y="272">Scanner</text>
  <rect class="cell-strong" x="568" y="244" width="136" height="56" rx="4" /><text class="cell-text-inv" x="636" y="272">Anon round-trip</text>
  <rect class="cell-weak" x="704" y="244" width="136" height="56" rx="4" /><text class="cell-text" x="772" y="272">MIT · archived</text>

  <!-- Legend -->
  <rect class="legend-box-w" x="160" y="330" width="16" height="16" rx="3" /><text class="legend-text" x="182" y="338">Weak</text>
  <rect class="legend-box-m" x="250" y="330" width="16" height="16" rx="3" /><text class="legend-text" x="272" y="338">Medium</text>
  <rect class="legend-box-s" x="360" y="330" width="16" height="16" rx="3" /><text class="legend-text" x="382" y="338">Strong</text>
</svg>
