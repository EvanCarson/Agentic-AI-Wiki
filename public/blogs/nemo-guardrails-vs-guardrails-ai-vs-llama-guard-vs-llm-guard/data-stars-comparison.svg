<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">GitHub stars comparison — Guardrails AI, NeMo Guardrails, Llama Guard (PurpleLlama), LLM Guard</title>
  <desc id="d">Horizontal bar chart of approximate GitHub stars as of 2026-07-15: Guardrails AI ~7.2k, NeMo Guardrails ~6.7k, the Llama Guard / PurpleLlama repo ~4.3k, and LLM Guard ~3.2k (a now-archived project).</desc>
  <style>
    .chart-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; fill: currentColor; }
    .proj-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .bar-val     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; dominant-baseline: central; }
    .grid-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: middle; }
    .grid-line   { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .bar-accent  { fill: var(--accent, #d4421e); }
    .bar-adj     { fill: var(--accent-soft, #f5c5b8); }
    .bar-neutral { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
  </style>

  <text class="chart-title" x="450" y="36" text-anchor="middle">GitHub stars (snapshot 2026-07-15)</text>

  <!--
    Chart area left 220, right 80, top 68, bottom 55. Max 8k over 600px -> 75 px per 1k.
    Grid x: 0->220, 2k->370, 4k->520, 6k->670, 8k->820
    Rows tops 75/139/203/267; centers 98/162/226/290; baseline 318
  -->
  <line class="grid-line" x1="220" y1="68" x2="220" y2="318" />
  <line class="grid-line" x1="370" y1="68" x2="370" y2="318" />
  <line class="grid-line" x1="520" y1="68" x2="520" y2="318" />
  <line class="grid-line" x1="670" y1="68" x2="670" y2="318" />
  <line class="grid-line" x1="820" y1="68" x2="820" y2="318" />
  <line x1="220" y1="318" x2="820" y2="318" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" />
  <text class="grid-label" x="220" y="334">0</text>
  <text class="grid-label" x="370" y="334">2k</text>
  <text class="grid-label" x="520" y="334">4k</text>
  <text class="grid-label" x="670" y="334">6k</text>
  <text class="grid-label" x="820" y="334">8k stars</text>

  <!-- Row 1: Guardrails AI ~7.2k — accent (leader). width = 7.15*75 = 536 -->
  <text class="proj-label" x="212" y="98">Guardrails AI</text>
  <rect class="bar-accent" x="220" y="75" width="536" height="46" rx="5" ry="5" />
  <text class="bar-val" x="764" y="98" style="fill: var(--accent, #d4421e);">~7.2k</text>

  <!-- Row 2: NeMo Guardrails ~6.7k — accent-soft. width = 6.71*75 = 503 -->
  <text class="proj-label" x="212" y="162">NeMo Guardrails</text>
  <rect class="bar-adj" x="220" y="139" width="503" height="46" rx="5" ry="5" />
  <text class="bar-val" x="731" y="162" style="fill: var(--ink, #1a1a1a);">~6.7k</text>

  <!-- Row 3: Llama Guard (PurpleLlama) ~4.3k — neutral. width = 4.29*75 = 322 -->
  <text class="proj-label" x="212" y="226">Llama Guard</text>
  <rect class="bar-neutral" x="220" y="203" width="322" height="46" rx="5" ry="5" />
  <text class="bar-val" x="550" y="226" style="fill: var(--muted, #888);">~4.3k</text>

  <!-- Row 4: LLM Guard ~3.2k — neutral (archived). width = 3.18*75 = 238 -->
  <text class="proj-label" x="212" y="290">LLM Guard</text>
  <rect class="bar-neutral" x="220" y="267" width="238" height="46" rx="5" ry="5" />
  <text class="bar-val" x="466" y="290" style="fill: var(--muted, #888);">~3.2k · archived</text>

</svg>
