<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
  <title id="t">Where a guardrail sits: pre- and post-checks around the model</title>
  <desc id="d">A left-to-right flow: user input passes through an input guard, into the model or agent, out through an output guard, to the user. Below, a box for tools, retrieved documents, and MCP tool output feeds into the model too — showing that in agent systems the untrusted input a guardrail must screen also arrives from what the agent reads, not just the user prompt.</desc>
  <style>
    .title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .box    { fill: var(--paper-2, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .guard  { fill: var(--accent, #d4421e); }
    .model  { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13.5px; font-weight: 500; fill: var(--ink, #1a1a1a); text-anchor: middle; dominant-baseline: central; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13.5px; font-weight: 600; fill: var(--paper, #faf9f7); text-anchor: middle; dominant-baseline: central; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: 0.62; text-anchor: middle; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #faf9f7); opacity: 0.9; text-anchor: middle; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .arrlbl { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-style: italic; fill: var(--ink, #1a1a1a); opacity: 0.7; text-anchor: middle; }
    .caption{ font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; fill: var(--ink, #1a1a1a); opacity: 0.7; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="title" x="450" y="34">Where a guardrail sits — pre- and post-checks around the model</text>

  <!-- Row of 5 boxes at y=120, h=60 -->
  <rect class="box" x="40" y="120" width="130" height="60" rx="8" />
  <text class="label" x="105" y="150">User input</text>

  <rect class="guard" x="210" y="120" width="130" height="60" rx="8" />
  <text class="label-inv" x="275" y="145">Input guard</text>
  <text class="sub-inv" x="275" y="164">PII · injection · topics</text>

  <rect class="model" x="380" y="120" width="140" height="60" rx="8" />
  <text class="label" x="450" y="150">Model / Agent</text>

  <rect class="guard" x="560" y="120" width="130" height="60" rx="8" />
  <text class="label-inv" x="625" y="145">Output guard</text>
  <text class="sub-inv" x="625" y="164">toxicity · schema · secrets</text>

  <rect class="box" x="730" y="120" width="130" height="60" rx="8" />
  <text class="label" x="795" y="150">User / next step</text>

  <!-- Horizontal arrows -->
  <line class="arrow" x1="170" y1="150" x2="208" y2="150" />
  <line class="arrow" x1="340" y1="150" x2="378" y2="150" />
  <line class="arrow" x1="520" y1="150" x2="558" y2="150" />
  <line class="arrow" x1="690" y1="150" x2="728" y2="150" />

  <!-- Tools / retrieved / MCP box feeding the model (the agent case) -->
  <rect class="box" x="330" y="290" width="240" height="56" rx="8" />
  <text class="label" x="450" y="311">Tools · retrieved docs · MCP</text>
  <text class="sub" x="450" y="331">untrusted content the agent reads</text>
  <line class="arrow" x1="450" y1="290" x2="450" y2="182" />
  <text class="arrlbl" x="527" y="240">untrusted input, too</text>

  <text class="caption" x="450" y="386">Guardrails wrap the input before the model and the output before it ships — and in an agent they must also screen</text>
  <text class="caption" x="450" y="404">what the agent reads from tools and retrieval, where a prompt injection is just as likely to arrive.</text>
</svg>
