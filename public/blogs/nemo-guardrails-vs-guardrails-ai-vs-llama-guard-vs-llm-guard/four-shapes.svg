<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">Four shapes of a guardrail</title>
  <desc id="d">Four cards, one per archetype: a programmable rails DSL (NeMo Guardrails), a validator library (Guardrails AI), a safety-classifier model (Llama Guard), and a scanner pipeline (LLM Guard). Each names its mechanism and a representative open-source project.</desc>
  <style>
    .title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .card   { fill: var(--paper-2, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .glyph  { fill: none; stroke: var(--accent, #d4421e); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .glyphf { fill: var(--accent, #d4421e); }
    .shape  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .mech   { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink, #1a1a1a); opacity: 0.66; text-anchor: middle; }
    .tool   { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; font-weight: 600; fill: var(--accent, #d4421e); text-anchor: middle; }
  </style>

  <text class="title" x="450" y="34">Four shapes of a guardrail</text>

  <!-- Card 1: Programmable rails — NeMo Guardrails (cx=120) -->
  <rect class="card" x="30" y="64" width="180" height="262" rx="10" />
  <g><rect class="glyphf" x="98" y="104" width="44" height="8" rx="2" />
     <line class="glyph" x1="106" y1="112" x2="106" y2="130" /><line class="glyph" x1="134" y1="112" x2="134" y2="130" /></g>
  <text class="shape" x="120" y="170">Programmable rails</text>
  <text class="mech" x="120" y="196">a DSL of dialogue</text>
  <text class="mech" x="120" y="212">flows &amp; policies</text>
  <text class="tool" x="120" y="300">NeMo Guardrails</text>

  <!-- Card 2: Validator library — Guardrails AI (cx=340) -->
  <rect class="card" x="250" y="64" width="180" height="262" rx="10" />
  <g><path class="glyph" d="M340 100 L356 106 V118 C356 128 348 133 340 136 C332 133 324 128 324 118 V106 Z" />
     <path class="glyph" d="M333 117 L338 122 L347 112" /></g>
  <text class="shape" x="340" y="170">Validator library</text>
  <text class="mech" x="340" y="196">composable input /</text>
  <text class="mech" x="340" y="212">output validators</text>
  <text class="tool" x="340" y="300">Guardrails AI</text>

  <!-- Card 3: Classifier model — Llama Guard (cx=560) -->
  <rect class="card" x="470" y="64" width="180" height="262" rx="10" />
  <g><path class="glyph" d="M560 100 L576 106 V118 C576 128 568 133 560 136 C552 133 544 128 544 118 V106 Z" />
     <line class="glyph" x1="551" y1="114" x2="569" y2="114" /><circle class="glyphf" cx="560" cy="124" r="2.4" /></g>
  <text class="shape" x="560" y="170">Classifier model</text>
  <text class="mech" x="560" y="196">a fine-tuned</text>
  <text class="mech" x="560" y="212">safety model</text>
  <text class="tool" x="560" y="300">Llama Guard</text>

  <!-- Card 4: Scanner pipeline — LLM Guard (cx=780) -->
  <rect class="card" x="690" y="64" width="180" height="262" rx="10" />
  <g><path class="glyph" d="M764 102 H796 L784 118 V130 L776 134 V118 Z" />
     <line class="glyph" x1="769" y1="108" x2="791" y2="108" opacity="0.8" /></g>
  <text class="shape" x="780" y="170">Scanner pipeline</text>
  <text class="mech" x="780" y="196">a chain of input /</text>
  <text class="mech" x="780" y="212">output scanners</text>
  <text class="tool" x="780" y="300">LLM Guard</text>

</svg>
