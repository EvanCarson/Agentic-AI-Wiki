<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="mt md">
  <title id="mt">Four computing primitives: intended, available, visible</title>
  <desc id="md">A matrix with four rows — storage, retrieval, remote execution and signalling — against three columns. Every primitive was intended to be denied by the verb rule, every one was in fact available through an allowed service, and none of them were visible in the egress monitoring, which recorded allowed request counts without full URLs.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: none; }
    .medium { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .colhead{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: var(--ink); opacity: .7; }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .rowsub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); opacity: .65; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>

  <text class="title" x="20" y="26">What the sandbox was meant to deny, what it granted, and what anyone could see</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <text class="colhead" x="400" y="64" text-anchor="middle">DENIED BY INTENT</text>
  <text class="colhead" x="570" y="64" text-anchor="middle">ACTUALLY AVAILABLE</text>
  <text class="colhead" x="755" y="64" text-anchor="middle">VISIBLE IN LOGS</text>

  <text class="row" x="20" y="96">Storage</text>
  <text class="rowsub" x="20" y="112">link shortener, paste service</text>
  <rect class="weak" x="320" y="78" width="160" height="44" rx="4" />
  <text class="cell" x="400" y="105" text-anchor="middle">Yes — in theory</text>
  <rect class="strong" x="492" y="78" width="156" height="44" rx="4" />
  <text class="cell-inv" x="570" y="105" text-anchor="middle">Full</text>
  <rect class="weak" x="660" y="78" width="190" height="44" rx="4" />
  <text class="cell" x="755" y="105" text-anchor="middle">No — path not logged</text>

  <text class="row" x="20" y="160">Retrieval</text>
  <text class="rowsub" x="20" y="176">read back by anyone holding the key</text>
  <rect class="weak" x="320" y="142" width="160" height="44" rx="4" />
  <text class="cell" x="400" y="169" text-anchor="middle">Yes — in theory</text>
  <rect class="strong" x="492" y="142" width="156" height="44" rx="4" />
  <text class="cell-inv" x="570" y="169" text-anchor="middle">Full</text>
  <rect class="weak" x="660" y="142" width="190" height="44" rx="4" />
  <text class="cell" x="755" y="169" text-anchor="middle">No</text>

  <text class="row" x="20" y="224">Remote execution</text>
  <text class="rowsub" x="20" y="240">screenshot service runs the page's JS</text>
  <rect class="weak" x="320" y="206" width="160" height="44" rx="4" />
  <text class="cell" x="400" y="233" text-anchor="middle">Yes — in theory</text>
  <rect class="strong" x="492" y="206" width="156" height="44" rx="4" />
  <text class="cell-inv" x="570" y="233" text-anchor="middle">Full</text>
  <rect class="weak" x="660" y="206" width="190" height="44" rx="4" />
  <text class="cell" x="755" y="233" text-anchor="middle">No</text>

  <text class="row" x="20" y="288">Signalling</text>
  <text class="rowsub" x="20" y="304">DNS names and answers, cache state</text>
  <rect class="weak" x="320" y="270" width="160" height="44" rx="4" />
  <text class="cell" x="400" y="297" text-anchor="middle">Not considered</text>
  <rect class="medium" x="492" y="270" width="156" height="44" rx="4" />
  <text class="cell" x="570" y="297" text-anchor="middle">Narrow but sufficient</text>
  <rect class="medium" x="660" y="270" width="190" height="44" rx="4" />
  <text class="cell" x="755" y="297" text-anchor="middle">Only in resolver logs</text>

  <line class="rule" x1="20" y1="332" x2="880" y2="332" />
  <rect class="strong" x="20" y="352" width="14" height="14" rx="2" />
  <text class="sub" x="42" y="364">Fully available</text>
  <rect class="medium" x="180" y="352" width="14" height="14" rx="2" />
  <text class="sub" x="202" y="364">Partly available or partly visible</text>
  <rect class="weak" x="440" y="352" width="14" height="14" rx="2" />
  <text class="sub" x="462" y="364">Intended to be denied, or not visible at all</text>
</svg>
