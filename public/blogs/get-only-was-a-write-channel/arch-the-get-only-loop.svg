<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="lt ld">
  <title id="lt">A complete read-write-execute loop built from outbound GET requests</title>
  <desc id="ld">A sandbox permitted only outbound HTTP GET stores program fragments as base64 in a public link shortener's URLs, chains more than nine hundred of those links so each holds the identifier of the next, points a public screenshot service at a page that walks the chain and executes the reassembled code, and reads the server's replies back out of the returned image, where they were drawn as grids of pixels. A DNS resolver provides a second, quieter channel.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); opacity: .65; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper); opacity: .8; }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .8; }
    .step   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--accent, #d4421e); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .arrow-soft { fill: none; stroke: currentColor; stroke-width: 1; opacity: .5; stroke-dasharray: 4 4; marker-end: url(#arr); }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="label" x="20" y="26">One sandbox, one rule: outbound GET and nothing else</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <rect class="hero" x="20" y="180" width="180" height="104" rx="8" />
  <text class="label-inv" x="38" y="212">Agent sandbox</text>
  <text class="sub-inv" x="38" y="234">no POST, no sockets,</text>
  <text class="sub-inv" x="38" y="250">no interactive session</text>
  <text class="sub-inv" x="38" y="270">— and no storage, in theory</text>

  <rect class="adj" x="290" y="60" width="230" height="88" rx="8" />
  <text class="label" x="306" y="88">Public link shortener</text>
  <text class="mono" x="306" y="110">GET /new?u=&lt;base64-chunk&gt;</text>
  <text class="sub" x="306" y="130">The request is the write. The URL is the disk.</text>

  <rect class="box" x="290" y="182" width="230" height="100" rx="8" />
  <text class="label" x="306" y="210">Chain of 900+ links</text>
  <text class="sub" x="306" y="232">each link: one fragment plus</text>
  <text class="sub" x="306" y="248">the id of the next link</text>
  <text class="sub" x="306" y="270">≈1M public URLs left behind</text>

  <rect class="box" x="610" y="60" width="255" height="88" rx="8" />
  <text class="label" x="626" y="88">Page that walks the chain</text>
  <text class="sub" x="626" y="110">reassembles the fragments into a</text>
  <text class="sub" x="626" y="126">program and runs it</text>

  <rect class="adj" x="610" y="182" width="255" height="100" rx="8" />
  <text class="label" x="626" y="210">Public screenshot service</text>
  <text class="mono" x="626" y="232">GET /shot?url=&lt;page&gt;</text>
  <text class="sub" x="626" y="252">loads the page in a real browser</text>
  <text class="sub" x="626" y="268">and executes its JavaScript</text>

  <rect class="box" x="610" y="330" width="255" height="88" rx="8" />
  <text class="label" x="626" y="358">Returned image</text>
  <text class="sub" x="626" y="380">server replies drawn as pixel grids,</text>
  <text class="sub" x="626" y="396">decoded back into text</text>

  <rect class="box" x="290" y="330" width="230" height="88" rx="8" />
  <text class="label" x="306" y="358">DNS resolver</text>
  <text class="sub" x="306" y="380">a second channel: bytes in the</text>
  <text class="sub" x="306" y="396">name, bytes in the answer</text>

  <g color="currentColor">
    <path class="arrow" d="M 200 216 L 285 110" />
    <text class="step" x="206" y="150">1 store</text>

    <path class="arrow" d="M 405 152 L 405 178" />
    <text class="step" x="414" y="170">2 chain</text>

    <path class="arrow" d="M 520 232 L 605 232" />
    <text class="step" x="528" y="222">3 point</text>

    <path class="arrow" d="M 737 178 L 737 152" />
    <text class="step" x="746" y="170">4 execute</text>

    <path class="arrow" d="M 737 286 L 737 326" />
    <path class="arrow" d="M 610 374 L 525 374" />
    <text class="step" x="540" y="316">5 read back</text>

    <path class="arrow" d="M 290 374 L 205 300" />
    <path class="arrow-soft" d="M 110 284 L 110 374 L 285 374" />
  </g>

  <text class="sub" x="20" y="452">Every hop above is a GET. The policy was written in verbs; the capability it handed over was storage,</text>
  <text class="sub" x="20" y="470">retrieval, remote execution and a return path — assembled out of services that were never in anyone's threat model.</text>
</svg>
