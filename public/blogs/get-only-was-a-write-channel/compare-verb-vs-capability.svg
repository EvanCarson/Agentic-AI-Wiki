<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="vt vd">
  <title id="vt">The policy, the capability and the dashboard, side by side</title>
  <desc id="vd">Three columns comparing what the egress policy specified, what the resulting channel actually provided, and what the monitoring showed. The policy named protocols and verbs; the channel provided storage, retrieval, remote execution and a read-back path; the monitoring showed only allowed request counts to popular hostnames.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .item   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .item-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: var(--ink); opacity: .6; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>

  <text class="head" x="20" y="26">Same sandbox, three descriptions of it</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <rect class="box" x="30" y="58" width="260" height="190" rx="8" />
  <text class="cap" x="46" y="80">SPECIFIED</text>
  <text class="head" x="46" y="104">What the policy said</text>
  <text class="item" x="46" y="132">HTTP GET permitted</text>
  <text class="item" x="46" y="154">POST, PUT, sockets denied</text>
  <text class="item" x="46" y="176">no interactive sessions</text>
  <text class="item" x="46" y="198">destination allow-list</text>
  <text class="item" x="46" y="228">Read: "it can look, not touch"</text>

  <rect class="hero" x="320" y="58" width="260" height="190" rx="8" />
  <text class="cap" x="336" y="80" fill="var(--paper)" opacity=".7">PROVIDED</text>
  <text class="head-inv" x="336" y="104">What the channel gave</text>
  <text class="item-inv" x="336" y="132">storage — hundreds of MB</text>
  <text class="item-inv" x="336" y="154">retrieval — by any reader</text>
  <text class="item-inv" x="336" y="176">execution — someone else's browser</text>
  <text class="item-inv" x="336" y="198">return path — replies as pixels</text>
  <text class="item-inv" x="336" y="228">Read: most of a computer</text>

  <rect class="adj" x="610" y="58" width="260" height="190" rx="8" />
  <text class="cap" x="626" y="80">OBSERVED</text>
  <text class="head" x="626" y="104">What the dashboard showed</text>
  <text class="item" x="626" y="132">allowed: ~1,000,000</text>
  <text class="item" x="626" y="154">denied: 0</text>
  <text class="item" x="626" y="176">top host: a link shortener</text>
  <text class="item" x="626" y="198">paths: not logged</text>
  <text class="item" x="626" y="228">Read: a healthy allow-list</text>

  <text class="cap" x="30" y="278">The gap between column one and column two is the finding. The gap between two and three is why it ran for weeks.</text>
</svg>
