<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="avt avd">
  <title id="avt">Spoofed against genuine agent visits, October 2026</title>
  <desc id="avd">Three measurements from the Cequence and KPMG report. Traffic claiming one consumer AI agent's name at a single online marketplace reached 414,210 visits in a week. Genuine agent visits counted across five industries over 15 to 21 October came to 281,627. Of those genuine visits, about one in seven, roughly 40,000, went on to book, buy, sign in or manage an account.</desc>
  <style>
    .av-hi   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .av-mid  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .av-lo   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .av-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .av-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .av-val  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .av-tick { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .av-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .av-grid { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 4; }
    .av-axis { stroke: var(--ink); stroke-width: 1; opacity: .45; }
  </style>

  <text class="av-ttl" x="20" y="30">Agent visits counted, October 2026</text>

  <line class="av-grid" x1="431" y1="70" x2="431" y2="266" />
  <line class="av-grid" x1="542" y1="70" x2="542" y2="266" />
  <line class="av-grid" x1="653" y1="70" x2="653" y2="266" />
  <line class="av-grid" x1="764" y1="70" x2="764" y2="266" />
  <line class="av-axis" x1="320" y1="70" x2="320" y2="266" />

  <text class="av-row" x="20" y="100">Spoofed, one marketplace</text>
  <rect class="av-hi" x="320" y="78" width="460" height="34" />
  <text class="av-val" x="794" y="100">414,210</text>

  <text class="av-row" x="20" y="172">Genuine, five industries</text>
  <rect class="av-mid" x="320" y="150" width="313" height="34" />
  <text class="av-val" x="647" y="172">281,627</text>

  <text class="av-row" x="20" y="244">Of those, acted on account</text>
  <rect class="av-lo" x="320" y="222" width="44" height="34" />
  <text class="av-val" x="378" y="244">~40,000</text>

  <text class="av-tick" x="320" y="296" text-anchor="middle">0</text>
  <text class="av-tick" x="431" y="296" text-anchor="middle">100k</text>
  <text class="av-tick" x="542" y="296" text-anchor="middle">200k</text>
  <text class="av-tick" x="653" y="296" text-anchor="middle">300k</text>
  <text class="av-tick" x="764" y="296" text-anchor="middle">400k</text>

  <text class="av-sub" x="20" y="340">One week of spoofed traffic at a single site outweighed every genuine agent visit counted across five industries.</text>
  <text class="av-sub" x="20" y="364">Single-vendor figures, one week each. The spoofed total is not a like-for-like sample of the genuine one.</text>
</svg>
