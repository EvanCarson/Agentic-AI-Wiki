<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="tbt tbd">
  <title id="tbt">Three-bucket agent access policy</title>
  <desc id="tbd">An incoming agent request passes a signature verification step and lands in one of three buckets: signed with a recognised operator, which earns rate-limit carve-outs; signed with an unrecognised operator, which is logged as its own class; and unsigned, still the majority, where behaviour decides. Behavioural controls apply across all three buckets.</desc>
  <style>
    .tb-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .tb-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .tb-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .tb-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .tb-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .tb-note { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .tb-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#tbarr); }
  </style>
  <defs>
    <marker id="tbarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="tb-box" x="20" y="220" width="170" height="60" rx="8" ry="8" />
  <text class="tb-lab" x="105" y="255" text-anchor="middle">Incoming request</text>

  <path class="tb-arr" d="M 190 250 L 236 250" />

  <rect class="tb-box" x="240" y="220" width="190" height="60" rx="8" ry="8" />
  <text class="tb-lab" x="335" y="255" text-anchor="middle">Verify RFC 9421</text>

  <path class="tb-arr" d="M 430 240 L 466 110" />
  <path class="tb-arr" d="M 430 250 L 466 250" />
  <path class="tb-arr" d="M 430 260 L 466 390" />

  <rect class="tb-hero" x="470" y="80" width="230" height="60" rx="8" ry="8" />
  <text class="tb-inv" x="585" y="115" text-anchor="middle">Signed · operator known</text>
  <text class="tb-note" x="718" y="115">carve-outs</text>

  <rect class="tb-adj" x="470" y="220" width="230" height="60" rx="8" ry="8" />
  <text class="tb-lab" x="585" y="255" text-anchor="middle">Signed · unrecognised</text>
  <text class="tb-note" x="718" y="255">log as own class</text>

  <rect class="tb-box" x="470" y="360" width="230" height="60" rx="8" ry="8" />
  <text class="tb-lab" x="585" y="395" text-anchor="middle">Unsigned — the majority</text>
  <text class="tb-note" x="718" y="395">behaviour decides</text>

  <rect class="tb-box" x="20" y="440" width="840" height="46" rx="8" ry="8" />
  <text class="tb-lab" x="440" y="469" text-anchor="middle">Behavioural controls still decide every bucket</text>
</svg>
