<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="at ad">
  <title id="at">One set of weights served through two policy paths</title>
  <desc id="ad">A single set of model weights feeds two serving paths. The ordinary path applies the cyber refusal layer and is reached by any paying caller. The de-guardrailed path serves the same weights without that layer and is reached only through four organisational gates: a verified organisation with a checked security record, phishing-resistant multi-factor authentication, access confined to security, incident-response or penetration-testing staff, and a per-employee usage record. None of the four gates can be influenced by what the caller types, which is why this is an access-control problem rather than a model-behaviour problem.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .item   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .item-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .muted  { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#aarr); }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>
  <defs>
    <marker id="aarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="20" y="26">The weights are the same on both paths. The gate is outside the model.</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <rect class="box" x="330" y="56" width="240" height="56" rx="8" />
  <text class="cap" x="350" y="78">ONE CHECKPOINT</text>
  <text class="head" x="350" y="98">gemini-4-argon weights</text>

  <path class="arrow" d="M 400 112 L 290 156" />
  <path class="arrow" d="M 500 112 L 610 156" />

  <rect class="box" x="30" y="160" width="250" height="104" rx="8" />
  <text class="cap" x="50" y="184">PATH A — ANY PAYING CALLER</text>
  <text class="head" x="50" y="208">+ cyber refusal layer</text>
  <text class="muted" x="50" y="232">rephrasable, version-drifting,</text>
  <text class="muted" x="50" y="250">unauditable from outside</text>

  <rect class="hero" x="610" y="160" width="250" height="104" rx="8" />
  <text class="cap" x="630" y="184" fill="var(--paper)" opacity=".7">PATH B — FAIRWIND ONLY</text>
  <text class="head-inv" x="630" y="208">no cyber refusal layer</text>
  <text class="item-inv" x="630" y="232">same weights, different</text>
  <text class="item-inv" x="630" y="250">served policy</text>

  <path class="arrow" d="M 735 300 L 735 268" />

  <rect class="adj" x="300" y="300" width="560" height="140" rx="8" />
  <text class="cap" x="322" y="324">FOUR GATES, NONE OF THEM PROMPTABLE</text>
  <text class="item" x="322" y="350">1 — verified organisation, security and ethics record checked</text>
  <text class="item" x="322" y="372">2 — phishing-resistant MFA on every account that touches it</text>
  <text class="item" x="322" y="394">3 — access limited to security, IR or pen-test employees</text>
  <text class="item" x="322" y="416">4 — per-employee record of who used it, retained</text>

  <rect class="box" x="30" y="300" width="250" height="140" rx="8" />
  <text class="cap" x="50" y="324">WHAT AN ATTACKER CAN REACH</text>
  <text class="item" x="50" y="350">a brilliant jailbreak gets</text>
  <text class="item" x="50" y="368">you Path A, degraded</text>
  <text class="item" x="50" y="396">it does not get you a</text>
  <text class="item" x="50" y="414">Fairwind grant</text>

  <text class="cap" x="20" y="472">An entitlement cannot be talked around. That is the whole improvement — and the reason the model string stops naming a behaviour.</text>
</svg>
