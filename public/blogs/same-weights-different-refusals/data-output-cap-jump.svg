<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ot od">
  <title id="ot">Output token cap and the cost of one cap-filling response</title>
  <desc id="od">A horizontal bar chart on a logarithmic footing comparing output ceilings. Earlier Gemini models capped output at roughly 64,000 tokens, so one cap-filling response cost about 64 cents at ten dollars per million output tokens. Gemini 4 Argon raises the ceiling to one million tokens, so one cap-filling response costs about ten dollars at the introductory rate and about twenty dollars at the announced post-introductory rate of twenty dollars per million. The worst single call in a system therefore moves by roughly fifteen times, in a dimension most per-task budgets do not measure.</desc>
  <style>
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .strong { fill: var(--accent, #d4421e); stroke: none; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .rowh   { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; fill: var(--ink); }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .val-acc { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--accent, #d4421e); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .colh   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
    .grid   { stroke: var(--ink); stroke-width: .75; opacity: .18; stroke-dasharray: 3 4; }
  </style>

  <text class="title" x="20" y="26">One response that fills the cap</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <text class="colh" x="240" y="62">OUTPUT CEILING</text>
  <text class="colh" x="660" y="62">COST OF ONE FULL RESPONSE</text>

  <line class="grid" x1="240" y1="74" x2="240" y2="300" />
  <line class="grid" x1="410" y1="74" x2="410" y2="300" />
  <line class="grid" x1="580" y1="74" x2="580" y2="300" />

  <text class="rowh" x="20" y="108">Earlier Gemini</text>
  <text class="sub" x="20" y="126">64K cap, $10/M out</text>
  <rect class="weak" x="240" y="90" width="38" height="34" rx="4" />
  <text class="val" x="288" y="112">64,000</text>
  <text class="val" x="760" y="112">$0.64</text>

  <text class="rowh" x="20" y="184">Argon, introductory</text>
  <text class="sub" x="20" y="202">1M cap, $10/M out</text>
  <rect class="med" x="240" y="166" width="340" height="34" rx="4" />
  <text class="val" x="592" y="188">1,000,000</text>
  <text class="val-acc" x="760" y="188">$10.00</text>

  <text class="rowh" x="20" y="260">Argon, post-introductory</text>
  <text class="sub" x="20" y="278">1M cap, $20/M out</text>
  <rect class="strong" x="240" y="242" width="340" height="34" rx="4" />
  <text class="val" x="592" y="264">1,000,000</text>
  <text class="val-acc" x="760" y="264">$20.00</text>

  <line class="rule" x1="20" y1="314" x2="880" y2="314" />
  <text class="sub" x="20" y="340">The ceiling was doing unacknowledged work: it was the thing that terminated a runaway generation. A 15× cap turns a truncation</text>
  <text class="sub" x="20" y="358">error into an open-ended run, and most per-task budgets count calls or input tokens — neither of which changed.</text>
  <text class="sub" x="20" y="384">Bars are not to scale against each other beyond the 64K-versus-1M contrast; the cost figures are the point.</text>
</svg>
