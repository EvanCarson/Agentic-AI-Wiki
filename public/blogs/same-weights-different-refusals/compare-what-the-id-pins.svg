<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="ct cd">
  <title id="ct">What a model identifier used to pin down, and what it pins down now</title>
  <desc id="cd">Three columns. Before entitlement-gated policy tiers, a model identifier was treated as pinning the weights, the refusal policy and therefore the behaviour, so eval results, questionnaire answers and incident reports could all be keyed to it. Now it pins the weights only: two callers passing the same string can be served different refusal policies. The third column gives the replacement key — model identifier plus policy tier plus system prompt version plus tool list — which is the smallest set that a result can honestly be filed under.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .item   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .item-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>

  <text class="head" x="20" y="26">The behavioural primary key just lost a column</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <rect class="box" x="30" y="58" width="260" height="188" rx="8" />
  <text class="cap" x="46" y="80">WHAT WE ASSUMED</text>
  <text class="head" x="46" y="104">The ID pinned behaviour</text>
  <text class="item" x="46" y="132">weights: yes</text>
  <text class="item" x="46" y="152">refusal policy: yes</text>
  <text class="item" x="46" y="172">so: two callers, same string,</text>
  <text class="item" x="46" y="188">same answers</text>
  <text class="item" x="46" y="216">evals, questionnaires and</text>
  <text class="item" x="46" y="236">incidents all keyed to it</text>

  <rect class="adj" x="320" y="58" width="260" height="188" rx="8" />
  <text class="cap" x="336" y="80">WHAT IS TRUE NOW</text>
  <text class="head" x="336" y="104">The ID pins the weights</text>
  <text class="item" x="336" y="132">weights: yes</text>
  <text class="item" x="336" y="152">refusal policy: no</text>
  <text class="item" x="336" y="172">entitlement selects the</text>
  <text class="item" x="336" y="188">served policy</text>
  <text class="item" x="336" y="216">an unreproducible eval now</text>
  <text class="item" x="336" y="236">looks like harness drift</text>

  <rect class="hero" x="610" y="58" width="260" height="188" rx="8" />
  <text class="cap" x="626" y="80" fill="var(--paper)" opacity=".7">THE REPLACEMENT KEY</text>
  <text class="head-inv" x="626" y="104">Four fields, not one</text>
  <text class="item-inv" x="626" y="132">model identifier</text>
  <text class="item-inv" x="626" y="152">policy tier</text>
  <text class="item-inv" x="626" y="172">system prompt version</text>
  <text class="item-inv" x="626" y="192">tool list</text>
  <text class="item-inv" x="626" y="220">anything you cannot rebuild</text>
  <text class="item-inv" x="626" y="238">from these was never pinned</text>

  <text class="cap" x="30" y="278">One extra column, written once, converts a class of mysterious results into explicable ones.</text>
</svg>
