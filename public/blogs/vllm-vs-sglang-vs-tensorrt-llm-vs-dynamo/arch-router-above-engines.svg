<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where the router sits relative to the engines</title>
  <desc id="d">Agent traffic enters a router that holds a global index of which key-value cache blocks live on which worker. The router dispatches to workers, each running one engine — vLLM, SGLang or TensorRT-LLM — and each holding its own local prefix cache. Without the router, requests are spread across workers and the prefix cache on any one worker is missed.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label      { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
    .arrow-faint { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 4; opacity: .45; marker-end: url(#arr2); }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="box" x="40" y="40" width="250" height="76" />
  <text class="label" x="58" y="70">Agent traffic</text>
  <text class="sub" x="58" y="92">system prompt + tools + history, every turn</text>

  <rect class="hero" x="330" y="40" width="330" height="76" />
  <text class="label-inv" x="348" y="70">Router (Dynamo)</text>
  <text class="sub-inv" x="348" y="92">global index: which KV blocks on which worker</text>

  <rect class="box" x="700" y="40" width="160" height="76" />
  <text class="label" x="718" y="70">No router</text>
  <text class="sub" x="718" y="92">turn 2 lands</text>
  <text class="mono" x="718" y="108">~1/N on the right worker</text>

  <rect class="adj" x="40" y="210" width="240" height="120" />
  <text class="label" x="58" y="240">Worker 1 &#8212; vLLM</text>
  <text class="sub" x="58" y="262">block-level hashed prefix cache</text>
  <text class="mono" x="58" y="300">v0.31.0 &#183; 2026-10-05</text>

  <rect class="adj" x="330" y="210" width="240" height="120" />
  <text class="label" x="348" y="240">Worker 2 &#8212; SGLang</text>
  <text class="sub" x="348" y="262">token-level radix tree, Rust core</text>
  <text class="mono" x="348" y="300">v0.5.21 &#183; 2026-10-02</text>

  <rect class="adj" x="620" y="210" width="240" height="120" />
  <text class="label" x="638" y="240">Worker 3 &#8212; TensorRT-LLM</text>
  <text class="sub" x="638" y="262">compiled engine, KV reuse</text>
  <text class="mono" x="638" y="300">1.3.0rc &#183; NVIDIA only</text>

  <rect class="box" x="40" y="400" width="820" height="66" />
  <text class="label" x="58" y="428">Each worker&#8217;s prefix cache is local. Reuse is whatever your routing delivers to it.</text>
  <text class="sub" x="58" y="452">Dynamo v1.5.0 pins SGLang v0.5.18, TensorRT-LLM v1.3.0rc25, vLLM v0.28.0 &#8212; the router sets the engine calendar.</text>

  <path class="arrow" d="M 290 78 L 325 78" />
  <path class="arrow" d="M 450 116 L 160 205" />
  <path class="arrow" d="M 490 116 L 450 205" />
  <path class="arrow" d="M 550 116 L 730 205" />
  <path class="arrow-faint" d="M 780 116 L 780 180 L 240 180 L 160 200" />
</svg>
