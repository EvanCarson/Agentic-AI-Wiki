<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Prefix cache hit rate by routing posture</title>
  <desc id="d">Horizontal bars comparing reported prefix cache hit rates: a single worker holding the session reaches 85 to 97 percent, cache-aware routing across four replicas reaches 89 percent in one third-party test, and spreading requests evenly across four replicas without cache-aware routing lands near the one-over-N approximation of 25 percent.</desc>
  <style>
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .cat     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cat2    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .val     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; }
    .axis    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .55; }
    .grid    { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .bar-a   { fill: var(--accent, #d4421e); }
    .bar-b   { fill: var(--accent-soft); }
    .bar-c   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .note    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="chart-title" x="40" y="40">Reported prefix cache hit rate (%)</text>

  <line class="grid" x1="340" y1="70" x2="340" y2="310" />
  <line class="grid" x1="467" y1="70" x2="467" y2="310" />
  <line class="grid" x1="594" y1="70" x2="594" y2="310" />
  <line class="grid" x1="721" y1="70" x2="721" y2="310" />
  <line class="grid" x1="848" y1="70" x2="848" y2="310" />

  <text class="cat" x="40" y="102">Session pinned to one worker</text>
  <text class="cat2" x="40" y="118">vendor-reported, coding-agent traffic</text>
  <rect class="bar-a" x="340" y="88" width="432" height="28" rx="3" />
  <text class="val" x="784" y="108" fill="var(--accent, #d4421e)">85&#8211;97</text>

  <text class="cat" x="40" y="182">Cache-aware routing, 4 replicas</text>
  <text class="cat2" x="40" y="198">third-party test, ~50k-token inputs</text>
  <rect class="bar-b" x="340" y="168" width="452" height="28" rx="3" />
  <text class="val" x="804" y="188" fill="var(--ink)">89</text>

  <text class="cat" x="40" y="262">Even spread, 4 replicas</text>
  <text class="cat2" x="40" y="278">1/N approximation, not a measurement</text>
  <rect class="bar-c" x="340" y="248" width="127" height="28" rx="3" />
  <text class="val" x="479" y="268" fill="var(--ink)">~25</text>

  <line class="grid" x1="340" y1="310" x2="848" y2="310" />
  <text class="axis" x="336" y="330">0</text>
  <text class="axis" x="458" y="330">25</text>
  <text class="axis" x="585" y="330">50</text>
  <text class="axis" x="712" y="330">75</text>
  <text class="axis" x="838" y="330">100</text>

  <text class="note" x="40" y="366">Same engine, same model, same traffic in all three rows. The variable is routing.</text>
</svg>
