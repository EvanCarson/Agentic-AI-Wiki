<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Where each project leans hardest</title>
  <desc id="d">A matrix of four projects against four axes. Rows are vLLM, SGLang, TensorRT-LLM and Dynamo. Columns are prefix cache mechanism, hardware and ecosystem breadth, setup cost, and cross-replica cache routing. Dynamo is the only row strong on cross-replica routing and the only one that is not itself an engine.</desc>
  <style>
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .rowlab  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .collab  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .cell    { stroke: var(--paper); stroke-width: 2; }
    .strong  { fill: var(--accent, #d4421e); }
    .medium  { fill: var(--accent-soft); }
    .weak    { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cellt   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .cellt-d { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .legend  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="chart-title" x="40" y="34">Prefix reuse, breadth, setup cost, cross-replica routing</text>

  <text class="collab" x="282" y="66">prefix cache</text>
  <text class="collab" x="430" y="66">breadth</text>
  <text class="collab" x="558" y="66">cheap setup</text>
  <text class="collab" x="696" y="66">cross-replica</text>

  <text class="rowlab" x="40" y="104">vLLM</text>
  <rect class="cell medium" x="270" y="80" width="130" height="38" />
  <text class="cellt-d" x="288" y="104">block hash</text>
  <rect class="cell strong" x="410" y="80" width="130" height="38" />
  <text class="cellt" x="452" y="104">strong</text>
  <rect class="cell strong" x="550" y="80" width="130" height="38" />
  <text class="cellt" x="592" y="104">strong</text>
  <rect class="cell weak" x="690" y="80" width="130" height="38" />
  <text class="cellt-d" x="726" y="104">not its job</text>

  <text class="rowlab" x="40" y="164">SGLang</text>
  <rect class="cell strong" x="270" y="140" width="130" height="38" />
  <text class="cellt" x="288" y="164">radix tree</text>
  <rect class="cell medium" x="410" y="140" width="130" height="38" />
  <text class="cellt-d" x="450" y="164">medium</text>
  <rect class="cell medium" x="550" y="140" width="130" height="38" />
  <text class="cellt-d" x="590" y="164">medium</text>
  <rect class="cell weak" x="690" y="140" width="130" height="38" />
  <text class="cellt-d" x="726" y="164">not its job</text>

  <text class="rowlab" x="40" y="224">TensorRT-LLM</text>
  <rect class="cell medium" x="270" y="200" width="130" height="38" />
  <text class="cellt-d" x="294" y="224">KV reuse</text>
  <rect class="cell weak" x="410" y="200" width="130" height="38" />
  <text class="cellt-d" x="440" y="224">NVIDIA only</text>
  <rect class="cell weak" x="550" y="200" width="130" height="38" />
  <text class="cellt-d" x="596" y="224">weak</text>
  <rect class="cell weak" x="690" y="200" width="130" height="38" />
  <text class="cellt-d" x="726" y="224">not its job</text>

  <text class="rowlab" x="40" y="284">Dynamo</text>
  <rect class="cell weak" x="270" y="260" width="130" height="38" />
  <text class="cellt-d" x="296" y="284">delegated</text>
  <rect class="cell medium" x="410" y="260" width="130" height="38" />
  <text class="cellt-d" x="440" y="284">3 backends</text>
  <rect class="cell weak" x="550" y="260" width="130" height="38" />
  <text class="cellt-d" x="596" y="284">weak</text>
  <rect class="cell strong" x="690" y="260" width="130" height="38" />
  <text class="cellt" x="732" y="284">strong</text>

  <rect class="strong" x="270" y="330" width="16" height="16" rx="3" />
  <text class="legend" x="294" y="343">leads on this axis</text>
  <rect class="medium" x="470" y="330" width="16" height="16" rx="3" />
  <text class="legend" x="494" y="343">competent</text>
  <rect class="weak" x="650" y="330" width="16" height="16" rx="3" />
  <text class="legend" x="674" y="343">not where it competes</text>

  <text class="legend" x="40" y="378">Only one row is strong in the right-hand column, and it is the row that is not an engine.</text>
</svg>
