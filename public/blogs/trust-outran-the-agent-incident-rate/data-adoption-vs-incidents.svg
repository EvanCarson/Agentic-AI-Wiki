<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Sentiment and failure findings from the same survey</title>
  <desc id="d">Horizontal bar chart on a nought to one hundred per cent scale, split into two groups. The sentiment group shows agents improved or revolutionised productivity at 91.1 per cent, trust agent output at least somewhat at 85.5 per cent, and daily agent use at 80.8 per cent with a marker at the 47.3 per cent figure from a year earlier. The failure group shows agent-related issues daily or more at 41.1 per cent, tracking state named as the top blocker at 35.7 per cent, and agent-related issues continuously at 9.0 per cent. All six figures come from the same 554 respondents.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); }
    .med    { fill: var(--accent-soft); }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .title  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .grp    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .grid   { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 3 4; }
    .mark   { stroke: var(--ink); stroke-width: 1.5; opacity: .8; }
  </style>

  <text class="title" x="24" y="28">One survey, 554 respondents (per cent)</text>

  <line class="grid" x1="330" y1="44" x2="330" y2="340" />
  <line class="grid" x1="465" y1="44" x2="465" y2="340" />
  <line class="grid" x1="600" y1="44" x2="600" y2="340" />
  <line class="grid" x1="735" y1="44" x2="735" y2="340" />
  <line class="grid" x1="870" y1="44" x2="870" y2="340" />
  <text class="note" x="322" y="362">0</text>
  <text class="note" x="453" y="362">25</text>
  <text class="note" x="588" y="362">50</text>
  <text class="note" x="723" y="362">75</text>
  <text class="note" x="854" y="362">100</text>

  <text class="grp" x="24" y="62">HOW ENGINEERS FEEL ABOUT AGENTS</text>

  <text class="row" x="24" y="90">Productivity improved</text>
  <rect class="strong" x="330" y="76" width="492" height="20" />
  <text class="val" x="830" y="91">91.1</text>

  <text class="row" x="24" y="124">Trust output at least somewhat</text>
  <rect class="strong" x="330" y="110" width="462" height="20" />
  <text class="val" x="800" y="125">85.5</text>

  <text class="row" x="24" y="158">Use agents daily or more</text>
  <rect class="strong" x="330" y="144" width="436" height="20" />
  <line class="mark" x1="585" y1="140" x2="585" y2="168" />
  <text class="val" x="774" y="159">80.8</text>
  <text class="note" x="510" y="186">47.3 a year earlier</text>

  <line x1="24" y1="204" x2="876" y2="204" stroke="var(--ink)" stroke-width="1" opacity=".25" />

  <text class="grp" x="24" y="228">WHAT AGENTS DID TO THEM LAST WEEK</text>

  <text class="row" x="24" y="256">Agent issues daily or more</text>
  <rect class="med" x="330" y="242" width="222" height="20" />
  <text class="val" x="560" y="257">41.1</text>

  <text class="row" x="24" y="290">Top blocker: tracking state</text>
  <rect class="weak" x="330" y="276" width="193" height="20" />
  <text class="val" x="531" y="291">35.7</text>

  <text class="row" x="24" y="324">Agent issues continuously</text>
  <rect class="med" x="330" y="310" width="49" height="20" />
  <text class="val" x="387" y="325">9.0</text>

  <text class="note" x="24" y="390">Surveyed 29 April – 25 May 2026, US and UK, self-reported.</text>
</svg>
