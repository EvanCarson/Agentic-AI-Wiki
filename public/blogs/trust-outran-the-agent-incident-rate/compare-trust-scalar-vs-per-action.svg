<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Trust as a scalar against trust as a per-action delegation</title>
  <desc id="d">Three columns. The first, trust as a scalar, is what a survey asks: do you trust the output, answered on one agree-disagree scale that aggregates every action an agent could take and cannot separate reading a file from issuing a refund. The second, trust as a per-action delegation, is the decision a team actually makes: a list of which actions run unreviewed, which require approval and which are never delegated, each carrying its own reversal cost. The third column notes that the first is a disposition that costs nothing to hold while the second is a policy with a blast radius, and that a team can score high on the first while having never written the second down.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
  </style>

  <rect class="box" x="24" y="36" width="266" height="228" />
  <text class="head" x="44" y="66">Trust as a scalar</text>
  <text class="sub" x="44" y="100">"do you trust the output?"</text>
  <text class="sub" x="44" y="124">one agree–disagree scale</text>
  <text class="sub" x="44" y="148">reading a file = issuing a refund</text>
  <line x1="44" y1="176" x2="270" y2="176" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="44" y="200">WHAT THE SURVEY ASKED</text>
  <text class="label" x="44" y="228">costs nothing to hold,</text>
  <text class="label" x="44" y="248">and predicts nothing</text>

  <rect class="adj" x="314" y="36" width="266" height="228" />
  <text class="head" x="334" y="66">Trust per action</text>
  <text class="sub" x="334" y="100">runs unreviewed</text>
  <text class="sub" x="334" y="124">needs approval first</text>
  <text class="sub" x="334" y="148">never delegated</text>
  <line x1="334" y1="176" x2="560" y2="176" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="334" y="200">WHAT THE TEAM DECIDES</text>
  <text class="label" x="334" y="228">each line carries its own</text>
  <text class="label" x="334" y="248">reversal cost</text>

  <rect class="hero" x="604" y="36" width="266" height="228" />
  <text class="head-inv" x="624" y="66">The gap</text>
  <text class="sub-inv" x="624" y="100">85.5% answered the first</text>
  <text class="sub-inv" x="624" y="124">most teams never wrote the second</text>
  <text class="sub-inv" x="624" y="148">41.1% live in the difference</text>
  <line x1="624" y1="176" x2="850" y2="176" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag" x="624" y="200" fill="var(--paper)" opacity=".85">MEASURE INSTEAD</text>
  <text class="label-inv" x="624" y="228">review rate per action class,</text>
  <text class="label-inv" x="624" y="248">and change rate when reviewed</text>
</svg>
