<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where an agent failure terminates, compared with a service failure</title>
  <desc id="d">Two horizontal paths. The upper path, a conventional service, runs from a failure through a code error handler, then a retry or fallback, then an alert, and ends in an incident record and error budget that a team reviews. The lower path, an agent workflow, runs from a failure to the engineer at the keyboard, who rewrites the prompt or reruns the task, and terminates there: no alert, no incident record, no error budget entry. A panel underneath explains that this is why a 41 per cent daily failure rate can persist without appearing on any dashboard, and proposes a single boolean field on the run record recording that a human intervened.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="tag" x="24" y="34">A CONVENTIONAL SERVICE</text>

  <rect class="box" x="24" y="48" width="150" height="70" />
  <text class="label" x="42" y="80">failure</text>
  <text class="sub" x="42" y="100">timeout, 500, bad row</text>

  <path class="arrow" d="M 178 83 L 208 83" />
  <rect class="box" x="212" y="48" width="150" height="70" />
  <text class="label" x="230" y="80">error handler</text>
  <text class="sub" x="230" y="100">retry, fallback</text>

  <path class="arrow" d="M 366 83 L 396 83" />
  <rect class="adj" x="400" y="48" width="150" height="70" />
  <text class="label" x="418" y="80">alert</text>
  <text class="sub" x="418" y="100">a pager, a threshold</text>

  <path class="arrow" d="M 554 83 L 584 83" />
  <rect class="hero" x="588" y="48" width="288" height="70" />
  <text class="label-inv" x="608" y="80">incident record, error budget</text>
  <text class="sub-inv" x="608" y="100">reviewed, trended, argued about</text>

  <line x1="24" y1="156" x2="876" y2="156" stroke="var(--ink)" stroke-width="1" opacity=".25" />

  <text class="tag" x="24" y="190">AN AGENT WORKFLOW</text>

  <rect class="box" x="24" y="204" width="150" height="70" />
  <text class="label" x="42" y="236">failure</text>
  <text class="sub" x="42" y="256">wrong patch, lost state</text>

  <path class="arrow" d="M 178 239 L 208 239" />
  <rect class="adj" x="212" y="204" width="150" height="70" />
  <text class="label" x="230" y="236">the engineer</text>
  <text class="sub" x="230" y="256">notices it directly</text>

  <path class="arrow" d="M 366 239 L 396 239" />
  <rect class="adj" x="400" y="204" width="150" height="70" />
  <text class="label" x="418" y="236">rerun, rewrite, redo</text>
  <text class="sub" x="418" y="256">about a minute</text>

  <path class="arrow" d="M 554 239 L 584 239" />
  <rect class="box" x="588" y="204" width="288" height="70" />
  <text class="label" x="608" y="236">nothing is emitted</text>
  <text class="sub" x="608" y="256">no alert, no record, no budget line</text>

  <rect class="hero" x="24" y="316" width="852" height="76" />
  <text class="label-inv" x="48" y="348">A handled error is still an error. This one is handled by the most expensive component in the loop,</text>
  <text class="sub-inv" x="48" y="372">which is why 41.1% can be true and invisible at the same time.</text>

  <rect class="box" x="24" y="412" width="852" height="66" />
  <text class="head" x="48" y="442">The cheap fix: one boolean on the run record — a human intervened — plus the task class.</text>
  <text class="sub" x="48" y="464">A week of that ranks task classes by intervention rate, and the daily failure rate stops being evenly spread.</text>
</svg>
