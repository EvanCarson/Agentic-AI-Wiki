<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">OpenAI Codex Background CU + Operator — cloud VM, browser only</title>
  <desc id="d">GPT-5.6 on the left sends actions through a DOM event channel into an OpenAI-managed cloud VM on the right that contains only a sandboxed Chromium browser — no filesystem or native apps are accessible.</desc>
  <style>
    .box      { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .hero     { fill: var(--accent, #d4421e); stroke: none; }
    .adj      { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .label    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--ink, #1a1a1a); }
    .label-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--paper, #fff); }
    .sub      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .80; }
    .note     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); font-style: italic; }
    .env-label{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: var(--muted, #888); letter-spacing: .08em; }
    .annot    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--muted, #888); font-style: italic; }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .env-rect { fill: none; stroke: currentColor; stroke-width: 1.75; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Hero: GPT-5.6 -->
  <rect class="hero" x="40" y="170" width="160" height="120" rx="10" ry="10" />
  <text class="label-inv" x="120" y="218" text-anchor="middle" font-size="15" font-weight="600">GPT-5.6</text>
  <text class="sub-inv" x="120" y="238" text-anchor="middle">Codex Background</text>
  <text class="sub-inv" x="120" y="256" text-anchor="middle">CU + Operator</text>

  <!-- Adjacent: DOM event channel -->
  <rect class="adj" x="260" y="185" width="160" height="90" rx="10" ry="10" />
  <text class="label" x="340" y="222" text-anchor="middle">DOM event</text>
  <text class="label" x="340" y="240" text-anchor="middle">channel</text>
  <text class="sub" x="340" y="262" text-anchor="middle">browser events only</text>

  <!-- Arrow: GPT → DOM channel -->
  <line class="arrow" x1="200" y1="230" x2="258" y2="230" />

  <!-- Envelope: OPENAI CLOUD VM (solid border) -->
  <rect class="env-rect" x="480" y="80" width="390" height="330" rx="14" ry="14" />
  <text class="env-label" x="675" y="104" text-anchor="middle">OPENAI CLOUD VM</text>

  <!-- Arrow: DOM channel → envelope entry -->
  <line class="arrow" x1="420" y1="230" x2="478" y2="230" />

  <!-- Sandboxed Chromium box (large, paper-2) -->
  <rect class="box" x="510" y="126" width="330" height="240" rx="10" ry="10" />
  <text class="label" x="675" y="200" text-anchor="middle" font-size="15" font-weight="600">Sandboxed Chromium</text>
  <text class="note" x="675" y="228" text-anchor="middle">(browser only —</text>
  <text class="note" x="675" y="246" text-anchor="middle">no FS, no native apps)</text>

  <!-- Annotation block (audit trail + containment) -->
  <text class="annot" x="120" y="348" text-anchor="middle">Audit trail</text>
  <text class="annot" x="120" y="368" text-anchor="middle">Credential containment</text>
</svg>
