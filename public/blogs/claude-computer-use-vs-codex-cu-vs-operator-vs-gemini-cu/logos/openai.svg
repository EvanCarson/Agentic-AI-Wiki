<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OpenAI logo">
  <!-- Stylized "O" ring with a six-point rotational inner geometry —
       evocative of OpenAI's circular mark without reproducing it.
       Outer ring in currentColor; inner star-hexagon in accent.
       Inlined by BlogLayout; colors resolve from the page CSS cascade. -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2.5" />
  <circle cx="16" cy="16" r="5" fill="none" stroke="currentColor" stroke-width="1.5" />
  <!-- Six short radial spokes connecting inner ring to outer ring -->
  <line x1="16" y1="4"  x2="16" y2="9"  stroke="var(--accent, #d4421e)" stroke-width="2" stroke-linecap="round" />
  <line x1="16" y1="23" x2="16" y2="28" stroke="var(--accent, #d4421e)" stroke-width="2" stroke-linecap="round" />
  <line x1="4.7"  y1="10" x2="8.9"  y2="12.5" stroke="var(--accent, #d4421e)" stroke-width="2" stroke-linecap="round" />
  <line x1="23.1" y1="19.5" x2="27.3" y2="22"  stroke="var(--accent, #d4421e)" stroke-width="2" stroke-linecap="round" />
  <line x1="4.7"  y1="22" x2="8.9"  y2="19.5" stroke="var(--accent, #d4421e)" stroke-width="2" stroke-linecap="round" />
  <line x1="23.1" y1="12.5" x2="27.3" y2="10"  stroke="var(--accent, #d4421e)" stroke-width="2" stroke-linecap="round" />
</svg>
