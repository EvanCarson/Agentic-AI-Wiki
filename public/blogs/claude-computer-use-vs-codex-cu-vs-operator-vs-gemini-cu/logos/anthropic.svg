<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Anthropic logo">
  <!-- Stylized "A" — two diagonal strokes meeting at an apex, with a
       crossbar. The left and right legs fan slightly outward at the base.
       Accent fill on the crossbar gives it a distinctive two-tone feel.
       Inlined by BlogLayout; var(--accent) + currentColor resolve from
       the page cascade, so dark-mode theming is automatic. -->
  <path d="M 16 4 L 5 28 L 9 28 L 16 11 L 23 28 L 27 28 Z" fill="currentColor" />
  <rect x="10.5" y="19" width="11" height="2.5" rx="1" fill="var(--accent, #d4421e)" />
</svg>
