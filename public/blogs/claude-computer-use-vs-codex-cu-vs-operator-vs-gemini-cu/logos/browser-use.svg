<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="browser-use logo">
  <!-- Browser window outline: rounded rectangle with a title-bar strip
       containing three small dots (macOS-style traffic lights), and a
       cursor arrow overlaid in the content area to suggest automation.
       Frame + bar in currentColor; cursor tip in accent.
       Inlined by BlogLayout; colors resolve from the page CSS cascade. -->
  <!-- Browser frame -->
  <rect x="2" y="4" width="28" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="2" />
  <!-- Title bar divider -->
  <line x1="2" y1="11" x2="30" y2="11" stroke="currentColor" stroke-width="1.5" />
  <!-- Three traffic-light dots -->
  <circle cx="7"  cy="7.5" r="1.5" fill="currentColor" />
  <circle cx="12" cy="7.5" r="1.5" fill="currentColor" />
  <circle cx="17" cy="7.5" r="1.5" fill="currentColor" />
  <!-- Cursor arrow in content area (pointing upper-left) -->
  <path d="M 10 15 L 10 25 L 13 22 L 15.5 27 L 17.5 26.2 L 15 21.2 L 19 21.2 Z"
        fill="var(--accent, #d4421e)" stroke="var(--paper, #fff)" stroke-width="0.75" stroke-linejoin="round" />
</svg>
