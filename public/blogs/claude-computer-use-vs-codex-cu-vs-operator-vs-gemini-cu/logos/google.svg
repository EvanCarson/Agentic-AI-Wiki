<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Google logo">
  <!-- Stylized "G" — open arc with a horizontal notch cut into the right
       side, evoking Google's distinctive letterform in monochrome.
       Arc in currentColor; notch fill in accent.
       Inlined by BlogLayout; colors resolve from the page CSS cascade. -->
  <!-- Outer arc: a nearly-full circle with a gap at the upper-right -->
  <path d="M 26 13 A 11 11 0 1 0 27 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
  <!-- Horizontal crossbar (the G's inner shelf) -->
  <line x1="16" y1="16" x2="27" y2="16" stroke="var(--accent, #d4421e)" stroke-width="3" stroke-linecap="round" />
</svg>
