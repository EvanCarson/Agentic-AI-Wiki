<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Claude Computer Use — your sandbox, portable harness</title>
  <desc id="d">Claude model on the left sends screenshot-and-input actions via a tool layer into a user-controlled machine or container on the right, which runs desktop apps, a terminal, the filesystem, and a browser.</desc>
  <style>
    .box      { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .hero     { fill: var(--accent, #d4421e); stroke: none; }
    .adj      { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .label    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--ink, #1a1a1a); }
    .label-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--paper, #fff); }
    .sub      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .80; }
    .env-label{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: var(--muted, #888); letter-spacing: .08em; }
    .annot    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--muted, #888); font-style: italic; }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .env-rect { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 8 5; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Hero: Claude model box -->
  <rect class="hero" x="40" y="170" width="160" height="120" rx="10" ry="10" />
  <text class="label-inv" x="120" y="222" text-anchor="middle" font-size="15" font-weight="600">Claude</text>
  <text class="sub-inv" x="120" y="242" text-anchor="middle">Computer Use</text>
  <text class="sub-inv" x="120" y="260" text-anchor="middle">model</text>

  <!-- Adjacent: screenshot + tool box -->
  <rect class="adj" x="260" y="170" width="160" height="120" rx="10" ry="10" />
  <text class="label" x="340" y="218" text-anchor="middle">Screenshot</text>
  <text class="label" x="340" y="236" text-anchor="middle">+ Input</text>
  <text class="sub" x="340" y="258" text-anchor="middle">mouse · keyboard</text>
  <text class="sub" x="340" y="274" text-anchor="middle">tool layer</text>

  <!-- Arrow: Claude → tool -->
  <line class="arrow" x1="200" y1="230" x2="258" y2="230" />

  <!-- Envelope: YOUR MACHINE / VM / CONTAINER -->
  <rect class="env-rect" x="480" y="80" width="390" height="330" rx="14" ry="14" />
  <text class="env-label" x="675" y="104" text-anchor="middle">YOUR MACHINE / VM / CONTAINER</text>

  <!-- Arrow: tool layer → envelope entry -->
  <line class="arrow" x1="420" y1="230" x2="478" y2="230" />

  <!-- Interior boxes (paper-2) — 2×2 grid inside envelope -->
  <!-- Desktop apps: top-left -->
  <rect class="box" x="504" y="120" width="154" height="68" rx="8" ry="8" />
  <text class="label" x="581" y="150" text-anchor="middle">Desktop apps</text>
  <text class="sub" x="581" y="170" text-anchor="middle">Electron · native GUI</text>

  <!-- Terminal: top-right -->
  <rect class="box" x="700" y="120" width="150" height="68" rx="8" ry="8" />
  <text class="label" x="775" y="150" text-anchor="middle">Terminal</text>
  <text class="sub" x="775" y="170" text-anchor="middle">shell · scripts</text>

  <!-- Filesystem: bottom-left -->
  <rect class="box" x="504" y="230" width="154" height="68" rx="8" ry="8" />
  <text class="label" x="581" y="260" text-anchor="middle">Filesystem</text>
  <text class="sub" x="581" y="280" text-anchor="middle">read · write · watch</text>

  <!-- Browser: bottom-right -->
  <rect class="box" x="700" y="230" width="150" height="68" rx="8" ry="8" />
  <text class="label" x="775" y="260" text-anchor="middle">Browser</text>
  <text class="sub" x="775" y="280" text-anchor="middle">Chromium · web</text>

  <!-- Side annotation below -->
  <text class="annot" x="120" y="360" text-anchor="middle">Portable, OS-agnostic —</text>
  <text class="annot" x="120" y="378" text-anchor="middle">sandbox is yours</text>
</svg>
