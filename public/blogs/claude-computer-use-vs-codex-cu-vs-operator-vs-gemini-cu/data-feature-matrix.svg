<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Computer-use feature comparison matrix</title>
  <desc id="d">Heatmap comparing Claude CU, OpenAI CUA, Gemini CU, and browser-use across Surface, Deployment, Safety model, Latency, and Open-weights. Fill color encodes strength: light (weak), soft orange (medium), solid accent (strong).</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <!--
    Layout:
    Left margin (row labels): 170px
    5 columns × 140px = 700px; end x = 870
    Header text y: 52 / 64
    4 rows × 62px; rows start y=76
    Row tops: 76, 138, 200, 262
    Row centers: 107, 169, 231, 293
    Legend y: 350
  -->

  <!-- Column headers -->
  <text class="col-head" x="240" y="52">Surface</text>
  <text class="col-head" x="380" y="52">Deployment</text>
  <text class="col-head" x="520" y="52">Safety model</text>
  <text class="col-head" x="660" y="52">Latency</text>
  <text class="col-head" x="800" y="52">Open-weights</text>

  <!-- ===== Row 1: Claude CU ===== -->
  <text class="row-head" x="162" y="107">Claude CU</text>
  <!-- Surface: Full desktop — STRONG -->
  <rect class="cell-strong" x="170" y="76" width="140" height="62" rx="4" />
  <text class="cell-text-inv" x="240" y="101">Full desktop</text>
  <!-- Deployment: Your machine — STRONG -->
  <rect class="cell-strong" x="310" y="76" width="140" height="62" rx="4" />
  <text class="cell-text-inv" x="380" y="101">Your machine</text>
  <!-- Safety model: Human-in-loop — MEDIUM -->
  <rect class="cell-medium" x="450" y="76" width="140" height="62" rx="4" />
  <text class="cell-text" x="520" y="101">Human-in-loop</text>
  <!-- Latency: Medium — MEDIUM -->
  <rect class="cell-medium" x="590" y="76" width="140" height="62" rx="4" />
  <text class="cell-text" x="660" y="107">Medium</text>
  <!-- Open-weights: No — WEAK -->
  <rect class="cell-weak" x="730" y="76" width="140" height="62" rx="4" />
  <text class="cell-text" x="800" y="107">No</text>

  <!-- ===== Row 2: OpenAI CUA ===== -->
  <text class="row-head" x="162" y="169">OpenAI CUA</text>
  <!-- Surface: Web only — WEAK -->
  <rect class="cell-weak" x="170" y="138" width="140" height="62" rx="4" />
  <text class="cell-text" x="240" y="169">Web only</text>
  <!-- Deployment: Their VM — STRONG -->
  <rect class="cell-strong" x="310" y="138" width="140" height="62" rx="4" />
  <text class="cell-text-inv" x="380" y="169">Their VM</text>
  <!-- Safety model: Containment — STRONG -->
  <rect class="cell-strong" x="450" y="138" width="140" height="62" rx="4" />
  <text class="cell-text-inv" x="520" y="169">Containment</text>
  <!-- Latency: Medium — MEDIUM -->
  <rect class="cell-medium" x="590" y="138" width="140" height="62" rx="4" />
  <text class="cell-text" x="660" y="169">Medium</text>
  <!-- Open-weights: No — WEAK -->
  <rect class="cell-weak" x="730" y="138" width="140" height="62" rx="4" />
  <text class="cell-text" x="800" y="169">No</text>

  <!-- ===== Row 3: Gemini CU ===== -->
  <text class="row-head" x="162" y="231">Gemini CU</text>
  <!-- Surface: Web only — WEAK -->
  <rect class="cell-weak" x="170" y="200" width="140" height="62" rx="4" />
  <text class="cell-text" x="240" y="231">Web only</text>
  <!-- Deployment: Their VM — STRONG -->
  <rect class="cell-strong" x="310" y="200" width="140" height="62" rx="4" />
  <text class="cell-text-inv" x="380" y="231">Their VM</text>
  <!-- Safety model: Containment — MEDIUM -->
  <rect class="cell-medium" x="450" y="200" width="140" height="62" rx="4" />
  <text class="cell-text" x="520" y="231">Containment</text>
  <!-- Latency: Low — STRONG -->
  <rect class="cell-strong" x="590" y="200" width="140" height="62" rx="4" />
  <text class="cell-text-inv" x="660" y="231">Low</text>
  <!-- Open-weights: No — WEAK -->
  <rect class="cell-weak" x="730" y="200" width="140" height="62" rx="4" />
  <text class="cell-text" x="800" y="231">No</text>

  <!-- ===== Row 4: browser-use ===== -->
  <text class="row-head" x="162" y="293">browser-use</text>
  <!-- Surface: Web only — WEAK -->
  <rect class="cell-weak" x="170" y="262" width="140" height="62" rx="4" />
  <text class="cell-text" x="240" y="293">Web only</text>
  <!-- Deployment: Your machine — STRONG -->
  <rect class="cell-strong" x="310" y="262" width="140" height="62" rx="4" />
  <text class="cell-text-inv" x="380" y="293">Your machine</text>
  <!-- Safety model: Your responsibility — WEAK -->
  <rect class="cell-weak" x="450" y="262" width="140" height="62" rx="4" />
  <text class="cell-text" x="520" y="281">Your</text>
  <text class="cell-text" x="520" y="299">responsibility</text>
  <!-- Latency: Medium — MEDIUM -->
  <rect class="cell-medium" x="590" y="262" width="140" height="62" rx="4" />
  <text class="cell-text" x="660" y="293">Medium</text>
  <!-- Open-weights: Yes — STRONG -->
  <rect class="cell-strong" x="730" y="262" width="140" height="62" rx="4" />
  <text class="cell-text-inv" x="800" y="293">Yes</text>

  <!-- Legend -->
  <rect class="legend-box-w" x="170" y="348" width="16" height="16" rx="3" />
  <text class="legend-text" x="193" y="356">Weak</text>

  <rect class="legend-box-m" x="258" y="348" width="16" height="16" rx="3" />
  <text class="legend-text" x="281" y="356">Medium</text>

  <rect class="legend-box-s" x="360" y="348" width="16" height="16" rx="3" />
  <text class="legend-text" x="383" y="356">Strong</text>
</svg>
