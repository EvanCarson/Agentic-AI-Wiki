<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What differs, what is advertised, and how to choose</title>
  <desc id="d">Three columns. What actually differs between the four platforms: the origin of the test caller, whether prices are published, whether audio or only transcripts are scored, and how the judge is constrained. What is advertised but rarely decides anything: headline concurrency numbers, dashboard design, integration counts, and vendor comparison pages. How to choose: match the platform to where your failure corpus already lives, insist on a per-unit price you can compute yourself, split deterministic assertions from judged content before signing, and confirm you can export the suite.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
  </style>

  <rect class="box" x="24" y="36" width="266" height="228" />
  <text class="head" x="44" y="66">What actually differs</text>
  <text class="sub" x="44" y="100">where the caller comes from</text>
  <text class="sub" x="44" y="124">published price, or a demo</text>
  <text class="sub" x="44" y="148">audio scored, or transcript only</text>
  <text class="sub" x="44" y="172">how the judge is constrained</text>
  <line x1="44" y1="196" x2="270" y2="196" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="44" y="220">EVALUATE THESE FOUR</text>
  <text class="label" x="44" y="248">the rest is a preference</text>

  <rect class="adj" x="314" y="36" width="266" height="228" />
  <text class="head" x="334" y="66">What the demo is about</text>
  <text class="sub" x="334" y="100">1,000+ vs 2,000+ concurrency</text>
  <text class="sub" x="334" y="124">dashboard design</text>
  <text class="sub" x="334" y="148">integration counts</text>
  <text class="sub" x="334" y="172">their page about a rival</text>
  <line x1="334" y1="196" x2="560" y2="196" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="334" y="220">NONE OF IT BINDS</text>
  <text class="label" x="334" y="248">your telephony caps first</text>

  <rect class="hero" x="604" y="36" width="266" height="228" />
  <text class="head-inv" x="624" y="66">How to choose</text>
  <text class="sub-inv" x="624" y="100">follow your failure corpus</text>
  <text class="sub-inv" x="624" y="124">demand a computable unit price</text>
  <text class="sub-inv" x="624" y="148">split assertions from judging</text>
  <text class="sub-inv" x="624" y="172">confirm you can export the suite</text>
  <line x1="624" y1="196" x2="850" y2="196" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag" x="624" y="220" fill="var(--paper)" opacity=".85">TWENTY CALLS, TWO WEEKS</text>
  <text class="label-inv" x="624" y="248">the suite is the asset</text>
</svg>
