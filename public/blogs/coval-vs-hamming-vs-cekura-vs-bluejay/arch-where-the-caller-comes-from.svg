<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where the test caller comes from, and how the call is scored</title>
  <desc id="d">Four sources of a test caller feed one voice agent under test: generated personas written from a prompt, replayed audio from real production calls, a pinned scenario suite running in continuous integration, and high-volume generated scenarios bought by the minute. The agent under test sits in the centre. Below it the scoring layer splits into two paths: deterministic assertions over interaction properties such as barge-in, endpointing, latency and DTMF, and a language-model judge over the transcript for content accuracy. A note records that the realism of the source sets the ceiling on the entire evaluation.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); opacity: .7; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="24" y="30">Where the caller comes from</text>

  <rect class="box" x="24" y="46" width="196" height="82" rx="8" />
  <text class="label" x="42" y="74">Generated personas</text>
  <text class="sub" x="42" y="94">written from your prompt —</text>
  <text class="sub" x="42" y="112">cannot surprise you</text>

  <rect class="adj" x="236" y="46" width="196" height="82" rx="8" />
  <text class="label" x="254" y="74">Replayed production</text>
  <text class="sub" x="254" y="94">real accents, cross-talk,</text>
  <text class="sub" x="254" y="112">a caller changing their mind</text>

  <rect class="box" x="448" y="46" width="196" height="82" rx="8" />
  <text class="label" x="466" y="74">Pinned CI suite</text>
  <text class="sub" x="466" y="94">fixed set, re-run on change —</text>
  <text class="sub" x="466" y="112">longitudinal, not realistic</text>

  <rect class="box" x="660" y="46" width="216" height="82" rx="8" />
  <text class="label" x="678" y="74">Volume generation</text>
  <text class="sub" x="678" y="94">cheap per minute —</text>
  <text class="sub" x="678" y="112">breadth over an unvalidated tail</text>

  <path class="arrow" d="M 122 128 L 380 186" />
  <path class="arrow" d="M 334 128 L 420 186" />
  <path class="arrow" d="M 546 128 L 480 186" />
  <path class="arrow" d="M 768 128 L 520 186" />

  <rect class="hero" x="300" y="190" width="300" height="72" rx="8" />
  <text class="label-inv" x="324" y="220">Voice agent under test</text>
  <text class="sub-inv" x="324" y="242">the only part you can change</text>

  <path class="arrow" d="M 380 262 L 250 314" />
  <path class="arrow" d="M 520 262 L 650 314" />

  <text class="head" x="24" y="304">Scoring splits in two</text>

  <rect class="adj" x="24" y="318" width="406" height="130" rx="8" />
  <text class="label" x="44" y="346">Deterministic assertions</text>
  <text class="sub" x="44" y="368">barge-in · endpointing · time-to-first-word</text>
  <text class="sub" x="44" y="388">dead air · DTMF · one-sided audio</text>
  <text class="sub" x="44" y="408">measurable exactly, no judge in the loop</text>
  <text class="tag" x="44" y="434">THE FAILURES THAT END CALLS</text>

  <rect class="box" x="470" y="318" width="406" height="130" rx="8" />
  <text class="label" x="490" y="346">Judge over the transcript</text>
  <text class="sub" x="490" y="368">policy quoted correctly · intent captured</text>
  <text class="sub" x="490" y="388">nothing invented · escalation at the right point</text>
  <text class="sub" x="490" y="408">needs a rubric and a labelled sample</text>
  <text class="tag" x="490" y="434">SEMANTIC, AND GENUINELY HARD</text>

  <text class="sub" x="24" y="478">One blended score hides a barge-in regression inside judge noise. Keep the two apart.</text>
</svg>
