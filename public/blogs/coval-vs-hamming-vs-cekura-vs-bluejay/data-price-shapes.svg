<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Price transparency across the four platforms</title>
  <desc id="d">Four rows showing what each platform publishes. Cekura publishes an entry plan from thirty dollars a month for seven hundred and fifty credits, with voice testing at roughly five credits per minute, which works out to about twenty cents for a one-minute simulated call. Coval publishes three tiers at one hundred dollars, five hundred dollars, and enterprise from four thousand five hundred dollars a month. Hamming prices on volume through a sales conversation with no self-serve checkout. Bluejay publishes no pricing at all. A note records that only a computable per-call figure lets a team plan a large test suite in advance.</desc>
  <style>
    .rowA   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .rowB   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .rowX   { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 5 5; opacity: .55; }
    .title  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .name   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .name-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .tag-inv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--paper); opacity: .85; }
  </style>

  <text class="title" x="24" y="34">What each platform publishes</text>
  <text class="sub" x="24" y="56">Not a scale — the tiers span two orders of magnitude and two of the four decline to say.</text>

  <rect class="rowA" x="24" y="76" width="852" height="62" rx="8" />
  <text class="name-inv" x="44" y="104">Cekura</text>
  <text class="label-inv" x="180" y="104">from $30 / month for 750 credits &#183; ~5 credits per voice minute</text>
  <text class="label-inv" x="180" y="126" opacity=".9">&#8776; $0.20 for a one-minute simulated call</text>
  <text class="tag-inv" x="700" y="104">COMPUTABLE</text>

  <rect class="rowB" x="24" y="150" width="852" height="62" rx="8" />
  <text class="name" x="44" y="178">Coval</text>
  <text class="label" x="180" y="178">$100 Starter &#183; $500 Growth &#183; Enterprise from $4,500 / month</text>
  <text class="sub" x="180" y="200">tiered, so suite size is bounded by the tier you bought</text>
  <text class="tag" x="700" y="178">PUBLISHED</text>

  <rect class="rowX" x="24" y="224" width="852" height="62" rx="8" />
  <text class="name" x="44" y="252">Hamming</text>
  <text class="label" x="180" y="252">volume-based, not per seat &#183; no self-serve checkout</text>
  <text class="sub" x="180" y="274">numbers shared after a demo call</text>
  <text class="tag" x="700" y="252">SALES-LED</text>

  <rect class="rowX" x="24" y="298" width="852" height="62" rx="8" />
  <text class="name" x="44" y="326">Bluejay</text>
  <text class="label" x="180" y="326">no pricing published</text>
  <text class="tag" x="700" y="326">SALES-LED</text>

  <text class="sub" x="24" y="386">The figure that decides suite size is what the four-hundredth variation of a scenario costs.</text>
</svg>
