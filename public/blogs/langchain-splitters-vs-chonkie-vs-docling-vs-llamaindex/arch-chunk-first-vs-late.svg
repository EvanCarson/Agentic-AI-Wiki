<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="act acd">
  <title id="act">Chunk-first embedding compared with late chunking</title>
  <desc id="acd">Two pipelines. The first splits the document into chunks and then embeds each chunk on its own, so a chunk's vector never saw the rest of the document. The second embeds the whole text first to get one vector per token, then mean-pools those token vectors over the same chunk boundaries, so each chunk vector carries context from the entire document.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .lane   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#aarr); }
  </style>
  <defs>
    <marker id="aarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="lane" x="20" y="28">Chunk first — the default in all four libraries</text>

  <rect class="box" x="20" y="44" width="130" height="56" rx="8" ry="8" />
  <text class="label" x="85" y="77" text-anchor="middle">Document</text>
  <path class="arrow" d="M 154 72 L 186 72" />
  <rect class="hero" x="190" y="44" width="170" height="56" rx="8" ry="8" />
  <text class="label-inv" x="275" y="77" text-anchor="middle">Split into chunks</text>
  <path class="arrow" d="M 364 72 L 396 72" />
  <rect class="box" x="400" y="44" width="170" height="56" rx="8" ry="8" />
  <text class="label" x="485" y="77" text-anchor="middle">Embed each chunk</text>
  <path class="arrow" d="M 574 72 L 606 72" />
  <rect class="box" x="610" y="44" width="150" height="56" rx="8" ry="8" />
  <text class="label" x="685" y="77" text-anchor="middle">Chunk vectors</text>

  <text class="note" x="20" y="130">A sentence whose subject sits three paragraphs back loses it at the cut.</text>

  <text class="lane" x="20" y="198">Late chunking — same boundaries, context kept</text>

  <rect class="box" x="20" y="214" width="130" height="56" rx="8" ry="8" />
  <text class="label" x="85" y="247" text-anchor="middle">Document</text>
  <path class="arrow" d="M 154 242 L 186 242" />
  <rect class="box" x="190" y="214" width="170" height="56" rx="8" ry="8" />
  <text class="label" x="275" y="247" text-anchor="middle">Embed whole text</text>
  <path class="arrow" d="M 364 242 L 396 242" />
  <rect class="box" x="400" y="214" width="170" height="56" rx="8" ry="8" />
  <text class="label" x="485" y="247" text-anchor="middle">Token vectors</text>
  <path class="arrow" d="M 574 242 L 606 242" />
  <rect class="hero" x="610" y="214" width="190" height="56" rx="8" ry="8" />
  <text class="label-inv" x="705" y="247" text-anchor="middle">Mean-pool per chunk</text>

  <text class="note" x="20" y="300">The cut is unchanged; what changes is what each vector was allowed to see.</text>
</svg>
