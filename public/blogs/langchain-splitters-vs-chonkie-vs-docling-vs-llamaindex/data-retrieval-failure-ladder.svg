<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="dlt dld">
  <title id="dlt">Top-20-chunk retrieval failure rate across four configurations</title>
  <desc id="dld">A horizontal bar chart of Anthropic's published figures from September 2024. Baseline embeddings fail 5.7 percent of the time. Adding contextual embeddings drops it to 3.7 percent. Adding contextual BM25 drops it to 2.9 percent. Adding reranking drops it to 1.9 percent. The chunk boundaries are identical in all four rows.</desc>
  <style>
    .b-hi  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .b-mid { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .b-lo  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .d-ttl { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .d-row { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .d-val { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .d-ax  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .grid  { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 4; opacity: .25; }
  </style>

  <text class="d-ttl" x="20" y="34">Top-20-chunk retrieval failure rate (lower is better)</text>

  <line class="grid" x1="260" y1="66" x2="260" y2="344" />
  <line class="grid" x1="450" y1="66" x2="450" y2="344" />
  <line class="grid" x1="640" y1="66" x2="640" y2="344" />
  <line class="grid" x1="830" y1="66" x2="830" y2="344" />

  <text class="d-row" x="240" y="117" text-anchor="end">Baseline embeddings</text>
  <rect class="b-lo" x="260" y="90" width="541" height="44" />
  <text class="d-val" x="811" y="117">5.7%</text>

  <text class="d-row" x="240" y="187" text-anchor="end">+ contextual embeddings</text>
  <rect class="b-mid" x="260" y="160" width="351" height="44" />
  <text class="d-val" x="621" y="187">3.7%</text>

  <text class="d-row" x="240" y="257" text-anchor="end">+ contextual BM25</text>
  <rect class="b-mid" x="260" y="230" width="275" height="44" />
  <text class="d-val" x="545" y="257">2.9%</text>

  <text class="d-row" x="240" y="327" text-anchor="end">+ reranking</text>
  <rect class="b-hi" x="260" y="300" width="180" height="44" />
  <text class="d-val" x="450" y="327">1.9%</text>

  <text class="d-ax" x="260" y="366" text-anchor="middle">0%</text>
  <text class="d-ax" x="450" y="366" text-anchor="middle">2%</text>
  <text class="d-ax" x="640" y="366" text-anchor="middle">4%</text>
  <text class="d-ax" x="830" y="366" text-anchor="middle">6%</text>
</svg>
