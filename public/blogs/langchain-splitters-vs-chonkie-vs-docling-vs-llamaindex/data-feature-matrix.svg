<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmt fmd">
  <title id="fmt">Four chunking libraries compared on three axes</title>
  <desc id="fmd">A four by three matrix. langchain-text-splitters measures in characters, reads no document structure, and reproduces boundaries if the version is pinned. Chonkie measures in tokens or bytes, reads structure only for code and tables, and reproduces boundaries if the version is pinned. Docling HybridChunker measures in tokens from your own tokenizer, is layout-aware, and needs both the tokenizer and the version pinned. LlamaIndex SemanticSplitter measures in sentences scored by embeddings, is sentence-level only, and its boundaries depend on the embedding model. Legend: strongest on this axis, partial, weakest or absent.</desc>
  <style>
    .fm-ok  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .fm-mid { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .fm-no  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .fm-ttl { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .fm-col { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .fm-row { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .fm-cel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .fm-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .fm-leg { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
  </style>

  <text class="fm-ttl" x="20" y="34">What decides a chunk boundary, and whether you can reproduce it</text>

  <text class="fm-col" x="330" y="74" text-anchor="middle">Unit it measures in</text>
  <text class="fm-col" x="550" y="74" text-anchor="middle">Reads document structure</text>
  <text class="fm-col" x="770" y="74" text-anchor="middle">Boundary reproducible</text>

  <text class="fm-row" x="20" y="117">langchain-splitters</text>
  <rect class="fm-no" x="230" y="90" width="200" height="44" />
  <text class="fm-cel" x="330" y="117" text-anchor="middle">Characters, via len()</text>
  <rect class="fm-no" x="450" y="90" width="200" height="44" />
  <text class="fm-cel" x="550" y="117" text-anchor="middle">No</text>
  <rect class="fm-mid" x="670" y="90" width="200" height="44" />
  <text class="fm-cel" x="770" y="117" text-anchor="middle">Pin the version</text>

  <text class="fm-row" x="20" y="181">Chonkie</text>
  <rect class="fm-ok" x="230" y="154" width="200" height="44" />
  <text class="fm-inv" x="330" y="181" text-anchor="middle">Tokens, or raw bytes</text>
  <rect class="fm-mid" x="450" y="154" width="200" height="44" />
  <text class="fm-cel" x="550" y="181" text-anchor="middle">Code and tables only</text>
  <rect class="fm-mid" x="670" y="154" width="200" height="44" />
  <text class="fm-cel" x="770" y="181" text-anchor="middle">Pin the version</text>

  <text class="fm-row" x="20" y="245">Docling Hybrid</text>
  <rect class="fm-ok" x="230" y="218" width="200" height="44" />
  <text class="fm-inv" x="330" y="245" text-anchor="middle">Your embedder's tokens</text>
  <rect class="fm-ok" x="450" y="218" width="200" height="44" />
  <text class="fm-inv" x="550" y="245" text-anchor="middle">Yes, layout-aware</text>
  <rect class="fm-mid" x="670" y="218" width="200" height="44" />
  <text class="fm-cel" x="770" y="245" text-anchor="middle">Pin both, plus default</text>

  <text class="fm-row" x="20" y="309">LlamaIndex Semantic</text>
  <rect class="fm-mid" x="230" y="282" width="200" height="44" />
  <text class="fm-cel" x="330" y="309" text-anchor="middle">Sentence similarity</text>
  <rect class="fm-mid" x="450" y="282" width="200" height="44" />
  <text class="fm-cel" x="550" y="309" text-anchor="middle">Sentence level only</text>
  <rect class="fm-no" x="670" y="282" width="200" height="44" />
  <text class="fm-cel" x="770" y="309" text-anchor="middle">Embedding-dependent</text>

  <rect class="fm-ok" x="20" y="358" width="18" height="14" />
  <text class="fm-leg" x="48" y="370">Strongest on this axis</text>
  <rect class="fm-mid" x="260" y="358" width="18" height="14" />
  <text class="fm-leg" x="288" y="370">Partial</text>
  <rect class="fm-no" x="430" y="358" width="18" height="14" />
  <text class="fm-leg" x="458" y="370">Weakest or absent</text>
</svg>
