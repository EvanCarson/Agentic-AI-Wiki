<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="wlT wlD">
  <title id="wlT">Where the agent loop runs, across three generations of product</title>
  <desc id="wlD">Three columns. Roll your own: you write the loop and own compaction, and every version in the stack can be pinned. Managed agent runtimes such as AgentCore, Foundry and Vertex AI Agent Engine: they sell identity, memory, a tool gateway and traces around a loop you still write yourself. The Agents API: OpenAI writes and runs the loop, and you supply tools and choose where code executes.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .92; }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Who writes the control loop</text>

  <rect class="box" x="35" y="48" width="250" height="96" />
  <text class="hd" x="160" y="76" text-anchor="middle">Roll your own</text>
  <text class="cell" x="160" y="100" text-anchor="middle">You write the loop.</text>
  <text class="cell" x="160" y="118" text-anchor="middle">You own the compaction</text>
  <text class="cell" x="160" y="136" text-anchor="middle">prompt and its policy.</text>

  <rect class="adj" x="325" y="48" width="250" height="96" />
  <text class="hd" x="450" y="76" text-anchor="middle">Managed runtimes</text>
  <text class="cell" x="450" y="100" text-anchor="middle">Identity, memory, gateway,</text>
  <text class="cell" x="450" y="118" text-anchor="middle">traces — sold around a</text>
  <text class="cell" x="450" y="136" text-anchor="middle">loop you still write.</text>

  <rect class="hero" x="625" y="48" width="250" height="96" />
  <text class="hd-inv" x="750" y="76" text-anchor="middle">Agents API</text>
  <text class="cell-inv" x="750" y="100" text-anchor="middle">OpenAI writes and runs</text>
  <text class="cell-inv" x="750" y="118" text-anchor="middle">the loop. You supply tools</text>
  <text class="cell-inv" x="750" y="136" text-anchor="middle">and pick the sandbox.</text>

  <text class="lane" x="160" y="176" text-anchor="middle">Version tuple</text>
  <text class="lane" x="450" y="176" text-anchor="middle">Version tuple</text>
  <text class="lane" x="750" y="176" text-anchor="middle">Version tuple</text>

  <rect class="box" x="35" y="186" width="250" height="80" />
  <text class="cell" x="160" y="214" text-anchor="middle">Model, prompt, harness,</text>
  <text class="cell" x="160" y="236" text-anchor="middle">judge — all pinnable.</text>

  <rect class="box" x="325" y="186" width="250" height="80" />
  <text class="cell" x="450" y="214" text-anchor="middle">All pinnable; the ring</text>
  <text class="cell" x="450" y="236" text-anchor="middle">services carry SLAs.</text>

  <rect class="box" x="625" y="186" width="250" height="80" />
  <text class="cell" x="750" y="214" text-anchor="middle">One slot reads</text>
  <text class="cell" x="750" y="236" text-anchor="middle">"current", permanently.</text>
</svg>
