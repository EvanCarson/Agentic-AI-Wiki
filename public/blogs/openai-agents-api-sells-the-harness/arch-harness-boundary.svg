<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="hbT hbD">
  <title id="hbT">Three ownership zones in an Agents API deployment</title>
  <desc id="hbD">Three vertical zones. On the left, Capability, owned by you: tools, MCP servers, prompts and data access. In the centre, drawn as a solid accent block, the Harness owned by OpenAI: session lifecycle, subagent orchestration, recovery and context compaction, labelled as carrying no version you can pin. On the right, Execution: a sandbox that may be OpenAI-hosted, supplied by one of nine partners, or run on your own infrastructure. Arrows run from the harness out to the capability zone and back, and from the harness to the execution zone.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .85; }
    .lbl-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); opacity: .95; }
    .own    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#hbArr); }
  </style>
  <defs>
    <marker id="hbArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="22">Who runs which part of the loop</text>

  <text class="own" x="130" y="56" text-anchor="middle">Yours</text>
  <text class="own" x="450" y="56" text-anchor="middle">OpenAI's</text>
  <text class="own" x="770" y="56" text-anchor="middle">Your choice</text>

  <rect class="box" x="20" y="70" width="220" height="230" />
  <text class="hd" x="130" y="100" text-anchor="middle">Capability</text>
  <text class="lbl" x="130" y="132" text-anchor="middle">Your tools</text>
  <text class="lbl" x="130" y="156" text-anchor="middle">Your MCP servers</text>
  <text class="lbl" x="130" y="180" text-anchor="middle">Your prompts</text>
  <text class="lbl" x="130" y="204" text-anchor="middle">Your data access</text>
  <text class="own" x="130" y="244" text-anchor="middle">Versioned in your repo</text>
  <text class="own" x="130" y="264" text-anchor="middle">Diffable, revertible</text>

  <rect class="hero" x="290" y="70" width="320" height="230" />
  <text class="hd-inv" x="450" y="100" text-anchor="middle">Harness</text>
  <text class="lbl-inv" x="450" y="132" text-anchor="middle">Session lifecycle</text>
  <text class="lbl-inv" x="450" y="156" text-anchor="middle">Subagent orchestration</text>
  <text class="lbl-inv" x="450" y="180" text-anchor="middle">Failure recovery</text>
  <text class="lbl-inv" x="450" y="204" text-anchor="middle">Context compaction</text>
  <text class="lbl-inv" x="450" y="244" text-anchor="middle">No version you can pin</text>
  <text class="lbl-inv" x="450" y="264" text-anchor="middle">No diff, no rollback</text>

  <rect class="adj" x="660" y="70" width="220" height="230" />
  <text class="hd" x="770" y="100" text-anchor="middle">Execution</text>
  <text class="lbl" x="770" y="132" text-anchor="middle">OpenAI-hosted, or</text>
  <text class="lbl" x="770" y="156" text-anchor="middle">one of nine partners,</text>
  <text class="lbl" x="770" y="180" text-anchor="middle">or your own VPC</text>
  <text class="own" x="770" y="220" text-anchor="middle">Blaxel · Cloudflare · Daytona</text>
  <text class="own" x="770" y="240" text-anchor="middle">DigitalOcean · E2B · Modal</text>
  <text class="own" x="770" y="260" text-anchor="middle">Oracle · Runloop · Vercel</text>

  <path class="arrow" d="M 288 160 L 244 160" />
  <path class="arrow" d="M 244 210 L 288 210" />
  <path class="arrow" d="M 612 185 L 656 185" />

  <rect class="box" x="20" y="360" width="860" height="110" />
  <text class="hd" x="450" y="392" text-anchor="middle">The step that rewrites the objective</text>
  <text class="lbl" x="450" y="420" text-anchor="middle">Compaction paraphrases the transcript — including the sentence stating the goal —</text>
  <text class="lbl" x="450" y="442" text-anchor="middle">every time the window fills. It runs inside the accent block, on a version you never see.</text>
</svg>
