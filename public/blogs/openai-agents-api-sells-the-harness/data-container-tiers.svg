<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ctT ctD">
  <title id="ctT">Hosted sandbox price per twenty-minute session by memory tier</title>
  <desc id="ctD">Horizontal bar chart with four bars. One gigabyte costs three cents per twenty-minute session, four gigabytes twelve cents, sixteen gigabytes forty-eight cents, and sixty-four gigabytes one dollar and ninety-two cents. Bar lengths scale linearly with memory, so the price is a flat rate of roughly three cents per gigabyte per session.</desc>
  <style>
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val-hi { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--accent, #d4421e); }
    .axis   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .55; }
    .grid   { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .lead   { fill: var(--accent, #d4421e); rx: 4; ry: 4; }
    .mid    { fill: var(--accent-soft); rx: 4; ry: 4; }
    .trail  { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; rx: 4; ry: 4; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="0" y="22">USD per 20-minute container session</text>

  <line class="grid" x1="395" y1="52" x2="395" y2="320" />
  <line class="grid" x1="540" y1="52" x2="540" y2="320" />
  <line class="grid" x1="685" y1="52" x2="685" y2="320" />
  <line class="grid" x1="830" y1="52" x2="830" y2="320" />

  <text class="lbl" x="0" y="92">1 GB</text>
  <rect class="trail" x="250" y="68" width="9" height="36" />
  <text class="val" x="271" y="92">$0.03</text>

  <text class="lbl" x="0" y="162">4 GB</text>
  <rect class="trail" x="250" y="138" width="36" height="36" />
  <text class="val" x="298" y="162">$0.12</text>

  <text class="lbl" x="0" y="232">16 GB</text>
  <rect class="mid" x="250" y="208" width="145" height="36" />
  <text class="val" x="407" y="232">$0.48</text>

  <text class="lbl" x="0" y="302">64 GB</text>
  <rect class="lead" x="250" y="278" width="580" height="36" />
  <text class="val-hi" x="842" y="302">$1.92</text>

  <text class="axis" x="395" y="340" text-anchor="middle">$0.48</text>
  <text class="axis" x="540" y="340" text-anchor="middle">$0.96</text>
  <text class="axis" x="685" y="340" text-anchor="middle">$1.44</text>
  <text class="axis" x="830" y="340" text-anchor="middle">$1.92</text>

  <text class="note" x="0" y="376">Flat ~$0.03 per GB per session. Eligible sessions bill per minute, five-minute minimum.</text>
</svg>
