<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="wmt wmd">
  <title id="wmt">Where a WebMCP tool call actually executes</title>
  <desc id="wmd">An agent asks the browser to run a tool. The browser dispatches to JavaScript inside the page, which calls the site's own backend over the same authenticated session the logged-in user established. The server sees an ordinary same-origin request with a valid cookie and cannot distinguish it from a click.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .hdr    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .55; letter-spacing: .08em; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.4; marker-end: url(#wmarr); }
    .dash   { fill: none; stroke: currentColor; stroke-width: 1.1; stroke-dasharray: 5 4; opacity: .55; }
    .zone   { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 4; rx: 10; ry: 10; }
  </style>
  <defs>
    <marker id="wmarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="zone" x="24" y="66" width="560" height="300" />
  <text class="hdr" x="36" y="56">THE BROWSER</text>

  <rect class="box" x="52" y="104" width="180" height="76" />
  <text class="label" x="72" y="134">Agent</text>
  <text class="sub" x="72" y="156">picks a tool by name</text>

  <rect class="adj" x="52" y="238" width="180" height="88" />
  <text class="label" x="72" y="266">Browser mediation</text>
  <text class="sub" x="72" y="288">consent prompt,</text>
  <text class="sub" x="72" y="306">origin allow-lists</text>

  <rect class="hero" x="330" y="160" width="220" height="120" />
  <text class="label-inv" x="352" y="192">Your page's JavaScript</text>
  <text class="sub-inv" x="352" y="216">document.modelContext</text>
  <text class="sub-inv" x="352" y="234">.registerTool({ execute })</text>
  <text class="sub-inv" x="352" y="258">runs in your origin</text>

  <rect class="box" x="672" y="160" width="184" height="120" />
  <text class="label" x="692" y="192">Your backend</text>
  <text class="sub" x="692" y="216">sees a same-origin</text>
  <text class="sub" x="692" y="234">request with a valid</text>
  <text class="sub" x="692" y="252">session cookie</text>

  <rect class="box" x="672" y="342" width="184" height="72" />
  <text class="label" x="692" y="370">A human click</text>
  <text class="sub" x="692" y="392">indistinguishable</text>

  <g color="var(--ink)">
    <path class="arrow" d="M 142 180 L 142 232" />
    <path class="arrow" d="M 232 272 L 324 234" />
    <path class="arrow" d="M 550 214 L 666 214" />
    <path class="dash" d="M 764 342 L 764 286" />
  </g>

  <text class="sub" x="150" y="210">tool call</text>
  <text class="sub" x="246" y="252">dispatch</text>
  <text class="sub" x="566" y="204">fetch()</text>
  <text class="sub" x="612" y="440">The authority on both paths is the</text>
  <text class="sub" x="612" y="458">user's live session, not the caller.</text>

  <text class="hdr" x="330" y="142">PAGE ORIGIN — YOUR CODE</text>
  <text class="hdr" x="672" y="142">SERVER — YOUR CODE</text>
</svg>
