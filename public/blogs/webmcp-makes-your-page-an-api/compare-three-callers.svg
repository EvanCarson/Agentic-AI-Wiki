<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="c3t c3d">
  <title id="c3t">Three callers, one handler</title>
  <desc id="c3d">A click, the browser's own agent, and a tool call arriving from another origin through the cross-origin discovery path all reach the same registered handler with the same session authority. The handler is given no way to tell them apart.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; text-anchor: middle; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; text-anchor: middle; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.4; marker-end: url(#c3arr); }
  </style>
  <defs>
    <marker id="c3arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="box" x="60" y="26" width="200" height="74" />
  <text class="label" x="160" y="54">The user</text>
  <text class="sub" x="160" y="76">clicks submit</text>

  <rect class="adj" x="350" y="26" width="200" height="74" />
  <text class="label" x="450" y="54">The browser's agent</text>
  <text class="sub" x="450" y="76">executeTool(), after consent</text>

  <rect class="box" x="640" y="26" width="200" height="74" />
  <text class="label" x="740" y="54">Another origin</text>
  <text class="sub" x="740" y="76">discovery via fromOrigins</text>

  <g color="var(--ink)">
    <path class="arrow" d="M 160 100 L 160 150 L 420 150 L 440 176" />
    <path class="arrow" d="M 450 100 L 450 172" />
    <path class="arrow" d="M 740 100 L 740 150 L 480 150 L 460 176" />
  </g>

  <rect class="hero" x="330" y="180" width="240" height="80" />
  <text class="label-inv" x="450" y="210">execute(args)</text>
  <text class="sub-inv" x="450" y="232">your handler, your origin,</text>
  <text class="sub-inv" x="450" y="250">the user's live session</text>
</svg>
