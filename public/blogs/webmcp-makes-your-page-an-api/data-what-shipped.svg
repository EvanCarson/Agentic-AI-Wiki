<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="dwt dwd">
  <title id="dwt">What WebMCP covers, and what it leaves to you</title>
  <desc id="dwd">A matrix over four concerns — tool declaration, user consent, caller identity and API lifecycle — showing that the specification and the browser cover declaration and consent strongly, treat caller identity only as an origin allow-list, and cover versioning, rate limiting and abuse handling not at all.</desc>
  <style>
    .cell-s { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .cell-m { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .cell-w { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .ct     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); text-anchor: middle; }
    .ct-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); text-anchor: middle; }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; text-anchor: middle; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="title" x="24" y="30">Who handles what, once a page registers a tool</text>

  <text class="col" x="370" y="72">Declaring the tool</text>
  <text class="col" x="530" y="72">Asking the user</text>
  <text class="col" x="690" y="72">Identifying the caller</text>
  <text class="col" x="840" y="72">Lifecycle</text>

  <text class="row" x="24" y="112">The specification</text>
  <rect class="cell-s" x="290" y="92" width="160" height="34" />
  <text class="ct-inv" x="370" y="114">Strong</text>
  <rect class="cell-m" x="460" y="92" width="140" height="34" />
  <text class="ct" x="530" y="114">Medium</text>
  <rect class="cell-m" x="610" y="92" width="160" height="34" />
  <text class="ct" x="690" y="114">Origin allow-list</text>
  <rect class="cell-w" x="780" y="92" width="96" height="34" />
  <text class="ct" x="828" y="114">None</text>

  <text class="row" x="24" y="166">The browser</text>
  <rect class="cell-m" x="290" y="146" width="160" height="34" />
  <text class="ct" x="370" y="168">Medium</text>
  <rect class="cell-s" x="460" y="146" width="140" height="34" />
  <text class="ct-inv" x="530" y="168">Strong</text>
  <rect class="cell-w" x="610" y="146" width="160" height="34" />
  <text class="ct" x="690" y="168">Weak</text>
  <rect class="cell-w" x="780" y="146" width="96" height="34" />
  <text class="ct" x="828" y="168">None</text>

  <text class="row" x="24" y="220">Your page</text>
  <rect class="cell-s" x="290" y="200" width="160" height="34" />
  <text class="ct-inv" x="370" y="222">Yours</text>
  <rect class="cell-w" x="460" y="200" width="140" height="34" />
  <text class="ct" x="530" y="222">Weak</text>
  <rect class="cell-s" x="610" y="200" width="160" height="34" />
  <text class="ct-inv" x="690" y="222">Yours</text>
  <rect class="cell-s" x="780" y="200" width="96" height="34" />
  <text class="ct-inv" x="828" y="222">Yours</text>

  <text class="row" x="24" y="274">Your server</text>
  <rect class="cell-w" x="290" y="254" width="160" height="34" />
  <text class="ct" x="370" y="276">Not involved</text>
  <rect class="cell-w" x="460" y="254" width="140" height="34" />
  <text class="ct" x="530" y="276">Not involved</text>
  <rect class="cell-s" x="610" y="254" width="160" height="34" />
  <text class="ct-inv" x="690" y="276">Yours</text>
  <rect class="cell-s" x="780" y="254" width="96" height="34" />
  <text class="ct-inv" x="828" y="276">Yours</text>

  <rect class="cell-s" x="24" y="326" width="18" height="18" />
  <text class="leg" x="50" y="340">Strong, or squarely your problem</text>
  <rect class="cell-m" x="290" y="326" width="18" height="18" />
  <text class="leg" x="316" y="340">Partial</text>
  <rect class="cell-w" x="460" y="326" width="18" height="18" />
  <text class="leg" x="486" y="340">Weak or absent</text>
</svg>
