<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="wst wsd">
  <title id="wst">Which dependency control would have stopped the 17 November releases</title>
  <desc id="wsd">Six dependency practices scored on whether they would have prevented installing agent-framework 1.26.1 or 1.26.2, and whether they tell you afterwards that you did. An open version range and an upgrade install neither block nor report. An exact pin without hashes blocks a resolver upgrade but cannot detect a republished artefact. A hash-pinned lockfile blocks it outright. A private mirror with a publish delay blocks it and records the attempt. A post-install integrity scan blocks nothing but does report.</desc>
  <style>
    .ws-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .ws-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .ws-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .ws-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .ws-col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .ws-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .ws-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .ws-cellin { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .ws-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="ws-ttl" x="20" y="30">What each practice did on 17 November</text>

  <text class="ws-col" x="530" y="66" text-anchor="middle">BLOCKS THE INSTALL</text>
  <text class="ws-col" x="770" y="66" text-anchor="middle">TELLS YOU AFTER</text>

  <text class="ws-row" x="20" y="101">Open range, agent-framework&gt;=1.26</text>
  <rect class="ws-weak" x="430" y="80" width="200" height="32" />
  <text class="ws-cell" x="530" y="101" text-anchor="middle">No</text>
  <rect class="ws-weak" x="670" y="80" width="200" height="32" />
  <text class="ws-cell" x="770" y="101" text-anchor="middle">No</text>

  <text class="ws-row" x="20" y="149">Upgrade install, pip install -U</text>
  <rect class="ws-weak" x="430" y="128" width="200" height="32" />
  <text class="ws-cell" x="530" y="149" text-anchor="middle">No</text>
  <rect class="ws-weak" x="670" y="128" width="200" height="32" />
  <text class="ws-cell" x="770" y="149" text-anchor="middle">No</text>

  <text class="ws-row" x="20" y="197">Exact pin, no hashes</text>
  <rect class="ws-med" x="430" y="176" width="200" height="32" />
  <text class="ws-cell" x="530" y="197" text-anchor="middle">Yes, this time</text>
  <rect class="ws-weak" x="670" y="176" width="200" height="32" />
  <text class="ws-cell" x="770" y="197" text-anchor="middle">No</text>

  <text class="ws-row" x="20" y="245">Hash-pinned lockfile</text>
  <rect class="ws-strong" x="430" y="224" width="200" height="32" />
  <text class="ws-cellin" x="530" y="245" text-anchor="middle">Yes</text>
  <rect class="ws-med" x="670" y="224" width="200" height="32" />
  <text class="ws-cell" x="770" y="245" text-anchor="middle">Resolver error</text>

  <text class="ws-row" x="20" y="293">Private mirror, publish delay</text>
  <rect class="ws-strong" x="430" y="272" width="200" height="32" />
  <text class="ws-cellin" x="530" y="293" text-anchor="middle">Yes</text>
  <rect class="ws-strong" x="670" y="272" width="200" height="32" />
  <text class="ws-cellin" x="770" y="293" text-anchor="middle">Yes</text>

  <text class="ws-row" x="20" y="341">Post-install integrity scan</text>
  <rect class="ws-weak" x="430" y="320" width="200" height="32" />
  <text class="ws-cell" x="530" y="341" text-anchor="middle">No</text>
  <rect class="ws-med" x="670" y="320" width="200" height="32" />
  <text class="ws-cell" x="770" y="341" text-anchor="middle">If it ran in time</text>

  <rect class="ws-weak" x="20" y="371" width="16" height="13" />
  <text class="ws-leg" x="44" y="382">no help</text>
  <rect class="ws-med" x="130" y="371" width="16" height="13" />
  <text class="ws-leg" x="154" y="382">partial</text>
  <rect class="ws-strong" x="236" y="371" width="16" height="13" />
  <text class="ws-leg" x="260" y="382">holds</text>
</svg>
