<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="tpt tpd">
  <title id="tpt">Two paths out of one install: the import path and the interpreter-startup path</title>
  <desc id="tpd">A single install step writes two things into site-packages: the agent-framework package itself and a .pth file. The upper path requires an explicit import of agent_framework before any package code runs, and most jobs never take it. The lower path needs no import at all: every Python process start makes the site module read every .pth file in site-packages and execute its import line, which runs the collector and reaches the environment's secrets.</desc>
  <style>
    .tp-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .tp-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .tp-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .tp-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .tp-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .tp-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); }
    .tp-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .tp-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .tp-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#tparr); }
    .tp-dash { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#tparr); }
  </style>
  <defs>
    <marker id="tparr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="tp-ttl" x="20" y="28">One install, two ways to reach execution</text>

  <rect class="tp-box" x="20" y="212" width="170" height="60" rx="8" />
  <text class="tp-mono" x="34" y="238">pip install</text>
  <text class="tp-mono" x="34" y="254">agent-framework</text>

  <path class="tp-arr" d="M 196 228 L 246 150" />
  <path class="tp-arr" d="M 196 256 L 246 334" />

  <rect class="tp-box" x="252" y="112" width="190" height="60" rx="8" />
  <text class="tp-lbl" x="266" y="138">package code lands</text>
  <text class="tp-mono" x="266" y="157">agent_framework/</text>

  <rect class="tp-adj" x="252" y="304" width="190" height="60" rx="8" />
  <text class="tp-lbl" x="266" y="330">one extra file lands</text>
  <text class="tp-mono" x="266" y="349">af_runtime_diag.pth</text>

  <path class="tp-dash" d="M 448 142 L 538 142" />
  <text class="tp-sub" x="452" y="130">rarely taken</text>

  <path class="tp-arr" d="M 448 334 L 538 334" />

  <rect class="tp-box" x="544" y="112" width="200" height="60" rx="8" />
  <text class="tp-lbl" x="558" y="138">requires an explicit</text>
  <text class="tp-mono" x="558" y="157">import agent_framework</text>

  <rect class="tp-hero" x="544" y="292" width="200" height="84" rx="8" />
  <text class="tp-inv" x="558" y="318">any python process start</text>
  <text class="tp-inv" x="558" y="337">site module reads *.pth</text>
  <text class="tp-inv" x="558" y="356">and runs its import line</text>

  <path class="tp-arr" d="M 644 382 L 644 424" />

  <rect class="tp-box" x="500" y="430" width="288" height="52" rx="8" />
  <text class="tp-lbl" x="514" y="452">env vars, config files, other processes</text>
  <text class="tp-sub" x="514" y="470">Azure, AWS, GitHub, Docker, Hugging Face, OpenAI</text>

</svg>
