<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Share of organisations that declined a software purchase because agentic coding tools could build it</title>
  <desc id="d">Horizontal bar chart on a nought to fifty per cent scale. Technology leads at 41 per cent, followed by healthcare payers and providers at 39, professional services at 38, energy and materials at 38, financial institutions at 36, media and telecom at 34, and pharmaceuticals and medical products at 33. The all-respondent figure, drawn in the accent colour at the bottom, is 32 per cent. The spread across every industry is nine percentage points, so the decision is close to uniform rather than concentrated in technology firms.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .title  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .grid   { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 3 4; }
  </style>

  <text class="title" x="24" y="28">Declined at least one software purchase (per cent)</text>

  <line class="grid" x1="330" y1="44" x2="330" y2="320" />
  <line class="grid" x1="438" y1="44" x2="438" y2="320" />
  <line class="grid" x1="546" y1="44" x2="546" y2="320" />
  <line class="grid" x1="654" y1="44" x2="654" y2="320" />
  <line class="grid" x1="762" y1="44" x2="762" y2="320" />
  <line class="grid" x1="870" y1="44" x2="870" y2="320" />
  <text class="note" x="324" y="340">0</text>
  <text class="note" x="430" y="340">10</text>
  <text class="note" x="538" y="340">20</text>
  <text class="note" x="646" y="340">30</text>
  <text class="note" x="754" y="340">40</text>
  <text class="note" x="862" y="340">50</text>

  <text class="row" x="24" y="86">Technology</text>
  <rect class="med" x="330" y="72" width="443" height="18" />
  <text class="val" x="781" y="86">41</text>

  <text class="row" x="24" y="118">Healthcare payers &amp; providers</text>
  <rect class="med" x="330" y="104" width="421" height="18" />
  <text class="val" x="759" y="118">39</text>

  <text class="row" x="24" y="150">Professional services</text>
  <rect class="med" x="330" y="136" width="410" height="18" />
  <text class="val" x="748" y="150">38</text>

  <text class="row" x="24" y="182">Energy &amp; materials</text>
  <rect class="med" x="330" y="168" width="410" height="18" />
  <text class="val" x="748" y="182">38</text>

  <text class="row" x="24" y="214">Financial institutions</text>
  <rect class="med" x="330" y="200" width="389" height="18" />
  <text class="val" x="727" y="214">36</text>

  <text class="row" x="24" y="246">Media &amp; telecom</text>
  <rect class="med" x="330" y="232" width="367" height="18" />
  <text class="val" x="705" y="246">34</text>

  <text class="row" x="24" y="278">Pharma &amp; medical products</text>
  <rect class="med" x="330" y="264" width="356" height="18" />
  <text class="val" x="694" y="278">33</text>

  <text class="row" x="24" y="310">All respondents</text>
  <rect class="strong" x="330" y="296" width="346" height="18" />
  <text class="val" x="684" y="310">32</text>

  <text class="note" x="24" y="372">McKinsey State of AI, surveyed 4 May – 8 June 2026, 1,719 respondents in 97 nations.</text>
  <text class="note" x="24" y="392">The question asked whether a purchase was declined — not whether a replacement shipped.</text>
</svg>
