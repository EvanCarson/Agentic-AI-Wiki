<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three stages of build-instead-of-buy, and which one the survey measured</title>
  <desc id="d">Three columns following one decision through time. The first column, the decision, is what the survey captured: a purchase was declined because an agentic coding tool could build the thing instead, recorded at the moment build cost collapsed and before any run cost existed. The second column, drawn as the accent column, is the deployment: whether the replacement shipped, passed a security review and an audit, and reached the users the licence would have served — none of which the survey asked about. The third column is the second year: maintenance hours, incidents, the compliance artefacts the vendor used to supply, and whether anyone is still willing to own the system, which is where the true cost is either recovered or paid.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .tag-inv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--paper); opacity: .85; }
  </style>

  <rect class="hero" x="24" y="36" width="266" height="228" />
  <text class="head-inv" x="44" y="66">The decision</text>
  <text class="sub-inv" x="44" y="100">"we did not buy it"</text>
  <text class="sub-inv" x="44" y="124">build cost has collapsed</text>
  <text class="sub-inv" x="44" y="148">no run cost exists yet</text>
  <line x1="44" y1="176" x2="270" y2="176" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag-inv" x="44" y="200">MEASURED — 32%</text>
  <text class="label-inv" x="44" y="228">the cheapest possible</text>
  <text class="label-inv" x="44" y="248">moment to take a survey</text>

  <rect class="box" x="314" y="36" width="266" height="228" />
  <text class="head" x="334" y="66">The deployment</text>
  <text class="sub" x="334" y="100">did the replacement ship</text>
  <text class="sub" x="334" y="124">did it pass security review</text>
  <text class="sub" x="334" y="148">did the users move to it</text>
  <line x1="334" y1="176" x2="560" y2="176" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="334" y="200">NOT ASKED</text>
  <text class="label" x="334" y="228">a decision and a system</text>
  <text class="label" x="334" y="248">are not the same object</text>

  <rect class="box" x="604" y="36" width="266" height="228" />
  <text class="head" x="624" y="66">The second year</text>
  <text class="sub" x="624" y="100">maintenance hours</text>
  <text class="sub" x="624" y="124">incidents and patches</text>
  <text class="sub" x="624" y="148">who still owns it</text>
  <line x1="624" y1="176" x2="850" y2="176" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="624" y="200">NOT YET OBSERVABLE</text>
  <text class="label" x="624" y="228">where the saving is either</text>
  <text class="label" x="624" y="248">banked or quietly returned</text>
</svg>
