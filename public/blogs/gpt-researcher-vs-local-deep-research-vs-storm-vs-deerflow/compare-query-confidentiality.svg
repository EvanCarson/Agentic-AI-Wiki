<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="cqc-t cqc-d">
  <title id="cqc-t">Three confidentiality regimes for a research agent</title>
  <desc id="cqc-d">Three columns. Vendor index with vendor model: the query and the answer both leave. Your corpus with their model: documents stay but every retrieved span and sub-question is sent out. Your corpus with your model: nothing leaves, paid for in model capability and operational burden.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .55; }
    .cap-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); opacity: .75; }
  </style>

  <text class="cap" x="30" y="32">WHAT CROSSES THE BOUNDARY</text>

  <rect class="box" x="30" y="48" width="250" height="210" />
  <text class="head" x="50" y="80">Vendor index,</text>
  <text class="head" x="50" y="100">vendor model</text>
  <text class="sub"  x="50" y="130">Query leaves. Answer leaves.</text>
  <text class="sub"  x="50" y="152">Best web coverage, no index</text>
  <text class="sub"  x="50" y="170">to maintain, lowest effort.</text>
  <text class="sub"  x="50" y="200">Right default for questions</text>
  <text class="sub"  x="50" y="218">about the public web.</text>
  <text class="cap"  x="50" y="246">HOSTED RESEARCH API</text>

  <rect class="adj" x="325" y="48" width="250" height="210" />
  <text class="head" x="345" y="80">Your corpus,</text>
  <text class="head" x="345" y="100">their model</text>
  <text class="sub"  x="345" y="130">Documents stay. Every</text>
  <text class="sub"  x="345" y="148">retrieved span and every</text>
  <text class="sub"  x="345" y="166">sub-question leaves.</text>
  <text class="sub"  x="345" y="196">The regime most teams are</text>
  <text class="sub"  x="345" y="214">in while believing otherwise.</text>
  <text class="cap"  x="345" y="246">GPT RESEARCHER · DEERFLOW</text>

  <rect class="hero" x="620" y="48" width="250" height="210" />
  <text class="head-inv" x="640" y="80">Your corpus,</text>
  <text class="head-inv" x="640" y="100">your model</text>
  <text class="sub-inv"  x="640" y="130">Nothing leaves the host.</text>
  <text class="sub-inv"  x="640" y="152">Paid for in model capability</text>
  <text class="sub-inv"  x="640" y="170">and in running inference.</text>
  <text class="sub-inv"  x="640" y="200">The only option where the</text>
  <text class="sub-inv"  x="640" y="218">query itself is sensitive.</text>
  <text class="cap-inv"  x="640" y="246">LOCAL DEEP RESEARCH</text>
</svg>
