<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="dsc-t dsc-d">
  <title id="dsc-t">GitHub stars for five open-source deep-research projects</title>
  <desc id="dsc-d">Horizontal bars in thousands of stars: DeerFlow 83.4, STORM 31.6, GPT Researcher 29.9, open_deep_research 12.7 and archived, Local Deep Research 9.2. The two largest are a general agent harness and a repository frozen since September 2025.</desc>
  <style>
    .lead   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 3; ry: 3; }
    .mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 3; ry: 3; }
    .trail  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 3; ry: 3; }
    .title  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .axis   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .55; }
    .rowh   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .grid   { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 5; opacity: .3; }
  </style>

  <text class="title" x="30" y="34">GitHub stars (thousands), October 2026</text>

  <line class="grid" x1="400" y1="62" x2="400" y2="350" />
  <line class="grid" x1="520" y1="62" x2="520" y2="350" />
  <line class="grid" x1="640" y1="62" x2="640" y2="350" />
  <line class="grid" x1="760" y1="62" x2="760" y2="350" />
  <text class="axis" x="392" y="370">20</text>
  <text class="axis" x="512" y="370">40</text>
  <text class="axis" x="632" y="370">60</text>
  <text class="axis" x="752" y="370">80</text>

  <text class="rowh" x="30" y="88">DeerFlow</text>
  <text class="note" x="30" y="106">general harness since 2.0</text>
  <rect class="lead" x="280" y="80" width="500" height="30" />
  <text class="val"  x="790" y="101">83.4</text>

  <text class="rowh" x="30" y="150">STORM</text>
  <text class="note" x="30" y="168">frozen since Sep 2025</text>
  <rect class="mid" x="280" y="142" width="190" height="30" />
  <text class="val" x="480" y="163">31.6</text>

  <text class="rowh" x="30" y="212">GPT Researcher</text>
  <text class="note" x="30" y="230">shipping as a research product</text>
  <rect class="mid" x="280" y="204" width="179" height="30" />
  <text class="val" x="469" y="225">29.9</text>

  <text class="rowh" x="30" y="274">open_deep_research</text>
  <text class="note" x="30" y="292">archived 21 Aug 2026</text>
  <rect class="trail" x="280" y="266" width="76" height="30" />
  <text class="val" x="366" y="287">12.7</text>

  <text class="rowh" x="30" y="336">Local Deep Research</text>
  <text class="note" x="30" y="354">local-only, active</text>
  <rect class="trail" x="280" y="328" width="55" height="30" />
  <text class="val" x="345" y="349">9.2</text>
</svg>
