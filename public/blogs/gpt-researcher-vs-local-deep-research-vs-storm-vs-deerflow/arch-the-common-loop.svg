<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="acl-t acl-d">
  <title id="acl-t">The five-stage deep-research loop and the two ends where projects differ</title>
  <desc id="acl-d">A pipeline of five identical stages — plan, search, read and summarise, compress, write with citations — enclosed in a dashed boundary marked as common to all four projects. Two boxes below feed the ends of the pipeline: corpus connectors on the retrieval side and report assembly on the output side, labelled as the parts that actually differ.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .zone   { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 6 5; opacity: .55; rx: 12; ry: 12; }
    .zoneh  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#acl-arr); }
  </style>
  <defs>
    <marker id="acl-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="zone" x="20" y="60" width="860" height="150" />
  <text class="zoneh" x="40" y="86">THE LOOP — THE SAME FIVE STAGES IN ALL FOUR PROJECTS</text>

  <rect class="box" x="40" y="100" width="140" height="86" />
  <text class="label" x="58" y="134">Plan</text>
  <text class="sub"   x="58" y="155">sub-questions</text>
  <text class="sub"   x="58" y="172">from the prompt</text>

  <path class="arrow" d="M 182 143 L 206 143" />

  <rect class="box" x="208" y="100" width="140" height="86" />
  <text class="label" x="226" y="134">Search</text>
  <text class="sub"   x="226" y="155">one query per</text>
  <text class="sub"   x="226" y="172">sub-question</text>

  <path class="arrow" d="M 350 143 L 374 143" />

  <rect class="box" x="376" y="100" width="148" height="86" />
  <text class="label" x="394" y="134">Read, summarise</text>
  <text class="sub"   x="394" y="155">cheap model,</text>
  <text class="sub"   x="394" y="172">per result</text>

  <path class="arrow" d="M 526 143 L 550 143" />

  <rect class="box" x="552" y="100" width="140" height="86" />
  <text class="label" x="570" y="134">Compress</text>
  <text class="sub"   x="570" y="155">fit the findings</text>
  <text class="sub"   x="570" y="172">in a context</text>

  <path class="arrow" d="M 694 143 L 718 143" />

  <rect class="box" x="720" y="100" width="140" height="86" />
  <text class="label" x="738" y="134">Write + cite</text>
  <text class="sub"   x="738" y="155">long report,</text>
  <text class="sub"   x="738" y="172">inline sources</text>

  <path class="arrow" d="M 278 300 L 278 214" />
  <path class="arrow" d="M 790 300 L 790 214" />

  <rect class="hero" x="60" y="305" width="440" height="150" />
  <text class="label-inv" x="84" y="340">Corpus connectors</text>
  <text class="sub-inv"   x="84" y="366">open web · your files · academic APIs</text>
  <text class="sub-inv"   x="84" y="388">private indexes · MCP tools</text>
  <text class="sub-inv"   x="84" y="416">decides who sees the query and</text>
  <text class="sub-inv"   x="84" y="438">which permissions the answer inherits</text>

  <rect class="adj" x="560" y="305" width="300" height="150" />
  <text class="label" x="584" y="340">Report assembly</text>
  <text class="sub"   x="584" y="366">outline before or after retrieval</text>
  <text class="sub"   x="584" y="388">claim-to-span citation binding</text>
  <text class="sub"   x="584" y="416">export, review, verification pass</text>
  <text class="sub"   x="584" y="438">decides whether it can be checked</text>
</svg>
