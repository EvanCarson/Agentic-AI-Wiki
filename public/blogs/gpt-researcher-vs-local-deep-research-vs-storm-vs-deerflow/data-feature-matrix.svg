<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="dfm-t dfm-d">
  <title id="dfm-t">Four open-source research projects against four axes</title>
  <desc id="dfm-d">A matrix. Rows are GPT Researcher, Local Deep Research, STORM and DeerFlow. Columns are whether the project is still maintained as a research agent, whether it runs fully locally, how strong its structure and citation design is, and how large a tool or MCP surface it brings. No column predicts answer quality.</desc>
  <style>
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .title  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .colh   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .rowh   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .legend { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="title" x="30" y="34">Where each one leans hardest</text>

  <text class="colh" x="222" y="68">STILL A RESEARCH AGENT</text>
  <text class="colh" x="412" y="68">RUNS FULLY LOCAL</text>
  <text class="colh" x="572" y="68">STRUCTURE &amp; CITATIONS</text>
  <text class="colh" x="752" y="68">TOOL / MCP SURFACE</text>

  <text class="rowh" x="30" y="108">GPT Researcher</text>
  <rect class="strong" x="220" y="86" width="170" height="34" />
  <text class="cell-inv" x="236" y="108">Yes, v3.7.0 Sep 2026</text>
  <rect class="med" x="400" y="86" width="150" height="34" />
  <text class="cell" x="416" y="108">Local files, cloud LLM</text>
  <rect class="med" x="560" y="86" width="170" height="34" />
  <text class="cell" x="576" y="108">Cited, exports, no outline</text>
  <rect class="med" x="740" y="86" width="130" height="34" />
  <text class="cell" x="756" y="108">MCP client + server</text>

  <text class="rowh" x="30" y="168">Local Deep Research</text>
  <rect class="strong" x="220" y="146" width="170" height="34" />
  <text class="cell-inv" x="236" y="168">Yes, commits this week</text>
  <rect class="strong" x="400" y="146" width="150" height="34" />
  <text class="cell-inv" x="416" y="168">Ollama / LM Studio</text>
  <rect class="med" x="560" y="146" width="170" height="34" />
  <text class="cell" x="576" y="168">Cited, strategy-dependent</text>
  <rect class="weak" x="740" y="146" width="130" height="34" />
  <text class="cell" x="756" y="168">Retrievers, not tools</text>

  <text class="rowh" x="30" y="228">STORM</text>
  <rect class="weak" x="220" y="206" width="170" height="34" />
  <text class="cell" x="236" y="228">Frozen since Sep 2025</text>
  <rect class="med" x="400" y="206" width="150" height="34" />
  <text class="cell" x="416" y="228">litellm, so possible</text>
  <rect class="strong" x="560" y="206" width="170" height="34" />
  <text class="cell-inv" x="576" y="228">Outline-first, perspectives</text>
  <rect class="weak" x="740" y="206" width="130" height="34" />
  <text class="cell" x="756" y="228">Retrievers only</text>

  <text class="rowh" x="30" y="288">DeerFlow</text>
  <rect class="weak" x="220" y="266" width="170" height="34" />
  <text class="cell" x="236" y="288">No — harness since 2.0</text>
  <rect class="med" x="400" y="266" width="150" height="34" />
  <text class="cell" x="416" y="288">Self-hosted, pluggable</text>
  <rect class="weak" x="560" y="266" width="170" height="34" />
  <text class="cell" x="576" y="288">Generic agent output</text>
  <rect class="strong" x="740" y="266" width="130" height="34" />
  <text class="cell-inv" x="756" y="288">stdio, HTTP/SSE, jobs</text>

  <rect class="strong" x="30" y="344" width="16" height="16" />
  <text class="legend" x="54" y="357">Strong</text>
  <rect class="med" x="130" y="344" width="16" height="16" />
  <text class="legend" x="154" y="357">Medium</text>
  <rect class="weak" x="240" y="344" width="16" height="16" />
  <text class="legend" x="264" y="357">Weak or not the point</text>
</svg>
