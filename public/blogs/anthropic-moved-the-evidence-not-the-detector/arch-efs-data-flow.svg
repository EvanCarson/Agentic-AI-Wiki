<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="efsT efsD">
  <title id="efsT">Where the data and the decision sit under Enterprise Frontier Safeguards</title>
  <desc id="efsD">A left-to-right flow. Traffic from Claude Code, Claude Enterprise and the Claude Platform reaches Anthropic's inference boundary. Activity data is written into the customer's own object storage — Amazon S3, Azure Blob Storage or Google Cloud Storage — under the customer's encryption keys, access policies and audit logging. Anthropic's classifier reads a rolling window of that traffic and emits alerts, which route to the customer's reviewers rather than to Anthropic. The classifier itself stays on the vendor side, so the customer holds the corpus but not the model that judges it.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: none; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .zone  { fill: none; stroke: var(--border-soft); stroke-width: 1.25; stroke-dasharray: 6 5; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .62; }
    .zt    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .8; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#efsArr); }
  </style>
  <defs>
    <marker id="efsArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="zone" x="8" y="40" width="270" height="270" rx="10" />
  <text class="zt" x="20" y="62">Your estate</text>

  <rect class="zone" x="318" y="40" width="250" height="270" rx="10" />
  <text class="zt" x="330" y="62">Anthropic</text>

  <rect class="zone" x="608" y="40" width="284" height="410" rx="10" />
  <text class="zt" x="620" y="62">Your cloud account</text>

  <rect class="box" x="28" y="84" width="230" height="52" rx="8" />
  <text class="label" x="143" y="115" text-anchor="middle">Claude Code</text>
  <rect class="box" x="28" y="150" width="230" height="52" rx="8" />
  <text class="label" x="143" y="181" text-anchor="middle">Claude Enterprise</text>
  <rect class="box" x="28" y="216" width="230" height="52" rx="8" />
  <text class="label" x="143" y="247" text-anchor="middle">Claude Platform, Bedrock, Foundry</text>

  <path class="arrow" d="M 262 176 L 334 176" />

  <rect class="hero" x="340" y="120" width="206" height="60" rx="8" />
  <text class="inv" x="443" y="146" text-anchor="middle">Inference</text>
  <text class="inv" x="443" y="166" text-anchor="middle">boundary</text>

  <rect class="adj" x="340" y="208" width="206" height="82" rx="8" />
  <text class="label" x="443" y="238" text-anchor="middle">Misuse classifier</text>
  <text class="sub" x="443" y="258" text-anchor="middle">rolling window,</text>
  <text class="sub" x="443" y="274" text-anchor="middle">stays on the vendor side</text>

  <path class="arrow" d="M 552 150 L 624 150" />
  <text class="sub" x="588" y="140" text-anchor="middle">activity data</text>

  <rect class="box" x="628" y="88" width="248" height="96" rx="8" />
  <text class="label" x="752" y="118" text-anchor="middle">S3 / Azure Blob / GCS</text>
  <text class="sub" x="752" y="140" text-anchor="middle">your encryption keys,</text>
  <text class="sub" x="752" y="156" text-anchor="middle">your access policies,</text>
  <text class="sub" x="752" y="172" text-anchor="middle">your audit logging</text>

  <path class="arrow" d="M 752 190 L 752 214" />
  <path class="arrow" d="M 552 250 L 600 250 L 600 236 L 624 236" />
  <text class="sub" x="588" y="270" text-anchor="middle">alerts</text>

  <rect class="adj" x="628" y="218" width="248" height="70" rx="8" />
  <text class="label" x="752" y="248" text-anchor="middle">Your reviewers</text>
  <text class="sub" x="752" y="270" text-anchor="middle">human review, by default yours</text>

  <path class="arrow" d="M 752 294 L 752 320" />

  <rect class="box" x="628" y="324" width="248" height="106" rx="8" />
  <text class="label" x="752" y="352" text-anchor="middle">Things you now own</text>
  <text class="sub" x="752" y="374" text-anchor="middle">a retention rule for prompts</text>
  <text class="sub" x="752" y="392" text-anchor="middle">a legal-hold path</text>
  <text class="sub" x="752" y="410" text-anchor="middle">an escalation route off the SOC</text>

  <text class="sub" x="8" y="474">The corpus crosses the boundary. The classifier does not — which is the whole trade, in both directions.</text>
</svg>
