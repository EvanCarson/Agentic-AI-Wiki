<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="smT smD">
  <title id="smT">What the classifier looks for versus what the corpus would show</title>
  <desc id="smD">A matrix with five risk categories as rows and three columns: whether the Enterprise Frontier Safeguards classifier flags it, whether the stored corpus would evidence it, and whether your existing controls already see it. Offensive cyber capability building and biological capability building are flagged by the classifier and evidenced by the corpus. Stolen or leaked credentials are flagged and evidenced. Insider aggregation by an authorised employee is not flagged but is evidenced by the corpus, and existing controls miss it. Ordinary workplace misconduct is not flagged, is evidenced by the corpus, and is partly covered by existing controls.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .row   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cellv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .yes   { fill: var(--accent, #d4421e); stroke: none; }
    .part  { fill: var(--accent-soft); stroke: var(--border-soft); stroke-width: 1; }
    .no    { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; }
  </style>

  <text class="ttl" x="0" y="18">What is flagged, what is merely recorded</text>

  <text class="hd" x="450" y="52" text-anchor="middle">Classifier</text>
  <text class="hd" x="450" y="66" text-anchor="middle">flags it</text>
  <text class="hd" x="620" y="52" text-anchor="middle">Corpus would</text>
  <text class="hd" x="620" y="66" text-anchor="middle">evidence it</text>
  <text class="hd" x="790" y="52" text-anchor="middle">Your existing</text>
  <text class="hd" x="790" y="66" text-anchor="middle">controls see it</text>

  <text class="row" x="0" y="106">Offensive cyber capability</text>
  <rect class="yes"  x="374" y="82" width="152" height="42" rx="6" />
  <text class="cellv" x="450" y="108" text-anchor="middle">Yes</text>
  <rect class="yes"  x="544" y="82" width="152" height="42" rx="6" />
  <text class="cellv" x="620" y="108" text-anchor="middle">Yes</text>
  <rect class="no"   x="714" y="82" width="152" height="42" rx="6" />
  <text class="cell" x="790" y="108" text-anchor="middle">Rarely</text>

  <text class="row" x="0" y="164">Biological capability</text>
  <rect class="yes"  x="374" y="140" width="152" height="42" rx="6" />
  <text class="cellv" x="450" y="166" text-anchor="middle">Yes</text>
  <rect class="yes"  x="544" y="140" width="152" height="42" rx="6" />
  <text class="cellv" x="620" y="166" text-anchor="middle">Yes</text>
  <rect class="no"   x="714" y="140" width="152" height="42" rx="6" />
  <text class="cell" x="790" y="166" text-anchor="middle">No</text>

  <text class="row" x="0" y="222">Stolen or leaked credentials</text>
  <rect class="yes"  x="374" y="198" width="152" height="42" rx="6" />
  <text class="cellv" x="450" y="224" text-anchor="middle">Yes</text>
  <rect class="yes"  x="544" y="198" width="152" height="42" rx="6" />
  <text class="cellv" x="620" y="224" text-anchor="middle">Yes</text>
  <rect class="part" x="714" y="198" width="152" height="42" rx="6" />
  <text class="cell" x="790" y="224" text-anchor="middle">Partly</text>

  <text class="row" x="0" y="280">Insider aggregation, authorised</text>
  <rect class="no"   x="374" y="256" width="152" height="42" rx="6" />
  <text class="cell" x="450" y="282" text-anchor="middle">Out of scope</text>
  <rect class="yes"  x="544" y="256" width="152" height="42" rx="6" />
  <text class="cellv" x="620" y="282" text-anchor="middle">Yes</text>
  <rect class="no"   x="714" y="256" width="152" height="42" rx="6" />
  <text class="cell" x="790" y="282" text-anchor="middle">No</text>

  <text class="row" x="0" y="338">Ordinary workplace misconduct</text>
  <rect class="no"   x="374" y="314" width="152" height="42" rx="6" />
  <text class="cell" x="450" y="340" text-anchor="middle">Out of scope</text>
  <rect class="yes"  x="544" y="314" width="152" height="42" rx="6" />
  <text class="cellv" x="620" y="340" text-anchor="middle">Yes</text>
  <rect class="part" x="714" y="314" width="152" height="42" rx="6" />
  <text class="cell" x="790" y="340" text-anchor="middle">Partly</text>

  <text class="sub" x="0" y="380">The middle column is the one nobody asked for. It is also the only column that is now inside your own retention and disclosure obligations.</text>
</svg>
