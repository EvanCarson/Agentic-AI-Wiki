<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="whT whD">
  <title id="whT">Who holds the corpus, the classifier and the duty</title>
  <desc id="whD">Three arrangements side by side. Under vendor-side monitoring the vendor holds the corpus, the classifier and the duty to act, and the customer holds none of them. Under classic zero data retention nobody holds a corpus, so there is no cross-session detection and no duty attaches to anyone. Under Enterprise Frontier Safeguards the customer holds the corpus and the duty while the vendor keeps the classifier.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: none; }
    .hd    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .rw    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .72; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .62; }
  </style>

  <text class="hd" x="232" y="26" text-anchor="middle">Vendor-side monitoring</text>
  <text class="hd" x="501" y="26" text-anchor="middle">Classic zero retention</text>
  <text class="hd" x="770" y="26" text-anchor="middle">Frontier Safeguards</text>

  <text class="rw" x="0" y="68">Corpus</text>
  <rect class="box" x="104" y="46" width="257" height="34" rx="6" />
  <text class="label" x="232" y="68" text-anchor="middle">Vendor's systems</text>
  <rect class="box" x="373" y="46" width="257" height="34" rx="6" />
  <text class="label" x="501" y="68" text-anchor="middle">Nobody keeps one</text>
  <rect class="hero" x="642" y="46" width="257" height="34" rx="6" />
  <text class="inv" x="770" y="68" text-anchor="middle">Your cloud account</text>

  <text class="rw" x="0" y="128">Classifier</text>
  <rect class="adj" x="104" y="106" width="257" height="34" rx="6" />
  <text class="label" x="232" y="128" text-anchor="middle">Vendor</text>
  <rect class="box" x="373" y="106" width="257" height="34" rx="6" />
  <text class="label" x="501" y="128" text-anchor="middle">Single exchange only</text>
  <rect class="adj" x="642" y="106" width="257" height="34" rx="6" />
  <text class="label" x="770" y="128" text-anchor="middle">Vendor, unchanged</text>

  <text class="rw" x="0" y="188">Alert</text>
  <rect class="box" x="104" y="166" width="257" height="34" rx="6" />
  <text class="label" x="232" y="188" text-anchor="middle">Vendor acts, may tell you</text>
  <rect class="box" x="373" y="166" width="257" height="34" rx="6" />
  <text class="label" x="501" y="188" text-anchor="middle">No cross-session signal</text>
  <rect class="hero" x="642" y="166" width="257" height="34" rx="6" />
  <text class="inv" x="770" y="188" text-anchor="middle">Routes to you</text>

  <text class="rw" x="0" y="248">Duty to act</text>
  <rect class="box" x="104" y="226" width="257" height="34" rx="6" />
  <text class="label" x="232" y="248" text-anchor="middle">Vendor's</text>
  <rect class="box" x="373" y="226" width="257" height="34" rx="6" />
  <text class="label" x="501" y="248" text-anchor="middle">Unassigned</text>
  <rect class="hero" x="642" y="226" width="257" height="34" rx="6" />
  <text class="inv" x="770" y="248" text-anchor="middle">Yours, by default</text>

  <text class="sub" x="0" y="288">Only one row moved between the middle column and the right one, and it is the bottom row.</text>
</svg>
