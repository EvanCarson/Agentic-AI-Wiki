<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="lt ld">
  <title id="lt">Leaderboard reliability by the claim being made</title>
  <desc id="ld">Reported generalizability coefficients across 22 agent benchmarks. Ranking a fixed model and scaffold pair is reliable, spanning 0.935 to 0.994. Ranking the underlying model from the same data spans 0.148 to 0.841, a range that reaches almost no reliability at its lower end.</desc>
  <style>
    .lb-hi   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .lb-lo   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .lb-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lb-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .lb-val  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .lb-tick { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .lb-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .lb-grid { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 4; }
    .lb-axis { stroke: var(--ink); stroke-width: 1; opacity: .45; }
  </style>

  <text class="lb-ttl" x="20" y="34">Generalizability coefficient across 22 agent benchmarks</text>

  <line class="lb-axis" x1="240" y1="90" x2="240" y2="245" />
  <line class="lb-grid" x1="370" y1="90" x2="370" y2="245" />
  <line class="lb-grid" x1="500" y1="90" x2="500" y2="245" />
  <line class="lb-grid" x1="630" y1="90" x2="630" y2="245" />
  <line class="lb-grid" x1="760" y1="90" x2="760" y2="245" />

  <text class="lb-row" x="20" y="136">Model + scaffold, as a pair</text>
  <rect class="lb-hi" x="726" y="110" width="31" height="40" />
  <text class="lb-val" x="769" y="136">0.935 - 0.994</text>

  <text class="lb-row" x="20" y="216">The underlying model</text>
  <rect class="lb-lo" x="317" y="190" width="360" height="40" />
  <text class="lb-val" x="689" y="216">0.148 - 0.841</text>

  <text class="lb-tick" x="240" y="268" text-anchor="middle">0.00</text>
  <text class="lb-tick" x="370" y="268" text-anchor="middle">0.25</text>
  <text class="lb-tick" x="500" y="268" text-anchor="middle">0.50</text>
  <text class="lb-tick" x="630" y="268" text-anchor="middle">0.75</text>
  <text class="lb-tick" x="760" y="268" text-anchor="middle">1.00</text>

  <text class="lb-sub" x="20" y="320">Same rollouts, same benchmarks. Only the claim read off them changes.</text>
  <text class="lb-sub" x="20" y="346">The lower bar is what a reader takes away when they compare two model names.</text>
</svg>
