<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="vt vd">
  <title id="vt">Which eval lever attacks which source of uncertainty</title>
  <desc id="vd">Three spending levers on the left map to three sources of leaderboard uncertainty on the right. Adding tasks attacks task-sampling variance. Adding scaffolds or measurement conditions attacks scaffold variance. Adding repeated runs attacks within-run noise. When scaffold coverage is the dominant source, adding tasks cannot reach it, and even an unlimited number of similar tasks raises model-ranking reliability by at most 0.097.</desc>
  <style>
    .vb-box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .vb-hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .vb-adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .vb-lab   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .vb-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .vb-hd    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); opacity: .75; }
    .vb-sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .72; }
    .vb-arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#varr); }
  </style>
  <defs>
    <marker id="varr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="vb-hd" x="40" y="48">Where you spend the next 1,000 rollouts</text>
  <text class="vb-hd" x="560" y="48">What it can reduce</text>

  <rect class="vb-box" x="40" y="70" width="250" height="60" />
  <text class="vb-lab" x="165" y="106" text-anchor="middle">More tasks</text>
  <rect class="vb-hero" x="40" y="190" width="250" height="60" />
  <text class="vb-inv" x="165" y="226" text-anchor="middle">More scaffolds</text>
  <rect class="vb-box" x="40" y="310" width="250" height="60" />
  <text class="vb-lab" x="165" y="346" text-anchor="middle">More runs per task</text>

  <path class="vb-arrow" d="M 290 100 L 552 100" />
  <path class="vb-arrow" d="M 290 220 L 552 220" />
  <path class="vb-arrow" d="M 290 340 L 552 340" />

  <rect class="vb-box" x="560" y="70" width="300" height="60" />
  <text class="vb-lab" x="710" y="106" text-anchor="middle">Task-sampling variance</text>
  <rect class="vb-adj" x="560" y="190" width="300" height="60" />
  <text class="vb-lab" x="710" y="226" text-anchor="middle">Scaffold variance</text>
  <rect class="vb-box" x="560" y="310" width="300" height="60" />
  <text class="vb-lab" x="710" y="346" text-anchor="middle">Within-run noise</text>

  <text class="vb-sub" x="40" y="420">When scaffold coverage is the dominant source of uncertainty, an unlimited number of</text>
  <text class="vb-sub" x="40" y="444">similarly built tasks raises model-ranking reliability by at most 0.097. The top lever</text>
  <text class="vb-sub" x="40" y="468">cannot reach the middle row, and the middle row is the one holding the score down.</text>
</svg>
