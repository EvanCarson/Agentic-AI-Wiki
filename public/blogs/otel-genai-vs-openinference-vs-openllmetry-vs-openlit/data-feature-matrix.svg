<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t1 d1">
  <title id="t1">Where each GenAI tracing convention leans hardest</title>
  <desc id="d1">A four-by-four matrix. Rows are the OpenTelemetry GenAI conventions, OpenInference, OpenLLMetry and OpenLIT. Columns are pinnable release, agent-shaped span vocabulary, auto-instrumentation breadth and backend portability. The OTel GenAI row is weak on pinnable release and medium on span vocabulary while strong on portability; OpenInference is strong on span vocabulary; OpenLLMetry is strong on instrumentation breadth and medium elsewhere; OpenLIT is strong on portability and medium on vocabulary.</desc>
  <style>
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .strong { fill: var(--accent, #d4421e); stroke: var(--accent, #d4421e); stroke-width: 1; }
    .cell      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); text-anchor: middle; }
    .cell-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); text-anchor: middle; }
    .rowlab { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .collab { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .65; text-anchor: middle; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .65; letter-spacing: .08em; }
    .leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="head" x="30" y="28">FOUR CONVENTIONS, FOUR AXES</text>

  <text class="collab" x="388" y="64">PINNABLE?</text>
  <text class="collab" x="528" y="64">AGENT SPANS</text>
  <text class="collab" x="668" y="64">BREADTH</text>
  <text class="collab" x="808" y="64">PORTABILITY</text>

  <text class="rowlab" x="30" y="105">OTel GenAI conventions</text>
  <rect class="weak" x="322" y="80" width="132" height="40" rx="5" />
  <text class="cell" x="388" y="105">Weak (no tag)</text>
  <rect class="med" x="462" y="80" width="132" height="40" rx="5" />
  <text class="cell" x="528" y="105">Medium</text>
  <rect class="weak" x="602" y="80" width="132" height="40" rx="5" />
  <text class="cell" x="668" y="105">Weak (no SDK)</text>
  <rect class="strong" x="742" y="80" width="132" height="40" rx="5" />
  <text class="cell-inv" x="808" y="105">Strong</text>

  <text class="rowlab" x="30" y="165">OpenInference</text>
  <rect class="strong" x="322" y="140" width="132" height="40" rx="5" />
  <text class="cell-inv" x="388" y="165">Strong</text>
  <rect class="strong" x="462" y="140" width="132" height="40" rx="5" />
  <text class="cell-inv" x="528" y="165">Strong (11 kinds)</text>
  <rect class="med" x="602" y="140" width="132" height="40" rx="5" />
  <text class="cell" x="668" y="165">Medium</text>
  <rect class="med" x="742" y="140" width="132" height="40" rx="5" />
  <text class="cell" x="808" y="165">Medium</text>

  <text class="rowlab" x="30" y="225">OpenLLMetry</text>
  <rect class="med" x="322" y="200" width="132" height="40" rx="5" />
  <text class="cell" x="388" y="225">Medium</text>
  <rect class="weak" x="462" y="200" width="132" height="40" rx="5" />
  <text class="cell" x="528" y="225">Weak (straddles)</text>
  <rect class="strong" x="602" y="200" width="132" height="40" rx="5" />
  <text class="cell-inv" x="668" y="225">Strong</text>
  <rect class="med" x="742" y="200" width="132" height="40" rx="5" />
  <text class="cell" x="808" y="225">Medium</text>

  <text class="rowlab" x="30" y="285">OpenLIT</text>
  <rect class="med" x="322" y="260" width="132" height="40" rx="5" />
  <text class="cell" x="388" y="285">Medium</text>
  <rect class="med" x="462" y="260" width="132" height="40" rx="5" />
  <text class="cell" x="528" y="285">Medium</text>
  <rect class="med" x="602" y="260" width="132" height="40" rx="5" />
  <text class="cell" x="668" y="285">Medium (+GPU)</text>
  <rect class="strong" x="742" y="260" width="132" height="40" rx="5" />
  <text class="cell-inv" x="808" y="285">Strong</text>

  <rect class="weak" x="322" y="336" width="20" height="20" rx="4" />
  <text class="leg" x="350" y="351">Weak</text>
  <rect class="med" x="422" y="336" width="20" height="20" rx="4" />
  <text class="leg" x="450" y="351">Medium</text>
  <rect class="strong" x="534" y="336" width="20" height="20" rx="4" />
  <text class="leg" x="562" y="351">Strong</text>
</svg>
