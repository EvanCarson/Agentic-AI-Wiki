<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t3 d3">
  <title id="t3">Where a convention choice lands in the tracing stack</title>
  <desc id="d3">Four stacked layers from application code through the instrumentation SDK to the emitted span shape and finally the backend features that consume it. The span-kind vocabulary inside the span shape is marked as the contract backend features dispatch on; attribute names are marked as the layer that changes between versions. A collector processor sits beside the span-shape layer as the place to absorb renames.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--accent, #d4421e); stroke-width: 1.25; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; font-style: italic; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .65; letter-spacing: .08em; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr3); }
    .tick   { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="40" y="30">THE STACK</text>
  <text class="head" x="560" y="30">WHAT MOVES</text>

  <rect class="box" x="40" y="48" width="440" height="72" rx="8" />
  <text class="label" x="60" y="78">Application code</text>
  <text class="sub" x="60" y="100">framework calls, your agent loop</text>
  <text class="note" x="560" y="90">Should never name a convention</text>

  <path class="arrow" d="M 260 126 L 260 152" />

  <rect class="box" x="40" y="160" width="440" height="72" rx="8" />
  <text class="label" x="60" y="190">Instrumentation SDK</text>
  <text class="mono" x="60" y="212">OpenInference · OpenLLMetry · OpenLIT</text>
  <text class="note" x="560" y="202">Upgrades arrive with bug fixes</text>

  <path class="arrow" d="M 260 238 L 260 264" />

  <rect class="hero" x="40" y="272" width="440" height="104" rx="8" />
  <text class="label-inv" x="60" y="302">Emitted span shape</text>
  <text class="sub-inv" x="60" y="324">span kind — the contract the backend dispatches on</text>
  <text class="sub-inv" x="60" y="346">attribute names — the layer that gets renamed</text>
  <text class="note" x="560" y="314">Span kind: stable, load-bearing</text>
  <text class="note" x="560" y="340">Attributes: 10 of 60 changed in one release</text>

  <path class="tick" d="M 480 324 L 548 310" />
  <path class="tick" d="M 480 346 L 548 336" />

  <rect class="adj" x="40" y="396" width="440" height="72" rx="8" />
  <text class="label" x="60" y="426">Backend features</text>
  <text class="sub" x="60" y="448">agent view, eval pipeline, replay, cost charts</text>
  <text class="note" x="560" y="430">Keyed on span kind, queried on attributes</text>

  <path class="arrow" d="M 260 382 L 260 390" />
</svg>
