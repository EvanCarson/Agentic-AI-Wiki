<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t2 d2">
  <title id="t2">What the June 2026 gen_ai deprecation did to sixty attributes</title>
  <desc id="d2">Three columns covering the sixty gen_ai attributes deprecated in OpenTelemetry semantic conventions v1.42.0 on 12 June 2026. Fifty moved to a new repository keeping the same attribute string. Eight were renamed, including both token-usage attributes and gen_ai.system becoming gen_ai.provider.name. Two, gen_ai.prompt and gen_ai.completion, were removed with no replacement, with content capture moving to opt-in message attributes.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--accent, #d4421e); stroke-width: 1.25; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .sub    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; text-anchor: middle; }
    .sub-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); opacity: .85; text-anchor: middle; }
    .big    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 30px; fill: var(--ink); text-anchor: middle; }
    .big-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 30px; fill: var(--paper); text-anchor: middle; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .65; letter-spacing: .08em; text-anchor: middle; }
  </style>

  <text class="head" x="450" y="28">SIXTY gen_ai ATTRIBUTES DEPRECATED IN v1.42.0, 12 JUNE 2026</text>

  <rect class="box" x="40" y="50" width="240" height="100" rx="8" />
  <text class="big" x="160" y="100">50</text>
  <text class="label" x="160" y="128">moved, same string</text>
  <rect class="box" x="40" y="162" width="240" height="98" rx="8" />
  <text class="label" x="160" y="194">Informational only</text>
  <text class="sub" x="160" y="218">new repository,</text>
  <text class="sub" x="160" y="236">identical attribute name</text>

  <rect class="adj" x="330" y="50" width="240" height="100" rx="8" />
  <text class="big" x="450" y="100">8</text>
  <text class="label" x="450" y="128">renamed</text>
  <rect class="adj" x="330" y="162" width="240" height="98" rx="8" />
  <text class="label" x="450" y="194">Charts under-count silently</text>
  <text class="sub" x="450" y="218">usage.prompt_tokens →</text>
  <text class="sub" x="450" y="236">usage.input_tokens</text>

  <rect class="hero" x="620" y="50" width="240" height="100" rx="8" />
  <text class="big-inv" x="740" y="100">2</text>
  <text class="label-inv" x="740" y="128">removed outright</text>
  <rect class="adj" x="620" y="162" width="240" height="98" rx="8" />
  <text class="label" x="740" y="194">No rename to apply</text>
  <text class="sub" x="740" y="218">gen_ai.prompt,</text>
  <text class="sub" x="740" y="236">gen_ai.completion</text>
</svg>
