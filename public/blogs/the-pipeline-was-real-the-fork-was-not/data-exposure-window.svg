<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ewt ewd">
  <title id="ewt">Minutes of exposure, 21 October 2026 (UTC)</title>
  <desc id="ewd">A timeline from 11:30 to 14:00. The malicious release was installable from PyPI for 101 minutes, from 11:39 until the 13:20 quarantine. The container images stayed available for 134 minutes, until 13:53. Socket flagged the wheels about 7 minutes after publication.</desc>
  <style>
    .ew-hero { fill: var(--accent, #d4421e); }
    .ew-adj  { fill: var(--accent-soft); }
    .ew-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .ew-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .ew-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .ew-val  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .ew-ax   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .ew-grid { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 4; opacity: .28; }
    .ew-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="ew-ttl" x="40" y="36">Minutes of exposure, 21 October 2026 (UTC)</text>

  <line class="ew-grid" x1="150" y1="60" x2="150" y2="320" />
  <line class="ew-grid" x1="290" y1="60" x2="290" y2="320" />
  <line class="ew-grid" x1="570" y1="60" x2="570" y2="320" />
  <line class="ew-grid" x1="850" y1="60" x2="850" y2="320" />

  <text class="ew-lbl" x="176" y="124" text-anchor="end">PyPI</text>
  <rect class="ew-adj" x="192" y="98" width="471" height="40" rx="4" ry="4" />
  <text class="ew-val" x="675" y="124">101 min</text>

  <text class="ew-lbl" x="176" y="204" text-anchor="end">images</text>
  <rect class="ew-hero" x="192" y="178" width="625" height="40" rx="4" ry="4" />
  <text class="ew-val" x="829" y="204">134 min</text>

  <text class="ew-lbl" x="176" y="284" text-anchor="end">Socket flag</text>
  <rect class="ew-box" x="192" y="258" width="33" height="40" rx="4" ry="4" />
  <text class="ew-val" x="237" y="284">7 min</text>

  <text class="ew-ax" x="150" y="344" text-anchor="middle">11:30</text>
  <text class="ew-ax" x="290" y="344" text-anchor="middle">12:00</text>
  <text class="ew-ax" x="570" y="344" text-anchor="middle">13:00</text>
  <text class="ew-ax" x="850" y="344" text-anchor="middle">14:00</text>

  <text class="ew-sub" x="40" y="382">Detection beat the quarantine by 94 minutes and the first installs by none of it.</text>
</svg>
