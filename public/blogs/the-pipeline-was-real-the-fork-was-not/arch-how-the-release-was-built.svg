<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="pwt pwd">
  <title id="pwt">How the malicious LiteLLM release was built</title>
  <desc id="pwd">Stolen GitHub CLI tokens from three engineer accounts dispatch LiteLLM's genuine release workflow. The workflow reads a lookalike fork named Berri-AI slash litellm instead of BerriAI slash litellm, then publishes signed artefacts to PyPI, GitHub Container Registry and Docker Hub under the project's own identity.</desc>
  <style>
    .pw-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pw-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pw-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pw-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .pw-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .pw-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .pw-arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#pwarr); }
  </style>
  <defs>
    <marker id="pwarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="pw-adj" x="30" y="90" width="210" height="80" />
  <text class="pw-lbl" x="135" y="122" text-anchor="middle">stolen GitHub CLI tokens</text>
  <text class="pw-lbl" x="135" y="144" text-anchor="middle">from 3 engineer accounts</text>

  <rect class="pw-adj" x="30" y="300" width="210" height="80" />
  <text class="pw-lbl" x="135" y="332" text-anchor="middle">Berri-AI/litellm</text>
  <text class="pw-lbl" x="135" y="354" text-anchor="middle">lookalike fork</text>

  <rect class="pw-hero" x="330" y="175" width="230" height="120" />
  <text class="pw-inv" x="445" y="215" text-anchor="middle">LiteLLM's own</text>
  <text class="pw-inv" x="445" y="237" text-anchor="middle">release workflow</text>
  <text class="pw-inv" x="445" y="265" text-anchor="middle">genuine, logged, signed</text>

  <path class="pw-arrow" d="M 240 132 L 322 206" />
  <path class="pw-arrow" d="M 240 338 L 322 266" />

  <rect class="pw-box" x="650" y="90" width="220" height="70" />
  <text class="pw-lbl" x="760" y="120" text-anchor="middle">PyPI</text>
  <text class="pw-lbl" x="760" y="142" text-anchor="middle">litellm 1.107.0</text>

  <rect class="pw-box" x="650" y="200" width="220" height="70" />
  <text class="pw-lbl" x="760" y="230" text-anchor="middle">GitHub Container Registry</text>
  <text class="pw-lbl" x="760" y="252" text-anchor="middle">v1.107.0, latest</text>

  <rect class="pw-box" x="650" y="310" width="220" height="70" />
  <text class="pw-lbl" x="760" y="340" text-anchor="middle">Docker Hub</text>
  <text class="pw-lbl" x="760" y="362" text-anchor="middle">main-latest, main-stable</text>

  <path class="pw-arrow" d="M 560 212 L 642 128" />
  <path class="pw-arrow" d="M 560 235 L 642 235" />
  <path class="pw-arrow" d="M 560 258 L 642 342" />

  <text class="pw-sub" x="450" y="440" text-anchor="middle">Only the lower-left box does not belong to the project. Every other box is its real infrastructure.</text>
  <text class="pw-sub" x="450" y="464" text-anchor="middle">A provenance attestation describes the centre box, which behaved correctly throughout.</text>
</svg>
