<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="cst csd">
  <title id="cst">What each supply-chain control verifies</title>
  <desc id="csd">Three columns. A floating tag answers which artefact is newest and installed the malicious release. A build provenance attestation answers which pipeline built the artefact and verified successfully. A digest pin answers whether the bytes match the reviewed ones and refused the release.</desc>
  <style>
    .cs-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .cs-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .cs-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .cs-head { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .cs-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cs-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .cs-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="cs-head" x="170" y="34" text-anchor="middle">floating tag</text>
  <text class="cs-head" x="450" y="34" text-anchor="middle">build provenance</text>
  <text class="cs-head" x="730" y="34" text-anchor="middle">digest pin</text>

  <rect class="cs-box" x="60" y="56" width="220" height="76" />
  <text class="cs-lbl" x="170" y="88" text-anchor="middle">asks: what is</text>
  <text class="cs-lbl" x="170" y="110" text-anchor="middle">the newest build?</text>

  <rect class="cs-box" x="340" y="56" width="220" height="76" />
  <text class="cs-lbl" x="450" y="88" text-anchor="middle">asks: whose pipeline</text>
  <text class="cs-lbl" x="450" y="110" text-anchor="middle">built this?</text>

  <rect class="cs-box" x="620" y="56" width="220" height="76" />
  <text class="cs-lbl" x="730" y="88" text-anchor="middle">asks: are these the</text>
  <text class="cs-lbl" x="730" y="110" text-anchor="middle">bytes I reviewed?</text>

  <rect class="cs-adj" x="60" y="170" width="220" height="76" />
  <text class="cs-lbl" x="170" y="202" text-anchor="middle">installed 1.107.0</text>
  <text class="cs-lbl" x="170" y="224" text-anchor="middle">for 101 minutes</text>

  <rect class="cs-adj" x="340" y="170" width="220" height="76" />
  <text class="cs-lbl" x="450" y="202" text-anchor="middle">verified, and passed</text>
  <text class="cs-lbl" x="450" y="224" text-anchor="middle">the malicious wheel</text>

  <rect class="cs-hero" x="620" y="170" width="220" height="76" />
  <text class="cs-inv" x="730" y="202" text-anchor="middle">refused: no digest</text>
  <text class="cs-inv" x="730" y="224" text-anchor="middle">on record for it</text>

  <text class="cs-sub" x="450" y="282" text-anchor="middle">Two of the three ask about origin. Origin was never substituted, so only the third one moved.</text>
</svg>
