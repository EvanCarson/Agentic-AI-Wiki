<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="rt rd">
  <title id="rt">Benchmark review verdicts</title>
  <desc id="rd">Of fifteen widely cited benchmarks reviewed by Epoch AI as of mid-September 2026, nine were rated Flawed, four Verified, and two carried too little information for a verdict.</desc>
  <style>
    .rv-hi   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .rv-mid  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .rv-lo   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .rv-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .rv-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .rv-val  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .rv-tick { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .rv-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .rv-grid { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 4; }
    .rv-axis { stroke: var(--ink); stroke-width: 1; opacity: .45; }
  </style>

  <text class="rv-ttl" x="20" y="34">Verdicts across 15 widely cited benchmarks, mid-September 2026</text>

  <line class="rv-axis" x1="260" y1="88" x2="260" y2="268" />
  <line class="rv-grid" x1="460" y1="88" x2="460" y2="268" />
  <line class="rv-grid" x1="660" y1="88" x2="660" y2="268" />
  <line class="rv-grid" x1="860" y1="88" x2="860" y2="268" />

  <text class="rv-row" x="20" y="126">Flawed</text>
  <rect class="rv-hi"  x="260" y="100" width="360" height="40" />
  <text class="rv-val" x="636" y="126">9</text>

  <text class="rv-row" x="20" y="186">Verified</text>
  <rect class="rv-mid" x="260" y="160" width="160" height="40" />
  <text class="rv-val" x="436" y="186">4</text>

  <text class="rv-row" x="20" y="246">Not enough information</text>
  <rect class="rv-lo"  x="260" y="220" width="80"  height="40" />
  <text class="rv-val" x="356" y="246">2</text>

  <text class="rv-tick" x="260" y="290" text-anchor="middle">0</text>
  <text class="rv-tick" x="460" y="290" text-anchor="middle">5</text>
  <text class="rv-tick" x="660" y="290" text-anchor="middle">10</text>
  <text class="rv-tick" x="860" y="290" text-anchor="middle">15</text>

  <text class="rv-sub" x="20" y="334">Flawed means scoring defects could affect at least 20% of the full score.</text>
  <text class="rv-sub" x="20" y="358">Every one of these benchmarks had published its tasks. The defects were found by reading them.</text>
</svg>
