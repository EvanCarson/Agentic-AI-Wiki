<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="et ed">
  <title id="et">Two independent error sources between capability and a quoted score</title>
  <desc id="ed">A chain of four boxes. True capability feeds a task set and its verifiers, which feeds a scaffold and sampling run, which produces the number a reader compares. Scoring defects live in the second box and run-to-run variance lives in the third; a benchmark audit addresses only the second.</desc>
  <style>
    .ts-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ts-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ts-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ts-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .ts-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .ts-note { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .ts-key  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .ts-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .ts-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#ts-h); }
  </style>
  <defs>
    <marker id="ts-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ts-key" x="20" y="40">Between what you want to know and what you read, two things can be wrong</text>

  <rect class="ts-box"  x="20"  y="90" width="170" height="70" />
  <text class="ts-lab"  x="105" y="131" text-anchor="middle">True capability</text>
  <path class="ts-arr"  d="M 198 125 L 222 125" />
  <rect class="ts-hero" x="230" y="90" width="200" height="70" />
  <text class="ts-inv"  x="330" y="131" text-anchor="middle">Task set + verifiers</text>
  <path class="ts-arr"  d="M 438 125 L 462 125" />
  <rect class="ts-adj"  x="470" y="90" width="200" height="70" />
  <text class="ts-lab"  x="570" y="131" text-anchor="middle">Scaffold + sampling</text>
  <path class="ts-arr"  d="M 678 125 L 702 125" />
  <rect class="ts-box"  x="710" y="90" width="170" height="70" />
  <text class="ts-lab"  x="795" y="131" text-anchor="middle">The quoted number</text>

  <text class="ts-note" x="105" y="200" text-anchor="middle">What you wanted</text>
  <text class="ts-note" x="330" y="200" text-anchor="middle">Scoring defects</text>
  <text class="ts-note" x="330" y="222" text-anchor="middle">30 of 66 tasks (TB 4.0.0)</text>
  <text class="ts-note" x="570" y="200" text-anchor="middle">Run-to-run variance</text>
  <text class="ts-note" x="570" y="222" text-anchor="middle">coverage caps the remedy</text>
  <text class="ts-note" x="795" y="200" text-anchor="middle">What the reader</text>
  <text class="ts-note" x="795" y="222" text-anchor="middle">compares</text>

  <text class="ts-sub" x="20" y="300">A benchmark audit addresses the second box only. It says nothing about the third.</text>
  <text class="ts-sub" x="20" y="326">A variance study addresses the third box only. It assumes the second one is sound.</text>
  <text class="ts-sub" x="20" y="374">Flawed verdict: scoring defects could affect at least 20% of the full score.</text>
  <text class="ts-sub" x="20" y="400">So a two-point lead between model names survives neither box.</text>
</svg>
