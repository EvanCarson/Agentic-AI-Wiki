<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Two escalation paths for an alert raised by an agentic evaluation</title>
  <desc id="d">Two horizontal flows. In the observed path, a monitoring alert reaches an on-call security responder, who correctly identifies the source as a sanctioned evaluation, classifies the activity as expected, and closes the ticket, so the run continues. In the path with a stop authority, the same alert is matched against abort criteria registered before the run started, the run is halted immediately under a stop-first default, and a named evaluation owner is paged to decide whether to resume.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="24" y="40">What happened</text>
  <text class="tag" x="24" y="62">DETECTION WORKED, DISPOSITION DID NOT</text>

  <rect class="box" x="24" y="80" width="190" height="98" />
  <text class="label" x="44" y="112">Monitoring alert</text>
  <text class="sub" x="44" y="134">port sweep inside the</text>
  <text class="sub" x="44" y="152">research environment</text>

  <path class="arrow" d="M 220 129 L 250 129" />

  <rect class="box" x="256" y="80" width="190" height="98" />
  <text class="label" x="276" y="112">On-call responder</text>
  <text class="sub" x="276" y="134">traces it correctly to a</text>
  <text class="sub" x="276" y="152">sanctioned evaluation</text>

  <path class="arrow" d="M 452 129 L 482 129" />

  <rect class="box" x="488" y="80" width="190" height="98" />
  <text class="label" x="508" y="112">Classified expected</text>
  <text class="sub" x="508" y="134">the system exists to</text>
  <text class="sub" x="508" y="152">probe things</text>

  <path class="arrow" d="M 684 129 L 714 129" />

  <rect class="adj" x="720" y="80" width="156" height="98" />
  <text class="label" x="740" y="112">Run continues</text>
  <text class="sub" x="740" y="134">no escalation,</text>
  <text class="sub" x="740" y="152">no owner paged</text>

  <line x1="24" y1="222" x2="876" y2="222" stroke="var(--ink)" stroke-width="1" opacity=".2" />

  <text class="head" x="24" y="266">What a stop authority changes</text>
  <text class="tag" x="24" y="288">SAME ALERT, DIFFERENT DEFAULT</text>

  <rect class="box" x="24" y="306" width="190" height="98" />
  <text class="label" x="44" y="338">Monitoring alert</text>
  <text class="sub" x="44" y="360">identical signal, same</text>
  <text class="sub" x="44" y="378">responder, same hour</text>

  <path class="arrow" d="M 220 355 L 250 355" />

  <rect class="adj" x="256" y="306" width="190" height="98" />
  <text class="label" x="276" y="338">Abort criteria</text>
  <text class="sub" x="276" y="360">written before the run;</text>
  <text class="sub" x="276" y="378">linked from the alert</text>

  <path class="arrow" d="M 452 355 L 482 355" />

  <rect class="hero" x="488" y="306" width="190" height="98" />
  <text class="label-inv" x="508" y="338">Run halted</text>
  <text class="sub-inv" x="508" y="360">stop first, then decide;</text>
  <text class="sub-inv" x="508" y="378">checkpoint preserved</text>

  <path class="arrow" d="M 684 355 L 714 355" />

  <rect class="box" x="720" y="306" width="156" height="98" />
  <text class="label" x="740" y="338">Owner paged</text>
  <text class="sub" x="740" y="360">named person</text>
  <text class="sub" x="740" y="378">decides on resume</text>

  <text class="sub" x="24" y="446">The responder&#8217;s judgement is unchanged in both rows. What changes is whether a decision to</text>
  <text class="sub" x="24" y="466">continue is theirs to make by default, and whether stopping costs a week or a restart.</text>
</svg>
