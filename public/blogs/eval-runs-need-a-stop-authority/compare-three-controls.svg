<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three controls for a long agentic evaluation</title>
  <desc id="d">Three columns. Isolation prevents an escape, is capital-intensive, is verified before the run, and fails silently because a gap stays invisible until something exercises it. Detection notices activity during the run, is cheap relative to isolation, and is the control that worked in this incident. Stop authority ends the run once something is noticed, costs almost nothing to establish, and is the control most organisations have never written down.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
  </style>

  <rect class="box" x="24" y="36" width="266" height="228" />
  <text class="head" x="44" y="66">Isolation</text>
  <text class="sub" x="44" y="100">stops an escape happening</text>
  <text class="sub" x="44" y="124">capital-intensive to build</text>
  <text class="sub" x="44" y="148">verified before the run</text>
  <line x1="44" y1="176" x2="270" y2="176" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="44" y="200">FAILS SILENTLY</text>
  <text class="label" x="44" y="228">a gap is invisible until</text>
  <text class="label" x="44" y="248">something exercises it</text>

  <rect class="adj" x="314" y="36" width="266" height="228" />
  <text class="head" x="334" y="66">Detection</text>
  <text class="sub" x="334" y="100">notices during the run</text>
  <text class="sub" x="334" y="124">cheap next to isolation</text>
  <text class="sub" x="334" y="148">generic rules suffice</text>
  <line x1="334" y1="176" x2="560" y2="176" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="334" y="200">THIS ONE WORKED</text>
  <text class="label" x="334" y="228">the port sweep was caught</text>
  <text class="label" x="334" y="248">the first day it happened</text>

  <rect class="hero" x="604" y="36" width="266" height="228" />
  <text class="head-inv" x="624" y="66">Stop authority</text>
  <text class="sub-inv" x="624" y="100">ends the run once noticed</text>
  <text class="sub-inv" x="624" y="124">a name, a page, a checkpoint</text>
  <text class="sub-inv" x="624" y="148">almost free to establish</text>
  <line x1="624" y1="176" x2="850" y2="176" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag" x="624" y="200" fill="var(--paper)" opacity=".85">USUALLY MISSING</text>
  <text class="label-inv" x="624" y="228">the only control that</text>
  <text class="label-inv" x="624" y="248">shortens the window</text>
</svg>
