<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="at ad">
  <title id="at">Two execution models for agent-drawn interfaces</title>
  <desc id="ad">Upper lane: a server returns an HTML document under a ui scheme, the host fetches it and runs it inside a cross-origin sandboxed iframe, so executable code travels from the server to the host. Lower lane: an agent returns a declarative JSON description of components, and the client draws them with widgets from its own catalogue, so no code travels. A note at the foot says an event protocol can carry either payload.</desc>
  <style>
    .wb-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .wb-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .wb-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .wb-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wb-lane { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wb-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wb-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .wb-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .wb-subi { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .wb-note { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
    .wb-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#wbarr); }
  </style>
  <defs>
    <marker id="wbarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="wb-ttl" x="20" y="32">Who executes the interface</text>

  <text class="wb-lane" x="20" y="72">Code travels — MCP Apps, OpenAI Apps SDK</text>
  <rect class="wb-box"  x="20"  y="88" width="180" height="72" />
  <text class="wb-lab"  x="110" y="118" text-anchor="middle">Tool server</text>
  <text class="wb-sub"  x="110" y="138" text-anchor="middle">owns the markup</text>
  <path class="wb-arr"  d="M 206 124 L 244 124" />
  <rect class="wb-adj"  x="250" y="88" width="200" height="72" />
  <text class="wb-lab"  x="350" y="118" text-anchor="middle">HTML5 document</text>
  <text class="wb-sub"  x="350" y="138" text-anchor="middle">ui:// resource</text>
  <path class="wb-arr"  d="M 456 124 L 494 124" />
  <rect class="wb-box"  x="500" y="88" width="160" height="72" />
  <text class="wb-lab"  x="580" y="118" text-anchor="middle">Host fetches</text>
  <text class="wb-sub"  x="580" y="138" text-anchor="middle">may cache it</text>
  <path class="wb-arr"  d="M 666 124 L 704 124" />
  <rect class="wb-hero" x="710" y="88" width="170" height="72" />
  <text class="wb-inv"  x="795" y="118" text-anchor="middle">Sandboxed iframe</text>
  <text class="wb-subi" x="795" y="138" text-anchor="middle">separate origin</text>
  <text class="wb-note" x="20"  y="188">Default policy is deny: no network, no nested frames, until the server declares the origins it needs.</text>

  <text class="wb-lane" x="20" y="248">Data travels — A2UI</text>
  <rect class="wb-box"  x="20"  y="264" width="180" height="72" />
  <text class="wb-lab"  x="110" y="294" text-anchor="middle">Agent</text>
  <text class="wb-sub"  x="110" y="314" text-anchor="middle">owns the intent</text>
  <path class="wb-arr"  d="M 206 300 L 244 300" />
  <rect class="wb-adj"  x="250" y="264" width="200" height="72" />
  <text class="wb-lab"  x="350" y="294" text-anchor="middle">Component list</text>
  <text class="wb-sub"  x="350" y="314" text-anchor="middle">declarative JSON</text>
  <path class="wb-arr"  d="M 456 300 L 494 300" />
  <rect class="wb-box"  x="500" y="264" width="160" height="72" />
  <text class="wb-lab"  x="580" y="294" text-anchor="middle">Client reads</text>
  <text class="wb-sub"  x="580" y="314" text-anchor="middle">validates IDs</text>
  <path class="wb-arr"  d="M 666 300 L 704 300" />
  <rect class="wb-hero" x="710" y="264" width="170" height="72" />
  <text class="wb-inv"  x="795" y="294" text-anchor="middle">Native widgets</text>
  <text class="wb-subi" x="795" y="314" text-anchor="middle">from its catalogue</text>
  <text class="wb-note" x="20"  y="364">Nothing executable crosses the wire, and nothing outside the catalogue can be drawn.</text>

  <rect class="wb-adj"  x="20" y="404" width="860" height="64" />
  <text class="wb-lab"  x="450" y="432" text-anchor="middle">AG-UI — an event stream, not a component model</text>
  <text class="wb-sub"  x="450" y="454" text-anchor="middle">carries either payload above; around sixteen event types over any transport</text>
</svg>
