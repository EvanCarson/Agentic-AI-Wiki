<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ft fd">
  <title id="ft">Where each agent-interface standard leans</title>
  <desc id="fd">A four by four matrix. MCP Apps ships executable markup, is host-independent where the extension is negotiated, is web-only, and needs no frontend of your own. The OpenAI Apps SDK ships executable markup, is tied to one host, is web-only, and needs no frontend of your own. A2UI ships data only, is host-independent, reaches non-web renderers, and constrains you to a catalogue. AG-UI ships no interface at all, is host-independent, is renderer-agnostic, and requires you to build the frontend.</desc>
  <style>
    .fm-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .fm-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .fm-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .fm-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .fm-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .fm-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .fm-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .fm-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .fm-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="fm-ttl" x="20" y="34">What each one actually standardises</text>

  <text class="fm-col" x="295" y="76" text-anchor="middle">Ships runnable UI</text>
  <text class="fm-col" x="465" y="76" text-anchor="middle">Host-independent</text>
  <text class="fm-col" x="635" y="76" text-anchor="middle">Non-web renderers</text>
  <text class="fm-col" x="805" y="76" text-anchor="middle">You build the UI</text>

  <text class="fm-row" x="20" y="118">MCP Apps</text>
  <rect class="fm-strong" x="215" y="92" width="160" height="40" />
  <text class="fm-inv"  x="295" y="117" text-anchor="middle">HTML document</text>
  <rect class="fm-strong" x="385" y="92" width="160" height="40" />
  <text class="fm-inv"  x="465" y="117" text-anchor="middle">If negotiated</text>
  <rect class="fm-weak"   x="555" y="92" width="160" height="40" />
  <text class="fm-cell" x="635" y="117" text-anchor="middle">Web only</text>
  <rect class="fm-weak"   x="725" y="92" width="160" height="40" />
  <text class="fm-cell" x="805" y="117" text-anchor="middle">No</text>

  <text class="fm-row" x="20" y="178">OpenAI Apps SDK</text>
  <rect class="fm-strong" x="215" y="152" width="160" height="40" />
  <text class="fm-inv"  x="295" y="177" text-anchor="middle">HTML document</text>
  <rect class="fm-weak"   x="385" y="152" width="160" height="40" />
  <text class="fm-cell" x="465" y="177" text-anchor="middle">ChatGPT</text>
  <rect class="fm-weak"   x="555" y="152" width="160" height="40" />
  <text class="fm-cell" x="635" y="177" text-anchor="middle">Web only</text>
  <rect class="fm-weak"   x="725" y="152" width="160" height="40" />
  <text class="fm-cell" x="805" y="177" text-anchor="middle">No</text>

  <text class="fm-row" x="20" y="238">A2UI</text>
  <rect class="fm-weak"   x="215" y="212" width="160" height="40" />
  <text class="fm-cell" x="295" y="237" text-anchor="middle">Data only</text>
  <rect class="fm-strong" x="385" y="212" width="160" height="40" />
  <text class="fm-inv"  x="465" y="237" text-anchor="middle">Yes</text>
  <rect class="fm-strong" x="555" y="212" width="160" height="40" />
  <text class="fm-inv"  x="635" y="237" text-anchor="middle">Flutter, SwiftUI</text>
  <rect class="fm-mid"    x="725" y="212" width="160" height="40" />
  <text class="fm-cell" x="805" y="237" text-anchor="middle">Catalogue only</text>

  <text class="fm-row" x="20" y="298">AG-UI</text>
  <rect class="fm-weak"   x="215" y="272" width="160" height="40" />
  <text class="fm-cell" x="295" y="297" text-anchor="middle">Nothing</text>
  <rect class="fm-strong" x="385" y="272" width="160" height="40" />
  <text class="fm-inv"  x="465" y="297" text-anchor="middle">Yes</text>
  <rect class="fm-strong" x="555" y="272" width="160" height="40" />
  <text class="fm-inv"  x="635" y="297" text-anchor="middle">Agnostic</text>
  <rect class="fm-strong" x="725" y="272" width="160" height="40" />
  <text class="fm-inv"  x="805" y="297" text-anchor="middle">All of it</text>

  <rect class="fm-strong" x="20"  y="344" width="18" height="14" />
  <text class="fm-leg" x="48"  y="356">Leans hardest</text>
  <rect class="fm-mid"    x="230" y="344" width="18" height="14" />
  <text class="fm-leg" x="258" y="356">Partly</text>
  <rect class="fm-weak"   x="400" y="344" width="18" height="14" />
  <text class="fm-leg" x="428" y="356">Not at all</text>
</svg>
