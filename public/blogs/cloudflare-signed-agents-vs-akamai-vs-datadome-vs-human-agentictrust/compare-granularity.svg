<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="gr grd">
  <title id="gr">Three rungs of enforcement granularity for a verified agent</title>
  <desc id="grd">A comparison of what each rung of enforcement can express once an agent's identity is verified. Allow or block decides only whether the agent exists on the site. Per path or category can refuse a section of the site but cannot distinguish reading a page from acting on it. Per capability names the action, so an agent can be permitted to browse while being refused checkout, and the permission also governs whether it may read the checkout page at all.</desc>
  <style>
    .gr-hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .gr-adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .gr-box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .gr-ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .gr-hd    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .gr-lab   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .gr-labi  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .gr-sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .gr-subi  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
  </style>

  <text class="gr-ttl" x="20" y="26">Verified tells you who. Only the third rung tells it what it may do.</text>

  <text class="gr-hd" x="160" y="58" text-anchor="middle">Allow or block</text>
  <text class="gr-hd" x="450" y="58" text-anchor="middle">Per path or category</text>
  <text class="gr-hd" x="750" y="58" text-anchor="middle">Per capability</text>

  <rect class="gr-box" x="40" y="74" width="240" height="88" />
  <text class="gr-lab" x="160" y="104" text-anchor="middle">Does it exist here?</text>
  <text class="gr-sub" x="160" y="126" text-anchor="middle">one bit per agent,</text>
  <text class="gr-sub" x="160" y="146" text-anchor="middle">decided before any request</text>

  <rect class="gr-adj" x="330" y="74" width="240" height="88" />
  <text class="gr-lab" x="450" y="104" text-anchor="middle">Which pages?</text>
  <text class="gr-sub" x="450" y="126" text-anchor="middle">a section can be refused;</text>
  <text class="gr-sub" x="450" y="146" text-anchor="middle">reading equals acting</text>

  <rect class="gr-hero" x="630" y="74" width="240" height="88" />
  <text class="gr-labi" x="750" y="104" text-anchor="middle">Which actions?</text>
  <text class="gr-subi" x="750" y="126" text-anchor="middle">browse yes, checkout no,</text>
  <text class="gr-subi" x="750" y="146" text-anchor="middle">per agent, per endpoint</text>

  <rect class="gr-box" x="40" y="188" width="240" height="74" />
  <text class="gr-sub" x="160" y="214" text-anchor="middle">Cannot say: read but</text>
  <text class="gr-sub" x="160" y="236" text-anchor="middle">do not buy</text>

  <rect class="gr-box" x="330" y="188" width="240" height="74" />
  <text class="gr-sub" x="450" y="214" text-anchor="middle">Cannot say: buy here</text>
  <text class="gr-sub" x="450" y="236" text-anchor="middle">but not there</text>

  <rect class="gr-box" x="630" y="188" width="240" height="74" />
  <text class="gr-sub" x="750" y="214" text-anchor="middle">Cannot say: whether a</text>
  <text class="gr-sub" x="750" y="236" text-anchor="middle">human asked for it</text>
</svg>
