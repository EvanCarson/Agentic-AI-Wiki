<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fm fmd">
  <title id="fm">Where each vendor leans hardest on agent traffic</title>
  <desc id="fmd">A four-by-four matrix. All four vendors verify Web Bot Auth signatures, so that column is uniformly strong. They diverge on the other three: Cloudflare and DataDome publish a directory with self-serve listing while HUMAN publishes none that could be found; enforcement granularity runs from four traffic actions at Akamai through Cloudflare's bot categories to per-endpoint rules at DataDome and per-capability permissions at HUMAN; and only Cloudflare monetises agent traffic, through pay per crawl.</desc>
  <style>
    .fm-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .fm-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .fm-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .fm-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .fm-hd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .75; }
    .fm-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .fm-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .fm-celli  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .fm-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="fm-ttl" x="20" y="24">The column everyone has is the column that stopped mattering.</text>

  <text class="fm-hd" x="248" y="50" text-anchor="middle">Signature</text>
  <text class="fm-hd" x="248" y="66" text-anchor="middle">verification</text>
  <text class="fm-hd" x="420" y="50" text-anchor="middle">Directory and</text>
  <text class="fm-hd" x="420" y="66" text-anchor="middle">listing route</text>
  <text class="fm-hd" x="592" y="50" text-anchor="middle">Enforcement</text>
  <text class="fm-hd" x="592" y="66" text-anchor="middle">granularity</text>
  <text class="fm-hd" x="764" y="50" text-anchor="middle">Agent</text>
  <text class="fm-hd" x="764" y="66" text-anchor="middle">monetisation</text>

  <text class="fm-row" x="150" y="112" text-anchor="end">Cloudflare</text>
  <rect class="fm-strong" x="168" y="80" width="160" height="60" />
  <text class="fm-celli" x="248" y="115" text-anchor="middle">Signed agents, 2025</text>
  <rect class="fm-strong" x="340" y="80" width="160" height="60" />
  <text class="fm-celli" x="420" y="115" text-anchor="middle">BotBase + Radar</text>
  <rect class="fm-mid" x="512" y="80" width="160" height="60" />
  <text class="fm-cell" x="592" y="115" text-anchor="middle">Bot category</text>
  <rect class="fm-strong" x="684" y="80" width="160" height="60" />
  <text class="fm-celli" x="764" y="115" text-anchor="middle">Pay per crawl</text>

  <text class="fm-row" x="150" y="184" text-anchor="end">Akamai</text>
  <rect class="fm-strong" x="168" y="152" width="160" height="60" />
  <text class="fm-celli" x="248" y="187" text-anchor="middle">In App &amp; API Protector</text>
  <rect class="fm-mid" x="340" y="152" width="160" height="60" />
  <text class="fm-cell" x="420" y="187" text-anchor="middle">Form, no public list</text>
  <rect class="fm-weak" x="512" y="152" width="160" height="60" />
  <text class="fm-cell" x="592" y="187" text-anchor="middle">Four traffic actions</text>
  <rect class="fm-weak" x="684" y="152" width="160" height="60" />
  <text class="fm-cell" x="764" y="187" text-anchor="middle">None found</text>

  <text class="fm-row" x="150" y="256" text-anchor="end">DataDome</text>
  <rect class="fm-strong" x="168" y="224" width="160" height="60" />
  <text class="fm-celli" x="248" y="259" text-anchor="middle">On by default</text>
  <rect class="fm-strong" x="340" y="224" width="160" height="60" />
  <text class="fm-celli" x="420" y="259" text-anchor="middle">Self-serve portal</text>
  <rect class="fm-strong" x="512" y="224" width="160" height="60" />
  <text class="fm-celli" x="592" y="259" text-anchor="middle">Per endpoint</text>
  <rect class="fm-weak" x="684" y="224" width="160" height="60" />
  <text class="fm-cell" x="764" y="259" text-anchor="middle">None found</text>

  <text class="fm-row" x="150" y="328" text-anchor="end">HUMAN</text>
  <rect class="fm-strong" x="168" y="296" width="160" height="60" />
  <text class="fm-celli" x="248" y="331" text-anchor="middle">Key on each request</text>
  <rect class="fm-weak" x="340" y="296" width="160" height="60" />
  <text class="fm-cell" x="420" y="331" text-anchor="middle">None found</text>
  <rect class="fm-strong" x="512" y="296" width="160" height="60" />
  <text class="fm-celli" x="592" y="331" text-anchor="middle">Per capability</text>
  <rect class="fm-weak" x="684" y="296" width="160" height="60" />
  <text class="fm-cell" x="764" y="331" text-anchor="middle">None found</text>

  <rect class="fm-strong" x="168" y="372" width="18" height="14" />
  <text class="fm-leg" x="196" y="384" text-anchor="start">Strong</text>
  <rect class="fm-mid" x="300" y="372" width="18" height="14" />
  <text class="fm-leg" x="328" y="384" text-anchor="start">Partial</text>
  <rect class="fm-weak" x="432" y="372" width="18" height="14" />
  <text class="fm-leg" x="460" y="384" text-anchor="start">Absent or unverified</text>
</svg>
