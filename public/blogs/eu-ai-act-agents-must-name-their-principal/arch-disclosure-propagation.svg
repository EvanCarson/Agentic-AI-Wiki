<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where the disclosure duty attaches in an agent topology</title>
  <desc id="d">A human principal authorises an orchestrating agent, which calls a partner agent, which eventually reaches a human recipient. The transparency duty attaches at the human recipient, several systems away from the code that started the run. At that boundary two disclosures are required: that the system is an AI, and the person on whose behalf it acts. Intermediate reasoning steps and machine-facing calls carry no marking duty.</desc>
  <style>
    .col-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .col-title-inv { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .75; text-anchor: middle; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .9; text-anchor: middle; }
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .foot { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--muted, #888); text-anchor: middle; }
    .band { font-family: var(--font-mono); font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .box { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .dash { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 5 4; opacity: .55; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="chart-title" x="450" y="32">The duty attaches where a person is — not where your code is</text>

  <rect class="adj" x="30" y="70" width="170" height="95" rx="8" ry="8" />
  <text class="col-title" x="115" y="102">Human principal</text>
  <text class="sub" x="115" y="126">authorises the run</text>
  <text class="sub" x="115" y="145">identity known here</text>

  <rect class="hero" x="250" y="70" width="190" height="95" rx="8" ry="8" />
  <text class="col-title-inv" x="345" y="102">Your agent</text>
  <text class="sub-inv" x="345" y="126">must carry the</text>
  <text class="sub-inv" x="345" y="145">on-behalf-of identity</text>

  <rect class="box" x="490" y="70" width="180" height="95" rx="8" ry="8" />
  <text class="col-title" x="580" y="102">Partner agent</text>
  <text class="sub" x="580" y="126">no protocol field</text>
  <text class="sub" x="580" y="145">carries it today</text>

  <rect class="adj" x="720" y="70" width="150" height="95" rx="8" ry="8" />
  <text class="col-title" x="795" y="102">Human</text>
  <text class="sub" x="795" y="126">duty attaches</text>
  <text class="sub" x="795" y="145">at this boundary</text>

  <path class="arrow" d="M 200 117 L 244 117" />
  <path class="arrow" d="M 440 117 L 484 117" />
  <path class="arrow" d="M 670 117 L 714 117" />

  <path class="dash" d="M 795 165 L 795 210 L 560 210 L 560 246" />
  <path class="dash" d="M 795 210 L 795 246" />

  <text class="band" x="450" y="238">TWO DISCLOSURES REQUIRED AT THE HUMAN BOUNDARY</text>

  <rect class="adj" x="250" y="252" width="290" height="72" rx="8" ry="8" />
  <text class="col-title" x="395" y="282">1 &#183; It is an AI system</text>
  <text class="sub" x="395" y="305">clear at first interaction</text>

  <rect class="hero" x="580" y="252" width="290" height="72" rx="8" ry="8" />
  <text class="col-title-inv" x="725" y="282">2 &#183; Who it acts for</text>
  <text class="sub-inv" x="725" y="305">the delegating person</text>

  <rect class="box" x="250" y="360" width="620" height="72" rx="8" ry="8" />
  <text class="col-title" x="560" y="390">Intermediate reasoning and machine-facing calls</text>
  <text class="sub" x="560" y="413">no marking duty — the line is drawn at what a person can perceive</text>

  <path class="dash" d="M 345 165 L 345 396 L 244 396" />

  <text class="foot" x="450" y="468">The second disclosure is the new engineering: most systems have a service account, not a principal.</text>
</svg>
