<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">What applied on 2 August 2026 and what the Digital Omnibus deferred</title>
  <desc id="d">A timeline with four markers. On 2 August 2026 the Article 50 transparency obligations, the Commission's general-purpose AI enforcement powers, Article 101 fines and complaint rights applied. On 2 December 2026 the machine-readable marking duty reaches systems already on the market. The Annex III high-risk obligations moved to 2 December 2027 and the Annex I product-embedded obligations to 2 August 2028.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .col-title-inv { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .75; text-anchor: middle; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .9; text-anchor: middle; }
    .axis-label { font-family: var(--font-mono); font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .foot { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--muted, #888); text-anchor: middle; }
    .box { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .axis { fill: none; stroke: currentColor; stroke-width: 1.25; }
    .stem { fill: none; stroke: currentColor; stroke-width: 1; opacity: .5; }
    .tick { fill: currentColor; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="chart-title" x="450" y="30">What landed, and what moved</text>

  <rect class="hero" x="40" y="70" width="200" height="130" rx="8" ry="8" />
  <text class="col-title-inv" x="140" y="100">2 Aug 2026</text>
  <text class="sub-inv" x="140" y="126">Article 50 transparency</text>
  <text class="sub-inv" x="140" y="145">GPAI enforcement powers</text>
  <text class="sub-inv" x="140" y="164">Art. 101 GPAI fines</text>
  <text class="sub-inv" x="140" y="183">Complaint rights</text>

  <rect class="adj" x="265" y="95" width="170" height="105" rx="8" ry="8" />
  <text class="col-title" x="350" y="125">2 Dec 2026</text>
  <text class="sub" x="350" y="151">Marking duty for</text>
  <text class="sub" x="350" y="170">systems already shipped</text>

  <rect class="box" x="500" y="70" width="180" height="130" rx="8" ry="8" />
  <text class="col-title" x="590" y="100">2 Dec 2027</text>
  <text class="sub" x="590" y="126">Annex III high-risk</text>
  <text class="sub" x="590" y="145">obligations</text>
  <text class="sub" x="590" y="164">was 2 Aug 2026</text>
  <text class="sub" x="590" y="183">deferred 16 months</text>

  <rect class="box" x="705" y="95" width="170" height="105" rx="8" ry="8" />
  <text class="col-title" x="790" y="125">2 Aug 2028</text>
  <text class="sub" x="790" y="151">Annex I high-risk</text>
  <text class="sub" x="790" y="170">was 2 Aug 2027</text>

  <path class="stem" d="M 140 200 L 140 250" />
  <path class="stem" d="M 350 200 L 350 250" />
  <path class="stem" d="M 590 200 L 590 250" />
  <path class="stem" d="M 790 200 L 790 250" />

  <path class="axis" d="M 40 250 L 878 250" marker-end="url(#arr)" />
  <circle class="tick" cx="140" cy="250" r="4.5" />
  <circle class="tick" cx="350" cy="250" r="4.5" />
  <circle class="tick" cx="590" cy="250" r="4.5" />
  <circle class="tick" cx="790" cy="250" r="4.5" />

  <text class="axis-label" x="140" y="274">APPLIED</text>
  <text class="axis-label" x="350" y="274">TRANSITION ENDS</text>
  <text class="axis-label" x="590" y="274">DEFERRED</text>
  <text class="axis-label" x="790" y="274">DEFERRED</text>

  <text class="foot" x="450" y="330">The transparency half applied on schedule. The conformity-assessment half moved.</text>
  <text class="foot" x="450" y="352">Both deferred dates are fixed calendar dates, not conditional on standards being ready.</text>
</svg>
