<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three places disclosure logic can live</title>
  <desc id="d">Three columns comparing where the disclosure is implemented. In the system prompt it is not testable, the model may omit it, and there is no principal field. Per channel it is testable but must be re-implemented for every new integration. At a single egress layer one test covers every channel, new integrations inherit it, and the principal identity is carried once.</desc>
  <style>
    .col-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .col-title-inv { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .75; text-anchor: middle; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .9; text-anchor: middle; }
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .foot { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--muted, #888); text-anchor: middle; }
    .box { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="30">Where the disclosure logic lives</text>

  <rect class="box" x="30" y="55" width="230" height="165" rx="8" ry="8" />
  <text class="col-title" x="145" y="85">In the system prompt</text>
  <text class="sub" x="145" y="115">Not testable</text>
  <text class="sub" x="145" y="139">Model may omit it</text>
  <text class="sub" x="145" y="163">No principal field</text>
  <text class="sub" x="145" y="187">Fails under injection</text>

  <rect class="adj" x="335" y="55" width="230" height="165" rx="8" ry="8" />
  <text class="col-title" x="450" y="85">Per channel</text>
  <text class="sub" x="450" y="115">Testable per channel</text>
  <text class="sub" x="450" y="139">Breaks on channel four</text>
  <text class="sub" x="450" y="163">Principal re-plumbed</text>
  <text class="sub" x="450" y="187">each integration</text>

  <rect class="hero" x="640" y="55" width="230" height="165" rx="8" ry="8" />
  <text class="col-title-inv" x="755" y="85">One egress layer</text>
  <text class="sub-inv" x="755" y="115">One test covers all</text>
  <text class="sub-inv" x="755" y="139">New channels inherit</text>
  <text class="sub-inv" x="755" y="163">Principal carried once</text>
  <text class="sub-inv" x="755" y="187">Knows the recipient</text>

  <text class="foot" x="450" y="258">Only the right-hand column is still correct after the next integration ships.</text>
</svg>
