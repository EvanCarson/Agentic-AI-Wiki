<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t2 d2">
  <title id="t2">What a holder obtains from a password, an access token, and the token pair</title>
  <desc id="d2">Three columns. A stolen password yields a login attempt that still meets multi-factor authentication. A stolen access token yields roughly one hour of session with no further challenge. A stolen access-plus-refresh pair yields a session renewable for weeks without re-authentication, which is why the pair sets the real lifetime.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--accent, #d4421e); stroke-width: 1.25; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; text-anchor: middle; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; text-anchor: middle; }
    .big    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 20px; fill: var(--ink); text-anchor: middle; }
    .big-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 20px; fill: var(--paper); text-anchor: middle; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .65; letter-spacing: .08em; text-anchor: middle; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="160" y="34">PASSWORD</text>
  <text class="head" x="450" y="34">ACCESS TOKEN</text>
  <text class="head" x="750" y="34">ACCESS + REFRESH PAIR</text>

  <rect class="box" x="40" y="52" width="240" height="96" rx="8" />
  <text class="big" x="160" y="94">0</text>
  <text class="label" x="160" y="120">sessions, if MFA holds</text>
  <path class="arrow" d="M 160 156 L 160 186" />
  <rect class="box" x="40" y="194" width="240" height="78" rx="8" />
  <text class="label" x="160" y="226">Meets a second factor</text>
  <text class="sub" x="160" y="250">the control you already bought</text>

  <rect class="adj" x="330" y="52" width="240" height="96" rx="8" />
  <text class="big" x="450" y="94">~1 hour</text>
  <text class="label" x="450" y="120">until expiry, no challenge</text>
  <path class="arrow" d="M 450 156 L 450 186" />
  <rect class="box" x="330" y="194" width="240" height="78" rx="8" />
  <text class="label" x="450" y="226">Bounded by the TTL</text>
  <text class="sub" x="450" y="250">the design everyone describes</text>

  <rect class="hero" x="620" y="52" width="240" height="96" rx="8" />
  <text class="big-inv" x="740" y="94">27 days</text>
  <text class="label-inv" x="740" y="120">renewable, no re-auth</text>
  <path class="arrow" d="M 740 156 L 740 186" />
  <rect class="adj" x="620" y="194" width="240" height="78" rx="8" />
  <text class="label" x="740" y="226">Bounded by the refresh token</text>
  <text class="sub" x="740" y="250">the design everyone ships</text>
</svg>
