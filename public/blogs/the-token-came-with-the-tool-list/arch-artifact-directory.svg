<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">One agent install directory and what each artifact in it buys</title>
  <desc id="d">A single home-directory folder holds four artifacts: a credentials file, an MCP server configuration, a conversation history database, and project metadata. Each has an arrow to what a holder of that file alone obtains — a renewable provider session, a routed list of internal systems, source code and pasted secrets, and organisational targeting. None of the four requires interacting with the running agent.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--accent, #d4421e); stroke-width: 1.25; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .frame  { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 4 3; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .65; letter-spacing: .08em; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="40" y="34">ONE DIRECTORY, ONE USER, NO PRODUCTION INVENTORY</text>
  <text class="head" x="560" y="34">WHAT THE FILE ALONE BUYS</text>

  <rect class="frame" x="40" y="54" width="340" height="406" rx="10" />
  <text class="mono" x="56" y="78">~/.agent-tool/</text>

  <rect class="hero" x="60" y="92" width="300" height="74" rx="8" />
  <text class="label-inv" x="76" y="122">.credentials.json</text>
  <text class="sub-inv" x="76" y="144">access token + refresh token, mode 0600</text>

  <rect class="adj" x="60" y="182" width="300" height="74" rx="8" />
  <text class="label" x="76" y="212">mcp.json</text>
  <text class="sub" x="76" y="234">endpoints, headers, inline secrets</text>

  <rect class="box" x="60" y="272" width="300" height="74" rx="8" />
  <text class="label" x="76" y="302">history.db</text>
  <text class="sub" x="76" y="324">transcripts, pasted code and secrets</text>

  <rect class="box" x="60" y="362" width="300" height="74" rx="8" />
  <text class="label" x="76" y="392">projects/</text>
  <text class="sub" x="76" y="414">repos, hosts, branches, tickets</text>

  <path class="arrow" d="M 384 129 L 552 129" />
  <path class="arrow" d="M 384 219 L 552 219" />
  <path class="arrow" d="M 384 309 L 552 309" />
  <path class="arrow" d="M 384 399 L 552 399" />

  <rect class="hero" x="560" y="92" width="300" height="74" rx="8" />
  <text class="label-inv" x="576" y="122">Renewable provider session</text>
  <text class="sub-inv" x="576" y="144">27-day refresh, no re-authentication</text>

  <rect class="adj" x="560" y="182" width="300" height="74" rx="8" />
  <text class="label" x="576" y="212">Routed list of internal systems</text>
  <text class="sub" x="576" y="234">curated, current, machine-readable</text>

  <rect class="box" x="560" y="272" width="300" height="74" rx="8" />
  <text class="label" x="576" y="302">Source, secrets, architecture</text>
  <text class="sub" x="576" y="324">cannot be revoked, only expired</text>

  <rect class="box" x="560" y="362" width="300" height="74" rx="8" />
  <text class="label" x="576" y="392">Whose estate this is</text>
  <text class="sub" x="576" y="414">targeting, at no parsing cost</text>
</svg>
