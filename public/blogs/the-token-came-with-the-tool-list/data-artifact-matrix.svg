<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t3 d3">
  <title id="t3">Which agent artifacts can expire, be revoked, be managed, or be detected in misuse</title>
  <desc id="d3">A four-by-four matrix. Rows are the credentials file, the MCP server config, transcript history, and project metadata. Columns ask whether the artifact expires, whether it can be revoked, whether secrets management covers it, and whether misuse is detectable. Only the credentials row is strong on expiry and revocation; the other three rows are weak or medium throughout, meaning three of the four artifacts cannot be recalled once copied.</desc>
  <style>
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .strong { fill: var(--accent, #d4421e); stroke: var(--accent, #d4421e); stroke-width: 1; }
    .cell      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); text-anchor: middle; }
    .cell-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); text-anchor: middle; }
    .rowlab { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .collab { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .65; text-anchor: middle; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .65; letter-spacing: .08em; }
    .leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="head" x="30" y="28">RECALLABILITY OF A COPIED ARTIFACT</text>

  <text class="collab" x="378" y="64">EXPIRES?</text>
  <text class="collab" x="518" y="64">REVOCABLE?</text>
  <text class="collab" x="658" y="64">SECRETS MGMT?</text>
  <text class="collab" x="798" y="64">MISUSE SEEN?</text>

  <text class="rowlab" x="30" y="105">.credentials.json</text>
  <rect class="strong" x="312" y="80" width="132" height="40" rx="5" />
  <text class="cell-inv" x="378" y="105">Strong (27d)</text>
  <rect class="strong" x="452" y="80" width="132" height="40" rx="5" />
  <text class="cell-inv" x="518" y="105">Strong</text>
  <rect class="med" x="592" y="80" width="132" height="40" rx="5" />
  <text class="cell" x="658" y="105">Medium</text>
  <rect class="med" x="732" y="80" width="132" height="40" rx="5" />
  <text class="cell" x="798" y="105">Medium</text>

  <text class="rowlab" x="30" y="165">mcp.json</text>
  <rect class="weak" x="312" y="140" width="132" height="40" rx="5" />
  <text class="cell" x="378" y="165">Weak (never)</text>
  <rect class="weak" x="452" y="140" width="132" height="40" rx="5" />
  <text class="cell" x="518" y="165">Weak</text>
  <rect class="med" x="592" y="140" width="132" height="40" rx="5" />
  <text class="cell" x="658" y="165">Medium</text>
  <rect class="weak" x="732" y="140" width="132" height="40" rx="5" />
  <text class="cell" x="798" y="165">Weak</text>

  <text class="rowlab" x="30" y="225">history.db</text>
  <rect class="med" x="312" y="200" width="132" height="40" rx="5" />
  <text class="cell" x="378" y="225">Medium (policy)</text>
  <rect class="weak" x="452" y="200" width="132" height="40" rx="5" />
  <text class="cell" x="518" y="225">Weak</text>
  <rect class="weak" x="592" y="200" width="132" height="40" rx="5" />
  <text class="cell" x="658" y="225">Weak</text>
  <rect class="weak" x="732" y="200" width="132" height="40" rx="5" />
  <text class="cell" x="798" y="225">Weak</text>

  <text class="rowlab" x="30" y="285">projects/</text>
  <rect class="weak" x="312" y="260" width="132" height="40" rx="5" />
  <text class="cell" x="378" y="285">Weak (never)</text>
  <rect class="weak" x="452" y="260" width="132" height="40" rx="5" />
  <text class="cell" x="518" y="285">Weak</text>
  <rect class="weak" x="592" y="260" width="132" height="40" rx="5" />
  <text class="cell" x="658" y="285">Weak</text>
  <rect class="weak" x="732" y="260" width="132" height="40" rx="5" />
  <text class="cell" x="798" y="285">Weak</text>

  <rect class="weak" x="312" y="336" width="20" height="20" rx="4" />
  <text class="leg" x="340" y="351">Weak</text>
  <rect class="med" x="412" y="336" width="20" height="20" rx="4" />
  <text class="leg" x="440" y="351">Medium</text>
  <rect class="strong" x="524" y="336" width="20" height="20" rx="4" />
  <text class="leg" x="552" y="351">Strong</text>
</svg>
