<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="upt upd">
  <title id="upt">Claude Duet's run path, with the reviewed segment marked</title>
  <desc id="upd">A left-to-right flow. Connected apps feed a clock trigger, which starts an agent run on a hosted virtual machine. The run reads mail, files and the web, then reaches an approval gate that shows the user the action before a send, payment, signature or deletion. The trigger, the reading and the decision to interrupt are all unreviewed; only the final write passes a human.</desc>
  <style>
    .up-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .up-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .up-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .up-edge { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 6 5; rx: 10; ry: 10; opacity: .75; }
    .up-head { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .up-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .up-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .up-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .up-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#upa); }
  </style>
  <defs>
    <marker id="upa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="up-edge" x="545" y="88" width="250" height="400" />
  <text class="up-sub" x="545" y="78">hosted VM with its own browser</text>

  <rect class="up-box" x="30" y="110" width="170" height="80" />
  <text class="up-lbl" x="115" y="142" text-anchor="middle">Connected apps</text>
  <text class="up-sub" x="115" y="164" text-anchor="middle">mail · calendar · chat</text>

  <path class="up-arr" d="M 200 150 L 296 150" />
  <text class="up-sub" x="248" y="140" text-anchor="middle">watched</text>

  <rect class="up-adj" x="300" y="110" width="170" height="80" />
  <text class="up-lbl" x="385" y="142" text-anchor="middle">Clock trigger</text>
  <text class="up-sub" x="385" y="164" text-anchor="middle">every few hours</text>

  <path class="up-arr" d="M 470 150 L 566 150" />
  <text class="up-sub" x="518" y="140" text-anchor="middle">no prompt</text>

  <rect class="up-hero" x="570" y="110" width="200" height="80" />
  <text class="up-inv" x="670" y="142" text-anchor="middle">Agent run</text>
  <text class="up-inv" x="670" y="164" text-anchor="middle">starts by itself</text>

  <path class="up-arr" d="M 670 190 L 670 226" />

  <rect class="up-box" x="570" y="230" width="200" height="60" />
  <text class="up-lbl" x="670" y="256" text-anchor="middle">Reads mail, files,</text>
  <text class="up-lbl" x="670" y="276" text-anchor="middle">and the open web</text>

  <path class="up-arr" d="M 670 290 L 670 326" />
  <text class="up-sub" x="670" y="312" text-anchor="middle">no approval for a read</text>

  <rect class="up-adj" x="570" y="330" width="200" height="60" />
  <text class="up-lbl" x="670" y="356" text-anchor="middle">Approval gate</text>
  <text class="up-sub" x="670" y="378" text-anchor="middle">the only review</text>

  <path class="up-arr" d="M 566 360 L 204 360" />
  <text class="up-sub" x="385" y="350" text-anchor="middle">shows the action, not the cause</text>

  <rect class="up-box" x="30" y="330" width="170" height="60" />
  <text class="up-lbl" x="115" y="366" text-anchor="middle">You</text>

  <path class="up-arr" d="M 670 390 L 670 426" />

  <rect class="up-box" x="570" y="430" width="200" height="50" />
  <text class="up-lbl" x="670" y="460" text-anchor="middle">send · pay · sign · delete</text>
</svg>
