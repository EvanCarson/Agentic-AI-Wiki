<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="wbt wbd">
  <title id="wbt">Who decides what the agent costs you</title>
  <desc id="wbd">Five rows comparing a reactive and a proactive agent on what starts a run, how many runs happen in a day, the cost of a quiet day, the cost under attack, and who controls the volume. In the reactive column the user sets all five. In the proactive column inbound content sets them, so spend becomes a function of how much mail arrives rather than how much work was requested.</desc>
  <style>
    .wb-hot  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .wb-cool { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .wb-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wb-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wb-cell { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .wb-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .wb-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>
  <text class="wb-ttl" x="20" y="28">Who decides what the agent costs you</text>
  <text class="wb-sub" x="300" y="56" text-anchor="middle">reactive agent</text>
  <text class="wb-sub" x="620" y="56" text-anchor="middle">proactive agent</text>

  <text class="wb-row" x="20" y="92">What starts a run</text>
  <rect class="wb-cool" x="190" y="74" width="220" height="26" />
  <text class="wb-cell" x="300" y="92" text-anchor="middle">you did</text>
  <rect class="wb-hot" x="510" y="74" width="220" height="26" />
  <text class="wb-inv" x="620" y="92" text-anchor="middle">arriving content did</text>

  <text class="wb-row" x="20" y="138">Runs per day</text>
  <rect class="wb-cool" x="190" y="120" width="220" height="26" />
  <text class="wb-cell" x="300" y="138" text-anchor="middle">what you asked for</text>
  <rect class="wb-hot" x="510" y="120" width="220" height="26" />
  <text class="wb-inv" x="620" y="138" text-anchor="middle">how much arrived</text>

  <text class="wb-row" x="20" y="184">Cost of a quiet day</text>
  <rect class="wb-cool" x="190" y="166" width="220" height="26" />
  <text class="wb-cell" x="300" y="184" text-anchor="middle">nothing</text>
  <rect class="wb-hot" x="510" y="166" width="220" height="26" />
  <text class="wb-inv" x="620" y="184" text-anchor="middle">the polling floor</text>

  <text class="wb-row" x="20" y="230">Cost under attack</text>
  <rect class="wb-cool" x="190" y="212" width="220" height="26" />
  <text class="wb-cell" x="300" y="230" text-anchor="middle">needs your prompt</text>
  <rect class="wb-hot" x="510" y="212" width="220" height="26" />
  <text class="wb-inv" x="620" y="230" text-anchor="middle">a mail bomb suffices</text>

  <text class="wb-row" x="20" y="276">Who sets the volume</text>
  <rect class="wb-cool" x="190" y="258" width="220" height="26" />
  <text class="wb-cell" x="300" y="276" text-anchor="middle">you</text>
  <rect class="wb-hot" x="510" y="258" width="220" height="26" />
  <text class="wb-inv" x="620" y="276" text-anchor="middle">anyone with your address</text>

  <text class="wb-sub" x="20" y="330">Accent marks the column where the figure is set by someone other than the account holder.</text>
  <text class="wb-sub" x="20" y="356">Duet's background checks draw on the same Pro or Max limits as the user's own work.</text>
</svg>
