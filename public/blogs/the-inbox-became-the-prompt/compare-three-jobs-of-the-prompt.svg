<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="tjt tjd">
  <title id="tjt">The three jobs a user's prompt was doing, and what replaces each one</title>
  <desc id="tjd">Three columns for trigger, scope and authorisation. In a reactive agent all three arrive in the user's own message. In a proactive agent the trigger becomes a clock, the scope becomes whatever the agent found while looking, and the authorisation becomes a standing grant to every connected app. Only the first was deliberately replaced.</desc>
  <style>
    .tj-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .tj-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .tj-head { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .tj-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .tj-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .tj-side { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .tj-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="tj-head" x="280" y="34" text-anchor="middle">Trigger</text>
  <text class="tj-head" x="520" y="34" text-anchor="middle">Scope</text>
  <text class="tj-head" x="760" y="34" text-anchor="middle">Authorisation</text>

  <text class="tj-side" x="20" y="86">reactive</text>
  <rect class="tj-hero" x="180" y="50" width="200" height="60" />
  <text class="tj-inv" x="280" y="76" text-anchor="middle">your message,</text>
  <text class="tj-inv" x="280" y="96" text-anchor="middle">just now</text>
  <rect class="tj-hero" x="420" y="50" width="200" height="60" />
  <text class="tj-inv" x="520" y="76" text-anchor="middle">the thing</text>
  <text class="tj-inv" x="520" y="96" text-anchor="middle">you named</text>
  <rect class="tj-hero" x="660" y="50" width="200" height="60" />
  <text class="tj-inv" x="760" y="76" text-anchor="middle">you asked,</text>
  <text class="tj-inv" x="760" y="96" text-anchor="middle">so you consented</text>

  <text class="tj-side" x="20" y="166">proactive</text>
  <rect class="tj-box" x="180" y="130" width="200" height="60" />
  <text class="tj-lbl" x="280" y="156" text-anchor="middle">a clock, every</text>
  <text class="tj-lbl" x="280" y="176" text-anchor="middle">few hours</text>
  <rect class="tj-box" x="420" y="130" width="200" height="60" />
  <text class="tj-lbl" x="520" y="156" text-anchor="middle">whatever it found</text>
  <text class="tj-lbl" x="520" y="176" text-anchor="middle">while looking</text>
  <rect class="tj-box" x="660" y="130" width="200" height="60" />
  <text class="tj-lbl" x="760" y="156" text-anchor="middle">a standing grant</text>
  <text class="tj-lbl" x="760" y="176" text-anchor="middle">to every app</text>

  <text class="tj-sub" x="450" y="232" text-anchor="middle">Only the first column was deliberately redesigned. The other two changed as a side effect.</text>
  <text class="tj-sub" x="450" y="258" text-anchor="middle">Accent marks what the user supplied; the lower row is what the product supplies instead.</text>
</svg>
