<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Three readings of the same agent on the same 507 tasks</title>
  <desc id="d">Horizontal bar chart with three bars. The strongest model in the Thinkingbox paper solves 65.36 percent of tasks on a single attempt, and only 25.25 percent of tasks on all twenty consecutive attempts. A third bar shows what twenty-in-a-row would be if each attempt failed independently at the same rate: 0.02 percent, roughly one task in five thousand. The observed twenty-in-a-row figure is more than a thousand times higher than the independent prediction, which means failures are strongly correlated per task.</desc>
  <style>
    .grid   { stroke: var(--ink); stroke-width: 1; opacity: .12; stroke-dasharray: 3 4; }
    .axis   { stroke: var(--ink); stroke-width: 1.25; opacity: .5; }
    .barA   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .barB   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .barC   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .title  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .value  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="title" x="24" y="34">Same model, same 507 tasks, three numbers</text>
  <text class="sub" x="24" y="56">Strongest model in Thinkingbox-bench. The third bar is arithmetic, not a measurement.</text>

  <line class="grid" x1="345" y1="76" x2="345" y2="330" />
  <line class="grid" x1="500" y1="76" x2="500" y2="330" />
  <line class="grid" x1="655" y1="76" x2="655" y2="330" />
  <line class="axis" x1="190" y1="76" x2="190" y2="330" />

  <text class="label" x="24" y="118">pass@1</text>
  <text class="tag" x="24" y="136">one attempt</text>
  <rect class="barA" x="190" y="94" width="405" height="46" rx="4" />
  <text class="value" x="609" y="124">65.36%</text>

  <text class="label" x="24" y="208">pass^20</text>
  <text class="tag" x="24" y="226">twenty in a row</text>
  <rect class="barB" x="190" y="184" width="157" height="46" rx="4" />
  <text class="value" x="361" y="214">25.25%</text>

  <text class="label" x="24" y="298">if independent</text>
  <text class="tag" x="24" y="316">0.6536 ^ 20</text>
  <rect class="barC" x="190" y="274" width="4" height="46" rx="2" />
  <text class="value" x="208" y="304">0.02%</text>
  <text class="tag" x="286" y="304">about 1 task in 5,000</text>

  <text class="sub" x="24" y="366">Observed twenty-in-a-row beats the independent prediction by more than a thousandfold.</text>
  <text class="sub" x="24" y="386">Failures are not spread across attempts. They are concentrated in particular tasks.</text>
</svg>
