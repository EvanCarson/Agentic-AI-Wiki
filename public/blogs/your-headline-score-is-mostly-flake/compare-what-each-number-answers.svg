<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What each of the three measurements can and cannot answer</title>
  <desc id="d">Three columns. pass@1 answers whether the agent is capable of the task at all and cannot tell you whether it will do it twice. pass at k answers whether the agent is dependable on that task and cannot tell you why a failure happened. A terminal-state and collateral-effect check answers whether the world ended up correct and cannot be satisfied by a plausible-sounding response. Each column notes the cost of relying on it alone.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .68; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .82; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="tag" x="24" y="34">ONE SUITE, THREE QUESTIONS — RUN ALL THREE</text>

  <rect class="box" x="24" y="54" width="272" height="186" />
  <text class="head" x="44" y="88">pass@1</text>
  <text class="label" x="44" y="116">Is it capable at all?</text>
  <text class="sub" x="44" y="144">Cheapest signal, and the only</text>
  <text class="sub" x="44" y="162">one every leaderboard prints.</text>
  <text class="sub" x="44" y="192">Blind to: whether the same task</text>
  <text class="sub" x="44" y="210">succeeds a second time.</text>

  <rect class="hero" x="314" y="54" width="272" height="186" />
  <text class="head-inv" x="334" y="88">pass^k</text>
  <text class="label-inv" x="334" y="116">Is it dependable?</text>
  <text class="sub-inv" x="334" y="144">k = 5 already separates the</text>
  <text class="sub-inv" x="334" y="162">deterministic tasks from the rest.</text>
  <text class="sub-inv" x="334" y="192">Blind to: why it failed, and</text>
  <text class="sub-inv" x="334" y="210">what it broke on the way.</text>

  <rect class="adj" x="604" y="54" width="272" height="186" />
  <text class="head" x="624" y="88">State + collateral check</text>
  <text class="label" x="624" y="116">Did the world end up right?</text>
  <text class="sub" x="624" y="144">Grades the database the agent</text>
  <text class="sub" x="624" y="162">left behind, not its summary.</text>
  <text class="sub" x="624" y="192">Blind to: nothing you asserted —</text>
  <text class="sub" x="624" y="210">and everything you did not.</text>

  <text class="sub" x="24" y="274">Drop the middle column and a task that works half the time ships as a task that works.</text>
</svg>
