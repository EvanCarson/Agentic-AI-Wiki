<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Splitting a headline score into a deterministic band and a flaky band</title>
  <desc id="d">Diagram. A box on the left holds 507 policy-conditioned tasks. Two arrows split them into two bands. The upper band, about a quarter of the tasks, is solved on all twenty attempts and is the part of the score that survives deployment. The lower band, about three quarters of the tasks, succeeds roughly fifty-four percent of the time per attempt and is some mix of coin-flip tasks and tasks the agent never solves. A third column names the production consequence of each band: the deterministic band can be shipped and monitored, while the flaky band passes review and then fails at a rate nobody measured.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .68; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .colhead { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="colhead" x="24" y="40">THE SUITE</text>
  <text class="colhead" x="304" y="40">WHAT THE TWO NUMBERS IMPLY</text>
  <text class="colhead" x="640" y="40">WHAT IT DOES IN PRODUCTION</text>

  <rect class="hero" x="24" y="200" width="212" height="104" />
  <text class="head-inv" x="44" y="238">507 tasks</text>
  <text class="sub-inv" x="44" y="262">retail, hospitality, auto</text>
  <text class="sub-inv" x="44" y="280">insurance, neobank IT,</text>
  <text class="sub-inv" x="44" y="298">consulting IT and HR</text>

  <path class="arrow" d="M 244 236 C 274 236 274 130 296 130" />
  <path class="arrow" d="M 244 268 C 274 268 274 356 296 356" />

  <rect class="adj" x="304" y="76" width="300" height="118" />
  <text class="head" x="324" y="108">Deterministic band</text>
  <text class="label" x="324" y="134">~25% of tasks, 20 of 20</text>
  <text class="sub" x="324" y="158">This is the pass^20 figure, and it</text>
  <text class="sub" x="324" y="176">is the only part you can promise.</text>

  <rect class="box" x="304" y="302" width="300" height="132" />
  <text class="head" x="324" y="334">Everything else</text>
  <text class="label" x="324" y="360">~75% of tasks, ~54% per attempt</text>
  <text class="sub" x="324" y="384">Solve pass@1 for the remainder and</text>
  <text class="sub" x="324" y="402">you get a coin. Some are flaky, some</text>
  <text class="sub" x="324" y="420">are never solved; one number hides both.</text>

  <path class="arrow" d="M 612 135 L 636 135" />
  <path class="arrow" d="M 612 368 L 636 368" />

  <rect class="adj" x="644" y="76" width="232" height="118" />
  <text class="head" x="662" y="108">Shippable</text>
  <text class="sub" x="662" y="134">Fails visibly when it fails,</text>
  <text class="sub" x="662" y="152">so a fallback and an alert</text>
  <text class="sub" x="662" y="170">are enough to hold it.</text>

  <rect class="box" x="644" y="302" width="232" height="132" />
  <text class="head" x="662" y="334">Passes review, then bites</text>
  <text class="sub" x="662" y="360">Green in the eval that sampled</text>
  <text class="sub" x="662" y="378">it once, red for roughly half</text>
  <text class="sub" x="662" y="396">of real users, irreproducible</text>
  <text class="sub" x="662" y="414">for whoever is on call.</text>

  <text class="sub" x="24" y="466">Two-population reading of pass@1 = 65.36% and pass^20 = 25.25%: assume the always-solved band passes every trial,</text>
  <text class="sub" x="24" y="484">and the remainder falls out as (0.6536 − 0.2525) / (1 − 0.2525) ≈ 0.54 per attempt.</text>
</svg>
