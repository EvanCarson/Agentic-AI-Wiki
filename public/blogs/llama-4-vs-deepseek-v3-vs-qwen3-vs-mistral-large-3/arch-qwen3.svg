<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Qwen3 architecture</title>
  <desc id="d">Qwen3-235B-A22B is an MoE flagship with a hybrid reasoning mode: one set of weights can switch between thinking and non-thinking responses at inference time. The family scales from 0.6B dense to 235B MoE under Apache 2.0, supports 100+ languages, and ships with strong tool-use and agent-shaped post-training.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Inputs (left column) -->
  <rect class="adj" x="40" y="58" width="200" height="60" rx="8" ry="8" />
  <text class="label" x="140" y="82" text-anchor="middle" font-weight="700">Prompt</text>
  <text class="sub" x="140" y="100" text-anchor="middle">100 + languages supported</text>

  <rect class="adj" x="40" y="138" width="200" height="60" rx="8" ry="8" />
  <text class="label" x="140" y="162" text-anchor="middle" font-weight="700">Mode flag</text>
  <text class="sub" x="140" y="180" text-anchor="middle">/think  or  /no_think</text>

  <!-- Hybrid reasoning hero -->
  <rect class="hero" x="280" y="58" width="320" height="140" rx="10" ry="10" />
  <text class="label-inv" x="440" y="88" text-anchor="middle" font-weight="700">Hybrid reasoning weights</text>
  <text class="sub-inv" x="440" y="108" text-anchor="middle">ONE checkpoint, TWO behaviors</text>
  <text class="sub-inv" x="440" y="126" text-anchor="middle">"thinking" — long chains, hidden scratch, then answer</text>
  <text class="sub-inv" x="440" y="144" text-anchor="middle">"non-thinking" — fast, no scratch</text>
  <text class="sub-inv" x="440" y="166" text-anchor="middle">user picks per request</text>
  <text class="sub-inv" x="440" y="184" text-anchor="middle">no need to host two models</text>

  <!-- MoE box -->
  <rect class="box" x="640" y="58" width="220" height="140" rx="8" ry="8" />
  <text class="label" x="750" y="84" text-anchor="middle" font-weight="700">MoE backbone</text>
  <text class="sub" x="750" y="104" text-anchor="middle">235B total · ~22B active</text>
  <text class="sub" x="750" y="120" text-anchor="middle">128 experts, top-8 routing</text>
  <text class="sub" x="750" y="138" text-anchor="middle">also dense variants: 0.6B → 32B</text>
  <text class="sub" x="750" y="156" text-anchor="middle">256K context (extendable to 1M)</text>
  <text class="sub" x="750" y="174" text-anchor="middle">Apache 2.0 across the family</text>

  <!-- Agent-shaped post-training -->
  <rect class="box" x="40" y="228" width="400" height="120" rx="8" ry="8" />
  <text class="label" x="240" y="254" text-anchor="middle" font-weight="700">Agent-shaped post-training</text>
  <text class="sub" x="240" y="274" text-anchor="middle">tool-use SFT + RL on the same weights</text>
  <text class="sub" x="240" y="290" text-anchor="middle">strong on Qwen-Agent / function-calling format</text>
  <text class="sub" x="240" y="310" text-anchor="middle">MCP and OpenAI tool schemas both supported</text>
  <text class="sub" x="240" y="328" text-anchor="middle">code (Qwen3-Coder) + math (Qwen3-Math) siblings</text>

  <!-- Multilingual -->
  <rect class="box" x="460" y="228" width="400" height="120" rx="8" ry="8" />
  <text class="label" x="660" y="254" text-anchor="middle" font-weight="700">Language coverage</text>
  <text class="sub" x="660" y="274" text-anchor="middle">119 languages / dialects in training mix</text>
  <text class="sub" x="660" y="290" text-anchor="middle">strong on CJK + South Asian + low-resource</text>
  <text class="sub" x="660" y="310" text-anchor="middle">non-English agent benchmarks competitive</text>
  <text class="sub" x="660" y="328" text-anchor="middle">leading open-weights option outside English</text>

  <!-- Open ecosystem footer -->
  <rect class="bound" x="40" y="378" width="820" height="96" rx="10" ry="10" />
  <text class="sub" x="450" y="400" text-anchor="middle" font-weight="600">Shipping it in production</text>
  <rect class="box" x="60" y="412" width="200" height="50" rx="6" ry="6" />
  <text class="sub" x="160" y="431" text-anchor="middle" font-weight="600">Apache 2.0</text>
  <text class="sub" x="160" y="448" text-anchor="middle">no MAU clause</text>

  <rect class="box" x="280" y="412" width="200" height="50" rx="6" ry="6" />
  <text class="sub" x="380" y="431" text-anchor="middle" font-weight="600">Hugging Face + ModelScope</text>
  <text class="sub" x="380" y="448" text-anchor="middle">official quantized GGUFs</text>

  <rect class="box" x="500" y="412" width="160" height="50" rx="6" ry="6" />
  <text class="sub" x="580" y="431" text-anchor="middle" font-weight="600">Qwen-Agent SDK</text>
  <text class="sub" x="580" y="448" text-anchor="middle">tools + memory</text>

  <rect class="box" x="680" y="412" width="160" height="50" rx="6" ry="6" />
  <text class="sub" x="760" y="431" text-anchor="middle" font-weight="600">DashScope API</text>
  <text class="sub" x="760" y="448" text-anchor="middle">first-party hosted</text>

  <!-- Arrows -->
  <line class="arrow" x1="240" y1="88" x2="278" y2="100" />
  <line class="arrow" x1="240" y1="168" x2="278" y2="156" />
  <line class="arrow" x1="600" y1="128" x2="638" y2="128" />
  <line class="arrow" x1="440" y1="200" x2="240" y2="226" />
  <line class="arrow" x1="750" y1="200" x2="660" y2="226" />
</svg>
