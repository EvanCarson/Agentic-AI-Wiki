<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">DeepSeek V3 / V3.2 architecture</title>
  <desc id="d">DeepSeek V3.2 is a 685B-parameter MoE that activates ~37B per token. Multi-head Latent Attention compresses the KV cache; DeepSeek Sparse Attention prunes long-context attention; FP8 mixed-precision training and an auxiliary-loss-free routing strategy cut per-token cost. The bet is inference economics at frontier quality.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Top: token stream -->
  <rect class="adj" x="40" y="50" width="820" height="50" rx="8" ry="8" />
  <text class="label" x="450" y="73" text-anchor="middle" font-weight="700">Token stream — 128K context, V3.2 trains for tool-use and long reasoning chains</text>
  <text class="sub" x="450" y="90" text-anchor="middle">thinking / non-thinking modes share one set of weights</text>

  <!-- MLA box -->
  <rect class="box" x="40" y="124" width="260" height="120" rx="8" ry="8" />
  <text class="label" x="170" y="150" text-anchor="middle" font-weight="700">Multi-head Latent Attention</text>
  <text class="sub" x="170" y="170" text-anchor="middle">compresses KV into low-rank latents</text>
  <text class="sub" x="170" y="186" text-anchor="middle">cuts KV cache by ~7×</text>
  <text class="sub" x="170" y="206" text-anchor="middle">keeps attention quality</text>
  <text class="sub" x="170" y="222" text-anchor="middle">long-context throughput goes up</text>

  <!-- DeepSeek Sparse Attention box -->
  <rect class="box" x="320" y="124" width="260" height="120" rx="8" ry="8" />
  <text class="label" x="450" y="150" text-anchor="middle" font-weight="700">DeepSeek Sparse Attention</text>
  <text class="sub" x="450" y="170" text-anchor="middle">learned sparsity pattern</text>
  <text class="sub" x="450" y="186" text-anchor="middle">attends to a subset of past tokens</text>
  <text class="sub" x="450" y="206" text-anchor="middle">reduces long-context compute</text>
  <text class="sub" x="450" y="222" text-anchor="middle">added in V3.2</text>

  <!-- MoE router hero -->
  <rect class="hero" x="600" y="124" width="260" height="120" rx="10" ry="10" />
  <text class="label-inv" x="730" y="150" text-anchor="middle" font-weight="700">Auxiliary-loss-free MoE</text>
  <text class="sub-inv" x="730" y="170" text-anchor="middle">256 routed + 1 shared expert</text>
  <text class="sub-inv" x="730" y="186" text-anchor="middle">~37B active of 685B total</text>
  <text class="sub-inv" x="730" y="206" text-anchor="middle">bias-only load balancing</text>
  <text class="sub-inv" x="730" y="222" text-anchor="middle">no router penalty term</text>

  <!-- Bottom: training and quantization -->
  <rect class="adj" x="40" y="270" width="400" height="100" rx="8" ry="8" />
  <text class="label" x="240" y="294" text-anchor="middle" font-weight="700">FP8 mixed-precision training</text>
  <text class="sub" x="240" y="314" text-anchor="middle">forward and backward pass in FP8</text>
  <text class="sub" x="240" y="330" text-anchor="middle">master weights / optimizer in BF16</text>
  <text class="sub" x="240" y="350" text-anchor="middle">~half the GPU hours of dense peers at this quality</text>

  <rect class="box" x="460" y="270" width="400" height="100" rx="8" ry="8" />
  <text class="label" x="660" y="294" text-anchor="middle" font-weight="700">Serving footprint</text>
  <text class="sub" x="660" y="314" text-anchor="middle">FP8 / INT4 inference supported out of the box</text>
  <text class="sub" x="660" y="330" text-anchor="middle">a single 8×H200 / 8×H100 node serves V3 well</text>
  <text class="sub" x="660" y="350" text-anchor="middle">SGLang, vLLM, TGI, llama.cpp adapters</text>

  <!-- Open ecosystem footer -->
  <rect class="bound" x="40" y="394" width="820" height="80" rx="10" ry="10" />
  <text class="sub" x="450" y="416" text-anchor="middle" font-weight="600">License + ecosystem</text>
  <rect class="box" x="60" y="424" width="260" height="40" rx="6" ry="6" />
  <text class="sub" x="190" y="448" text-anchor="middle" font-weight="600">MIT license — fully open</text>
  <rect class="box" x="340" y="424" width="260" height="40" rx="6" ry="6" />
  <text class="sub" x="470" y="448" text-anchor="middle" font-weight="600">Weights on Hugging Face</text>
  <rect class="box" x="620" y="424" width="220" height="40" rx="6" ry="6" />
  <text class="sub" x="730" y="448" text-anchor="middle" font-weight="600">Tech reports + training code</text>

  <!-- Arrows -->
  <line class="arrow" x1="170" y1="244" x2="170" y2="268" />
  <line class="arrow" x1="450" y1="244" x2="450" y2="268" />
  <line class="arrow" x1="730" y1="244" x2="730" y2="268" />
</svg>
