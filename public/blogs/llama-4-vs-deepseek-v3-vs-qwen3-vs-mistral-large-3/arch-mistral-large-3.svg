<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Mistral Large 3 architecture</title>
  <desc id="d">Mistral Large 3 is a 675B-total / 41B-active MoE released under Apache 2.0 in December 2025. Its bet is permissive-license frontier intelligence: a clean license that a regulated team can ship without legal review, EU-hosted weights, and a model that competes with closed flagships on general benchmarks.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- License hero, top -->
  <rect class="hero" x="40" y="50" width="820" height="80" rx="10" ry="10" />
  <text class="label-inv" x="450" y="80" text-anchor="middle" font-weight="700" font-size="16">Apache 2.0 — the part that decides everything else</text>
  <text class="sub-inv" x="450" y="100" text-anchor="middle">no MAU cap, no field-of-use restrictions, no acceptable-use policy a lawyer has to re-read every quarter</text>
  <text class="sub-inv" x="450" y="118" text-anchor="middle">EU-hosted weights · BYOC deployment story baked in from day one</text>

  <!-- MoE backbone -->
  <rect class="adj" x="40" y="154" width="400" height="120" rx="8" ry="8" />
  <text class="label" x="240" y="180" text-anchor="middle" font-weight="700">Sparse MoE backbone</text>
  <text class="sub" x="240" y="200" text-anchor="middle">675B total · 41B active per token</text>
  <text class="sub" x="240" y="216" text-anchor="middle">first MoE since Mixtral</text>
  <text class="sub" x="240" y="236" text-anchor="middle">trained on NVIDIA H200 cluster</text>
  <text class="sub" x="240" y="252" text-anchor="middle">base + instruct + (upcoming) reasoning variants</text>

  <!-- Multimodal + multilingual -->
  <rect class="box" x="460" y="154" width="400" height="120" rx="8" ry="8" />
  <text class="label" x="660" y="180" text-anchor="middle" font-weight="700">Image understanding + multilingual</text>
  <text class="sub" x="660" y="200" text-anchor="middle">image inputs (vision encoder)</text>
  <text class="sub" x="660" y="216" text-anchor="middle">40 + languages, EU-language depth</text>
  <text class="sub" x="660" y="236" text-anchor="middle">128K context · tool-use first class</text>
  <text class="sub" x="660" y="252" text-anchor="middle">debuted top-2 OSS non-reasoning on LMArena</text>

  <!-- Deployment story -->
  <rect class="box" x="40" y="294" width="400" height="120" rx="8" ry="8" />
  <text class="label" x="240" y="320" text-anchor="middle" font-weight="700">Where you actually run it</text>
  <text class="sub" x="240" y="340" text-anchor="middle">self-host weights on your infrastructure</text>
  <text class="sub" x="240" y="356" text-anchor="middle">Mistral AI Studio (EU-hosted API)</text>
  <text class="sub" x="240" y="372" text-anchor="middle">Azure AI Foundry, AWS Bedrock, GCP Vertex</text>
  <text class="sub" x="240" y="392" text-anchor="middle">vLLM, TGI, Ollama, llama.cpp</text>

  <!-- The bet -->
  <rect class="adj" x="460" y="294" width="400" height="120" rx="8" ry="8" />
  <text class="label" x="660" y="320" text-anchor="middle" font-weight="700">The bet</text>
  <text class="sub" x="660" y="340" text-anchor="middle">frontier-class quality + Apache 2.0</text>
  <text class="sub" x="660" y="356" text-anchor="middle">regulated jurisdictions can ship it as-is</text>
  <text class="sub" x="660" y="372" text-anchor="middle">EU data-residency story is the default, not an add-on</text>
  <text class="sub" x="660" y="392" text-anchor="middle">"permissive open-weights flagship" niche</text>

  <!-- Footer: ecosystem -->
  <rect class="bound" x="40" y="436" width="820" height="48" rx="10" ry="10" />
  <text class="sub" x="450" y="464" text-anchor="middle" font-weight="600">Released December 2, 2025 — currently Mistral's most capable open-weights model</text>

  <!-- Arrows -->
  <line class="arrow" x1="240" y1="130" x2="240" y2="152" />
  <line class="arrow" x1="660" y1="130" x2="660" y2="152" />
  <line class="arrow" x1="240" y1="274" x2="240" y2="292" />
  <line class="arrow" x1="660" y1="274" x2="660" y2="292" />
</svg>
