<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Architecture shape — dense vs MoE, active vs total</title>
  <desc id="d">Four-column comparison of model shape. Llama 4 Maverick: 17B active / 400B total, 128 experts. DeepSeek V3.2: ~37B active / 685B total, 256 experts plus shared. Qwen3-235B-A22B: 22B active / 235B total, 128 experts. Mistral Large 3: 41B active / 675B total, MoE.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">Architecture shape — active vs total parameters</text>

  <!-- Column 1: Llama 4 Maverick — soft (mid total, lowest active) -->
  <rect class="card-soft" x="10" y="44" width="210" height="232" rx="8" />
  <text class="col-head" x="115" y="72">Llama 4 (Maverick)</text>
  <text class="body-text" x="115" y="100">MoE · 128 experts</text>
  <text class="body-text" x="115" y="118">17B active</text>
  <text class="body-text" x="115" y="136">400B total</text>
  <text class="body-text" x="115" y="166">Scout sibling:</text>
  <text class="body-text" x="115" y="184">17B / 109B, 16 experts</text>
  <text class="body-text" x="115" y="214">native multimodal</text>
  <text class="body-text" x="115" y="232">10M context (Scout)</text>
  <text class="body-text" x="115" y="258" font-style="italic" opacity="0.75">smallest active count</text>

  <!-- Column 2: DeepSeek V3.2 — ACCENT (most experts, smartest sparsity) -->
  <rect class="card-accent" x="230" y="44" width="210" height="232" rx="8" />
  <text class="col-head-inv" x="335" y="72">DeepSeek V3.2</text>
  <text class="body-text-inv" x="335" y="100">MoE · 256 routed</text>
  <text class="body-text-inv" x="335" y="118">+ 1 shared expert</text>
  <text class="body-text-inv" x="335" y="136">~37B active</text>
  <text class="body-text-inv" x="335" y="154">685B total</text>
  <text class="body-text-inv" x="335" y="182">MLA + DSA cut KV cache</text>
  <text class="body-text-inv" x="335" y="200">FP8 mixed precision</text>
  <text class="body-text-inv" x="335" y="228">128K context</text>
  <text class="body-text-inv" x="335" y="258" font-style="italic">finest-grained sparsity</text>

  <!-- Column 3: Qwen3 — neutral (smallest total, hybrid reasoning trick) -->
  <rect class="card-neutral" x="450" y="44" width="210" height="232" rx="8" />
  <text class="col-head" x="555" y="72">Qwen3-235B-A22B</text>
  <text class="body-text" x="555" y="100">MoE · 128 experts</text>
  <text class="body-text" x="555" y="118">22B active</text>
  <text class="body-text" x="555" y="136">235B total</text>
  <text class="body-text" x="555" y="166">also dense 0.6B → 32B</text>
  <text class="body-text" x="555" y="184">hybrid /think modes</text>
  <text class="body-text" x="555" y="214">256K context (1M extended)</text>
  <text class="body-text" x="555" y="232">100+ languages</text>
  <text class="body-text" x="555" y="258" font-style="italic" opacity="0.75">tightest active band</text>

  <!-- Column 4: Mistral Large 3 — soft (biggest active count) -->
  <rect class="card-soft" x="670" y="44" width="220" height="232" rx="8" />
  <text class="col-head" x="780" y="72">Mistral Large 3</text>
  <text class="body-text" x="780" y="100">MoE · sparse</text>
  <text class="body-text" x="780" y="118">41B active</text>
  <text class="body-text" x="780" y="136">675B total</text>
  <text class="body-text" x="780" y="166">first MoE since Mixtral</text>
  <text class="body-text" x="780" y="184">image inputs</text>
  <text class="body-text" x="780" y="214">128K context</text>
  <text class="body-text" x="780" y="232">40+ languages</text>
  <text class="body-text" x="780" y="258" font-style="italic" opacity="0.75">largest active count</text>

</svg>
