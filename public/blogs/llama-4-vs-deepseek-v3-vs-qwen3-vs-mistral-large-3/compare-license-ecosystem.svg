<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">License and ecosystem — what you can actually ship and under what terms</title>
  <desc id="d">Llama 4 ships under the Llama Community License, restrictive above 700M MAU and with an acceptable-use policy. DeepSeek V3.2 is MIT — fully permissive. Qwen3 is Apache 2.0 across the family. Mistral Large 3 is Apache 2.0, the largest open-weights MoE under a fully permissive license.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">License + ecosystem — what you can actually ship</text>

  <!-- Column 1: Llama 4 — neutral (custom license, biggest ecosystem) -->
  <rect class="card-neutral" x="10" y="44" width="210" height="232" rx="8" />
  <text class="col-head" x="115" y="72">Llama 4</text>
  <text class="body-text" x="115" y="100">Llama Community License</text>
  <text class="body-text" x="115" y="124">free under 700M MAU</text>
  <text class="body-text" x="115" y="142">acceptable-use policy</text>
  <text class="body-text" x="115" y="160">name-with-derivatives rule</text>
  <text class="body-text" x="115" y="188">biggest ecosystem</text>
  <text class="body-text" x="115" y="206">thousands of fine-tunes</text>
  <text class="body-text" x="115" y="224">every cloud + serving stack</text>
  <text class="body-text" x="115" y="254" font-style="italic" opacity="0.75">deepest ecosystem</text>

  <!-- Column 2: DeepSeek V3.2 — soft (MIT, smaller western ecosystem) -->
  <rect class="card-soft" x="230" y="44" width="210" height="232" rx="8" />
  <text class="col-head" x="335" y="72">DeepSeek V3.2</text>
  <text class="body-text" x="335" y="100">MIT — fully permissive</text>
  <text class="body-text" x="335" y="124">no MAU cap, no AUP</text>
  <text class="body-text" x="335" y="142">no name restrictions</text>
  <text class="body-text" x="335" y="170">geopolitical questions</text>
  <text class="body-text" x="335" y="188">for US regulated buyers</text>
  <text class="body-text" x="335" y="214">SGLang, vLLM, TGI</text>
  <text class="body-text" x="335" y="232">strong CN cloud presence</text>
  <text class="body-text" x="335" y="254" font-style="italic" opacity="0.75">most permissive on paper</text>

  <!-- Column 3: Qwen3 — ACCENT (Apache 2.0, biggest CN + global) -->
  <rect class="card-accent" x="450" y="44" width="210" height="232" rx="8" />
  <text class="col-head-inv" x="555" y="72">Qwen3</text>
  <text class="body-text-inv" x="555" y="100">Apache 2.0 across family</text>
  <text class="body-text-inv" x="555" y="124">no MAU cap</text>
  <text class="body-text-inv" x="555" y="142">no name restrictions</text>
  <text class="body-text-inv" x="555" y="160">commercial-use ready</text>
  <text class="body-text-inv" x="555" y="188">huge non-English coverage</text>
  <text class="body-text-inv" x="555" y="206">Qwen-Agent SDK, MCP</text>
  <text class="body-text-inv" x="555" y="224">ModelScope + Hugging Face</text>
  <text class="body-text-inv" x="555" y="254" font-style="italic">cleanest permissive flagship</text>

  <!-- Column 4: Mistral Large 3 — ACCENT (Apache 2.0 + EU residency) -->
  <rect class="card-accent" x="670" y="44" width="220" height="232" rx="8" />
  <text class="col-head-inv" x="780" y="72">Mistral Large 3</text>
  <text class="body-text-inv" x="780" y="100">Apache 2.0</text>
  <text class="body-text-inv" x="780" y="124">largest permissive MoE</text>
  <text class="body-text-inv" x="780" y="142">at frontier scale</text>
  <text class="body-text-inv" x="780" y="170">EU-hosted weights</text>
  <text class="body-text-inv" x="780" y="188">GDPR / EU AI Act ready</text>
  <text class="body-text-inv" x="780" y="214">Azure, AWS, GCP partners</text>
  <text class="body-text-inv" x="780" y="232">Mistral AI Studio</text>
  <text class="body-text-inv" x="780" y="254" font-style="italic">regulated-jurisdiction pick</text>

</svg>
