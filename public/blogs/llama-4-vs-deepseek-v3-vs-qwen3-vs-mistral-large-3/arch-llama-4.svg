<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Llama 4 architecture</title>
  <desc id="d">Llama 4 is a natively multimodal MoE family. Text and image tokens enter a shared early-fusion transformer; a router activates 17B of 109B (Scout) or 400B (Maverick) parameters per token. The license, weights, and a large ecosystem of fine-tunes and inference engines define the production story.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Input modalities (left) -->
  <rect class="adj" x="30" y="60" width="180" height="60" rx="8" ry="8" />
  <text class="label" x="120" y="85" text-anchor="middle" font-weight="700">Text tokens</text>
  <text class="sub" x="120" y="103" text-anchor="middle">prompt + chat history</text>

  <rect class="adj" x="30" y="140" width="180" height="60" rx="8" ry="8" />
  <text class="label" x="120" y="165" text-anchor="middle" font-weight="700">Image patches</text>
  <text class="sub" x="120" y="183" text-anchor="middle">ViT encoder, patch tokens</text>

  <!-- Early-fusion box -->
  <rect class="box" x="240" y="80" width="180" height="100" rx="8" ry="8" />
  <text class="label" x="330" y="106" text-anchor="middle" font-weight="700">Early-fusion</text>
  <text class="sub" x="330" y="124" text-anchor="middle">text + image into ONE</text>
  <text class="sub" x="330" y="140" text-anchor="middle">stream of tokens</text>
  <text class="sub" x="330" y="160" text-anchor="middle">native multimodality</text>

  <!-- Router (hero) -->
  <rect class="hero" x="460" y="60" width="200" height="140" rx="10" ry="10" />
  <text class="label-inv" x="560" y="92" text-anchor="middle" font-weight="700">MoE router</text>
  <text class="sub-inv" x="560" y="112" text-anchor="middle">picks top-k experts per token</text>
  <text class="sub-inv" x="560" y="128" text-anchor="middle">Scout: 1 of 16</text>
  <text class="sub-inv" x="560" y="146" text-anchor="middle">Maverick: 1 of 128 + shared</text>
  <text class="sub-inv" x="560" y="166" text-anchor="middle">~17B active per token</text>
  <text class="sub-inv" x="560" y="184" text-anchor="middle">109B / 400B total</text>

  <!-- Experts strip -->
  <rect class="box" x="700" y="60" width="160" height="32" rx="6" ry="6" />
  <text class="sub" x="780" y="80" text-anchor="middle" font-weight="600">Expert 1 · FFN</text>
  <rect class="box" x="700" y="100" width="160" height="32" rx="6" ry="6" />
  <text class="sub" x="780" y="120" text-anchor="middle" font-weight="600">Expert 2 · FFN</text>
  <rect class="box" x="700" y="140" width="160" height="32" rx="6" ry="6" />
  <text class="sub" x="780" y="160" text-anchor="middle" font-weight="600">Expert k · FFN (active)</text>
  <rect class="box" x="700" y="180" width="160" height="20" rx="6" ry="6" />
  <text class="sub" x="780" y="195" text-anchor="middle" font-style="italic">… 16 / 128 total</text>

  <!-- Long-context KV (middle, below) -->
  <rect class="adj" x="40" y="240" width="380" height="80" rx="8" ry="8" />
  <text class="label" x="230" y="266" text-anchor="middle" font-weight="700">Long-context attention</text>
  <text class="sub" x="230" y="284" text-anchor="middle">Scout: up to 10M tokens · Maverick: 1M</text>
  <text class="sub" x="230" y="302" text-anchor="middle">iRoPE-style scaling for ultra-long context</text>

  <!-- Output -->
  <rect class="box" x="460" y="240" width="400" height="80" rx="8" ry="8" />
  <text class="label" x="660" y="266" text-anchor="middle" font-weight="700">Text + code output (12 + langs)</text>
  <text class="sub" x="660" y="284" text-anchor="middle">multimodal in, text out</text>
  <text class="sub" x="660" y="302" text-anchor="middle">tool calls, structured outputs, agents</text>

  <!-- Ecosystem strip at bottom -->
  <rect class="bound" x="40" y="350" width="820" height="120" rx="10" ry="10" />
  <text class="sub" x="450" y="372" text-anchor="middle" font-weight="600">Open ecosystem you actually deploy into</text>

  <rect class="box" x="60" y="386" width="180" height="68" rx="8" ry="8" />
  <text class="label" x="150" y="410" text-anchor="middle" font-weight="600">Llama 4 Community License</text>
  <text class="sub" x="150" y="428" text-anchor="middle">free under 700M MAU</text>
  <text class="sub" x="150" y="444" text-anchor="middle">acceptable-use policy</text>

  <rect class="box" x="260" y="386" width="180" height="68" rx="8" ry="8" />
  <text class="label" x="350" y="410" text-anchor="middle" font-weight="600">Weights on Hugging Face</text>
  <text class="sub" x="350" y="428" text-anchor="middle">BF16; int4 fits one H100</text>
  <text class="sub" x="350" y="444" text-anchor="middle">llama.com / hf.co/meta-llama</text>

  <rect class="box" x="460" y="386" width="180" height="68" rx="8" ry="8" />
  <text class="label" x="550" y="410" text-anchor="middle" font-weight="600">Serving stacks</text>
  <text class="sub" x="550" y="428" text-anchor="middle">vLLM, TGI, llama.cpp</text>
  <text class="sub" x="550" y="444" text-anchor="middle">Bedrock, Groq, Together</text>

  <rect class="box" x="660" y="386" width="180" height="68" rx="8" ry="8" />
  <text class="label" x="750" y="410" text-anchor="middle" font-weight="600">Downstream fine-tunes</text>
  <text class="sub" x="750" y="428" text-anchor="middle">LoRA, full SFT, RLHF</text>
  <text class="sub" x="750" y="444" text-anchor="middle">thousands of community ckpts</text>

  <!-- Arrows -->
  <line class="arrow" x1="210" y1="90" x2="238" y2="115" />
  <line class="arrow" x1="210" y1="170" x2="238" y2="145" />
  <line class="arrow" x1="420" y1="130" x2="458" y2="130" />
  <line class="arrow" x1="660" y1="130" x2="698" y2="130" />
  <line class="arrow" x1="560" y1="200" x2="560" y2="238" />
  <line class="arrow" x1="230" y1="320" x2="230" y2="348" />
</svg>
