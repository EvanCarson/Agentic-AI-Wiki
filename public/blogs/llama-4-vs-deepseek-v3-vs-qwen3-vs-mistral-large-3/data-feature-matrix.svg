<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Open-weights flagship feature matrix</title>
  <desc id="d">Heatmap comparing Llama 4, DeepSeek V3.2, Qwen3, and Mistral Large 3 across six axes: native multimodality, inference economics, agentic reasoning depth, language coverage, permissive license, and ecosystem reach. Strength indicated by fill color from light (weak) to dark (strong).</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <text class="chart-title" x="450" y="32" text-anchor="middle">Open-weights flagship feature matrix</text>

  <!--
    Layout:
    - Left margin for row labels: 160px
    - 6 columns of width 123px each
    - Col x centers: 222, 345, 468, 591, 714, 837
    - 4 rows of height 56px starting at y=80
    - Row centers: 108, 164, 220, 276
    - Header text y≈55/68
    - Legend at y≈340
  -->

  <!-- Column headers -->
  <text class="col-head" x="222" y="55">Native</text>
  <text class="col-head" x="222" y="68">multimodal</text>

  <text class="col-head" x="345" y="55">Inference</text>
  <text class="col-head" x="345" y="68">economics</text>

  <text class="col-head" x="468" y="55">Agentic</text>
  <text class="col-head" x="468" y="68">reasoning</text>

  <text class="col-head" x="591" y="55">Language</text>
  <text class="col-head" x="591" y="68">coverage</text>

  <text class="col-head" x="714" y="55">Permissive</text>
  <text class="col-head" x="714" y="68">license</text>

  <text class="col-head" x="837" y="55">Ecosystem</text>
  <text class="col-head" x="837" y="68">reach</text>

  <!-- === Row 1: Llama 4 === -->
  <text class="row-head" x="152" y="108">Llama 4</text>
  <!-- Multimodal: strong (native) -->
  <rect class="cell-strong" x="160" y="80" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="222" y="103">Native</text>
  <text class="cell-text-inv" x="222" y="117">early fusion</text>
  <!-- Inference: medium (10M ctx is wild but KV heavy) -->
  <rect class="cell-medium" x="283" y="80" width="123" height="56" rx="4" />
  <text class="cell-text" x="345" y="108">10M ctx, INT4</text>
  <!-- Agentic reasoning: medium (no native thinking, but tools work) -->
  <rect class="cell-medium" x="406" y="80" width="123" height="56" rx="4" />
  <text class="cell-text" x="468" y="108">No native /think</text>
  <!-- Language: medium (12 official + 200 pretrain) -->
  <rect class="cell-medium" x="529" y="80" width="123" height="56" rx="4" />
  <text class="cell-text" x="591" y="103">12 official,</text>
  <text class="cell-text" x="591" y="117">English-leaning</text>
  <!-- License: weak (custom, 700M MAU + AUP) -->
  <rect class="cell-weak" x="652" y="80" width="123" height="56" rx="4" />
  <text class="cell-text" x="714" y="103">Custom license,</text>
  <text class="cell-text" x="714" y="117">700M MAU cap</text>
  <!-- Ecosystem: strong (biggest of all four) -->
  <rect class="cell-strong" x="775" y="80" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="837" y="103">Biggest;</text>
  <text class="cell-text-inv" x="837" y="117">every cloud + stack</text>

  <!-- === Row 2: DeepSeek V3.2 === -->
  <text class="row-head" x="152" y="164">DeepSeek V3.2</text>
  <!-- Multimodal: weak (text only at V3.2) -->
  <rect class="cell-weak" x="160" y="136" width="123" height="56" rx="4" />
  <text class="cell-text" x="222" y="164">Text only</text>
  <!-- Inference: strong (MLA + DSA + FP8) -->
  <rect class="cell-strong" x="283" y="136" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="345" y="159">MLA + DSA</text>
  <text class="cell-text-inv" x="345" y="173">+ FP8</text>
  <!-- Agentic reasoning: strong (thinking mode, RL-trained) -->
  <rect class="cell-strong" x="406" y="136" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="468" y="159">Thinking +</text>
  <text class="cell-text-inv" x="468" y="173">tool use</text>
  <!-- Language: medium (CN strong, English good) -->
  <rect class="cell-medium" x="529" y="136" width="123" height="56" rx="4" />
  <text class="cell-text" x="591" y="159">EN + ZH</text>
  <text class="cell-text" x="591" y="173">strong</text>
  <!-- License: strong (MIT) -->
  <rect class="cell-strong" x="652" y="136" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="714" y="164">MIT</text>
  <!-- Ecosystem: medium (great inference, smaller western fine-tune scene) -->
  <rect class="cell-medium" x="775" y="136" width="123" height="56" rx="4" />
  <text class="cell-text" x="837" y="159">Strong serving,</text>
  <text class="cell-text" x="837" y="173">growing fine-tunes</text>

  <!-- === Row 3: Qwen3 === -->
  <text class="row-head" x="152" y="220">Qwen3</text>
  <!-- Multimodal: medium (Qwen3-VL sibling, base text-only) -->
  <rect class="cell-medium" x="160" y="192" width="123" height="56" rx="4" />
  <text class="cell-text" x="222" y="215">Qwen3-VL</text>
  <text class="cell-text" x="222" y="229">sibling</text>
  <!-- Inference: strong (hybrid mode, dense + MoE options) -->
  <rect class="cell-strong" x="283" y="192" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="345" y="215">Hybrid /think,</text>
  <text class="cell-text-inv" x="345" y="229">dense siblings</text>
  <!-- Agentic reasoning: strong (RL + thinking, MCP first-class) -->
  <rect class="cell-strong" x="406" y="192" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="468" y="215">Hybrid +</text>
  <text class="cell-text-inv" x="468" y="229">Qwen-Agent</text>
  <!-- Language: strong (100+ languages) -->
  <rect class="cell-strong" x="529" y="192" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="591" y="215">100 + langs,</text>
  <text class="cell-text-inv" x="591" y="229">CJK depth</text>
  <!-- License: strong (Apache 2.0) -->
  <rect class="cell-strong" x="652" y="192" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="714" y="220">Apache 2.0</text>
  <!-- Ecosystem: strong (HF + ModelScope + Qwen-Agent) -->
  <rect class="cell-strong" x="775" y="192" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="837" y="215">HF + ModelScope,</text>
  <text class="cell-text-inv" x="837" y="229">Qwen-Agent SDK</text>

  <!-- === Row 4: Mistral Large 3 === -->
  <text class="row-head" x="152" y="276">Mistral Large 3</text>
  <!-- Multimodal: medium (image inputs) -->
  <rect class="cell-medium" x="160" y="248" width="123" height="56" rx="4" />
  <text class="cell-text" x="222" y="271">Image</text>
  <text class="cell-text" x="222" y="285">inputs</text>
  <!-- Inference: medium (frontier quality, biggest active) -->
  <rect class="cell-medium" x="283" y="248" width="123" height="56" rx="4" />
  <text class="cell-text" x="345" y="271">128K ctx,</text>
  <text class="cell-text" x="345" y="285">priciest active</text>
  <!-- Agentic reasoning: medium (instruct + reasoning sibling soon) -->
  <rect class="cell-medium" x="406" y="248" width="123" height="56" rx="4" />
  <text class="cell-text" x="468" y="271">Tool-use,</text>
  <text class="cell-text" x="468" y="285">reasoning sibling soon</text>
  <!-- Language: strong (40+ langs, EU depth) -->
  <rect class="cell-strong" x="529" y="248" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="591" y="271">40 + langs,</text>
  <text class="cell-text-inv" x="591" y="285">EU depth</text>
  <!-- License: strong (Apache 2.0 at frontier scale) -->
  <rect class="cell-strong" x="652" y="248" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="714" y="271">Apache 2.0,</text>
  <text class="cell-text-inv" x="714" y="285">frontier scale</text>
  <!-- Ecosystem: medium (EU + big clouds, smaller fine-tune count) -->
  <rect class="cell-medium" x="775" y="248" width="123" height="56" rx="4" />
  <text class="cell-text" x="837" y="271">Big clouds,</text>
  <text class="cell-text" x="837" y="285">EU-hosted API</text>

  <!-- Legend -->
  <rect class="legend-box-w" x="250" y="340" width="18" height="18" rx="3" />
  <text class="legend-text" x="275" y="349">Weak</text>

  <rect class="legend-box-m" x="370" y="340" width="18" height="18" rx="3" />
  <text class="legend-text" x="395" y="349">Medium</text>

  <rect class="legend-box-s" x="500" y="340" width="18" height="18" rx="3" />
  <text class="legend-text" x="525" y="349">Strong</text>

</svg>
