<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Inference economics — context, KV cache, FP8 quantization</title>
  <desc id="d">Comparison of the per-token cost story. Llama 4 Scout: 10M context via iRoPE, fits one H100 at INT4. DeepSeek V3.2: MLA + DeepSeek Sparse Attention cut KV cache and long-context compute, FP8-native. Qwen3: 256K context, hybrid mode lets short queries skip thinking. Mistral Large 3: 128K context, EU-hosted serving.</desc>
  <style>
    .chart-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">Inference economics — context, KV cache, FP8</text>

  <!-- Column 1: Llama 4 — soft (10M context is wild but KV bursts) -->
  <rect class="card-soft" x="10" y="44" width="210" height="232" rx="8" />
  <text class="col-head" x="115" y="72">Llama 4</text>
  <text class="body-text" x="115" y="100">Scout: 10M context</text>
  <text class="body-text" x="115" y="118">Maverick: 1M context</text>
  <text class="body-text" x="115" y="146">iRoPE long-context scaling</text>
  <text class="body-text" x="115" y="172">int4 on a single H100</text>
  <text class="body-text" x="115" y="198">large KV at full context</text>
  <text class="body-text" x="115" y="224">vLLM / TGI / Bedrock</text>
  <text class="body-text" x="115" y="254" font-style="italic" opacity="0.75">longest context window</text>

  <!-- Column 2: DeepSeek V3.2 — ACCENT (the inference-economics bet) -->
  <rect class="card-accent" x="230" y="44" width="210" height="232" rx="8" />
  <text class="col-head-inv" x="335" y="72">DeepSeek V3.2</text>
  <text class="body-text-inv" x="335" y="100">128K context</text>
  <text class="body-text-inv" x="335" y="126">MLA compresses KV ~7×</text>
  <text class="body-text-inv" x="335" y="146">DeepSeek Sparse Attention</text>
  <text class="body-text-inv" x="335" y="166">prunes long-context compute</text>
  <text class="body-text-inv" x="335" y="194">FP8 native, INT4 supported</text>
  <text class="body-text-inv" x="335" y="220">~half GPU hours per quality</text>
  <text class="body-text-inv" x="335" y="254" font-style="italic">cheapest per useful token</text>

  <!-- Column 3: Qwen3 — neutral (hybrid mode saves spend on easy queries) -->
  <rect class="card-neutral" x="450" y="44" width="210" height="232" rx="8" />
  <text class="col-head" x="555" y="72">Qwen3</text>
  <text class="body-text" x="555" y="100">256K context</text>
  <text class="body-text" x="555" y="118">extendable to 1M</text>
  <text class="body-text" x="555" y="146">hybrid /think mode</text>
  <text class="body-text" x="555" y="164">non-thinking ≈ chat speed</text>
  <text class="body-text" x="555" y="190">official GGUFs at q4/q8</text>
  <text class="body-text" x="555" y="216">dense siblings for edge</text>
  <text class="body-text" x="555" y="254" font-style="italic" opacity="0.75">spend matches the question</text>

  <!-- Column 4: Mistral Large 3 — soft (frontier quality, EU-hosted) -->
  <rect class="card-soft" x="670" y="44" width="220" height="232" rx="8" />
  <text class="col-head" x="780" y="72">Mistral Large 3</text>
  <text class="body-text" x="780" y="100">128K context</text>
  <text class="body-text" x="780" y="126">41B active is the biggest</text>
  <text class="body-text" x="780" y="144">of the four — strongest</text>
  <text class="body-text" x="780" y="162">single-pass quality</text>
  <text class="body-text" x="780" y="190">FP8 / INT4 community quants</text>
  <text class="body-text" x="780" y="216">EU-hosted API tier</text>
  <text class="body-text" x="780" y="254" font-style="italic" opacity="0.75">priced as a premium tier</text>

</svg>
