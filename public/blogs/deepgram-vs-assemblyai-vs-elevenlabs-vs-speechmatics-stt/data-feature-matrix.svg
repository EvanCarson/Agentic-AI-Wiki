<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Where each speech-to-text provider leans hardest</title>
  <desc id="d">Feature matrix with four provider rows — Deepgram, AssemblyAI, ElevenLabs and Speechmatics — against four columns: native turn detection, multilingual breadth, self-hosted deployment, and post-call audio intelligence. Deepgram is strongest on turn detection, ElevenLabs on multilingual breadth, Speechmatics on self-hosting, and AssemblyAI on audio intelligence.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .medium { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .colhead { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .rowhead { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .legend { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
  </style>

  <text class="chart-title" x="30" y="38">Where each provider leans hardest</text>

  <text class="colhead" x="255" y="66" text-anchor="middle">TURN DETECTION</text>
  <text class="colhead" x="415" y="66" text-anchor="middle">MULTILINGUAL</text>
  <text class="colhead" x="575" y="66" text-anchor="middle">SELF-HOSTED</text>
  <text class="colhead" x="735" y="66" text-anchor="middle">AUDIO INTELLIGENCE</text>

  <text class="rowhead" x="30" y="104">Deepgram</text>
  <rect class="strong" x="180" y="78" width="150" height="40" rx="6" />
  <text class="cell-inv" x="255" y="103" text-anchor="middle">Strong (in-model)</text>
  <rect class="medium" x="340" y="78" width="150" height="40" rx="6" />
  <text class="cell" x="415" y="103" text-anchor="middle">Medium</text>
  <rect class="medium" x="500" y="78" width="150" height="40" rx="6" />
  <text class="cell" x="575" y="103" text-anchor="middle">Medium</text>
  <rect class="medium" x="660" y="78" width="150" height="40" rx="6" />
  <text class="cell" x="735" y="103" text-anchor="middle">Medium</text>

  <text class="rowhead" x="30" y="164">AssemblyAI</text>
  <rect class="medium" x="180" y="138" width="150" height="40" rx="6" />
  <text class="cell" x="255" y="163" text-anchor="middle">Medium (layered)</text>
  <rect class="medium" x="340" y="138" width="150" height="40" rx="6" />
  <text class="cell" x="415" y="163" text-anchor="middle">Medium</text>
  <rect class="weak" x="500" y="138" width="150" height="40" rx="6" />
  <text class="cell" x="575" y="163" text-anchor="middle">Weak</text>
  <rect class="strong" x="660" y="138" width="150" height="40" rx="6" />
  <text class="cell-inv" x="735" y="163" text-anchor="middle">Strong</text>

  <text class="rowhead" x="30" y="224">ElevenLabs</text>
  <rect class="weak" x="180" y="198" width="150" height="40" rx="6" />
  <text class="cell" x="255" y="223" text-anchor="middle">Weak (bring VAD)</text>
  <rect class="strong" x="340" y="198" width="150" height="40" rx="6" />
  <text class="cell-inv" x="415" y="223" text-anchor="middle">Strong (90+)</text>
  <rect class="weak" x="500" y="198" width="150" height="40" rx="6" />
  <text class="cell" x="575" y="223" text-anchor="middle">Weak</text>
  <rect class="weak" x="660" y="198" width="150" height="40" rx="6" />
  <text class="cell" x="735" y="223" text-anchor="middle">Weak</text>

  <text class="rowhead" x="30" y="284">Speechmatics</text>
  <rect class="weak" x="180" y="258" width="150" height="40" rx="6" />
  <text class="cell" x="255" y="283" text-anchor="middle">Weak (you tune)</text>
  <rect class="strong" x="340" y="258" width="150" height="40" rx="6" />
  <text class="cell-inv" x="415" y="283" text-anchor="middle">Strong (55)</text>
  <rect class="strong" x="500" y="258" width="150" height="40" rx="6" />
  <text class="cell-inv" x="575" y="283" text-anchor="middle">Strong (on-prem)</text>
  <rect class="medium" x="660" y="258" width="150" height="40" rx="6" />
  <text class="cell" x="735" y="283" text-anchor="middle">Medium</text>

  <rect class="strong" x="180" y="330" width="18" height="18" rx="4" />
  <text class="legend" x="206" y="344">Strong</text>
  <rect class="medium" x="290" y="330" width="18" height="18" rx="4" />
  <text class="legend" x="316" y="344">Medium</text>
  <rect class="weak" x="400" y="330" width="18" height="18" rx="4" />
  <text class="legend" x="426" y="344">Weak</text>
</svg>
