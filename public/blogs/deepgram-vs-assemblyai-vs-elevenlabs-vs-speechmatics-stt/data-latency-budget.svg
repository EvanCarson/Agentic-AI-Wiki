<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Where one voice-agent turn spends its silence</title>
  <desc id="d">Stacked horizontal bar showing a typical voice-agent turn budget in milliseconds. End-of-turn detection takes roughly 800 milliseconds, transcript finalisation roughly 300, language-model time-to-first-token roughly 400, and text-to-speech time-to-first-byte roughly 150. End-of-turn detection is the largest single slice and the one that varies most between vendors.</desc>
  <style>
    .seg-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .seg-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .seg-mute { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .grid     { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 3 4; }
    .axis     { stroke: var(--ink); stroke-width: 1.25; opacity: .5; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .key      { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .val      { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val-inv  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; fill: var(--paper); }
    .tick     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .55; }
    .note     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .swatch-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .swatch-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .swatch-mute { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
  </style>

  <text class="chart-title" x="30" y="42">One voice turn, user stops talking to first audio back (ms)</text>

  <line class="grid" x1="230" y1="70" x2="230" y2="190" />
  <line class="grid" x1="380" y1="70" x2="380" y2="190" />
  <line class="grid" x1="530" y1="70" x2="530" y2="190" />
  <line class="grid" x1="680" y1="70" x2="680" y2="190" />
  <line class="grid" x1="830" y1="70" x2="830" y2="190" />

  <rect class="seg-hero" x="230" y="96" width="240" height="62" />
  <text class="val-inv" x="350" y="133" text-anchor="middle">800</text>
  <rect class="seg-adj" x="470" y="96" width="90" height="62" />
  <text class="val" x="515" y="133" text-anchor="middle">300</text>
  <rect class="seg-mute" x="560" y="96" width="120" height="62" />
  <text class="val" x="620" y="133" text-anchor="middle">400</text>
  <rect class="seg-mute" x="680" y="96" width="45" height="62" />
  <text class="val" x="702" y="133" text-anchor="middle">150</text>

  <text class="key" x="30" y="133">Typical turn</text>

  <line class="axis" x1="230" y1="190" x2="830" y2="190" />
  <text class="tick" x="230" y="208" text-anchor="middle">0</text>
  <text class="tick" x="380" y="208" text-anchor="middle">500</text>
  <text class="tick" x="530" y="208" text-anchor="middle">1000</text>
  <text class="tick" x="680" y="208" text-anchor="middle">1500</text>
  <text class="tick" x="830" y="208" text-anchor="middle">2000</text>

  <rect class="swatch-hero" x="30" y="250" width="16" height="16" rx="3" />
  <text class="key" x="56" y="263">End-of-turn detection — the vendor decision</text>
  <rect class="swatch-adj" x="30" y="280" width="16" height="16" rx="3" />
  <text class="key" x="56" y="293">Transcript finalisation — where WER tables live</text>
  <rect class="swatch-mute" x="30" y="310" width="16" height="16" rx="3" />
  <text class="key" x="56" y="323">Model time-to-first-token, then speech time-to-first-byte</text>

  <text class="note" x="30" y="366">ILLUSTRATIVE BUDGET FROM VENDOR-PUBLISHED FIGURES</text>
  <text class="note" x="30" y="384">THE FIRST SLICE IS THE ONE THAT MOVES WHEN YOU SWITCH PROVIDER</text>
</svg>
