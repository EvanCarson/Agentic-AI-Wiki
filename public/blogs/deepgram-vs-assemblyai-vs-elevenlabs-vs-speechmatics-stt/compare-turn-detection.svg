<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">How each provider decides the speaker has finished</title>
  <desc id="d">Four columns for Deepgram Flux, AssemblyAI Universal Streaming, ElevenLabs Scribe v2 Realtime and Speechmatics, compared across where turn detection lives, what you tune, and how each one fails. Deepgram folds turn detection into the recogniser, AssemblyAI layers semantic and acoustic endpointing with a silence fallback, ElevenLabs optimises first-partial latency and leaves the turn decision to you, and Speechmatics expects you to tune a silence threshold.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .head  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .cell  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .row   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="row" x="10" y="98">DETECTOR</text>
  <text class="row" x="10" y="168">YOU TUNE</text>
  <text class="row" x="10" y="238">FAILS BY</text>

  <rect class="hero" x="105" y="18" width="180" height="46" rx="8" />
  <text class="head-inv" x="195" y="40" text-anchor="middle">Deepgram</text>
  <text class="head-inv" x="195" y="56" text-anchor="middle">Flux</text>
  <rect class="adj" x="295" y="18" width="180" height="46" rx="8" />
  <text class="head" x="385" y="40" text-anchor="middle">AssemblyAI</text>
  <text class="head" x="385" y="56" text-anchor="middle">Universal Streaming</text>
  <rect class="box" x="485" y="18" width="180" height="46" rx="8" />
  <text class="head" x="575" y="40" text-anchor="middle">ElevenLabs</text>
  <text class="head" x="575" y="56" text-anchor="middle">Scribe v2 Realtime</text>
  <rect class="box" x="675" y="18" width="180" height="46" rx="8" />
  <text class="head" x="765" y="40" text-anchor="middle">Speechmatics</text>
  <text class="head" x="765" y="56" text-anchor="middle">Ursa 2 / Flow</text>

  <rect class="hero" x="105" y="76" width="180" height="54" rx="8" />
  <text class="cell-inv" x="195" y="98" text-anchor="middle">Inside the recogniser.</text>
  <text class="cell-inv" x="195" y="114" text-anchor="middle">Emits turn events.</text>
  <rect class="adj" x="295" y="76" width="180" height="54" rx="8" />
  <text class="cell" x="385" y="98" text-anchor="middle">Semantic + acoustic,</text>
  <text class="cell" x="385" y="114" text-anchor="middle">silence as fallback.</text>
  <rect class="box" x="485" y="76" width="180" height="54" rx="8" />
  <text class="cell" x="575" y="98" text-anchor="middle">Yours. Optimised for</text>
  <text class="cell" x="575" y="114" text-anchor="middle">fast partials instead.</text>
  <rect class="box" x="675" y="76" width="180" height="54" rx="8" />
  <text class="cell" x="765" y="98" text-anchor="middle">A silence threshold</text>
  <text class="cell" x="765" y="114" text-anchor="middle">you set yourself.</text>

  <rect class="adj" x="105" y="146" width="180" height="54" rx="8" />
  <text class="cell" x="195" y="168" text-anchor="middle">Eagerness thresholds</text>
  <text class="cell" x="195" y="184" text-anchor="middle">per use case.</text>
  <rect class="box" x="295" y="146" width="180" height="54" rx="8" />
  <text class="cell" x="385" y="168" text-anchor="middle">Endpointing config</text>
  <text class="cell" x="385" y="184" text-anchor="middle">on the v3 socket.</text>
  <rect class="box" x="485" y="146" width="180" height="54" rx="8" />
  <text class="cell" x="575" y="168" text-anchor="middle">Your own VAD, in</text>
  <text class="cell" x="575" y="184" text-anchor="middle">front of the stream.</text>
  <rect class="box" x="675" y="146" width="180" height="54" rx="8" />
  <text class="cell" x="765" y="168" text-anchor="middle">Silence window;</text>
  <text class="cell" x="765" y="184" text-anchor="middle">1.5s is the start.</text>

  <rect class="box" x="105" y="216" width="180" height="54" rx="8" />
  <text class="cell" x="195" y="238" text-anchor="middle">Cutting in early on</text>
  <text class="cell" x="195" y="254" text-anchor="middle">a thinking pause.</text>
  <rect class="box" x="295" y="216" width="180" height="54" rx="8" />
  <text class="cell" x="385" y="238" text-anchor="middle">Semantics misread on</text>
  <text class="cell" x="385" y="254" text-anchor="middle">accented speech.</text>
  <rect class="box" x="485" y="216" width="180" height="54" rx="8" />
  <text class="cell" x="575" y="238" text-anchor="middle">Whatever your VAD</text>
  <text class="cell" x="575" y="254" text-anchor="middle">gets wrong.</text>
  <rect class="box" x="675" y="216" width="180" height="54" rx="8" />
  <text class="cell" x="765" y="238" text-anchor="middle">Dead air the caller</text>
  <text class="cell" x="765" y="254" text-anchor="middle">hears as a hang-up.</text>

  <text class="row" x="10" y="290">THE LEFTMOST COLUMN IS THE ONLY ONE WHERE TURN-TAKING IS A MODEL OUTPUT RATHER THAN YOUR CONFIG</text>
</svg>
