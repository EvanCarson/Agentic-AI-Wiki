<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="lt ld">
  <title id="lt">Where a sponsorship marker survives</title>
  <desc id="ld">A matrix of six surfaces against three properties: whether a visible label is present, whether a machine-readable mark exists, and whether the marker survives into the next turn. Only the sponsored conversation itself carries a visible label and keeps it in session; no surface carries a machine-readable mark, and a pasted quote, an export, a screenshot, read-aloud audio and another agent reading the session all lose the marker.</desc>
  <style>
    .cell-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .cell-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .cell-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cellt  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cellt-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
  </style>

  <text class="title" x="20" y="30">Where a sponsorship marker survives</text>

  <text class="head" x="402" y="68" text-anchor="middle">Visible label</text>
  <text class="head" x="597" y="68" text-anchor="middle">Machine-readable mark</text>
  <text class="head" x="792" y="68" text-anchor="middle">Survives the next turn</text>

  <text class="row" x="20" y="105">The sponsored chat itself</text>
  <rect class="cell-strong" x="310" y="82" width="185" height="34" />
  <text class="cellt-inv" x="402" y="104" text-anchor="middle">Labelled</text>
  <rect class="cell-weak" x="505" y="82" width="185" height="34" />
  <text class="cellt" x="597" y="104" text-anchor="middle">None</text>
  <rect class="cell-strong" x="700" y="82" width="180" height="34" />
  <text class="cellt-inv" x="790" y="104" text-anchor="middle">In session</text>

  <text class="row" x="20" y="151">Read aloud in voice mode</text>
  <rect class="cell-med" x="310" y="128" width="185" height="34" />
  <text class="cellt" x="402" y="150" text-anchor="middle">Spoken once</text>
  <rect class="cell-weak" x="505" y="128" width="185" height="34" />
  <text class="cellt" x="597" y="150" text-anchor="middle">None</text>
  <rect class="cell-weak" x="700" y="128" width="180" height="34" />
  <text class="cellt" x="790" y="150" text-anchor="middle">No</text>

  <text class="row" x="20" y="197">A screenshot or a share</text>
  <rect class="cell-med" x="310" y="174" width="185" height="34" />
  <text class="cellt" x="402" y="196" text-anchor="middle">If cropped in</text>
  <rect class="cell-weak" x="505" y="174" width="185" height="34" />
  <text class="cellt" x="597" y="196" text-anchor="middle">None</text>
  <rect class="cell-weak" x="700" y="174" width="180" height="34" />
  <text class="cellt" x="790" y="196" text-anchor="middle">No</text>

  <text class="row" x="20" y="243">An export or a transcript</text>
  <rect class="cell-med" x="310" y="220" width="185" height="34" />
  <text class="cellt" x="402" y="242" text-anchor="middle">Format-dependent</text>
  <rect class="cell-weak" x="505" y="220" width="185" height="34" />
  <text class="cellt" x="597" y="242" text-anchor="middle">None</text>
  <rect class="cell-weak" x="700" y="220" width="180" height="34" />
  <text class="cellt" x="790" y="242" text-anchor="middle">No</text>

  <text class="row" x="20" y="289">A claim pasted back into chat</text>
  <rect class="cell-weak" x="310" y="266" width="185" height="34" />
  <text class="cellt" x="402" y="288" text-anchor="middle">None</text>
  <rect class="cell-weak" x="505" y="266" width="185" height="34" />
  <text class="cellt" x="597" y="288" text-anchor="middle">None</text>
  <rect class="cell-weak" x="700" y="266" width="180" height="34" />
  <text class="cellt" x="790" y="288" text-anchor="middle">No</text>

  <text class="row" x="20" y="335">Another agent reading the session</text>
  <rect class="cell-weak" x="310" y="312" width="185" height="34" />
  <text class="cellt" x="402" y="334" text-anchor="middle">Not applicable</text>
  <rect class="cell-weak" x="505" y="312" width="185" height="34" />
  <text class="cellt" x="597" y="334" text-anchor="middle">None</text>
  <rect class="cell-weak" x="700" y="312" width="180" height="34" />
  <text class="cellt" x="790" y="334" text-anchor="middle">No</text>

  <rect class="cell-strong" x="310" y="362" width="16" height="16" />
  <text class="head" x="334" y="375">Present</text>
  <rect class="cell-med" x="404" y="362" width="16" height="16" />
  <text class="head" x="428" y="375">Partial</text>
  <rect class="cell-weak" x="492" y="362" width="16" height="16" />
  <text class="head" x="516" y="375">Absent</text>
</svg>
