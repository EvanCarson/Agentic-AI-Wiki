<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="ct cd">
  <title id="ct">How a Sponsored Agent sits beside the ChatGPT assistant</title>
  <desc id="cd">The assistant conversation runs along the top: the person, the ChatGPT assistant, and its independent answer. Below a dashed boundary runs a second conversation: a labelled ad slot the person taps, an advertiser-operated Sponsored Agent, and a handoff to the advertiser's site. A crossed dotted path shows that the sponsored conversation has no route back into the assistant's answer. A second dotted path shows the route that does exist — a price, a spec or an SKU carried across by the person, with no mark on it.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#carr); }
    .arrow-dot { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 4 4; marker-end: url(#carr); opacity: .7; }
    .divider { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 6 5; opacity: .45; }
    .cross  { fill: none; stroke: var(--accent, #d4421e); stroke-width: 2.25; }
  </style>
  <defs>
    <marker id="carr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="sub" x="20" y="40">One surface, two conversations.</text>

  <rect class="box" x="20" y="98" width="140" height="64" />
  <text class="label" x="90" y="124" text-anchor="middle">You</text>
  <text class="sub" x="90" y="144" text-anchor="middle">asking a question</text>

  <path class="arrow" d="M 162 130 L 196 130" />

  <rect class="hero" x="200" y="86" width="180" height="88" />
  <text class="label-inv" x="290" y="120" text-anchor="middle">ChatGPT assistant</text>
  <text class="sub-inv" x="290" y="140" text-anchor="middle">independent; advertisers</text>
  <text class="sub-inv" x="290" y="156" text-anchor="middle">cannot rank into it</text>

  <path class="arrow" d="M 382 130 L 416 130" />

  <rect class="box" x="420" y="98" width="200" height="64" />
  <text class="label" x="520" y="124" text-anchor="middle">Its own answer</text>
  <text class="sub" x="520" y="144" text-anchor="middle">the organic result</text>

  <path class="arrow" d="M 90 164 L 90 292" />
  <text class="sub" x="104" y="206">an ad appears in the</text>
  <text class="sub" x="104" y="222">surface; you tap it</text>

  <path class="divider" d="M 20 246 L 660 246" />
  <text class="sub" x="660" y="238" text-anchor="end">the boundary OpenAI drew</text>

  <rect class="adj" x="20" y="296" width="140" height="64" />
  <text class="label" x="90" y="322" text-anchor="middle">Ad slot</text>
  <text class="sub" x="90" y="342" text-anchor="middle">labelled sponsored</text>

  <path class="arrow" d="M 162 328 L 196 328" />

  <rect class="adj" x="200" y="284" width="180" height="88" />
  <text class="label" x="290" y="318" text-anchor="middle">Sponsored Agent</text>
  <text class="sub" x="290" y="338" text-anchor="middle">operated by the advertiser,</text>
  <text class="sub" x="290" y="354" text-anchor="middle">in a separate conversation</text>

  <path class="arrow" d="M 382 328 L 416 328" />

  <rect class="box" x="420" y="296" width="200" height="64" />
  <text class="label" x="520" y="322" text-anchor="middle">Advertiser's site</text>
  <text class="sub" x="520" y="342" text-anchor="middle">the intended handoff</text>

  <path class="arrow-dot" d="M 344 280 C 344 214 430 186 466 170" />
  <path class="cross" d="M 350 256 L 372 236" />
  <path class="cross" d="M 350 236 L 372 256" />
  <text class="sub" x="396" y="208">no path back into the answer</text>

  <rect class="box" x="676" y="204" width="204" height="76" />
  <text class="label" x="778" y="232" text-anchor="middle">A price, a spec, an SKU</text>
  <text class="sub" x="778" y="252" text-anchor="middle">carried across by the person,</text>
  <text class="sub" x="778" y="268" text-anchor="middle">with no mark on it</text>

  <path class="arrow-dot" d="M 384 296 C 520 268 600 254 670 246" />
  <path class="arrow-dot" d="M 790 200 C 790 138 700 122 626 130" />
</svg>
