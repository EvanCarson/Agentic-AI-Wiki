<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="wct wcd">
  <title id="wct">What crosses an air gap and what does not</title>
  <desc id="wcd">Three columns. The harness crosses intact, carrying the shell, parallel tool calling, skills and modes. The model does not cross: the models supported inside are open-weight ones rather than the hosted frontier options. External lookups are cut entirely and must be mirrored inside or they become guesses.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .ttl-i { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .sub-i { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .88; }
    .vd    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .65; letter-spacing: .04em; }
    .vd-i  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); opacity: .85; letter-spacing: .04em; }
  </style>

  <rect class="hero" x="40" y="40" width="240" height="190" />
  <text class="vd-i" x="160" y="70" text-anchor="middle">CROSSES INTACT</text>
  <text class="ttl-i" x="160" y="104" text-anchor="middle">The harness</text>
  <text class="sub-i" x="160" y="138" text-anchor="middle">shell, parallel tool calls,</text>
  <text class="sub-i" x="160" y="156" text-anchor="middle">skills, operating modes</text>
  <text class="sub-i" x="160" y="190" text-anchor="middle">this is the feature list</text>
  <text class="sub-i" x="160" y="208" text-anchor="middle">on the product page</text>

  <rect class="adj" x="330" y="40" width="240" height="190" />
  <text class="vd" x="450" y="70" text-anchor="middle">DOES NOT CROSS</text>
  <text class="ttl" x="450" y="104" text-anchor="middle">The model</text>
  <text class="sub" x="450" y="138" text-anchor="middle">inside: open-weight,</text>
  <text class="sub" x="450" y="156" text-anchor="middle">customer-managed</text>
  <text class="sub" x="450" y="190" text-anchor="middle">every prompt and eval</text>
  <text class="sub" x="450" y="208" text-anchor="middle">calibrated elsewhere</text>

  <rect class="box" x="620" y="40" width="240" height="190" />
  <text class="vd" x="740" y="70" text-anchor="middle">CUT ENTIRELY</text>
  <text class="ttl" x="740" y="104" text-anchor="middle">The lookups</text>
  <text class="sub" x="740" y="138" text-anchor="middle">docs, package index,</text>
  <text class="sub" x="740" y="156" text-anchor="middle">tool registry, judge</text>
  <text class="sub" x="740" y="190" text-anchor="middle">mirror them inside,</text>
  <text class="sub" x="740" y="208" text-anchor="middle">or they become guesses</text>

  <text class="sub" x="40" y="266">Only the first column is what a migration checklist usually covers.</text>
  <text class="sub" x="40" y="286">The second and third are where the work is, and both land on the eval suite.</text>
</svg>
