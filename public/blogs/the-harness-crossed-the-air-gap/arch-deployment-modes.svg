<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="dmt dmd">
  <title id="dmt">What changes across three deployment modes of the same agent platform</title>
  <desc id="dmd">Three columns for sovereign cloud, self-hosted and air-gapped deployment. In all three the agent harness box is identical. The model box changes from hosted frontier models to on-premises open-weight models. The external lookup channel is present in the first two columns and severed in the air-gapped column.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .lab-i { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); opacity: .72; }
    .sub-i { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper); opacity: .88; }
    .hd    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); opacity: .7; letter-spacing: .04em; }
    .rowlab{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; letter-spacing: .04em; }
    .cut   { stroke: var(--accent, #d4421e); stroke-width: 2; }
    .bnd   { stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 5 4; fill: none; opacity: .55; }
    .note  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="hd" x="200" y="42" text-anchor="middle">SOVEREIGN CLOUD</text>
  <text class="hd" x="470" y="42" text-anchor="middle">SELF-HOSTED</text>
  <text class="hd" x="740" y="42" text-anchor="middle">AIR-GAPPED</text>

  <text class="rowlab" x="40" y="92">HARNESS</text>
  <rect class="hero" x="110" y="66" width="180" height="62" />
  <text class="lab-i" x="200" y="92" text-anchor="middle">shell, tools, skills</text>
  <text class="sub-i" x="200" y="112" text-anchor="middle">identical</text>
  <rect class="hero" x="380" y="66" width="180" height="62" />
  <text class="lab-i" x="470" y="92" text-anchor="middle">shell, tools, skills</text>
  <text class="sub-i" x="470" y="112" text-anchor="middle">identical</text>
  <rect class="hero" x="650" y="66" width="180" height="62" />
  <text class="lab-i" x="740" y="92" text-anchor="middle">shell, tools, skills</text>
  <text class="sub-i" x="740" y="112" text-anchor="middle">identical</text>

  <text class="rowlab" x="40" y="196">MODEL</text>
  <rect class="adj" x="110" y="170" width="180" height="62" />
  <text class="label" x="200" y="196" text-anchor="middle">hosted frontier</text>
  <text class="sub" x="200" y="216" text-anchor="middle">what you built against</text>
  <rect class="adj" x="380" y="170" width="180" height="62" />
  <text class="label" x="470" y="196" text-anchor="middle">hosted or local</text>
  <text class="sub" x="470" y="216" text-anchor="middle">hybrid is a choice</text>
  <rect class="box" x="650" y="170" width="180" height="62" />
  <text class="label" x="740" y="196" text-anchor="middle">local open-weight</text>
  <text class="sub" x="740" y="216" text-anchor="middle">a different agent</text>

  <text class="rowlab" x="40" y="300">LOOKUPS</text>
  <rect class="box" x="110" y="274" width="180" height="62" />
  <text class="label" x="200" y="300" text-anchor="middle">docs, registries</text>
  <text class="sub" x="200" y="320" text-anchor="middle">work</text>
  <rect class="box" x="380" y="274" width="180" height="62" />
  <text class="label" x="470" y="300" text-anchor="middle">docs, registries</text>
  <text class="sub" x="470" y="320" text-anchor="middle">policy-gated</text>
  <rect class="box" x="650" y="274" width="180" height="62" />
  <text class="label" x="740" y="300" text-anchor="middle">docs, registries</text>
  <text class="sub" x="740" y="320" text-anchor="middle">severed</text>
  <line class="cut" x1="664" y1="332" x2="816" y2="278" />

  <path class="bnd" d="M 630 54 L 630 356 L 850 356 L 850 54 Z" />
  <text class="sub" x="740" y="378" text-anchor="middle">no route out, by design</text>

  <text class="note" x="40" y="430">The only row that is genuinely unchanged is the top one — and it is the row the product page describes.</text>
  <text class="note" x="40" y="454">The middle row decides output quality. The bottom row decides whether a missing lookup fails loudly or becomes a guess.</text>
</svg>
