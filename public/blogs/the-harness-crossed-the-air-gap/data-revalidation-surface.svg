<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="rst rsd">
  <title id="rst">Which assets need re-validation in each deployment mode</title>
  <desc id="rsd">A matrix with five asset rows — prompts and skills, tool schemas, step and timeout budgets, the eval suite, and the cost model — against three deployment modes. Sovereign cloud leaves nearly everything unchanged, self-hosted requires re-checks, and air-gapped requires most assets to be re-earned against a different model.</desc>
  <style>
    .ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; fill: var(--ink); opacity: .7; letter-spacing: .04em; }
    .row  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .weak { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .mid  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .str  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .cl   { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); }
    .cl-i { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper); }
    .lg   { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); opacity: .72; }
  </style>

  <text class="ttl" x="40" y="32">Re-validation surface by deployment mode</text>

  <text class="hd" x="400" y="62" text-anchor="middle">SOVEREIGN CLOUD</text>
  <text class="hd" x="570" y="62" text-anchor="middle">SELF-HOSTED</text>
  <text class="hd" x="740" y="62" text-anchor="middle">AIR-GAPPED</text>

  <text class="row" x="40" y="96">Prompts &amp; skills</text>
  <rect class="weak" x="320" y="78" width="160" height="26" />
  <text class="cl" x="400" y="96" text-anchor="middle">unchanged</text>
  <rect class="mid" x="490" y="78" width="160" height="26" />
  <text class="cl" x="570" y="96" text-anchor="middle">re-check</text>
  <rect class="str" x="660" y="78" width="160" height="26" />
  <text class="cl-i" x="740" y="96" text-anchor="middle">re-earn</text>

  <text class="row" x="40" y="140">Tool schemas</text>
  <rect class="weak" x="320" y="122" width="160" height="26" />
  <text class="cl" x="400" y="140" text-anchor="middle">unchanged</text>
  <rect class="mid" x="490" y="122" width="160" height="26" />
  <text class="cl" x="570" y="140" text-anchor="middle">re-check</text>
  <rect class="mid" x="660" y="122" width="160" height="26" />
  <text class="cl" x="740" y="140" text-anchor="middle">re-check</text>

  <text class="row" x="40" y="184">Step &amp; timeout budgets</text>
  <rect class="weak" x="320" y="166" width="160" height="26" />
  <text class="cl" x="400" y="184" text-anchor="middle">unchanged</text>
  <rect class="mid" x="490" y="166" width="160" height="26" />
  <text class="cl" x="570" y="184" text-anchor="middle">re-check</text>
  <rect class="str" x="660" y="166" width="160" height="26" />
  <text class="cl-i" x="740" y="184" text-anchor="middle">re-size</text>

  <text class="row" x="40" y="228">Eval suite + judge</text>
  <rect class="weak" x="320" y="210" width="160" height="26" />
  <text class="cl" x="400" y="228" text-anchor="middle">unchanged</text>
  <rect class="mid" x="490" y="210" width="160" height="26" />
  <text class="cl" x="570" y="228" text-anchor="middle">re-host judge</text>
  <rect class="str" x="660" y="210" width="160" height="26" />
  <text class="cl-i" x="740" y="228" text-anchor="middle">rebuild inside</text>

  <text class="row" x="40" y="272">Cost model</text>
  <rect class="mid" x="320" y="254" width="160" height="26" />
  <text class="cl" x="400" y="272" text-anchor="middle">per-token</text>
  <rect class="str" x="490" y="254" width="160" height="26" />
  <text class="cl-i" x="570" y="272" text-anchor="middle">capacity, not tokens</text>
  <rect class="str" x="660" y="254" width="160" height="26" />
  <text class="cl-i" x="740" y="272" text-anchor="middle">capacity, not tokens</text>

  <rect class="weak" x="320" y="320" width="18" height="14" />
  <text class="lg" x="346" y="332">unchanged</text>
  <rect class="mid" x="440" y="320" width="18" height="14" />
  <text class="lg" x="466" y="332">needs a re-check</text>
  <rect class="str" x="600" y="320" width="18" height="14" />
  <text class="lg" x="626" y="332">needs rebuilding or re-earning</text>

  <text class="lg" x="40" y="370">Rows two and three are the quiet ones: a different model changes schema tolerance and how many steps a task takes.</text>
</svg>
