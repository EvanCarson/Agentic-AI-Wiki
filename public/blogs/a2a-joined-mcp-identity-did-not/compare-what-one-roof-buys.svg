<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What one foundation buys, and what it does not</title>
  <desc id="d">Three columns. What consolidation buys: trademark and repository continuity, a public change process, and one committee that can notice contradictions between the two specifications. What it does not buy: any change to either trust boundary, a shared delegation primitive, or conformance testing. What would prove it: one identity and delegation primitive normatively referenced by both specifications, plus certification standing behind the member count.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
  </style>

  <rect class="box" x="24" y="36" width="266" height="228" />
  <text class="head" x="44" y="66">What it buys</text>
  <text class="sub" x="44" y="100">trademark and repo continuity</text>
  <text class="sub" x="44" y="124">a public change process</text>
  <text class="sub" x="44" y="148">one committee, two specs</text>
  <line x1="44" y1="176" x2="270" y2="176" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="44" y="200">REAL, AND WORTH HAVING</text>
  <text class="label" x="44" y="228">answers &#8220;who owns this</text>
  <text class="label" x="44" y="248">if the sponsor loses interest&#8221;</text>

  <rect class="adj" x="314" y="36" width="266" height="228" />
  <text class="head" x="334" y="66">What it does not</text>
  <text class="sub" x="334" y="100">no change to either boundary</text>
  <text class="sub" x="334" y="124">no shared delegation primitive</text>
  <text class="sub" x="334" y="148">no conformance testing</text>
  <line x1="334" y1="176" x2="560" y2="176" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="334" y="200">UNCHANGED THIS WEEK</text>
  <text class="label" x="334" y="228">your threat model, and</text>
  <text class="label" x="334" y="248">every deployed agent</text>

  <rect class="hero" x="604" y="36" width="266" height="228" />
  <text class="head-inv" x="624" y="66">What would prove it</text>
  <text class="sub-inv" x="624" y="100">one delegation credential</text>
  <text class="sub-inv" x="624" y="124">referenced by both specs</text>
  <text class="sub-inv" x="624" y="148">certification behind the count</text>
  <line x1="624" y1="176" x2="850" y2="176" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag" x="624" y="200" fill="var(--paper)" opacity=".85">WATCH THIS, NOT MEMBERSHIP</text>
  <text class="label-inv" x="624" y="228">identity work currently sits</text>
  <text class="label-inv" x="624" y="248">across two foundations</text>
</svg>
