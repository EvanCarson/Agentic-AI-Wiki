<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Two discovery surfaces feeding one planner</title>
  <desc id="d">Diagram. An agent planner in the centre receives descriptive text from two directions. On the left, MCP servers the operator deliberately installed supply tool names and descriptions; provenance is an installation decision, so the operator can pin, diff and roll back. On the right, A2A agent cards are fetched at discovery time from URLs the counterparty controls, supplying skill names and descriptions; provenance is a DNS name plus an optional signature that proves origin but not behaviour. Both streams enter the same context window and both influence which action the planner selects.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="box" x="24" y="40" width="270" height="118" />
  <text class="head" x="44" y="70">MCP servers you installed</text>
  <text class="sub" x="44" y="94">tool names and descriptions</text>
  <text class="sub" x="44" y="116">provenance: an install decision</text>
  <text class="tag" x="44" y="142">PINNABLE, DIFFABLE, REVIEWABLE</text>

  <rect class="adj" x="606" y="40" width="270" height="118" />
  <text class="head" x="626" y="70">A2A peers you discovered</text>
  <text class="sub" x="626" y="94">agent card: skills and descriptions</text>
  <text class="sub" x="626" y="116">provenance: a DNS name (+ JWS)</text>
  <text class="tag" x="626" y="142">SIGNATURE PROVES ORIGIN, NOT BEHAVIOUR</text>

  <path class="arrow" d="M 159 158 L 340 216" />
  <path class="arrow" d="M 741 158 L 560 216" />

  <rect class="hero" x="290" y="222" width="320" height="106" />
  <text class="head-inv" x="310" y="252">One context window</text>
  <text class="sub-inv" x="310" y="276">both streams are instruction-shaped</text>
  <text class="sub-inv" x="310" y="298">both steer the next tool call</text>
  <text class="tag" x="310" y="320" fill="var(--paper)" opacity=".85">THE PLANNER CANNOT TELL THEM APART</text>

  <path class="arrow" d="M 450 328 L 450 372" />

  <rect class="box" x="230" y="376" width="440" height="94" />
  <text class="head" x="250" y="406">The composition is the exposure</text>
  <text class="sub" x="250" y="430">a partner agent&#8217;s task result selects your next privileged tool call</text>
  <text class="sub" x="250" y="452">one governing board does not merge two trust boundaries</text>
</svg>
