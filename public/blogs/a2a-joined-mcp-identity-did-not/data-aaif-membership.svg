<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Agentic AI Foundation membership</title>
  <desc id="d">Horizontal bar chart of Agentic AI Foundation membership at three points: 49 members at launch in December 2025, more than 170 by April 2026, and more than 250 by August 2026 when A2A joined. A note records that membership measures commercial interest in the foundation rather than conformance of any implementation.</desc>
  <style>
    .grid   { stroke: var(--ink); stroke-width: 1; opacity: .12; stroke-dasharray: 3 4; }
    .axis   { stroke: var(--ink); stroke-width: 1.25; opacity: .5; }
    .barA   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .barB   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .barC   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .title  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .value  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .tick   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="title" x="24" y="36">Agentic AI Foundation members</text>
  <text class="sub" x="24" y="58">Founded December 2025 with MCP, goose and AGENTS.md.</text>

  <line class="grid" x1="350" y1="86" x2="350" y2="312" />
  <line class="grid" x1="510" y1="86" x2="510" y2="312" />
  <line class="grid" x1="670" y1="86" x2="670" y2="312" />
  <line class="grid" x1="830" y1="86" x2="830" y2="312" />
  <line class="axis" x1="190" y1="86" x2="190" y2="312" />

  <text class="label" x="24" y="138">Dec 2025 — launch</text>
  <rect class="barA" x="190" y="110" width="121" height="46" rx="4" />
  <text class="value" x="325" y="140">49</text>

  <text class="label" x="24" y="218">Apr 2026</text>
  <rect class="barB" x="190" y="190" width="419" height="46" rx="4" />
  <text class="value" x="623" y="220">170+</text>

  <text class="label" x="24" y="298">Aug 2026 — A2A joins</text>
  <rect class="barC" x="190" y="270" width="615" height="46" rx="4" />
  <text class="value" x="819" y="300">250+</text>

  <text class="tick" x="184" y="330">0</text>
  <text class="tick" x="340" y="330">65</text>
  <text class="tick" x="497" y="330">130</text>
  <text class="tick" x="657" y="330">195</text>
  <text class="tick" x="817" y="330">260</text>

  <text class="sub" x="24" y="366">Membership is a commercial commitment. There is no conformance test behind it —</text>
  <text class="sub" x="24" y="386">a certification track is on the foundation&#8217;s own roadmap.</text>
</svg>
