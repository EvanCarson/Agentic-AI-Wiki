<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Where the index sits relative to your primary data</title>
  <desc id="d">Four-column comparison: pgvector lives inside the Postgres that holds your primary rows; Pinecone is an external managed service reached over HTTPS; Weaviate is its own engine with a schema layer that becomes a parallel source of truth; Qdrant is a separate open-source engine you self-host alongside your primary database.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="28">Where the index sits relative to your primary data</text>

  <!-- Column 1: pgvector — ACCENT (inside the primary DB) -->
  <rect class="card-accent" x="10" y="44" width="210" height="220" rx="8" />
  <text class="col-head-inv" x="115" y="72">pgvector</text>
  <text class="body-text-inv" x="115" y="106">Inside Postgres,</text>
  <text class="body-text-inv" x="115" y="124">on the same rows;</text>
  <text class="body-text-inv" x="115" y="142">one transaction</text>

  <!-- Column 2: Pinecone — neutral (external service) -->
  <rect class="card-neutral" x="230" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="335" y="72">Pinecone</text>
  <text class="body-text" x="335" y="106">External managed</text>
  <text class="body-text" x="335" y="124">service over HTTPS;</text>
  <text class="body-text" x="335" y="142">IDs join back</text>

  <!-- Column 3: Weaviate — soft (own schema, parallel source of truth) -->
  <rect class="card-soft" x="450" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="555" y="72">Weaviate</text>
  <text class="body-text" x="555" y="106">Own schema layer;</text>
  <text class="body-text" x="555" y="124">becomes a parallel</text>
  <text class="body-text" x="555" y="142">source of truth</text>

  <!-- Column 4: Qdrant — soft (separate engine alongside) -->
  <rect class="card-soft" x="670" y="44" width="220" height="220" rx="8" />
  <text class="col-head" x="780" y="72">Qdrant</text>
  <text class="body-text" x="780" y="106">Separate engine</text>
  <text class="body-text" x="780" y="124">you self-host</text>
  <text class="body-text" x="780" y="142">alongside primary DB</text>

</svg>
