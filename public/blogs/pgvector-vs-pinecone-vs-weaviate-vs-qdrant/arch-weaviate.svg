<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Weaviate architecture</title>
  <desc id="d">Weaviate is an open-source vector engine that ships a knowledge-graph schema layer on top: classes with typed properties and cross-references, modules that embed and rerank inline, and a GraphQL query API for vector + filter + relationship traversal.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .80; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Weaviate engine (hero) -->
  <rect class="hero" x="30" y="50" width="640" height="400" rx="12" ry="12" />
  <text class="label-inv" x="350" y="80" text-anchor="middle" font-weight="600" font-size="16">Weaviate engine</text>
  <text class="sub-inv" x="350" y="98" text-anchor="middle">open source · self-host or Weaviate Cloud · GraphQL + REST</text>

  <!-- Schema layer (graph) -->
  <rect class="adj" x="60" y="118" width="580" height="146" rx="10" ry="10" />
  <text class="label" x="350" y="142" text-anchor="middle" font-weight="700">Schema — typed classes &amp; cross-references</text>

  <!-- Class A -->
  <rect class="box" x="84" y="160" width="146" height="86" rx="8" ry="8" />
  <text class="label" x="157" y="184" text-anchor="middle" font-weight="600">Article</text>
  <text class="sub" x="157" y="202" text-anchor="middle">title, body</text>
  <text class="sub" x="157" y="216" text-anchor="middle">vector (auto)</text>
  <text class="sub" x="157" y="232" text-anchor="middle">→ Author, → Topic</text>

  <!-- Class B -->
  <rect class="box" x="252" y="160" width="146" height="86" rx="8" ry="8" />
  <text class="label" x="325" y="184" text-anchor="middle" font-weight="600">Author</text>
  <text class="sub" x="325" y="202" text-anchor="middle">name, bio</text>
  <text class="sub" x="325" y="216" text-anchor="middle">vector (auto)</text>
  <text class="sub" x="325" y="232" text-anchor="middle">← Article</text>

  <!-- Class C -->
  <rect class="box" x="420" y="160" width="146" height="86" rx="8" ry="8" />
  <text class="label" x="493" y="184" text-anchor="middle" font-weight="600">Topic</text>
  <text class="sub" x="493" y="202" text-anchor="middle">label</text>
  <text class="sub" x="493" y="216" text-anchor="middle">vector (auto)</text>
  <text class="sub" x="493" y="232" text-anchor="middle">← Article</text>

  <!-- cross-ref arrows -->
  <line class="arrow" x1="230" y1="200" x2="250" y2="200" />
  <line class="arrow" x1="398" y1="200" x2="418" y2="200" />

  <!-- Modules (vectorizer, reranker, generative) -->
  <rect class="box" x="60" y="288" width="280" height="86" rx="8" ry="8" />
  <text class="label" x="200" y="312" text-anchor="middle" font-weight="700">Modules — inline</text>
  <text class="sub" x="200" y="330" text-anchor="middle">text2vec-openai · cohere · transformers</text>
  <text class="sub" x="200" y="346" text-anchor="middle">reranker-cohere · reranker-transformers</text>
  <text class="sub" x="200" y="362" text-anchor="middle">generative-openai (RAG-in-DB)</text>

  <!-- HNSW + filterable scalars -->
  <rect class="box" x="358" y="288" width="282" height="86" rx="8" ry="8" />
  <text class="label" x="499" y="312" text-anchor="middle" font-weight="700">HNSW · scalar filters</text>
  <text class="sub" x="499" y="330" text-anchor="middle">per-class HNSW graph</text>
  <text class="sub" x="499" y="346" text-anchor="middle">inverted indexes on scalars</text>
  <text class="sub" x="499" y="362" text-anchor="middle">BM25 for hybrid search</text>

  <!-- GraphQL query -->
  <rect class="adj" x="60" y="392" width="580" height="42" rx="8" ry="8" />
  <text class="label" x="350" y="416" text-anchor="middle" font-weight="700">GraphQL — Get { Article(nearVector, where) { _additional, author { name } } }</text>

  <!-- Agent side (right) -->
  <rect class="bound" x="700" y="60" width="172" height="380" rx="10" ry="10" />
  <text class="sub" x="786" y="82" text-anchor="middle" font-weight="600">Agent / app</text>

  <rect class="box" x="716" y="104" width="140" height="64" rx="8" ry="8" />
  <text class="label" x="786" y="128" text-anchor="middle" font-weight="600">GraphQL client</text>
  <text class="sub" x="786" y="146" text-anchor="middle">one query gives</text>
  <text class="sub" x="786" y="160" text-anchor="middle">vector + joins</text>

  <rect class="box" x="716" y="186" width="140" height="64" rx="8" ry="8" />
  <text class="label" x="786" y="210" text-anchor="middle" font-weight="600">No embed call</text>
  <text class="sub" x="786" y="228" text-anchor="middle">vectorizer module</text>
  <text class="sub" x="786" y="242" text-anchor="middle">runs server-side</text>

  <rect class="adj" x="716" y="268" width="140" height="64" rx="8" ry="8" />
  <text class="label" x="786" y="292" text-anchor="middle" font-weight="600">Schema = contract</text>
  <text class="sub" x="786" y="310" text-anchor="middle">classes + refs</text>
  <text class="sub" x="786" y="324" text-anchor="middle">harder to evolve</text>

  <rect class="box" x="716" y="350" width="140" height="64" rx="8" ry="8" />
  <text class="label" x="786" y="374" text-anchor="middle" font-weight="600">Multi-tenancy</text>
  <text class="sub" x="786" y="392" text-anchor="middle">tenant per class</text>
  <text class="sub" x="786" y="406" text-anchor="middle">isolated indexes</text>

  <line class="arrow" x1="714" y1="136" x2="642" y2="412" />
</svg>
