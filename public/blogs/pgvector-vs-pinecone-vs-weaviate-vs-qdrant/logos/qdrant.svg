<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Qdrant logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Stylized "Q" suggesting filtered nearest-neighbor: ring + tail + inner point cluster -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="var(--paper)" stroke-width="2" />
  <line x1="20.5" y1="20.5" x2="25" y2="25" stroke="var(--paper)" stroke-width="2.4" stroke-linecap="round" />
  <!-- A few inner "point" dots representing vectors in the index -->
  <circle cx="13" cy="14" r="1.1" fill="var(--paper)" />
  <circle cx="17" cy="13" r="1.1" fill="var(--paper)" />
  <circle cx="14" cy="18" r="1.1" fill="var(--paper)" />
  <circle cx="18.5" cy="17" r="1.1" fill="var(--paper)" />
</svg>
