<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pinecone logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Stylized pinecone: three stacked scale rows tapering downward -->
  <path d="M 16 6 L 22 12 L 16 12 Z" fill="var(--paper)" />
  <path d="M 16 6 L 10 12 L 16 12 Z" fill="var(--paper)" opacity="0.85" />
  <path d="M 11 14 L 21 14 L 19 19 L 13 19 Z" fill="var(--paper)" />
  <path d="M 13 21 L 19 21 L 17 25 L 15 25 Z" fill="var(--paper)" opacity="0.85" />
  <!-- Connecting accent line/stem -->
  <line x1="16" y1="6" x2="16" y2="26" stroke="var(--paper)" stroke-width="0.8" opacity="0.4" />
</svg>
