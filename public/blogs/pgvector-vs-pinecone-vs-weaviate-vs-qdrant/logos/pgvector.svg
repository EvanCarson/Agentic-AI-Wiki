<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="pgvector logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Postgres-style stacked discs (database cylinders) suggesting "inside Postgres" -->
  <ellipse cx="16" cy="10" rx="8" ry="2.6" fill="var(--paper)" />
  <path d="M 8 10 L 8 16 C 8 17.6 11.6 18.8 16 18.8 C 20.4 18.8 24 17.6 24 16 L 24 10" fill="none" stroke="var(--paper)" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 8 16 L 8 22 C 8 23.6 11.6 24.8 16 24.8 C 20.4 24.8 24 23.6 24 22 L 24 16" fill="none" stroke="var(--paper)" stroke-width="1.6" stroke-linecap="round" />
  <!-- Vector arrow inside the lower disc -->
  <path d="M 12 21 L 20 21" stroke="var(--paper)" stroke-width="1.4" stroke-linecap="round" />
  <path d="M 18 19.4 L 20 21 L 18 22.6" fill="none" stroke="var(--paper)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
