<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Weaviate logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Knowledge-graph node + edges: central node, three outer typed nodes -->
  <circle cx="16" cy="16" r="3" fill="var(--paper)" />
  <circle cx="9" cy="9" r="2.2" fill="var(--paper)" opacity="0.85" />
  <circle cx="23" cy="9" r="2.2" fill="var(--paper)" opacity="0.85" />
  <circle cx="16" cy="25" r="2.2" fill="var(--paper)" opacity="0.85" />
  <!-- Edges labelled implicitly -->
  <line x1="14" y1="14" x2="10.5" y2="10.5" stroke="var(--paper)" stroke-width="1.4" stroke-linecap="round" />
  <line x1="18" y1="14" x2="21.5" y2="10.5" stroke="var(--paper)" stroke-width="1.4" stroke-linecap="round" />
  <line x1="16" y1="19" x2="16" y2="23" stroke="var(--paper)" stroke-width="1.4" stroke-linecap="round" />
</svg>
