<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">pgvector architecture</title>
  <desc id="d">pgvector is a Postgres extension: vector columns sit on the same rows as your primary data, ANN indexes (HNSW or IVFFlat) live inside the database, and queries combine SQL filters with vector distance in a single planner pass.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .80; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Postgres host (hero) -->
  <rect class="hero" x="40" y="50" width="560" height="400" rx="12" ry="12" />
  <text class="label-inv" x="320" y="80" text-anchor="middle" font-weight="600" font-size="16">Postgres — your primary database</text>
  <text class="sub-inv" x="320" y="98" text-anchor="middle">pgvector extension · one server, one transaction log</text>

  <!-- The documents table with vector column -->
  <rect class="box" x="70" y="118" width="500" height="118" rx="8" ry="8" />
  <text class="label" x="320" y="142" text-anchor="middle" font-weight="700">documents table</text>
  <text class="sub" x="320" y="160" text-anchor="middle">id · tenant_id · title · body · created_at · embedding vector(1536)</text>

  <!-- Row strip suggesting columns side by side -->
  <rect class="adj" x="92" y="174" width="100" height="48" rx="6" ry="6" />
  <text class="sub" x="142" y="195" text-anchor="middle" font-weight="600">SQL columns</text>
  <text class="sub" x="142" y="211" text-anchor="middle" style="font-size:11px">tenant_id, created_at…</text>

  <rect class="adj" x="202" y="174" width="100" height="48" rx="6" ry="6" />
  <text class="sub" x="252" y="195" text-anchor="middle" font-weight="600">JSONB metadata</text>
  <text class="sub" x="252" y="211" text-anchor="middle" style="font-size:11px">tags, source, lang</text>

  <rect class="adj" x="312" y="174" width="100" height="48" rx="6" ry="6" />
  <text class="sub" x="362" y="195" text-anchor="middle" font-weight="600">FK to rows</text>
  <text class="sub" x="362" y="211" text-anchor="middle">joins still work</text>

  <rect class="box" x="422" y="174" width="138" height="48" rx="6" ry="6" />
  <text class="label" x="491" y="195" text-anchor="middle" font-weight="700" font-size="13">embedding vec(1536)</text>
  <text class="sub" x="491" y="211" text-anchor="middle">same row · same TX</text>

  <!-- ANN index choice -->
  <rect class="box" x="70" y="256" width="240" height="92" rx="8" ry="8" />
  <text class="label" x="190" y="278" text-anchor="middle" font-weight="700">ANN index</text>
  <text class="sub" x="190" y="296" text-anchor="middle">HNSW (in-memory graph)</text>
  <text class="sub" x="190" y="312" text-anchor="middle">or IVFFlat (cluster lists)</text>
  <text class="sub" x="190" y="328" text-anchor="middle">CREATE INDEX … USING hnsw</text>

  <!-- B-tree / GIN indexes -->
  <rect class="box" x="328" y="256" width="240" height="92" rx="8" ry="8" />
  <text class="label" x="448" y="278" text-anchor="middle" font-weight="700">B-tree / GIN indexes</text>
  <text class="sub" x="448" y="296" text-anchor="middle">on scalar + JSONB columns</text>
  <text class="sub" x="448" y="312" text-anchor="middle">planner can intersect with ANN</text>
  <text class="sub" x="448" y="328" text-anchor="middle">filter-first or vector-first</text>

  <!-- Query path -->
  <rect class="box" x="70" y="370" width="498" height="62" rx="8" ry="8" />
  <text class="label" x="319" y="394" text-anchor="middle" font-weight="700">Query path</text>
  <text class="sub" x="319" y="412" text-anchor="middle">SELECT … WHERE tenant_id=? ORDER BY embedding &lt;=&gt; $1 LIMIT k</text>
  <text class="sub" x="319" y="426" text-anchor="middle">one planner, one transaction, joins to other tables</text>

  <!-- Embed -->
  <line class="arrow" x1="320" y1="236" x2="320" y2="254" />
  <line class="arrow" x1="190" y1="348" x2="190" y2="368" />
  <line class="arrow" x1="448" y1="348" x2="448" y2="368" />

  <!-- Agent side (right) -->
  <rect class="bound" x="630" y="60" width="232" height="380" rx="10" ry="10" />
  <text class="sub" x="746" y="82" text-anchor="middle" font-weight="600">Agent / app</text>

  <rect class="box" x="650" y="104" width="194" height="64" rx="8" ry="8" />
  <text class="label" x="747" y="128" text-anchor="middle" font-weight="600">Retrieval tool</text>
  <text class="sub" x="747" y="146" text-anchor="middle">issues plain SQL</text>
  <text class="sub" x="747" y="160" text-anchor="middle">via existing connection pool</text>

  <rect class="box" x="650" y="186" width="194" height="64" rx="8" ry="8" />
  <text class="label" x="747" y="210" text-anchor="middle" font-weight="600">Same DB credentials</text>
  <text class="sub" x="747" y="228" text-anchor="middle">RLS · row-level security</text>
  <text class="sub" x="747" y="242" text-anchor="middle">reuses tenant isolation</text>

  <rect class="adj" x="650" y="268" width="194" height="64" rx="8" ry="8" />
  <text class="label" x="747" y="292" text-anchor="middle" font-weight="600">No sync job</text>
  <text class="sub" x="747" y="310" text-anchor="middle">writes are atomic with rows</text>
  <text class="sub" x="747" y="324" text-anchor="middle">no separate vector pipeline</text>

  <rect class="box" x="650" y="352" width="194" height="64" rx="8" ry="8" />
  <text class="label" x="747" y="376" text-anchor="middle" font-weight="600">Operate as Postgres</text>
  <text class="sub" x="747" y="394" text-anchor="middle">backups, replicas, monitoring</text>
  <text class="sub" x="747" y="408" text-anchor="middle">whatever you already run</text>

  <!-- Connect agent → DB -->
  <line class="arrow" x1="648" y1="136" x2="602" y2="160" />
</svg>
