<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Filtered ANN behavior at scale</title>
  <desc id="d">Four-column comparison of filtered ANN: pgvector relies on the Postgres planner to combine B-tree filters with HNSW; Pinecone applies metadata filters during traversal at managed scale; Weaviate uses inverted indexes alongside HNSW per class; Qdrant ships filter-aware HNSW that keeps recall high under heavy filters, the strongest in this dimension.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="28">Filtered ANN behavior at scale</text>

  <!-- Column 1: pgvector — neutral (planner-driven, OK at modest scale) -->
  <rect class="card-neutral" x="10" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="115" y="72">pgvector</text>
  <text class="body-text" x="115" y="106">Postgres planner</text>
  <text class="body-text" x="115" y="124">picks B-tree first</text>
  <text class="body-text" x="115" y="142">or HNSW first;</text>
  <text class="body-text" x="115" y="160">careful at high cardinality</text>

  <!-- Column 2: Pinecone — soft -->
  <rect class="card-soft" x="230" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="335" y="72">Pinecone</text>
  <text class="body-text" x="335" y="106">Metadata filter</text>
  <text class="body-text" x="335" y="124">during traversal;</text>
  <text class="body-text" x="335" y="142">managed at scale,</text>
  <text class="body-text" x="335" y="160">hidden internals</text>

  <!-- Column 3: Weaviate — soft -->
  <rect class="card-soft" x="450" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="555" y="72">Weaviate</text>
  <text class="body-text" x="555" y="106">Inverted indexes</text>
  <text class="body-text" x="555" y="124">alongside HNSW;</text>
  <text class="body-text" x="555" y="142">per-class graphs;</text>
  <text class="body-text" x="555" y="160">flat-search escape hatch</text>

  <!-- Column 4: Qdrant — ACCENT (filter-aware HNSW is the design point) -->
  <rect class="card-accent" x="670" y="44" width="220" height="220" rx="8" />
  <text class="col-head-inv" x="780" y="72">Qdrant</text>
  <text class="body-text-inv" x="780" y="106">Filter-aware HNSW —</text>
  <text class="body-text-inv" x="780" y="124">graph respects filters;</text>
  <text class="body-text-inv" x="780" y="142">no two-stage post-filter,</text>
  <text class="body-text-inv" x="780" y="160">recall holds under heavy filters</text>

</svg>
