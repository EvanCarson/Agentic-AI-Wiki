<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Vector store feature matrix</title>
  <desc id="d">Heatmap comparing pgvector, Pinecone, Weaviate, and Qdrant across six axes: Co-located with primary data, Filtered ANN at scale, Hybrid search, Schema / graph model, Self-hostable, and Managed option. Strength indicated by fill color from light (weak) to dark orange-red (strong).</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="32" text-anchor="middle">Vector store feature matrix</text>

  <!--
    Layout:
    - Left margin for row labels: 160px
    - 6 columns of width 123px each ≈ 738px total
    - Col x centers: 222, 345, 468, 591, 714, 837
    - 4 rows of height 56px starting at y=80
    - Row centers: 108, 164, 220, 276
    - Header text y≈55/68
    - Legend at y≈340
  -->

  <!-- Column headers -->
  <text class="col-head" x="222" y="55">Co-located</text>
  <text class="col-head" x="222" y="68">with data</text>

  <text class="col-head" x="345" y="55">Filtered ANN</text>
  <text class="col-head" x="345" y="68">at scale</text>

  <text class="col-head" x="468" y="55">Hybrid</text>
  <text class="col-head" x="468" y="68">search</text>

  <text class="col-head" x="591" y="55">Schema /</text>
  <text class="col-head" x="591" y="68">graph model</text>

  <text class="col-head" x="714" y="55">Self-</text>
  <text class="col-head" x="714" y="68">hostable</text>

  <text class="col-head" x="837" y="55">Managed</text>
  <text class="col-head" x="837" y="68">option</text>

  <!-- === Row 1: pgvector === -->
  <text class="row-head" x="152" y="108">pgvector</text>
  <!-- Co-located: strong -->
  <rect class="cell-strong" x="160" y="80" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="222" y="108">Native (in DB)</text>
  <!-- Filtered ANN at scale: medium -->
  <rect class="cell-medium" x="283" y="80" width="123" height="56" rx="4" />
  <text class="cell-text" x="345" y="108">Planner-driven</text>
  <!-- Hybrid: medium -->
  <rect class="cell-medium" x="406" y="80" width="123" height="56" rx="4" />
  <text class="cell-text" x="468" y="108">tsvector + vec</text>
  <!-- Schema/graph: weak (it's relational) -->
  <rect class="cell-weak" x="529" y="80" width="123" height="56" rx="4" />
  <text class="cell-text" x="591" y="108">Relational</text>
  <!-- Self-hostable: strong -->
  <rect class="cell-strong" x="652" y="80" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="714" y="108">Yes</text>
  <!-- Managed: strong (every cloud Postgres) -->
  <rect class="cell-strong" x="775" y="80" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="837" y="103">RDS / Neon /</text>
  <text class="cell-text-inv" x="837" y="117">Supabase</text>

  <!-- === Row 2: Pinecone === -->
  <text class="row-head" x="152" y="164">Pinecone</text>
  <!-- Co-located: weak -->
  <rect class="cell-weak" x="160" y="136" width="123" height="56" rx="4" />
  <text class="cell-text" x="222" y="164">External only</text>
  <!-- Filtered ANN: medium -->
  <rect class="cell-medium" x="283" y="136" width="123" height="56" rx="4" />
  <text class="cell-text" x="345" y="159">Metadata</text>
  <text class="cell-text" x="345" y="173">filter</text>
  <!-- Hybrid: medium -->
  <rect class="cell-medium" x="406" y="136" width="123" height="56" rx="4" />
  <text class="cell-text" x="468" y="159">Sparse-dense</text>
  <text class="cell-text" x="468" y="173">vectors</text>
  <!-- Schema: weak (namespaces) -->
  <rect class="cell-weak" x="529" y="136" width="123" height="56" rx="4" />
  <text class="cell-text" x="591" y="164">Namespaces</text>
  <!-- Self-hostable: weak (managed only) -->
  <rect class="cell-weak" x="652" y="136" width="123" height="56" rx="4" />
  <text class="cell-text" x="714" y="164">No</text>
  <!-- Managed: strong (managed-only is the whole product) -->
  <rect class="cell-strong" x="775" y="136" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="837" y="159">Managed-only</text>
  <text class="cell-text-inv" x="837" y="173">(serverless)</text>

  <!-- === Row 3: Weaviate === -->
  <text class="row-head" x="152" y="220">Weaviate</text>
  <!-- Co-located: weak -->
  <rect class="cell-weak" x="160" y="192" width="123" height="56" rx="4" />
  <text class="cell-text" x="222" y="220">External</text>
  <!-- Filtered ANN: medium -->
  <rect class="cell-medium" x="283" y="192" width="123" height="56" rx="4" />
  <text class="cell-text" x="345" y="215">Inverted</text>
  <text class="cell-text" x="345" y="229">indexes</text>
  <!-- Hybrid: strong -->
  <rect class="cell-strong" x="406" y="192" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="468" y="215">BM25 +</text>
  <text class="cell-text-inv" x="468" y="229">vector</text>
  <!-- Schema: strong (knowledge-graph) -->
  <rect class="cell-strong" x="529" y="192" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="591" y="215">Classes +</text>
  <text class="cell-text-inv" x="591" y="229">cross-refs</text>
  <!-- Self-hostable: strong -->
  <rect class="cell-strong" x="652" y="192" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="714" y="220">Yes</text>
  <!-- Managed: medium (Weaviate Cloud) -->
  <rect class="cell-medium" x="775" y="192" width="123" height="56" rx="4" />
  <text class="cell-text" x="837" y="215">Weaviate</text>
  <text class="cell-text" x="837" y="229">Cloud</text>

  <!-- === Row 4: Qdrant === -->
  <text class="row-head" x="152" y="276">Qdrant</text>
  <!-- Co-located: weak -->
  <rect class="cell-weak" x="160" y="248" width="123" height="56" rx="4" />
  <text class="cell-text" x="222" y="276">External</text>
  <!-- Filtered ANN: strong -->
  <rect class="cell-strong" x="283" y="248" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="345" y="271">Filter-aware</text>
  <text class="cell-text-inv" x="345" y="285">HNSW</text>
  <!-- Hybrid: medium -->
  <rect class="cell-medium" x="406" y="248" width="123" height="56" rx="4" />
  <text class="cell-text" x="468" y="271">Sparse +</text>
  <text class="cell-text" x="468" y="285">dense</text>
  <!-- Schema: weak (just payload JSON) -->
  <rect class="cell-weak" x="529" y="248" width="123" height="56" rx="4" />
  <text class="cell-text" x="591" y="271">JSON</text>
  <text class="cell-text" x="591" y="285">payloads</text>
  <!-- Self-hostable: strong -->
  <rect class="cell-strong" x="652" y="248" width="123" height="56" rx="4" />
  <text class="cell-text-inv" x="714" y="276">Yes (Rust)</text>
  <!-- Managed: medium (Qdrant Cloud) -->
  <rect class="cell-medium" x="775" y="248" width="123" height="56" rx="4" />
  <text class="cell-text" x="837" y="271">Qdrant</text>
  <text class="cell-text" x="837" y="285">Cloud</text>

  <!-- Legend -->
  <rect class="legend-box-w" x="250" y="340" width="18" height="18" rx="3" />
  <text class="legend-text" x="275" y="349">Weak</text>

  <rect class="legend-box-m" x="370" y="340" width="18" height="18" rx="3" />
  <text class="legend-text" x="395" y="349">Medium</text>

  <rect class="legend-box-s" x="500" y="340" width="18" height="18" rx="3" />
  <text class="legend-text" x="525" y="349">Strong</text>

</svg>
