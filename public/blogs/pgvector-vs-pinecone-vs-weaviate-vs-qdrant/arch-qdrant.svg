<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Qdrant architecture</title>
  <desc id="d">Qdrant is an open-source vector engine written in Rust, optimized for filtered ANN: points carry payloads with native payload indexes, HNSW links are filter-aware, scalar/product/binary quantization shrinks vectors, and clusters shard collections for horizontal scale.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .80; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Qdrant cluster (hero) -->
  <rect class="hero" x="30" y="50" width="640" height="400" rx="12" ry="12" />
  <text class="label-inv" x="350" y="80" text-anchor="middle" font-weight="600" font-size="16">Qdrant cluster — Rust engine</text>
  <text class="sub-inv" x="350" y="98" text-anchor="middle">open source · self-host, Docker, or Qdrant Cloud · gRPC + REST</text>

  <!-- Collection -->
  <rect class="adj" x="60" y="118" width="580" height="60" rx="8" ry="8" />
  <text class="label" x="350" y="142" text-anchor="middle" font-weight="700">Collection</text>
  <text class="sub" x="350" y="160" text-anchor="middle">vector params (size, distance) · multi-vector named slots · sharded by ID</text>

  <!-- Points = vector + payload -->
  <rect class="box" x="60" y="194" width="280" height="100" rx="8" ry="8" />
  <text class="label" x="200" y="218" text-anchor="middle" font-weight="700">Points</text>
  <text class="sub" x="200" y="238" text-anchor="middle">{ id, vector, payload: JSON }</text>
  <text class="sub" x="200" y="254" text-anchor="middle">payload = structured metadata</text>
  <text class="sub" x="200" y="270" text-anchor="middle">arbitrary keys · arrays · geo</text>
  <text class="sub" x="200" y="286" text-anchor="middle">payload indexes per field</text>

  <!-- HNSW + filter -->
  <rect class="box" x="358" y="194" width="282" height="100" rx="8" ry="8" />
  <text class="label" x="499" y="218" text-anchor="middle" font-weight="700">Filter-aware HNSW</text>
  <text class="sub" x="499" y="238" text-anchor="middle">graph traversal respects filters</text>
  <text class="sub" x="499" y="254" text-anchor="middle">recall stays high under heavy filters</text>
  <text class="sub" x="499" y="270" text-anchor="middle">no two-stage post-filter trap</text>
  <text class="sub" x="499" y="286" text-anchor="middle">key differentiator at scale</text>

  <!-- Quantization -->
  <rect class="box" x="60" y="310" width="280" height="84" rx="8" ry="8" />
  <text class="label" x="200" y="334" text-anchor="middle" font-weight="700">Quantization</text>
  <text class="sub" x="200" y="352" text-anchor="middle">scalar · product · binary</text>
  <text class="sub" x="200" y="368" text-anchor="middle">shrinks RAM 4×–32×</text>
  <text class="sub" x="200" y="384" text-anchor="middle">rescore with full vectors</text>

  <!-- Sharding / replicas -->
  <rect class="box" x="358" y="310" width="282" height="84" rx="8" ry="8" />
  <text class="label" x="499" y="334" text-anchor="middle" font-weight="700">Sharding · replicas · WAL</text>
  <text class="sub" x="499" y="352" text-anchor="middle">consistent hashing by point ID</text>
  <text class="sub" x="499" y="368" text-anchor="middle">replication factor per collection</text>
  <text class="sub" x="499" y="384" text-anchor="middle">RAFT for metadata</text>

  <!-- gRPC + REST -->
  <rect class="adj" x="60" y="406" width="580" height="32" rx="6" ry="6" />
  <text class="label" x="350" y="427" text-anchor="middle" font-weight="700">gRPC + REST API · search, scroll, recommend, batch upsert</text>

  <!-- Agent side -->
  <rect class="bound" x="700" y="60" width="172" height="380" rx="10" ry="10" />
  <text class="sub" x="786" y="82" text-anchor="middle" font-weight="600">Agent / app</text>

  <rect class="box" x="716" y="104" width="140" height="64" rx="8" ry="8" />
  <text class="label" x="786" y="128" text-anchor="middle" font-weight="600">Embed yourself</text>
  <text class="sub" x="786" y="146" text-anchor="middle">no inline modules</text>
  <text class="sub" x="786" y="160" text-anchor="middle">bring your model</text>

  <rect class="box" x="716" y="186" width="140" height="64" rx="8" ry="8" />
  <text class="label" x="786" y="210" text-anchor="middle" font-weight="600">Filtered query</text>
  <text class="sub" x="786" y="228" text-anchor="middle">payload conditions</text>
  <text class="sub" x="786" y="242" text-anchor="middle">+ vector + score</text>

  <rect class="adj" x="716" y="268" width="140" height="64" rx="8" ry="8" />
  <text class="label" x="786" y="292" text-anchor="middle" font-weight="600">Self-host or cloud</text>
  <text class="sub" x="786" y="310" text-anchor="middle">single Docker</text>
  <text class="sub" x="786" y="324" text-anchor="middle">to K8s cluster</text>

  <rect class="box" x="716" y="350" width="140" height="64" rx="8" ry="8" />
  <text class="label" x="786" y="374" text-anchor="middle" font-weight="600">Observability</text>
  <text class="sub" x="786" y="392" text-anchor="middle">Prometheus · web UI</text>
  <text class="sub" x="786" y="406" text-anchor="middle">snapshots · backups</text>

  <line class="arrow" x1="714" y1="218" x2="642" y2="218" />
</svg>
