<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Operations / deployment story</title>
  <desc id="d">Four-column comparison of the operations story: pgvector reuses your existing Postgres operations; Pinecone is fully managed with zero servers for you to run; Weaviate adds another stateful service with a schema migration story; Qdrant gives you a single Rust binary you self-host with sharding and quantization to tune.</desc>
  <style>
    .chart-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="28">Operations / deployment story</text>

  <!-- Column 1: pgvector — soft (reuses existing Postgres ops) -->
  <rect class="card-soft" x="10" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="115" y="72">pgvector</text>
  <text class="body-text" x="115" y="106">Reuses your existing</text>
  <text class="body-text" x="115" y="124">Postgres backups,</text>
  <text class="body-text" x="115" y="142">replicas, monitoring;</text>
  <text class="body-text" x="115" y="160">no new system</text>

  <!-- Column 2: Pinecone — ACCENT (no servers to run) -->
  <rect class="card-accent" x="230" y="44" width="210" height="220" rx="8" />
  <text class="col-head-inv" x="335" y="72">Pinecone</text>
  <text class="body-text-inv" x="335" y="106">Fully managed —</text>
  <text class="body-text-inv" x="335" y="124">zero servers, zero</text>
  <text class="body-text-inv" x="335" y="142">tuning, serverless billing;</text>
  <text class="body-text-inv" x="335" y="160">vendor-locked</text>

  <!-- Column 3: Weaviate — neutral (own service + schema migration) -->
  <rect class="card-neutral" x="450" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="555" y="72">Weaviate</text>
  <text class="body-text" x="555" y="106">Another stateful</text>
  <text class="body-text" x="555" y="124">service to run;</text>
  <text class="body-text" x="555" y="142">schema migrations</text>
  <text class="body-text" x="555" y="160">to maintain</text>

  <!-- Column 4: Qdrant — soft (single binary, but you self-host) -->
  <rect class="card-soft" x="670" y="44" width="220" height="220" rx="8" />
  <text class="col-head" x="780" y="72">Qdrant</text>
  <text class="body-text" x="780" y="106">Single Rust binary;</text>
  <text class="body-text" x="780" y="124">Docker → K8s cluster;</text>
  <text class="body-text" x="780" y="142">shard, replicate,</text>
  <text class="body-text" x="780" y="160">quantize yourself</text>

</svg>
