<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Pinecone architecture</title>
  <desc id="d">Pinecone is a fully managed external vector service: your app writes vectors plus metadata over HTTPS into namespaced indexes, the index lives in Pinecone's serverless storage tier, and the agent queries it as a remote API separate from your primary database.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .80; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- YOUR INFRA (left, dashed) -->
  <rect class="bound" x="28" y="58" width="290" height="380" rx="10" ry="10" />
  <text class="sub" x="173" y="80" text-anchor="middle" font-weight="600">YOUR INFRA</text>

  <rect class="box" x="48" y="100" width="250" height="60" rx="8" ry="8" />
  <text class="label" x="173" y="124" text-anchor="middle" font-weight="700">Primary DB</text>
  <text class="sub" x="173" y="142" text-anchor="middle">Postgres / Mongo / DynamoDB</text>
  <text class="sub" x="173" y="156" text-anchor="middle">authoritative business rows</text>

  <rect class="box" x="48" y="180" width="250" height="80" rx="8" ry="8" />
  <text class="label" x="173" y="206" text-anchor="middle" font-weight="700">Ingest pipeline</text>
  <text class="sub" x="173" y="224" text-anchor="middle">chunk · embed · upsert</text>
  <text class="sub" x="173" y="240" text-anchor="middle">cron / queue worker</text>
  <text class="sub" x="173" y="254" text-anchor="middle">you keep IDs in sync</text>

  <rect class="box" x="48" y="280" width="250" height="76" rx="8" ry="8" />
  <text class="label" x="173" y="304" text-anchor="middle" font-weight="700">Agent / app</text>
  <text class="sub" x="173" y="322" text-anchor="middle">retrieval tool calls Pinecone</text>
  <text class="sub" x="173" y="338" text-anchor="middle">then joins back to primary DB</text>
  <text class="sub" x="173" y="352" text-anchor="middle">by stored ID</text>

  <rect class="adj" x="48" y="376" width="250" height="48" rx="8" ry="8" />
  <text class="sub" x="173" y="396" text-anchor="middle" font-weight="600">Two systems to operate</text>
  <text class="sub" x="173" y="412" text-anchor="middle">no shared transaction</text>

  <!-- PINECONE CLOUD (right, hero) -->
  <rect class="hero" x="370" y="50" width="500" height="400" rx="12" ry="12" />
  <text class="label-inv" x="620" y="80" text-anchor="middle" font-weight="600" font-size="16">Pinecone — managed service</text>
  <text class="sub-inv" x="620" y="98" text-anchor="middle">no servers, you operate · serverless billing</text>

  <!-- Index / Namespaces -->
  <rect class="box" x="392" y="118" width="456" height="120" rx="8" ry="8" />
  <text class="label" x="620" y="142" text-anchor="middle" font-weight="700">Index</text>
  <text class="sub" x="620" y="160" text-anchor="middle">name · dimension · metric · cloud region</text>

  <rect class="adj" x="412" y="174" width="140" height="50" rx="6" ry="6" />
  <text class="sub" x="482" y="196" text-anchor="middle" font-weight="600">Namespace A</text>
  <text class="sub" x="482" y="212" text-anchor="middle">tenant / collection</text>

  <rect class="adj" x="562" y="174" width="140" height="50" rx="6" ry="6" />
  <text class="sub" x="632" y="196" text-anchor="middle" font-weight="600">Namespace B</text>
  <text class="sub" x="632" y="212" text-anchor="middle">tenant / collection</text>

  <rect class="adj" x="712" y="174" width="120" height="50" rx="6" ry="6" />
  <text class="sub" x="772" y="196" text-anchor="middle" font-weight="600">Namespace C</text>
  <text class="sub" x="772" y="212" text-anchor="middle">tenant / collection</text>

  <!-- Serverless storage tier -->
  <rect class="adj" x="392" y="258" width="220" height="90" rx="8" ry="8" />
  <text class="label" x="502" y="284" text-anchor="middle" font-weight="700">Serverless storage</text>
  <text class="sub" x="502" y="302" text-anchor="middle">blob tier for cold vectors</text>
  <text class="sub" x="502" y="318" text-anchor="middle">pay per GB stored</text>
  <text class="sub" x="502" y="334" text-anchor="middle">no shard sizing</text>

  <!-- Query engine -->
  <rect class="box" x="628" y="258" width="220" height="90" rx="8" ry="8" />
  <text class="label" x="738" y="284" text-anchor="middle" font-weight="700">Query engine</text>
  <text class="sub" x="738" y="302" text-anchor="middle">ANN + metadata filter</text>
  <text class="sub" x="738" y="318" text-anchor="middle">sparse-dense hybrid</text>
  <text class="sub" x="738" y="334" text-anchor="middle">pay per RU consumed</text>

  <!-- Control plane -->
  <rect class="box" x="392" y="362" width="456" height="62" rx="8" ry="8" />
  <text class="label" x="620" y="386" text-anchor="middle" font-weight="700">Control plane · HTTPS API</text>
  <text class="sub" x="620" y="404" text-anchor="middle">SDK clients · auth keys · region pinning · usage metrics</text>

  <!-- Boundary arrows -->
  <line class="arrow" x1="298" y1="218" x2="390" y2="180" />
  <text class="sub" x="345" y="190" text-anchor="middle" font-size="10">upsert</text>
  <line class="arrow" x1="298" y1="318" x2="390" y2="300" />
  <text class="sub" x="345" y="298" text-anchor="middle" font-size="10">query</text>
  <line class="arrow" x1="390" y1="394" x2="298" y2="394" />
  <text class="sub" x="346" y="384" text-anchor="middle" font-size="10">matches → IDs</text>

  <!-- internal -->
  <line class="arrow" x1="612" y1="306" x2="626" y2="306" />
  <line class="arrow" x1="502" y1="234" x2="502" y2="256" />
  <line class="arrow" x1="738" y1="234" x2="738" y2="256" />
</svg>
