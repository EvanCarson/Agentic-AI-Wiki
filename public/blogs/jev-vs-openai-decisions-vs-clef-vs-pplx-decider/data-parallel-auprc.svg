<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="jv3t jv3d">
  <title id="jv3t">Page-change detection, AUPRC before prompt tuning</title>
  <desc id="jv3d">Horizontal bars from Parallel's comparison of decision models on a production page-change task, before prompt tuning: Perplexity pplx-decider-v1 93.3, Jev 87.9, Liquid d1 80.8, OpenAI Decisions 79.0, Rune 26B 74.1, GLiNER2.5 23.5. AUPRC measures ranking quality, not calibration.</desc>
  <style>
    .jv3-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .jv3-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .jv3-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .jv3-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .jv3-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .jv3-val  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; fill: var(--ink); }
    .jv3-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>
  <text class="jv3-ttl" x="20" y="28">Page-change detection, AUPRC (higher is better), before prompt tuning</text>

  <text class="jv3-row" x="20" y="66">pplx-decider-v1</text>
  <rect class="jv3-adj" x="190" y="48" width="606" height="26" rx="4" />
  <text class="jv3-val" x="806" y="66">93.3</text>

  <text class="jv3-row" x="20" y="118">Jev</text>
  <rect class="jv3-hero" x="190" y="100" width="571" height="26" rx="4" />
  <text class="jv3-val" x="771" y="118">87.9</text>

  <text class="jv3-row" x="20" y="170">Liquid d1</text>
  <rect class="jv3-box" x="190" y="152" width="525" height="26" rx="4" />
  <text class="jv3-val" x="725" y="170">80.8</text>

  <text class="jv3-row" x="20" y="222">OpenAI Decisions</text>
  <rect class="jv3-box" x="190" y="204" width="514" height="26" rx="4" />
  <text class="jv3-val" x="714" y="222">79.0</text>

  <text class="jv3-row" x="20" y="274">Rune 26B</text>
  <rect class="jv3-box" x="190" y="256" width="482" height="26" rx="4" />
  <text class="jv3-val" x="682" y="274">74.1</text>

  <text class="jv3-row" x="20" y="326">GLiNER2.5</text>
  <rect class="jv3-box" x="190" y="308" width="153" height="26" rx="4" />
  <text class="jv3-val" x="353" y="326">23.5</text>

  <text class="jv3-sub" x="20" y="380">Source: Parallel, "Are all System One models created equal?" (October 2026). One production task; ranking, not calibration.</text>
</svg>
