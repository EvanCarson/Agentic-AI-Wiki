<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="jv4t jv4d">
  <title id="jv4t">Your bill is set by the escalation rate</title>
  <desc id="jv4d">Four horizontal bars showing a classification workload's cost as a share of running every item through the existing LLM, when a decision model screens everything and items below the threshold escalate to that LLM. At 5 percent escalated the bill is about 5 percent of the old one, at 20 percent about 20, at 40 percent about 40, and at 60 percent about 60, plus a thin slice for the decision-model call on all traffic.</desc>
  <style>
    .jv4-llm  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .jv4-dm   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .jv4-base { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 5 4; }
    .jv4-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .jv4-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .jv4-val  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; fill: var(--ink); }
    .jv4-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>
  <text class="jv4-ttl" x="20" y="28">Cost as % of sending every item to the LLM you already use</text>
  <rect class="jv4-base" x="200" y="46" width="600" height="276" />
  <text class="jv4-sub" x="744" y="340">100% = old bill</text>

  <text class="jv4-row" x="20" y="80">5% escalated</text>
  <rect class="jv4-dm" x="200" y="62" width="4" height="26" />
  <rect class="jv4-llm" x="204" y="62" width="30" height="26" />
  <text class="jv4-val" x="244" y="80">~5%</text>

  <text class="jv4-row" x="20" y="148">20% escalated</text>
  <rect class="jv4-dm" x="200" y="130" width="4" height="26" />
  <rect class="jv4-llm" x="204" y="130" width="120" height="26" />
  <text class="jv4-val" x="334" y="148">~20%</text>

  <text class="jv4-row" x="20" y="216">40% escalated</text>
  <rect class="jv4-dm" x="200" y="198" width="4" height="26" />
  <rect class="jv4-llm" x="204" y="198" width="240" height="26" />
  <text class="jv4-val" x="454" y="216">~40%</text>

  <text class="jv4-row" x="20" y="284">60% escalated</text>
  <rect class="jv4-dm" x="200" y="266" width="4" height="26" />
  <rect class="jv4-llm" x="204" y="266" width="360" height="26" />
  <text class="jv4-val" x="574" y="284">~60%</text>

  <rect class="jv4-dm" x="20" y="362" width="14" height="14" />
  <text class="jv4-sub" x="42" y="374">decision-model call on 100% of items</text>
  <rect class="jv4-llm" x="300" y="362" width="14" height="14" />
  <text class="jv4-sub" x="322" y="374">escalated items still sent to the LLM</text>
</svg>
