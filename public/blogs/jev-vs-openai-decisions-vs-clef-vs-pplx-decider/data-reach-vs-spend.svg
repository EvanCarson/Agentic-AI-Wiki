<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="jv1t jv1d">
  <title id="jv1t">Jev on Vercel's AI Gateway: reach against spend</title>
  <desc id="jv1d">Three horizontal bars on a zero to forty percent scale. About 13 percent of Vercel's paid teams called Jev within 24 hours of launch and 35.3 percent within two weeks, but Jev accounted for only about 0.27 percent of gateway spend. Week-one to week-two retention was 55.6 percent.</desc>
  <style>
    .jv-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .jv-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .jv-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .jv-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .jv-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .jv-val  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; fill: var(--ink); }
    .jv-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .jv-grid { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>
  <text class="jv-ttl" x="20" y="28">Jev on Vercel's AI Gateway, share of paid teams vs share of spend (%)</text>
  <line class="jv-grid" x1="20" y1="48" x2="20" y2="330" />
  <line class="jv-grid" x1="200" y1="48" x2="200" y2="330" />
  <line class="jv-grid" x1="380" y1="48" x2="380" y2="330" />
  <line class="jv-grid" x1="560" y1="48" x2="560" y2="330" />
  <line class="jv-grid" x1="740" y1="48" x2="740" y2="330" />
  <text class="jv-sub" x="16" y="348">0</text>
  <text class="jv-sub" x="192" y="348">10</text>
  <text class="jv-sub" x="372" y="348">20</text>
  <text class="jv-sub" x="552" y="348">30</text>
  <text class="jv-sub" x="732" y="348">40</text>

  <text class="jv-row" x="20" y="72">Paid teams that called Jev within 24 hours</text>
  <rect class="jv-adj" x="20" y="82" width="234" height="30" rx="5" />
  <text class="jv-val" x="264" y="103">~13</text>

  <text class="jv-row" x="20" y="158">Paid teams that called Jev within two weeks</text>
  <rect class="jv-hero" x="20" y="168" width="635" height="30" rx="5" />
  <text class="jv-val" x="665" y="189">35.3</text>

  <text class="jv-row" x="20" y="244">Share of gateway spend</text>
  <rect class="jv-box" x="20" y="254" width="5" height="30" rx="2" />
  <text class="jv-val" x="35" y="275">0.27</text>

  <text class="jv-sub" x="20" y="384">Week-one to week-two retention: 55.6%. Sources: Vercel blog, 18 Sep 2026; Vercel AI Gateway Production Index, 15 Oct 2026.</text>
</svg>
