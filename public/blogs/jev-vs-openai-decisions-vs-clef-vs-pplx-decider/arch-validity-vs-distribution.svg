<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="jv2t jv2d">
  <title id="jv2t">What each approach hands back for the same routing question</title>
  <desc id="jv2d">Three rows for the question "which team should handle this ticket". An LLM writing free text returns a sentence you must parse. An LLM under constrained decoding returns one valid label, technical, with no indication of how sure it is. A decision model returns the same valid label plus a probability for every label, illustrated as technical 0.86, billing 0.12 and sales 0.02, which is what lets you act above a threshold and escalate below it.</desc>
  <style>
    .jv2-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .jv2-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .jv2-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .jv2-hd   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .jv2-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .jv2-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .jv2-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .jv2-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .jv2-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#jv2arr); }
  </style>
  <defs>
    <marker id="jv2arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <text class="jv2-hd" x="20" y="34">What answers the question</text>
  <text class="jv2-hd" x="290" y="34">What comes back</text>
  <text class="jv2-hd" x="640" y="34">What your code can do with it</text>

  <rect class="jv2-box" x="20" y="60" width="220" height="100" rx="8" />
  <text class="jv2-lab" x="36" y="104">LLM, free text</text>
  <text class="jv2-sub" x="36" y="126">a sentence to parse</text>
  <path class="jv2-arr" d="M 244 110 L 284 110" />
  <rect class="jv2-box" x="290" y="60" width="320" height="100" rx="8" />
  <text class="jv2-mono" x="306" y="100">"Probably technical, though</text>
  <text class="jv2-mono" x="306" y="122">it could be billing…"</text>
  <text class="jv2-lab" x="640" y="104">Parse it, and hope it parses</text>

  <rect class="jv2-box" x="20" y="200" width="220" height="100" rx="8" />
  <text class="jv2-lab" x="36" y="244">LLM + constrained</text>
  <text class="jv2-lab" x="36" y="264">decoding</text>
  <path class="jv2-arr" d="M 244 250 L 284 250" />
  <rect class="jv2-adj" x="290" y="200" width="320" height="100" rx="8" />
  <text class="jv2-mono" x="306" y="255">"technical"</text>
  <text class="jv2-lab" x="640" y="244">Branch on it, with no idea</text>
  <text class="jv2-lab" x="640" y="264">how sure it was</text>

  <rect class="jv2-hero" x="20" y="340" width="220" height="100" rx="8" />
  <text class="jv2-inv" x="36" y="384">Decision model</text>
  <text class="jv2-inv" x="36" y="404">(Jev and followers)</text>
  <path class="jv2-arr" d="M 244 390 L 284 390" />
  <rect class="jv2-adj" x="290" y="340" width="320" height="100" rx="8" />
  <text class="jv2-mono" x="306" y="372">technical</text>
  <rect class="jv2-hero" x="400" y="361" width="172" height="14" />
  <text class="jv2-mono" x="580" y="373">.86</text>
  <text class="jv2-mono" x="306" y="398">billing</text>
  <rect class="jv2-hero" x="400" y="387" width="24" height="14" />
  <text class="jv2-mono" x="432" y="399">.12</text>
  <text class="jv2-mono" x="306" y="424">sales</text>
  <rect class="jv2-hero" x="400" y="413" width="4" height="14" />
  <text class="jv2-mono" x="412" y="425">.02</text>
  <text class="jv2-lab" x="640" y="384">Act above a threshold,</text>
  <text class="jv2-lab" x="640" y="404">escalate below it</text>

  <text class="jv2-sub" x="20" y="476">Rows two and three are equally valid. Only row three tells you when not to trust the answer. Probabilities illustrative.</text>
</svg>
