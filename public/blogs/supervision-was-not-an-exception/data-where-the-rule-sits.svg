<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="wrt wrd">
  <title id="wrt">Where three platforms placed their agent rule</title>
  <desc id="wrd">A matrix of four enforcement layers against three platforms. United enforces at the action layer by voiding a booking. JPMorgan enforces at authentication by refusing outside agents a customer login. Walmart's approved-agent gateway enforces at three layers at once: a scoped token at authentication, an approval list at the action layer, and the platform holding the card at settlement. Only the action layer can be undone by the platform alone.</desc>
  <style>
    .wr-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .wr-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .wr-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .wr-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wr-cell { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .wr-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .wr-ttl  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wr-hd   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="wr-ttl" x="450" y="30" text-anchor="middle">Where three platforms put the agent rule</text>

  <text class="wr-hd" x="415" y="68" text-anchor="middle">United · 11 Nov</text>
  <text class="wr-hd" x="595" y="68" text-anchor="middle">JPMorgan · 13 Oct</text>
  <text class="wr-hd" x="775" y="68" text-anchor="middle">Walmart gateway</text>

  <text class="wr-lab" x="318" y="119" text-anchor="end">Edge / HTTP</text>
  <rect class="wr-box" x="330" y="88" width="170" height="52" rx="8" ry="8" />
  <text class="wr-cell" x="415" y="119" text-anchor="middle">—</text>
  <rect class="wr-box" x="510" y="88" width="170" height="52" rx="8" ry="8" />
  <text class="wr-cell" x="595" y="119" text-anchor="middle">—</text>
  <rect class="wr-box" x="690" y="88" width="170" height="52" rx="8" ry="8" />
  <text class="wr-cell" x="775" y="119" text-anchor="middle">—</text>

  <text class="wr-lab" x="318" y="181" text-anchor="end">Authentication</text>
  <rect class="wr-box" x="330" y="150" width="170" height="52" rx="8" ry="8" />
  <text class="wr-cell" x="415" y="181" text-anchor="middle">—</text>
  <rect class="wr-hero" x="510" y="150" width="170" height="52" rx="8" ry="8" />
  <text class="wr-inv" x="595" y="181" text-anchor="middle">No agent login</text>
  <rect class="wr-adj" x="690" y="150" width="170" height="52" rx="8" ry="8" />
  <text class="wr-cell" x="775" y="181" text-anchor="middle">Scoped token</text>

  <text class="wr-lab" x="318" y="243" text-anchor="end">The action</text>
  <rect class="wr-hero" x="330" y="212" width="170" height="52" rx="8" ry="8" />
  <text class="wr-inv" x="415" y="243" text-anchor="middle">Void the booking</text>
  <rect class="wr-box" x="510" y="212" width="170" height="52" rx="8" ry="8" />
  <text class="wr-cell" x="595" y="243" text-anchor="middle">—</text>
  <rect class="wr-adj" x="690" y="212" width="170" height="52" rx="8" ry="8" />
  <text class="wr-cell" x="775" y="243" text-anchor="middle">Approved only</text>

  <text class="wr-lab" x="318" y="305" text-anchor="end">Settlement</text>
  <rect class="wr-box" x="330" y="274" width="170" height="52" rx="8" ry="8" />
  <text class="wr-cell" x="415" y="305" text-anchor="middle">—</text>
  <rect class="wr-box" x="510" y="274" width="170" height="52" rx="8" ry="8" />
  <text class="wr-cell" x="595" y="305" text-anchor="middle">—</text>
  <rect class="wr-adj" x="690" y="274" width="170" height="52" rx="8" ry="8" />
  <text class="wr-cell" x="775" y="305" text-anchor="middle">Platform holds card</text>

  <rect class="wr-box" x="40" y="346" width="820" height="40" rx="8" ry="8" />
  <text class="wr-lab" x="450" y="371" text-anchor="middle">Only the action layer can be undone by the platform alone</text>
</svg>
