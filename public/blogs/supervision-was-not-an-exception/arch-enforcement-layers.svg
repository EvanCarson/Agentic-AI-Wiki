<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="elt eld">
  <title id="elt">Four enforcement layers for an agent-access rule</title>
  <desc id="eld">Four stacked layers at which a platform can place a rule against third-party agents, ordered top to bottom by what it costs to undo an action taken at that layer: edge or HTTP, where there is nothing to reverse; authentication, where a token can be revoked; the action itself, such as a booking, which the platform can void unilaterally; and settlement, where reversal means a chargeback and a regulator. United placed its rule at the action layer and JPMorgan at the authentication layer.</desc>
  <style>
    .el-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .el-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .el-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .el-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .el-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .el-ttl  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .el-note { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .el-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#elarr); }
  </style>
  <defs>
    <marker id="elarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="el-ttl" x="450" y="32" text-anchor="middle">Where the rule can sit — downward, the cost to undo rises</text>

  <path class="el-arr" d="M 22 60 L 22 400" />

  <rect class="el-box" x="40" y="56" width="250" height="72" rx="8" ry="8" />
  <text class="el-lab" x="165" y="97" text-anchor="middle">Edge / HTTP</text>
  <rect class="el-box" x="310" y="56" width="240" height="72" rx="8" ry="8" />
  <text class="el-lab" x="430" y="97" text-anchor="middle">nothing to reverse</text>
  <text class="el-note" x="572" y="101">declared crawlers only</text>

  <rect class="el-adj" x="40" y="148" width="250" height="72" rx="8" ry="8" />
  <text class="el-lab" x="165" y="189" text-anchor="middle">Authentication</text>
  <rect class="el-box" x="310" y="148" width="240" height="72" rx="8" ry="8" />
  <text class="el-lab" x="430" y="189" text-anchor="middle">revoke the token</text>
  <text class="el-note" x="572" y="193">JPMorgan · 13 Oct 2026</text>

  <rect class="el-hero" x="40" y="240" width="250" height="72" rx="8" ry="8" />
  <text class="el-inv" x="165" y="281" text-anchor="middle">The action — a booking</text>
  <rect class="el-box" x="310" y="240" width="240" height="72" rx="8" ry="8" />
  <text class="el-lab" x="430" y="281" text-anchor="middle">void, unilaterally</text>
  <text class="el-note" x="572" y="285">United · 11 Nov 2026</text>

  <rect class="el-box" x="40" y="332" width="250" height="72" rx="8" ry="8" />
  <text class="el-lab" x="165" y="373" text-anchor="middle">Settlement</text>
  <rect class="el-box" x="310" y="332" width="240" height="72" rx="8" ry="8" />
  <text class="el-lab" x="430" y="373" text-anchor="middle">chargeback + regulator</text>
  <text class="el-note" x="572" y="377">cost is no longer yours</text>

  <rect class="el-box" x="40" y="430" width="820" height="50" rx="8" ry="8" />
  <text class="el-lab" x="450" y="460" text-anchor="middle">Put the prohibition one layer upstream of the first irreversible step</text>
</svg>
