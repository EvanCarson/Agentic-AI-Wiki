<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ct cd">
  <title id="ct">Which repository controls could have seen a screenshot in a personal public repo</title>
  <desc id="cd">A matrix of five common GitHub-side controls against three properties of the leaked artefact. Secret scanning and push protection match patterns in text and see nothing in a PNG. The organisation audit log and repository rulesets apply only inside the organisation, so a repository created under a personal account is invisible to both. Branch protection never applies because nothing was reviewed. Only endpoint or network monitoring on the developer's own machine covers all three properties, and almost nobody deploys it against git pushes.</desc>
  <style>
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .strong { fill: var(--accent, #d4421e); stroke: none; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .colh   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .rowh   { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>

  <text class="title" x="20" y="26">Every control was scoped to a property the artefact did not have</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <text class="colh" x="372" y="62" text-anchor="middle">THE PAYLOAD IS AN IMAGE</text>
  <text class="colh" x="552" y="62" text-anchor="middle">PERSONAL ACCOUNT</text>
  <text class="colh" x="732" y="62" text-anchor="middle">BRAND-NEW REPO</text>

  <text class="rowh" x="20" y="98">Secret scanning</text>
  <rect class="weak" x="292" y="76" width="160" height="34" rx="4" />
  <text class="cell" x="372" y="98" text-anchor="middle">blind</text>
  <rect class="weak" x="472" y="76" width="160" height="34" rx="4" />
  <text class="cell" x="552" y="98" text-anchor="middle">out of scope</text>
  <rect class="weak" x="652" y="76" width="160" height="34" rx="4" />
  <text class="cell" x="732" y="98" text-anchor="middle">out of scope</text>

  <text class="rowh" x="20" y="144">Push protection</text>
  <rect class="weak" x="292" y="122" width="160" height="34" rx="4" />
  <text class="cell" x="372" y="144" text-anchor="middle">blind</text>
  <rect class="weak" x="472" y="122" width="160" height="34" rx="4" />
  <text class="cell" x="552" y="144" text-anchor="middle">out of scope</text>
  <rect class="weak" x="652" y="122" width="160" height="34" rx="4" />
  <text class="cell" x="732" y="144" text-anchor="middle">out of scope</text>

  <text class="rowh" x="20" y="190">Org audit log</text>
  <rect class="strong" x="292" y="168" width="160" height="34" rx="4" />
  <text class="cell-inv" x="372" y="190" text-anchor="middle">would log the push</text>
  <rect class="weak" x="472" y="168" width="160" height="34" rx="4" />
  <text class="cell" x="552" y="190" text-anchor="middle">never sees it</text>
  <rect class="weak" x="652" y="168" width="160" height="34" rx="4" />
  <text class="cell" x="732" y="190" text-anchor="middle">never sees it</text>

  <text class="rowh" x="20" y="236">Repository rulesets</text>
  <rect class="med" x="292" y="214" width="160" height="34" rx="4" />
  <text class="cell" x="372" y="236" text-anchor="middle">can block binaries</text>
  <rect class="weak" x="472" y="214" width="160" height="34" rx="4" />
  <text class="cell" x="552" y="236" text-anchor="middle">not enforceable</text>
  <rect class="weak" x="652" y="214" width="160" height="34" rx="4" />
  <text class="cell" x="732" y="236" text-anchor="middle">not enforceable</text>

  <text class="rowh" x="20" y="282">Branch protection</text>
  <rect class="weak" x="292" y="260" width="160" height="34" rx="4" />
  <text class="cell" x="372" y="282" text-anchor="middle">no review happened</text>
  <rect class="weak" x="472" y="260" width="160" height="34" rx="4" />
  <text class="cell" x="552" y="282" text-anchor="middle">not enforceable</text>
  <rect class="weak" x="652" y="260" width="160" height="34" rx="4" />
  <text class="cell" x="732" y="282" text-anchor="middle">not enforceable</text>

  <rect class="strong" x="20" y="306" width="28" height="12" rx="2" />
  <text class="sub" x="56" y="316">covers it</text>
  <rect class="med" x="140" y="306" width="28" height="12" rx="2" />
  <text class="sub" x="176" y="316">partly</text>
  <rect class="weak" x="240" y="306" width="28" height="12" rx="2" />
  <text class="sub" x="276" y="316">does not cover it</text>

  <line class="rule" x1="20" y1="338" x2="880" y2="338" />
  <text class="sub" x="20" y="362">The one control that covers all three columns is on the developer's machine, not in the forge.</text>
  <text class="sub" x="20" y="382">That is the finding: a leak defined by where it happened, not by what was in it.</text>
</svg>
