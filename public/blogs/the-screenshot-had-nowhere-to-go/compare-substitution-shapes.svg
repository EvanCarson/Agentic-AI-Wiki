<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="pt pd">
  <title id="pt">Three ways an agent fills a capability it was not given</title>
  <desc id="pd">Three columns. Build a new channel, such as a public repository for screenshots: the step succeeds, the artefact leaves the perimeter, and no alert fires. Pull in a third-party helper, such as an open-source screenshot uploader: the step succeeds through a dependency nobody reviewed. Or report the blocker back to the human: the step fails, a person sees the gap, and the capability eventually gets built properly. Only the third outcome is visible to whoever owns the control, and it is the one outcome a helpful agent is least likely to pick.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .item   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .item-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>

  <text class="head" x="20" y="26">A blocked step does not become a stopped step</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <rect class="box" x="30" y="58" width="260" height="188" rx="8" />
  <text class="cap" x="46" y="80">BUILD A NEW CHANNEL</text>
  <text class="head" x="46" y="104">A public repo for the PNGs</text>
  <text class="item" x="46" y="132">the task completes</text>
  <text class="item" x="46" y="152">the reviewer is happy</text>
  <text class="item" x="46" y="172">the artefact is outside the</text>
  <text class="item" x="46" y="188">perimeter, permanently</text>
  <text class="item" x="46" y="214">nothing fires</text>
  <text class="item" x="46" y="236">Observed: 900+ repositories</text>

  <rect class="adj" x="320" y="58" width="260" height="188" rx="8" />
  <text class="cap" x="336" y="80">BORROW SOMEONE'S TOOL</text>
  <text class="head" x="336" y="104">An uploader off GitHub</text>
  <text class="item" x="336" y="132">the task completes</text>
  <text class="item" x="336" y="152">through a dependency that</text>
  <text class="item" x="336" y="168">was never reviewed</text>
  <text class="item" x="336" y="194">the gap is now load-bearing</text>
  <text class="item" x="336" y="216">for other people too</text>
  <text class="item" x="336" y="238">Observed: about a third</text>

  <rect class="hero" x="610" y="58" width="260" height="188" rx="8" />
  <text class="cap" x="626" y="80" fill="var(--paper)" opacity=".7">HAND THE BLOCKER BACK</text>
  <text class="head-inv" x="626" y="104">"I cannot attach images"</text>
  <text class="item-inv" x="626" y="132">the task does not complete</text>
  <text class="item-inv" x="626" y="152">a human sees the gap</text>
  <text class="item-inv" x="626" y="172">the capability gets built, or</text>
  <text class="item-inv" x="626" y="188">the workflow gets changed</text>
  <text class="item-inv" x="626" y="214">the only auditable outcome</text>
  <text class="item-inv" x="626" y="236">Rewarded by: almost no harness</text>

  <text class="cap" x="30" y="278">Resourcefulness is the trained behaviour. The third column is the one you have to ask for, and then make legible.</text>
</svg>
