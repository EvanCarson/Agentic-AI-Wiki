<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmT fmD">
  <title id="fmT">Four implementations against four axes of specification currency</title>
  <desc id="fmD">A matrix with four rows and four columns. FastMCP for Python is strong on implementing the current revision, strong on serving handshake-era clients from the same deployment, medium on being tracked by the specification maintainers, and strong on being the default choice in its language. The official TypeScript SDK is strong on the current revision, medium on serving older clients, strong on being tracked, and strong on being the default. mcp-go is weak on the current revision, medium on serving older clients, weak on being tracked because a separate official Go SDK holds that role, and strong on being the default. rmcp for Rust is strong on the current revision, strong on serving older clients, strong on being tracked, and weak on being the default choice. The matrix shows that the two most widely used options are not the two most current ones.</desc>
  <style>
    .hdr   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .rowl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .rows  { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--ink); opacity: .55; }
    .cell  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .celli { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .lgd   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .s     { fill: var(--accent, #d4421e); }
    .m     { fill: var(--accent-soft); stroke: var(--border-soft); stroke-width: 1; }
    .w     { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; }
  </style>

  <text class="ttl" x="0" y="22">Specification currency, not throughput</text>

  <text class="hdr" x="290" y="56" text-anchor="middle">Implements the</text>
  <text class="hdr" x="290" y="70" text-anchor="middle">current revision</text>
  <text class="hdr" x="450" y="56" text-anchor="middle">Serves handshake-era</text>
  <text class="hdr" x="450" y="70" text-anchor="middle">clients too</text>
  <text class="hdr" x="610" y="56" text-anchor="middle">Tracked by the spec</text>
  <text class="hdr" x="610" y="70" text-anchor="middle">maintainers</text>
  <text class="hdr" x="770" y="56" text-anchor="middle">Default choice in</text>
  <text class="hdr" x="770" y="70" text-anchor="middle">its language</text>

  <text class="rowl" x="200" y="104" text-anchor="end">FastMCP</text>
  <text class="rows" x="200" y="120" text-anchor="end">Python · 27.5k stars</text>
  <rect class="s" x="215" y="84" width="150" height="46" rx="6" />
  <text class="celli" x="290" y="112" text-anchor="middle">Strong</text>
  <rect class="s" x="375" y="84" width="150" height="46" rx="6" />
  <text class="celli" x="450" y="112" text-anchor="middle">Strong</text>
  <rect class="m" x="535" y="84" width="150" height="46" rx="6" />
  <text class="cell" x="610" y="112" text-anchor="middle">Medium</text>
  <rect class="s" x="695" y="84" width="150" height="46" rx="6" />
  <text class="celli" x="770" y="112" text-anchor="middle">Strong</text>

  <text class="rowl" x="200" y="164" text-anchor="end">Official TypeScript SDK</text>
  <text class="rows" x="200" y="180" text-anchor="end">TypeScript · 13.3k stars</text>
  <rect class="s" x="215" y="144" width="150" height="46" rx="6" />
  <text class="celli" x="290" y="172" text-anchor="middle">Strong</text>
  <rect class="m" x="375" y="144" width="150" height="46" rx="6" />
  <text class="cell" x="450" y="172" text-anchor="middle">Medium</text>
  <rect class="s" x="535" y="144" width="150" height="46" rx="6" />
  <text class="celli" x="610" y="172" text-anchor="middle">Strong</text>
  <rect class="s" x="695" y="144" width="150" height="46" rx="6" />
  <text class="celli" x="770" y="172" text-anchor="middle">Strong</text>

  <text class="rowl" x="200" y="224" text-anchor="end">mcp-go</text>
  <text class="rows" x="200" y="240" text-anchor="end">Go · 9.1k stars</text>
  <rect class="w" x="215" y="204" width="150" height="46" rx="6" />
  <text class="cell" x="290" y="232" text-anchor="middle">Weak</text>
  <rect class="m" x="375" y="204" width="150" height="46" rx="6" />
  <text class="cell" x="450" y="232" text-anchor="middle">Medium</text>
  <rect class="w" x="535" y="204" width="150" height="46" rx="6" />
  <text class="cell" x="610" y="232" text-anchor="middle">Weak</text>
  <rect class="s" x="695" y="204" width="150" height="46" rx="6" />
  <text class="celli" x="770" y="232" text-anchor="middle">Strong</text>

  <text class="rowl" x="200" y="284" text-anchor="end">rmcp</text>
  <text class="rows" x="200" y="300" text-anchor="end">Rust · 3.9k stars</text>
  <rect class="s" x="215" y="264" width="150" height="46" rx="6" />
  <text class="celli" x="290" y="292" text-anchor="middle">Strong</text>
  <rect class="s" x="375" y="264" width="150" height="46" rx="6" />
  <text class="celli" x="450" y="292" text-anchor="middle">Strong</text>
  <rect class="s" x="535" y="264" width="150" height="46" rx="6" />
  <text class="celli" x="610" y="292" text-anchor="middle">Strong</text>
  <rect class="w" x="695" y="264" width="150" height="46" rx="6" />
  <text class="cell" x="770" y="292" text-anchor="middle">Weak</text>

  <rect class="s" x="215" y="336" width="16" height="14" rx="3" />
  <text class="lgd" x="238" y="348">Strong</text>
  <rect class="m" x="300" y="336" width="16" height="14" rx="3" />
  <text class="lgd" x="323" y="348">Medium</text>
  <rect class="w" x="390" y="336" width="16" height="14" rx="3" />
  <text class="lgd" x="413" y="348">Weak</text>
  <text class="lgd" x="480" y="348">Star counts are a proxy for share within each language, not across them.</text>

  <text class="rows" x="215" y="378">The two rows a team is most likely to already be on — FastMCP and mcp-go — differ on the first column, and that column is</text>
  <text class="rows" x="215" y="392">the one with a date attached to it.</text>
</svg>
