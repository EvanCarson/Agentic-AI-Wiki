<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="lvT lvD">
  <title id="lvT">Implementation latency against the upstream call it wraps</title>
  <desc id="lvD">Two panels. The upper panel, drawn to a zero to five hundred millisecond scale, shows the typical upstream API round trip occupying fifty to five hundred milliseconds while the entire spread of five protocol implementations, from nought point three eight to two point two five milliseconds, is a sliver too narrow to read. The lower panel rescales to zero to two point five milliseconds and separates the five: Rust with rmcp at nought point three eight, Go with mcp-go at nought point five nought, C sharp at nought point six nought, TypeScript at nought point seven six, and Python with FastMCP at two point two five. The chart shows that the axis these libraries are benchmarked on is invisible inside the response time of the work they do.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .pnl   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
    .row   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .axis  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .55; }
    .val   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .valA  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--accent, #d4421e); }
    .note  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .lead  { fill: var(--accent, #d4421e); }
    .mid   { fill: var(--accent-soft); stroke: var(--border-soft); stroke-width: 1; }
    .trail { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; }
    .grid  { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>

  <text class="ttl" x="0" y="22">p50 request handling, against the upstream call it wraps</text>

  <text class="pnl" x="0" y="50">Drawn to scale — 0 to 500 ms</text>
  <line class="grid" x1="440" y1="58" x2="440" y2="150" />
  <line class="grid" x1="580" y1="58" x2="580" y2="150" />
  <line class="grid" x1="720" y1="58" x2="720" y2="150" />
  <line class="grid" x1="860" y1="58" x2="860" y2="150" />

  <text class="row" x="285" y="82" text-anchor="end">Upstream API round trip</text>
  <rect class="trail" x="356" y="66" width="504" height="30" rx="4" />
  <text class="val" x="368" y="86">50–500 ms — the work the server actually does</text>

  <text class="row"  x="285" y="126" text-anchor="end">All five implementations</text>
  <rect class="lead" x="300" y="110" width="3" height="30" rx="1" />
  <text class="valA" x="312" y="130">0.38–2.25 ms</text>

  <line class="grid" x1="300" y1="150" x2="860" y2="150" />
  <text class="axis" x="300" y="168" text-anchor="middle">0</text>
  <text class="axis" x="440" y="168" text-anchor="middle">125</text>
  <text class="axis" x="580" y="168" text-anchor="middle">250</text>
  <text class="axis" x="720" y="168" text-anchor="middle">375</text>
  <text class="axis" x="860" y="168" text-anchor="middle">500 ms</text>

  <text class="pnl" x="0" y="206">Rescaled 200× — 0 to 2.5 ms, the axis the benchmarks report</text>
  <line class="grid" x1="440" y1="214" x2="440" y2="340" />
  <line class="grid" x1="580" y1="214" x2="580" y2="340" />
  <line class="grid" x1="720" y1="214" x2="720" y2="340" />
  <line class="grid" x1="860" y1="214" x2="860" y2="340" />

  <text class="row" x="285" y="236" text-anchor="end">Rust · rmcp</text>
  <rect class="lead" x="300" y="222" width="85" height="18" rx="3" />
  <text class="valA" x="393" y="236">0.38</text>

  <text class="row" x="285" y="262" text-anchor="end">Go · mcp-go</text>
  <rect class="mid" x="300" y="248" width="112" height="18" rx="3" />
  <text class="val" x="420" y="262">0.50</text>

  <text class="row" x="285" y="288" text-anchor="end">C# · official SDK</text>
  <rect class="mid" x="300" y="274" width="134" height="18" rx="3" />
  <text class="val" x="442" y="288">0.60</text>

  <text class="row" x="285" y="314" text-anchor="end">TypeScript · official SDK</text>
  <rect class="mid" x="300" y="300" width="170" height="18" rx="3" />
  <text class="val" x="478" y="314">0.76</text>

  <text class="row" x="285" y="340" text-anchor="end">Python · FastMCP</text>
  <rect class="trail" x="300" y="326" width="504" height="18" rx="3" />
  <text class="val" x="812" y="340">2.25</text>

  <line class="grid" x1="300" y1="352" x2="860" y2="352" />
  <text class="axis" x="300" y="370" text-anchor="middle">0</text>
  <text class="axis" x="580" y="370" text-anchor="middle">1.25</text>
  <text class="axis" x="860" y="370" text-anchor="middle">2.5 ms</text>

  <text class="note" x="0" y="394">Figures are p50 echo-proxy latency from an independent five-language benchmark; the upstream band is the range its author reports as typical.</text>
</svg>
