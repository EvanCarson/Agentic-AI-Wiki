<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="drT drD">
  <title id="drT">Two ways to survive a dual-revision window</title>
  <desc id="drD">Two architectures side by side. On the left, forked deployments: handshake-era clients reach a legacy endpoint and current clients reach a new endpoint, each carrying its own copy of the tool implementations, authorization checks and rate limits, so every change must be made twice for as long as the window lasts. On the right, one deployment: both classes of client reach the same address, the revision is resolved at the edge into a single internal request shape, and one copy of the tools, authorization and rate limits serves both. A note below states that the compatibility layer on the right is a module with a removal date, so retiring a revision is a deletion rather than a migration.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .pane  { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 3; }
    .hd    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lbl   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .lbli  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .subi  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#drarr); }
    .note  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
  </style>
  <defs>
    <marker id="drarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="pane" x="10" y="10" width="425" height="400" rx="10" />
  <text class="hd" x="30" y="38">Forked deployments</text>
  <text class="sub" x="30" y="56">the obvious answer, and the expensive one</text>

  <rect class="box" x="30" y="76" width="170" height="44" rx="6" />
  <text class="lbl" x="46" y="103">Handshake-era clients</text>
  <rect class="box" x="245" y="76" width="170" height="44" rx="6" />
  <text class="lbl" x="261" y="103">Current-revision clients</text>

  <path class="arrow" d="M 115 122 L 115 152" />
  <path class="arrow" d="M 330 122 L 330 152" />

  <rect class="adj" x="30" y="154" width="170" height="40" rx="6" />
  <text class="lbl" x="46" y="179">legacy.example.com</text>
  <rect class="adj" x="245" y="154" width="170" height="40" rx="6" />
  <text class="lbl" x="261" y="179">mcp.example.com</text>

  <path class="arrow" d="M 115 196 L 115 224" />
  <path class="arrow" d="M 330 196 L 330 224" />

  <rect class="box" x="30" y="226" width="170" height="150" rx="6" />
  <text class="lbl" x="46" y="250">Tool implementations</text>
  <text class="lbl" x="46" y="274">Authorization checks</text>
  <text class="lbl" x="46" y="298">Rate limits</text>
  <text class="lbl" x="46" y="322">Tracing</text>
  <text class="sub" x="46" y="352">copy 1 of 2</text>

  <rect class="box" x="245" y="226" width="170" height="150" rx="6" />
  <text class="lbl" x="261" y="250">Tool implementations</text>
  <text class="lbl" x="261" y="274">Authorization checks</text>
  <text class="lbl" x="261" y="298">Rate limits</text>
  <text class="lbl" x="261" y="322">Tracing</text>
  <text class="sub" x="261" y="352">copy 2 of 2</text>

  <text class="sub" x="30" y="396">Every fix lands twice, for as long as the window lasts.</text>

  <rect class="pane" x="465" y="10" width="425" height="400" rx="10" />
  <text class="hd" x="485" y="38">One deployment, negotiated per connection</text>
  <text class="sub" x="485" y="56">the revision is an edge concern, not a topology</text>

  <rect class="box" x="485" y="76" width="170" height="44" rx="6" />
  <text class="lbl" x="501" y="103">Handshake-era clients</text>
  <rect class="box" x="700" y="76" width="170" height="44" rx="6" />
  <text class="lbl" x="716" y="103">Current-revision clients</text>

  <path class="arrow" d="M 570 122 L 655 152" />
  <path class="arrow" d="M 785 122 L 700 152" />

  <rect class="hero" x="530" y="154" width="295" height="52" rx="6" />
  <text class="lbli" x="548" y="176">Edge: negotiate the revision, normalise inward</text>
  <text class="subi" x="548" y="196">one internal request shape — the only place a revision appears</text>

  <path class="arrow" d="M 677 208 L 677 236" />

  <rect class="adj" x="530" y="238" width="295" height="138" rx="6" />
  <text class="lbl" x="548" y="262">Tool implementations</text>
  <text class="lbl" x="548" y="286">Authorization checks</text>
  <text class="lbl" x="548" y="310">Rate limits</text>
  <text class="lbl" x="548" y="334">Tracing</text>
  <text class="sub" x="548" y="362">one copy, no revision-specific branches</text>

  <text class="sub" x="485" y="396">Any replica answers any client — each request carries its own context.</text>

  <text class="note" x="10" y="440">Both diagrams describe the same window. The difference is where the revision lives: in your topology, or in one module at the edge.</text>
  <text class="note" x="10" y="462">Keep the compatibility layer in a single module with its removal date written in the file, and retiring a revision becomes deleting a</text>
  <text class="note" x="10" y="484">directory rather than an archaeology exercise — which is the difference between a window that closes and one that never does.</text>
</svg>
