<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="cpT cpD">
  <title id="cpT">Where the commit point lives across three voice architectures</title>
  <desc id="cpD">Three columns. Cascaded half duplex: endpointing runs in your own code and emits end-of-turn, so the commit point is a silence threshold you can tune and revert. Speech-to-speech half duplex: endpointing has moved inside the model but a turn boundary is still exposed as an event you subscribe to. Full duplex: there is no turn boundary at all, so the commit point becomes a policy you write and must maintain.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .92; }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Where the commit point lives</text>

  <rect class="box" x="35" y="48" width="250" height="96" />
  <text class="hd" x="160" y="76" text-anchor="middle">Cascaded half duplex</text>
  <text class="cell" x="160" y="100" text-anchor="middle">Endpointing is your code.</text>
  <text class="cell" x="160" y="118" text-anchor="middle">You emit end-of-turn and</text>
  <text class="cell" x="160" y="136" text-anchor="middle">decide everything from it.</text>

  <rect class="adj" x="325" y="48" width="250" height="96" />
  <text class="hd" x="450" y="76" text-anchor="middle">Speech-to-speech</text>
  <text class="cell" x="450" y="100" text-anchor="middle">Endpointing moved inside</text>
  <text class="cell" x="450" y="118" text-anchor="middle">the model, but a turn is</text>
  <text class="cell" x="450" y="136" text-anchor="middle">still exposed as an event.</text>

  <rect class="hero" x="625" y="48" width="250" height="96" />
  <text class="hd-inv" x="750" y="76" text-anchor="middle">Full duplex</text>
  <text class="cell-inv" x="750" y="100" text-anchor="middle">No turn boundary exists.</text>
  <text class="cell-inv" x="750" y="118" text-anchor="middle">Nothing fires when the</text>
  <text class="cell-inv" x="750" y="136" text-anchor="middle">caller stops speaking.</text>

  <text class="lane" x="160" y="176" text-anchor="middle">Commit point</text>
  <text class="lane" x="450" y="176" text-anchor="middle">Commit point</text>
  <text class="lane" x="750" y="176" text-anchor="middle">Commit point</text>

  <rect class="box" x="35" y="186" width="250" height="80" />
  <text class="cell" x="160" y="214" text-anchor="middle">A silence threshold you</text>
  <text class="cell" x="160" y="236" text-anchor="middle">tune, diff and revert.</text>

  <rect class="box" x="325" y="186" width="250" height="80" />
  <text class="cell" x="450" y="214" text-anchor="middle">A model event you</text>
  <text class="cell" x="450" y="236" text-anchor="middle">subscribe to, not tune.</text>

  <rect class="box" x="625" y="186" width="250" height="80" />
  <text class="cell" x="750" y="214" text-anchor="middle">A policy you write,</text>
  <text class="cell" x="750" y="236" text-anchor="middle">own and maintain.</text>
</svg>
