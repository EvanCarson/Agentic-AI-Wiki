<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="wtT wtD">
  <title id="wtT">Where the end-of-turn event went</title>
  <desc id="wtD">Two panels. On the left, a half-duplex loop: caller audio feeds voice activity detection, which feeds endpointing, which emits a single end-of-turn event drawn as a solid accent box. Four arrows leave that event and reach tool dispatch, trace write, guardrail check and billing tick. On the right, a full-duplex loop: caller audio and agent audio flow together through one model with no endpointing stage and no end-of-turn event, and the same four consumers are drawn detached with question marks, waiting for a signal that never arrives. A band across the bottom names three commit points you declare instead: a filled and stable slot fires the tool, a backend model invocation opens a span, and the agent starting or stopping audio marks the timeline.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ghost  { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 4 4; opacity: .45; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .85; }
    .dim    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .5; }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .q      { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 18px; fill: var(--ink); opacity: .45; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#wtArr); }
    .divide { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <marker id="wtArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="22">One event, four subscribers</text>

  <line class="divide" x1="440" y1="46" x2="440" y2="344" />

  <text class="lane" x="215" y="58" text-anchor="middle">Half duplex</text>

  <rect class="box" x="20" y="72" width="170" height="42" />
  <text class="lbl" x="105" y="98" text-anchor="middle">Caller audio</text>
  <path class="arrow" d="M 105 114 L 105 128" />

  <rect class="box" x="20" y="130" width="170" height="42" />
  <text class="lbl" x="105" y="156" text-anchor="middle">Voice activity detection</text>
  <path class="arrow" d="M 105 172 L 105 186" />

  <rect class="adj" x="20" y="188" width="170" height="42" />
  <text class="lbl" x="105" y="214" text-anchor="middle">Endpointing</text>
  <path class="arrow" d="M 105 230 L 105 244" />

  <rect class="hero" x="20" y="246" width="170" height="48" />
  <text class="hd-inv" x="105" y="276" text-anchor="middle">end-of-turn</text>

  <rect class="box" x="232" y="72" width="178" height="42" />
  <text class="lbl" x="321" y="98" text-anchor="middle">Tool dispatch</text>
  <rect class="box" x="232" y="130" width="178" height="42" />
  <text class="lbl" x="321" y="156" text-anchor="middle">Trace write</text>
  <rect class="box" x="232" y="188" width="178" height="42" />
  <text class="lbl" x="321" y="214" text-anchor="middle">Guardrail check</text>
  <rect class="box" x="232" y="246" width="178" height="42" />
  <text class="lbl" x="321" y="272" text-anchor="middle">Billing tick</text>

  <path class="arrow" d="M 190 268 C 212 268 210 93 230 93" />
  <path class="arrow" d="M 190 269 C 212 269 210 151 230 151" />
  <path class="arrow" d="M 190 270 C 212 270 210 209 230 209" />
  <path class="arrow" d="M 190 271 C 212 271 212 267 230 267" />

  <text class="lane" x="675" y="58" text-anchor="middle">Full duplex</text>

  <rect class="box" x="470" y="72" width="160" height="42" />
  <text class="lbl" x="550" y="98" text-anchor="middle">Caller audio</text>
  <rect class="box" x="470" y="130" width="160" height="42" />
  <text class="lbl" x="550" y="156" text-anchor="middle">Agent audio</text>

  <path class="arrow" d="M 550 114 L 550 128" />
  <path class="arrow" d="M 636 196 C 664 196 664 151 636 151" />

  <rect class="hero" x="470" y="188" width="160" height="60" />
  <text class="hd-inv" x="550" y="214" text-anchor="middle">One model</text>
  <text class="sub-inv" x="550" y="234" text-anchor="middle">continuous, both ways</text>

  <rect class="ghost" x="470" y="264" width="160" height="42" />
  <text class="dim" x="550" y="290" text-anchor="middle">no end-of-turn</text>

  <rect class="ghost" x="700" y="72" width="178" height="42" />
  <text class="dim" x="779" y="98" text-anchor="middle">Tool dispatch</text>
  <text class="q" x="686" y="100">?</text>
  <rect class="ghost" x="700" y="130" width="178" height="42" />
  <text class="dim" x="779" y="156" text-anchor="middle">Trace write</text>
  <text class="q" x="686" y="158">?</text>
  <rect class="ghost" x="700" y="188" width="178" height="42" />
  <text class="dim" x="779" y="214" text-anchor="middle">Guardrail check</text>
  <text class="q" x="686" y="216">?</text>
  <rect class="ghost" x="700" y="246" width="178" height="42" />
  <text class="dim" x="779" y="272" text-anchor="middle">Billing tick</text>
  <text class="q" x="686" y="274">?</text>

  <text class="lane" x="450" y="372" text-anchor="middle">What you declare instead</text>

  <rect class="adj" x="60" y="390" width="230" height="62" />
  <text class="hd" x="175" y="414" text-anchor="middle">Slot filled and stable</text>
  <text class="lbl" x="175" y="436" text-anchor="middle">fire the tool</text>

  <rect class="adj" x="335" y="390" width="230" height="62" />
  <text class="hd" x="450" y="414" text-anchor="middle">Backend model invoked</text>
  <text class="lbl" x="450" y="436" text-anchor="middle">open a span</text>

  <rect class="adj" x="610" y="390" width="230" height="62" />
  <text class="hd" x="725" y="414" text-anchor="middle">Audio starts or stops</text>
  <text class="lbl" x="725" y="436" text-anchor="middle">mark the timeline</text>
</svg>
