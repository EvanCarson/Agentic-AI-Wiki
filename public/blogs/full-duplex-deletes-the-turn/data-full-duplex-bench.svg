<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fdT fdD">
  <title id="fdT">Reported Full Duplex Bench results</title>
  <desc id="fdD">Horizontal bar chart with two groups. Full Duplex Bench interactivity: GPT-Live-1 scores 80.1 percent and GPT-Realtime-2.1 scores 45.4 percent. Full Duplex Bench version three tool-calling Pass at 1, run with a Terra backend at low reasoning effort: GPT-Live-1 scores 87.0 percent against comparison configurations at 60.0 and 58.0 percent.</desc>
  <style>
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .grp    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val-hi { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--accent, #d4421e); }
    .axis   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .55; }
    .grid   { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .lead   { fill: var(--accent, #d4421e); rx: 4; ry: 4; }
    .mid    { fill: var(--accent-soft); rx: 4; ry: 4; }
    .trail  { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; rx: 4; ry: 4; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="0" y="22">Reported score (%)</text>

  <line class="grid" x1="440" y1="60" x2="440" y2="300" />
  <line class="grid" x1="580" y1="60" x2="580" y2="300" />
  <line class="grid" x1="720" y1="60" x2="720" y2="300" />
  <line class="grid" x1="860" y1="60" x2="860" y2="300" />

  <text class="grp" x="0" y="54">Full Duplex Bench — interactivity</text>

  <text class="lbl" x="0" y="86">GPT-Live-1</text>
  <rect class="lead" x="300" y="66" width="449" height="30" />
  <text class="val-hi" x="761" y="86">80.1</text>

  <text class="lbl" x="0" y="126">GPT-Realtime-2.1</text>
  <rect class="trail" x="300" y="106" width="254" height="30" />
  <text class="val" x="566" y="126">45.4</text>

  <text class="grp" x="0" y="168">Full Duplex Bench v3 — tool-calling Pass@1 (Terra backend, low effort)</text>

  <text class="lbl" x="0" y="200">GPT-Live-1</text>
  <rect class="lead" x="300" y="180" width="487" height="30" />
  <text class="val-hi" x="799" y="200">87.0</text>

  <text class="lbl" x="0" y="240">Comparison config A</text>
  <rect class="mid" x="300" y="220" width="336" height="30" />
  <text class="val" x="648" y="240">60.0</text>

  <text class="lbl" x="0" y="280">Comparison config B</text>
  <rect class="trail" x="300" y="260" width="325" height="30" />
  <text class="val" x="637" y="280">58.0</text>

  <text class="axis" x="440" y="320" text-anchor="middle">25</text>
  <text class="axis" x="580" y="320" text-anchor="middle">50</text>
  <text class="axis" x="720" y="320" text-anchor="middle">75</text>
  <text class="axis" x="860" y="320" text-anchor="middle">100</text>

  <text class="note" x="0" y="354">Each bar is a configuration — voice layer, backend model and reasoning effort together.</text>
  <text class="note" x="0" y="376">Turn-taking latency, not to scale: 0.8 s for GPT-Live-1 against 1.4 s for GPT-Realtime-2.1.</text>
</svg>
