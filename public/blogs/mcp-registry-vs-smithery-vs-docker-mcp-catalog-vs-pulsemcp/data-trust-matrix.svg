<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">What each MCP index verifies</title>
  <desc id="d">Matrix of four indexes against five properties. The official MCP Registry is strong on verified name ownership and breadth, weak on build provenance and isolation. Smithery is strong on breadth, medium on isolation because it hosts the process elsewhere, weak on name ownership and provenance. The Docker MCP Catalog is strong on build provenance and isolation, medium on publisher identity, weak on breadth. PulseMCP is strong on breadth only. The tool-behaviour column is weak for all four indexes.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); }
    .medium { fill: var(--accent-soft); }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="head" x="24" y="34">What each index verifies</text>

  <text class="col" x="212" y="66">NAME OWNER</text>
  <text class="col" x="352" y="66">BUILD PROVENANCE</text>
  <text class="col" x="512" y="66">ISOLATION</text>
  <text class="col" x="642" y="66">TOOL BEHAVIOUR</text>
  <text class="col" x="812" y="66">BREADTH</text>

  <text class="row" x="24" y="106">Official Registry</text>
  <rect class="strong" x="196" y="82" width="132" height="36" rx="4" />
  <text class="cell-inv" x="222" y="106">Verified</text>
  <rect class="weak" x="336" y="82" width="132" height="36" rx="4" />
  <text class="cell" x="378" y="106">None</text>
  <rect class="weak" x="476" y="82" width="132" height="36" rx="4" />
  <text class="cell" x="518" y="106">None</text>
  <rect class="weak" x="616" y="82" width="132" height="36" rx="4" />
  <text class="cell" x="658" y="106">None</text>
  <rect class="strong" x="756" y="82" width="120" height="36" rx="4" />
  <text class="cell-inv" x="794" y="106">High</text>

  <text class="row" x="24" y="164">Smithery</text>
  <rect class="weak" x="196" y="140" width="132" height="36" rx="4" />
  <text class="cell" x="238" y="164">None</text>
  <rect class="weak" x="336" y="140" width="132" height="36" rx="4" />
  <text class="cell" x="378" y="164">None</text>
  <rect class="medium" x="476" y="140" width="132" height="36" rx="4" />
  <text class="cell" x="500" y="164">Off your box</text>
  <rect class="weak" x="616" y="140" width="132" height="36" rx="4" />
  <text class="cell" x="658" y="164">None</text>
  <rect class="strong" x="756" y="140" width="120" height="36" rx="4" />
  <text class="cell-inv" x="794" y="164">High</text>

  <text class="row" x="24" y="222">Docker Catalog</text>
  <rect class="medium" x="196" y="198" width="132" height="36" rx="4" />
  <text class="cell" x="224" y="222">Publisher</text>
  <rect class="strong" x="336" y="198" width="132" height="36" rx="4" />
  <text class="cell-inv" x="346" y="222">Signed + SBOM</text>
  <rect class="strong" x="476" y="198" width="132" height="36" rx="4" />
  <text class="cell-inv" x="494" y="222">Container</text>
  <rect class="weak" x="616" y="198" width="132" height="36" rx="4" />
  <text class="cell" x="658" y="222">None</text>
  <rect class="weak" x="756" y="198" width="120" height="36" rx="4" />
  <text class="cell" x="794" y="222">Low</text>

  <text class="row" x="24" y="280">PulseMCP</text>
  <rect class="weak" x="196" y="256" width="132" height="36" rx="4" />
  <text class="cell" x="238" y="280">None</text>
  <rect class="weak" x="336" y="256" width="132" height="36" rx="4" />
  <text class="cell" x="378" y="280">None</text>
  <rect class="weak" x="476" y="256" width="132" height="36" rx="4" />
  <text class="cell" x="518" y="280">None</text>
  <rect class="weak" x="616" y="256" width="132" height="36" rx="4" />
  <text class="cell" x="658" y="280">None</text>
  <rect class="strong" x="756" y="256" width="120" height="36" rx="4" />
  <text class="cell-inv" x="794" y="280">High</text>

  <rect class="strong" x="24" y="326" width="16" height="16" rx="3" />
  <text class="cell" x="48" y="339">Strong</text>
  <rect class="medium" x="126" y="326" width="16" height="16" rx="3" />
  <text class="cell" x="150" y="339">Partial</text>
  <rect class="weak" x="226" y="326" width="16" height="16" rx="3" />
  <text class="cell" x="250" y="339">Not covered</text>

  <text class="sub" x="24" y="378">The fourth column is the one that decides whether a server is safe to install, and it is empty in all four rows.</text>
</svg>
