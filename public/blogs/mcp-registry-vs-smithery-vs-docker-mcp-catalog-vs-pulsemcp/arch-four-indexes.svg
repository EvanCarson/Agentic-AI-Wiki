<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where each MCP index sits on the path from published to running</title>
  <desc id="d">Four stages run left to right: resolving a name, discovering that a server exists, obtaining the artefact you will execute, and running it beside your credentials. The official MCP Registry serves the name stage; PulseMCP and Smithery serve discovery; the Docker MCP Catalog serves the artefact stage; and no index serves the run stage, where isolation and egress are decided. A band across the bottom notes that none of the four reads the tool descriptions the model will obey.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .tick   { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="tag" x="24" y="36">FROM PUBLISHED TO RUNNING</text>

  <rect class="adj" x="24" y="52" width="190" height="92" />
  <text class="head" x="42" y="82">Name</text>
  <text class="sub" x="42" y="106">reverse-DNS, ownership</text>
  <text class="sub" x="42" y="126">proved by DNS or GitHub</text>

  <path class="arrow" d="M 218 98 L 258 98" />

  <rect class="adj" x="262" y="52" width="190" height="92" />
  <text class="head" x="280" y="82">Discover</text>
  <text class="sub" x="280" y="106">does one exist for X,</text>
  <text class="sub" x="280" y="126">and is it maintained?</text>

  <path class="arrow" d="M 456 98 L 496 98" />

  <rect class="adj" x="500" y="52" width="190" height="92" />
  <text class="head" x="518" y="82">Artefact</text>
  <text class="sub" x="518" y="106">the image or package</text>
  <text class="sub" x="518" y="126">you actually pull</text>

  <path class="arrow" d="M 694 98 L 734 98" />

  <rect class="hero" x="738" y="52" width="138" height="92" />
  <text class="head-inv" x="756" y="82">Run</text>
  <text class="sub-inv" x="756" y="106">credentials, egress,</text>
  <text class="sub-inv" x="756" y="126">isolation</text>

  <path class="tick" d="M 119 148 L 119 192" />
  <path class="tick" d="M 357 148 L 357 192" />
  <path class="tick" d="M 595 148 L 595 192" />
  <path class="tick" d="M 807 148 L 807 192" />

  <rect class="box" x="24" y="196" width="190" height="72" />
  <text class="label" x="42" y="224">Official MCP Registry</text>
  <text class="sub" x="42" y="248">identity and metadata</text>

  <rect class="box" x="262" y="196" width="190" height="72" />
  <text class="label" x="280" y="224">PulseMCP · Smithery</text>
  <text class="sub" x="280" y="248">breadth, freshness, hosting</text>

  <rect class="box" x="500" y="196" width="190" height="72" />
  <text class="label" x="518" y="224">Docker MCP Catalog</text>
  <text class="sub" x="518" y="248">signature, SBOM, provenance</text>

  <rect class="box" x="738" y="196" width="138" height="72" />
  <text class="label" x="756" y="224">Nobody</text>
  <text class="sub" x="756" y="248">this box is yours</text>

  <rect class="box" x="24" y="308" width="852" height="164" />
  <text class="tag" x="46" y="340">WHAT NO INDEX CHECKS</text>
  <text class="head" x="46" y="372">The tool descriptions your model reads as instructions</text>
  <text class="sub" x="46" y="404">— a description can change on the server's next deploy, after you approved it</text>
  <text class="sub" x="46" y="428">— no metadata field declares which hosts the server will contact</text>
  <text class="sub" x="46" y="452">— every claim above is made once, at publish time</text>
</svg>
