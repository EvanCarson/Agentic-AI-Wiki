<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three layers of trust, and what each one leaves open</title>
  <desc id="d">Three columns. Trusting the name proves a publisher controls a domain or GitHub account, and leaves open everything about behaviour and a future account compromise. Trusting the build proves the image is the one the pipeline produced, with an SBOM and a scan, and leaves open what the tools instruct the model to do. Trusting the host outsources operation and credentials, and leaves open a party who can change the tool definitions after you approved them.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
  </style>

  <rect class="adj" x="24" y="36" width="266" height="212" />
  <text class="head" x="44" y="66">Trust the name</text>
  <text class="sub" x="44" y="100">reverse-DNS namespace</text>
  <text class="sub" x="44" y="124">DNS TXT or GitHub OAuth proof</text>
  <text class="sub" x="44" y="148">squatting your vendor gets hard</text>
  <line x1="44" y1="172" x2="270" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="44" y="196">STILL OPEN</text>
  <text class="label" x="44" y="220">everything the server does</text>

  <rect class="hero" x="314" y="36" width="266" height="212" />
  <text class="head-inv" x="334" y="66">Trust the build</text>
  <text class="sub-inv" x="334" y="100">signature and provenance</text>
  <text class="sub-inv" x="334" y="124">SBOM plus vulnerability scan</text>
  <text class="sub-inv" x="334" y="148">verified at launch, not at browse</text>
  <line x1="334" y1="172" x2="560" y2="172" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag" x="334" y="196" fill="var(--paper)" opacity=".85">STILL OPEN</text>
  <text class="label-inv" x="334" y="220">what the tools tell the model to do</text>

  <rect class="box" x="604" y="36" width="266" height="212" />
  <text class="head" x="624" y="66">Trust the host</text>
  <text class="sub" x="624" y="100">an endpoint that works today</text>
  <text class="sub" x="624" y="124">their on-call, not yours</text>
  <text class="sub" x="624" y="148">your upstream tokens, their machine</text>
  <line x1="624" y1="172" x2="850" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="624" y="196">STILL OPEN</text>
  <text class="label" x="624" y="220">tool definitions can change later</text>
</svg>
