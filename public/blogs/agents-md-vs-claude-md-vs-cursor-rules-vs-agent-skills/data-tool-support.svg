<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="st sd">
  <title id="st">Agent harnesses that read each format natively</title>
  <desc id="sd">Horizontal bar chart. AGENTS.md is read by roughly thirty coding agents, SKILL.md by around five harnesses, while CLAUDE.md and Cursor's .mdc rules are each read by one vendor's own tooling, with a fallback path from Claude Code to AGENTS.md.</desc>
  <style>
    .bar-hi { fill: var(--accent, #d4421e); }
    .bar-mid { fill: var(--accent-soft); }
    .bar-lo { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .num    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .grid   { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 2 4; opacity: .35; }
  </style>

  <text class="title" x="20" y="28">Harnesses reading the format natively (approximate)</text>

  <path class="grid" d="M 400 50 L 400 330" />
  <path class="grid" d="M 570 50 L 570 330" />
  <path class="grid" d="M 740 50 L 740 330" />
  <text class="sub" x="400" y="352" text-anchor="middle">10</text>
  <text class="sub" x="570" y="352" text-anchor="middle">20</text>
  <text class="sub" x="740" y="352" text-anchor="middle">30</text>

  <text class="label" x="20" y="82">AGENTS.md</text>
  <rect class="bar-hi" x="230" y="64" width="510" height="28" rx="4" />
  <text class="num" x="752" y="84">~30</text>

  <text class="label" x="20" y="142">SKILL.md (skills)</text>
  <rect class="bar-mid" x="230" y="124" width="85" height="28" rx="4" />
  <text class="num" x="327" y="144">~5</text>

  <text class="label" x="20" y="202">CLAUDE.md</text>
  <rect class="bar-lo" x="230" y="184" width="17" height="28" rx="4" />
  <text class="num" x="259" y="204">1</text>

  <text class="label" x="20" y="262">.cursor/rules/*.mdc</text>
  <rect class="bar-lo" x="230" y="244" width="17" height="28" rx="4" />
  <text class="num" x="259" y="264">1</text>

  <text class="sub" x="20" y="306">Counts are of agent harnesses, not repositories. AGENTS.md is used in 60,000+ repositories</text>
  <text class="sub" x="20" y="324">and is governed by the Agentic AI Foundation at the Linux Foundation.</text>
</svg>
