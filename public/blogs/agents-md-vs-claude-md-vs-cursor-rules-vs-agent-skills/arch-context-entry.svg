<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="et ed">
  <title id="et">Four moments standing instructions can enter the context window</title>
  <desc id="ed">Four rungs feeding one context window: always-on text loaded every turn, path-matched text loaded when a file is touched, model-requested text loaded when a description matches the task, and human-invoked text loaded only on explicit mention. Each rung is annotated with what it costs and what can fail.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr3); }
  </style>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="hero" x="600" y="170" width="270" height="110" />
  <text class="label-inv" x="735" y="212" text-anchor="middle">The context window</text>
  <text class="label-inv" x="735" y="238" text-anchor="middle">this turn</text>

  <rect class="adj" x="30" y="50" width="330" height="62" />
  <text class="label" x="48" y="74">Always — every turn, no condition</text>
  <text class="mono" x="48" y="96">AGENTS.md · CLAUDE.md · alwaysApply: true</text>
  <text class="sub" x="380" y="72">Cost: paid on every request</text>
  <text class="sub" x="380" y="90">Fails by: crowding out the task</text>
  <path class="arrow" d="M 566 82 L 596 178" />

  <rect class="box" x="30" y="140" width="330" height="62" />
  <text class="label" x="48" y="164">Path-matched — when a file is touched</text>
  <text class="mono" x="48" y="186">globs: ["**/*.tsx"]</text>
  <text class="sub" x="380" y="162">Cost: only in matching sessions</text>
  <text class="sub" x="380" y="180">Fails by: the glob never matching</text>
  <path class="arrow" d="M 566 172 L 596 202" />

  <rect class="box" x="30" y="230" width="330" height="62" />
  <text class="label" x="48" y="254">Model-requested — on description match</text>
  <text class="mono" x="48" y="276">SKILL.md front-matter · Agent Requested</text>
  <text class="sub" x="380" y="252">Cost: the description, always</text>
  <text class="sub" x="380" y="270">Fails by: never being retrieved</text>
  <path class="arrow" d="M 566 262 L 596 248" />

  <rect class="box" x="30" y="320" width="330" height="62" />
  <text class="label" x="48" y="344">Human-invoked — only when asked for</text>
  <text class="mono" x="48" y="366">@rule-name · /command</text>
  <text class="sub" x="380" y="342">Cost: nothing until used</text>
  <text class="sub" x="380" y="360">Fails by: nobody remembering it</text>
  <path class="arrow" d="M 566 352 L 596 272" />

  <rect class="box" x="30" y="410" width="840" height="58" />
  <text class="label" x="450" y="434" text-anchor="middle">The format argument is about rung one. The engineering decision is how much guidance you move down to rungs two and three.</text>
  <text class="sub" x="450" y="456" text-anchor="middle">Every rung below the first trades a context cost for a retrieval risk, and only one vendor lets you declare which rung a file sits on.</text>
</svg>
