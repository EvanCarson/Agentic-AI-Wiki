<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="at ad">
  <title id="at">Three axes that separate the four formats</title>
  <desc id="ad">Three columns — when the text loads, who can put it there, and what a mistake costs — each with what the axis decides, which format wins on it, and how to check it in your own repository.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .rule   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .45; }
  </style>

  <text class="title" x="20" y="28">Sort by these, not by file name</text>

  <rect class="hero" x="30" y="50" width="250" height="46" />
  <text class="label-inv" x="155" y="79" text-anchor="middle">When it loads</text>
  <rect class="adj" x="325" y="50" width="250" height="46" />
  <text class="label" x="450" y="79" text-anchor="middle">Who can put it there</text>
  <rect class="box" x="620" y="50" width="250" height="46" />
  <text class="label" x="745" y="79" text-anchor="middle">What a mistake costs</text>

  <text class="sub" x="155" y="126" text-anchor="middle">Decides: context budget and</text>
  <text class="sub" x="155" y="143" text-anchor="middle">whether the rule is ever seen</text>
  <text class="sub" x="450" y="126" text-anchor="middle">Decides: whether a fork can</text>
  <text class="sub" x="450" y="143" text-anchor="middle">steer your agent</text>
  <text class="sub" x="745" y="126" text-anchor="middle">Decides: how hard the failure</text>
  <text class="sub" x="745" y="143" text-anchor="middle">is to notice at all</text>

  <path class="rule" d="M 30 160 L 870 160" />

  <text class="sub" x="155" y="186" text-anchor="middle">Winner: Cursor rules —</text>
  <text class="sub" x="155" y="203" text-anchor="middle">the only declarable one</text>
  <text class="sub" x="450" y="186" text-anchor="middle">Winner: user-scope files;</text>
  <text class="sub" x="450" y="203" text-anchor="middle">repo files are untrusted</text>
  <text class="sub" x="745" y="186" text-anchor="middle">Winner: always-on —</text>
  <text class="sub" x="745" y="203" text-anchor="middle">loud, cheap to debug</text>

  <text class="sub" x="155" y="228" text-anchor="middle">Check it: count the tokens</text>
  <text class="sub" x="155" y="245" text-anchor="middle">loaded before your first word</text>
  <text class="sub" x="450" y="228" text-anchor="middle">Check it: open a fork's PR</text>
  <text class="sub" x="450" y="245" text-anchor="middle">and read its instruction files</text>
  <text class="sub" x="745" y="228" text-anchor="middle">Check it: log which files</text>
  <text class="sub" x="745" y="245" text-anchor="middle">loaded, per session</text>

  <rect class="box" x="30" y="258" width="840" height="34" />
  <text class="label" x="450" y="280" text-anchor="middle">Portability is a symlink problem. Activation is an architecture problem.</text>
</svg>
