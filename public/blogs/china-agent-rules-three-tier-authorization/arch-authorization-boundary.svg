<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where the autonomy boundary has to live</title>
  <desc id="d">Two stacked architectures. In the top one the autonomy rule sits inside the system prompt, so the model both proposes and authorises the action and attacker-supplied context can move the boundary. In the bottom one the model only proposes; a separate authorisation gate checks the action against a recorded scope grant and either executes it, escalates it for user approval, or refuses it, writing every outcome to an audit log.</desc>
  <style>
    .box      { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero     { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj      { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper, #fff); text-anchor: middle; }
    .sub      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .sub-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .9; text-anchor: middle; }
    .head     { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: start; }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .dash     { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
    .rule     { stroke: var(--border-soft, #ddd); stroke-width: 1; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="24" y="30">Boundary in the prompt — unenforceable</text>

  <rect class="box" x="24" y="50" width="160" height="70" rx="8" ry="8" />
  <text class="label" x="104" y="80">Context</text>
  <text class="sub" x="104" y="100">incl. untrusted text</text>

  <rect class="adj" x="248" y="50" width="200" height="70" rx="8" ry="8" />
  <text class="label" x="348" y="80">Model</text>
  <text class="sub" x="348" y="100">decides AND authorises</text>

  <rect class="box" x="512" y="50" width="160" height="70" rx="8" ry="8" />
  <text class="label" x="592" y="80">Tool call</text>
  <text class="sub" x="592" y="100">executed</text>

  <rect class="box" x="736" y="50" width="140" height="70" rx="8" ry="8" />
  <text class="label" x="806" y="80">World</text>
  <text class="sub" x="806" y="100">irreversible</text>

  <path class="arrow" d="M 184 85 L 244 85" />
  <path class="arrow" d="M 448 85 L 508 85" />
  <path class="arrow" d="M 672 85 L 732 85" />
  <text class="sub" x="348" y="142">One phrasing in the context moves the boundary</text>

  <line class="rule" x1="24" y1="176" x2="876" y2="176" />

  <text class="head" x="24" y="212">Boundary in the gate — what the three-tier rule requires</text>

  <rect class="box" x="24" y="238" width="160" height="70" rx="8" ry="8" />
  <text class="label" x="104" y="268">Context</text>
  <text class="sub" x="104" y="288">incl. untrusted text</text>

  <rect class="box" x="248" y="238" width="160" height="70" rx="8" ry="8" />
  <text class="label" x="328" y="268">Model</text>
  <text class="sub" x="328" y="288">proposes only</text>

  <rect class="hero" x="472" y="228" width="180" height="90" rx="8" ry="8" />
  <text class="label-inv" x="562" y="262">Authorisation gate</text>
  <text class="sub-inv" x="562" y="284">action &#215; scope grant</text>
  <text class="sub-inv" x="562" y="302">outside the model</text>

  <rect class="adj" x="716" y="188" width="160" height="60" rx="8" ry="8" />
  <text class="label" x="796" y="214">Tier 1 — refuse</text>
  <text class="sub" x="796" y="234">human-only decision</text>

  <rect class="adj" x="716" y="264" width="160" height="60" rx="8" ry="8" />
  <text class="label" x="796" y="290">Tier 2 — escalate</text>
  <text class="sub" x="796" y="310">user approves first</text>

  <rect class="box" x="716" y="340" width="160" height="60" rx="8" ry="8" />
  <text class="label" x="796" y="366">Tier 3 — execute</text>
  <text class="sub" x="796" y="386">within delegated scope</text>

  <path class="arrow" d="M 184 273 L 244 273" />
  <path class="arrow" d="M 408 273 L 468 273" />
  <path class="arrow" d="M 652 262 L 712 222" />
  <path class="arrow" d="M 652 273 L 712 291" />
  <path class="arrow" d="M 652 288 L 712 365" />

  <rect class="box" x="248" y="404" width="404" height="62" rx="8" ry="8" />
  <text class="label" x="450" y="430">Audit log — proposal, tier, grant, outcome</text>
  <text class="sub" x="450" y="452">append-only, not writable by the agent</text>

  <path class="dash" d="M 562 322 L 562 400" />
  <path class="dash" d="M 796 400 L 796 435 L 656 435" />
</svg>
