<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three ways regulators cut the same problem</title>
  <desc id="d">Three columns comparing what each framework classifies. The EU AI Act tiers whole systems by application risk, producing one label per product. China's Implementation Opinions tier individual decisions inside a system, producing a table of actions. The NIST AI Risk Management Framework tiers nothing and instead describes a process an organisation runs.</desc>
  <style>
    .col-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .col-title-inv { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .75; text-anchor: middle; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .9; text-anchor: middle; }
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .foot      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--muted, #888); text-anchor: middle; }
    .box       { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj       { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero      { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="30">What gets classified</text>

  <rect class="adj" x="30" y="58" width="230" height="160" rx="8" ry="8" />
  <text class="col-title" x="145" y="90">EU AI Act</text>
  <text class="sub" x="145" y="120">Tiers the system</text>
  <text class="sub" x="145" y="139">by application risk</text>
  <text class="sub" x="145" y="170">Output: one label</text>
  <text class="sub" x="145" y="189">for the product</text>

  <rect class="hero" x="335" y="58" width="230" height="160" rx="8" ry="8" />
  <text class="col-title-inv" x="450" y="90">CN Implementation Opinions</text>
  <text class="sub-inv" x="450" y="120">Tiers each decision</text>
  <text class="sub-inv" x="450" y="139">inside the system</text>
  <text class="sub-inv" x="450" y="170">Output: a table of</text>
  <text class="sub-inv" x="450" y="189">actions and grants</text>

  <rect class="box" x="640" y="58" width="230" height="160" rx="8" ry="8" />
  <text class="col-title" x="755" y="90">NIST AI RMF</text>
  <text class="sub" x="755" y="120">Tiers nothing;</text>
  <text class="sub" x="755" y="139">describes a process</text>
  <text class="sub" x="755" y="170">Output: a programme</text>
  <text class="sub" x="755" y="189">the org runs</text>

  <text class="foot" x="450" y="256">Only the middle one names a control surface that lives inside the agent loop.</text>
</svg>
