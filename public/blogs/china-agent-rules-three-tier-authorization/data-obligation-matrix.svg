<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Obligations by application class under the Implementation Opinions</title>
  <desc id="d">A three-by-four grid showing how obligations scale with application class. Sensitive sectors such as healthcare, transport, media and public safety carry filing, compliance testing and recall provisions; general commercial deployments carry documented authorisation boundaries and self-testing; low-risk uses such as entertainment and office work rely on self-assessment, reporting and industry self-discipline. The documented three-tier authorisation boundary is required in every class.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: start; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">How the obligations scale with application class</text>

  <text class="body-text" x="332" y="58" style="font-weight:600">Documented</text>
  <text class="body-text" x="332" y="72" style="font-weight:600">tier boundary</text>
  <text class="body-text" x="512" y="58" style="font-weight:600">Filing &amp;</text>
  <text class="body-text" x="512" y="72" style="font-weight:600">compliance testing</text>
  <text class="body-text" x="692" y="58" style="font-weight:600">Recall</text>
  <text class="body-text" x="692" y="72" style="font-weight:600">provisions</text>
  <text class="body-text" x="842" y="58" style="font-weight:600">Who</text>
  <text class="body-text" x="842" y="72" style="font-weight:600">checks</text>

  <text class="row-head" x="228" y="112">Sensitive sectors</text>
  <text class="row-head" x="228" y="130" style="font-weight:400;opacity:.7">health, transport, media</text>
  <rect class="card-accent" x="245" y="88" width="174" height="58" rx="6" />
  <text class="body-text-inv" x="332" y="114">Required</text>
  <text class="body-text-inv" x="332" y="130">before deployment</text>
  <rect class="card-accent" x="425" y="88" width="174" height="58" rx="6" />
  <text class="body-text-inv" x="512" y="122">Mandatory</text>
  <rect class="card-accent" x="605" y="88" width="174" height="58" rx="6" />
  <text class="body-text-inv" x="692" y="122">Yes</text>
  <rect class="card-soft" x="785" y="88" width="90" height="58" rx="6" />
  <text class="body-text" x="830" y="114">Regulator</text>
  <text class="body-text" x="830" y="130">+ sector body</text>

  <text class="row-head" x="228" y="200">General commercial</text>
  <text class="row-head" x="228" y="218" style="font-weight:400;opacity:.7">most enterprise agents</text>
  <rect class="card-accent" x="245" y="176" width="174" height="58" rx="6" />
  <text class="body-text-inv" x="332" y="202">Required</text>
  <text class="body-text-inv" x="332" y="218">before deployment</text>
  <rect class="card-soft" x="425" y="176" width="174" height="58" rx="6" />
  <text class="body-text" x="512" y="202">Self-testing,</text>
  <text class="body-text" x="512" y="218">reporting</text>
  <rect class="card-neutral" x="605" y="176" width="174" height="58" rx="6" />
  <text class="body-text" x="692" y="210">Not specified</text>
  <rect class="card-soft" x="785" y="176" width="90" height="58" rx="6" />
  <text class="body-text" x="830" y="210">You</text>

  <text class="row-head" x="228" y="288">Low-risk uses</text>
  <text class="row-head" x="228" y="306" style="font-weight:400;opacity:.7">entertainment, office</text>
  <rect class="card-accent" x="245" y="264" width="174" height="58" rx="6" />
  <text class="body-text-inv" x="332" y="290">Required</text>
  <text class="body-text-inv" x="332" y="306">before deployment</text>
  <rect class="card-neutral" x="425" y="264" width="174" height="58" rx="6" />
  <text class="body-text" x="512" y="290">Self-assessment</text>
  <text class="body-text" x="512" y="306">tooling</text>
  <rect class="card-neutral" x="605" y="264" width="174" height="58" rx="6" />
  <text class="body-text" x="692" y="298">No</text>
  <rect class="card-neutral" x="785" y="264" width="90" height="58" rx="6" />
  <text class="body-text" x="830" y="290">Industry</text>
  <text class="body-text" x="830" y="306">self-discipline</text>

  <rect class="card-accent" x="245" y="352" width="16" height="16" rx="3" />
  <text class="legend-text" x="269" y="365">Applies in full</text>
  <rect class="card-soft" x="395" y="352" width="16" height="16" rx="3" />
  <text class="legend-text" x="419" y="365">Lighter form</text>
  <rect class="card-neutral" x="545" y="352" width="16" height="16" rx="3" />
  <text class="legend-text" x="569" y="365">Not imposed</text>
</svg>
