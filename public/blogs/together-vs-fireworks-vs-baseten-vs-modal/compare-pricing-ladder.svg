<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">How far down the pricing ladder each provider lets you climb</title>
  <desc id="d">Four columns for Together AI, Fireworks AI, Baseten and Modal, compared across three rungs: the per-token entry rung, the dedicated per-hour rung, and the bottom rung of raw capacity. Together offers all three including raw GPU clusters, Fireworks stops at dedicated hourly instances, Baseten offers per-token model APIs plus dedicated deployments brokered across many clouds, and Modal has no per-token rung at all — it bills GPU seconds from the start.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .head  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .cell  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .row   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="row" x="10" y="98">PER TOKEN</text>
  <text class="row" x="10" y="168">PER HOUR</text>
  <text class="row" x="10" y="238">RAW CAPACITY</text>

  <rect class="hero" x="115" y="18" width="175" height="46" rx="8" />
  <text class="head-inv" x="202" y="40" text-anchor="middle">Together AI</text>
  <text class="cell-inv" x="202" y="56" text-anchor="middle">all three rungs</text>

  <rect class="adj" x="300" y="18" width="175" height="46" rx="8" />
  <text class="head" x="387" y="40" text-anchor="middle">Fireworks AI</text>
  <text class="cell" x="387" y="56" text-anchor="middle">two rungs</text>

  <rect class="adj" x="485" y="18" width="175" height="46" rx="8" />
  <text class="head" x="572" y="40" text-anchor="middle">Baseten</text>
  <text class="cell" x="572" y="56" text-anchor="middle">two rungs, brokered</text>

  <rect class="box" x="670" y="18" width="185" height="46" rx="8" />
  <text class="head" x="762" y="40" text-anchor="middle">Modal</text>
  <text class="cell" x="762" y="56" text-anchor="middle">one rung, lower down</text>

  <rect class="adj" x="115" y="76" width="175" height="54" rx="8" />
  <text class="cell" x="202" y="98" text-anchor="middle">Broadest open catalog.</text>
  <text class="cell" x="202" y="114" text-anchor="middle">$1.04/M on 70B class.</text>

  <rect class="hero" x="300" y="76" width="175" height="54" rx="8" />
  <text class="cell-inv" x="387" y="98" text-anchor="middle">Cheapest of the four.</text>
  <text class="cell-inv" x="387" y="114" text-anchor="middle">$0.90/M on 70B class.</text>

  <rect class="adj" x="485" y="76" width="175" height="54" rx="8" />
  <text class="cell" x="572" y="98" text-anchor="middle">Model APIs on a</text>
  <text class="cell" x="572" y="114" text-anchor="middle">curated shortlist.</text>

  <rect class="box" x="670" y="76" width="185" height="54" rx="8" />
  <text class="cell" x="762" y="98" text-anchor="middle">None. You are billed</text>
  <text class="cell" x="762" y="114" text-anchor="middle">for GPU seconds.</text>

  <rect class="adj" x="115" y="146" width="175" height="54" rx="8" />
  <text class="cell" x="202" y="168" text-anchor="middle">Dedicated endpoint,</text>
  <text class="cell" x="202" y="184" text-anchor="middle">H100 at $6.49/hr.</text>

  <rect class="adj" x="300" y="146" width="175" height="54" rx="8" />
  <text class="cell" x="387" y="168" text-anchor="middle">On-demand deploy,</text>
  <text class="cell" x="387" y="184" text-anchor="middle">H100/H200 at $7/hr.</text>

  <rect class="hero" x="485" y="146" width="175" height="54" rx="8" />
  <text class="cell-inv" x="572" y="168" text-anchor="middle">Dedicated deployments,</text>
  <text class="cell-inv" x="572" y="184" text-anchor="middle">H100 at $6.50/hr.</text>

  <rect class="adj" x="670" y="146" width="185" height="54" rx="8" />
  <text class="cell" x="762" y="168" text-anchor="middle">Per-second billing with</text>
  <text class="cell" x="762" y="184" text-anchor="middle">scale to zero.</text>

  <rect class="hero" x="115" y="216" width="175" height="54" rx="8" />
  <text class="cell-inv" x="202" y="238" text-anchor="middle">HGX clusters from</text>
  <text class="cell-inv" x="202" y="254" text-anchor="middle">$3.99/hr per GPU.</text>

  <rect class="box" x="300" y="216" width="175" height="54" rx="8" />
  <text class="cell" x="387" y="238" text-anchor="middle">Not offered. The</text>
  <text class="cell" x="387" y="254" text-anchor="middle">ladder stops here.</text>

  <rect class="box" x="485" y="216" width="175" height="54" rx="8" />
  <text class="cell" x="572" y="238" text-anchor="middle">Brokered across many</text>
  <text class="cell" x="572" y="254" text-anchor="middle">clouds, not resold raw.</text>

  <rect class="adj" x="670" y="216" width="185" height="54" rx="8" />
  <text class="cell" x="762" y="238" text-anchor="middle">Your own container and</text>
  <text class="cell" x="762" y="254" text-anchor="middle">serving engine.</text>

  <text class="row" x="10" y="290">THE QUESTION IS NOT WHICH RUNG IS CHEAPEST TODAY BUT WHETHER YOU CAN CHANGE RUNGS WITHOUT MIGRATING</text>
</svg>
