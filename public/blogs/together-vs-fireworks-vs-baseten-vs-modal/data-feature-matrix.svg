<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Where each inference provider leans hardest</title>
  <desc id="d">Feature matrix with four rows for Together AI, Fireworks AI, Baseten and Modal, and five columns for open-model catalog breadth, custom and fine-tuned weights, the ladder from per-token to dedicated capacity, cold-start behaviour, and whether you can bring your own serving engine. Together leads on catalog and ladder, Fireworks on per-token price and prefix caching, Baseten on custom weights, and Modal on cold starts and engine control.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .medium { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .colhead { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .rowhead { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .key     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
  </style>

  <text class="chart-title" x="30" y="36">Four bets on the same workload</text>

  <text class="colhead" x="222" y="66" text-anchor="middle">CATALOG</text>
  <text class="colhead" x="352" y="66" text-anchor="middle">CUSTOM WEIGHTS</text>
  <text class="colhead" x="482" y="66" text-anchor="middle">LADDER</text>
  <text class="colhead" x="612" y="66" text-anchor="middle">COLD START</text>
  <text class="colhead" x="752" y="66" text-anchor="middle">OWN ENGINE</text>

  <text class="rowhead" x="30" y="106">Together AI</text>
  <rect class="strong" x="162" y="80" width="120" height="44" rx="6" />
  <text class="cell-inv" x="222" y="107" text-anchor="middle">Broadest</text>
  <rect class="medium" x="292" y="80" width="120" height="44" rx="6" />
  <text class="cell" x="352" y="107" text-anchor="middle">Fine-tuning</text>
  <rect class="strong" x="422" y="80" width="120" height="44" rx="6" />
  <text class="cell-inv" x="482" y="107" text-anchor="middle">All three rungs</text>
  <rect class="medium" x="552" y="80" width="120" height="44" rx="6" />
  <text class="cell" x="612" y="107" text-anchor="middle">Warm serverless</text>
  <rect class="weak" x="682" y="80" width="140" height="44" rx="6" />
  <text class="cell" x="752" y="107" text-anchor="middle">Their engine</text>

  <text class="rowhead" x="30" y="164">Fireworks AI</text>
  <rect class="medium" x="162" y="138" width="120" height="44" rx="6" />
  <text class="cell" x="222" y="165" text-anchor="middle">Wide</text>
  <rect class="medium" x="292" y="138" width="120" height="44" rx="6" />
  <text class="cell" x="352" y="165" text-anchor="middle">LoRA + tuning</text>
  <rect class="medium" x="422" y="138" width="120" height="44" rx="6" />
  <text class="cell" x="482" y="165" text-anchor="middle">Stops at hourly</text>
  <rect class="medium" x="552" y="138" width="120" height="44" rx="6" />
  <text class="cell" x="612" y="165" text-anchor="middle">Warm serverless</text>
  <rect class="weak" x="682" y="138" width="140" height="44" rx="6" />
  <text class="cell" x="752" y="165" text-anchor="middle">FireAttention</text>

  <text class="rowhead" x="30" y="222">Baseten</text>
  <rect class="weak" x="162" y="196" width="120" height="44" rx="6" />
  <text class="cell" x="222" y="223" text-anchor="middle">Curated</text>
  <rect class="strong" x="292" y="196" width="120" height="44" rx="6" />
  <text class="cell-inv" x="352" y="223" text-anchor="middle">The whole point</text>
  <rect class="medium" x="422" y="196" width="120" height="44" rx="6" />
  <text class="cell" x="482" y="223" text-anchor="middle">Brokered hourly</text>
  <rect class="medium" x="552" y="196" width="120" height="44" rx="6" />
  <text class="cell" x="612" y="223" text-anchor="middle">Container cache</text>
  <rect class="medium" x="682" y="196" width="140" height="44" rx="6" />
  <text class="cell" x="752" y="223" text-anchor="middle">TensorRT / Triton</text>

  <text class="rowhead" x="30" y="280">Modal</text>
  <rect class="weak" x="162" y="254" width="120" height="44" rx="6" />
  <text class="cell" x="222" y="281" text-anchor="middle">None hosted</text>
  <rect class="medium" x="292" y="254" width="120" height="44" rx="6" />
  <text class="cell" x="352" y="281" text-anchor="middle">Anything you run</text>
  <rect class="weak" x="422" y="254" width="120" height="44" rx="6" />
  <text class="cell" x="482" y="281" text-anchor="middle">One rung only</text>
  <rect class="strong" x="552" y="254" width="120" height="44" rx="6" />
  <text class="cell-inv" x="612" y="281" text-anchor="middle">Sub-second</text>
  <rect class="strong" x="682" y="254" width="140" height="44" rx="6" />
  <text class="cell-inv" x="752" y="281" text-anchor="middle">Yours entirely</text>

  <rect class="strong" x="30" y="330" width="16" height="16" rx="3" />
  <text class="key" x="54" y="343">Strongest bet</text>
  <rect class="medium" x="170" y="330" width="16" height="16" rx="3" />
  <text class="key" x="194" y="343">Competent</text>
  <rect class="weak" x="300" y="330" width="16" height="16" rx="3" />
  <text class="key" x="324" y="343">Not the pitch</text>

  <text class="colhead" x="30" y="382">NO ROW IS STRONG EVERYWHERE — PICK THE COLUMN YOUR WORKLOAD ACTUALLY LIVES IN</text>
</svg>
