<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Concurrent workloads needed to reach one dedicated GPU-hour of token spend</title>
  <desc id="d">Horizontal bar chart showing how many concurrent workloads of each kind it takes to spend, in serverless per-token fees, what one dedicated H100 hour costs. A chat product needs roughly 390 concurrent users, a retrieval question-answering assistant roughly 32, and a multi-step coding agent roughly 12. The agent bar is barely visible next to the chat bar: an agent reaches the break-even more than thirty times sooner.</desc>
  <style>
    .bar-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .bar-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .bar-mute { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .grid     { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 3 4; }
    .axis     { stroke: var(--ink); stroke-width: 1.25; opacity: .5; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .key      { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .keysub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .val      { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; fill: var(--ink); }
    .tick     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .55; }
    .note     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="chart-title" x="30" y="42">Concurrent workloads that spend one H100-hour ($7.00) in per-token fees</text>

  <line class="grid" x1="330" y1="66" x2="330" y2="272" />
  <line class="grid" x1="490" y1="66" x2="490" y2="272" />
  <line class="grid" x1="650" y1="66" x2="650" y2="272" />
  <line class="grid" x1="810" y1="66" x2="810" y2="272" />

  <text class="key" x="30" y="98">Chat product</text>
  <text class="keysub" x="30" y="114">~20K tokens/user/hour</text>
  <rect class="bar-mute" x="170" y="80" width="622" height="46" rx="4" />
  <text class="val" x="778" y="110" text-anchor="end">≈ 390 users</text>

  <text class="key" x="30" y="176">RAG assistant</text>
  <text class="keysub" x="30" y="192">~240K tokens/session/hour</text>
  <rect class="bar-adj" x="170" y="158" width="51" height="46" rx="4" />
  <text class="val" x="235" y="188">≈ 32 sessions</text>

  <text class="key" x="30" y="254">Coding agent</text>
  <text class="keysub" x="30" y="270">~650K tokens/worker/hour</text>
  <rect class="bar-hero" x="170" y="236" width="19" height="46" rx="4" />
  <text class="val" x="203" y="266">≈ 12 workers</text>

  <line class="axis" x1="170" y1="296" x2="810" y2="296" />
  <text class="tick" x="170" y="314" text-anchor="middle">0</text>
  <text class="tick" x="330" y="314" text-anchor="middle">100</text>
  <text class="tick" x="490" y="314" text-anchor="middle">200</text>
  <text class="tick" x="650" y="314" text-anchor="middle">300</text>
  <text class="tick" x="810" y="314" text-anchor="middle">400</text>

  <text class="note" x="30" y="356">ILLUSTRATIVE. $7.00/HR H100 AGAINST $0.90/M TOKENS = 7.8M TOKENS PER GPU-HOUR OF SPEND</text>
  <text class="note" x="30" y="374">AN AGENT RE-SENDS ITS CONTEXT EVERY STEP, SO ITS TOKENS-PER-HOUR IS AN ORDER OF MAGNITUDE HIGHER</text>
  <text class="note" x="30" y="392">CROSSING THE LINE IS NOT THE SAME AS BEING ABLE TO SERVE IT — MEASURE BEFORE YOU MOVE</text>
</svg>
