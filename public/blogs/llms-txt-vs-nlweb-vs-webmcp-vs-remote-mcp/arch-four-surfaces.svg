<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="fst fsd">
  <title id="fst">Where each agent-facing surface sits</title>
  <desc id="fsd">Four surfaces between a site and an agent. A static llms.txt file and a server-side NLWeb ask endpoint both sit on the publisher's own origin and are pulled by a crawler or an assistant. WebMCP registers tools inside the rendered page in the user's browser, so calls execute as the page's own JavaScript in the signed-in session. A remote MCP server is a separate authenticated endpoint the agent connects to directly.</desc>
  <style>
    .fs-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .fs-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .fs-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .fs-edge { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 6 5; rx: 10; ry: 10; opacity: .7; }
    .fs-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .fs-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .fs-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .fs-hd   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .fs-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#fsa); }
  </style>
  <defs>
    <marker id="fsa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="fs-hd" x="30" y="28">Your side</text>
  <text class="fs-hd" x="660" y="28">The agent</text>

  <rect class="fs-edge" x="20" y="44" width="420" height="430" />

  <rect class="fs-box" x="40" y="70" width="240" height="64" />
  <text class="fs-lbl" x="160" y="96" text-anchor="middle">llms.txt</text>
  <text class="fs-sub" x="160" y="118" text-anchor="middle">a static file on your origin</text>

  <rect class="fs-adj" x="40" y="166" width="240" height="64" />
  <text class="fs-lbl" x="160" y="192" text-anchor="middle">NLWeb /ask</text>
  <text class="fs-sub" x="160" y="214" text-anchor="middle">your server answers questions</text>

  <rect class="fs-adj" x="40" y="262" width="240" height="78" />
  <text class="fs-lbl" x="160" y="288" text-anchor="middle">WebMCP tools</text>
  <text class="fs-sub" x="160" y="310" text-anchor="middle">registered by the page's JS,</text>
  <text class="fs-sub" x="160" y="330" text-anchor="middle">inside the signed-in session</text>

  <rect class="fs-hero" x="40" y="372" width="240" height="78" />
  <text class="fs-inv" x="160" y="398" text-anchor="middle">Remote MCP server</text>
  <text class="fs-inv" x="160" y="420" text-anchor="middle">an endpoint with its own</text>
  <text class="fs-inv" x="160" y="440" text-anchor="middle">identity and authorisation</text>

  <path class="fs-arr" d="M 280 102 L 616 102" />
  <text class="fs-sub" x="448" y="92" text-anchor="middle">fetched, if anything fetches it</text>

  <path class="fs-arr" d="M 280 198 L 616 198" />
  <text class="fs-sub" x="448" y="188" text-anchor="middle">queried by an assistant</text>

  <path class="fs-arr" d="M 280 300 L 616 300" />
  <text class="fs-sub" x="448" y="290" text-anchor="middle">called in the browser tab</text>

  <path class="fs-arr" d="M 280 410 L 616 410" />
  <text class="fs-sub" x="448" y="400" text-anchor="middle">connected to, with a token</text>

  <rect class="fs-box" x="620" y="70" width="240" height="64" />
  <text class="fs-lbl" x="740" y="106" text-anchor="middle">A crawler</text>

  <rect class="fs-box" x="620" y="166" width="240" height="64" />
  <text class="fs-lbl" x="740" y="202" text-anchor="middle">An assistant</text>

  <rect class="fs-box" x="620" y="262" width="240" height="78" />
  <text class="fs-lbl" x="740" y="294" text-anchor="middle">A browser agent</text>
  <text class="fs-sub" x="740" y="318" text-anchor="middle">in the user's own tab</text>

  <rect class="fs-box" x="620" y="372" width="240" height="78" />
  <text class="fs-lbl" x="740" y="404" text-anchor="middle">Any MCP client</text>
  <text class="fs-sub" x="740" y="428" text-anchor="middle">you can identify and revoke</text>
</svg>
