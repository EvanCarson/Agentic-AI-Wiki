<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="rat rad">
  <title id="rat">Read, ask, act — which surface serves each job</title>
  <desc id="rad">Three columns for the three jobs an agent might need from a site. For reading your content, a markdown copy of the page is what is actually fetched. For asking questions over your catalogue, NLWeb or your own search endpoint applies. For acting on the user's behalf, only a remote MCP server gives you a caller identity you can authorise and revoke; WebMCP acts inside the user's own session instead.</desc>
  <style>
    .ra-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ra-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ra-head { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .ra-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .ra-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .ra-side { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .ra-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="ra-head" x="280" y="34" text-anchor="middle">Read my content</text>
  <text class="ra-head" x="520" y="34" text-anchor="middle">Ask my data</text>
  <text class="ra-head" x="760" y="34" text-anchor="middle">Act for the user</text>

  <text class="ra-side" x="20" y="86">reach for</text>
  <rect class="ra-hero" x="180" y="50" width="200" height="60" />
  <text class="ra-inv" x="280" y="76" text-anchor="middle">a .md copy of</text>
  <text class="ra-inv" x="280" y="96" text-anchor="middle">each page</text>
  <rect class="ra-hero" x="420" y="50" width="200" height="60" />
  <text class="ra-inv" x="520" y="76" text-anchor="middle">NLWeb, or your</text>
  <text class="ra-inv" x="520" y="96" text-anchor="middle">own search API</text>
  <rect class="ra-hero" x="660" y="50" width="200" height="60" />
  <text class="ra-inv" x="760" y="76" text-anchor="middle">a remote MCP</text>
  <text class="ra-inv" x="760" y="96" text-anchor="middle">server</text>

  <text class="ra-side" x="20" y="166">who is liable</text>
  <rect class="ra-box" x="180" y="130" width="200" height="60" />
  <text class="ra-lbl" x="280" y="156" text-anchor="middle">nobody — it is</text>
  <text class="ra-lbl" x="280" y="176" text-anchor="middle">a public read</text>
  <rect class="ra-box" x="420" y="130" width="200" height="60" />
  <text class="ra-lbl" x="520" y="156" text-anchor="middle">you, for what</text>
  <text class="ra-lbl" x="520" y="176" text-anchor="middle">you answer</text>
  <rect class="ra-box" x="660" y="130" width="200" height="60" />
  <text class="ra-lbl" x="760" y="156" text-anchor="middle">the identity in</text>
  <text class="ra-lbl" x="760" y="176" text-anchor="middle">the token</text>

  <text class="ra-sub" x="450" y="232" text-anchor="middle">WebMCP belongs in no column: it acts, but inside the user's session, so the caller has no identity of its own.</text>
  <text class="ra-sub" x="450" y="258" text-anchor="middle">llms.txt belongs in no column either — it is a hint about the first one, not a way of serving it.</text>
</svg>
