<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="emt emd">
  <title id="emt">Evidence that something reads each surface</title>
  <desc id="emd">Four rows, one per surface, against three columns: whether a consumer provably reads it, how much upkeep it needs when the site changes, and what it can authorise. A remote MCP server is strong on all three. WebMCP has a browser implementation behind a flag. NLWeb has infrastructure backers but flat adoption. llms.txt has measured evidence against it: a server-log analysis of about 137,000 domains published in June 2026 found 97 percent of published files received no fetches at all.</desc>
  <style>
    .em-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .em-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .em-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .em-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .em-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .em-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .em-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .em-sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>
  <text class="em-ttl" x="20" y="28">Does anything read it, and what does it let you do?</text>
  <text class="em-sub" x="285" y="58" text-anchor="middle">a consumer that reads it</text>
  <text class="em-sub" x="525" y="58" text-anchor="middle">upkeep as the site changes</text>
  <text class="em-sub" x="765" y="58" text-anchor="middle">what it can authorise</text>

  <text class="em-row" x="20" y="104">llms.txt</text>
  <rect class="em-weak" x="170" y="80" width="230" height="36" />
  <text class="em-cell" x="285" y="104" text-anchor="middle">97% never fetched</text>
  <rect class="em-mid" x="410" y="80" width="230" height="36" />
  <text class="em-cell" x="525" y="104" text-anchor="middle">goes stale silently</text>
  <rect class="em-weak" x="650" y="80" width="230" height="36" />
  <text class="em-cell" x="765" y="104" text-anchor="middle">nothing</text>

  <text class="em-row" x="20" y="154">NLWeb /ask</text>
  <rect class="em-mid" x="170" y="130" width="230" height="36" />
  <text class="em-cell" x="285" y="154" text-anchor="middle">backers, flat adoption</text>
  <rect class="em-mid" x="410" y="130" width="230" height="36" />
  <text class="em-cell" x="525" y="154" text-anchor="middle">an index to keep fresh</text>
  <rect class="em-mid" x="650" y="130" width="230" height="36" />
  <text class="em-cell" x="765" y="154" text-anchor="middle">reads of your own data</text>

  <text class="em-row" x="20" y="204">WebMCP</text>
  <rect class="em-mid" x="170" y="180" width="230" height="36" />
  <text class="em-cell" x="285" y="204" text-anchor="middle">one browser, behind a flag</text>
  <rect class="em-weak" x="410" y="180" width="230" height="36" />
  <text class="em-cell" x="525" y="204" text-anchor="middle">tied to your UI code</text>
  <rect class="em-weak" x="650" y="180" width="230" height="36" />
  <text class="em-cell" x="765" y="204" text-anchor="middle">the user's own session</text>

  <text class="em-row" x="20" y="254">Remote MCP server</text>
  <rect class="em-strong" x="170" y="230" width="230" height="36" />
  <text class="em-inv" x="285" y="254" text-anchor="middle">every major client</text>
  <rect class="em-strong" x="410" y="230" width="230" height="36" />
  <text class="em-inv" x="525" y="254" text-anchor="middle">versioned like an API</text>
  <rect class="em-strong" x="650" y="230" width="230" height="36" />
  <text class="em-inv" x="765" y="254" text-anchor="middle">a caller you can revoke</text>

  <text class="em-sub" x="20" y="312">Accent is strong, the lighter tint is partial, plain is weak or absent.</text>
  <text class="em-sub" x="20" y="338">The 97% figure is a server-log analysis of roughly 137,000 domains published in June 2026,</text>
  <text class="em-sub" x="20" y="360">and GPTBot accounted for 4.51% of the fetches that did happen.</text>
</svg>
