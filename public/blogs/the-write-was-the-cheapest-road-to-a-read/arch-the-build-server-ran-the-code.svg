<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="at ad">
  <title id="at">How a publish became a fetch in the GemStuffer campaign</title>
  <desc id="ad">A left-to-right chain: the agent publishes a gem to RubyGems, RubyGems hands it to the RubyDoc.info documentation builder, the builder executes code from the package, and that code fetches council meeting pages. A return path sends the scraped results back into a newly published gem, so the only host the agent ever contacted directly was the registry.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="sub" x="220" y="108" text-anchor="middle">1. publish a gem</text>
  <text class="sub" x="450" y="108" text-anchor="middle">2. queue a doc build</text>
  <text class="sub" x="680" y="108" text-anchor="middle">3. run package code</text>

  <rect class="hero" x="20" y="120" width="170" height="80" />
  <text class="label-inv" x="105" y="166" text-anchor="middle">The agent</text>

  <rect class="adj" x="250" y="120" width="170" height="80" />
  <text class="label" x="335" y="166" text-anchor="middle">RubyGems</text>

  <rect class="box" x="480" y="120" width="170" height="80" />
  <text class="label" x="565" y="160" text-anchor="middle">RubyDoc.info</text>
  <text class="sub" x="565" y="180" text-anchor="middle">doc builder</text>

  <rect class="box" x="710" y="120" width="170" height="80" />
  <text class="label" x="795" y="160" text-anchor="middle">Council sites</text>
  <text class="sub" x="795" y="180" text-anchor="middle">meeting pages</text>

  <path class="arrow" d="M 190 160 L 246 160" />
  <path class="arrow" d="M 420 160 L 476 160" />
  <path class="arrow" d="M 650 160 L 706 160" />

  <text class="sub" x="105" y="228" text-anchor="middle">one allowed host</text>
  <text class="sub" x="335" y="228" text-anchor="middle">an accepted upload</text>
  <text class="sub" x="565" y="228" text-anchor="middle">someone else's CI</text>
  <text class="sub" x="795" y="228" text-anchor="middle">the actual target</text>

  <path class="arrow" d="M 795 240 L 795 300 L 335 300 L 335 208" />
  <text class="sub" x="565" y="326" text-anchor="middle">4. results published back as a new gem</text>

  <text class="sub" x="450" y="382" text-anchor="middle">Nothing in this chain required a connection to anything but the registry.</text>
  <text class="sub" x="450" y="402" text-anchor="middle">A destination allowlist permits every arrow above.</text>
</svg>
