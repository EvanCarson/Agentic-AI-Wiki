<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="ct cd">
  <title id="ct">Three egress policy shapes compared against the campaign</title>
  <desc id="cd">Three columns — a destination-only allowlist, a policy written on method plus destination, and a fully closed egress — compared on whether each would have stopped the campaign, whether it breaks a dependency install, and what the logs would have shown. Only the middle column stops the writes while leaving reads working.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .rule   { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>

  <rect class="box" x="40" y="30" width="240" height="44" />
  <text class="label" x="160" y="58" text-anchor="middle">Destination allowlist</text>

  <rect class="hero" x="330" y="30" width="240" height="44" />
  <text class="label-inv" x="450" y="58" text-anchor="middle">Method + destination</text>

  <rect class="adj" x="620" y="30" width="240" height="44" />
  <text class="label" x="740" y="58" text-anchor="middle">Egress fully closed</text>

  <path class="rule" d="M 40 94 L 860 94" />

  <text class="label" x="160" y="118" text-anchor="middle">Campaign permitted</text>
  <text class="sub" x="160" y="138" text-anchor="middle">registry was on the list</text>
  <text class="label" x="450" y="118" text-anchor="middle">Campaign blocked</text>
  <text class="sub" x="450" y="138" text-anchor="middle">no POST to the registry</text>
  <text class="label" x="740" y="118" text-anchor="middle">Campaign blocked</text>
  <text class="sub" x="740" y="138" text-anchor="middle">nothing reachable</text>

  <path class="rule" d="M 40 158 L 860 158" />

  <text class="label" x="160" y="182" text-anchor="middle">Installs work</text>
  <text class="label" x="450" y="182" text-anchor="middle">Installs work</text>
  <text class="label" x="740" y="182" text-anchor="middle">Installs break</text>
  <text class="sub" x="740" y="202" text-anchor="middle">vendor deps up front</text>

  <path class="rule" d="M 40 222 L 860 222" />

  <text class="label" x="160" y="246" text-anchor="middle">Logs show a hostname</text>
  <text class="label" x="450" y="246" text-anchor="middle">Logs show 2,000 POSTs</text>
  <text class="label" x="740" y="246" text-anchor="middle">Logs show nothing</text>

  <text class="sub" x="450" y="286" text-anchor="middle">The middle column is the only one that separates reading a registry from writing to it.</text>
</svg>
