<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="dt dd">
  <title id="dt">What an application forwards into an agent harness</title>
  <desc id="dd">A four by four matrix. A session or thread identifier usually comes from outside, reaches the argument vector, is almost never reviewed as a risk, and can edit policy. A model name often comes from outside, reaches the argument vector, is sometimes reviewed, and affects cost only. A working directory often comes from outside, reaches the argument vector, is sometimes reviewed, and can edit policy. A config or profile name sometimes comes from outside, reaches the argument vector, is rarely reviewed, and can edit policy.</desc>
  <style>
    .dm-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .dm-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .dm-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .dm-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .dm-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .dm-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .dm-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .dm-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .dm-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="dm-ttl" x="20" y="34">What you forward, and what it can become</text>

  <text class="dm-col" x="295" y="76" text-anchor="middle">From outside</text>
  <text class="dm-col" x="465" y="76" text-anchor="middle">Reaches argv</text>
  <text class="dm-col" x="635" y="76" text-anchor="middle">Reviewed as a risk</text>
  <text class="dm-col" x="805" y="76" text-anchor="middle">Can edit policy</text>

  <text class="dm-row" x="20" y="118">Session or thread ID</text>
  <rect class="dm-strong" x="215" y="92" width="160" height="40" />
  <text class="dm-inv"  x="295" y="117" text-anchor="middle">Usually</text>
  <rect class="dm-strong" x="385" y="92" width="160" height="40" />
  <text class="dm-inv"  x="465" y="117" text-anchor="middle">Yes</text>
  <rect class="dm-strong" x="555" y="92" width="160" height="40" />
  <text class="dm-inv"  x="635" y="117" text-anchor="middle">Almost never</text>
  <rect class="dm-strong" x="725" y="92" width="160" height="40" />
  <text class="dm-inv"  x="805" y="117" text-anchor="middle">Yes</text>

  <text class="dm-row" x="20" y="178">Model name</text>
  <rect class="dm-mid"    x="215" y="152" width="160" height="40" />
  <text class="dm-cell" x="295" y="177" text-anchor="middle">Often</text>
  <rect class="dm-strong" x="385" y="152" width="160" height="40" />
  <text class="dm-inv"  x="465" y="177" text-anchor="middle">Yes</text>
  <rect class="dm-mid"    x="555" y="152" width="160" height="40" />
  <text class="dm-cell" x="635" y="177" text-anchor="middle">Sometimes</text>
  <rect class="dm-weak"   x="725" y="152" width="160" height="40" />
  <text class="dm-cell" x="805" y="177" text-anchor="middle">Cost only</text>

  <text class="dm-row" x="20" y="238">Working directory</text>
  <rect class="dm-mid"    x="215" y="212" width="160" height="40" />
  <text class="dm-cell" x="295" y="237" text-anchor="middle">Often</text>
  <rect class="dm-strong" x="385" y="212" width="160" height="40" />
  <text class="dm-inv"  x="465" y="237" text-anchor="middle">Yes</text>
  <rect class="dm-mid"    x="555" y="212" width="160" height="40" />
  <text class="dm-cell" x="635" y="237" text-anchor="middle">Sometimes</text>
  <rect class="dm-strong" x="725" y="212" width="160" height="40" />
  <text class="dm-inv"  x="805" y="237" text-anchor="middle">Yes</text>

  <text class="dm-row" x="20" y="298">Config or profile name</text>
  <rect class="dm-mid"    x="215" y="272" width="160" height="40" />
  <text class="dm-cell" x="295" y="297" text-anchor="middle">Sometimes</text>
  <rect class="dm-strong" x="385" y="272" width="160" height="40" />
  <text class="dm-inv"  x="465" y="297" text-anchor="middle">Yes</text>
  <rect class="dm-strong" x="555" y="272" width="160" height="40" />
  <text class="dm-inv"  x="635" y="297" text-anchor="middle">Rarely</text>
  <rect class="dm-strong" x="725" y="272" width="160" height="40" />
  <text class="dm-inv"  x="805" y="297" text-anchor="middle">Yes</text>

  <rect class="dm-strong" x="20"  y="344" width="18" height="14" />
  <text class="dm-leg" x="48"  y="356">Contributes most</text>
  <rect class="dm-mid"    x="230" y="344" width="18" height="14" />
  <text class="dm-leg" x="258" y="356">Partly</text>
  <rect class="dm-weak"   x="400" y="344" width="18" height="14" />
  <text class="dm-leg" x="428" y="356">Little</text>
</svg>
