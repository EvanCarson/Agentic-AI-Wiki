<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="at ad">
  <title id="at">How an injected flag reaches the tool list</title>
  <desc id="ad">Two separate paths through an agent harness. Along the configuration path, an application forwards an untrusted session identifier into the SDK, which passes it into the Claude CLI's argument vector, where a leading hyphen lets it be read as an --mcp-config flag defining a stdio MCP server. That produces an arbitrary command at CLI startup and leaves a tool in the session's list. Along the separate tool-call path, the model proposes a tool call and the SDK permission gate approves it against the session's list, without any check on who wrote that list.</desc>
  <style>
    .ab-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ab-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ab-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ab-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .ab-sec  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .ab-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .ab-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .ab-sub  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); opacity: .7; }
    .ab-subi { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--paper); opacity: .85; }
    .ab-note { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .ab-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#abarr); }
  </style>
  <defs>
    <marker id="abarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ab-ttl" x="20" y="34">Two paths in, one tool list</text>

  <text class="ab-sec" x="24" y="66">CONFIGURATION PATH</text>

  <rect class="ab-box" x="24" y="78" width="178" height="72" />
  <text class="ab-lbl" x="113" y="106" text-anchor="middle">Application</text>
  <text class="ab-sub" x="113" y="126" text-anchor="middle">session_id</text>

  <path class="ab-arr" d="M 202 114 L 230 114" />

  <rect class="ab-box" x="232" y="78" width="196" height="72" />
  <text class="ab-lbl" x="330" y="106" text-anchor="middle">claude-agent-sdk</text>
  <text class="ab-sub" x="330" y="126" text-anchor="middle">resume=&lt;value&gt;</text>

  <path class="ab-arr" d="M 428 114 L 456 114" />

  <rect class="ab-hero" x="458" y="78" width="178" height="72" />
  <text class="ab-inv" x="547" y="106" text-anchor="middle">Claude CLI</text>
  <text class="ab-subi" x="547" y="126" text-anchor="middle">argv[]</text>

  <path class="ab-arr" d="M 636 114 L 664 114" />

  <rect class="ab-adj" x="666" y="78" width="210" height="72" />
  <text class="ab-lbl" x="771" y="106" text-anchor="middle">Flag, not data</text>
  <text class="ab-sub" x="771" y="126" text-anchor="middle">--mcp-config</text>

  <path class="ab-arr" d="M 771 150 L 771 212" />

  <rect class="ab-box" x="610" y="214" width="266" height="60" />
  <text class="ab-lbl" x="743" y="250" text-anchor="middle">Arbitrary command at startup</text>

  <path class="ab-arr" d="M 743 274 L 743 302" />

  <rect class="ab-box" x="610" y="304" width="266" height="60" />
  <text class="ab-lbl" x="743" y="340" text-anchor="middle">Tool stays in the session list</text>

  <text class="ab-sec" x="24" y="256">TOOL-CALL PATH</text>

  <rect class="ab-box" x="24" y="268" width="230" height="60" />
  <text class="ab-lbl" x="139" y="304" text-anchor="middle">Model proposes a tool call</text>

  <path class="ab-arr" d="M 139 328 L 139 364" />

  <rect class="ab-adj" x="24" y="366" width="230" height="60" />
  <text class="ab-lbl" x="139" y="402" text-anchor="middle">SDK permission gate</text>

  <text class="ab-note" x="284" y="390">The gate decides which listed tool may run.</text>
  <text class="ab-note" x="284" y="410">Nothing on this path asks who wrote the list.</text>
  <text class="ab-note" x="284" y="430">The flag arrived earlier, on the other path.</text>
</svg>
