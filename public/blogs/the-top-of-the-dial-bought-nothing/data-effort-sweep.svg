<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="et ed">
  <title id="et">FrontierCode score and cost per task across four effort levels</title>
  <desc id="ed">Four effort levels on Claude Opus 5.5. Medium scores 54.6 percent at about $0.80 per task, high 54.0 percent at about $1.09, xhigh 51.4 percent at about $2.25 and max 54.4 percent at about $6.19. The score bars are nearly equal while the cost bars grow almost eightfold from medium to max.</desc>
  <style>
    .hero   { fill: var(--accent, #d4421e); }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .neutral{ fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .row    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
    .grid   { stroke: var(--ink); stroke-width: .5; opacity: .22; stroke-dasharray: 3 4; }
  </style>

  <text class="title" x="20" y="26">FrontierCode v1.1 — score against cost, Claude Opus 5.5</text>

  <text class="head" x="150" y="56">Score (% of tasks)</text>
  <text class="head" x="530" y="56">Cost per task (USD)</text>

  <line class="grid" x1="620" y1="64" x2="620" y2="330" />
  <line class="grid" x1="700" y1="64" x2="700" y2="330" />
  <line class="grid" x1="780" y1="64" x2="780" y2="330" />
  <text class="sub" x="620" y="352" text-anchor="middle">$2</text>
  <text class="sub" x="700" y="352" text-anchor="middle">$4</text>
  <text class="sub" x="780" y="352" text-anchor="middle">$6</text>

  <text class="row" x="20" y="96">medium</text>
  <text class="sub" x="20" y="112">default</text>
  <rect class="adj" x="150" y="80" width="131" height="24" rx="3" />
  <text class="val" x="289" y="97">54.6</text>
  <rect class="neutral" x="540" y="80" width="32" height="24" rx="3" />
  <text class="val" x="580" y="97">$0.80</text>

  <text class="row" x="20" y="156">high</text>
  <rect class="adj" x="150" y="140" width="126" height="24" rx="3" />
  <text class="val" x="284" y="157">54.0</text>
  <rect class="neutral" x="540" y="140" width="44" height="24" rx="3" />
  <text class="val" x="592" y="157">$1.09</text>

  <text class="row" x="20" y="216">xhigh</text>
  <rect class="neutral" x="150" y="200" width="103" height="24" rx="3" />
  <text class="val" x="261" y="217">51.4</text>
  <rect class="neutral" x="540" y="200" width="90" height="24" rx="3" />
  <text class="val" x="638" y="217">$2.25</text>

  <text class="row" x="20" y="276">max</text>
  <rect class="adj" x="150" y="260" width="130" height="24" rx="3" />
  <text class="val" x="288" y="277">54.4</text>
  <rect class="hero" x="540" y="260" width="248" height="24" rx="3" />
  <text class="val" x="796" y="277">$6.19</text>

  <text class="sub" x="20" y="384">Score bars use a zero-suppressed axis from 40% to 60% so the spread is visible; cost bars start at zero.</text>
  <rect class="hero" x="640" y="372" width="14" height="14" rx="2" />
  <text class="sub" x="662" y="384">8x the default, same score</text>
</svg>
