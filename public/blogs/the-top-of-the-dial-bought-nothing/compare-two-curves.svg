<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="ct2 cd2">
  <title id="ct2">Two task families, two shapes of payoff from effort</title>
  <desc id="cd2">A comparison across three rows for two task families. On code-change work the score-versus-cost curve is flat past the default level, the bottleneck is judgement, and the advice is to stay at the default. On long-running terminal work the curve keeps rising, the bottleneck is information the model does not yet have, and the advice is to step up and measure.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .col    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .curve  { fill: none; stroke: currentColor; stroke-width: 2; }
  </style>

  <text class="title" x="20" y="26">The same dial, two payoff shapes</text>

  <text class="col" x="420" y="58" text-anchor="middle">Code change and review (FrontierCode)</text>
  <text class="col" x="730" y="58" text-anchor="middle">Long-running terminal work</text>

  <text class="row" x="20" y="104">Shape of the curve</text>
  <rect class="box" x="290" y="72" width="260" height="56" />
  <path class="curve" d="M 310 112 C 350 96, 390 94, 530 94" />
  <text class="row" x="420" y="124" text-anchor="middle">flat past the default</text>
  <rect class="adj" x="600" y="72" width="260" height="56" />
  <path class="curve" d="M 620 118 C 680 112, 740 96, 840 84" />
  <text class="row" x="730" y="124" text-anchor="middle">still climbing</text>

  <text class="row" x="20" y="164">What the bottleneck is</text>
  <rect class="box" x="290" y="144" width="260" height="30" />
  <text class="label" x="420" y="164" text-anchor="middle">judgement on known context</text>
  <rect class="adj" x="600" y="144" width="260" height="30" />
  <text class="label" x="730" y="164" text-anchor="middle">information not yet gathered</text>

  <text class="row" x="20" y="214">Where to start</text>
  <rect class="hero" x="290" y="194" width="260" height="30" />
  <text class="label-inv" x="420" y="214" text-anchor="middle">default, and justify any step up</text>
  <rect class="hero" x="600" y="194" width="260" height="30" />
  <text class="label-inv" x="730" y="214" text-anchor="middle">one level up, measured</text>

  <text class="row" x="20" y="264">What to report</text>
  <rect class="box" x="290" y="244" width="570" height="30" />
  <text class="label" x="575" y="264" text-anchor="middle">dollars per completed task, with an interval, paired against your current level</text>
</svg>
