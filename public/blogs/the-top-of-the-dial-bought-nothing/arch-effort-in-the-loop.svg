<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="lt ld">
  <title id="lt">Where the effort parameter lands in an agent loop</title>
  <desc id="ld">One request-level effort setting affects three multipliers: tokens spent per turn, the number and verbosity of tool calls within a turn, and the number of turns an episode needs. The first two increase cost, the third can reduce it by finishing the task in fewer laps, so the net effect on cost per completed task is not determined by the parameter alone.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .8; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr4); }
  </style>
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="hero" x="40" y="60" width="200" height="80" />
  <text class="label-inv" x="140" y="94" text-anchor="middle">output_config.effort</text>
  <text class="label-inv" x="140" y="116" text-anchor="middle">one value per request</text>

  <path class="arrow" d="M 240 88 L 336 88" />
  <path class="arrow" d="M 240 100 L 336 218" />
  <path class="arrow" d="M 240 112 L 336 348" />

  <rect class="adj" x="340" y="58" width="290" height="70" />
  <text class="label" x="360" y="84">1. Tokens per turn</text>
  <text class="sub" x="360" y="108">thinking plus prose — cost up</text>
  <rect class="box" x="660" y="58" width="200" height="70" />
  <text class="mono" x="680" y="92">cost ↑</text>

  <rect class="adj" x="340" y="188" width="290" height="70" />
  <text class="label" x="360" y="214">2. Tool calls per turn</text>
  <text class="sub" x="360" y="238">more calls, more preamble — cost up</text>
  <rect class="box" x="660" y="188" width="200" height="70" />
  <text class="mono" x="680" y="222">cost ↑</text>

  <rect class="adj" x="340" y="318" width="290" height="70" />
  <text class="label" x="360" y="344">3. Turns per episode</text>
  <text class="sub" x="360" y="368">fewer laps to finish — cost down</text>
  <rect class="box" x="660" y="318" width="200" height="70" />
  <text class="mono" x="680" y="352">cost ↓</text>

  <rect class="hero" x="120" y="420" width="660" height="56" />
  <text class="label-inv" x="450" y="443" text-anchor="middle">Net effect is a property of the task family, not of the parameter.</text>
  <text class="label-inv" x="450" y="464" text-anchor="middle">Measure dollars per completed task, at the level you will deploy.</text>

  <text class="head" x="40" y="180">A per-call view sees</text>
  <text class="head" x="40" y="200">only the first two.</text>
</svg>
