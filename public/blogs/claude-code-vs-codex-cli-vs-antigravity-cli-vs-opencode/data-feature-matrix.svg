<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Four terminal coding agents compared on five contract axes</title>
  <desc id="d">A matrix comparing Claude Code, Codex CLI, Antigravity CLI and opencode across five axes: source and licence, model choice, config portability, free-tier stability, and whether a version can be pinned in CI. opencode scores strongest on every axis except integration depth; Codex CLI is open under Apache 2.0 but model-locked; Claude Code and Antigravity CLI are both closed, with Antigravity the weakest on free-tier stability and pinnability.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-head { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .mid    { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .weak   { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .cv     { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .cv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--paper, #fff); text-anchor: middle; }
    .leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .75; }
  </style>

  <text class="chart-title" x="450" y="22">Nobody wins this table. That is the finding.</text>

  <text class="col-head" x="290" y="52">Source</text><text class="col-head" x="290" y="65">&amp; licence</text>
  <text class="col-head" x="440" y="52">Model</text><text class="col-head" x="440" y="65">choice</text>
  <text class="col-head" x="590" y="52">Config</text><text class="col-head" x="590" y="65">portability</text>
  <text class="col-head" x="740" y="52">Tier</text><text class="col-head" x="740" y="65">stability</text>
  <text class="col-head" x="858" y="52">Pin in</text><text class="col-head" x="858" y="65">CI</text>

  <text class="row-head" x="24" y="103">Claude Code</text>
  <rect class="weak" x="222" y="82" width="136" height="34" rx="5" /><text class="cv" x="290" y="103">Proprietary</text>
  <rect class="weak" x="372" y="82" width="136" height="34" rx="5" /><text class="cv" x="440" y="103">Anthropic only</text>
  <rect class="mid" x="522" y="82" width="136" height="34" rx="5" /><text class="cv" x="590" y="103">Own schema</text>
  <rect class="mid" x="672" y="82" width="136" height="34" rx="5" /><text class="cv" x="740" y="103">Paid plans</text>
  <rect class="mid" x="822" y="82" width="72" height="34" rx="5" /><text class="cv" x="858" y="103">npm</text>

  <text class="row-head" x="24" y="155">Codex CLI</text>
  <rect class="strong" x="222" y="134" width="136" height="34" rx="5" /><text class="cv-inv" x="290" y="155">Apache-2.0</text>
  <rect class="weak" x="372" y="134" width="136" height="34" rx="5" /><text class="cv" x="440" y="155">OpenAI only</text>
  <rect class="strong" x="522" y="134" width="136" height="34" rx="5" /><text class="cv-inv" x="590" y="155">AGENTS.md</text>
  <rect class="mid" x="672" y="134" width="136" height="34" rx="5" /><text class="cv" x="740" y="155">ChatGPT plans</text>
  <rect class="strong" x="822" y="134" width="72" height="34" rx="5" /><text class="cv-inv" x="858" y="155">Fork</text>

  <text class="row-head" x="24" y="207">Antigravity CLI</text>
  <rect class="weak" x="222" y="186" width="136" height="34" rx="5" /><text class="cv" x="290" y="207">Closed binary</text>
  <rect class="weak" x="372" y="186" width="136" height="34" rx="5" /><text class="cv" x="440" y="207">Google only</text>
  <rect class="weak" x="522" y="186" width="136" height="34" rx="5" /><text class="cv" x="590" y="207">Rewritten twice</text>
  <rect class="weak" x="672" y="186" width="136" height="34" rx="5" /><text class="cv" x="740" y="207">1,000 → ~20/day</text>
  <rect class="weak" x="822" y="186" width="72" height="34" rx="5" /><text class="cv" x="858" y="207">No</text>

  <text class="row-head" x="24" y="259">opencode</text>
  <rect class="strong" x="222" y="238" width="136" height="34" rx="5" /><text class="cv-inv" x="290" y="259">MIT</text>
  <rect class="strong" x="372" y="238" width="136" height="34" rx="5" /><text class="cv-inv" x="440" y="259">Any provider</text>
  <rect class="strong" x="522" y="238" width="136" height="34" rx="5" /><text class="cv-inv" x="590" y="259">AGENTS.md</text>
  <rect class="strong" x="672" y="238" width="136" height="34" rx="5" /><text class="cv-inv" x="740" y="259">Your own key</text>
  <rect class="strong" x="822" y="238" width="72" height="34" rx="5" /><text class="cv-inv" x="858" y="259">Fork</text>

  <rect class="strong" x="24" y="300" width="18" height="14" rx="3" /><text class="leg" x="50" y="312">strong</text>
  <rect class="mid" x="112" y="300" width="18" height="14" rx="3" /><text class="leg" x="138" y="312">workable</text>
  <rect class="weak" x="212" y="300" width="18" height="14" rx="3" /><text class="leg" x="238" y="312">weak</text>

  <text class="leg" x="24" y="348">Missing from this table: integration depth, harness maturity, and how good the default model is —</text>
  <text class="leg" x="24" y="366">the three axes on which the two closed tools lead, and the reason people keep choosing them.</text>
  <text class="leg" x="24" y="384">A contract you can exit is worth something. It is not worth everything.</text>
</svg>
