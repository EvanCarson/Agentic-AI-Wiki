<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The four layers of a terminal coding agent, and who owns each</title>
  <desc id="d">A stack diagram with four layers. The model layer and the harness loop are owned by the vendor and are replaceable or not depending on licence. The configuration surface — project instructions, permission rules, MCP servers, hooks and subagents — sits between the vendor and your repository and is where switching cost accumulates. The repository and CI layer is yours and outlives every agent you install.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .owner  { font-family: var(--font-mono), monospace; font-size: 10.5px; fill: var(--ink); opacity: .6; text-anchor: end; letter-spacing: .04em; }
    .head   { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .divider { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 5 4; opacity: .45; }
    .divlab { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-style: italic; fill: var(--ink); opacity: .6; }
  </style>

  <text class="head" x="450" y="26">Where the switching cost actually lives</text>

  <rect class="box" x="120" y="52" width="660" height="72" />
  <text class="label" x="144" y="82">Model</text>
  <text class="sub" x="144" y="103">Swappable in two of the four. Scores now sit within a point of each other.</text>
  <text class="owner" x="756" y="82">VENDOR</text>

  <rect class="box" x="120" y="140" width="660" height="72" />
  <text class="label" x="144" y="170">Harness loop</text>
  <text class="sub" x="144" y="191">Planning, tool dispatch, compaction, retries. Closed in two of the four.</text>
  <text class="owner" x="756" y="170">VENDOR</text>

  <rect class="hero" x="120" y="228" width="660" height="112" />
  <text class="label-inv" x="144" y="258">Configuration surface</text>
  <text class="sub-inv" x="144" y="280">Project instructions file · permission allow / deny rules · MCP servers</text>
  <text class="sub-inv" x="144" y="299">hooks · subagents · skills · slash commands</text>
  <text class="sub-inv" x="144" y="325">You author it. The vendor defines its schema. It does not transfer.</text>

  <rect class="adj" x="120" y="356" width="660" height="72" />
  <text class="label" x="144" y="386">Your repository and CI</text>
  <text class="sub" x="144" y="407">Tests, setup scripts, review gates. Outlives every agent you install.</text>
  <text class="owner" x="756" y="386">YOURS</text>

  <line class="divider" x1="60" y1="220" x2="840" y2="220" />
  <text class="divlab" x="60" y="212">above: replaceable in an afternoon</text>
  <text class="divlab" x="60" y="352">below: the part that survives a migration</text>

  <text class="sub" x="120" y="462">The two layers everyone benchmarks are the two that cost least to change.</text>
  <text class="sub" x="120" y="482">The layer nobody benchmarks is the one that decides whether you can leave.</text>
</svg>
