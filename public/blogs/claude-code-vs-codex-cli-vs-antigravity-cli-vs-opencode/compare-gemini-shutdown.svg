<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Timeline of the Gemini CLI retirement and the Antigravity CLI replacement</title>
  <desc id="d">A four-stop timeline running from Google I/O on 19 May 2026, where the consolidation under the Antigravity brand was announced, to the 18 June 2026 shutdown for free, Pro and Ultra users, to the replacement by a closed-source Go binary named agy, to the consequences: a free tier cut from about 1,000 requests a day to roughly 20, a rewritten settings schema, and broken CI pipelines.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .stop   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 7; ry: 7; }
    .stop-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 7; ry: 7; }
    .stop-adj { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 7; ry: 7; }
    .date   { font-family: var(--font-mono), monospace; font-size: 10.5px; fill: var(--ink); opacity: .65; text-anchor: middle; letter-spacing: .03em; }
    .lab    { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
    .lab-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; font-weight: 600; fill: var(--paper); text-anchor: middle; }
    .det    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .72; text-anchor: middle; }
    .det-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .88; text-anchor: middle; }
    .rail   { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; font-style: italic; fill: var(--ink); opacity: .65; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="chart-title" x="450" y="24">Thirty days from announcement to a broken build</text>

  <path class="rail" d="M 60 118 L 848 118" />

  <text class="date" x="140" y="56">19 MAY 2026</text>
  <rect class="stop" x="42" y="66" width="196" height="44" />
  <text class="lab" x="140" y="84">Announced at I/O</text>
  <text class="det" x="140" y="101">Tooling consolidates under Antigravity</text>

  <text class="date" x="368" y="56">18 JUN 2026</text>
  <rect class="stop-hero" x="270" y="66" width="196" height="44" />
  <text class="lab-inv" x="368" y="84">Gemini CLI stops serving</text>
  <text class="det-inv" x="368" y="101">Free, Pro and Ultra tiers cut off</text>

  <text class="date" x="596" y="56">REPLACEMENT</text>
  <rect class="stop-adj" x="498" y="66" width="196" height="44" />
  <text class="lab" x="596" y="84">agy — a Go binary</text>
  <text class="det" x="596" y="101">Closed source, async-first</text>

  <text class="date" x="800" y="56">FALLOUT</text>
  <rect class="stop" x="726" y="66" width="148" height="44" />
  <text class="lab" x="800" y="84">Rewritten schema</text>
  <text class="det" x="800" y="101">Pipelines break</text>

  <rect class="stop" x="42" y="150" width="196" height="62" />
  <text class="lab" x="140" y="172">105,000 stars</text>
  <text class="det" x="140" y="190">The open repo the</text>
  <text class="det" x="140" y="205">ecosystem built on</text>

  <rect class="stop" x="270" y="150" width="196" height="62" />
  <text class="lab" x="368" y="172">1,000 → ~20</text>
  <text class="det" x="368" y="190">Free-tier requests</text>
  <text class="det" x="368" y="205">per day, after the swap</text>

  <rect class="stop" x="498" y="150" width="196" height="62" />
  <text class="lab" x="596" y="172">Enterprise exempt</text>
  <text class="det" x="596" y="190">Code Assist licence holders</text>
  <text class="det" x="596" y="205">keep the legacy CLI</text>

  <rect class="stop" x="726" y="150" width="148" height="62" />
  <text class="lab" x="800" y="172">No fork path</text>
  <text class="det" x="800" y="190">A closed binary</text>
  <text class="det" x="800" y="205">cannot be pinned</text>

  <text class="note" x="450" y="252">None of this was a capability decision. Every part of it was a licensing and distribution decision.</text>
  <text class="note" x="450" y="274">Those are the terms your CI depends on, and they are not in any benchmark.</text>
</svg>
