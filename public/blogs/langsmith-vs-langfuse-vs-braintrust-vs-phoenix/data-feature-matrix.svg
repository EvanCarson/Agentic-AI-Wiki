<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="mt md">
  <title id="mt">Four platforms against the four axes that are actually contested</title>
  <desc id="md">A matrix with four platforms as rows and four axes as columns. On self-hosting, Langfuse is strong because the MIT core self-hosts on every tier and Phoenix is strong as a single source-available process, while Braintrust offers a hybrid data plane only on enterprise plans and LangSmith self-hosts only on enterprise. On where the bytes sit, Langfuse and Phoenix put them in databases you operate, Braintrust can put them in your own object storage behind a proprietary engine, and LangSmith keeps them managed by default. On span vocabulary, Langfuse and LangSmith ingest the OpenTelemetry generative-AI attributes, Phoenix is native to the OpenInference conventions, and Braintrust maps OTLP into its own model. On eval depth, Braintrust is strongest, Langfuse and Phoenix are capable, and LangSmith is tied to its own framework ergonomics.</desc>
  <style>
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .strong { fill: var(--accent, #d4421e); stroke: none; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .colh   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .rowh   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>

  <text class="title" x="20" y="26">Where each one leans hardest</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <text class="colh" x="248" y="62" text-anchor="middle">SELF-HOST</text>
  <text class="colh" x="418" y="62" text-anchor="middle">WHERE BYTES SIT</text>
  <text class="colh" x="588" y="62" text-anchor="middle">SPAN VOCABULARY</text>
  <text class="colh" x="758" y="62" text-anchor="middle">EVAL DEPTH</text>

  <text class="rowh" x="20" y="98">Langfuse</text>
  <rect class="strong" x="168" y="76" width="160" height="36" rx="4" />
  <text class="cell-inv" x="248" y="98" text-anchor="middle">every tier, MIT</text>
  <rect class="strong" x="338" y="76" width="160" height="36" rx="4" />
  <text class="cell-inv" x="418" y="98" text-anchor="middle">your Postgres</text>
  <rect class="med" x="508" y="76" width="160" height="36" rx="4" />
  <text class="cell" x="588" y="98" text-anchor="middle">gen_ai.* ingest</text>
  <rect class="med" x="678" y="76" width="160" height="36" rx="4" />
  <text class="cell" x="758" y="98" text-anchor="middle">judges + datasets</text>

  <text class="rowh" x="20" y="148">Phoenix</text>
  <rect class="strong" x="168" y="126" width="160" height="36" rx="4" />
  <text class="cell-inv" x="248" y="148" text-anchor="middle">one process</text>
  <rect class="strong" x="338" y="126" width="160" height="36" rx="4" />
  <text class="cell-inv" x="418" y="148" text-anchor="middle">your database</text>
  <rect class="med" x="508" y="126" width="160" height="36" rx="4" />
  <text class="cell" x="588" y="148" text-anchor="middle">OpenInference</text>
  <rect class="med" x="678" y="126" width="160" height="36" rx="4" />
  <text class="cell" x="758" y="148" text-anchor="middle">RAG-shaped</text>

  <text class="rowh" x="20" y="198">Braintrust</text>
  <rect class="med" x="168" y="176" width="160" height="36" rx="4" />
  <text class="cell" x="248" y="198" text-anchor="middle">hybrid, enterprise</text>
  <rect class="med" x="338" y="176" width="160" height="36" rx="4" />
  <text class="cell" x="418" y="198" text-anchor="middle">your object store</text>
  <rect class="weak" x="508" y="176" width="160" height="36" rx="4" />
  <text class="cell" x="588" y="198" text-anchor="middle">own model</text>
  <rect class="strong" x="678" y="176" width="160" height="36" rx="4" />
  <text class="cell-inv" x="758" y="198" text-anchor="middle">eval-first</text>

  <text class="rowh" x="20" y="248">LangSmith</text>
  <rect class="weak" x="168" y="226" width="160" height="36" rx="4" />
  <text class="cell" x="248" y="248" text-anchor="middle">enterprise only</text>
  <rect class="weak" x="338" y="226" width="160" height="36" rx="4" />
  <text class="cell" x="418" y="248" text-anchor="middle">managed</text>
  <rect class="med" x="508" y="226" width="160" height="36" rx="4" />
  <text class="cell" x="588" y="248" text-anchor="middle">gen_ai.* ingest</text>
  <rect class="med" x="678" y="226" width="160" height="36" rx="4" />
  <text class="cell" x="758" y="248" text-anchor="middle">framework-native</text>

  <rect class="strong" x="20" y="276" width="28" height="12" rx="2" />
  <text class="sub" x="56" y="286">strong</text>
  <rect class="med" x="128" y="276" width="28" height="12" rx="2" />
  <text class="sub" x="164" y="286">capable</text>
  <rect class="weak" x="240" y="276" width="28" height="12" rx="2" />
  <text class="sub" x="276" y="286">weakest of the four</text>

  <line class="rule" x1="20" y1="312" x2="880" y2="312" />
  <text class="sub" x="20" y="336">No row is bad. Column three is the one every vendor answers with the same word and means four things by.</text>
  <text class="sub" x="20" y="356">Ingesting OTLP is not the same as storing, querying and re-emitting the gen_ai.* attributes you sent.</text>
  <text class="sub" x="20" y="376">Column two is the only one with a migration cost attached, which is why it should move first in a decision.</text>
</svg>
