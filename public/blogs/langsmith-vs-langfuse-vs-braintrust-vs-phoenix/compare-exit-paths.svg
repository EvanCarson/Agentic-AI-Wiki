<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="et ed">
  <title id="et">Three exit paths, and what each one costs when you leave</title>
  <desc id="ed">Three columns describing how you get historical traces out of a platform. A paginated REST export is the common case: it works, it is rate-limited, and a year of spans becomes a multi-day job nobody budgets for. A database you already operate means export is a query, so leaving costs a dump and a schema translation. Owning the instrumentation shim is the only path where leaving costs nothing historical, because the attribute names you store were never the vendor's to define.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .item   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .item-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>

  <text class="head" x="20" y="26">Portability is a property of the write path, not of a feature list</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <rect class="box" x="30" y="58" width="260" height="188" rx="8" />
  <text class="cap" x="46" y="80">PAGINATED REST EXPORT</text>
  <text class="head" x="46" y="104">The default everywhere</text>
  <text class="item" x="46" y="132">it does work</text>
  <text class="item" x="46" y="152">rate-limited per call</text>
  <text class="item" x="46" y="172">a year of spans is a multi-day</text>
  <text class="item" x="46" y="188">job nobody budgeted</text>
  <text class="item" x="46" y="214">in practice: you re-start the</text>
  <text class="item" x="46" y="230">history instead</text>

  <rect class="adj" x="320" y="58" width="260" height="188" rx="8" />
  <text class="cap" x="336" y="80">A DATABASE YOU OPERATE</text>
  <text class="head" x="336" y="104">Langfuse, Phoenix</text>
  <text class="item" x="336" y="132">export is a query</text>
  <text class="item" x="336" y="152">no rate limit to plan around</text>
  <text class="item" x="336" y="172">you still owe a schema</text>
  <text class="item" x="336" y="188">translation on the way out</text>
  <text class="item" x="336" y="214">cost: a dump plus a mapping,</text>
  <text class="item" x="336" y="230">measured in days not quarters</text>

  <rect class="hero" x="610" y="58" width="260" height="188" rx="8" />
  <text class="cap" x="626" y="80" fill="var(--paper)" opacity=".7">A SHIM YOU OWN</text>
  <text class="head-inv" x="626" y="104">~200 lines, your repo</text>
  <text class="item-inv" x="626" y="132">you name the attributes</text>
  <text class="item-inv" x="626" y="152">the platform is a renderer</text>
  <text class="item-inv" x="626" y="172">dual-write during migration</text>
  <text class="item-inv" x="626" y="188">is a config change</text>
  <text class="item-inv" x="626" y="214">cost of leaving: the backfill</text>
  <text class="item-inv" x="626" y="230">only, and you can skip it</text>

  <text class="cap" x="30" y="278">The third column is compatible with all four platforms, which is the point: it is the decision you make before you choose one.</text>
</svg>
