<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="ot od">
  <title id="ot">Where a span's vocabulary is decided, and where the bytes land</title>
  <desc id="od">A span starts in your application code, where an instrumentation library names its attributes. That naming step is the only place portability is decided, and it is code you can own. Below it, the OTLP wire protocol carries the span to a platform. All four platforms accept OTLP, so the protocol is not the differentiator. Each platform then writes the span into its own store under its own vocabulary: Langfuse into Postgres and ClickHouse you can run, Phoenix into a self-hosted database under the OpenInference conventions, Braintrust into Brainstore which can sit in your own cloud account, LangSmith into a managed store unless you are on an enterprise self-hosted plan. The bulk read path back out is the axis that decides whether last quarter's traces are still yours.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper); opacity: .85; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#oar); }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
    .dash   { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 5 4; opacity: .55; }
  </style>
  <defs>
    <marker id="oar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="label" x="20" y="26">The protocol is shared. The vocabulary and the store are not.</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <rect class="box" x="24" y="60" width="330" height="74" rx="8" />
  <text class="label" x="44" y="88">Your agent code</text>
  <text class="sub" x="44" y="110">one run · tool calls · retries · judge scores</text>
  <text class="sub" x="44" y="126">the only thing that knows what mattered</text>

  <path class="arrow" d="M 358 97 L 418 97" />

  <rect class="hero" x="422" y="60" width="456" height="74" rx="8" />
  <text class="label-inv" x="442" y="88">Instrumentation — where attribute names are chosen</text>
  <text class="sub-inv" x="442" y="110">gen_ai.* · openinference.* · vendor SDK fields</text>
  <text class="sub-inv" x="442" y="126">THIS is the portability decision, and it is yours to own</text>

  <path class="arrow" d="M 650 138 L 650 182" />

  <rect class="adj" x="300" y="186" width="420" height="56" rx="8" />
  <text class="label" x="320" y="214">OTLP over HTTP or gRPC</text>
  <text class="sub" x="320" y="232">all four accept it — so it settles nothing</text>

  <line class="dash" x1="20" y1="268" x2="880" y2="268" />
  <text class="cap" x="20" y="288">BELOW THIS LINE, EACH PLATFORM REWRITES THE SPAN INTO ITS OWN STORE</text>

  <rect class="box" x="24" y="302" width="200" height="124" rx="8" />
  <text class="label" x="42" y="328">Langfuse</text>
  <text class="sub" x="42" y="350">MIT core, self-host on</text>
  <text class="sub" x="42" y="366">every tier</text>
  <text class="sub" x="42" y="388">Postgres + ClickHouse</text>
  <text class="sub" x="42" y="404">you operate</text>
  <text class="cap" x="42" y="420">CODE YOURS · DATA YOURS</text>

  <rect class="box" x="236" y="302" width="200" height="124" rx="8" />
  <text class="label" x="254" y="328">Phoenix</text>
  <text class="sub" x="254" y="350">Elastic 2.0, source-</text>
  <text class="sub" x="254" y="366">available, pip/Docker/Helm</text>
  <text class="sub" x="254" y="388">OpenInference span kinds,</text>
  <text class="sub" x="254" y="404">its own database</text>
  <text class="cap" x="254" y="420">DATA YOURS · NO RESALE</text>

  <rect class="box" x="448" y="302" width="200" height="124" rx="8" />
  <text class="label" x="466" y="328">Braintrust</text>
  <text class="sub" x="466" y="350">proprietary; hybrid data</text>
  <text class="sub" x="466" y="366">plane on enterprise</text>
  <text class="sub" x="466" y="388">Brainstore on object</text>
  <text class="sub" x="466" y="404">storage in your account</text>
  <text class="cap" x="466" y="420">BYTES YOURS · ENGINE NOT</text>

  <rect class="box" x="660" y="302" width="218" height="124" rx="8" />
  <text class="label" x="678" y="328">LangSmith</text>
  <text class="sub" x="678" y="350">proprietary SaaS;</text>
  <text class="sub" x="678" y="366">self-host on enterprise</text>
  <text class="sub" x="678" y="388">managed store on every</text>
  <text class="sub" x="678" y="404">other plan</text>
  <text class="cap" x="678" y="420">NEITHER, BY DEFAULT</text>

  <line class="rule" x1="20" y1="450" x2="880" y2="450" />
  <text class="sub" x="20" y="474">You can re-run an eval and rewrite a prompt. You cannot re-observe last quarter's production traffic.</text>
  <text class="sub" x="20" y="492">So read the bottom row as a question about exit, not about ideology.</text>
</svg>
