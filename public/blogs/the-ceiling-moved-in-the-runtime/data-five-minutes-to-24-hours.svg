<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="cmt cmd">
  <title id="cmt">Longest single unattended task, Notion agents, before and after 19 October 2026</title>
  <desc id="cmd">Two horizontal bars on a logarithmic time axis running from one minute to twenty-four hours. Before the 19 October 2026 release a Notion agent could work a single task for five minutes. After it, the company states more than twenty-four hours, a factor of about 288. The axis is logarithmic because a linear one would render the five-minute bar invisible.</desc>
  <style>
    .cm-old  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .cm-new  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .cm-grid { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .cm-axis { fill: none; stroke: var(--ink); stroke-width: 1.25; }
    .cm-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .cm-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .cm-val  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .cm-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>
  <text class="cm-ttl" x="20" y="28">Longest single unattended task, Notion agents (log scale)</text>

  <path class="cm-grid" d="M 538 80 L 538 300 M 652 80 L 652 300" />

  <text class="cm-row" x="20" y="126">Before</text>
  <text class="cm-val" x="20" y="146">5 minutes</text>
  <rect class="cm-old" x="200" y="110" width="133" height="40" />

  <text class="cm-row" x="20" y="226">After</text>
  <text class="cm-val" x="20" y="246">&gt; 24 hours</text>
  <rect class="cm-new" x="200" y="210" width="600" height="40" />

  <path class="cm-axis" d="M 200 80 L 200 300 L 800 300" />
  <text class="cm-val" x="200" y="322" text-anchor="middle">1m</text>
  <text class="cm-val" x="333" y="322" text-anchor="middle">5m</text>
  <text class="cm-val" x="538" y="322" text-anchor="middle">1h</text>
  <text class="cm-val" x="652" y="322" text-anchor="middle">4h</text>
  <text class="cm-val" x="800" y="322" text-anchor="middle">24h</text>

  <text class="cm-sub" x="20" y="358">Ratio of the two stated ceilings: about 288x. Notion's release notes give the new figure as "up to 24 hours";</text>
  <text class="cm-sub" x="20" y="376">the announcement blog says "more than 24 hours". Both are the vendor's own numbers, not a measured success rate.</text>
</svg>
