<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="tmt tmd">
  <title id="tmt">Three mechanisms a day-long agent run needs, and what each one costs</title>
  <desc id="tmd">Three columns. Durability is bought with a queue-backed worker loop and durable state, and it costs an idempotency obligation on every side effect. Context is bought by condensing the conversation and setting aside large tool results, and it costs fidelity: the agent at hour twenty is reasoning over a summary. Oversight is bought by a reviewer model that flags actions for approval, and it costs you ownership of that reviewer's false-negative rate.</desc>
  <style>
    .tm-box  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .tm-cost { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .tm-head { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .tm-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .tm-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="tm-head" x="160" y="34" text-anchor="middle">Durability</text>
  <rect class="tm-box" x="50" y="50" width="220" height="70" />
  <text class="tm-lbl" x="160" y="78" text-anchor="middle">queue-backed worker</text>
  <text class="tm-lbl" x="160" y="100" text-anchor="middle">loop + durable state</text>
  <rect class="tm-cost" x="50" y="140" width="220" height="80" />
  <text class="tm-sub" x="160" y="168" text-anchor="middle">cost: every side effect</text>
  <text class="tm-sub" x="160" y="188" text-anchor="middle">must be idempotent,</text>
  <text class="tm-sub" x="160" y="208" text-anchor="middle">because steps replay</text>

  <text class="tm-head" x="450" y="34" text-anchor="middle">Context</text>
  <rect class="tm-box" x="340" y="50" width="220" height="70" />
  <text class="tm-lbl" x="450" y="78" text-anchor="middle">condense the thread,</text>
  <text class="tm-lbl" x="450" y="100" text-anchor="middle">set aside big results</text>
  <rect class="tm-cost" x="340" y="140" width="220" height="80" />
  <text class="tm-sub" x="450" y="168" text-anchor="middle">cost: fidelity. At hour</text>
  <text class="tm-sub" x="450" y="188" text-anchor="middle">twenty the agent reasons</text>
  <text class="tm-sub" x="450" y="208" text-anchor="middle">over a summary of itself</text>

  <text class="tm-head" x="750" y="34" text-anchor="middle">Oversight</text>
  <rect class="tm-box" x="640" y="50" width="220" height="70" />
  <text class="tm-lbl" x="750" y="78" text-anchor="middle">a reviewer model flags</text>
  <text class="tm-lbl" x="750" y="100" text-anchor="middle">actions for approval</text>
  <rect class="tm-cost" x="640" y="140" width="220" height="80" />
  <text class="tm-sub" x="750" y="168" text-anchor="middle">cost: its false-negative</text>
  <text class="tm-sub" x="750" y="188" text-anchor="middle">rate is now your safety</text>
  <text class="tm-sub" x="750" y="208" text-anchor="middle">margin, unmeasured</text>

  <text class="tm-sub" x="450" y="266" text-anchor="middle">Notion's 19 October 2026 release names all three. None of them is a model change.</text>
</svg>
