<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="wlt wld">
  <title id="wlt">Request-scoped agent turn versus a queue-backed worker loop</title>
  <desc id="wld">Two lanes. The upper lane shows an agent turn that lives inside a single client request: the request enters, the turn runs, a response leaves, and a timeout, deploy or restart during the turn destroys the work. The lower lane shows the shape Notion describes: the task is enqueued, a worker loop on a dedicated service picks it up, writes its progress to durable state, and resumes from that state after a restart, so the run outlives any one process.</desc>
  <style>
    .wl-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .wl-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .wl-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .wl-lane { fill: none; stroke: var(--border-soft); stroke-width: 1.25; stroke-dasharray: 5 4; rx: 10; ry: 10; }
    .wl-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .wl-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .wl-head { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wl-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .wl-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#wlarr); }
  </style>
  <defs>
    <marker id="wlarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="wl-head" x="20" y="28">Before: the turn lives inside one request</text>
  <rect class="wl-lane" x="20" y="44" width="860" height="150" />

  <rect class="wl-box" x="50" y="74" width="150" height="60" />
  <text class="wl-lbl" x="125" y="110" text-anchor="middle">client request</text>

  <path class="wl-arr" d="M 205 104 L 245 104" />
  <rect class="wl-hero" x="250" y="74" width="170" height="60" />
  <text class="wl-inv" x="335" y="110" text-anchor="middle">agent turn</text>

  <path class="wl-arr" d="M 425 104 L 465 104" />
  <rect class="wl-box" x="470" y="74" width="150" height="60" />
  <text class="wl-lbl" x="545" y="110" text-anchor="middle">response</text>

  <rect class="wl-box" x="680" y="74" width="170" height="60" />
  <text class="wl-lbl" x="765" y="104" text-anchor="middle">timeout / deploy</text>
  <text class="wl-lbl" x="765" y="122" text-anchor="middle">work is lost</text>
  <text class="wl-sub" x="335" y="164" text-anchor="middle">one process lifetime bounds the task</text>

  <text class="wl-head" x="20" y="248">After: a queue-backed worker loop on a dedicated service</text>
  <rect class="wl-lane" x="20" y="264" width="860" height="200" />

  <rect class="wl-box" x="50" y="300" width="140" height="60" />
  <text class="wl-lbl" x="120" y="336" text-anchor="middle">enqueue task</text>

  <path class="wl-arr" d="M 195 330 L 230 330" />
  <rect class="wl-adj" x="235" y="300" width="110" height="60" />
  <text class="wl-lbl" x="290" y="336" text-anchor="middle">queue</text>

  <path class="wl-arr" d="M 350 330 L 385 330" />
  <rect class="wl-hero" x="390" y="300" width="160" height="60" />
  <text class="wl-inv" x="470" y="330" text-anchor="middle">worker loop</text>
  <text class="wl-inv" x="470" y="348" text-anchor="middle">one step at a time</text>

  <path class="wl-arr" d="M 555 330 L 590 330" />
  <rect class="wl-adj" x="595" y="300" width="160" height="60" />
  <text class="wl-lbl" x="675" y="330" text-anchor="middle">durable state</text>
  <text class="wl-lbl" x="675" y="348" text-anchor="middle">step, context, tools</text>

  <path class="wl-arr" d="M 675 365 L 675 400 L 290 400 L 290 365" />
  <text class="wl-sub" x="470" y="422" text-anchor="middle">restart: the worker re-reads state and continues; the run outlives the process</text>
  <text class="wl-sub" x="470" y="446" text-anchor="middle">this is what moved the ceiling, and it is orthogonal to which model is behind it</text>
</svg>
