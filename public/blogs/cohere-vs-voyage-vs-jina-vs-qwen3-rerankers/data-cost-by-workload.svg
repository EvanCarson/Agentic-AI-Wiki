<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
  <title id="t">Cost per 1,000 reranks under two workload shapes</title>
  <desc id="d">Two grouped bar charts. On many short candidates, Voyage's per-token pricing is cheaper than Cohere's per-search pricing; on few long documents the order reverses, because a flat per-search charge stops caring how long the documents are.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .panel-title  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: start; }
    .row-label    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: currentColor; text-anchor: end; }
    .value-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: start; }
    .axis-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: currentColor; opacity: .55; text-anchor: middle; }
    .grid         { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .bar-accent   { fill: var(--accent, #d4421e); }
    .bar-soft     { fill: var(--accent-soft, #f5c5b8); }
    .bar-neutral  { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="26">Cost per 1,000 reranks (USD), published list prices</text>

  <!-- gridlines -->
  <line class="grid" x1="190" y1="52" x2="190" y2="382" />
  <line class="grid" x1="283" y1="52" x2="283" y2="382" />
  <line class="grid" x1="377" y1="52" x2="377" y2="382" />
  <line class="grid" x1="470" y1="52" x2="470" y2="382" />
  <line class="grid" x1="563" y1="52" x2="563" y2="382" />
  <line class="grid" x1="657" y1="52" x2="657" y2="382" />
  <line class="grid" x1="750" y1="52" x2="750" y2="382" />
  <text class="axis-label" x="190" y="398">$0</text>
  <text class="axis-label" x="377" y="398">$1.00</text>
  <text class="axis-label" x="563" y="398">$2.00</text>
  <text class="axis-label" x="750" y="398">$3.00</text>

  <!-- Panel A -->
  <text class="panel-title" x="24" y="62">Agent shape — 100 candidates of ~200 tokens</text>

  <text class="row-label" x="180" y="90">Cohere Rerank 4 Pro</text>
  <rect class="bar-neutral" x="190" y="76" width="467" height="20" rx="3" />
  <text class="value-label" x="665" y="91">$2.50</text>

  <text class="row-label" x="180" y="118">Cohere Rerank 4 Fast</text>
  <rect class="bar-neutral" x="190" y="104" width="373" height="20" rx="3" />
  <text class="value-label" x="571" y="119">$2.00</text>

  <text class="row-label" x="180" y="146">Voyage rerank-2.5</text>
  <rect class="bar-soft" x="190" y="132" width="187" height="20" rx="3" />
  <text class="value-label" x="385" y="147">$1.00</text>

  <text class="row-label" x="180" y="174">Voyage rerank-2.5-lite</text>
  <rect class="bar-accent" x="190" y="160" width="75" height="20" rx="3" />
  <text class="value-label" x="273" y="175">$0.40</text>

  <!-- Panel B -->
  <text class="panel-title" x="24" y="234">Document shape — 20 candidates of ~3,000 tokens</text>

  <text class="row-label" x="180" y="262">Voyage rerank-2.5</text>
  <rect class="bar-neutral" x="190" y="248" width="560" height="20" rx="3" />
  <text class="value-label" x="758" y="263">$3.00</text>

  <text class="row-label" x="180" y="290">Cohere Rerank 4 Pro</text>
  <rect class="bar-neutral" x="190" y="276" width="467" height="20" rx="3" />
  <text class="value-label" x="665" y="291">$2.50</text>

  <text class="row-label" x="180" y="318">Cohere Rerank 4 Fast</text>
  <rect class="bar-soft" x="190" y="304" width="373" height="20" rx="3" />
  <text class="value-label" x="571" y="319">$2.00</text>

  <text class="row-label" x="180" y="346">Voyage rerank-2.5-lite</text>
  <rect class="bar-accent" x="190" y="332" width="224" height="20" rx="3" />
  <text class="value-label" x="422" y="347">$1.20</text>
</svg>
