<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Where each reranker leans hardest</title>
  <desc id="d">A four-by-four grid comparing deployment shape, context length, instruction-following and licence across Cohere Rerank 4, Voyage rerank-2.5, Jina Reranker v3.5 and Qwen3-Reranker. The two hosted models lead on instruction-following and operational simplicity; the two open-weight models lead on context and control, but only Qwen3-Reranker carries a licence you can deploy commercially without asking.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: start; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">Four axes, four rerankers</text>

  <text class="body-text" x="251" y="58" style="font-weight:600">Deployment</text>
  <text class="body-text" x="251" y="72" style="font-weight:600">shape</text>
  <text class="body-text" x="417" y="58" style="font-weight:600">Context</text>
  <text class="body-text" x="417" y="72" style="font-weight:600">length</text>
  <text class="body-text" x="583" y="58" style="font-weight:600">Instruction</text>
  <text class="body-text" x="583" y="72" style="font-weight:600">following</text>
  <text class="body-text" x="749" y="58" style="font-weight:600">Commercial</text>
  <text class="body-text" x="749" y="72" style="font-weight:600">use</text>

  <!-- Row 1: Cohere -->
  <text class="row-head" x="154" y="112">Cohere</text>
  <text class="row-head" x="154" y="126" style="font-weight:400;opacity:.65">Rerank 4 Pro / Fast</text>
  <rect class="card-neutral" x="171" y="88" width="160" height="52" rx="6" />
  <text class="body-text" x="251" y="118">Hosted API only</text>
  <rect class="card-soft" x="337" y="88" width="160" height="52" rx="6" />
  <text class="body-text" x="417" y="118">32,768 tokens</text>
  <rect class="card-neutral" x="503" y="88" width="160" height="52" rx="6" />
  <text class="body-text" x="583" y="118">No</text>
  <rect class="card-soft" x="669" y="88" width="160" height="52" rx="6" />
  <text class="body-text" x="749" y="113">Yes, under</text>
  <text class="body-text" x="749" y="127">vendor terms</text>

  <!-- Row 2: Voyage -->
  <text class="row-head" x="154" y="172">Voyage AI</text>
  <text class="row-head" x="154" y="186" style="font-weight:400;opacity:.65">rerank-2.5 / -lite</text>
  <rect class="card-neutral" x="171" y="148" width="160" height="52" rx="6" />
  <text class="body-text" x="251" y="178">Hosted API only</text>
  <rect class="card-soft" x="337" y="148" width="160" height="52" rx="6" />
  <text class="body-text" x="417" y="173">32K pair,</text>
  <text class="body-text" x="417" y="187">8K query</text>
  <rect class="card-accent" x="503" y="148" width="160" height="52" rx="6" />
  <text class="body-text-inv" x="583" y="178">Yes, natural language</text>
  <rect class="card-soft" x="669" y="148" width="160" height="52" rx="6" />
  <text class="body-text" x="749" y="173">Yes, under</text>
  <text class="body-text" x="749" y="187">vendor terms</text>

  <!-- Row 3: Jina -->
  <text class="row-head" x="154" y="232">Jina AI</text>
  <text class="row-head" x="154" y="246" style="font-weight:400;opacity:.65">jina-reranker-v3.5</text>
  <rect class="card-accent" x="171" y="208" width="160" height="52" rx="6" />
  <text class="body-text-inv" x="251" y="233">Open weights,</text>
  <text class="body-text-inv" x="251" y="247">0.6B, plus API</text>
  <rect class="card-accent" x="337" y="208" width="160" height="52" rx="6" />
  <text class="body-text-inv" x="417" y="233">131K tokens,</text>
  <text class="body-text-inv" x="417" y="247">64 docs listwise</text>
  <rect class="card-neutral" x="503" y="208" width="160" height="52" rx="6" />
  <text class="body-text" x="583" y="238">No</text>
  <rect class="card-neutral" x="669" y="208" width="160" height="52" rx="6" />
  <text class="body-text" x="749" y="233">CC BY-NC 4.0 —</text>
  <text class="body-text" x="749" y="247">ask first</text>

  <!-- Row 4: Qwen3 -->
  <text class="row-head" x="154" y="292">Qwen</text>
  <text class="row-head" x="154" y="306" style="font-weight:400;opacity:.65">Qwen3 0.6/4/8B</text>
  <rect class="card-accent" x="171" y="268" width="160" height="52" rx="6" />
  <text class="body-text-inv" x="251" y="293">Open weights, self-host</text>
  <rect class="card-soft" x="337" y="268" width="160" height="52" rx="6" />
  <text class="body-text" x="417" y="298">Model-dependent</text>
  <rect class="card-accent" x="503" y="268" width="160" height="52" rx="6" />
  <text class="body-text-inv" x="583" y="298">Yes, instruction field</text>
  <rect class="card-accent" x="669" y="268" width="160" height="52" rx="6" />
  <text class="body-text-inv" x="749" y="298">Apache 2.0</text>

  <!-- Legend -->
  <rect class="card-accent" x="171" y="344" width="16" height="16" rx="3" />
  <text class="legend-text" x="195" y="357">Strongest on this axis</text>
  <rect class="card-soft" x="380" y="344" width="16" height="16" rx="3" />
  <text class="legend-text" x="404" y="357">Adequate</text>
  <rect class="card-neutral" x="530" y="344" width="16" height="16" rx="3" />
  <text class="legend-text" x="554" y="357">A constraint you will feel</text>
</svg>
