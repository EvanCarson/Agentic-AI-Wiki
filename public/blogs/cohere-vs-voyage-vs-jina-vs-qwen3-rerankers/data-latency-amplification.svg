<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" role="img" aria-labelledby="t d">
  <title id="t">Reranker latency, multiplied by an agent's retrieval count</title>
  <desc id="d">Three horizontal bars showing independently measured single-query reranker latency, with the wall-clock each adds to an agent task that reranks forty times. A sub-200ms reranker adds under eight seconds; a one-second reranker adds forty.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-label    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: currentColor; text-anchor: end; }
    .row-sub      { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: currentColor; opacity: .6; text-anchor: end; }
    .value-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: start; }
    .axis-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: currentColor; opacity: .55; text-anchor: middle; }
    .grid         { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .bar-accent   { fill: var(--accent, #d4421e); }
    .bar-soft     { fill: var(--accent-soft, #f5c5b8); }
    .bar-neutral  { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="490" y="30">Single-query latency, and what it costs an agent that reranks 40 times</text>

  <line class="grid" x1="250" y1="52" x2="250" y2="238" />
  <line class="grid" x1="370" y1="52" x2="370" y2="238" />
  <line class="grid" x1="490" y1="52" x2="490" y2="238" />
  <line class="grid" x1="610" y1="52" x2="610" y2="238" />
  <line class="grid" x1="730" y1="52" x2="730" y2="238" />
  <text class="axis-label" x="250" y="256">0</text>
  <text class="axis-label" x="370" y="256">250 ms</text>
  <text class="axis-label" x="490" y="256">500 ms</text>
  <text class="axis-label" x="610" y="256">750 ms</text>
  <text class="axis-label" x="730" y="256">1,000 ms</text>

  <text class="row-label" x="240" y="82">Jina Reranker v3</text>
  <text class="row-sub" x="240" y="96">self-hosted, listwise</text>
  <rect class="bar-accent" x="250" y="70" width="90" height="24" rx="3" />
  <text class="value-label" x="348" y="87">188 ms &#183; +7.5 s per task</text>

  <text class="row-label" x="240" y="142">Cohere Rerank 3.5</text>
  <text class="row-sub" x="240" y="156">hosted API, includes network</text>
  <rect class="bar-soft" x="250" y="130" width="288" height="24" rx="3" />
  <text class="value-label" x="546" y="147">~600 ms &#183; +24 s per task</text>

  <text class="row-label" x="240" y="202">Qwen3-Reranker-4B</text>
  <text class="row-sub" x="240" y="216">self-hosted, pointwise</text>
  <rect class="bar-neutral" x="250" y="190" width="480" height="24" rx="3" />
  <text class="value-label" x="738" y="207">&#62;1,000 ms &#183; +40 s per task</text>
</svg>
