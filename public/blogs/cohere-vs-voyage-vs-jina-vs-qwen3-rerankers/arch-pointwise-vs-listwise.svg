<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d">
  <title id="t">Pointwise cross-encoder scoring versus listwise reranking</title>
  <desc id="d">Left: a pointwise cross-encoder pairs the query with each candidate separately, producing one forward pass per candidate and scores that never see each other. Right: a listwise reranker places the query and all candidates in one context, so a single pass produces scores informed by every other candidate.</desc>
  <style>
    .panel-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .label       { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: currentColor; text-anchor: middle; }
    .label-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); text-anchor: middle; }
    .sub         { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .65; text-anchor: middle; }
    .box         { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero        { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj         { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .divider     { stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .arrow       { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <line class="divider" x1="450" y1="40" x2="450" y2="430" />

  <!-- LEFT: pointwise -->
  <text class="panel-title" x="225" y="34">Pointwise cross-encoder</text>
  <text class="sub" x="225" y="52">Cohere, Voyage, Qwen3-Reranker</text>

  <rect class="adj" x="140" y="70" width="170" height="34" rx="8" />
  <text class="label" x="225" y="92">query + candidate 1</text>
  <rect class="adj" x="140" y="114" width="170" height="34" rx="8" />
  <text class="label" x="225" y="136">query + candidate 2</text>
  <rect class="adj" x="140" y="158" width="170" height="34" rx="8" />
  <text class="label" x="225" y="180">query + candidate 3</text>
  <text class="sub" x="225" y="212">… one pair per candidate …</text>

  <path class="arrow" d="M 225 220 L 225 250" />

  <rect class="hero" x="120" y="258" width="210" height="46" rx="8" />
  <text class="label-inv" x="225" y="278">N forward passes</text>
  <text class="label-inv" x="225" y="294" style="opacity:.85">one per candidate</text>

  <path class="arrow" d="M 225 310 L 225 340" />

  <rect class="box" x="120" y="348" width="210" height="60" rx="8" />
  <text class="label" x="225" y="372">N independent scores</text>
  <text class="sub" x="225" y="392">no candidate sees another</text>

  <!-- RIGHT: listwise -->
  <text class="panel-title" x="675" y="34">Listwise reranker</text>
  <text class="sub" x="675" y="52">Jina Reranker v3 / v3.5</text>

  <rect class="adj" x="560" y="70" width="230" height="142" rx="8" />
  <text class="label" x="675" y="96">query</text>
  <text class="label" x="675" y="122">candidate 1</text>
  <text class="label" x="675" y="146">candidate 2</text>
  <text class="label" x="675" y="170">candidate 3</text>
  <text class="sub" x="675" y="196">… up to 64, one context …</text>

  <path class="arrow" d="M 675 220 L 675 250" />

  <rect class="hero" x="570" y="258" width="210" height="46" rx="8" />
  <text class="label-inv" x="675" y="278">1 forward pass</text>
  <text class="label-inv" x="675" y="294" style="opacity:.85">all candidates together</text>

  <path class="arrow" d="M 675 310 L 675 340" />

  <rect class="box" x="570" y="348" width="210" height="60" rx="8" />
  <text class="label" x="675" y="372">one ranked list</text>
  <text class="sub" x="675" y="392">scores see each other</text>
</svg>
