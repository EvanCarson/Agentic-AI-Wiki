<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Tools comparison</title>
  <desc id="d">Side-by-side: OpenClaw runs skills inside an eBPF sandbox, OpenHuman pulls data through connector arrows into a central node, Hermes Agent has a 3x3 grid tool registry of pluggable tools.</desc>
  <style>
    .col-label  { font-family: 'Fraunces', serif; font-size: 16px; fill: currentColor; text-anchor: middle; }
    .shape      { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .accent     { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; }
    .desc-text  { font-family: 'Inter', sans-serif; font-size: 12px; fill: currentColor; opacity: .75; text-anchor: middle; }
    .inner-label { font-family: 'Inter', sans-serif; font-size: 11px; fill: currentColor; opacity: .65; text-anchor: middle; }
    .arrow      { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Column labels -->
  <text class="col-label" x="160" y="35">OpenClaw</text>
  <text class="col-label" x="450" y="35">OpenHuman</text>
  <text class="col-label" x="750" y="35">Hermes Agent</text>

  <!-- Dividers -->
  <line class="shape" x1="305" y1="50" x2="305" y2="285" stroke-dasharray="4 3" />
  <line class="shape" x1="600" y1="50" x2="600" y2="285" stroke-dasharray="4 3" />

  <!-- OpenClaw: skill box inside dashed sandbox outline -->
  <rect class="shape" x="70" y="70" width="180" height="160" rx="8" stroke-dasharray="6 4" />
  <text class="inner-label" x="160" y="95">eBPF sandbox</text>
  <rect class="shape" x="100" y="110" width="120" height="50" rx="6" />
  <text class="inner-label" x="160" y="140">skill</text>
  <text class="desc-text" x="160" y="270">Sandboxed skill runner</text>

  <!-- OpenHuman: 3 arrows into a central node -->
  <circle class="shape" cx="450" cy="155" r="22" />
  <text class="inner-label" x="450" y="159">hub</text>
  <!-- Arrow from top-left -->
  <path class="arrow" d="M 378 100 L 432 140" />
  <!-- Arrow from left -->
  <path class="arrow" d="M 370 155 L 428 155" />
  <!-- Arrow from bottom-left -->
  <path class="arrow" d="M 378 210 L 432 170" />
  <text class="inner-label" x="355" y="96">connector A</text>
  <text class="inner-label" x="345" y="158">connector B</text>
  <text class="inner-label" x="355" y="214">connector C</text>
  <text class="desc-text" x="450" y="270">Connector pull model</text>

  <!-- Hermes: 3x3 grid of small rectangles (tool registry) -->
  <rect class="shape" x="660" y="80" width="40" height="30" rx="3" />
  <rect class="shape" x="710" y="80" width="40" height="30" rx="3" />
  <rect class="shape" x="760" y="80" width="40" height="30" rx="3" />
  <rect class="shape" x="660" y="120" width="40" height="30" rx="3" />
  <rect class="shape" x="710" y="120" width="40" height="30" rx="3" />
  <rect class="shape" x="760" y="120" width="40" height="30" rx="3" />
  <rect class="shape" x="660" y="160" width="40" height="30" rx="3" />
  <rect class="shape" x="710" y="160" width="40" height="30" rx="3" />
  <rect class="shape" x="760" y="160" width="40" height="30" rx="3" />
  <text class="inner-label" x="750" y="215">tool registry</text>
  <text class="desc-text" x="750" y="270">Pluggable tool registry</text>
</svg>
