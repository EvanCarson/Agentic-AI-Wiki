<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Tools comparison</title>
  <desc id="d">Side-by-side: OpenClaw runs skills inside an eBPF sandbox, OpenHuman pulls data through 118 connector arrows into a central memory node, Hermes Agent has a 3x3 grid tool registry of pluggable tools.</desc>
  <defs>
    <filter id="ct-shadow" x="-6%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--ink, #1a1a1a)" flood-opacity="0.08" />
    </filter>
    <marker id="ct-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="currentColor" opacity="0.55" />
    </marker>
  </defs>
  <style>
    .col-label   { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .divider     { stroke: var(--border-soft, #d8d4ce); stroke-width: 1; stroke-dasharray: 4 4; }
    .sandbox     { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.5; stroke-dasharray: 7 5; }
    .shape-fill  { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.5; filter: url(#ct-shadow); }
    .accent-fill { fill: var(--accent, #d4421e); stroke: none; filter: url(#ct-shadow); }
    .accent-adj  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; filter: url(#ct-shadow); }
    .grid-tile   { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; filter: url(#ct-shadow); }
    .grid-tile-a { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; filter: url(#ct-shadow); }
    .inner-label { font-family: 'Inter', sans-serif; font-size: 11px; fill: currentColor; opacity: .70; text-anchor: middle; }
    .inner-inv   { font-family: 'Inter', sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .desc-text   { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--muted, #888); text-anchor: middle; }
    .winner-label{ font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; fill: var(--accent, #d4421e); text-anchor: middle; }
    .arrow       { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#ct-arr); opacity: 0.55; }
  </style>

  <!-- Column labels -->
  <text class="col-label" x="160" y="36">OpenClaw</text>
  <text class="col-label" x="450" y="36">OpenHuman</text>
  <text class="col-label" x="750" y="36">Hermes Agent</text>

  <!-- Dividers -->
  <line class="divider" x1="305" y1="50" x2="305" y2="285" />
  <line class="divider" x1="600" y1="50" x2="600" y2="285" />

  <!-- OpenClaw: skill box inside dashed sandbox outline -->
  <rect class="sandbox" x="64" y="62" width="192" height="170" rx="10" ry="10" />
  <text class="inner-label" x="160" y="86">eBPF sandbox</text>
  <rect class="accent-fill" x="96" y="100" width="128" height="58" rx="7" ry="7" />
  <text class="inner-inv" x="160" y="134">skill runner</text>
  <text class="desc-text" x="160" y="265">Sandboxed skill runner</text>

  <!-- OpenHuman: filled hub + connector arrows -->
  <circle class="accent-fill" cx="450" cy="152" r="24" />
  <text class="inner-inv" x="450" y="156">hub</text>
  <!-- Three connector arrows from left side -->
  <path class="arrow" d="M 374 100 L 430 138" />
  <path class="arrow" d="M 366 152 L 426 152" />
  <path class="arrow" d="M 374 204 L 430 166" />
  <!-- Connector source labels -->
  <text class="inner-label" x="351" y="96">connector A</text>
  <text class="inner-label" x="341" y="155">connector B</text>
  <text class="inner-label" x="351" y="208">connector C</text>
  <text class="winner-label" x="450" y="265">118-connector pull model</text>

  <!-- Hermes: filled 3×3 grid of tool tiles -->
  <rect class="grid-tile" x="656" y="72" width="42" height="34" rx="4" ry="4" />
  <rect class="grid-tile" x="706" y="72" width="42" height="34" rx="4" ry="4" />
  <rect class="grid-tile-a" x="756" y="72" width="42" height="34" rx="4" ry="4" />
  <rect class="grid-tile" x="656" y="114" width="42" height="34" rx="4" ry="4" />
  <rect class="grid-tile-a" x="706" y="114" width="42" height="34" rx="4" ry="4" />
  <rect class="grid-tile" x="756" y="114" width="42" height="34" rx="4" ry="4" />
  <rect class="grid-tile-a" x="656" y="156" width="42" height="34" rx="4" ry="4" />
  <rect class="grid-tile" x="706" y="156" width="42" height="34" rx="4" ry="4" />
  <rect class="grid-tile" x="756" y="156" width="42" height="34" rx="4" ry="4" />
  <text class="inner-label" x="750" y="210">40+ tools · pluggable</text>
  <text class="desc-text" x="750" y="265">Pluggable tool registry</text>
</svg>
