<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="stars-title stars-desc">
  <title id="stars-title">GitHub stars comparison</title>
  <desc id="stars-desc">Horizontal bar chart: OpenClaw leads with 347,000 GitHub stars, Hermes Agent has 140,000, and OpenHuman has 7,800.</desc>
  <defs>
    <filter id="shadow-bar" x="-2%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--ink, #1a1a1a)" flood-opacity="0.10" />
    </filter>
  </defs>
  <style>
    .chart-title  { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; fill: currentColor; }
    .proj-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .bar-val      { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; dominant-baseline: central; }
    .grid-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: middle; }
    .grid-line    { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .bar-primary  { fill: var(--accent, #d4421e); filter: url(#shadow-bar); }
    .bar-secondary{ fill: var(--accent-soft, #f5c5b8); filter: url(#shadow-bar); }
    .bar-tertiary { fill: var(--paper-2, #f0ede8); filter: url(#shadow-bar); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .axis-label   { font-family: 'Fraunces', serif; font-size: 13px; fill: var(--muted, #888); text-anchor: middle; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="38" text-anchor="middle">GitHub stars (thousands)</text>

  <!-- Chart area: left margin 200, right margin 80, top 70, bottom 60 -->
  <!-- Total chart width = 900 - 200 - 80 = 620px for max value 347000 -->
  <!-- Scale: 620 / 347000 = 0.001787... px per star -->

  <!-- Grid lines at 100K, 200K, 300K -->
  <!-- x positions: 200 + (100000 * 620/347000) = 200 + 178.7 = ~379 -->
  <!-- x positions: 200 + (200000 * 620/347000) = 200 + 357.4 = ~557 -->
  <!-- x positions: 200 + (300000 * 620/347000) = 200 + 536.0 = ~736 -->

  <line class="grid-line" x1="379" y1="68" x2="379" y2="320" />
  <line class="grid-line" x1="557" y1="68" x2="557" y2="320" />
  <line class="grid-line" x1="736" y1="68" x2="736" y2="320" />

  <text class="grid-label" x="379" y="335">100K</text>
  <text class="grid-label" x="557" y="335">200K</text>
  <text class="grid-label" x="736" y="335">300K</text>

  <!-- Baseline line -->
  <line x1="200" y1="320" x2="820" y2="320" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" />

  <!-- === OpenClaw bar: 347,000 === -->
  <!-- bar width = 347000 / 347000 * 620 = 620 -->
  <text class="proj-label" x="192" y="130">OpenClaw</text>
  <rect class="bar-primary" x="200" y="100" width="620" height="48" rx="5" ry="5" />
  <text class="bar-val" x="828" y="124" style="fill: var(--accent, #d4421e);">347,000</text>

  <!-- === Hermes Agent bar: 140,000 === -->
  <!-- bar width = 140000 / 347000 * 620 = 250.1 -->
  <text class="proj-label" x="192" y="210">Hermes Agent</text>
  <rect class="bar-secondary" x="200" y="180" width="250" height="48" rx="5" ry="5" />
  <text class="bar-val" x="458" y="204" style="fill: var(--ink, #1a1a1a);">140,000</text>

  <!-- === OpenHuman bar: 7,800 === -->
  <!-- bar width = 7800 / 347000 * 620 = 13.9 → render as 14 but show a min-width of 18 for visibility -->
  <text class="proj-label" x="192" y="290">OpenHuman</text>
  <rect class="bar-tertiary" x="200" y="260" width="18" height="48" rx="5" ry="5" />
  <text class="bar-val" x="226" y="284" style="fill: var(--muted, #888);">7,800</text>

</svg>
