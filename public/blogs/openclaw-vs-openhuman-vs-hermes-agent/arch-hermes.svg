<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Hermes Agent architecture</title>
  <desc id="d">Hermes Agent routes natural language tasks through a central Planner that selects from 40+ tools and any LLM backend, persists outcomes to an episodic memory store, and retrieves past attempts to self-improve on future runs.</desc>
  <style>
    .box    { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .accent { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.75; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: currentColor; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: currentColor; opacity: .65; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- User goal -->
  <rect class="box" x="30" y="220" width="160" height="60" rx="8" ry="8" />
  <text class="label" x="110" y="246" text-anchor="middle">User goal</text>
  <text class="sub" x="110" y="265" text-anchor="middle">natural language task</text>

  <!-- Planner (accent, center) -->
  <rect class="accent" x="340" y="200" width="220" height="100" rx="8" ry="8" />
  <text class="label" x="450" y="238" text-anchor="middle">Planner</text>
  <text class="sub" x="450" y="258" text-anchor="middle">decompose · select tool · loop</text>
  <text class="sub" x="450" y="275" text-anchor="middle">model-agnostic orchestrator</text>

  <!-- Tool library (40+) -->
  <rect class="box" x="660" y="100" width="190" height="70" rx="8" ry="8" />
  <text class="label" x="755" y="131" text-anchor="middle">Tool library (40+)</text>
  <text class="sub" x="755" y="150" text-anchor="middle">registered + pluggable</text>

  <!-- LLM backend -->
  <rect class="box" x="660" y="310" width="190" height="70" rx="8" ry="8" />
  <text class="label" x="755" y="341" text-anchor="middle">LLM backend</text>
  <text class="sub" x="755" y="360" text-anchor="middle">any provider / local</text>

  <!-- Episodic memory store -->
  <rect class="box" x="340" y="390" width="220" height="70" rx="8" ry="8" />
  <text class="label" x="450" y="421" text-anchor="middle">Episodic memory store</text>
  <text class="sub" x="450" y="440" text-anchor="middle">past attempts · retrievable</text>

  <!-- Outcome -->
  <rect class="box" x="660" y="210" width="190" height="60" rx="8" ry="8" />
  <text class="label" x="755" y="236" text-anchor="middle">Outcome</text>
  <text class="sub" x="755" y="254" text-anchor="middle">execution result</text>

  <!-- Arrows -->
  <!-- goal → Planner -->
  <path class="arrow" d="M 190 250 L 340 250" />

  <!-- Planner → Tools -->
  <path class="arrow" d="M 530 220 L 660 145" />
  <!-- Tools → Planner -->
  <path class="arrow" d="M 660 155 L 530 230" />

  <!-- Planner → LLM -->
  <path class="arrow" d="M 530 280 L 660 335" />
  <!-- LLM → Planner -->
  <path class="arrow" d="M 660 325 L 530 270" />

  <!-- Planner → Outcome -->
  <path class="arrow" d="M 560 240 L 660 240" />

  <!-- Planner → Episodic memory (write after task) -->
  <path class="arrow" d="M 480 300 L 480 390" />

  <!-- Episodic memory → Planner (retrieve before next task) -->
  <path class="arrow" d="M 420 390 L 420 300" />
</svg>
