<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Hermes Agent architecture</title>
  <desc id="d">Hermes Agent routes natural language tasks through a central Planner that selects from 40+ tools and any LLM backend, persists outcomes to an episodic memory store, and retrieves past attempts to self-improve on future runs.</desc>
  <defs>
    <filter id="ha-shadow" x="-8%" y="-8%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="var(--ink, #1a1a1a)" flood-opacity="0.10" />
    </filter>
    <marker id="ha-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="currentColor" />
    </marker>
  </defs>
  <style>
    .box        { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; filter: url(#ha-shadow); }
    .accent-box { fill: var(--accent, #d4421e); stroke: none; filter: url(#ha-shadow); }
    .accent-adj { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; filter: url(#ha-shadow); }
    .label      { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 500; fill: currentColor; }
    .sub        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: currentColor; opacity: 0.65; }
    .label-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 500; fill: var(--paper, #fff); }
    .sub-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: var(--paper, #fff); opacity: 0.80; }
    .arrow      { fill: none; stroke: currentColor; stroke-width: 1.75; marker-end: url(#ha-arr); opacity: 0.70; }
    .group-bg-fill { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; }
  </style>

  <!-- Backend group background -->
  <rect class="group-bg-fill" x="644" y="60" width="240" height="310" rx="10" ry="10" />
  <text style="font-family:'Inter',system-ui,sans-serif;font-size:10px;fill:var(--muted,#888);letter-spacing:.04em;" x="764" y="78" text-anchor="middle">BACKENDS</text>

  <!-- Memory group background -->
  <rect class="group-bg-fill" x="310" y="360" width="260" height="110" rx="10" ry="10" />
  <text style="font-family:'Inter',system-ui,sans-serif;font-size:10px;fill:var(--muted,#888);letter-spacing:.04em;" x="440" y="378" text-anchor="middle">EPISODIC MEMORY</text>

  <!-- User goal -->
  <rect class="box" x="28" y="210" width="168" height="68" rx="8" ry="8" />
  <text class="label" x="112" y="241" text-anchor="middle">User goal</text>
  <text class="sub" x="112" y="261" text-anchor="middle">natural language task</text>

  <!-- Planner (accent, hero) -->
  <rect class="accent-box" x="316" y="192" width="240" height="108" rx="10" ry="10" />
  <text class="label-inv" x="436" y="228" text-anchor="middle">Planner</text>
  <text class="sub-inv" x="436" y="250" text-anchor="middle">decompose · select tool · loop</text>
  <text class="sub-inv" x="436" y="270" text-anchor="middle">model-agnostic orchestrator</text>

  <!-- Tool library (accent-adjacent) -->
  <rect class="accent-adj" x="656" y="88" width="210" height="72" rx="8" ry="8" />
  <text class="label" x="761" y="118" text-anchor="middle">Tool library (40+)</text>
  <text class="sub" x="761" y="140" text-anchor="middle">registered + pluggable</text>

  <!-- LLM backend -->
  <rect class="accent-adj" x="656" y="220" width="210" height="72" rx="8" ry="8" />
  <text class="label" x="761" y="250" text-anchor="middle">LLM backend</text>
  <text class="sub" x="761" y="270" text-anchor="middle">any provider / local model</text>

  <!-- Outcome -->
  <rect class="box" x="656" y="320" width="210" height="62" rx="8" ry="8" />
  <text class="label" x="761" y="347" text-anchor="middle">Outcome</text>
  <text class="sub" x="761" y="367" text-anchor="middle">execution result</text>

  <!-- Episodic memory store -->
  <rect class="box" x="320" y="388" width="240" height="68" rx="8" ry="8" />
  <text class="label" x="440" y="418" text-anchor="middle">Episodic memory store</text>
  <text class="sub" x="440" y="438" text-anchor="middle">past attempts · retrievable</text>

  <!-- Arrows -->
  <!-- goal → Planner -->
  <path class="arrow" d="M 196 244 L 316 244" />

  <!-- Planner ↔ Tool library -->
  <path class="arrow" d="M 540 212 Q 610 164 656 138" />
  <path class="arrow" d="M 656 152 Q 608 180 540 224" />

  <!-- Planner ↔ LLM backend -->
  <path class="arrow" d="M 540 268 Q 604 268 656 260" />
  <path class="arrow" d="M 656 274 Q 600 280 540 278" />

  <!-- Planner → Outcome -->
  <path class="arrow" d="M 544 246 Q 600 300 656 346" />

  <!-- Planner → Episodic memory (write after task) -->
  <path class="arrow" d="M 470 300 L 470 388" />

  <!-- Episodic memory → Planner (retrieve before next task) -->
  <path class="arrow" d="M 412 388 L 412 300" />
</svg>
