<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="matrix-title matrix-desc">
  <title id="matrix-title">Feature comparison matrix</title>
  <desc id="matrix-desc">Heatmap grid comparing OpenClaw, OpenHuman, and Hermes Agent across five axes: Memory richness, Sandboxing strength, Tool count, Extensibility, and Deployment simplicity. Strength indicated by fill color from light (weak) to dark orange-red (strong).</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="32" text-anchor="middle">Feature strength by project</text>

  <!--
    Layout:
    - Left margin for row labels: 190px
    - 5 columns of width 120px each = 600px total
    - Start x = 190, so cols at: 190, 310, 430, 550, 670, end=790
    - 3 rows of height 64px each
    - Top area for col headers: y=55 (header text), y=70 (row start)
    - Rows at y: 70, 134, 198
  -->

  <!-- Column headers (axis names, wrapped to 2 lines) -->
  <text class="col-head" x="250" y="54">Memory</text>
  <text class="col-head" x="250" y="67">richness</text>

  <text class="col-head" x="370" y="54">Sandboxing</text>
  <text class="col-head" x="370" y="67">strength</text>

  <text class="col-head" x="490" y="54">Tool count</text>
  <text class="col-head" x="490" y="67">/ breadth</text>

  <text class="col-head" x="610" y="54">Extensi-</text>
  <text class="col-head" x="610" y="67">bility</text>

  <text class="col-head" x="730" y="54">Deployment</text>
  <text class="col-head" x="730" y="67">simplicity</text>

  <!-- === Row 1: OpenClaw === -->
  <text class="row-head" x="182" y="102">OpenClaw</text>
  <!-- Memory: medium -->
  <rect class="cell-medium" x="190" y="70" width="120" height="64" rx="4" />
  <text class="cell-text" x="250" y="102">Medium</text>
  <!-- Sandboxing: strong -->
  <rect class="cell-strong" x="310" y="70" width="120" height="64" rx="4" />
  <text class="cell-text-inv" x="370" y="96">Strong</text>
  <text class="cell-text-inv" x="370" y="112">(eBPF)</text>
  <!-- Tools: strong -->
  <rect class="cell-strong" x="430" y="70" width="120" height="64" rx="4" />
  <text class="cell-text-inv" x="490" y="102">Strong</text>
  <!-- Extensibility: medium -->
  <rect class="cell-medium" x="550" y="70" width="120" height="64" rx="4" />
  <text class="cell-text" x="610" y="102">Medium</text>
  <!-- Deployment: medium -->
  <rect class="cell-medium" x="670" y="70" width="120" height="64" rx="4" />
  <text class="cell-text" x="730" y="102">Medium</text>

  <!-- === Row 2: OpenHuman === -->
  <text class="row-head" x="182" y="166">OpenHuman</text>
  <!-- Memory: strong -->
  <rect class="cell-strong" x="190" y="134" width="120" height="64" rx="4" />
  <text class="cell-text-inv" x="250" y="160">Strong</text>
  <text class="cell-text-inv" x="250" y="176">(life-tree)</text>
  <!-- Sandboxing: weak -->
  <rect class="cell-weak" x="310" y="134" width="120" height="64" rx="4" />
  <text class="cell-text" x="370" y="166">Weak</text>
  <!-- Tools: strong -->
  <rect class="cell-strong" x="430" y="134" width="120" height="64" rx="4" />
  <text class="cell-text-inv" x="490" y="160">Strong</text>
  <text class="cell-text-inv" x="490" y="176">(118 conn.)</text>
  <!-- Extensibility: strong -->
  <rect class="cell-strong" x="550" y="134" width="120" height="64" rx="4" />
  <text class="cell-text-inv" x="610" y="166">Strong</text>
  <!-- Deployment: strong -->
  <rect class="cell-strong" x="670" y="134" width="120" height="64" rx="4" />
  <text class="cell-text-inv" x="730" y="160">Strong</text>
  <text class="cell-text-inv" x="730" y="176">(desktop)</text>

  <!-- === Row 3: Hermes Agent === -->
  <text class="row-head" x="182" y="230">Hermes Agent</text>
  <!-- Memory: strong -->
  <rect class="cell-strong" x="190" y="198" width="120" height="64" rx="4" />
  <text class="cell-text-inv" x="250" y="224">Strong</text>
  <text class="cell-text-inv" x="250" y="240">(episodic)</text>
  <!-- Sandboxing: medium -->
  <rect class="cell-medium" x="310" y="198" width="120" height="64" rx="4" />
  <text class="cell-text" x="370" y="230">Medium</text>
  <!-- Tools: medium -->
  <rect class="cell-medium" x="430" y="198" width="120" height="64" rx="4" />
  <text class="cell-text" x="490" y="224">Medium</text>
  <text class="cell-text" x="490" y="240">(40+ tools)</text>
  <!-- Extensibility: strong -->
  <rect class="cell-strong" x="550" y="198" width="120" height="64" rx="4" />
  <text class="cell-text-inv" x="610" y="224">Strong</text>
  <text class="cell-text-inv" x="610" y="240">(tool+model)</text>
  <!-- Deployment: medium -->
  <rect class="cell-medium" x="670" y="198" width="120" height="64" rx="4" />
  <text class="cell-text" x="730" y="230">Medium</text>

  <!-- Legend -->
  <rect class="legend-box-w" x="190" y="290" width="18" height="18" rx="3" />
  <text class="legend-text" x="215" y="299">Weak</text>

  <rect class="legend-box-m" x="280" y="290" width="18" height="18" rx="3" />
  <text class="legend-text" x="305" y="299">Medium</text>

  <rect class="legend-box-s" x="380" y="290" width="18" height="18" rx="3" />
  <text class="legend-text" x="405" y="299">Strong</text>

</svg>
