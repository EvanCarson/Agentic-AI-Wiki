<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Extensibility comparison</title>
  <desc id="d">Side-by-side: OpenClaw extends via a Skill SDK puzzle-piece interface, OpenHuman extends via a Connector plugin slot system, Hermes Agent extends via both a tool slot and a swappable model slot.</desc>
  <style>
    .col-label  { font-family: 'Fraunces', serif; font-size: 16px; fill: currentColor; text-anchor: middle; }
    .shape      { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .accent     { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; }
    .desc-text  { font-family: 'Inter', sans-serif; font-size: 12px; fill: currentColor; opacity: .75; text-anchor: middle; }
    .inner-label { font-family: 'Inter', sans-serif; font-size: 12px; fill: currentColor; opacity: .8; text-anchor: middle; }
  </style>

  <!-- Column labels -->
  <text class="col-label" x="160" y="35">OpenClaw</text>
  <text class="col-label" x="450" y="35">OpenHuman</text>
  <text class="col-label" x="750" y="35">Hermes Agent</text>

  <!-- Dividers -->
  <line class="shape" x1="305" y1="50" x2="305" y2="285" stroke-dasharray="4 3" />
  <line class="shape" x1="600" y1="50" x2="600" y2="285" stroke-dasharray="4 3" />

  <!-- OpenClaw: puzzle piece (jagged rectangle) labeled "Skill SDK" -->
  <!-- Main rectangle body -->
  <path class="shape" d="
    M 85 100
    L 200 100
    L 200 155
    Q 218 155 218 170 Q 218 185 200 185
    L 200 220
    L 85 220
    L 85 185
    Q 67 185 67 170 Q 67 155 85 155
    Z
  " />
  <text class="inner-label" x="143" y="162">Skill SDK</text>
  <text class="desc-text" x="160" y="270">Plugin via Skill SDK</text>

  <!-- OpenHuman: slot/socket shape labeled "Connector plugin" -->
  <!-- Socket outline -->
  <rect class="shape" x="370" y="95" width="160" height="90" rx="8" />
  <!-- Slot cutout hints (two small rectangles representing pins) -->
  <rect class="shape" x="405" y="140" width="20" height="35" rx="3" />
  <rect class="shape" x="475" y="140" width="20" height="35" rx="3" />
  <text class="inner-label" x="450" y="120">Connector</text>
  <text class="inner-label" x="450" y="137">plugin</text>
  <text class="desc-text" x="450" y="270">Connector plugin slot</text>

  <!-- Hermes: two stacked slots labeled "tool" and "model" -->
  <!-- Tool slot -->
  <rect class="shape" x="665" y="95" width="170" height="50" rx="6" />
  <text class="inner-label" x="750" y="120">tool</text>
  <text class="inner-label" x="750" y="138">— pluggable —</text>
  <!-- Model slot -->
  <rect class="shape" x="665" y="155" width="170" height="50" rx="6" />
  <text class="inner-label" x="750" y="180">model</text>
  <text class="inner-label" x="750" y="198">— swappable —</text>
  <text class="desc-text" x="750" y="270">Tool + model swap slots</text>
</svg>
