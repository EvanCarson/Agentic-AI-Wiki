<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Extensibility comparison</title>
  <desc id="d">Side-by-side: OpenClaw extends via a Skill SDK puzzle-piece interface, OpenHuman extends via a Connector plugin slot system, Hermes Agent extends via both a tool slot and a swappable model slot.</desc>
  <defs>
    <filter id="ce-shadow" x="-6%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--ink, #1a1a1a)" flood-opacity="0.08" />
    </filter>
  </defs>
  <style>
    .col-label   { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .divider     { stroke: var(--border-soft, #d8d4ce); stroke-width: 1; stroke-dasharray: 4 4; }
    .shape-fill  { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.5; filter: url(#ce-shadow); }
    .accent-fill { fill: var(--accent, #d4421e); stroke: none; filter: url(#ce-shadow); }
    .accent-adj  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.5; filter: url(#ce-shadow); }
    .inner-label { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .inner-inv   { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; fill: var(--paper, #fff); text-anchor: middle; }
    .slot-label  { font-family: 'Inter', sans-serif; font-size: 11px; fill: currentColor; opacity: .65; text-anchor: middle; }
    .desc-text   { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--muted, #888); text-anchor: middle; }
    .winner-label{ font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; fill: var(--accent, #d4421e); text-anchor: middle; }
  </style>

  <!-- Column labels -->
  <text class="col-label" x="160" y="36">OpenClaw</text>
  <text class="col-label" x="450" y="36">OpenHuman</text>
  <text class="col-label" x="750" y="36">Hermes Agent</text>

  <!-- Dividers -->
  <line class="divider" x1="305" y1="50" x2="305" y2="285" />
  <line class="divider" x1="600" y1="50" x2="600" y2="285" />

  <!-- OpenClaw: puzzle piece with fill -->
  <path class="shape-fill" d="
    M 78 90
    L 200 90
    L 200 148
    Q 220 148 220 164 Q 220 180 200 180
    L 200 222
    L 78 222
    L 78 180
    Q 58 180 58 164 Q 58 148 78 148
    Z
  " />
  <text class="inner-label" x="139" y="150">Skill SDK</text>
  <text class="slot-label" x="139" y="170">+ eBPF enforced</text>
  <text class="desc-text" x="160" y="265">Plugin via Skill SDK</text>

  <!-- OpenHuman: filled socket/connector shape -->
  <rect class="accent-adj" x="363" y="85" width="174" height="100" rx="8" ry="8" />
  <!-- Pin slots -->
  <rect class="shape-fill" x="398" y="135" width="22" height="38" rx="3" ry="3" />
  <rect class="shape-fill" x="470" y="135" width="22" height="38" rx="3" ry="3" />
  <text class="inner-label" x="450" y="112">Connector</text>
  <text class="inner-label" x="450" y="130">plugin slot</text>
  <text class="winner-label" x="450" y="265">Connector plugin + tool add</text>

  <!-- Hermes: two stacked slots (tool + model) -->
  <rect class="accent-adj" x="651" y="85" width="198" height="56" rx="6" ry="6" />
  <text class="inner-label" x="750" y="108">tool</text>
  <text class="slot-label" x="750" y="128">— pluggable —</text>

  <rect class="accent-fill" x="651" y="151" width="198" height="56" rx="6" ry="6" />
  <text class="inner-inv" x="750" y="174">model</text>
  <text style="font-family:'Inter',sans-serif;font-size:11px;fill:var(--paper,#fff);opacity:0.8;text-anchor:middle;" x="750" y="194">— swappable —</text>

  <text class="winner-label" x="750" y="265">Tool + model swap slots</text>
</svg>
