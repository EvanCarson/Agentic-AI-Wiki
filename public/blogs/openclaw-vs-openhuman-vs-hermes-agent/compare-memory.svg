<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Memory comparison</title>
  <desc id="d">Side-by-side: OpenClaw uses a transactional SQLite task ledger, OpenHuman uses a Markdown memory tree with branching context blocks, Hermes Agent uses an episodic case base of past task attempts.</desc>
  <defs>
    <filter id="cm-shadow" x="-6%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--ink, #1a1a1a)" flood-opacity="0.08" />
    </filter>
  </defs>
  <style>
    .col-label  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .divider    { stroke: var(--border-soft, #d8d4ce); stroke-width: 1; stroke-dasharray: 4 4; }
    .shape-fill { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.5; filter: url(#cm-shadow); }
    .accent-fill{ fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.5; filter: url(#cm-shadow); }
    .node-fill  { fill: var(--accent, #d4421e); stroke: none; filter: url(#cm-shadow); }
    .node-dot   { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .branch-line{ stroke: var(--border-soft, #d8d4ce); stroke-width: 1.5; }
    .desc-text  { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--muted, #888); text-anchor: middle; }
    .row-label  { font-family: 'Inter', sans-serif; font-size: 11px; fill: currentColor; opacity: .75; text-anchor: middle; }
    .winner-label{ font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; fill: var(--accent, #d4421e); text-anchor: middle; }
  </style>

  <!-- Column labels -->
  <text class="col-label" x="160" y="36">OpenClaw</text>
  <text class="col-label" x="450" y="36">OpenHuman</text>
  <text class="col-label" x="750" y="36">Hermes Agent</text>

  <!-- Dividers -->
  <line class="divider" x1="305" y1="50" x2="305" y2="285" />
  <line class="divider" x1="600" y1="50" x2="600" y2="285" />

  <!-- OpenClaw: filled ledger rows -->
  <rect class="shape-fill" x="72" y="72" width="168" height="28" rx="4" ry="4" />
  <text class="row-label" x="156" y="91">task row 1</text>
  <rect class="shape-fill" x="72" y="108" width="168" height="28" rx="4" ry="4" />
  <text class="row-label" x="156" y="127">task row 2</text>
  <rect class="accent-fill" x="72" y="144" width="168" height="28" rx="4" ry="4" />
  <text class="row-label" x="156" y="163">task row 3 (active)</text>
  <rect class="shape-fill" x="72" y="180" width="168" height="28" rx="4" ry="4" />
  <text class="row-label" x="156" y="199">task row 4</text>
  <text class="desc-text" x="160" y="265">Transactional SQLite ledger</text>

  <!-- OpenHuman: filled tree nodes -->
  <!-- Root node (accent) -->
  <circle class="node-fill" cx="450" cy="82" r="13" />
  <!-- Branch lines -->
  <line class="branch-line" x1="450" y1="95" x2="376" y2="138" />
  <line class="branch-line" x1="450" y1="95" x2="450" y2="138" />
  <line class="branch-line" x1="450" y1="95" x2="524" y2="138" />
  <!-- Branch nodes (accent-soft) -->
  <circle class="accent-fill" cx="376" cy="148" r="11" />
  <circle class="node-dot" cx="450" cy="148" r="11" />
  <circle class="node-dot" cx="524" cy="148" r="11" />
  <!-- Sub-leaves from first branch -->
  <line class="branch-line" x1="376" y1="159" x2="350" y2="193" />
  <line class="branch-line" x1="376" y1="159" x2="402" y2="193" />
  <circle class="node-dot" cx="350" cy="201" r="8" />
  <circle class="node-dot" cx="402" cy="201" r="8" />
  <!-- Sub-leaf from second branch -->
  <line class="branch-line" x1="450" y1="159" x2="450" y2="193" />
  <circle class="node-dot" cx="450" cy="201" r="8" />
  <text class="winner-label" x="450" y="265">Markdown context tree</text>

  <!-- Hermes: filled overlapping circles (episodic case base) -->
  <circle class="shape-fill" cx="706" cy="148" r="50" />
  <circle class="accent-fill" cx="750" cy="128" r="50" />
  <circle class="shape-fill" cx="728" cy="180" r="50" />
  <text class="row-label" x="694" y="140">task 1</text>
  <text class="row-label" x="752" y="122">task 2</text>
  <text class="row-label" x="730" y="196">task 3</text>
  <text class="desc-text" x="750" y="265">Episodic case base</text>
</svg>
