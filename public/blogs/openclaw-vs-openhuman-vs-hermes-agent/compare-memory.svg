<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Memory comparison</title>
  <desc id="d">Side-by-side: OpenClaw uses a transactional SQLite task ledger, OpenHuman uses a Markdown memory tree with branching context blocks, Hermes Agent uses an episodic case base of past task attempts.</desc>
  <style>
    .col-label  { font-family: 'Fraunces', serif; font-size: 16px; fill: currentColor; text-anchor: middle; }
    .shape      { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .accent     { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; }
    .desc-text  { font-family: 'Inter', sans-serif; font-size: 12px; fill: currentColor; opacity: .75; text-anchor: middle; }
    .row-label  { font-family: 'Inter', sans-serif; font-size: 11px; fill: currentColor; opacity: .65; text-anchor: middle; }
  </style>

  <!-- Column labels -->
  <text class="col-label" x="160" y="35">OpenClaw</text>
  <text class="col-label" x="450" y="35">OpenHuman</text>
  <text class="col-label" x="750" y="35">Hermes Agent</text>

  <!-- Dividers -->
  <line class="shape" x1="305" y1="50" x2="305" y2="285" stroke-dasharray="4 3" />
  <line class="shape" x1="600" y1="50" x2="600" y2="285" stroke-dasharray="4 3" />

  <!-- OpenClaw: stacked horizontal rectangles (transactional ledger) -->
  <rect class="shape" x="80" y="80" width="160" height="30" rx="4" />
  <text class="row-label" x="160" y="100">ledger row 1</text>
  <rect class="shape" x="80" y="118" width="160" height="30" rx="4" />
  <text class="row-label" x="160" y="138">ledger row 2</text>
  <rect class="shape" x="80" y="156" width="160" height="30" rx="4" />
  <text class="row-label" x="160" y="176">ledger row 3</text>
  <text class="desc-text" x="160" y="270">Transactional SQLite ledger</text>

  <!-- OpenHuman: branching tree structure -->
  <!-- Root -->
  <circle class="shape" cx="450" cy="90" r="12" />
  <!-- Branch lines -->
  <line class="shape" x1="450" y1="102" x2="380" y2="145" />
  <line class="shape" x1="450" y1="102" x2="450" y2="145" />
  <line class="shape" x1="450" y1="102" x2="520" y2="145" />
  <!-- Branch nodes -->
  <circle class="shape" cx="380" cy="155" r="10" />
  <circle class="shape" cx="450" cy="155" r="10" />
  <circle class="shape" cx="520" cy="155" r="10" />
  <!-- Sub-leaves from first branch -->
  <line class="shape" x1="380" y1="165" x2="355" y2="200" />
  <line class="shape" x1="380" y1="165" x2="405" y2="200" />
  <circle class="shape" cx="355" cy="208" r="7" />
  <circle class="shape" cx="405" cy="208" r="7" />
  <!-- Sub-leaf from second branch -->
  <line class="shape" x1="450" y1="165" x2="450" y2="200" />
  <circle class="shape" cx="450" cy="208" r="7" />
  <text class="desc-text" x="450" y="270">Markdown context tree</text>

  <!-- Hermes: 3 overlapping circles (case base / episodic memory) -->
  <circle class="shape" cx="710" cy="155" r="50" />
  <circle class="shape" cx="750" cy="135" r="50" />
  <circle class="shape" cx="730" cy="185" r="50" />
  <text class="row-label" x="700" y="148">task 1</text>
  <text class="row-label" x="755" y="130">task 2</text>
  <text class="row-label" x="725" y="200">task 3</text>
  <text class="desc-text" x="750" y="270">Episodic case base</text>
</svg>
