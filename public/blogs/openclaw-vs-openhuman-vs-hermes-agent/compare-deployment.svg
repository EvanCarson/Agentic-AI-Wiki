<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Deployment comparison</title>
  <desc id="d">Side-by-side: OpenClaw is a local server with an always-on indicator, OpenHuman is a Tauri desktop app on the user's laptop, Hermes Agent is a self-hosted VPS service with an always-on indicator.</desc>
  <style>
    .col-label  { font-family: 'Fraunces', serif; font-size: 16px; fill: currentColor; text-anchor: middle; }
    .shape      { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .accent     { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; }
    .dot-on     { fill: var(--accent, #d4421e); stroke: none; }
    .desc-text  { font-family: 'Inter', sans-serif; font-size: 12px; fill: currentColor; opacity: .75; text-anchor: middle; }
    .inner-label { font-family: 'Inter', sans-serif; font-size: 12px; fill: currentColor; opacity: .8; text-anchor: middle; }
  </style>

  <!-- Column labels -->
  <text class="col-label" x="160" y="35">OpenClaw</text>
  <text class="col-label" x="450" y="35">OpenHuman</text>
  <text class="col-label" x="750" y="35">Hermes Agent</text>

  <!-- Dividers -->
  <line class="shape" x1="305" y1="50" x2="305" y2="285" stroke-dasharray="4 3" />
  <line class="shape" x1="600" y1="50" x2="600" y2="285" stroke-dasharray="4 3" />

  <!-- OpenClaw: server/box icon with accent always-on dot -->
  <!-- Server box -->
  <rect class="shape" x="90" y="100" width="140" height="110" rx="6" />
  <!-- Server rack lines -->
  <line class="shape" x1="90" y1="125" x2="230" y2="125" />
  <line class="shape" x1="90" y1="150" x2="230" y2="150" />
  <line class="shape" x1="90" y1="175" x2="230" y2="175" />
  <!-- Small indicator lights on each rack -->
  <circle cx="112" cy="138" r="4" class="dot-on" />
  <circle cx="112" cy="163" r="4" class="dot-on" />
  <circle cx="112" cy="188" r="4" class="dot-on" />
  <text class="inner-label" x="165" y="222">local server</text>
  <text class="desc-text" x="160" y="270">Always-on local daemon</text>

  <!-- OpenHuman: laptop silhouette -->
  <rect class="shape" x="380" y="95" width="140" height="95" rx="6" />
  <rect class="shape" x="360" y="190" width="180" height="16" rx="3" />
  <rect class="shape" x="393" y="107" width="114" height="71" rx="3" />
  <text class="inner-label" x="450" y="148">Tauri app</text>
  <text class="desc-text" x="450" y="270">Desktop app (Tauri)</text>

  <!-- Hermes: cloud/VPS rectangle + always-on dot -->
  <!-- Simple cloud shape using arc approximation -->
  <path class="shape" d="M 670 165 Q 668 130 695 120 Q 710 100 735 110 Q 750 90 775 100 Q 800 95 808 118 Q 830 115 833 140 Q 840 165 820 175 L 680 175 Q 668 175 670 165 Z" />
  <text class="inner-label" x="750" y="153">VPS / cloud</text>
  <!-- Always-on green dot (accent) -->
  <circle cx="810" cy="112" r="7" class="dot-on" />
  <text class="inner-label" x="750" y="210">self-hosted</text>
  <text class="desc-text" x="750" y="270">Always-on self-hosted</text>
</svg>
