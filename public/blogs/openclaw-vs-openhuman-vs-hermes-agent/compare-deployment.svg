<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Deployment comparison</title>
  <desc id="d">Side-by-side: OpenClaw is a local server with an always-on indicator, OpenHuman is a Tauri desktop app on the user's laptop, Hermes Agent is a self-hosted VPS service with an always-on indicator.</desc>
  <defs>
    <filter id="cd-shadow" x="-6%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--ink, #1a1a1a)" flood-opacity="0.08" />
    </filter>
  </defs>
  <style>
    .col-label   { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .divider     { stroke: var(--border-soft, #d8d4ce); stroke-width: 1; stroke-dasharray: 4 4; }
    .shape-fill  { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.5; filter: url(#cd-shadow); }
    .screen-fill { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; filter: url(#cd-shadow); }
    .rack-line   { stroke: var(--border-soft, #d8d4ce); stroke-width: 1; }
    .dot-on      { fill: var(--accent, #d4421e); stroke: none; }
    .cloud-fill  { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.5; filter: url(#cd-shadow); }
    .inner-label { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .desc-text   { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--muted, #888); text-anchor: middle; }
    .winner-label{ font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; fill: var(--accent, #d4421e); text-anchor: middle; }
  </style>

  <!-- Column labels -->
  <text class="col-label" x="160" y="36">OpenClaw</text>
  <text class="col-label" x="450" y="36">OpenHuman</text>
  <text class="col-label" x="750" y="36">Hermes Agent</text>

  <!-- Dividers -->
  <line class="divider" x1="305" y1="50" x2="305" y2="285" />
  <line class="divider" x1="600" y1="50" x2="600" y2="285" />

  <!-- OpenClaw: server box with filled rack rows -->
  <rect class="shape-fill" x="82" y="90" width="156" height="118" rx="6" ry="6" />
  <!-- Rack rows -->
  <rect class="screen-fill" x="90" y="100" width="140" height="22" rx="3" ry="3" />
  <rect class="shape-fill" x="90" y="130" width="140" height="22" rx="3" ry="3" />
  <rect class="shape-fill" x="90" y="160" width="140" height="22" rx="3" ry="3" />
  <!-- Indicator dots -->
  <circle cx="104" cy="111" r="4" class="dot-on" />
  <circle cx="104" cy="141" r="4" class="dot-on" />
  <circle cx="104" cy="171" r="4" class="dot-on" />
  <text class="inner-label" x="160" y="225">local server</text>
  <text class="desc-text" x="160" y="265">Always-on local daemon</text>

  <!-- OpenHuman: filled laptop -->
  <rect class="shape-fill" x="374" y="85" width="152" height="104" rx="6" ry="6" />
  <rect class="shape-fill" x="354" y="189" width="192" height="16" rx="3" ry="3" />
  <!-- Inner screen (accent-soft) -->
  <rect class="screen-fill" x="386" y="97" width="128" height="80" rx="3" ry="3" />
  <text class="inner-label" x="450" y="142">Tauri app</text>
  <text class="winner-label" x="450" y="265">Desktop app (Tauri)</text>

  <!-- Hermes: cloud shape (paper-2) + always-on dot -->
  <path class="cloud-fill" d="M 651 172 Q 648 134 678 122 Q 694 100 722 112 Q 736 90 764 102 Q 792 96 800 122 Q 824 118 828 146 Q 836 172 814 180 L 664 180 Q 650 180 651 172 Z" />
  <text class="inner-label" x="744" y="152">VPS / cloud</text>
  <!-- Always-on dot -->
  <circle cx="810" cy="110" r="7" class="dot-on" />
  <text class="inner-label" x="744" y="210">self-hosted · always-on</text>
  <text class="desc-text" x="750" y="265">Always-on self-hosted</text>
</svg>
