<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">OpenClaw architecture</title>
  <desc id="d">OpenClaw routes user goals through a central SQLite-backed Task Brain that orchestrates eBPF-sandboxed skill runners and integration adapters before producing an outcome or response.</desc>
  <style>
    .box    { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .accent { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.75; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: currentColor; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: currentColor; opacity: .65; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- User goal box -->
  <rect class="box" x="30" y="220" width="160" height="60" rx="8" ry="8" />
  <text class="label" x="110" y="246" text-anchor="middle">User goal</text>
  <text class="sub" x="110" y="265" text-anchor="middle">CLI · chat · webhook</text>

  <!-- Task Brain (accent) -->
  <rect class="accent" x="350" y="210" width="200" height="80" rx="8" ry="8" />
  <text class="label" x="450" y="240" text-anchor="middle">Task Brain</text>
  <text class="sub" x="450" y="258" text-anchor="middle">SQLite task ledger</text>
  <text class="sub" x="450" y="275" text-anchor="middle">plan · observe · resume</text>

  <!-- Skill runner -->
  <rect class="box" x="680" y="80" width="190" height="80" rx="8" ry="8" />
  <text class="label" x="775" y="116" text-anchor="middle">Skill runner</text>
  <text class="sub" x="775" y="134" text-anchor="middle">eBPF sandbox</text>
  <text class="sub" x="775" y="150" text-anchor="middle">least-privilege exec</text>

  <!-- Integration adapters -->
  <rect class="box" x="680" y="340" width="190" height="80" rx="8" ry="8" />
  <text class="label" x="775" y="376" text-anchor="middle">Integration adapters</text>
  <text class="sub" x="775" y="394" text-anchor="middle">file · shell · browser</text>
  <text class="sub" x="775" y="410" text-anchor="middle">messaging · email</text>

  <!-- Outcome / response -->
  <rect class="box" x="350" y="370" width="200" height="60" rx="8" ry="8" />
  <text class="label" x="450" y="396" text-anchor="middle">Outcome / response</text>
  <text class="sub" x="450" y="415" text-anchor="middle">side effect or message</text>

  <!-- Arrows -->
  <!-- goal → Task Brain -->
  <path class="arrow" d="M 190 250 L 350 250" />

  <!-- Task Brain → Skill runner -->
  <path class="arrow" d="M 550 230 L 680 130" />
  <!-- Skill runner → Task Brain -->
  <path class="arrow" d="M 680 150 L 550 250" />

  <!-- Task Brain → Integrations -->
  <path class="arrow" d="M 550 270 L 680 370" />
  <!-- Integrations → Task Brain -->
  <path class="arrow" d="M 680 360 L 550 260" />

  <!-- Task Brain → Outcome -->
  <path class="arrow" d="M 450 290 L 450 370" />
</svg>
