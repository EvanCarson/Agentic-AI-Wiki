<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">OpenClaw architecture</title>
  <desc id="d">OpenClaw routes user goals through a central SQLite-backed Task Brain that orchestrates eBPF-sandboxed skill runners and integration adapters before producing an outcome or response.</desc>
  <defs>
    <filter id="oc-shadow" x="-8%" y="-8%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="var(--ink, #1a1a1a)" flood-opacity="0.10" />
    </filter>
    <marker id="oc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="currentColor" />
    </marker>
  </defs>
  <style>
    .box        { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; filter: url(#oc-shadow); }
    .accent-box { fill: var(--accent, #d4421e); stroke: none; filter: url(#oc-shadow); }
    .accent-adj { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; filter: url(#oc-shadow); }
    .label      { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 500; fill: currentColor; }
    .sub        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: currentColor; opacity: 0.65; }
    .label-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 500; fill: var(--paper, #fff); }
    .sub-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: var(--paper, #fff); opacity: 0.80; }
    .arrow      { fill: none; stroke: currentColor; stroke-width: 1.75; marker-end: url(#oc-arr); opacity: 0.70; }
    .group-bg   { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; rx: 10; ry: 10; }
  </style>

  <!-- I/O group background -->
  <rect class="group-bg" x="18" y="160" width="195" height="160" rx="10" ry="10" fill="var(--paper-2,#f0ede8)" stroke="var(--border-soft,#d8d4ce)" stroke-width="1" />
  <text style="font-family:'Inter',system-ui,sans-serif;font-size:10px;fill:var(--muted,#888);letter-spacing:.04em;" x="115" y="178" text-anchor="middle">INPUT</text>

  <!-- Execution group background -->
  <rect class="group-bg" x="660" y="50" width="225" height="390" rx="10" ry="10" fill="var(--paper-2,#f0ede8)" stroke="var(--border-soft,#d8d4ce)" stroke-width="1" />
  <text style="font-family:'Inter',system-ui,sans-serif;font-size:10px;fill:var(--muted,#888);letter-spacing:.04em;" x="773" y="68" text-anchor="middle">EXECUTION</text>

  <!-- User goal box -->
  <rect class="box" x="30" y="205" width="168" height="68" rx="8" ry="8" />
  <text class="label" x="114" y="234" text-anchor="middle">User goal</text>
  <text class="sub" x="114" y="254" text-anchor="middle">CLI · chat · webhook</text>

  <!-- Task Brain (accent, hero box) -->
  <rect class="accent-box" x="336" y="198" width="228" height="90" rx="10" ry="10" />
  <text class="label-inv" x="450" y="228" text-anchor="middle">Task Brain</text>
  <text class="sub-inv" x="450" y="248" text-anchor="middle">SQLite task ledger</text>
  <text class="sub-inv" x="450" y="266" text-anchor="middle">plan · observe · resume</text>

  <!-- Skill runner (accent-adjacent) -->
  <rect class="accent-adj" x="672" y="80" width="198" height="80" rx="8" ry="8" />
  <text class="label" x="771" y="115" text-anchor="middle">Skill runner</text>
  <text class="sub" x="771" y="135" text-anchor="middle">eBPF sandbox · least-priv</text>

  <!-- Integration adapters -->
  <rect class="box" x="672" y="220" width="198" height="80" rx="8" ry="8" />
  <text class="label" x="771" y="254" text-anchor="middle">Integration adapters</text>
  <text class="sub" x="771" y="274" text-anchor="middle">file · shell · browser</text>

  <!-- Outcome / response (accent-adjacent) -->
  <rect class="accent-adj" x="336" y="358" width="228" height="64" rx="8" ry="8" />
  <text class="label" x="450" y="386" text-anchor="middle">Outcome / response</text>
  <text class="sub" x="450" y="405" text-anchor="middle">side effect or message</text>

  <!-- Messaging / email adapters -->
  <rect class="box" x="672" y="352" width="198" height="70" rx="8" ry="8" />
  <text class="label" x="771" y="381" text-anchor="middle">Messaging / email</text>
  <text class="sub" x="771" y="400" text-anchor="middle">10 platforms · outbound</text>

  <!-- Arrows -->
  <!-- goal → Task Brain -->
  <path class="arrow" d="M 198 239 L 336 243" />

  <!-- Task Brain ↔ Skill runner -->
  <path class="arrow" d="M 560 218 Q 630 160 672 130" />
  <path class="arrow" d="M 672 148 Q 628 178 560 238" />

  <!-- Task Brain ↔ Integration adapters -->
  <path class="arrow" d="M 560 268 Q 620 270 672 265" />
  <path class="arrow" d="M 672 275 Q 620 282 560 278" />

  <!-- Task Brain → Outcome -->
  <path class="arrow" d="M 450 288 L 450 358" />

  <!-- Task Brain ↔ Messaging -->
  <path class="arrow" d="M 560 278 Q 640 320 672 370" />
</svg>
