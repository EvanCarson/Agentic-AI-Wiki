<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Security comparison</title>
  <desc id="d">Side-by-side: OpenClaw uses an eBPF hexagon shield for kernel-level isolation, OpenHuman relies on OS trust with a laptop-silhouette model, Hermes Agent uses isolated processes connected by a minimal channel.</desc>
  <style>
    .col-label  { font-family: 'Fraunces', serif; font-size: 16px; fill: currentColor; text-anchor: middle; }
    .shape      { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .accent     { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; }
    .desc-text  { font-family: 'Inter', sans-serif; font-size: 12px; fill: currentColor; opacity: .75; text-anchor: middle; }
    .inner-label { font-family: 'Inter', sans-serif; font-size: 12px; fill: currentColor; opacity: .8; text-anchor: middle; }
  </style>

  <!-- Column labels -->
  <text class="col-label" x="160" y="35">OpenClaw</text>
  <text class="col-label" x="450" y="35">OpenHuman</text>
  <text class="col-label" x="750" y="35">Hermes Agent</text>

  <!-- Dividers -->
  <line class="shape" x1="305" y1="50" x2="305" y2="285" stroke-dasharray="4 3" />
  <line class="shape" x1="600" y1="50" x2="600" y2="285" stroke-dasharray="4 3" />

  <!-- OpenClaw: hexagon shield (accent color) labeled "eBPF" -->
  <!-- Hexagon centered at 160,155, r≈65 -->
  <polygon class="accent" points="160,88 217,120 217,188 160,220 103,188 103,120" />
  <text class="inner-label" x="160" y="152" style="fill:var(--accent,#d4421e);font-weight:600;">eBPF</text>
  <text class="inner-label" x="160" y="170" style="fill:var(--accent,#d4421e);">kernel isolation</text>
  <text class="desc-text" x="160" y="270">Kernel-level sandbox</text>

  <!-- OpenHuman: laptop silhouette (rectangle body + keyboard base) -->
  <!-- Screen -->
  <rect class="shape" x="380" y="90" width="140" height="100" rx="6" />
  <!-- Keyboard base -->
  <rect class="shape" x="360" y="190" width="180" height="18" rx="3" />
  <!-- Screen inner hint -->
  <rect class="shape" x="393" y="102" width="114" height="76" rx="3" />
  <text class="inner-label" x="450" y="148">OS trust</text>
  <text class="desc-text" x="450" y="270">Local OS trust boundary</text>

  <!-- Hermes Agent: two small boxes connected by a line (isolated procs) -->
  <rect class="shape" x="680" y="115" width="60" height="40" rx="5" />
  <text class="inner-label" x="710" y="140">proc A</text>
  <rect class="shape" x="800" y="115" width="60" height="40" rx="5" />
  <text class="inner-label" x="830" y="140">proc B</text>
  <line class="shape" x1="740" y1="135" x2="800" y2="135" />
  <text class="inner-label" x="770" y="190">isolated</text>
  <text class="inner-label" x="770" y="208">processes</text>
  <text class="desc-text" x="750" y="270">Process-level isolation</text>
</svg>
