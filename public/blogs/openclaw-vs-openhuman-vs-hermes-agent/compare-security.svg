<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Security comparison</title>
  <desc id="d">Side-by-side: OpenClaw uses an eBPF hexagon shield for kernel-level isolation, OpenHuman relies on OS trust with a laptop-silhouette model, Hermes Agent uses isolated processes connected by a minimal channel.</desc>
  <defs>
    <filter id="cs-shadow" x="-8%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--ink, #1a1a1a)" flood-opacity="0.10" />
    </filter>
  </defs>
  <style>
    .col-label   { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .divider     { stroke: var(--border-soft, #d8d4ce); stroke-width: 1; stroke-dasharray: 4 4; }
    .shape-fill  { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.5; filter: url(#cs-shadow); }
    .accent-hex  { fill: var(--accent, #d4421e); stroke: none; filter: url(#cs-shadow); }
    .accent-adj  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; filter: url(#cs-shadow); }
    .inner-label { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .inner-inv   { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .inner-inv-s { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400; fill: var(--paper, #fff); opacity: 0.85; text-anchor: middle; }
    .desc-text   { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--muted, #888); text-anchor: middle; }
    .winner-label{ font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; fill: var(--accent, #d4421e); text-anchor: middle; }
    .channel     { stroke: var(--border-soft, #d8d4ce); stroke-width: 1.5; stroke-dasharray: 5 3; fill: none; }
  </style>

  <!-- Column labels -->
  <text class="col-label" x="160" y="36">OpenClaw</text>
  <text class="col-label" x="450" y="36">OpenHuman</text>
  <text class="col-label" x="750" y="36">Hermes Agent</text>

  <!-- Dividers -->
  <line class="divider" x1="305" y1="50" x2="305" y2="285" />
  <line class="divider" x1="600" y1="50" x2="600" y2="285" />

  <!-- OpenClaw: filled accent hexagon shield -->
  <polygon class="accent-hex" points="160,75 222,110 222,182 160,218 98,182 98,110" />
  <text class="inner-inv" x="160" y="145">eBPF</text>
  <text class="inner-inv-s" x="160" y="162">kernel isolation</text>
  <text class="winner-label" x="160" y="265">Kernel-level sandbox</text>

  <!-- OpenHuman: laptop with paper-2 fill -->
  <!-- Screen body -->
  <rect class="shape-fill" x="382" y="82" width="136" height="100" rx="6" ry="6" />
  <!-- Keyboard base -->
  <rect class="shape-fill" x="362" y="182" width="176" height="16" rx="3" ry="3" />
  <!-- Inner screen -->
  <rect class="accent-adj" x="396" y="95" width="108" height="74" rx="3" ry="3" />
  <text class="inner-label" x="450" y="136" style="fill:var(--ink,#1a1a1a);">OS trust</text>
  <text class="desc-text" x="450" y="265">Local OS trust boundary</text>

  <!-- Hermes Agent: two filled proc boxes + dashed channel -->
  <rect class="shape-fill" x="644" y="108" width="68" height="44" rx="6" ry="6" />
  <text class="inner-label" x="678" y="135">proc A</text>
  <rect class="shape-fill" x="796" y="108" width="68" height="44" rx="6" ry="6" />
  <text class="inner-label" x="830" y="135">proc B</text>
  <line class="channel" x1="712" y1="130" x2="796" y2="130" />
  <rect class="accent-adj" x="710" y="185" width="80" height="36" rx="5" ry="5" />
  <text class="inner-label" x="750" y="208">isolated</text>
  <text class="desc-text" x="750" y="265">Process-level isolation</text>
</svg>
