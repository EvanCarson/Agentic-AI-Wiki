<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">OpenHuman architecture</title>
  <desc id="d">OpenHuman pulls data from 118 connectors every 20 minutes into a Markdown memory tree stored in SQLite, which the Tauri desktop app and agent loop read before each prompt to give the model rich user context.</desc>
  <style>
    .box    { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .accent { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.75; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: currentColor; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: currentColor; opacity: .65; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- 118 connectors -->
  <rect class="box" x="30" y="200" width="160" height="80" rx="8" ry="8" />
  <text class="label" x="110" y="232" text-anchor="middle">118 connectors</text>
  <text class="sub" x="110" y="252" text-anchor="middle">Gmail · GitHub · Notion</text>
  <text class="sub" x="110" y="268" text-anchor="middle">Slack · …</text>

  <!-- Fetcher (every 20 min) -->
  <rect class="box" x="240" y="200" width="170" height="80" rx="8" ry="8" />
  <text class="label" x="325" y="232" text-anchor="middle">Fetcher</text>
  <text class="sub" x="325" y="252" text-anchor="middle">every 20 min</text>
  <text class="sub" x="325" y="268" text-anchor="middle">pulls deltas → compresses</text>

  <!-- Memory tree (accent, center) -->
  <rect class="accent" x="460" y="190" width="190" height="100" rx="8" ry="8" />
  <text class="label" x="555" y="228" text-anchor="middle">Memory tree</text>
  <text class="sub" x="555" y="248" text-anchor="middle">Markdown blocks</text>
  <text class="sub" x="555" y="266" text-anchor="middle">tree of self-context</text>

  <!-- SQLite store -->
  <rect class="box" x="460" y="360" width="190" height="60" rx="8" ry="8" />
  <text class="label" x="555" y="386" text-anchor="middle">SQLite store</text>
  <text class="sub" x="555" y="405" text-anchor="middle">local persistence</text>

  <!-- Tauri UI -->
  <rect class="box" x="700" y="100" width="160" height="70" rx="8" ry="8" />
  <text class="label" x="780" y="131" text-anchor="middle">Tauri UI</text>
  <text class="sub" x="780" y="150" text-anchor="middle">macOS · Windows · Linux</text>

  <!-- Agent loop -->
  <rect class="box" x="700" y="240" width="160" height="70" rx="8" ry="8" />
  <text class="label" x="780" y="271" text-anchor="middle">Agent loop</text>
  <text class="sub" x="780" y="290" text-anchor="middle">reads tree before prompt</text>

  <!-- User output (far right) -->
  <rect class="box" x="700" y="370" width="160" height="60" rx="8" ry="8" />
  <text class="label" x="780" y="396" text-anchor="middle">User</text>
  <text class="sub" x="780" y="414" text-anchor="middle">response delivered</text>

  <!-- Arrows -->
  <!-- connectors → fetcher -->
  <path class="arrow" d="M 190 240 L 240 240" />

  <!-- fetcher → memory tree -->
  <path class="arrow" d="M 410 240 L 460 240" />

  <!-- memory tree ↔ SQLite (bidirectional) -->
  <path class="arrow" d="M 555 290 L 555 360" />
  <path class="arrow" d="M 575 360 L 575 290" />

  <!-- memory tree → Tauri UI -->
  <path class="arrow" d="M 600 210 L 700 140" />

  <!-- memory tree → Agent loop -->
  <path class="arrow" d="M 650 265 L 700 270" />

  <!-- Agent loop → user -->
  <path class="arrow" d="M 780 310 L 780 370" />
</svg>
