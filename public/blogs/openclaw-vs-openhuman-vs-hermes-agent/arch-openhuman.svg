<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">OpenHuman architecture</title>
  <desc id="d">OpenHuman pulls data from 118 connectors every 20 minutes into a Markdown memory tree stored in SQLite, which the Tauri desktop app and agent loop read before each prompt to give the model rich user context.</desc>
  <defs>
    <filter id="oh-shadow" x="-8%" y="-8%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="var(--ink, #1a1a1a)" flood-opacity="0.10" />
    </filter>
    <marker id="oh-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="currentColor" />
    </marker>
  </defs>
  <style>
    .box        { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; filter: url(#oh-shadow); }
    .accent-box { fill: var(--accent, #d4421e); stroke: none; filter: url(#oh-shadow); }
    .accent-adj { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; filter: url(#oh-shadow); }
    .label      { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 500; fill: currentColor; }
    .sub        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: currentColor; opacity: 0.65; }
    .label-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 500; fill: var(--paper, #fff); }
    .sub-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: var(--paper, #fff); opacity: 0.80; }
    .arrow      { fill: none; stroke: currentColor; stroke-width: 1.75; marker-end: url(#oh-arr); opacity: 0.70; }
    .group-bg-fill { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; }
  </style>

  <!-- Ingestion group background -->
  <rect class="group-bg-fill" x="18" y="148" width="420" height="200" rx="10" ry="10" />
  <text style="font-family:'Inter',system-ui,sans-serif;font-size:10px;fill:var(--muted,#888);letter-spacing:.04em;" x="228" y="166" text-anchor="middle">INGESTION PIPELINE (every 20 min)</text>

  <!-- Output group background -->
  <rect class="group-bg-fill" x="680" y="80" width="205" height="310" rx="10" ry="10" />
  <text style="font-family:'Inter',system-ui,sans-serif;font-size:10px;fill:var(--muted,#888);letter-spacing:.04em;" x="783" y="98" text-anchor="middle">INTERFACE</text>

  <!-- 118 connectors -->
  <rect class="box" x="30" y="186" width="168" height="80" rx="8" ry="8" />
  <text class="label" x="114" y="218" text-anchor="middle">118 connectors</text>
  <text class="sub" x="114" y="237" text-anchor="middle">Gmail · GitHub · Notion</text>
  <text class="sub" x="114" y="254" text-anchor="middle">Slack · +114 more</text>

  <!-- Fetcher -->
  <rect class="accent-adj" x="226" y="186" width="185" height="80" rx="8" ry="8" />
  <text class="label" x="318" y="218" text-anchor="middle">Fetcher</text>
  <text class="sub" x="318" y="237" text-anchor="middle">every 20 min</text>
  <text class="sub" x="318" y="254" text-anchor="middle">pulls deltas · compresses</text>

  <!-- Memory tree (accent, hero) -->
  <rect class="accent-box" x="450" y="175" width="200" height="110" rx="10" ry="10" />
  <text class="label-inv" x="550" y="212" text-anchor="middle">Memory tree</text>
  <text class="sub-inv" x="550" y="232" text-anchor="middle">Markdown blocks</text>
  <text class="sub-inv" x="550" y="252" text-anchor="middle">tree of self-context</text>
  <text class="sub-inv" x="550" y="270" text-anchor="middle">local SQLite</text>

  <!-- Tauri UI -->
  <rect class="accent-adj" x="692" y="108" width="180" height="70" rx="8" ry="8" />
  <text class="label" x="782" y="138" text-anchor="middle">Tauri UI</text>
  <text class="sub" x="782" y="158" text-anchor="middle">macOS · Windows · Linux</text>

  <!-- Agent loop -->
  <rect class="box" x="692" y="208" width="180" height="70" rx="8" ry="8" />
  <text class="label" x="782" y="238" text-anchor="middle">Agent loop</text>
  <text class="sub" x="782" y="258" text-anchor="middle">reads tree before prompt</text>

  <!-- User output -->
  <rect class="box" x="692" y="320" width="180" height="58" rx="8" ry="8" />
  <text class="label" x="782" y="346" text-anchor="middle">User</text>
  <text class="sub" x="782" y="365" text-anchor="middle">response delivered</text>

  <!-- Arrows -->
  <!-- connectors → fetcher -->
  <path class="arrow" d="M 198 226 L 226 226" />

  <!-- fetcher → memory tree -->
  <path class="arrow" d="M 411 226 L 450 230" />

  <!-- memory tree → Tauri UI -->
  <path class="arrow" d="M 620 195 Q 660 160 692 148" />

  <!-- memory tree → Agent loop -->
  <path class="arrow" d="M 650 243 L 692 243" />

  <!-- Agent loop → user -->
  <path class="arrow" d="M 782 278 L 782 320" />
</svg>
