<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OpenHuman logo">
  <!-- Open human silhouette: a head circle (slightly larger so the
       proportions feel less iconographic and more "person") plus a
       shoulders curve. An accent dot inside the head suggests the
       agent's internal context awareness. -->
  <circle cx="16" cy="10" r="5" fill="var(--paper-2, #f0ede8)" stroke="currentColor" stroke-width="2" />
  <circle cx="16" cy="10" r="1.5" fill="var(--accent, #d4421e)" />
  <path d="M 5 28 C 5 21 10 18 16 18 C 22 18 27 21 27 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
</svg>
