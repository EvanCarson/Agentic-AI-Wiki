<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OpenClaw logo">
  <!-- Three pointed talons fanning out from a common base at the bottom.
       Each talon: a curved teardrop with a sharp tip at the top, like
       an animal claw caught mid-strike. Center talon in accent. -->
  <style>
    /* In dark mode, flip currentColor to cream so the side talons stay
       visible on a dark page. Affects OS-level dark mode; explicit
       site-toggle on a light OS will not see this and is an accepted
       edge case. */
    @media (prefers-color-scheme: dark) {
      svg { color: #f4f1ea; }
    }
  </style>
  <path d="M 16 28 C 13 26 10 22 8 16 C 6 10 7 5.5 10 5 C 12 10 14 18 16 28 Z" fill="currentColor" />
  <path d="M 16 28 C 15.2 22 15.2 14 15.2 4.5 C 16.4 4.2 16.8 4.2 16.8 4.5 C 16.8 14 16.8 22 16 28 Z" fill="var(--accent, #d4421e)" />
  <path d="M 16 28 C 19 26 22 22 24 16 C 26 10 25 5.5 22 5 C 20 10 18 18 16 28 Z" fill="currentColor" />
</svg>
