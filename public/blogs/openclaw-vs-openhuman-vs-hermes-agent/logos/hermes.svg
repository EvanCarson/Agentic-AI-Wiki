<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Hermes Agent logo">
  <!-- Winged helmet — Hermes's classic petasos with side wings.
       Dome + brim form the helmet; two wing strokes flare from each
       side. Reads as Hermes at 24px in the post.
       Inlined by BlogLayout, so var(--paper-2) and currentColor
       resolve via the page's CSS var cascade — the helmet body fill
       becomes dark in dark mode and cream in light mode automatically. -->
  <path d="M 9 18 C 9 11 12 6 16 6 C 20 6 23 11 23 18 Z" fill="var(--paper-2, #f0ede8)" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
  <line x1="6" y1="18" x2="26" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  <!-- Left wing (two feathers swept back) -->
  <path d="M 9 14 Q 4 13 2.5 16" fill="none" stroke="var(--accent, #d4421e)" stroke-width="1.75" stroke-linecap="round" />
  <path d="M 9 16 Q 5 16 3.5 18" fill="none" stroke="var(--accent, #d4421e)" stroke-width="1.75" stroke-linecap="round" />
  <!-- Right wing -->
  <path d="M 23 14 Q 28 13 29.5 16" fill="none" stroke="var(--accent, #d4421e)" stroke-width="1.75" stroke-linecap="round" />
  <path d="M 23 16 Q 27 16 28.5 18" fill="none" stroke="var(--accent, #d4421e)" stroke-width="1.75" stroke-linecap="round" />
</svg>
