<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Cross-cutting comparison of Signal, Execution, and Risk layers</title>
  <desc id="d">Three columns — Signal, Execution, Risk — compared across four axes: latency, interpretability required, data dependency, and regulatory exposure. Cells are shaded according to where the layer sits on each axis.</desc>
  <style>
    .col-strong { fill: var(--accent, #d4421e); }
    .col-medium { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; }
    .col-weak   { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; }
    .col-header { fill: var(--ink, #1a1a1a); }
    .row-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .85; }
    .row-sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .55; }
    .col-name   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--paper, #fff); }
    .cell-strong { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--paper, #fff); }
    .cell-medium { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: var(--ink, #1a1a1a); }
    .cell-weak   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .75; }
  </style>

  <!-- Column headers -->
  <rect class="col-header" x="200" y="20" width="200" height="34" rx="6" ry="6" />
  <text class="col-name" x="300" y="42" text-anchor="middle">Signal</text>
  <rect class="col-header" x="420" y="20" width="200" height="34" rx="6" ry="6" />
  <text class="col-name" x="520" y="42" text-anchor="middle">Execution</text>
  <rect class="col-header" x="640" y="20" width="200" height="34" rx="6" ry="6" />
  <text class="col-name" x="740" y="42" text-anchor="middle">Risk</text>

  <!-- Row 1: Latency -->
  <text class="row-label" x="30" y="80">Latency</text>
  <text class="row-sub"   x="30" y="95">budget per decision</text>
  <rect class="col-medium" x="200" y="65" width="200" height="40" rx="4" ry="4" />
  <text class="cell-medium" x="300" y="90" text-anchor="middle">sec → days</text>
  <rect class="col-strong" x="420" y="65" width="200" height="40" rx="4" ry="4" />
  <text class="cell-strong" x="520" y="90" text-anchor="middle">µs → ms</text>
  <rect class="col-medium" x="640" y="65" width="200" height="40" rx="4" ry="4" />
  <text class="cell-medium" x="740" y="90" text-anchor="middle">sec → min</text>

  <!-- Row 2: Interpretability required -->
  <text class="row-label" x="30" y="125">Interpretability</text>
  <text class="row-sub"   x="30" y="140">required</text>
  <rect class="col-weak"   x="200" y="115" width="200" height="40" rx="4" ry="4" />
  <text class="cell-weak"  x="300" y="140" text-anchor="middle">Low</text>
  <rect class="col-medium" x="420" y="115" width="200" height="40" rx="4" ry="4" />
  <text class="cell-medium" x="520" y="140" text-anchor="middle">Medium (guards opaque)</text>
  <rect class="col-strong" x="640" y="115" width="200" height="40" rx="4" ry="4" />
  <text class="cell-strong" x="740" y="140" text-anchor="middle">High</text>

  <!-- Row 3: Data dependency -->
  <text class="row-label" x="30" y="175">Data dependency</text>
  <text class="row-sub"   x="30" y="190">what kills it</text>
  <rect class="col-strong" x="200" y="165" width="200" height="40" rx="4" ry="4" />
  <text class="cell-strong" x="300" y="190" text-anchor="middle">Alt-data integrity</text>
  <rect class="col-medium" x="420" y="165" width="200" height="40" rx="4" ry="4" />
  <text class="cell-medium" x="520" y="190" text-anchor="middle">Feed integrity</text>
  <rect class="col-medium" x="640" y="165" width="200" height="40" rx="4" ry="4" />
  <text class="cell-medium" x="740" y="190" text-anchor="middle">Position accuracy</text>

  <!-- Row 4: Regulatory exposure -->
  <text class="row-label" x="30" y="225">Regulatory</text>
  <text class="row-sub"   x="30" y="240">EU AI Act (2026)</text>
  <rect class="col-weak"   x="200" y="215" width="200" height="40" rx="4" ry="4" />
  <text class="cell-weak"  x="300" y="240" text-anchor="middle">Low</text>
  <rect class="col-medium" x="420" y="215" width="200" height="40" rx="4" ry="4" />
  <text class="cell-medium" x="520" y="240" text-anchor="middle">Medium</text>
  <rect class="col-strong" x="640" y="215" width="200" height="40" rx="4" ry="4" />
  <text class="cell-strong" x="740" y="240" text-anchor="middle">High-risk by default</text>

  <!-- legend -->
  <rect class="col-weak"   x="200" y="275" width="12" height="12" />
  <text class="row-sub" x="216" y="285">Low</text>
  <rect class="col-medium" x="280" y="275" width="12" height="12" />
  <text class="row-sub" x="296" y="285">Medium</text>
  <rect class="col-strong" x="380" y="275" width="12" height="12" />
  <text class="row-sub" x="396" y="285">High</text>
</svg>
