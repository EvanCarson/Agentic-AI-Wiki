<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The four-layer AI trading stack</title>
  <desc id="d">A four-layer architecture diagram. From top to bottom: Signal (deep learning, NLP, alternative data); Sizing (portfolio optimisation conditioned on ML); Execution (reinforcement learning over the limit order book); Risk (stress models and rebalancing agents). A parent order flows top-down on the right; risk signals flow bottom-up.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <style>
    .box       { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .hero      { fill: var(--accent, #d4421e); stroke: none; }
    .adj       { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: var(--paper, #fff); }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink, #1a1a1a); opacity: .72; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper, #fff); opacity: .85; }
    .side      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .70; }
    .arrow     { fill: none; stroke: currentColor; stroke-width: 1.75; marker-end: url(#arr); opacity: .75; }
    .arrow-up  { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); opacity: .55; stroke-dasharray: 5 4; }
    .bracket   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .35; }
  </style>

  <!-- Layer 1: Signal (hero) -->
  <rect class="hero" x="120" y="40" width="500" height="90" rx="10" ry="10" />
  <text class="label-inv" x="145" y="75">Signal</text>
  <text class="sub-inv" x="145" y="97">What to buy or sell, when</text>
  <text class="sub-inv" x="145" y="115">Deep learning · NLP · alt data</text>
  <text class="side" x="640" y="75">LSTM / GRU on order books</text>
  <text class="side" x="640" y="92">NLP on transcripts &amp; news</text>
  <text class="side" x="640" y="109">Alt data: cards / sat / web</text>

  <!-- Layer 2: Sizing (adj) -->
  <rect class="adj" x="120" y="145" width="500" height="90" rx="10" ry="10" />
  <text class="label" x="145" y="180">Sizing</text>
  <text class="sub" x="145" y="202">How much capital to allocate</text>
  <text class="sub" x="145" y="220">ML-conditioned convex optimisation</text>
  <text class="side" x="640" y="180">Factor &amp; sector constraints</text>
  <text class="side" x="640" y="197">Signal-confidence gross targets</text>
  <text class="side" x="640" y="214">RL-derived response (2025)</text>

  <!-- Layer 3: Execution (box) -->
  <rect class="box" x="120" y="250" width="500" height="90" rx="10" ry="10" />
  <text class="label" x="145" y="285">Execution</text>
  <text class="sub" x="145" y="307">How to fill without leaking</text>
  <text class="sub" x="145" y="325">RL over the limit order book</text>
  <text class="side" x="640" y="285">Almgren–Chriss baseline</text>
  <text class="side" x="640" y="302">A3C / PPO over LOB state</text>
  <text class="side" x="640" y="319">Hard rule-based guard rails</text>

  <!-- Layer 4: Risk (adj) -->
  <rect class="adj" x="120" y="355" width="500" height="90" rx="10" ry="10" />
  <text class="label" x="145" y="390">Risk</text>
  <text class="sub" x="145" y="412">What positions to cut or hedge</text>
  <text class="sub" x="145" y="430">Stress models · multi-agent rebalance</text>
  <text class="side" x="640" y="390">Supervisor / worker pattern</text>
  <text class="side" x="640" y="407">Tail-risk + drawdown agents</text>
  <text class="side" x="640" y="424">EU AI Act 2026 audit trail</text>

  <!-- Parent-order flow down (left side) -->
  <path class="arrow" d="M 80 100 L 80 180" />
  <path class="arrow" d="M 80 215 L 80 295" />
  <path class="arrow" d="M 80 330 L 80 400" />
  <text class="side" x="50" y="155" transform="rotate(-90 50 155)">parent order</text>

  <!-- Risk feedback up (right edge bracket) -->
  <path class="bracket" d="M 845 405 L 870 405 L 870 70 L 845 70" />
  <path class="arrow-up" d="M 870 50 L 870 70" />
  <text class="side" x="880" y="240" transform="rotate(-90 880 240)">risk-signal feedback</text>
</svg>
