<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Reinforcement-learning trade-execution loop</title>
  <desc id="d">A two-box loop. The RL agent on the left receives the limit-order-book state and emits an action — market order, limit order at some depth, or wait. The order-book environment on the right ticks forward and returns the next state and a reward equal to the negative implementation shortfall.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <style>
    .hero      { fill: var(--accent, #d4421e); stroke: none; }
    .adj       { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .box       { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: var(--paper, #fff); }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink, #1a1a1a); opacity: .72; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper, #fff); opacity: .85; }
    .arrow     { fill: none; stroke: currentColor; stroke-width: 1.75; marker-end: url(#arr); opacity: .80; }
    .arrow-ret { fill: none; stroke: currentColor; stroke-width: 1.75; marker-end: url(#arr); opacity: .55; stroke-dasharray: 6 4; }
    .edge-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink, #1a1a1a); opacity: .72; }
    .note      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .55; font-style: italic; }
  </style>

  <!-- RL agent (hero) -->
  <rect class="hero" x="80" y="160" width="280" height="180" rx="12" ry="12" />
  <text class="label-inv" x="220" y="200" text-anchor="middle">RL agent</text>
  <text class="sub-inv" x="220" y="230" text-anchor="middle">policy π(a | s)</text>
  <text class="sub-inv" x="220" y="252" text-anchor="middle">A3C · PPO · DQN</text>
  <text class="sub-inv" x="220" y="280" text-anchor="middle">trained against the</text>
  <text class="sub-inv" x="220" y="298" text-anchor="middle">simulator below</text>
  <text class="sub-inv" x="220" y="320" text-anchor="middle">guarded by hard rules</text>

  <!-- Order-book env (adj) -->
  <rect class="adj" x="540" y="160" width="280" height="180" rx="12" ry="12" />
  <text class="label" x="680" y="200" text-anchor="middle">Limit-order-book env</text>
  <text class="sub" x="680" y="230" text-anchor="middle">noise + tactical + strategic</text>
  <text class="sub" x="680" y="252" text-anchor="middle">counterparties</text>
  <text class="sub" x="680" y="280" text-anchor="middle">market-impact model</text>
  <text class="sub" x="680" y="298" text-anchor="middle">tick → tick transition</text>
  <text class="sub" x="680" y="320" text-anchor="middle">Almgren–Chriss baseline</text>

  <!-- Action arrow (top) -->
  <path class="arrow" d="M 360 200 L 540 200" />
  <text class="edge-lbl" x="450" y="190" text-anchor="middle">action a — place market / limit / wait</text>

  <!-- State + reward arrow (bottom, dashed = return) -->
  <path class="arrow-ret" d="M 540 300 L 360 300" />
  <text class="edge-lbl" x="450" y="320" text-anchor="middle">state s' — book snapshot</text>
  <text class="edge-lbl" x="450" y="336" text-anchor="middle">reward r = − implementation shortfall</text>

  <!-- Footer note -->
  <text class="note" x="450" y="410" text-anchor="middle">The agent learns a placement policy; the closed-form Almgren–Chriss solution remains the published benchmark.</text>
  <text class="note" x="450" y="430" text-anchor="middle">Generalisation across regimes is the active research frontier — agents tend to memorise the simulator.</text>

  <!-- Side caption -->
  <text class="edge-lbl" x="80" y="120">RL loop · trade execution</text>
  <text class="note" x="80" y="138">parent order arrives from the Signal layer; child orders go to the venue.</text>
</svg>
