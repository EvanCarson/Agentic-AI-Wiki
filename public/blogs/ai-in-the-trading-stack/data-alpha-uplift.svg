<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Reported alpha uplift for AI-driven funds in 2024</title>
  <desc id="d">Horizontal bar chart comparing three reference numbers for 2024: PwC's alternative-data alpha uplift at twenty percent (accent), the SEC's AI-fund outperformance over peers at twelve percent (accent-soft), and the S&P 500 baseline at zero percent (neutral). Each bar is labelled at its right edge.</desc>
  <style>
    .bar-strong { fill: var(--accent, #d4421e); }
    .bar-medium { fill: var(--accent-soft, #f5c5b8); }
    .bar-weak   { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; }
    .ax         { stroke: var(--border-soft, #d8d4ce); stroke-width: 1; stroke-dasharray: 3 3; opacity: .55; }
    .baseline   { stroke: var(--ink, #1a1a1a); stroke-width: 1.25; opacity: .55; }
    .row-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink, #1a1a1a); }
    .row-sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .60; }
    .val-strong { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 16px; font-weight: 700; fill: var(--accent, #d4421e); }
    .val-medium { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 16px; font-weight: 700; fill: var(--ink, #1a1a1a); opacity: .80; }
    .val-weak   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 16px; font-weight: 700; fill: var(--ink, #1a1a1a); opacity: .50; }
    .tick       { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .55; }
    .title      { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink, #1a1a1a); }
  </style>

  <!-- Chart title -->
  <text class="title" x="30" y="40">Reported 2024 alpha uplift (annualised, vs flat baseline)</text>

  <!-- X-axis gridlines at 0, 5, 10, 15, 20, 25 (scaled: 20% = 600px from x=270) -->
  <!-- chart area: x 270–870 (= 600px wide, 25% range) -->
  <line class="ax" x1="270" y1="80"  x2="270" y2="340" />
  <line class="ax" x1="390" y1="80"  x2="390" y2="340" />
  <line class="ax" x1="510" y1="80"  x2="510" y2="340" />
  <line class="ax" x1="630" y1="80"  x2="630" y2="340" />
  <line class="ax" x1="750" y1="80"  x2="750" y2="340" />
  <line class="ax" x1="870" y1="80"  x2="870" y2="340" />

  <!-- baseline at 0% -->
  <line class="baseline" x1="270" y1="80" x2="270" y2="340" />

  <!-- tick labels -->
  <text class="tick" x="270" y="362" text-anchor="middle">0%</text>
  <text class="tick" x="390" y="362" text-anchor="middle">5%</text>
  <text class="tick" x="510" y="362" text-anchor="middle">10%</text>
  <text class="tick" x="630" y="362" text-anchor="middle">15%</text>
  <text class="tick" x="750" y="362" text-anchor="middle">20%</text>
  <text class="tick" x="870" y="362" text-anchor="middle">25%</text>

  <!-- Row 1: PwC +20% (accent) -->
  <rect class="bar-strong" x="270" y="95" width="480" height="48" rx="4" ry="4" />
  <text class="row-label" x="30" y="118">PwC alt-data funds</text>
  <text class="row-sub"   x="30" y="135">2024 alpha uplift</text>
  <text class="val-strong" x="760" y="125">+20%</text>

  <!-- Row 2: SEC +12% (accent-soft) -->
  <rect class="bar-medium" x="270" y="175" width="288" height="48" rx="4" ry="4" />
  <text class="row-label" x="30" y="198">SEC AI funds</text>
  <text class="row-sub"   x="30" y="215">2024 outperformance vs peers</text>
  <text class="val-medium" x="568" y="205">+12%</text>

  <!-- Row 3: Baseline 0% (weak/neutral) — a token bar -->
  <rect class="bar-weak" x="270" y="255" width="6" height="48" rx="4" ry="4" />
  <text class="row-label" x="30" y="278">S&amp;P 500 baseline</text>
  <text class="row-sub"   x="30" y="295">2024 reference</text>
  <text class="val-weak" x="290" y="285">0%</text>
</svg>
