<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Failure-mode heatmap by trading-stack layer</title>
  <desc id="d">Heatmap matrix. Rows are the four stack layers — Signal, Sizing, Execution, Risk. Columns are four failure modes — overfitting, regime shift, data leakage, audit-time opacity. Each cell is shaded strong, medium, or weak according to how severely the failure mode hits the layer, and labelled with the qualitative level.</desc>
  <style>
    .col-strong { fill: var(--accent, #d4421e); }
    .col-medium { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; }
    .col-weak   { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; }
    .col-header { fill: var(--ink, #1a1a1a); }
    .row-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .col-name   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--paper, #fff); }
    .cell-strong { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--paper, #fff); }
    .cell-medium { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); }
    .cell-weak   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .60; }
    .legend-l   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .60; }
    .title      { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink, #1a1a1a); }
  </style>

  <text class="title" x="30" y="32">Failure mode × stack layer — severity</text>

  <!-- Column headers (4) -->
  <rect class="col-header" x="170" y="55" width="170" height="30" rx="4" ry="4" />
  <text class="col-name" x="255" y="74" text-anchor="middle">Overfitting</text>
  <rect class="col-header" x="350" y="55" width="170" height="30" rx="4" ry="4" />
  <text class="col-name" x="435" y="74" text-anchor="middle">Regime shift</text>
  <rect class="col-header" x="530" y="55" width="170" height="30" rx="4" ry="4" />
  <text class="col-name" x="615" y="74" text-anchor="middle">Data leakage</text>
  <rect class="col-header" x="710" y="55" width="170" height="30" rx="4" ry="4" />
  <text class="col-name" x="795" y="74" text-anchor="middle">Audit opacity</text>

  <!-- Row: Signal -->
  <text class="row-label" x="30" y="115">Signal</text>
  <rect class="col-strong" x="170" y="95" width="170" height="55" rx="4" ry="4" />
  <text class="cell-strong" x="255" y="129" text-anchor="middle">Strong</text>
  <rect class="col-strong" x="350" y="95" width="170" height="55" rx="4" ry="4" />
  <text class="cell-strong" x="435" y="129" text-anchor="middle">Strong</text>
  <rect class="col-strong" x="530" y="95" width="170" height="55" rx="4" ry="4" />
  <text class="cell-strong" x="615" y="129" text-anchor="middle">Strong</text>
  <rect class="col-weak"   x="710" y="95" width="170" height="55" rx="4" ry="4" />
  <text class="cell-weak"  x="795" y="129" text-anchor="middle">Weak</text>

  <!-- Row: Sizing -->
  <text class="row-label" x="30" y="180">Sizing</text>
  <rect class="col-medium" x="170" y="160" width="170" height="55" rx="4" ry="4" />
  <text class="cell-medium" x="255" y="194" text-anchor="middle">Medium</text>
  <rect class="col-medium" x="350" y="160" width="170" height="55" rx="4" ry="4" />
  <text class="cell-medium" x="435" y="194" text-anchor="middle">Medium</text>
  <rect class="col-weak"   x="530" y="160" width="170" height="55" rx="4" ry="4" />
  <text class="cell-weak"  x="615" y="194" text-anchor="middle">Weak</text>
  <rect class="col-medium" x="710" y="160" width="170" height="55" rx="4" ry="4" />
  <text class="cell-medium" x="795" y="194" text-anchor="middle">Medium</text>

  <!-- Row: Execution -->
  <text class="row-label" x="30" y="245">Execution</text>
  <rect class="col-strong" x="170" y="225" width="170" height="55" rx="4" ry="4" />
  <text class="cell-strong" x="255" y="259" text-anchor="middle">Strong</text>
  <rect class="col-medium" x="350" y="225" width="170" height="55" rx="4" ry="4" />
  <text class="cell-medium" x="435" y="259" text-anchor="middle">Medium</text>
  <rect class="col-medium" x="530" y="225" width="170" height="55" rx="4" ry="4" />
  <text class="cell-medium" x="615" y="259" text-anchor="middle">Medium (feed)</text>
  <rect class="col-medium" x="710" y="225" width="170" height="55" rx="4" ry="4" />
  <text class="cell-medium" x="795" y="259" text-anchor="middle">Medium</text>

  <!-- Row: Risk -->
  <text class="row-label" x="30" y="310">Risk</text>
  <rect class="col-weak"   x="170" y="290" width="170" height="55" rx="4" ry="4" />
  <text class="cell-weak"  x="255" y="324" text-anchor="middle">Weak</text>
  <rect class="col-strong" x="350" y="290" width="170" height="55" rx="4" ry="4" />
  <text class="cell-strong" x="435" y="324" text-anchor="middle">Strong</text>
  <rect class="col-medium" x="530" y="290" width="170" height="55" rx="4" ry="4" />
  <text class="cell-medium" x="615" y="324" text-anchor="middle">Medium</text>
  <rect class="col-strong" x="710" y="290" width="170" height="55" rx="4" ry="4" />
  <text class="cell-strong" x="795" y="324" text-anchor="middle">Strong</text>

  <!-- legend -->
  <rect class="col-weak"   x="170" y="365" width="14" height="14" />
  <text class="legend-l" x="190" y="377">Weak — peripheral concern</text>
  <rect class="col-medium" x="380" y="365" width="14" height="14" />
  <text class="legend-l" x="400" y="377">Medium — actively managed</text>
  <rect class="col-strong" x="610" y="365" width="14" height="14" />
  <text class="legend-l" x="630" y="377">Strong — dominant failure mode</text>
</svg>
