<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="hst hsd">
  <title id="hst">The x402 handshake and the authorisation envelope around it</title>
  <desc id="hsd">An agent sends an unpaid request to a seller endpoint, which answers with HTTP 402 and a quote. The agent asks the payment service to settle it. The payment service checks the configured envelope first: the approved-seller list, the scope of the listing and the session and account spending limits, all of which are enforced outside the model. Only then does settlement happen, landing as a charge on the buyer's cloud bill and as entries in the audit log and cost reports.</desc>
  <style>
    .hs-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hs-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .hs-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .hs-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .hs-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .hs-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); }
    .hs-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hs-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .hs-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#hsarr); }
  </style>
  <defs>
    <marker id="hsarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="hs-ttl" x="20" y="28">The thin part and the load-bearing part</text>

  <rect class="hs-box" x="20" y="70" width="180" height="56" rx="8" />
  <text class="hs-lbl" x="34" y="94">agent step</text>
  <text class="hs-sub" x="34" y="113">needs a paid API call</text>

  <path class="hs-arr" d="M 206 98 L 286 98" />
  <text class="hs-sub" x="212" y="58">unpaid request</text>

  <rect class="hs-box" x="292" y="70" width="200" height="56" rx="8" />
  <text class="hs-lbl" x="306" y="94">seller endpoint</text>
  <text class="hs-mono" x="306" y="113">HTTP 402 + quote</text>

  <path class="hs-arr" d="M 392 132 L 392 186" />
  <text class="hs-sub" x="400" y="162">settle this quote</text>

  <rect class="hs-adj" x="252" y="192" width="280" height="40" rx="8" />
  <text class="hs-lbl" x="266" y="217">payment manager, session limits</text>

  <path class="hs-arr" d="M 392 238 L 392 282" />

  <rect class="hs-hero" x="160" y="288" width="464" height="92" rx="8" />
  <text class="hs-inv" x="178" y="314">enforced outside the model, before any money moves</text>
  <text class="hs-inv" x="178" y="337">is this seller on the approved list</text>
  <text class="hs-inv" x="178" y="356">is this spend inside the session and account limit</text>
  <text class="hs-inv" x="178" y="375">is this listing in scope for the task</text>

  <path class="hs-arr" d="M 392 386 L 392 428" />

  <rect class="hs-box" x="180" y="434" width="424" height="52" rx="8" />
  <text class="hs-lbl" x="194" y="456">settlement lands on the buyer's cloud bill</text>
  <text class="hs-sub" x="194" y="474">audit log entry, cost report line, trace id if you put one there</text>

  <rect class="hs-box" x="660" y="70" width="220" height="162" rx="8" />
  <text class="hs-lbl" x="674" y="94">what the model decides</text>
  <text class="hs-sub" x="674" y="117">that it wants to buy something</text>
  <text class="hs-sub" x="674" y="136">which listing to ask for</text>
  <text class="hs-sub" x="674" y="155">when to retry</text>
  <text class="hs-lbl" x="674" y="186">what it cannot decide</text>
  <text class="hs-sub" x="674" y="209">whether the limit applies</text>
</svg>
