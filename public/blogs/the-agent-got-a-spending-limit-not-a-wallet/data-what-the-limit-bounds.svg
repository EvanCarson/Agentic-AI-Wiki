<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="wlt wld">
  <title id="wlt">Which dimension of purchase authority the new rail actually enforces</title>
  <desc id="wld">Four dimensions of a purchase grant scored on whether the platform enforces them and whether the buyer can see them afterwards. The amount and rate are enforced at the infrastructure layer and fully visible. The counterparty is enforced through an approved-seller list the buyer has to maintain. Scope is only as narrow as the listing, so the buyer's own code has to bound it. Recourse is not enforced at all and depends on the seller's terms, which is the dimension left entirely to the buyer.</desc>
  <style>
    .wl-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .wl-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .wl-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .wl-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wl-col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .wl-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wl-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .wl-cellin { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .wl-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="wl-ttl" x="20" y="30">Four dimensions of a purchase grant</text>

  <text class="wl-col" x="520" y="66" text-anchor="middle">PLATFORM ENFORCES IT</text>
  <text class="wl-col" x="760" y="66" text-anchor="middle">YOU CAN SEE IT AFTER</text>

  <text class="wl-row" x="20" y="105">Amount and rate</text>
  <rect class="wl-strong" x="420" y="84" width="200" height="34" />
  <text class="wl-cellin" x="520" y="105" text-anchor="middle">Yes, in infrastructure</text>
  <rect class="wl-strong" x="660" y="84" width="200" height="34" />
  <text class="wl-cellin" x="760" y="105" text-anchor="middle">Yes, cost reports</text>

  <text class="wl-row" x="20" y="165">Counterparty, who may be paid</text>
  <rect class="wl-med" x="420" y="144" width="200" height="34" />
  <text class="wl-cell" x="520" y="165" text-anchor="middle">Yes, from your list</text>
  <rect class="wl-strong" x="660" y="144" width="200" height="34" />
  <text class="wl-cellin" x="760" y="165" text-anchor="middle">Yes, audit log</text>

  <text class="wl-row" x="20" y="225">Scope, what may be bought</text>
  <rect class="wl-weak" x="420" y="204" width="200" height="34" />
  <text class="wl-cell" x="520" y="225" text-anchor="middle">Only per listing</text>
  <rect class="wl-med" x="660" y="204" width="200" height="34" />
  <text class="wl-cell" x="760" y="225" text-anchor="middle">If you tag the run</text>

  <text class="wl-row" x="20" y="285">Recourse, who can undo it</text>
  <rect class="wl-weak" x="420" y="264" width="200" height="34" />
  <text class="wl-cell" x="520" y="285" text-anchor="middle">No</text>
  <rect class="wl-weak" x="660" y="264" width="200" height="34" />
  <text class="wl-cell" x="760" y="285" text-anchor="middle">Seller's terms</text>

  <text class="wl-leg" x="20" y="330">The two rows the platform does not cover are the two that cost money after the run has ended.</text>

  <rect class="wl-weak" x="20" y="361" width="16" height="13" />
  <text class="wl-leg" x="46" y="372">yours to build</text>
  <rect class="wl-med" x="190" y="361" width="16" height="13" />
  <text class="wl-leg" x="216" y="372">partly covered</text>
  <rect class="wl-strong" x="360" y="361" width="16" height="13" />
  <text class="wl-leg" x="386" y="372">covered</text>
</svg>
