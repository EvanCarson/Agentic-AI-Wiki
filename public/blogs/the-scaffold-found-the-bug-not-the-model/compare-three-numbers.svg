<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="ct cd">
  <title id="ct">Three numbers that describe an automated vulnerability finder</title>
  <desc id="cd">Three columns — recall, precision and severity — each with who pays the cost and how fast it is improving. Recall is falling in price, precision is paid by maintainers, and severity decides whether the output is hardening or averted incidents.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .rule   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .45; }
  </style>

  <text class="title" x="20" y="28">Buy on the second column; the first is already commoditised</text>

  <rect class="box" x="30" y="50" width="250" height="46" />
  <text class="label" x="155" y="79" text-anchor="middle">Recall</text>
  <rect class="hero" x="325" y="50" width="250" height="46" />
  <text class="label-inv" x="450" y="79" text-anchor="middle">Precision</text>
  <rect class="adj" x="620" y="50" width="250" height="46" />
  <text class="label" x="745" y="79" text-anchor="middle">Severity</text>

  <text class="sub" x="155" y="128" text-anchor="middle">68% of real CVEs recovered</text>
  <text class="sub" x="155" y="145" text-anchor="middle">by small models, four passes</text>
  <text class="sub" x="450" y="128" text-anchor="middle">6 accepted from 29 filed</text>
  <text class="sub" x="450" y="145" text-anchor="middle">on a specialist's good run</text>
  <text class="sub" x="745" y="128" text-anchor="middle">6 of 6 rated Low</text>
  <text class="sub" x="745" y="145" text-anchor="middle">hardening, not averted breach</text>

  <path class="rule" d="M 30 162 L 870 162" />

  <text class="sub" x="155" y="188" text-anchor="middle">Paid by: whoever rents the GPU</text>
  <text class="sub" x="155" y="205" text-anchor="middle">Trend: falling every quarter</text>
  <text class="sub" x="450" y="188" text-anchor="middle">Paid by: the maintainer reading it</text>
  <text class="sub" x="450" y="205" text-anchor="middle">Trend: not improving on its own</text>
  <text class="sub" x="745" y="188" text-anchor="middle">Paid by: the team that must patch</text>
  <text class="sub" x="745" y="205" text-anchor="middle">Trend: set by the target's maturity</text>

  <rect class="box" x="30" y="228" width="840" height="54" />
  <text class="label" x="450" y="251" text-anchor="middle">The metric to put on the contract: accepted findings per maintainer-hour of triage</text>
  <text class="sub" x="450" y="271" text-anchor="middle">Findings per repository is a vanity number, and it is the one every vendor reports.</text>
</svg>
