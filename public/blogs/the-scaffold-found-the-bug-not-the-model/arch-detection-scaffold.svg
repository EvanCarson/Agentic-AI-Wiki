<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="st sd">
  <title id="st">The fixed detection scaffold</title>
  <desc id="sd">A repository pinned at its vulnerable commit, with target-file scope but no CVE metadata, feeds four repeated detection passes around a small model. An optional context-generation stage and a multi-round triage stage follow, and a detector-blinded judge accepts a finding only when code path, root cause, attack condition and impact all match.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
    .frame  { fill: none; stroke: currentColor; stroke-width: 1; opacity: .35; stroke-dasharray: 4 4; rx: 10; ry: 10; }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="title" x="20" y="30">Everything outside the model box is under the experimenter's control</text>

  <rect class="box" x="20" y="60" width="180" height="80" />
  <text class="label" x="110" y="92" text-anchor="middle">Repo pinned at the</text>
  <text class="label" x="110" y="110" text-anchor="middle">vulnerable commit</text>
  <text class="sub" x="110" y="130" text-anchor="middle">+ target-file scope only</text>

  <path class="arrow" d="M 200 100 L 258 100" />

  <rect class="adj" x="262" y="60" width="180" height="80" />
  <text class="label" x="352" y="94" text-anchor="middle">Context generation</text>
  <text class="sub" x="352" y="116" text-anchor="middle">optional stage</text>

  <path class="arrow" d="M 442 100 L 500 100" />

  <rect class="frame" x="504" y="46" width="376" height="176" />
  <text class="sub" x="516" y="66">Detection — four repeated passes</text>

  <rect class="hero" x="520" y="78" width="160" height="58" />
  <text class="label-inv" x="600" y="103" text-anchor="middle">Small / open-weight</text>
  <text class="sub-inv" x="600" y="122" text-anchor="middle">3–13B active</text>

  <rect class="box" x="700" y="78" width="160" height="58" />
  <text class="label" x="780" y="103" text-anchor="middle">Candidate findings</text>
  <text class="sub" x="780" y="122" text-anchor="middle">deduplicated</text>

  <path class="arrow" d="M 680 107 L 696 107" />
  <path class="arrow" d="M 780 140 L 780 160" />
  <path class="arrow" d="M 700 176 L 610 176" />
  <text class="sub" x="790" y="182">pass 2, 3, 4</text>
  <rect class="box" x="520" y="154" width="170" height="44" />
  <text class="sub" x="605" y="181" text-anchor="middle">re-run with variation</text>

  <path class="arrow" d="M 692 222 L 692 262" />

  <rect class="adj" x="520" y="266" width="340" height="70" />
  <text class="label" x="690" y="296" text-anchor="middle">Multi-round triage</text>
  <text class="sub" x="690" y="318" text-anchor="middle">replayable; drops what cannot be substantiated</text>

  <path class="arrow" d="M 520 300 L 462 300" />

  <rect class="box" x="262" y="266" width="180" height="70" />
  <text class="label" x="352" y="296" text-anchor="middle">Blinded judge</text>
  <text class="sub" x="352" y="318" text-anchor="middle">no CVE metadata shown</text>

  <path class="arrow" d="M 352 336 L 352 382" />

  <rect class="box" x="140" y="386" width="424" height="86" />
  <text class="label" x="352" y="414" text-anchor="middle">Accepted only if all four match</text>
  <text class="sub" x="352" y="437" text-anchor="middle">same code path · same root cause</text>
  <text class="sub" x="352" y="456" text-anchor="middle">same attack condition · same impact</text>

  <rect class="hero" x="604" y="386" width="256" height="86" />
  <text class="label-inv" x="732" y="422" text-anchor="middle">65 of 95 CVEs recovered</text>
  <text class="sub-inv" x="732" y="446" text-anchor="middle">no frontier model in the detection path</text>

  <path class="arrow" d="M 564 429 L 600 429" />
</svg>
