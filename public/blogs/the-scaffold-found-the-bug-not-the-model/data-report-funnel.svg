<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ft fd">
  <title id="ft">Reports filed versus CVEs accepted</title>
  <desc id="fd">Horizontal bar chart. Twenty-nine reports were filed against curl in late August 2026; six were accepted as CVEs; none were rated above Low severity. The gap between the first two bars is triage work carried by maintainers.</desc>
  <style>
    .barA   { fill: var(--accent, #d4421e); }
    .barB   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .barC   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .value  { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; fill: var(--ink); font-weight: 600; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .grid   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .25; stroke-dasharray: 3 4; }
    .axis   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .45; }
  </style>

  <text class="title" x="20" y="32">One disclosure run against curl, August–September 2026</text>

  <path class="grid" d="M 440 60 L 440 316" />
  <path class="grid" d="M 630 60 L 630 316" />
  <path class="grid" d="M 820 60 L 820 316" />
  <path class="axis" d="M 250 316 L 850 316" />

  <text class="label" x="20" y="98">Reports filed</text>
  <rect class="barA" x="250" y="76" width="551" height="40" rx="4" ry="4" />
  <text class="value" x="815" y="103">29</text>

  <text class="label" x="20" y="178">Accepted as CVEs</text>
  <rect class="barB" x="250" y="156" width="114" height="40" rx="4" ry="4" />
  <text class="value" x="378" y="183">6</text>

  <text class="label" x="20" y="258">Rated above Low</text>
  <rect class="barC" x="250" y="236" width="4" height="40" rx="2" ry="2" />
  <text class="value" x="268" y="263">0</text>

  <text class="sub" x="440" y="338" text-anchor="middle">10</text>
  <text class="sub" x="630" y="338" text-anchor="middle">20</text>
  <text class="sub" x="820" y="338" text-anchor="middle">30</text>
  <text class="sub" x="250" y="338">0</text>
  <text class="sub" x="850" y="372" text-anchor="end">reports</text>
</svg>
