<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Two places the deciding facts can live</title>
  <desc id="d">Architecture diagram contrasting two authorization shapes. In the attribute-passing shape used by OPA and Cedar, the agent's request carries the subject, resource and context attributes to the policy engine, so the caller supplies the facts the decision is made from. In the relationship-store shape used by OpenFGA and SpiceDB, the engine holds its own relationship graph and the caller supplies only the tuple to check, so the decision reads facts the agent cannot influence.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .lane   { fill: none; stroke: var(--ink); stroke-width: 1; opacity: .25; stroke-dasharray: 4 5; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .8; }
    .lane-title { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .note   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="chart-title" x="30" y="34">Where the deciding facts come from</text>

  <rect class="lane" x="20" y="52" width="860" height="188" rx="10" />
  <text class="lane-title" x="34" y="74">ATTRIBUTE-PASSING — OPA (REGO), CEDAR</text>

  <rect class="box" x="34" y="90" width="150" height="66" rx="8" />
  <text class="label" x="52" y="118">Agent</text>
  <text class="sub" x="52" y="136">context is reachable</text>

  <path class="arrow" d="M 190 123 L 246 123" />

  <rect class="adj" x="252" y="90" width="160" height="66" rx="8" />
  <text class="label" x="270" y="118">Enforcement point</text>
  <text class="sub" x="270" y="136">builds the request</text>

  <path class="arrow" d="M 418 123 L 474 123" />

  <rect class="hero" x="480" y="90" width="170" height="66" rx="8" />
  <text class="label-inv" x="498" y="118">Policy engine</text>
  <text class="sub-inv" x="498" y="136">evaluates a rule</text>

  <rect class="box" x="690" y="90" width="176" height="66" rx="8" />
  <text class="label" x="706" y="114">subject + resource</text>
  <text class="label" x="706" y="132">+ context</text>
  <text class="sub" x="706" y="148">travel with the request</text>

  <text class="sub" x="34" y="190">The engine is stateless and fast. It knows only what the caller told it, so every attribute in the</text>
  <text class="sub" x="34" y="208">decision has to be assembled by something the agent cannot influence — or the check is theatre.</text>
  <text class="sub" x="34" y="226">Cedar is built to be analysed; Rego is built to be general. Neither one stores your data.</text>

  <rect class="lane" x="20" y="256" width="860" height="196" rx="10" />
  <text class="lane-title" x="34" y="278">RELATIONSHIP STORE — OPENFGA, SPICEDB</text>

  <rect class="box" x="34" y="294" width="150" height="66" rx="8" />
  <text class="label" x="52" y="322">Agent</text>
  <text class="sub" x="52" y="340">context is reachable</text>

  <path class="arrow" d="M 190 327 L 246 327" />

  <rect class="adj" x="252" y="294" width="160" height="66" rx="8" />
  <text class="label" x="270" y="322">Enforcement point</text>
  <text class="sub" x="270" y="340">asks one question</text>

  <path class="arrow" d="M 418 327 L 474 327" />

  <rect class="hero" x="480" y="294" width="170" height="66" rx="8" />
  <text class="label-inv" x="498" y="322">Decision service</text>
  <text class="sub-inv" x="498" y="340">walks the graph</text>

  <path class="arrow" d="M 778 356 L 778 328 L 660 328" />

  <rect class="box" x="690" y="368" width="176" height="66" rx="8" />
  <text class="label" x="706" y="396">Relationship graph</text>
  <text class="sub" x="706" y="414">owned by the engine</text>

  <text class="sub" x="34" y="394">The caller supplies a tuple to check, not the facts to decide from. Delegation is a relationship</text>
  <text class="sub" x="34" y="412">the store already holds, so an agent cannot assert its way into an answer — and the same store</text>
  <text class="sub" x="34" y="430">can enumerate what a subject may reach, which is what filtering a retrieval set needs.</text>

  <text class="note" x="30" y="474">BOTH SHAPES CAN EXPRESS THE SAME POLICY. THEY DIFFER ON WHO IS TRUSTED TO SUPPLY THE FACTS,</text>
  <text class="note" x="30" y="490">WHICH IS THE WHOLE QUESTION ONCE THE CALLER IS A MODEL READING ATTACKER-CONTROLLED TEXT</text>
</svg>
