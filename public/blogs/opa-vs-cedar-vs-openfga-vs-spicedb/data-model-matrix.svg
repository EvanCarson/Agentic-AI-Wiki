<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Where each authorization engine leans hardest</title>
  <desc id="d">Feature matrix with four rows for OPA with Rego, Cedar, OpenFGA and SpiceDB, and five columns: holds the data, enumerates resources, models delegation, supports policy analysis, and operational footprint. OPA and Cedar are strong on analysis and light operationally but hold no data and cannot enumerate. OpenFGA and SpiceDB hold the relationship graph and can enumerate, at the cost of running a stateful service.</desc>
  <style>
    .cell-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .cell-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .cell-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .row      { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .rowsub   { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--ink); opacity: .6; }
    .col      { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .cv       { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cv-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .legend   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .note     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="chart-title" x="30" y="32">Five axes that decide it, and nobody is strong on all five</text>

  <text class="col" x="196" y="66">HOLDS THE DATA</text>
  <text class="col" x="333" y="66">ENUMERATES</text>
  <text class="col" x="470" y="66">DELEGATION</text>
  <text class="col" x="607" y="66">ANALYSABLE</text>
  <text class="col" x="744" y="66">LIGHT TO RUN</text>

  <text class="row" x="30" y="102">OPA / Rego</text>
  <text class="rowsub" x="30" y="118">CNCF graduated</text>
  <rect class="cell-weak" x="190" y="80" width="132" height="48" rx="5" />
  <text class="cv" x="200" y="109">No — you pass it</text>
  <rect class="cell-weak" x="327" y="80" width="132" height="48" rx="5" />
  <text class="cv" x="337" y="109">No</text>
  <rect class="cell-mid" x="464" y="80" width="132" height="48" rx="5" />
  <text class="cv" x="474" y="109">Expressible</text>
  <rect class="cell-weak" x="601" y="80" width="132" height="48" rx="5" />
  <text class="cv" x="611" y="109">Rego is general</text>
  <rect class="cell-mid" x="738" y="80" width="132" height="48" rx="5" />
  <text class="cv" x="748" y="109">Sidecar + bundles</text>

  <text class="row" x="30" y="168">Cedar</text>
  <text class="rowsub" x="30" y="184">AWS, Apache-2.0</text>
  <rect class="cell-weak" x="190" y="146" width="132" height="48" rx="5" />
  <text class="cv" x="200" y="175">No — you pass it</text>
  <rect class="cell-mid" x="327" y="146" width="132" height="48" rx="5" />
  <text class="cv" x="337" y="175">Batch, not list</text>
  <rect class="cell-mid" x="464" y="146" width="132" height="48" rx="5" />
  <text class="cv" x="474" y="175">Expressible</text>
  <rect class="cell-strong" x="601" y="146" width="132" height="48" rx="5" />
  <text class="cv-inv" x="611" y="175">Designed for it</text>
  <rect class="cell-strong" x="738" y="146" width="132" height="48" rx="5" />
  <text class="cv-inv" x="748" y="175">Library or hosted</text>

  <text class="row" x="30" y="234">OpenFGA</text>
  <text class="rowsub" x="30" y="250">Zanzibar, CNCF</text>
  <rect class="cell-strong" x="190" y="212" width="132" height="48" rx="5" />
  <text class="cv-inv" x="200" y="241">Owns the graph</text>
  <rect class="cell-strong" x="327" y="212" width="132" height="48" rx="5" />
  <text class="cv-inv" x="337" y="241">ListObjects</text>
  <rect class="cell-strong" x="464" y="212" width="132" height="48" rx="5" />
  <text class="cv-inv" x="474" y="241">Documented</text>
  <rect class="cell-mid" x="601" y="212" width="132" height="48" rx="5" />
  <text class="cv" x="611" y="241">Model review</text>
  <rect class="cell-weak" x="738" y="212" width="132" height="48" rx="5" />
  <text class="cv" x="748" y="241">Service + store</text>

  <text class="row" x="30" y="300">SpiceDB</text>
  <text class="rowsub" x="30" y="316">Zanzibar, AuthZed</text>
  <rect class="cell-strong" x="190" y="278" width="132" height="48" rx="5" />
  <text class="cv-inv" x="200" y="307">Owns the graph</text>
  <rect class="cell-strong" x="327" y="278" width="132" height="48" rx="5" />
  <text class="cv-inv" x="337" y="307">LookupResources</text>
  <rect class="cell-mid" x="464" y="278" width="132" height="48" rx="5" />
  <text class="cv" x="474" y="307">Modellable</text>
  <rect class="cell-mid" x="601" y="278" width="132" height="48" rx="5" />
  <text class="cv" x="611" y="307">Model review</text>
  <rect class="cell-weak" x="738" y="278" width="132" height="48" rx="5" />
  <text class="cv" x="748" y="307">Distributed DB</text>

  <rect class="cell-strong" x="190" y="340" width="16" height="12" rx="3" />
  <text class="legend" x="212" y="350">STRONG</text>
  <rect class="cell-mid" x="290" y="340" width="16" height="12" rx="3" />
  <text class="legend" x="312" y="350">MEDIUM</text>
  <rect class="cell-weak" x="390" y="340" width="16" height="12" rx="3" />
  <text class="legend" x="412" y="350">WEAK</text>

  <text class="note" x="30" y="382">POSITIONS AS OF AUGUST 2026. "LIGHT TO RUN" IS AN OPERATIONS JUDGEMENT, NOT A BENCHMARK</text>
</svg>
