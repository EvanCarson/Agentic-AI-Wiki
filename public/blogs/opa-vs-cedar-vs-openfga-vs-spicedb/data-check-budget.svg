<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Authorization latency per unit of work, at five milliseconds a check</title>
  <desc id="d">Horizontal bar chart on a logarithmic scale showing how much authorization latency accumulates per unit of work when each check costs five milliseconds. A single web request spends five milliseconds. A short agent task making twelve checks spends sixty milliseconds. A tool-heavy agent task making sixty checks spends three hundred milliseconds. Filtering a thousand retrieved chunks one check at a time spends five seconds, which is why bulk enumeration matters more than single-check speed.</desc>
  <style>
    .bar-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .bar-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .bar-mute { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .grid     { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 3 4; }
    .axis     { stroke: var(--ink); stroke-width: 1.25; opacity: .5; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .key      { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .keysub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .val      { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val-inv  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); }
    .tick     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .55; }
    .note     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="chart-title" x="30" y="34">One check is cheap. The unit of work is what changed.</text>

  <line class="grid" x1="355" y1="52" x2="355" y2="288" />
  <line class="grid" x1="510" y1="52" x2="510" y2="288" />
  <line class="grid" x1="665" y1="52" x2="665" y2="288" />
  <line class="grid" x1="820" y1="52" x2="820" y2="288" />

  <text class="key" x="30" y="78">Web request</text>
  <text class="keysub" x="30" y="94">1 check</text>
  <rect class="bar-mute" x="200" y="62" width="108" height="42" rx="4" />
  <text class="val" x="320" y="89">5 ms</text>

  <text class="key" x="30" y="146">Short agent task</text>
  <text class="keysub" x="30" y="162">12 checks</text>
  <rect class="bar-mute" x="200" y="130" width="276" height="42" rx="4" />
  <text class="val" x="488" y="157">60 ms</text>

  <text class="key" x="30" y="214">Tool-heavy task</text>
  <text class="keysub" x="30" y="230">60 checks</text>
  <rect class="bar-adj" x="200" y="198" width="384" height="42" rx="4" />
  <text class="val" x="596" y="225">300 ms</text>

  <text class="key" x="30" y="282">Filtering retrieval</text>
  <text class="keysub" x="30" y="298">1,000 chunks, one at a time</text>
  <rect class="bar-hero" x="200" y="266" width="573" height="42" rx="4" />
  <text class="val-inv" x="761" y="293" text-anchor="end">5,000 ms</text>

  <line class="axis" x1="200" y1="322" x2="820" y2="322" />
  <text class="tick" x="200" y="340">1 ms</text>
  <text class="tick" x="355" y="340">10 ms</text>
  <text class="tick" x="510" y="340">100 ms</text>
  <text class="tick" x="665" y="340">1 s</text>
  <text class="tick" x="820" y="340" text-anchor="end">10 s</text>

  <text class="note" x="30" y="368">LOG SCALE. ILLUSTRATIVE AT A FLAT 5 MS PER CHECK — REAL RELATIONSHIP CHECKS VARY WITH GRAPH DEPTH</text>
  <text class="note" x="30" y="386">THE BOTTOM ROW IS THE ONE A BULK ENUMERATION CALL COLLAPSES; SINGLE-CHECK SPEED DOES NOT SAVE IT</text>
</svg>
