<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Sponsored and unsponsored agent topologies</title>
  <desc id="d">Two columns. On the left, sponsored agents: a licensed human user sits at the top with arrows down to three agents that act on that person's behalf and inherit that person's identity and permissions; these are covered by the per-user licence. On the right, unsponsored agents: a scheduled nightly job, a service-account agent in a data pipeline, a sub-agent spawned by another agent, and a partner's agent arriving over A2A. None of the four maps to a licensed human in the tenant, and a note records that fully autonomous agents of this kind sit in a separate Frontier preview priced per agent instance.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .dash   { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 5 5; opacity: .55; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); opacity: .7; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="24" y="34">Sponsored — what the licence describes</text>
  <rect class="hero" x="24" y="54" width="382" height="58" rx="8" />
  <text class="label-inv" x="44" y="80">Licensed human user</text>
  <text class="label-inv" x="44" y="100" opacity=".9">$15 / month · owns, sponsors, is served by</text>

  <path class="arrow" d="M 90 112 L 90 154" />
  <path class="arrow" d="M 215 112 L 215 154" />
  <path class="arrow" d="M 340 112 L 340 154" />

  <rect class="adj" x="24" y="156" width="118" height="72" rx="8" />
  <text class="label" x="40" y="184">Copilot</text>
  <text class="sub" x="40" y="204">in Teams</text>

  <rect class="adj" x="156" y="156" width="118" height="72" rx="8" />
  <text class="label" x="172" y="184">Custom</text>
  <text class="sub" x="172" y="204">workflow agent</text>

  <rect class="adj" x="288" y="156" width="118" height="72" rx="8" />
  <text class="label" x="304" y="184">Store</text>
  <text class="sub" x="304" y="204">agent</text>

  <rect class="dash" x="24" y="248" width="382" height="86" rx="8" />
  <text class="label" x="44" y="278">Inherits one identity, one permission set,</text>
  <text class="label" x="44" y="300">one accountable person</text>
  <text class="tag" x="44" y="322">COVERED BY THE PER-USER LICENCE</text>

  <line x1="450" y1="24" x2="450" y2="470" stroke="var(--ink)" stroke-width="1" opacity=".2" />

  <text class="head" x="494" y="34">Unsponsored — where the questions are</text>

  <rect class="box" x="494" y="54" width="382" height="60" rx="8" />
  <text class="label" x="514" y="80">Scheduled nightly reconciliation</text>
  <text class="sub" x="514" y="100">runs at 02:00 with nobody watching</text>

  <rect class="box" x="494" y="124" width="382" height="60" rx="8" />
  <text class="label" x="514" y="150">Service-account agent in a pipeline</text>
  <text class="sub" x="514" y="170">deployed eighteen months ago by someone who left</text>

  <rect class="box" x="494" y="194" width="382" height="60" rx="8" />
  <text class="label" x="514" y="220">Sub-agent spawned by another agent</text>
  <text class="sub" x="514" y="240">principals multiply, seats do not</text>

  <rect class="box" x="494" y="264" width="382" height="60" rx="8" />
  <text class="label" x="514" y="290">Partner agent arriving over A2A</text>
  <text class="sub" x="514" y="310">has a human somewhere — not one of yours</text>

  <rect class="dash" x="494" y="348" width="382" height="86" rx="8" />
  <text class="label" x="514" y="378">No licensed human to hang the licence on</text>
  <text class="sub" x="514" y="400">Frontier preview, priced per agent instance, GA pricing unannounced</text>
  <text class="tag" x="514" y="422">THE METER THAT WILL SCALE WITH YOUR FLEET</text>
</svg>
