<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What the licence covers, what it does not, and what to put in place</title>
  <desc id="d">Three columns. Covered by the per-user licence: agents with a human sponsor, a tenant-wide inventory, permissions review, and one-click blocking on Intune-enrolled Windows devices. Not covered: unattended and service-account agents, unenrolled devices, the tenant permissions an approved agent inherits, and any price signal on fleet growth. What to put in place: an owner and an expiry on every agent, device-enrolment coverage published beside the agent count, a budget line for per-agent-instance pricing, and a permissions review that runs against the tenant rather than the agent.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
  </style>

  <rect class="box" x="24" y="36" width="266" height="228" />
  <text class="head" x="44" y="66">What $15 buys</text>
  <text class="sub" x="44" y="100">agents with a human sponsor</text>
  <text class="sub" x="44" y="124">tenant-wide inventory</text>
  <text class="sub" x="44" y="148">permissions visibility</text>
  <text class="sub" x="44" y="172">block, on enrolled Windows</text>
  <line x1="44" y1="196" x2="270" y2="196" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="44" y="220">WORTH THE SEAT PRICE</text>
  <text class="label" x="44" y="248">a registry you would not build</text>

  <rect class="adj" x="314" y="36" width="266" height="228" />
  <text class="head" x="334" y="66">What it leaves</text>
  <text class="sub" x="334" y="100">unattended and service agents</text>
  <text class="sub" x="334" y="124">every unenrolled device</text>
  <text class="sub" x="334" y="148">inherited tenant permissions</text>
  <text class="sub" x="334" y="172">any signal on fleet growth</text>
  <line x1="334" y1="196" x2="560" y2="196" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="334" y="220">STILL YOUR PROBLEM</text>
  <text class="label" x="334" y="248">and where the audit lands</text>

  <rect class="hero" x="604" y="36" width="266" height="228" />
  <text class="head-inv" x="624" y="66">What to put in place</text>
  <text class="sub-inv" x="624" y="100">owner + expiry on every agent</text>
  <text class="sub-inv" x="624" y="124">enrolment % beside the count</text>
  <text class="sub-inv" x="624" y="148">per-instance budget line</text>
  <text class="sub-inv" x="624" y="172">review the tenant, not the agent</text>
  <line x1="624" y1="196" x2="850" y2="196" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag" x="624" y="220" fill="var(--paper)" opacity=".85">FOUR WEEKS OF WORK</text>
  <text class="label-inv" x="624" y="248">none of it is bought</text>
</svg>
