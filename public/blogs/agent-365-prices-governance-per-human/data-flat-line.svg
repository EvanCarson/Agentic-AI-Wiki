<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Governance invoice against fleet size</title>
  <desc id="d">Chart for a hypothetical 500-seat organisation licensed for Agent 365 at fifteen dollars per user per month. Four bars of identical length show the same monthly governance invoice of seven thousand five hundred dollars at fifty, five hundred, two thousand and five thousand agents. The implied governance cost per agent falls from one hundred and fifty dollars to one dollar fifty across the same range. A note records that inference, tool-call and identity costs all rise with the agent count while the governance invoice does not move.</desc>
  <style>
    .grid   { stroke: var(--ink); stroke-width: 1; opacity: .12; stroke-dasharray: 3 4; }
    .axis   { stroke: var(--ink); stroke-width: 1.25; opacity: .5; }
    .bar    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .barC   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .title  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .value  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="title" x="24" y="34">Monthly governance invoice, 500-seat tenant</text>
  <text class="sub" x="24" y="56">Agent 365 at $15 per user per month. The fleet size never enters the calculation.</text>

  <line class="grid" x1="300" y1="76" x2="300" y2="330" />
  <line class="grid" x1="410" y1="76" x2="410" y2="330" />
  <line class="grid" x1="520" y1="76" x2="520" y2="330" />
  <line class="axis" x1="190" y1="76" x2="190" y2="330" />

  <text class="label" x="24" y="112">50 agents</text>
  <rect class="bar" x="190" y="86" width="430" height="42" rx="4" />
  <text class="value" x="634" y="114">$7,500</text>
  <text class="tag" x="726" y="114">$150.00 each</text>

  <text class="label" x="24" y="180">500 agents</text>
  <rect class="bar" x="190" y="154" width="430" height="42" rx="4" />
  <text class="value" x="634" y="182">$7,500</text>
  <text class="tag" x="726" y="182">$15.00 each</text>

  <text class="label" x="24" y="248">2,000 agents</text>
  <rect class="bar" x="190" y="222" width="430" height="42" rx="4" />
  <text class="value" x="634" y="250">$7,500</text>
  <text class="tag" x="726" y="250">$3.75 each</text>

  <text class="label" x="24" y="316">5,000 agents</text>
  <rect class="barC" x="190" y="290" width="430" height="42" rx="4" />
  <text class="value" x="634" y="318">$7,500</text>
  <text class="tag" x="726" y="318">$1.50 each</text>

  <text class="sub" x="24" y="366">Inference, tool calls, sandboxes and identity all bill against the left-hand column.</text>
  <text class="sub" x="24" y="386">Governance is the only layer whose invoice does not move when the fleet does.</text>
</svg>
