<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmt fmd">
  <title id="fmt">Code search backends compared on three axes</title>
  <desc id="fmd">A four by three matrix. ripgrep: literal and regex queries, no index, permissive licence. ast-grep: syntax-tree patterns, no index, permissive licence. Zoekt: ranked trigram queries, a persistent index, permissive licence. Semgrep CE: semantic rules, no index, and a split licence whose rules are restricted to internal business use. Legend: permissive, conditional, restricted.</desc>
  <style>
    .fm-ok  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .fm-mid { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .fm-no  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .fm-ttl { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .fm-col { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .fm-row { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .fm-cel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .fm-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .fm-leg { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
  </style>

  <text class="fm-ttl" x="20" y="34">What each backend answers, and what you may ship</text>

  <text class="fm-col" x="330" y="74" text-anchor="middle">What it can match</text>
  <text class="fm-col" x="550" y="74" text-anchor="middle">Needs an index</text>
  <text class="fm-col" x="770" y="74" text-anchor="middle">Licence to ship on</text>

  <text class="fm-row" x="20" y="117">ripgrep</text>
  <rect class="fm-no" x="230" y="90" width="200" height="44" />
  <text class="fm-cel" x="330" y="117" text-anchor="middle">Literal and regex</text>
  <rect class="fm-no" x="450" y="90" width="200" height="44" />
  <text class="fm-cel" x="550" y="117" text-anchor="middle">No</text>
  <rect class="fm-ok" x="670" y="90" width="200" height="44" />
  <text class="fm-inv" x="770" y="117" text-anchor="middle">Permissive</text>

  <text class="fm-row" x="20" y="181">ast-grep</text>
  <rect class="fm-mid" x="230" y="154" width="200" height="44" />
  <text class="fm-cel" x="330" y="181" text-anchor="middle">Syntax-tree patterns</text>
  <rect class="fm-no" x="450" y="154" width="200" height="44" />
  <text class="fm-cel" x="550" y="181" text-anchor="middle">No</text>
  <rect class="fm-ok" x="670" y="154" width="200" height="44" />
  <text class="fm-inv" x="770" y="181" text-anchor="middle">Permissive (MIT)</text>

  <text class="fm-row" x="20" y="245">Zoekt</text>
  <rect class="fm-mid" x="230" y="218" width="200" height="44" />
  <text class="fm-cel" x="330" y="245" text-anchor="middle">Ranked, many repos</text>
  <rect class="fm-mid" x="450" y="218" width="200" height="44" />
  <text class="fm-cel" x="550" y="245" text-anchor="middle">Yes, trigram</text>
  <rect class="fm-ok" x="670" y="218" width="200" height="44" />
  <text class="fm-inv" x="770" y="245" text-anchor="middle">Permissive (Apache-2.0)</text>

  <text class="fm-row" x="20" y="309">Semgrep CE</text>
  <rect class="fm-ok" x="230" y="282" width="200" height="44" />
  <text class="fm-inv" x="330" y="309" text-anchor="middle">Semantic rules</text>
  <rect class="fm-no" x="450" y="282" width="200" height="44" />
  <text class="fm-cel" x="550" y="309" text-anchor="middle">No</text>
  <rect class="fm-no" x="670" y="282" width="200" height="44" />
  <text class="fm-cel" x="770" y="309" text-anchor="middle">Split: rules restricted</text>

  <rect class="fm-ok" x="20" y="358" width="18" height="14" />
  <text class="fm-leg" x="48" y="370">Strongest on this axis</text>
  <rect class="fm-mid" x="260" y="358" width="18" height="14" />
  <text class="fm-leg" x="288" y="370">Partial</text>
  <rect class="fm-no" x="430" y="358" width="18" height="14" />
  <text class="fm-leg" x="458" y="370">Weakest or absent</text>
</svg>
