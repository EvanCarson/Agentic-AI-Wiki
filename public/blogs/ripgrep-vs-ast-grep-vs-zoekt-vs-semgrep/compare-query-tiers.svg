<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="qtt qtd">
  <title id="qtt">The question each search tier can answer exactly</title>
  <desc id="qtd">Four bands. ripgrep answers where a given string appears. ast-grep answers where a shape of code appears, independent of names and whitespace. Zoekt answers which of many repositories mentions a symbol, ranked. Semgrep answers whether a dangerous pattern reaches a sink. The two middle and last tiers shade toward higher cost; only Zoekt keeps a persistent index.</desc>
  <style>
    .qt-a   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .qt-b   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .qt-c   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .qt-ttl { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .qt-row { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .qt-cel { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .qt-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .qt-leg { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
  </style>

  <text class="qt-ttl" x="20" y="32">One question per tier, answered exactly</text>

  <text class="qt-row" x="20" y="94">ripgrep</text>
  <rect class="qt-a" x="220" y="58" width="660" height="58" />
  <text class="qt-cel" x="550" y="94" text-anchor="middle">Where does this string appear?</text>

  <text class="qt-row" x="20" y="168">ast-grep</text>
  <rect class="qt-b" x="220" y="132" width="660" height="58" />
  <text class="qt-cel" x="550" y="168" text-anchor="middle">Where does this shape of code appear, whatever it is named?</text>

  <text class="qt-row" x="20" y="242">Zoekt</text>
  <rect class="qt-b" x="220" y="206" width="660" height="58" />
  <text class="qt-cel" x="550" y="242" text-anchor="middle">Which of these 4,000 repositories mentions it, best first?</text>

  <text class="qt-row" x="20" y="316">Semgrep CE</text>
  <rect class="qt-c" x="220" y="280" width="660" height="58" />
  <text class="qt-inv" x="550" y="316" text-anchor="middle">Does untrusted input reach this sink?</text>

  <rect class="qt-a" x="220" y="358" width="18" height="14" />
  <text class="qt-leg" x="248" y="370">No index, instant</text>
  <rect class="qt-b" x="430" y="358" width="18" height="14" />
  <text class="qt-leg" x="458" y="370">More setup</text>
  <rect class="qt-c" x="620" y="358" width="18" height="14" />
  <text class="qt-leg" x="648" y="370">Most expensive to run</text>
</svg>
