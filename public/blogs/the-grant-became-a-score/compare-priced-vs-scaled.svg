<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Billing unit and risk unit compared</title>
  <desc id="d">Two columns. The licence is counted per human seat and grows with headcount. The risk is carried per agent instance and grows with automation, so the agents left outside a seat — contractor machines, scheduled jobs — are the ones left unscored.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="20" y="28">What you buy, and what carries the risk.</text>

  <text class="lbl" x="20" y="96">Counted</text>
  <text class="lbl" x="20" y="206">Diverges</text>

  <rect class="adj" x="180" y="52" width="320" height="92" />
  <text class="hd" x="340" y="82">Per human seat</text>
  <text class="vd" x="340" y="108">one licence per person</text>
  <text class="vd" x="340" y="128">grows with headcount</text>

  <rect class="hero" x="530" y="52" width="320" height="92" />
  <text class="hd-inv" x="690" y="82">Per agent instance</text>
  <text class="vd-inv" x="690" y="108">one credential per agent</text>
  <text class="vd-inv" x="690" y="128">grows with automation</text>

  <rect class="box" x="180" y="162" width="320" height="96" />
  <text class="vd" x="340" y="196">8 seats paid for</text>
  <text class="vd" x="340" y="218">by a team of 8</text>

  <rect class="adj" x="530" y="162" width="320" height="96" />
  <text class="vd" x="690" y="196">200 scheduled agents</text>
  <text class="vd" x="690" y="218">needing 200 scores</text>
</svg>
