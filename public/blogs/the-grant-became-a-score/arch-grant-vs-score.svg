<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Standing grant and risk score as authorization paths</title>
  <desc id="d">Two paths side by side. A standing grant is a row in a directory, readable before the action, giving the same answer on any day, so a review is a lookup. A risk score is computed from identity, data, device, cloud, network and the agent's own actions, crosses a band threshold set elsewhere, and returns different answers to the same request thirty minutes apart.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .split  { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 4 5; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="28">Declared authority and computed authority.</text>
  <path class="split" d="M 455 46 L 455 382" />

  <rect class="adj" x="100" y="52" width="300" height="46" />
  <text class="hd" x="250" y="81">Standing grant</text>
  <path class="arrow" d="M 250 98 L 250 124" />

  <rect class="box" x="100" y="128" width="300" height="62" />
  <text class="vd" x="250" y="154">a row in a directory</text>
  <text class="vd" x="250" y="176">readable before the act</text>
  <path class="arrow" d="M 250 190 L 250 214" />

  <rect class="box" x="100" y="218" width="300" height="62" />
  <text class="vd" x="250" y="244">same answer Tuesday</text>
  <text class="vd" x="250" y="266">as on Thursday</text>
  <path class="arrow" d="M 250 280 L 250 304" />

  <rect class="box" x="100" y="308" width="300" height="62" />
  <text class="vd" x="250" y="334">a review is a lookup</text>
  <text class="vd" x="250" y="356">evidence is durable</text>

  <rect class="hero" x="510" y="52" width="300" height="46" />
  <text class="hd-inv" x="660" y="81">Risk score</text>
  <path class="arrow" d="M 660 98 L 660 124" />

  <rect class="box" x="510" y="128" width="300" height="62" />
  <text class="vd" x="660" y="154">identity · data · device</text>
  <text class="vd" x="660" y="176">cloud · network · actions</text>
  <path class="arrow" d="M 660 190 L 660 214" />

  <rect class="adj" x="510" y="218" width="300" height="62" />
  <text class="vd" x="660" y="244">crosses a band</text>
  <text class="vd" x="660" y="266">threshold set elsewhere</text>
  <path class="arrow" d="M 660 280 L 660 304" />

  <rect class="box" x="510" y="308" width="300" height="62" />
  <text class="vd" x="660" y="334">14:05 write allowed</text>
  <text class="vd" x="660" y="356">14:35 write refused</text>

  <rect class="hero" x="100" y="404" width="710" height="56" />
  <text class="vd-inv" x="455" y="438">the deciding input is in none of: the request, the directory, your log</text>
</svg>
