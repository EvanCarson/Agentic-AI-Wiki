<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">What determines deployed agent capability, and what a pre-release gate can see</title>
  <desc id="d">Five inputs to deployed agent capability — model weights, tool access, harness and scaffold, iteration budget, and memory or accumulated context — rated on whether each is fixed at release, visible to a pre-release model review, and reshaped afterwards by third parties. Only the weights are fixed and fully visible; the other four are assembled after release by people the review never sees.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-head { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .mid    { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .weak   { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .cv     { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .cv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--paper, #fff); text-anchor: middle; }
    .legend { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; }
  </style>

  <text class="chart-title" x="450" y="26">The gate measures one row of five</text>

  <text class="col-head" x="380" y="58">Fixed at</text><text class="col-head" x="380" y="71">release</text>
  <text class="col-head" x="560" y="58">Visible to the</text><text class="col-head" x="560" y="71">pre-release gate</text>
  <text class="col-head" x="740" y="58">Reshaped later by</text><text class="col-head" x="740" y="71">third parties</text>

  <text class="row-head" x="24" y="113">Model weights</text>
  <rect class="strong" x="300" y="86" width="160" height="44" rx="5" /><text class="cv-inv" x="380" y="113">Yes</text>
  <rect class="strong" x="480" y="86" width="160" height="44" rx="5" /><text class="cv-inv" x="560" y="113">Fully</text>
  <rect class="weak" x="660" y="86" width="160" height="44" rx="5" /><text class="cv" x="740" y="113">Not if closed</text>

  <text class="row-head" x="24" y="167">Tool access</text>
  <rect class="weak" x="300" y="140" width="160" height="44" rx="5" /><text class="cv" x="380" y="167">No</text>
  <rect class="mid" x="480" y="140" width="160" height="44" rx="5" /><text class="cv" x="560" y="167">One configuration</text>
  <rect class="strong" x="660" y="140" width="160" height="44" rx="5" /><text class="cv-inv" x="740" y="167">Constantly</text>

  <text class="row-head" x="24" y="221">Harness &amp; scaffold</text>
  <rect class="weak" x="300" y="194" width="160" height="44" rx="5" /><text class="cv" x="380" y="221">No</text>
  <rect class="weak" x="480" y="194" width="160" height="44" rx="5" /><text class="cv" x="560" y="221">No</text>
  <rect class="strong" x="660" y="194" width="160" height="44" rx="5" /><text class="cv-inv" x="740" y="221">Constantly</text>

  <text class="row-head" x="24" y="275">Iteration budget</text>
  <rect class="weak" x="300" y="248" width="160" height="44" rx="5" /><text class="cv" x="380" y="275">No</text>
  <rect class="weak" x="480" y="248" width="160" height="44" rx="5" /><text class="cv" x="560" y="275">No</text>
  <rect class="strong" x="660" y="248" width="160" height="44" rx="5" /><text class="cv-inv" x="740" y="275">Set by the operator</text>

  <text class="row-head" x="24" y="329">Memory &amp; accrued context</text>
  <rect class="weak" x="300" y="302" width="160" height="44" rx="5" /><text class="cv" x="380" y="329">No</text>
  <rect class="weak" x="480" y="302" width="160" height="44" rx="5" /><text class="cv" x="560" y="329">No</text>
  <rect class="strong" x="660" y="302" width="160" height="44" rx="5" /><text class="cv-inv" x="740" y="329">Grows in use</text>
</svg>
