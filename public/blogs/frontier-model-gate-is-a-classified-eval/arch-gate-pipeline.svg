<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The frontier model review pipeline and its visibility line</title>
  <desc id="d">Four stages sit above a public visibility line: a developer voluntarily engages, a classified benchmarking process built by Treasury, the NSA and CISA measures advanced cyber capability, a threshold designates the model as a covered frontier model, and agencies get up to thirty days of pre-release access. Only the public release itself falls below the line. The methodology, the threshold, the score, the fact that a review occurred and the number of designations are all undisclosed.</desc>
  <style>
    .box     { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj     { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero    { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .band      { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .72; text-anchor: middle; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .88; text-anchor: middle; }
    .item      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); }
    .arrow     { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .cut       { stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 7 5; opacity: .55; }
    .note      { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .72; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="band" x="30" y="42">Above the line — nothing is disclosed</text>

  <rect class="box" x="30" y="66" width="190" height="82" rx="8" ry="8" />
  <text class="label" x="125" y="98">Voluntary engagement</text>
  <text class="sub" x="125" y="118">developer approaches</text>
  <text class="sub" x="125" y="134">the government</text>

  <path class="arrow" d="M 220 107 L 248 107" />

  <rect class="adj" x="250" y="66" width="190" height="82" rx="8" ry="8" />
  <text class="label" x="345" y="98">Classified benchmark</text>
  <text class="sub" x="345" y="118">Treasury · NSA · CISA</text>
  <text class="sub" x="345" y="134">advanced cyber capability</text>

  <path class="arrow" d="M 440 107 L 468 107" />

  <rect class="adj" x="470" y="66" width="190" height="82" rx="8" ry="8" />
  <text class="label" x="565" y="98">Threshold crossed?</text>
  <text class="sub" x="565" y="118">designated a</text>
  <text class="sub" x="565" y="134">“covered frontier model”</text>

  <path class="arrow" d="M 660 107 L 688 107" />

  <rect class="adj" x="690" y="66" width="180" height="82" rx="8" ry="8" />
  <text class="label" x="780" y="98">Pre-release access</text>
  <text class="sub" x="780" y="118">up to 30 days</text>
  <text class="sub" x="780" y="134">for agencies</text>

  <rect class="box" x="30" y="186" width="620" height="130" rx="8" ry="8" />
  <text class="label" x="340" y="212">Never published</text>
  <text class="item" x="58" y="240">· The benchmarking methodology — runs, scaffold, pass criteria</text>
  <text class="item" x="58" y="262">· The capability threshold, or even its units</text>
  <text class="item" x="58" y="284">· Any model’s score, or whether it was designated</text>
  <text class="item" x="58" y="306">· How many models have been reviewed, ever</text>

  <path class="arrow" d="M 780 148 L 780 348" />

  <line class="cut" x1="30" y1="368" x2="870" y2="368" />
  <text class="note" x="30" y="360">public visibility line</text>

  <text class="band" x="30" y="410">Below the line — all anyone outside can observe</text>

  <rect class="hero" x="690" y="392" width="180" height="72" rx="8" ry="8" />
  <text class="label-inv" x="780" y="422">Public release</text>
  <text class="sub-inv" x="780" y="442">the first observable event</text>

  <text class="note" x="30" y="452">A review, a designation and a thirty-day hold are</text>
  <text class="note" x="30" y="470">indistinguishable from an ordinary schedule slip.</text>
</svg>
