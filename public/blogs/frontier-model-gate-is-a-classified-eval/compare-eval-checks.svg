<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Which checks each kind of evaluation supports</title>
  <desc id="d">Six reader checks — inspecting the test items, screening for contamination, re-running to estimate variance, independent reproduction, seeing the score, and contesting the finding — compared across a public benchmark, an internal eval and the classified government gate. The public benchmark and the internal eval each support most checks; the classified gate supports none of them.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-head { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .mid    { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .weak   { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .cv     { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .cv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--paper, #fff); text-anchor: middle; }
  </style>

  <text class="chart-title" x="450" y="22">The checks are the same everywhere. Only one column cannot run them.</text>

  <text class="col-head" x="420" y="46">Public</text><text class="col-head" x="420" y="59">benchmark</text>
  <text class="col-head" x="590" y="46">Your internal</text><text class="col-head" x="590" y="59">eval</text>
  <text class="col-head" x="760" y="46">Classified</text><text class="col-head" x="760" y="59">gate</text>

  <text class="row-head" x="24" y="89">Inspect the test items</text>
  <rect class="strong" x="350" y="70" width="140" height="28" rx="5" /><text class="cv-inv" x="420" y="89">Yes</text>
  <rect class="strong" x="520" y="70" width="140" height="28" rx="5" /><text class="cv-inv" x="590" y="89">Yes</text>
  <rect class="weak" x="690" y="70" width="140" height="28" rx="5" /><text class="cv" x="760" y="89">No</text>

  <text class="row-head" x="24" y="123">Screen for contamination</text>
  <rect class="mid" x="350" y="104" width="140" height="28" rx="5" /><text class="cv" x="420" y="123">Partly</text>
  <rect class="strong" x="520" y="104" width="140" height="28" rx="5" /><text class="cv-inv" x="590" y="123">Yes</text>
  <rect class="weak" x="690" y="104" width="140" height="28" rx="5" /><text class="cv" x="760" y="123">No</text>

  <text class="row-head" x="24" y="157">Re-run to estimate variance</text>
  <rect class="strong" x="350" y="138" width="140" height="28" rx="5" /><text class="cv-inv" x="420" y="157">Yes</text>
  <rect class="strong" x="520" y="138" width="140" height="28" rx="5" /><text class="cv-inv" x="590" y="157">Yes</text>
  <rect class="weak" x="690" y="138" width="140" height="28" rx="5" /><text class="cv" x="760" y="157">No</text>

  <text class="row-head" x="24" y="191">Independent reproduction</text>
  <rect class="strong" x="350" y="172" width="140" height="28" rx="5" /><text class="cv-inv" x="420" y="191">Yes</text>
  <rect class="mid" x="520" y="172" width="140" height="28" rx="5" /><text class="cv" x="590" y="191">Only by you</text>
  <rect class="weak" x="690" y="172" width="140" height="28" rx="5" /><text class="cv" x="760" y="191">No</text>

  <text class="row-head" x="24" y="225">See the score</text>
  <rect class="strong" x="350" y="206" width="140" height="28" rx="5" /><text class="cv-inv" x="420" y="225">Yes</text>
  <rect class="strong" x="520" y="206" width="140" height="28" rx="5" /><text class="cv-inv" x="590" y="225">Yes</text>
  <rect class="weak" x="690" y="206" width="140" height="28" rx="5" /><text class="cv" x="760" y="225">No</text>

  <text class="row-head" x="24" y="259">Contest the finding</text>
  <rect class="mid" x="350" y="240" width="140" height="28" rx="5" /><text class="cv" x="420" y="259">In public</text>
  <rect class="strong" x="520" y="240" width="140" height="28" rx="5" /><text class="cv-inv" x="590" y="259">Yes</text>
  <rect class="weak" x="690" y="240" width="140" height="28" rx="5" /><text class="cv" x="760" y="259">No</text>

  <text class="cv" x="176" y="290" style="opacity:.7">A number whose method you cannot read is a claim, not a measurement.</text>
</svg>
