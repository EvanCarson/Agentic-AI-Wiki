<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="at ad">
  <title id="at">The two enforcement layers of the Open Agent Safety Platform</title>
  <desc id="ad">The agent process runs on the host CPU inside a container. OpenShell sits below the container on the same host, enforcing Landlock filesystem rules and seccomp syscall filters on the process. All network traffic leaves through a BlueField-4 DPU, where Sentry observes flows out of band in a trust domain the host cannot address, and can quarantine the agent. OpenShell ships under Apache-2.0; Sentry has no announced availability date.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .dash   { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 5 4; opacity: .75; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper); opacity: .85; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#ar1); }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="label" x="20" y="26">Two trust domains, one of them purchasable today</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <text class="cap" x="30" y="62">HOST — SAME TRUST DOMAIN AS THE AGENT</text>
  <rect class="dash" x="24" y="72" width="500" height="288" rx="10" />

  <rect class="box" x="52" y="96" width="200" height="66" rx="8" />
  <text class="label" x="72" y="126">Agent process</text>
  <text class="sub" x="72" y="145">model loop, tools, subagents</text>

  <rect class="box" x="288" y="96" width="200" height="66" rx="8" />
  <text class="label" x="308" y="126">Container</text>
  <text class="sub" x="308" y="145">namespaces, cgroups</text>

  <rect class="adj" x="52" y="200" width="436" height="80" rx="8" />
  <text class="label" x="72" y="228">OpenShell — Apache-2.0, Rust</text>
  <text class="sub" x="72" y="250">Landlock LSM filesystem rules + seccomp BPF syscall filter,</text>
  <text class="sub" x="72" y="266">declarative YAML, applied below the container, survives fork/exec</text>

  <rect class="box" x="52" y="300" width="436" height="42" rx="8" />
  <text class="label" x="72" y="327">Linux kernel</text>

  <path class="arrow" d="M 152 200 L 152 168" />
  <path class="arrow" d="M 388 200 L 388 168" />

  <text class="cap" x="596" y="62">DPU — DOMAIN THE HOST CANNOT ADDRESS</text>
  <rect class="dash" x="560" y="72" width="316" height="288" rx="10" />

  <rect class="hero" x="588" y="120" width="260" height="130" rx="8" />
  <text class="label-inv" x="608" y="150">Sentry</text>
  <text class="sub-inv" x="608" y="172">on BlueField-4, via DOCA</text>
  <text class="sub-inv" x="608" y="192">out-of-band behavioural watch</text>
  <text class="sub-inv" x="608" y="212">quarantine in milliseconds</text>
  <text class="sub-inv" x="608" y="232">no announced ship date</text>

  <rect class="box" x="588" y="278" width="260" height="60" rx="8" />
  <text class="label" x="608" y="304">Network / storage path</text>
  <text class="sub" x="608" y="324">every packet the agent sends</text>

  <path class="arrow" d="M 488 318 L 584 310" />
  <path class="arrow" d="M 718 278 L 718 254" />

  <line class="rule" x1="20" y1="392" x2="880" y2="392" />
  <text class="sub" x="20" y="418">Left box: mediates everything the agent does, shares a kernel and a host with it.</text>
  <text class="sub" x="20" y="440">Right box: cannot be reached from the agent, and can only name flows, volumes and destinations.</text>
  <text class="sub" x="20" y="462">The platform's strongest enforcement claim lives in the box with no availability date.</text>
</svg>
