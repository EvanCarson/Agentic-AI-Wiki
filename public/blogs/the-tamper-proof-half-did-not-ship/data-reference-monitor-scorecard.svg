<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="st sd">
  <title id="st">Five agent controls against Anderson's three reference-monitor properties, plus availability</title>
  <desc id="sd">A matrix scoring five controls — a system-prompt rule, an LLM screener, a harness allow-list, OpenShell, and Sentry — against complete mediation, tamper-proofness and verifiability, with a fourth column for whether it ships today. The prompt rule and the LLM screener score weakly throughout. The harness allow-list mediates and is verifiable but is reachable from the host. OpenShell scores strongly on all three and ships. Sentry is tamper-proof and verifiable but mediates only the network path and has no announced availability.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: none; }
    .medium { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .colhead{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .rowsub { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink); opacity: .6; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>

  <text class="title" x="20" y="26">Scoring the stack against a 1972 test</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <text class="colhead" x="380" y="62" text-anchor="middle">MEDIATES ALL</text>
  <text class="colhead" x="530" y="62" text-anchor="middle">TAMPER-PROOF</text>
  <text class="colhead" x="680" y="62" text-anchor="middle">VERIFIABLE</text>
  <text class="colhead" x="830" y="62" text-anchor="middle">SHIPS TODAY</text>

  <text class="row" x="20" y="92">Rule in the system prompt</text>
  <text class="rowsub" x="20" y="107">"do not delete files"</text>
  <rect class="weak" x="316" y="76" width="128" height="38" rx="4" />
  <text class="cell" x="380" y="100" text-anchor="middle">No</text>
  <rect class="weak" x="466" y="76" width="128" height="38" rx="4" />
  <text class="cell" x="530" y="100" text-anchor="middle">No</text>
  <rect class="weak" x="616" y="76" width="128" height="38" rx="4" />
  <text class="cell" x="680" y="100" text-anchor="middle">No</text>
  <rect class="medium" x="766" y="76" width="114" height="38" rx="4" />
  <text class="cell" x="823" y="100" text-anchor="middle">Yes</text>

  <text class="row" x="20" y="148">LLM screening the action</text>
  <text class="rowsub" x="20" y="163">a judge in front of the tool</text>
  <rect class="medium" x="316" y="132" width="128" height="38" rx="4" />
  <text class="cell" x="380" y="156" text-anchor="middle">Partly</text>
  <rect class="weak" x="466" y="132" width="128" height="38" rx="4" />
  <text class="cell" x="530" y="156" text-anchor="middle">No</text>
  <rect class="weak" x="616" y="132" width="128" height="38" rx="4" />
  <text class="cell" x="680" y="156" text-anchor="middle">No</text>
  <rect class="medium" x="766" y="132" width="114" height="38" rx="4" />
  <text class="cell" x="823" y="156" text-anchor="middle">Yes</text>

  <text class="row" x="20" y="204">Allow-list in the harness</text>
  <text class="rowsub" x="20" y="219">config the process can reach</text>
  <rect class="strong" x="316" y="188" width="128" height="38" rx="4" />
  <text class="cell-inv" x="380" y="212" text-anchor="middle">Yes</text>
  <rect class="medium" x="466" y="188" width="128" height="38" rx="4" />
  <text class="cell" x="530" y="212" text-anchor="middle">Partly</text>
  <rect class="strong" x="616" y="188" width="128" height="38" rx="4" />
  <text class="cell-inv" x="680" y="212" text-anchor="middle">Yes</text>
  <rect class="medium" x="766" y="188" width="114" height="38" rx="4" />
  <text class="cell" x="823" y="212" text-anchor="middle">Yes</text>

  <text class="row" x="20" y="260">OpenShell</text>
  <text class="rowsub" x="20" y="275">Landlock + seccomp, below the container</text>
  <rect class="strong" x="316" y="244" width="128" height="38" rx="4" />
  <text class="cell-inv" x="380" y="268" text-anchor="middle">Yes</text>
  <rect class="strong" x="466" y="244" width="128" height="38" rx="4" />
  <text class="cell-inv" x="530" y="268" text-anchor="middle">Yes, vs the agent</text>
  <rect class="strong" x="616" y="244" width="128" height="38" rx="4" />
  <text class="cell-inv" x="680" y="268" text-anchor="middle">Yes</text>
  <rect class="strong" x="766" y="244" width="114" height="38" rx="4" />
  <text class="cell-inv" x="823" y="268" text-anchor="middle">Yes</text>

  <text class="row" x="20" y="316">Sentry</text>
  <text class="rowsub" x="20" y="331">BlueField-4 watchdog, out of band</text>
  <rect class="medium" x="316" y="300" width="128" height="38" rx="4" />
  <text class="cell" x="380" y="324" text-anchor="middle">Network only</text>
  <rect class="strong" x="466" y="300" width="128" height="38" rx="4" />
  <text class="cell-inv" x="530" y="324" text-anchor="middle">Yes, vs the host</text>
  <rect class="strong" x="616" y="300" width="128" height="38" rx="4" />
  <text class="cell-inv" x="680" y="324" text-anchor="middle">Yes</text>
  <rect class="weak" x="766" y="300" width="114" height="38" rx="4" />
  <text class="cell" x="823" y="324" text-anchor="middle">No date</text>

  <line class="rule" x1="20" y1="352" x2="880" y2="352" />
  <rect class="strong" x="20" y="368" width="14" height="14" rx="2" />
  <text class="sub" x="42" y="380">Property satisfied</text>
  <rect class="medium" x="190" y="368" width="14" height="14" rx="2" />
  <text class="sub" x="212" y="380">Partially, or only for part of the surface</text>
  <rect class="weak" x="470" y="368" width="14" height="14" rx="2" />
  <text class="sub" x="492" y="380">Not satisfied</text>
</svg>
