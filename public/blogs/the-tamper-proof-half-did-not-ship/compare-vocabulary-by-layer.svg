<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="vt vd">
  <title id="vt">What each enforcement layer can name</title>
  <desc id="vd">Three columns showing the vocabulary available at each layer. A check inside the tool wrapper knows the user, task, plan and argument values but is defeated by any code execution. A kernel policy knows paths, syscalls and sockets and is defeated only by a kernel bug. A DPU watchdog knows flows, destinations, byte volumes and timing, and is defeated only by firmware. Enforcement strength rises left to right while descriptive power falls.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .item   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .item-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>

  <text class="head" x="20" y="26">Enforcement strength rises left to right. Vocabulary shrinks.</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <rect class="box" x="30" y="58" width="260" height="184" rx="8" />
  <text class="cap" x="46" y="80">IN THE TOOL WRAPPER</text>
  <text class="head" x="46" y="104">Knows everything</text>
  <text class="item" x="46" y="130">the user and the tenant</text>
  <text class="item" x="46" y="150">the task and the plan</text>
  <text class="item" x="46" y="170">argument values, in full</text>
  <text class="item" x="46" y="190">why the call was made</text>
  <text class="item" x="46" y="222">Defeated by: any code execution</text>

  <rect class="adj" x="320" y="58" width="260" height="184" rx="8" />
  <text class="cap" x="336" y="80">KERNEL POLICY — OPENSHELL</text>
  <text class="head" x="336" y="104">Knows the operation</text>
  <text class="item" x="336" y="130">filesystem paths, read/write</text>
  <text class="item" x="336" y="150">syscall numbers</text>
  <text class="item" x="336" y="170">sockets, namespaces, ptrace</text>
  <text class="item" x="336" y="190">the process tree</text>
  <text class="item" x="336" y="222">Defeated by: a kernel bug</text>

  <rect class="hero" x="610" y="58" width="260" height="184" rx="8" />
  <text class="cap" x="626" y="80" fill="var(--paper)" opacity=".7">DPU WATCHDOG — SENTRY</text>
  <text class="head-inv" x="626" y="104">Knows the shape</text>
  <text class="item-inv" x="626" y="130">destinations and flows</text>
  <text class="item-inv" x="626" y="150">byte volumes, per peer</text>
  <text class="item-inv" x="626" y="170">timing and periodicity</text>
  <text class="item-inv" x="626" y="190">storage and DMA traffic</text>
  <text class="item-inv" x="626" y="222">Defeated by: firmware</text>

  <text class="cap" x="30" y="274">Write the invariant in the rightmost vocabulary that still distinguishes the outcomes you care about.</text>
</svg>
