<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Out-of-the-box politeness defaults</title>
  <desc id="d">A matrix of five crawlers against four politeness defaults: whether robots.txt is obeyed, whether the crawler identifies itself, whether there is a per-origin concurrency cap, and whether requests to the target are rate-limited. Scrapy's project template is the only row with strong values; the four LLM-era tools default to off on nearly everything.</desc>
  <style>
    .s0   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .s1   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .s2   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .col  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .8; text-anchor: middle; }
    .row  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .cinv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .key  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="ttl" x="20" y="28">What each tool does if you change nothing</text>

  <text class="col" x="275" y="58">Obeys robots.txt</text>
  <text class="col" x="445" y="58">Identifies itself</text>
  <text class="col" x="615" y="58">Per-origin cap</text>
  <text class="col" x="785" y="58">Throttles the target</text>

  <text class="row" x="20" y="96">Firecrawl</text>
  <rect class="s1" x="195" y="74" width="160" height="34" />
  <text class="cell" x="275" y="96">Crawl yes, scrape no</text>
  <rect class="s0" x="365" y="74" width="160" height="34" />
  <text class="cell" x="445" y="96">No bot UA found</text>
  <rect class="s0" x="535" y="74" width="160" height="34" />
  <text class="cell" x="615" y="96">No</text>
  <rect class="s1" x="705" y="74" width="160" height="34" />
  <text class="cell" x="785" y="96">Opt-in delay</text>

  <text class="row" x="20" y="148">Crawl4AI</text>
  <rect class="s0" x="195" y="126" width="160" height="34" />
  <text class="cell" x="275" y="148">No</text>
  <rect class="s0" x="365" y="126" width="160" height="34" />
  <text class="cell" x="445" y="148">Spoofed Chrome 116</text>
  <rect class="s0" x="535" y="126" width="160" height="34" />
  <text class="cell" x="615" y="148">No, global only</text>
  <rect class="s0" x="705" y="126" width="160" height="34" />
  <text class="cell" x="785" y="148">No</text>

  <text class="row" x="20" y="200">ScrapeGraphAI</text>
  <rect class="s0" x="195" y="178" width="160" height="34" />
  <text class="cell" x="275" y="200">No, node unwired</text>
  <rect class="s0" x="365" y="178" width="160" height="34" />
  <text class="cell" x="445" y="200">Stealth patches on</text>
  <rect class="s0" x="535" y="178" width="160" height="34" />
  <text class="cell" x="615" y="200">No</text>
  <rect class="s0" x="705" y="178" width="160" height="34" />
  <text class="cell" x="785" y="200">No</text>

  <text class="row" x="20" y="252">Spider</text>
  <rect class="s0" x="195" y="230" width="160" height="34" />
  <text class="cell" x="275" y="252">No</text>
  <rect class="s0" x="365" y="230" width="160" height="34" />
  <text class="cell" x="445" y="252">Spoofed browser UA</text>
  <rect class="s0" x="535" y="230" width="160" height="34" />
  <text class="cell" x="615" y="252">No, 20&#8211;30 global</text>
  <rect class="s0" x="705" y="230" width="160" height="34" />
  <text class="cell" x="785" y="252">No, delay 0</text>

  <text class="row" x="20" y="304">Scrapy template</text>
  <rect class="s2" x="195" y="282" width="160" height="34" />
  <text class="cinv" x="275" y="304">Yes</text>
  <rect class="s2" x="365" y="282" width="160" height="34" />
  <text class="cinv" x="445" y="304">Yes, with a URL</text>
  <rect class="s2" x="535" y="282" width="160" height="34" />
  <text class="cinv" x="615" y="304">Yes, 8 per domain</text>
  <rect class="s1" x="705" y="282" width="160" height="34" />
  <text class="cell" x="785" y="304">Opt-in autothrottle</text>

  <rect class="s2" x="20" y="340" width="16" height="14" />
  <text class="key" x="44" y="352">on by default</text>
  <rect class="s1" x="170" y="340" width="16" height="14" />
  <text class="key" x="194" y="352">partial or opt-in</text>
  <rect class="s0" x="330" y="340" width="16" height="14" />
  <text class="key" x="354" y="352">off by default</text>
  <text class="key" x="20" y="378">The 15-year-old incumbent is the only row a site operator would recognise as a well-behaved client.</text>
</svg>
