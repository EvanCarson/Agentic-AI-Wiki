<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">The sidebar label against the licence file</title>
  <desc id="d">Four columns comparing what GitHub's licence label says with what the LICENSE file in each repository actually contains. Firecrawl is AGPL for the server with MIT SDKs, Crawl4AI's Apache-2.0 carries a mandatory attribution rider, and ScrapeGraphAI and Spider are clean MIT.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); text-anchor: middle; }
    .hdi    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--paper); text-anchor: middle; }
    .ln     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .78; text-anchor: middle; }
    .lni    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .88; text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .tag    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; text-anchor: middle; }
  </style>

  <text class="ttl" x="20" y="28">What the label says, and what the file says</text>

  <rect class="hero" x="25" y="52" width="195" height="186" />
  <text class="hdi" x="122" y="82">Firecrawl</text>
  <text class="lni" x="122" y="108">Label: AGPL-3.0</text>
  <text class="lni" x="122" y="134">Server AGPL, SDKs MIT,</text>
  <text class="lni" x="122" y="150">best engine not in</text>
  <text class="lni" x="122" y="166">the repository at all</text>
  <text class="lni" x="122" y="206">Network copyleft</text>
  <text class="lni" x="122" y="224">plus open core</text>

  <rect class="adj" x="243" y="52" width="195" height="186" />
  <text class="hd" x="340" y="82">Crawl4AI</text>
  <text class="ln" x="340" y="108">Label: Apache-2.0</text>
  <text class="ln" x="340" y="134">Apache text plus a</text>
  <text class="ln" x="340" y="150">mandatory attribution</text>
  <text class="ln" x="340" y="166">rider the label omits</text>
  <text class="ln" x="340" y="206">Permissive, with</text>
  <text class="ln" x="340" y="224">a condition</text>

  <rect class="box" x="461" y="52" width="195" height="186" />
  <text class="hd" x="558" y="82">ScrapeGraphAI</text>
  <text class="ln" x="558" y="108">Label: MIT</text>
  <text class="ln" x="558" y="134">Unmodified MIT text,</text>
  <text class="ln" x="558" y="150">one licence file in</text>
  <text class="ln" x="558" y="166">the whole tree</text>
  <text class="ln" x="558" y="206">Label and file</text>
  <text class="ln" x="558" y="224">agree</text>

  <rect class="box" x="679" y="52" width="195" height="186" />
  <text class="hd" x="776" y="82">Spider</text>
  <text class="ln" x="776" y="108">Label: MIT</text>
  <text class="ln" x="776" y="134">Unmodified MIT, every</text>
  <text class="ln" x="776" y="150">crate symlinked to the</text>
  <text class="ln" x="776" y="166">same file</text>
  <text class="ln" x="776" y="206">Label and file</text>
  <text class="ln" x="776" y="224">agree</text>

  <text class="tag" x="450" y="272">Two of the four need the file read; two do not. The label alone decides nothing.</text>
</svg>
