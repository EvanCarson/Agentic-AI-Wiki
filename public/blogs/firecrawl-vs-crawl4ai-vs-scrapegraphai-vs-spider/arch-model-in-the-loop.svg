<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where the language model sits in a crawl</title>
  <desc id="d">Two pipelines compared. In the markdown path, the crawler fetches and converts pages deterministically and a model is called once per task downstream. In the per-page extraction path, a model is called for every page, which makes cost scale with pages crawled and makes the output non-reproducible.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); text-anchor: middle; }
    .hdi   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--paper); text-anchor: middle; }
    .ln    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .lni   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; text-anchor: middle; }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lane  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .tag   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="28">One model call per task, or one per page</text>

  <text class="lane" x="20" y="62">Markdown pipeline</text>
  <text class="tag" x="20" y="80">Firecrawl, Crawl4AI, Spider</text>

  <rect class="box" x="20" y="96" width="170" height="78" />
  <text class="hd" x="105" y="130">Fetch and render</text>
  <text class="ln" x="105" y="152">deterministic</text>

  <rect class="box" x="214" y="96" width="170" height="78" />
  <text class="hd" x="299" y="130">HTML to markdown</text>
  <text class="ln" x="299" y="152">deterministic</text>

  <rect class="box" x="408" y="96" width="170" height="78" />
  <text class="hd" x="493" y="130">Your store</text>
  <text class="ln" x="493" y="152">re-readable, diffable</text>

  <rect class="adj" x="602" y="96" width="170" height="78" />
  <text class="hd" x="687" y="130">Model, once</text>
  <text class="ln" x="687" y="152">per question asked</text>

  <path class="arrow" d="M 196 135 L 208 135" />
  <path class="arrow" d="M 390 135 L 402 135" />
  <path class="arrow" d="M 584 135 L 596 135" />

  <text class="tag" x="20" y="206">Cost scales with questions. Re-running the crawl gives byte-identical output.</text>

  <text class="lane" x="20" y="268">Per-page extraction pipeline</text>
  <text class="tag" x="20" y="286">ScrapeGraphAI</text>

  <rect class="box" x="20" y="302" width="170" height="78" />
  <text class="hd" x="105" y="336">Fetch and render</text>
  <text class="ln" x="105" y="358">deterministic</text>

  <rect class="hero" x="214" y="302" width="170" height="78" />
  <text class="hdi" x="299" y="330">Model, every page</text>
  <text class="lni" x="299" y="350">prompt in,</text>
  <text class="lni" x="299" y="366">JSON out</text>

  <rect class="box" x="408" y="302" width="170" height="78" />
  <text class="hd" x="493" y="336">Structured rows</text>
  <text class="ln" x="493" y="358">schema-validated</text>

  <rect class="box" x="602" y="302" width="170" height="78" />
  <text class="hd" x="687" y="336">Your store</text>
  <text class="ln" x="687" y="358">no page to re-read</text>

  <path class="arrow" d="M 196 341 L 208 341" />
  <path class="arrow" d="M 390 341 L 402 341" />
  <path class="arrow" d="M 584 341 L 596 341" />

  <text class="tag" x="20" y="412">Cost scales with pages. A re-crawl can disagree with the last one, and the source text was not kept.</text>
  <text class="tag" x="20" y="452">The first shape lets you change your mind about the schema later. The second decides it at crawl time.</text>
  <text class="tag" x="20" y="476">Neither is wrong; they bill differently and fail differently.</text>
</svg>
