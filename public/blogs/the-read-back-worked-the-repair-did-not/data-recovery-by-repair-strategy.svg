<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="rt rd">
  <title id="rt">Recovery rate from 347 initially wrong captures</title>
  <desc id="rd">Four repair configurations measured over the same 347 captures that started out wrong. With no repair step the agent ends up with the right value 10 percent of the time. Spelling alone reaches 24 percent, read-back alone 26 percent, and read-back combined with spelling 35 percent. Even the best configuration leaves roughly two thirds of wrong captures wrong.</desc>
  <style>
    .rr-bar-hi  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .rr-bar-mid { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .rr-bar-lo  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .rr-ttl     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .rr-row     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .rr-val     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .rr-tick    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .rr-sub     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .rr-grid    { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 4; }
    .rr-axis    { stroke: var(--ink); stroke-width: 1; opacity: .45; }
  </style>

  <text class="rr-ttl" x="20" y="30">Share of 347 wrong captures that end up correct</text>

  <line class="rr-grid" x1="430" y1="56" x2="430" y2="306" />
  <line class="rr-grid" x1="560" y1="56" x2="560" y2="306" />
  <line class="rr-grid" x1="690" y1="56" x2="690" y2="306" />
  <line class="rr-grid" x1="820" y1="56" x2="820" y2="306" />
  <line class="rr-axis" x1="300" y1="56" x2="300" y2="306" />

  <text class="rr-row" x="20" y="90">No repair step</text>
  <rect class="rr-bar-lo" x="300" y="68" width="130" height="34" />
  <text class="rr-val" x="444" y="90">10%</text>

  <text class="rr-row" x="20" y="160">Spelling only</text>
  <rect class="rr-bar-mid" x="300" y="138" width="312" height="34" />
  <text class="rr-val" x="626" y="160">24%</text>

  <text class="rr-row" x="20" y="230">Read-back only</text>
  <rect class="rr-bar-mid" x="300" y="208" width="338" height="34" />
  <text class="rr-val" x="652" y="230">26%</text>

  <text class="rr-row" x="20" y="300">Read-back and spelling</text>
  <rect class="rr-bar-hi" x="300" y="278" width="455" height="34" />
  <text class="rr-val" x="769" y="300">35%</text>

  <text class="rr-tick" x="300" y="330" text-anchor="middle">0%</text>
  <text class="rr-tick" x="430" y="330" text-anchor="middle">10%</text>
  <text class="rr-tick" x="560" y="330" text-anchor="middle">20%</text>
  <text class="rr-tick" x="690" y="330" text-anchor="middle">30%</text>
  <text class="rr-tick" x="820" y="330" text-anchor="middle">40%</text>

  <text class="rr-sub" x="20" y="370">The best configuration still leaves about two thirds of wrong captures wrong.</text>
</svg>
