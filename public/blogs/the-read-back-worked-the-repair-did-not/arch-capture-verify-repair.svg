<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="ct cd">
  <title id="ct">Where a spoken value is lost between capture and the database</title>
  <desc id="cd">The same agent and the same task score differently by channel. In text the matched agent passes all two hundred tasks. In voice the work splits into three stages: capture, verification by read-back, and repair. Capture is where the value first goes wrong, verification detects many of those errors, and repair fixes only a quarter to a third of the ones it detected, which is where the score is lost.</desc>
  <style>
    .cb-box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .cb-hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .cb-adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .cb-lab   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .cb-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cb-sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .72; }
    .cb-mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); opacity: .8; }
    .cb-arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#carr); }
  </style>
  <defs>
    <marker id="carr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="cb-hero" x="250" y="40" width="400" height="50" />
  <text class="cb-inv" x="450" y="71" text-anchor="middle">Text channel, matched agent: 200 / 200</text>

  <rect class="cb-adj" x="250" y="130" width="400" height="50" />
  <text class="cb-lab" x="450" y="161" text-anchor="middle">Voice channel, same task set</text>

  <path class="cb-arrow" d="M 450 90 L 450 126" />
  <path class="cb-arrow" d="M 450 180 L 450 210 L 170 210 L 170 236" />

  <rect class="cb-box" x="60" y="240" width="220" height="70" />
  <text class="cb-lab" x="170" y="282" text-anchor="middle">Capture</text>
  <rect class="cb-box" x="340" y="240" width="220" height="70" />
  <text class="cb-lab" x="450" y="282" text-anchor="middle">Verify by read-back</text>
  <rect class="cb-box" x="620" y="240" width="220" height="70" />
  <text class="cb-lab" x="730" y="282" text-anchor="middle">Repair</text>

  <path class="cb-arrow" d="M 280 275 L 336 275" />
  <path class="cb-arrow" d="M 560 275 L 616 275" />

  <text class="cb-sub" x="170" y="344" text-anchor="middle">347 of the captures start wrong</text>
  <text class="cb-sub" x="450" y="344" text-anchor="middle">most wrong values are detected</text>
  <text class="cb-sub" x="730" y="344" text-anchor="middle">24-37% of detected errors fixed</text>

  <text class="cb-mono" x="170" y="372" text-anchor="middle">transcription quality</text>
  <text class="cb-mono" x="450" y="372" text-anchor="middle">detection</text>
  <text class="cb-mono" x="730" y="372" text-anchor="middle">the binding constraint</text>

  <rect class="cb-box" x="250" y="410" width="400" height="50" />
  <text class="cb-lab" x="450" y="441" text-anchor="middle">robust Pass^3: 0.14 to 0.41</text>

  <path class="cb-arrow" d="M 840 275 L 872 275 L 872 390 L 450 390 L 450 406" />
</svg>
