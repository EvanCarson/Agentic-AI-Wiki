<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmt fmd">
  <title id="fmt">Agent memory layers across four axes</title>
  <desc id="fmd">A four-by-four matrix rating Mem0, Graphiti, Letta and Cognee on self-host completeness, built-in scope enforcement, benchmark transparency and portability of what you keep. No project is strong on every axis: Graphiti is strongest on self-hosting and portability but publishes no benchmarks and ships reference servers without authentication; Cognee is strongest on scope enforcement and benchmark transparency but licenses its production graph path; Letta is weakest on self-hosting and portability.</desc>
  <style>
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="title" x="30" y="28" text-anchor="start">Where each one leans hardest</text>

  <text class="head" x="284" y="66" text-anchor="middle">Self-host completeness</text>
  <text class="head" x="458" y="66" text-anchor="middle">Scope enforcement</text>
  <text class="head" x="632" y="66" text-anchor="middle">Benchmark transparency</text>
  <text class="head" x="806" y="66" text-anchor="middle">Portability of exports</text>

  <text class="label" x="180" y="117" text-anchor="end">Mem0</text>
  <rect class="med" x="200" y="78" width="168" height="56" />
  <text class="label" x="284" y="102" text-anchor="middle">Medium</text>
  <text class="sub" x="284" y="121" text-anchor="middle">SDK + server</text>
  <rect class="weak" x="374" y="78" width="168" height="56" />
  <text class="label" x="458" y="102" text-anchor="middle">Weak</text>
  <text class="sub" x="458" y="121" text-anchor="middle">user_id filter</text>
  <rect class="med" x="548" y="78" width="168" height="56" />
  <text class="label" x="632" y="102" text-anchor="middle">Medium</text>
  <text class="sub" x="632" y="121" text-anchor="middle">numbers + caveat</text>
  <rect class="med" x="722" y="78" width="168" height="56" />
  <text class="label" x="806" y="102" text-anchor="middle">Medium</text>
  <text class="sub" x="806" y="121" text-anchor="middle">facts + vectors</text>

  <text class="label" x="180" y="181" text-anchor="end">Graphiti</text>
  <rect class="strong" x="200" y="142" width="168" height="56" />
  <text class="label-inv" x="284" y="166" text-anchor="middle">Strong</text>
  <text class="sub-inv" x="284" y="185" text-anchor="middle">whole framework</text>
  <rect class="weak" x="374" y="142" width="168" height="56" />
  <text class="label" x="458" y="166" text-anchor="middle">Weak</text>
  <text class="sub" x="458" y="185" text-anchor="middle">group_id, no auth</text>
  <rect class="weak" x="548" y="142" width="168" height="56" />
  <text class="label" x="632" y="166" text-anchor="middle">Weak</text>
  <text class="sub" x="632" y="185" text-anchor="middle">none published</text>
  <rect class="strong" x="722" y="142" width="168" height="56" />
  <text class="label-inv" x="806" y="166" text-anchor="middle">Strong</text>
  <text class="sub-inv" x="806" y="185" text-anchor="middle">graph + provenance</text>

  <text class="label" x="180" y="245" text-anchor="end">Letta</text>
  <rect class="weak" x="200" y="206" width="168" height="56" />
  <text class="label" x="284" y="230" text-anchor="middle">Weak</text>
  <text class="sub" x="284" y="249" text-anchor="middle">V1 server archived</text>
  <rect class="med" x="374" y="206" width="168" height="56" />
  <text class="label" x="458" y="230" text-anchor="middle">Medium</text>
  <text class="sub" x="458" y="249" text-anchor="middle">per agent</text>
  <rect class="weak" x="548" y="206" width="168" height="56" />
  <text class="label" x="632" y="230" text-anchor="middle">Weak</text>
  <text class="sub" x="632" y="249" text-anchor="middle">none published</text>
  <rect class="weak" x="722" y="206" width="168" height="56" />
  <text class="label" x="806" y="230" text-anchor="middle">Weak</text>
  <text class="sub" x="806" y="249" text-anchor="middle">harness-specific</text>

  <text class="label" x="180" y="309" text-anchor="end">Cognee</text>
  <rect class="med" x="200" y="270" width="168" height="56" />
  <text class="label" x="284" y="294" text-anchor="middle">Medium</text>
  <text class="sub" x="284" y="313" text-anchor="middle">graph path licensed</text>
  <rect class="strong" x="374" y="270" width="168" height="56" />
  <text class="label-inv" x="458" y="294" text-anchor="middle">Strong</text>
  <text class="sub-inv" x="458" y="313" text-anchor="middle">auth by default</text>
  <rect class="strong" x="548" y="270" width="168" height="56" />
  <text class="label-inv" x="632" y="294" text-anchor="middle">Strong</text>
  <text class="sub-inv" x="632" y="313" text-anchor="middle">caveats stated</text>
  <rect class="med" x="722" y="270" width="168" height="56" />
  <text class="label" x="806" y="294" text-anchor="middle">Medium</text>
  <text class="sub" x="806" y="313" text-anchor="middle">Postgres rows</text>

  <rect class="weak" x="200" y="356" width="18" height="18" />
  <text class="sub" x="226" y="370" text-anchor="start">Weak</text>
  <rect class="med" x="310" y="356" width="18" height="18" />
  <text class="sub" x="336" y="370" text-anchor="start">Medium</text>
  <rect class="strong" x="430" y="356" width="18" height="18" />
  <text class="sub" x="456" y="370" text-anchor="start">Strong</text>
</svg>
