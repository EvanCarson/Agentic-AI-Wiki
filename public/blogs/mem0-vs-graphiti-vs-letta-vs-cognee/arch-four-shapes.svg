<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="fst fsd">
  <title id="fst">Four storage shapes behind the word memory</title>
  <desc id="fsd">Four panels. Mem0 extracts atomic fact strings and retrieves them from a vector index by similarity, with no relation between facts. Graphiti links entities with dated edges that are invalidated rather than deleted and traced back to a source episode. Letta keeps editable memory blocks inside the agent's own context, which the agent rewrites, and ingests no documents. Cognee ingests documents, code and chat into a dataset-scoped graph whose recall call names the dataset and requires an authenticated user by default.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .bound  { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 5 4; rx: 10; ry: 10; opacity: .55; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#fsa); }
  </style>
  <defs>
    <marker id="fsa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="bound" x="22" y="56" width="202" height="368" />
  <rect class="bound" x="240" y="56" width="202" height="368" />
  <rect class="bound" x="458" y="56" width="202" height="368" />
  <rect class="bound" x="676" y="56" width="202" height="368" />

  <rect class="hero" x="40" y="72" width="166" height="38" />
  <text class="label-inv" x="123" y="96" text-anchor="middle">Mem0</text>
  <rect class="box" x="40" y="134" width="166" height="40" />
  <text class="mono" x="123" y="159" text-anchor="middle">prefers dark mode</text>
  <rect class="box" x="40" y="186" width="166" height="40" />
  <text class="mono" x="123" y="211" text-anchor="middle">ships to Berlin</text>
  <rect class="box" x="40" y="238" width="166" height="40" />
  <text class="mono" x="123" y="263" text-anchor="middle">owns three seats</text>
  <path class="arrow" d="M 123 282 L 123 312" />
  <rect class="adj" x="40" y="316" width="166" height="40" />
  <text class="label" x="123" y="341" text-anchor="middle">vector index</text>
  <text class="sub" x="123" y="380" text-anchor="middle">retrieved by similarity</text>
  <text class="sub" x="123" y="398" text-anchor="middle">no relation between facts</text>

  <rect class="hero" x="258" y="72" width="166" height="38" />
  <text class="label-inv" x="341" y="96" text-anchor="middle">Graphiti</text>
  <rect class="box" x="291" y="130" width="100" height="36" />
  <text class="label" x="341" y="153" text-anchor="middle">Alice</text>
  <path class="arrow" d="M 341 168 L 341 196" />
  <text class="mono" x="349" y="186" text-anchor="start">owner_of</text>
  <rect class="box" x="291" y="200" width="100" height="36" />
  <text class="label" x="341" y="223" text-anchor="middle">AcmeCo</text>
  <path class="arrow" d="M 341 238 L 341 266" />
  <rect class="adj" x="258" y="270" width="166" height="46" />
  <text class="mono" x="341" y="291" text-anchor="middle">valid 3 Mar - 14 Oct</text>
  <text class="sub" x="341" y="309" text-anchor="middle">invalidated, not deleted</text>
  <text class="sub" x="341" y="380" text-anchor="middle">entities, dated edges</text>
  <text class="sub" x="341" y="398" text-anchor="middle">and a source episode</text>

  <rect class="hero" x="476" y="72" width="166" height="38" />
  <text class="label-inv" x="559" y="96" text-anchor="middle">Letta</text>
  <rect class="bound" x="471" y="130" width="176" height="150" />
  <text class="sub" x="559" y="150" text-anchor="middle">the agent's own context</text>
  <rect class="box" x="489" y="162" width="140" height="38" />
  <text class="label" x="559" y="186" text-anchor="middle">persona block</text>
  <rect class="box" x="489" y="212" width="140" height="38" />
  <text class="label" x="559" y="236" text-anchor="middle">human block</text>
  <path class="arrow" d="M 559 318 L 559 286" />
  <rect class="adj" x="476" y="322" width="166" height="40" />
  <text class="label" x="559" y="347" text-anchor="middle">agent rewrites them</text>
  <text class="sub" x="559" y="386" text-anchor="middle">state, not a corpus</text>
  <text class="sub" x="559" y="404" text-anchor="middle">no document ingestion</text>

  <rect class="hero" x="694" y="72" width="166" height="38" />
  <text class="label-inv" x="777" y="96" text-anchor="middle">Cognee</text>
  <rect class="box" x="694" y="134" width="166" height="40" />
  <text class="label" x="777" y="159" text-anchor="middle">documents, code, chat</text>
  <path class="arrow" d="M 777 178 L 777 204" />
  <rect class="adj" x="694" y="208" width="166" height="40" />
  <text class="label" x="777" y="233" text-anchor="middle">dataset graph</text>
  <path class="arrow" d="M 777 252 L 777 278" />
  <rect class="box" x="694" y="282" width="166" height="44" />
  <text class="mono" x="777" y="303" text-anchor="middle">recall(datasets=[...])</text>
  <text class="sub" x="777" y="319" text-anchor="middle">auth'd user by default</text>
  <text class="sub" x="777" y="380" text-anchor="middle">scope is an argument</text>
  <text class="sub" x="777" y="398" text-anchor="middle">on every call</text>
</svg>
