<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="sct scd">
  <title id="sct">GitHub stars, agent memory layers, late October 2026</title>
  <desc id="scd">Horizontal bar chart of GitHub star counts read from each repository in late October 2026: Mem0 67.8 thousand, Cognee 32.7 thousand, Graphiti 32.2 thousand, Letta 25.3 thousand, and letta-code 3.7 thousand.</desc>
  <style>
    .bar-hi { fill: var(--accent, #d4421e); }
    .bar-md { fill: var(--accent-soft); }
    .bar-lo { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .num    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .grid   { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .axis   { fill: none; stroke: var(--border-soft); stroke-width: 1; }
  </style>

  <text class="title" x="40" y="34" text-anchor="start">GitHub stars (thousands)</text>

  <path class="grid" d="M 354 54 L 354 330" />
  <path class="grid" d="M 529 54 L 529 330" />
  <path class="grid" d="M 703 54 L 703 330" />
  <path class="axis" d="M 180 54 L 180 330" />

  <text class="label" x="164" y="89" text-anchor="end">Mem0</text>
  <rect class="bar-hi" x="180" y="66" width="591" height="34" />
  <text class="num" x="783" y="90" text-anchor="start">67.8</text>

  <text class="label" x="164" y="141" text-anchor="end">Cognee</text>
  <rect class="bar-md" x="180" y="118" width="285" height="34" />
  <text class="num" x="477" y="142" text-anchor="start">32.7</text>

  <text class="label" x="164" y="193" text-anchor="end">Graphiti</text>
  <rect class="bar-md" x="180" y="170" width="281" height="34" />
  <text class="num" x="473" y="194" text-anchor="start">32.2</text>

  <text class="label" x="164" y="245" text-anchor="end">Letta</text>
  <rect class="bar-lo" x="180" y="222" width="220" height="34" />
  <text class="num" x="412" y="246" text-anchor="start">25.3</text>

  <text class="label" x="164" y="297" text-anchor="end">letta-code</text>
  <rect class="bar-lo" x="180" y="274" width="32" height="34" />
  <text class="num" x="224" y="298" text-anchor="start">3.7</text>

  <text class="sub" x="354" y="350" text-anchor="middle">20</text>
  <text class="sub" x="529" y="350" text-anchor="middle">40</text>
  <text class="sub" x="703" y="350" text-anchor="middle">60</text>
  <text class="sub" x="40" y="380" text-anchor="start">letta-code is where Letta's development now happens; the 25.3k repo has archived its V1 server.</text>
</svg>
