<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What each decontamination check can and cannot see</title>
  <desc id="d">Three columns. Answer overlap compares the gold patch against the training set and catches verbatim leakage. Solution overlap compares the approach and catches paraphrased fixes. Environment overlap asks whether the model has already navigated this repository, and no standard string check detects it — only held-out repositories do.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
    .head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--paper); text-anchor: middle; }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; text-anchor: middle; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; text-anchor: middle; }
    .title { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink); }
  </style>

  <text class="title" x="40" y="32">Three things a benchmark task can leak</text>

  <rect class="box" x="40" y="52" width="240" height="176" />
  <text class="head" x="160" y="82">Answer overlap</text>
  <text class="sub" x="160" y="108">The gold patch itself</text>
  <text class="sub" x="160" y="130">appears in training text.</text>
  <text class="sub" x="160" y="164">Detected by n-gram or</text>
  <text class="sub" x="160" y="186">substring comparison.</text>
  <text class="sub" x="160" y="214">Everyone checks this one.</text>

  <rect class="adj" x="330" y="52" width="240" height="176" />
  <text class="head" x="450" y="82">Solution overlap</text>
  <text class="sub" x="450" y="108">The same approach, in</text>
  <text class="sub" x="450" y="130">different words.</text>
  <text class="sub" x="450" y="164">Detected unreliably, by</text>
  <text class="sub" x="450" y="186">embedding similarity.</text>
  <text class="sub" x="450" y="214">Some teams check this one.</text>

  <rect class="hero" x="620" y="52" width="240" height="176" />
  <text class="head-inv" x="740" y="82">Environment overlap</text>
  <text class="sub-inv" x="740" y="108">The model has already</text>
  <text class="sub-inv" x="740" y="130">navigated this repository:</text>
  <text class="sub-inv" x="740" y="152">layout, test names,</text>
  <text class="sub-inv" x="740" y="174">failure strings.</text>
  <text class="sub-inv" x="740" y="202">No string check sees it.</text>
  <text class="sub-inv" x="740" y="222">Held-out repos, or nothing.</text>

  <text class="sub" x="450" y="266">A trajectory corpus adds mainly to the third column, and the third column is the one nobody reports on.</text>
</svg>
