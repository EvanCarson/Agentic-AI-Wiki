<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Published trajectory counts in three open coding-agent corpora</title>
  <desc id="d">Horizontal bar chart. SWE-Zero trajectories: 318 thousand. Open-SWE-Traces: 207 thousand. SWE-Hero trajectories: 34 thousand. Below, a note that Open-SWE-Traces draws its 207 thousand trajectories from roughly 20 thousand source pull requests, so the count of distinct environments is an order of magnitude smaller than the count of trajectories.</desc>
  <style>
    .bar-lead { fill: var(--accent, #d4421e); }
    .bar-mid  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .bar-low  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .title { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink); }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .value { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; fill: var(--ink); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .grid  { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 4; }
  </style>

  <text class="title" x="40" y="36">Recorded trajectories per corpus (thousands)</text>

  <!-- Plot origin is x=180, not 140: "Open-SWE-Traces" is ~124px at 14px Inter
       and starts at x=40, so a 140px gutter clipped its tail under the bar.
       Scale is unchanged at 2px per 1k (80k = 160px); every plot coordinate
       below is the old one plus 40. -->
  <line class="grid" x1="340" y1="56" x2="340" y2="268" />
  <line class="grid" x1="500" y1="56" x2="500" y2="268" />
  <line class="grid" x1="660" y1="56" x2="660" y2="268" />
  <line class="grid" x1="820" y1="56" x2="820" y2="268" />

  <text class="label" x="40" y="90">SWE-Zero</text>
  <rect class="bar-lead" x="180" y="72" width="636" height="34" rx="4" />
  <text class="value" x="826" y="95">318k</text>

  <text class="label" x="40" y="158">Open-SWE-Traces</text>
  <rect class="bar-mid" x="180" y="140" width="415" height="34" rx="4" />
  <text class="value" x="605" y="163">207k</text>

  <text class="label" x="40" y="226">SWE-Hero</text>
  <rect class="bar-low" x="180" y="208" width="68" height="34" rx="4" />
  <text class="value" x="258" y="231">34k</text>

  <text class="sub" x="180" y="286">0</text>
  <text class="sub" x="330" y="286">80k</text>
  <text class="sub" x="490" y="286">160k</text>
  <text class="sub" x="650" y="286">240k</text>
  <text class="sub" x="810" y="286">320k</text>

  <line class="grid" x1="40" y1="312" x2="860" y2="312" />
  <text class="title" x="40" y="342">Trajectories are not environments</text>
  <text class="sub" x="40" y="366">Open-SWE-Traces: ~20,000 source pull requests → 207k trajectories</text>
  <text class="sub" x="40" y="386">Roughly ten recorded runs per environment. Diversity is measured on the smaller number.</text>
</svg>
