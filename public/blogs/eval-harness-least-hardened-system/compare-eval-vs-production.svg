<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Controls on the production stack versus the evaluation bench</title>
  <desc id="d">Six controls — refusal layer, egress policy, credential scoping, change review, live monitoring and third-party ownership — compared across a production agent deployment and a capability evaluation environment. The production column is strong or medium on every row; the evaluation column is weak or deliberately removed on every row, while the capability elicited there is deliberately higher.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-head { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cv     { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink); text-anchor: middle; }
    .cv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--paper); text-anchor: middle; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="chart-title" x="450" y="22">Every control is weaker exactly where capability is highest</text>

  <text class="col-head" x="560" y="50">Production agent</text>
  <text class="col-head" x="760" y="50">Capability eval bench</text>

  <text class="row-head" x="24" y="79">Refusal layer</text>
  <rect class="strong" x="460" y="60" width="200" height="26" rx="5" /><text class="cv-inv" x="560" y="79">On, tuned</text>
  <rect class="weak" x="670" y="60" width="200" height="26" rx="5" /><text class="cv" x="760" y="79">Deliberately reduced</text>

  <text class="row-head" x="24" y="113">Egress policy</text>
  <rect class="mid" x="460" y="94" width="200" height="26" rx="5" /><text class="cv" x="560" y="113">Usually allowlisted</text>
  <rect class="weak" x="670" y="94" width="200" height="26" rx="5" /><text class="cv" x="760" y="113">Assumed, not verified</text>

  <text class="row-head" x="24" y="147">Credential scoping</text>
  <rect class="strong" x="460" y="128" width="200" height="26" rx="5" /><text class="cv-inv" x="560" y="147">Per-task, reviewed</text>
  <rect class="weak" x="670" y="128" width="200" height="26" rx="5" /><text class="cv" x="760" y="147">Whatever the task needs</text>

  <text class="row-head" x="24" y="181">Change review</text>
  <rect class="strong" x="460" y="162" width="200" height="26" rx="5" /><text class="cv-inv" x="560" y="181">Code review, staged</text>
  <rect class="weak" x="670" y="162" width="200" height="26" rx="5" /><text class="cv" x="760" y="181">Research velocity</text>

  <text class="row-head" x="24" y="215">Live monitoring</text>
  <rect class="mid" x="460" y="196" width="200" height="26" rx="5" /><text class="cv" x="560" y="215">Traces, alerts</text>
  <rect class="weak" x="670" y="196" width="200" height="26" rx="5" /><text class="cv" x="760" y="215">Scores, after the run</text>

  <text class="row-head" x="24" y="249">Who owns the network</text>
  <rect class="mid" x="460" y="230" width="200" height="26" rx="5" /><text class="cv" x="560" y="249">You do</text>
  <rect class="weak" x="670" y="230" width="200" height="26" rx="5" /><text class="cv" x="760" y="249">Often a third party</text>

  <text class="note" x="24" y="285">The eval bench is the one environment built to elicit the behaviour every other control exists to stop.</text>
</svg>
