<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Four disclosures, 9 July to 6 August 2026</title>
  <desc id="d">A timeline of the 2026 evaluation-environment incidents. Hugging Face detects and contains an intrusion on 16 July, five days before OpenAI connects its own testing to it on 21 July. Anthropic suspends cyber evaluations on 23 July, identifies three incidents by 24 July, notifies affected organisations on 27 July and discloses on 30 July. The UK AI Security Institute reports on 4 August, and Meta discloses on 6 August.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; }
    .axis   { stroke: currentColor; stroke-width: 1.25; }
    .grid   { stroke: currentColor; stroke-width: 1; stroke-dasharray: 2 5; opacity: .3; }
    .tick   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; text-anchor: middle; }
    .who    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ink); }
    .ev     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .8; }
    .dot-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .dot-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .dot-weak { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .rail   { stroke: currentColor; stroke-width: 1; opacity: .35; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="chart-title" x="24" y="26">Detection ran behind the incident in every case</text>

  <line class="axis" x1="200" y1="330" x2="876" y2="330" />
  <line class="grid" x1="200" y1="60" x2="200" y2="330" />
  <line class="grid" x1="369" y1="60" x2="369" y2="330" />
  <line class="grid" x1="538" y1="60" x2="538" y2="330" />
  <line class="grid" x1="707" y1="60" x2="707" y2="330" />
  <line class="grid" x1="876" y1="60" x2="876" y2="330" />

  <text class="tick" x="200" y="350">9 Jul</text>
  <text class="tick" x="369" y="350">16 Jul</text>
  <text class="tick" x="538" y="350">23 Jul</text>
  <text class="tick" x="707" y="350">30 Jul</text>
  <text class="tick" x="876" y="350">6 Aug</text>

  <text class="who" x="24" y="80">Hugging Face</text>
  <line class="rail" x1="200" y1="76" x2="876" y2="76" />
  <circle class="dot-adj" cx="200" cy="76" r="6" />
  <circle class="dot-hero" cx="369" cy="76" r="6" />
  <text class="ev" x="212" y="66">intrusion begins</text>
  <text class="ev" x="381" y="66">detected and contained</text>

  <text class="who" x="24" y="140">OpenAI</text>
  <line class="rail" x1="200" y1="136" x2="876" y2="136" />
  <circle class="dot-hero" cx="490" cy="136" r="6" />
  <text class="ev" x="502" y="126">21 Jul — discloses; links its eval to the breach</text>

  <text class="who" x="24" y="200">Anthropic</text>
  <line class="rail" x1="200" y1="196" x2="876" y2="196" />
  <circle class="dot-adj" cx="538" cy="196" r="6" />
  <circle class="dot-adj" cx="635" cy="196" r="6" />
  <circle class="dot-hero" cx="707" cy="196" r="6" />
  <text class="ev" x="550" y="186">23 Jul suspends</text>
  <text class="ev" x="647" y="186">27 Jul notifies</text>
  <text class="ev" x="600" y="222">30 Jul — 3 incidents found in 141,006 eval runs</text>

  <text class="who" x="24" y="260">UK AISI</text>
  <line class="rail" x1="200" y1="256" x2="876" y2="256" />
  <circle class="dot-hero" cx="828" cy="256" r="6" />
  <text class="ev" x="560" y="246">4 Aug — 19 unsanctioned live-internet actions across 10 runs</text>

  <text class="who" x="24" y="314">Meta</text>
  <line class="rail" x1="200" y1="310" x2="876" y2="310" />
  <circle class="dot-hero" cx="876" cy="310" r="6" />
  <text class="ev" x="640" y="300">6 Aug — same evaluation partner</text>

  <text class="note" x="24" y="382">Anthropic began its retrospective only after OpenAI disclosed. No live control fired in any of the three sandbox cases.</text>
</svg>
