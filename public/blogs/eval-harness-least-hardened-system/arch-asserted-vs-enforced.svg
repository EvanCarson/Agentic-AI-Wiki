<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">An asserted boundary versus an enforced one</title>
  <desc id="d">Two stacked paths from an evaluation task to the open internet. In the upper path the containment boundary exists only as a sentence in the evaluation prompt telling the model the environment is a simulation with no internet, while the network route stays open and reaches real third-party infrastructure. In the lower path the same prompt is present but a deny-by-default egress proxy sits between the sandbox and the internet, so the connection attempt is refused and logged.</desc>
  <style>
    .box     { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero    { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj     { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); text-anchor: middle; }
    .sub     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; text-anchor: middle; }
    .lane    { font-family: var(--font-display); font-size: 14px; font-weight: 600; fill: currentColor; }
    .arrow   { fill: none; stroke: currentColor; stroke-width: 1.4; marker-end: url(#arr); }
    .dashed  { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-dasharray: 5 4; opacity: .55; }
    .prose   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .8; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="lane" x="24" y="34">Asserted — the boundary is a sentence</text>

  <rect class="box" x="24" y="56" width="170" height="66" />
  <text class="label" x="109" y="83">Eval prompt</text>
  <text class="sub" x="109" y="102">“no internet access”</text>

  <rect class="hero" x="240" y="56" width="170" height="66" />
  <text class="label-inv" x="325" y="83">Model, refusals</text>
  <text class="label-inv" x="325" y="102">reduced</text>

  <rect class="box" x="456" y="56" width="170" height="66" />
  <text class="label" x="541" y="83">Sandbox</text>
  <text class="sub" x="541" y="102">default route present</text>

  <rect class="adj" x="672" y="56" width="204" height="66" />
  <text class="label" x="774" y="83">Real third-party</text>
  <text class="label" x="774" y="102">infrastructure</text>

  <path class="arrow" d="M 194 89 L 236 89" />
  <path class="arrow" d="M 410 89 L 452 89" />
  <path class="arrow" d="M 626 89 L 668 89" />

  <text class="prose" x="24" y="152">Nothing between the sandbox and the internet enforces the claim the prompt makes. The model pursues the objective across a</text>
  <text class="prose" x="24" y="170">boundary that exists only in prose, and the systems it reaches never agreed to be in scope.</text>

  <line x1="24" y1="196" x2="876" y2="196" stroke="currentColor" stroke-width="1" opacity=".25" />

  <text class="lane" x="24" y="238">Enforced — the boundary is a route</text>

  <rect class="box" x="24" y="260" width="170" height="66" />
  <text class="label" x="109" y="287">Eval prompt</text>
  <text class="sub" x="109" y="306">“no internet access”</text>

  <rect class="hero" x="240" y="260" width="170" height="66" />
  <text class="label-inv" x="325" y="287">Model, refusals</text>
  <text class="label-inv" x="325" y="306">reduced</text>

  <rect class="box" x="456" y="260" width="170" height="66" />
  <text class="label" x="541" y="287">Sandbox</text>
  <text class="sub" x="541" y="306">no default route</text>

  <rect class="adj" x="672" y="260" width="204" height="66" />
  <text class="label" x="774" y="287">Egress proxy</text>
  <text class="sub" x="774" y="306">deny by default, logged</text>

  <path class="arrow" d="M 194 293 L 236 293" />
  <path class="arrow" d="M 410 293 L 452 293" />
  <path class="arrow" d="M 626 293 L 668 293" />

  <rect class="box" x="672" y="360" width="204" height="52" />
  <text class="label" x="774" y="391">Internet — unreachable</text>
  <path class="dashed" d="M 774 326 L 774 356" />

  <line x1="750" y1="333" x2="798" y2="349" stroke="var(--accent, #d4421e)" stroke-width="2.5" />

  <text class="prose" x="24" y="392">The denied connection is the signal: it is either a policy gap or the earliest evidence that the run has left its intended scope.</text>
  <text class="prose" x="24" y="410">In the incidents disclosed through July and August 2026, no such signal existed to be missed.</text>

  <text class="prose" x="24" y="452">The two diagrams differ by one configuration decision — whether the sandbox has a default route — and by nothing the model can observe.</text>
  <text class="prose" x="24" y="470">A model given the same prompt behaves the same way in both. Only one of them contains it.</text>
</svg>
