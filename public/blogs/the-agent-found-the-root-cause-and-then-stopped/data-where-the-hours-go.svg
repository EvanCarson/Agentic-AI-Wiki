<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="hgt hgd">
  <title id="hgt">Who carries each stage of a pipeline incident, before and after an ops agent</title>
  <desc id="hgd">Four stages of a pipeline incident scored on who carries them. Noticing the breakage and locating the cause move from a human to the agent. Writing the fix becomes shared, with the agent drafting and a person checking. Applying the fix to production stays entirely human and unchanged, so the human workload shifts from investigation to review rather than shrinking.</desc>
  <style>
    .hg-agent { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .hg-share { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .hg-human { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .hg-ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hg-col   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .hg-row   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .hg-cell  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .hg-celli { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .hg-leg   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="hg-ttl" x="20" y="30">The gate does not remove decisions, it changes them</text>

  <text class="hg-col" x="520" y="66" text-anchor="middle">BEFORE</text>
  <text class="hg-col" x="760" y="66" text-anchor="middle">AFTER</text>

  <text class="hg-row" x="20" y="105">Notice that something broke</text>
  <rect class="hg-human" x="420" y="84" width="200" height="34" />
  <text class="hg-cell" x="520" y="105" text-anchor="middle">A page, or a complaint</text>
  <rect class="hg-agent" x="660" y="84" width="200" height="34" />
  <text class="hg-celli" x="760" y="105" text-anchor="middle">Agent, continuously</text>

  <text class="hg-row" x="20" y="165">Locate the cause upstream</text>
  <rect class="hg-human" x="420" y="144" width="200" height="34" />
  <text class="hg-cell" x="520" y="165" text-anchor="middle">Forty minutes, by hand</text>
  <rect class="hg-agent" x="660" y="144" width="200" height="34" />
  <text class="hg-celli" x="760" y="165" text-anchor="middle">Agent, on the graph</text>

  <text class="hg-row" x="20" y="225">Write the fix</text>
  <rect class="hg-human" x="420" y="204" width="200" height="34" />
  <text class="hg-cell" x="520" y="225" text-anchor="middle">Two minutes, confident</text>
  <rect class="hg-share" x="660" y="204" width="200" height="34" />
  <text class="hg-cell" x="760" y="225" text-anchor="middle">Agent drafts, you check</text>

  <text class="hg-row" x="20" y="285">Apply it to production</text>
  <rect class="hg-human" x="420" y="264" width="200" height="34" />
  <text class="hg-cell" x="520" y="285" text-anchor="middle">You</text>
  <rect class="hg-human" x="660" y="264" width="200" height="34" />
  <text class="hg-cell" x="760" y="285" text-anchor="middle">You, unchanged</text>

  <text class="hg-leg" x="20" y="330">The forty minutes that justified the merge is the part that went away. The merge did not.</text>

  <rect class="hg-human" x="20" y="361" width="16" height="13" />
  <text class="hg-leg" x="46" y="372">a person carries it</text>
  <rect class="hg-share" x="230" y="361" width="16" height="13" />
  <text class="hg-leg" x="256" y="372">drafted, then reviewed</text>
  <rect class="hg-agent" x="470" y="361" width="16" height="13" />
  <text class="hg-leg" x="496" y="372">the agent carries it</text>
</svg>
