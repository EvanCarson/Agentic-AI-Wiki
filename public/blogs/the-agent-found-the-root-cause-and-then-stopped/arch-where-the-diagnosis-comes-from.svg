<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="dgt dgd">
  <title id="dgt">Where an ops agent's root-cause claim comes from</title>
  <desc id="dgd">Monitoring signals from jobs, pipelines and tables feed a diagnose step, which produces a proposed fix on a branch, which goes to a human approval gate and only then to production. The diagnose step reads a lineage graph, drawn as the central hero element feeding it from below. Without that graph the diagnose step has only logs and model priors to work from, so it degrades from an enumerable upstream walk to a guess.</desc>
  <style>
    .dg-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .dg-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .dg-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .dg-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .dg-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .dg-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .dg-lbli { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .dg-subi { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .dg-note { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
    .dg-flow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#dgarr); }
  </style>
  <defs>
    <marker id="dgarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="dg-ttl" x="20" y="34">Four stages, and the one that needs an asset you had to build first</text>

  <rect class="dg-box" x="20"  y="110" width="170" height="76" rx="8" ry="8" />
  <text class="dg-lbl" x="105" y="142" text-anchor="middle">Detect</text>
  <text class="dg-sub" x="105" y="164" text-anchor="middle">jobs, pipelines, tables</text>

  <rect class="dg-adj" x="250" y="110" width="170" height="76" rx="8" ry="8" />
  <text class="dg-lbl" x="335" y="142" text-anchor="middle">Diagnose</text>
  <text class="dg-sub" x="335" y="164" text-anchor="middle">walk upstream, diff</text>

  <rect class="dg-box" x="480" y="110" width="170" height="76" rx="8" ry="8" />
  <text class="dg-lbl" x="565" y="142" text-anchor="middle">Propose</text>
  <text class="dg-sub" x="565" y="164" text-anchor="middle">a fix on a branch</text>

  <rect class="dg-adj" x="710" y="110" width="170" height="76" rx="8" ry="8" />
  <text class="dg-lbl" x="795" y="142" text-anchor="middle">Approve</text>
  <text class="dg-sub" x="795" y="164" text-anchor="middle">a person decides</text>

  <path class="dg-flow" d="M 196 148 L 244 148" />
  <path class="dg-flow" d="M 426 148 L 474 148" />
  <path class="dg-flow" d="M 656 148 L 704 148" />

  <rect class="dg-hero" x="250" y="250" width="400" height="96" rx="8" ry="8" />
  <text class="dg-lbli" x="450" y="286" text-anchor="middle">The lineage graph</text>
  <text class="dg-subi" x="450" y="310" text-anchor="middle">every table's upstreams, with schemas and times</text>
  <text class="dg-subi" x="450" y="330" text-anchor="middle">a catalogue migration, not a feature</text>
  <path class="dg-flow" d="M 335 244 L 335 192" />

  <rect class="dg-box" x="710" y="250" width="170" height="76" rx="8" ry="8" />
  <text class="dg-lbl" x="795" y="282" text-anchor="middle">Production</text>
  <text class="dg-sub" x="795" y="304" text-anchor="middle">code and data change</text>
  <path class="dg-flow" d="M 795 192 L 795 244" />

  <text class="dg-note" x="20" y="400">Take the red box away and the agent still detects and still proposes — on logs and priors alone.</text>
  <text class="dg-note" x="20" y="424">It cannot know that a column was renamed four hops upstream, so it answers confidently about the hop it can see.</text>
  <text class="dg-note" x="20" y="462">Only the last arrow crosses into production, and no model is on either end of it.</text>
</svg>
