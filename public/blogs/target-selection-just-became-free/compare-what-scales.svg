<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="wsT wsD">
  <title id="wsT">Marginal cost of one more victim, on each side of the campaign</title>
  <desc id="wsD">Three columns. Target selection and initial access: near zero, because scanning and exploit adaptation run in parallel across an internet-wide list. Per-victim follow-up such as credential harvesting and privilege escalation: near zero, where it used to be the operator's scarce hands-on-keyboard time. Defence: linear, because triage, containment and recovery each consume a named human at the defending organisation.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .92; }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Cost of one more victim</text>

  <rect class="adj" x="35" y="48" width="250" height="96" />
  <text class="hd" x="160" y="76" text-anchor="middle">Selection + access</text>
  <text class="cell" x="160" y="100" text-anchor="middle">Scan the internet, adapt</text>
  <text class="cell" x="160" y="118" text-anchor="middle">the chain per version,</text>
  <text class="cell" x="160" y="136" text-anchor="middle">run it everywhere at once.</text>

  <rect class="hero" x="325" y="48" width="250" height="96" />
  <text class="hd-inv" x="450" y="76" text-anchor="middle">Per-victim follow-up</text>
  <text class="cell-inv" x="450" y="100" text-anchor="middle">Read the environment,</text>
  <text class="cell-inv" x="450" y="118" text-anchor="middle">harvest credentials,</text>
  <text class="cell-inv" x="450" y="136" text-anchor="middle">escalate — once per org.</text>

  <rect class="box" x="625" y="48" width="250" height="96" />
  <text class="hd" x="750" y="76" text-anchor="middle">Defence</text>
  <text class="cell" x="750" y="100" text-anchor="middle">Triage, contain, rotate,</text>
  <text class="cell" x="750" y="118" text-anchor="middle">recover — every step</text>
  <text class="cell" x="750" y="136" text-anchor="middle">routed through a person.</text>

  <text class="lane" x="160" y="176" text-anchor="middle">Marginal cost</text>
  <text class="lane" x="450" y="176" text-anchor="middle">Marginal cost</text>
  <text class="lane" x="750" y="176" text-anchor="middle">Marginal cost</text>

  <rect class="box" x="35" y="186" width="250" height="80" />
  <text class="cell" x="160" y="214" text-anchor="middle">Near zero. It was</text>
  <text class="cell" x="160" y="236" text-anchor="middle">already cheap.</text>

  <rect class="box" x="325" y="186" width="250" height="80" />
  <text class="cell" x="450" y="214" text-anchor="middle">Near zero. This is the</text>
  <text class="cell" x="450" y="236" text-anchor="middle">column that changed.</text>

  <rect class="box" x="625" y="186" width="250" height="80" />
  <text class="cell" x="750" y="214" text-anchor="middle">Linear in victims, and</text>
  <text class="cell" x="750" y="236" text-anchor="middle">paid by each of them.</text>
</svg>
