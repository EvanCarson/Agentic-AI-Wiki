<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="cfT cfD">
  <title id="cfT">Campaign funnel: organisations reached at each stage</title>
  <desc id="cfD">Horizontal bar chart of the PaperCut campaign as reported by GreyNoise. Three hundred and ninety-five organisations compromised. Credentials harvested from two hundred and eighty. Operating-system or domain secrets obtained from one hundred and forty-seven. Administrator privileges reached at twelve organisations.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .lbl   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .val   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val-a { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--accent, #d4421e); }
    .grid  { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .b-hi  { fill: var(--accent, #d4421e); rx: 4; ry: 4; }
    .b-mid { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .b-lo  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
  </style>

  <text class="ttl" x="0" y="22">Organisations reached, by stage</text>
  <text class="sub" x="0" y="44">GreyNoise telemetry, campaign beginning 31 August 2026</text>

  <line class="grid" x1="262" y1="70" x2="262" y2="336" />
  <line class="grid" x1="414" y1="70" x2="414" y2="336" />
  <line class="grid" x1="566" y1="70" x2="566" y2="336" />
  <line class="grid" x1="718" y1="70" x2="718" y2="336" />
  <line class="grid" x1="870" y1="70" x2="870" y2="336" />

  <text class="lbl" x="0" y="112">Compromised</text>
  <rect class="b-hi" x="262" y="92" width="601" height="30" />
  <text class="val-a" x="812" y="113" text-anchor="end">395</text>

  <text class="lbl" x="0" y="184">Credentials taken</text>
  <rect class="b-mid" x="262" y="164" width="426" height="30" />
  <text class="val" x="700" y="185">280</text>

  <text class="lbl" x="0" y="256">OS / domain secrets</text>
  <rect class="b-lo" x="262" y="236" width="224" height="30" />
  <text class="val" x="498" y="257">147</text>

  <text class="lbl" x="0" y="328">Administrator</text>
  <rect class="b-lo" x="262" y="308" width="18" height="30" />
  <text class="val" x="292" y="329">12</text>

  <text class="sub" x="262" y="362">0</text>
  <text class="sub" x="414" y="362">100</text>
  <text class="sub" x="566" y="362">200</text>
  <text class="sub" x="718" y="362">300</text>
  <text class="sub" x="852" y="362">400</text>

  <text class="sub" x="0" y="390">The funnel barely narrows at the stage that used to cost the operator their evening.</text>
</svg>
