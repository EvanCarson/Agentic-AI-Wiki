<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="dt dd">
  <title id="dt">File F1 on VLoc Bench</title>
  <desc id="dd">A horizontal bar chart on a zero-to-one File F1 scale. A full-width reference bar marks perfect localization at 1.000. The best evaluated system reaches 0.229 and the Antares-3B specialist reaches 0.223, so both sit under a quarter of the way along the axis.</desc>
  <style>
    .bar-ref { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 4; ry: 4; }
    .bar-hi  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 4; ry: 4; }
    .bar-mid { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 4; ry: 4; }
    .label   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .sub     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .grid    { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>

  <text class="label" x="60" y="40" text-anchor="start">File F1 on VLoc Bench &mdash; 0 = no correct files, 1 = exact file set</text>

  <path class="grid" d="M 250 60 L 250 326" />
  <path class="grid" d="M 440 60 L 440 326" />
  <path class="grid" d="M 630 60 L 630 326" />
  <path class="grid" d="M 820 60 L 820 326" />

  <text class="label" x="60" y="86" text-anchor="start">Perfect localization (reference)</text>
  <rect class="bar-ref" x="60" y="96" width="760" height="40" />
  <text class="label" x="440" y="121" text-anchor="middle">1.000</text>

  <text class="label" x="60" y="176" text-anchor="start">Best evaluated system</text>
  <rect class="bar-hi" x="60" y="186" width="174" height="40" />
  <text class="label" x="248" y="211" text-anchor="start">0.229</text>

  <text class="label" x="60" y="266" text-anchor="start">Antares-3B (specialist)</text>
  <rect class="bar-mid" x="60" y="276" width="170" height="40" />
  <text class="label" x="244" y="301" text-anchor="start">0.223</text>

  <text class="sub" x="250" y="348" text-anchor="middle">0.25</text>
  <text class="sub" x="440" y="348" text-anchor="middle">0.50</text>
  <text class="sub" x="630" y="348" text-anchor="middle">0.75</text>
  <text class="sub" x="820" y="348" text-anchor="middle">1.00</text>

  <text class="sub" x="60" y="372" text-anchor="start">27 language models and 4 static-analysis tools, same prompt, same read-only tools, same command budget.</text>
  <text class="sub" x="60" y="390" text-anchor="start">On 38.4% of the 500 tasks, no evaluated model finds a single correct file.</text>
</svg>
