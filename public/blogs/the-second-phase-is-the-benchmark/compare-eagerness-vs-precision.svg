<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="et ed">
  <title id="et">What three scoring designs reward</title>
  <desc id="ed">Three columns — scoring only whether the agent finds the vulnerability, scoring finding and correct silence together in one number, and scoring them as two separately reported numbers — compared on how a flag-everything agent does, what the metric rewards, and whether the result tells you if the agent is deployable.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .rule   { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>

  <rect class="box" x="40" y="30" width="240" height="44" />
  <text class="label" x="160" y="58" text-anchor="middle">Score finding only</text>

  <rect class="adj" x="330" y="30" width="240" height="44" />
  <text class="label" x="450" y="58" text-anchor="middle">One blended number</text>

  <rect class="hero" x="620" y="30" width="240" height="44" />
  <text class="label-inv" x="740" y="58" text-anchor="middle">Two reported numbers</text>

  <path class="rule" d="M 40 94 L 860 94" />

  <text class="label" x="160" y="118" text-anchor="middle">Flag-everything wins</text>
  <text class="sub" x="160" y="138" text-anchor="middle">recall is free</text>
  <text class="label" x="450" y="118" text-anchor="middle">Flag-everything loses</text>
  <text class="sub" x="450" y="138" text-anchor="middle">but so does the honest gap</text>
  <text class="label" x="740" y="118" text-anchor="middle">Flag-everything loses</text>
  <text class="sub" x="740" y="138" text-anchor="middle">visibly, on the second axis</text>

  <path class="rule" d="M 40 158 L 860 158" />

  <text class="label" x="160" y="182" text-anchor="middle">Rewards eagerness</text>
  <text class="label" x="450" y="182" text-anchor="middle">Rewards a trade-off</text>
  <text class="sub" x="450" y="202" text-anchor="middle">you cannot read back out</text>
  <text class="label" x="740" y="182" text-anchor="middle">Rewards calibration</text>

  <path class="rule" d="M 40 222 L 860 222" />

  <text class="label" x="160" y="246" text-anchor="middle">Not deployable</text>
  <text class="label" x="450" y="246" text-anchor="middle">Unclear</text>
  <text class="label" x="740" y="246" text-anchor="middle">Answerable</text>

  <text class="sub" x="450" y="286" text-anchor="middle">A triage tool is deployable only if someone measured what it says when nothing is wrong.</text>
</svg>
