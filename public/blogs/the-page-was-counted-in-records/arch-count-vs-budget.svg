<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="pr2t pr2d">
  <title id="pr2t">A page bounded by record count against a page bounded by tokens</title>
  <desc id="pr2d">Two rows of the same five records, drawn with widths proportional to their size; the third record is very large. In the top row the server returns five records because the page size is five, and the page runs past the token budget line. In the bottom row the server adds records until the next one would cross the budget, stops after four, and returns a cursor so the fifth starts the next page.</desc>
  <style>
    .pr2-rec  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .pr2-big  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .pr2-out  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 4 3; }
    .pr2-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .pr2-bud  { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .pr2-hd   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .pr2-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .pr2-inv  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); }
    .pr2-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .pr2-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .pr2-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#pr2arr); }
  </style>
  <defs>
    <marker id="pr2arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <path class="pr2-bud" d="M 620 52 L 620 440" />
  <text class="pr2-mono" x="626" y="48">token budget</text>

  <text class="pr2-hd" x="40" y="88">Page by record count</text>
  <text class="pr2-mono" x="230" y="88">perPage = 5</text>
  <rect class="pr2-rec" x="40" y="110" width="56" height="56" />
  <rect class="pr2-rec" x="100" y="110" width="36" height="56" />
  <rect class="pr2-big" x="140" y="110" width="380" height="56" />
  <rect class="pr2-rec" x="524" y="110" width="48" height="56" />
  <rect class="pr2-out" x="576" y="110" width="220" height="56" />
  <text class="pr2-sub" x="40" y="190">records 1–5, whatever they weigh</text>
  <text class="pr2-lab" x="640" y="190">over budget</text>
  <text class="pr2-lab" x="330" y="143" text-anchor="middle">one 1 MB log</text>

  <text class="pr2-hd" x="40" y="300">Page by token budget</text>
  <text class="pr2-mono" x="230" y="300">stop before the next record crosses</text>
  <rect class="pr2-rec" x="40" y="322" width="56" height="56" />
  <rect class="pr2-rec" x="100" y="322" width="36" height="56" />
  <rect class="pr2-big" x="140" y="322" width="380" height="56" />
  <text class="pr2-lab" x="330" y="355" text-anchor="middle">the same 1 MB log</text>
  <rect class="pr2-rec" x="524" y="322" width="48" height="56" />
  <path class="pr2-arr" d="M 580 350 L 666 350" />
  <rect class="pr2-hero" x="670" y="326" width="160" height="48" rx="8" />
  <text class="pr2-inv" x="750" y="355" text-anchor="middle">nextCursor</text>
  <text class="pr2-sub" x="40" y="402">records 1–4; record 5 opens the next page</text>
  <text class="pr2-lab" x="670" y="402">truncated: true</text>
</svg>
