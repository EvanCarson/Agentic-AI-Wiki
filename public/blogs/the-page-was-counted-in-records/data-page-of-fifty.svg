<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="prt prd">
  <title id="prt">Tokens for one page of 50 GitHub project items</title>
  <desc id="prd">Two horizontal bars. With full objects, a page of 50 project items comes to about 128,750 tokens, far past Claude Code's 25,000-token default cap and its 10,000-token warning. With the minimal types added in PR #2563 the same page comes to about 9,010 tokens, under the warning line. The maintainers measured 5 live items, 12,875 against 901 tokens, and scaled the result to 50.</desc>
  <style>
    .pr-full { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .pr-min  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .pr-ref  { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 5 4; }
    .pr-grid { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .pr-axis { fill: none; stroke: var(--ink); stroke-width: 1.25; }
    .pr-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .pr-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .pr-val  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .pr-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>
  <text class="pr-ttl" x="20" y="28">Tokens for one page of 50 GitHub project items</text>

  <path class="pr-grid" d="M 400 80 L 400 300 M 600 80 L 600 300 M 800 80 L 800 300" />
  <path class="pr-ref" d="M 240 76 L 240 300 M 300 76 L 300 300" />
  <text class="pr-sub" x="234" y="66" text-anchor="end">Claude Code warns · 10k</text>
  <text class="pr-sub" x="306" y="66">default cap · 25k</text>

  <text class="pr-row" x="20" y="126">Full objects</text>
  <text class="pr-val" x="20" y="146">~128,750 tokens</text>
  <rect class="pr-full" x="200" y="110" width="515" height="40" />

  <text class="pr-row" x="20" y="226">Minimal types</text>
  <text class="pr-val" x="20" y="246">~9,010 tokens</text>
  <rect class="pr-min" x="200" y="210" width="36" height="40" />

  <path class="pr-axis" d="M 200 80 L 200 300 L 800 300" />
  <text class="pr-val" x="200" y="322" text-anchor="middle">0</text>
  <text class="pr-val" x="400" y="322" text-anchor="middle">50k</text>
  <text class="pr-val" x="600" y="322" text-anchor="middle">100k</text>
  <text class="pr-val" x="800" y="322" text-anchor="middle">150k</text>

  <text class="pr-sub" x="20" y="372">Measured on 5 live items (12,875 vs 901 tokens) and scaled to 50 by the maintainers · ~2,575 vs ~180 tokens per item</text>
</svg>
