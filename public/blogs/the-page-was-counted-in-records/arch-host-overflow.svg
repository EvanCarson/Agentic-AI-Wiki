<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="pr3t pr3d">
  <title id="pr3t">What six hosts do with the same oversized tool result</title>
  <desc id="pr3d">One oversized tools/call result fans out to six hosts. Claude Code saves results over its 25,000-token default to a file and puts the path in the conversation. claude.ai and Claude Desktop cap tool results at about 150,000 characters and do not document what happens past it. Codex CLI applies a token budget that can be set per MCP tool. Gemini CLI truncates at 40,000 characters by default. Cursor writes long output to a file the agent can read. VS Code truncates and points at a URI the agent cannot read.</desc>
  <style>
    .pr3-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .pr3-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .pr3-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .pr3-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink); }
    .pr3-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .pr3-invm { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); }
    .pr3-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; fill: var(--ink); opacity: .8; }
    .pr3-key  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .pr3-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#pr3arr); }
  </style>
  <defs>
    <marker id="pr3arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="pr3-hero" x="20" y="196" width="210" height="92" rx="8" />
  <text class="pr3-invm" x="36" y="228">tools/call</text>
  <text class="pr3-inv" x="36" y="250">one oversized result,</text>
  <text class="pr3-inv" x="36" y="270">no size field</text>

  <path class="pr3-arr" d="M 234 242 L 316 52" />
  <path class="pr3-arr" d="M 234 242 L 316 124" />
  <path class="pr3-arr" d="M 234 242 L 316 196" />
  <path class="pr3-arr" d="M 234 242 L 316 268" />
  <path class="pr3-arr" d="M 234 242 L 316 340" />
  <path class="pr3-arr" d="M 234 242 L 316 412" />

  <rect class="pr3-adj" x="320" y="24" width="560" height="56" rx="8" />
  <text class="pr3-lab" x="336" y="47">Claude Code</text>
  <text class="pr3-sub" x="336" y="67">over 25,000 tokens (or 50,000 characters): saved to a file, path in the message</text>

  <rect class="pr3-box" x="320" y="96" width="560" height="56" rx="8" />
  <text class="pr3-lab" x="336" y="119">claude.ai and Claude Desktop</text>
  <text class="pr3-sub" x="336" y="139">~150,000-character cap; what happens past it is not documented</text>

  <rect class="pr3-box" x="320" y="168" width="560" height="56" rx="8" />
  <text class="pr3-lab" x="336" y="191">Codex CLI</text>
  <text class="pr3-sub" x="336" y="211">token budget per output, settable per MCP tool; default not documented</text>

  <rect class="pr3-box" x="320" y="240" width="560" height="56" rx="8" />
  <text class="pr3-lab" x="336" y="263">Gemini CLI</text>
  <text class="pr3-sub" x="336" y="283">truncated at 40,000 characters by default</text>

  <rect class="pr3-adj" x="320" y="312" width="560" height="56" rx="8" />
  <text class="pr3-lab" x="336" y="335">Cursor</text>
  <text class="pr3-sub" x="336" y="355">written to a file the agent can read</text>

  <rect class="pr3-box" x="320" y="384" width="560" height="56" rx="8" />
  <text class="pr3-lab" x="336" y="407">VS Code Copilot</text>
  <text class="pr3-sub" x="336" y="427">truncated; the read-the-rest URI is refused as outside the workspace</text>

  <rect class="pr3-adj" x="320" y="462" width="14" height="14" />
  <text class="pr3-key" x="342" y="474">spills to a file</text>
  <rect class="pr3-box" x="470" y="462" width="14" height="14" />
  <text class="pr3-key" x="492" y="474">caps, truncates or leaves it undocumented</text>
</svg>
