<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of an Agent Plugin and how a client loads it</title>
  <desc id="d">A plugin directory containing plugin.json, a skills folder, an optional mcp.json and a namespaced extension directory. Arrows show a compatible client reading the manifest, discovering skills, and launching the configured MCP servers, which in turn reach real systems using the installer's credentials.</desc>
  <style>
    .box       { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero      { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj       { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .frame     { fill: none; stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; stroke-dasharray: 5 4; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink, #1a1a1a); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper, #fff); }
    .mono      { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink, #1a1a1a); }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .8; }
    .head      { font-family: var(--font-display); font-size: 14px; font-weight: 600; fill: currentColor; }
    .arrow     { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- The plugin directory -->
  <text class="head" x="40" y="42">The package (what v1.0 standardises)</text>
  <rect class="frame" x="34" y="56" width="290" height="290" rx="10" />

  <rect class="hero" x="54" y="80" width="250" height="52" rx="8" />
  <text class="mono" x="70" y="103" fill="var(--paper, #fff)">plugin.json</text>
  <text class="sub-inv" x="70" y="120">name, version, schema — the manifest</text>

  <rect class="adj" x="54" y="146" width="250" height="60" rx="8" />
  <text class="mono" x="70" y="169">skills/</text>
  <text class="sub" x="70" y="186">Instructions the model will follow.</text>
  <text class="sub" x="70" y="200">Text, loaded into context.</text>

  <rect class="adj" x="54" y="220" width="250" height="60" rx="8" />
  <text class="mono" x="70" y="243">mcp.json</text>
  <text class="sub" x="70" y="260">Servers the agent will launch.</text>
  <text class="sub" x="70" y="274">Code, with network and credentials.</text>

  <rect class="box" x="54" y="294" width="250" height="36" rx="8" />
  <text class="mono" x="70" y="317">&lt;namespace&gt;/</text>
  <text class="sub" x="196" y="317">client-specific, ignored by others</text>

  <!-- The client -->
  <text class="head" x="430" y="42">The client (defines everything else)</text>
  <rect class="frame" x="424" y="56" width="230" height="290" rx="10" />
  <rect class="box" x="444" y="80" width="190" height="46" rx="8" />
  <text class="label" x="460" y="108">Install &amp; distribution</text>
  <rect class="box" x="444" y="140" width="190" height="46" rx="8" />
  <text class="label" x="460" y="168">Permission model</text>
  <rect class="box" x="444" y="200" width="190" height="46" rx="8" />
  <text class="label" x="460" y="228">Sandboxing</text>
  <rect class="box" x="444" y="260" width="190" height="46" rx="8" />
  <text class="label" x="460" y="288">Trust &amp; provenance</text>

  <path class="arrow" d="M 310 106 L 438 103" />
  <path class="arrow" d="M 310 176 L 438 163" />
  <path class="arrow" d="M 310 250 L 438 223" />

  <!-- The agent and what it reaches -->
  <rect class="hero" x="700" y="140" width="164" height="66" rx="8" />
  <text class="label-inv" x="718" y="168">The agent loop</text>
  <text class="sub-inv" x="718" y="188">context + tools</text>

  <path class="arrow" d="M 660 173 L 694 173" />

  <rect class="box" x="700" y="252" width="164" height="54" rx="8" />
  <text class="label" x="718" y="275">Your systems</text>
  <text class="sub" x="718" y="293">reached on your credentials</text>

  <path class="arrow" d="M 782 212 L 782 246" />

  <!-- Bottom band: the gap -->
  <rect class="adj" x="34" y="390" width="830" height="76" rx="10" />
  <text class="head" x="56" y="418">What no layer owns yet</text>
  <text class="label" x="56" y="442">No signatures. No attestation back to a source repo. No capability declarations.</text>
  <text class="label" x="56" y="460">A plugin is trusted at the moment it is installed — by whichever client installed it.</text>
</svg>
