<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Who owns each concern under Agent Plugins 1.0</title>
  <desc id="d">A grid of six concerns against three owners. Packaging and discovery are settled by the specification. Install, distribution, permissions, sandboxing and approval UX are each left to the individual client. Provenance verification, capability declarations and audit trails are owned by nobody, and fall to the organisation installing the plugin.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-inv     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: start; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">Settled by the spec, deferred to the client, or left to you</text>

  <text class="col-head" x="405" y="62">Spec v1.0</text>
  <text class="col-head" x="565" y="62">Each client</text>
  <text class="col-head" x="725" y="62">You</text>

  <text class="row-head" x="310" y="97">Package layout</text>
  <rect class="card-accent" x="325" y="74" width="150" height="34" rx="6" />
  <text class="body-inv" x="400" y="96">Defined</text>
  <rect class="card-neutral" x="485" y="74" width="150" height="34" rx="6" />
  <text class="body-text" x="560" y="96">—</text>
  <rect class="card-neutral" x="645" y="74" width="150" height="34" rx="6" />
  <text class="body-text" x="720" y="96">—</text>

  <text class="row-head" x="310" y="141">Skill &amp; server discovery</text>
  <rect class="card-accent" x="325" y="118" width="150" height="34" rx="6" />
  <text class="body-inv" x="400" y="140">Defined</text>
  <rect class="card-neutral" x="485" y="118" width="150" height="34" rx="6" />
  <text class="body-text" x="560" y="140">—</text>
  <rect class="card-neutral" x="645" y="118" width="150" height="34" rx="6" />
  <text class="body-text" x="720" y="140">—</text>

  <text class="row-head" x="310" y="185">Install &amp; distribution</text>
  <rect class="card-neutral" x="325" y="162" width="150" height="34" rx="6" />
  <text class="body-text" x="400" y="184">Out of scope</text>
  <rect class="card-soft" x="485" y="162" width="150" height="34" rx="6" />
  <text class="body-text" x="560" y="184">Client's own</text>
  <rect class="card-neutral" x="645" y="162" width="150" height="34" rx="6" />
  <text class="body-text" x="720" y="184">—</text>

  <text class="row-head" x="310" y="229">Permissions &amp; approval</text>
  <rect class="card-neutral" x="325" y="206" width="150" height="34" rx="6" />
  <text class="body-text" x="400" y="228">Out of scope</text>
  <rect class="card-soft" x="485" y="206" width="150" height="34" rx="6" />
  <text class="body-text" x="560" y="228">Client's own</text>
  <rect class="card-soft" x="645" y="206" width="150" height="34" rx="6" />
  <text class="body-text" x="720" y="228">Policy on top</text>

  <text class="row-head" x="310" y="273">Sandboxing</text>
  <rect class="card-neutral" x="325" y="250" width="150" height="34" rx="6" />
  <text class="body-text" x="400" y="272">Out of scope</text>
  <rect class="card-soft" x="485" y="250" width="150" height="34" rx="6" />
  <text class="body-text" x="560" y="272">Client's own</text>
  <rect class="card-soft" x="645" y="250" width="150" height="34" rx="6" />
  <text class="body-text" x="720" y="272">Runtime isolation</text>

  <text class="row-head" x="310" y="317">Provenance &amp; signing</text>
  <rect class="card-neutral" x="325" y="294" width="150" height="34" rx="6" />
  <text class="body-text" x="400" y="316">Out of scope</text>
  <rect class="card-neutral" x="485" y="294" width="150" height="34" rx="6" />
  <text class="body-text" x="560" y="316">Undefined</text>
  <rect class="card-accent" x="645" y="294" width="150" height="34" rx="6" />
  <text class="body-inv" x="720" y="316">Entirely yours</text>

  <rect class="card-accent" x="120" y="352" width="14" height="14" rx="3" />
  <text class="legend-text" x="142" y="364">Owned and specified</text>
  <rect class="card-soft" x="330" y="352" width="14" height="14" rx="3" />
  <text class="legend-text" x="352" y="364">Owned, varies by implementation</text>
  <rect class="card-neutral" x="620" y="352" width="14" height="14" rx="3" />
  <text class="legend-text" x="642" y="364">Not addressed</text>
</svg>
