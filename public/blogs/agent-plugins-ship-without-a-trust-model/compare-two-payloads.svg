<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">The two payloads in a plugin carry different risks</title>
  <desc id="d">Three columns comparing the skills folder, the mcp.json server configuration, and the combination of both. Skills are instructions loaded into the model's context; mcp.json launches code with network access and credentials; together they let one bundle both instruct the agent and give it the reach to act on those instructions.</desc>
  <style>
    .col-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .body-text { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: currentColor; text-anchor: middle; }
    .body-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); text-anchor: middle; }
    .tag       { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .tag-inv   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card      { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .card-soft { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .card-hero { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
  </style>

  <rect class="card" x="30" y="40" width="260" height="220" rx="10" />
  <text class="tag" x="160" y="70">skills/</text>
  <text class="col-title" x="160" y="98">Instructions</text>
  <text class="body-text" x="160" y="130">Text the model reads and</text>
  <text class="body-text" x="160" y="148">follows as guidance.</text>
  <text class="body-text" x="160" y="180">Risk: it steers the agent</text>
  <text class="body-text" x="160" y="198">you already trusted.</text>
  <text class="body-text" x="160" y="230">Review surface: prose,</text>
  <text class="body-text" x="160" y="248">and nobody diffs prose.</text>

  <rect class="card-soft" x="320" y="40" width="260" height="220" rx="10" />
  <text class="tag" x="450" y="70">mcp.json</text>
  <text class="col-title" x="450" y="98">Reach</text>
  <text class="body-text" x="450" y="130">Servers the client launches</text>
  <text class="body-text" x="450" y="148">and connects tools from.</text>
  <text class="body-text" x="450" y="180">Risk: code, network egress,</text>
  <text class="body-text" x="450" y="198">and your credentials.</text>
  <text class="body-text" x="450" y="230">Review surface: a config</text>
  <text class="body-text" x="450" y="248">pointing at someone's binary.</text>

  <rect class="card-hero" x="610" y="40" width="260" height="220" rx="10" />
  <text class="tag-inv" x="740" y="70">one bundle</text>
  <text class="col-title" x="740" y="98" fill="var(--paper, #fff)">Both, together</text>
  <text class="body-inv" x="740" y="130">The thing that tells the agent</text>
  <text class="body-inv" x="740" y="148">what to do also supplies</text>
  <text class="body-inv" x="740" y="166">the means to do it.</text>
  <text class="body-inv" x="740" y="198">Installed once, portable</text>
  <text class="body-inv" x="740" y="216">across every client.</text>
  <text class="body-inv" x="740" y="248">One blast radius, not six.</text>
</svg>
