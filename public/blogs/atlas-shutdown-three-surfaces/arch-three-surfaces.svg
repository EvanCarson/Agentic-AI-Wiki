<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The three surfaces Atlas was split into</title>
  <desc id="d">Atlas bundled one binary. Its replacements are three surfaces that differ in whose authenticated session the agent borrows: a Chrome extension running inside the user's own logged-in browser, an in-app browser inside the ChatGPT desktop app holding its own cookie jar, and a cloud browser on the vendor's servers with no user session and a datacenter IP address.</desc>
  <style>
    .box     { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero    { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj     { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .head    { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .label   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper, #fff); text-anchor: middle; }
    .sub     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .68; text-anchor: middle; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .85; text-anchor: middle; }
    .arrow   { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .lane    { fill: none; stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; stroke-dasharray: 5 5; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="160" y="36">Extension</text>
  <text class="head" x="450" y="36">In-app browser</text>
  <text class="head" x="740" y="36">Cloud browser</text>

  <rect class="lane" x="34" y="52" width="252" height="330" rx="10" />
  <rect class="lane" x="324" y="52" width="252" height="330" rx="10" />
  <rect class="lane" x="614" y="52" width="252" height="330" rx="10" />

  <rect class="hero" x="60" y="80" width="200" height="66" rx="8" />
  <text class="label-inv" x="160" y="108">User's own Chrome</text>
  <text class="sub-inv"   x="160" y="127">every login they have</text>

  <rect class="adj" x="350" y="80" width="200" height="66" rx="8" />
  <text class="label" x="450" y="108">ChatGPT desktop app</text>
  <text class="sub"   x="450" y="127">its own cookie jar</text>

  <rect class="box" x="640" y="80" width="200" height="66" rx="8" />
  <text class="label" x="740" y="108">Vendor's servers</text>
  <text class="sub"   x="740" y="127">no session until you send one</text>

  <path class="arrow" d="M 160 150 L 160 196" />
  <path class="arrow" d="M 450 150 L 450 196" />
  <path class="arrow" d="M 740 150 L 740 196" />

  <rect class="box" x="60" y="200" width="200" height="70" rx="8" />
  <text class="label" x="160" y="228">Agent drives the tab</text>
  <text class="sub"   x="160" y="248">user is watching</text>

  <rect class="box" x="350" y="200" width="200" height="70" rx="8" />
  <text class="label" x="450" y="228">Agent drives the tab</text>
  <text class="sub"   x="450" y="248">user logs in once, here</text>

  <rect class="box" x="640" y="200" width="200" height="70" rx="8" />
  <text class="label" x="740" y="228">Agent runs unattended</text>
  <text class="sub"   x="740" y="248">nobody is watching</text>

  <path class="arrow" d="M 160 274 L 160 320" />
  <path class="arrow" d="M 450 274 L 450 320" />
  <path class="arrow" d="M 740 274 L 740 320" />

  <rect class="hero" x="60" y="324" width="200" height="44" rx="8" />
  <text class="label-inv" x="160" y="351">Blast radius: everything</text>

  <rect class="adj" x="350" y="324" width="200" height="44" rx="8" />
  <text class="label" x="450" y="351">Blast radius: what you added</text>

  <rect class="box" x="640" y="324" width="200" height="44" rx="8" />
  <text class="label" x="740" y="351">Blast radius: what you sent</text>

  <path class="arrow" d="M 160 372 C 160 410 380 404 430 424" />
  <path class="arrow" d="M 450 372 L 450 424" />
  <path class="arrow" d="M 740 372 C 740 410 520 404 470 424" />

  <rect class="box" x="330" y="428" width="240" height="48" rx="8" />
  <text class="label" x="450" y="458">The open web, unchanged</text>
</svg>
