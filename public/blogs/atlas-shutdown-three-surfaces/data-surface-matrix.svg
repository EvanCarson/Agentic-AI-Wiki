<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">The three surfaces compared on the axes that decide the architecture</title>
  <desc id="d">A three-by-five grid comparing a browser extension, an in-app browser and a server-side cloud browser on whose cookies the agent uses, what a prompt injection can reach, what the visited site sees, whether the agent can run unattended, and how a user revokes it. The extension is the most capable and the most dangerous; the cloud browser is the safest and the most likely to be blocked.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: start; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">Whose session, and what it costs you</text>

  <text class="body-text" x="238" y="58" style="font-weight:600">Whose cookies</text>
  <text class="body-text" x="238" y="72" style="font-weight:600">it uses</text>
  <text class="body-text" x="378" y="58" style="font-weight:600">What an injection</text>
  <text class="body-text" x="378" y="72" style="font-weight:600">can reach</text>
  <text class="body-text" x="518" y="58" style="font-weight:600">What the site</text>
  <text class="body-text" x="518" y="72" style="font-weight:600">sees</text>
  <text class="body-text" x="658" y="58" style="font-weight:600">Runs</text>
  <text class="body-text" x="658" y="72" style="font-weight:600">unattended</text>
  <text class="body-text" x="798" y="58" style="font-weight:600">How a user</text>
  <text class="body-text" x="798" y="72" style="font-weight:600">revokes it</text>

  <!-- Row 1: extension -->
  <text class="row-head" x="154" y="118">Browser extension</text>
  <rect class="card-accent" x="171" y="88" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="238" y="113">The user's own,</text>
  <text class="body-text-inv" x="238" y="127">all of them</text>
  <rect class="card-accent" x="311" y="88" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="378" y="113">Every tab the</text>
  <text class="body-text-inv" x="378" y="127">user is logged into</text>
  <rect class="card-neutral" x="451" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="518" y="113">A normal user,</text>
  <text class="body-text" x="518" y="127">home IP</text>
  <rect class="card-neutral" x="591" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="658" y="113">Only while the</text>
  <text class="body-text" x="658" y="127">machine is awake</text>
  <rect class="card-neutral" x="731" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="798" y="118">Uninstall it</text>

  <!-- Row 2: in-app browser -->
  <text class="row-head" x="154" y="198">In-app browser</text>
  <rect class="card-soft" x="171" y="168" width="134" height="52" rx="6" />
  <text class="body-text" x="238" y="193">The app's own</text>
  <text class="body-text" x="238" y="207">cookie jar</text>
  <rect class="card-soft" x="311" y="168" width="134" height="52" rx="6" />
  <text class="body-text" x="378" y="193">Only sites you</text>
  <text class="body-text" x="378" y="207">logged into here</text>
  <rect class="card-neutral" x="451" y="168" width="134" height="52" rx="6" />
  <text class="body-text" x="518" y="193">A normal user,</text>
  <text class="body-text" x="518" y="207">home IP</text>
  <rect class="card-soft" x="591" y="168" width="134" height="52" rx="6" />
  <text class="body-text" x="658" y="193">While the app</text>
  <text class="body-text" x="658" y="207">is running</text>
  <rect class="card-soft" x="731" y="168" width="134" height="52" rx="6" />
  <text class="body-text" x="798" y="193">Clear the jar,</text>
  <text class="body-text" x="798" y="207">per site</text>

  <!-- Row 3: cloud browser -->
  <text class="row-head" x="154" y="278">Cloud browser</text>
  <rect class="card-neutral" x="171" y="248" width="134" height="52" rx="6" />
  <text class="body-text" x="238" y="273">None, unless you</text>
  <text class="body-text" x="238" y="287">ship credentials</text>
  <rect class="card-neutral" x="311" y="248" width="134" height="52" rx="6" />
  <text class="body-text" x="378" y="273">Only what that</text>
  <text class="body-text" x="378" y="287">session holds</text>
  <rect class="card-accent" x="451" y="248" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="518" y="273">A datacenter IP</text>
  <text class="body-text-inv" x="518" y="287">and a bot check</text>
  <rect class="card-accent" x="591" y="248" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="658" y="273">Yes — that is</text>
  <text class="body-text-inv" x="658" y="287">the whole point</text>
  <rect class="card-soft" x="731" y="248" width="134" height="52" rx="6" />
  <text class="body-text" x="798" y="273">Rotate the</text>
  <text class="body-text" x="798" y="287">credential</text>

  <rect class="card-accent" x="171" y="340" width="18" height="18" rx="4" />
  <text class="legend-text" x="197" y="354">Where this surface is decisive, for good or ill</text>
  <rect class="card-soft" x="561" y="340" width="18" height="18" rx="4" />
  <text class="legend-text" x="587" y="354">Middle ground</text>
  <rect class="card-neutral" x="731" y="340" width="18" height="18" rx="4" />
  <text class="legend-text" x="757" y="354">Unremarkable</text>
</svg>
