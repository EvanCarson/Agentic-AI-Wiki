<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">What shipping a browser costs against what a browser agent needs</title>
  <desc id="d">The left panel lists the obligations that come with shipping a consumer browser: tab and window UI, a password manager, autofill, profile sync, an auto-updater, a continuous Chromium security patch cadence, and a separate port for every platform. The right panel lists what a browser agent actually requires: an authenticated session, programmatic control of the page, and somewhere to run. Only the third item overlaps.</desc>
  <style>
    .box     { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero    { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj     { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .panel   { fill: none; stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; stroke-dasharray: 5 5; }
    .head    { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .item    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .item-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper, #fff); text-anchor: middle; }
    .note    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .65; text-anchor: middle; }
    .arrow   { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="panel" x="30" y="52" width="386" height="416" rx="10" />
  <text class="head" x="223" y="36">What shipping a browser obliges you to</text>

  <rect class="box" x="58" y="74" width="330" height="40" rx="7" />
  <text class="item" x="223" y="99">Tabs, windows, history, bookmarks</text>
  <rect class="box" x="58" y="122" width="330" height="40" rx="7" />
  <text class="item" x="223" y="147">A password manager people trust</text>
  <rect class="box" x="58" y="170" width="330" height="40" rx="7" />
  <text class="item" x="223" y="195">Autofill that works on real checkout forms</text>
  <rect class="box" x="58" y="218" width="330" height="40" rx="7" />
  <text class="item" x="223" y="243">Profile sync and an auto-updater</text>
  <rect class="hero" x="58" y="266" width="330" height="40" rx="7" />
  <text class="item-inv" x="223" y="291">A Chromium CVE patch cadence, forever</text>
  <rect class="hero" x="58" y="314" width="330" height="56" rx="7" />
  <text class="item-inv" x="223" y="336">A separate port per platform</text>
  <text class="item-inv" x="223" y="354" style="font-size:11px;opacity:.85">Windows, iOS, Android — none in nine months</text>
  <text class="note" x="223" y="400">None of this is the agent.</text>
  <text class="note" x="223" y="420">All of it is table stakes for a browser.</text>

  <path class="arrow" d="M 424 260 L 476 260" />

  <rect class="panel" x="484" y="52" width="386" height="416" rx="10" />
  <text class="head" x="677" y="36">What the agent actually needed</text>

  <rect class="adj" x="512" y="128" width="330" height="56" rx="7" />
  <text class="item" x="677" y="152">An already-authenticated session</text>
  <text class="item" x="677" y="171" style="font-size:11px;opacity:.7">the part a login wall makes expensive</text>

  <rect class="adj" x="512" y="204" width="330" height="56" rx="7" />
  <text class="item" x="677" y="228">Programmatic read and write of the page</text>
  <text class="item" x="677" y="247" style="font-size:11px;opacity:.7">DOM or pixels, either works</text>

  <rect class="adj" x="512" y="280" width="330" height="56" rx="7" />
  <text class="item" x="677" y="304">Somewhere to run</text>
  <text class="item" x="677" y="323" style="font-size:11px;opacity:.7">an extension, an app, or a server</text>

  <text class="note" x="677" y="400">Three requirements, all satisfiable</text>
  <text class="note" x="677" y="420">without owning a browser.</text>
</svg>
