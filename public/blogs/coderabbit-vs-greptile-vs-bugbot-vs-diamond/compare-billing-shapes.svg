<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three billing shapes for AI code review</title>
  <desc id="d">Three columns comparing billing shapes. A seat with a review cap makes the cap the real product and pushes teams to ration which repositories and developers are wired up. Per-review billing makes every pull request an explicit purchase and pushes teams to gate by branch or size. Bundling into a platform hides the price entirely and ties the choice of reviewer to a choice of pull-request workflow. None of the three prices the comment, which is where developer time actually goes.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
  </style>

  <rect class="box" x="24" y="36" width="266" height="212" />
  <text class="head" x="44" y="66">Seat with a cap</text>
  <text class="sub" x="44" y="100">CodeRabbit, Greptile</text>
  <text class="sub" x="44" y="124">marginal review is free</text>
  <text class="sub" x="44" y="148">until it is impossible</text>
  <line x1="44" y1="172" x2="270" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="44" y="196">YOU END UP TUNING</text>
  <text class="label" x="44" y="220">who gets a seat</text>

  <rect class="adj" x="314" y="36" width="266" height="212" />
  <text class="head" x="334" y="66">Per review</text>
  <text class="sub" x="334" y="100">Bugbot, Greptile overage</text>
  <text class="sub" x="334" y="124">every PR is a purchase</text>
  <text class="sub" x="334" y="148">cheap when volume is low</text>
  <line x1="334" y1="172" x2="560" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="334" y="196">YOU END UP TUNING</text>
  <text class="label" x="334" y="220">which PRs are skipped</text>

  <rect class="box" x="604" y="36" width="266" height="212" />
  <text class="head" x="624" y="66">Bundled</text>
  <text class="sub" x="624" y="100">Diamond, via Graphite</text>
  <text class="sub" x="624" y="124">no separate line item</text>
  <text class="sub" x="624" y="148">reviewer follows workflow</text>
  <line x1="624" y1="172" x2="850" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="624" y="196">YOU END UP TUNING</text>
  <text class="label" x="624" y="220">nothing, and choosing less</text>

  <rect class="hero" x="24" y="262" width="846" height="26" />
  <text class="label-inv" x="44" y="280">Unpriced by all three: the developer seconds each comment consumes.</text>
</svg>
