<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where the cost of a review bot actually lands</title>
  <desc id="d">Diagram. A pull request enters the reviewer, which emits comments. Two cost sinks follow. The vendor invoice is small and metered, billed per seat or per review. The developer attention cost is large and unmetered: every comment is read and triaged, and a dismissed comment still costs the reading. A feedback loop runs from a rising dismissal rate to skimming, then to ignoring the bot, then to switching it off.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .arrow-soft { fill: none; stroke: currentColor; stroke-width: 1.25; opacity: .5; stroke-dasharray: 4 4; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="box" x="30" y="52" width="180" height="70" />
  <text class="head" x="50" y="82">Pull request</text>
  <text class="sub" x="50" y="104">human or agent authored</text>

  <path class="arrow" d="M 210 87 L 288 87" />

  <rect class="adj" x="292" y="42" width="200" height="90" />
  <text class="head" x="312" y="72">Reviewer</text>
  <text class="sub" x="312" y="94">indexes, ranks, emits</text>
  <text class="sub" x="312" y="114">n comments per PR</text>

  <path class="arrow" d="M 392 132 L 392 178" />
  <path class="arrow" d="M 492 87 L 646 87" />

  <rect class="box" x="650" y="42" width="220" height="90" />
  <text class="head" x="670" y="72">Vendor invoice</text>
  <text class="sub" x="670" y="94">per seat or per review</text>
  <text class="tag" x="670" y="118">METERED, SMALL</text>

  <rect class="hero" x="252" y="182" width="280" height="112" />
  <text class="head-inv" x="272" y="212">Developer attention</text>
  <text class="sub-inv" x="272" y="236">every comment is read</text>
  <text class="sub-inv" x="272" y="258">before it can be dismissed</text>
  <text class="tag" x="272" y="282" fill="var(--paper)" opacity=".85">UNMETERED, LARGE</text>

  <path class="arrow" d="M 532 238 L 610 238" />

  <rect class="box" x="614" y="182" width="256" height="112" />
  <text class="head" x="634" y="212">Two outcomes</text>
  <text class="sub" x="634" y="236">acted on — the thing you bought</text>
  <text class="sub" x="634" y="258">dismissed — paid for, no value</text>
  <text class="tag" x="634" y="282">RATIO IS THE HEALTH SIGNAL</text>

  <path class="arrow-soft" d="M 742 294 L 742 340 L 470 340" />

  <rect class="box" x="150" y="352" width="600" height="112" />
  <text class="head" x="170" y="382">The collapse, in order</text>
  <text class="sub" x="170" y="408">dismissal rate rises  →  reviewers skim  →  comments go unread</text>
  <text class="sub" x="170" y="430">→  a senior engineer stops looking  →  the bot is switched off</text>
  <text class="tag" x="170" y="454">MISSED BUGS STOP MATTERING ONCE NOBODY READS THE CAUGHT ONES</text>
</svg>
