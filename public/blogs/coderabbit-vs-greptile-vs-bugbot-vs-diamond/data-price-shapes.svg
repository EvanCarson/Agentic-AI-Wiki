<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Monthly cost per developer against review volume</title>
  <desc id="d">Line chart plotting monthly cost per developer against reviews per developer per month, using August 2026 list prices. CodeRabbit is flat at twenty-four dollars. Greptile is flat at thirty dollars up to fifty reviews and then rises by one dollar per review. Bugbot starts at zero and rises by about one dollar twenty-five per review, crossing CodeRabbit at roughly nineteen reviews and Greptile at roughly twenty-four. Diamond is not plotted because it carries no separate price.</desc>
  <style>
    .grid   { stroke: var(--ink); stroke-width: 1; opacity: .12; stroke-dasharray: 3 4; }
    .axis   { stroke: var(--ink); stroke-width: 1.25; opacity: .5; }
    .lineA  { fill: none; stroke: var(--ink); stroke-width: 2; opacity: .55; }
    .lineB  { fill: none; stroke: var(--accent-soft); stroke-width: 3; }
    .lineC  { fill: none; stroke: var(--accent, #d4421e); stroke-width: 3; }
    .title  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .tick   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .mark   { fill: var(--accent, #d4421e); }
  </style>

  <text class="title" x="24" y="32">Cost per developer per month, by review volume</text>
  <text class="sub" x="24" y="52">August 2026 list prices; Diamond has no separate price and is not plotted.</text>

  <line class="grid" x1="90" y1="330" x2="860" y2="330" />
  <line class="grid" x1="90" y1="262" x2="860" y2="262" />
  <line class="grid" x1="90" y1="195" x2="860" y2="195" />
  <line class="grid" x1="90" y1="128" x2="860" y2="128" />
  <line class="grid" x1="90" y1="60" x2="860" y2="60" />

  <text class="tick" x="52" y="334">$0</text>
  <text class="tick" x="46" y="266">$20</text>
  <text class="tick" x="46" y="199">$40</text>
  <text class="tick" x="46" y="132">$60</text>
  <text class="tick" x="46" y="64">$80</text>

  <line class="axis" x1="90" y1="60" x2="90" y2="330" />
  <line class="axis" x1="90" y1="330" x2="860" y2="330" />

  <text class="tick" x="84" y="350">0</text>
  <text class="tick" x="338" y="350">20</text>
  <text class="tick" x="594" y="350">40</text>
  <text class="tick" x="851" y="350">60</text>
  <text class="sub" x="600" y="374">reviews per developer per month</text>

  <polyline class="lineC" points="90,330 860,77" />
  <polyline class="lineB" points="90,229 732,229 860,195" />
  <polyline class="lineA" points="90,249 860,249" />

  <circle class="mark" cx="336" cy="249" r="4" />
  <circle class="mark" cx="398" cy="229" r="4" />

  <text class="label" x="700" y="112">Bugbot — usage</text>
  <text class="label" x="700" y="186">Greptile — seat + $1</text>
  <text class="label" x="700" y="266">CodeRabbit — seat</text>

  <text class="sub" x="150" y="286">crossovers at ~19 and ~24 reviews</text>
  <line class="axis" x1="146" y1="282" x2="336" y2="254" opacity=".3" />
</svg>
