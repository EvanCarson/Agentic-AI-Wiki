<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="swt swd">
  <title id="swt">Which questions a synthetic web answers and which the live web answers</title>
  <desc id="swd">Four questions about a browser-use agent scored against two test surfaces. Did this build get worse than the last one is answered well by a synthetic web and badly by the live web. Is this failure attributable to one cause is answered well by the synthetic web and poorly by the live web. Does this payload class work at all is partly answered by both. What is the production pass rate against real pages is answered only by the live web and not at all by a synthetic one.</desc>
  <style>
    .sw-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .sw-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .sw-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .sw-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .sw-col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .sw-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .sw-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .sw-cellin { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sw-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="sw-ttl" x="20" y="30">What each test surface can tell you</text>

  <text class="sw-col" x="530" y="66" text-anchor="middle">SYNTHETIC WEB</text>
  <text class="sw-col" x="770" y="66" text-anchor="middle">THE LIVE WEB</text>

  <text class="sw-row" x="20" y="105">Did this build regress</text>
  <rect class="sw-strong" x="430" y="84" width="200" height="34" />
  <text class="sw-cellin" x="530" y="105" text-anchor="middle">Yes, cleanly</text>
  <rect class="sw-weak" x="670" y="84" width="200" height="34" />
  <text class="sw-cell" x="770" y="105" text-anchor="middle">Drowned in noise</text>

  <text class="sw-row" x="20" y="165">Is the failure attributable</text>
  <rect class="sw-strong" x="430" y="144" width="200" height="34" />
  <text class="sw-cellin" x="530" y="165" text-anchor="middle">Yes, header toggle</text>
  <rect class="sw-weak" x="670" y="144" width="200" height="34" />
  <text class="sw-cell" x="770" y="165" text-anchor="middle">Rarely</text>

  <text class="sw-row" x="20" y="225">Does this payload class work</text>
  <rect class="sw-med" x="430" y="204" width="200" height="34" />
  <text class="sw-cell" x="530" y="225" text-anchor="middle">For what you imagined</text>
  <rect class="sw-med" x="670" y="204" width="200" height="34" />
  <text class="sw-cell" x="770" y="225" text-anchor="middle">For what you survive</text>

  <text class="sw-row" x="20" y="285">Production pass rate</text>
  <rect class="sw-weak" x="430" y="264" width="200" height="34" />
  <text class="sw-cell" x="530" y="285" text-anchor="middle">No</text>
  <rect class="sw-strong" x="670" y="264" width="200" height="34" />
  <text class="sw-cellin" x="770" y="285" text-anchor="middle">Only here</text>

  <text class="sw-leg" x="20" y="330">The one row a synthetic web cannot fill is the only row a safety claim rests on.</text>

  <rect class="sw-weak" x="20" y="361" width="16" height="13" />
  <text class="sw-leg" x="46" y="372">cannot answer</text>
  <rect class="sw-med" x="190" y="361" width="16" height="13" />
  <text class="sw-leg" x="216" y="372">partly</text>
  <rect class="sw-strong" x="340" y="361" width="16" height="13" />
  <text class="sw-leg" x="366" y="372">answers it well</text>
</svg>
