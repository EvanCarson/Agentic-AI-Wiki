<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="mdt mdd">
  <title id="mdt">How a synthetic web is generated and then served to the agent under test</title>
  <desc id="mdd">On the left, a three-agent harness builds the test corpus: a research agent charts user journeys, a builder agent writes the HTML, CSS and JavaScript, and a critic agent inspects the result. The corpus feeds a local proxy that serves the generated pages under real hostnames and mints its own TLS certificates from a custom root CA. Headless Chrome, sealed in a gVisor sandbox, drives each run from an identical clean start. Injection payloads live in the page text, images, ARIA labels and tool responses, and are switched on per run by an HTTP header, so the attack and the control are the same page.</desc>
  <style>
    .md-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .md-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .md-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .md-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .md-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .md-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); }
    .md-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .md-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .md-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#mdarr); }
  </style>
  <defs>
    <marker id="mdarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="md-ttl" x="20" y="28">Agents write the world the agent is tested in</text>

  <text class="md-sub" x="20" y="56">generation harness</text>

  <rect class="md-adj" x="20" y="68" width="200" height="48" rx="8" />
  <text class="md-lbl" x="34" y="97">research agent, journeys</text>

  <path class="md-arr" d="M 120 122 L 120 154" />

  <rect class="md-adj" x="20" y="160" width="200" height="48" rx="8" />
  <text class="md-lbl" x="34" y="189">builder agent, the code</text>

  <path class="md-arr" d="M 120 214 L 120 246" />

  <rect class="md-adj" x="20" y="252" width="200" height="48" rx="8" />
  <text class="md-lbl" x="34" y="281">critic agent, inspection</text>

  <path class="md-arr" d="M 226 276 L 290 276" />

  <rect class="md-box" x="296" y="236" width="220" height="80" rx="8" />
  <text class="md-lbl" x="310" y="263">site corpus</text>
  <text class="md-sub" x="310" y="283">carts, feeds, dashboards</text>
  <text class="md-sub" x="310" y="302">payloads in text and labels</text>

  <path class="md-arr" d="M 406 230 L 406 186" />

  <rect class="md-box" x="296" y="106" width="220" height="74" rx="8" />
  <text class="md-lbl" x="310" y="132">local proxy</text>
  <text class="md-sub" x="310" y="152">real hostnames, fake pages</text>
  <text class="md-sub" x="310" y="171">its own root CA, no warnings</text>

  <path class="md-arr" d="M 522 143 L 586 143" />

  <rect class="md-hero" x="592" y="106" width="288" height="74" rx="8" />
  <text class="md-inv" x="606" y="132">headless Chrome in gVisor</text>
  <text class="md-inv" x="606" y="152">identical clean start per run</text>
  <text class="md-inv" x="606" y="171">no side effect survives the run</text>

  <path class="md-arr" d="M 736 186 L 736 246" />

  <rect class="md-box" x="592" y="252" width="288" height="64" rx="8" />
  <text class="md-lbl" x="606" y="278">the agent under test</text>
  <text class="md-sub" x="606" y="299">screenshots, clicks, typing, navigation</text>

  <rect class="md-box" x="296" y="372" width="584" height="100" rx="8" />
  <text class="md-lbl" x="310" y="398">one HTTP header decides whether the page attacks</text>
  <text class="md-sub" x="310" y="420">attack run and control run are byte-identical except for the header</text>
  <text class="md-sub" x="310" y="440">so a failure is attributable to the payload and not to the page</text>
  <text class="md-sub" x="310" y="460">and the agent has no cue that this trajectory is the measured one</text>

</svg>
