<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="wmt wmd">
  <title id="wmt">Three outcomes and what each one tells you</title>
  <desc id="wmd">A three by three matrix. Ignored: counted as a defence by attack success rate, invisible to refusal monitoring, and tells you nothing about the instruction boundary. Genuine refusal: counted as a defence, visible to refusal monitoring, and tells you the boundary held. Recognised then complied: not counted as a defence, visible in the trace, and tells you the boundary is absent. Legend: informative about the boundary, not informative.</desc>
  <style>
    .wm-yes { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .wm-no  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .wm-ttl { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wm-col { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .wm-row { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wm-cel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .wm-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .wm-leg { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
  </style>

  <text class="wm-ttl" x="20" y="34">What each outcome is worth</text>

  <text class="wm-col" x="330" y="76" text-anchor="middle">Scored as a defence?</text>
  <text class="wm-col" x="550" y="76" text-anchor="middle">Visible to monitoring?</text>
  <text class="wm-col" x="770" y="76" text-anchor="middle">What it tells you</text>

  <text class="wm-row" x="20" y="123">Ignored</text>
  <rect class="wm-no" x="230" y="94" width="200" height="48" />
  <text class="wm-cel" x="330" y="123" text-anchor="middle">Yes</text>
  <rect class="wm-no" x="450" y="94" width="200" height="48" />
  <text class="wm-cel" x="550" y="123" text-anchor="middle">No</text>
  <rect class="wm-no" x="670" y="94" width="200" height="48" />
  <text class="wm-cel" x="770" y="123" text-anchor="middle">Nothing about the boundary</text>

  <text class="wm-row" x="20" y="195">Genuine refusal</text>
  <rect class="wm-yes" x="230" y="166" width="200" height="48" />
  <text class="wm-inv" x="330" y="195" text-anchor="middle">Yes</text>
  <rect class="wm-yes" x="450" y="166" width="200" height="48" />
  <text class="wm-inv" x="550" y="195" text-anchor="middle">Yes</text>
  <rect class="wm-yes" x="670" y="166" width="200" height="48" />
  <text class="wm-inv" x="770" y="195" text-anchor="middle">The boundary held</text>

  <text class="wm-row" x="20" y="267">Recognised, complied</text>
  <rect class="wm-yes" x="230" y="238" width="200" height="48" />
  <text class="wm-inv" x="330" y="267" text-anchor="middle">No</text>
  <rect class="wm-yes" x="450" y="238" width="200" height="48" />
  <text class="wm-inv" x="550" y="267" text-anchor="middle">Yes, in the trace</text>
  <rect class="wm-yes" x="670" y="238" width="200" height="48" />
  <text class="wm-inv" x="770" y="267" text-anchor="middle">The boundary is absent</text>

  <rect class="wm-yes" x="20" y="340" width="18" height="14" />
  <text class="wm-leg" x="48" y="352">Informative</text>
  <rect class="wm-no" x="280" y="340" width="18" height="14" />
  <text class="wm-leg" x="308" y="352">Not informative</text>
</svg>
