<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ost osd">
  <title id="ost">What happened in the injections that did not succeed</title>
  <desc id="osd">Two stacked bars, each covering the attacks that failed. On InjecAgent, 76.3 percent were ignored by the agent, 18.0 percent were genuine refusals, and 5.7 percent fell into other failure categories. On AgentDojo, 80.3 percent were ignored, 17.2 percent were genuine refusals, and 2.5 percent were other failures. Both bars are dominated by the ignored segment, which an attack-success-rate metric counts as a defence.</desc>
  <style>
    .os-ign { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .os-ref { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .os-oth { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .os-ttl { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .os-row { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .os-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .os-in  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .os-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .os-leg { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
  </style>

  <text class="os-ttl" x="20" y="34">Share of failed injections, by outcome</text>
  <text class="os-sub" x="20" y="56">Eleven open-weight agents, 2 to 14B parameters, about 33,000 audited trajectories</text>

  <text class="os-row" x="20" y="152">InjecAgent</text>
  <rect class="os-ign" x="230" y="124" width="488" height="48" />
  <text class="os-in" x="474" y="152" text-anchor="middle">Ignored 76.3%</text>
  <rect class="os-ref" x="718" y="124" width="115" height="48" />
  <text class="os-inv" x="775" y="152" text-anchor="middle">18.0%</text>
  <rect class="os-oth" x="833" y="124" width="37" height="48" />

  <text class="os-row" x="20" y="234">AgentDojo</text>
  <rect class="os-ign" x="230" y="206" width="514" height="48" />
  <text class="os-in" x="487" y="234" text-anchor="middle">Ignored 80.3%</text>
  <rect class="os-ref" x="744" y="206" width="110" height="48" />
  <text class="os-inv" x="799" y="234" text-anchor="middle">17.2%</text>
  <rect class="os-oth" x="854" y="206" width="16" height="48" />

  <rect class="os-ign" x="20" y="320" width="18" height="14" />
  <text class="os-leg" x="48" y="332">Ignored</text>
  <rect class="os-ref" x="240" y="320" width="18" height="14" />
  <text class="os-leg" x="268" y="332">Genuine refusal</text>
  <rect class="os-oth" x="470" y="320" width="18" height="14" />
  <text class="os-leg" x="498" y="332">Other failure</text>

</svg>
