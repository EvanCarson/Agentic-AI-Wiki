<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Gateway take per one thousand completed tasks, by calls per task</title>
  <desc id="d">Four horizontal bars showing what a five percent gateway take rate collects per thousand completed tasks, assuming four cents of model spend per call. A chat assistant making one call per action yields two dollars; a retrieval-augmented answer at four calls yields eight; an agent task at twenty-five calls yields fifty; an agent run that failed and retried at sixty calls yields one hundred and twenty. The same rate collects sixty times more from the run that produced nothing.</desc>
  <style>
    .lead   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .rest   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .rowlab { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .rowsub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .axis   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .grid   { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 2 4; }
  </style>

  <text class="head" x="24" y="30">Gateway take per 1,000 completed tasks, at a 5% rate</text>
  <text class="sub" x="24" y="50">illustrative, assuming $0.04 of model spend per call</text>

  <line class="grid" x1="300" y1="76" x2="300" y2="348" />
  <line class="grid" x1="438" y1="76" x2="438" y2="348" />
  <line class="grid" x1="575" y1="76" x2="575" y2="348" />
  <line class="grid" x1="713" y1="76" x2="713" y2="348" />
  <line class="grid" x1="850" y1="76" x2="850" y2="348" />
  <text class="axis" x="294" y="368">$0</text>
  <text class="axis" x="428" y="368">$30</text>
  <text class="axis" x="565" y="368">$60</text>
  <text class="axis" x="703" y="368">$90</text>
  <text class="axis" x="838" y="368">$120</text>

  <text class="rowlab" x="24" y="116">Chat assistant</text>
  <text class="rowsub" x="24" y="134">1 call per user action</text>
  <rect class="rest" x="300" y="98" width="9" height="40" />
  <text class="val" x="319" y="124">$2</text>

  <text class="rowlab" x="24" y="180">Retrieval-augmented answer</text>
  <text class="rowsub" x="24" y="198">4 calls</text>
  <rect class="rest" x="300" y="162" width="37" height="40" />
  <text class="val" x="347" y="188">$8</text>

  <text class="rowlab" x="24" y="244">Agent completing a task</text>
  <text class="rowsub" x="24" y="262">25 calls</text>
  <rect class="mid" x="300" y="226" width="229" height="40" />
  <text class="val" x="539" y="252">$50</text>

  <text class="rowlab" x="24" y="308">Agent that failed and retried</text>
  <text class="rowsub" x="24" y="326">60 calls, nothing delivered</text>
  <rect class="lead" x="300" y="290" width="550" height="40" />
  <text class="val" x="860" y="316">$120</text>
</svg>
