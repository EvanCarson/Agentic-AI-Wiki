<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three placements for the same five gateway jobs</title>
  <desc id="d">Three columns. An in-path gateway gives you routing, failover, caching, policy and metering in one purchase, at the cost of an added availability dependency, added per-call latency and a percentage of spend. Direct provider calls with a separate meter give you attribution and budgets with no added hop, but you keep your own failover and caching. A self-built proxy gives you full control and no take rate, at the cost of normalising every provider's usage reporting forever.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
  </style>

  <rect class="hero" x="24" y="36" width="266" height="212" />
  <text class="head-inv" x="44" y="66">Gateway in the path</text>
  <text class="sub-inv" x="44" y="100">routing, failover, caching</text>
  <text class="sub-inv" x="44" y="124">policy and metering included</text>
  <text class="sub-inv" x="44" y="148">one integration, many providers</text>
  <line x1="44" y1="172" x2="270" y2="172" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag" x="44" y="196" fill="var(--paper)" opacity=".85">WHAT IT COSTS</text>
  <text class="label-inv" x="44" y="220">an availability dependency, per-step fee</text>

  <rect class="adj" x="314" y="36" width="266" height="212" />
  <text class="head" x="334" y="66">Direct calls, meter beside</text>
  <text class="sub" x="334" y="100">attribution and budgets</text>
  <text class="sub" x="334" y="124">no added hop, no take rate</text>
  <text class="sub" x="334" y="148">reads the traces you already emit</text>
  <line x1="334" y1="172" x2="560" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="334" y="196">WHAT IT COSTS</text>
  <text class="label" x="334" y="220">you keep failover and caching</text>

  <rect class="box" x="604" y="36" width="266" height="212" />
  <text class="head" x="624" y="66">Proxy you build</text>
  <text class="sub" x="624" y="100">full control of the path</text>
  <text class="sub" x="624" y="124">keys and policy stay in-house</text>
  <text class="sub" x="624" y="148">no percentage on spend</text>
  <line x1="624" y1="172" x2="850" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="624" y="196">WHAT IT COSTS</text>
  <text class="label" x="624" y="220">normalising every provider, forever</text>
</svg>
