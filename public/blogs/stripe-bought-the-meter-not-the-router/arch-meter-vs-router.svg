<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The router in the request path, the meter beside it</title>
  <desc id="d">Two panes. On the left, the request path: an agent loop calls an AI gateway, which routes to several model providers, and the hop costs added latency, a multiplied availability risk and a percentage of spend. On the right, the control plane: a meter that normalises usage per run and per tenant, fed either by the gateway or directly by the application's own OpenTelemetry traces, and producing cost joined to outcome, budgets that can refuse a call, and an invoice.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pane   { fill: none; stroke: var(--ink); stroke-width: 1.25; opacity: .35; rx: 10; ry: 10; stroke-dasharray: 5 5; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
    .arrow-d{ fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 4 4; marker-end: url(#arr2); }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="pane" x="20" y="20" width="460" height="460" />
  <text class="head" x="42" y="50">Request path</text>

  <rect class="box" x="42" y="70" width="416" height="46" />
  <text class="label" x="60" y="99">Agent loop — 10 to 40 model calls per task</text>

  <path class="arrow" d="M 250 118 L 250 136" />

  <rect class="hero" x="42" y="138" width="416" height="66" />
  <text class="label-inv" x="60" y="165">AI gateway</text>
  <text class="sub-inv" x="60" y="188">routing · failover · key custody · caching · policy</text>

  <path class="arrow" d="M 250 206 L 250 218" />
  <line x1="108" y1="220" x2="392" y2="220" stroke="currentColor" stroke-width="1.25" />
  <path class="arrow" d="M 108 220 L 108 234" />
  <path class="arrow" d="M 250 220 L 250 234" />
  <path class="arrow" d="M 392 220 L 392 234" />

  <rect class="box" x="42" y="236" width="132" height="48" />
  <text class="label" x="58" y="265">Provider A</text>
  <rect class="box" x="184" y="236" width="132" height="48" />
  <text class="label" x="200" y="265">Provider B</text>
  <rect class="box" x="326" y="236" width="132" height="48" />
  <text class="label" x="342" y="265">Provider C</text>

  <rect class="box" x="42" y="330" width="416" height="126" />
  <text class="tag" x="60" y="356">WHAT THE HOP COSTS</text>
  <text class="label" x="60" y="384">10–50 ms added per call, not per task</text>
  <text class="label" x="60" y="410">99.9% × 99.9% ≈ 99.8% availability</text>
  <text class="label" x="60" y="436">a percentage of every token you spend</text>

  <rect class="pane" x="500" y="20" width="380" height="460" />
  <text class="head" x="522" y="50">Control plane</text>

  <rect class="adj" x="522" y="138" width="336" height="66" />
  <text class="label" x="540" y="165">The meter</text>
  <text class="sub" x="540" y="188">normalised usage · per run · per tenant</text>

  <path class="arrow-d" d="M 460 170 L 518 170" />

  <rect class="box" x="522" y="240" width="336" height="58" />
  <text class="label" x="540" y="266">Direct calls, your own traces</text>
  <text class="sub" x="540" y="286">OpenTelemetry GenAI conventions · no hop</text>

  <path class="arrow-d" d="M 690 238 L 690 208" />

  <rect class="box" x="522" y="330" width="336" height="126" />
  <text class="tag" x="540" y="356">WHAT THE LEDGER PRODUCES</text>
  <text class="label" x="540" y="384">cost per run, joined to the outcome</text>
  <text class="label" x="540" y="410">budgets that can refuse the next call</text>
  <text class="label" x="540" y="436">one invoice finance can reconcile</text>
</svg>
