<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="wsT wsD">
  <title id="wsT">What each control can enumerate, and what it is blind to</title>
  <desc id="wsD">Three columns. Pre-deployment review enumerates components submitted to a registry and is blind to anything installed from elsewhere. The endpoint sensor enumerates processes on managed Windows and macOS machines, including dormant ones, and is blind to agents that run off the endpoint entirely. The inline context firewall enumerates the skills, plugins and MCP servers on traffic routed through it, and is blind to any agent configured to talk directly to a model provider.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .92; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Enumerates / blind to</text>

  <rect class="hero" x="35" y="48" width="250" height="96" />
  <text class="hd-inv" x="160" y="76" text-anchor="middle">Pre-deployment review</text>
  <text class="cell-inv" x="160" y="100" text-anchor="middle">Components submitted to</text>
  <text class="cell-inv" x="160" y="116" text-anchor="middle">one registry, inspected</text>
  <text class="cell-inv" x="160" y="132" text-anchor="middle">before anyone installs.</text>

  <rect class="hero" x="325" y="48" width="250" height="96" />
  <text class="hd-inv" x="450" y="76" text-anchor="middle">Endpoint sensor</text>
  <text class="cell-inv" x="450" y="100" text-anchor="middle">Running and dormant</text>
  <text class="cell-inv" x="450" y="116" text-anchor="middle">agents on managed</text>
  <text class="cell-inv" x="450" y="132" text-anchor="middle">Windows and macOS.</text>

  <rect class="hero" x="625" y="48" width="250" height="96" />
  <text class="hd-inv" x="750" y="76" text-anchor="middle">Inline context firewall</text>
  <text class="cell-inv" x="750" y="100" text-anchor="middle">Skills, plugins and MCP</text>
  <text class="cell-inv" x="750" y="116" text-anchor="middle">servers on traffic that</text>
  <text class="cell-inv" x="750" y="132" text-anchor="middle">routes through it.</text>

  <text class="lane" x="160" y="176" text-anchor="middle">Blind to</text>
  <text class="lane" x="450" y="176" text-anchor="middle">Blind to</text>
  <text class="lane" x="750" y="176" text-anchor="middle">Blind to</text>

  <rect class="box" x="35" y="186" width="250" height="80" />
  <text class="cell" x="160" y="212" text-anchor="middle">Anything installed from</text>
  <text class="cell" x="160" y="232" text-anchor="middle">a repo, a gist, a vendor</text>
  <text class="cell" x="160" y="252" text-anchor="middle">bundle or an employee.</text>

  <rect class="box" x="325" y="186" width="250" height="80" />
  <text class="cell" x="450" y="212" text-anchor="middle">Every agent that never</text>
  <text class="cell" x="450" y="232" text-anchor="middle">touches an endpoint:</text>
  <text class="cell" x="450" y="252" text-anchor="middle">SaaS, CI, cloud, mobile.</text>

  <rect class="box" x="625" y="186" width="250" height="80" />
  <text class="cell" x="750" y="212" text-anchor="middle">Any agent pointed</text>
  <text class="cell" x="750" y="232" text-anchor="middle">straight at a provider</text>
  <text class="cell" x="750" y="252" text-anchor="middle">with a personal key.</text>
</svg>
