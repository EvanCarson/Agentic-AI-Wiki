<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="ipT ipD">
  <title id="ipT">Three instrumentation points on the path an agent takes</title>
  <desc id="ipD">A left-to-right path: a component source such as a registry or marketplace, installation on a host, the running agent process that assembles context, the tool calls it makes to MCP servers and APIs, and the systems of record it finally touches. Three controls attach at three different points — a pre-deployment review at the component source, an endpoint sensor at the host, and an inline firewall at the boundary where instructions, tools and data enter the agent's context. Beneath the path sits a wide band showing the agents none of the three observe: a workflow inside a SaaS product, an agent in a CI runner, one in a personal cloud account, and a browser extension in an unmanaged profile.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .7; }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .8; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .9; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#ipArr); }
    .dash   { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; opacity: .55; marker-end: url(#ipArr); }
  </style>
  <defs>
    <marker id="ipArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="20">Where each control attaches</text>

  <text class="lane" x="0" y="52">The path an agent takes</text>

  <rect class="box" x="0" y="66" width="158" height="84" />
  <text class="hd" x="79" y="96" text-anchor="middle">Component source</text>
  <text class="cell" x="79" y="118" text-anchor="middle">Registry, marketplace,</text>
  <text class="cell" x="79" y="134" text-anchor="middle">repo, skill file.</text>

  <path class="arrow" d="M 163 108 L 180 108" />
  <rect class="adj" x="185" y="66" width="158" height="84" />
  <text class="hd" x="264" y="96" text-anchor="middle">Install on a host</text>
  <text class="cell" x="264" y="118" text-anchor="middle">User space, running as</text>
  <text class="cell" x="264" y="134" text-anchor="middle">the user, no admin step.</text>

  <path class="arrow" d="M 348 108 L 365 108" />
  <rect class="hero" x="370" y="66" width="158" height="84" />
  <text class="hd-inv" x="449" y="96" text-anchor="middle">Agent process</text>
  <text class="cell-inv" x="449" y="118" text-anchor="middle">Assembles context,</text>
  <text class="cell-inv" x="449" y="134" text-anchor="middle">decides, calls tools.</text>

  <path class="arrow" d="M 533 108 L 550 108" />
  <rect class="box" x="555" y="66" width="158" height="84" />
  <text class="hd" x="634" y="96" text-anchor="middle">Tool calls</text>
  <text class="cell" x="634" y="118" text-anchor="middle">MCP servers, APIs,</text>
  <text class="cell" x="634" y="134" text-anchor="middle">shell, browser.</text>

  <path class="arrow" d="M 718 108 L 735 108" />
  <rect class="box" x="740" y="66" width="158" height="84" />
  <text class="hd" x="819" y="96" text-anchor="middle">Systems of record</text>
  <text class="cell" x="819" y="118" text-anchor="middle">Data, money, identity,</text>
  <text class="cell" x="819" y="134" text-anchor="middle">production config.</text>

  <path class="dash" d="M 79 212 L 79 156" />
  <path class="dash" d="M 264 212 L 264 156" />
  <path class="dash" d="M 541 212 L 541 156" />

  <rect class="adj" x="0" y="216" width="158" height="76" />
  <text class="hd" x="79" y="242" text-anchor="middle">Pre-deployment</text>
  <text class="cell" x="79" y="262" text-anchor="middle">Review before anyone</text>
  <text class="cell" x="79" y="278" text-anchor="middle">installs it.</text>

  <rect class="adj" x="185" y="216" width="158" height="76" />
  <text class="hd" x="264" y="242" text-anchor="middle">Endpoint sensor</text>
  <text class="cell" x="264" y="262" text-anchor="middle">Enumerates what is</text>
  <text class="cell" x="264" y="278" text-anchor="middle">actually running.</text>

  <rect class="adj" x="441" y="216" width="200" height="76" />
  <text class="hd" x="541" y="242" text-anchor="middle">Inline context firewall</text>
  <text class="cell" x="541" y="262" text-anchor="middle">Screens instructions, tools</text>
  <text class="cell" x="541" y="278" text-anchor="middle">and data on the way in.</text>

  <text class="sub" x="0" y="326">Each control is complete about the point it sits on, and silent about every agent that never passes it.</text>

  <rect class="box" x="0" y="344" width="898" height="112" />
  <text class="lane" x="24" y="374">Outside all three</text>
  <text class="hd" x="24" y="402">A workflow inside a SaaS product</text>
  <text class="hd" x="470" y="402">An agent in a CI runner</text>
  <text class="hd" x="24" y="430">A container in a personal cloud account</text>
  <text class="hd" x="470" y="430">A browser extension, unmanaged profile</text>

  <text class="sub" x="0" y="486">The register that governance frameworks assume is authoritative; every line above produces an estimate.</text>
</svg>
