<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="cmT cmD">
  <title id="cmT">Coverage matrix: enumeration, runtime behaviour, enforcement and reach beyond the endpoint</title>
  <desc id="cmD">A four-by-four matrix. Rows are a self-service registry, pre-deployment review, an endpoint sensor, and an inline context firewall. Columns are how well each enumerates what exists, whether it observes runtime behaviour, whether it can block, and whether it reaches agents that never run on a managed endpoint. The self-service registry is weak on enumeration because registration is voluntary, sees no runtime behaviour and blocks nothing, but nominally covers every environment. Pre-deployment review is medium on enumeration within its own catalogue, sees no runtime behaviour, gates admission rather than execution, and is environment-neutral. The endpoint sensor is strong on enumeration and runtime behaviour and can block execution, but reaches nothing off the endpoint. The inline firewall is medium on enumeration, strong on runtime behaviour and blocking for traffic it sees, and reaches whatever is routed through it.</desc>
  <style>
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hdr    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .weak   { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; rx: 6; ry: 6; }
    .med    { fill: var(--accent-soft); stroke: var(--border-soft); stroke-width: 1; rx: 6; ry: 6; }
    .strong { fill: var(--accent, #d4421e); stroke: none; rx: 6; ry: 6; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">What each layer can actually answer</text>

  <text class="hdr" x="292" y="52" text-anchor="middle">Enumerates</text>
  <text class="hdr" x="292" y="68" text-anchor="middle">what exists</text>
  <text class="hdr" x="457" y="52" text-anchor="middle">Sees runtime</text>
  <text class="hdr" x="457" y="68" text-anchor="middle">behaviour</text>
  <text class="hdr" x="622" y="52" text-anchor="middle">Can stop</text>
  <text class="hdr" x="622" y="68" text-anchor="middle">an agent</text>
  <text class="hdr" x="787" y="52" text-anchor="middle">Reaches beyond</text>
  <text class="hdr" x="787" y="68" text-anchor="middle">the endpoint</text>

  <text class="lbl" x="0" y="114">Self-service registry</text>
  <rect class="weak" x="215" y="88" width="155" height="42" />
  <text class="cell" x="292" y="114" text-anchor="middle">Voluntary</text>
  <rect class="weak" x="380" y="88" width="155" height="42" />
  <text class="cell" x="457" y="114" text-anchor="middle">None</text>
  <rect class="weak" x="545" y="88" width="155" height="42" />
  <text class="cell" x="622" y="114" text-anchor="middle">No</text>
  <rect class="med" x="710" y="88" width="155" height="42" />
  <text class="cell" x="787" y="114" text-anchor="middle">In principle</text>

  <text class="lbl" x="0" y="184">Pre-deployment review</text>
  <rect class="med" x="215" y="158" width="155" height="42" />
  <text class="cell" x="292" y="184" text-anchor="middle">Its catalogue only</text>
  <rect class="weak" x="380" y="158" width="155" height="42" />
  <text class="cell" x="457" y="184" text-anchor="middle">None</text>
  <rect class="med" x="545" y="158" width="155" height="42" />
  <text class="cell" x="622" y="184" text-anchor="middle">Gates admission</text>
  <rect class="med" x="710" y="158" width="155" height="42" />
  <text class="cell" x="787" y="184" text-anchor="middle">Environment-neutral</text>

  <text class="lbl" x="0" y="254">Endpoint sensor</text>
  <rect class="strong" x="215" y="228" width="155" height="42" />
  <text class="cell-inv" x="292" y="254" text-anchor="middle">Running + dormant</text>
  <rect class="strong" x="380" y="228" width="155" height="42" />
  <text class="cell-inv" x="457" y="254" text-anchor="middle">Prompt to action</text>
  <rect class="strong" x="545" y="228" width="155" height="42" />
  <text class="cell-inv" x="622" y="254" text-anchor="middle">Blocks execution</text>
  <rect class="weak" x="710" y="228" width="155" height="42" />
  <text class="cell" x="787" y="254" text-anchor="middle">No</text>

  <text class="lbl" x="0" y="324">Inline context firewall</text>
  <rect class="med" x="215" y="298" width="155" height="42" />
  <text class="cell" x="292" y="324" text-anchor="middle">What routes through</text>
  <rect class="strong" x="380" y="298" width="155" height="42" />
  <text class="cell-inv" x="457" y="324" text-anchor="middle">Context contents</text>
  <rect class="strong" x="545" y="298" width="155" height="42" />
  <text class="cell-inv" x="622" y="324" text-anchor="middle">Blocks in path</text>
  <rect class="med" x="710" y="298" width="155" height="42" />
  <text class="cell" x="787" y="324" text-anchor="middle">If routed</text>

  <rect class="strong" x="0" y="366" width="14" height="14" />
  <text class="sub" x="22" y="378">Strong</text>
  <rect class="med" x="80" y="366" width="14" height="14" />
  <text class="sub" x="102" y="378">Partial</text>
  <rect class="weak" x="160" y="366" width="14" height="14" />
  <text class="sub" x="182" y="378">Weak or absent</text>
</svg>
