<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The same model produces different agentic scores through different harnesses</title>
  <desc id="d">Two stacked paths from one set of model weights to a published benchmark number. In the upper path the weights run inside the lab's own unreleased harness — its context management, tool schemas, retry and test-feedback loop — and produce the vendor-reported score. In the lower path the same weights run inside a public harness a third party can install, producing a different, reproducible number. Only the second path can be replicated outside the lab.</desc>
  <style>
    .box     { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero    { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj     { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); text-anchor: middle; }
    .sub     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; text-anchor: middle; }
    .lane    { font-family: var(--font-display); font-size: 14px; font-weight: 600; fill: currentColor; }
    .arrow   { fill: none; stroke: currentColor; stroke-width: 1.4; marker-end: url(#arr); }
    .prose   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .8; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="lane" x="24" y="30">Lab harness — the scaffold ships later, or not at all</text>

  <rect class="hero" x="24" y="48" width="150" height="66" />
  <text class="label-inv" x="99" y="76">Model weights</text>
  <text class="label-inv" x="99" y="95">one checkpoint</text>

  <rect class="adj" x="220" y="48" width="238" height="66" />
  <text class="label" x="339" y="72">In-house harness</text>
  <text class="sub" x="339" y="90">context mgmt · tool schemas</text>
  <text class="sub" x="339" y="105">retries · test feedback</text>

  <rect class="box" x="504" y="48" width="160" height="66" />
  <text class="label" x="584" y="76">Benchmark tasks</text>
  <text class="sub" x="584" y="95">agentic, multi-step</text>

  <rect class="hero" x="710" y="48" width="166" height="66" />
  <text class="label-inv" x="793" y="76">Published score</text>
  <text class="label-inv" x="793" y="95">vendor-reported</text>

  <path class="arrow" d="M 174 81 L 216 81" />
  <path class="arrow" d="M 458 81 L 500 81" />
  <path class="arrow" d="M 664 81 L 706 81" />

  <text class="prose" x="24" y="146">The harness is doing real work here — how much context is kept, how a failing test is fed back, how many attempts a task gets.</text>
  <text class="prose" x="24" y="164">While it stays unreleased, nobody outside the lab can reproduce the number or separate the model's contribution from the scaffold's.</text>

  <line x1="24" y1="196" x2="876" y2="196" stroke="currentColor" stroke-width="1" opacity=".25" />

  <text class="lane" x="24" y="232">Public harness — the scaffold is a dependency you can pin</text>

  <rect class="hero" x="24" y="250" width="150" height="66" />
  <text class="label-inv" x="99" y="278">Model weights</text>
  <text class="label-inv" x="99" y="297">same checkpoint</text>

  <rect class="box" x="220" y="250" width="238" height="66" />
  <text class="label" x="339" y="274">Named harness, version</text>
  <text class="sub" x="339" y="292">installable · configurable</text>
  <text class="sub" x="339" y="307">settings published with the run</text>

  <rect class="box" x="504" y="250" width="160" height="66" />
  <text class="label" x="584" y="278">Benchmark tasks</text>
  <text class="sub" x="584" y="297">same task set</text>

  <rect class="adj" x="710" y="250" width="166" height="66" />
  <text class="label" x="793" y="278">Reproducible score</text>
  <text class="sub" x="793" y="297">model × harness, stated</text>

  <path class="arrow" d="M 174 283 L 216 283" />
  <path class="arrow" d="M 458 283 L 500 283" />
  <path class="arrow" d="M 664 283 L 706 283" />

  <text class="prose" x="24" y="348">Same weights, same tasks, different number — and the difference is not noise. Holding the harness fixed is the only way</text>
  <text class="prose" x="24" y="366">a comparison across models means anything, which is why the harness belongs in the citation next to the model name.</text>

  <rect class="box" x="24" y="400" width="852" height="72" />
  <text class="label" x="450" y="428">A published agentic score is a claim about a pair</text>
  <text class="sub" x="450" y="452">When one half of the pair is unavailable, the score is a system result reported by its own author — not a model measurement.</text>
</svg>
