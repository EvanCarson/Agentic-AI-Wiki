<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three ownership positions for the agent harness</title>
  <desc id="d">Five properties compared across three positions: the lab ships weights only, the lab ships weights plus its own harness, and the harness comes from an independent third party. The properties are reproducibility of published scores, who tunes the scaffold to the model, switching cost between models, where improvement work accrues, and what a benchmark number actually measures.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-head { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cv     { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink); text-anchor: middle; }
    .cv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--paper); text-anchor: middle; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="chart-title" x="450" y="22">Whoever owns the harness owns the number</text>

  <text class="col-head" x="418" y="50">Weights only</text>
  <text class="col-head" x="576" y="50">Lab ships harness</text>
  <text class="col-head" x="778" y="50">Independent harness</text>

  <text class="row-head" x="24" y="79">Score reproducible outside</text>
  <rect class="mid" x="340" y="60" width="156" height="26" rx="5" /><text class="cv" x="418" y="79">If harness named</text>
  <rect class="weak" x="504" y="60" width="144" height="26" rx="5" /><text class="cv" x="576" y="79">Only once released</text>
  <rect class="strong" x="656" y="60" width="220" height="26" rx="5" /><text class="cv-inv" x="766" y="79">Yes — pin a version</text>

  <text class="row-head" x="24" y="113">Scaffold tuned to the model</text>
  <rect class="weak" x="340" y="94" width="156" height="26" rx="5" /><text class="cv" x="418" y="113">Not by the lab</text>
  <rect class="strong" x="504" y="94" width="144" height="26" rx="5" /><text class="cv-inv" x="576" y="113">Tightly</text>
  <rect class="mid" x="656" y="94" width="220" height="26" rx="5" /><text class="cv" x="766" y="113">Generically, across models</text>

  <text class="row-head" x="24" y="147">Cost of switching model</text>
  <rect class="mid" x="340" y="128" width="156" height="26" rx="5" /><text class="cv" x="418" y="147">Your integration</text>
  <rect class="weak" x="504" y="128" width="144" height="26" rx="5" /><text class="cv" x="576" y="147">High — rebuild loop</text>
  <rect class="strong" x="656" y="128" width="220" height="26" rx="5" /><text class="cv-inv" x="766" y="147">Low — swap the endpoint</text>

  <text class="row-head" x="24" y="181">Where the gains accrue</text>
  <rect class="weak" x="340" y="162" width="156" height="26" rx="5" /><text class="cv" x="418" y="181">Nowhere in particular</text>
  <rect class="strong" x="504" y="162" width="144" height="26" rx="5" /><text class="cv-inv" x="576" y="181">To one lab</text>
  <rect class="mid" x="656" y="162" width="220" height="26" rx="5" /><text class="cv" x="766" y="181">To every model it supports</text>

  <text class="row-head" x="24" y="215">What the number measures</text>
  <rect class="mid" x="340" y="196" width="156" height="26" rx="5" /><text class="cv" x="418" y="215">Model, loosely</text>
  <rect class="weak" x="504" y="196" width="144" height="26" rx="5" /><text class="cv" x="576" y="215">The pair, unstated</text>
  <rect class="strong" x="656" y="196" width="220" height="26" rx="5" /><text class="cv-inv" x="766" y="215">The pair, stated</text>

  <text class="note" x="24" y="256">The middle column is where the frontier is heading, and it is the only one where a buyer cannot check the claim.</text>
  <text class="note" x="24" y="278">Nothing here says an in-house harness is wrong to build — it says the score it produces needs the scaffold published alongside it.</text>
</svg>
