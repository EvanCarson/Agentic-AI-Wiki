<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="wt wd">
  <title id="wt">Which party can revoke, log and detect</title>
  <desc id="wd">Three rows, one per party, against three capabilities. The customer can revoke at the provider but holds no usage log and learns of the exposure only by email. The agent vendor knows first but can neither revoke nor log. The model provider can revoke and holds the authoritative log but does not know the key leaked until someone tells it. No single row carries all three.</desc>
  <style>
    .wh-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .wh-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .wh-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .wh-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wh-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wh-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .wh-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .wh-sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>
  <text class="wh-ttl" x="20" y="28">Who can revoke it, who can see it, who knows</text>
  <text class="wh-sub" x="310" y="58" text-anchor="middle">can invalidate the key</text>
  <text class="wh-sub" x="540" y="58" text-anchor="middle">holds the usage log</text>
  <text class="wh-sub" x="770" y="58" text-anchor="middle">knows it leaked</text>

  <text class="wh-row" x="20" y="104">You</text>
  <rect class="wh-strong" x="200" y="80" width="220" height="36" />
  <text class="wh-inv" x="310" y="104" text-anchor="middle">yes, at the provider</text>
  <rect class="wh-weak" x="430" y="80" width="220" height="36" />
  <text class="wh-cell" x="540" y="104" text-anchor="middle">no</text>
  <rect class="wh-mid" x="660" y="80" width="220" height="36" />
  <text class="wh-cell" x="770" y="104" text-anchor="middle">only once emailed</text>

  <text class="wh-row" x="20" y="154">The agent vendor</text>
  <rect class="wh-weak" x="200" y="130" width="220" height="36" />
  <text class="wh-cell" x="310" y="154" text-anchor="middle">no</text>
  <rect class="wh-weak" x="430" y="130" width="220" height="36" />
  <text class="wh-cell" x="540" y="154" text-anchor="middle">no</text>
  <rect class="wh-strong" x="660" y="130" width="220" height="36" />
  <text class="wh-inv" x="770" y="154" text-anchor="middle">yes, first</text>

  <text class="wh-row" x="20" y="204">The model provider</text>
  <rect class="wh-strong" x="200" y="180" width="220" height="36" />
  <text class="wh-inv" x="310" y="204" text-anchor="middle">yes</text>
  <rect class="wh-strong" x="430" y="180" width="220" height="36" />
  <text class="wh-inv" x="540" y="204" text-anchor="middle">yes, authoritative</text>
  <rect class="wh-weak" x="660" y="180" width="220" height="36" />
  <text class="wh-cell" x="770" y="204" text-anchor="middle">not until told</text>

  <text class="wh-sub" x="20" y="266">Accent is a capability the party actually holds, the lighter tint is partial, plain is absent.</text>
  <text class="wh-sub" x="20" y="292">Every row is missing something another row has, so the incident is actionable inside nobody's own systems.</text>
  <text class="wh-sub" x="20" y="318">An owned gateway collapses all three onto the top row, because a credential you mint is one you can invalidate.</text>
</svg>
