<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="ct cd">
  <title id="ct">Custody and revocation in a bring-your-own-key integration</title>
  <desc id="cd">Four rows. The first traces the key from the provider that issued it, through the customer pasting it into a vendor console, to the stored copy sitting in the legacy system that was exposed. The second row shows that deleting the saved key removes only the copy and leaves the credential valid. The third shows that revoking it in the provider's console destroys the grant and stops every copy. The fourth shows the attacker's traffic running from their own machine to the provider endpoint and onto the customer's invoice, never crossing the customer's network.</desc>
  <style>
    .box     { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero    { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj     { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .label   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .inv     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .arrow   { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#ckarr); }
  </style>
  <defs>
    <marker id="ckarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="30" y="28">How the key got out</text>
  <rect class="hero" x="30" y="44" width="185" height="56" />
  <text class="inv" x="122" y="78" text-anchor="middle">Provider issues key</text>
  <path class="arrow" d="M 219 72 L 241 72" />
  <rect class="box" x="245" y="44" width="185" height="56" />
  <text class="label" x="337" y="78" text-anchor="middle">You paste it in</text>
  <path class="arrow" d="M 434 72 L 456 72" />
  <rect class="box" x="460" y="44" width="185" height="56" />
  <text class="label" x="552" y="78" text-anchor="middle">Console saves a copy</text>
  <path class="arrow" d="M 649 72 L 671 72" />
  <rect class="adj" x="675" y="44" width="185" height="56" />
  <text class="label" x="767" y="78" text-anchor="middle">Legacy system read</text>

  <text class="head" x="30" y="150">Deleting it in the console</text>
  <rect class="box" x="30" y="166" width="250" height="56" />
  <text class="label" x="155" y="200" text-anchor="middle">Delete the saved key</text>
  <path class="arrow" d="M 284 194 L 326 194" />
  <rect class="box" x="330" y="166" width="250" height="56" />
  <text class="label" x="455" y="200" text-anchor="middle">The copy is gone</text>
  <path class="arrow" d="M 584 194 L 626 194" />
  <rect class="box" x="630" y="166" width="230" height="56" />
  <text class="label" x="745" y="200" text-anchor="middle">The key still works</text>

  <text class="head" x="30" y="272">Revoking it at the provider</text>
  <rect class="adj" x="30" y="288" width="250" height="56" />
  <text class="label" x="155" y="322" text-anchor="middle">Revoke in provider console</text>
  <path class="arrow" d="M 284 316 L 326 316" />
  <rect class="hero" x="330" y="288" width="250" height="56" />
  <text class="inv" x="455" y="322" text-anchor="middle">The grant is destroyed</text>
  <path class="arrow" d="M 584 316 L 626 316" />
  <rect class="hero" x="630" y="288" width="230" height="56" />
  <text class="inv" x="745" y="322" text-anchor="middle">Every copy stops</text>

  <text class="head" x="30" y="394">Where the attacker's traffic goes</text>
  <rect class="box" x="30" y="410" width="250" height="56" />
  <text class="label" x="155" y="444" text-anchor="middle">Attacker's machine</text>
  <path class="arrow" d="M 284 438 L 326 438" />
  <rect class="box" x="330" y="410" width="250" height="56" />
  <text class="label" x="455" y="444" text-anchor="middle">Provider endpoint</text>
  <path class="arrow" d="M 584 438 L 626 438" />
  <rect class="hero" x="630" y="410" width="230" height="56" />
  <text class="inv" x="745" y="444" text-anchor="middle">Your invoice</text>

  <text class="sub" x="30" y="488">No step in the bottom row passes through anything you operate, log or rate-limit.</text>
</svg>
