<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Agent coverage</title>
  <desc id="d">Which coding agents each tracker can read: ccusage covers Claude Code and Codex among 15 CLIs, codex-usage-tracker covers Codex only, CodeBurn covers 25 agents, and a LiteLLM proxy covers anything you can re-point.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="28">Coverage — which agents each tracker reads</text>

  <!-- Column 1: ccusage — soft -->
  <rect class="card-soft" x="10" y="44" width="210" height="240" rx="8" />
  <text class="col-head" x="115" y="104">ccusage</text>
  <text class="body-text" x="115" y="140">Claude Code + Codex</text>
  <text class="body-text" x="115" y="158">first-class</text>
  <text class="body-text" x="115" y="176">15 CLIs total</text>
  <text class="body-text" x="115" y="194">no Cursor / Aider</text>

  <!-- Column 2: codex-usage-tracker — neutral -->
  <rect class="card-neutral" x="230" y="44" width="210" height="240" rx="8" />
  <text class="col-head" x="335" y="104">codex-usage-tracker</text>
  <text class="body-text" x="335" y="149">Codex CLI only</text>
  <text class="body-text" x="335" y="167">purpose-built</text>
  <text class="body-text" x="335" y="185">(narrowest)</text>

  <!-- Column 3: CodeBurn — accent -->
  <rect class="card-accent" x="450" y="44" width="210" height="240" rx="8" />
  <text class="col-head-inv" x="555" y="104">CodeBurn</text>
  <text class="body-text-inv" x="555" y="131">25 agents</text>
  <text class="body-text-inv" x="555" y="149">Cursor · Gemini · Warp</text>
  <text class="body-text-inv" x="555" y="167">Forge · Copilot ·</text>
  <text class="body-text-inv" x="555" y="185">Claude Code · Codex</text>
  <text class="body-text-inv" x="555" y="203">(no Aider)</text>

  <!-- Column 4: LiteLLM proxy — soft -->
  <rect class="card-soft" x="670" y="44" width="220" height="240" rx="8" />
  <text class="col-head" x="780" y="104">LiteLLM proxy</text>
  <text class="body-text" x="780" y="140">anything re-pointable</text>
  <text class="body-text" x="780" y="158">Aider · Claude Code</text>
  <text class="body-text" x="780" y="176">Codex</text>
  <text class="body-text" x="780" y="194">(Cursor: BYOK only)</text>

</svg>
