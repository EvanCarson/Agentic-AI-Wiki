<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Four agents, four trails, four trackers</title>
  <desc id="d">Each coding agent leaves a different telemetry trail on disk, and the shape of the tracker is dictated by that trail: Claude Code writes JSONL transcripts read by ccusage, Codex writes JSONL token-count events indexed by codex-usage-tracker, Cursor writes a SQLite store read by CodeBurn, and Aider leaves only a prose log so a LiteLLM proxy meters its live API traffic instead.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .head  { font-family: 'Fraunces', serif; font-size: 14px; font-weight: 600; fill: currentColor; opacity: .8; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .dash  { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
    .foot  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Column headers -->
  <text class="head" x="130" y="42" text-anchor="middle">The agent</text>
  <text class="head" x="455" y="42" text-anchor="middle">The trail it leaves on disk</text>
  <text class="head" x="772" y="42" text-anchor="middle">The tracker that reads it</text>

  <!-- ===== Row 1: Claude Code → JSONL → ccusage ===== -->
  <rect class="box" x="30" y="68" width="200" height="64" rx="8" ry="8" />
  <text class="label" x="130" y="98" text-anchor="middle" font-weight="600">Claude Code</text>
  <text class="sub" x="130" y="116" text-anchor="middle">streaming JSONL transcripts</text>

  <rect class="adj" x="350" y="68" width="210" height="64" rx="8" ry="8" />
  <text class="label" x="455" y="96" text-anchor="middle" font-weight="600">JSONL transcript</text>
  <text class="sub" x="455" y="114" text-anchor="middle">~/.claude/projects/ · undercounts (#866)</text>

  <rect class="hero" x="665" y="68" width="215" height="64" rx="8" ry="8" />
  <text class="label-inv" x="772" y="96" text-anchor="middle" font-weight="600">ccusage</text>
  <text class="sub-inv" x="772" y="114" text-anchor="middle">JSONL parser · npx / bunx</text>

  <line class="arrow" x1="230" y1="100" x2="348" y2="100" />
  <line class="arrow" x1="560" y1="100" x2="663" y2="100" />

  <!-- ===== Row 2: Codex CLI → Codex JSONL → codex-usage-tracker ===== -->
  <rect class="box" x="30" y="178" width="200" height="64" rx="8" ry="8" />
  <text class="label" x="130" y="208" text-anchor="middle" font-weight="600">Codex CLI</text>
  <text class="sub" x="130" y="226" text-anchor="middle">cumulative token_count</text>

  <rect class="adj" x="350" y="178" width="210" height="64" rx="8" ry="8" />
  <text class="label" x="455" y="206" text-anchor="middle" font-weight="600">Codex JSONL</text>
  <text class="sub" x="455" y="224" text-anchor="middle">~/.codex/sessions/ · token_count events</text>

  <rect class="box" x="665" y="178" width="215" height="64" rx="8" ry="8" />
  <text class="label" x="772" y="206" text-anchor="middle" font-weight="600">codex-usage-tracker</text>
  <text class="sub" x="772" y="224" text-anchor="middle">SQLite index + MCP</text>

  <line class="arrow" x1="230" y1="210" x2="348" y2="210" />
  <line class="arrow" x1="560" y1="210" x2="663" y2="210" />

  <!-- ===== Row 3: Cursor → SQLite → CodeBurn ===== -->
  <rect class="box" x="30" y="288" width="200" height="64" rx="8" ry="8" />
  <text class="label" x="130" y="318" text-anchor="middle" font-weight="600">Cursor</text>
  <text class="sub" x="130" y="336" text-anchor="middle">local SQLite store</text>

  <rect class="adj" x="350" y="288" width="210" height="64" rx="8" ry="8" />
  <text class="label" x="455" y="316" text-anchor="middle" font-weight="600">SQLite (state.vscdb)</text>
  <text class="sub" x="455" y="334" text-anchor="middle">cursorDiskKV · bubbleId: keys</text>

  <rect class="box" x="665" y="288" width="215" height="64" rx="8" ry="8" />
  <text class="label" x="772" y="316" text-anchor="middle" font-weight="600">CodeBurn</text>
  <text class="sub" x="772" y="334" text-anchor="middle">per-agent disk readers ×25</text>

  <line class="arrow" x1="230" y1="320" x2="348" y2="320" />
  <line class="arrow" x1="560" y1="320" x2="663" y2="320" />

  <!-- ===== Row 4: Aider → no structured ledger → LiteLLM proxy (meter live) ===== -->
  <rect class="box" x="30" y="398" width="200" height="64" rx="8" ry="8" />
  <text class="label" x="130" y="428" text-anchor="middle" font-weight="600">Aider</text>
  <text class="sub" x="130" y="446" text-anchor="middle">prints cost per turn</text>

  <rect class="box" x="350" y="398" width="210" height="64" rx="8" ry="8" stroke-dasharray="5 4" />
  <text class="label" x="455" y="426" text-anchor="middle" font-weight="600">No structured ledger</text>
  <text class="sub" x="455" y="444" text-anchor="middle">only a prose .aider.chat.history.md</text>

  <rect class="hero" x="665" y="398" width="215" height="64" rx="8" ry="8" />
  <text class="label-inv" x="772" y="426" text-anchor="middle" font-weight="600">LiteLLM proxy</text>
  <text class="sub-inv" x="772" y="444" text-anchor="middle">meters live API traffic</text>

  <line class="arrow" x1="230" y1="430" x2="348" y2="430" />
  <line class="dash" x1="560" y1="430" x2="663" y2="430" />
  <text class="sub" x="612" y="422" text-anchor="middle">meter, don't parse</text>

  <!-- Footnote: cross-coverage caveat -->
  <text class="foot" x="450" y="488" text-anchor="middle">ccusage also reads the Codex JSONL; codex-usage-tracker adds a queryable index + MCP on top of it.</text>
</svg>
