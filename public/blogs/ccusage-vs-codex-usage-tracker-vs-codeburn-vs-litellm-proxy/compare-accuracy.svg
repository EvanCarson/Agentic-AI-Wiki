<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Accuracy of the count</title>
  <desc id="d">Disk readers inherit the agent's own log accuracy; the SQLite-index tracker reads Codex's cumulative totals; the LiteLLM proxy sees the provider's real usage object.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="28">Accuracy — who sees the real number</text>

  <!-- Column 1: Disk readers — neutral -->
  <rect class="card-neutral" x="10" y="44" width="280" height="240" rx="8" />
  <text class="col-head" x="150" y="86">Disk readers</text>
  <text class="body-text" x="150" y="122">ccusage · CodeBurn</text>
  <text class="body-text" x="150" y="140">inherit whatever the</text>
  <text class="body-text" x="150" y="158">agent wrote to disk</text>
  <text class="body-text" x="150" y="176">= as good as that log</text>
  <text class="body-text" x="150" y="204">ccusage undercounts</text>
  <text class="body-text" x="150" y="222">Claude Code (#866)</text>

  <!-- Column 2: SQLite index — soft -->
  <rect class="card-soft" x="310" y="44" width="280" height="240" rx="8" />
  <text class="col-head" x="450" y="86">SQLite index</text>
  <text class="body-text" x="450" y="122">codex-usage-tracker</text>
  <text class="body-text" x="450" y="140">reads Codex's</text>
  <text class="body-text" x="450" y="158">cumulative totals +</text>
  <text class="body-text" x="450" y="176">per-turn delta</text>
  <text class="body-text" x="450" y="204">counts solid; cost =</text>
  <text class="body-text" x="450" y="222">your price table</text>

  <!-- Column 3: Proxy = ground truth — accent -->
  <rect class="card-accent" x="610" y="44" width="280" height="240" rx="8" />
  <text class="col-head-inv" x="750" y="86">Proxy = ground truth</text>
  <text class="body-text-inv" x="750" y="122">LiteLLM</text>
  <text class="body-text-inv" x="750" y="140">sits in the</text>
  <text class="body-text-inv" x="750" y="158">request path</text>
  <text class="body-text-inv" x="750" y="176">sees the real</text>
  <text class="body-text-inv" x="750" y="204">usage object —</text>
  <text class="body-text-inv" x="750" y="222">cache + reasoning</text>

</svg>
