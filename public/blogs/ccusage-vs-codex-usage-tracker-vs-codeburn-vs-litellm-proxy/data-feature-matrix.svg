<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Token-tracker feature matrix</title>
  <desc id="d">Heatmap comparing ccusage, codex-usage-tracker, CodeBurn, and a LiteLLM proxy across seven axes: reads Claude Code, reads Codex, reads Cursor, reads Aider, cost breakdown, cache awareness, and real-time. Strength shown by fill from light (weak) to dark accent (strong); each tracker's "Hero" cell is the agent it was built for.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="30" text-anchor="middle">Tracker × agent + key features</text>

  <!--
    Layout: row-label margin 142; 7 columns width 102, x = 150,254,358,462,566,670,774
    col centers: 201,305,409,513,617,721,825 ; 4 rows height 58, tops 80,138,196,254
  -->

  <!-- Column headers -->
  <text class="col-head" x="201" y="55">Claude</text>
  <text class="col-head" x="201" y="68">Code</text>
  <text class="col-head" x="305" y="62">Codex</text>
  <text class="col-head" x="409" y="62">Cursor</text>
  <text class="col-head" x="513" y="62">Aider</text>
  <text class="col-head" x="617" y="55">Cost</text>
  <text class="col-head" x="617" y="68">breakdown</text>
  <text class="col-head" x="721" y="55">Cache-</text>
  <text class="col-head" x="721" y="68">aware</text>
  <text class="col-head" x="825" y="55">Real-</text>
  <text class="col-head" x="825" y="68">time</text>

  <!-- === Row 1: ccusage === -->
  <text class="row-head" x="142" y="109">ccusage</text>
  <rect class="cell-strong" x="150" y="80" width="102" height="58" rx="4" /><text class="cell-text-inv" x="201" y="109">Hero</text>
  <rect class="cell-strong" x="254" y="80" width="102" height="58" rx="4" /><text class="cell-text-inv" x="305" y="109">Yes</text>
  <rect class="cell-weak"   x="358" y="80" width="102" height="58" rx="4" /><text class="cell-text" x="409" y="109">—</text>
  <rect class="cell-weak"   x="462" y="80" width="102" height="58" rx="4" /><text class="cell-text" x="513" y="109">—</text>
  <rect class="cell-strong" x="566" y="80" width="102" height="58" rx="4" /><text class="cell-text-inv" x="617" y="109">per-model</text>
  <rect class="cell-strong" x="670" y="80" width="102" height="58" rx="4" /><text class="cell-text-inv" x="721" y="109">split</text>
  <rect class="cell-medium" x="774" y="80" width="102" height="58" rx="4" /><text class="cell-text" x="825" y="109">statusline</text>

  <!-- === Row 2: codex-usage-tracker === -->
  <text class="row-head" x="142" y="159">codex-usage-</text>
  <text class="row-head" x="142" y="175">tracker</text>
  <rect class="cell-weak"   x="150" y="138" width="102" height="58" rx="4" /><text class="cell-text" x="201" y="167">—</text>
  <rect class="cell-strong" x="254" y="138" width="102" height="58" rx="4" /><text class="cell-text-inv" x="305" y="167">Hero</text>
  <rect class="cell-weak"   x="358" y="138" width="102" height="58" rx="4" /><text class="cell-text" x="409" y="167">—</text>
  <rect class="cell-weak"   x="462" y="138" width="102" height="58" rx="4" /><text class="cell-text" x="513" y="167">—</text>
  <rect class="cell-strong" x="566" y="138" width="102" height="58" rx="4" /><text class="cell-text-inv" x="617" y="167">pricing</text>
  <rect class="cell-strong" x="670" y="138" width="102" height="58" rx="4" /><text class="cell-text-inv" x="721" y="167">ratio</text>
  <rect class="cell-medium" x="774" y="138" width="102" height="58" rx="4" /><text class="cell-text" x="825" y="167">on run</text>

  <!-- === Row 3: CodeBurn === -->
  <text class="row-head" x="142" y="225">CodeBurn</text>
  <rect class="cell-medium" x="150" y="196" width="102" height="58" rx="4" /><text class="cell-text" x="201" y="225">reader</text>
  <rect class="cell-medium" x="254" y="196" width="102" height="58" rx="4" /><text class="cell-text" x="305" y="225">reader</text>
  <rect class="cell-strong" x="358" y="196" width="102" height="58" rx="4" /><text class="cell-text-inv" x="409" y="225">Hero</text>
  <rect class="cell-weak"   x="462" y="196" width="102" height="58" rx="4" /><text class="cell-text" x="513" y="225">—</text>
  <rect class="cell-strong" x="566" y="196" width="102" height="58" rx="4" /><text class="cell-text-inv" x="617" y="225">via LiteLLM</text>
  <rect class="cell-medium" x="670" y="196" width="102" height="58" rx="4" /><text class="cell-text" x="721" y="225">varies</text>
  <rect class="cell-medium" x="774" y="196" width="102" height="58" rx="4" /><text class="cell-text" x="825" y="225">TUI</text>

  <!-- === Row 4: LiteLLM proxy === -->
  <text class="row-head" x="142" y="275">LiteLLM</text>
  <text class="row-head" x="142" y="291">proxy</text>
  <rect class="cell-strong" x="150" y="254" width="102" height="58" rx="4" /><text class="cell-text-inv" x="201" y="283">BASE_URL</text>
  <rect class="cell-strong" x="254" y="254" width="102" height="58" rx="4" /><text class="cell-text-inv" x="305" y="283">BASE_URL</text>
  <rect class="cell-medium" x="358" y="254" width="102" height="58" rx="4" /><text class="cell-text" x="409" y="283">BYOK only</text>
  <rect class="cell-strong" x="462" y="254" width="102" height="58" rx="4" /><text class="cell-text-inv" x="513" y="283">Hero</text>
  <rect class="cell-strong" x="566" y="254" width="102" height="58" rx="4" /><text class="cell-text-inv" x="617" y="283">spend log</text>
  <rect class="cell-medium" x="670" y="254" width="102" height="58" rx="4" /><text class="cell-text" x="721" y="283">usage obj</text>
  <rect class="cell-strong" x="774" y="254" width="102" height="58" rx="4" /><text class="cell-text-inv" x="825" y="283">live</text>

  <!-- Legend -->
  <rect class="legend-box-w" x="250" y="345" width="18" height="18" rx="3" />
  <text class="legend-text" x="275" y="355">Weak / none</text>

  <rect class="legend-box-m" x="400" y="345" width="18" height="18" rx="3" />
  <text class="legend-text" x="425" y="355">Partial</text>

  <rect class="legend-box-s" x="520" y="345" width="18" height="18" rx="3" />
  <text class="legend-text" x="545" y="355">Strong · Hero = built for it</text>

</svg>
