<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ccusage logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Token-usage bar chart: three ascending bars with rounded tops -->
  <line x1="9" y1="23" x2="9" y2="19" stroke="var(--paper)" stroke-width="2.4" stroke-linecap="round" />
  <line x1="14.5" y1="23" x2="14.5" y2="15" stroke="var(--paper)" stroke-width="2.4" stroke-linecap="round" />
  <line x1="20" y1="23" x2="20" y2="11" stroke="var(--paper)" stroke-width="2.4" stroke-linecap="round" />
  <!-- Cost coin above the tallest bar with a dollar tick -->
  <circle cx="24" cy="9" r="3" fill="none" stroke="var(--paper)" stroke-width="1.6" />
  <line x1="24" y1="7.2" x2="24" y2="10.8" stroke="var(--paper)" stroke-width="1.6" stroke-linecap="round" />
</svg>
