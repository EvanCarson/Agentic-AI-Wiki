<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">CodeBurn architecture</title>
  <desc id="d">CodeBurn reads session data directly from disk using a per-agent reader for each of 25 coding tools, prices every call with LiteLLM, and renders a terminal dashboard.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .dash  { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- LEFT column: per-agent on-disk readers -->
  <rect class="box" x="40" y="44" width="200" height="52" rx="8" ry="8" />
  <text class="label" x="140" y="68" text-anchor="middle" font-weight="600">Cursor</text>
  <text class="sub" x="140" y="85" text-anchor="middle">state.vscdb</text>

  <rect class="box" x="40" y="108" width="200" height="52" rx="8" ry="8" />
  <text class="label" x="140" y="132" text-anchor="middle" font-weight="600">Gemini CLI</text>
  <text class="sub" x="140" y="149" text-anchor="middle">session JSON</text>

  <rect class="box" x="40" y="172" width="200" height="52" rx="8" ry="8" />
  <text class="label" x="140" y="196" text-anchor="middle" font-weight="600">Warp</text>
  <text class="sub" x="140" y="213" text-anchor="middle">warp.sqlite</text>

  <rect class="box" x="40" y="236" width="200" height="52" rx="8" ry="8" />
  <text class="label" x="140" y="260" text-anchor="middle" font-weight="600">Forge</text>
  <text class="sub" x="140" y="277" text-anchor="middle">~/.forge/.forge.db</text>

  <rect class="box" x="40" y="300" width="200" height="52" rx="8" ry="8" />
  <text class="label" x="140" y="324" text-anchor="middle" font-weight="600">Copilot</text>
  <text class="sub" x="140" y="341" text-anchor="middle">workspaceStorage</text>

  <text class="sub" x="140" y="376" text-anchor="middle">+ Claude Code, Codex, Cline,</text>
  <text class="sub" x="140" y="392" text-anchor="middle">Goose … (25 tools)</text>

  <!-- MIDDLE: CodeBurn hero -->
  <rect class="hero" x="350" y="150" width="240" height="140" rx="10" ry="10" />
  <text class="label-inv" x="470" y="190" text-anchor="middle" font-weight="600">CodeBurn</text>
  <text class="sub-inv" x="470" y="214" text-anchor="middle">npm i -g codeburn</text>
  <text class="sub-inv" x="470" y="234" text-anchor="middle">reads disk · no proxy · no keys</text>
  <text class="sub-inv" x="470" y="254" text-anchor="middle">prices each call via LiteLLM</text>

  <!-- RIGHT: TUI dashboard -->
  <rect class="adj" x="680" y="166" width="200" height="108" rx="8" ry="8" />
  <text class="label" x="780" y="202" text-anchor="middle" font-weight="600">TUI dashboard</text>
  <text class="sub" x="780" y="224" text-anchor="middle">cost · tokens · per-tool</text>
  <text class="sub" x="780" y="244" text-anchor="middle">per-day &amp; per-session</text>

  <!-- Fan-in arrows: readers -> CodeBurn hero -->
  <line class="arrow" x1="242" y1="70" x2="348" y2="186" />
  <line class="arrow" x1="242" y1="134" x2="348" y2="200" />
  <line class="arrow" x1="242" y1="198" x2="348" y2="216" />
  <line class="arrow" x1="242" y1="262" x2="348" y2="232" />
  <line class="arrow" x1="242" y1="326" x2="348" y2="248" />
  <text class="sub" x="300" y="150" text-anchor="middle">reads disk</text>

  <!-- CodeBurn hero -> dashboard -->
  <line class="arrow" x1="592" y1="220" x2="678" y2="220" />
</svg>
