<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Setup cost</title>
  <desc id="d">ccusage, CodeBurn, and codex-usage-tracker are one-line installs that read on demand; a LiteLLM proxy is a service you run and point clients at.</desc>
  <style>
    .chart-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="28">Setup — one-liner to running a service</text>

  <!-- Column 1: One-line install — accent -->
  <rect class="card-accent" x="10" y="44" width="280" height="240" rx="8" />
  <text class="col-head-inv" x="150" y="113">One-line install</text>
  <text class="body-text-inv" x="150" y="149">npx ccusage / bunx</text>
  <text class="body-text-inv" x="150" y="167">npm i -g codeburn</text>
  <text class="body-text-inv" x="150" y="185">read-only, on demand</text>
  <text class="body-text-inv" x="150" y="203">nothing stays running</text>

  <!-- Column 2: pipx + local index — soft -->
  <rect class="card-soft" x="310" y="44" width="280" height="240" rx="8" />
  <text class="col-head" x="450" y="113">pipx + local index</text>
  <text class="body-text" x="450" y="149">pipx install</text>
  <text class="body-text" x="450" y="167">codex-usage-tracking</text>
  <text class="body-text" x="450" y="185">builds a SQLite at</text>
  <text class="body-text" x="450" y="203">~/.codex-usage-tracker/</text>

  <!-- Column 3: Run a service — neutral -->
  <rect class="card-neutral" x="610" y="44" width="280" height="240" rx="8" />
  <text class="col-head" x="750" y="113">Run a service</text>
  <text class="body-text" x="750" y="149">LiteLLM proxy server</text>
  <text class="body-text" x="750" y="167">set *_BASE_URL on</text>
  <text class="body-text" x="750" y="185">every client</text>
  <text class="body-text" x="750" y="203">an extra hop to operate</text>

</svg>
