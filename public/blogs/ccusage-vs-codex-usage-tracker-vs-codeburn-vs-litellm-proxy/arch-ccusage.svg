<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">ccusage architecture</title>
  <desc id="d">ccusage parses on-disk JSONL logs written by Claude Code and Codex and prints daily, weekly, monthly, session, and 5-hour-block reports with per-model cost breakdowns.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .dash  { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- LEFT: trail sources -->
  <rect class="box" x="30" y="70" width="230" height="74" rx="8" ry="8" />
  <text class="label" x="145" y="98" text-anchor="middle" font-weight="600">Claude Code</text>
  <text class="sub" x="145" y="120" text-anchor="middle">~/.claude/projects/**/*.jsonl</text>

  <text class="sub" x="145" y="162" text-anchor="middle">JSONL undercounts — issue #866</text>

  <rect class="box" x="30" y="240" width="230" height="74" rx="8" ry="8" />
  <text class="label" x="145" y="272" text-anchor="middle" font-weight="600">Codex CLI</text>
  <text class="sub" x="145" y="294" text-anchor="middle">~/.codex/sessions/**/*.jsonl</text>

  <!-- MIDDLE: hero -->
  <rect class="hero" x="335" y="120" width="230" height="120" rx="10" ry="10" />
  <text class="label-inv" x="450" y="156" text-anchor="middle" font-weight="600">ccusage</text>
  <text class="sub-inv" x="450" y="180" text-anchor="middle">npx · bunx · pnpm dlx</text>
  <text class="sub-inv" x="450" y="200" text-anchor="middle">local-first CLI, read-only</text>
  <text class="sub-inv" x="450" y="220" text-anchor="middle">parses the on-disk JSONL</text>

  <!-- RIGHT: terminal report -->
  <rect class="box" x="640" y="96" width="230" height="168" rx="8" ry="8" />
  <text class="label" x="755" y="126" text-anchor="middle" font-weight="600">Report</text>
  <text class="sub" x="755" y="150" text-anchor="middle">daily · weekly · monthly</text>
  <text class="sub" x="755" y="172" text-anchor="middle">session · blocks (5h windows)</text>
  <text class="sub" x="755" y="194" text-anchor="middle">input / output / cache-create / cache-read</text>
  <text class="sub" x="755" y="216" text-anchor="middle">--breakdown → per-model cost</text>

  <!-- ARROWS: sources -> hero -->
  <line class="arrow" x1="260" y1="107" x2="333" y2="150" />
  <line class="arrow" x1="260" y1="277" x2="333" y2="210" />
  <text class="sub" x="298" y="118" text-anchor="middle">reads</text>

  <!-- ARROW: hero -> report -->
  <line class="arrow" x1="565" y1="180" x2="638" y2="180" />
  <text class="sub" x="601" y="170" text-anchor="middle">prints</text>
</svg>
