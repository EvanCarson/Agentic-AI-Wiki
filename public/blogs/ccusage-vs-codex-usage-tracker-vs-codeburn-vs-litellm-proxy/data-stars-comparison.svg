<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="stars-title stars-desc">
  <title id="stars-title">GitHub stars comparison</title>
  <desc id="stars-desc">Horizontal bar chart of GitHub stars as of 2026-06-09: LiteLLM 49,786 (the whole proxy framework), ccusage 15,812, CodeBurn 7,789, and codex-usage-tracker 11 (a brand-new niche tool).</desc>
  <defs>
    <filter id="shadow-bar" x="-2%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--ink, #1a1a1a)" flood-opacity="0.10" />
    </filter>
  </defs>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .proj-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .bar-val      { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; dominant-baseline: central; }
    .grid-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: middle; }
    .grid-line    { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .bar-primary  { fill: var(--accent, #d4421e); filter: url(#shadow-bar); }
    .bar-secondary{ fill: var(--accent-soft, #f5c5b8); filter: url(#shadow-bar); }
    .bar-tertiary { fill: var(--paper-2, #f0ede8); filter: url(#shadow-bar); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="36" text-anchor="middle">GitHub stars · 2026-06-09</text>

  <!-- Chart area: left margin 200, bars start x=200; scale = 620 / 49786 ≈ 0.012453 px/star -->
  <!-- Grid lines at 10K / 20K / 30K / 40K -->
  <line class="grid-line" x1="325" y1="68" x2="325" y2="340" />
  <line class="grid-line" x1="449" y1="68" x2="449" y2="340" />
  <line class="grid-line" x1="574" y1="68" x2="574" y2="340" />
  <line class="grid-line" x1="698" y1="68" x2="698" y2="340" />
  <text class="grid-label" x="325" y="356">10K</text>
  <text class="grid-label" x="449" y="356">20K</text>
  <text class="grid-label" x="574" y="356">30K</text>
  <text class="grid-label" x="698" y="356">40K</text>

  <!-- Baseline -->
  <line x1="200" y1="340" x2="820" y2="340" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" />

  <!-- === LiteLLM: 49,786 (leader; whole proxy framework) === -->
  <text class="proj-label" x="192" y="100">LiteLLM</text>
  <rect class="bar-primary" x="200" y="78" width="620" height="44" rx="5" ry="5" />
  <text class="bar-val" x="828" y="100" style="fill: var(--accent, #d4421e);">49,786</text>

  <!-- === ccusage: 15,812 === -->
  <text class="proj-label" x="192" y="170">ccusage</text>
  <rect class="bar-secondary" x="200" y="148" width="197" height="44" rx="5" ry="5" />
  <text class="bar-val" x="405" y="170" style="fill: var(--ink, #1a1a1a);">15,812</text>

  <!-- === CodeBurn: 7,789 === -->
  <text class="proj-label" x="192" y="240">CodeBurn</text>
  <rect class="bar-tertiary" x="200" y="218" width="97" height="44" rx="5" ry="5" />
  <text class="bar-val" x="305" y="240" style="fill: var(--muted, #888);">7,789</text>

  <!-- === codex-usage-tracker: 11 (min-width sliver) === -->
  <text class="proj-label" x="192" y="310">codex-usage-tracker</text>
  <rect class="bar-tertiary" x="200" y="288" width="18" height="44" rx="5" ry="5" />
  <text class="bar-val" x="226" y="310" style="fill: var(--muted, #888);">11</text>

</svg>
