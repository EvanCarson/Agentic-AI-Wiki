<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">codex-usage-tracker architecture</title>
  <desc id="d">codex-usage-tracker parses token-count events from Codex CLI session JSONL into a local SQLite index and exposes MCP tools so the agent can query its own spend.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .dash  { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- LEFT: Codex sessions -->
  <rect class="box" x="30" y="120" width="230" height="110" rx="8" ry="8" />
  <text class="label" x="145" y="150" text-anchor="middle" font-weight="600">Codex CLI sessions</text>
  <text class="sub" x="145" y="174" text-anchor="middle">~/.codex/sessions/**/*.jsonl</text>
  <text class="sub" x="145" y="196" text-anchor="middle">token_count events</text>
  <text class="sub" x="145" y="218" text-anchor="middle">cumulative total + per-turn delta</text>

  <!-- MIDDLE: hero -->
  <rect class="hero" x="335" y="130" width="230" height="90" rx="10" ry="10" />
  <text class="label-inv" x="450" y="166" text-anchor="middle" font-weight="600">codex-usage-tracker</text>
  <text class="sub-inv" x="450" y="190" text-anchor="middle">pipx install codex-usage-tracking</text>
  <text class="sub-inv" x="450" y="210" text-anchor="middle">parses + indexes</text>

  <!-- RIGHT TOP: SQLite index -->
  <rect class="adj" x="640" y="56" width="230" height="80" rx="8" ry="8" />
  <text class="label" x="755" y="84" text-anchor="middle" font-weight="600">SQLite index</text>
  <text class="sub" x="755" y="106" text-anchor="middle">~/.codex-usage-tracker/usage.sqlite3</text>
  <text class="sub" x="755" y="126" text-anchor="middle">context use · cache ratio</text>

  <!-- RIGHT BOTTOM: MCP server -->
  <rect class="adj" x="640" y="216" width="230" height="80" rx="8" ry="8" />
  <text class="label" x="755" y="244" text-anchor="middle" font-weight="600">MCP server</text>
  <text class="sub" x="755" y="266" text-anchor="middle">usage_summary · usage_query</text>
  <text class="sub" x="755" y="286" text-anchor="middle">session_usage · recommendations</text>

  <!-- ARROWS -->
  <line class="arrow" x1="260" y1="175" x2="333" y2="175" />
  <text class="sub" x="296" y="165" text-anchor="middle">reads</text>

  <line class="arrow" x1="565" y1="160" x2="638" y2="110" />
  <text class="sub" x="600" y="124" text-anchor="middle">indexes</text>

  <line class="arrow" x1="565" y1="195" x2="638" y2="246" />

  <!-- MCP server -> back to Codex sessions (agent queries its own spend) -->
  <path class="dash" d="M 640 280 C 360 360, 220 360, 145 232" />
  <text class="sub" x="400" y="378" text-anchor="middle">agent queries its own spend</text>
</svg>
