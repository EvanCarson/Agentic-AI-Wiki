<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">LiteLLM proxy architecture</title>
  <desc id="d">A client such as Aider points its API base URL at a self-hosted LiteLLM proxy, which forwards to the model provider and logs ground-truth token usage and cost per request, exporting to dashboards like Langfuse or OpenTelemetry.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .dash  { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- LEFT: client -->
  <rect class="box" x="40" y="80" width="200" height="108" rx="8" ry="8" />
  <text class="label" x="140" y="112" text-anchor="middle" font-weight="600">Aider / any client</text>
  <text class="sub" x="140" y="134" text-anchor="middle">ANTHROPIC_BASE_URL</text>
  <text class="sub" x="140" y="152" text-anchor="middle">OPENAI_BASE_URL</text>
  <text class="sub" x="140" y="170" text-anchor="middle">(point at the proxy)</text>

  <!-- MIDDLE: LiteLLM proxy hero -->
  <rect class="hero" x="340" y="64" width="240" height="140" rx="10" ry="10" />
  <text class="label-inv" x="460" y="104" text-anchor="middle" font-weight="600">LiteLLM proxy</text>
  <text class="sub-inv" x="460" y="128" text-anchor="middle">self-hosted server in the path</text>
  <text class="sub-inv" x="460" y="148" text-anchor="middle">sees the provider's real usage object</text>
  <text class="sub-inv" x="460" y="168" text-anchor="middle">LiteLLM_SpendLogs: tokens + $/req</text>

  <!-- RIGHT: provider API -->
  <rect class="box" x="680" y="80" width="200" height="108" rx="8" ry="8" />
  <text class="label" x="780" y="118" text-anchor="middle" font-weight="600">Model provider API</text>
  <text class="sub" x="780" y="142" text-anchor="middle">Anthropic · OpenAI · …</text>
  <text class="sub" x="780" y="160" text-anchor="middle">ground-truth usage</text>

  <!-- BELOW hero: dashboards -->
  <rect class="adj" x="340" y="288" width="240" height="72" rx="8" ry="8" />
  <text class="label" x="460" y="320" text-anchor="middle" font-weight="600">Langfuse / OpenTelemetry</text>
  <text class="sub" x="460" y="342" text-anchor="middle">dashboards &amp; budgets</text>

  <!-- client -> proxy -->
  <line class="arrow" x1="242" y1="124" x2="338" y2="124" />
  <text class="sub" x="290" y="114" text-anchor="middle">base-URL override</text>

  <!-- proxy -> provider API -->
  <line class="arrow" x1="582" y1="120" x2="678" y2="120" />
  <text class="sub" x="630" y="110" text-anchor="middle">forwards</text>

  <!-- provider API -> proxy (dashed back arrow) -->
  <path class="dash" d="M 678 152 C 630 168, 630 168, 582 152" />
  <text class="sub" x="630" y="184" text-anchor="middle">usage + reply</text>

  <!-- proxy -> dashboards (dashed) -->
  <line class="dash" x1="460" y1="206" x2="460" y2="286" />
  <text class="sub" x="468" y="250" text-anchor="start">exports</text>
</svg>
