<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Four MCP gateways across four identity axes</title>
  <desc id="d">Feature matrix. Rows are agentgateway, ContextForge, Obot and Docker MCP Gateway; columns are RFC 8693 token exchange, per-user credential brokering, tool-level filtering, and per-user audit attribution. agentgateway: strong on token exchange, and instead of storing a per-user credential it keeps only a short-lived in-memory cache of exchange results, strong tool-level control through CEL policy, medium audit. ContextForge: strong on token exchange, strong on user-scoped OAuth tokens, strong tool filtering through virtual servers, medium audit. Obot: medium on token exchange because the released documentation describes it while the current main branch has replaced it, strong per-user brokering, medium tool filtering through accept-reject-mutate filters, strong per-user audit with an auditor role. Docker MCP Gateway: absent on token exchange, per-user credentials and per-user audit because it has no user concept, strong on tool filtering through server and tool flags.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 5; ry: 5; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 5; ry: 5; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 5; ry: 5; }
    .title  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .row    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="title" x="24" y="30">Where each gateway is strong</text>

  <text class="col" x="200" y="60">RFC 8693 EXCHANGE</text>
  <text class="col" x="373" y="60">PER-USER CREDENTIAL</text>
  <text class="col" x="546" y="60">TOOL-LEVEL FILTER</text>
  <text class="col" x="719" y="60">PER-USER AUDIT</text>

  <text class="row" x="24" y="100">agentgateway</text>
  <rect class="strong" x="200" y="74" width="165" height="42" />
  <text class="cell-inv" x="212" y="100">In the config protos</text>
  <rect class="weak" x="373" y="74" width="165" height="42" />
  <text class="cell" x="385" y="100">Short-TTL exchange cache</text>
  <rect class="strong" x="546" y="74" width="165" height="42" />
  <text class="cell-inv" x="558" y="100">CEL policy engine</text>
  <rect class="med" x="719" y="74" width="165" height="42" />
  <text class="cell" x="731" y="100">OTel, not an audit UI</text>

  <text class="row" x="24" y="162">ContextForge</text>
  <rect class="strong" x="200" y="136" width="165" height="42" />
  <text class="cell-inv" x="212" y="162">Grant type in code</text>
  <rect class="strong" x="373" y="136" width="165" height="42" />
  <text class="cell-inv" x="385" y="162">User-scoped tokens</text>
  <rect class="strong" x="546" y="136" width="165" height="42" />
  <text class="cell-inv" x="558" y="162">Virtual servers</text>
  <rect class="med" x="719" y="136" width="165" height="42" />
  <text class="cell" x="731" y="162">Logs, no role split</text>

  <text class="row" x="24" y="224">Obot</text>
  <rect class="med" x="200" y="198" width="165" height="42" />
  <text class="cell" x="212" y="224">Version-dependent</text>
  <rect class="strong" x="373" y="198" width="165" height="42" />
  <text class="cell-inv" x="385" y="224">Stored per user</text>
  <rect class="med" x="546" y="198" width="165" height="42" />
  <text class="cell" x="558" y="224">Accept / reject / mutate</text>
  <rect class="strong" x="719" y="198" width="165" height="42" />
  <text class="cell-inv" x="731" y="224">Auditor role gate</text>

  <text class="row" x="24" y="286">Docker</text>
  <rect class="weak" x="200" y="260" width="165" height="42" />
  <text class="cell" x="212" y="286">Absent</text>
  <rect class="weak" x="373" y="260" width="165" height="42" />
  <text class="cell" x="385" y="286">No user exists</text>
  <rect class="strong" x="546" y="260" width="165" height="42" />
  <text class="cell-inv" x="558" y="286">Server &amp; tool flags</text>
  <rect class="weak" x="719" y="260" width="165" height="42" />
  <text class="cell" x="731" y="286">Shape metadata only</text>

  <rect class="strong" x="200" y="326" width="18" height="14" />
  <text class="cell" x="226" y="338">Strong</text>
  <rect class="med" x="300" y="326" width="18" height="14" />
  <text class="cell" x="326" y="338">Partial or qualified</text>
  <rect class="weak" x="452" y="326" width="18" height="14" />
  <text class="cell" x="478" y="338">Absent by design</text>

  <text class="sub" x="24" y="374">Docker&#8217;s row is not a scorecard failure &#8212; three of these axes require a user, and a workstation tool</text>
  <text class="sub" x="24" y="392">deliberately has none. Its strengths sit on axes this matrix does not measure.</text>
</svg>
