<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where the caller&#8217;s identity stops in four MCP gateways</title>
  <desc id="d">Four rows, each showing what the gateway does with the caller&#8217;s identity and what the upstream MCP server therefore records. agentgateway exchanges the inbound token under RFC 8693, so the upstream server sees a fresh audience-bound token carrying an actor claim. ContextForge exchanges the token too, unless header passthrough has been explicitly enabled, in which case the inbound Authorization header is forwarded unchanged. Obot authenticates the user against an identity provider and attaches that user&#8217;s separately stored upstream OAuth token, so the upstream sees the user through a credential the user consented to. Docker MCP Gateway authenticates the inbound connection with a single shared static bearer token and has no user concept, so the upstream sees one workstation identity.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .name   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="24" y="34">GATEWAY</text>
  <text class="head" x="232" y="34">WHAT IT DOES WITH THE INBOUND TOKEN</text>
  <text class="head" x="566" y="34">WHAT THE UPSTREAM SERVER RECORDS</text>

  <text class="name" x="24" y="88">agentgateway</text>
  <rect class="adj" x="232" y="56" width="286" height="60" />
  <text class="label" x="250" y="82">Exchanges it (RFC 8693)</text>
  <text class="sub" x="250" y="102">subject_token &#8594; new token, actor claim</text>
  <path class="arrow" d="M 524 86 L 554 86" />
  <rect class="hero" x="560" y="56" width="316" height="60" />
  <text class="label-inv" x="578" y="82">The user, acting through the gateway</text>
  <text class="sub-inv" x="578" y="102">audience-bound, minted per request</text>

  <text class="name" x="24" y="176">ContextForge</text>
  <rect class="adj" x="232" y="144" width="286" height="60" />
  <text class="label" x="250" y="170">Exchanges it &#8212; or forwards it</text>
  <text class="sub" x="250" y="190">passthrough off by default, opt-in flag</text>
  <path class="arrow" d="M 524 174 L 554 174" />
  <rect class="box" x="560" y="144" width="316" height="60" />
  <text class="label" x="578" y="170">The user, or a confused deputy</text>
  <text class="sub" x="578" y="190">decided by an environment variable</text>

  <text class="name" x="24" y="264">Obot</text>
  <rect class="adj" x="232" y="232" width="286" height="60" />
  <text class="label" x="250" y="258">Attaches the user&#8217;s stored token</text>
  <text class="sub" x="250" y="278">held at rest, refreshed by the platform</text>
  <path class="arrow" d="M 524 262 L 554 262" />
  <rect class="box" x="560" y="232" width="316" height="60" />
  <text class="label" x="578" y="258">The user, via their own consent</text>
  <text class="sub" x="578" y="278">nothing about the gateway travels</text>

  <text class="name" x="24" y="352">Docker MCP Gateway</text>
  <rect class="box" x="232" y="320" width="286" height="60" />
  <text class="label" x="250" y="346">No inbound user exists</text>
  <text class="sub" x="250" y="366">one shared static bearer token</text>
  <path class="arrow" d="M 524 350 L 554 350" />
  <rect class="box" x="560" y="320" width="316" height="60" />
  <text class="label" x="578" y="346">One workstation</text>
  <text class="sub" x="578" y="366">correct for its scope, useless for a fleet</text>

  <line x1="24" y1="410" x2="876" y2="410" stroke="var(--ink)" stroke-width="1" opacity=".2" />
  <text class="sub" x="24" y="440">The specification settles only the negative: a server MUST NOT pass through the token it received from its client.</text>
  <text class="sub" x="24" y="462">RFC 8693 token exchange &#8212; the mechanism that replaces passthrough &#8212; is still roadmap work, not a protocol requirement.</text>
</svg>
