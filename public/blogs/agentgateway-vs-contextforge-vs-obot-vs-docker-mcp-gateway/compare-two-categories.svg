<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Two layers sold under one category name</title>
  <desc id="d">Three columns. The workstation layer, represented by Docker MCP Gateway, controls container isolation, images signed and verified by digest, CPU and memory limits, SSRF and egress guards and secret scanning, but has no user identity. The fleet layer, represented by agentgateway, ContextForge and Obot, controls user identity, token exchange, policy and per-user audit, but generally does not run the server processes. The third column notes that the two layers are complements rather than substitutes, that most organisations need both, and that neither side sells the other half.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
  </style>

  <rect class="box" x="24" y="36" width="266" height="228" />
  <text class="head" x="44" y="66">Runs the servers</text>
  <text class="sub" x="44" y="100">container isolation, no-new-privs</text>
  <text class="sub" x="44" y="124">signed images, pinned by digest</text>
  <text class="sub" x="44" y="148">SSRF ranges, secret scanning</text>
  <line x1="44" y1="176" x2="270" y2="176" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="44" y="200">DOCKER MCP GATEWAY</text>
  <text class="label" x="44" y="228">strongest here, and</text>
  <text class="label" x="44" y="248">has no user identity</text>

  <rect class="adj" x="314" y="36" width="266" height="228" />
  <text class="head" x="334" y="66">Routes to them</text>
  <text class="sub" x="334" y="100">user identity and token exchange</text>
  <text class="sub" x="334" y="124">policy, RBAC, tool scoping</text>
  <text class="sub" x="334" y="148">per-user audit attribution</text>
  <line x1="334" y1="176" x2="560" y2="176" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="334" y="200">AGENTGATEWAY / CONTEXTFORGE / OBOT</text>
  <text class="label" x="334" y="228">mostly do not run the</text>
  <text class="label" x="334" y="248">server process at all</text>

  <rect class="hero" x="604" y="36" width="266" height="228" />
  <text class="head-inv" x="624" y="66">You need both</text>
  <text class="sub-inv" x="624" y="100">the layers are complements</text>
  <text class="sub-inv" x="624" y="124">neither vendor sells the other</text>
  <text class="sub-inv" x="624" y="148">the seam is where egress lives</text>
  <line x1="624" y1="176" x2="850" y2="176" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag" x="624" y="200" fill="var(--paper)" opacity=".85">NOT A SHORTLIST OF FOUR</text>
  <text class="label-inv" x="624" y="228">pick one from each column,</text>
  <text class="label-inv" x="624" y="248">not one winner from four</text>
</svg>
