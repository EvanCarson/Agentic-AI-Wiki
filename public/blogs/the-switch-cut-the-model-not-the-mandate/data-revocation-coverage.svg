<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="rct rcd">
  <title id="rct">What a kill switch covers across an agent's three grants</title>
  <desc id="rcd">A three by three matrix. Inference: revocable by the gateway operator, reached by the kill switch at the gateway, with no published third-party test of how fast it acts. Authority, meaning the agent's credentials: revocable only by your own token broker, not reached by the kill switch, and a time-to-effect you have to measure yourself. Effects, meaning writes already committed: revocable by nobody, so only a compensating action undoes them, not reached by the kill switch, and again a latency you measure yourself. Legend: covered by the switch, partly or yours to build, not covered.</desc>
  <style>
    .rc-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .rc-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .rc-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .rc-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .rc-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .rc-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .rc-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .rc-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .rc-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="rc-ttl" x="20" y="30">Three grants, one switch</text>

  <text class="rc-col" x="330" y="70" text-anchor="middle">Who can revoke it</text>
  <text class="rc-col" x="550" y="70" text-anchor="middle">Switch reaches it?</text>
  <text class="rc-col" x="770" y="70" text-anchor="middle">Time-to-effect known?</text>

  <text class="rc-row" x="20" y="124">Inference</text>
  <rect class="rc-mid" x="230" y="95" width="200" height="48" />
  <text class="rc-cell" x="330" y="124" text-anchor="middle">Gateway operator</text>
  <rect class="rc-strong" x="450" y="95" width="200" height="48" />
  <text class="rc-inv" x="550" y="124" text-anchor="middle">Yes, at the gateway</text>
  <rect class="rc-weak" x="670" y="95" width="200" height="48" />
  <text class="rc-cell" x="770" y="124" text-anchor="middle">No published test</text>

  <text class="rc-row" x="20" y="196">Authority</text>
  <rect class="rc-mid" x="230" y="167" width="200" height="48" />
  <text class="rc-cell" x="330" y="196" text-anchor="middle">Your token broker</text>
  <rect class="rc-weak" x="450" y="167" width="200" height="48" />
  <text class="rc-cell" x="550" y="196" text-anchor="middle">No</text>
  <rect class="rc-mid" x="670" y="167" width="200" height="48" />
  <text class="rc-cell" x="770" y="196" text-anchor="middle">Measure it yourself</text>

  <text class="rc-row" x="20" y="268">Effects</text>
  <rect class="rc-weak" x="230" y="239" width="200" height="48" />
  <text class="rc-cell" x="330" y="268" text-anchor="middle">Nobody: compensate</text>
  <rect class="rc-weak" x="450" y="239" width="200" height="48" />
  <text class="rc-cell" x="550" y="268" text-anchor="middle">No</text>
  <rect class="rc-mid" x="670" y="239" width="200" height="48" />
  <text class="rc-cell" x="770" y="268" text-anchor="middle">Measure it yourself</text>

  <rect class="rc-strong" x="20" y="340" width="18" height="14" />
  <text class="rc-leg" x="48" y="352">Covered by the switch</text>
  <rect class="rc-mid" x="260" y="340" width="18" height="14" />
  <text class="rc-leg" x="288" y="352">Yours to build</text>
  <rect class="rc-weak" x="470" y="340" width="18" height="14" />
  <text class="rc-leg" x="498" y="352">Not covered</text>
</svg>
