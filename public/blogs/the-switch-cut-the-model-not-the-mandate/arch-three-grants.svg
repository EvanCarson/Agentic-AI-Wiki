<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="tgt tgd">
  <title id="tgt">Where a kill switch sits among an agent's three grants</title>
  <desc id="tgd">An agent in the centre holds three separate grants. Upward, inference: requests to a model provider pass through an AI gateway, and the kill switch cuts that edge. Leftward, authority: credentials issued by a token broker reach SaaS and internal APIs, and the switch does not touch them. Rightward, effects: writes already committed to systems of record, which no revocation reverses and which only a compensating action can undo. The cut mark appears only on the inference edge.</desc>
  <style>
    .tg-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .tg-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .tg-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .tg-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .tg-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .tg-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .tg-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .tg-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#tgarr); }
    .tg-cut  { fill: none; stroke: var(--accent, #d4421e); stroke-width: 2.5; }
  </style>
  <defs>
    <marker id="tgarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="tg-ttl" x="20" y="28">One switch, three grants</text>

  <rect class="tg-hero" x="360" y="230" width="180" height="60" />
  <text class="tg-inv" x="450" y="256" text-anchor="middle">Running agent</text>
  <text class="tg-inv" x="450" y="276" text-anchor="middle">holds all three</text>

  <rect class="tg-adj" x="360" y="110" width="180" height="52" />
  <text class="tg-lab" x="450" y="132" text-anchor="middle">AI gateway</text>
  <text class="tg-sub" x="450" y="150" text-anchor="middle">enforcement point</text>

  <rect class="tg-box" x="360" y="30" width="180" height="40" />
  <text class="tg-lab" x="450" y="55" text-anchor="middle">Model provider</text>

  <path class="tg-arr" d="M 450 230 L 450 166" />
  <path class="tg-arr" d="M 450 110 L 450 74" />

  <path class="tg-cut" d="M 418 202 L 482 182" />
  <text class="tg-lab" x="496" y="198">Kill switch cuts here</text>
  <text class="tg-sub" x="496" y="216">inference only</text>

  <rect class="tg-box" x="40" y="236" width="190" height="52" />
  <text class="tg-lab" x="135" y="258" text-anchor="middle">Token broker</text>
  <text class="tg-sub" x="135" y="276" text-anchor="middle">credentials still valid</text>
  <path class="tg-arr" d="M 360 262 L 236 262" />
  <text class="tg-sub" x="298" y="248" text-anchor="middle">authority</text>

  <rect class="tg-box" x="670" y="236" width="190" height="52" />
  <text class="tg-lab" x="765" y="258" text-anchor="middle">Systems of record</text>
  <text class="tg-sub" x="765" y="276" text-anchor="middle">writes already landed</text>
  <path class="tg-arr" d="M 540 262 L 664 262" />
  <text class="tg-sub" x="602" y="248" text-anchor="middle">effects</text>

  <rect class="tg-box" x="40" y="360" width="190" height="56" />
  <text class="tg-lab" x="135" y="382" text-anchor="middle">Revoke tokens</text>
  <text class="tg-sub" x="135" y="400" text-anchor="middle">your broker, your clock</text>
  <path class="tg-arr" d="M 135 360 L 135 294" />

  <rect class="tg-box" x="670" y="360" width="190" height="56" />
  <text class="tg-lab" x="765" y="382" text-anchor="middle">Compensate</text>
  <text class="tg-sub" x="765" y="400" text-anchor="middle">no switch reverses a write</text>
  <path class="tg-arr" d="M 765 360 L 765 294" />

  <text class="tg-sub" x="450" y="452" text-anchor="middle">Stopping inference stops new decisions. It does not stop a credential, a queued job, or a committed write.</text>
</svg>
