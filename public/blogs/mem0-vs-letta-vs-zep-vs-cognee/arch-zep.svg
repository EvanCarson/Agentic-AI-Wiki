<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Zep — temporal knowledge graph (Graphiti)</title>
  <desc id="d">Zep routes messages into Graphiti, a temporal knowledge graph where every node and edge carries valid-at and invalid-at timestamps. Retrieval uses time-aware ranking: facts still valid at query time are surfaced; invalidated facts are excluded. A single time-indexed graph contrasts with Mem0's multi-store fan-out.</desc>
  <style>
    .box      { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .hero     { fill: var(--accent, #d4421e); stroke: none; }
    .adj      { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .label    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--ink, #1a1a1a); }
    .label-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--paper, #fff); }
    .sub      { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .80; }
    .ts-label { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--ink, #1a1a1a); opacity: .55; }
    .anno     { font-family: var(--font-display); font-size: 13px; font-style: italic; fill: var(--muted, #888); }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 1.75; marker-end: url(#zp-arr); opacity: .70; }
    .arrow-ret{ fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; stroke-dasharray: 5 3; marker-end: url(#zp-arr-ret); opacity: .80; }
    .edge     { stroke: var(--border-soft, #d8d4ce); stroke-width: 1.5; }
    .node     { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .node-invalid { fill: var(--paper, #fff); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; stroke-dasharray: 4 3; opacity: .45; }
    .invalid-label{ font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--muted, #888); text-anchor: middle; }
  </style>
  <defs>
    <marker id="zp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="currentColor" />
    </marker>
    <marker id="zp-arr-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="var(--accent, #d4421e)" />
    </marker>
  </defs>

  <!-- ===== Messages (left) ===== -->
  <rect class="box" x="30" y="200" width="120" height="64" rx="8" ry="8" />
  <text class="label" x="90" y="228" text-anchor="middle" font-weight="600">Messages</text>
  <text class="sub" x="90" y="246" text-anchor="middle">conversation turns</text>

  <!-- Messages → Graphiti -->
  <path class="arrow" d="M 150 232 L 218 232" />

  <!-- ===== Graphiti temporal knowledge graph (hero) ===== -->
  <rect class="hero" x="220" y="120" width="200" height="220" rx="12" ry="12" />
  <text class="label-inv" x="320" y="152" text-anchor="middle" font-size="15" font-weight="600">Graphiti</text>
  <text class="sub-inv" x="320" y="170" text-anchor="middle">temporal knowledge graph</text>

  <!-- Graph nodes inside hero — valid node A -->
  <circle class="node" cx="280" cy="210" r="26" style="fill: var(--paper, #fff);" />
  <text class="label" x="280" y="207" text-anchor="middle" font-size="11" font-weight="600">fact A</text>
  <text class="ts-label" x="280" y="222" text-anchor="middle">valid ✓</text>

  <!-- valid node B -->
  <circle class="node" cx="360" cy="210" r="26" style="fill: var(--paper, #fff);" />
  <text class="label" x="360" y="207" text-anchor="middle" font-size="11" font-weight="600">fact B</text>
  <text class="ts-label" x="360" y="222" text-anchor="middle">valid ✓</text>

  <!-- edge A-B -->
  <line class="edge" x1="306" y1="210" x2="334" y2="210" />

  <!-- invalid node C (faded) -->
  <circle class="node-invalid" cx="320" cy="285" r="24" />
  <text class="invalid-label" x="320" y="282">fact C</text>
  <text class="invalid-label" x="320" y="296">invalid ✗</text>

  <!-- edge A-C dashed -->
  <line stroke="var(--border-soft, #d8d4ce)" stroke-width="1" stroke-dasharray="3 3" opacity=".40" x1="288" y1="234" x2="306" y2="264" />
  <!-- edge B-C dashed -->
  <line stroke="var(--border-soft, #d8d4ce)" stroke-width="1" stroke-dasharray="3 3" opacity=".40" x1="352" y1="234" x2="334" y2="264" />

  <!-- Timestamp label inside hero -->
  <text class="sub-inv" x="320" y="322" text-anchor="middle">valid-at · invalid-at</text>
  <text class="sub-inv" x="320" y="336" text-anchor="middle">on every node + edge</text>

  <!-- ===== Time-aware retrieval ===== -->
  <rect class="adj" x="470" y="194" width="160" height="76" rx="8" ry="8" />
  <text class="label" x="550" y="222" text-anchor="middle" font-weight="600">Time-aware</text>
  <text class="label" x="550" y="240" text-anchor="middle" font-weight="600">ranking</text>
  <text class="sub" x="550" y="258" text-anchor="middle">valid facts surfaced</text>

  <!-- Graphiti → Retrieval -->
  <path class="arrow" d="M 420 232 L 468 232" />

  <!-- Invalid excluded annotation -->
  <text class="anno" x="550" y="300" text-anchor="middle">invalidated facts excluded</text>

  <!-- ===== User / Agent (right) ===== -->
  <rect class="box" x="680" y="200" width="130" height="64" rx="8" ry="8" />
  <text class="label" x="745" y="228" text-anchor="middle" font-weight="600">Agent</text>
  <text class="sub" x="745" y="246" text-anchor="middle">receives ranked facts</text>

  <!-- Retrieval → Agent -->
  <path class="arrow" d="M 630 232 L 678 232" />

  <!-- Agent → Messages return arc -->
  <path class="arrow-ret" d="M 745 200 C 745 90 90 90 90 200" />
  <text class="sub" x="418" y="80" text-anchor="middle" fill="var(--accent, #d4421e)" opacity="0.85">memory feeds next turn</text>

  <!-- ===== Main annotation ===== -->
  <text class="anno" x="450" y="440" text-anchor="middle">Knowledge has a half-life.</text>

  <!-- Contrast note -->
  <text class="sub" x="320" y="460" text-anchor="middle">Single time-indexed graph — not a multi-store fan-out.</text>

</svg>
