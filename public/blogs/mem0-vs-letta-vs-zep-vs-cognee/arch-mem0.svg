<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Mem0 — extraction pipeline + multi-store retrieval</title>
  <desc id="d">Mem0 routes user input through an extraction pipeline that distills raw text into structured facts, then fans those facts out across three parallel stores: a vector store for semantic search, a key-value store for fast exact lookup, and a graph store for relational memory. Retrieval combines all three stores and returns results to the user.</desc>
  <style>
    .box      { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .hero     { fill: var(--accent, #d4421e); stroke: none; }
    .adj      { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .label    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--ink, #1a1a1a); }
    .label-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--paper, #fff); }
    .sub      { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .80; }
    .anno     { font-family: var(--font-display); font-size: 13px; font-style: italic; fill: var(--muted, #888); }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 1.75; marker-end: url(#m0-arr); opacity: .70; }
    .arrow-ret{ fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; stroke-dasharray: 5 3; marker-end: url(#m0-arr-ret); opacity: .80; }
  </style>
  <defs>
    <marker id="m0-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="currentColor" />
    </marker>
    <marker id="m0-arr-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="var(--accent, #d4421e)" />
    </marker>
  </defs>

  <!-- ===== User input box (left) ===== -->
  <rect class="box" x="30" y="200" width="120" height="64" rx="8" ry="8" />
  <text class="label" x="90" y="228" text-anchor="middle" font-weight="600">User</text>
  <text class="sub" x="90" y="246" text-anchor="middle">input / query</text>

  <!-- User → Extraction pipeline -->
  <path class="arrow" d="M 150 232 L 218 232" />

  <!-- ===== Extraction pipeline (hero) ===== -->
  <rect class="hero" x="220" y="180" width="180" height="104" rx="10" ry="10" />
  <text class="label-inv" x="310" y="218" text-anchor="middle" font-size="15" font-weight="600">Extraction</text>
  <text class="label-inv" x="310" y="236" text-anchor="middle" font-size="15" font-weight="600">Pipeline</text>
  <text class="sub-inv" x="310" y="256" text-anchor="middle">LLM-powered fact distiller</text>
  <text class="sub-inv" x="310" y="270" text-anchor="middle">dedup · merge · prune</text>

  <!-- Pipeline → Vector store (upper) -->
  <path class="arrow" d="M 400 210 L 560 160" />

  <!-- Pipeline → KV store (middle) -->
  <path class="arrow" d="M 400 232 L 560 232" />

  <!-- Pipeline → Graph store (lower) -->
  <path class="arrow" d="M 400 254 L 560 305" />

  <!-- ===== Vector store ===== -->
  <rect class="box" x="560" y="120" width="150" height="76" rx="8" ry="8" />
  <text class="label" x="635" y="150" text-anchor="middle" font-weight="600">Vector store</text>
  <text class="sub" x="635" y="168" text-anchor="middle">semantic search</text>
  <text class="sub" x="635" y="182" text-anchor="middle">embedding index</text>

  <!-- ===== Key-value store ===== -->
  <rect class="box" x="560" y="194" width="150" height="76" rx="8" ry="8" />
  <text class="label" x="635" y="224" text-anchor="middle" font-weight="600">Key-value store</text>
  <text class="sub" x="635" y="242" text-anchor="middle">fast exact lookup</text>
  <text class="sub" x="635" y="256" text-anchor="middle">user / session scope</text>

  <!-- ===== Graph store ===== -->
  <rect class="box" x="560" y="268" width="150" height="76" rx="8" ry="8" />
  <text class="label" x="635" y="298" text-anchor="middle" font-weight="600">Graph store</text>
  <text class="sub" x="635" y="316" text-anchor="middle">relational memory</text>
  <text class="sub" x="635" y="330" text-anchor="middle">entity edges</text>

  <!-- ===== Retrieval combiner ===== -->
  <rect class="adj" x="750" y="194" width="118" height="76" rx="8" ry="8" />
  <text class="label" x="809" y="224" text-anchor="middle" font-weight="600">Retrieval</text>
  <text class="sub" x="809" y="242" text-anchor="middle">combines all three</text>
  <text class="sub" x="809" y="256" text-anchor="middle">ranked results</text>

  <!-- Store → Retrieval arrows -->
  <path class="arrow" d="M 710 158 L 750 218" />
  <path class="arrow" d="M 710 232 L 750 232" />
  <path class="arrow" d="M 710 306 L 750 248" />

  <!-- Retrieval → User (return dashed arc) -->
  <path class="arrow-ret" d="M 809 194 C 809 100 90 100 90 200" />
  <text class="sub" x="445" y="92" text-anchor="middle" fill="var(--accent, #d4421e)" opacity="0.85">retrieved facts → user</text>

  <!-- Annotation -->
  <text class="anno" x="310" y="330" text-anchor="middle">Extracted facts beat raw transcripts.</text>

</svg>
