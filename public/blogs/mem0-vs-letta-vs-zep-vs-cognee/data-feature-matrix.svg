<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Agent memory infrastructure feature comparison matrix</title>
  <desc id="d">Heatmap comparing Mem0, Letta, Zep, and Cognee across five axes: What gets stored, Retrieval strategy, Self-hosted, Schema discipline, and Multi-user. Strength indicated by fill from light neutral (weak) to solid accent (strong).</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="32" text-anchor="middle">Feature strength by platform</text>

  <!--
    Layout:
    Left margin for row labels: 160px
    5 columns × 136px = 680px; start x=160, end=840
    Cols at x: 160, 296, 432, 568, 704 (left edge); centers: 228, 364, 500, 636, 772
    4 rows × 56px = 224px; header at y=50–72; row start y=76
    Rows at y: 76, 132, 188, 244 (top); centers: 104, 160, 216, 272
  -->

  <!-- Column headers -->
  <text class="col-head" x="228" y="54">What gets</text>
  <text class="col-head" x="228" y="66">stored</text>

  <text class="col-head" x="364" y="54">Retrieval</text>
  <text class="col-head" x="364" y="66">strategy</text>

  <text class="col-head" x="500" y="54">Self-</text>
  <text class="col-head" x="500" y="66">hosted</text>

  <text class="col-head" x="636" y="54">Schema</text>
  <text class="col-head" x="636" y="66">discipline</text>

  <text class="col-head" x="772" y="54">Multi-</text>
  <text class="col-head" x="772" y="66">user</text>

  <!-- ===== Row 1: Mem0 ===== -->
  <text class="row-head" x="152" y="104">Mem0</text>
  <!-- What gets stored: Extracted facts — strong -->
  <rect class="cell-strong" x="160" y="76" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="228" y="104">Extracted facts</text>
  <!-- Retrieval: Hybrid — strong -->
  <rect class="cell-strong" x="296" y="76" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="364" y="104">Hybrid</text>
  <!-- Self-hosted: Yes — strong -->
  <rect class="cell-strong" x="432" y="76" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="500" y="104">Yes</text>
  <!-- Schema discipline: Free-form — medium -->
  <rect class="cell-medium" x="568" y="76" width="136" height="56" rx="4" />
  <text class="cell-text" x="636" y="104">Free-form</text>
  <!-- Multi-user: Yes — strong -->
  <rect class="cell-strong" x="704" y="76" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="772" y="104">Yes</text>

  <!-- ===== Row 2: Letta ===== -->
  <text class="row-head" x="152" y="160">Letta</text>
  <!-- What gets stored: Memory hierarchy — strong -->
  <rect class="cell-strong" x="160" y="132" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="228" y="160">Memory hierarchy</text>
  <!-- Retrieval: Vector + recall — medium -->
  <rect class="cell-medium" x="296" y="132" width="136" height="56" rx="4" />
  <text class="cell-text" x="364" y="160">Vector + recall</text>
  <!-- Self-hosted: Yes — strong -->
  <rect class="cell-strong" x="432" y="132" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="500" y="160">Yes</text>
  <!-- Schema discipline: Free-form — medium -->
  <rect class="cell-medium" x="568" y="132" width="136" height="56" rx="4" />
  <text class="cell-text" x="636" y="160">Free-form</text>
  <!-- Multi-user: Yes — strong -->
  <rect class="cell-strong" x="704" y="132" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="772" y="160">Yes</text>

  <!-- ===== Row 3: Zep ===== -->
  <text class="row-head" x="152" y="216">Zep</text>
  <!-- What gets stored: Time-stamped facts — strong -->
  <rect class="cell-strong" x="160" y="188" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="228" y="216">Time-stamped facts</text>
  <!-- Retrieval: Temporal graph — strong -->
  <rect class="cell-strong" x="296" y="188" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="364" y="216">Temporal graph</text>
  <!-- Self-hosted: Yes — strong -->
  <rect class="cell-strong" x="432" y="188" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="500" y="216">Yes</text>
  <!-- Schema discipline: Light ontology — strong -->
  <rect class="cell-strong" x="568" y="188" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="636" y="216">Light ontology</text>
  <!-- Multi-user: Yes — strong -->
  <rect class="cell-strong" x="704" y="188" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="772" y="216">Yes</text>

  <!-- ===== Row 4: Cognee ===== -->
  <text class="row-head" x="152" y="272">Cognee</text>
  <!-- What gets stored: Graph from anything — strong -->
  <rect class="cell-strong" x="160" y="244" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="228" y="272">Graph from anything</text>
  <!-- Retrieval: Graph + RAG — strong -->
  <rect class="cell-strong" x="296" y="244" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="364" y="272">Graph + RAG</text>
  <!-- Self-hosted: Yes — strong -->
  <rect class="cell-strong" x="432" y="244" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="500" y="272">Yes</text>
  <!-- Schema discipline: Ontology-aware — strong -->
  <rect class="cell-strong" x="568" y="244" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="636" y="272">Ontology-aware</text>
  <!-- Multi-user: Yes — medium -->
  <rect class="cell-medium" x="704" y="244" width="136" height="56" rx="4" />
  <text class="cell-text" x="772" y="272">Yes</text>

  <!-- Legend -->
  <rect class="legend-box-w" x="160" y="330" width="16" height="16" rx="3" />
  <text class="legend-text" x="182" y="338">Weak</text>

  <rect class="legend-box-m" x="250" y="330" width="16" height="16" rx="3" />
  <text class="legend-text" x="272" y="338">Medium</text>

  <rect class="legend-box-s" x="360" y="330" width="16" height="16" rx="3" />
  <text class="legend-text" x="382" y="338">Strong</text>

</svg>
