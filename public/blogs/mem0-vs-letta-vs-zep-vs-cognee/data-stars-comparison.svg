<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">GitHub stars comparison — Mem0, Letta, Zep, Cognee</title>
  <desc id="d">Horizontal bar chart comparing GitHub stars in thousands (snapshot late June 2026): Mem0 leads at 28k, followed by Letta at 15k, Zep at 3k, and Cognee at 2k.</desc>
  <style>
    .chart-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; fill: currentColor; }
    .proj-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .bar-val     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; dominant-baseline: central; }
    .grid-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: middle; }
    .grid-line   { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .bar-accent  { fill: var(--accent, #d4421e); }
    .bar-adj     { fill: var(--accent-soft, #f5c5b8); }
    .bar-neutral { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="36" text-anchor="middle">GitHub stars (thousands, snapshot)</text>

  <!--
    Chart area: left margin 220, right margin 80, top 68, bottom 55
    Chart width = 900 - 220 - 80 = 600px for max value 30k
    Scale: 600 / 30 = 20 px per 1k
    Grid lines at 0, 5, 10, 15, 20, 25, 30
    x positions: 220 + value * 20
      0  -> 220
      5  -> 320
      10 -> 420
      15 -> 520
      20 -> 620
      25 -> 720
      30 -> 820
    4 rows, bar height 46, gap 18
    Row y starts: 75, 139, 203, 267 (top of each bar)
    Bar center y:  98, 162, 226, 290
  -->

  <!-- Grid lines -->
  <line class="grid-line" x1="220" y1="68" x2="220" y2="318" />
  <line class="grid-line" x1="320" y1="68" x2="320" y2="318" />
  <line class="grid-line" x1="420" y1="68" x2="420" y2="318" />
  <line class="grid-line" x1="520" y1="68" x2="520" y2="318" />
  <line class="grid-line" x1="620" y1="68" x2="620" y2="318" />
  <line class="grid-line" x1="720" y1="68" x2="720" y2="318" />
  <line class="grid-line" x1="820" y1="68" x2="820" y2="318" />

  <!-- Baseline -->
  <line x1="220" y1="318" x2="820" y2="318" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" />

  <!-- Grid labels -->
  <text class="grid-label" x="220" y="334">0</text>
  <text class="grid-label" x="320" y="334">5k</text>
  <text class="grid-label" x="420" y="334">10k</text>
  <text class="grid-label" x="520" y="334">15k</text>
  <text class="grid-label" x="620" y="334">20k</text>
  <text class="grid-label" x="720" y="334">25k</text>
  <text class="grid-label" x="820" y="334">30k stars</text>

  <!-- Row 1: Mem0 — 28k — accent (leader) -->
  <!-- bar width = 28 * 20 = 560 -->
  <text class="proj-label" x="212" y="98">Mem0</text>
  <rect class="bar-accent" x="220" y="75" width="560" height="46" rx="5" ry="5" />
  <text class="bar-val" x="788" y="98" style="fill: var(--accent, #d4421e);">28k</text>

  <!-- Row 2: Letta — 15k — accent-soft -->
  <!-- bar width = 15 * 20 = 300 -->
  <text class="proj-label" x="212" y="162">Letta</text>
  <rect class="bar-adj" x="220" y="139" width="300" height="46" rx="5" ry="5" />
  <text class="bar-val" x="528" y="162" style="fill: var(--ink, #1a1a1a);">15k</text>

  <!-- Row 3: Zep — 3k — paper-2 (neutral) -->
  <!-- bar width = 3 * 20 = 60 -->
  <text class="proj-label" x="212" y="226">Zep</text>
  <rect class="bar-neutral" x="220" y="203" width="60" height="46" rx="5" ry="5" />
  <text class="bar-val" x="288" y="226" style="fill: var(--muted, #888);">3k</text>

  <!-- Row 4: Cognee — 2k — paper-2 (neutral) -->
  <!-- bar width = 2 * 20 = 40 -->
  <text class="proj-label" x="212" y="290">Cognee</text>
  <rect class="bar-neutral" x="220" y="267" width="40" height="46" rx="5" ry="5" />
  <text class="bar-val" x="268" y="290" style="fill: var(--muted, #888);">2k</text>

</svg>
