<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Mem0 logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Stylized "M" built from two chevron strokes, evoking a memory
       stack or neural store. The central dip of the M doubles as a
       zero / loop — referencing the "0" in Mem0 (persistent state). -->
  <!-- Left arm of M -->
  <polyline points="6,24 6,10 13,18 16,14" fill="none" stroke="var(--paper, #faf9f7)"
            stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right arm of M -->
  <polyline points="16,14 19,18 26,10 26,24" fill="none" stroke="var(--paper, #faf9f7)"
            stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Small ring at centre bottom of M — the "0" / persistent-memory node -->
  <circle cx="16" cy="24" r="2.5" fill="var(--paper, #faf9f7)" opacity="0.9" />
</svg>
