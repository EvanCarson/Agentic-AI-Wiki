<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Cognee logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Connected-graph nodes motif for Cognee — a library that builds
       knowledge graphs from arbitrary data sources.
       Five nodes form a pentagon; edges connect each to a central hub,
       evoking a star / spoke pattern — "graph from anything". -->
  <!-- Hub node -->
  <circle cx="16" cy="16" r="2.5" fill="var(--paper, #faf9f7)" />
  <!-- Five peripheral nodes with spoke edges -->
  <!-- Top -->
  <circle cx="16" cy="6.5" r="2" fill="var(--paper, #faf9f7)" opacity="0.85" />
  <line x1="16" y1="8.5" x2="16" y2="13.5" stroke="var(--paper, #faf9f7)" stroke-width="1.5" stroke-linecap="round" />
  <!-- Upper-right -->
  <circle cx="25" cy="11.5" r="2" fill="var(--paper, #faf9f7)" opacity="0.85" />
  <line x1="23.3" y1="12.9" x2="18.2" y2="15" stroke="var(--paper, #faf9f7)" stroke-width="1.5" stroke-linecap="round" />
  <!-- Lower-right -->
  <circle cx="22" cy="24" r="2" fill="var(--paper, #faf9f7)" opacity="0.85" />
  <line x1="20.3" y1="22.6" x2="17.8" y2="18.2" stroke="var(--paper, #faf9f7)" stroke-width="1.5" stroke-linecap="round" />
  <!-- Lower-left -->
  <circle cx="10" cy="24" r="2" fill="var(--paper, #faf9f7)" opacity="0.85" />
  <line x1="11.7" y1="22.6" x2="14.2" y2="18.2" stroke="var(--paper, #faf9f7)" stroke-width="1.5" stroke-linecap="round" />
  <!-- Upper-left -->
  <circle cx="7" cy="11.5" r="2" fill="var(--paper, #faf9f7)" opacity="0.85" />
  <line x1="8.7" y1="12.9" x2="13.8" y2="15" stroke="var(--paper, #faf9f7)" stroke-width="1.5" stroke-linecap="round" />
</svg>
