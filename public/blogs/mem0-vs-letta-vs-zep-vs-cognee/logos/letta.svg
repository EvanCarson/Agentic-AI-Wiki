<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Letta logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Abstract brain / ring-L motif — Letta was formerly MemGPT and
       centres its identity on stateful LLM agents.
       Outer ring evokes a neural loop / continuous memory context.
       Inner "L" serif foot marks the rebrand to Letta. -->
  <!-- Outer ring (open at bottom-right to suggest openness / streaming) -->
  <path d="M 16 6 A 10 10 0 1 1 25 22" fill="none"
        stroke="var(--paper, #faf9f7)" stroke-width="2.75" stroke-linecap="round" />
  <!-- "L" inside the ring -->
  <line x1="13" y1="10" x2="13" y2="22" stroke="var(--paper, #faf9f7)"
        stroke-width="2.75" stroke-linecap="round" />
  <line x1="13" y1="22" x2="21" y2="22" stroke="var(--paper, #faf9f7)"
        stroke-width="2.75" stroke-linecap="round" />
</svg>
