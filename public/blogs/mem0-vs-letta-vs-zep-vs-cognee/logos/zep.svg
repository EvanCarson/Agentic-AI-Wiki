<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Zep logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Temporal-spiral motif for Zep — a knowledge-graph memory store
       that orders facts by time. Two concentric arcs unwind clockwise
       like a clock spring / time ribbon, with a small anchor node at
       centre to evoke a graph vertex. -->
  <!-- Outer arc — most recent temporal layer -->
  <path d="M 16 7 A 9 9 0 1 1 7.5 21" fill="none"
        stroke="var(--paper, #faf9f7)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Inner arc — older memory layer, smaller radius -->
  <path d="M 16 11 A 5 5 0 1 1 11.5 20" fill="none"
        stroke="var(--paper, #faf9f7)" stroke-width="2" stroke-linecap="round" opacity="0.75" />
  <!-- Centre node — root vertex in the knowledge graph -->
  <circle cx="16" cy="16" r="2" fill="var(--paper, #faf9f7)" />
</svg>
