<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Approval mechanics compared across four axes</title>
  <desc id="d">Feature matrix with four frameworks as rows and four axes as columns: durability of the pause, precision of resume, built-in timeout handling, and whether the approval channel is decoupled from the UI. Temporal is strong on durability, resume precision and timeouts; LangGraph is strong on durability and channel decoupling but weak on resume precision; the Agents SDK is medium throughout; the Vercel AI SDK is weak on durability and channel decoupling.</desc>
  <style>
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .colh   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; text-anchor: middle; }
    .rowh   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .cell-i { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .lg     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="ttl" x="20" y="30">Four axes, and nobody wins all four</text>

  <text class="colh" x="268" y="62">pause survives</text>
  <text class="colh" x="268" y="76">a restart</text>
  <text class="colh" x="420" y="62">resume is</text>
  <text class="colh" x="420" y="76">exact</text>
  <text class="colh" x="572" y="62">timeout is</text>
  <text class="colh" x="572" y="76">built in</text>
  <text class="colh" x="724" y="62">channel is</text>
  <text class="colh" x="724" y="76">decoupled</text>

  <text class="rowh" x="20" y="112">LangGraph</text>
  <rect class="strong" x="196" y="90" width="144" height="34" rx="3" />
  <text class="cell-i" x="268" y="112">Strong</text>
  <rect class="weak" x="348" y="90" width="144" height="34" rx="3" />
  <text class="cell" x="420" y="112">Weak (node replay)</text>
  <rect class="weak" x="500" y="90" width="144" height="34" rx="3" />
  <text class="cell" x="572" y="112">Weak</text>
  <rect class="strong" x="652" y="90" width="144" height="34" rx="3" />
  <text class="cell-i" x="724" y="112">Strong</text>

  <text class="rowh" x="20" y="166">Agents SDK</text>
  <rect class="med" x="196" y="144" width="144" height="34" rx="3" />
  <text class="cell" x="268" y="166">Medium (you store it)</text>
  <rect class="med" x="348" y="144" width="144" height="34" rx="3" />
  <text class="cell" x="420" y="166">Medium (per call)</text>
  <rect class="weak" x="500" y="144" width="144" height="34" rx="3" />
  <text class="cell" x="572" y="166">Weak</text>
  <rect class="med" x="652" y="144" width="144" height="34" rx="3" />
  <text class="cell" x="724" y="166">Medium</text>

  <text class="rowh" x="20" y="220">AI SDK</text>
  <rect class="weak" x="196" y="198" width="144" height="34" rx="3" />
  <text class="cell" x="268" y="220">Weak (the tab)</text>
  <rect class="med" x="348" y="198" width="144" height="34" rx="3" />
  <text class="cell" x="420" y="220">Medium (per call)</text>
  <rect class="weak" x="500" y="198" width="144" height="34" rx="3" />
  <text class="cell" x="572" y="220">Weak</text>
  <rect class="weak" x="652" y="198" width="144" height="34" rx="3" />
  <text class="cell" x="724" y="220">Weak (the chat UI)</text>

  <text class="rowh" x="20" y="274">Temporal</text>
  <rect class="strong" x="196" y="252" width="144" height="34" rx="3" />
  <text class="cell-i" x="268" y="274">Strong</text>
  <rect class="strong" x="348" y="252" width="144" height="34" rx="3" />
  <text class="cell-i" x="420" y="274">Strong</text>
  <rect class="strong" x="500" y="252" width="144" height="34" rx="3" />
  <text class="cell-i" x="572" y="274">Strong (durable timer)</text>
  <rect class="strong" x="652" y="252" width="144" height="34" rx="3" />
  <text class="cell-i" x="724" y="274">Strong (signals)</text>

  <rect class="weak" x="196" y="320" width="18" height="14" rx="2" />
  <text class="lg" x="222" y="332">Weak</text>
  <rect class="med" x="286" y="320" width="18" height="14" rx="2" />
  <text class="lg" x="312" y="332">Medium</text>
  <rect class="strong" x="390" y="320" width="18" height="14" rx="2" />
  <text class="lg" x="416" y="332">Strong</text>
  <text class="lg" x="196" y="368">"Built in" means the framework owns the clock. None of the four decides what silence means — that branch is always yours.</text>
</svg>
