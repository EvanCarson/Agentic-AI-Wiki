<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Where a pending approval is stored, by framework</title>
  <desc id="d">Four columns: LangGraph stores the pause in a checkpointer you run, keyed by thread id; the OpenAI Agents SDK hands you a serialisable run state to persist yourself; the Vercel AI SDK keeps it in the UI message history in the browser; and Temporal keeps it in the cluster's workflow history behind a durable timer.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--paper); text-anchor: middle; }
    .ln     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .78; text-anchor: middle; }
    .ln-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .9; text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
  </style>

  <text class="ttl" x="20" y="30">The pause has to live somewhere, and that is the whole choice</text>

  <rect class="adj" x="24" y="52" width="198" height="196" />
  <text class="hd" x="123" y="80">LangGraph</text>
  <text class="ln" x="123" y="106">A checkpointer you run,</text>
  <text class="ln" x="123" y="122">keyed by thread id</text>
  <text class="ln" x="123" y="154">Survives a restart</text>
  <text class="ln" x="123" y="194">Resume re-runs</text>
  <text class="vd" x="123" y="212">the whole node</text>

  <rect class="box" x="242" y="52" width="198" height="196" />
  <text class="hd" x="341" y="80">Agents SDK</text>
  <text class="ln" x="341" y="106">A serialisable run state</text>
  <text class="ln" x="341" y="122">you persist yourself</text>
  <text class="ln" x="341" y="154">Survives if you store it</text>
  <text class="ln" x="341" y="194">Resume continues</text>
  <text class="vd" x="341" y="212">at the tool call</text>

  <rect class="box" x="460" y="52" width="198" height="196" />
  <text class="hd" x="559" y="80">AI SDK</text>
  <text class="ln" x="559" y="106">The UI message history,</text>
  <text class="ln" x="559" y="122">in the browser</text>
  <text class="ln" x="559" y="154">Dies with the tab</text>
  <text class="ln" x="559" y="194">Resume is just</text>
  <text class="vd" x="559" y="212">the next request</text>

  <rect class="hero" x="678" y="52" width="198" height="196" />
  <text class="hd-inv" x="777" y="80">Temporal</text>
  <text class="ln-inv" x="777" y="106">The cluster's workflow</text>
  <text class="ln-inv" x="777" y="122">history</text>
  <text class="ln-inv" x="777" y="154">Survives deployments</text>
  <text class="ln-inv" x="777" y="194">Resume continues</text>
  <text class="vd-inv" x="777" y="212">at the next line</text>

  <text class="ln" x="450" y="278">Durability rises left to right; so does what you have to run. Nobody gives you a default for silence.</text>
</svg>
