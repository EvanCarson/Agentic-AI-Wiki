<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">What re-executes when an approval resumes</title>
  <desc id="d">Two lanes compared. In the whole-node replay model, resuming re-runs the node from its first line, so a write that happened before the pause happens a second time. In the exactly-resumed model, execution continues at the statement after the wait and the earlier write is not repeated.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .lane   { fill: none; stroke: var(--border-soft); stroke-width: 1.25; rx: 10; ry: 10; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .cell   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); text-anchor: middle; }
    .cell-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--paper); text-anchor: middle; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .warn   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--accent, #d4421e); }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .back   { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; stroke-dasharray: 4 3; marker-end: url(#arr2); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent, #d4421e)" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="30">Resume is not the same operation in both models</text>

  <rect class="lane" x="20" y="48" width="860" height="190" />
  <text class="hd" x="36" y="74">Whole-node replay</text>
  <text class="note" x="36" y="94">resume re-enters the node at its first line</text>

  <rect class="box" x="230" y="108" width="150" height="54" />
  <text class="cell" x="305" y="132">write_audit()</text>
  <text class="cell" x="305" y="150">(side effect)</text>
  <path class="arrow" d="M 380 135 L 424 135" />
  <rect class="adj" x="426" y="108" width="150" height="54" />
  <text class="cell" x="501" y="140">pause for human</text>
  <path class="arrow" d="M 576 135 L 620 135" />
  <rect class="box" x="622" y="108" width="150" height="54" />
  <text class="cell" x="697" y="140">do_the_thing()</text>

  <path class="back" d="M 697 162 C 697 206, 305 206, 305 168" />
  <text class="warn" x="420" y="224">on resume, write_audit() runs a second time</text>

  <rect class="lane" x="20" y="262" width="860" height="190" />
  <text class="hd" x="36" y="288">Exactly resumed</text>
  <text class="note" x="36" y="308">execution continues at the statement after the wait</text>

  <rect class="box" x="230" y="322" width="150" height="54" />
  <text class="cell" x="305" y="346">write_audit()</text>
  <text class="cell" x="305" y="364">(side effect)</text>
  <path class="arrow" d="M 380 349 L 424 349" />
  <rect class="hero" x="426" y="322" width="150" height="54" />
  <text class="cell-inv" x="501" y="348">await decision</text>
  <text class="cell-inv" x="501" y="366">(durable timer)</text>
  <path class="arrow" d="M 576 349 L 620 349" />
  <rect class="box" x="622" y="322" width="150" height="54" />
  <text class="cell" x="697" y="354">do_the_thing()</text>

  <text class="note" x="230" y="420">The history remembers that write_audit() already returned, so it is not re-run.</text>
  <text class="note" x="230" y="440">The cost is a cluster and a programming model that forbids non-determinism.</text>
</svg>
