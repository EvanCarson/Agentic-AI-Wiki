<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="pt pd">
  <title id="pt">The model proposes, code and rules decide, a person approves</title>
  <desc id="pd">Three columns. The model reads documents, matches records and drafts commentary. Deterministic code and rules compute every amount, post entries and write the log. A named person approves payouts, sign-offs and anything outside policy. Arrows run from the model to code and rules, and from code and rules to the person.</desc>
  <style>
    .box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .h    { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: var(--ink); }
    .h-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: var(--paper); }
    .t    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .t-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .arrow{ fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#pa); }
  </style>
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="adj" x="30" y="40" width="240" height="220" rx="10" ry="10" />
  <text class="h" x="150" y="78" text-anchor="middle">The model proposes</text>
  <text class="t" x="150" y="122" text-anchor="middle">reads documents</text>
  <text class="t" x="150" y="150" text-anchor="middle">matches records</text>
  <text class="t" x="150" y="178" text-anchor="middle">drafts commentary</text>
  <text class="t" x="150" y="226" text-anchor="middle">output is a proposal</text>

  <rect class="hero" x="330" y="40" width="240" height="220" rx="10" ry="10" />
  <text class="h-inv" x="450" y="78" text-anchor="middle">Code and rules decide</text>
  <text class="t-inv" x="450" y="122" text-anchor="middle">compute every amount</text>
  <text class="t-inv" x="450" y="150" text-anchor="middle">post through rules</text>
  <text class="t-inv" x="450" y="178" text-anchor="middle">write the log</text>
  <text class="t-inv" x="450" y="226" text-anchor="middle">same facts, same result</text>

  <rect class="box" x="630" y="40" width="240" height="220" rx="10" ry="10" />
  <text class="h" x="750" y="78" text-anchor="middle">A person approves</text>
  <text class="t" x="750" y="122" text-anchor="middle">payouts</text>
  <text class="t" x="750" y="150" text-anchor="middle">sign-offs</text>
  <text class="t" x="750" y="178" text-anchor="middle">anything outside policy</text>
  <text class="t" x="750" y="226" text-anchor="middle">a named owner</text>

  <line class="arrow" x1="272" y1="150" x2="326" y2="150" />
  <line class="arrow" x1="572" y1="150" x2="626" y2="150" />
</svg>
