<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three reported access paths and what each one assumed</title>
  <desc id="d">Three columns. Credentials in application configuration assume the config is not reachable. Keys in public code repositories assume nobody is reading at scale. Over-permissive cloud roles assume the holder is well-behaved. In all three cases the access used a valid credential, so no exploit signature existed to detect.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="20" y="28">What each exposure assumed, and what fired</text>

  <text class="lbl" x="20" y="96">Assumes</text>
  <text class="lbl" x="20" y="206">Fired</text>

  <rect class="hero" x="96" y="52" width="180" height="92" />
  <text class="hd-inv" x="186" y="82">App config</text>
  <text class="vd-inv" x="186" y="108">the configuration</text>
  <text class="vd-inv" x="186" y="128">is not reachable</text>

  <rect class="adj" x="360" y="52" width="180" height="92" />
  <text class="hd" x="450" y="82">Public repo</text>
  <text class="vd" x="450" y="108">nobody reads every</text>
  <text class="vd" x="450" y="128">repo at scale</text>

  <rect class="box" x="660" y="52" width="180" height="92" />
  <text class="hd" x="750" y="82">Cloud role</text>
  <text class="vd" x="750" y="108">whoever holds it</text>
  <text class="vd" x="750" y="128">behaves well</text>

  <rect class="box" x="96" y="162" width="180" height="96" />
  <text class="vd" x="186" y="192">nothing: the call</text>
  <text class="vd" x="186" y="214">authenticated and</text>
  <text class="vd" x="186" y="236">was authorised</text>

  <rect class="box" x="360" y="162" width="180" height="96" />
  <text class="vd" x="450" y="192">nothing: reading a</text>
  <text class="vd" x="450" y="214">public repo is not</text>
  <text class="vd" x="450" y="236">an event at all</text>

  <rect class="box" x="660" y="162" width="180" height="96" />
  <text class="vd" x="750" y="192">nothing: the role</text>
  <text class="vd" x="750" y="214">permitted exactly</text>
  <text class="vd" x="750" y="236">what was done</text>
</svg>
