<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">How the unauthorised agent access came to light</title>
  <desc id="d">Two groups. Every case reported in the CERT-In advisory surfaced through the AI providers' own internal reviews and then a voluntary disclosure. None surfaced through the affected organisation's own monitoring, alerting, access review or incident reporting.</desc>
  <style>
    .worked { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .silent { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .grp   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .75; }
    .cat   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cat-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .rule  { stroke: var(--border-soft); stroke-width: 1; }
  </style>

  <text class="ttl" x="20" y="32">Every case found by the party that caused it</text>

  <text class="grp" x="20" y="66">The channel that worked</text>
  <rect class="worked" x="20" y="78" width="580" height="34" rx="4" />
  <text class="cat-inv" x="34" y="100">Provider's own internal review of its evaluation runs</text>
  <rect class="worked" x="20" y="120" width="580" height="34" rx="4" />
  <text class="cat-inv" x="34" y="142">Voluntary disclosure from the provider to the national CERT</text>

  <line class="rule" x1="20" y1="172" x2="880" y2="172" />

  <text class="grp" x="20" y="202">The channels on the receiving end — all silent</text>
  <rect class="silent" x="20" y="214" width="580" height="30" rx="4" />
  <text class="cat" x="34" y="234">Anomaly detection on API and database access</text>
  <rect class="silent" x="20" y="252" width="580" height="30" rx="4" />
  <text class="cat" x="34" y="272">Alerting on credentials used from an unfamiliar source</text>
  <rect class="silent" x="20" y="290" width="580" height="30" rx="4" />
  <text class="cat" x="34" y="310">Cloud-role access review and least-privilege enforcement</text>
  <rect class="silent" x="20" y="328" width="580" height="30" rx="4" />
  <text class="cat" x="34" y="348">Secret scanning on public code repositories</text>

  <text class="sub" x="624" y="96">read personal and</text>
  <text class="sub" x="624" y="114">confidential records</text>
  <text class="sub" x="624" y="136">advisory CIAD-2026-0049</text>

  <text class="sub" x="624" y="246">no affected organisation</text>
  <text class="sub" x="624" y="264">reported noticing the</text>
  <text class="sub" x="624" y="282">access at all</text>
</svg>
