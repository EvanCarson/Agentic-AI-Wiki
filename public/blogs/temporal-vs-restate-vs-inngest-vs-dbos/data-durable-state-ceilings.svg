<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Published per-run ceilings on durable state</title>
  <desc id="d">A horizontal bar chart of the published ceiling on durable state per run. Temporal terminates a workflow whose event history passes 50 megabytes or 51,201 events. Inngest caps function run state at 32 megabytes. Restate publishes no fixed per-run ceiling and compresses payloads as they approach the limit. DBOS publishes no ceiling because checkpoints are rows in the Postgres database you operate. The two open-ended bars are drawn with a dashed edge to show they are bounded by storage rather than by the engine.</desc>
  <style>
    .grid   { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 5; opacity: .28; }
    .axis   { stroke: var(--ink); stroke-width: 1.25; opacity: .55; }
    .bar-a  { fill: var(--accent, #d4421e); }
    .bar-b  { fill: var(--accent-soft); }
    .bar-c  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 6 4; }
    .name   { font-family: 'Inter', system-ui, sans-serif; font-size: 13.5px; font-weight: 600; fill: var(--ink); }
    .val    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink); }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); opacity: .68; }
    .tick   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; text-anchor: middle; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink); }
  </style>

  <text class="title" x="30" y="28">Published ceiling on durable state, per run</text>

  <line class="axis" x1="230" y1="56" x2="230" y2="330" />
  <line class="grid" x1="366" y1="56" x2="366" y2="330" />
  <line class="grid" x1="502" y1="56" x2="502" y2="330" />
  <line class="grid" x1="638" y1="56" x2="638" y2="330" />
  <line class="grid" x1="774" y1="56" x2="774" y2="330" />
  <text class="tick" x="230" y="350">0</text>
  <text class="tick" x="366" y="350">16 MB</text>
  <text class="tick" x="502" y="350">32 MB</text>
  <text class="tick" x="638" y="350">48 MB</text>
  <text class="tick" x="774" y="350">64 MB</text>

  <text class="name" x="30" y="86">Temporal</text>
  <rect class="bar-a" x="230" y="66" width="425" height="30" rx="3" />
  <text class="val" x="667" y="86">50 MB</text>
  <text class="note" x="30" y="106">history, or 51,201 events &#8212; run terminated</text>

  <text class="name" x="30" y="152">Inngest</text>
  <rect class="bar-b" x="230" y="132" width="272" height="30" rx="3" />
  <text class="val" x="514" y="152">32 MB</text>
  <text class="note" x="30" y="172">function run state; 4 MB per step output</text>

  <text class="name" x="30" y="218">Restate</text>
  <rect class="bar-c" x="230" y="198" width="600" height="30" rx="3" />
  <text class="note" x="30" y="238">no fixed published ceiling; payloads compressed near the limit</text>

  <text class="name" x="30" y="284">DBOS</text>
  <rect class="bar-c" x="230" y="264" width="600" height="30" rx="3" />
  <text class="note" x="30" y="304">no ceiling; checkpoints are rows in your own Postgres</text>

  <text class="note" x="30" y="382">Solid bars are enforced by the engine. Dashed bars run to the edge of your storage instead.</text>
</svg>
