<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where each engine keeps the durable record of a run</title>
  <desc id="d">Four columns. Temporal keeps event history in a server cluster backed by Cassandra or a SQL store, operated by you or by Temporal Cloud. Restate keeps a journal and embedded key-value state in a single Rust binary using a distributed log. Inngest keeps step state in its managed platform and calls your functions back over HTTP. DBOS keeps checkpoints in the Postgres database your application already uses, as a library running inside your own process.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .name   { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--paper); text-anchor: middle; }
    .rowlbl { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ink); opacity: .6; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); text-anchor: middle; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; text-anchor: middle; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink); }
  </style>

  <text class="title" x="30" y="28">Where the durable record of a run is kept</text>

  <rect class="hero" x="30" y="48" width="195" height="42" />
  <text class="name" x="127" y="75">Temporal</text>
  <rect class="hero" x="245" y="48" width="195" height="42" />
  <text class="name" x="342" y="75">Restate</text>
  <rect class="hero" x="460" y="48" width="195" height="42" />
  <text class="name" x="557" y="75">Inngest</text>
  <rect class="hero" x="675" y="48" width="195" height="42" />
  <text class="name" x="772" y="75">DBOS</text>

  <text class="rowlbl" x="30" y="118">THE RECORD</text>
  <rect class="adj" x="30" y="128" width="195" height="72" />
  <text class="cell" x="127" y="155">Event history</text>
  <text class="sub" x="127" y="176">Every command and</text>
  <text class="sub" x="127" y="192">result, append-only</text>
  <rect class="adj" x="245" y="128" width="195" height="72" />
  <text class="cell" x="342" y="155">Journal + KV state</text>
  <text class="sub" x="342" y="176">Durable log, plus state</text>
  <text class="sub" x="342" y="192">on virtual objects</text>
  <rect class="adj" x="460" y="128" width="195" height="72" />
  <text class="cell" x="557" y="155">Step state</text>
  <text class="sub" x="557" y="176">Each step&#8217;s output,</text>
  <text class="sub" x="557" y="192">held by the platform</text>
  <rect class="adj" x="675" y="128" width="195" height="72" />
  <text class="cell" x="772" y="155">Postgres rows</text>
  <text class="sub" x="772" y="176">Checkpoints in the DB</text>
  <text class="sub" x="772" y="192">your app already has</text>

  <text class="rowlbl" x="30" y="230">WHAT YOU RUN</text>
  <rect class="box" x="30" y="240" width="195" height="72" />
  <text class="cell" x="127" y="267">Server cluster</text>
  <text class="sub" x="127" y="288">Self-hosted (MIT) or</text>
  <text class="sub" x="127" y="304">Temporal Cloud</text>
  <rect class="box" x="245" y="240" width="195" height="72" />
  <text class="cell" x="342" y="267">One Rust binary</text>
  <text class="sub" x="342" y="288">Distributed log; MIT</text>
  <text class="sub" x="342" y="304">SDKs, BSL runtime</text>
  <rect class="box" x="460" y="240" width="195" height="72" />
  <text class="cell" x="557" y="267">Nothing</text>
  <text class="sub" x="557" y="288">Managed platform calls</text>
  <text class="sub" x="557" y="304">your functions over HTTP</text>
  <rect class="box" x="675" y="240" width="195" height="72" />
  <text class="cell" x="772" y="267">Nothing new</text>
  <text class="sub" x="772" y="288">A library inside your</text>
  <text class="sub" x="772" y="304">own process</text>

  <text class="rowlbl" x="30" y="342">WHO ABSORBS THE GROWTH</text>
  <rect class="box" x="30" y="352" width="195" height="72" />
  <text class="cell" x="127" y="379">The engine</text>
  <text class="sub" x="127" y="400">Hard ceiling; the run</text>
  <text class="sub" x="127" y="416">is terminated</text>
  <rect class="box" x="245" y="352" width="195" height="72" />
  <text class="cell" x="342" y="379">Your storage</text>
  <text class="sub" x="342" y="400">Payloads compressed</text>
  <text class="sub" x="342" y="416">near the size limit</text>
  <rect class="box" x="460" y="352" width="195" height="72" />
  <text class="cell" x="557" y="379">The platform</text>
  <text class="sub" x="557" y="400">Per-step and per-run</text>
  <text class="sub" x="557" y="416">size limits apply</text>
  <rect class="box" x="675" y="352" width="195" height="72" />
  <text class="cell" x="772" y="379">Your Postgres</text>
  <text class="sub" x="772" y="400">Your table growth,</text>
  <text class="sub" x="772" y="416">your vacuum</text>

  <text class="sub" x="450" y="468" style="font-size:12px; opacity:.75">A long agent run grows the record on every turn; the column you pick decides who notices first.</text>
</svg>
