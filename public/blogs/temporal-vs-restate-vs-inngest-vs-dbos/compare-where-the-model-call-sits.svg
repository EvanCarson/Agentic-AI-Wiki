<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three execution models and where the LLM call is allowed to sit</title>
  <desc id="d">Three columns. Replayed deterministic code, used by Temporal, re-executes the workflow function on recovery, so the model call must live in an activity and streaming cannot originate in workflow scope. Journaled ordinary code, used by Restate and Inngest, records each durable step's result and replays it, so the constraint is that step results must be serialisable and stable. Decorated in-process functions, used by DBOS, checkpoint to your own Postgres from inside your application, so there is no separate worker fleet and the failure domain is your app.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
    .head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--paper); text-anchor: middle; }
    .who   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ink); opacity: .8; text-anchor: middle; }
    .who-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--paper); opacity: .9; text-anchor: middle; }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; text-anchor: middle; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; text-anchor: middle; }
    .title { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink); }
  </style>

  <text class="title" x="40" y="32">What the recovery mechanism asks of your code</text>

  <rect class="hero" x="40" y="52" width="240" height="190" />
  <text class="head-inv" x="160" y="80">Replayed deterministic code</text>
  <text class="who-inv" x="160" y="102">Temporal</text>
  <text class="sub-inv" x="160" y="130">The workflow function is</text>
  <text class="sub-inv" x="160" y="150">re-executed on recovery.</text>
  <text class="sub-inv" x="160" y="178">The model call must be an</text>
  <text class="sub-inv" x="160" y="198">activity; no clocks, no random,</text>
  <text class="sub-inv" x="160" y="218">no streaming in workflow scope.</text>

  <rect class="adj" x="330" y="52" width="240" height="190" />
  <text class="head" x="450" y="80">Journaled ordinary code</text>
  <text class="who" x="450" y="102">Restate &#183; Inngest</text>
  <text class="sub" x="450" y="130">Each durable step&#8217;s result is</text>
  <text class="sub" x="450" y="150">recorded and replayed.</text>
  <text class="sub" x="450" y="178">Normal functions; the rule is</text>
  <text class="sub" x="450" y="198">that step results serialise and</text>
  <text class="sub" x="450" y="218">stay stable across a retry.</text>

  <rect class="box" x="620" y="52" width="240" height="190" />
  <text class="head" x="740" y="80">Decorated in-process</text>
  <text class="who" x="740" y="102">DBOS</text>
  <text class="sub" x="740" y="130">Decorators checkpoint to the</text>
  <text class="sub" x="740" y="150">Postgres you already run.</text>
  <text class="sub" x="740" y="178">No worker fleet, no extra hop</text>
  <text class="sub" x="740" y="198">&#8212; and the failure domain is</text>
  <text class="sub" x="740" y="218">your own application process.</text>

  <text class="sub" x="450" y="278">Only the first column changes how you have to write the agent loop.</text>
</svg>
