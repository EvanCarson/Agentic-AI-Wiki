<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ct cd">
  <title id="ct">Sensor CPU cost, millicores on a 2-vCPU node</title>
  <desc id="cd">Horizontal bar chart of steady-state agent CPU consumption measured in one 2025 comparison on two-vCPU Kubernetes nodes. Falco used roughly 430 millicores, Tracee about 92, and Tetragon about 6.5. KubeArmor was not in that measurement. The spread is roughly sixty-fold between the highest and lowest.</desc>
  <style>
    .barA   { fill: var(--accent, #d4421e); }
    .barB   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .barC   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .axis   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .name   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .valA   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--accent, #d4421e); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .grid   { stroke: var(--ink); stroke-width: .75; stroke-dasharray: 2 4; opacity: .25; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>

  <text class="title" x="20" y="26">Steady-state sensor CPU, millicores per node</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <line class="grid" x1="240" y1="58" x2="240" y2="290" />
  <line class="grid" x1="400" y1="58" x2="400" y2="290" />
  <line class="grid" x1="560" y1="58" x2="560" y2="290" />
  <line class="grid" x1="720" y1="58" x2="720" y2="290" />
  <text class="axis" x="240" y="308" text-anchor="middle">100</text>
  <text class="axis" x="400" y="308" text-anchor="middle">200</text>
  <text class="axis" x="560" y="308" text-anchor="middle">300</text>
  <text class="axis" x="720" y="308" text-anchor="middle">400</text>

  <text class="name" x="20" y="90">Falco</text>
  <rect class="barA" x="150" y="74" width="688" height="30" rx="3" />
  <text class="valA" x="846" y="95">430</text>

  <text class="name" x="20" y="152">Tracee</text>
  <rect class="barB" x="150" y="136" width="147" height="30" rx="3" />
  <text class="val" x="307" y="157">92</text>

  <text class="name" x="20" y="214">Tetragon</text>
  <rect class="barC" x="150" y="198" width="11" height="30" rx="3" />
  <text class="val" x="171" y="219">6.5</text>

  <text class="name" x="20" y="276">KubeArmor</text>
  <text class="sub" x="150" y="276">not included in this measurement</text>

  <line class="rule" x1="20" y1="336" x2="880" y2="336" />
  <text class="sub" x="20" y="360">One 2025 comparison, one workload shape, 2-vCPU nodes. Read the ordering, not the digits.</text>
  <text class="sub" x="20" y="380">Cost is per event, and an agent harness execs a new process for every tool call.</text>
</svg>
