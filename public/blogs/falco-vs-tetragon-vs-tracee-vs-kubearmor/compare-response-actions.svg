<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="rt rd">
  <title id="rt">Three response actions and what each does to a running agent loop</title>
  <desc id="rd">Three columns. An alert leaves the action completed and the loop unaware, so the agent keeps going and a human arrives later. A SIGKILL removes the tool subprocess with no explanation, so the model sees a crash and retries a different way, and the in-flight operation may already have landed. A denial returns EPERM to the tool, which the harness surfaces as a tool error the model can read, so the agent adapts or stops and the refusal is attributable.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .item   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .item-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>

  <text class="head" x="20" y="26">The response action is the product decision, not the detection</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <rect class="box" x="30" y="58" width="260" height="188" rx="8" />
  <text class="cap" x="46" y="80">ALERT ONLY</text>
  <text class="head" x="46" y="104">Falco, Tracee default</text>
  <text class="item" x="46" y="132">the action completed</text>
  <text class="item" x="46" y="152">the loop never noticed</text>
  <text class="item" x="46" y="172">a human arrives minutes later</text>
  <text class="item" x="46" y="192">good: no blast radius on false</text>
  <text class="item" x="46" y="208">positives</text>
  <text class="item" x="46" y="234">Use for: unknown behaviour</text>

  <rect class="adj" x="320" y="58" width="260" height="188" rx="8" />
  <text class="cap" x="336" y="80">SIGKILL THE PROCESS</text>
  <text class="head" x="336" y="104">Tetragon, KubeArmor</text>
  <text class="item" x="336" y="132">tool subprocess disappears</text>
  <text class="item" x="336" y="152">model sees an unexplained crash</text>
  <text class="item" x="336" y="172">it retries, differently</text>
  <text class="item" x="336" y="192">in-flight operation may already</text>
  <text class="item" x="336" y="208">have landed</text>
  <text class="item" x="336" y="234">Use for: the agent itself, once</text>

  <rect class="hero" x="610" y="58" width="260" height="188" rx="8" />
  <text class="cap" x="626" y="80" fill="var(--paper)" opacity=".7">DENY BEFORE EXECUTE</text>
  <text class="head-inv" x="626" y="104">LSM hook returns EPERM</text>
  <text class="item-inv" x="626" y="132">nothing happened</text>
  <text class="item-inv" x="626" y="152">tool returns a readable error</text>
  <text class="item-inv" x="626" y="172">model adapts or asks</text>
  <text class="item-inv" x="626" y="192">the refusal is attributable to a</text>
  <text class="item-inv" x="626" y="208">named rule</text>
  <text class="item-inv" x="626" y="234">Use for: everything you can name</text>

  <text class="cap" x="30" y="278">Killing a tool subprocess does not stop an agent — it hides the reason and hands the loop a retry.</text>
</svg>
