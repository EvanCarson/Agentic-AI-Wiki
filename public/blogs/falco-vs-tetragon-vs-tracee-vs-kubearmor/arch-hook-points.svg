<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="ht hd">
  <title id="ht">Where each sensor attaches, relative to the kernel's permission decision</title>
  <desc id="hd">The agent process issues a syscall. Sensors attached to tracepoints and kprobes observe the call and can report it, which is where Falco and Tracee sit. Sensors attached to LSM hooks run before the kernel grants permission, which is where KubeArmor sits and where Tetragon's override action takes effect. Everything to the left of the permission decision can deny; everything to the right can only report, or kill the process after the fact.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .dash   { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 5 4; opacity: .7; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper); opacity: .85; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#ar2); }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="label" x="20" y="26">One syscall, and the line that decides whether a sensor can say no</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <rect class="box" x="24" y="66" width="200" height="72" rx="8" />
  <text class="label" x="44" y="96">Agent tool call</text>
  <text class="sub" x="44" y="116">execve, openat, connect</text>
  <text class="sub" x="44" y="132">one exec per tool call</text>

  <path class="arrow" d="M 228 102 L 288 102" />

  <rect class="adj" x="292" y="66" width="230" height="72" rx="8" />
  <text class="label" x="312" y="96">LSM hooks</text>
  <text class="sub" x="312" y="116">fire BEFORE permission</text>
  <text class="sub" x="312" y="132">a hook here can return EPERM</text>

  <path class="arrow" d="M 526 102 L 586 102" />

  <rect class="hero" x="590" y="66" width="230" height="72" rx="8" />
  <text class="label-inv" x="610" y="96">Kernel grants or denies</text>
  <text class="sub-inv" x="610" y="116">the decision point</text>
  <text class="sub-inv" x="610" y="132">after this, the effect happened</text>

  <line class="dash" x1="556" y1="56" x2="556" y2="440" />
  <text class="cap" x="360" y="172">CAN PREVENT</text>
  <text class="cap" x="600" y="172">CAN ONLY REPORT, OR KILL AFTER</text>

  <rect class="box" x="292" y="196" width="230" height="86" rx="8" />
  <text class="label" x="312" y="224">KubeArmor</text>
  <text class="sub" x="312" y="245">AppArmor / SELinux / BPF-LSM</text>
  <text class="sub" x="312" y="262">declarative allow-list, inline deny</text>
  <text class="sub" x="312" y="278">eBPF used for visibility only</text>

  <rect class="box" x="292" y="302" width="230" height="86" rx="8" />
  <text class="label" x="312" y="330">Tetragon — override</text>
  <text class="sub" x="312" y="351">TracingPolicy with an override</text>
  <text class="sub" x="312" y="368">stops the call before its body runs</text>
  <text class="sub" x="312" y="384">also does process lineage</text>

  <rect class="box" x="590" y="196" width="240" height="86" rx="8" />
  <text class="label" x="610" y="224">Falco</text>
  <text class="sub" x="610" y="245">tracepoints / kprobes, eBPF driver</text>
  <text class="sub" x="610" y="262">largest community rule library</text>
  <text class="sub" x="610" y="278">alerting; response is a separate tool</text>

  <rect class="box" x="590" y="302" width="240" height="86" rx="8" />
  <text class="label" x="610" y="330">Tracee</text>
  <text class="sub" x="610" y="351">signatures plus Rego policy</text>
  <text class="sub" x="610" y="368">artefact capture for forensics</text>
  <text class="sub" x="610" y="384">strong on escape and injection</text>

  <rect class="box" x="24" y="196" width="230" height="192" rx="8" />
  <text class="label" x="44" y="224">OpenShell, for contrast</text>
  <text class="sub" x="44" y="246">same primitives (Landlock,</text>
  <text class="sub" x="44" y="262">seccomp) but installed by the</text>
  <text class="sub" x="44" y="278">harness, per agent process,</text>
  <text class="sub" x="44" y="294">before the agent starts.</text>
  <text class="sub" x="44" y="320">These four are node-wide</text>
  <text class="sub" x="44" y="336">sensors owned by the platform</text>
  <text class="sub" x="44" y="352">team. Different owner,</text>
  <text class="sub" x="44" y="368">different lifecycle, both useful.</text>

  <line class="rule" x1="20" y1="420" x2="880" y2="420" />
  <text class="sub" x="20" y="446">For an agent, the side of the dashed line matters less than what the response does to the loop:</text>
  <text class="sub" x="20" y="468">a denial returns an error the model can read and adapt to; a kill returns an unexplained crash it will retry.</text>
</svg>
