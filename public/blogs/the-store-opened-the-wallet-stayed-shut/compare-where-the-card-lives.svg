<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="ct cd">
  <title id="ct">Who holds the payment instrument in three agent-shopping arrangements</title>
  <desc id="cd">Three columns — platform-held credential, merchant-of-record agent, and agent-held credential — compared on who can be blocked, who answers for a wrong order, and how a dispute is resolved. Only the first arrangement keeps the card out of the agent entirely, and it is the only one retailers have sanctioned.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .rule   { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>

  <rect class="hero" x="40" y="40" width="240" height="44" />
  <text class="label-inv" x="160" y="68" text-anchor="middle">Platform holds the card</text>

  <rect class="adj" x="330" y="40" width="240" height="44" />
  <text class="label" x="450" y="68" text-anchor="middle">Agent is merchant of record</text>

  <rect class="box" x="620" y="40" width="240" height="44" />
  <text class="label" x="740" y="68" text-anchor="middle">Agent holds the card</text>

  <path class="rule" d="M 40 104 L 860 104" />

  <text class="label" x="160" y="128" text-anchor="middle">Sanctioned today</text>
  <text class="sub" x="160" y="148" text-anchor="middle">Walmart Agent Gateway</text>
  <text class="label" x="450" y="128" text-anchor="middle">Negotiated per deal</text>
  <text class="sub" x="450" y="148" text-anchor="middle">a contract, not an API</text>
  <text class="label" x="740" y="128" text-anchor="middle">Blocked or sued</text>
  <text class="sub" x="740" y="148" text-anchor="middle">Muse cut off, Comet sued</text>

  <path class="rule" d="M 40 168 L 860 168" />

  <text class="label" x="160" y="192" text-anchor="middle">Retailer answers</text>
  <text class="sub" x="160" y="212" text-anchor="middle">normal returns apply</text>
  <text class="label" x="450" y="192" text-anchor="middle">Agent answers</text>
  <text class="sub" x="450" y="212" text-anchor="middle">you own the chargeback</text>
  <text class="label" x="740" y="192" text-anchor="middle">Nobody agreed</text>
  <text class="sub" x="740" y="212" text-anchor="middle">dispute by litigation</text>

  <path class="rule" d="M 40 236 L 860 236" />

  <text class="label" x="160" y="262" text-anchor="middle">Revocable per agent</text>
  <text class="label" x="450" y="262" text-anchor="middle">Revocable per contract</text>
  <text class="label" x="740" y="262" text-anchor="middle">Revocable per IP block</text>

  <text class="sub" x="450" y="290" text-anchor="middle">The column a retailer will approve is the one where it never hands over the instrument.</text>
</svg>
