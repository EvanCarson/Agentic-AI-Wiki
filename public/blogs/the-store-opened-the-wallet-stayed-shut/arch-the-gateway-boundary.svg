<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="at ad">
  <title id="at">Where the Agent Gateway draws its boundary</title>
  <desc id="ad">A third-party agent calls an approved MCP gateway to search inventory and submit an order. The gateway sits in front of the retailer's catalogue and order service. The stored payment instrument and the ability to change payment methods sit behind a second boundary the agent never crosses; approval and blocking are applied at the gateway itself.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
    .fence  { fill: none; stroke: var(--accent, #d4421e); stroke-width: 2; stroke-dasharray: 6 5; }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="box" x="40" y="60" width="200" height="60" />
  <text class="label" x="140" y="86" text-anchor="middle">Third-party agent</text>
  <text class="sub" x="140" y="106" text-anchor="middle">approved, identifies itself</text>

  <path class="arrow" d="M 240 90 L 330 90" />

  <rect class="hero" x="330" y="60" width="220" height="60" />
  <text class="label-inv" x="440" y="86" text-anchor="middle">Agent Gateway</text>
  <text class="label-inv" x="440" y="106" text-anchor="middle">MCP server</text>

  <path class="arrow" d="M 550 90 L 640 90" />

  <rect class="adj" x="640" y="40" width="220" height="44" />
  <text class="label" x="750" y="68" text-anchor="middle">Catalogue search</text>

  <rect class="adj" x="640" y="100" width="220" height="44" />
  <text class="label" x="750" y="128" text-anchor="middle">Order submit</text>

  <path class="fence" d="M 40 200 L 860 200" />
  <text class="sub" x="450" y="226" text-anchor="middle">The agent never crosses this line</text>

  <rect class="box" x="140" y="252" width="240" height="60" />
  <text class="label" x="260" y="278" text-anchor="middle">Stored card on file</text>
  <text class="sub" x="260" y="298" text-anchor="middle">never sent to the agent</text>

  <rect class="box" x="520" y="252" width="240" height="60" />
  <text class="label" x="640" y="278" text-anchor="middle">Payment-method edits</text>
  <text class="sub" x="640" y="298" text-anchor="middle">add and change refused</text>

  <rect class="box" x="140" y="348" width="240" height="60" />
  <text class="label" x="260" y="374" text-anchor="middle">Approval and blocking</text>
  <text class="sub" x="260" y="394" text-anchor="middle">applied at the gateway</text>

  <rect class="box" x="520" y="348" width="240" height="60" />
  <text class="label" x="640" y="374" text-anchor="middle">Returns and disputes</text>
  <text class="sub" x="640" y="394" text-anchor="middle">retailer's normal process</text>

  <text class="sub" x="450" y="440" text-anchor="middle">Admission to choosing is the grant. Custody of the instrument is what is withheld.</text>
</svg>
