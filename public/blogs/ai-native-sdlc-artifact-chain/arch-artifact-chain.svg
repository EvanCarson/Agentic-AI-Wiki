<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="ac-t ac-d">
  <title id="ac-t">The artifact chain as a closed loop</title>
  <desc id="ac-d">Six artifacts arranged as a cycle. The top row runs left to right: intent.md produced by Claude from raw sources, spec.md produced by Claude bounded by organisational skills, and plan.md produced by Claude in plan mode. An arrow descends on the right into the bottom row, which runs right to left: the code diff gated by hooks, then review findings from layered agentic review, then the incident record written by a control-band script. An arrow rises on the left from the incident record back into intent.md, closing the loop.</desc>
  <style>
    .ac-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ac-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ac-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ac-head { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .ac-name { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .ac-name-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .ac-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .ac-sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .ac-tag  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .ac-tag-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--paper); opacity: .85; }
    .ac-edge { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .ac-note { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .ac-arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#ac-arr); }
  </style>
  <defs>
    <marker id="ac-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ac-head" x="24" y="30">Each stage commits what the next stage reads</text>

  <rect class="ac-hero" x="40" y="76" width="240" height="72" />
  <text class="ac-tag-inv" x="58" y="97">1 · PLAN</text>
  <text class="ac-name-inv" x="58" y="119">intent.md</text>
  <text class="ac-sub-inv" x="58" y="138">Claude, from raw sources</text>

  <path class="ac-arrow" d="M 284 112 L 326 112" />

  <rect class="ac-adj" x="330" y="76" width="240" height="72" />
  <text class="ac-tag" x="348" y="97">2 · DESIGN</text>
  <text class="ac-name" x="348" y="119">spec.md</text>
  <text class="ac-sub" x="348" y="138">Claude, bounded by skills</text>

  <path class="ac-arrow" d="M 574 112 L 616 112" />

  <rect class="ac-adj" x="620" y="76" width="240" height="72" />
  <text class="ac-tag" x="638" y="97">3 · BUILD</text>
  <text class="ac-name" x="638" y="119">plan.md</text>
  <text class="ac-sub" x="638" y="138">Claude in plan mode</text>

  <path class="ac-arrow" d="M 740 148 L 740 186" />
  <text class="ac-edge" x="752" y="172">implement</text>

  <rect class="ac-adj" x="620" y="190" width="240" height="72" />
  <text class="ac-tag" x="638" y="211">3 · BUILD</text>
  <text class="ac-name" x="638" y="233">code diff</text>
  <text class="ac-sub" x="638" y="252">Claude, gated by hooks</text>

  <path class="ac-arrow" d="M 616 226 L 574 226" />

  <rect class="ac-box" x="330" y="190" width="240" height="72" />
  <text class="ac-tag" x="348" y="211">5 · DEPLOY</text>
  <text class="ac-name" x="348" y="233">review findings</text>
  <text class="ac-sub" x="348" y="252">layered agentic review</text>

  <path class="ac-arrow" d="M 326 226 L 284 226" />

  <rect class="ac-box" x="40" y="190" width="240" height="72" />
  <text class="ac-tag" x="58" y="211">6 · MAINTAIN</text>
  <text class="ac-name" x="58" y="233">incident record</text>
  <text class="ac-sub" x="58" y="252">control-band script</text>

  <path class="ac-arrow" d="M 160 190 L 160 152" />
  <text class="ac-edge" x="172" y="172">re-enters at stage 1</text>

  <text class="ac-note" x="24" y="308">Top row left to right, bottom row right to left, and the rising arrow on the left closes the loop.</text>
  <text class="ac-note" x="24" y="330">That rising arrow is the only hop whose artifact has no human author.</text>
</svg>
