<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="cr-t cr-d">
  <title id="cr-t">What the human reviews, before and after</title>
  <desc id="cr-d">Three columns. The first, filled with the accent colour, is the traditional SDLC, where the human reads the diff, every line, at the end, and governance happens in the review cycle. The second is the AI-native SDLC, where the human reads the intent, line-by-line review is delegated to agents, and human review is reserved for regulated and critical paths. The third states what that substitution assumes: every hop from intent to diff translates correctly, while git records only order and not derivation.</desc>
  <style>
    .cr-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .cr-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .cr-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .cr-colh { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .cr-colh-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cr-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cr-lab-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .cr-tag  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .cr-tag-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--paper); opacity: .85; }
  </style>

  <rect class="cr-hero" x="30" y="40" width="250" height="230" />
  <text class="cr-tag-inv" x="50" y="70">TRADITIONAL SDLC</text>
  <text class="cr-colh-inv" x="50" y="98">Human reads the diff</text>
  <text class="cr-lab-inv" x="50" y="130">every line, at the</text>
  <text class="cr-lab-inv" x="50" y="150">end; governance</text>
  <text class="cr-lab-inv" x="50" y="170">happens inside the</text>
  <text class="cr-lab-inv" x="50" y="190">review cycle</text>

  <rect class="cr-adj" x="325" y="40" width="250" height="230" />
  <text class="cr-tag" x="345" y="70">AI-NATIVE SDLC</text>
  <text class="cr-colh" x="345" y="98">Human reads the intent</text>
  <text class="cr-lab" x="345" y="130">line-by-line review</text>
  <text class="cr-lab" x="345" y="150">is delegated; people</text>
  <text class="cr-lab" x="345" y="170">keep regulated and</text>
  <text class="cr-lab" x="345" y="190">critical paths</text>

  <rect class="cr-box" x="620" y="40" width="250" height="230" />
  <text class="cr-tag" x="640" y="70">WHAT IT ASSUMES</text>
  <text class="cr-colh" x="640" y="98">The chain is faithful</text>
  <text class="cr-lab" x="640" y="130">every hop from intent</text>
  <text class="cr-lab" x="640" y="150">to diff translates</text>
  <text class="cr-lab" x="640" y="170">correctly — and git</text>
  <text class="cr-lab" x="640" y="190">records order, never</text>
  <text class="cr-lab" x="640" y="210">derivation</text>
</svg>
