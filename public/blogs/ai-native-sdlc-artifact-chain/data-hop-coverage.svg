<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="hc-t hc-d">
  <title id="hc-t">Eight translation hops and the strength of each check</title>
  <desc id="hc-d">A table of eight hops in the artifact chain, what guards each one, and how strong that guard is. Sources to intent.md is guarded only by a product owner reading and committing it, judged. intent.md to spec.md has skills applied while authoring and a product owner read, judged. spec.md to plan.md is enforced, because plan mode withholds every edit until approval. plan.md to code diff is enforced by CLAUDE.md conventions, hooks that deny tool calls, and self-run tests. Code diff to policy is judged by layered agentic review and hooks acting as approval gates. Code diff to spec.md has nothing named guarding it. Config to behaviour is enforced by continuous evals gating on pass rate. Production to intent.md has nothing, because a control-band script writes it and it is reviewed only at intake.</desc>
  <style>
    .hc-head { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hc-colh { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .75; }
    .hc-hop  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .hc-cell { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .hc-cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .hc-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .hc-med  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .hc-weak { fill: var(--surface); stroke: var(--ink); stroke-width: 1; stroke-dasharray: 4 3; rx: 6; ry: 6; }
    .hc-note { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="hc-head" x="24" y="30">Eight hops, and what stops a bad one</text>

  <text class="hc-colh" x="24" y="58">HOP</text>
  <text class="hc-colh" x="300" y="58">WHAT GUARDS IT</text>
  <text class="hc-colh" x="728" y="58">STRENGTH</text>

  <text class="hc-hop" x="24" y="88">sources → intent.md</text>
  <text class="hc-cell" x="300" y="88">Product owner reads it and commits</text>
  <rect class="hc-med" x="728" y="67" width="150" height="30" />
  <text class="hc-cell" x="744" y="88">judged</text>

  <text class="hc-hop" x="24" y="130">intent.md → spec.md</text>
  <text class="hc-cell" x="300" y="130">Skills applied while authoring; owner reads it</text>
  <rect class="hc-med" x="728" y="109" width="150" height="30" />
  <text class="hc-cell" x="744" y="130">judged</text>

  <text class="hc-hop" x="24" y="172">spec.md → plan.md</text>
  <text class="hc-cell" x="300" y="172">Plan mode withholds every edit until approval</text>
  <rect class="hc-strong" x="728" y="151" width="150" height="30" />
  <text class="hc-cell-inv" x="744" y="172">enforced</text>

  <text class="hc-hop" x="24" y="214">plan.md → code diff</text>
  <text class="hc-cell" x="300" y="214">CLAUDE.md conventions; hooks deny; self-run tests</text>
  <rect class="hc-strong" x="728" y="193" width="150" height="30" />
  <text class="hc-cell-inv" x="744" y="214">enforced</text>

  <text class="hc-hop" x="24" y="256">code diff → policy</text>
  <text class="hc-cell" x="300" y="256">Layered agentic review; hooks as approval gates</text>
  <rect class="hc-med" x="728" y="235" width="150" height="30" />
  <text class="hc-cell" x="744" y="256">judged</text>

  <text class="hc-hop" x="24" y="298">code diff → spec.md</text>
  <text class="hc-cell" x="300" y="298">Nothing named</text>
  <rect class="hc-weak" x="728" y="277" width="150" height="30" />
  <text class="hc-cell" x="744" y="298">nothing</text>

  <text class="hc-hop" x="24" y="340">config → behaviour</text>
  <text class="hc-cell" x="300" y="340">Continuous evals gate on pass rate</text>
  <rect class="hc-strong" x="728" y="319" width="150" height="30" />
  <text class="hc-cell-inv" x="744" y="340">enforced</text>

  <text class="hc-hop" x="24" y="382">production → intent.md</text>
  <text class="hc-cell" x="300" y="382">Control-band script; reviewed only at intake</text>
  <rect class="hc-weak" x="728" y="361" width="150" height="30" />
  <text class="hc-cell" x="744" y="382">nothing</text>

  <text class="hc-note" x="24" y="420">Accent = a machine can stop the hop. Soft = a person or a model judges it. Dashed = nothing checks fidelity.</text>
</svg>
