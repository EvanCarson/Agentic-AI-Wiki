<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">The cost signal and the value signal are not symmetric</title>
  <desc id="d">A two-column comparison across three properties. The cost signal is produced by the model vendor, arrives monthly whether or not anyone asked, and exists by default. The value signal has no vendor that profits from producing it, arrives only after someone builds it, and stays at zero if nobody does.</desc>
  <style>
    .col-head  { font-family: var(--font-display); font-size: 16px; font-weight: 600; text-anchor: middle; }
    .head-lead { fill: var(--accent, #d4421e); }
    .head-mute { fill: currentColor; }
    .row-head  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; opacity: .6; text-anchor: end; }
    .cell      { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .cell-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-soft { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-hero { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-mute { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="col-head head-mute" x="450" y="32">The cost signal</text>
  <text class="col-head head-lead" x="750" y="32">The value signal</text>

  <text class="row-head" x="286" y="80">Who produces it</text>
  <rect class="card-soft" x="300" y="52" width="290" height="42" rx="6" />
  <text class="cell" x="445" y="78">Your model vendor, to bill you</text>
  <rect class="card-hero" x="610" y="52" width="240" height="42" rx="6" />
  <text class="cell-inv" x="730" y="78">Nobody. You, or no one</text>

  <text class="row-head" x="286" y="148">When it arrives</text>
  <rect class="card-soft" x="300" y="120" width="290" height="42" rx="6" />
  <text class="cell" x="445" y="146">Monthly, unbidden, precise</text>
  <rect class="card-hero" x="610" y="120" width="240" height="42" rx="6" />
  <text class="cell-inv" x="730" y="146">Only once it is built</text>

  <text class="row-head" x="286" y="216">If nobody acts</text>
  <rect class="card-mute" x="300" y="188" width="290" height="42" rx="6" />
  <text class="cell" x="445" y="214">It still exists, and it rises</text>
  <rect class="card-hero" x="610" y="188" width="240" height="42" rx="6" />
  <text class="cell-inv" x="730" y="214">It stays at zero</text>

  <text class="cell" x="450" y="272">Two quarters of this and the deployment reads as expensive and unproven — whatever the true ratio is.</text>
</svg>
