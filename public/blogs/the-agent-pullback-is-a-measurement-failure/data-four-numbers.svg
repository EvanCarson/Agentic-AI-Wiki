<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Four findings from KPMG's Q2 2026 Global AI Pulse</title>
  <desc id="d">Horizontal bar chart. Forty-nine percent of leaders scaled back, narrowed, delayed or paused an AI agent deployment after expected costs began to outweigh anticipated value. About thirty-three percent cite limited understanding of AI cost structures as a deployment barrier. Twenty-six percent have full real-time visibility into what AI costs to run at scale. Seven percent report established ROI.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: start; }
    .axis-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .6; text-anchor: middle; }
    .row-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .row-sub     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .6; text-anchor: end; }
    .value       { font-family: var(--font-mono); font-size: 14px; font-weight: 600; text-anchor: start; }
    .value-lead  { fill: var(--accent, #d4421e); }
    .value-mute  { fill: currentColor; opacity: .6; }
    .note        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: currentColor; opacity: .65; text-anchor: start; }
    .grid        { stroke: currentColor; stroke-width: 1; opacity: .18; stroke-dasharray: 2 4; }
    .bar-lead    { fill: var(--accent, #d4421e); }
    .bar-soft    { fill: var(--accent-soft, #f5c5b8); }
    .bar-mute    { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="60" y="34">Share of 2,145 senior leaders, 20 countries</text>

  <line class="grid" x1="330" y1="58" x2="330" y2="332" />
  <line class="grid" x1="447" y1="58" x2="447" y2="332" />
  <line class="grid" x1="564" y1="58" x2="564" y2="332" />
  <line class="grid" x1="681" y1="58" x2="681" y2="332" />
  <line class="grid" x1="798" y1="58" x2="798" y2="332" />
  <text class="axis-label" x="330" y="354">0%</text>
  <text class="axis-label" x="447" y="354">25%</text>
  <text class="axis-label" x="564" y="354">50%</text>
  <text class="axis-label" x="681" y="354">75%</text>
  <text class="axis-label" x="798" y="354">100%</text>

  <text class="row-head" x="316" y="84">Scaled back a deployment</text>
  <text class="row-sub" x="316" y="100">costs outran anticipated value</text>
  <rect class="bar-lead" x="330" y="68" width="229" height="34" rx="4" />
  <text class="value value-lead" x="571" y="91">49%</text>

  <text class="row-head" x="316" y="154">Cannot read token pricing</text>
  <text class="row-sub" x="316" y="170">named as a deployment barrier</text>
  <rect class="bar-soft" x="330" y="138" width="154" height="34" rx="4" />
  <text class="value value-mute" x="496" y="161">33%</text>

  <text class="row-head" x="316" y="224">Real-time cost visibility</text>
  <text class="row-sub" x="316" y="240">full, at scale</text>
  <rect class="bar-soft" x="330" y="208" width="122" height="34" rx="4" />
  <text class="value value-mute" x="464" y="231">26%</text>

  <text class="row-head" x="316" y="294">Established ROI</text>
  <text class="row-sub" x="316" y="310">the other half of the ratio</text>
  <rect class="bar-mute" x="330" y="278" width="33" height="34" rx="4" />
  <text class="value value-lead" x="375" y="301">7%</text>

  <text class="note" x="60" y="386">Half took an action on one side of a ratio that one in fourteen of them can compute.</text>
</svg>
