<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Four rungs of cost control, from finest to coarsest</title>
  <desc id="d">A ladder of four responses to an agent deployment costing too much. Retuning a task class and retiring a task class are the two precise responses and both require cost joined to task class and outcome. Shrinking the deployment and pausing the programme are the two coarse responses, reachable with only an invoice, and both trade away capability.</desc>
  <style>
    .box       { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero      { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj       { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: start; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--paper, #fff); text-anchor: start; }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .72; text-anchor: start; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .85; text-anchor: start; }
    .rung      { font-family: var(--font-mono); font-size: 12px; fill: currentColor; opacity: .55; text-anchor: middle; }
    .side      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: currentColor; opacity: .7; text-anchor: start; }
    .side-lead { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--accent, #d4421e); text-anchor: start; }
    .bracket   { fill: none; stroke: currentColor; stroke-width: 1.25; opacity: .45; }
    .axis      { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); opacity: .5; }
    .axis-text { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; opacity: .6; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="rung" x="90" y="76">precise</text>
  <text class="rung" x="90" y="416">blunt</text>
  <path class="axis" d="M 90 90 L 90 400" />

  <rect class="hero" x="130" y="52" width="450" height="72" rx="8" />
  <text class="label-inv" x="152" y="82">Retune a task class</text>
  <text class="sub-inv" x="152" y="103">cache the prefix, shrink the model on one hop, cap the steps</text>

  <rect class="hero" x="130" y="140" width="450" height="72" rx="8" />
  <text class="label-inv" x="152" y="170">Retire a task class</text>
  <text class="sub-inv" x="152" y="191">kill the workflow that loses money, expand the one that does not</text>

  <rect class="adj" x="130" y="228" width="450" height="72" rx="8" />
  <text class="label" x="152" y="258">Shrink the deployment</text>
  <text class="sub" x="152" y="279">fewer users, fewer teams, the good workloads cut alongside the bad</text>

  <rect class="box" x="130" y="316" width="450" height="72" rx="8" />
  <text class="label" x="152" y="346">Pause the programme</text>
  <text class="sub" x="152" y="367">nothing learned, and the same decision returns in six months</text>

  <path class="bracket" d="M 596 60 L 612 60 L 612 204 L 596 204" />
  <text class="side-lead" x="624" y="118">Needs cost joined to task</text>
  <text class="side-lead" x="624" y="134">class and to outcome.</text>
  <text class="side-lead" x="624" y="150">74% cannot get here.</text>

  <path class="bracket" d="M 596 236 L 612 236 L 612 380 L 596 380" />
  <text class="side" x="624" y="294">Reachable with an invoice</text>
  <text class="side" x="624" y="310">alone. Both spend capability</text>
  <text class="side" x="624" y="326">to buy a smaller number.</text>

  <text class="axis-text" x="450" y="440">"Scaled back, narrowed, delayed or paused" — four words for the bottom two rungs</text>
</svg>
