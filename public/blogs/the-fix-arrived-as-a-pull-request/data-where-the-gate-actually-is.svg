<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="wga wgad">
  <title id="wga">Where the approval gate actually sits, by write path</title>
  <desc id="wgad">A matrix of four agent write paths against three questions. Changing production data or code requires direct approval and is enforced by Databricks. Pushing to a new branch or to a branch you name happens on your request and is then governed by pull-request review. Pushing to the default branch also happens on your request, but pull-request review applies only if the repository is protected, so the control is enforced by your own branch protection rather than by the vendor.</desc>
  <style>
    .wg-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .wg-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .wg-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .wg-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wg-col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .wg-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wg-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .wg-cellin { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .wg-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="wg-ttl" x="20" y="30">Four write paths, three different enforcers</text>

  <text class="wg-col" x="340" y="66" text-anchor="middle">YOU APPROVE</text>
  <text class="wg-col" x="550" y="66" text-anchor="middle">PR REVIEW</text>
  <text class="wg-col" x="770" y="66" text-anchor="middle">ENFORCED BY</text>

  <text class="wg-row" x="20" y="103">Production data or code</text>
  <rect class="wg-strong" x="240" y="80" width="200" height="36" />
  <text class="wg-cellin" x="340" y="103" text-anchor="middle">Always</text>
  <rect class="wg-weak" x="450" y="80" width="200" height="36" />
  <text class="wg-cell" x="550" y="103" text-anchor="middle">Not applicable</text>
  <rect class="wg-med" x="660" y="80" width="220" height="36" />
  <text class="wg-cell" x="770" y="103" text-anchor="middle">Databricks</text>

  <text class="wg-row" x="20" y="159">Push to a new branch</text>
  <rect class="wg-med" x="240" y="136" width="200" height="36" />
  <text class="wg-cell" x="340" y="159" text-anchor="middle">You request it</text>
  <rect class="wg-strong" x="450" y="136" width="200" height="36" />
  <text class="wg-cellin" x="550" y="159" text-anchor="middle">Yes</text>
  <rect class="wg-med" x="660" y="136" width="220" height="36" />
  <text class="wg-cell" x="770" y="159" text-anchor="middle">Your Git provider</text>

  <text class="wg-row" x="20" y="215">Push to a branch you name</text>
  <rect class="wg-med" x="240" y="192" width="200" height="36" />
  <text class="wg-cell" x="340" y="215" text-anchor="middle">You request it</text>
  <rect class="wg-strong" x="450" y="192" width="200" height="36" />
  <text class="wg-cellin" x="550" y="215" text-anchor="middle">Yes</text>
  <rect class="wg-med" x="660" y="192" width="220" height="36" />
  <text class="wg-cell" x="770" y="215" text-anchor="middle">Your Git provider</text>

  <text class="wg-row" x="20" y="271">Push to the default branch</text>
  <rect class="wg-med" x="240" y="248" width="200" height="36" />
  <text class="wg-cell" x="340" y="271" text-anchor="middle">You request it</text>
  <rect class="wg-weak" x="450" y="248" width="200" height="36" />
  <text class="wg-cell" x="550" y="271" text-anchor="middle">Only if protected</text>
  <rect class="wg-strong" x="660" y="248" width="220" height="36" />
  <text class="wg-cellin" x="770" y="271" text-anchor="middle">Your branch protection</text>

  <rect class="wg-strong" x="20" y="306" width="16" height="13" />
  <text class="wg-leg" x="44" y="317">the binding control</text>
  <rect class="wg-med" x="220" y="306" width="16" height="13" />
  <text class="wg-leg" x="244" y="317">conditional</text>
  <rect class="wg-weak" x="380" y="306" width="16" height="13" />
  <text class="wg-leg" x="404" y="317">no gate here</text>
</svg>
