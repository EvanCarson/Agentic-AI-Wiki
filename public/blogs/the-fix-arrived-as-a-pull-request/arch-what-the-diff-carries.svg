<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="wdc wdcd">
  <title id="wdc">What crosses into the pull request</title>
  <desc id="wdcd">A left-to-right flow of the Genie ZeroOps loop. A monitor step reads jobs, tables and repository contents; an investigate step performs lineage-based root-cause analysis in a sandbox holding a shallow clone of production data; a propose step emits a candidate fix validated on that clone. A dashed vertical boundary separates those three unreviewed steps from the pull request on the right, which carries the diff, a reviewer, continuous integration and an audit trail.</desc>
  <style>
    .df-box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .df-hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .df-ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .df-lab   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .df-labin { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .df-sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .df-subin { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .df-zone  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .df-note  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .df-arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#dfarr); }
    .df-bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 6 5; opacity: .75; }
  </style>
  <defs>
    <marker id="dfarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="df-ttl" x="20" y="30">The agent acts three times before anyone is asked once</text>

  <rect class="df-box" x="30" y="62" width="170" height="72" />
  <text class="df-lab" x="115" y="94" text-anchor="middle">Monitor</text>
  <text class="df-sub" x="115" y="114" text-anchor="middle">jobs, tables, repo</text>

  <rect class="df-box" x="230" y="62" width="170" height="72" />
  <text class="df-lab" x="315" y="94" text-anchor="middle">Investigate</text>
  <text class="df-sub" x="315" y="114" text-anchor="middle">lineage RCA, sandbox</text>

  <rect class="df-box" x="430" y="62" width="170" height="72" />
  <text class="df-lab" x="515" y="94" text-anchor="middle">Propose fix</text>
  <text class="df-sub" x="515" y="114" text-anchor="middle">validated on a clone</text>

  <path class="df-arrow" d="M 202 98 L 226 98" />
  <path class="df-arrow" d="M 402 98 L 426 98" />
  <path class="df-arrow" d="M 602 98 L 676 98" />

  <path class="df-bound" d="M 640 46 L 640 300" />

  <rect class="df-hero" x="680" y="62" width="190" height="72" />
  <text class="df-labin" x="775" y="94" text-anchor="middle">Pull request</text>
  <text class="df-subin" x="775" y="114" text-anchor="middle">diff, reviewer, CI</text>

  <text class="df-zone" x="315" y="172" text-anchor="middle">UNREVIEWED</text>
  <text class="df-zone" x="775" y="172" text-anchor="middle">REVIEWED</text>

  <text class="df-note" x="30" y="208">Reads your job definitions, table schemas and lineage graph</text>
  <text class="df-note" x="30" y="232">Shallow-clones production data into an isolated sandbox</text>
  <text class="df-note" x="30" y="256">Forms a root-cause hypothesis nobody else sees</text>

  <text class="df-note" x="680" y="208">Carries the fix</text>
  <text class="df-note" x="680" y="232">Not the reading</text>
  <text class="df-note" x="680" y="256">that produced it</text>

  <text class="df-sub" x="20" y="310">Sandbox validation shows the fix runs. It does not show the diagnosis was right.</text>
</svg>
