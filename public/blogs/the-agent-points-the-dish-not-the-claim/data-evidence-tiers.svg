<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="evt evd">
  <title id="evt">What each claim in the announcement is supported by</title>
  <desc id="evd">A four by three matrix. The deployment itself — agents at the array — is reported by the vendor, repeated by several outlets, and has no independent paper. The throughput figure of 2.4 terabits per second is a vendor claim, is repeated, and has no independent measurement. The real-time pulsar detection is a vendor claim, is repeated, and is partly superseded because a 2025 peer-reviewed deployment already recovered known Crab giant pulses in real time. Human verification of candidate signals is stated by the vendor, repeated, and is the one claim that needs no independent check because it is a statement about process.</desc>
  <style>
    .ev-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .ev-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .ev-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .ev-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .ev-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .ev-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .ev-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .ev-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .ev-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="ev-ttl" x="20" y="34">Four claims, three evidence questions</text>

  <text class="ev-col" x="340" y="76" text-anchor="middle">Primary source</text>
  <text class="ev-col" x="560" y="76" text-anchor="middle">Independently checked</text>
  <text class="ev-col" x="780" y="76" text-anchor="middle">Needed the agent?</text>

  <text class="ev-row" x="20" y="118">Agents at the array</text>
  <rect class="ev-mid" x="230" y="92" width="200" height="40" />
  <text class="ev-cell" x="330" y="117" text-anchor="middle">Vendor blog</text>
  <rect class="ev-weak" x="450" y="92" width="200" height="40" />
  <text class="ev-cell" x="550" y="117" text-anchor="middle">No paper yet</text>
  <rect class="ev-strong" x="670" y="92" width="200" height="40" />
  <text class="ev-inv" x="770" y="117" text-anchor="middle">Yes — it is the agent</text>

  <text class="ev-row" x="20" y="178">2.4 Tb/s throughput</text>
  <rect class="ev-mid" x="230" y="152" width="200" height="40" />
  <text class="ev-cell" x="330" y="177" text-anchor="middle">Vendor figure</text>
  <rect class="ev-weak" x="450" y="152" width="200" height="40" />
  <text class="ev-cell" x="550" y="177" text-anchor="middle">Not measured</text>
  <rect class="ev-weak" x="670" y="152" width="200" height="40" />
  <text class="ev-cell" x="770" y="177" text-anchor="middle">No — it is the GPUs</text>

  <text class="ev-row" x="20" y="238">Real-time pulsar find</text>
  <rect class="ev-mid" x="230" y="212" width="200" height="40" />
  <text class="ev-cell" x="330" y="237" text-anchor="middle">Vendor claim</text>
  <rect class="ev-weak" x="450" y="212" width="200" height="40" />
  <text class="ev-cell" x="550" y="237" text-anchor="middle">2025 paper first</text>
  <rect class="ev-weak" x="670" y="212" width="200" height="40" />
  <text class="ev-cell" x="770" y="237" text-anchor="middle">No — prior pipeline</text>

  <text class="ev-row" x="20" y="298">Humans verify candidates</text>
  <rect class="ev-mid" x="230" y="272" width="200" height="40" />
  <text class="ev-cell" x="330" y="297" text-anchor="middle">Stated</text>
  <rect class="ev-strong" x="450" y="272" width="200" height="40" />
  <text class="ev-inv" x="550" y="297" text-anchor="middle">Process, not result</text>
  <rect class="ev-strong" x="670" y="272" width="200" height="40" />
  <text class="ev-inv" x="770" y="297" text-anchor="middle">The design choice</text>

  <rect class="ev-strong" x="20" y="344" width="18" height="14" />
  <text class="ev-leg" x="48" y="356">Load-bearing</text>
  <rect class="ev-mid" x="250" y="344" width="18" height="14" />
  <text class="ev-leg" x="278" y="356">Reported</text>
  <rect class="ev-weak" x="420" y="344" width="18" height="14" />
  <text class="ev-leg" x="448" y="356">Unverified or prior art</text>
</svg>
