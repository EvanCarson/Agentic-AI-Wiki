<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="irt ird">
  <title id="irt">Where the irreversible step sits in two deployments</title>
  <desc id="ird">Two lanes. In the upper lane, a telescope deployment: a plain-language request, an agent that points the array and cleans the live stream, a candidate signal, and a human who owns the claim. A note records that the action is reversible in one observing window and the claim is not. In the lower lane, a typical knowledge-work pilot: a human approves each tool call, the agent reads and retrieves, and the agent writes the recommendation that is sent onward. A note records that the actions were reversible and the conclusion was not, and that the human was placed on the reversible side.</desc>
  <style>
    .ir-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ir-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ir-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ir-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .ir-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .ir-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .ir-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .ir-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#irh); }
  </style>
  <defs>
    <marker id="irh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ir-ttl" x="20" y="34">Allen Telescope Array — the human owns the claim</text>

  <rect class="ir-box" x="20" y="54" width="180" height="58" />
  <text class="ir-lab" x="110" y="79" text-anchor="middle">Plain-language ask</text>
  <text class="ir-sub" x="110" y="97" text-anchor="middle">a researcher, one sentence</text>

  <path class="ir-arr" d="M 206 83 L 256 83" />

  <rect class="ir-adj" x="262" y="54" width="180" height="58" />
  <text class="ir-lab" x="352" y="79" text-anchor="middle">Agent acts</text>
  <text class="ir-sub" x="352" y="97" text-anchor="middle">points 42 antennas</text>

  <path class="ir-arr" d="M 448 83 L 498 83" />

  <rect class="ir-box" x="504" y="54" width="180" height="58" />
  <text class="ir-lab" x="594" y="79" text-anchor="middle">Candidate signal</text>
  <text class="ir-sub" x="594" y="97" text-anchor="middle">flagged, not asserted</text>

  <path class="ir-arr" d="M 690 83 L 740 83" />

  <rect class="ir-hero" x="746" y="54" width="134" height="58" />
  <text class="ir-inv" x="813" y="79" text-anchor="middle">Human</text>
  <text class="ir-inv" x="813" y="97" text-anchor="middle" opacity=".8">owns the claim</text>

  <text class="ir-sub" x="20" y="140">Reversible: a mispointed dish costs one observing window. Irreversible: a published detection.</text>

  <text class="ir-ttl" x="20" y="212">A typical knowledge-work pilot — the human owns the keystrokes</text>

  <rect class="ir-hero" x="20" y="232" width="180" height="58" />
  <text class="ir-inv" x="110" y="257" text-anchor="middle">Human</text>
  <text class="ir-inv" x="110" y="275" text-anchor="middle" opacity=".8">approves each call</text>

  <path class="ir-arr" d="M 206 261 L 256 261" />

  <rect class="ir-adj" x="262" y="232" width="180" height="58" />
  <text class="ir-lab" x="352" y="257" text-anchor="middle">Agent reads</text>
  <text class="ir-sub" x="352" y="275" text-anchor="middle">search, fetch, retrieve</text>

  <path class="ir-arr" d="M 448 261 L 498 261" />

  <rect class="ir-adj" x="504" y="232" width="180" height="58" />
  <text class="ir-lab" x="594" y="257" text-anchor="middle">Agent concludes</text>
  <text class="ir-sub" x="594" y="275" text-anchor="middle">writes the recommendation</text>

  <path class="ir-arr" d="M 690 261 L 740 261" />

  <rect class="ir-box" x="746" y="232" width="134" height="58" />
  <text class="ir-lab" x="813" y="264" text-anchor="middle">Sent onward</text>

  <text class="ir-sub" x="20" y="318">Reversible: every read. Irreversible: the conclusion somebody acts on — and nobody was asked.</text>
  <text class="ir-sub" x="20" y="366">Same rubric, opposite outcome: put the human wherever the step cannot be taken back.</text>
</svg>
