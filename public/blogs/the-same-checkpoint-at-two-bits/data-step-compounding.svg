<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t2 d2">
  <title id="t2">Per-step reliability compounds over an agent loop</title>
  <desc id="d2">A line chart of task success against number of tool-use steps for three per-step reliability rates. At 99 percent per step, twenty steps still succeed 81.8 percent of the time. At 97 percent per step, twenty steps succeed 54.4 percent of the time. At 95 percent per step, 35.9 percent. The two-point gap between 99 and 97 percent per step becomes a 27-point gap at twenty steps, which is why a quantisation change that looks small on a single-turn benchmark can be decisive for an agent.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .grid  { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 4; }
    .axis  { fill: none; stroke: var(--ink); stroke-width: 1.25; }
    .c-hi  { fill: none; stroke: var(--accent, #d4421e); stroke-width: 2.5; }
    .c-mid { fill: none; stroke: currentColor; stroke-width: 2; }
    .c-lo  { fill: none; stroke: currentColor; stroke-width: 2; stroke-dasharray: 6 4; }
    .tick  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .75; text-anchor: end; }
    .xtick { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .ser   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); text-anchor: end; }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="ttl" x="20" y="28">Task success after k tool-use steps, at three per-step reliability rates</text>

  <line class="grid" x1="90" y1="60"  x2="860" y2="60" />
  <line class="grid" x1="90" y1="114" x2="860" y2="114" />
  <line class="grid" x1="90" y1="168" x2="860" y2="168" />
  <line class="grid" x1="90" y1="222" x2="860" y2="222" />
  <line class="grid" x1="90" y1="276" x2="860" y2="276" />
  <line class="axis" x1="90" y1="330" x2="860" y2="330" />
  <line class="axis" x1="90" y1="60"  x2="90"  y2="330" />

  <text class="tick" x="78" y="64">100%</text>
  <text class="tick" x="78" y="118">80%</text>
  <text class="tick" x="78" y="172">60%</text>
  <text class="tick" x="78" y="226">40%</text>
  <text class="tick" x="78" y="280">20%</text>
  <text class="tick" x="78" y="334">0%</text>

  <text class="xtick" x="90"  y="352">0</text>
  <text class="xtick" x="282" y="352">5</text>
  <text class="xtick" x="475" y="352">10</text>
  <text class="xtick" x="668" y="352">15</text>
  <text class="xtick" x="860" y="352">20 steps</text>

  <path class="c-hi"  d="M 90 60 L 167 65.4 L 244 70.6 L 321 75.8 L 398 80.9 L 475 85.8 L 552 90.7 L 629 95.5 L 706 100.1 L 783 104.7 L 860 109.2" />
  <path class="c-mid" d="M 90 60 L 167 76.0 L 244 91.0 L 321 105.1 L 398 118.4 L 475 130.9 L 552 142.7 L 629 153.7 L 706 164.2 L 783 174.0 L 860 183.2" />
  <path class="c-lo"  d="M 90 60 L 167 86.3 L 244 110.1 L 321 131.5 L 398 150.9 L 475 168.4 L 552 184.1 L 629 198.3 L 706 211.2 L 783 222.8 L 860 233.2" />

  <text class="ser" x="855" y="100">99% per step → 81.8%</text>
  <text class="ser" x="855" y="168">97% per step → 54.4%</text>
  <text class="ser" x="855" y="214">95% per step → 35.9%</text>

  <text class="sub" x="20" y="378">Two points of per-step reliability is a 27-point gap at twenty steps. A single-turn benchmark cannot see it,</text>
  <text class="sub" x="20" y="394">and no vendor publishes per-step tool-call reliability for a quantised build.</text>
</svg>
