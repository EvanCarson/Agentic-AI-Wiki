<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Human minutes to review each artefact from one agent run</title>
  <desc id="d">Horizontal bar chart with four bars. Reviewing the proposed plan takes about two minutes, a live preview about four, a two-hundred-line diff about twenty, and a six-hundred-line diff about fifty. The plan bar is shortest and highlighted; the six-hundred-line diff is roughly twenty-five times more expensive to review than the plan that could have prevented it.</desc>
  <style>
    .bar-lead { fill: var(--accent, #d4421e); }
    .bar-mid  { fill: var(--accent-soft); }
    .bar-low  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .grid   { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 4; }
    .axis   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="head" x="24" y="40">Minutes of human attention, per artefact</text>

  <line class="grid" x1="300" y1="60" x2="300" y2="322" />
  <line class="grid" x1="404" y1="60" x2="404" y2="322" />
  <line class="grid" x1="508" y1="60" x2="508" y2="322" />
  <line class="grid" x1="612" y1="60" x2="612" y2="322" />
  <line class="grid" x1="716" y1="60" x2="716" y2="322" />
  <line class="grid" x1="820" y1="60" x2="820" y2="322" />
  <text class="axis" x="296" y="344">0</text>
  <text class="axis" x="398" y="344">10</text>
  <text class="axis" x="502" y="344">20</text>
  <text class="axis" x="606" y="344">30</text>
  <text class="axis" x="710" y="344">40</text>
  <text class="axis" x="814" y="344">50</text>

  <text class="label" x="24" y="94">The plan</text>
  <rect class="bar-lead" x="300" y="74" width="21" height="34" rx="3" />
  <text class="val" x="333" y="97" fill="var(--accent, #d4421e)">~2 min</text>

  <text class="label" x="24" y="158">Live preview</text>
  <rect class="bar-mid" x="300" y="138" width="42" height="34" rx="3" />
  <text class="val" x="354" y="161">~4 min</text>

  <text class="label" x="24" y="222">Diff, 200 lines</text>
  <rect class="bar-low" x="300" y="202" width="208" height="34" rx="3" />
  <text class="val" x="520" y="225">~20 min</text>

  <text class="label" x="24" y="286">Diff, 600 lines</text>
  <rect class="bar-low" x="300" y="266" width="520" height="34" rx="3" />
  <text class="val" x="832" y="289">~50 min</text>

  <text class="sub" x="24" y="378">Review effort tracks the interactions a reader must hold in mind, not the line count — so it grows faster than the diff does.</text>
</svg>
