<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where Slack Code sits in an agent coding workflow</title>
  <desc id="d">Five separately licensed partner coding agents on the left feed one Slack Code channel in the centre. The channel holds four views of the same run: the conversation, the proposed plan, the code diffs and a live preview. From the channel the work passes through a single human approval and only then reaches the repository. The agent vendors own the left column; Slack owns the centre.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .inner  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="tag" x="24" y="40">BOUGHT SEPARATELY</text>
  <rect class="box" x="24" y="56" width="186" height="46" />
  <text class="label" x="40" y="84">Claude Code</text>
  <rect class="box" x="24" y="114" width="186" height="46" />
  <text class="label" x="40" y="142">Devin</text>
  <rect class="box" x="24" y="172" width="186" height="46" />
  <text class="label" x="40" y="200">GitHub Copilot</text>
  <rect class="box" x="24" y="230" width="186" height="46" />
  <text class="label" x="40" y="258">ChatGPT</text>
  <rect class="box" x="24" y="288" width="186" height="46" />
  <text class="label" x="40" y="316">Vercel agents</text>
  <text class="sub" x="24" y="366">Generation. The margin stays here.</text>

  <path class="arrow" d="M 214 79 L 296 150" />
  <path class="arrow" d="M 214 137 L 296 170" />
  <path class="arrow" d="M 214 195 L 296 195" />
  <path class="arrow" d="M 214 253 L 296 222" />
  <path class="arrow" d="M 214 311 L 296 242" />

  <rect class="hero" x="300" y="40" width="300" height="410" />
  <text class="head-inv" x="322" y="72">Slack Code channel</text>
  <rect class="inner" x="320" y="92" width="260" height="52" />
  <text class="label" x="336" y="114">Conversation</text>
  <text class="sub" x="336" y="132">who asked, and why</text>
  <rect class="inner" x="320" y="156" width="260" height="52" />
  <text class="label" x="336" y="178">Plan</text>
  <text class="sub" x="336" y="196">the cheap gate — read it first</text>
  <rect class="inner" x="320" y="220" width="260" height="52" />
  <text class="label" x="336" y="242">Diffs</text>
  <text class="sub" x="336" y="260">the expensive gate</text>
  <rect class="inner" x="320" y="284" width="260" height="52" />
  <text class="label" x="336" y="306">Live preview</text>
  <text class="sub" x="336" y="324">an oracle, if the change is visible</text>
  <line x1="320" y1="358" x2="580" y2="358" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag" x="320" y="384" fill="var(--paper)" opacity=".85">WHAT SLACK OWNS</text>
  <text class="label-inv" x="320" y="410">the surface where a human decides</text>

  <path class="arrow" d="M 604 195 L 674 195" />

  <rect class="adj" x="678" y="150" width="196" height="92" />
  <text class="head" x="696" y="182">Approval</text>
  <text class="sub" x="696" y="204">one person, named up front</text>
  <text class="sub" x="696" y="224">— or eleven, and nobody</text>

  <path class="arrow" d="M 776 246 L 776 306" />

  <rect class="box" x="678" y="310" width="196" height="86" />
  <text class="head" x="696" y="342">Repository</text>
  <text class="sub" x="696" y="364">diff of record, merge, CI</text>
</svg>
