<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three shapes for an agent approval</title>
  <desc id="d">Three columns. A terminal approval has one approver who holds the full context and clear accountability, but the work is invisible to the team. A channel with a named approver keeps one accountable person and adds team visibility and a durable record. A channel where anyone may approve gains the same visibility but the approval is taken by whoever is least busy, which is usually whoever knows the surrounding system least.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
  </style>

  <rect class="box" x="24" y="36" width="266" height="212" />
  <text class="head" x="44" y="66">Terminal</text>
  <text class="sub" x="44" y="100">one approver, by construction</text>
  <text class="sub" x="44" y="124">holds intent and full context</text>
  <text class="sub" x="44" y="148">accountable in three weeks' time</text>
  <line x1="44" y1="172" x2="270" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="44" y="196">WHAT IT COSTS</text>
  <text class="label" x="44" y="220">nobody else learns anything</text>

  <rect class="hero" x="314" y="36" width="266" height="212" />
  <text class="head-inv" x="334" y="66">Channel, named approver</text>
  <text class="sub-inv" x="334" y="100">one accountable human</text>
  <text class="sub-inv" x="334" y="124">plus an audience that catches things</text>
  <text class="sub-inv" x="334" y="148">durable record of intent and plan</text>
  <line x1="334" y1="172" x2="560" y2="172" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag" x="334" y="196" fill="var(--paper)" opacity=".85">WHAT IT COSTS</text>
  <text class="label-inv" x="334" y="220">one sentence in the channel topic</text>

  <rect class="adj" x="604" y="36" width="266" height="212" />
  <text class="head" x="624" y="66">Channel, anyone approves</text>
  <text class="sub" x="624" y="100">same visibility, same record</text>
  <text class="sub" x="624" y="124">approval falls to the least busy</text>
  <text class="sub" x="624" y="148">which is the least context</text>
  <line x1="624" y1="172" x2="850" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="624" y="196">WHAT IT COSTS</text>
  <text class="label" x="624" y="220">a gate that stops nothing</text>
</svg>
