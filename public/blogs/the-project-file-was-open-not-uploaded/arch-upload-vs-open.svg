<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="uot uod">
  <title id="uot">Upload model versus local MCP model</title>
  <desc id="uod">Two rows. In the upload model, your file is copied up to a cloud service and a new file comes back, so the upload is a boundary you can put a control on. In the local MCP model, the file is opened in the running application and an agent drives that application over local MCP, editing the original in place with no copy and no upload boundary.</desc>
  <style>
    .uo-box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .uo-hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .uo-adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .uo-ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .uo-rowttl{ font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .uo-lbl   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .uo-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .uo-arr   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .uo-note  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
    .uo-line  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#uoarr); }
  </style>
  <defs>
    <marker id="uoarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="uo-ttl" x="20" y="30">Where the work happens</text>

  <text class="uo-rowttl" x="20" y="66">Upload model: the agent works on a copy</text>
  <rect class="uo-box" x="60" y="82" width="180" height="66" />
  <text class="uo-lbl" x="150" y="120" text-anchor="middle">Your file</text>
  <path class="uo-line" d="M 244 115 L 356 115" />
  <text class="uo-arr" x="300" y="105" text-anchor="middle">upload a copy</text>
  <rect class="uo-adj" x="360" y="82" width="180" height="66" />
  <text class="uo-lbl" x="450" y="120" text-anchor="middle">Cloud service</text>
  <path class="uo-line" d="M 544 115 L 656 115" />
  <text class="uo-arr" x="600" y="105" text-anchor="middle">download result</text>
  <rect class="uo-box" x="660" y="82" width="180" height="66" />
  <text class="uo-lbl" x="750" y="120" text-anchor="middle">A different file</text>

  <text class="uo-rowttl" x="20" y="206">Local MCP model: the agent works on the live document</text>
  <rect class="uo-box" x="60" y="222" width="180" height="66" />
  <text class="uo-lbl" x="150" y="260" text-anchor="middle">Your file, edited</text>
  <path class="uo-line" d="M 356 255 L 244 255" />
  <text class="uo-arr" x="300" y="245" text-anchor="middle">saved in place</text>
  <rect class="uo-hero" x="360" y="222" width="180" height="66" />
  <text class="uo-inv" x="450" y="253" text-anchor="middle">The app, running,</text>
  <text class="uo-inv" x="450" y="271" text-anchor="middle">document open</text>
  <path class="uo-line" d="M 656 255 L 544 255" />
  <text class="uo-arr" x="600" y="245" text-anchor="middle">local MCP</text>
  <rect class="uo-adj" x="660" y="222" width="180" height="66" />
  <text class="uo-lbl" x="750" y="260" text-anchor="middle">Outside agent</text>

  <text class="uo-note" x="20" y="330">Same bytes, same layers, no round-trip — and no upload step left to hang a control on.</text>
</svg>
