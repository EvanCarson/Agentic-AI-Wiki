<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="wmt2 wmd2">
  <title id="wmt2">What each integration shape changes</title>
  <desc id="wmd2">A three by three matrix. Round-trip upload: the file lives in two places, you can allowlist the destination host, and undo means discarding the returned file. In-app assistant: the file lives in the app, you allowlist nothing because the vendor is the agent, and undo is the application history. Local MCP: the file lives in the running application, there is no host to allowlist, and undo is whatever the application happened to record.</desc>
  <style>
    .wm2-hi { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .wm2-md { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .wm2-lo { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .wm2-ttl { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wm2-col { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .wm2-row { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wm2-cel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .wm2-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .wm2-leg { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
  </style>

  <text class="wm2-ttl" x="20" y="34">What you can still control, by integration shape</text>

  <text class="wm2-col" x="370" y="78" text-anchor="middle">Where the file lives</text>
  <text class="wm2-col" x="580" y="78" text-anchor="middle">What you allowlist</text>
  <text class="wm2-col" x="790" y="78" text-anchor="middle">What undo means</text>

  <text class="wm2-row" x="20" y="123">Round-trip upload</text>
  <rect class="wm2-lo" x="270" y="96" width="200" height="48" />
  <text class="wm2-cel" x="370" y="125" text-anchor="middle">Two places</text>
  <rect class="wm2-hi" x="480" y="96" width="200" height="48" />
  <text class="wm2-inv" x="580" y="125" text-anchor="middle">The destination host</text>
  <rect class="wm2-hi" x="690" y="96" width="200" height="48" />
  <text class="wm2-inv" x="790" y="125" text-anchor="middle">Discard the new file</text>

  <text class="wm2-row" x="20" y="195">In-app assistant</text>
  <rect class="wm2-md" x="270" y="168" width="200" height="48" />
  <text class="wm2-cel" x="370" y="197" text-anchor="middle">In the app</text>
  <rect class="wm2-lo" x="480" y="168" width="200" height="48" />
  <text class="wm2-cel" x="580" y="197" text-anchor="middle">Nothing; vendor is agent</text>
  <rect class="wm2-md" x="690" y="168" width="200" height="48" />
  <text class="wm2-cel" x="790" y="197" text-anchor="middle">App history</text>

  <text class="wm2-row" x="20" y="267">Local MCP</text>
  <rect class="wm2-md" x="270" y="240" width="200" height="48" />
  <text class="wm2-cel" x="370" y="269" text-anchor="middle">In the running app</text>
  <rect class="wm2-lo" x="480" y="240" width="200" height="48" />
  <text class="wm2-cel" x="580" y="269" text-anchor="middle">No host to allowlist</text>
  <rect class="wm2-lo" x="690" y="240" width="200" height="48" />
  <text class="wm2-cel" x="790" y="269" text-anchor="middle">Whatever the app logged</text>

  <rect class="wm2-hi" x="20" y="340" width="18" height="14" />
  <text class="wm2-leg" x="48" y="352">A control you hold</text>
  <rect class="wm2-md" x="250" y="340" width="18" height="14" />
  <text class="wm2-leg" x="278" y="352">Partial</text>
  <rect class="wm2-lo" x="420" y="340" width="18" height="14" />
  <text class="wm2-leg" x="448" y="352">None</text>
</svg>
