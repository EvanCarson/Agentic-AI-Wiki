<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="lt ld">
  <title id="lt">Where liability lands once the agent stops being a candidate defendant</title>
  <desc id="ld">An intrusion traces back along two paths. One path goes to the operator, the party that instructed the agent, whose standard is knowing operation plus recklessness and whose evidence is a per-action authority record that most stacks do not keep. The other goes to the developer, the party that shipped the model, whose standard is reasonable safeguards plus knowledge of hacking capability and whose evidence is its own published safety framework. The agent itself sits between them as a non-party: refusing to treat it as an actor does not reduce the number of defendants, it redistributes them across the two paths.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .ghost  { fill: var(--paper); stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 5 4; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .item   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .item-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .muted  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .55; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#larr); }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>
  <defs>
    <marker id="larr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="20" y="26">One intrusion, two parties, two different kinds of evidence</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <rect class="hero" x="330" y="58" width="240" height="62" rx="8" />
  <text class="cap" x="350" y="80" fill="var(--paper)" opacity=".7">THE EVENT</text>
  <text class="head-inv" x="350" y="102">Unauthorised access occurs</text>

  <rect class="ghost" x="330" y="166" width="240" height="70" rx="8" />
  <text class="cap" x="350" y="188">NON-PARTY</text>
  <text class="item" x="350" y="208">The agent</text>
  <text class="muted" x="350" y="226">not an actor, not a defendant</text>

  <path class="arrow" d="M 450 120 L 450 162" />
  <path class="arrow" d="M 330 201 L 232 201" />
  <path class="arrow" d="M 570 201 L 668 201" />

  <rect class="adj" x="20" y="262" width="400" height="196" rx="8" />
  <text class="cap" x="42" y="286">PATH 1 — THE PARTY THAT INSTRUCTED IT</text>
  <text class="head" x="42" y="310">Operator</text>
  <text class="item" x="42" y="336">Standard: knowing operation of the agent,</text>
  <text class="item" x="42" y="354">recklessly causing damage or loss</text>
  <text class="item" x="42" y="382">Knowledge comes from: the public record</text>
  <text class="item" x="42" y="400">it should have read</text>
  <text class="item" x="42" y="428">Decisive artefact: per-action authority record</text>
  <text class="item" x="42" y="446">Usually kept: sampled, 30 days</text>

  <rect class="box" x="480" y="262" width="400" height="196" rx="8" />
  <text class="cap" x="502" y="286">PATH 2 — THE PARTY THAT SHIPPED IT</text>
  <text class="head" x="502" y="310">Developer</text>
  <text class="item" x="502" y="336">Standard: failure to implement reasonable</text>
  <text class="item" x="502" y="354">safeguards against hacking</text>
  <text class="item" x="502" y="382">Knowledge comes from: its own dated</text>
  <text class="item" x="502" y="400">capability threshold claim</text>
  <text class="item" x="502" y="428">Decisive artefact: the safety framework</text>
  <text class="item" x="502" y="446">Usually kept: published, permanently</text>

  <text class="item" x="22" y="196">Operator</text>
  <text class="item" x="676" y="196">Developer</text>
  <text class="cap" x="20" y="484">Only one of the two parties has already written its knowledge down. Only one of the two has to build the record from scratch.</text>
</svg>
