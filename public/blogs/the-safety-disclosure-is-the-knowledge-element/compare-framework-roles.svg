<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="ft fd">
  <title id="ft">Three readers of one frontier safety framework</title>
  <desc id="fd">Three columns describing the same document. For the regulator it was written to show that risk is taken seriously, through thresholds, evaluations and safeguards. For the customer and the downstream security team it is how exposure gets sized, naming what the model can do and under which scaffold. For a prosecutor under a knowledge-indexed liability rule it is a dated first-party admission of what the developer knew and when, drafted by the defendant's own counsel. The first two readers were designed for; the third arrived in 2026.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .item   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .item-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>

  <text class="head" x="20" y="26">Same document, three readers — and nobody drafted for the third</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <rect class="box" x="30" y="58" width="260" height="188" rx="8" />
  <text class="cap" x="46" y="80">READER 1 — DESIGNED FOR</text>
  <text class="head" x="46" y="104">The regulator</text>
  <text class="item" x="46" y="132">asks: are you taking this</text>
  <text class="item" x="46" y="148">seriously?</text>
  <text class="item" x="46" y="176">reads: thresholds, evals,</text>
  <text class="item" x="46" y="192">safeguards, staged release</text>
  <text class="item" x="46" y="220">effect: earns the benefit</text>
  <text class="item" x="46" y="236">of the doubt</text>

  <rect class="adj" x="320" y="58" width="260" height="188" rx="8" />
  <text class="cap" x="336" y="80">READER 2 — DESIGNED FOR</text>
  <text class="head" x="336" y="104">The security team</text>
  <text class="item" x="336" y="132">asks: what can this thing</text>
  <text class="item" x="336" y="148">do in my environment?</text>
  <text class="item" x="336" y="176">reads: capability per task,</text>
  <text class="item" x="336" y="192">scaffold, tools, limits</text>
  <text class="item" x="336" y="220">effect: sizes exposure —</text>
  <text class="item" x="336" y="236">the only source there is</text>

  <rect class="hero" x="610" y="58" width="260" height="188" rx="8" />
  <text class="cap" x="626" y="80" fill="var(--paper)" opacity=".7">READER 3 — ARRIVED IN 2026</text>
  <text class="head-inv" x="626" y="104">The knowledge standard</text>
  <text class="item-inv" x="626" y="132">asks: when did the</text>
  <text class="item-inv" x="626" y="148">defendant know?</text>
  <text class="item-inv" x="626" y="176">reads: the date, the name of</text>
  <text class="item-inv" x="626" y="192">the tier, the admission</text>
  <text class="item-inv" x="626" y="220">effect: the element that is</text>
  <text class="item-inv" x="626" y="236">normally hardest to prove</text>

  <text class="cap" x="30" y="278">Reading less is not a defence: "had reason to know" does not reward looking away, and column two is nobody's optional extra.</text>
</svg>
