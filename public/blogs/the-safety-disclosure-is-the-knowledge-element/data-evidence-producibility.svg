<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="et ed">
  <title id="et">Can you produce each evidentiary artefact for an action ninety days old?</title>
  <desc id="ed">Five artefacts needed to answer a recklessness allegation, scored against a typical agent stack and a mature one. The instruction as given and the actions attempted are usually available but sampled. The policy in force at that moment and the human authorisation are partial. The authority the agent actually held is typically absent altogether, because it lives in a credential, a tool list and a config file rather than in the trace. A mature stack records all five per action in a separate long-lived store.</desc>
  <style>
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .strong { fill: var(--accent, #d4421e); stroke: none; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .colh   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .rowh   { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>

  <text class="title" x="20" y="26">Five artefacts a recklessness question needs, and where each one lives today</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <text class="colh" x="492" y="62" text-anchor="middle">TYPICAL STACK, 90 DAYS ON</text>
  <text class="colh" x="742" y="62" text-anchor="middle">IF YOU BUILD FOR IT</text>

  <text class="rowh" x="20" y="98">The task as instructed</text>
  <rect class="med" x="372" y="76" width="240" height="34" rx="4" />
  <text class="cell" x="492" y="98" text-anchor="middle">sampled, often expired</text>
  <rect class="strong" x="622" y="76" width="240" height="34" rx="4" />
  <text class="cell-inv" x="742" y="98" text-anchor="middle">kept in full</text>

  <text class="rowh" x="20" y="144">The policy then in force</text>
  <rect class="weak" x="372" y="122" width="240" height="34" rx="4" />
  <text class="cell" x="492" y="144" text-anchor="middle">inferred from deploy logs</text>
  <rect class="strong" x="622" y="122" width="240" height="34" rx="4" />
  <text class="cell-inv" x="742" y="144" text-anchor="middle">stamped per action</text>

  <text class="rowh" x="20" y="190">The authority it held</text>
  <rect class="weak" x="372" y="168" width="240" height="34" rx="4" />
  <text class="cell" x="492" y="190" text-anchor="middle">not recorded anywhere</text>
  <rect class="strong" x="622" y="168" width="240" height="34" rx="4" />
  <text class="cell-inv" x="742" y="190" text-anchor="middle">scope in the envelope</text>

  <text class="rowh" x="20" y="236">The actions attempted</text>
  <rect class="med" x="372" y="214" width="240" height="34" rx="4" />
  <text class="cell" x="492" y="236" text-anchor="middle">sampled at 1–10%</text>
  <rect class="strong" x="622" y="214" width="240" height="34" rx="4" />
  <text class="cell-inv" x="742" y="236" text-anchor="middle">every write, unsampled</text>

  <text class="rowh" x="20" y="282">The human authorisation</text>
  <rect class="weak" x="372" y="260" width="240" height="34" rx="4" />
  <text class="cell" x="492" y="282" text-anchor="middle">a click with no payload</text>
  <rect class="strong" x="622" y="260" width="240" height="34" rx="4" />
  <text class="cell-inv" x="742" y="282" text-anchor="middle">bound to the effect</text>

  <line class="rule" x1="20" y1="312" x2="880" y2="312" />
  <rect class="weak" x="372" y="330" width="22" height="16" rx="3" />
  <text class="sub" x="402" y="343">absent or reconstructed</text>
  <rect class="med" x="560" y="330" width="22" height="16" rx="3" />
  <text class="sub" x="590" y="343">present but partial</text>
  <rect class="strong" x="716" y="330" width="22" height="16" rx="3" />
  <text class="sub" x="746" y="343">producible on demand</text>

  <text class="sub" x="20" y="378">Observability wants the recent and the aggregate; evidence wants one old run in full. A sampling policy correct for the first is fatal for the second.</text>
</svg>
