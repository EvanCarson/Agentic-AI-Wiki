<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="tst tsd">
  <title id="tst">Two upgrade surfaces in one framework release</title>
  <desc id="tsd">Two columns. On the left, what the release notes guard: three breaking signatures, and twenty-six modules graduated to stable. On the right, what actually changed the agent: compaction fires earlier, stable tools are always enabled, two extra events per response, metric histogram buckets moved, and version 2.13 cannot read sessions written by 2.14. Nothing in the right column has a signature, so nothing in it fails a type check.</desc>
  <style>
    .ts-adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ts-box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ts-ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .ts-hd    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .ts-lab   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .ts-note  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="ts-ttl" x="20" y="30">The version number guards the left column only</text>

  <text class="ts-hd" x="240" y="70" text-anchor="middle">What the notes guard</text>
  <text class="ts-hd" x="660" y="70" text-anchor="middle">What changed your agent</text>

  <rect class="ts-adj" x="60" y="86" width="360" height="44" />
  <text class="ts-lab" x="240" y="113" text-anchor="middle">Three breaking signatures</text>

  <rect class="ts-adj" x="60" y="140" width="360" height="44" />
  <text class="ts-lab" x="240" y="167" text-anchor="middle">Twenty-six modules now stable</text>

  <rect class="ts-box" x="480" y="86" width="360" height="44" />
  <text class="ts-lab" x="660" y="113" text-anchor="middle">Compaction fires earlier</text>

  <rect class="ts-box" x="480" y="140" width="360" height="44" />
  <text class="ts-lab" x="660" y="167" text-anchor="middle">Stable tools always enabled</text>

  <rect class="ts-box" x="480" y="194" width="360" height="44" />
  <text class="ts-lab" x="660" y="221" text-anchor="middle">Two extra events per response</text>

  <rect class="ts-box" x="480" y="248" width="360" height="44" />
  <text class="ts-lab" x="660" y="275" text-anchor="middle">Metric histogram buckets moved</text>

  <rect class="ts-box" x="480" y="302" width="360" height="44" />
  <text class="ts-lab" x="660" y="329" text-anchor="middle">2.13 cannot read 2.14 sessions</text>

  <text class="ts-note" x="60" y="378">Nothing on the right has a signature, so nothing on it fails a type check.</text>
</svg>
