<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="wst wsd">
  <title id="wst">What a stability label guards, and what it does not</title>
  <desc id="wsd">A four by three matrix. API signatures: three breaking changes are named in the release notes, they change behaviour only where you call the affected API, and they are named but carry no compatibility promise. The default tool surface: not named in the headline, it changes agent behaviour because stable features are now always enabled, and the stability label does not guard it. The compaction trigger point: one line in the notes, it changes behaviour because compaction now fires earlier, and the label does not guard it. The session rollback path: one line in the notes, it changes behaviour one-way because version 2.13 cannot read sessions written by 2.14, and the label does not guard it. Legend: yes, partly, no.</desc>
  <style>
    .ws-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .ws-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .ws-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .ws-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .ws-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .ws-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .ws-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .ws-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .ws-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="ws-ttl" x="20" y="30">Four changes, and which ones the label covers</text>

  <text class="ws-col" x="330" y="66" text-anchor="middle">Named in the notes?</text>
  <text class="ws-col" x="550" y="66" text-anchor="middle">Changes behaviour?</text>
  <text class="ws-col" x="770" y="66" text-anchor="middle">Guarded by "stable"?</text>

  <text class="ws-row" x="20" y="113">API signatures</text>
  <rect class="ws-strong" x="230" y="84" width="200" height="48" />
  <text class="ws-inv" x="330" y="113" text-anchor="middle">Yes, three listed</text>
  <rect class="ws-mid" x="450" y="84" width="200" height="48" />
  <text class="ws-cell" x="550" y="113" text-anchor="middle">Where you call it</text>
  <rect class="ws-mid" x="670" y="84" width="200" height="48" />
  <text class="ws-cell" x="770" y="113" text-anchor="middle">Named, not promised</text>

  <text class="ws-row" x="20" y="175">Default tool surface</text>
  <rect class="ws-weak" x="230" y="146" width="200" height="48" />
  <text class="ws-cell" x="330" y="175" text-anchor="middle">No</text>
  <rect class="ws-strong" x="450" y="146" width="200" height="48" />
  <text class="ws-inv" x="550" y="175" text-anchor="middle">Yes, now always on</text>
  <rect class="ws-weak" x="670" y="146" width="200" height="48" />
  <text class="ws-cell" x="770" y="175" text-anchor="middle">No</text>

  <text class="ws-row" x="20" y="237">Compaction trigger</text>
  <rect class="ws-mid" x="230" y="208" width="200" height="48" />
  <text class="ws-cell" x="330" y="237" text-anchor="middle">One line</text>
  <rect class="ws-strong" x="450" y="208" width="200" height="48" />
  <text class="ws-inv" x="550" y="237" text-anchor="middle">Yes, fires earlier</text>
  <rect class="ws-weak" x="670" y="208" width="200" height="48" />
  <text class="ws-cell" x="770" y="237" text-anchor="middle">No</text>

  <text class="ws-row" x="20" y="299">Session rollback</text>
  <rect class="ws-mid" x="230" y="270" width="200" height="48" />
  <text class="ws-cell" x="330" y="299" text-anchor="middle">One line</text>
  <rect class="ws-strong" x="450" y="270" width="200" height="48" />
  <text class="ws-inv" x="550" y="299" text-anchor="middle">Yes, one-way</text>
  <rect class="ws-weak" x="670" y="270" width="200" height="48" />
  <text class="ws-cell" x="770" y="299" text-anchor="middle">No</text>

  <rect class="ws-strong" x="20" y="352" width="18" height="14" />
  <text class="ws-leg" x="48" y="364">Yes</text>
  <rect class="ws-mid" x="200" y="352" width="18" height="14" />
  <text class="ws-leg" x="228" y="364">Partly</text>
  <rect class="ws-weak" x="380" y="352" width="18" height="14" />
  <text class="ws-leg" x="408" y="364">No</text>
</svg>
