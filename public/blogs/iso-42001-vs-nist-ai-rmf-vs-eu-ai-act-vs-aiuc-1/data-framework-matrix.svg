<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmT fmD">
  <title id="fmT">Four AI governance frameworks across four properties</title>
  <desc id="fmD">A matrix of four frameworks against four properties. ISO/IEC 42001 is voluntary, strongly certifiable by an accredited body on a three-year cycle, has no agent-specific controls, and is widely accepted as buyer evidence. The NIST AI Risk Management Framework is voluntary, self-attested rather than certifiable, has agentic overlays still forthcoming, and is usually accepted as a mapping. The EU AI Act is binding law, uses conformity assessment rather than certification, allocates duties by role rather than by agentic behaviour, and is required rather than credited. AIUC-1 is a private standard, certifiable through a single issuer, purpose-built for agents, and emerging as buyer evidence.</desc>
  <style>
    .lbl    { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .strong { fill: var(--accent, #d4421e); stroke: none; rx: 6; ry: 6; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--ink); opacity: .65; letter-spacing: .06em; }
    .name   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Four different objects, asked for as if they were one</text>

  <text class="hd" x="210" y="46">LEGALLY BINDING</text>
  <text class="hd" x="383" y="46">CERTIFIABLE</text>
  <text class="hd" x="556" y="46">AGENT CONTROLS</text>
  <text class="hd" x="729" y="46">BUYER EVIDENCE</text>

  <rect class="lbl" x="0" y="60" width="200" height="68" />
  <text class="name" x="14" y="92">ISO/IEC 42001</text>
  <text class="sub" x="14" y="110">management system</text>
  <rect class="weak" x="210" y="60" width="165" height="68" />
  <text class="cell" x="292" y="92" text-anchor="middle">No — voluntary</text>
  <text class="cell" x="292" y="108" text-anchor="middle">standard</text>
  <rect class="strong" x="383" y="60" width="165" height="68" />
  <text class="cell-inv" x="465" y="92" text-anchor="middle">Accredited audit,</text>
  <text class="cell-inv" x="465" y="108" text-anchor="middle">three-year cycle</text>
  <rect class="weak" x="556" y="60" width="165" height="68" />
  <text class="cell" x="638" y="92" text-anchor="middle">None — written</text>
  <text class="cell" x="638" y="108" text-anchor="middle">for AI systems</text>
  <rect class="strong" x="729" y="60" width="165" height="68" />
  <text class="cell-inv" x="811" y="92" text-anchor="middle">Widely accepted</text>
  <text class="cell-inv" x="811" y="108" text-anchor="middle">certificate</text>

  <rect class="lbl" x="0" y="136" width="200" height="68" />
  <text class="name" x="14" y="168">NIST AI RMF</text>
  <text class="sub" x="14" y="186">voluntary framework</text>
  <rect class="weak" x="210" y="136" width="165" height="68" />
  <text class="cell" x="292" y="168" text-anchor="middle">No — voluntary</text>
  <text class="cell" x="292" y="184" text-anchor="middle">guidance</text>
  <rect class="weak" x="383" y="136" width="165" height="68" />
  <text class="cell" x="465" y="168" text-anchor="middle">No — you attest</text>
  <text class="cell" x="465" y="184" text-anchor="middle">to yourself</text>
  <rect class="med" x="556" y="136" width="165" height="68" />
  <text class="cell" x="638" y="168" text-anchor="middle">Agentic overlays</text>
  <text class="cell" x="638" y="184" text-anchor="middle">still forthcoming</text>
  <rect class="med" x="729" y="136" width="165" height="68" />
  <text class="cell" x="811" y="168" text-anchor="middle">Usually, as a</text>
  <text class="cell" x="811" y="184" text-anchor="middle">control mapping</text>

  <rect class="lbl" x="0" y="212" width="200" height="68" />
  <text class="name" x="14" y="244">EU AI Act</text>
  <text class="sub" x="14" y="262">regulation</text>
  <rect class="strong" x="210" y="212" width="165" height="68" />
  <text class="cell-inv" x="292" y="244" text-anchor="middle">Yes — it is the</text>
  <text class="cell-inv" x="292" y="260" text-anchor="middle">law</text>
  <rect class="med" x="383" y="212" width="165" height="68" />
  <text class="cell" x="465" y="244" text-anchor="middle">Conformity</text>
  <text class="cell" x="465" y="260" text-anchor="middle">assessment</text>
  <rect class="weak" x="556" y="212" width="165" height="68" />
  <text class="cell" x="638" y="244" text-anchor="middle">Duties by role,</text>
  <text class="cell" x="638" y="260" text-anchor="middle">not by autonomy</text>
  <rect class="med" x="729" y="212" width="165" height="68" />
  <text class="cell" x="811" y="244" text-anchor="middle">Required, not</text>
  <text class="cell" x="811" y="260" text-anchor="middle">credit earned</text>

  <rect class="lbl" x="0" y="288" width="200" height="68" />
  <text class="name" x="14" y="320">AIUC-1</text>
  <text class="sub" x="14" y="338">private certification</text>
  <rect class="weak" x="210" y="288" width="165" height="68" />
  <text class="cell" x="292" y="320" text-anchor="middle">No — a private</text>
  <text class="cell" x="292" y="336" text-anchor="middle">standard</text>
  <rect class="med" x="383" y="288" width="165" height="68" />
  <text class="cell" x="465" y="320" text-anchor="middle">Yes — one issuer,</text>
  <text class="cell" x="465" y="336" text-anchor="middle">12-month term</text>
  <rect class="strong" x="556" y="288" width="165" height="68" />
  <text class="cell-inv" x="638" y="320" text-anchor="middle">Purpose-built for</text>
  <text class="cell-inv" x="638" y="336" text-anchor="middle">agents</text>
  <rect class="med" x="729" y="288" width="165" height="68" />
  <text class="cell" x="811" y="320" text-anchor="middle">Emerging — young</text>
  <text class="cell" x="811" y="336" text-anchor="middle">and single-source</text>

  <text class="sub" x="0" y="382">Solid = the property holds strongly · tinted = partially · outlined = not at all. No row dominates, which is the point.</text>
</svg>
