<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="cpT cpD">
  <title id="cpT">Three standards on the road to EU AI Act presumption of conformity</title>
  <desc id="cpD">Three columns tracking what each standard does for Article 17 of the EU AI Act. ISO/IEC 42001, published in December 2023, is a certifiable AI management system standard but is not harmonised and carries no presumption of conformity. EN ISO/IEC 42001:2026, the European adoption published on 18 March 2026, is a European standard but is still not the Article 17 quality management system. EN 18286:2026, approved by CEN and CENELEC on 12 July 2026, is the standard written to carry presumption of conformity for Article 17, but it had not been cited in the Official Journal as of mid-August 2026, so the presumption does not yet operate.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">What buys presumption of conformity under Article 17</text>

  <rect class="box" x="35" y="44" width="250" height="180" />
  <text class="hd" x="160" y="74" text-anchor="middle">ISO/IEC 42001</text>
  <text class="sub" x="160" y="94" text-anchor="middle">published December 2023</text>
  <text class="cell" x="160" y="126" text-anchor="middle">A certifiable AI management</text>
  <text class="cell" x="160" y="144" text-anchor="middle">system standard, with its own</text>
  <text class="cell" x="160" y="162" text-anchor="middle">purpose and its own value.</text>
  <text class="cell" x="160" y="194" text-anchor="middle">Presumption of conformity: none.</text>
  <text class="sub" x="160" y="250" text-anchor="middle">Not a harmonised standard.</text>
  <text class="sub" x="160" y="268" text-anchor="middle">A certificate is not a legal shield.</text>

  <rect class="adj" x="325" y="44" width="250" height="180" />
  <text class="hd" x="450" y="74" text-anchor="middle">EN ISO/IEC 42001:2026</text>
  <text class="sub" x="450" y="94" text-anchor="middle">published 18 March 2026</text>
  <text class="cell" x="450" y="126" text-anchor="middle">The European adoption of the</text>
  <text class="cell" x="450" y="144" text-anchor="middle">same standard — a European</text>
  <text class="cell" x="450" y="162" text-anchor="middle">standard, and still not Article 17.</text>
  <text class="cell" x="450" y="194" text-anchor="middle">Presumption of conformity: none.</text>
  <text class="sub" x="450" y="250" text-anchor="middle">The EN prefix is the thing most</text>
  <text class="sub" x="450" y="268" text-anchor="middle">often mistaken for harmonisation.</text>

  <rect class="hero" x="615" y="44" width="250" height="180" />
  <text class="hd-inv" x="740" y="74" text-anchor="middle">EN 18286:2026</text>
  <text class="cell-inv" x="740" y="94" text-anchor="middle">approved 12 July 2026</text>
  <text class="cell-inv" x="740" y="126" text-anchor="middle">Written to be the Article 17</text>
  <text class="cell-inv" x="740" y="144" text-anchor="middle">quality management system;</text>
  <text class="cell-inv" x="740" y="162" text-anchor="middle">first JTC 21 standard approved.</text>
  <text class="cell-inv" x="740" y="194" text-anchor="middle">Presumption: pending citation.</text>
  <text class="sub" x="740" y="250" text-anchor="middle">Not cited in the Official Journal</text>
  <text class="sub" x="740" y="268" text-anchor="middle">as of mid-August 2026.</text>
</svg>
