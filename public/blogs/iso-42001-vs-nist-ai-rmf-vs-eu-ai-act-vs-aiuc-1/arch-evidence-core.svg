<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="ecT ecD">
  <title id="ecT">One evidence core, four different proof objects</title>
  <desc id="ecD">A shared evidence core sits in the centre: an inventory of AI systems, a risk assessment per system, documented human oversight, incident and change logs, evaluation records, and supplier controls. Four arrows lead outward to four different proof objects, each with a different recipient. ISO/IEC 42001 produces an accredited certificate for a procurement team. The NIST AI Risk Management Framework produces a self-attested control mapping for a security questionnaire. The EU AI Act produces a technical file and declaration of conformity for a regulator or notified body. AIUC-1 produces an audited certificate priced into an insurance premium for an underwriter. The core is built once; only the packaging differs.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#ecarr); }
  </style>
  <defs>
    <marker id="ecarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="20">Build the evidence once, package it four ways</text>

  <rect class="hero" x="230" y="44" width="440" height="150" />
  <text class="hd-inv" x="450" y="74" text-anchor="middle">The shared evidence core</text>
  <text class="cell-inv" x="450" y="104" text-anchor="middle">An inventory of AI systems · a risk assessment per system</text>
  <text class="cell-inv" x="450" y="126" text-anchor="middle">documented human oversight · incident and change logs</text>
  <text class="cell-inv" x="450" y="148" text-anchor="middle">evaluation records · supplier and model provenance controls</text>
  <text class="cell-inv" x="450" y="176" text-anchor="middle">Roughly the same artefacts in all four cases.</text>

  <path class="arrow" d="M 320 198 L 130 292" />
  <path class="arrow" d="M 400 198 L 340 292" />
  <path class="arrow" d="M 500 198 L 560 292" />
  <path class="arrow" d="M 580 198 L 770 292" />

  <rect class="adj" x="20" y="298" width="200" height="128" />
  <text class="hd" x="120" y="326" text-anchor="middle">ISO/IEC 42001</text>
  <text class="cell" x="120" y="354" text-anchor="middle">An accredited certificate</text>
  <text class="cell" x="120" y="372" text-anchor="middle">on a three-year cycle</text>
  <text class="cell" x="120" y="404" text-anchor="middle">Recipient: procurement</text>

  <rect class="box" x="240" y="298" width="200" height="128" />
  <text class="hd" x="340" y="326" text-anchor="middle">NIST AI RMF</text>
  <text class="cell" x="340" y="354" text-anchor="middle">A self-attested mapping</text>
  <text class="cell" x="340" y="372" text-anchor="middle">of controls to functions</text>
  <text class="cell" x="340" y="404" text-anchor="middle">Recipient: a questionnaire</text>

  <rect class="adj" x="460" y="298" width="200" height="128" />
  <text class="hd" x="560" y="326" text-anchor="middle">EU AI Act</text>
  <text class="cell" x="560" y="354" text-anchor="middle">A technical file and a</text>
  <text class="cell" x="560" y="372" text-anchor="middle">declaration of conformity</text>
  <text class="cell" x="560" y="404" text-anchor="middle">Recipient: the regulator</text>

  <rect class="box" x="680" y="298" width="200" height="128" />
  <text class="hd" x="780" y="326" text-anchor="middle">AIUC-1</text>
  <text class="cell" x="780" y="354" text-anchor="middle">An audited certificate,</text>
  <text class="cell" x="780" y="372" text-anchor="middle">re-tested quarterly</text>
  <text class="cell" x="780" y="404" text-anchor="middle">Recipient: an underwriter</text>

  <text class="sub" x="0" y="460">What differs is the recipient, the proof object and the enforcement mechanism — not most of the underlying work.</text>
  <text class="sub" x="0" y="482">Which is why the sequencing question is who asks you first, not which framework is best.</text>
</svg>
