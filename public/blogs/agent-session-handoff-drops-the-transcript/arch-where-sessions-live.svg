<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where each coding agent keeps its session on disk</title>
  <desc id="d">Three columns of on-disk session storage. Claude Code writes JSONL under a projects directory keyed by encoded working directory, with subagent transcripts in their own sidechain files. Codex CLI writes date-partitioned rollout JSONL files that its context manager replays on resume. Gemini CLI writes session JSON under a temporary project directory. Below, a band notes the shape all three share: append-only JSONL, one line per turn, each linked to its parent. A final highlighted band notes what they do not share: entry semantics, with Anthropic documenting its format as internal and able to change on any release.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .colh   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .colh-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .lab    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .lab-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .path   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .85; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .tag-inv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--paper); opacity: .85; }
  </style>

  <rect class="box" x="24" y="40" width="276" height="224" />
  <text class="tag" x="44" y="66">AGENT</text>
  <text class="colh" x="44" y="90">Claude Code</text>
  <text class="path" x="44" y="120">~/.claude/projects/</text>
  <text class="path" x="44" y="138">  &lt;encoded-cwd&gt;/</text>
  <text class="path" x="44" y="156">  &lt;session-id&gt;.jsonl</text>
  <text class="lab" x="44" y="186">Each line carries uuid,</text>
  <text class="lab" x="44" y="206">parentUuid, sessionId, cwd.</text>
  <text class="lab" x="44" y="226">Subagents get their own</text>
  <text class="lab" x="44" y="246">sidechain files.</text>

  <rect class="box" x="312" y="40" width="276" height="224" />
  <text class="tag" x="332" y="66">AGENT</text>
  <text class="colh" x="332" y="90">Codex CLI</text>
  <text class="path" x="332" y="120">~/.codex/sessions/</text>
  <text class="path" x="332" y="138">  YYYY/MM/DD/</text>
  <text class="path" x="332" y="156">  rollout-&lt;ts&gt;-&lt;id&gt;.jsonl</text>
  <text class="lab" x="332" y="186">A rollout stream of response</text>
  <text class="lab" x="332" y="206">items. The context manager</text>
  <text class="lab" x="332" y="226">replays them to rebuild</text>
  <text class="lab" x="332" y="246">state on resume.</text>

  <rect class="box" x="600" y="40" width="276" height="224" />
  <text class="tag" x="620" y="66">AGENT</text>
  <text class="colh" x="620" y="90">Gemini CLI</text>
  <text class="path" x="620" y="120">~/.gemini/tmp/</text>
  <text class="path" x="620" y="138">  &lt;project&gt;/chats/</text>
  <text class="path" x="620" y="156">  session-*.json</text>
  <text class="lab" x="620" y="186">A native ACP agent, so an</text>
  <text class="lab" x="620" y="206">editor can drive it — and</text>
  <text class="lab" x="620" y="226">it still keeps its own</text>
  <text class="lab" x="620" y="246">private session file.</text>

  <rect class="adj" x="24" y="296" width="852" height="64" />
  <text class="tag" x="44" y="320">WHAT ALL THREE SHARE</text>
  <text class="colh" x="44" y="344">Append-only JSONL, one line per turn, each line linked to its parent.</text>

  <rect class="hero" x="24" y="380" width="852" height="88" />
  <text class="tag-inv" x="44" y="406">WHAT NONE OF THEM SHARE</text>
  <text class="colh-inv" x="44" y="430">Entry semantics. Anthropic documents its format as internal to Claude Code</text>
  <text class="lab-inv" x="44" y="452">and subject to change between versions — a parser can break on any release.</text>
</svg>
