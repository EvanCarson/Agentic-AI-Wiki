<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Every line in a handoff file is either re-checkable or a labelled decision</title>
  <desc id="d">Two columns. On the left, three things a handoff file claims: that a migration is applied, that a named test is the failing one, and that advisory locks were chosen over Redis. On the right, what lets the receiving agent trust each: a single command for the first two, and for the third, nothing — it is a decision, and must be labelled as one so the receiver either accepts it or re-opens it rather than discovering the difference by testing.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .colh   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .colh-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .lab    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .lab-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .hmono  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; fill: var(--ink); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .tag-inv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--paper); opacity: .85; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="tag" x="24" y="70">WHAT THE HANDOFF CLAIMS</text>
  <text class="tag" x="460" y="70">WHAT LETS THE RECEIVER TRUST IT</text>

  <rect class="box" x="24" y="96" width="380" height="96" />
  <text class="tag" x="44" y="120">FACT</text>
  <text class="colh" x="44" y="146">Migration 0042 is applied on dev</text>
  <text class="lab" x="44" y="170">added the audit_log table</text>
  <path class="arrow" d="M 408 144 L 456 144" />
  <rect class="adj" x="460" y="96" width="416" height="96" />
  <text class="tag" x="480" y="120">ONE COMMAND</text>
  <text class="hmono" x="480" y="146">psql -c '\dt' | grep audit_log</text>
  <text class="lab" x="480" y="170">Costs the receiver two seconds.</text>

  <rect class="box" x="24" y="212" width="380" height="96" />
  <text class="tag" x="44" y="236">FACT</text>
  <text class="colh" x="44" y="262">test_retry is the one still failing</text>
  <text class="lab" x="44" y="286">the other four now pass</text>
  <path class="arrow" d="M 408 260 L 456 260" />
  <rect class="adj" x="460" y="212" width="416" height="96" />
  <text class="tag" x="480" y="236">ONE COMMAND</text>
  <text class="hmono" x="480" y="262">pytest tests/test_sender.py -x</text>
  <text class="lab" x="480" y="286">Disagreement shows up immediately.</text>

  <rect class="adj" x="24" y="328" width="380" height="126" />
  <text class="tag" x="44" y="352">DECISION</text>
  <text class="colh" x="44" y="378">Advisory locks, not Redis</text>
  <text class="lab" x="44" y="402">because the lock has to die</text>
  <text class="lab" x="44" y="422">with the transaction</text>
  <path class="arrow" d="M 408 390 L 456 390" />
  <rect class="hero" x="460" y="328" width="416" height="126" />
  <text class="tag-inv" x="480" y="352">NOTHING RE-CHECKS THIS</text>
  <text class="colh-inv" x="480" y="378">So label it a decision, not a fact.</text>
  <text class="lab-inv" x="480" y="402">The receiver either accepts it or re-opens</text>
  <text class="lab-inv" x="480" y="422">it. What it must never do is discover the</text>
  <text class="lab-inv" x="480" y="442">difference halfway through the work.</text>
</svg>
