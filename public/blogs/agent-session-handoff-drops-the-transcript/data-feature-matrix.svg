<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">The four handoff layers scored on five axes</title>
  <desc id="d">A matrix of four transfer layers against five axes: cross-vendor reach today, how much of this session it carries, whether the receiver can verify what it is told, whether it survives a version bump, and how little setup it needs. The instruction file and the handoff artifact score strongly on everything except carrying the session. Transcript conversion is the only row that carries every turn, and it is weak on every other axis. Live protocols and shared stores sit in the middle throughout.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-head { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cv     { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink); text-anchor: middle; }
    .cv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--paper); text-anchor: middle; }
    .legend { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; }
  </style>

  <text class="chart-title" x="450" y="26">One row carries the session. It is weak everywhere else.</text>

  <text class="col-head" x="298" y="58">Cross-vendor</text><text class="col-head" x="298" y="71">today</text>
  <text class="col-head" x="424" y="58">Carries this</text><text class="col-head" x="424" y="71">session</text>
  <text class="col-head" x="550" y="58">Receiver can</text><text class="col-head" x="550" y="71">verify it</text>
  <text class="col-head" x="676" y="58">Survives a</text><text class="col-head" x="676" y="71">version bump</text>
  <text class="col-head" x="802" y="58">Setup cost</text><text class="col-head" x="802" y="71">to start</text>

  <text class="row-head" x="24" y="110">Instruction file</text>
  <rect class="strong" x="240" y="86" width="116" height="40" rx="5" /><text class="cv-inv" x="298" y="111">30+ agents</text>
  <rect class="weak" x="366" y="86" width="116" height="40" rx="5" /><text class="cv" x="424" y="111">None of it</text>
  <rect class="strong" x="492" y="86" width="116" height="40" rx="5" /><text class="cv-inv" x="550" y="111">It is in the repo</text>
  <rect class="strong" x="618" y="86" width="116" height="40" rx="5" /><text class="cv-inv" x="676" y="111">Plain text</text>
  <rect class="strong" x="744" y="86" width="116" height="40" rx="5" /><text class="cv-inv" x="802" y="111">One file</text>

  <text class="row-head" x="24" y="172">Handoff artifact</text>
  <rect class="strong" x="240" y="148" width="116" height="40" rx="5" /><text class="cv-inv" x="298" y="173">Any agent</text>
  <rect class="mid" x="366" y="148" width="116" height="40" rx="5" /><text class="cv" x="424" y="173">What you wrote</text>
  <rect class="strong" x="492" y="148" width="116" height="40" rx="5" /><text class="cv-inv" x="550" y="173">Re-checkable</text>
  <rect class="strong" x="618" y="148" width="116" height="40" rx="5" /><text class="cv-inv" x="676" y="173">Plain text</text>
  <rect class="mid" x="744" y="148" width="116" height="40" rx="5" /><text class="cv" x="802" y="173">You write it</text>

  <text class="row-head" x="24" y="234">Transcript conversion</text>
  <rect class="mid" x="240" y="210" width="116" height="40" rx="5" /><text class="cv" x="298" y="235">Per-pair code</text>
  <rect class="strong" x="366" y="210" width="116" height="40" rx="5" /><text class="cv-inv" x="424" y="235">Every turn</text>
  <rect class="weak" x="492" y="210" width="116" height="40" rx="5" /><text class="cv" x="550" y="235">Asserted only</text>
  <rect class="weak" x="618" y="210" width="116" height="40" rx="5" /><text class="cv" x="676" y="235">Internal format</text>
  <rect class="weak" x="744" y="210" width="116" height="40" rx="5" /><text class="cv" x="802" y="235">Run a tool</text>

  <text class="row-head" x="24" y="296">Live protocol / store</text>
  <rect class="mid" x="240" y="272" width="116" height="40" rx="5" /><text class="cv" x="298" y="297">If both speak it</text>
  <rect class="mid" x="366" y="272" width="116" height="40" rx="5" /><text class="cv" x="424" y="297">Facts, not turns</text>
  <rect class="mid" x="492" y="272" width="116" height="40" rx="5" /><text class="cv" x="550" y="297">Depends</text>
  <rect class="mid" x="618" y="272" width="116" height="40" rx="5" /><text class="cv" x="676" y="297">Versioned spec</text>
  <rect class="weak" x="744" y="272" width="116" height="40" rx="5" /><text class="cv" x="802" y="297">Run a server</text>

  <rect class="strong" x="240" y="346" width="16" height="16" rx="3" /><text class="legend" x="264" y="359">Strong</text>
  <rect class="mid" x="352" y="346" width="16" height="16" rx="3" /><text class="legend" x="376" y="359">Partial</text>
  <rect class="weak" x="464" y="346" width="16" height="16" rx="3" /><text class="legend" x="488" y="359">Weak</text>
</svg>
