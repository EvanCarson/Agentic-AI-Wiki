<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three things that break when a transcript crosses to another agent</title>
  <desc id="d">Three columns. The tool schema column notes that recorded tool calls name tools the receiving agent does not have, so a replayed call is an instruction it cannot run. The system prompt column notes that every assistant turn answered instructions the receiver never read, so the turn keeps its authority and loses its reason. The cache and environment column notes that the prompt cache is keyed to one provider's exact prefix and that flags such as the MCP config and added directories were never in the transcript at all.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .colh   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .colh-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .lab    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .lab-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .tag-inv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--paper); opacity: .85; }
  </style>

  <rect class="hero" x="30" y="40" width="250" height="230" />
  <text class="tag-inv" x="50" y="70">BREAKS FIRST</text>
  <text class="colh-inv" x="50" y="98">The tool schema</text>
  <text class="lab-inv" x="50" y="130">A recorded call names Edit;</text>
  <text class="lab-inv" x="50" y="150">the receiver has apply_patch.</text>
  <text class="lab-inv" x="50" y="178">Every tool_result points at a</text>
  <text class="lab-inv" x="50" y="198">tool_use id that no longer</text>
  <text class="lab-inv" x="50" y="218">resolves, so a replayed call</text>
  <text class="lab-inv" x="50" y="238">is an unrunnable instruction.</text>

  <rect class="adj" x="325" y="40" width="250" height="230" />
  <text class="tag" x="345" y="70">BREAKS QUIETLY</text>
  <text class="colh" x="345" y="98">The system prompt</text>
  <text class="lab" x="345" y="130">Each assistant turn answered</text>
  <text class="lab" x="345" y="150">instructions the receiver</text>
  <text class="lab" x="345" y="170">never read.</text>
  <text class="lab" x="345" y="198">The turn keeps its authority</text>
  <text class="lab" x="345" y="218">and loses its reason — which</text>
  <text class="lab" x="345" y="238">is the definition of a</text>
  <text class="lab" x="345" y="258">false memory.</text>

  <rect class="box" x="620" y="40" width="250" height="230" />
  <text class="tag" x="640" y="70">NEVER MADE THE FILE</text>
  <text class="colh" x="640" y="98">Cache and environment</text>
  <text class="lab" x="640" y="130">The prompt cache is keyed to</text>
  <text class="lab" x="640" y="150">one provider's exact prefix.</text>
  <text class="lab" x="640" y="178">MCP config, added directories</text>
  <text class="lab" x="640" y="198">and settings files were never</text>
  <text class="lab" x="640" y="218">in the transcript — even a</text>
  <text class="lab" x="640" y="238">same-agent resume asks you</text>
  <text class="lab" x="640" y="258">to pass them again.</text>
</svg>
