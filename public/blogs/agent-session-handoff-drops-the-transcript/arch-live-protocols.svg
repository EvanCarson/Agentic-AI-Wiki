<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Three live topologies for sharing agent state, and what each one does not do</title>
  <desc id="d">Three panels. The first shows the Agent Client Protocol: an editor at the top driving Claude Code through an adapter and Gemini CLI natively; it solves one editor driving many agents but session identifiers still belong to the agent that minted them. The second shows A2A: a client agent delegating a task under a context identifier to a remote agent, which returns artifacts; it crosses vendor boundaries but transfers deliverables rather than the peer's history. The third shows a shared MCP memory server that two agents both read and write; it gives durable cross-agent facts but stores only what was deliberately saved.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .panel  { fill: none; stroke: var(--border-soft, var(--ink)); stroke-width: 1; rx: 10; ry: 10; opacity: .55; }
    .colh   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .lab    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .lab-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .plab   { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); opacity: .85; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .edge   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9.5px; fill: var(--ink); opacity: .65; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="panel" x="24" y="30" width="276" height="446" />
  <text class="tag" x="44" y="58">TOPOLOGY 1</text>
  <text class="colh" x="44" y="82">ACP — client to agent</text>
  <rect class="hero" x="92" y="104" width="140" height="42" />
  <text class="lab-inv" x="162" y="130" text-anchor="middle">Zed / JetBrains</text>
  <path class="arrow" d="M 140 150 L 106 186" />
  <path class="arrow" d="M 184 150 L 218 186" />
  <rect class="box" x="40" y="190" width="112" height="42" />
  <text class="lab" x="96" y="210" text-anchor="middle">Claude Code</text>
  <text class="edge" x="96" y="225" text-anchor="middle">via adapter</text>
  <rect class="box" x="172" y="190" width="112" height="42" />
  <text class="lab" x="228" y="210" text-anchor="middle">Gemini CLI</text>
  <text class="edge" x="228" y="225" text-anchor="middle">native</text>
  <text class="tag" x="44" y="272">SOLVES</text>
  <text class="plab" x="44" y="294">One editor drives many agents.</text>
  <text class="plab" x="44" y="313">session/load replays history</text>
  <text class="plab" x="44" y="332">into the client for display.</text>
  <text class="tag" x="44" y="372">DOES NOT SOLVE</text>
  <text class="plab" x="44" y="394">A session id belongs to the</text>
  <text class="plab" x="44" y="413">agent that minted it. Two</text>
  <text class="plab" x="44" y="432">agents in one window are</text>
  <text class="plab" x="44" y="451">still two sessions.</text>

  <rect class="panel" x="312" y="30" width="276" height="446" />
  <text class="tag" x="332" y="58">TOPOLOGY 2</text>
  <text class="colh" x="332" y="82">A2A — agent to agent</text>
  <rect class="hero" x="352" y="104" width="196" height="42" />
  <text class="lab-inv" x="450" y="130" text-anchor="middle">Client agent</text>
  <path class="arrow" d="M 400 150 L 400 186" />
  <text class="edge" x="340" y="172">task + contextId</text>
  <rect class="box" x="352" y="190" width="196" height="42" />
  <text class="lab" x="450" y="216" text-anchor="middle">Remote agent</text>
  <path class="arrow" d="M 516 186 L 516 150" />
  <text class="edge" x="524" y="172">artifacts</text>
  <text class="tag" x="332" y="272">SOLVES</text>
  <text class="plab" x="332" y="294">Delegation across vendor and</text>
  <text class="plab" x="332" y="313">org boundaries. One contextId</text>
  <text class="plab" x="332" y="332">groups the related tasks.</text>
  <text class="tag" x="332" y="372">DOES NOT SOLVE</text>
  <text class="plab" x="332" y="394">It returns artifacts, not the</text>
  <text class="plab" x="332" y="413">peer's reasoning. The remote</text>
  <text class="plab" x="332" y="432">agent's history stays remote,</text>
  <text class="plab" x="332" y="451">and that is the design.</text>

  <rect class="panel" x="600" y="30" width="276" height="446" />
  <text class="tag" x="620" y="58">TOPOLOGY 3</text>
  <text class="colh" x="620" y="82">MCP — a shared store</text>
  <rect class="box" x="616" y="104" width="112" height="42" />
  <text class="lab" x="672" y="130" text-anchor="middle">Claude Code</text>
  <rect class="box" x="748" y="104" width="112" height="42" />
  <text class="lab" x="804" y="130" text-anchor="middle">Codex</text>
  <path class="arrow" d="M 672 150 L 706 186" />
  <path class="arrow" d="M 804 150 L 770 186" />
  <rect class="hero" x="628" y="190" width="220" height="42" />
  <text class="lab-inv" x="738" y="216" text-anchor="middle">Memory server</text>
  <text class="tag" x="620" y="272">SOLVES</text>
  <text class="plab" x="620" y="294">Durable facts both agents read</text>
  <text class="plab" x="620" y="313">and write, across machines and</text>
  <text class="plab" x="620" y="332">across sessions.</text>
  <text class="tag" x="620" y="372">DOES NOT SOLVE</text>
  <text class="plab" x="620" y="394">It holds what someone chose</text>
  <text class="plab" x="620" y="413">to save. That is a memory,</text>
  <text class="plab" x="620" y="432">not a transcript — and the</text>
  <text class="plab" x="620" y="451">choosing is the hard part.</text>
</svg>
