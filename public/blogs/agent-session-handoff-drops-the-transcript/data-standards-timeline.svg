<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Fifteen months of cross-agent standards</title>
  <desc id="d">Three parallel timelines from June 2025 to August 2026. AGENTS.md was released by OpenAI in August 2025, transferred to the Linux Foundation's Agentic AI Foundation in late 2025, and reached 60,000 or more repositories by May 2026. The Agent Client Protocol was created by Zed in August 2025 and gained a registry co-launched with JetBrains in January 2026, listing 40 or more agents by 2026. A2A went to the Linux Foundation in June 2025, passed 150 organisations at its one-year mark in April 2026, and reached version 1.0. A footnote records that Claude Code still reads CLAUDE.md as of August 2026.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .lane-name { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; }
    .lane-line { fill: none; stroke: currentColor; stroke-width: 1.25; opacity: .45; }
    .grid      { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 5; opacity: .22; }
    .dot       { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .ev        { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .axis      { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; text-anchor: middle; }
    .note      { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="chart-title" x="450" y="26">The plumbing standardised. The session did not.</text>

  <path class="grid" d="M 160 66 L 160 330" />
  <path class="grid" d="M 453 66 L 453 330" />
  <path class="grid" d="M 747 66 L 747 330" />

  <text class="lane-name" x="24" y="114">AGENTS.md</text>
  <path class="lane-line" d="M 160 110 L 850 110" />
  <text class="ev" x="240" y="98">Released by OpenAI</text>
  <circle class="dot" cx="244" cy="110" r="5" />
  <text class="ev" x="366" y="98">To the Linux Foundation</text>
  <circle class="dot" cx="370" cy="110" r="5" />
  <text class="ev" x="617" y="98">60k+ repos</text>
  <circle class="dot" cx="621" cy="110" r="5" />

  <text class="lane-name" x="24" y="204">ACP · client↔agent</text>
  <path class="lane-line" d="M 160 200 L 850 200" />
  <text class="ev" x="240" y="188">Created by Zed</text>
  <circle class="dot" cx="244" cy="200" r="5" />
  <text class="ev" x="449" y="188">Registry, with JetBrains</text>
  <circle class="dot" cx="453" cy="200" r="5" />
  <text class="ev" x="743" y="188">40+ agents listed</text>
  <circle class="dot" cx="747" cy="200" r="5" />

  <text class="lane-name" x="24" y="294">A2A · agent↔agent</text>
  <path class="lane-line" d="M 160 290 L 850 290" />
  <text class="ev" x="156" y="278">To the Linux Foundation</text>
  <circle class="dot" cx="160" cy="290" r="5" />
  <text class="ev" x="575" y="278">150+ orgs at one year</text>
  <circle class="dot" cx="579" cy="290" r="5" />
  <text class="ev" x="743" y="278">v1.0</text>
  <circle class="dot" cx="747" cy="290" r="5" />

  <text class="axis" x="160" y="348">JUN 2025</text>
  <text class="axis" x="453" y="348">JAN 2026</text>
  <text class="axis" x="747" y="348">AUG 2026</text>

  <text class="note" x="160" y="380">Claude Code still reads CLAUDE.md as of August 2026 — point one file at the other with an import.</text>
</svg>
