<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The transcript conversion pipeline and what it deliberately discards</title>
  <desc id="d">A left-to-right pipeline: the source agent's JSONL file on disk, a per-agent parser, a neutral session form holding ordered turns plus prose summaries of tool calls, a per-agent writer, and the target agent's resumable session. A dashed arrow drops from the parser into a band below labelled dropped on purpose, listing tool use blocks, tool result blocks, reasoning traces, absolute paths and credentials, the warm prompt cache, and the system prompt those turns answered.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .colh   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .colh-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .lab    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .lab-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .labs   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .8; }
    .labs-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .9; }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .85; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .tag-inv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--paper); opacity: .85; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .drop   { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); opacity: .7; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="box" x="24" y="90" width="160" height="150" />
  <text class="tag" x="40" y="116">SOURCE</text>
  <text class="colh" x="40" y="140">Claude Code</text>
  <text class="labs" x="40" y="166">append-only</text>
  <text class="labs" x="40" y="184">.jsonl on disk</text>

  <path class="arrow" d="M 188 165 L 210 165" />

  <rect class="box" x="214" y="90" width="140" height="150" />
  <text class="tag" x="230" y="116">PARSER</text>
  <text class="colh" x="230" y="140">per agent</text>
  <text class="labs" x="230" y="166">one module</text>
  <text class="labs" x="230" y="184">per CLI</text>

  <path class="arrow" d="M 358 165 L 380 165" />

  <rect class="hero" x="384" y="90" width="180" height="150" />
  <text class="tag-inv" x="400" y="116">NEUTRAL FORM</text>
  <text class="colh-inv" x="400" y="140">NeutralSession</text>
  <text class="labs-inv" x="400" y="166">ordered turns, plus</text>
  <text class="labs-inv" x="400" y="184">prose summaries of</text>
  <text class="labs-inv" x="400" y="202">the tool calls</text>

  <path class="arrow" d="M 568 165 L 590 165" />

  <rect class="box" x="594" y="90" width="140" height="150" />
  <text class="tag" x="610" y="116">WRITER</text>
  <text class="colh" x="610" y="140">per agent</text>
  <text class="labs" x="610" y="166">emits target</text>
  <text class="labs" x="610" y="184">format</text>

  <path class="arrow" d="M 738 165 L 760 165" />

  <rect class="box" x="764" y="90" width="112" height="150" />
  <text class="tag" x="780" y="116">TARGET</text>
  <text class="colh" x="780" y="140">Codex</text>
  <text class="labs" x="780" y="166">resumable</text>

  <path class="drop" d="M 284 244 L 284 296" />

  <rect class="adj" x="184" y="300" width="560" height="168" />
  <text class="tag" x="204" y="326">DROPPED ON PURPOSE</text>
  <text class="colh" x="204" y="350">The receiving model needs understanding, not replay.</text>
  <text class="lab" x="204" y="382">• tool_use blocks</text>
  <text class="lab" x="204" y="404">• tool_result blocks</text>
  <text class="lab" x="204" y="426">• reasoning traces</text>
  <text class="lab" x="480" y="382">• absolute paths, credentials</text>
  <text class="lab" x="480" y="404">• the warm prompt cache</text>
  <text class="lab" x="480" y="426">• the system prompt behind them</text>
  <text class="mono" x="204" y="454">"edited services/email/sender.py:82-94"  ← what survives instead</text>
</svg>
