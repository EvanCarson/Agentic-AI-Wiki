<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The four layers a coding-agent session can be handed over on</title>
  <desc id="d">Agent A on the left and Agent B on the right, connected by four horizontal lanes. Layer one is the instruction file, AGENTS.md or CLAUDE.md, which carries standing project rules and nothing about the session. Layer two is the handoff artifact, a written state file, which carries decisions and the next step but only what someone wrote down. Layer three is transcript conversion, a parser and writer pair over the on-disk JSONL, which carries turn order and prose but drops tool calls, identifiers and the cache. Layer four is a live protocol or shared store such as an ACP client or an MCP memory server, which carries continuous state but requires both ends to speak it.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .colh   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .colh-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .lab    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .lab-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .tag-inv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--paper); opacity: .85; }
    .axnote { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .55; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="axnote" x="24" y="46">MORE PORTABLE, LESS OF THIS SESSION</text>
  <text class="axnote" x="24" y="484">MORE OF THIS SESSION, LESS PORTABLE</text>

  <rect class="box" x="24" y="64" width="140" height="392" />
  <text class="tag" x="44" y="238">AGENT A</text>
  <text class="colh" x="44" y="262">Claude Code</text>
  <text class="lab" x="44" y="284">holds the session</text>

  <rect class="box" x="736" y="64" width="140" height="392" />
  <text class="tag" x="756" y="238">AGENT B</text>
  <text class="colh" x="756" y="262">Codex CLI</text>
  <text class="lab" x="756" y="284">needs to continue</text>

  <path class="arrow" d="M 168 106 L 182 106" />
  <path class="arrow" d="M 714 106 L 732 106" />
  <rect class="adj" x="186" y="72" width="524" height="84" />
  <text class="tag" x="206" y="96">LAYER 1 — INSTRUCTION FILE</text>
  <text class="colh" x="206" y="120">AGENTS.md / CLAUDE.md</text>
  <text class="lab" x="206" y="142">committed, re-read at startup</text>
  <text class="tag" x="486" y="96">WHAT CROSSES</text>
  <text class="lab" x="486" y="120">Standing project rules —</text>
  <text class="lab" x="486" y="142">nothing about this session</text>

  <path class="arrow" d="M 168 202 L 182 202" />
  <path class="arrow" d="M 714 202 L 732 202" />
  <rect class="hero" x="186" y="168" width="524" height="84" />
  <text class="tag-inv" x="206" y="192">LAYER 2 — HANDOFF ARTIFACT</text>
  <text class="colh-inv" x="206" y="216">A written state file</text>
  <text class="lab-inv" x="206" y="238">decisions, next step, gotchas</text>
  <text class="tag-inv" x="486" y="192">WHAT CROSSES</text>
  <text class="lab-inv" x="486" y="216">Claims the receiver can</text>
  <text class="lab-inv" x="486" y="238">re-verify against the repo</text>

  <path class="arrow" d="M 168 298 L 182 298" />
  <path class="arrow" d="M 714 298 L 732 298" />
  <rect class="box" x="186" y="264" width="524" height="84" />
  <text class="tag" x="206" y="288">LAYER 3 — TRANSCRIPT CONVERSION</text>
  <text class="colh" x="206" y="312">parser to writer, over JSONL</text>
  <text class="lab" x="206" y="334">every turn, in order</text>
  <text class="tag" x="486" y="288">WHAT CROSSES</text>
  <text class="lab" x="486" y="312">Prose only — tool calls, ids</text>
  <text class="lab" x="486" y="334">and the cache do not survive</text>

  <path class="arrow" d="M 168 394 L 182 394" />
  <path class="arrow" d="M 714 394 L 732 394" />
  <rect class="adj" x="186" y="360" width="524" height="84" />
  <text class="tag" x="206" y="384">LAYER 4 — LIVE PROTOCOL / STORE</text>
  <text class="colh" x="206" y="408">ACP client, MCP memory</text>
  <text class="lab" x="206" y="430">a shared substrate, not a file</text>
  <text class="tag" x="486" y="384">WHAT CROSSES</text>
  <text class="lab" x="486" y="408">Continuous state — if both</text>
  <text class="lab" x="486" y="430">ends already speak it</text>
</svg>
