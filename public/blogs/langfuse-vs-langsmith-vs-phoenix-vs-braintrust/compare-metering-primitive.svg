<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What each platform meters, and how that behaves at agent scale</title>
  <desc id="d">Four platforms compared on what their billing meter counts, what makes the bill grow, which engineering instinct the meter penalises, and what the escape hatch is. Langfuse meters observations with self-hosting as the escape hatch, LangSmith meters traces per seat, Phoenix meters nothing when self-hosted, and Braintrust meters scores and processed data volume.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-head { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cv     { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink); text-anchor: middle; }
    .cv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--paper); text-anchor: middle; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="chart-title" x="450" y="22">The meter, not the feature grid, is what you feel in month six</text>

  <text class="col-head" x="318" y="50">Langfuse</text>
  <text class="col-head" x="466" y="50">LangSmith</text>
  <text class="col-head" x="614" y="50">Phoenix</text>
  <text class="col-head" x="786" y="50">Braintrust</text>

  <text class="row-head" x="24" y="79">Billable unit</text>
  <rect class="mid" x="244" y="60" width="148" height="26" rx="5" /><text class="cv" x="318" y="79">Observations</text>
  <rect class="mid" x="396" y="60" width="140" height="26" rx="5" /><text class="cv" x="466" y="79">Traces + seats</text>
  <rect class="strong" x="540" y="60" width="148" height="26" rx="5" /><text class="cv-inv" x="614" y="79">None if self-hosted</text>
  <rect class="mid" x="692" y="60" width="188" height="26" rx="5" /><text class="cv" x="786" y="79">Scores + data volume</text>

  <text class="row-head" x="24" y="113">What inflates the bill</text>
  <rect class="weak" x="244" y="94" width="148" height="26" rx="5" /><text class="cv" x="318" y="113">More agent steps</text>
  <rect class="weak" x="396" y="94" width="140" height="26" rx="5" /><text class="cv" x="466" y="113">More runs, more staff</text>
  <rect class="mid" x="540" y="94" width="148" height="26" rx="5" /><text class="cv" x="614" y="113">Your own infra</text>
  <rect class="weak" x="692" y="94" width="188" height="26" rx="5" /><text class="cv" x="786" y="113">More scorers per run</text>

  <text class="row-head" x="24" y="147">What the meter discourages</text>
  <rect class="weak" x="244" y="128" width="148" height="26" rx="5" /><text class="cv" x="318" y="147">Fine-grained spans</text>
  <rect class="weak" x="396" y="128" width="140" height="26" rx="5" /><text class="cv" x="466" y="147">Wide team access</text>
  <rect class="mid" x="540" y="128" width="148" height="26" rx="5" /><text class="cv" x="614" y="147">Nothing — you operate it</text>
  <rect class="weak" x="692" y="128" width="188" height="26" rx="5" /><text class="cv" x="786" y="147">Scoring every run</text>

  <text class="row-head" x="24" y="181">Escape hatch</text>
  <rect class="strong" x="244" y="162" width="148" height="26" rx="5" /><text class="cv-inv" x="318" y="181">MIT self-host</text>
  <rect class="weak" x="396" y="162" width="140" height="26" rx="5" /><text class="cv" x="466" y="181">Enterprise contract</text>
  <rect class="strong" x="540" y="162" width="148" height="26" rx="5" /><text class="cv-inv" x="614" y="181">Already there</text>
  <rect class="weak" x="692" y="162" width="188" height="26" rx="5" /><text class="cv" x="786" y="181">Enterprise contract</text>

  <text class="note" x="24" y="222">Every meter penalises the behaviour that makes agent debugging work: recording each step, letting the whole team look,</text>
  <text class="note" x="24" y="240">and scoring runs continuously rather than in batches. Sampling to fit a plan is how a trace store stops being an evidence store.</text>
  <text class="note" x="24" y="272">Plan structures and unit names change often. Re-derive the shape from current pricing pages before committing — the pattern is durable, the numbers are not.</text>
</svg>
