<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">One agent run, four downstream consumers, and where the vendor boundary falls</title>
  <desc id="d">An agent run emits an OpenTelemetry span tree that flows into an observability platform. From there four consumers draw on the same data: live debugging, the evaluation golden set, the regression suite in continuous integration, and fine-tuning or few-shot example extraction. The upper path instruments directly against a vendor SDK, so the vendor boundary sits before the span tree and all four consumers depend on the vendor. The lower path instruments against OpenTelemetry and OpenInference, so the boundary sits after the span tree and the platform becomes a swappable backend.</desc>
  <style>
    .box     { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero    { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj     { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); text-anchor: middle; }
    .sub     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; text-anchor: middle; }
    .lane    { font-family: var(--font-display); font-size: 14px; font-weight: 600; fill: currentColor; }
    .arrow   { fill: none; stroke: currentColor; stroke-width: 1.4; marker-end: url(#arr); }
    .cut     { stroke: var(--accent, #d4421e); stroke-width: 2; stroke-dasharray: 6 5; }
    .cutlbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: var(--accent, #d4421e); }
    .prose   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .8; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="lane" x="24" y="28">Instrumented against a vendor SDK</text>

  <rect class="hero" x="24" y="46" width="150" height="58" />
  <text class="label-inv" x="99" y="70">Agent run</text>
  <text class="label-inv" x="99" y="88">steps, tools, spans</text>

  <rect class="box" x="236" y="46" width="164" height="58" />
  <text class="label" x="318" y="70">Vendor SDK</text>
  <text class="sub" x="318" y="88">proprietary span shape</text>

  <rect class="adj" x="462" y="46" width="164" height="58" />
  <text class="label" x="544" y="70">Platform</text>
  <text class="sub" x="544" y="88">storage · UI · evals</text>

  <rect class="box" x="688" y="34" width="188" height="34" />
  <text class="label" x="782" y="56">Debug · golden set</text>
  <rect class="box" x="688" y="80" width="188" height="34" />
  <text class="label" x="782" y="102">CI gate · fine-tune data</text>

  <path class="arrow" d="M 174 75 L 232 75" />
  <path class="arrow" d="M 400 75 L 458 75" />
  <path class="arrow" d="M 626 63 L 684 53" />
  <path class="arrow" d="M 626 87 L 684 97" />

  <line class="cut" x1="212" y1="26" x2="212" y2="126" />
  <text class="cutlbl" x="150" y="140">Boundary here</text>

  <text class="prose" x="24" y="168">Everything downstream is shaped by the vendor's span model. Switching platforms means re-instrumenting the application,</text>
  <text class="prose" x="24" y="186">and the historical traces — your golden set, your regression baseline — do not come with you.</text>

  <line x1="24" y1="214" x2="876" y2="214" stroke="currentColor" stroke-width="1" opacity=".25" />

  <text class="lane" x="24" y="250">Instrumented against OpenTelemetry</text>

  <rect class="hero" x="24" y="268" width="150" height="58" />
  <text class="label-inv" x="99" y="292">Agent run</text>
  <text class="label-inv" x="99" y="310">steps, tools, spans</text>

  <rect class="adj" x="236" y="268" width="164" height="58" />
  <text class="label" x="318" y="292">OTel + OpenInference</text>
  <text class="sub" x="318" y="310">standard semantics</text>

  <rect class="box" x="462" y="268" width="164" height="58" />
  <text class="label" x="544" y="292">Platform</text>
  <text class="sub" x="544" y="310">swappable backend</text>

  <rect class="box" x="688" y="256" width="188" height="34" />
  <text class="label" x="782" y="278">Debug · golden set</text>
  <rect class="box" x="688" y="302" width="188" height="34" />
  <text class="label" x="782" y="324">CI gate · fine-tune data</text>

  <path class="arrow" d="M 174 297 L 232 297" />
  <path class="arrow" d="M 400 297 L 458 297" />
  <path class="arrow" d="M 626 285 L 684 275" />
  <path class="arrow" d="M 626 309 L 684 319" />

  <line class="cut" x1="438" y1="248" x2="438" y2="348" />
  <text class="cutlbl" x="376" y="362">Boundary here</text>

  <text class="prose" x="24" y="392">The application emits standard spans and knows nothing about the vendor. A second exporter can write the same stream</text>
  <text class="prose" x="24" y="410">to a warehouse you own, which is what makes the golden set and the fine-tuning extract survive a platform change.</text>

  <rect class="box" x="24" y="436" width="852" height="50" />
  <text class="label" x="450" y="457">Your traces are the highest-value proprietary dataset the system produces</text>
  <text class="sub" x="450" y="476">The question is not which UI you prefer. It is whether the golden set you spend a year curating is portable.</text>
</svg>
