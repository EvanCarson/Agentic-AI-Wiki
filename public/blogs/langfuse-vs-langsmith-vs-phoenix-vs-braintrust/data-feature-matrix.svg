<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Langfuse, LangSmith, Phoenix and Braintrust across five axes</title>
  <desc id="d">A feature matrix comparing four LLM observability platforms on five axes: permissive open-source licence, unlimited self-hosting, OpenTelemetry-native ingestion, evaluation gating in continuous integration, and prompt and dataset management. Langfuse is strong on licence and self-hosting, Phoenix is strong on self-hosting and OpenTelemetry but ships under a source-available licence, Braintrust is strongest on evaluation in CI, and LangSmith is closed source with self-hosting reserved for enterprise plans.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; }
    .col-head { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-head { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cv     { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink); text-anchor: middle; }
    .cv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--paper); text-anchor: middle; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .legend { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
  </style>

  <text class="chart-title" x="24" y="26">Where each one is actually strong</text>

  <text class="col-head" x="330" y="58">Langfuse</text>
  <text class="col-head" x="478" y="58">LangSmith</text>
  <text class="col-head" x="626" y="58">Phoenix</text>
  <text class="col-head" x="790" y="58">Braintrust</text>

  <text class="row-head" x="24" y="88">Permissive OSS licence</text>
  <rect class="strong" x="256" y="69" width="148" height="26" rx="5" /><text class="cv-inv" x="330" y="88">MIT</text>
  <rect class="weak" x="408" y="69" width="140" height="26" rx="5" /><text class="cv" x="478" y="88">Closed</text>
  <rect class="mid" x="552" y="69" width="148" height="26" rx="5" /><text class="cv" x="626" y="88">Elastic v2</text>
  <rect class="weak" x="704" y="69" width="172" height="26" rx="5" /><text class="cv" x="790" y="88">Closed</text>

  <text class="row-head" x="24" y="126">Unlimited self-hosting</text>
  <rect class="strong" x="256" y="107" width="148" height="26" rx="5" /><text class="cv-inv" x="330" y="126">Yes, no gates</text>
  <rect class="weak" x="408" y="107" width="140" height="26" rx="5" /><text class="cv" x="478" y="126">Enterprise only</text>
  <rect class="strong" x="552" y="107" width="148" height="26" rx="5" /><text class="cv-inv" x="626" y="126">Yes, no gates</text>
  <rect class="weak" x="704" y="107" width="172" height="26" rx="5" /><text class="cv" x="790" y="126">Enterprise only</text>

  <text class="row-head" x="24" y="164">OpenTelemetry-native ingest</text>
  <rect class="strong" x="256" y="145" width="148" height="26" rx="5" /><text class="cv-inv" x="330" y="164">Any OTel SDK</text>
  <rect class="mid" x="408" y="145" width="140" height="26" rx="5" /><text class="cv" x="478" y="164">Supported</text>
  <rect class="strong" x="552" y="145" width="148" height="26" rx="5" /><text class="cv-inv" x="626" y="164">Built on it</text>
  <rect class="mid" x="704" y="145" width="172" height="26" rx="5" /><text class="cv" x="790" y="164">Supported</text>

  <text class="row-head" x="24" y="202">Eval gating in CI</text>
  <rect class="mid" x="256" y="183" width="148" height="26" rx="5" /><text class="cv" x="330" y="202">Present</text>
  <rect class="mid" x="408" y="183" width="140" height="26" rx="5" /><text class="cv" x="478" y="202">Present</text>
  <rect class="mid" x="552" y="183" width="148" height="26" rx="5" /><text class="cv" x="626" y="202">Present</text>
  <rect class="strong" x="704" y="183" width="172" height="26" rx="5" /><text class="cv-inv" x="790" y="202">The product</text>

  <text class="row-head" x="24" y="240">Prompt &amp; dataset management</text>
  <rect class="strong" x="256" y="221" width="148" height="26" rx="5" /><text class="cv-inv" x="330" y="240">Full</text>
  <rect class="strong" x="408" y="221" width="140" height="26" rx="5" /><text class="cv-inv" x="478" y="240">Full</text>
  <rect class="mid" x="552" y="221" width="148" height="26" rx="5" /><text class="cv" x="626" y="240">Full</text>
  <rect class="strong" x="704" y="221" width="172" height="26" rx="5" /><text class="cv-inv" x="790" y="240">Full</text>

  <rect class="strong" x="24" y="282" width="16" height="14" rx="3" /><text class="legend" x="48" y="294">Strong</text>
  <rect class="mid" x="128" y="282" width="16" height="14" rx="3" /><text class="legend" x="152" y="294">Medium</text>
  <rect class="weak" x="238" y="282" width="16" height="14" rx="3" /><text class="legend" x="262" y="294">Weak or restricted</text>

  <text class="note" x="24" y="336">The bottom two rows have converged — every platform now has evals, datasets and prompt versioning. The top three are where the</text>
  <text class="note" x="24" y="354">decision lives, and none of them is a feature: they are licence, deployment and whether your instrumentation is portable.</text>
  <text class="note" x="24" y="384">Elastic Licence 2.0 is source-available rather than OSI open source — you can self-host it, you cannot offer it as a managed service.</text>
</svg>
