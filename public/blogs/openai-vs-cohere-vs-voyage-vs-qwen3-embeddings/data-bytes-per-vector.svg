<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Bytes stored per vector at each model's default output</title>
  <desc id="d">Horizontal bars comparing storage per vector: Qwen3-Embedding-8B at 4096 float32 dimensions needs 16,384 bytes, OpenAI text-embedding-3-large at 3072 float32 needs 12,288 bytes, Cohere Embed v4 at 1536 float32 needs 6,144 bytes, and voyage-3.5 requested as int8 at 2048 dimensions needs 2,048 bytes — an eight-fold spread before any quality argument is made.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: currentColor; text-anchor: end; }
    .row-sub     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .6; text-anchor: end; }
    .val         { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: start; }
    .axis        { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: currentColor; opacity: .55; text-anchor: middle; }
    .grid        { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .bar-lead    { fill: var(--accent, #d4421e); }
    .bar-mid     { fill: var(--accent-soft, #f5c5b8); }
    .bar-rest    { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="30">Bytes per vector, at each model's default output</text>

  <line class="grid" x1="290" y1="58" x2="290" y2="318" />
  <line class="grid" x1="435" y1="58" x2="435" y2="318" />
  <line class="grid" x1="580" y1="58" x2="580" y2="318" />
  <line class="grid" x1="725" y1="58" x2="725" y2="318" />
  <line class="grid" x1="870" y1="58" x2="870" y2="318" />
  <text class="axis" x="290" y="336">4 KiB</text>
  <text class="axis" x="435" y="336">8 KiB</text>
  <text class="axis" x="580" y="336">12 KiB</text>
  <text class="axis" x="725" y="336">16 KiB</text>

  <text class="row-label" x="230" y="84">Qwen3-Embedding-8B</text>
  <text class="row-sub"   x="230" y="99">4096 dims, float32</text>
  <rect class="bar-rest" x="240" y="70" width="580" height="34" rx="4" />
  <text class="val" x="832" y="92">16,384 B</text>

  <text class="row-label" x="230" y="150">OpenAI text-embedding-3-large</text>
  <text class="row-sub"   x="230" y="165">3072 dims, float32</text>
  <rect class="bar-rest" x="240" y="136" width="435" height="34" rx="4" />
  <text class="val" x="687" y="158">12,288 B</text>

  <text class="row-label" x="230" y="216">Cohere Embed v4</text>
  <text class="row-sub"   x="230" y="231">1536 dims, float32</text>
  <rect class="bar-mid" x="240" y="202" width="218" height="34" rx="4" />
  <text class="val" x="470" y="224">6,144 B</text>

  <text class="row-label" x="230" y="282">voyage-3.5</text>
  <text class="row-sub"   x="230" y="297">2048 dims, int8</text>
  <rect class="bar-lead" x="240" y="268" width="73" height="34" rx="4" />
  <text class="val" x="325" y="290">2,048 B</text>

  <text class="axis" x="450" y="368" style="opacity:.75">Same corpus, same index, same query path — eight times the storage from top row to bottom</text>
</svg>
