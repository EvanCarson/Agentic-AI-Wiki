<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">What changing an embedding model actually touches</title>
  <desc id="d">The source corpus feeds two parallel embedding passes. The old model's index keeps serving live query traffic while the new model's index is built and shadowed, so both indexes are resident at once. Downstream, chunk size, top-k, reranker thresholds and every retrieval eval baseline have to be re-established against the new vector space before traffic can cut over.</desc>
  <style>
    .box     { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero    { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj     { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper, #fff); text-anchor: middle; }
    .sub     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .65; text-anchor: middle; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .85; text-anchor: middle; }
    .arrow   { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .arrow-dash { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
    .rule    { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 4 5; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="box" x="32" y="196" width="164" height="86" rx="8" />
  <text class="label" x="114" y="230">Source corpus</text>
  <text class="sub"   x="114" y="250">every chunk,</text>
  <text class="sub"   x="114" y="266">read again</text>

  <path class="arrow" d="M 200 220 C 240 220 240 148 282 148" />
  <path class="arrow" d="M 200 258 C 240 258 240 344 282 344" />

  <rect class="adj" x="286" y="116" width="168" height="64" rx="8" />
  <text class="label" x="370" y="143">Embed pass</text>
  <text class="sub"   x="370" y="162">model A, already paid</text>

  <rect class="hero" x="510" y="116" width="168" height="64" rx="8" />
  <text class="label-inv" x="594" y="143">Index A</text>
  <text class="sub-inv"   x="594" y="162">serving every query</text>

  <rect class="adj" x="286" y="312" width="168" height="64" rx="8" />
  <text class="label" x="370" y="339">Embed pass</text>
  <text class="sub"   x="370" y="358">model B, full corpus</text>

  <rect class="box" x="510" y="312" width="168" height="64" rx="8" />
  <text class="label" x="594" y="339">Index B</text>
  <text class="sub"   x="594" y="358">shadow, unproven</text>

  <path class="arrow" d="M 458 148 L 506 148" />
  <path class="arrow" d="M 458 344 L 506 344" />

  <rect class="box" x="722" y="212" width="146" height="70" rx="8" />
  <text class="label" x="795" y="242">Query traffic</text>
  <text class="sub"   x="795" y="262">unaware, unpaused</text>

  <path class="arrow" d="M 682 156 C 712 168 700 200 718 224" />
  <path class="arrow-dash" d="M 682 336 C 712 324 700 292 718 270" />

  <line class="rule" x1="32" y1="416" x2="868" y2="416" />
  <text class="sub" x="450" y="444" style="opacity:.8">Re-established against the new vector space before cutover, none of it transferable:</text>
  <text class="sub" x="450" y="464" style="opacity:.8">chunk size · top-k · reranker threshold · hybrid weights · every retrieval eval baseline</text>
</svg>
