<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Where each embedding model leans hardest</title>
  <desc id="d">A four-by-five grid comparing maximum input length, output dimensions, sub-float output types, non-text input and lifecycle control across OpenAI text-embedding-3-large, Cohere Embed v4, voyage-3.5 and Qwen3-Embedding-8B. Cohere leads on input length and images, voyage on compressed output, Qwen3 on lifecycle control, and OpenAI leads on nothing except ubiquity.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: start; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">Five axes, four models</text>

  <text class="body-text" x="238" y="58" style="font-weight:600">Max input</text>
  <text class="body-text" x="238" y="72" style="font-weight:600">per request</text>
  <text class="body-text" x="378" y="58" style="font-weight:600">Output</text>
  <text class="body-text" x="378" y="72" style="font-weight:600">dimensions</text>
  <text class="body-text" x="518" y="58" style="font-weight:600">Sub-float</text>
  <text class="body-text" x="518" y="72" style="font-weight:600">output</text>
  <text class="body-text" x="658" y="58" style="font-weight:600">Non-text</text>
  <text class="body-text" x="658" y="72" style="font-weight:600">input</text>
  <text class="body-text" x="798" y="58" style="font-weight:600">Lifecycle</text>
  <text class="body-text" x="798" y="72" style="font-weight:600">control</text>

  <!-- Row 1: OpenAI -->
  <text class="row-head" x="154" y="112">OpenAI</text>
  <text class="row-head" x="154" y="126" style="font-weight:400;opacity:.65">text-embedding-3-large</text>
  <rect class="card-neutral" x="171" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="238" y="118">~8k tokens</text>
  <rect class="card-soft" x="311" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="378" y="113">3072 default,</text>
  <text class="body-text" x="378" y="127">shortenable</text>
  <rect class="card-neutral" x="451" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="518" y="118">float only</text>
  <rect class="card-neutral" x="591" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="658" y="118">Text only</text>
  <rect class="card-neutral" x="731" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="798" y="118">Vendor's clock</text>

  <!-- Row 2: Cohere -->
  <text class="row-head" x="154" y="172">Cohere</text>
  <text class="row-head" x="154" y="186" style="font-weight:400;opacity:.65">Embed v4</text>
  <rect class="card-accent" x="171" y="148" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="238" y="178">128k tokens</text>
  <rect class="card-soft" x="311" y="148" width="134" height="52" rx="6" />
  <text class="body-text" x="378" y="178">256 to 1536</text>
  <rect class="card-accent" x="451" y="148" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="518" y="173">int8, uint8,</text>
  <text class="body-text-inv" x="518" y="187">binary</text>
  <rect class="card-accent" x="591" y="148" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="658" y="173">Images, inline</text>
  <text class="body-text-inv" x="658" y="187">with text</text>
  <rect class="card-neutral" x="731" y="148" width="134" height="52" rx="6" />
  <text class="body-text" x="798" y="178">Vendor's clock</text>

  <!-- Row 3: voyage -->
  <text class="row-head" x="154" y="232">Voyage AI</text>
  <text class="row-head" x="154" y="246" style="font-weight:400;opacity:.65">voyage-3.5</text>
  <rect class="card-soft" x="171" y="208" width="134" height="52" rx="6" />
  <text class="body-text" x="238" y="238">32k tokens</text>
  <rect class="card-soft" x="311" y="208" width="134" height="52" rx="6" />
  <text class="body-text" x="378" y="233">256 to 2048,</text>
  <text class="body-text" x="378" y="247">Matryoshka</text>
  <rect class="card-accent" x="451" y="208" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="518" y="233">int8, uint8,</text>
  <text class="body-text-inv" x="518" y="247">binary</text>
  <rect class="card-neutral" x="591" y="208" width="134" height="52" rx="6" />
  <text class="body-text" x="658" y="238">Text only</text>
  <rect class="card-neutral" x="731" y="208" width="134" height="52" rx="6" />
  <text class="body-text" x="798" y="238">Vendor's clock</text>

  <!-- Row 4: Qwen3 -->
  <text class="row-head" x="154" y="292">Qwen</text>
  <text class="row-head" x="154" y="306" style="font-weight:400;opacity:.65">Qwen3-Embedding-8B</text>
  <rect class="card-soft" x="171" y="268" width="134" height="52" rx="6" />
  <text class="body-text" x="238" y="298">32k tokens</text>
  <rect class="card-soft" x="311" y="268" width="134" height="52" rx="6" />
  <text class="body-text" x="378" y="298">up to 4096</text>
  <rect class="card-soft" x="451" y="268" width="134" height="52" rx="6" />
  <text class="body-text" x="518" y="293">Whatever you</text>
  <text class="body-text" x="518" y="307">write yourself</text>
  <rect class="card-neutral" x="591" y="268" width="134" height="52" rx="6" />
  <text class="body-text" x="658" y="298">Text only</text>
  <rect class="card-accent" x="731" y="268" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="798" y="293">Apache-2.0,</text>
  <text class="body-text-inv" x="798" y="307">frozen on disk</text>

  <rect class="card-accent" x="171" y="340" width="18" height="18" rx="4" />
  <text class="legend-text" x="197" y="354">Clear advantage on this axis</text>
  <rect class="card-soft" x="451" y="340" width="18" height="18" rx="4" />
  <text class="legend-text" x="477" y="354">Adequate</text>
  <rect class="card-neutral" x="631" y="340" width="18" height="18" rx="4" />
  <text class="legend-text" x="657" y="354">Constraint you will feel</text>
</svg>
