<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="pkt pkd">
  <title id="pkt">How a prompt becomes somebody else's credential</title>
  <desc id="pkd">Three lanes. The first lane shows an ordinary request carrying a secret passing through an inference router to a hosting provider, which keeps a copy. The second lane shows a coding agent committing a credential to a public repository, that credential opening the private sample store, and an outsider downloading months of prompts. The third lane shows the samples being searched for secrets, the secrets being tried against live services, and a planted canary firing. Nothing in the first lane is a breach; the breach is what the first lane leaves available to the second.</desc>
  <style>
    .pk-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .pk-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .pk-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .pk-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .pk-lane { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .pk-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .pk-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .pk-lbli { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .pk-subi { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .pk-flow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#pkarr); }
    .pk-drop { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 4 3; marker-end: url(#pkarr); }
  </style>
  <defs>
    <marker id="pkarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="pk-ttl" x="20" y="30">One request, three systems, and only one of them is yours</text>

  <text class="pk-lane" x="20" y="58">1 — WHAT YOU DID</text>
  <rect class="pk-box" x="20"  y="70" width="230" height="70" rx="8" ry="8" />
  <text class="pk-lbl" x="135" y="100" text-anchor="middle">Your request</text>
  <text class="pk-sub" x="135" y="120" text-anchor="middle">a secret sits in the prompt</text>
  <rect class="pk-adj" x="325" y="70" width="230" height="70" rx="8" ry="8" />
  <text class="pk-lbl" x="440" y="100" text-anchor="middle">Inference router</text>
  <text class="pk-sub" x="440" y="120" text-anchor="middle">picks one of many endpoints</text>
  <rect class="pk-hero" x="630" y="70" width="230" height="70" rx="8" ry="8" />
  <text class="pk-lbli" x="745" y="100" text-anchor="middle">Hosting provider</text>
  <text class="pk-subi" x="745" y="120" text-anchor="middle">serves it, and keeps a copy</text>
  <path class="pk-flow" d="M 256 105 L 319 105" />
  <path class="pk-flow" d="M 561 105 L 624 105" />

  <path class="pk-drop" d="M 650 142 L 150 208" />

  <text class="pk-lane" x="20" y="200">2 — WHAT HAPPENED TO THE COPY</text>
  <rect class="pk-box" x="20"  y="212" width="230" height="70" rx="8" ry="8" />
  <text class="pk-lbl" x="135" y="242" text-anchor="middle">An agent commits a key</text>
  <text class="pk-sub" x="135" y="262" text-anchor="middle">public repo, reverted too late</text>
  <rect class="pk-adj" x="325" y="212" width="230" height="70" rx="8" ry="8" />
  <text class="pk-lbl" x="440" y="242" text-anchor="middle">The key opens the store</text>
  <text class="pk-sub" x="440" y="262" text-anchor="middle">private repo of test samples</text>
  <rect class="pk-hero" x="630" y="212" width="230" height="70" rx="8" ry="8" />
  <text class="pk-lbli" x="745" y="242" text-anchor="middle">Months of prompts taken</text>
  <text class="pk-subi" x="745" y="262" text-anchor="middle">other companies' requests</text>
  <path class="pk-flow" d="M 256 247 L 319 247" />
  <path class="pk-flow" d="M 561 247 L 624 247" />

  <path class="pk-drop" d="M 650 284 L 150 350" />

  <text class="pk-lane" x="20" y="342">3 — WHAT THE COPY WAS WORTH</text>
  <rect class="pk-box" x="20"  y="354" width="230" height="70" rx="8" ry="8" />
  <text class="pk-lbl" x="135" y="384" text-anchor="middle">Samples searched</text>
  <text class="pk-sub" x="135" y="404" text-anchor="middle">grep for keys and hostnames</text>
  <rect class="pk-adj" x="325" y="354" width="230" height="70" rx="8" ry="8" />
  <text class="pk-lbl" x="440" y="384" text-anchor="middle">Credentials tried</text>
  <text class="pk-sub" x="440" y="404" text-anchor="middle">against the real services</text>
  <rect class="pk-hero" x="630" y="354" width="230" height="70" rx="8" ry="8" />
  <text class="pk-lbli" x="745" y="384" text-anchor="middle">A canary fires</text>
  <text class="pk-subi" x="745" y="404" text-anchor="middle">the only evidence in the chain</text>
  <path class="pk-flow" d="M 256 389 L 319 389" />
  <path class="pk-flow" d="M 561 389 L 624 389" />

  <text class="pk-sub" x="20" y="460">Every hop in lane 1 is contractual. Every hop in lanes 2 and 3 is observable only if you planted something.</text>
</svg>
