<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="cpt cpd">
  <title id="cpt">What a contract can establish versus what a canary can</title>
  <desc id="cpd">Four claims about a provider scored on whether a contract or audit can establish them and whether a planted canary can. That the provider does not retain your prompt, that the retention flag is honoured, and that no third party reads the store are all merely asserted by contract but directly testable with a canary. That a prompt you already sent is safe is establishable by neither, which is the claim everyone actually wants answered.</desc>
  <style>
    .cp-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .cp-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .cp-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cp-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .cp-col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .cp-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cp-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cp-cellin { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .cp-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="cp-ttl" x="20" y="30">Four claims, two ways of trying to establish them</text>

  <text class="cp-col" x="520" y="66" text-anchor="middle">CONTRACT OR AUDIT</text>
  <text class="cp-col" x="760" y="66" text-anchor="middle">PLANTED CANARY</text>

  <text class="cp-row" x="20" y="105">The provider does not retain the prompt</text>
  <rect class="cp-weak" x="420" y="84" width="200" height="34" />
  <text class="cp-cell" x="520" y="105" text-anchor="middle">Asserted only</text>
  <rect class="cp-strong" x="660" y="84" width="200" height="34" />
  <text class="cp-cellin" x="760" y="105" text-anchor="middle">Testable, with a time</text>

  <text class="cp-row" x="20" y="165">The retention flag is actually honoured</text>
  <rect class="cp-weak" x="420" y="144" width="200" height="34" />
  <text class="cp-cell" x="520" y="165" text-anchor="middle">Asserted only</text>
  <rect class="cp-strong" x="660" y="144" width="200" height="34" />
  <text class="cp-cellin" x="760" y="165" text-anchor="middle">Testable per endpoint</text>

  <text class="cp-row" x="20" y="225">No third party is reading the store</text>
  <rect class="cp-weak" x="420" y="204" width="200" height="34" />
  <text class="cp-cell" x="520" y="225" text-anchor="middle">Out of scope</text>
  <rect class="cp-med" x="660" y="204" width="200" height="34" />
  <text class="cp-cell" x="760" y="225" text-anchor="middle">Detectable, not provable</text>

  <text class="cp-row" x="20" y="285">The prompt you sent in July is safe</text>
  <rect class="cp-weak" x="420" y="264" width="200" height="34" />
  <text class="cp-cell" x="520" y="285" text-anchor="middle">No</text>
  <rect class="cp-weak" x="660" y="264" width="200" height="34" />
  <text class="cp-cell" x="760" y="285" text-anchor="middle">No</text>

  <text class="cp-leg" x="20" y="330">A canary turns three unfalsifiable claims into events with timestamps. It cannot reach back to a request already made.</text>

  <rect class="cp-weak" x="20" y="361" width="16" height="13" />
  <text class="cp-leg" x="46" y="372">cannot establish it</text>
  <rect class="cp-med" x="230" y="361" width="16" height="13" />
  <text class="cp-leg" x="256" y="372">partial evidence</text>
  <rect class="cp-strong" x="430" y="361" width="16" height="13" />
  <text class="cp-leg" x="456" y="372">positive evidence</text>
</svg>
