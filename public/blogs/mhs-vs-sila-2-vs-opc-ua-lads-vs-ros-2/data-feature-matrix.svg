<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmT fmD">
  <title id="fmT">Four device standards against four axes</title>
  <desc id="fmD">A matrix of four standards against four axes. SiLA 2 is strong on machine-to-machine control, weak on describing itself for a model, weak on limits enforced in the driver, and weak on installed base. OPC UA LADS is strong on machine-to-machine control, weak on self-description for a model, medium on driver-enforced limits, and medium on installed base. ROS 2 is strong on machine-to-machine control, weak on self-description for a model, medium on driver-enforced limits, and strong on installed base within robotics. MHS is medium on machine-to-machine control, strong on self-description for a model, strong on driver-enforced limits, and weak on installed base because it is a research preview.</desc>
  <style>
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .strong { fill: var(--accent, #d4421e); stroke: none; rx: 6; ry: 6; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .lg     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="0" y="18">Where each standard is actually strong</text>

  <text class="col" x="284" y="48" text-anchor="middle">Machine-to-machine</text>
  <text class="col" x="284" y="63" text-anchor="middle">control</text>
  <text class="col" x="457" y="48" text-anchor="middle">Self-describes for</text>
  <text class="col" x="457" y="63" text-anchor="middle">a model to read</text>
  <text class="col" x="630" y="48" text-anchor="middle">Limits enforced</text>
  <text class="col" x="630" y="63" text-anchor="middle">in the driver</text>
  <text class="col" x="803" y="48" text-anchor="middle">Installed base</text>
  <text class="col" x="803" y="63" text-anchor="middle">today</text>

  <text class="row" x="0" y="105">SiLA 2</text>
  <rect class="strong" x="200" y="78" width="168" height="44" />
  <text class="cell-inv" x="284" y="105" text-anchor="middle">Strong</text>
  <rect class="weak" x="373" y="78" width="168" height="44" />
  <text class="cell" x="457" y="105" text-anchor="middle">Weak</text>
  <rect class="weak" x="546" y="78" width="168" height="44" />
  <text class="cell" x="630" y="105" text-anchor="middle">Weak</text>
  <rect class="weak" x="719" y="78" width="168" height="44" />
  <text class="cell" x="803" y="105" text-anchor="middle">Weak</text>

  <text class="row" x="0" y="183">OPC UA LADS</text>
  <rect class="strong" x="200" y="156" width="168" height="44" />
  <text class="cell-inv" x="284" y="183" text-anchor="middle">Strong</text>
  <rect class="weak" x="373" y="156" width="168" height="44" />
  <text class="cell" x="457" y="183" text-anchor="middle">Weak</text>
  <rect class="mid" x="546" y="156" width="168" height="44" />
  <text class="cell" x="630" y="183" text-anchor="middle">Medium</text>
  <rect class="mid" x="719" y="156" width="168" height="44" />
  <text class="cell" x="803" y="183" text-anchor="middle">Medium</text>

  <text class="row" x="0" y="261">ROS 2</text>
  <rect class="strong" x="200" y="234" width="168" height="44" />
  <text class="cell-inv" x="284" y="261" text-anchor="middle">Strong</text>
  <rect class="weak" x="373" y="234" width="168" height="44" />
  <text class="cell" x="457" y="261" text-anchor="middle">Weak</text>
  <rect class="mid" x="546" y="234" width="168" height="44" />
  <text class="cell" x="630" y="261" text-anchor="middle">Medium</text>
  <rect class="strong" x="719" y="234" width="168" height="44" />
  <text class="cell-inv" x="803" y="261" text-anchor="middle">Strong (robotics)</text>

  <text class="row" x="0" y="339">MHS</text>
  <rect class="mid" x="200" y="312" width="168" height="44" />
  <text class="cell" x="284" y="339" text-anchor="middle">Medium</text>
  <rect class="strong" x="373" y="312" width="168" height="44" />
  <text class="cell-inv" x="457" y="339" text-anchor="middle">Strong</text>
  <rect class="strong" x="546" y="312" width="168" height="44" />
  <text class="cell-inv" x="630" y="339" text-anchor="middle">Strong</text>
  <rect class="weak" x="719" y="312" width="168" height="44" />
  <text class="cell" x="803" y="339" text-anchor="middle">Weak (preview)</text>

  <rect class="weak" x="200" y="376" width="16" height="16" />
  <text class="lg" x="224" y="389">Weak</text>
  <rect class="mid" x="290" y="376" width="16" height="16" />
  <text class="lg" x="314" y="389">Medium</text>
  <rect class="strong" x="396" y="376" width="16" height="16" />
  <text class="lg" x="420" y="389">Strong</text>
</svg>
