<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="clT clD">
  <title id="clT">Where each standard keeps the knowledge of what the machine must not do</title>
  <desc id="clD">Four columns. Under SiLA 2 the physical envelope lives in vendor firmware and in the operator's head; the feature definitions declare commands and types but not what must not be attempted. Under OPC UA LADS it lives in the information model where the vendor chose to populate it, addressed to another machine rather than to a reader. Under ROS 2 it lives in the robot description and is enforced by the controller stack, expressed as numbers rather than as prose. Under MHS it lives in the driver, written in language a caller can read, and enforced by the driver regardless of which model is issuing commands. A footnote notes that none of the four is a rated protective function.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Where "what this machine must not do" is written down</text>

  <rect class="box" x="10" y="44" width="200" height="196" />
  <text class="hd" x="110" y="74" text-anchor="middle">SiLA 2</text>
  <text class="cell" x="110" y="106" text-anchor="middle">Vendor firmware, plus</text>
  <text class="cell" x="110" y="124" text-anchor="middle">the operator's head.</text>
  <text class="cell" x="110" y="156" text-anchor="middle">Features declare</text>
  <text class="cell" x="110" y="174" text-anchor="middle">commands and types,</text>
  <text class="cell" x="110" y="192" text-anchor="middle">not the envelope.</text>
  <text class="sub" x="110" y="222" text-anchor="middle">Caller assumed competent.</text>

  <rect class="box" x="232" y="44" width="200" height="196" />
  <text class="hd" x="332" y="74" text-anchor="middle">OPC UA LADS</text>
  <text class="cell" x="332" y="106" text-anchor="middle">The information model,</text>
  <text class="cell" x="332" y="124" text-anchor="middle">where the vendor filled</text>
  <text class="cell" x="332" y="142" text-anchor="middle">it in.</text>
  <text class="cell" x="332" y="174" text-anchor="middle">Addressed to another</text>
  <text class="cell" x="332" y="192" text-anchor="middle">machine, not a reader.</text>
  <text class="sub" x="332" y="222" text-anchor="middle">Rich, and rarely complete.</text>

  <rect class="adj" x="454" y="44" width="200" height="196" />
  <text class="hd" x="554" y="74" text-anchor="middle">ROS 2</text>
  <text class="cell" x="554" y="106" text-anchor="middle">The robot description;</text>
  <text class="cell" x="554" y="124" text-anchor="middle">enforced by the</text>
  <text class="cell" x="554" y="142" text-anchor="middle">controller stack.</text>
  <text class="cell" x="554" y="174" text-anchor="middle">Numbers for a solver,</text>
  <text class="cell" x="554" y="192" text-anchor="middle">not prose for a caller.</text>
  <text class="sub" x="554" y="222" text-anchor="middle">Strong within one cell.</text>

  <rect class="hero" x="676" y="44" width="200" height="196" />
  <text class="hd-inv" x="776" y="74" text-anchor="middle">MHS</text>
  <text class="cell-inv" x="776" y="106" text-anchor="middle">The driver, in language</text>
  <text class="cell-inv" x="776" y="124" text-anchor="middle">the caller can read.</text>
  <text class="cell-inv" x="776" y="156" text-anchor="middle">Enforced whichever</text>
  <text class="cell-inv" x="776" y="174" text-anchor="middle">model is driving, or</text>
  <text class="cell-inv" x="776" y="192" text-anchor="middle">none at all.</text>
  <text class="cell-inv" x="776" y="222" text-anchor="middle">Unproven at scale.</text>

  <text class="sub" x="450" y="270" text-anchor="middle">None of the four is a rated protective function. Interlocks, light curtains and the emergency-stop circuit</text>
  <text class="sub" x="450" y="288" text-anchor="middle">sit below all of them and are assessed against functional-safety requirements, not against a schema.</text>
</svg>
