<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where a sandbox's wall-clock goes during one agent turn</title>
  <desc id="d">A timeline of one agent turn inside a sandbox, divided into four bands. A short create band at the start, then a wide band where the sandbox is alive but idle while the model reads the previous tool result and generates the next call, then a narrow band where a command actually executes, then a short teardown band. The idle band is by far the widest and is marked as the segment that E2B, Daytona and Northflank bill in full while Modal's compute charges drop to zero. Below the timeline, two counters contrast alive-seconds against executing-seconds, and a note says the ratio between them decides which billing shape is cheaper.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .tag-inv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--paper); opacity: .85; }
    .axis   { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="24" y="34">One agent turn, measured on the sandbox</text>

  <rect class="adj" x="24" y="62" width="96" height="86" />
  <text class="label" x="38" y="98">create</text>
  <text class="sub" x="38" y="120">cold start</text>
  <text class="tag" x="38" y="140">BURST p99</text>

  <rect class="hero" x="128" y="62" width="530" height="86" />
  <text class="label-inv" x="148" y="98">alive, executing nothing — the model is generating the next tool call</text>
  <text class="sub-inv" x="148" y="120">reasoning tokens, retries, rate-limit backoff, the queue in front of the provider</text>
  <text class="tag-inv" x="148" y="140">BILLED IN FULL BY E2B / DAYTONA / NORTHFLANK — ZERO ON MODAL</text>

  <rect class="box" x="666" y="62" width="120" height="86" />
  <text class="label" x="682" y="98">execute</text>
  <text class="sub" x="682" y="120">the command</text>
  <text class="tag" x="682" y="140">SUB-SECOND</text>

  <rect class="box" x="794" y="62" width="82" height="86" />
  <text class="label" x="810" y="98">destroy</text>
  <text class="sub" x="810" y="120">teardown</text>

  <path class="axis" d="M 24 176 L 876 176" />
  <text class="tag" x="24" y="198">WALL CLOCK</text>

  <rect class="box" x="24" y="236" width="410" height="150" />
  <text class="head" x="48" y="272">alive-seconds</text>
  <text class="sub" x="48" y="302">create → destroy, regardless of what ran</text>
  <text class="sub" x="48" y="326">the number three of these four platforms bill</text>
  <line x1="48" y1="346" x2="410" y2="346" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="label" x="48" y="370">easy to get: you already log it</text>

  <rect class="adj" x="466" y="236" width="410" height="150" />
  <text class="head" x="490" y="272">executing-seconds</text>
  <text class="sub" x="490" y="302">the sum of command start-to-exit intervals</text>
  <text class="sub" x="490" y="326">the number Modal bills</text>
  <line x1="490" y1="346" x2="852" y2="346" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="label" x="490" y="370">already in your tool-call spans</text>

  <rect class="hero" x="24" y="410" width="852" height="66" />
  <text class="label-inv" x="48" y="440">Ratio above ~5:1 — alive-time billing is charging you mostly for waiting.</text>
  <text class="sub-inv" x="48" y="462">Close to 1:1 — you are running batch compute, and the per-second rates decide it.</text>
</svg>
