<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Vendor-published sequential cold starts against third-party burst measurements</title>
  <desc id="d">Horizontal bar chart on one shared scale from zero to six seconds. The upper group, vendor-published sequential cold starts, shows Daytona at 0.027 to 0.09 seconds and E2B at about 0.15 seconds, both barely visible at this scale. The lower group, third-party burst cold starts measured under concurrent creates in August 2026, shows Vercel at 0.67 seconds with a 1.12 second p99, Modal at 0.88 seconds, E2B at 1.61 seconds and Cloudflare at 5.06 seconds. A footnote records that Daytona and Northflank do not appear in any published burst measurement.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); }
    .med    { fill: var(--accent-soft); }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .title  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .grp    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .grid   { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 3 4; }
  </style>

  <text class="title" x="24" y="28">Sandbox create latency (seconds)</text>

  <line class="grid" x1="230" y1="44" x2="230" y2="330" />
  <line class="grid" x1="337" y1="44" x2="337" y2="330" />
  <line class="grid" x1="444" y1="44" x2="444" y2="330" />
  <line class="grid" x1="551" y1="44" x2="551" y2="330" />
  <line class="grid" x1="658" y1="44" x2="658" y2="330" />
  <line class="grid" x1="765" y1="44" x2="765" y2="330" />
  <text class="note" x="220" y="352">0</text>
  <text class="note" x="327" y="352">1</text>
  <text class="note" x="434" y="352">2</text>
  <text class="note" x="541" y="352">3</text>
  <text class="note" x="648" y="352">4</text>
  <text class="note" x="755" y="352">5</text>

  <text class="grp" x="24" y="62">VENDOR-PUBLISHED, SEQUENTIAL CREATES</text>

  <text class="row" x="24" y="88">Daytona</text>
  <rect class="weak" x="230" y="76" width="10" height="18" />
  <text class="val" x="250" y="90">0.027–0.09</text>

  <text class="row" x="24" y="120">E2B</text>
  <rect class="weak" x="230" y="108" width="16" height="18" />
  <text class="val" x="256" y="122">0.15</text>

  <line x1="24" y1="142" x2="876" y2="142" stroke="var(--ink)" stroke-width="1" opacity=".25" />

  <text class="grp" x="24" y="166">THIRD-PARTY MEASURED, CONCURRENT BURST (AUGUST 2026)</text>

  <text class="row" x="24" y="192">Vercel</text>
  <rect class="med" x="230" y="180" width="72" height="18" />
  <text class="val" x="312" y="194">0.67  (p99 1.12)</text>

  <text class="row" x="24" y="224">Modal</text>
  <rect class="med" x="230" y="212" width="94" height="18" />
  <text class="val" x="334" y="226">0.88</text>

  <text class="row" x="24" y="256">E2B</text>
  <rect class="strong" x="230" y="244" width="172" height="18" />
  <text class="val" x="412" y="258">1.61</text>

  <text class="row" x="24" y="288">Cloudflare</text>
  <rect class="strong" x="230" y="276" width="541" height="18" />
  <text class="val" x="781" y="290">5.06</text>

  <text class="note" x="24" y="382">Daytona and Northflank publish no burst figure. E2B appears in both groups, roughly 10× apart.</text>
</svg>
