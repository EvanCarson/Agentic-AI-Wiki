<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Two billing shapes, and what decides between them</title>
  <desc id="d">Three columns. The first, alive-time billing, covers E2B, Daytona and Northflank: the clock runs from create to destroy whether or not code executes, so waiting on the model is billable and the only lever is aggressive teardown, which puts cold start back in the critical path. The second, execution-time billing, covers Modal: compute charges drop to zero when nothing runs, so a sandbox waiting on a model is nearly free, and the platform charges a per-core-second rate while active. The third column says the decision belongs to your workload, not to the platforms: measure alive-seconds against executing-seconds over a week of real runs, because that ratio, not the published rate, decides which column is cheaper.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
  </style>

  <rect class="box" x="24" y="36" width="266" height="228" />
  <text class="head" x="44" y="66">Alive-time</text>
  <text class="sub" x="44" y="100">create → destroy is the meter</text>
  <text class="sub" x="44" y="124">waiting on the model is billable</text>
  <text class="sub" x="44" y="148">only lever: tear down sooner</text>
  <line x1="44" y1="176" x2="270" y2="176" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="44" y="200">E2B / DAYTONA / NORTHFLANK</text>
  <text class="label" x="44" y="228">and tearing down puts cold</text>
  <text class="label" x="44" y="248">start back in every turn</text>

  <rect class="adj" x="314" y="36" width="266" height="228" />
  <text class="head" x="334" y="66">Execution-time</text>
  <text class="sub" x="334" y="100">compute drops to zero when idle</text>
  <text class="sub" x="334" y="124">a waiting sandbox is near free</text>
  <text class="sub" x="334" y="148">per-core-second while active</text>
  <line x1="334" y1="176" x2="560" y2="176" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="334" y="200">MODAL</text>
  <text class="label" x="334" y="228">no floor to carry, and the</text>
  <text class="label" x="334" y="248">only GPU-in-sandbox path</text>

  <rect class="hero" x="604" y="36" width="266" height="228" />
  <text class="head-inv" x="624" y="66">Your ratio decides</text>
  <text class="sub-inv" x="624" y="100">alive-seconds ÷ executing-seconds</text>
  <text class="sub-inv" x="624" y="124">one week of real runs, not a bench</text>
  <text class="sub-inv" x="624" y="148">above ~5:1 the meter wins the case</text>
  <line x1="624" y1="176" x2="850" y2="176" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag" x="624" y="200" fill="var(--paper)" opacity=".85">NOT A PROPERTY OF THE VENDORS</text>
  <text class="label-inv" x="624" y="228">no pricing page can do this</text>
  <text class="label-inv" x="624" y="248">arithmetic on your behalf</text>
</svg>
