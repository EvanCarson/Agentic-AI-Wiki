<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Where the patch step exists in an agent stack, and where it does not</title>
  <desc id="d">Three columns for the three tiers of an agent stack: code you wrote, components you self-host, and an agent service the vendor operates. For each tier the rows show who ships the fix, what you can verify afterwards, and what control you actually hold. Only the first two tiers have a version you can pin and check; in the vendor-operated tier the fix is already live before you are told, so the only lever is the credential scope granted in advance.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .head  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .cell  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .row   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="row" x="10" y="98">FIX SHIPS</text>
  <text class="row" x="10" y="168">YOU VERIFY</text>
  <text class="row" x="10" y="238">YOUR LEVER</text>

  <rect class="box" x="130" y="18" width="230" height="46" rx="8" />
  <text class="head" x="245" y="40" text-anchor="middle">Code you wrote</text>
  <text class="cell" x="245" y="56" text-anchor="middle">tools, prompts, orchestration</text>

  <rect class="adj" x="370" y="18" width="230" height="46" rx="8" />
  <text class="head" x="485" y="40" text-anchor="middle">Components you host</text>
  <text class="cell" x="485" y="56" text-anchor="middle">gateway, MCP servers, runtime</text>

  <rect class="hero" x="610" y="18" width="245" height="46" rx="8" />
  <text class="head-inv" x="732" y="40" text-anchor="middle">Vendor-operated agent</text>
  <text class="cell-inv" x="732" y="56" text-anchor="middle">SaaS with your credentials</text>

  <rect class="box" x="130" y="76" width="230" height="54" rx="8" />
  <text class="cell" x="245" y="98" text-anchor="middle">When you merge it.</text>
  <text class="cell" x="245" y="114" text-anchor="middle">Your release train.</text>

  <rect class="box" x="370" y="76" width="230" height="54" rx="8" />
  <text class="cell" x="485" y="98" text-anchor="middle">When you pull the image</text>
  <text class="cell" x="485" y="114" text-anchor="middle">and redeploy.</text>

  <rect class="hero" x="610" y="76" width="245" height="54" rx="8" />
  <text class="cell-inv" x="732" y="98" text-anchor="middle">Already live before the</text>
  <text class="cell-inv" x="732" y="114" text-anchor="middle">advisory reaches you.</text>

  <rect class="box" x="130" y="146" width="230" height="54" rx="8" />
  <text class="cell" x="245" y="168" text-anchor="middle">A commit and a test.</text>
  <text class="cell" x="245" y="184" text-anchor="middle">Version pinned.</text>

  <rect class="box" x="370" y="146" width="230" height="54" rx="8" />
  <text class="cell" x="485" y="168" text-anchor="middle">A digest in your registry.</text>
  <text class="cell" x="485" y="184" text-anchor="middle">Version pinned.</text>

  <rect class="hero" x="610" y="146" width="245" height="54" rx="8" />
  <text class="cell-inv" x="732" y="168" text-anchor="middle">Nothing. No build number,</text>
  <text class="cell-inv" x="732" y="184" text-anchor="middle">no artifact, no rollback.</text>

  <rect class="adj" x="130" y="216" width="230" height="54" rx="8" />
  <text class="cell" x="245" y="238" text-anchor="middle">Patch latency.</text>
  <text class="cell" x="245" y="254" text-anchor="middle">Measured in hours.</text>

  <rect class="adj" x="370" y="216" width="230" height="54" rx="8" />
  <text class="cell" x="485" y="238" text-anchor="middle">Patch latency.</text>
  <text class="cell" x="485" y="254" text-anchor="middle">Measured in days.</text>

  <rect class="adj" x="610" y="216" width="245" height="54" rx="8" />
  <text class="cell" x="732" y="238" text-anchor="middle">The grant you made months</text>
  <text class="cell" x="732" y="254" text-anchor="middle">ago, and your log retention.</text>

  <text class="row" x="10" y="290">THE RIGHTMOST COLUMN IS WHERE THE MONTH'S TWO HIGHEST-SCORING AGENT CVES LANDED</text>
</svg>
