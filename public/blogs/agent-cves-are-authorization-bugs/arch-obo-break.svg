<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">How an on-behalf-of failure widens an agent's blast radius</title>
  <desc id="d">Two stacked flows. In the intended flow a user's request reaches the agent, the agent exchanges the user's token for a downstream token on behalf of that user, and every downstream call carries the user's own permissions. In the failed flow the exchange is skipped or mis-scoped, so the downstream call carries the agent's managed identity instead, and the caller reaches every resource that identity was granted rather than only their own.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .band   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .arrow-hero { fill: none; stroke: var(--accent, #d4421e); stroke-width: 2; marker-end: url(#arrh); }
    .rule   { stroke: var(--ink); stroke-width: 1; opacity: .2; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
    <marker id="arrh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent, #d4421e)" />
    </marker>
  </defs>

  <text class="band" x="30" y="34">INTENDED — TOKEN EXCHANGED ON BEHALF OF THE USER</text>

  <rect class="box" x="30" y="52" width="150" height="60" rx="8" />
  <text class="label" x="105" y="78" text-anchor="middle">Caller</text>
  <text class="sub" x="105" y="96" text-anchor="middle">low-privilege user</text>

  <path class="arrow" d="M 184 82 L 246 82" />

  <rect class="adj" x="250" y="52" width="170" height="60" rx="8" />
  <text class="label" x="335" y="78" text-anchor="middle">Agent service</text>
  <text class="sub" x="335" y="96" text-anchor="middle">exchanges the token</text>

  <path class="arrow" d="M 424 82 L 486 82" />

  <rect class="box" x="490" y="52" width="170" height="60" rx="8" />
  <text class="label" x="575" y="78" text-anchor="middle">Downstream call</text>
  <text class="sub" x="575" y="96" text-anchor="middle">carries user identity</text>

  <path class="arrow" d="M 664 82 L 726 82" />

  <rect class="box" x="730" y="52" width="140" height="60" rx="8" />
  <text class="label" x="800" y="78" text-anchor="middle">One resource</text>
  <text class="sub" x="800" y="96" text-anchor="middle">the caller owned</text>

  <line class="rule" x1="30" y1="150" x2="870" y2="150" />

  <text class="band" x="30" y="186">FAILED — EXCHANGE SKIPPED, AGENT IDENTITY USED INSTEAD (CVE-2026-62830)</text>

  <rect class="box" x="30" y="204" width="150" height="60" rx="8" />
  <text class="label" x="105" y="230" text-anchor="middle">Caller</text>
  <text class="sub" x="105" y="248" text-anchor="middle">same low privilege</text>

  <path class="arrow-hero" d="M 184 234 L 246 234" />

  <rect class="hero" x="250" y="204" width="170" height="60" rx="8" />
  <text class="label-inv" x="335" y="230" text-anchor="middle">Missing authorization</text>
  <text class="sub-inv" x="335" y="248" text-anchor="middle">boundary not enforced</text>

  <path class="arrow-hero" d="M 424 234 L 486 234" />

  <rect class="adj" x="490" y="204" width="170" height="60" rx="8" />
  <text class="label" x="575" y="230" text-anchor="middle">Downstream call</text>
  <text class="sub" x="575" y="248" text-anchor="middle">carries managed identity</text>

  <path class="arrow-hero" d="M 664 234 L 726 234" />
  <path class="arrow-hero" d="M 664 234 L 700 234 L 700 320 L 726 320" />
  <path class="arrow-hero" d="M 664 234 L 700 234 L 700 396 L 726 396" />

  <rect class="hero" x="730" y="204" width="140" height="52" rx="8" />
  <text class="label-inv" x="800" y="226" text-anchor="middle">Runbooks</text>
  <text class="sub-inv" x="800" y="243" text-anchor="middle">read and rewrite</text>

  <rect class="hero" x="730" y="294" width="140" height="52" rx="8" />
  <text class="label-inv" x="800" y="316" text-anchor="middle">Telemetry</text>
  <text class="sub-inv" x="800" y="333" text-anchor="middle">and incident tooling</text>

  <rect class="hero" x="730" y="370" width="140" height="52" rx="8" />
  <text class="label-inv" x="800" y="392" text-anchor="middle">Every resource</text>
  <text class="sub-inv" x="800" y="409" text-anchor="middle">the identity can reach</text>

  <text class="band" x="30" y="470">THE MODEL IS IDENTICAL IN BOTH ROWS. THE SEVERITY DIFFERENCE IS ENTIRELY IN WHICH CREDENTIAL</text>
  <text class="band" x="30" y="488">THE DOWNSTREAM CALL CARRIES — WHICH IS A GRANT YOU MADE BEFORE THE BUG WAS DISCLOSED</text>
</svg>
