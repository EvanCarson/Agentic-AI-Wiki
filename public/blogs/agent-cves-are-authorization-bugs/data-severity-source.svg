<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">The same authorization bug at three credential scopes</title>
  <desc id="d">Horizontal bar chart showing how far an attacker gets from one identical authorization failure under three different grants to the agent's identity. A subscription-wide contributor grant exposes every resource in the subscription, a resource-group grant exposes one group, and a per-resource least-privilege grant exposes only the resources the agent was explicitly given. The vulnerability is constant across all three rows; only the grant changes.</desc>
  <style>
    .bar-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .bar-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .bar-mute { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .grid     { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 3 4; }
    .axis     { stroke: var(--ink); stroke-width: 1.25; opacity: .5; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .key      { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .keysub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .val-inv  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); }
    .val      { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .tick     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .55; }
    .note     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="chart-title" x="30" y="42">One identical missing-authorization bug, three grants you chose</text>

  <line class="grid" x1="330" y1="66" x2="330" y2="272" />
  <line class="grid" x1="490" y1="66" x2="490" y2="272" />
  <line class="grid" x1="650" y1="66" x2="650" y2="272" />
  <line class="grid" x1="810" y1="66" x2="810" y2="272" />

  <text class="key" x="30" y="98">Subscription-wide</text>
  <text class="keysub" x="30" y="114">Contributor everywhere</text>
  <rect class="bar-hero" x="170" y="80" width="640" height="46" rx="4" />
  <text class="val-inv" x="796" y="108" text-anchor="end">every resource in the subscription</text>

  <text class="key" x="30" y="176">Resource-group</text>
  <text class="keysub" x="30" y="192">one group, one team</text>
  <rect class="bar-adj" x="170" y="158" width="250" height="46" rx="4" />
  <text class="val" x="434" y="186">one blast zone, still shared</text>

  <text class="key" x="30" y="254">Per-resource</text>
  <text class="keysub" x="30" y="270">explicit, expiring, audited</text>
  <rect class="bar-mute" x="170" y="236" width="90" height="46" rx="4" />
  <text class="val" x="274" y="264">what the agent was given</text>

  <line class="axis" x1="170" y1="296" x2="810" y2="296" />
  <text class="tick" x="170" y="314">narrow</text>
  <text class="tick" x="810" y="314" text-anchor="end">wide</text>

  <text class="note" x="30" y="356">ILLUSTRATIVE. THE CVSS VECTOR FOR CVE-2026-62830 CARRIES SCOPE CHANGED (S:C) — THE SCORE IS</text>
  <text class="note" x="30" y="374">A STATEMENT ABOUT WHAT THE AGENT'S IDENTITY COULD REACH, NOT ABOUT WHAT THE MODEL COULD DO</text>
  <text class="note" x="30" y="392">NONE OF THESE THREE ROWS COULD BE CHANGED AFTER DISCLOSURE. ALL THREE WERE SET BEFORE IT</text>
</svg>
