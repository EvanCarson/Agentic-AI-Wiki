<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ddc-t ddc-d">
  <title id="ddc-t">What four classes of allowlisted destination do with what you send them</title>
  <desc id="ddc-d">A matrix of four egress destination classes against three properties: whether the destination retains the payload, whether it publishes it, and whether the published copy is search-indexed. Internal services retain only; model APIs retain and may be reviewed; archive and cache services and public URL scanners both publish and index.</desc>
  <style>
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .title  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .colh   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .rowh   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .legend { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="title" x="30" y="34">Egress destinations, by what happens to the payload</text>

  <text class="colh" x="340" y="70">RETAINS IT</text>
  <text class="colh" x="520" y="70">PUBLISHES IT</text>
  <text class="colh" x="710" y="70">SEARCH-INDEXED</text>

  <text class="rowh" x="30" y="108">Internal service</text>
  <rect class="med"  x="330" y="88" width="160" height="34" />
  <text class="cell" x="346" y="110">Yes, under your rules</text>
  <rect class="weak" x="510" y="88" width="160" height="34" />
  <text class="cell" x="526" y="110">No</text>
  <rect class="weak" x="690" y="88" width="180" height="34" />
  <text class="cell" x="706" y="110">No</text>

  <text class="rowh" x="30" y="168">Model or vendor API</text>
  <rect class="med"  x="330" y="148" width="160" height="34" />
  <text class="cell" x="346" y="170">Yes, per contract</text>
  <rect class="weak" x="510" y="148" width="160" height="34" />
  <text class="cell" x="526" y="170">No</text>
  <rect class="weak" x="690" y="148" width="180" height="34" />
  <text class="cell" x="706" y="170">No</text>

  <text class="rowh" x="30" y="228">Archive or cache</text>
  <rect class="strong" x="330" y="208" width="160" height="34" />
  <text class="cell-inv" x="346" y="230">Indefinitely</text>
  <rect class="strong" x="510" y="208" width="160" height="34" />
  <text class="cell-inv" x="526" y="230">That is the product</text>
  <rect class="med" x="690" y="208" width="180" height="34" />
  <text class="cell" x="706" y="230">Usually</text>

  <text class="rowh" x="30" y="288">Public URL scanner</text>
  <rect class="strong" x="330" y="268" width="160" height="34" />
  <text class="cell-inv" x="346" y="290">Indefinitely</text>
  <rect class="strong" x="510" y="268" width="160" height="34" />
  <text class="cell-inv" x="526" y="290">Report is public</text>
  <rect class="strong" x="690" y="268" width="180" height="34" />
  <text class="cell-inv" x="706" y="290">Yes, with the payload</text>

  <rect class="weak"   x="30"  y="340" width="18" height="18" />
  <text class="legend" x="56"  y="354">No</text>
  <rect class="med"    x="110" y="340" width="18" height="18" />
  <text class="legend" x="136" y="354">Bounded by a contract you signed</text>
  <rect class="strong" x="380" y="340" width="18" height="18" />
  <text class="legend" x="406" y="354">Public by design — the row to remove from your allowlist</text>
</svg>
