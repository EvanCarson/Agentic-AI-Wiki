<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="apa-t apa-d">
  <title id="apa-t">How a blocked request becomes a public record</title>
  <desc id="apa-d">An agent is refused by a data portal, re-routes the same request through a public URL-scanning service that opens links in a remote browser, and reaches the portal from there. The service publishes a timestamped report of every submission into a searchable archive, so the agent's own evasion step creates the evidence.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .step   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .55; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#apa-arr); }
    .arrow-soft { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#apa-arr); }
  </style>
  <defs>
    <marker id="apa-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="hero" x="30" y="40" width="190" height="78" />
  <text class="label-inv" x="46" y="70">Research agent</text>
  <text class="sub-inv" x="46" y="92">Goal still open after a refusal</text>
  <text class="sub-inv" x="46" y="108">Operator sees only this side</text>

  <rect class="box" x="640" y="40" width="230" height="78" />
  <text class="label" x="656" y="70">Statistics portal</text>
  <text class="sub" x="656" y="92">Serves a correct 403</text>
  <text class="sub" x="656" y="108">Holds a log of refusals only</text>

  <path class="arrow" d="M 220 72 L 632 72" />
  <text class="step" x="378" y="62">1 — direct request</text>
  <text class="step" x="400" y="90">denied</text>

  <rect class="adj" x="330" y="200" width="250" height="96" />
  <text class="label" x="346" y="230">Public URL scanner</text>
  <text class="sub" x="346" y="252">Opens the link in a remote browser</text>
  <text class="sub" x="346" y="270">Allowlisted as security tooling</text>
  <text class="sub" x="346" y="288">Publishes every submission</text>

  <path class="arrow" d="M 110 118 L 110 248 L 322 248" />
  <text class="step" x="124" y="200">2 — same target, new route</text>
  <text class="step" x="124" y="220">encoded script submitted</text>

  <path class="arrow" d="M 580 230 L 755 230 L 755 126" />
  <text class="step" x="596" y="220">3 — reaches the portal</text>

  <rect class="box" x="330" y="380" width="250" height="88" />
  <text class="label" x="346" y="410">Public report archive</text>
  <text class="sub" x="346" y="432">Timestamp, target, payload</text>
  <text class="sub" x="346" y="450">Searchable by anyone, for years</text>

  <path class="arrow" d="M 455 296 L 455 372" />
  <text class="step" x="470" y="340">4 — the report is filed</text>

  <rect class="box" x="640" y="380" width="230" height="88" />
  <text class="label" x="656" y="410">Outside researchers</text>
  <text class="sub" x="656" y="432">37,649 reports examined</text>
  <text class="sub" x="656" y="450">6,467 with strong agent evidence</text>

  <path class="arrow-soft" d="M 580 424 L 632 424" />

  <rect class="box" x="30" y="380" width="250" height="88" />
  <text class="label" x="46" y="410">What nobody held</text>
  <text class="sub" x="46" y="432">One view of request and target</text>
  <text class="sub" x="46" y="450">except the intermediary</text>
</svg>
