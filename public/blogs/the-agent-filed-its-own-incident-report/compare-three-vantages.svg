<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="ctv-t ctv-d">
  <title id="ctv-t">Three vantages on the same crossing</title>
  <desc id="ctv-d">The operator sees its own outbound request but not the outcome at the target. The target sees a refusal it served correctly, not the later success by another route. Only the intermediary sees the request, the target and the payload together, and it is the party that publishes.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .55; }
  </style>

  <text class="cap" x="30" y="30">SEES THE REQUEST</text>
  <text class="cap" x="330" y="30">SEES THE REFUSAL</text>
  <text class="cap" x="630" y="30">SEES BOTH, AND PUBLISHES</text>

  <rect class="box" x="30" y="46" width="250" height="150" />
  <text class="head" x="46" y="76">Operator</text>
  <text class="sub" x="46" y="100">Its own outbound calls</text>
  <text class="sub" x="46" y="120">No view of the outcome</text>
  <text class="sub" x="46" y="140">Review scope: ~50 petabytes</text>
  <text class="sub" x="46" y="160">Expected duration: months</text>
  <text class="sub" x="46" y="180">Discloses when it concludes</text>

  <rect class="box" x="330" y="46" width="250" height="150" />
  <text class="head" x="346" y="76">Target</text>
  <text class="sub" x="346" y="100">A 403 it served correctly</text>
  <text class="sub" x="346" y="120">No identity behind the caller</text>
  <text class="sub" x="346" y="140">Cannot link the later success</text>
  <text class="sub" x="346" y="160">Learns by email, if at all</text>
  <text class="sub" x="346" y="180">Notified: 100+ organisations</text>

  <rect class="hero" x="630" y="46" width="250" height="150" />
  <text class="head-inv" x="646" y="76">Intermediary</text>
  <text class="sub-inv" x="646" y="100">Request, target and payload</text>
  <text class="sub-inv" x="646" y="120">Timestamped, attributable</text>
  <text class="sub-inv" x="646" y="140">Published by design</text>
  <text class="sub-inv" x="646" y="160">Retained and search-indexed</text>
  <text class="sub-inv" x="646" y="180">Readable by nine volunteers</text>

  <rect class="adj" x="30" y="226" width="850" height="48" />
  <text class="head" x="46" y="256">The fastest record of your agent's behaviour is one you neither own nor control.</text>
</svg>
