<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Domain LLM vs open finance LLM vs prompted general LLM</title>
  <desc id="d">Three columns — BloombergGPT (closed domain LLM, finance pre-trained), FinGPT (open finance LLM family fine-tuned on open base), and a prompted frontier general model (Claude or GPT-class). Compared across four axes: finance recall, generality, openness, cost per call. Each cell is shaded high/medium/low.</desc>
  <style>
    .col-strong { fill: var(--accent, #d4421e); }
    .col-medium { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; }
    .col-weak   { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; }
    .col-header { fill: var(--ink, #1a1a1a); }
    .row-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .85; }
    .row-sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .55; }
    .col-name   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); }
    .cell-strong { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--paper, #fff); }
    .cell-medium { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); }
    .cell-weak   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .legend-l   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .60; }
  </style>

  <!-- Column headers -->
  <rect class="col-header" x="200" y="20" width="220" height="32" rx="6" ry="6" />
  <text class="col-name" x="310" y="42" text-anchor="middle">BloombergGPT</text>
  <rect class="col-header" x="430" y="20" width="220" height="32" rx="6" ry="6" />
  <text class="col-name" x="540" y="42" text-anchor="middle">FinGPT</text>
  <rect class="col-header" x="660" y="20" width="220" height="32" rx="6" ry="6" />
  <text class="col-name" x="770" y="42" text-anchor="middle">Prompted general</text>

  <!-- Row 1: Finance recall -->
  <text class="row-label" x="30" y="80">Finance recall</text>
  <text class="row-sub"   x="30" y="95">sentiment / NER / QA</text>
  <rect class="col-strong" x="200" y="65" width="220" height="40" rx="4" ry="4" />
  <text class="cell-strong" x="310" y="90" text-anchor="middle">High</text>
  <rect class="col-strong" x="430" y="65" width="220" height="40" rx="4" ry="4" />
  <text class="cell-strong" x="540" y="90" text-anchor="middle">High</text>
  <rect class="col-medium" x="660" y="65" width="220" height="40" rx="4" ry="4" />
  <text class="cell-medium" x="770" y="90" text-anchor="middle">Medium</text>

  <!-- Row 2: Generality -->
  <text class="row-label" x="30" y="125">Generality</text>
  <text class="row-sub"   x="30" y="140">non-finance reasoning</text>
  <rect class="col-weak"   x="200" y="115" width="220" height="40" rx="4" ry="4" />
  <text class="cell-weak"  x="310" y="140" text-anchor="middle">Low</text>
  <rect class="col-medium" x="430" y="115" width="220" height="40" rx="4" ry="4" />
  <text class="cell-medium" x="540" y="140" text-anchor="middle">Medium</text>
  <rect class="col-strong" x="660" y="115" width="220" height="40" rx="4" ry="4" />
  <text class="cell-strong" x="770" y="140" text-anchor="middle">High</text>

  <!-- Row 3: Openness -->
  <text class="row-label" x="30" y="175">Openness</text>
  <text class="row-sub"   x="30" y="190">deploy / fine-tune</text>
  <rect class="col-weak"   x="200" y="165" width="220" height="40" rx="4" ry="4" />
  <text class="cell-weak"  x="310" y="190" text-anchor="middle">Closed</text>
  <rect class="col-strong" x="430" y="165" width="220" height="40" rx="4" ry="4" />
  <text class="cell-strong" x="540" y="190" text-anchor="middle">Open</text>
  <rect class="col-weak"   x="660" y="165" width="220" height="40" rx="4" ry="4" />
  <text class="cell-weak"  x="770" y="190" text-anchor="middle">API-only</text>

  <!-- Row 4: Cost per call -->
  <text class="row-label" x="30" y="225">Cost per call</text>
  <text class="row-sub"   x="30" y="240">at production scale</text>
  <rect class="col-medium" x="200" y="215" width="220" height="40" rx="4" ry="4" />
  <text class="cell-medium" x="310" y="240" text-anchor="middle">Medium (internal)</text>
  <rect class="col-strong" x="430" y="215" width="220" height="40" rx="4" ry="4" />
  <text class="cell-strong" x="540" y="240" text-anchor="middle">Low (self-host)</text>
  <rect class="col-weak"   x="660" y="215" width="220" height="40" rx="4" ry="4" />
  <text class="cell-weak"  x="770" y="240" text-anchor="middle">High</text>

  <!-- legend -->
  <rect class="col-weak"   x="200" y="275" width="14" height="14" />
  <text class="legend-l" x="218" y="287">Low / weak</text>
  <rect class="col-medium" x="320" y="275" width="14" height="14" />
  <text class="legend-l" x="338" y="287">Medium</text>
  <rect class="col-strong" x="430" y="275" width="14" height="14" />
  <text class="legend-l" x="448" y="287">High / strong</text>
</svg>
