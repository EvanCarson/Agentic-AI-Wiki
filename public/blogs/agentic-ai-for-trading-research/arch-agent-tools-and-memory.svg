<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Trading agent: tools and memory surface</title>
  <desc id="d">A single LLM agent at the centre with four tool connections (market-data read, news/transcript RAG, portfolio-state read, broker write — guarded) and two memory blocks (short-term scratchpad for the current decision; long-term store of prior theses and outcomes). The broker tool is marked guarded.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <style>
    .hero       { fill: var(--accent, #d4421e); stroke: none; }
    .adj        { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .box        { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .mem-box    { fill: var(--paper, #fff); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .label      { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .label-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: var(--paper, #fff); }
    .sub        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .85; }
    .arrow      { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); opacity: .65; }
    .arrow-ret  { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); opacity: .50; stroke-dasharray: 5 4; }
    .arrow-guard { fill: none; stroke: var(--accent, #d4421e); stroke-width: 2; marker-end: url(#arr); opacity: .85; }
    .guard-lbl  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: var(--accent, #d4421e); letter-spacing: .04em; }
    .section-lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: var(--ink, #1a1a1a); opacity: .55; letter-spacing: .08em; text-transform: uppercase; }
  </style>

  <!-- Center agent (hero) -->
  <rect class="hero" x="350" y="190" width="200" height="120" rx="14" ry="14" />
  <text class="label-inv" x="450" y="232" text-anchor="middle">LLM agent</text>
  <text class="sub-inv" x="450" y="258" text-anchor="middle">read → reason → act</text>
  <text class="sub-inv" x="450" y="276" text-anchor="middle">tool calls + memory I/O</text>

  <!-- Tools header -->
  <text class="section-lbl" x="100" y="40">Tools</text>

  <!-- Tool: market data (left top) -->
  <rect class="box" x="60" y="60" width="200" height="70" rx="8" ry="8" />
  <text class="label" x="160" y="88" text-anchor="middle">Market data (read)</text>
  <text class="sub" x="160" y="108" text-anchor="middle">price · LOB · greeks · vol</text>

  <!-- Tool: news/RAG (left bottom) -->
  <rect class="box" x="60" y="150" width="200" height="70" rx="8" ry="8" />
  <text class="label" x="160" y="178" text-anchor="middle">News / transcripts (RAG)</text>
  <text class="sub" x="160" y="198" text-anchor="middle">filings · analyst notes</text>

  <!-- Tool: portfolio state (right top) -->
  <rect class="box" x="640" y="60" width="200" height="70" rx="8" ry="8" />
  <text class="label" x="740" y="88" text-anchor="middle">Portfolio state (read)</text>
  <text class="sub" x="740" y="108" text-anchor="middle">positions · cash · exposures</text>

  <!-- Tool: broker write (right bottom — guarded, accent) -->
  <rect class="adj" x="640" y="150" width="200" height="70" rx="8" ry="8" />
  <text class="label" x="740" y="178" text-anchor="middle">Broker (write) · guarded</text>
  <text class="sub" x="740" y="198" text-anchor="middle">human approval at institutional</text>

  <!-- Arrows: tools to agent -->
  <path class="arrow" d="M 260 95 L 350 220" />
  <path class="arrow" d="M 260 185 L 350 245" />
  <path class="arrow-ret" d="M 350 235 L 260 100" />
  <path class="arrow-ret" d="M 350 260 L 260 190" />

  <path class="arrow-ret" d="M 640 95 L 550 220" />
  <path class="arrow-ret" d="M 550 230 L 640 100" />

  <!-- Broker arrow — special accent guard -->
  <path class="arrow-guard" d="M 550 260 L 640 185" />
  <text class="guard-lbl" x="585" y="220">GUARD</text>

  <!-- Memory header -->
  <text class="section-lbl" x="100" y="345">Memory</text>

  <!-- Memory: short-term (left) -->
  <rect class="mem-box" x="60" y="360" width="320" height="100" rx="10" ry="10" />
  <text class="label" x="220" y="392" text-anchor="middle">Short-term · this decision's scratchpad</text>
  <text class="sub" x="220" y="416" text-anchor="middle">analyst memos · debate transcript</text>
  <text class="sub" x="220" y="432" text-anchor="middle">supervisor reply · current plan</text>

  <!-- Memory: long-term (right) -->
  <rect class="mem-box" x="520" y="360" width="320" height="100" rx="10" ry="10" />
  <text class="label" x="680" y="392" text-anchor="middle">Long-term · prior theses + outcomes</text>
  <text class="sub" x="680" y="416" text-anchor="middle">what was called right + what was missed</text>
  <text class="sub" x="680" y="432" text-anchor="middle">queried for the next similar decision</text>

  <!-- Agent ↔ memory arrows -->
  <path class="arrow" d="M 380 310 L 280 360" />
  <path class="arrow-ret" d="M 280 360 L 380 320" />
  <path class="arrow" d="M 520 310 L 620 360" />
  <path class="arrow-ret" d="M 620 360 L 520 320" />
</svg>
