<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">LiveTradeBench: static benchmark rank vs live P&amp;L rank</title>
  <desc id="d">Two ranked columns of LLM family labels (left: static LMArena rank top to bottom; right: live trading P and L rank top to bottom over the 50-day August to October 2025 LiveTradeBench window). Connection lines between the same family on the two columns cross substantially, illustrating that the two rankings do not match.</desc>
  <style>
    .col-header { fill: var(--ink, #1a1a1a); }
    .col-name   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); }
    .row-strong { fill: var(--accent, #d4421e); }
    .row-medium { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; }
    .row-weak   { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; }
    .row-lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: var(--ink, #1a1a1a); }
    .row-lbl-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: var(--paper, #fff); }
    .rank       { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .55; }
    .rank-inv   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper, #fff); opacity: .80; }
    .connector  { fill: none; stroke: currentColor; stroke-width: 1.25; opacity: .45; }
    .connector-x { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; opacity: .75; }
    .title      { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .sub-title  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .60; font-style: italic; }
  </style>

  <text class="title" x="30" y="32">Rank stability check · LMArena ↔ LiveTradeBench P&amp;L</text>
  <text class="sub-title" x="30" y="50">Stylised — 5 frontier families · 50-day window Aug 18 – Oct 24, 2025</text>

  <!-- Column header: static -->
  <rect class="col-header" x="80" y="80" width="240" height="32" rx="6" ry="6" />
  <text class="col-name" x="200" y="100" text-anchor="middle">LMArena (static) rank</text>

  <!-- Column header: live -->
  <rect class="col-header" x="580" y="80" width="240" height="32" rx="6" ry="6" />
  <text class="col-name" x="700" y="100" text-anchor="middle">LiveTradeBench P&amp;L rank</text>

  <!-- Left column rows (top = rank 1) — 5 families A..E sorted by LMArena -->
  <!-- A (rank 1, accent) -->
  <rect class="row-strong" x="80" y="125" width="240" height="36" rx="4" ry="4" />
  <text class="rank-inv" x="92" y="147">#1</text>
  <text class="row-lbl-inv" x="200" y="148" text-anchor="middle">Family A</text>

  <!-- B (rank 2) -->
  <rect class="row-medium" x="80" y="170" width="240" height="36" rx="4" ry="4" />
  <text class="rank" x="92" y="192">#2</text>
  <text class="row-lbl" x="200" y="193" text-anchor="middle">Family B</text>

  <!-- C (rank 3) -->
  <rect class="row-medium" x="80" y="215" width="240" height="36" rx="4" ry="4" />
  <text class="rank" x="92" y="237">#3</text>
  <text class="row-lbl" x="200" y="238" text-anchor="middle">Family C</text>

  <!-- D (rank 4) -->
  <rect class="row-weak" x="80" y="260" width="240" height="36" rx="4" ry="4" />
  <text class="rank" x="92" y="282">#4</text>
  <text class="row-lbl" x="200" y="283" text-anchor="middle">Family D</text>

  <!-- E (rank 5) -->
  <rect class="row-weak" x="80" y="305" width="240" height="36" rx="4" ry="4" />
  <text class="rank" x="92" y="327">#5</text>
  <text class="row-lbl" x="200" y="328" text-anchor="middle">Family E</text>

  <!-- Right column rows — re-ordered by live P&L: D, A, E, B, C -->
  <!-- D (live rank 1, accent) -->
  <rect class="row-strong" x="580" y="125" width="240" height="36" rx="4" ry="4" />
  <text class="rank-inv" x="592" y="147">#1</text>
  <text class="row-lbl-inv" x="700" y="148" text-anchor="middle">Family D</text>

  <!-- A (live rank 2) -->
  <rect class="row-medium" x="580" y="170" width="240" height="36" rx="4" ry="4" />
  <text class="rank" x="592" y="192">#2</text>
  <text class="row-lbl" x="700" y="193" text-anchor="middle">Family A</text>

  <!-- E (live rank 3) -->
  <rect class="row-medium" x="580" y="215" width="240" height="36" rx="4" ry="4" />
  <text class="rank" x="592" y="237">#3</text>
  <text class="row-lbl" x="700" y="238" text-anchor="middle">Family E</text>

  <!-- B (live rank 4) -->
  <rect class="row-weak" x="580" y="260" width="240" height="36" rx="4" ry="4" />
  <text class="rank" x="592" y="282">#4</text>
  <text class="row-lbl" x="700" y="283" text-anchor="middle">Family B</text>

  <!-- C (live rank 5) -->
  <rect class="row-weak" x="580" y="305" width="240" height="36" rx="4" ry="4" />
  <text class="rank" x="592" y="327">#5</text>
  <text class="row-lbl" x="700" y="328" text-anchor="middle">Family C</text>

  <!-- Connectors A: left y143 to right y188 (rank 1 → rank 2) -->
  <path class="connector" d="M 320 143 L 580 188" />
  <!-- B: left y188 to right y278 (#2 → #4) -->
  <path class="connector-x" d="M 320 188 L 580 278" />
  <!-- C: left y233 to right y323 (#3 → #5) -->
  <path class="connector-x" d="M 320 233 L 580 323" />
  <!-- D: left y278 to right y143 (#4 → #1) -->
  <path class="connector-x" d="M 320 278 L 580 143" />
  <!-- E: left y323 to right y233 (#5 → #3) -->
  <path class="connector-x" d="M 320 323 L 580 233" />

  <text class="sub-title" x="450" y="368" text-anchor="middle">Crossing connectors illustrate the headline finding: high LMArena rank does not imply high P&amp;L rank.</text>
</svg>
