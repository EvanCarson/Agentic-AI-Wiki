<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Feature matrix: agentic-trading systems</title>
  <desc id="d">Heatmap matrix. Rows are four systems — TradingAgents, BloombergGPT, FinGPT, Prompted general LLM. Columns are five capabilities — finance recall, multi-agent orchestration, openness, production-ready boundaries, cost efficiency. Each cell is shaded strong, medium, or weak with a short label.</desc>
  <style>
    .col-strong { fill: var(--accent, #d4421e); }
    .col-medium { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; }
    .col-weak   { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; }
    .col-header { fill: var(--ink, #1a1a1a); }
    .row-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .col-name   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: var(--paper, #fff); }
    .cell-strong { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: var(--paper, #fff); }
    .cell-medium { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); }
    .cell-weak   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .60; }
    .legend-l   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .60; }
    .title      { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink, #1a1a1a); }
  </style>

  <text class="title" x="30" y="32">Where each system leans hardest</text>

  <!-- Column headers (5) -->
  <rect class="col-header" x="180" y="55" width="135" height="40" rx="4" ry="4" />
  <text class="col-name" x="247" y="71" text-anchor="middle">Finance</text>
  <text class="col-name" x="247" y="86" text-anchor="middle">recall</text>

  <rect class="col-header" x="325" y="55" width="135" height="40" rx="4" ry="4" />
  <text class="col-name" x="392" y="71" text-anchor="middle">Multi-agent</text>
  <text class="col-name" x="392" y="86" text-anchor="middle">orchestration</text>

  <rect class="col-header" x="470" y="55" width="135" height="40" rx="4" ry="4" />
  <text class="col-name" x="537" y="71" text-anchor="middle">Openness</text>
  <text class="col-name" x="537" y="86" text-anchor="middle">/ deployability</text>

  <rect class="col-header" x="615" y="55" width="135" height="40" rx="4" ry="4" />
  <text class="col-name" x="682" y="71" text-anchor="middle">Production</text>
  <text class="col-name" x="682" y="86" text-anchor="middle">boundaries</text>

  <rect class="col-header" x="760" y="55" width="135" height="40" rx="4" ry="4" />
  <text class="col-name" x="827" y="71" text-anchor="middle">Cost</text>
  <text class="col-name" x="827" y="86" text-anchor="middle">efficiency</text>

  <!-- Row: TradingAgents -->
  <text class="row-label" x="30" y="135">TradingAgents</text>
  <rect class="col-medium" x="180" y="115" width="135" height="50" rx="4" ry="4" />
  <text class="cell-medium" x="247" y="146" text-anchor="middle">Medium</text>
  <rect class="col-strong" x="325" y="115" width="135" height="50" rx="4" ry="4" />
  <text class="cell-strong" x="392" y="146" text-anchor="middle">Strong (firm pattern)</text>
  <rect class="col-strong" x="470" y="115" width="135" height="50" rx="4" ry="4" />
  <text class="cell-strong" x="537" y="146" text-anchor="middle">Strong (OSS)</text>
  <rect class="col-medium" x="615" y="115" width="135" height="50" rx="4" ry="4" />
  <text class="cell-medium" x="682" y="146" text-anchor="middle">Medium</text>
  <rect class="col-medium" x="760" y="115" width="135" height="50" rx="4" ry="4" />
  <text class="cell-medium" x="827" y="146" text-anchor="middle">Medium</text>

  <!-- Row: BloombergGPT -->
  <text class="row-label" x="30" y="195">BloombergGPT</text>
  <rect class="col-strong" x="180" y="175" width="135" height="50" rx="4" ry="4" />
  <text class="cell-strong" x="247" y="206" text-anchor="middle">Strong</text>
  <rect class="col-weak"   x="325" y="175" width="135" height="50" rx="4" ry="4" />
  <text class="cell-weak"  x="392" y="206" text-anchor="middle">Weak (single model)</text>
  <rect class="col-weak"   x="470" y="175" width="135" height="50" rx="4" ry="4" />
  <text class="cell-weak"  x="537" y="206" text-anchor="middle">Weak (closed)</text>
  <rect class="col-strong" x="615" y="175" width="135" height="50" rx="4" ry="4" />
  <text class="cell-strong" x="682" y="206" text-anchor="middle">Strong (internal)</text>
  <rect class="col-medium" x="760" y="175" width="135" height="50" rx="4" ry="4" />
  <text class="cell-medium" x="827" y="206" text-anchor="middle">Medium</text>

  <!-- Row: FinGPT -->
  <text class="row-label" x="30" y="255">FinGPT</text>
  <rect class="col-strong" x="180" y="235" width="135" height="50" rx="4" ry="4" />
  <text class="cell-strong" x="247" y="266" text-anchor="middle">Strong</text>
  <rect class="col-medium" x="325" y="235" width="135" height="50" rx="4" ry="4" />
  <text class="cell-medium" x="392" y="266" text-anchor="middle">Medium</text>
  <rect class="col-strong" x="470" y="235" width="135" height="50" rx="4" ry="4" />
  <text class="cell-strong" x="537" y="266" text-anchor="middle">Strong (OSS)</text>
  <rect class="col-medium" x="615" y="235" width="135" height="50" rx="4" ry="4" />
  <text class="cell-medium" x="682" y="266" text-anchor="middle">Medium</text>
  <rect class="col-strong" x="760" y="235" width="135" height="50" rx="4" ry="4" />
  <text class="cell-strong" x="827" y="266" text-anchor="middle">Strong (self-host)</text>

  <!-- Row: Prompted general LLM -->
  <text class="row-label" x="30" y="315">Prompted general LLM</text>
  <rect class="col-medium" x="180" y="295" width="135" height="50" rx="4" ry="4" />
  <text class="cell-medium" x="247" y="326" text-anchor="middle">Medium</text>
  <rect class="col-strong" x="325" y="295" width="135" height="50" rx="4" ry="4" />
  <text class="cell-strong" x="392" y="326" text-anchor="middle">Strong (broad)</text>
  <rect class="col-weak"   x="470" y="295" width="135" height="50" rx="4" ry="4" />
  <text class="cell-weak"  x="537" y="326" text-anchor="middle">API-only</text>
  <rect class="col-strong" x="615" y="295" width="135" height="50" rx="4" ry="4" />
  <text class="cell-strong" x="682" y="326" text-anchor="middle">Strong (mature)</text>
  <rect class="col-weak"   x="760" y="295" width="135" height="50" rx="4" ry="4" />
  <text class="cell-weak"  x="827" y="326" text-anchor="middle">Weak</text>

  <!-- legend -->
  <rect class="col-weak"   x="180" y="365" width="14" height="14" />
  <text class="legend-l" x="198" y="377">Weak</text>
  <rect class="col-medium" x="280" y="365" width="14" height="14" />
  <text class="legend-l" x="298" y="377">Medium</text>
  <rect class="col-strong" x="400" y="365" width="14" height="14" />
  <text class="legend-l" x="418" y="377">Strong</text>
</svg>
