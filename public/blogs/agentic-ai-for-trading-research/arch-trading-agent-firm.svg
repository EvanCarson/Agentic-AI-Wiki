<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Trading agent firm architecture</title>
  <desc id="d">Three specialist analyst agents (fundamentals, sentiment, technicals) feed two researcher agents arguing the bull and bear case. A trader agent synthesises; a risk-supervisor agent gates the proposal before it is handed to a deterministic broker outside the LLM region.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <style>
    .llm-region { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; stroke-dasharray: 6 4; opacity: .55; }
    .det-region { fill: none; stroke: var(--border-soft, #d8d4ce); stroke-width: 1; stroke-dasharray: 6 4; opacity: .55; }
    .box        { fill: var(--paper, #fff); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .hero       { fill: var(--accent, #d4421e); stroke: none; }
    .adj        { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .label      { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .label-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); }
    .sub        { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .85; }
    .region-lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: var(--ink, #1a1a1a); opacity: .55; letter-spacing: .08em; text-transform: uppercase; }
    .arrow      { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); opacity: .70; }
    .arrow-debate { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; marker-end: url(#arr); opacity: .85; }
  </style>

  <!-- LLM region -->
  <rect class="llm-region" x="30" y="30" width="700" height="440" rx="14" ry="14" />
  <text class="region-lbl" x="50" y="55">LLM region · research desk</text>

  <!-- Deterministic region -->
  <rect class="det-region" x="745" y="30" width="125" height="440" rx="14" ry="14" />
  <text class="region-lbl" x="753" y="55">Deterministic</text>
  <text class="region-lbl" x="753" y="71">execution</text>

  <!-- Analysts row (3) -->
  <rect class="box" x="60" y="90" width="180" height="80" rx="8" ry="8" />
  <text class="label" x="150" y="120" text-anchor="middle">Fundamentals analyst</text>
  <text class="sub" x="150" y="140" text-anchor="middle">Filings · ratios · guidance</text>
  <text class="sub" x="150" y="156" text-anchor="middle">→ memo</text>

  <rect class="box" x="260" y="90" width="180" height="80" rx="8" ry="8" />
  <text class="label" x="350" y="120" text-anchor="middle">Sentiment analyst</text>
  <text class="sub" x="350" y="140" text-anchor="middle">News · StockTwits · Reddit</text>
  <text class="sub" x="350" y="156" text-anchor="middle">→ memo</text>

  <rect class="box" x="460" y="90" width="180" height="80" rx="8" ry="8" />
  <text class="label" x="550" y="120" text-anchor="middle">Technicals analyst</text>
  <text class="sub" x="550" y="140" text-anchor="middle">Chart · LOB imbalance</text>
  <text class="sub" x="550" y="156" text-anchor="middle">→ memo</text>

  <!-- Researchers row (2) -->
  <rect class="adj" x="170" y="210" width="180" height="80" rx="8" ry="8" />
  <text class="label" x="260" y="240" text-anchor="middle">Bull researcher</text>
  <text class="sub" x="260" y="260" text-anchor="middle">Defend the long</text>
  <text class="sub" x="260" y="276" text-anchor="middle">case from memos</text>

  <rect class="adj" x="370" y="210" width="180" height="80" rx="8" ry="8" />
  <text class="label" x="460" y="240" text-anchor="middle">Bear researcher</text>
  <text class="sub" x="460" y="260" text-anchor="middle">Attack the long</text>
  <text class="sub" x="460" y="276" text-anchor="middle">case from memos</text>

  <!-- Debate edge (bull <-> bear) -->
  <path class="arrow-debate" d="M 350 250 L 370 250" />
  <path class="arrow-debate" d="M 370 268 L 350 268" />

  <!-- Trader -->
  <rect class="hero" x="270" y="330" width="180" height="80" rx="8" ry="8" />
  <text class="label-inv" x="360" y="360" text-anchor="middle">Trader agent</text>
  <text class="sub-inv" x="360" y="380" text-anchor="middle">Synthesises memos</text>
  <text class="sub-inv" x="360" y="396" text-anchor="middle">+ debate → proposal</text>

  <!-- Risk supervisor -->
  <rect class="hero" x="500" y="330" width="180" height="80" rx="8" ry="8" />
  <text class="label-inv" x="590" y="356" text-anchor="middle">Risk supervisor</text>
  <text class="sub-inv" x="590" y="376" text-anchor="middle">Approve / modify /</text>
  <text class="sub-inv" x="590" y="392" text-anchor="middle">reject vs portfolio</text>

  <!-- Broker (outside LLM region) -->
  <rect class="box" x="760" y="330" width="95" height="80" rx="8" ry="8" />
  <text class="label" x="807" y="360" text-anchor="middle">Broker</text>
  <text class="sub" x="807" y="380" text-anchor="middle">SOR / TWAP /</text>
  <text class="sub" x="807" y="396" text-anchor="middle">RL + guards</text>

  <!-- Arrows: analysts -> bull/bear -->
  <path class="arrow" d="M 150 170 L 230 210" />
  <path class="arrow" d="M 350 170 L 320 210" />
  <path class="arrow" d="M 350 170 L 430 210" />
  <path class="arrow" d="M 550 170 L 500 210" />

  <!-- bull/bear -> trader -->
  <path class="arrow" d="M 260 290 L 320 330" />
  <path class="arrow" d="M 460 290 L 410 330" />

  <!-- trader -> risk supervisor -->
  <path class="arrow" d="M 450 370 L 500 370" />

  <!-- risk supervisor -> broker (crosses region boundary) -->
  <path class="arrow" d="M 680 370 L 760 370" />

  <!-- Bottom caption -->
  <text class="sub" x="450" y="450" text-anchor="middle">The line between LLM region and deterministic execution is the load-bearing boundary in 2026 production stacks.</text>
</svg>
