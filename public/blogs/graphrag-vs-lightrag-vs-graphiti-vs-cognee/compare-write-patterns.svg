<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="wpT wpD">
  <title id="wpT">Three write patterns and what each one costs when the corpus changes</title>
  <desc id="wpD">Three columns. A batch build, used by Microsoft GraphRAG, re-derives communities and their summaries over the whole corpus, which gives the best corpus-wide answers but makes every update a re-index. An append, used by LightRAG and by Cognee's incremental pipelines, inserts new entities and edges without recomputing a hierarchy, which keeps updates cheap but weakens whole-corpus questions. A mutate, used by Graphiti, writes an episode and invalidates the edges it contradicts, which is the only pattern that models facts ceasing to be true, at the cost of a heavier per-write model call and a dependence on structured output.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">What happens when the corpus changes</text>

  <rect class="box" x="35" y="44" width="250" height="180" />
  <text class="hd" x="160" y="76" text-anchor="middle">Build</text>
  <text class="cell" x="160" y="110" text-anchor="middle">Microsoft GraphRAG re-derives</text>
  <text class="cell" x="160" y="128" text-anchor="middle">communities and their summaries</text>
  <text class="cell" x="160" y="146" text-anchor="middle">across the whole corpus.</text>
  <text class="cell" x="160" y="176" text-anchor="middle">Buys: the best whole-corpus</text>
  <text class="cell" x="160" y="194" text-anchor="middle">"what are the themes" answers.</text>
  <text class="sub" x="160" y="248" text-anchor="middle">Costs: every update is a re-index.</text>
  <text class="sub" x="160" y="266" text-anchor="middle">Assumes the corpus holds still.</text>

  <rect class="adj" x="325" y="44" width="250" height="180" />
  <text class="hd" x="450" y="76" text-anchor="middle">Append</text>
  <text class="cell" x="450" y="110" text-anchor="middle">LightRAG inserts new entities</text>
  <text class="cell" x="450" y="128" text-anchor="middle">and edges without recomputing</text>
  <text class="cell" x="450" y="146" text-anchor="middle">any hierarchy above them.</text>
  <text class="cell" x="450" y="176" text-anchor="middle">Buys: updates priced per</text>
  <text class="cell" x="450" y="194" text-anchor="middle">document instead of per corpus.</text>
  <text class="sub" x="450" y="248" text-anchor="middle">Costs: weaker global questions.</text>
  <text class="sub" x="450" y="266" text-anchor="middle">Nothing revises an old edge.</text>

  <rect class="hero" x="615" y="44" width="250" height="180" />
  <text class="hd-inv" x="740" y="76" text-anchor="middle">Mutate</text>
  <text class="cell-inv" x="740" y="110" text-anchor="middle">Graphiti writes an episode and</text>
  <text class="cell-inv" x="740" y="128" text-anchor="middle">invalidates the edges it</text>
  <text class="cell-inv" x="740" y="146" text-anchor="middle">contradicts, keeping both.</text>
  <text class="cell-inv" x="740" y="176" text-anchor="middle">Buys: the only pattern where</text>
  <text class="cell-inv" x="740" y="194" text-anchor="middle">a fact can stop being true.</text>
  <text class="sub" x="740" y="248" text-anchor="middle">Costs: a model call per write.</text>
  <text class="sub" x="740" y="266" text-anchor="middle">Leans on structured output.</text>
</svg>
