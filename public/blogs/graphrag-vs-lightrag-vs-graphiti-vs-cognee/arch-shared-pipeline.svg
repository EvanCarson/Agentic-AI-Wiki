<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="spT spD">
  <title id="spT">The stage all four systems share, and the one they all leave to you</title>
  <desc id="spD">Four differently shaped inputs — a static corpus for Microsoft GraphRAG, an appended stream for LightRAG, timestamped episodes for Graphiti, and a composed pipeline for Cognee — all feed one LLM extraction step that emits entities and relations. That output passes through a deduplication step, highlighted as the critical stage, which in the popular systems is string matching and therefore misses abbreviations, synonyms, casing differences, translations and typos. The deduplicated triples land in a graph store, from which two retrieval paths run: local traversal from matched entities, and global answers over community or theme summaries. A band beneath notes that a missed duplicate creates a false node, which creates false edges, and that retrieval evaluations do not catch it because the answer stays fluent.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .band   { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .72; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#spArr); }
  </style>
  <defs>
    <marker id="spArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="20">Four write patterns, one shared weak point</text>

  <rect class="box" x="0" y="40" width="205" height="72" />
  <text class="hd" x="102" y="66" text-anchor="middle">Static corpus</text>
  <text class="cell" x="102" y="88" text-anchor="middle">Microsoft GraphRAG —</text>
  <text class="cell" x="102" y="104" text-anchor="middle">batch build over everything</text>

  <rect class="box" x="231" y="40" width="205" height="72" />
  <text class="hd" x="333" y="66" text-anchor="middle">Appended stream</text>
  <text class="cell" x="333" y="88" text-anchor="middle">LightRAG —</text>
  <text class="cell" x="333" y="104" text-anchor="middle">insert without a rebuild</text>

  <rect class="box" x="462" y="40" width="205" height="72" />
  <text class="hd" x="564" y="66" text-anchor="middle">Timestamped episodes</text>
  <text class="cell" x="564" y="88" text-anchor="middle">Graphiti —</text>
  <text class="cell" x="564" y="104" text-anchor="middle">facts that later stop being true</text>

  <rect class="box" x="693" y="40" width="207" height="72" />
  <text class="hd" x="796" y="66" text-anchor="middle">Composed pipeline</text>
  <text class="cell" x="796" y="88" text-anchor="middle">Cognee —</text>
  <text class="cell" x="796" y="104" text-anchor="middle">tasks and DAGs you define</text>

  <path class="arrow" d="M 102 116 L 380 152" />
  <path class="arrow" d="M 333 116 L 420 152" />
  <path class="arrow" d="M 564 116 L 480 152" />
  <path class="arrow" d="M 796 116 L 520 152" />

  <rect class="adj" x="250" y="156" width="400" height="64" />
  <text class="hd" x="450" y="182" text-anchor="middle">LLM extraction — entities and relations</text>
  <text class="cell" x="450" y="204" text-anchor="middle">Prompt-driven, non-deterministic, priced per token of your whole corpus</text>

  <path class="arrow" d="M 450 224 L 450 256" />

  <rect class="hero" x="220" y="260" width="460" height="76" />
  <text class="hd-inv" x="450" y="288" text-anchor="middle">Deduplication — string matching</text>
  <text class="cell-inv" x="450" y="312" text-anchor="middle">Misses abbreviations, synonyms, casing, translations, typos.</text>
  <text class="cell-inv" x="450" y="328" text-anchor="middle">This is the stage every one of the four leaves to you.</text>

  <path class="arrow" d="M 450 340 L 450 372" />

  <rect class="box" x="300" y="376" width="300" height="56" />
  <text class="hd" x="450" y="400" text-anchor="middle">Graph store</text>
  <text class="cell" x="450" y="420" text-anchor="middle">Kuzu, Neo4j, FalkorDB, or an embedded default</text>

  <path class="arrow" d="M 300 404 L 210 404" />
  <path class="arrow" d="M 600 404 L 690 404" />

  <rect class="box" x="0" y="376" width="205" height="56" />
  <text class="hd" x="102" y="400" text-anchor="middle">Local traversal</text>
  <text class="cell" x="102" y="420" text-anchor="middle">from matched entities outward</text>

  <rect class="box" x="695" y="376" width="205" height="56" />
  <text class="hd" x="797" y="400" text-anchor="middle">Global answers</text>
  <text class="cell" x="797" y="420" text-anchor="middle">over community or theme summaries</text>

  <rect class="band" x="0" y="450" width="900" height="48" />
  <text class="cell" x="20" y="472">A missed duplicate is not a missing row — it is a false node, which means false edges, which means the traversal walks a structure that does not</text>
  <text class="cell" x="20" y="490">match reality. The answer stays fluent, so a retrieval evaluation scored on answer quality will not tell you it happened.</text>
</svg>
