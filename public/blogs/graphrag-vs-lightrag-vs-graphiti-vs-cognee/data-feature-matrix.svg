<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmT fmD">
  <title id="fmT">Where each system leans hardest, across four axes</title>
  <desc id="fmD">A matrix of four systems against four axes. Microsoft GraphRAG is weak on cheap incremental update, weak on handling time and contradiction, strong on corpus-wide theme questions, and medium on schema and ontology control. LightRAG is strong on incremental update, weak on time, medium on theme questions, and weak on schema control. Graphiti is strong on incremental update, strong on time and contradiction, weak on theme questions, and medium on schema control. Cognee is medium on incremental update, medium on time, medium on theme questions, and strong on schema and ontology control. No row is strong on every axis.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .row   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cellv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .yes   { fill: var(--accent, #d4421e); stroke: none; }
    .part  { fill: var(--accent-soft); stroke: var(--border-soft); stroke-width: 1; }
    .no    { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; }
  </style>

  <text class="ttl" x="0" y="20">Where each one leans hardest</text>

  <text class="hd" x="342" y="46" text-anchor="middle">Cheap incremental</text>
  <text class="hd" x="342" y="62" text-anchor="middle">update</text>
  <text class="hd" x="497" y="46" text-anchor="middle">Time and</text>
  <text class="hd" x="497" y="62" text-anchor="middle">contradiction</text>
  <text class="hd" x="652" y="46" text-anchor="middle">Corpus-wide</text>
  <text class="hd" x="652" y="62" text-anchor="middle">theme questions</text>
  <text class="hd" x="807" y="46" text-anchor="middle">Schema and</text>
  <text class="hd" x="807" y="62" text-anchor="middle">ontology control</text>

  <text class="row" x="0" y="106">Microsoft GraphRAG</text>
  <rect class="no"   x="270" y="76" width="145" height="48" rx="6" />
  <text class="cell" x="342" y="106" text-anchor="middle">Weak</text>
  <rect class="no"   x="425" y="76" width="145" height="48" rx="6" />
  <text class="cell" x="497" y="106" text-anchor="middle">Weak</text>
  <rect class="yes"  x="580" y="76" width="145" height="48" rx="6" />
  <text class="cellv" x="652" y="106" text-anchor="middle">Strong</text>
  <rect class="part" x="735" y="76" width="145" height="48" rx="6" />
  <text class="cell" x="807" y="106" text-anchor="middle">Medium</text>

  <text class="row" x="0" y="174">LightRAG</text>
  <rect class="yes"  x="270" y="144" width="145" height="48" rx="6" />
  <text class="cellv" x="342" y="174" text-anchor="middle">Strong</text>
  <rect class="no"   x="425" y="144" width="145" height="48" rx="6" />
  <text class="cell" x="497" y="174" text-anchor="middle">Weak</text>
  <rect class="part" x="580" y="144" width="145" height="48" rx="6" />
  <text class="cell" x="652" y="174" text-anchor="middle">Medium</text>
  <rect class="no"   x="735" y="144" width="145" height="48" rx="6" />
  <text class="cell" x="807" y="174" text-anchor="middle">Weak</text>

  <text class="row" x="0" y="242">Graphiti</text>
  <rect class="yes"  x="270" y="212" width="145" height="48" rx="6" />
  <text class="cellv" x="342" y="242" text-anchor="middle">Strong</text>
  <rect class="yes"  x="425" y="212" width="145" height="48" rx="6" />
  <text class="cellv" x="497" y="242" text-anchor="middle">Strong</text>
  <rect class="no"   x="580" y="212" width="145" height="48" rx="6" />
  <text class="cell" x="652" y="242" text-anchor="middle">Weak</text>
  <rect class="part" x="735" y="212" width="145" height="48" rx="6" />
  <text class="cell" x="807" y="242" text-anchor="middle">Medium</text>

  <text class="row" x="0" y="310">Cognee</text>
  <rect class="part" x="270" y="280" width="145" height="48" rx="6" />
  <text class="cell" x="342" y="310" text-anchor="middle">Medium</text>
  <rect class="part" x="425" y="280" width="145" height="48" rx="6" />
  <text class="cell" x="497" y="310" text-anchor="middle">Medium</text>
  <rect class="part" x="580" y="280" width="145" height="48" rx="6" />
  <text class="cell" x="652" y="310" text-anchor="middle">Medium</text>
  <rect class="yes"  x="735" y="280" width="145" height="48" rx="6" />
  <text class="cellv" x="807" y="310" text-anchor="middle">Strong</text>

  <rect class="yes"  x="0" y="352" width="18" height="18" rx="4" />
  <text class="sub" x="26" y="366">Strong</text>
  <rect class="part" x="96" y="352" width="18" height="18" rx="4" />
  <text class="sub" x="122" y="366">Medium</text>
  <rect class="no"   x="200" y="352" width="18" height="18" rx="4" />
  <text class="sub" x="226" y="366">Weak</text>
  <text class="sub" x="300" y="366">No row is strong on all four — the axes trade against each other by construction, not by maturity.</text>
</svg>
