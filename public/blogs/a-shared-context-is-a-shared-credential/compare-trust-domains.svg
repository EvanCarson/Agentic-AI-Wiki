<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="tdt tdd">
  <title id="tdt">Three readings of the same shared workspace</title>
  <desc id="tdd">Three columns comparing how a shared agent workspace is described in product terms, how its permissions are actually enforced, and what the resulting trust domain is. The product reading is a collaboration surface, the enforcement reading is per-connector scopes, and the effective reading is one principal holding the union of every member's authority.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ink); opacity: .75; letter-spacing: .05em; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .68; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .82; }
  </style>

  <text class="hd" x="40" y="30">AS DESCRIBED</text>
  <text class="hd" x="330" y="30">AS ENFORCED</text>
  <text class="hd" x="620" y="30">AS IT BEHAVES</text>

  <rect class="box" x="40" y="46" width="240" height="180" />
  <text class="label" x="56" y="74">A collaboration surface</text>
  <text class="sub" x="56" y="98">Shared pages, files and</text>
  <text class="sub" x="56" y="116">history so people and</text>
  <text class="sub" x="56" y="134">agents work from the</text>
  <text class="sub" x="56" y="152">same context.</text>
  <text class="sub" x="56" y="182">Mental model: a folder</text>
  <text class="sub" x="56" y="200">with a chat attached.</text>

  <rect class="adj" x="330" y="46" width="240" height="180" />
  <text class="label" x="346" y="74">Per-connector scopes</text>
  <text class="sub" x="346" y="98">Each app grant is checked</text>
  <text class="sub" x="346" y="116">at the call. Membership</text>
  <text class="sub" x="346" y="134">is checked at the read.</text>
  <text class="sub" x="346" y="152">Nothing is checked at</text>
  <text class="sub" x="346" y="170">the write.</text>
  <text class="sub" x="346" y="200">Mental model: an ACL.</text>

  <rect class="hero" x="620" y="46" width="240" height="180" />
  <text class="label-inv" x="636" y="74">One principal</text>
  <text class="sub-inv" x="636" y="98">Authority = the union of</text>
  <text class="sub-inv" x="636" y="116">every member's grants.</text>
  <text class="sub-inv" x="636" y="134">Caution = the minimum</text>
  <text class="sub-inv" x="636" y="152">of every member's.</text>
  <text class="sub-inv" x="636" y="182">Mental model: a service</text>
  <text class="sub-inv" x="636" y="200">account everyone can type</text>
  <text class="sub-inv" x="636" y="218">into.</text>

  <text class="sub" x="40" y="254">Defeated by: one link</text>
  <text class="sub" x="40" y="272">pasted in good faith.</text>
  <text class="sub" x="330" y="254">Defeated by: text, which</text>
  <text class="sub" x="330" y="272">is not a scoped call.</text>
  <text class="sub" x="620" y="254">Defeated by: nothing — this</text>
  <text class="sub" x="620" y="272">is the thing to design for.</text>
</svg>
