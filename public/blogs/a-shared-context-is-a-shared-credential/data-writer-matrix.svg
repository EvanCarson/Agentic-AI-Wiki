<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="wmt wmd">
  <title id="wmt">What each boundary in a shared agent workspace can and cannot stop</title>
  <desc id="wmd">A matrix with five candidate boundaries as rows — per-connector OAuth scope, workspace membership, per-agent credentials, per-block provenance and egress policy — scored across four columns: stops a bad connector call, stops a hostile paste, survives an always-on run, and ships today. Provenance and egress score strongest on containment but are the least available.</desc>
  <style>
    .cell-w { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .cell-m { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .cell-s { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .ct     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .ct-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .rowlab { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .collab { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: var(--ink); opacity: .75; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink); }
    .leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="title" x="20" y="28">Candidate boundaries in a shared agent workspace</text>

  <text class="collab" x="300" y="66">BAD CONNECTOR CALL</text>
  <text class="collab" x="450" y="66">HOSTILE PASTE</text>
  <text class="collab" x="600" y="66">ALWAYS-ON RUN</text>
  <text class="collab" x="750" y="66">SHIPS TODAY</text>

  <text class="rowlab" x="20" y="100">Per-connector OAuth scope</text>
  <rect class="cell-s" x="295" y="82" width="140" height="26" />
  <text class="ct-inv" x="305" y="99">Strong</text>
  <rect class="cell-w" x="445" y="82" width="140" height="26" />
  <text class="ct" x="455" y="99">Weak — text is not a call</text>
  <rect class="cell-m" x="595" y="82" width="140" height="26" />
  <text class="ct" x="605" y="99">Medium</text>
  <rect class="cell-s" x="745" y="82" width="135" height="26" />
  <text class="ct-inv" x="755" y="99">Yes</text>

  <text class="rowlab" x="20" y="148">Workspace membership</text>
  <rect class="cell-w" x="295" y="130" width="140" height="26" />
  <text class="ct" x="305" y="147">Weak</text>
  <rect class="cell-m" x="445" y="130" width="140" height="26" />
  <text class="ct" x="455" y="147">Medium — insiders only</text>
  <rect class="cell-w" x="595" y="130" width="140" height="26" />
  <text class="ct" x="605" y="147">Weak</text>
  <rect class="cell-s" x="745" y="130" width="135" height="26" />
  <text class="ct-inv" x="755" y="147">Yes</text>

  <text class="rowlab" x="20" y="196">Per-agent credentials</text>
  <rect class="cell-s" x="295" y="178" width="140" height="26" />
  <text class="ct-inv" x="305" y="195">Strong</text>
  <rect class="cell-w" x="445" y="178" width="140" height="26" />
  <text class="ct" x="455" y="195">Weak</text>
  <rect class="cell-s" x="595" y="178" width="140" height="26" />
  <text class="ct-inv" x="605" y="195">Strong</text>
  <rect class="cell-m" x="745" y="178" width="135" height="26" />
  <text class="ct" x="755" y="195">Partly</text>

  <text class="rowlab" x="20" y="244">Per-block provenance</text>
  <rect class="cell-m" x="295" y="226" width="140" height="26" />
  <text class="ct" x="305" y="243">Medium</text>
  <rect class="cell-s" x="445" y="226" width="140" height="26" />
  <text class="ct-inv" x="455" y="243">Strong</text>
  <rect class="cell-s" x="595" y="226" width="140" height="26" />
  <text class="ct-inv" x="605" y="243">Strong</text>
  <rect class="cell-w" x="745" y="226" width="135" height="26" />
  <text class="ct" x="755" y="243">No</text>

  <text class="rowlab" x="20" y="292">Egress policy on the agent</text>
  <rect class="cell-m" x="295" y="274" width="140" height="26" />
  <text class="ct" x="305" y="291">Medium</text>
  <rect class="cell-m" x="445" y="274" width="140" height="26" />
  <text class="ct" x="455" y="291">Medium</text>
  <rect class="cell-s" x="595" y="274" width="140" height="26" />
  <text class="ct-inv" x="605" y="291">Strong</text>
  <rect class="cell-w" x="745" y="274" width="135" height="26" />
  <text class="ct" x="755" y="291">Not on hosted runtimes</text>

  <rect class="cell-s" x="20" y="334" width="16" height="16" />
  <text class="leg" x="44" y="346">Strong</text>
  <rect class="cell-m" x="110" y="334" width="16" height="16" />
  <text class="leg" x="134" y="346">Medium</text>
  <rect class="cell-w" x="205" y="334" width="16" height="16" />
  <text class="leg" x="229" y="346">Weak / absent</text>
  <text class="leg" x="340" y="346">The two rows that contain the actual failure are the two you cannot buy.</text>
</svg>
