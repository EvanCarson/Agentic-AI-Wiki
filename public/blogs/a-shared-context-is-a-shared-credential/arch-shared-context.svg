<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="scst scsd">
  <title id="scst">A shared workspace as a single context surface with many writers</title>
  <desc id="scsd">Four writers — two people, a chat assistant and an always-on agent — all read from and write to one shared context store in the middle. The agent's own cloud computer, browser and connector fan-out hang off it on the right, so anything written into the shared store can reach any connector the agent holds.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .hd    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ink); opacity: .75; letter-spacing: .06em; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#scarr); }
    .arrow2 { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#scarr); marker-start: url(#scarr); }
    .dash  { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 4; opacity: .55; }
  </style>
  <defs>
    <marker id="scarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="hd" x="20" y="28">WRITERS</text>
  <text class="hd" x="330" y="28">ONE CONTEXT</text>
  <text class="hd" x="640" y="28">REACH</text>

  <rect class="box" x="20" y="48" width="200" height="60" />
  <text class="label" x="36" y="74">Teammate A</text>
  <text class="sub" x="36" y="94">pastes a link, a doc, a ticket</text>

  <rect class="box" x="20" y="128" width="200" height="60" />
  <text class="label" x="36" y="154">Teammate B</text>
  <text class="sub" x="36" y="174">different role, different scopes</text>

  <rect class="adj" x="20" y="208" width="200" height="60" />
  <text class="label" x="36" y="234">Chat assistant</text>
  <text class="sub" x="36" y="254">summarises, writes back</text>

  <rect class="adj" x="20" y="288" width="200" height="60" />
  <text class="label" x="36" y="314">Coding agent</text>
  <text class="sub" x="36" y="334">commits, opens PRs</text>

  <rect class="hero" x="20" y="368" width="200" height="72" />
  <text class="label-inv" x="36" y="394">Always-on agent</text>
  <text class="sub-inv" x="36" y="414">runs with no one watching,</text>
  <text class="sub-inv" x="36" y="430">on its own schedule</text>

  <rect class="hero" x="330" y="120" width="220" height="250" />
  <text class="label-inv" x="346" y="150">Shared context store</text>
  <text class="sub-inv" x="346" y="174">pages · files · decisions</text>
  <text class="sub-inv" x="346" y="194">chat history · uploads</text>
  <text class="sub-inv" x="346" y="222">every writer's bytes,</text>
  <text class="sub-inv" x="346" y="242">one flat surface</text>
  <text class="sub-inv" x="346" y="272">no per-block author</text>
  <text class="sub-inv" x="346" y="292">label on the read path</text>
  <text class="sub-inv" x="346" y="326">read by everyone</text>
  <text class="sub-inv" x="346" y="346">who can read anything</text>

  <path class="arrow2" d="M 224 78 C 280 78 290 190 326 210" />
  <path class="arrow2" d="M 224 158 C 280 158 292 200 326 220" />
  <path class="arrow2" d="M 224 238 C 275 238 300 240 326 240" />
  <path class="arrow2" d="M 224 318 C 280 318 292 280 326 262" />
  <path class="arrow2" d="M 224 404 C 285 404 295 300 326 282" />

  <rect class="box" x="640" y="70" width="240" height="56" />
  <text class="label" x="656" y="94">Its own cloud computer</text>
  <text class="sub" x="656" y="114">shell, filesystem, state</text>

  <rect class="box" x="640" y="146" width="240" height="56" />
  <text class="label" x="656" y="170">Its own browser</text>
  <text class="sub" x="656" y="190">logged in, cookies persist</text>

  <rect class="box" x="640" y="222" width="240" height="56" />
  <text class="label" x="656" y="246">Connectors</text>
  <text class="sub" x="656" y="266">thousands of apps, OAuth scopes</text>

  <rect class="box" x="640" y="298" width="240" height="56" />
  <text class="label" x="656" y="322">Messaging surfaces</text>
  <text class="sub" x="656" y="342">chat, Slack, Teams</text>

  <path class="arrow" d="M 554 230 C 590 230 600 110 636 98" />
  <path class="arrow" d="M 554 238 C 590 238 604 180 636 174" />
  <path class="arrow" d="M 554 248 C 592 248 604 246 636 250" />
  <path class="arrow" d="M 554 258 C 590 258 604 312 636 326" />

  <rect class="box" x="330" y="400" width="550" height="72" />
  <text class="label" x="346" y="426">The boundary that is enforced: per-connector OAuth scope</text>
  <text class="sub" x="346" y="448">The boundary that decides the outcome: who may write into the shared store —</text>
  <text class="sub" x="346" y="464">because the least careful writer supplies text every other member's agent will act on.</text>

  <path class="dash" d="M 320 40 L 320 480" />
  <path class="dash" d="M 610 40 L 610 390" />
</svg>
