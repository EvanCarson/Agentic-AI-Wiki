<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Firecrawl architecture</title>
  <desc id="d">An agent calls Firecrawl, which searches and then scrapes each result, rendering JavaScript and cleaning the DOM, and returns full-page Markdown — the largest payload of the four and the one that most needs truncation.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .lane        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; opacity: .6; text-anchor: middle; letter-spacing: .06em; }
    .box         { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj         { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero        { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label       { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub         { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .sub-inv     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .85; text-anchor: middle; }
    .arrow       { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .arrow-note  { font-family: var(--font-mono), ui-monospace, monospace; font-size: 10px; fill: currentColor; opacity: .65; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>


  <text class="chart-title" x="450" y="30">Firecrawl — search as the front door to a scraper</text>
  <text class="lane" x="140" y="62">YOUR AGENT</text>
  <rect class="box" x="15" y="82" width="250" height="76" rx="8" />
  <text class="label" x="140" y="108">Agent step</text>
  <text class="sub" x="140" y="128">One query string,</text>
  <text class="sub" x="140" y="144">a top-k, a budget</text>
  <text class="lane" x="450" y="62">THE API</text>
  <rect class="hero" x="325" y="82" width="250" height="92" rx="8" />
  <text class="label-inv" x="450" y="108">Firecrawl</text>
  <text class="sub-inv" x="450" y="128">Search, then scrape each hit</text>
  <text class="sub-inv" x="450" y="144">Renders JS, strips chrome</text>
  <text class="sub-inv" x="450" y="160">Flat credit per page</text>
  <text class="lane" x="760" y="62">WHAT COMES BACK</text>
  <rect class="adj" x="635" y="82" width="250" height="76" rx="8" />
  <text class="label" x="760" y="108">Full-page Markdown</text>
  <text class="sub" x="760" y="128">Everything on the page,</text>
  <text class="sub" x="760" y="144">cleaned but complete</text>
  <rect class="box" x="635" y="180" width="250" height="76" rx="8" />
  <text class="label" x="760" y="206">Your truncation</text>
  <text class="sub" x="760" y="226">Now mandatory, not</text>
  <text class="sub" x="760" y="242">an optimisation</text>
  <path class="arrow" d="M 268 150 L 322 150" />
  <path class="arrow" d="M 578 150 L 632 150" />
</svg>
