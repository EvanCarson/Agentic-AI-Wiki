<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Capability matrix across the four search APIs</title>
  <desc id="d">A four-by-five grid scoring Brave, Exa, Tavily and Firecrawl on index independence, semantic retrieval, full-page extraction, answer synthesis, and how cheap their default response is in context tokens.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .scale-num    { font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .scale-num-inv{ font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>


  <text class="chart-title" x="450" y="28">Where each one leans hardest</text>
  <text class="body-text" x="238" y="62" style="font-weight:600">Independent</text>
  <text class="body-text" x="238" y="76" style="font-weight:600">index</text>
  <text class="body-text" x="378" y="62" style="font-weight:600">Semantic</text>
  <text class="body-text" x="378" y="76" style="font-weight:600">retrieval</text>
  <text class="body-text" x="518" y="62" style="font-weight:600">Full-page</text>
  <text class="body-text" x="518" y="76" style="font-weight:600">Markdown</text>
  <text class="body-text" x="658" y="62" style="font-weight:600">Answer</text>
  <text class="body-text" x="658" y="76" style="font-weight:600">synthesis</text>
  <text class="body-text" x="798" y="62" style="font-weight:600">Cheap in</text>
  <text class="body-text" x="798" y="76" style="font-weight:600">context</text>
  <text class="body-text" x="154" y="128" text-anchor="end" style="font-size:13px;font-weight:600">Brave</text>
  <rect class="card-accent" x="171" y="96" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="238" y="128">Own crawl</text>
  <rect class="card-neutral" x="311" y="96" width="134" height="56" rx="6" />
  <text class="body-text" x="378" y="128">Keyword</text>
  <rect class="card-soft" x="451" y="96" width="134" height="56" rx="6" />
  <text class="body-text" x="518" y="121">Extra</text>
  <text class="body-text" x="518" y="135">call</text>
  <rect class="card-neutral" x="591" y="96" width="134" height="56" rx="6" />
  <text class="body-text" x="658" y="128">No</text>
  <rect class="card-accent" x="731" y="96" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="798" y="128">Lowest</text>
  <text class="body-text" x="154" y="192" text-anchor="end" style="font-size:13px;font-weight:600">Exa</text>
  <rect class="card-accent" x="171" y="160" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="238" y="192">Own crawl</text>
  <rect class="card-accent" x="311" y="160" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="378" y="192">Neural</text>
  <rect class="card-soft" x="451" y="160" width="134" height="56" rx="6" />
  <text class="body-text" x="518" y="185">Text</text>
  <text class="body-text" x="518" y="199">mode</text>
  <rect class="card-soft" x="591" y="160" width="134" height="56" rx="6" />
  <text class="body-text" x="658" y="192">Highlights</text>
  <rect class="card-soft" x="731" y="160" width="134" height="56" rx="6" />
  <text class="body-text" x="798" y="192">Medium</text>
  <text class="body-text" x="154" y="256" text-anchor="end" style="font-size:13px;font-weight:600">Tavily</text>
  <rect class="card-soft" x="171" y="224" width="134" height="56" rx="6" />
  <text class="body-text" x="238" y="256">Hybrid</text>
  <rect class="card-soft" x="311" y="224" width="134" height="56" rx="6" />
  <text class="body-text" x="378" y="256">Re-ranked</text>
  <rect class="card-soft" x="451" y="224" width="134" height="56" rx="6" />
  <text class="body-text" x="518" y="249">Advanced</text>
  <text class="body-text" x="518" y="263">mode</text>
  <rect class="card-accent" x="591" y="224" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="658" y="256">Yes</text>
  <rect class="card-soft" x="731" y="224" width="134" height="56" rx="6" />
  <text class="body-text" x="798" y="256">Medium</text>
  <text class="body-text" x="154" y="320" text-anchor="end" style="font-size:13px;font-weight:600">Firecrawl</text>
  <rect class="card-neutral" x="171" y="288" width="134" height="56" rx="6" />
  <text class="body-text" x="238" y="320">Aggregates</text>
  <rect class="card-neutral" x="311" y="288" width="134" height="56" rx="6" />
  <text class="body-text" x="378" y="320">Keyword</text>
  <rect class="card-accent" x="451" y="288" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="518" y="320">Native</text>
  <rect class="card-neutral" x="591" y="288" width="134" height="56" rx="6" />
  <text class="body-text" x="658" y="320">No</text>
  <rect class="card-neutral" x="731" y="288" width="134" height="56" rx="6" />
  <text class="body-text" x="798" y="320">Highest</text>
  <rect class="card-accent" x="300" y="367" width="16" height="14" rx="3" />
  <text class="body-text" x="322" y="378" text-anchor="start">Strong</text>
  <rect class="card-soft" x="410" y="367" width="16" height="14" rx="3" />
  <text class="body-text" x="432" y="378" text-anchor="start">Partial</text>
  <rect class="card-neutral" x="520" y="367" width="16" height="14" rx="3" />
  <text class="body-text" x="542" y="378" text-anchor="start">Not the job</text>
</svg>
