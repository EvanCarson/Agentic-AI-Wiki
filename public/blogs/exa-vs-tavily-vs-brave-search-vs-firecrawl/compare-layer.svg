<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Which layer of the retrieval stack each API sells</title>
  <desc id="d">Four columns showing that Brave sells an index, Exa sells retrieval by meaning, Tavily sells a condensed answer, and Firecrawl sells page content — increasing amounts of work done for you, and increasing tokens returned.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .scale-num    { font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .scale-num-inv{ font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>


  <text class="chart-title" x="450" y="28">What you are actually buying</text>

  <rect class="card-neutral" x="10" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="115" y="72">Brave</text>
  <text class="scale-num" x="115" y="110">Index</text>
  <text class="body-text" x="115" y="140">An independent crawl and</text>
  <text class="body-text" x="115" y="158">a ranked list of links.</text>
  <text class="body-text" x="115" y="176"></text>
  <text class="body-text" x="115" y="194">Everything after the link</text>
  <text class="body-text" x="115" y="212">is still your code.</text>

  <rect class="card-soft" x="230" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="335" y="72">Exa</text>
  <text class="scale-num" x="335" y="110">Meaning</text>
  <text class="body-text" x="335" y="140">Retrieval keyed on what a</text>
  <text class="body-text" x="335" y="158">page is about, plus</text>
  <text class="body-text" x="335" y="176">find-similar from a URL.</text>
  <text class="body-text" x="335" y="194"></text>
  <text class="body-text" x="335" y="212">Text is opt-in.</text>

  <rect class="card-soft" x="450" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="555" y="72">Tavily</text>
  <text class="scale-num" x="555" y="110">Answer</text>
  <text class="body-text" x="555" y="140">Aggregated results, model-</text>
  <text class="body-text" x="555" y="158">condensed into citation-</text>
  <text class="body-text" x="555" y="176">shaped content.</text>
  <text class="body-text" x="555" y="194"></text>
  <text class="body-text" x="555" y="212">Someone else&#x27;s synthesis.</text>

  <rect class="card-accent" x="670" y="44" width="210" height="230" rx="8" />
  <text class="col-head-inv" x="775" y="72">Firecrawl</text>
  <text class="scale-num-inv" x="775" y="110">Pages</text>
  <text class="body-text-inv" x="775" y="140">Search as the entrance to</text>
  <text class="body-text-inv" x="775" y="158">a renderer and cleaner.</text>
  <text class="body-text-inv" x="775" y="176"></text>
  <text class="body-text-inv" x="775" y="194">You get the whole page,</text>
  <text class="body-text-inv" x="775" y="212">whether you wanted it or not.</text>
</svg>
