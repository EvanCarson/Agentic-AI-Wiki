<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-labelledby="t d">
  <title id="t">Approximate context cost per search result</title>
  <desc id="d">Horizontal bar chart comparing the rough size of a single default result from each API in model tokens: Brave snippet around 200, Tavily basic around 500, Exa with text around 2,000, Firecrawl full-page Markdown around 8,000.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .row-label    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: end; }
    .value-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: start; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .scale-num    { font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .scale-num-inv{ font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>


  <text class="chart-title" x="490" y="30">Roughly what one result costs your context window</text>
  <line x1="362" y1="60" x2="362" y2="330" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="525" y1="60" x2="525" y2="330" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="688" y1="60" x2="688" y2="330" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="850" y1="60" x2="850" y2="330" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" stroke-dasharray="3 4" />
  <rect x="200" y="78" width="16" height="36" rx="4" fill="var(--accent, #d4421e)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="row-label" x="186" y="101" text-anchor="end" style="font-size:13px;font-weight:600">Brave (snippet)</text>
  <text class="value-label" x="228" y="101" text-anchor="start" style="font-size:13px;font-weight:600">~200 tokens</text>
  <rect x="200" y="140" width="41" height="36" rx="4" fill="var(--accent-soft, #f5c5b8)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="row-label" x="186" y="163" text-anchor="end" style="font-size:13px;font-weight:600">Tavily (basic)</text>
  <text class="value-label" x="253" y="163" text-anchor="start" style="font-size:13px;font-weight:600">~500 tokens</text>
  <rect x="200" y="202" width="162" height="36" rx="4" fill="var(--accent-soft, #f5c5b8)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="row-label" x="186" y="225" text-anchor="end" style="font-size:13px;font-weight:600">Exa (with text)</text>
  <text class="value-label" x="374" y="225" text-anchor="start" style="font-size:13px;font-weight:600">~2,000 tokens</text>
  <rect x="200" y="264" width="650" height="36" rx="4" fill="var(--surface, #f0ede8)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="row-label" x="186" y="287" text-anchor="end" style="font-size:13px;font-weight:600">Firecrawl (page)</text>
  <text class="value-label" x="862" y="287" text-anchor="start" style="font-size:13px;font-weight:600">~8,000 tokens</text>
  <text class="body-text" x="490" y="362" style="opacity:.7">Order-of-magnitude sizes for each API&#x27;s default response shape — all four can be tuned up or down.</text>
</svg>
