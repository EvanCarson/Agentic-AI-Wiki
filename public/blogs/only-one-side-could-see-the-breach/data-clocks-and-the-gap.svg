<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ct cd">
  <title id="ct">Days from access to disclosure, against the statutory clocks</title>
  <desc id="cd">A horizontal bar chart measured in days from the 18 June 2026 access. The operator's own discovery came at roughly eight weeks, notification at 84 days, referral to the Australian Signals Directorate at 89 days and public disclosure at 98 days. The reporting clocks that exist are far shorter — 30 days to assess a notifiable data breach in Australia, 15 days for a serious incident under the EU AI Act and 2 days where critical infrastructure is disrupted — and none of them applied to this incident.</desc>
  <style>
    .hero   { fill: var(--accent, #d4421e); }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .neutral{ fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .grid   { stroke: var(--ink); stroke-width: .5; opacity: .25; stroke-dasharray: 3 4; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .35; }
  </style>

  <text class="title" x="20" y="26">Days from access (18 June 2026)</text>

  <line class="grid" x1="425" y1="44" x2="425" y2="330" />
  <line class="grid" x1="550" y1="44" x2="550" y2="330" />
  <line class="grid" x1="675" y1="44" x2="675" y2="330" />
  <line class="grid" x1="800" y1="44" x2="800" y2="330" />
  <text class="sub" x="425" y="350" text-anchor="middle">25</text>
  <text class="sub" x="550" y="350" text-anchor="middle">50</text>
  <text class="sub" x="675" y="350" text-anchor="middle">75</text>
  <text class="sub" x="800" y="350" text-anchor="middle">100</text>

  <text class="sub" x="20" y="60">What actually happened</text>

  <text class="row" x="20" y="86">Operator finds it in its own records</text>
  <rect class="adj" x="300" y="70" width="280" height="22" rx="3" />
  <text class="val" x="588" y="86">≈8 weeks</text>

  <text class="row" x="20" y="122">Services Australia notified by email</text>
  <rect class="adj" x="300" y="106" width="420" height="22" rx="3" />
  <text class="val" x="728" y="122">84</text>

  <text class="row" x="20" y="158">Referred to the ASD cyber centre</text>
  <rect class="adj" x="300" y="142" width="445" height="22" rx="3" />
  <text class="val" x="753" y="158">89</text>

  <text class="row" x="20" y="194">Disclosed publicly by the PM</text>
  <rect class="hero" x="300" y="178" width="490" height="22" rx="3" />
  <text class="val" x="798" y="194">98</text>

  <line class="rule" x1="20" y1="220" x2="880" y2="220" />
  <text class="sub" x="20" y="242">Clocks that exist — none of them engaged here</text>

  <text class="row" x="20" y="268">AU notifiable breach: assess within</text>
  <rect class="neutral" x="300" y="252" width="150" height="22" rx="3" />
  <text class="val" x="458" y="268">30</text>

  <text class="row" x="20" y="304">EU AI Act serious incident</text>
  <rect class="neutral" x="300" y="288" width="75" height="22" rx="3" />
  <text class="val" x="383" y="304">15</text>

  <text class="row" x="20" y="326">EU AI Act, infrastructure disrupted</text>
  <rect class="neutral" x="300" y="312" width="10" height="18" rx="2" />
  <text class="val" x="318" y="326">2</text>

  <rect class="hero" x="20" y="370" width="14" height="14" rx="2" />
  <text class="sub" x="42" y="382">Public disclosure</text>
  <rect class="adj" x="180" y="370" width="14" height="14" rx="2" />
  <text class="sub" x="202" y="382">Private steps, operator-driven</text>
  <rect class="neutral" x="420" y="370" width="14" height="14" rx="2" />
  <text class="sub" x="442" y="382">Statutory deadline, not engaged</text>
</svg>
