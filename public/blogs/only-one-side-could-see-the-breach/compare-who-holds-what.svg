<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="wt wd">
  <title id="wt">Who sees, who holds, whose clock starts — across three incident shapes</title>
  <desc id="wd">Three columns compare a human intrusion, an insider mistake and an autonomous agent overreach. For a human intrusion and an insider mistake, the party that sees the crossing, the party that holds the trace and the party whose reporting clock starts are the same organisation. For an agent overreach the signal sits with the operator, the affected party holds only successful responses, and no clock starts at all.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .col    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
  </style>

  <text class="title" x="20" y="26">Where the signal, the trace and the duty sit</text>

  <text class="col" x="300" y="58" text-anchor="middle">Human intrusion</text>
  <text class="col" x="530" y="58" text-anchor="middle">Insider mistake</text>
  <text class="col" x="770" y="58" text-anchor="middle">Agent overreach</text>

  <text class="row" x="20" y="96">Sees the crossing</text>
  <rect class="adj" x="190" y="78" width="220" height="28" />
  <text class="label" x="300" y="97" text-anchor="middle">The intruder, at once</text>
  <rect class="adj" x="420" y="78" width="220" height="28" />
  <text class="label" x="530" y="97" text-anchor="middle">Often the employer</text>
  <rect class="hero" x="650" y="78" width="230" height="28" />
  <text class="label-inv" x="765" y="97" text-anchor="middle">Nobody, in real time</text>

  <text class="row" x="20" y="146">Holds the trace</text>
  <rect class="box" x="190" y="128" width="220" height="28" />
  <text class="label" x="300" y="147" text-anchor="middle">Victim's logs</text>
  <rect class="box" x="420" y="128" width="220" height="28" />
  <text class="label" x="530" y="147" text-anchor="middle">Employer's logs</text>
  <rect class="hero" x="650" y="128" width="230" height="28" />
  <text class="label-inv" x="765" y="147" text-anchor="middle">The operator, elsewhere</text>

  <text class="row" x="20" y="196">Whose clock starts</text>
  <rect class="adj" x="190" y="178" width="220" height="28" />
  <text class="label" x="300" y="197" text-anchor="middle">Custodian's, on detection</text>
  <rect class="adj" x="420" y="178" width="220" height="28" />
  <text class="label" x="530" y="197" text-anchor="middle">Custodian's, on detection</text>
  <rect class="hero" x="650" y="178" width="230" height="28" />
  <text class="label-inv" x="765" y="197" text-anchor="middle">None</text>

  <text class="row" x="20" y="246">Established channel</text>
  <rect class="adj" x="190" y="228" width="220" height="28" />
  <text class="label" x="300" y="247" text-anchor="middle">CVD, 30 years of it</text>
  <rect class="adj" x="420" y="228" width="220" height="28" />
  <text class="label" x="530" y="247" text-anchor="middle">Internal IR</text>
  <rect class="hero" x="650" y="228" width="230" height="28" />
  <text class="label-inv" x="765" y="247" text-anchor="middle">A public mailbox</text>

  <rect class="hero" x="20" y="272" width="14" height="14" />
  <text class="row" x="42" y="284">Where the agent case has no counterpart in existing practice</text>
</svg>
