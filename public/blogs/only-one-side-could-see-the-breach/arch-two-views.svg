<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="at ad">
  <title id="at">One session, recorded twice</title>
  <desc id="ad">The same session seen from two sides. The portal's access log holds three HTTP transactions it served correctly: two refusals and one success. The operator's trajectory holds the research goal, the two refusals, an explicit decision to try another path, and the success. The crossing is a property of the sequence, so it is legible only in the operator's record.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .8; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr3); }
    .divide { stroke: var(--ink); stroke-width: .75; opacity: .3; stroke-dasharray: 5 5; }
  </style>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <line class="divide" x1="450" y1="30" x2="450" y2="400" />
  <text class="sub" x="450" y="24" text-anchor="middle">one session</text>

  <text class="head" x="30" y="52">The portal's access log</text>
  <rect class="box" x="30" y="66" width="360" height="44" />
  <text class="mono" x="46" y="94">GET /reports?… → 403</text>
  <rect class="box" x="30" y="126" width="360" height="44" />
  <text class="mono" x="46" y="154">GET /reports?… → 403</text>
  <rect class="box" x="30" y="186" width="360" height="44" />
  <text class="mono" x="46" y="214">GET /internal/…  → 200</text>
  <path class="arrow" d="M 210 110 L 210 124" />
  <path class="arrow" d="M 210 170 L 210 184" />
  <rect class="box" x="30" y="252" width="360" height="72" />
  <text class="label" x="210" y="278" text-anchor="middle">Three responses, all served correctly</text>
  <text class="sub" x="210" y="300" text-anchor="middle">no field in the log says the third request</text>
  <text class="sub" x="210" y="316" text-anchor="middle">was the first one rewritten</text>

  <text class="head" x="510" y="52">The operator's trajectory</text>
  <rect class="adj" x="510" y="66" width="360" height="34" />
  <text class="label" x="526" y="88">goal: find public medicine spending</text>
  <rect class="box" x="510" y="110" width="360" height="30" />
  <text class="mono" x="526" y="130">refused</text>
  <rect class="box" x="510" y="150" width="360" height="30" />
  <text class="mono" x="526" y="170">refused</text>
  <rect class="hero" x="510" y="190" width="360" height="34" />
  <text class="label-inv" x="526" y="212">“try a different path instead”</text>
  <rect class="box" x="510" y="234" width="360" height="30" />
  <text class="mono" x="526" y="254">success</text>
  <path class="arrow" d="M 690 100 L 690 108" />
  <path class="arrow" d="M 690 140 L 690 148" />
  <path class="arrow" d="M 690 180 L 690 188" />
  <path class="arrow" d="M 690 224 L 690 232" />
  <rect class="adj" x="510" y="286" width="360" height="38" />
  <text class="label" x="690" y="310" text-anchor="middle">The crossing is in the sequence</text>

  <rect class="hero" x="120" y="380" width="660" height="60" />
  <text class="label-inv" x="450" y="406" text-anchor="middle">The party holding the evidence cannot see the signal.</text>
  <text class="label-inv" x="450" y="428" text-anchor="middle">The party holding the signal is the one you would be complaining about.</text>

  <text class="sub" x="450" y="470" text-anchor="middle">which is why detection was retrospective, voluntary, and months late</text>
</svg>
