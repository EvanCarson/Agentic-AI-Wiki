<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="wtT wtD">
  <title id="wtT">Three distances between an upstream repository and the agent's context</title>
  <desc id="wtD">An upstream repository on the left feeds three paths into an agent context on the right. The top path serves files unchanged — llms.txt, docs, README — labelled GitMCP. The middle path runs an extraction and indexing step that produces per-library snippets, labelled Context7 and Ref. The bottom path runs a model over the repository to write a wiki, which is cached and served, labelled DeepWiki, with a note that errors on this path are fluent.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arrW); }
  </style>
  <defs>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="22">Upstream, extracted, or generated</text>

  <rect class="box" x="10" y="200" width="150" height="110" />
  <text class="label" x="85" y="242" text-anchor="middle">Upstream</text>
  <text class="label" x="85" y="262" text-anchor="middle">repository</text>
  <text class="sub" x="85" y="286" text-anchor="middle">written by humans</text>

  <path class="arrow" d="M 160 235 C 230 235, 240 110, 320 110" />
  <path class="arrow" d="M 160 255 L 320 255" />
  <path class="arrow" d="M 160 275 C 230 275, 240 400, 320 400" />

  <rect class="hero" x="325" y="70" width="240" height="80" />
  <text class="label-inv" x="445" y="102" text-anchor="middle">Served as-is</text>
  <text class="sub-inv" x="445" y="126" text-anchor="middle">llms.txt, docs, README</text>
  <text class="tag" x="580" y="116">GitMCP</text>

  <rect class="adj" x="325" y="215" width="240" height="80" />
  <text class="label" x="445" y="247" text-anchor="middle">Extracted and indexed</text>
  <text class="sub" x="445" y="271" text-anchor="middle">snippets, doc sections</text>
  <text class="tag" x="580" y="253">Context7, Ref</text>

  <rect class="box" x="325" y="360" width="240" height="80" />
  <text class="label" x="445" y="392" text-anchor="middle">A model writes a wiki</text>
  <text class="sub" x="445" y="416" text-anchor="middle">then it is cached and served</text>
  <text class="tag" x="580" y="398">DeepWiki</text>

  <path class="arrow" d="M 565 110 C 640 110, 650 225, 720 235" />
  <path class="arrow" d="M 565 255 L 720 255" />
  <path class="arrow" d="M 565 400 C 640 400, 650 285, 720 275" />

  <rect class="box" x="725" y="200" width="150" height="110" />
  <text class="label" x="800" y="242" text-anchor="middle">Agent</text>
  <text class="label" x="800" y="262" text-anchor="middle">context</text>
  <text class="sub" x="800" y="286" text-anchor="middle">cannot tell which</text>

  <text class="sub" x="325" y="466">Errors on the bottom path arrive in the same confident register as the truths.</text>
</svg>
