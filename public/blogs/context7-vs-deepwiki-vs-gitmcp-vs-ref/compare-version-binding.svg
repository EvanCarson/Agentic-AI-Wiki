<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="vbT vbD">
  <title id="vbT">How the documentation version gets chosen, in three setups</title>
  <desc id="vbD">Three columns. No documentation tool: the model answers from training data, so the version is whatever it absorbed, unknown and unstated. A documentation tool with no version in the query: the answer is current upstream, which is wrong in a new direction for a codebase pinned to an older release. The harness resolves the version from the lockfile and passes it into the query: the answer matches the code that will actually run.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .92; }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Which version does the answer describe?</text>

  <rect class="box" x="35" y="48" width="250" height="96" />
  <text class="hd" x="160" y="76" text-anchor="middle">No docs tool</text>
  <text class="cell" x="160" y="100" text-anchor="middle">The model answers from</text>
  <text class="cell" x="160" y="118" text-anchor="middle">training data, at whatever</text>
  <text class="cell" x="160" y="136" text-anchor="middle">version it absorbed.</text>

  <rect class="adj" x="325" y="48" width="250" height="96" />
  <text class="hd" x="450" y="76" text-anchor="middle">Docs tool, no version</text>
  <text class="cell" x="450" y="100" text-anchor="middle">The index returns current</text>
  <text class="cell" x="450" y="118" text-anchor="middle">upstream, whatever the</text>
  <text class="cell" x="450" y="136" text-anchor="middle">repository is pinned to.</text>

  <rect class="hero" x="625" y="48" width="250" height="96" />
  <text class="hd-inv" x="750" y="76" text-anchor="middle">Version from the lockfile</text>
  <text class="cell-inv" x="750" y="100" text-anchor="middle">Your harness resolves the</text>
  <text class="cell-inv" x="750" y="118" text-anchor="middle">pin and passes it in as a</text>
  <text class="cell-inv" x="750" y="136" text-anchor="middle">parameter, not a sentence.</text>

  <text class="lane" x="160" y="176" text-anchor="middle">Failure mode</text>
  <text class="lane" x="450" y="176" text-anchor="middle">Failure mode</text>
  <text class="lane" x="750" y="176" text-anchor="middle">Failure mode</text>

  <rect class="box" x="35" y="186" width="250" height="80" />
  <text class="cell" x="160" y="214" text-anchor="middle">Wrong in a random</text>
  <text class="cell" x="160" y="236" text-anchor="middle">direction, and stale.</text>

  <rect class="box" x="325" y="186" width="250" height="80" />
  <text class="cell" x="450" y="214" text-anchor="middle">Wrong in a specific</text>
  <text class="cell" x="450" y="236" text-anchor="middle">direction, and plausible.</text>

  <rect class="box" x="625" y="186" width="250" height="80" />
  <text class="cell" x="750" y="214" text-anchor="middle">Missing entry for the pin —</text>
  <text class="cell" x="750" y="236" text-anchor="middle">which you can detect.</text>
</svg>
