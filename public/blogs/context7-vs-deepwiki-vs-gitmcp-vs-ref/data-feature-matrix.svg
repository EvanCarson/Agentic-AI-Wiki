<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmT fmD">
  <title id="fmT">Feature matrix: four documentation servers across four axes</title>
  <desc id="fmD">Rows are Context7, DeepWiki, GitMCP and Ref. Text provenance: Context7 extracted from upstream, DeepWiki model-written, GitMCP upstream files served as-is, Ref extracted from upstream. Version targeting: Context7 per-version indexes, DeepWiki an index snapshot, GitMCP whichever branch or tag the URL names, Ref whatever the query matched. Private sources: Ref supports them, GitMCP by self-hosting, Context7 and DeepWiki are public catalogues. Self-hostable: GitMCP yes, Context7 server only, Ref no, DeepWiki no.</desc>
  <style>
    .ttl     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .col     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .row     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .cell    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .lgd     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .s-hi    { fill: var(--accent, #d4421e); rx: 6; ry: 6; }
    .s-mid   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .s-lo    { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
  </style>

  <text class="ttl" x="0" y="22">Where the text comes from, and what you can pin</text>

  <text class="col" x="265" y="60" text-anchor="middle">Text provenance</text>
  <text class="col" x="440" y="60" text-anchor="middle">Version targeting</text>
  <text class="col" x="615" y="60" text-anchor="middle">Private sources</text>
  <text class="col" x="790" y="60" text-anchor="middle">Self-hostable</text>

  <text class="row" x="0" y="104">Context7</text>
  <rect class="s-mid" x="180" y="76" width="170" height="46" />
  <text class="cell" x="265" y="104" text-anchor="middle">Extracted</text>
  <rect class="s-hi" x="355" y="76" width="170" height="46" />
  <text class="cell-inv" x="440" y="104" text-anchor="middle">Per version</text>
  <rect class="s-lo" x="530" y="76" width="170" height="46" />
  <text class="cell" x="615" y="104" text-anchor="middle">Public catalogue</text>
  <rect class="s-mid" x="705" y="76" width="170" height="46" />
  <text class="cell" x="790" y="104" text-anchor="middle">Server, not index</text>

  <text class="row" x="0" y="174">DeepWiki</text>
  <rect class="s-lo" x="180" y="146" width="170" height="46" />
  <text class="cell" x="265" y="174" text-anchor="middle">Model-written</text>
  <rect class="s-lo" x="355" y="146" width="170" height="46" />
  <text class="cell" x="440" y="174" text-anchor="middle">Index snapshot</text>
  <rect class="s-lo" x="530" y="146" width="170" height="46" />
  <text class="cell" x="615" y="174" text-anchor="middle">Public repos only</text>
  <rect class="s-lo" x="705" y="146" width="170" height="46" />
  <text class="cell" x="790" y="174" text-anchor="middle">Hosted only</text>

  <text class="row" x="0" y="244">GitMCP</text>
  <rect class="s-hi" x="180" y="216" width="170" height="46" />
  <text class="cell-inv" x="265" y="244" text-anchor="middle">Upstream files</text>
  <rect class="s-mid" x="355" y="216" width="170" height="46" />
  <text class="cell" x="440" y="244" text-anchor="middle">Branch or tag</text>
  <rect class="s-mid" x="530" y="216" width="170" height="46" />
  <text class="cell" x="615" y="244" text-anchor="middle">By self-hosting</text>
  <rect class="s-hi" x="705" y="216" width="170" height="46" />
  <text class="cell-inv" x="790" y="244" text-anchor="middle">Yes</text>

  <text class="row" x="0" y="314">Ref</text>
  <rect class="s-mid" x="180" y="286" width="170" height="46" />
  <text class="cell" x="265" y="314" text-anchor="middle">Extracted</text>
  <rect class="s-lo" x="355" y="286" width="170" height="46" />
  <text class="cell" x="440" y="314" text-anchor="middle">Query match</text>
  <rect class="s-hi" x="530" y="286" width="170" height="46" />
  <text class="cell-inv" x="615" y="314" text-anchor="middle">Yes</text>
  <rect class="s-lo" x="705" y="286" width="170" height="46" />
  <text class="cell" x="790" y="314" text-anchor="middle">No</text>

  <rect class="s-hi" x="180" y="350" width="16" height="16" />
  <text class="lgd" x="204" y="363">Strongest on this axis</text>
  <rect class="s-mid" x="380" y="350" width="16" height="16" />
  <text class="lgd" x="404" y="363">Partial</text>
  <rect class="s-lo" x="530" y="350" width="16" height="16" />
  <text class="lgd" x="554" y="363">Not offered</text>
</svg>
