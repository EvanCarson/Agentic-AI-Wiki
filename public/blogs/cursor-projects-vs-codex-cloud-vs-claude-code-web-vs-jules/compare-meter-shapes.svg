<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="msT msD">
  <title id="msT">Three meter shapes and the distortion each one creates</title>
  <desc id="msD">Three columns. Capped counts, as in Jules: spend is predictable, and the distortion is over-stuffed tasks because a small task costs a whole slot. Shared allowance, as in Codex cloud and Claude Code on the web: no separate compute bill, and the distortion is background work starving the interactive session. Metered work, as in Cursor's usage pool and Devin's ACUs: cost tracks real consumption, and the distortion is that a stuck or fanned-out run costs the most.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .92; }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Three shapes, three distortions</text>

  <rect class="box" x="35" y="48" width="250" height="96" />
  <text class="hd" x="160" y="76" text-anchor="middle">Capped counts</text>
  <text class="cell" x="160" y="100" text-anchor="middle">Jules</text>
  <text class="cell" x="160" y="122" text-anchor="middle">Spend is predictable;</text>
  <text class="cell" x="160" y="138" text-anchor="middle">a slot is a slot.</text>

  <rect class="adj" x="325" y="48" width="250" height="96" />
  <text class="hd" x="450" y="76" text-anchor="middle">Shared allowance</text>
  <text class="cell" x="450" y="100" text-anchor="middle">Codex cloud · Claude Code web</text>
  <text class="cell" x="450" y="122" text-anchor="middle">No separate compute bill</text>
  <text class="cell" x="450" y="138" text-anchor="middle">and no separate budget.</text>

  <rect class="hero" x="625" y="48" width="250" height="96" />
  <text class="hd-inv" x="750" y="76" text-anchor="middle">Metered work</text>
  <text class="cell-inv" x="750" y="100" text-anchor="middle">Cursor pool · Devin ACUs</text>
  <text class="cell-inv" x="750" y="122" text-anchor="middle">Cost tracks what the run</text>
  <text class="cell-inv" x="750" y="138" text-anchor="middle">actually consumed.</text>

  <text class="lane" x="160" y="176" text-anchor="middle">The distortion</text>
  <text class="lane" x="450" y="176" text-anchor="middle">The distortion</text>
  <text class="lane" x="750" y="176" text-anchor="middle">The distortion</text>

  <rect class="box" x="35" y="186" width="250" height="80" />
  <text class="cell" x="160" y="214" text-anchor="middle">You over-stuff tasks,</text>
  <text class="cell" x="160" y="236" text-anchor="middle">and the diff gets unreviewable.</text>

  <rect class="box" x="325" y="186" width="250" height="80" />
  <text class="cell" x="450" y="214" text-anchor="middle">Background batches starve</text>
  <text class="cell" x="450" y="236" text-anchor="middle">the session you work in.</text>

  <rect class="box" x="625" y="186" width="250" height="80" />
  <text class="cell" x="750" y="214" text-anchor="middle">The runs going worst,</text>
  <text class="cell" x="750" y="236" text-anchor="middle">and the fan-outs, cost the most.</text>
</svg>
