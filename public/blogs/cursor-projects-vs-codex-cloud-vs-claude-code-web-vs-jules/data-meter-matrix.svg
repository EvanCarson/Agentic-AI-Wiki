<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="mmT mmD">
  <title id="mmT">What each meter is good and bad at</title>
  <desc id="mmD">Matrix with five rows — Cursor Projects, Codex cloud, Claude Code on the web, Jules and Devin — against four columns: fan-out is cheap, a stuck run is cheap, the budget is isolated from your other work, and the cap is predictable. Jules is strong on predictable caps and on a stuck run being cheap, but weak on fan-out. Claude Code on the web is strong on a stuck run being cheap and weak on budget isolation. Cursor Projects is weak on cap predictability because overage is billed in arrears. Devin is strong on budget isolation and weak on a stuck run being cheap.</desc>
  <style>
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .colhd  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .rowhd  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .9; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .lgd    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .strong { fill: var(--accent, #d4421e); stroke: none; rx: 4; ry: 4; }
  </style>

  <text class="ttl" x="0" y="20">Meter shape, scored four ways</text>

  <text class="colhd" x="288" y="52" text-anchor="middle">Fan-out is cheap</text>
  <text class="colhd" x="438" y="52" text-anchor="middle">Stuck run is cheap</text>
  <text class="colhd" x="588" y="52" text-anchor="middle">Budget is isolated</text>
  <text class="colhd" x="738" y="52" text-anchor="middle">Cap is predictable</text>

  <text class="rowhd" x="0" y="86">Cursor Projects</text>
  <rect class="weak" x="220" y="66" width="136" height="30" />
  <text class="cell" x="288" y="86" text-anchor="middle">Weak</text>
  <rect class="med" x="370" y="66" width="136" height="30" />
  <text class="cell" x="438" y="86" text-anchor="middle">Medium</text>
  <rect class="med" x="520" y="66" width="136" height="30" />
  <text class="cell" x="588" y="86" text-anchor="middle">Medium</text>
  <rect class="weak" x="670" y="66" width="136" height="30" />
  <text class="cell" x="738" y="86" text-anchor="middle">Weak (arrears)</text>

  <text class="rowhd" x="0" y="132">Codex cloud</text>
  <rect class="med" x="220" y="112" width="136" height="30" />
  <text class="cell" x="288" y="132" text-anchor="middle">Medium</text>
  <rect class="med" x="370" y="112" width="136" height="30" />
  <text class="cell" x="438" y="132" text-anchor="middle">Medium</text>
  <rect class="weak" x="520" y="112" width="136" height="30" />
  <text class="cell" x="588" y="132" text-anchor="middle">Weak (shared)</text>
  <rect class="med" x="670" y="112" width="136" height="30" />
  <text class="cell" x="738" y="132" text-anchor="middle">Medium</text>

  <text class="rowhd" x="0" y="178">Claude Code web</text>
  <rect class="med" x="220" y="158" width="136" height="30" />
  <text class="cell" x="288" y="178" text-anchor="middle">Medium</text>
  <rect class="strong" x="370" y="158" width="136" height="30" />
  <text class="cell-inv" x="438" y="178" text-anchor="middle">Strong (no VM fee)</text>
  <rect class="weak" x="520" y="158" width="136" height="30" />
  <text class="cell" x="588" y="178" text-anchor="middle">Weak (shared)</text>
  <rect class="med" x="670" y="158" width="136" height="30" />
  <text class="cell" x="738" y="178" text-anchor="middle">Medium</text>

  <text class="rowhd" x="0" y="224">Google Jules</text>
  <rect class="weak" x="220" y="204" width="136" height="30" />
  <text class="cell" x="288" y="224" text-anchor="middle">Weak (slot each)</text>
  <rect class="strong" x="370" y="204" width="136" height="30" />
  <text class="cell-inv" x="438" y="224" text-anchor="middle">Strong</text>
  <rect class="strong" x="520" y="204" width="136" height="30" />
  <text class="cell-inv" x="588" y="224" text-anchor="middle">Strong</text>
  <rect class="strong" x="670" y="204" width="136" height="30" />
  <text class="cell-inv" x="738" y="224" text-anchor="middle">Strong (hard count)</text>

  <text class="rowhd" x="0" y="270">Devin</text>
  <rect class="med" x="220" y="250" width="136" height="30" />
  <text class="cell" x="288" y="270" text-anchor="middle">Medium</text>
  <rect class="weak" x="370" y="250" width="136" height="30" />
  <text class="cell" x="438" y="270" text-anchor="middle">Weak (time)</text>
  <rect class="strong" x="520" y="250" width="136" height="30" />
  <text class="cell-inv" x="588" y="270" text-anchor="middle">Strong</text>
  <rect class="med" x="670" y="250" width="136" height="30" />
  <text class="cell" x="738" y="270" text-anchor="middle">Medium</text>

  <rect class="weak" x="220" y="316" width="18" height="18" />
  <text class="lgd" x="246" y="330">Weak</text>
  <rect class="med" x="310" y="316" width="18" height="18" />
  <text class="lgd" x="336" y="330">Medium</text>
  <rect class="strong" x="410" y="316" width="18" height="18" />
  <text class="lgd" x="436" y="330">Strong</text>

  <text class="lgd" x="0" y="372">No row wins. Each column is a different thing the meter makes you responsible for.</text>
</svg>
