<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="sbT sbD">
  <title id="sbT">What a cloud coding agent's sandbox can and cannot reach</title>
  <desc id="sbD">In the centre, a solid accent box is the cloud VM holding a clone of the repository at a chosen commit, a setup script and injected secrets. To its left, four reachable things: the repository tree, the dependency install, the test suite, and outbound network where policy allows. To its right, four unreachable things marked with dashed borders: local uncommitted files, a running dev server, local MCP servers, and anything on a private network. An arrow leaves the VM downward to a pull request.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .ghost  { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1.25; stroke-dasharray: 4 3; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#sbArr); }
  </style>
  <defs>
    <marker id="sbArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="20">The boundary is the same everywhere</text>

  <text class="lane" x="20" y="52">Inside the boundary</text>
  <rect class="box" x="20" y="64" width="220" height="44" />
  <text class="cell" x="130" y="91" text-anchor="middle">Repo tree at a commit</text>
  <rect class="box" x="20" y="120" width="220" height="44" />
  <text class="cell" x="130" y="147" text-anchor="middle">Dependency install</text>
  <rect class="box" x="20" y="176" width="220" height="44" />
  <text class="cell" x="130" y="203" text-anchor="middle">Test suite</text>
  <rect class="box" x="20" y="232" width="220" height="44" />
  <text class="cell" x="130" y="252" text-anchor="middle">Outbound network,</text>
  <text class="cell" x="130" y="268" text-anchor="middle">where policy allows</text>

  <path class="arrow" d="M 244 170 L 314 170" />

  <rect class="hero" x="320" y="110" width="260" height="120" />
  <text class="hd-inv" x="450" y="142" text-anchor="middle">Cloud VM</text>
  <text class="cell-inv" x="450" y="168" text-anchor="middle">Clone of the repository,</text>
  <text class="cell-inv" x="450" y="190" text-anchor="middle">your setup script,</text>
  <text class="cell-inv" x="450" y="212" text-anchor="middle">secrets you injected.</text>

  <path class="arrow" d="M 586 170 L 656 170" />

  <text class="lane" x="660" y="52">Unreachable, everywhere</text>
  <rect class="ghost" x="660" y="64" width="220" height="44" />
  <text class="cell" x="770" y="91" text-anchor="middle">Local uncommitted files</text>
  <rect class="ghost" x="660" y="120" width="220" height="44" />
  <text class="cell" x="770" y="147" text-anchor="middle">A running dev server</text>
  <rect class="ghost" x="660" y="176" width="220" height="44" />
  <text class="cell" x="770" y="203" text-anchor="middle">Local MCP servers</text>
  <rect class="ghost" x="660" y="232" width="220" height="44" />
  <text class="cell" x="770" y="259" text-anchor="middle">Your private network</text>

  <path class="arrow" d="M 450 234 L 450 306" />

  <rect class="box" x="320" y="316" width="260" height="62" />
  <text class="hd" x="450" y="342" text-anchor="middle">A pull request</text>
  <text class="cell" x="450" y="364" text-anchor="middle">the one integration point they all share</text>

  <text class="lane" x="0" y="420">Which half of your backlog is repository-shaped decides how useful any of these are —</text>
  <text class="lane" x="0" y="442">and that fraction is set by the boundary above, not by the model inside it.</text>
</svg>
