<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Where each cloud-browser provider leans hardest</title>
  <desc id="d">A four-by-four matrix scoring Browserbase, Steel, Hyperbrowser and Anchor Browser on openness and self-hosting, credential and identity handling, anti-bot evasion, and compliance and isolation posture. Steel leads on openness, Anchor on credentials and compliance, Hyperbrowser on anti-bot, and Browserbase sits in the middle on all four.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-inv     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: start; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">Four providers, four axes</text>

  <text class="col-head" x="290" y="64">Open &amp; self-host</text>
  <text class="col-head" x="450" y="64">Credentials &amp; identity</text>
  <text class="col-head" x="610" y="64">Anti-bot evasion</text>
  <text class="col-head" x="770" y="64">Compliance &amp; isolation</text>

  <text class="row-head" x="200" y="104">Browserbase</text>
  <rect class="card-soft" x="215" y="78" width="150" height="40" rx="6" />
  <text class="body-text" x="290" y="97">Framework open</text>
  <text class="body-text" x="290" y="111">(Stagehand, MIT)</text>
  <rect class="card-soft" x="375" y="78" width="150" height="40" rx="6" />
  <text class="body-text" x="450" y="103">Managed profiles</text>
  <rect class="card-soft" x="535" y="78" width="150" height="40" rx="6" />
  <text class="body-text" x="610" y="103">Offered</text>
  <rect class="card-soft" x="695" y="78" width="150" height="40" rx="6" />
  <text class="body-text" x="770" y="103">Standard cloud</text>

  <text class="row-head" x="200" y="164">Steel</text>
  <rect class="card-accent" x="215" y="138" width="150" height="40" rx="6" />
  <text class="body-inv" x="290" y="157">Apache 2.0 server,</text>
  <text class="body-inv" x="290" y="171">fully self-hostable</text>
  <rect class="card-soft" x="375" y="138" width="150" height="40" rx="6" />
  <text class="body-text" x="450" y="157">Profiles across</text>
  <text class="body-text" x="450" y="171">local and cloud</text>
  <rect class="card-neutral" x="535" y="138" width="150" height="40" rx="6" />
  <text class="body-text" x="610" y="163">Not the pitch</text>
  <rect class="card-accent" x="695" y="138" width="150" height="40" rx="6" />
  <text class="body-inv" x="770" y="157">Run it yourself —</text>
  <text class="body-inv" x="770" y="171">your own boundary</text>

  <text class="row-head" x="200" y="224">Hyperbrowser</text>
  <rect class="card-neutral" x="215" y="198" width="150" height="40" rx="6" />
  <text class="body-text" x="290" y="223">Cloud only</text>
  <rect class="card-neutral" x="375" y="198" width="150" height="40" rx="6" />
  <text class="body-text" x="450" y="223">Not the pitch</text>
  <rect class="card-accent" x="535" y="198" width="150" height="40" rx="6" />
  <text class="body-inv" x="610" y="217">Stealth by default,</text>
  <text class="body-inv" x="610" y="231">captcha solving</text>
  <rect class="card-neutral" x="695" y="198" width="150" height="40" rx="6" />
  <text class="body-text" x="770" y="223">Standard cloud</text>

  <text class="row-head" x="200" y="284">Anchor Browser</text>
  <rect class="card-neutral" x="215" y="258" width="150" height="40" rx="6" />
  <text class="body-text" x="290" y="277">Cloud, with BYOC</text>
  <text class="body-text" x="290" y="291">and on-prem tiers</text>
  <rect class="card-accent" x="375" y="258" width="150" height="40" rx="6" />
  <text class="body-inv" x="450" y="277">Secret injection;</text>
  <text class="body-inv" x="450" y="291">model never sees it</text>
  <rect class="card-soft" x="535" y="258" width="150" height="40" rx="6" />
  <text class="body-text" x="610" y="283">Offered</text>
  <rect class="card-accent" x="695" y="258" width="150" height="40" rx="6" />
  <text class="body-inv" x="770" y="277">Per-session VM,</text>
  <text class="body-inv" x="770" y="291">audited tiers</text>

  <rect class="card-accent" x="180" y="340" width="14" height="14" rx="3" />
  <text class="legend-text" x="202" y="352">Leads on this axis</text>
  <rect class="card-soft" x="380" y="340" width="14" height="14" rx="3" />
  <text class="legend-text" x="402" y="352">Competitive</text>
  <rect class="card-neutral" x="580" y="340" width="14" height="14" rx="3" />
  <text class="legend-text" x="602" y="352">Not where it competes</text>
</svg>
