<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where a browser session's identity lives in a cloud-browser deployment</title>
  <desc id="d">Your agent connects over Playwright or CDP to a provider control plane, which starts a browser instance holding cookies, a stored login profile and injected secrets, and routes its traffic through a proxy pool to the target site. The boxes holding identity — the profile store, the secrets and the exit IP — sit inside the provider's boundary, which is the part that decides the compliance story.</desc>
  <style>
    .box       { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero      { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj       { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .frame     { fill: none; stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; stroke-dasharray: 5 4; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink, #1a1a1a); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper, #fff); }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .8; }
    .head      { font-family: var(--font-display); font-size: 14px; font-weight: 600; fill: currentColor; }
    .wire      { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: currentColor; opacity: .7; }
    .arrow     { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="34" y="40">Yours</text>
  <rect class="box" x="34" y="54" width="170" height="80" rx="8" />
  <text class="label" x="52" y="82">Your agent</text>
  <text class="sub" x="52" y="102">framework, prompts,</text>
  <text class="sub" x="52" y="118">task logic</text>

  <path class="arrow" d="M 210 94 L 268 94" />
  <text class="wire" x="212" y="84">CDP / Playwright</text>

  <text class="head" x="274" y="40">The provider's boundary — the part you are actually choosing</text>
  <rect class="frame" x="268" y="54" width="598" height="300" rx="10" />

  <rect class="adj" x="292" y="70" width="180" height="60" rx="8" />
  <text class="label" x="308" y="94">Control plane</text>
  <text class="sub" x="308" y="114">session create / connect</text>

  <rect class="hero" x="292" y="160" width="180" height="76" rx="8" />
  <text class="label-inv" x="308" y="186">Browser instance</text>
  <text class="sub-inv" x="308" y="206">cookies, local storage,</text>
  <text class="sub-inv" x="308" y="222">the logged-in session</text>

  <rect class="hero" x="292" y="256" width="180" height="76" rx="8" />
  <text class="label-inv" x="308" y="282">Profile &amp; secret store</text>
  <text class="sub-inv" x="308" y="302">stored logins, injected</text>
  <text class="sub-inv" x="308" y="318">credentials, re-auth</text>

  <rect class="adj" x="520" y="160" width="180" height="76" rx="8" />
  <text class="label" x="536" y="186">Proxy pool</text>
  <text class="sub" x="536" y="206">the exit IP the site sees,</text>
  <text class="sub" x="536" y="222">and its reputation</text>

  <rect class="box" x="520" y="70" width="180" height="60" rx="8" />
  <text class="label" x="536" y="94">Fingerprint layer</text>
  <text class="sub" x="536" y="114">stealth, captcha handling</text>

  <path class="arrow" d="M 382 136 L 382 154" />
  <path class="arrow" d="M 382 242 L 382 250" />
  <path class="arrow" d="M 478 198 L 514 198" />
  <path class="arrow" d="M 610 154 L 610 136" />

  <rect class="box" x="726" y="160" width="116" height="76" rx="8" />
  <text class="label" x="742" y="192">Target site</text>
  <text class="sub" x="742" y="212">and its bot defence</text>

  <path class="arrow" d="M 706 198 L 720 198" />

  <rect class="adj" x="34" y="392" width="832" height="76" rx="10" />
  <text class="head" x="56" y="420">The three red boxes are the decision</text>
  <text class="label" x="56" y="444">The API is interchangeable — every provider speaks CDP. What differs is who holds the logged-in session,</text>
  <text class="label" x="56" y="462">who holds the credentials that recreate it, and whose IP reputation your account inherits.</text>
</svg>
