<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Control-plane session-creation latency, relative to the fastest provider</title>
  <desc id="d">Horizontal bar chart of the time each provider's control plane takes to create a browser session, expressed as a multiple of the fastest. Steel is 1.0 times at roughly 229 milliseconds, Browserbase 1.6 times, Hyperbrowser 12.8 times and Anchor Browser 28.6 times. Figures are from Steel's own open-source browserbench.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .axis-note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .65; text-anchor: middle; }
    .row-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .value       { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: currentColor; text-anchor: start; }
    .grid        { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .bar-lead    { fill: var(--accent, #d4421e); }
    .bar-mid     { fill: var(--accent-soft, #f5c5b8); }
    .bar-trail   { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="34">Time to create a session (× the fastest)</text>

  <line class="grid" x1="200" y1="60" x2="200" y2="320" />
  <line class="grid" x1="355" y1="60" x2="355" y2="320" />
  <line class="grid" x1="510" y1="60" x2="510" y2="320" />
  <line class="grid" x1="665" y1="60" x2="665" y2="320" />
  <line class="grid" x1="820" y1="60" x2="820" y2="320" />

  <text class="axis-note" x="200" y="338">0×</text>
  <text class="axis-note" x="355" y="338">7×</text>
  <text class="axis-note" x="510" y="338">14×</text>
  <text class="axis-note" x="665" y="338">21×</text>
  <text class="axis-note" x="820" y="338">28×</text>

  <text class="row-head" x="186" y="96">Steel</text>
  <rect class="bar-lead" x="200" y="76" width="22" height="28" rx="3" />
  <text class="value" x="234" y="96">1.0× · ~229 ms</text>

  <text class="row-head" x="186" y="156">Browserbase</text>
  <rect class="bar-mid" x="200" y="136" width="35" height="28" rx="3" />
  <text class="value" x="247" y="156">1.6×</text>

  <text class="row-head" x="186" y="216">Hyperbrowser</text>
  <rect class="bar-mid" x="200" y="196" width="278" height="28" rx="3" />
  <text class="value" x="490" y="216">12.8×</text>

  <text class="row-head" x="186" y="276">Anchor Browser</text>
  <rect class="bar-trail" x="200" y="256" width="620" height="28" rx="3" />
  <text class="value" x="738" y="276" fill="var(--ink, #1a1a1a)">28.6×</text>

  <text class="axis-note" x="450" y="372">Source: steel-dev/browserbench — published by one of the four providers, and open source so you can re-run it.</text>
</svg>
