<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="lt ld">
  <title id="lt">Loopjacking results across four tested approval implementations</title>
  <desc id="ld">A matrix of four agent runtimes against two attack classes. Agno AgentOS 2.5.5 to 3.0.9 reproduces post-approval state substitution. A conditional in-memory LangGraph Agent Server composition, 0.7.4 to 0.14.0, reproduces it under some policies. OpenClaw 2026.2.23 reproduces representation mismatch and was patched in 2026.2.24. OpenAI Agents SDK 0.22.0 and 0.22.2 rejects both and serves as the negative control.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="title" x="20" y="28">Reproduced on the versions tested, evidence cutoff 10 Sep 2026</text>

  <text class="head" x="565" y="62" text-anchor="middle">Representation mismatch</text>
  <text class="head" x="775" y="62" text-anchor="middle">Post-approval substitution</text>

  <rect class="box" x="20" y="76" width="420" height="52" />
  <text class="label" x="36" y="100">Agno AgentOS</text>
  <text class="sub" x="36" y="118">2.5.5 – 3.0.9 · seven releases</text>
  <rect class="box" x="450" y="76" width="230" height="52" />
  <text class="sub" x="565" y="107" text-anchor="middle">not the tested path</text>
  <rect class="hero" x="690" y="76" width="190" height="52" />
  <text class="label-inv" x="785" y="107" text-anchor="middle">reproduced</text>

  <rect class="box" x="20" y="140" width="420" height="52" />
  <text class="label" x="36" y="164">LangGraph Agent Server</text>
  <text class="sub" x="36" y="182">0.7.4 – 0.14.0 · conditional in-memory composition</text>
  <rect class="box" x="450" y="140" width="230" height="52" />
  <text class="sub" x="565" y="171" text-anchor="middle">not the tested path</text>
  <rect class="adj" x="690" y="140" width="190" height="52" />
  <text class="label" x="785" y="171" text-anchor="middle">policy-dependent</text>

  <rect class="box" x="20" y="204" width="420" height="52" />
  <text class="label" x="36" y="228">OpenClaw</text>
  <text class="sub" x="36" y="246">2026.2.23 · fixed in 2026.2.24</text>
  <rect class="hero" x="450" y="204" width="230" height="52" />
  <text class="label-inv" x="565" y="235" text-anchor="middle">reproduced, then patched</text>
  <rect class="box" x="690" y="204" width="190" height="52" />
  <text class="sub" x="785" y="235" text-anchor="middle">not the tested path</text>

  <rect class="box" x="20" y="268" width="420" height="52" />
  <text class="label" x="36" y="292">OpenAI Agents SDK</text>
  <text class="sub" x="36" y="310">0.22.0, 0.22.2 · serialized continuation</text>
  <rect class="box" x="450" y="268" width="230" height="52" />
  <text class="sub" x="565" y="299" text-anchor="middle">rejected</text>
  <rect class="box" x="690" y="268" width="190" height="52" />
  <text class="sub" x="785" y="299" text-anchor="middle">rejected</text>

  <rect class="hero" x="20" y="340" width="20" height="14" />
  <text class="sub" x="48" y="352">reproduced</text>
  <rect class="adj" x="150" y="340" width="20" height="14" />
  <text class="sub" x="178" y="352">reproduced under some configurations</text>
  <rect class="box" x="470" y="340" width="20" height="14" />
  <text class="sub" x="498" y="352">rejected, or outside the tested path</text>
</svg>
