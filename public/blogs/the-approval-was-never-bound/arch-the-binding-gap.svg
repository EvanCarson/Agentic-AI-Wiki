<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="bt bd">
  <title id="bt">Where the approval decision comes apart from the action</title>
  <desc id="bd">A flow in which the model proposes call A, an approval record is created carrying only an identifier, the human is shown a summary of A and approves the identifier, and the executor later reads the arguments back out of mutable pending state. A second path writes B into that state between the approval and the read, so the executor runs B under the approval given for A.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .arrow-d { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="title" x="20" y="28">The decision and the payload travel separately</text>

  <rect class="box" x="20" y="52" width="200" height="60" />
  <text class="label" x="120" y="78" text-anchor="middle">Model proposes A</text>
  <text class="sub" x="120" y="98" text-anchor="middle">refund $40, order 118</text>

  <path class="arrow" d="M 224 82 L 286 82" />

  <rect class="box" x="290" y="52" width="220" height="60" />
  <text class="label" x="400" y="78" text-anchor="middle">Approval record created</text>
  <text class="sub" x="400" y="98" text-anchor="middle">id = req_7f3a, status = pending</text>

  <path class="arrow" d="M 514 82 L 576 82" />

  <rect class="box" x="580" y="52" width="300" height="60" />
  <text class="label" x="730" y="78" text-anchor="middle">UI renders a summary of A</text>
  <text class="sub" x="730" y="98" text-anchor="middle">a human-readable paraphrase, not the call</text>

  <path class="arrow" d="M 730 116 L 730 168" />

  <rect class="adj" x="580" y="172" width="300" height="60" />
  <text class="label" x="730" y="198" text-anchor="middle">Human approves</text>
  <text class="sub" x="730" y="218" text-anchor="middle">req_7f3a → true</text>

  <path class="arrow" d="M 576 202 L 514 202" />

  <rect class="hero" x="250" y="172" width="260" height="60" />
  <text class="label-inv" x="380" y="198" text-anchor="middle">Pending state, still mutable</text>
  <text class="sub-inv" x="380" y="218" text-anchor="middle">holds the arguments, keyed by id</text>

  <rect class="box" x="20" y="286" width="240" height="70" />
  <text class="label" x="140" y="312" text-anchor="middle">Any later write path</text>
  <text class="sub" x="140" y="332" text-anchor="middle">a second turn, a queued message,</text>
  <text class="sub" x="140" y="348" text-anchor="middle">a tool that edits the draft</text>

  <path class="arrow-d" d="M 264 310 L 366 250" />
  <text class="sub" x="300" y="292">writes B</text>

  <path class="arrow" d="M 380 236 L 380 292" />

  <rect class="box" x="290" y="296" width="280" height="60" />
  <text class="label" x="430" y="322" text-anchor="middle">Executor reads by id</text>
  <text class="sub" x="430" y="342" text-anchor="middle">status = approved → run whatever is there</text>

  <path class="arrow" d="M 574 326 L 636 326" />

  <rect class="hero" x="640" y="296" width="240" height="60" />
  <text class="label-inv" x="760" y="322" text-anchor="middle">B executes</text>
  <text class="sub-inv" x="760" y="342" text-anchor="middle">refund $4,000, order 992</text>

  <rect class="box" x="20" y="396" width="860" height="74" />
  <text class="label" x="450" y="424" text-anchor="middle">Nothing was injected and nothing escaped — the code did exactly what it says</text>
  <text class="sub" x="450" y="448" text-anchor="middle">The approval was stored as a boolean against an identifier; the action was read back out of state that stayed writable</text>
</svg>
