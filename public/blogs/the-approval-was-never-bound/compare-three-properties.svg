<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="ct cd">
  <title id="ct">The three properties an approval gate has to hold</title>
  <desc id="cd">Three columns: complete canonical rendering, an immutable binding between the decision and the exact call, and an exact comparison at use time. Each column names what it prevents and the symptom you see when it is missing.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .rule   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .45; }
  </style>

  <text class="title" x="20" y="28">Drop any one of these and the gate is decorative</text>

  <rect class="adj" x="30" y="50" width="250" height="46" />
  <text class="label" x="155" y="79" text-anchor="middle">Canonical rendering</text>
  <rect class="hero" x="325" y="50" width="250" height="46" />
  <text class="label-inv" x="450" y="79" text-anchor="middle">Immutable binding</text>
  <rect class="adj" x="620" y="50" width="250" height="46" />
  <text class="label" x="745" y="79" text-anchor="middle">Use-time comparison</text>

  <text class="sub" x="155" y="128" text-anchor="middle">Show every field that will be sent</text>
  <text class="sub" x="450" y="128" text-anchor="middle">Bind the decision to the exact call</text>
  <text class="sub" x="745" y="128" text-anchor="middle">Re-check the call before it runs</text>

  <path class="rule" d="M 30 148 L 870 148" />

  <text class="sub" x="155" y="174" text-anchor="middle">Without it: approved a paraphrase</text>
  <text class="sub" x="450" y="174" text-anchor="middle">Without it: state can be rewritten</text>
  <text class="sub" x="745" y="174" text-anchor="middle">Without it: a stale yes is reused</text>

  <path class="rule" d="M 30 194 L 870 194" />

  <text class="sub" x="155" y="220" text-anchor="middle">Test: diff the render against the payload</text>
  <text class="sub" x="450" y="220" text-anchor="middle">Test: mutate after approval, expect refusal</text>
  <text class="sub" x="745" y="220" text-anchor="middle">Test: replay an old token, expect refusal</text>

  <rect class="box" x="30" y="242" width="840" height="40" />
  <text class="label" x="450" y="267" text-anchor="middle">Content-address the call, store the approval against that digest, compare digests at execution</text>
</svg>
