<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="dt dd">
  <title id="dt">The three measurements that decide the choice</title>
  <desc id="dd">Three columns — per-PR queue-failure rate, CI wall-clock, and conflict domain — each with what it determines about the merge queue configuration and how to measure it from data a team already has.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .rule   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .45; }
  </style>

  <text class="title" x="20" y="28">Measure three things; the product choice follows</text>

  <rect class="hero" x="30" y="50" width="250" height="46" />
  <text class="label-inv" x="155" y="79" text-anchor="middle">Queue-failure rate p</text>
  <rect class="adj" x="325" y="50" width="250" height="46" />
  <text class="label" x="450" y="79" text-anchor="middle">CI wall-clock</text>
  <rect class="box" x="620" y="50" width="250" height="46" />
  <text class="label" x="745" y="79" text-anchor="middle">Conflict domain</text>

  <text class="sub" x="155" y="128" text-anchor="middle">Decides: batch size, and whether</text>
  <text class="sub" x="155" y="145" text-anchor="middle">bisection is mandatory</text>
  <text class="sub" x="450" y="128" text-anchor="middle">Decides: whether queue depth</text>
  <text class="sub" x="450" y="145" text-anchor="middle">or run time dominates the wait</text>
  <text class="sub" x="745" y="128" text-anchor="middle">Decides: whether lanes</text>
  <text class="sub" x="745" y="145" text-anchor="middle">buy you anything</text>

  <path class="rule" d="M 30 162 L 870 162" />

  <text class="sub" x="155" y="188" text-anchor="middle">Measure: retest 50 merged PRs</text>
  <text class="sub" x="155" y="205" text-anchor="middle">at the tip they merged onto</text>
  <text class="sub" x="450" y="188" text-anchor="middle">Measure: p50 required-check</text>
  <text class="sub" x="450" y="205" text-anchor="middle">duration on the default branch</text>
  <text class="sub" x="745" y="188" text-anchor="middle">Measure: share of PR pairs whose</text>
  <text class="sub" x="745" y="205" text-anchor="middle">touched paths do not overlap</text>

  <rect class="box" x="30" y="228" width="840" height="54" />
  <text class="label" x="450" y="251" text-anchor="middle">Low p and fast CI: the native queue is not your constraint</text>
  <text class="sub" x="450" y="271" text-anchor="middle">High p: buy bisection. Wide conflict domain and a build graph: buy lanes. Both: you are in the monorepo case.</text>
</svg>
