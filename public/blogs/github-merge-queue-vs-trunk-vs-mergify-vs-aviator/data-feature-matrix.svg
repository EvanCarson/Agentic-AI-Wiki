<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="qt qd">
  <title id="qt">Merge queue feature matrix</title>
  <desc id="qd">Four products — GitHub merge queue, Trunk, Mergify and Aviator — scored weak, medium or strong on batch control, failed-batch isolation, lane derivation, flake tolerance and self-hosting.</desc>
  <style>
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .head   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; letter-spacing: .04em; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="title" x="20" y="28">Merge queue capability matrix</text>

  <text class="head" x="205" y="62" text-anchor="middle">BATCH CONTROL</text>
  <text class="head" x="345" y="62" text-anchor="middle">FAILED-BATCH</text>
  <text class="head" x="345" y="74" text-anchor="middle">ISOLATION</text>
  <text class="head" x="490" y="62" text-anchor="middle">LANE DERIVATION</text>
  <text class="head" x="635" y="62" text-anchor="middle">FLAKE TOLERANCE</text>
  <text class="head" x="785" y="62" text-anchor="middle">SELF-HOSTED</text>

  <text class="row" x="20" y="108">GitHub</text>
  <rect class="weak" x="140" y="86" width="130" height="34" />
  <text class="cell" x="205" y="107" text-anchor="middle">Merge groups only</text>
  <rect class="weak" x="280" y="86" width="130" height="34" />
  <text class="cell" x="345" y="107" text-anchor="middle">Eject the PR</text>
  <rect class="weak" x="420" y="86" width="140" height="34" />
  <text class="cell" x="490" y="107" text-anchor="middle">None</text>
  <rect class="weak" x="570" y="86" width="130" height="34" />
  <text class="cell" x="635" y="107" text-anchor="middle">None</text>
  <rect class="weak" x="710" y="86" width="150" height="34" />
  <text class="cell" x="785" y="107" text-anchor="middle">N/A — native</text>

  <text class="row" x="20" y="164">Trunk</text>
  <rect class="med" x="140" y="142" width="130" height="34" />
  <text class="cell" x="205" y="163" text-anchor="middle">Compatible batching</text>
  <rect class="strong" x="280" y="142" width="130" height="34" />
  <text class="cell-inv" x="345" y="163" text-anchor="middle">Bisection + caching</text>
  <rect class="strong" x="420" y="142" width="140" height="34" />
  <text class="cell-inv" x="490" y="163" text-anchor="middle">Impacted targets</text>
  <rect class="med" x="570" y="142" width="130" height="34" />
  <text class="cell" x="635" y="163" text-anchor="middle">Via isolation</text>
  <rect class="weak" x="710" y="142" width="150" height="34" />
  <text class="cell" x="785" y="163" text-anchor="middle">SaaS</text>

  <text class="row" x="20" y="220">Mergify</text>
  <rect class="strong" x="140" y="198" width="130" height="34" />
  <text class="cell-inv" x="205" y="219" text-anchor="middle">1–128 or {min,max}</text>
  <rect class="med" x="280" y="198" width="130" height="34" />
  <text class="cell" x="345" y="219" text-anchor="middle">Parallel checks</text>
  <rect class="med" x="420" y="198" width="140" height="34" />
  <text class="cell" x="490" y="219" text-anchor="middle">Declared scopes</text>
  <rect class="weak" x="570" y="198" width="130" height="34" />
  <text class="cell" x="635" y="219" text-anchor="middle">Pause / priority</text>
  <rect class="weak" x="710" y="198" width="150" height="34" />
  <text class="cell" x="785" y="219" text-anchor="middle">SaaS</text>

  <text class="row" x="20" y="276">Aviator</text>
  <rect class="med" x="140" y="254" width="130" height="34" />
  <text class="cell" x="205" y="275" text-anchor="middle">Parallel mode</text>
  <rect class="med" x="280" y="254" width="130" height="34" />
  <text class="cell" x="345" y="275" text-anchor="middle">Optimistic retry</text>
  <rect class="strong" x="420" y="254" width="140" height="34" />
  <text class="cell-inv" x="490" y="275" text-anchor="middle">Affected targets</text>
  <rect class="strong" x="570" y="254" width="130" height="34" />
  <text class="cell-inv" x="635" y="275" text-anchor="middle">Failure depth knob</text>
  <rect class="strong" x="710" y="254" width="150" height="34" />
  <text class="cell-inv" x="785" y="275" text-anchor="middle">Yes</text>

  <rect class="strong" x="140" y="312" width="16" height="16" />
  <text class="sub" x="164" y="325">Strong</text>
  <rect class="med" x="230" y="312" width="16" height="16" />
  <text class="sub" x="254" y="325">Medium</text>
  <rect class="weak" x="320" y="312" width="16" height="16" />
  <text class="sub" x="344" y="325">Weak or absent</text>

  <rect class="weak" x="20" y="348" width="840" height="36" />
  <text class="row" x="450" y="371" text-anchor="middle">Columns two and three are the ones that change the asymptotics; the rest is configuration.</text>
</svg>
