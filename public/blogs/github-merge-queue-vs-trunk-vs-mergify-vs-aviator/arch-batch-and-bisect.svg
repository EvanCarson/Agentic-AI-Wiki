<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="bt bd">
  <title id="bt">Recovering from a failed batch of eight, with and without bisection</title>
  <desc id="bd">A batch of eight pull requests fails because one is bad. Without bisection the whole batch is discarded and requeued, costing one wasted run and eight PRs of lost position. With bisection the batch is split in halves repeatedly until the culprit is isolated, costing about three extra runs while the seven healthy pull requests continue.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .bad    { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#barr); }
    .rule   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .35; }
  </style>
  <defs>
    <marker id="barr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="title" x="20" y="28">One bad PR in a batch of eight</text>

  <rect class="box" x="30" y="48" width="70" height="34" />
  <text class="label" x="65" y="70" text-anchor="middle">1</text>
  <rect class="box" x="106" y="48" width="70" height="34" />
  <text class="label" x="141" y="70" text-anchor="middle">2</text>
  <rect class="box" x="182" y="48" width="70" height="34" />
  <text class="label" x="217" y="70" text-anchor="middle">3</text>
  <rect class="box" x="258" y="48" width="70" height="34" />
  <text class="label" x="293" y="70" text-anchor="middle">4</text>
  <rect class="box" x="334" y="48" width="70" height="34" />
  <text class="label" x="369" y="70" text-anchor="middle">5</text>
  <rect class="bad" x="410" y="48" width="70" height="34" />
  <text class="label-inv" x="445" y="70" text-anchor="middle">6 ✕</text>
  <rect class="box" x="486" y="48" width="70" height="34" />
  <text class="label" x="521" y="70" text-anchor="middle">7</text>
  <rect class="box" x="562" y="48" width="70" height="34" />
  <text class="label" x="597" y="70" text-anchor="middle">8</text>
  <text class="sub" x="648" y="70">one CI run, red</text>

  <path class="rule" d="M 30 104 L 870 104" />

  <text class="label" x="20" y="136">Without bisection</text>

  <rect class="box" x="30" y="152" width="602" height="34" />
  <text class="sub" x="331" y="174" text-anchor="middle">whole batch discarded — all eight return to the queue</text>
  <path class="arrow" d="M 640 169 L 700 169" />
  <rect class="adj" x="708" y="152" width="162" height="34" />
  <text class="label" x="789" y="174" text-anchor="middle">requeue, retry</text>

  <text class="sub" x="30" y="210">Cost: 1 wasted run, 7 innocent PRs lose their position, and the next batch inherits the same bad PR</text>

  <path class="rule" d="M 30 232 L 870 232" />

  <text class="label" x="20" y="264">With bisection</text>

  <rect class="box" x="30" y="280" width="290" height="34" />
  <text class="sub" x="175" y="302" text-anchor="middle">1 – 4 retested: green</text>
  <rect class="bad" x="332" y="280" width="290" height="34" />
  <text class="label-inv" x="477" y="302" text-anchor="middle">5 – 8 retested: red</text>
  <text class="sub" x="640" y="302">run 2</text>

  <rect class="adj" x="332" y="322" width="142" height="34" />
  <text class="label" x="403" y="344" text-anchor="middle">5 – 6: red</text>
  <rect class="box" x="482" y="322" width="140" height="34" />
  <text class="sub" x="552" y="344" text-anchor="middle">7 – 8: green</text>
  <text class="sub" x="640" y="344">run 3</text>

  <rect class="box" x="332" y="364" width="66" height="34" />
  <text class="sub" x="365" y="386" text-anchor="middle">5 ✓</text>
  <rect class="bad" x="406" y="364" width="68" height="34" />
  <text class="label-inv" x="440" y="386" text-anchor="middle">6 ✕</text>
  <text class="sub" x="490" y="386">run 4 — culprit isolated, 1–5 and 7–8 merge</text>

  <rect class="box" x="30" y="420" width="840" height="56" />
  <text class="label" x="450" y="444" text-anchor="middle">Discard is linear in batch size; bisection is about 2·log₂(b) extra runs</text>
  <text class="sub" x="450" y="465" text-anchor="middle">and with result caching, the halves that already went green inside a larger group need not run again</text>
</svg>
