<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">What each deployment shape actually gives an agent builder</title>
  <desc id="d">A matrix comparing a closed frontier API, Kimi K3 through its hosted API, Kimi K3 self-hosted, and a small local model across four properties. Only self-hosting a frontier open-weight model gives both frontier capability and freedom from another company's usage policy, and it is the one option with a hard hardware floor.</desc>
  <style>
    .cell-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .cell-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .cell-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .rowlab { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); font-weight: 600; }
    .rowsub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .colhead { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; letter-spacing: .04em; }
    .cellt  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); font-weight: 600; }
    .cellt-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); font-weight: 600; }
    .title  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); opacity: .55; letter-spacing: .08em; }
    .leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="title" x="20" y="24">DEPLOYMENT SHAPE × WHAT YOU ACTUALLY GET</text>

  <text class="colhead" x="337" y="58" text-anchor="middle">FRONTIER</text>
  <text class="colhead" x="337" y="72" text-anchor="middle">CAPABILITY</text>
  <text class="colhead" x="497" y="58" text-anchor="middle">LOW COST</text>
  <text class="colhead" x="497" y="72" text-anchor="middle">PER TOKEN</text>
  <text class="colhead" x="657" y="58" text-anchor="middle">RUNS ON</text>
  <text class="colhead" x="657" y="72" text-anchor="middle">MODEST HARDWARE</text>
  <text class="colhead" x="817" y="58" text-anchor="middle">NO EXTERNAL</text>
  <text class="colhead" x="817" y="72" text-anchor="middle">USAGE POLICY</text>

  <!-- Row 1: closed frontier API -->
  <text class="rowlab" x="20" y="106">Closed frontier API</text>
  <text class="rowsub" x="20" y="122">someone else runs it</text>
  <rect class="cell-strong" x="260" y="82" width="155" height="52" rx="6" ry="6" />
  <text class="cellt-inv" x="337" y="112" text-anchor="middle">Yes</text>
  <rect class="cell-weak"   x="420" y="82" width="155" height="52" rx="6" ry="6" />
  <text class="cellt"     x="497" y="112" text-anchor="middle">No</text>
  <rect class="cell-strong" x="580" y="82" width="155" height="52" rx="6" ry="6" />
  <text class="cellt-inv" x="657" y="112" text-anchor="middle">No hardware at all</text>
  <rect class="cell-weak"   x="740" y="82" width="155" height="52" rx="6" ry="6" />
  <text class="cellt"     x="817" y="112" text-anchor="middle">No</text>

  <!-- Row 2: K3 hosted -->
  <text class="rowlab" x="20" y="164">Kimi K3, hosted API</text>
  <text class="rowsub" x="20" y="180">open weights, rented</text>
  <rect class="cell-strong" x="260" y="140" width="155" height="52" rx="6" ry="6" />
  <text class="cellt-inv" x="337" y="170" text-anchor="middle">Near-frontier</text>
  <rect class="cell-weak"   x="420" y="140" width="155" height="52" rx="6" ry="6" />
  <text class="cellt"     x="497" y="170" text-anchor="middle">Dearer than K2.6</text>
  <rect class="cell-strong" x="580" y="140" width="155" height="52" rx="6" ry="6" />
  <text class="cellt-inv" x="657" y="170" text-anchor="middle">No hardware at all</text>
  <rect class="cell-weak"   x="740" y="140" width="155" height="52" rx="6" ry="6" />
  <text class="cellt"     x="817" y="170" text-anchor="middle">No</text>

  <!-- Row 3: K3 self-hosted -->
  <text class="rowlab" x="20" y="222">Kimi K3, self-hosted</text>
  <text class="rowsub" x="20" y="238">the weights, your cluster</text>
  <rect class="cell-strong" x="260" y="198" width="155" height="52" rx="6" ry="6" />
  <text class="cellt-inv" x="337" y="228" text-anchor="middle">Near-frontier</text>
  <rect class="cell-med"    x="420" y="198" width="155" height="52" rx="6" ry="6" />
  <text class="cellt"     x="497" y="228" text-anchor="middle">Only at high volume</text>
  <rect class="cell-weak"   x="580" y="198" width="155" height="52" rx="6" ry="6" />
  <text class="cellt"     x="657" y="228" text-anchor="middle">64+ accelerators</text>
  <rect class="cell-strong" x="740" y="198" width="155" height="52" rx="6" ry="6" />
  <text class="cellt-inv" x="817" y="228" text-anchor="middle">Yes — the whole point</text>

  <!-- Row 4: small local -->
  <text class="rowlab" x="20" y="280">Small local model</text>
  <text class="rowsub" x="20" y="296">runs on one machine</text>
  <rect class="cell-weak"   x="260" y="256" width="155" height="52" rx="6" ry="6" />
  <text class="cellt"     x="337" y="286" text-anchor="middle">No</text>
  <rect class="cell-strong" x="420" y="256" width="155" height="52" rx="6" ry="6" />
  <text class="cellt-inv" x="497" y="286" text-anchor="middle">Marginal cost ~0</text>
  <rect class="cell-strong" x="580" y="256" width="155" height="52" rx="6" ry="6" />
  <text class="cellt-inv" x="657" y="286" text-anchor="middle">One GPU, or a laptop</text>
  <rect class="cell-strong" x="740" y="256" width="155" height="52" rx="6" ry="6" />
  <text class="cellt-inv" x="817" y="286" text-anchor="middle">Yes</text>

  <text class="rowsub" x="20" y="338">The row that has no cheap column is the one that made news. The column that only self-hosting fills is the one worth paying for.</text>

  <rect class="cell-strong" x="260" y="366" width="14" height="14" rx="3" ry="3" />
  <text class="leg" x="280" y="378">Fully</text>
  <rect class="cell-med"    x="380" y="366" width="14" height="14" rx="3" ry="3" />
  <text class="leg" x="400" y="378">Conditionally</text>
  <rect class="cell-weak"   x="540" y="366" width="14" height="14" rx="3" ry="3" />
  <text class="leg" x="560" y="378">Not at all</text>
</svg>
