<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Kimi K3 hosted API pricing against the model it replaces</title>
  <desc id="d">Horizontal bar chart of published list prices in US dollars per million tokens. Kimi K3 charges fifteen dollars for output against roughly four for K2.6, and three dollars for cache-miss input against roughly ninety-five cents. Only the cache-hit input price, thirty cents, is cheaper than anything in the previous generation.</desc>
  <style>
    .bar-lead { fill: var(--accent, #d4421e); }
    .bar-mid  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .bar-low  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .rowlab   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); font-weight: 600; }
    .rowsub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .val      { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); font-weight: 600; }
    .val-inv  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); font-weight: 600; }
    .title    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); opacity: .55; letter-spacing: .08em; }
    .grid     { stroke: var(--ink); stroke-width: 1; opacity: .16; stroke-dasharray: 2 4; }
    .axis     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .5; }
  </style>

  <text class="title" x="20" y="32">USD PER MILLION TOKENS — PUBLISHED LIST PRICE</text>

  <!-- Gridlines -->
  <line class="grid" x1="425" y1="60" x2="425" y2="368" />
  <line class="grid" x1="570" y1="60" x2="570" y2="368" />
  <line class="grid" x1="715" y1="60" x2="715" y2="368" />
  <line class="grid" x1="860" y1="60" x2="860" y2="368" />
  <text class="axis" x="425" y="384" text-anchor="middle">$3.75</text>
  <text class="axis" x="570" y="384" text-anchor="middle">$7.50</text>
  <text class="axis" x="715" y="384" text-anchor="middle">$11.25</text>
  <text class="axis" x="860" y="384" text-anchor="middle">$15.00</text>

  <!-- Row 1: K3 output -->
  <text class="rowlab" x="20" y="105">Kimi K3 — output</text>
  <text class="rowsub" x="20" y="121">what agent loops actually burn</text>
  <rect class="bar-lead" x="280" y="86" width="580" height="40" rx="5" ry="5" />
  <text class="val-inv" x="846" y="111" text-anchor="end">$15.00</text>

  <!-- Row 2: K2.6 output -->
  <text class="rowlab" x="20" y="167">Kimi K2.6 — output</text>
  <text class="rowsub" x="20" y="183">the previous generation</text>
  <rect class="bar-low" x="280" y="148" width="155" height="40" rx="5" ry="5" />
  <text class="val" x="447" y="173">$4.00</text>

  <!-- Row 3: K3 input cache miss -->
  <text class="rowlab" x="20" y="229">Kimi K3 — input</text>
  <text class="rowsub" x="20" y="245">cache miss</text>
  <rect class="bar-mid" x="280" y="210" width="116" height="40" rx="5" ry="5" />
  <text class="val" x="408" y="235">$3.00</text>

  <!-- Row 4: K2.6 input -->
  <text class="rowlab" x="20" y="291">Kimi K2.6 — input</text>
  <text class="rowsub" x="20" y="307">the previous generation</text>
  <rect class="bar-low" x="280" y="272" width="37" height="40" rx="5" ry="5" />
  <text class="val" x="329" y="297">$0.95</text>

  <!-- Row 5: K3 input cache hit -->
  <text class="rowlab" x="20" y="353">Kimi K3 — input</text>
  <text class="rowsub" x="20" y="369">cache hit, 90% off</text>
  <rect class="bar-mid" x="280" y="334" width="12" height="40" rx="4" ry="4" />
  <text class="val" x="304" y="359">$0.30</text>
</svg>
