<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three ways to run an open-weight frontier model, and what each is for</title>
  <desc id="d">Renting Kimi K3 through a hosted API costs the least to start and buys none of the independence open weights promise. Self-hosting demands a cluster of 64 or more accelerators and only pays back at sustained volume, but it is the only shape where no external usage policy applies. A small local model gives up frontier capability entirely in exchange for running anywhere.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .82; }
    .tag   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .55; letter-spacing: .06em; }
    .tag-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); opacity: .8; letter-spacing: .06em; }
  </style>

  <text class="tag" x="450" y="28" text-anchor="middle">PICK THE SHAPE THAT MATCHES WHY YOU WANTED OPEN WEIGHTS</text>

  <rect class="box" x="40" y="48" width="240" height="200" rx="10" ry="10" />
  <text class="label" x="160" y="80" text-anchor="middle" font-weight="700">Rent it</text>
  <text class="tag" x="160" y="102" text-anchor="middle">HOSTED API</text>
  <text class="sub" x="160" y="132" text-anchor="middle">Zero hardware, same-day start,</text>
  <text class="sub" x="160" y="150" text-anchor="middle">$3 in and $15 out per million.</text>
  <text class="sub" x="160" y="178" text-anchor="middle">You are back under someone</text>
  <text class="sub" x="160" y="196" text-anchor="middle">else's terms of service —</text>
  <text class="sub" x="160" y="214" text-anchor="middle">the openness bought you</text>
  <text class="sub" x="160" y="232" text-anchor="middle">a second vendor, not freedom.</text>

  <rect class="hero" x="330" y="48" width="240" height="200" rx="10" ry="10" />
  <text class="label-inv" x="450" y="80" text-anchor="middle" font-weight="700">Own it</text>
  <text class="tag-inv" x="450" y="102" text-anchor="middle">SELF-HOSTED CLUSTER</text>
  <text class="sub-inv" x="450" y="132" text-anchor="middle">64+ accelerators for production;</text>
  <text class="sub-inv" x="450" y="150" text-anchor="middle">≈1.4 TB of weights to place.</text>
  <text class="sub-inv" x="450" y="178" text-anchor="middle">Pays back only at sustained</text>
  <text class="sub-inv" x="450" y="196" text-anchor="middle">volume — but no refusal policy,</text>
  <text class="sub-inv" x="450" y="214" text-anchor="middle">no rate limit and no data</text>
  <text class="sub-inv" x="450" y="232" text-anchor="middle">leaving your boundary.</text>

  <rect class="adj" x="620" y="48" width="240" height="200" rx="10" ry="10" />
  <text class="label" x="740" y="80" text-anchor="middle" font-weight="700">Shrink it</text>
  <text class="tag" x="740" y="102" text-anchor="middle">SMALL LOCAL MODEL</text>
  <text class="sub" x="740" y="132" text-anchor="middle">One GPU or a laptop; marginal</text>
  <text class="sub" x="740" y="150" text-anchor="middle">cost per call rounds to zero.</text>
  <text class="sub" x="740" y="178" text-anchor="middle">Gives up frontier reasoning,</text>
  <text class="sub" x="740" y="196" text-anchor="middle">so route to it for the narrow,</text>
  <text class="sub" x="740" y="214" text-anchor="middle">high-volume steps and escalate</text>
  <text class="sub" x="740" y="232" text-anchor="middle">the hard ones elsewhere.</text>

  <text class="sub" x="450" y="278" text-anchor="middle" font-style="italic">Most agent stacks end up using two of these three, not one.</text>
</svg>
