<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Kimi K3 architecture and its memory footprint</title>
  <desc id="d">Tokens from a context window of up to one million pass through Kimi Delta Attention, a hybrid linear attention used in selected layers, then a router that fires sixteen of eight hundred and ninety-six experts per token — under two percent of the pool. Sparse activation keeps compute per token modest, but every one of the 2.8 trillion parameters must still be resident, which is why the MXFP4 weights alone come to roughly 1.4 terabytes.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .82; }
    .band  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .55; letter-spacing: .08em; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr3); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="band" x="40" y="36">PER-TOKEN PATH</text>

  <rect class="box" x="40" y="52" width="196" height="118" rx="9" ry="9" />
  <text class="label" x="138" y="82" text-anchor="middle" font-weight="700">Context</text>
  <text class="sub" x="138" y="106" text-anchor="middle">up to 1,000,000 tokens</text>
  <text class="sub" x="138" y="130" text-anchor="middle">native vision folded into</text>
  <text class="sub" x="138" y="148" text-anchor="middle">pretraining, not bolted on</text>

  <rect class="adj" x="268" y="52" width="228" height="118" rx="9" ry="9" />
  <text class="label" x="382" y="82" text-anchor="middle" font-weight="700">Kimi Delta Attention</text>
  <text class="sub" x="382" y="106" text-anchor="middle">hybrid linear attention</text>
  <text class="sub" x="382" y="124" text-anchor="middle">replacing the quadratic form</text>
  <text class="sub" x="382" y="142" text-anchor="middle">in selected layers</text>
  <text class="sub" x="382" y="162" text-anchor="middle">vendor claim: 6.3× decode at 1M</text>

  <rect class="hero" x="528" y="52" width="332" height="118" rx="9" ry="9" />
  <text class="label-inv" x="694" y="82" text-anchor="middle" font-weight="700">Sparse MoE router</text>
  <text class="sub-inv" x="694" y="106" text-anchor="middle">picks 16 experts out of 896 for this token</text>
  <text class="sub-inv" x="694" y="130" text-anchor="middle">latent-space routing over a pool that</text>
  <text class="sub-inv" x="694" y="148" text-anchor="middle">never fully activates</text>

  <path class="arrow" d="M 236 111 L 264 111" />
  <path class="arrow" d="M 496 111 L 524 111" />

  <!-- Expert pool bar -->
  <text class="band" x="40" y="212">THE EXPERT POOL — WIDTH IS PROPORTIONAL</text>
  <rect class="box" x="40" y="226" width="820" height="52" rx="8" ry="8" />
  <rect class="hero" x="40" y="226" width="15" height="52" rx="8" ry="8" />
  <text class="sub" x="76" y="248">16 experts fire</text>
  <text class="sub" x="76" y="266">under 2% of the pool</text>
  <text class="label" x="850" y="257" text-anchor="end" font-weight="700">896 experts resident, 880 idle for this token</text>

  <!-- The footprint band -->
  <rect class="bound" x="24" y="304" width="852" height="152" rx="12" ry="12" />
  <text class="band" x="42" y="330">WHAT HAS TO BE IN MEMORY ANYWAY</text>

  <rect class="box" x="52" y="344" width="256" height="96" rx="8" ry="8" />
  <text class="label" x="180" y="372" text-anchor="middle" font-weight="700">2.8T parameters</text>
  <text class="sub" x="180" y="396" text-anchor="middle">sparse activation cuts the</text>
  <text class="sub" x="180" y="414" text-anchor="middle">compute per token, not the</text>
  <text class="sub" x="180" y="432" text-anchor="middle">memory the model occupies</text>

  <rect class="adj" x="324" y="344" width="256" height="96" rx="8" ry="8" />
  <text class="label" x="452" y="372" text-anchor="middle" font-weight="700">MXFP4 weights</text>
  <text class="sub" x="452" y="396" text-anchor="middle">≈1.4 TB to download, against</text>
  <text class="sub" x="452" y="414" text-anchor="middle">≈5.6 TB at FP16 — quantisation</text>
  <text class="sub" x="452" y="432" text-anchor="middle">aware from fine-tuning onward</text>

  <rect class="box" x="596" y="344" width="252" height="96" rx="8" ry="8" />
  <text class="label" x="722" y="372" text-anchor="middle" font-weight="700">No single GPU fits</text>
  <text class="sub" x="722" y="396" text-anchor="middle">not an H100, H200 or B200;</text>
  <text class="sub" x="722" y="414" text-anchor="middle">Moonshot points production</text>
  <text class="sub" x="722" y="432" text-anchor="middle">users at 64+ accelerators</text>
</svg>
