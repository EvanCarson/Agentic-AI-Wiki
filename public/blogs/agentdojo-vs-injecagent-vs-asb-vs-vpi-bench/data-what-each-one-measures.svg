<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="wm wmd">
  <title id="wm">What each injection benchmark actually measures</title>
  <desc id="wmd">A matrix of four benchmarks against four axes. AgentDojo carries untrusted text in tool outputs across multi-step trajectories, checks environment state rather than using a model judge, and makes utility under attack a headline metric rather than reporting attack success alone. InjecAgent is single-step text injection with no utility measurement. Agent Security Bench spans direct injection, indirect injection and memory poisoning with defences built in, across multi-step scenarios. VPI-Bench carries the attack in rendered pixels across multi-step trajectories and reports an attempted rate alongside a success rate.</desc>
  <style>
    .wm-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .wm-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .wm-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .wm-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wm-col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .wm-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wm-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .wm-cellin { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .wm-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="wm-ttl" x="20" y="30">Four benchmarks, four different questions</text>

  <text class="wm-col" x="320" y="66" text-anchor="middle">CHANNEL</text>
  <text class="wm-col" x="470" y="66" text-anchor="middle">MULTI-STEP</text>
  <text class="wm-col" x="620" y="66" text-anchor="middle">UTILITY</text>
  <text class="wm-col" x="790" y="66" text-anchor="middle">DEFENCES BUILT IN</text>

  <text class="wm-row" x="20" y="103">AgentDojo</text>
  <rect class="wm-med" x="250" y="80" width="140" height="36" />
  <text class="wm-cell" x="320" y="103" text-anchor="middle">Tool output</text>
  <rect class="wm-strong" x="400" y="80" width="140" height="36" />
  <text class="wm-cellin" x="470" y="103" text-anchor="middle">Yes</text>
  <rect class="wm-strong" x="550" y="80" width="140" height="36" />
  <text class="wm-cellin" x="620" y="103" text-anchor="middle">Under attack</text>
  <rect class="wm-med" x="700" y="80" width="180" height="36" />
  <text class="wm-cell" x="790" y="103" text-anchor="middle">Several</text>

  <text class="wm-row" x="20" y="159">InjecAgent</text>
  <rect class="wm-med" x="250" y="136" width="140" height="36" />
  <text class="wm-cell" x="320" y="159" text-anchor="middle">Tool output</text>
  <rect class="wm-weak" x="400" y="136" width="140" height="36" />
  <text class="wm-cell" x="470" y="159" text-anchor="middle">Single step</text>
  <rect class="wm-weak" x="550" y="136" width="140" height="36" />
  <text class="wm-cell" x="620" y="159" text-anchor="middle">Not measured</text>
  <rect class="wm-weak" x="700" y="136" width="180" height="36" />
  <text class="wm-cell" x="790" y="159" text-anchor="middle">Prompt hardening only</text>

  <text class="wm-row" x="20" y="215">Agent Security Bench</text>
  <rect class="wm-strong" x="250" y="192" width="140" height="36" />
  <text class="wm-cellin" x="320" y="215" text-anchor="middle">Four channels</text>
  <rect class="wm-strong" x="400" y="192" width="140" height="36" />
  <text class="wm-cellin" x="470" y="215" text-anchor="middle">Yes</text>
  <rect class="wm-weak" x="550" y="192" width="140" height="36" />
  <text class="wm-cell" x="620" y="215" text-anchor="middle">Not the headline</text>
  <rect class="wm-strong" x="700" y="192" width="180" height="36" />
  <text class="wm-cellin" x="790" y="215" text-anchor="middle">27 attack/defence methods</text>

  <text class="wm-row" x="20" y="271">VPI-Bench</text>
  <rect class="wm-strong" x="250" y="248" width="140" height="36" />
  <text class="wm-cellin" x="320" y="271" text-anchor="middle">Pixels</text>
  <rect class="wm-strong" x="400" y="248" width="140" height="36" />
  <text class="wm-cellin" x="470" y="271" text-anchor="middle">Yes</text>
  <rect class="wm-med" x="550" y="248" width="140" height="36" />
  <text class="wm-cell" x="620" y="271" text-anchor="middle">Attempted rate</text>
  <rect class="wm-weak" x="700" y="248" width="180" height="36" />
  <text class="wm-cell" x="790" y="271" text-anchor="middle">System prompt only</text>

  <rect class="wm-strong" x="20" y="306" width="16" height="13" />
  <text class="wm-leg" x="44" y="317">strongest coverage</text>
  <rect class="wm-med" x="250" y="306" width="16" height="13" />
  <text class="wm-leg" x="274" y="317">partial</text>
  <rect class="wm-weak" x="430" y="306" width="16" height="13" />
  <text class="wm-leg" x="454" y="317">absent or out of scope</text>
</svg>
