<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ha had">
  <title id="ha">Headline attack success rates across four injection benchmarks</title>
  <desc id="had">Six reported figures on one axis: VPI-Bench reaches up to 100% against browser-use agents, Agent Security Bench reports 84.30% for mixed attacks and 72.68% for direct prompt injection, VPI-Bench reaches up to 51% against computer-use agents, Agent Security Bench reports 27.55% for indirect prompt injection, and InjecAgent reports 24% against ReAct-prompted GPT-4. The bars share an axis but not a denominator, because each benchmark defines the attack channel and the success condition differently.</desc>
  <style>
    .ha-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .ha-mid  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .ha-low  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .ha-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .ha-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .ha-val  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .ha-ax   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .ha-grid { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>

  <text class="ha-ttl" x="20" y="28">Reported attack success rate (%), one axis, four denominators</text>

  <line class="ha-grid" x1="262" y1="48" x2="262" y2="320" />
  <line class="ha-grid" x1="402" y1="48" x2="402" y2="320" />
  <line class="ha-grid" x1="542" y1="48" x2="542" y2="320" />
  <line class="ha-grid" x1="682" y1="48" x2="682" y2="320" />
  <line class="ha-grid" x1="822" y1="48" x2="822" y2="320" />

  <text class="ha-row" x="250" y="79" text-anchor="end">VPI-Bench — browser-use</text>
  <rect class="ha-hero" x="262" y="60" width="560" height="28" />
  <text class="ha-val" x="830" y="79">100</text>

  <text class="ha-row" x="250" y="123" text-anchor="end">ASB — mixed attacks</text>
  <rect class="ha-mid" x="262" y="104" width="472" height="28" />
  <text class="ha-val" x="742" y="123">84.30</text>

  <text class="ha-row" x="250" y="167" text-anchor="end">ASB — direct injection</text>
  <rect class="ha-mid" x="262" y="148" width="407" height="28" />
  <text class="ha-val" x="677" y="167">72.68</text>

  <text class="ha-row" x="250" y="211" text-anchor="end">VPI-Bench — computer-use</text>
  <rect class="ha-low" x="262" y="192" width="286" height="28" />
  <text class="ha-val" x="556" y="211">51</text>

  <text class="ha-row" x="250" y="255" text-anchor="end">ASB — indirect injection</text>
  <rect class="ha-low" x="262" y="236" width="154" height="28" />
  <text class="ha-val" x="424" y="255">27.55</text>

  <text class="ha-row" x="250" y="299" text-anchor="end">InjecAgent — GPT-4 ReAct</text>
  <rect class="ha-low" x="262" y="280" width="134" height="28" />
  <text class="ha-val" x="404" y="299">24</text>

  <text class="ha-ax" x="262" y="342" text-anchor="middle">0</text>
  <text class="ha-ax" x="402" y="342" text-anchor="middle">25</text>
  <text class="ha-ax" x="542" y="342" text-anchor="middle">50</text>
  <text class="ha-ax" x="682" y="342" text-anchor="middle">75</text>
  <text class="ha-ax" x="822" y="342" text-anchor="middle">100</text>
</svg>
