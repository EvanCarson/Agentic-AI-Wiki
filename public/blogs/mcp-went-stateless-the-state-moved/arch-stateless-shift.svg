<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The stateful core versus the stateless core</title>
  <desc id="d">Two panes. On the left, the pre-2026-07-28 stateful server: a client performs an initialize handshake and receives a session id, so a sticky load balancer must route every later request to the one instance that holds that session, backed by a shared session store. On the right, the 2026-07-28 stateless server: each request is self-describing through headers and a meta field, a plain round-robin load balancer forwards it to any instance, and there is no session store.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pane   { fill: none; stroke: var(--ink); stroke-width: 1.25; opacity: .35; rx: 10; ry: 10; stroke-dasharray: 5 5; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="pane" x="20" y="20" width="420" height="460" />
  <text class="head" x="42" y="50">Stateful core (before)</text>

  <rect class="box" x="42" y="70" width="376" height="48" />
  <text class="label" x="60" y="90">Client</text>
  <text class="sub" x="60" y="107">initialize → gets Mcp-Session-Id</text>

  <path class="arrow" d="M 230 120 L 230 140" />

  <rect class="hero" x="42" y="142" width="376" height="46" />
  <text class="label-inv" x="60" y="170">Sticky load balancer — session affinity</text>

  <path class="arrow" d="M 230 190 L 230 210" />

  <rect class="box" x="42" y="212" width="118" height="46" />
  <text class="label" x="60" y="240">Instance A</text>
  <rect class="adj" x="171" y="212" width="118" height="46" />
  <text class="label" x="189" y="234">Instance B</text>
  <text class="sub" x="189" y="250">holds session</text>
  <rect class="box" x="300" y="212" width="118" height="46" />
  <text class="label" x="318" y="240">Instance C</text>

  <path class="arrow" d="M 230 260 L 230 284" />
  <rect class="box" x="120" y="286" width="220" height="44" />
  <text class="label" x="138" y="313">Shared session store</text>

  <rect class="box" x="42" y="360" width="376" height="98" />
  <text class="tag" x="60" y="384">WHAT IT COSTS</text>
  <text class="label" x="60" y="408">restart drops every pinned session</text>
  <text class="label" x="60" y="432">store is its own availability dependency</text>

  <rect class="pane" x="460" y="20" width="420" height="460" />
  <text class="head" x="482" y="50">Stateless core (2026-07-28)</text>

  <rect class="box" x="482" y="70" width="376" height="48" />
  <text class="label" x="500" y="90">Client</text>
  <text class="sub" x="500" y="107">every request: headers + _meta</text>

  <path class="arrow" d="M 670 120 L 670 140" />

  <rect class="adj" x="482" y="142" width="376" height="46" />
  <text class="label" x="500" y="170">Round-robin load balancer — no affinity</text>

  <path class="arrow" d="M 560 190 L 560 210" />
  <path class="arrow" d="M 670 190 L 670 210" />
  <path class="arrow" d="M 780 190 L 780 210" />

  <rect class="box" x="482" y="212" width="118" height="46" />
  <text class="label" x="500" y="240">Instance A</text>
  <rect class="box" x="611" y="212" width="118" height="46" />
  <text class="label" x="629" y="240">Instance B</text>
  <rect class="box" x="740" y="212" width="118" height="46" />
  <text class="label" x="758" y="240">Instance C</text>

  <rect class="box" x="482" y="360" width="376" height="98" />
  <text class="tag" x="500" y="384">WHAT IT BUYS</text>
  <text class="label" x="500" y="408">any request → any instance, no store</text>
  <text class="label" x="500" y="432">deploy is an ordinary rolling restart</text>
</svg>
