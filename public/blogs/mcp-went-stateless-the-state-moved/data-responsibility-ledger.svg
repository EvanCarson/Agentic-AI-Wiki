<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Where each concern lives, before and after the pivot</title>
  <desc id="d">A matrix of four concerns across two protocol versions. Session identity: held by the server in the 2025 stateful core, carried inline by the client on every request in the 2026-07-28 stateless core. Capability discovery: returned at the handshake before, cached by the client or fetched on demand after. Long-running work: sat awkwardly in the core before, moved into the Tasks extension as durable handles after. Load balancing: needed sticky sessions before, plain round-robin after. Every row moved; none of the concerns disappeared.</desc>
  <style>
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .colh   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .before { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .after  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
  </style>

  <text class="head" x="24" y="30">The session's job, redistributed</text>

  <text class="colh" x="300" y="64">2025 · STATEFUL CORE</text>
  <text class="colh" x="600" y="64">2026-07-28 · STATELESS + TASKS</text>

  <text class="row" x="24" y="112">Session identity</text>
  <rect class="before" x="288" y="90" width="288" height="40" />
  <text class="cell" x="304" y="114">Held by the server, keyed by id</text>
  <rect class="after" x="588" y="90" width="288" height="40" />
  <text class="cell" x="604" y="114">Carried inline by the client per request</text>

  <text class="row" x="24" y="172">Capability discovery</text>
  <rect class="before" x="288" y="150" width="288" height="40" />
  <text class="cell" x="304" y="174">Returned once at the handshake</text>
  <rect class="after" x="588" y="150" width="288" height="40" />
  <text class="cell" x="604" y="174">Client-cached or server/discover</text>

  <text class="row" x="24" y="232">Long-running work</text>
  <rect class="before" x="288" y="210" width="288" height="40" />
  <text class="cell" x="304" y="234">Awkward in the core session</text>
  <rect class="after" x="588" y="210" width="288" height="40" />
  <text class="cell" x="604" y="234">Tasks extension, durable handles</text>

  <text class="row" x="24" y="292">Load balancing</text>
  <rect class="before" x="288" y="270" width="288" height="40" />
  <text class="cell" x="304" y="294">Sticky sessions, shared store</text>
  <rect class="after" x="588" y="270" width="288" height="40" />
  <text class="cell" x="604" y="294">Plain round-robin, any instance</text>

  <text class="cell" x="24" y="352" style="opacity:.65">Neutral fill = the protocol owned it. Accent fill = it moved to the client, an extension, or your app.</text>
</svg>
