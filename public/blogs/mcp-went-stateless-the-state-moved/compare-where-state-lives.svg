<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three homes for what used to be one session</title>
  <desc id="d">Three columns showing where state lives after the pivot. The stateless core holds only per-request facts carried inline in headers and the meta field, with no memory between calls. The Tasks extension holds durable long-running work server-side, addressed by a task handle the client stores and passes back. Your application holds any multi-step or cross-call context the interaction needs, threaded through tool arguments and handles.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .colh   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .colh-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .lab    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .lab-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .tag-inv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--paper); opacity: .85; }
  </style>

  <rect class="hero" x="30" y="40" width="250" height="230" />
  <text class="tag-inv" x="50" y="70">STATELESS CORE</text>
  <text class="colh-inv" x="50" y="98">Per-request facts</text>
  <text class="lab-inv" x="50" y="130">carried inline in</text>
  <text class="lab-inv" x="50" y="150">headers + _meta</text>
  <text class="lab-inv" x="50" y="182">no memory between</text>
  <text class="lab-inv" x="50" y="202">calls</text>

  <rect class="adj" x="325" y="40" width="250" height="230" />
  <text class="tag" x="345" y="70">TASKS EXTENSION</text>
  <text class="colh" x="345" y="98">Durable work</text>
  <text class="lab" x="345" y="130">held server-side,</text>
  <text class="lab" x="345" y="150">addressed by a</text>
  <text class="lab" x="345" y="170">task handle the</text>
  <text class="lab" x="345" y="190">client stores and</text>
  <text class="lab" x="345" y="210">passes back</text>

  <rect class="box" x="620" y="40" width="250" height="230" />
  <text class="tag" x="640" y="70">YOUR APPLICATION</text>
  <text class="colh" x="640" y="98">Cross-call context</text>
  <text class="lab" x="640" y="130">any multi-step or</text>
  <text class="lab" x="640" y="150">between-call state,</text>
  <text class="lab" x="640" y="170">threaded through</text>
  <text class="lab" x="640" y="190">tool arguments and</text>
  <text class="lab" x="640" y="210">handles</text>
</svg>
