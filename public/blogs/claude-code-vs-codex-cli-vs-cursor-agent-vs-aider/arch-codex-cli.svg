<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Codex CLI architecture</title>
  <desc id="d">Codex CLI runs shell-first inside an OS sandbox scoped to the workspace, gated by an approval policy with Auto, Read-only, and Full Access modes, emitting a PR as output.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- HERO boundary: Sandboxed Workspace/VM -->
  <rect class="bound" x="40" y="60" width="620" height="380" rx="12" ry="12" />
  <text class="label" x="350" y="90" text-anchor="middle" font-weight="700" font-size="15">Sandboxed Workspace / VM</text>
  <text class="sub" x="350" y="110" text-anchor="middle">OS-level isolation, scoped to repo directory</text>

  <!-- Shell-first tool (inside sandbox) -->
  <rect class="hero" x="220" y="140" width="260" height="60" rx="8" ry="8" />
  <text class="label-inv" x="350" y="167" text-anchor="middle" font-weight="600">Shell-First Tool</text>
  <text class="label-inv" x="350" y="188" text-anchor="middle" font-size="12">runs commands in workspace shell</text>

  <!-- Task queue (inside sandbox) -->
  <rect class="box" x="220" y="250" width="260" height="60" rx="8" ry="8" />
  <text class="label" x="350" y="277" text-anchor="middle" font-weight="600">Task Queue</text>
  <text class="sub" x="350" y="298" text-anchor="middle">ordered pending actions</text>
  <line class="arrow" x1="350" y1="200" x2="350" y2="248" />

  <!-- Loop back: queue feeds shell -->
  <path class="arrow" d="M 220 280 Q 150 280 150 170 Q 150 140 218 155" />

  <!-- Approval policy gate (right, outside sandbox boundary visually bridging) -->
  <rect class="adj" x="700" y="195" width="160" height="115" rx="8" ry="8" />
  <text class="label" x="780" y="218" text-anchor="middle" font-weight="600">Approval Policy</text>
  <text class="sub" x="780" y="238" text-anchor="middle">gate on network/escape</text>
  <rect class="box" x="715" y="248" width="130" height="25" rx="5" ry="5" />
  <text class="sub" x="780" y="265" text-anchor="middle">Auto</text>
  <rect class="box" x="715" y="276" width="130" height="25" rx="5" ry="5" />
  <text class="sub" x="780" y="293" text-anchor="middle">Read-only</text>

  <!-- Full-Access label below approval gate -->
  <text class="sub" x="780" y="330" text-anchor="middle">Full Access</text>

  <!-- Arrow from sandbox to approval gate -->
  <line class="arrow" x1="660" y1="250" x2="698" y2="250" />

  <!-- PR as output -->
  <rect class="box" x="350" y="390" width="200" height="30" rx="8" ry="8" />
  <text class="label" x="450" y="410" text-anchor="middle" font-weight="600">PR as Output</text>

  <!-- Arrow from task queue to PR output (downward, inside sandbox) -->
  <line class="arrow" x1="350" y1="310" x2="450" y2="388" />

  <!-- Arrow from approval gate feeding back into loop -->
  <path class="arrow" d="M 780 310 Q 780 360 560 405" />
</svg>
