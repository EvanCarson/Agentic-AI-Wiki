<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Codex CLI architecture</title>
  <desc id="d">A shell-first agent runs inside a workspace-scoped OS sandbox, gated by an approval policy with three modes, emitting a pull request as output.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Sandbox boundary enclosing the shell-first tool + task queue -->
  <rect class="bound" x="40" y="70" width="470" height="320" rx="10" ry="10" />
  <text class="label" x="275" y="100" text-anchor="middle" font-weight="600">Sandboxed Workspace</text>
  <text class="sub" x="275" y="118" text-anchor="middle">OS-level isolation, scoped to the repo directory</text>

  <!-- Shell-first tool (hero) -->
  <rect class="hero" x="120" y="150" width="310" height="66" rx="8" ry="8" />
  <text class="label-inv" x="275" y="179" text-anchor="middle" font-weight="600">Shell-First Tool</text>
  <text class="label-inv" x="275" y="200" text-anchor="middle" font-size="12">runs commands in the workspace shell</text>

  <!-- Task queue + loop with the shell -->
  <rect class="box" x="120" y="280" width="310" height="66" rx="8" ry="8" />
  <text class="label" x="275" y="309" text-anchor="middle" font-weight="600">Task Queue</text>
  <text class="sub" x="275" y="330" text-anchor="middle">ordered pending actions</text>
  <line class="arrow" x1="255" y1="216" x2="255" y2="278" />
  <line class="arrow" x1="300" y1="280" x2="300" y2="218" />

  <!-- Approval policy (right) with all three modes inside -->
  <rect class="adj" x="600" y="120" width="260" height="230" rx="8" ry="8" />
  <text class="label" x="730" y="150" text-anchor="middle" font-weight="600">Approval Policy</text>
  <text class="sub" x="730" y="169" text-anchor="middle">gates network / sandbox escape</text>
  <rect class="box" x="622" y="188" width="216" height="42" rx="6" ry="6" />
  <text class="label" x="730" y="206" text-anchor="middle" font-size="13" font-weight="600">Auto</text>
  <text class="sub" x="730" y="222" text-anchor="middle">default — ask outside workspace</text>
  <rect class="box" x="622" y="238" width="216" height="42" rx="6" ry="6" />
  <text class="label" x="730" y="256" text-anchor="middle" font-size="13" font-weight="600">Read-only</text>
  <text class="sub" x="730" y="272" text-anchor="middle">plan / propose, no mutation</text>
  <rect class="box" x="622" y="288" width="216" height="42" rx="6" ry="6" />
  <text class="label" x="730" y="306" text-anchor="middle" font-size="13" font-weight="600">Full Access</text>
  <text class="sub" x="730" y="322" text-anchor="middle">no prompts, incl. network</text>

  <!-- Shell actions gated by the approval policy -->
  <line class="arrow" x1="430" y1="183" x2="598" y2="183" />
  <text class="sub" x="514" y="174" text-anchor="middle">actions gated</text>

  <!-- PR as output (leaves the sandbox) -->
  <rect class="box" x="120" y="412" width="310" height="56" rx="8" ry="8" />
  <text class="label" x="275" y="445" text-anchor="middle" font-weight="600">Pull Request as output</text>
  <line class="arrow" x1="275" y1="346" x2="275" y2="410" />
</svg>
