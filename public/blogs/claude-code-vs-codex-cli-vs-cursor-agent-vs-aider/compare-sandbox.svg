<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Sandbox &amp; filesystem trust boundary</title>
  <desc id="d">Four-column comparison of sandbox and filesystem trust boundaries for Claude Code, Codex CLI, Cursor Agent, and Aider. Codex CLI is highlighted as the most locked-down option.</desc>

  <!-- Background -->
  <rect width="900" height="300" fill="var(--paper)" rx="6"/>

  <!-- Chart title -->
  <text x="450" y="28" text-anchor="middle" font-family="inherit" font-size="14" font-weight="700" fill="var(--ink)">Sandbox &amp; filesystem trust boundary</text>

  <!-- ── Column layout: 4 cols, centers at 112, 337, 562, 787 ──
       Edges: 0, 225, 450, 675, 900
       Each col width = 225px; content rect x+10 .. x+215
  ────────────────────────────────────────────────────────────── -->

  <!-- Column header backgrounds -->
  <rect x="0"   y="40" width="225" height="44" fill="var(--paper-2)"/>
  <rect x="225" y="40" width="225" height="44" fill="var(--accent)"/>
  <rect x="450" y="40" width="225" height="44" fill="var(--paper-2)"/>
  <rect x="675" y="40" width="225" height="44" fill="var(--paper-2)"/>

  <!-- Column header text -->
  <text x="112" y="67" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Claude Code</text>
  <text x="337" y="67" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--paper)">Codex CLI</text>
  <text x="562" y="67" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Cursor Agent</text>
  <text x="787" y="67" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Aider</text>

  <!-- Column vertical dividers -->
  <line x1="225" y1="40" x2="225" y2="260" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="450" y1="40" x2="450" y2="260" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="675" y1="40" x2="675" y2="260" stroke="var(--border-soft)" stroke-width="1"/>

  <!-- Header bottom line -->
  <line x1="0" y1="84" x2="900" y2="84" stroke="var(--border-soft)" stroke-width="1"/>

  <!-- ── Body cells ───────────────────────────────────────────── -->
  <!-- Claude Code: paper-2 -->
  <rect x="0"   y="84" width="225" height="176" fill="var(--paper-2)"/>
  <!-- Codex CLI: accent (most locked down) -->
  <rect x="225" y="84" width="225" height="176" fill="var(--accent)"/>
  <!-- Cursor: paper-2 -->
  <rect x="450" y="84" width="225" height="176" fill="var(--paper-2)"/>
  <!-- Aider: paper-2 -->
  <rect x="675" y="84" width="225" height="176" fill="var(--paper-2)"/>

  <!-- Body text — Claude Code -->
  <text x="112" y="132" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">OS sandbox</text>
  <text x="112" y="150" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">(bubblewrap/seatbelt)</text>
  <text x="112" y="172" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">+ permission modes</text>

  <!-- Body text — Codex CLI (accent background, paper text) -->
  <text x="337" y="125" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">Workspace sandbox,</text>
  <text x="337" y="143" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">default-on,</text>
  <text x="337" y="161" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">approval-gated</text>

  <!-- Body text — Cursor Agent -->
  <text x="562" y="125" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">IDE-mediated;</text>
  <text x="562" y="143" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">edits staged as</text>
  <text x="562" y="161" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">reviewable diffs</text>

  <!-- Body text — Aider -->
  <text x="787" y="118" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">No sandbox —</text>
  <text x="787" y="136" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">local git repo,</text>
  <text x="787" y="154" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">history is the</text>
  <text x="787" y="172" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">safety net</text>

  <!-- Bottom border -->
  <line x1="0" y1="260" x2="900" y2="260" stroke="var(--border-soft)" stroke-width="1"/>
</svg>
