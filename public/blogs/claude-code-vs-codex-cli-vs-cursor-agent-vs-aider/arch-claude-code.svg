<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Claude Code architecture</title>
  <desc id="d">A harness coordinating a typed tool catalog, MCP servers, skills, and a persisted task list, with an OS sandbox boundary around shell and file actions.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- HERO: Harness (center) -->
  <rect class="hero" x="340" y="200" width="220" height="60" rx="8" ry="8" />
  <text class="label-inv" x="450" y="227" text-anchor="middle" font-weight="600">Claude Code Harness</text>
  <text class="label-inv" x="450" y="248" text-anchor="middle" font-size="12">LLM orchestration core</text>

  <!-- Tool Catalog (left) -->
  <rect class="box" x="30" y="170" width="180" height="120" rx="8" ry="8" />
  <text class="label" x="120" y="196" text-anchor="middle" font-weight="600">Typed Tool Catalog</text>
  <text class="sub" x="120" y="215" text-anchor="middle">Read / Edit / Bash</text>
  <text class="sub" x="120" y="232" text-anchor="middle">Glob / Grep</text>
  <line class="arrow" x1="210" y1="230" x2="338" y2="230" />

  <!-- Deferred Tools via ToolSearch -->
  <rect class="box" x="30" y="60" width="180" height="55" rx="8" ry="8" />
  <text class="label" x="120" y="84" text-anchor="middle" font-weight="600">Deferred Tools</text>
  <text class="sub" x="120" y="103" text-anchor="middle">via ToolSearch</text>
  <line class="arrow" x1="120" y1="115" x2="120" y2="168" />

  <!-- Skills -->
  <rect class="box" x="30" y="340" width="180" height="55" rx="8" ry="8" />
  <text class="label" x="120" y="364" text-anchor="middle" font-weight="600">Skills</text>
  <text class="sub" x="120" y="383" text-anchor="middle">slash-command plugins</text>
  <line class="arrow" x1="210" y1="367" x2="338" y2="267" />

  <!-- MCP Servers -->
  <rect class="box" x="690" y="170" width="180" height="120" rx="8" ry="8" />
  <text class="label" x="780" y="196" text-anchor="middle" font-weight="600">MCP Servers</text>
  <text class="sub" x="780" y="215" text-anchor="middle">external tools</text>
  <text class="sub" x="780" y="232" text-anchor="middle">via Model Context Protocol</text>
  <line class="arrow" x1="690" y1="230" x2="562" y2="230" />

  <!-- Task-list plan loop -->
  <rect class="adj" x="340" y="350" width="220" height="55" rx="8" ry="8" />
  <text class="label" x="450" y="374" text-anchor="middle" font-weight="600">Persisted Task List</text>
  <text class="sub" x="450" y="393" text-anchor="middle">plan → act → observe → update</text>

  <!-- Loop arrows: harness down to task list and back -->
  <line class="arrow" x1="450" y1="260" x2="450" y2="348" />
  <path class="arrow" d="M 340 377 Q 290 377 290 230 Q 290 207 338 215" />

  <!-- OS Sandbox boundary -->
  <rect class="bound" x="580" y="330" width="240" height="110" rx="8" ry="8" />
  <text class="sub" x="700" y="352" text-anchor="middle" font-weight="600">OS Sandbox</text>
  <text class="sub" x="700" y="370" text-anchor="middle">bubblewrap / seatbelt</text>
  <rect class="box" x="595" y="378" width="100" height="40" rx="6" ry="6" />
  <text class="sub" x="645" y="394" text-anchor="middle">Bash / file</text>
  <text class="sub" x="645" y="410" text-anchor="middle">actions</text>
  <rect class="box" x="710" y="378" width="100" height="40" rx="6" ry="6" />
  <text class="sub" x="760" y="394" text-anchor="middle">permission</text>
  <text class="sub" x="760" y="410" text-anchor="middle">modes</text>

  <!-- Harness to sandbox -->
  <line class="arrow" x1="530" y1="250" x2="650" y2="348" />
</svg>
