<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Claude Code architecture</title>
  <desc id="d">A harness coordinating a typed tool catalog, deferred tools, skills, and MCP servers, running a persisted task-list loop, with an OS sandbox around shell and file actions.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- LEFT inputs: fan cleanly into the harness left edge -->
  <rect class="box" x="35" y="70" width="185" height="56" rx="8" ry="8" />
  <text class="label" x="127" y="93" text-anchor="middle" font-weight="600">Deferred Tools</text>
  <text class="sub" x="127" y="112" text-anchor="middle">via ToolSearch</text>

  <rect class="box" x="35" y="178" width="185" height="74" rx="8" ry="8" />
  <text class="label" x="127" y="206" text-anchor="middle" font-weight="600">Typed Tool Catalog</text>
  <text class="sub" x="127" y="226" text-anchor="middle">Read / Edit / Bash</text>
  <text class="sub" x="127" y="242" text-anchor="middle">Glob / Grep</text>

  <rect class="box" x="35" y="300" width="185" height="56" rx="8" ry="8" />
  <text class="label" x="127" y="323" text-anchor="middle" font-weight="600">Skills</text>
  <text class="sub" x="127" y="342" text-anchor="middle">slash-command plugins</text>

  <line class="arrow" x1="220" y1="98"  x2="346" y2="222" />
  <line class="arrow" x1="220" y1="215" x2="346" y2="240" />
  <line class="arrow" x1="220" y1="328" x2="346" y2="260" />

  <!-- HERO: Harness (center) -->
  <rect class="hero" x="350" y="205" width="210" height="72" rx="8" ry="8" />
  <text class="label-inv" x="455" y="234" text-anchor="middle" font-weight="600">Claude Code Harness</text>
  <text class="label-inv" x="455" y="256" text-anchor="middle" font-size="12">LLM orchestration core</text>

  <!-- MCP Servers: clean horizontal arrow into harness right edge -->
  <rect class="box" x="685" y="176" width="180" height="74" rx="8" ry="8" />
  <text class="label" x="775" y="204" text-anchor="middle" font-weight="600">MCP Servers</text>
  <text class="sub" x="775" y="224" text-anchor="middle">external tools, via</text>
  <text class="sub" x="775" y="240" text-anchor="middle">Model Context Protocol</text>
  <line class="arrow" x1="685" y1="240" x2="562" y2="240" />

  <!-- Task-list loop: two parallel vertical arrows below the harness -->
  <rect class="adj" x="350" y="352" width="210" height="60" rx="8" ry="8" />
  <text class="label" x="455" y="378" text-anchor="middle" font-weight="600">Persisted Task List</text>
  <text class="sub" x="455" y="398" text-anchor="middle">plan → act → observe → update</text>
  <line class="arrow" x1="432" y1="277" x2="432" y2="350" />
  <line class="arrow" x1="478" y1="352" x2="478" y2="279" />

  <!-- OS Sandbox: clear bottom-right zone, single arrow in -->
  <line class="arrow" x1="548" y1="270" x2="636" y2="346" />
  <rect class="bound" x="600" y="350" width="265" height="118" rx="8" ry="8" />
  <text class="label" x="732" y="374" text-anchor="middle" font-weight="600">OS Sandbox</text>
  <text class="sub" x="732" y="392" text-anchor="middle">bubblewrap / seatbelt</text>
  <rect class="box" x="618" y="404" width="110" height="46" rx="6" ry="6" />
  <text class="sub" x="673" y="424" text-anchor="middle">Bash / file</text>
  <text class="sub" x="673" y="440" text-anchor="middle">actions</text>
  <rect class="box" x="738" y="404" width="110" height="46" rx="6" ry="6" />
  <text class="sub" x="793" y="424" text-anchor="middle">permission</text>
  <text class="sub" x="793" y="440" text-anchor="middle">modes</text>
</svg>
