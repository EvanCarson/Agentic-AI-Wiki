<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Planning loop shape</title>
  <desc id="d">Four-column comparison of planning loop shapes for Claude Code, Codex CLI, Cursor Agent, and Aider. Aider's two-pass architect/editor model is highlighted as the most distinctive approach.</desc>

  <!-- Background -->
  <rect width="900" height="300" fill="var(--paper)" rx="6"/>

  <!-- Chart title -->
  <text x="450" y="28" text-anchor="middle" font-family="inherit" font-size="14" font-weight="700" fill="var(--ink)">Planning loop shape</text>

  <!-- Column header backgrounds -->
  <rect x="0"   y="40" width="225" height="44" fill="var(--paper-2)"/>
  <rect x="225" y="40" width="225" height="44" fill="var(--paper-2)"/>
  <rect x="450" y="40" width="225" height="44" fill="var(--paper-2)"/>
  <rect x="675" y="40" width="225" height="44" fill="var(--accent)"/>

  <!-- Column header text -->
  <text x="112" y="67" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Claude Code</text>
  <text x="337" y="67" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Codex CLI</text>
  <text x="562" y="67" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Cursor Agent</text>
  <text x="787" y="67" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--paper)">Aider</text>

  <!-- Column vertical dividers -->
  <line x1="225" y1="40" x2="225" y2="260" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="450" y1="40" x2="450" y2="260" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="675" y1="40" x2="675" y2="260" stroke="var(--border-soft)" stroke-width="1"/>

  <!-- Header bottom line -->
  <line x1="0" y1="84" x2="900" y2="84" stroke="var(--border-soft)" stroke-width="1"/>

  <!-- Body cells -->
  <rect x="0"   y="84" width="225" height="176" fill="var(--paper-2)"/>
  <rect x="225" y="84" width="225" height="176" fill="var(--paper-2)"/>
  <rect x="450" y="84" width="225" height="176" fill="var(--accent-soft)"/>
  <rect x="675" y="84" width="225" height="176" fill="var(--accent)"/>

  <!-- Body text — Claude Code -->
  <text x="112" y="125" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">Explicit persisted</text>
  <text x="112" y="143" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">task list (Tasks)</text>

  <!-- Body text — Codex CLI -->
  <text x="337" y="125" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">Task queue under</text>
  <text x="337" y="143" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">approval policy</text>

  <!-- Body text — Cursor Agent (accent-soft) -->
  <text x="562" y="118" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">Interactive plan</text>
  <text x="562" y="136" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">→ diff →</text>
  <text x="562" y="154" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">human review</text>

  <!-- Body text — Aider (accent background, paper text) -->
  <text x="787" y="118" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">Architect/editor</text>
  <text x="787" y="136" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">two-pass: plan</text>
  <text x="787" y="154" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">model + edit model</text>

  <!-- Bottom border -->
  <line x1="0" y1="260" x2="900" y2="260" stroke="var(--border-soft)" stroke-width="1"/>
</svg>
