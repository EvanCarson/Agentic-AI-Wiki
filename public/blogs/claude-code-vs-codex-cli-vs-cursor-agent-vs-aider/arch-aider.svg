<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Aider architecture</title>
  <desc id="d">Aider pairs a planning model with an editing model, applies SEARCH/REPLACE edit blocks parsed from the editor's output, and auto-commits each edit to git; the loop repeats per round.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Top: Repo Map -> REPL -->
  <rect class="box" x="44" y="46" width="240" height="56" rx="8" ry="8" />
  <text class="label" x="164" y="70" text-anchor="middle" font-weight="600">Repo Map</text>
  <text class="sub" x="164" y="89" text-anchor="middle">symbol + file index → context</text>

  <rect class="hero" x="330" y="44" width="240" height="60" rx="8" ry="8" />
  <text class="label-inv" x="450" y="70" text-anchor="middle" font-weight="600">REPL</text>
  <text class="label-inv" x="450" y="90" text-anchor="middle" font-size="12">interactive chat loop</text>

  <line class="arrow" x1="284" y1="74" x2="328" y2="74" />

  <!-- REPL drives the architect/editor pipeline -->
  <line class="arrow" x1="408" y1="104" x2="140" y2="220" />

  <!-- Pipeline row -->
  <rect class="box" x="44" y="222" width="186" height="72" rx="8" ry="8" />
  <text class="label" x="137" y="252" text-anchor="middle" font-weight="600">Architect Model</text>
  <text class="sub" x="137" y="272" text-anchor="middle">reasoning model — PLANS</text>

  <rect class="box" x="270" y="222" width="186" height="72" rx="8" ry="8" />
  <text class="label" x="363" y="252" text-anchor="middle" font-weight="600">Editor Model</text>
  <text class="sub" x="363" y="272" text-anchor="middle">code model — EMITS DIFFS</text>

  <rect class="adj" x="496" y="222" width="186" height="72" rx="8" ry="8" />
  <text class="label" x="589" y="252" text-anchor="middle" font-weight="600">Edit-Blocks Parser</text>
  <text class="sub" x="589" y="272" text-anchor="middle">SEARCH / REPLACE</text>

  <rect class="box" x="722" y="222" width="140" height="72" rx="8" ry="8" />
  <text class="label" x="792" y="252" text-anchor="middle" font-weight="600">Git Commit</text>
  <text class="sub" x="792" y="272" text-anchor="middle">auto per edit</text>

  <line class="arrow" x1="230" y1="258" x2="268" y2="258" />
  <line class="arrow" x1="456" y1="258" x2="494" y2="258" />
  <line class="arrow" x1="682" y1="258" x2="720" y2="258" />

  <!-- next round: Git Commit back up to the REPL -->
  <path class="arrow" d="M 792 222 L 792 74 L 572 74" />
  <text class="sub" x="690" y="65" text-anchor="middle">next round</text>

  <!-- No sandbox note -->
  <rect class="bound" x="44" y="358" width="280" height="52" rx="8" ry="8" />
  <text class="label" x="184" y="382" text-anchor="middle" font-weight="600">No Sandbox</text>
  <text class="sub" x="184" y="400" text-anchor="middle">git history is the safety net</text>
</svg>
