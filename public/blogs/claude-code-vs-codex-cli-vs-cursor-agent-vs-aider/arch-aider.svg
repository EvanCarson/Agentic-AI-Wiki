<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Aider architecture</title>
  <desc id="d">Aider pairs a planning model with an editing model, applies SEARCH/REPLACE edit blocks parsed from the editor's output, and auto-commits each edit to git.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- HERO: REPL -->
  <rect class="hero" x="340" y="210" width="220" height="60" rx="8" ry="8" />
  <text class="label-inv" x="450" y="237" text-anchor="middle" font-weight="600">REPL</text>
  <text class="label-inv" x="450" y="258" text-anchor="middle" font-size="12">interactive chat loop</text>

  <!-- Repo Map input (top-left) -->
  <rect class="box" x="40" y="60" width="200" height="60" rx="8" ry="8" />
  <text class="label" x="140" y="87" text-anchor="middle" font-weight="600">Repo Map</text>
  <text class="sub" x="140" y="106" text-anchor="middle">symbol + file index → context</text>
  <line class="arrow" x1="240" y1="90" x2="338" y2="230" />

  <!-- Architect model -->
  <rect class="box" x="40" y="200" width="200" height="65" rx="8" ry="8" />
  <text class="label" x="140" y="225" text-anchor="middle" font-weight="600">Architect Model</text>
  <text class="sub" x="140" y="244" text-anchor="middle">reasoning model</text>
  <text class="sub" x="140" y="260" text-anchor="middle">PLANS the change</text>

  <!-- Editor model -->
  <rect class="box" x="40" y="320" width="200" height="65" rx="8" ry="8" />
  <text class="label" x="140" y="345" text-anchor="middle" font-weight="600">Editor Model</text>
  <text class="sub" x="140" y="364" text-anchor="middle">code-focused model</text>
  <text class="sub" x="140" y="380" text-anchor="middle">EMITS DIFFS</text>

  <!-- Arrow: architect to REPL, REPL routes to editor -->
  <line class="arrow" x1="240" y1="232" x2="338" y2="238" />
  <line class="arrow" x1="338" y1="258" x2="240" y2="350" />
  <!-- Architect delegates to editor -->
  <line class="arrow" x1="140" y1="265" x2="140" y2="318" />

  <!-- Edit-blocks parser -->
  <rect class="adj" x="540" y="200" width="200" height="65" rx="8" ry="8" />
  <text class="label" x="640" y="225" text-anchor="middle" font-weight="600">Edit-Blocks Parser</text>
  <text class="sub" x="640" y="244" text-anchor="middle">SEARCH / REPLACE</text>
  <text class="sub" x="640" y="260" text-anchor="middle">format parsing</text>
  <line class="arrow" x1="562" y1="240" x2="562" y2="240" />
  <line class="arrow" x1="560" y1="238" x2="542" y2="238" />

  <!-- Arrow from REPL to parser -->
  <line class="arrow" x1="560" y1="238" x2="542" y2="238" />
  <line class="arrow" x1="562" y1="238" x2="542" y2="238" />

  <!-- Proper arrow from REPL right to parser -->
  <line class="arrow" x1="560" y1="240" x2="538" y2="240" />

  <!-- Git commit-per-edit cycle -->
  <rect class="box" x="540" y="330" width="200" height="65" rx="8" ry="8" />
  <text class="label" x="640" y="355" text-anchor="middle" font-weight="600">Git Commit</text>
  <text class="sub" x="640" y="374" text-anchor="middle">auto-committed per edit</text>
  <text class="sub" x="640" y="390" text-anchor="middle">history = safety net</text>
  <line class="arrow" x1="640" y1="265" x2="640" y2="328" />

  <!-- Loop: git back to REPL -->
  <path class="arrow" d="M 640 395 Q 640 450 450 450 Q 340 450 340 270" />
  <text class="sub" x="490" y="465" text-anchor="middle">next round</text>

  <!-- Editor output feeds parser -->
  <path class="arrow" d="M 240 352 Q 390 352 390 265" />

  <!-- No sandbox note -->
  <rect class="bound" x="700" y="60" width="170" height="60" rx="8" ry="8" />
  <text class="label" x="785" y="87" text-anchor="middle" font-weight="600">No Sandbox</text>
  <text class="sub" x="785" y="106" text-anchor="middle">git history is safety net</text>
</svg>
