<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Coding-agent feature matrix</title>
  <desc id="d">Heatmap comparing Claude Code, Codex CLI, Cursor Agent, and Aider across six features: Sandbox, Planning loop, MCP support, Multi-file edits, IDE-native, and Commit policy. Each cell is colored weak (light), medium (soft accent), or strong (accent) and labeled with a 1–2 word descriptor.</desc>

  <!-- Background -->
  <rect width="900" height="500" fill="var(--paper)" rx="6"/>

  <!-- ── Layout constants ────────────────────────────────────────────
       Header row y=0..60; data rows y=60..60+4*90=420; legend y=430..500
       Left label col x=0..150; 6 data cols each 125px wide x=150..900
  ─────────────────────────────────────────────────────────────────── -->

  <!-- Column header row background -->
  <rect x="150" y="0" width="750" height="60" fill="var(--paper-2)"/>

  <!-- Column header text -->
  <!-- col centers: 150+62=212, +125=337, +125=462, +125=587, +125=712, +125=837 -->
  <text x="212" y="36" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Sandbox</text>
  <text x="337" y="36" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Planning loop</text>
  <text x="462" y="36" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">MCP support</text>
  <text x="587" y="36" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Multi-file edits</text>
  <text x="712" y="36" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">IDE-native</text>
  <text x="837" y="36" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Commit policy</text>

  <!-- Column header dividers -->
  <line x1="150" y1="0" x2="150" y2="60" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="275" y1="0" x2="275" y2="60" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="60" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="525" y1="0" x2="525" y2="60" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="650" y1="0" x2="650" y2="60" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="775" y1="0" x2="775" y2="60" stroke="var(--border-soft)" stroke-width="1"/>

  <!-- ── Row label column ────────────────────────────────────────── -->
  <!-- Row 0: y=60..150, row 1: y=150..240, row 2: y=240..330, row 3: y=330..420 -->
  <!-- Row label backgrounds -->
  <rect x="0" y="60"  width="150" height="90" fill="var(--paper-2)"/>
  <rect x="0" y="150" width="150" height="90" fill="var(--paper-2)"/>
  <rect x="0" y="240" width="150" height="90" fill="var(--paper-2)"/>
  <rect x="0" y="330" width="150" height="90" fill="var(--paper-2)"/>

  <!-- Color swatches in row labels -->
  <rect x="8" y="95"  width="10" height="10" rx="2" fill="var(--accent)"/>
  <rect x="8" y="185" width="10" height="10" rx="2" fill="var(--muted)"/>
  <rect x="8" y="275" width="10" height="10" rx="2" fill="var(--accent-soft)"/>
  <rect x="8" y="365" width="10" height="10" rx="2" fill="var(--border-soft)"/>

  <!-- Row label text -->
  <text x="75" y="96"  text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Claude Code</text>
  <text x="75" y="186" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Codex CLI</text>
  <text x="75" y="276" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Cursor Agent</text>
  <text x="75" y="366" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Aider</text>

  <!-- ── Helper: cell fill macro
       weak   = var(--paper-2)       text = var(--ink)
       medium = var(--accent-soft)   text = var(--ink)
       strong = var(--accent)        text = var(--paper)
  ─────────────────────────────────────────────────────────────────── -->

  <!-- ════ ROW 0 — Claude Code ════ -->
  <!-- Sandbox: medium -->
  <rect x="150" y="60"  width="125" height="90" fill="var(--accent-soft)"/>
  <text x="212" y="100" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">OS sandbox</text>

  <!-- Planning: strong -->
  <rect x="275" y="60"  width="125" height="90" fill="var(--accent)"/>
  <text x="337" y="100" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">Task list</text>

  <!-- MCP: strong -->
  <rect x="400" y="60"  width="125" height="90" fill="var(--accent)"/>
  <text x="462" y="100" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">Yes</text>

  <!-- Multi-file: strong -->
  <rect x="525" y="60"  width="125" height="90" fill="var(--accent)"/>
  <text x="587" y="100" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">Yes</text>

  <!-- IDE-native: weak -->
  <rect x="650" y="60"  width="125" height="90" fill="var(--paper-2)"/>
  <text x="712" y="100" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">No</text>

  <!-- Commit: medium -->
  <rect x="775" y="60"  width="125" height="90" fill="var(--accent-soft)"/>
  <text x="837" y="100" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">On demand</text>

  <!-- ════ ROW 1 — Codex CLI ════ -->
  <!-- Sandbox: strong -->
  <rect x="150" y="150" width="125" height="90" fill="var(--accent)"/>
  <text x="212" y="190" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">Workspace</text>

  <!-- Planning: medium -->
  <rect x="275" y="150" width="125" height="90" fill="var(--accent-soft)"/>
  <text x="337" y="190" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">Queue</text>

  <!-- MCP: strong -->
  <rect x="400" y="150" width="125" height="90" fill="var(--accent)"/>
  <text x="462" y="190" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">Yes</text>

  <!-- Multi-file: strong -->
  <rect x="525" y="150" width="125" height="90" fill="var(--accent)"/>
  <text x="587" y="190" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">Yes</text>

  <!-- IDE-native: weak -->
  <rect x="650" y="150" width="125" height="90" fill="var(--paper-2)"/>
  <text x="712" y="190" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">No</text>

  <!-- Commit: strong -->
  <rect x="775" y="150" width="125" height="90" fill="var(--accent)"/>
  <text x="837" y="190" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">PR output</text>

  <!-- ════ ROW 2 — Cursor Agent ════ -->
  <!-- Sandbox: medium -->
  <rect x="150" y="240" width="125" height="90" fill="var(--accent-soft)"/>
  <text x="212" y="278" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">IDE-mediated</text>

  <!-- Planning: strong -->
  <rect x="275" y="240" width="125" height="90" fill="var(--accent)"/>
  <text x="337" y="278" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">Plan+diff</text>

  <!-- MCP: medium -->
  <rect x="400" y="240" width="125" height="90" fill="var(--accent-soft)"/>
  <text x="462" y="278" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">Partial</text>

  <!-- Multi-file: strong -->
  <rect x="525" y="240" width="125" height="90" fill="var(--accent)"/>
  <text x="587" y="278" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">Yes</text>

  <!-- IDE-native: strong -->
  <rect x="650" y="240" width="125" height="90" fill="var(--accent)"/>
  <text x="712" y="278" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">Yes</text>

  <!-- Commit: medium -->
  <rect x="775" y="240" width="125" height="90" fill="var(--accent-soft)"/>
  <text x="837" y="278" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">Diff review</text>

  <!-- ════ ROW 3 — Aider ════ -->
  <!-- Sandbox: weak -->
  <rect x="150" y="330" width="125" height="90" fill="var(--paper-2)"/>
  <text x="212" y="370" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">None</text>

  <!-- Planning: medium -->
  <rect x="275" y="330" width="125" height="90" fill="var(--accent-soft)"/>
  <text x="337" y="368" text-anchor="middle" font-family="inherit" font-size="11" fill="var(--ink)">Architect/</text>
  <text x="337" y="382" text-anchor="middle" font-family="inherit" font-size="11" fill="var(--ink)">editor</text>

  <!-- MCP: weak -->
  <rect x="400" y="330" width="125" height="90" fill="var(--paper-2)"/>
  <text x="462" y="370" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">No</text>

  <!-- Multi-file: medium -->
  <rect x="525" y="330" width="125" height="90" fill="var(--accent-soft)"/>
  <text x="587" y="370" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">Chunked</text>

  <!-- IDE-native: weak -->
  <rect x="650" y="330" width="125" height="90" fill="var(--paper-2)"/>
  <text x="712" y="370" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">No</text>

  <!-- Commit: strong -->
  <rect x="775" y="330" width="125" height="90" fill="var(--accent)"/>
  <text x="837" y="370" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">Per edit</text>

  <!-- ── Grid lines ───────────────────────────────────────────────── -->
  <!-- Horizontal lines -->
  <line x1="0"   y1="60"  x2="900" y2="60"  stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="0"   y1="150" x2="900" y2="150" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="0"   y1="240" x2="900" y2="240" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="0"   y1="330" x2="900" y2="330" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="0"   y1="420" x2="900" y2="420" stroke="var(--border-soft)" stroke-width="1"/>
  <!-- Vertical lines -->
  <line x1="150" y1="0"   x2="150" y2="420" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="275" y1="60"  x2="275" y2="420" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="400" y1="60"  x2="400" y2="420" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="525" y1="60"  x2="525" y2="420" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="650" y1="60"  x2="650" y2="420" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="775" y1="60"  x2="775" y2="420" stroke="var(--border-soft)" stroke-width="1"/>

  <!-- ── Legend ──────────────────────────────────────────────────── -->
  <rect x="0" y="420" width="900" height="80" fill="var(--paper)"/>
  <text x="450" y="442" text-anchor="middle" font-family="inherit" font-size="12" font-weight="600" fill="var(--ink)">Legend</text>

  <!-- Weak -->
  <rect x="220" y="452" width="20" height="20" rx="3" fill="var(--paper-2)" stroke="var(--border-soft)" stroke-width="1"/>
  <text x="248" y="466" font-family="inherit" font-size="12" fill="var(--ink)">Weak / absent</text>

  <!-- Medium -->
  <rect x="380" y="452" width="20" height="20" rx="3" fill="var(--accent-soft)"/>
  <text x="408" y="466" font-family="inherit" font-size="12" fill="var(--ink)">Medium / partial</text>

  <!-- Strong -->
  <rect x="550" y="452" width="20" height="20" rx="3" fill="var(--accent)"/>
  <text x="578" y="466" font-family="inherit" font-size="12" fill="var(--ink)">Strong / full</text>
</svg>
