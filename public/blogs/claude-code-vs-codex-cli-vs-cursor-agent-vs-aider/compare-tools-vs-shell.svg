<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Tool catalog vs the shell</title>
  <desc id="d">Four-column comparison of tool catalog breadth versus shell-first design for Claude Code, Codex CLI, Cursor Agent, and Aider. Claude Code is highlighted as having the richest tool surface.</desc>

  <!-- Background -->
  <rect width="900" height="300" fill="var(--paper)" rx="6"/>

  <!-- Chart title -->
  <text x="450" y="28" text-anchor="middle" font-family="inherit" font-size="14" font-weight="700" fill="var(--ink)">Tool catalog vs the shell</text>

  <!-- Column header backgrounds -->
  <rect x="0"   y="40" width="225" height="44" fill="var(--accent)"/>
  <rect x="225" y="40" width="225" height="44" fill="var(--paper-2)"/>
  <rect x="450" y="40" width="225" height="44" fill="var(--paper-2)"/>
  <rect x="675" y="40" width="225" height="44" fill="var(--paper-2)"/>

  <!-- Column header text -->
  <text x="112" y="67" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--paper)">Claude Code</text>
  <text x="337" y="67" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Codex CLI</text>
  <text x="562" y="67" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Cursor Agent</text>
  <text x="787" y="67" text-anchor="middle" font-family="inherit" font-size="13" font-weight="600" fill="var(--ink)">Aider</text>

  <!-- Column vertical dividers -->
  <line x1="225" y1="40" x2="225" y2="260" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="450" y1="40" x2="450" y2="260" stroke="var(--border-soft)" stroke-width="1"/>
  <line x1="675" y1="40" x2="675" y2="260" stroke="var(--border-soft)" stroke-width="1"/>

  <!-- Header bottom line -->
  <line x1="0" y1="84" x2="900" y2="84" stroke="var(--border-soft)" stroke-width="1"/>

  <!-- Body cells -->
  <rect x="0"   y="84" width="225" height="176" fill="var(--accent)"/>
  <rect x="225" y="84" width="225" height="176" fill="var(--paper-2)"/>
  <rect x="450" y="84" width="225" height="176" fill="var(--paper-2)"/>
  <rect x="675" y="84" width="225" height="176" fill="var(--paper-2)"/>

  <!-- Body text — Claude Code (accent background, paper text) -->
  <text x="112" y="118" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">Typed tool catalog</text>
  <text x="112" y="136" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">+ MCP</text>
  <text x="112" y="154" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--paper)">+ deferred tools</text>

  <!-- Body text — Codex CLI -->
  <text x="337" y="125" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">Shell-first inside</text>
  <text x="337" y="143" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">the sandbox (+MCP)</text>

  <!-- Body text — Cursor Agent -->
  <text x="562" y="118" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">IDE-wrapped tools</text>
  <text x="562" y="136" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">+ MCP</text>
  <text x="562" y="154" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">(~40 exposed)</text>

  <!-- Body text — Aider -->
  <text x="787" y="118" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">Narrow tools</text>
  <text x="787" y="136" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">+ git;</text>
  <text x="787" y="154" text-anchor="middle" font-family="inherit" font-size="12" fill="var(--ink)">no native MCP</text>

  <!-- Bottom border -->
  <line x1="0" y1="260" x2="900" y2="260" stroke="var(--border-soft)" stroke-width="1"/>
</svg>
