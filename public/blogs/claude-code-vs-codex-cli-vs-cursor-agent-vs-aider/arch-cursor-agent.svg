<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Cursor Agent architecture</title>
  <desc id="d">Cursor mediates edits through the IDE: the agent plans, generates a multi-file diff, a human accepts per file, accepted diffs are applied to the working copy, and the loop repeats.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Top row: Agents Window -> IDE Host <-> Model/Provider Router -->
  <rect class="box" x="44" y="46" width="216" height="56" rx="8" ry="8" />
  <text class="label" x="152" y="70" text-anchor="middle" font-weight="600">Agents Window</text>
  <text class="sub" x="152" y="89" text-anchor="middle">local · worktree · SSH · cloud</text>

  <rect class="hero" x="330" y="44" width="250" height="60" rx="8" ry="8" />
  <text class="label-inv" x="455" y="70" text-anchor="middle" font-weight="600">IDE Host</text>
  <text class="label-inv" x="455" y="90" text-anchor="middle" font-size="12">agent execution runtime</text>

  <rect class="box" x="648" y="46" width="210" height="56" rx="8" ry="8" />
  <text class="label" x="753" y="70" text-anchor="middle" font-weight="600">Model / Provider Router</text>
  <text class="sub" x="753" y="89" text-anchor="middle">GPT, Claude, Gemini…</text>

  <line class="arrow" x1="260" y1="74" x2="328" y2="74" />
  <line class="arrow" x1="582" y1="66" x2="646" y2="66" />
  <line class="arrow" x1="646" y1="82" x2="584" y2="82" />

  <!-- IDE Host drives the pipeline -->
  <line class="arrow" x1="408" y1="104" x2="138" y2="220" />

  <!-- Pipeline row -->
  <rect class="box" x="44" y="222" width="176" height="72" rx="8" ry="8" />
  <text class="label" x="132" y="252" text-anchor="middle" font-weight="600">1. Plan</text>
  <text class="sub" x="132" y="272" text-anchor="middle">intent + file scope</text>

  <rect class="box" x="268" y="222" width="176" height="72" rx="8" ry="8" />
  <text class="label" x="356" y="252" text-anchor="middle" font-weight="600">2. Generate Diffs</text>
  <text class="sub" x="356" y="272" text-anchor="middle">multi-file edit surface</text>

  <rect class="adj" x="492" y="222" width="176" height="72" rx="8" ry="8" />
  <text class="label" x="580" y="252" text-anchor="middle" font-weight="600">3. Human Review</text>
  <text class="sub" x="580" y="272" text-anchor="middle">accept / reject per file</text>

  <rect class="box" x="716" y="222" width="140" height="72" rx="8" ry="8" />
  <text class="label" x="786" y="252" text-anchor="middle" font-weight="600">4. Apply</text>
  <text class="sub" x="786" y="272" text-anchor="middle">writes accepted diffs</text>

  <line class="arrow" x1="220" y1="258" x2="266" y2="258" />
  <line class="arrow" x1="444" y1="258" x2="490" y2="258" />
  <line class="arrow" x1="668" y1="258" x2="714" y2="258" />
  <text class="sub" x="691" y="248" text-anchor="middle">accept</text>

  <!-- Apply -> Working Copy -> next round -> Plan -->
  <rect class="box" x="716" y="360" width="140" height="64" rx="8" ry="8" />
  <text class="label" x="786" y="388" text-anchor="middle" font-weight="600">Working Copy</text>
  <text class="sub" x="786" y="407" text-anchor="middle">updated in IDE</text>
  <line class="arrow" x1="786" y1="294" x2="786" y2="358" />

  <path class="arrow" d="M 786 424 L 786 458 L 132 458 L 132 296" />
  <text class="sub" x="455" y="450" text-anchor="middle">next round</text>
</svg>
