<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Cursor Agent architecture</title>
  <desc id="d">Cursor mediates edits through the IDE, routing to model providers, proposing per-file diffs, and requiring human review before changes are applied.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- HERO: IDE Host -->
  <rect class="hero" x="330" y="40" width="240" height="60" rx="8" ry="8" />
  <text class="label-inv" x="450" y="67" text-anchor="middle" font-weight="600">IDE Host</text>
  <text class="label-inv" x="450" y="88" text-anchor="middle" font-size="12">agent execution runtime</text>

  <!-- Model / provider router -->
  <rect class="box" x="640" y="40" width="220" height="60" rx="8" ry="8" />
  <text class="label" x="750" y="67" text-anchor="middle" font-weight="600">Model / Provider Router</text>
  <text class="sub" x="750" y="88" text-anchor="middle">GPT-4o, Claude, Gemini…</text>
  <line class="arrow" x1="570" y1="70" x2="638" y2="70" />
  <line class="arrow" x1="638" y1="85" x2="570" y2="95" />

  <!-- Plan step -->
  <rect class="box" x="180" y="180" width="160" height="55" rx="8" ry="8" />
  <text class="label" x="260" y="205" text-anchor="middle" font-weight="600">1. Plan</text>
  <text class="sub" x="260" y="224" text-anchor="middle">intent + file scope</text>

  <!-- Diff step -->
  <rect class="box" x="380" y="180" width="160" height="55" rx="8" ry="8" />
  <text class="label" x="460" y="205" text-anchor="middle" font-weight="600">2. Generate Diffs</text>
  <text class="sub" x="460" y="224" text-anchor="middle">multi-file edit surface</text>

  <!-- Human review (highlighted) -->
  <rect class="adj" x="580" y="180" width="200" height="55" rx="8" ry="8" />
  <text class="label" x="680" y="205" text-anchor="middle" font-weight="600">3. Human Review</text>
  <text class="sub" x="680" y="224" text-anchor="middle">accept / reject per file</text>

  <!-- Apply step -->
  <rect class="box" x="380" y="310" width="160" height="55" rx="8" ry="8" />
  <text class="label" x="460" y="335" text-anchor="middle" font-weight="600">4. Apply</text>
  <text class="sub" x="460" y="354" text-anchor="middle">writes accepted diffs</text>

  <!-- Arrows for the loop -->
  <line class="arrow" x1="450" y1="100" x2="260" y2="178" />
  <line class="arrow" x1="340" y1="208" x2="378" y2="208" />
  <line class="arrow" x1="540" y1="208" x2="578" y2="208" />
  <line class="arrow" x1="680" y1="235" x2="540" y2="310" />
  <!-- Reject loops back to plan -->
  <path class="arrow" d="M 680 235 Q 790 300 790 390 Q 790 430 260 430 Q 180 430 180 235" />
  <text class="sub" x="790" y="390" text-anchor="start">reject</text>

  <!-- Apply to IDE / done -->
  <line class="arrow" x1="460" y1="365" x2="460" y2="415" />
  <rect class="box" x="380" y="415" width="160" height="50" rx="8" ry="8" />
  <text class="label" x="460" y="438" text-anchor="middle" font-weight="600">Working Copy</text>
  <text class="sub" x="460" y="456" text-anchor="middle">updated in IDE</text>

  <!-- MCP note -->
  <rect class="box" x="40" y="180" width="120" height="55" rx="8" ry="8" />
  <text class="label" x="100" y="205" text-anchor="middle" font-weight="600">MCP</text>
  <text class="sub" x="100" y="224" text-anchor="middle">tool extensions</text>
  <line class="arrow" x1="160" y1="207" x2="178" y2="207" />

  <!-- Agents Window note -->
  <rect class="box" x="40" y="310" width="120" height="55" rx="8" ry="8" />
  <text class="label" x="100" y="330" text-anchor="middle" font-weight="600">Agents Window</text>
  <text class="sub" x="100" y="349" text-anchor="middle">multi-agent (v3)</text>
  <line class="arrow" x1="160" y1="337" x2="328" y2="230" />
</svg>
