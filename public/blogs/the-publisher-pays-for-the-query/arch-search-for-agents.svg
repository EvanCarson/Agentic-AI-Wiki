<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="sa sad">
  <title id="sa">How Search for Agents builds and serves an index</title>
  <desc id="sad">One zone toggle creates a Cloudflare AI Search instance. A build lane crawls the site's pages and writes an index, by default once every 24 hours. A query lane has a visiting agent read four agent meta tags from any page's HTML, call the site's own /.well-known/search endpoint, and receive Markdown excerpts with relevance scores rather than a generated answer. Three meters run against the site owner's account: ingesting content, storing the index and serving queries, with billing from 1 December 2026. The querying agent pays Cloudflare nothing.</desc>
  <style>
    .sa-hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .sa-adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .sa-box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .sa-ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .sa-lab   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .sa-labi  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sa-sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sa-subi  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .sa-tag   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .sa-arr   { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#saarr); }
  </style>
  <defs>
    <marker id="saarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="sa-ttl" x="20" y="26">A build lane you pay to fill, a query lane you pay to serve.</text>

  <text class="sa-tag" x="20" y="52">BUILD &mdash; ONCE, THEN EVERY 24H ON THE DEFAULT SYNC</text>

  <rect class="sa-box" x="40" y="64" width="230" height="62" />
  <text class="sa-lab" x="155" y="92" text-anchor="middle">Your site's pages</text>
  <text class="sa-sub" x="155" y="112" text-anchor="middle">sitemap or link discovery</text>

  <path class="sa-arr" d="M 270 95 L 316 95" />

  <rect class="sa-box" x="320" y="64" width="230" height="62" />
  <text class="sa-lab" x="435" y="92" text-anchor="middle">Cloudflare-AI-Search</text>
  <text class="sa-sub" x="435" y="112" text-anchor="middle">5 hops, up to 100,000 pages</text>

  <path class="sa-arr" d="M 550 100 L 700 146" />

  <rect class="sa-hero" x="620" y="150" width="250" height="90" />
  <text class="sa-labi" x="745" y="182" text-anchor="middle">AI Search instance</text>
  <text class="sa-subi" x="745" y="204" text-anchor="middle">one per zone, in your account</text>
  <text class="sa-subi" x="745" y="224" text-anchor="middle">hybrid keyword plus vector</text>

  <text class="sa-tag" x="20" y="176">QUERY &mdash; PER REQUEST, METERED FROM 1 DEC 2026</text>

  <rect class="sa-box" x="40" y="188" width="230" height="62" />
  <text class="sa-lab" x="155" y="216" text-anchor="middle">A visiting agent</text>
  <text class="sa-sub" x="155" y="236" text-anchor="middle">nobody has said it will look</text>

  <path class="sa-arr" d="M 270 219 L 316 219" />

  <rect class="sa-box" x="320" y="188" width="230" height="62" />
  <text class="sa-lab" x="435" y="216" text-anchor="middle">Four agent: meta tags</text>
  <text class="sa-sub" x="435" y="236" text-anchor="middle">in every HTML page</text>

  <path class="sa-arr" d="M 550 219 L 616 203" />

  <path class="sa-arr" d="M 700 240 L 520 300" />

  <rect class="sa-adj" x="250" y="306" width="400" height="66" />
  <text class="sa-lab" x="450" y="334" text-anchor="middle">Markdown excerpts, each with a score</text>
  <text class="sa-sub" x="450" y="356" text-anchor="middle">retrieved content, not a generated answer</text>

  <rect class="sa-box" x="40" y="412" width="820" height="66" />
  <text class="sa-lab" x="450" y="440" text-anchor="middle">Three meters, all on the publisher's account: ingest, store, serve</text>
  <text class="sa-sub" x="450" y="462" text-anchor="middle">the querying agent pays Cloudflare nothing to ask</text>
</svg>
