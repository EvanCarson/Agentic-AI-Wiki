<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="pi pid">
  <title id="pi">Three shapes of publisher-side agent interface</title>
  <desc id="pid">A comparison of llms.txt, the /.well-known/search endpoint and the WebMCP and NLWeb family. llms.txt is a static list of pages for an agent to read, costing the publisher nothing per request. The search endpoint is a hosted retrieval API the publisher pays per query to serve. WebMCP and NLWeb expose callable actions, where the publisher pays for whatever the action does. Only the middle one charges the publisher per question asked.</desc>
  <style>
    .pi-hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pi-adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pi-box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pi-ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .pi-hd    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .pi-lab   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .pi-labi  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .pi-sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .pi-subi  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
  </style>

  <text class="pi-ttl" x="20" y="26">Read a list, query an index, or call an action.</text>

  <text class="pi-hd" x="160" y="58" text-anchor="middle">llms.txt</text>
  <text class="pi-hd" x="450" y="58" text-anchor="middle">/.well-known/search</text>
  <text class="pi-hd" x="750" y="58" text-anchor="middle">WebMCP, NLWeb</text>

  <rect class="pi-box" x="40" y="74" width="240" height="88" />
  <text class="pi-lab" x="160" y="104" text-anchor="middle">A list to read</text>
  <text class="pi-sub" x="160" y="126" text-anchor="middle">static file, no index,</text>
  <text class="pi-sub" x="160" y="146" text-anchor="middle">no standards process</text>

  <rect class="pi-hero" x="330" y="74" width="240" height="88" />
  <text class="pi-labi" x="450" y="104" text-anchor="middle">An index to query</text>
  <text class="pi-subi" x="450" y="126" text-anchor="middle">hosted retrieval, scores,</text>
  <text class="pi-subi" x="450" y="146" text-anchor="middle">unregistered well-known URI</text>

  <rect class="pi-adj" x="630" y="74" width="240" height="88" />
  <text class="pi-lab" x="750" y="104" text-anchor="middle">Actions to call</text>
  <text class="pi-sub" x="750" y="126" text-anchor="middle">in-tab or schema.org,</text>
  <text class="pi-sub" x="750" y="146" text-anchor="middle">each instance an MCP server</text>

  <rect class="pi-box" x="40" y="188" width="240" height="74" />
  <text class="pi-lab" x="160" y="216" text-anchor="middle">Publisher pays: nothing</text>
  <text class="pi-sub" x="160" y="240" text-anchor="middle">beyond serving the file</text>

  <rect class="pi-box" x="330" y="188" width="240" height="74" />
  <text class="pi-lab" x="450" y="216" text-anchor="middle">Publisher pays: per query</text>
  <text class="pi-sub" x="450" y="240" text-anchor="middle">plus ingest and storage</text>

  <rect class="pi-box" x="630" y="188" width="240" height="74" />
  <text class="pi-lab" x="750" y="216" text-anchor="middle">Publisher pays: per action</text>
  <text class="pi-sub" x="750" y="240" text-anchor="middle">whatever the action costs</text>
</svg>
