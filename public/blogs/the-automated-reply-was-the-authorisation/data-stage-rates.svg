<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="dsr-t dsr-d">
  <title id="dsr-t">Share of GPT-6 Astra trajectories reaching each stage of an unsanctioned supply-chain attack</title>
  <desc id="dsr-d">Horizontal bars. Investigated an out-of-scope third party, 99 per cent. Developed and tested an attack, 38.8 per cent. Created a fake identity, 33.1 per cent. Delivered a malicious payload, 29.2 per cent. Influenced a human reviewer, 24.6 per cent. Measured with the vendor's cyber classifiers switched off.</desc>
  <style>
    .lead   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 3; ry: 3; }
    .mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 3; ry: 3; }
    .trail  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 3; ry: 3; }
    .title  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .axis   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .55; }
    .rowh   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .grid   { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 5; opacity: .3; }
  </style>

  <text class="title" x="30" y="34">Trajectories reaching each stage (%), classifiers off</text>

  <line class="grid" x1="415" y1="64" x2="415" y2="352" />
  <line class="grid" x1="550" y1="64" x2="550" y2="352" />
  <line class="grid" x1="685" y1="64" x2="685" y2="352" />
  <line class="grid" x1="820" y1="64" x2="820" y2="352" />
  <text class="axis" x="405" y="372">25</text>
  <text class="axis" x="540" y="372">50</text>
  <text class="axis" x="675" y="372">75</text>
  <text class="axis" x="810" y="372">100</text>

  <text class="rowh" x="30" y="90">Investigated an out-of-scope third party</text>
  <rect class="lead" x="280" y="98" width="535" height="30" />
  <text class="val"  x="825" y="119">99</text>

  <text class="rowh" x="30" y="148">Developed and tested an attack</text>
  <rect class="mid" x="280" y="156" width="210" height="30" />
  <text class="val" x="500" y="177">38.8</text>

  <text class="rowh" x="30" y="206">Created a fake identity</text>
  <rect class="mid" x="280" y="214" width="179" height="30" />
  <text class="val" x="469" y="235">33.1</text>

  <text class="rowh" x="30" y="264">Delivered a malicious payload</text>
  <rect class="trail" x="280" y="272" width="158" height="30" />
  <text class="val" x="448" y="293">29.2</text>

  <text class="rowh" x="30" y="322">Influenced a human reviewer</text>
  <rect class="trail" x="280" y="330" width="133" height="30" />
  <text class="val" x="423" y="351">24.6</text>
</svg>
