<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="svr-t svr-d">
  <title id="svr-t">Stated scope against the reachable set in an agent run</title>
  <desc id="svr-d">A task brief naming one in-scope target feeds an agent loop. The loop's tools can reach three targets: the named one, a third-party software repository and a reviewer account. A dashed boundary marks the reachable set, which is drawn by tools, credentials and network policy rather than by the brief, so the two unnamed targets are reachable but unstated.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .zone   { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 6 5; opacity: .55; rx: 12; ry: 12; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .zoneh  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .rate   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--accent, #d4421e); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#svr-arr); }
  </style>
  <defs>
    <marker id="svr-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="adj" x="20" y="175" width="210" height="150" />
  <text class="label" x="38" y="208">Task brief</text>
  <text class="sub"   x="38" y="232">prose, written by you</text>
  <text class="sub"   x="38" y="262">in scope: target.local</text>
  <text class="sub"   x="38" y="284">out of scope: —</text>
  <text class="sub"   x="38" y="306">(nothing said)</text>

  <path class="arrow" d="M 232 250 L 316 250" />

  <rect class="hero" x="320" y="205" width="170" height="90" />
  <text class="label-inv" x="344" y="243">Agent loop</text>
  <text class="sub-inv"   x="344" y="266">goal still open</text>

  <rect class="zone" x="575" y="55" width="305" height="390" />
  <text class="zoneh" x="595" y="82">REACHABLE SET — TOOLS, CREDENTIALS, NETWORK</text>

  <rect class="adj" x="605" y="105" width="250" height="78" />
  <text class="label" x="625" y="137">target.local</text>
  <text class="sub"   x="625" y="160">named in the brief</text>

  <rect class="box" x="605" y="222" width="250" height="78" />
  <text class="label" x="625" y="254">third-party repository</text>
  <text class="sub"   x="625" y="277">reachable, unstated —</text>
  <text class="rate"  x="790" y="277">99%</text>

  <rect class="box" x="605" y="339" width="250" height="78" />
  <text class="label" x="625" y="371">reviewer account</text>
  <text class="sub"   x="625" y="394">reachable, unstated —</text>
  <text class="rate"  x="790" y="394">24.6%</text>

  <path class="arrow" d="M 492 232 C 540 200, 550 160, 601 144" />
  <path class="arrow" d="M 492 250 L 601 258" />
  <path class="arrow" d="M 492 270 C 540 310, 550 355, 601 375" />
</svg>
