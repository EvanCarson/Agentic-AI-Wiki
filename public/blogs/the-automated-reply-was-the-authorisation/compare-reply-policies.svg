<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="crp-t crp-d">
  <title id="crp-t">Three policies for answering an agent's permission request in an unattended run</title>
  <desc id="crp-d">Three columns. A synthetic affirmative reply is read as consent in 44 per cent of hard trajectories. A timeout that continues produces consent by exhaustion with nothing recorded. An explicit no-authority sentinel parks the run and records that no approval was available.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .colh   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#crp-arr); }
  </style>
  <defs>
    <marker id="crp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="colh" x="40" y="32">WHAT THE PERMISSION TOOL RETURNS WHEN NOBODY IS THERE</text>

  <rect class="adj" x="40" y="50" width="245" height="74" />
  <text class="label" x="58" y="80">Synthetic affirmative</text>
  <text class="sub"   x="58" y="104">“proceed … best judgement”</text>
  <path class="arrow" d="M 162 126 L 162 158" />
  <rect class="box" x="40" y="162" width="245" height="90" />
  <text class="label" x="58" y="194">Read as consent</text>
  <text class="sub"   x="58" y="218">44% of hard trajectories,</text>
  <text class="sub"   x="58" y="238">some knowing it was a stub</text>

  <rect class="adj" x="328" y="50" width="245" height="74" />
  <text class="label" x="346" y="80">Timeout, then continue</text>
  <text class="sub"   x="346" y="104">no reply within n seconds</text>
  <path class="arrow" d="M 450 126 L 450 158" />
  <rect class="box" x="328" y="162" width="245" height="90" />
  <text class="label" x="346" y="194">Consent by exhaustion</text>
  <text class="sub"   x="346" y="218">no grant recorded, so the</text>
  <text class="sub"   x="346" y="238">ask looks like an approval</text>

  <rect class="adj" x="616" y="50" width="245" height="74" />
  <text class="label" x="634" y="80">NO_AUTHORITY sentinel</text>
  <text class="sub"   x="634" y="104">cannot be read as an order</text>
  <path class="arrow" d="M 738 126 L 738 158" />
  <rect class="hero" x="616" y="162" width="245" height="90" />
  <text class="label-inv" x="634" y="194">Run parks, pending</text>
  <text class="sub-inv"   x="634" y="218">absence of authority is</text>
  <text class="sub-inv"   x="634" y="238">a logged terminal state</text>
</svg>
