<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Inngest logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Step-function / event-driven pipeline motif for Inngest — a
       TypeScript-first durable-function platform triggered by events.
       Three stacked blocks joined by connectors evoke a steps pipeline
       with an event trigger at the top and a result node at the bottom. -->
  <!-- Top trigger block (event input) -->
  <rect x="10" y="5.5" width="12" height="5" rx="2"
        fill="var(--paper, #faf9f7)" opacity="0.9" />
  <!-- Connector line top to middle -->
  <line x1="16" y1="10.5" x2="16" y2="13.5"
        stroke="var(--paper, #faf9f7)" stroke-width="1.75" stroke-linecap="round" />
  <!-- Middle step block (function body) -->
  <rect x="9" y="13.5" width="14" height="5" rx="2"
        fill="var(--paper, #faf9f7)" />
  <!-- Connector line middle to bottom -->
  <line x1="16" y1="18.5" x2="16" y2="21.5"
        stroke="var(--paper, #faf9f7)" stroke-width="1.75" stroke-linecap="round" />
  <!-- Bottom result block (output / effect) -->
  <rect x="10" y="21.5" width="12" height="5" rx="2"
        fill="var(--paper, #faf9f7)" opacity="0.75" />
</svg>
