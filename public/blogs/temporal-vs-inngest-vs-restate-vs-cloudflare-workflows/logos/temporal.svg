<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Temporal logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Clock-face / workflow motif for Temporal — the durable-execution
       engine that survives process crashes by replaying history.
       Outer circle is the clock ring; tick marks at 12/3/6/9 evoke a
       timer; two workflow-node dots on the hands hint at orchestration. -->
  <!-- Clock outer ring -->
  <circle cx="16" cy="16" r="10" fill="none"
          stroke="var(--paper, #faf9f7)" stroke-width="2" />
  <!-- Hour hand pointing to ~10 o'clock (workflow "step A") -->
  <line x1="16" y1="16" x2="10" y2="9.5"
        stroke="var(--paper, #faf9f7)" stroke-width="2.25" stroke-linecap="round" />
  <!-- Minute hand pointing to ~3 o'clock (workflow "step B") -->
  <line x1="16" y1="16" x2="24.5" y2="16"
        stroke="var(--paper, #faf9f7)" stroke-width="2" stroke-linecap="round" />
  <!-- Centre pivot -->
  <circle cx="16" cy="16" r="1.75" fill="var(--paper, #faf9f7)" />
  <!-- Tick marks at cardinal points (12, 3, 6, 9) -->
  <line x1="16" y1="6.5" x2="16" y2="8.5" stroke="var(--paper, #faf9f7)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="25.5" y1="16" x2="23.5" y2="16" stroke="var(--paper, #faf9f7)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="16" y1="25.5" x2="16" y2="23.5" stroke="var(--paper, #faf9f7)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="6.5" y1="16" x2="8.5" y2="16" stroke="var(--paper, #faf9f7)" stroke-width="1.5" stroke-linecap="round" />
</svg>
