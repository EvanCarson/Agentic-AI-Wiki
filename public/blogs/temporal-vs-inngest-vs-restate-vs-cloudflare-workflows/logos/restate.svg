<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Restate logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Re-circulating replay arc motif for Restate — a durable-execution
       engine that persists invocation journals and replays on failure.
       A bold "R" with an arc curling back around the top evokes both the
       brand initial and the "re-" prefix of replay / restate. -->
  <!-- Stem of R (vertical left bar) -->
  <line x1="10" y1="8" x2="10" y2="24"
        stroke="var(--paper, #faf9f7)" stroke-width="2.75" stroke-linecap="round" />
  <!-- Upper bowl of R (half-circle right of stem, top) -->
  <path d="M 10 8 Q 22 8 22 13.5 Q 22 19 10 19"
        fill="none" stroke="var(--paper, #faf9f7)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Leg of R (diagonal from mid-right down) -->
  <line x1="16" y1="19" x2="23" y2="24"
        stroke="var(--paper, #faf9f7)" stroke-width="2.75" stroke-linecap="round" />
  <!-- Replay arc curling back over the top of R — the "re-" concept -->
  <path d="M 22 9 A 6.5 6.5 0 0 1 8 9"
        fill="none" stroke="var(--paper, #faf9f7)" stroke-width="1.5"
        stroke-linecap="round" opacity="0.65" />
  <!-- Arrowhead on replay arc (pointing left, back to start) -->
  <polyline points="8,6.5 8,9 10.5,9"
            fill="none" stroke="var(--paper, #faf9f7)" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />
</svg>
