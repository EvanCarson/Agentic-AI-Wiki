<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Cloudflare logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Geometric cloud silhouette for Cloudflare Workflows — a clean
       abstract cloud shape built from three overlapping circles and a
       flat base, avoiding reproduction of the trademark orange cloud.
       Evokes edge / distributed infrastructure. -->
  <!-- Base rectangle to cap the bottom of the cloud -->
  <rect x="6" y="18" width="20" height="5" rx="1"
        fill="var(--paper, #faf9f7)" />
  <!-- Left bump of cloud -->
  <circle cx="10" cy="18" r="4.5" fill="var(--paper, #faf9f7)" />
  <!-- Centre (tallest) bump of cloud -->
  <circle cx="16" cy="15" r="6" fill="var(--paper, #faf9f7)" />
  <!-- Right bump of cloud -->
  <circle cx="22" cy="18" r="4.5" fill="var(--paper, #faf9f7)" />
</svg>
