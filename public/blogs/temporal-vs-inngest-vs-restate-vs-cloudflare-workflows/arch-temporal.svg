<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Temporal — workflow worker + history event store</title>
  <desc id="d">A workflow worker process on the left runs your workflow-as-code and emits events to the Temporal service on the right, which holds the history DB, task queues, and worker pool. When a worker crashes, a new worker spins up and replays the full history to reconstruct state — history is the source of truth.</desc>
  <style>
    .box      { fill: var(--paper-2, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero     { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj      { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .envelope { fill: none; stroke: var(--ink, #1a1a1a); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .label    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink, #1a1a1a); }
    .label-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper, #fff); }
    .sub      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .85; }
    .annot    { font-family: var(--font-display); font-size: 13px; fill: var(--muted, #888); font-style: italic; }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .dash     { fill: none; stroke: var(--muted, #888); stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr-muted); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
    <marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted, #888)" />
    </marker>
  </defs>

  <!-- ===== LEFT: Workflow Worker Process ===== -->
  <rect class="hero" x="30" y="140" width="220" height="220" rx="10" ry="10" />
  <text class="label-inv" x="140" y="170" text-anchor="middle" font-weight="600">Workflow Worker</text>
  <text class="sub-inv" x="140" y="188" text-anchor="middle">Process</text>

  <!-- workflow code box inside hero -->
  <rect class="box" x="50" y="202" width="180" height="60" rx="6" ry="6" />
  <text class="label" x="140" y="226" text-anchor="middle" font-weight="600">Workflow code</text>
  <text class="sub" x="140" y="244" text-anchor="middle">deterministic fn(history)</text>

  <!-- activity box inside hero -->
  <rect class="box" x="50" y="276" width="180" height="60" rx="6" ry="6" />
  <text class="label" x="140" y="300" text-anchor="middle" font-weight="600">Activities</text>
  <text class="sub" x="140" y="318" text-anchor="middle">side-effects / I/O</text>

  <!-- ===== CENTER: arrows ===== -->
  <!-- Worker → Temporal service (emit events) -->
  <line class="arrow" x1="252" y1="230" x2="368" y2="215" />
  <text class="sub" x="310" y="208" text-anchor="middle">emit events</text>

  <!-- Worker → Temporal service (poll tasks) -->
  <line class="arrow" x1="368" y1="270" x2="252" y2="290" />
  <text class="sub" x="310" y="290" text-anchor="middle">poll tasks</text>

  <!-- ===== RIGHT: Temporal Service envelope ===== -->
  <rect class="envelope" x="370" y="60" width="490" height="380" rx="12" ry="12" />
  <text class="label" x="615" y="90" text-anchor="middle" font-weight="600">Temporal Service</text>
  <text class="sub" x="615" y="108" text-anchor="middle">history event store + task queues</text>

  <!-- History DB box -->
  <rect class="adj" x="396" y="124" width="200" height="90" rx="8" ry="8" />
  <text class="label" x="496" y="154" text-anchor="middle" font-weight="600">History DB</text>
  <text class="sub" x="496" y="172" text-anchor="middle">append-only event log</text>
  <text class="sub" x="496" y="188" text-anchor="middle">per workflow execution</text>

  <!-- Task Queue box -->
  <rect class="box" x="630" y="124" width="200" height="90" rx="8" ry="8" />
  <text class="label" x="730" y="154" text-anchor="middle" font-weight="600">Task Queue</text>
  <text class="sub" x="730" y="172" text-anchor="middle">dispatches workflow</text>
  <text class="sub" x="730" y="188" text-anchor="middle">+ activity tasks</text>

  <!-- Worker Pool box -->
  <rect class="box" x="396" y="238" width="434" height="80" rx="8" ry="8" />
  <text class="label" x="613" y="268" text-anchor="middle" font-weight="600">Worker Pool</text>
  <text class="sub" x="613" y="286" text-anchor="middle">many workers may poll the same queue</text>
  <text class="sub" x="613" y="302" text-anchor="middle">stateless — history provides all context</text>

  <!-- Internal arrows inside envelope -->
  <line class="arrow" x1="496" y1="214" x2="496" y2="236" />
  <line class="arrow" x1="730" y1="214" x2="730" y2="236" />

  <!-- ===== Crash + Replay annotation ===== -->
  <!-- Curved dashed arrow from Worker Pool back to Workflow Worker -->
  <path class="dash" d="M 396 330 C 330 370, 240 400, 140 365" />
  <text class="annot" x="270" y="400" text-anchor="middle">worker crashes → new worker</text>
  <text class="annot" x="270" y="415" text-anchor="middle">spins up → replays history</text>

  <!-- ===== Bottom annotation ===== -->
  <text class="annot" x="450" y="470" text-anchor="middle">Workflow-as-code; history is the source of truth.</text>
</svg>
