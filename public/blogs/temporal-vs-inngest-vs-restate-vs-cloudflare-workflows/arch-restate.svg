<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Restate — virtual objects + per-object journal</title>
  <desc id="d">An HTTP RPC call enters the Restate runtime on the right. Inside the runtime, four virtual object instances each maintain their own per-object journal that records exactly-once handler invocations. Unlike Temporal's single history per workflow execution, Restate fans out durability to individual object instances — no idempotency keys needed in user code.</desc>
  <style>
    .box      { fill: var(--paper-2, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero     { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj      { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .envelope { fill: none; stroke: var(--ink, #1a1a1a); stroke-width: 1.5; }
    .label    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink, #1a1a1a); }
    .label-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper, #fff); }
    .sub      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .85; }
    .obj-label{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .jrnl     { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--ink, #1a1a1a); opacity: .6; text-anchor: middle; }
    .annot    { font-family: 'Fraunces', serif; font-size: 13px; fill: var(--muted, #888); font-style: italic; }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .fan      { fill: none; stroke: var(--ink, #1a1a1a); stroke-width: 1; opacity: .45; marker-end: url(#arr-sm); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
    <marker id="arr-sm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ink, #1a1a1a)" />
    </marker>
  </defs>

  <!-- ===== LEFT: HTTP RPC entry ===== -->
  <rect class="box" x="30" y="196" width="170" height="108" rx="8" ry="8" />
  <text class="label" x="115" y="228" text-anchor="middle" font-weight="600">HTTP RPC</text>
  <text class="sub" x="115" y="248" text-anchor="middle">gRPC / HTTP/2</text>
  <text class="sub" x="115" y="266" text-anchor="middle">caller invokes handler</text>
  <text class="sub" x="115" y="284" text-anchor="middle">by virtual object key</text>

  <!-- Arrow: HTTP → Restate runtime -->
  <line class="arrow" x1="202" y1="250" x2="280" y2="250" />
  <text class="sub" x="242" y="240" text-anchor="middle">route</text>

  <!-- ===== RIGHT: Restate Runtime hero envelope ===== -->
  <rect class="hero" x="282" y="50" width="580" height="400" rx="12" ry="12" />
  <text class="label-inv" x="572" y="82" text-anchor="middle" font-weight="600">Restate Runtime</text>
  <text class="sub-inv" x="572" y="100" text-anchor="middle">durable handler execution engine</text>

  <!--
    Four virtual object columns.
    Object width: 118px, gap: 14px
    col x-centers: 328, 460, 592, 724
    Object rect x-starts: 282+24=306... let's use:
      col1: x=306, col2=438, col3=570, col4=702  width=118
    Object y: top=118, height=270
  -->

  <!-- Virtual Object 1 -->
  <rect class="adj" x="306" y="118" width="118" height="280" rx="7" ry="7" />
  <text class="obj-label" x="365" y="148">Object A</text>
  <text class="sub" x="365" y="165" text-anchor="middle" font-size="10">key: "user-42"</text>
  <!-- journal entries -->
  <rect class="box" x="318" y="178" width="94" height="30" rx="4" ry="4" />
  <text class="jrnl" x="365" y="198">Journal entry 1</text>
  <rect class="box" x="318" y="214" width="94" height="30" rx="4" ry="4" />
  <text class="jrnl" x="365" y="234">Journal entry 2</text>
  <rect class="box" x="318" y="250" width="94" height="30" rx="4" ry="4" />
  <text class="jrnl" x="365" y="270">Journal entry 3</text>
  <text class="jrnl" x="365" y="310">per-object journal</text>
  <text class="jrnl" x="365" y="325">exactly-once</text>
  <text class="jrnl" x="365" y="340">semantics</text>
  <text class="jrnl" x="365" y="378">handler replay</text>

  <!-- Virtual Object 2 -->
  <rect class="adj" x="438" y="118" width="118" height="280" rx="7" ry="7" />
  <text class="obj-label" x="497" y="148">Object B</text>
  <text class="sub" x="497" y="165" text-anchor="middle" font-size="10">key: "order-7"</text>
  <rect class="box" x="450" y="178" width="94" height="30" rx="4" ry="4" />
  <text class="jrnl" x="497" y="198">Journal entry 1</text>
  <rect class="box" x="450" y="214" width="94" height="30" rx="4" ry="4" />
  <text class="jrnl" x="497" y="234">Journal entry 2</text>
  <text class="jrnl" x="497" y="310">per-object journal</text>
  <text class="jrnl" x="497" y="325">exactly-once</text>
  <text class="jrnl" x="497" y="340">semantics</text>
  <text class="jrnl" x="497" y="378">handler replay</text>

  <!-- Virtual Object 3 -->
  <rect class="adj" x="570" y="118" width="118" height="280" rx="7" ry="7" />
  <text class="obj-label" x="629" y="148">Object C</text>
  <text class="sub" x="629" y="165" text-anchor="middle" font-size="10">key: "cart-99"</text>
  <rect class="box" x="582" y="178" width="94" height="30" rx="4" ry="4" />
  <text class="jrnl" x="629" y="198">Journal entry 1</text>
  <rect class="box" x="582" y="214" width="94" height="30" rx="4" ry="4" />
  <text class="jrnl" x="629" y="234">Journal entry 2</text>
  <rect class="box" x="582" y="250" width="94" height="30" rx="4" ry="4" />
  <text class="jrnl" x="629" y="270">Journal entry 3</text>
  <rect class="box" x="582" y="286" width="94" height="30" rx="4" ry="4" />
  <text class="jrnl" x="629" y="306">Journal entry 4</text>
  <text class="jrnl" x="629" y="378">handler replay</text>

  <!-- Virtual Object 4 -->
  <rect class="adj" x="702" y="118" width="118" height="280" rx="7" ry="7" />
  <text class="obj-label" x="761" y="148">Object D</text>
  <text class="sub" x="761" y="165" text-anchor="middle" font-size="10">key: "session-5"</text>
  <rect class="box" x="714" y="178" width="94" height="30" rx="4" ry="4" />
  <text class="jrnl" x="761" y="198">Journal entry 1</text>
  <text class="jrnl" x="761" y="310">per-object journal</text>
  <text class="jrnl" x="761" y="325">exactly-once</text>
  <text class="jrnl" x="761" y="340">semantics</text>
  <text class="jrnl" x="761" y="378">handler replay</text>

  <!-- Fan lines from routing point inside envelope to each object -->
  <line class="fan" x1="302" y1="250" x2="306" y2="258" />
  <line class="fan" x1="302" y1="250" x2="438" y2="258" />
  <line class="fan" x1="302" y1="250" x2="570" y2="258" />
  <line class="fan" x1="302" y1="250" x2="702" y2="258" />

  <!-- ===== Bottom annotation ===== -->
  <text class="annot" x="450" y="472" text-anchor="middle">Handler-replay-with-journal; exactly-once semantics; no idempotency keys needed.</text>
</svg>
