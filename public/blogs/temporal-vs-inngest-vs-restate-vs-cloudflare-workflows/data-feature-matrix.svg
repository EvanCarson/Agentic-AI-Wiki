<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fm-title fm-desc">
  <title id="fm-title">Durable execution feature matrix</title>
  <desc id="fm-desc">Heatmap comparing Temporal, Inngest, Restate, and Cloudflare Workflows across five axes: Programming model, Self-hosted, Determinism story, Cold-start, and Multi-region. Strength shown by fill from light (weak) to dark accent (strong).</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="32" text-anchor="middle">Durable execution feature matrix</text>

  <!--
    Layout:
    - Left margin for row labels: 148px
    - 5 columns of width 148px each = 740px total → right edge = 148 + 740 = 888 (fits in 900)
    - Col x-centers: 148 + 74 = 222, 222+148=370, 370+148=518, 518+148=666, 666+148=814
      → 222, 370, 518, 666, 814
    - 4 rows of height 58px, gap between = 0
    - Row tops: 80, 138, 196, 254
    - Row y-centers: 109, 167, 225, 283
  -->

  <!-- Column headers -->
  <text class="col-head" x="222" y="55">Programming</text>
  <text class="col-head" x="222" y="67">model</text>

  <text class="col-head" x="370" y="55">Self-</text>
  <text class="col-head" x="370" y="67">hosted</text>

  <text class="col-head" x="518" y="55">Determinism</text>
  <text class="col-head" x="518" y="67">story</text>

  <text class="col-head" x="666" y="55">Cold-</text>
  <text class="col-head" x="666" y="67">start</text>

  <text class="col-head" x="814" y="55">Multi-</text>
  <text class="col-head" x="814" y="67">region</text>

  <!-- === Row 1: Temporal === -->
  <text class="row-head" x="140" y="109">Temporal</text>
  <!-- Programming model: strong (Workflow-as-code) -->
  <rect class="cell-strong" x="148" y="80" width="148" height="58" rx="4" />
  <text class="cell-text-inv" x="222" y="102">Workflow-</text>
  <text class="cell-text-inv" x="222" y="116">as-code</text>
  <!-- Self-hosted: strong -->
  <rect class="cell-strong" x="296" y="80" width="148" height="58" rx="4" />
  <text class="cell-text-inv" x="370" y="109">Yes</text>
  <!-- Determinism: strong (Explicit, code replay) -->
  <rect class="cell-strong" x="444" y="80" width="148" height="58" rx="4" />
  <text class="cell-text-inv" x="518" y="102">Explicit,</text>
  <text class="cell-text-inv" x="518" y="116">code replay</text>
  <!-- Cold-start: medium (Higher — worker) -->
  <rect class="cell-medium" x="592" y="80" width="148" height="58" rx="4" />
  <text class="cell-text" x="666" y="102">Higher</text>
  <text class="cell-text" x="666" y="116">(worker)</text>
  <!-- Multi-region: strong (Yes via Cloud) -->
  <rect class="cell-strong" x="740" y="80" width="148" height="58" rx="4" />
  <text class="cell-text-inv" x="814" y="102">Yes via</text>
  <text class="cell-text-inv" x="814" y="116">Cloud</text>

  <!-- === Row 2: Inngest === -->
  <text class="row-head" x="140" y="167">Inngest</text>
  <!-- Programming model: strong (Step functions) -->
  <rect class="cell-strong" x="148" y="138" width="148" height="58" rx="4" />
  <text class="cell-text-inv" x="222" y="160">Step</text>
  <text class="cell-text-inv" x="222" y="174">functions</text>
  <!-- Self-hosted: strong -->
  <rect class="cell-strong" x="296" y="138" width="148" height="58" rx="4" />
  <text class="cell-text-inv" x="370" y="167">Yes</text>
  <!-- Determinism: medium (Step-level retries) -->
  <rect class="cell-medium" x="444" y="138" width="148" height="58" rx="4" />
  <text class="cell-text" x="518" y="160">Step-level</text>
  <text class="cell-text" x="518" y="174">retries</text>
  <!-- Cold-start: medium (Low-medium) -->
  <rect class="cell-medium" x="592" y="138" width="148" height="58" rx="4" />
  <text class="cell-text" x="666" y="160">Low-</text>
  <text class="cell-text" x="666" y="174">medium</text>
  <!-- Multi-region: medium (Yes) -->
  <rect class="cell-medium" x="740" y="138" width="148" height="58" rx="4" />
  <text class="cell-text" x="814" y="167">Yes</text>

  <!-- === Row 3: Restate === -->
  <text class="row-head" x="140" y="225">Restate</text>
  <!-- Programming model: strong (Virtual objects + RPC) -->
  <rect class="cell-strong" x="148" y="196" width="148" height="58" rx="4" />
  <text class="cell-text-inv" x="222" y="218">Virtual objects</text>
  <text class="cell-text-inv" x="222" y="232">+ RPC</text>
  <!-- Self-hosted: strong -->
  <rect class="cell-strong" x="296" y="196" width="148" height="58" rx="4" />
  <text class="cell-text-inv" x="370" y="225">Yes</text>
  <!-- Determinism: strong (Journal exactly-once) -->
  <rect class="cell-strong" x="444" y="196" width="148" height="58" rx="4" />
  <text class="cell-text-inv" x="518" y="218">Journal</text>
  <text class="cell-text-inv" x="518" y="232">exactly-once</text>
  <!-- Cold-start: medium (Medium) -->
  <rect class="cell-medium" x="592" y="196" width="148" height="58" rx="4" />
  <text class="cell-text" x="666" y="225">Medium</text>
  <!-- Multi-region: medium (Yes) -->
  <rect class="cell-medium" x="740" y="196" width="148" height="58" rx="4" />
  <text class="cell-text" x="814" y="225">Yes</text>

  <!-- === Row 4: Cloudflare Workflows === -->
  <text class="row-head" x="140" y="271">Cloudflare</text>
  <text class="row-head" x="140" y="287">Workflows</text>
  <!-- Programming model: medium (Handler graph) -->
  <rect class="cell-medium" x="148" y="254" width="148" height="58" rx="4" />
  <text class="cell-text" x="222" y="276">Handler</text>
  <text class="cell-text" x="222" y="290">graph</text>
  <!-- Self-hosted: weak (No — CF only) -->
  <rect class="cell-weak" x="296" y="254" width="148" height="58" rx="4" />
  <text class="cell-text" x="370" y="276">No —</text>
  <text class="cell-text" x="370" y="290">CF only</text>
  <!-- Determinism: medium (Step-level retries) -->
  <rect class="cell-medium" x="444" y="254" width="148" height="58" rx="4" />
  <text class="cell-text" x="518" y="276">Step-level</text>
  <text class="cell-text" x="518" y="290">retries</text>
  <!-- Cold-start: strong (Edge isolate) -->
  <rect class="cell-strong" x="592" y="254" width="148" height="58" rx="4" />
  <text class="cell-text-inv" x="666" y="276">Edge</text>
  <text class="cell-text-inv" x="666" y="290">isolate</text>
  <!-- Multi-region: strong (Yes — CF network) -->
  <rect class="cell-strong" x="740" y="254" width="148" height="58" rx="4" />
  <text class="cell-text-inv" x="814" y="276">Yes —</text>
  <text class="cell-text-inv" x="814" y="290">CF network</text>

  <!-- Legend -->
  <rect class="legend-box-w" x="240" y="344" width="18" height="18" rx="3" />
  <text class="legend-text" x="265" y="353">Weak</text>

  <rect class="legend-box-m" x="360" y="344" width="18" height="18" rx="3" />
  <text class="legend-text" x="385" y="353">Medium</text>

  <rect class="legend-box-s" x="490" y="344" width="18" height="18" rx="3" />
  <text class="legend-text" x="515" y="353">Strong</text>
</svg>
