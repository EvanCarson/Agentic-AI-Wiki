<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="stars-title stars-desc">
  <title id="stars-title">GitHub stars comparison — durable execution frameworks</title>
  <desc id="stars-desc">Horizontal bar chart: Temporal leads with ~14,000 GitHub stars, Inngest has ~4,500, Restate has ~3,000, and Cloudflare Workflows ships inside the Workers runtime with no standalone repo.</desc>
  <style>
    .chart-title  { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; fill: currentColor; }
    .proj-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .bar-val      { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; dominant-baseline: central; }
    .grid-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: middle; }
    .grid-line    { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .bar-primary  { fill: var(--accent, #d4421e); }
    .bar-secondary{ fill: var(--accent-soft, #f5c5b8); }
    .bar-neutral  { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .na-label     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--muted, #888); dominant-baseline: central; }
    .footnote     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); font-style: italic; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="36" text-anchor="middle">GitHub stars (thousands, snapshot)</text>

  <!--
    Chart area: left margin 210px, right margin 90px
    Total chart width = 900 - 210 - 90 = 600px
    Max value: 14k → scale: 600 / 14 = ~42.857 px per k-star
    Grid at 0, 5k, 10k, 15k
    x_0   = 210
    x_5k  = 210 + 5  * 42.857 = 210 + 214.3  = ~424
    x_10k = 210 + 10 * 42.857 = 210 + 428.6  = ~639
    x_15k = 210 + 15 * 42.857 = 210 + 642.9  = ~853 (beyond right edge; show up to 15k as label past chart)

    Row y-centers (4 rows, spread from y=90 to y=310, row height 58px, gaps 10px):
      Row 1 (Temporal):             y_center = 118
      Row 2 (Inngest):              y_center = 186
      Row 3 (Restate):              y_center = 254
      Row 4 (CF Workflows):         y_center = 322

    Bars:
      Temporal:           width = 14   * 42.857 = 600
      Inngest:            width = 4.5  * 42.857 = 192.9 ≈ 193
      Restate:            width = 3    * 42.857 = 128.6 ≈ 129
      CF Workflows:       width = 0 (N/A — small rect or none)
  -->

  <!-- Baseline (x=210) -->
  <line x1="210" y1="60" x2="210" y2="340" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" />

  <!-- Dotted grid lines -->
  <line class="grid-line" x1="424" y1="60" x2="424" y2="340" />
  <line class="grid-line" x1="639" y1="60" x2="639" y2="340" />

  <!-- Grid labels -->
  <text class="grid-label" x="210" y="352">0</text>
  <text class="grid-label" x="424" y="352">5k</text>
  <text class="grid-label" x="639" y="352">10k</text>
  <text class="grid-label" x="810" y="352">15k</text>

  <!-- === Row 1: Temporal — 14k === -->
  <text class="proj-label" x="202" y="118">Temporal</text>
  <rect class="bar-primary" x="210" y="93" width="600" height="50" rx="5" ry="5" />
  <text class="bar-val" x="818" y="118" style="fill: var(--accent, #d4421e);">14k</text>

  <!-- === Row 2: Inngest — 4.5k === -->
  <!-- bar width = 4.5 * 42.857 = 193 -->
  <text class="proj-label" x="202" y="186">Inngest</text>
  <rect class="bar-secondary" x="210" y="161" width="193" height="50" rx="5" ry="5" />
  <text class="bar-val" x="410" y="186" style="fill: var(--ink, #1a1a1a);">4.5k</text>

  <!-- === Row 3: Restate — 3k === -->
  <!-- bar width = 3 * 42.857 = 129 -->
  <text class="proj-label" x="202" y="254">Restate</text>
  <rect class="bar-neutral" x="210" y="229" width="129" height="50" rx="5" ry="5" />
  <text class="bar-val" x="346" y="254" style="fill: var(--muted, #888);">3k</text>

  <!-- === Row 4: Cloudflare Workflows — N/A === -->
  <text class="proj-label" x="202" y="322">Cloudflare</text>
  <!-- No bar — just N/A annotation -->
  <text class="na-label" x="218" y="322">N/A</text>

  <!-- Footnote -->
  <text class="footnote" x="210" y="378">* Cloudflare Workflows ships inside the Workers runtime; no standalone repo.</text>
</svg>
