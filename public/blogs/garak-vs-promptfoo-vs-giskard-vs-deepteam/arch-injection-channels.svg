<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="icT icD">
  <title id="icT">Four boundaries where a hostile string can enter an agent's context</title>
  <desc id="icD">An agent loop drawn in the centre. Four entry boundaries surround it. Boundary one, the user prompt, is covered by all four scanners. Boundary two, the system prompt and tool descriptions, is partly covered. Boundary three, the tool result returned by a search index, an API or a fetched page, is drawn as the accent block and is reached by none of the four by default; an arrow carries it back into the agent's context on the next turn. Boundary four, the rendered output, is covered only by output detectors.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
    .lbl-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .95; }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .tag-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); opacity: .9; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#icArr); }
  </style>
  <defs>
    <marker id="icArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="22">Where a hostile string can enter</text>

  <rect class="adj" x="340" y="190" width="220" height="110" />
  <text class="hd" x="450" y="232" text-anchor="middle">Agent loop</text>
  <text class="lbl" x="450" y="258" text-anchor="middle">model + context window</text>
  <text class="lbl" x="450" y="278" text-anchor="middle">+ tool calls</text>

  <rect class="box" x="20" y="60" width="250" height="86" />
  <text class="hd" x="145" y="88" text-anchor="middle">1 · User prompt</text>
  <text class="lbl" x="145" y="112" text-anchor="middle">What a person types.</text>
  <text class="tag" x="145" y="134" text-anchor="middle">covered by all four</text>

  <rect class="box" x="20" y="344" width="250" height="86" />
  <text class="hd" x="145" y="372" text-anchor="middle">2 · System prompt + tool docs</text>
  <text class="lbl" x="145" y="396" text-anchor="middle">Descriptions the model reads.</text>
  <text class="tag" x="145" y="418" text-anchor="middle">partly covered</text>

  <rect class="hero" x="630" y="60" width="250" height="110" />
  <text class="hd-inv" x="755" y="88" text-anchor="middle">3 · Tool result</text>
  <text class="lbl-inv" x="755" y="112" text-anchor="middle">Retrieved document, API</text>
  <text class="lbl-inv" x="755" y="132" text-anchor="middle">field, fetched page, log line.</text>
  <text class="tag-inv" x="755" y="156" text-anchor="middle">reached by none of the four</text>

  <rect class="box" x="630" y="344" width="250" height="86" />
  <text class="hd" x="755" y="372" text-anchor="middle">4 · Rendered output</text>
  <text class="lbl" x="755" y="396" text-anchor="middle">What a downstream surface shows.</text>
  <text class="tag" x="755" y="418" text-anchor="middle">output detectors only</text>

  <path class="arrow" d="M 272 116 L 380 186" />
  <path class="arrow" d="M 272 372 L 380 304" />
  <path class="arrow" d="M 628 132 L 520 186" />
  <path class="arrow" d="M 520 304 L 628 366" />

  <path class="arrow" d="M 560 245 L 640 245 L 640 196" />
  <text class="tag" x="672" y="238">tool call out</text>

  <rect class="box" x="20" y="454" width="860" height="36" />
  <text class="lbl" x="450" y="478" text-anchor="middle">Scanners construct a string and hand it to boundary 1. An agent is compromised at boundary 3, where the text arrives as data it asked for.</text>
</svg>
