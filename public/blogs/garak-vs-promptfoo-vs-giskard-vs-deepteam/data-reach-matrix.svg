<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="rmT rmD">
  <title id="rmT">Reach matrix: which boundary each red-team tool can place a hostile string on</title>
  <desc id="rmD">A four-by-four matrix. Rows are garak, Promptfoo, Giskard and DeepTeam. Columns are the raw model endpoint, the application entry point, multi-turn attacks, and the tool-result channel. garak is strong on the raw model endpoint, weak on the application entry point, partial on multi-turn, and none on the tool-result channel. Promptfoo is weak on the raw endpoint, strong on the application entry point, strong on multi-turn, and none on the tool-result channel. Giskard and DeepTeam follow the same pattern as Promptfoo. The whole fourth column reads none.</desc>
  <style>
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hdr    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .weak   { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; rx: 6; ry: 6; }
    .med    { fill: var(--accent-soft); stroke: var(--border-soft); stroke-width: 1; rx: 6; ry: 6; }
    .strong { fill: var(--accent, #d4421e); stroke: none; rx: 6; ry: 6; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .lgd    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">What each tool can put a hostile string on</text>

  <text class="hdr" x="292" y="52" text-anchor="middle">Raw model</text>
  <text class="hdr" x="292" y="68" text-anchor="middle">endpoint</text>
  <text class="hdr" x="457" y="52" text-anchor="middle">Application</text>
  <text class="hdr" x="457" y="68" text-anchor="middle">entry point</text>
  <text class="hdr" x="622" y="52" text-anchor="middle">Multi-turn</text>
  <text class="hdr" x="622" y="68" text-anchor="middle">escalation</text>
  <text class="hdr" x="787" y="52" text-anchor="middle">Tool-result</text>
  <text class="hdr" x="787" y="68" text-anchor="middle">channel</text>

  <text class="lbl" x="0" y="114">garak</text>
  <rect class="strong" x="215" y="88" width="155" height="42" />
  <text class="cell-inv" x="292" y="114" text-anchor="middle">Strong</text>
  <rect class="weak" x="380" y="88" width="155" height="42" />
  <text class="cell" x="457" y="114" text-anchor="middle">Not its target</text>
  <rect class="med" x="545" y="88" width="155" height="42" />
  <text class="cell" x="622" y="114" text-anchor="middle">Partial</text>
  <rect class="weak" x="710" y="88" width="155" height="42" />
  <text class="cell" x="787" y="114" text-anchor="middle">None</text>

  <text class="lbl" x="0" y="184">Promptfoo</text>
  <rect class="weak" x="215" y="158" width="155" height="42" />
  <text class="cell" x="292" y="184" text-anchor="middle">Via a provider</text>
  <rect class="strong" x="380" y="158" width="155" height="42" />
  <text class="cell-inv" x="457" y="184" text-anchor="middle">Strong</text>
  <rect class="strong" x="545" y="158" width="155" height="42" />
  <text class="cell-inv" x="622" y="184" text-anchor="middle">Strong</text>
  <rect class="weak" x="710" y="158" width="155" height="42" />
  <text class="cell" x="787" y="184" text-anchor="middle">None</text>

  <text class="lbl" x="0" y="254">Giskard</text>
  <rect class="weak" x="215" y="228" width="155" height="42" />
  <text class="cell" x="292" y="254" text-anchor="middle">Via a wrapper</text>
  <rect class="strong" x="380" y="228" width="155" height="42" />
  <text class="cell-inv" x="457" y="254" text-anchor="middle">Strong</text>
  <rect class="strong" x="545" y="228" width="155" height="42" />
  <text class="cell-inv" x="622" y="254" text-anchor="middle">Strong</text>
  <rect class="weak" x="710" y="228" width="155" height="42" />
  <text class="cell" x="787" y="254" text-anchor="middle">None</text>

  <text class="lbl" x="0" y="324">DeepTeam</text>
  <rect class="weak" x="215" y="298" width="155" height="42" />
  <text class="cell" x="292" y="324" text-anchor="middle">Via a wrapper</text>
  <rect class="strong" x="380" y="298" width="155" height="42" />
  <text class="cell-inv" x="457" y="324" text-anchor="middle">Strong</text>
  <rect class="strong" x="545" y="298" width="155" height="42" />
  <text class="cell-inv" x="622" y="324" text-anchor="middle">Strong</text>
  <rect class="weak" x="710" y="298" width="155" height="42" />
  <text class="cell" x="787" y="324" text-anchor="middle">None</text>

  <rect class="strong" x="215" y="358" width="16" height="16" />
  <text class="lgd" x="239" y="371">Strong</text>
  <rect class="med" x="310" y="358" width="16" height="16" />
  <text class="lgd" x="334" y="371">Partial</text>
  <rect class="weak" x="405" y="358" width="16" height="16" />
  <text class="lgd" x="429" y="371">Weak or absent by default</text>
</svg>
