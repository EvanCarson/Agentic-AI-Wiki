<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="coT coD">
  <title id="coT">Who maintains each attack corpus after the 2026 consolidation</title>
  <desc id="coD">Three columns. PyRIT was archived by Microsoft on 27 March 2026 and is read-only, with no commits, releases or issue triage, yet is still widely recommended. Promptfoo was acquired by OpenAI in March 2026 with an open-source commitment, so the corpus testing your agent is curated by a model vendor. garak, Giskard and DeepTeam are maintained by an infrastructure vendor and two independent companies, and corpus freshness tracks each project's own release cadence.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .92; }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Corpus ownership after 2026</text>

  <rect class="hero" x="35" y="48" width="250" height="96" />
  <text class="hd-inv" x="160" y="76" text-anchor="middle">PyRIT — archived</text>
  <text class="cell-inv" x="160" y="100" text-anchor="middle">Read-only since</text>
  <text class="cell-inv" x="160" y="118" text-anchor="middle">27 March 2026. No commits,</text>
  <text class="cell-inv" x="160" y="136" text-anchor="middle">releases or triage.</text>

  <rect class="adj" x="325" y="48" width="250" height="96" />
  <text class="hd" x="450" y="76" text-anchor="middle">Promptfoo — acquired</text>
  <text class="cell" x="450" y="100" text-anchor="middle">OpenAI, March 2026,</text>
  <text class="cell" x="450" y="118" text-anchor="middle">with an open-source</text>
  <text class="cell" x="450" y="136" text-anchor="middle">commitment.</text>

  <rect class="box" x="625" y="48" width="250" height="96" />
  <text class="hd" x="750" y="76" text-anchor="middle">garak · Giskard · DeepTeam</text>
  <text class="cell" x="750" y="100" text-anchor="middle">One infrastructure vendor,</text>
  <text class="cell" x="750" y="118" text-anchor="middle">two independents, each on</text>
  <text class="cell" x="750" y="136" text-anchor="middle">its own release cadence.</text>

  <text class="lane" x="160" y="176" text-anchor="middle">What it means for you</text>
  <text class="lane" x="450" y="176" text-anchor="middle">What it means for you</text>
  <text class="lane" x="750" y="176" text-anchor="middle">What it means for you</text>

  <rect class="box" x="35" y="186" width="250" height="80" />
  <text class="cell" x="160" y="212" text-anchor="middle">A frozen reference, not</text>
  <text class="cell" x="160" y="232" text-anchor="middle">a maintained tool — and</text>
  <text class="cell" x="160" y="252" text-anchor="middle">still in most 2026 guides.</text>

  <rect class="box" x="325" y="186" width="250" height="80" />
  <text class="cell" x="450" y="212" text-anchor="middle">A model vendor curates</text>
  <text class="cell" x="450" y="232" text-anchor="middle">the threat model used</text>
  <text class="cell" x="450" y="252" text-anchor="middle">against its competitors.</text>

  <rect class="box" x="625" y="186" width="250" height="80" />
  <text class="cell" x="750" y="212" text-anchor="middle">Freshness is a project</text>
  <text class="cell" x="750" y="232" text-anchor="middle">health question — check</text>
  <text class="cell" x="750" y="252" text-anchor="middle">the last probe commit.</text>
</svg>
