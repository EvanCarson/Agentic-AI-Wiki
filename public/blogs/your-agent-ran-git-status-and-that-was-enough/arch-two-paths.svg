<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="tpT tpD">
  <title id="tpT">The path the permission system covers, and the path GitSpawn uses</title>
  <desc id="tpD">Two lanes. The upper lane is the designed path: you type a request, the model proposes a tool call, a permission gate prompts or checks an allowlist, and the command runs inside a sandbox. The lower lane is the GitSpawn path: you open a folder, the harness runs git status to gather context before the model has a turn, git reads core.fsmonitor from the repository's own .git/config, and the attacker's command executes with full user privileges outside the sandbox with no prompt. Every control in the upper lane sits downstream of the point where the lower lane has already executed.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .lane   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#tparr); }
    .divide { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="tparr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="20">Two paths into the same shell</text>

  <text class="lane" x="55" y="62">The path your controls cover</text>

  <rect class="box" x="55" y="80" width="175" height="86" />
  <text class="cell" x="142" y="115" text-anchor="middle">You type a request</text>
  <text class="cell" x="142" y="133" text-anchor="middle">and press enter</text>

  <path class="arrow" d="M 236 123 L 266 123" />

  <rect class="box" x="272" y="80" width="175" height="86" />
  <text class="cell" x="359" y="115" text-anchor="middle">The model proposes</text>
  <text class="cell" x="359" y="133" text-anchor="middle">a tool call</text>

  <path class="arrow" d="M 453 123 L 483 123" />

  <rect class="adj" x="489" y="80" width="175" height="86" />
  <text class="cell" x="576" y="107" text-anchor="middle">Permission gate</text>
  <text class="cell" x="576" y="125" text-anchor="middle">prompt, allowlist,</text>
  <text class="cell" x="576" y="143" text-anchor="middle">policy check</text>

  <path class="arrow" d="M 670 123 L 700 123" />

  <rect class="adj" x="706" y="80" width="175" height="86" />
  <text class="cell" x="793" y="115" text-anchor="middle">Sandboxed</text>
  <text class="cell" x="793" y="133" text-anchor="middle">execution</text>

  <text class="sub" x="55" y="196">Four opportunities to stop something. All of them downstream of the model.</text>

  <line class="divide" x1="0" y1="228" x2="900" y2="228" />

  <text class="lane" x="55" y="272">The path GitSpawn uses</text>

  <rect class="box" x="55" y="290" width="175" height="86" />
  <text class="cell" x="142" y="325" text-anchor="middle">You open the folder</text>
  <text class="cell" x="142" y="343" text-anchor="middle">with the agent</text>

  <path class="arrow" d="M 236 333 L 266 333" />

  <rect class="hero" x="272" y="290" width="175" height="86" />
  <text class="cell-inv" x="359" y="317" text-anchor="middle">The harness runs</text>
  <text class="cell-inv" x="359" y="335" text-anchor="middle">git status to gather</text>
  <text class="cell-inv" x="359" y="353" text-anchor="middle">context</text>

  <path class="arrow" d="M 453 333 L 483 333" />

  <rect class="hero" x="489" y="290" width="175" height="86" />
  <text class="cell-inv" x="576" y="317" text-anchor="middle">git reads the repo's</text>
  <text class="cell-inv" x="576" y="335" text-anchor="middle">own .git/config:</text>
  <text class="cell-inv" x="576" y="353" text-anchor="middle">core.fsmonitor</text>

  <path class="arrow" d="M 670 333 L 700 333" />

  <rect class="hero" x="706" y="290" width="175" height="86" />
  <text class="cell-inv" x="793" y="325" text-anchor="middle">The attacker's</text>
  <text class="cell-inv" x="793" y="343" text-anchor="middle">command runs</text>

  <text class="sub" x="55" y="406">No prompt typed. No approval clicked. Full user privileges, outside the sandbox.</text>
  <text class="sub" x="55" y="426">In some cases before the user has authenticated — so the model never had a turn to be governed.</text>

  <rect class="box" x="55" y="446" width="826" height="42" />
  <text class="cell" x="468" y="472" text-anchor="middle">Everything in the upper lane is downstream of everything in the lower lane.</text>
</svg>
