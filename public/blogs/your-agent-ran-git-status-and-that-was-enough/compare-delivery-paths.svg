<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="dpT dpD">
  <title id="dpT">Which ways of receiving a repository carry the payload</title>
  <desc id="dpD">Three columns comparing how a repository reaches a developer's disk. A normal git clone from a forge rebuilds .git/config locally and does not carry the attacker's setting, which is why the class looks unreachable. An archive, shared drive or synced folder copies the .git directory byte for byte and does carry it. A pre-built dev container or restored backup ships a working tree that was prepared elsewhere and carries whatever was in it, while also being the path a developer is least likely to inspect.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">How the repository reached your disk</text>

  <rect class="box" x="35" y="44" width="250" height="180" />
  <text class="hd" x="160" y="76" text-anchor="middle">git clone from a forge</text>
  <text class="cell" x="160" y="110" text-anchor="middle">Git rebuilds .git/config</text>
  <text class="cell" x="160" y="128" text-anchor="middle">locally from your own</text>
  <text class="cell" x="160" y="146" text-anchor="middle">defaults and the remote URL.</text>
  <text class="cell" x="160" y="176" text-anchor="middle">Carries the payload: no.</text>
  <text class="cell" x="160" y="194" text-anchor="middle">The setting never travels.</text>
  <text class="sub" x="160" y="248" text-anchor="middle">Which is why the class reads as</text>
  <text class="sub" x="160" y="266" text-anchor="middle">unreachable on first inspection.</text>

  <rect class="adj" x="325" y="44" width="250" height="180" />
  <text class="hd" x="450" y="76" text-anchor="middle">Archive or shared folder</text>
  <text class="cell" x="450" y="110" text-anchor="middle">A zip, a tarball, a network</text>
  <text class="cell" x="450" y="128" text-anchor="middle">share, a sync client — each</text>
  <text class="cell" x="450" y="146" text-anchor="middle">copies .git byte for byte.</text>
  <text class="cell" x="450" y="176" text-anchor="middle">Carries the payload: yes.</text>
  <text class="cell" x="450" y="194" text-anchor="middle">Nothing rewrites the config.</text>
  <text class="sub" x="450" y="248" text-anchor="middle">The ordinary way a bug report,</text>
  <text class="sub" x="450" y="266" text-anchor="middle">a takehome or a client hands over code.</text>

  <rect class="hero" x="615" y="44" width="250" height="180" />
  <text class="hd-inv" x="740" y="76" text-anchor="middle">Pre-built container / backup</text>
  <text class="cell-inv" x="740" y="110" text-anchor="middle">An image or a restore ships a</text>
  <text class="cell-inv" x="740" y="128" text-anchor="middle">working tree prepared on</text>
  <text class="cell-inv" x="740" y="146" text-anchor="middle">somebody else's machine.</text>
  <text class="cell-inv" x="740" y="176" text-anchor="middle">Carries the payload: yes.</text>
  <text class="cell-inv" x="740" y="194" text-anchor="middle">And is opened unread.</text>
  <text class="sub" x="740" y="248" text-anchor="middle">The path a developer inspects least</text>
  <text class="sub" x="740" y="266" text-anchor="middle">and trusts most.</text>
</svg>
