<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="psT psD">
  <title id="psT">GitSpawn findings by agent and patch status</title>
  <desc id="psD">Eight findings across seven CLI coding agents. Goose was fixed and received CVE-2026-72718. The Claude Code core.fsmonitor finding was reported on 26 June and fixed in version 2.1.196 on 29 June. Cursor was fixed. Four findings were still executing repository-supplied commands when retested on 1 September: a second Claude Code configuration path, Grok Build, Qwen Code, and Hermes Agent, the last of which was assigned CVE-2026-71963 independently after six unanswered contact attempts.</desc>
  <style>
    .row-fix { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .row-open { fill: var(--accent, #d4421e); stroke: none; rx: 6; ry: 6; }
    .row-lbl { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; letter-spacing: .04em; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .name   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Eight findings, seven agents, four still open</text>

  <text class="hd" x="10" y="46">AGENT</text>
  <text class="hd" x="290" y="46">STATUS</text>
  <text class="hd" x="700" y="46">IDENTIFIER</text>

  <rect class="row-lbl" x="0" y="56" width="270" height="36" />
  <text class="name" x="14" y="79">goose</text>
  <rect class="row-fix" x="280" y="56" width="400" height="36" />
  <text class="cell" x="296" y="79">Fixed</text>
  <text class="cell" x="694" y="79">CVE-2026-72718</text>

  <rect class="row-lbl" x="0" y="100" width="270" height="36" />
  <text class="name" x="14" y="123">Claude Code — fsmonitor path</text>
  <rect class="row-fix" x="280" y="100" width="400" height="36" />
  <text class="cell" x="296" y="123">Fixed in 2.1.196, three days after report</text>
  <text class="cell" x="694" y="123">closed as duplicate</text>

  <rect class="row-lbl" x="0" y="144" width="270" height="36" />
  <text class="name" x="14" y="167">Cursor</text>
  <rect class="row-fix" x="280" y="144" width="400" height="36" />
  <text class="cell" x="296" y="167">Fixed</text>
  <text class="cell" x="694" y="167">—</text>

  <rect class="row-lbl" x="0" y="188" width="270" height="36" />
  <text class="name" x="14" y="211">Claude Code — second path</text>
  <rect class="row-open" x="280" y="188" width="400" height="36" />
  <text class="cell-inv" x="296" y="211">Still executing at the 1 September retest</text>
  <text class="cell" x="694" y="211">—</text>

  <rect class="row-lbl" x="0" y="232" width="270" height="36" />
  <text class="name" x="14" y="255">Grok Build</text>
  <rect class="row-open" x="280" y="232" width="400" height="36" />
  <text class="cell-inv" x="296" y="255">Still executing at the 1 September retest</text>
  <text class="cell" x="694" y="255">—</text>

  <rect class="row-lbl" x="0" y="276" width="270" height="36" />
  <text class="name" x="14" y="299">Qwen Code</text>
  <rect class="row-open" x="280" y="276" width="400" height="36" />
  <text class="cell-inv" x="296" y="299">Still executing at the 1 September retest</text>
  <text class="cell" x="694" y="299">—</text>

  <rect class="row-lbl" x="0" y="320" width="270" height="36" />
  <text class="name" x="14" y="343">Hermes Agent</text>
  <rect class="row-open" x="280" y="320" width="400" height="36" />
  <text class="cell-inv" x="296" y="343">Still executing at the 1 September retest</text>
  <text class="cell" x="694" y="343">CVE-2026-71963</text>

  <text class="sub" x="0" y="380">Hermes Agent's identifier was assigned independently after six unanswered contact attempts.</text>
</svg>
