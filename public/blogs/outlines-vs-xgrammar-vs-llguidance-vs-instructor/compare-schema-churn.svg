<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What happens when every request carries a different schema</title>
  <desc id="d">Four columns describing behaviour under unique per-request schemas. Outlines pays a precompute cost for each new schema before the first token. XGrammar compiles just in time with a persistent cache, so repeated schemas are free and novel ones cost a compile. llguidance builds its automata lazily and pays essentially no startup cost. Instructor has no compile step at all because it never constrains sampling.</desc>
  <style>
    .col-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .col-title-inv { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .75; text-anchor: middle; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .9; text-anchor: middle; }
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .foot      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--muted, #888); text-anchor: middle; }
    .box       { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj       { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero      { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="30">Cost before the first token, on a novel schema</text>

  <rect class="box" x="25" y="58" width="190" height="150" rx="8" ry="8" />
  <text class="col-title" x="120" y="90">Outlines</text>
  <text class="sub" x="120" y="120">Precompute the index</text>
  <text class="sub" x="120" y="139">over the vocabulary</text>
  <text class="sub" x="120" y="167">Highest startup cost;</text>
  <text class="sub" x="120" y="186">cheapest per token after</text>

  <rect class="adj" x="245" y="58" width="190" height="150" rx="8" ry="8" />
  <text class="col-title" x="340" y="90">XGrammar</text>
  <text class="sub" x="340" y="120">JIT compile with a</text>
  <text class="sub" x="340" y="139">persistent cache</text>
  <text class="sub" x="340" y="167">Repeat schemas free;</text>
  <text class="sub" x="340" y="186">novel ones pay once</text>

  <rect class="hero" x="465" y="58" width="190" height="150" rx="8" ry="8" />
  <text class="col-title-inv" x="560" y="90">llguidance</text>
  <text class="sub-inv" x="560" y="120">Lazy automata, masks</text>
  <text class="sub-inv" x="560" y="139">computed on the fly</text>
  <text class="sub-inv" x="560" y="167">Essentially no</text>
  <text class="sub-inv" x="560" y="186">startup cost</text>

  <rect class="box" x="685" y="58" width="190" height="150" rx="8" ry="8" />
  <text class="col-title" x="780" y="90">Instructor</text>
  <text class="sub" x="780" y="120">No compile step;</text>
  <text class="sub" x="780" y="139">no mask at all</text>
  <text class="sub" x="780" y="167">Cost arrives later,</text>
  <text class="sub" x="780" y="186">as a retry</text>

  <text class="foot" x="450" y="256">One question decides the first three: do your schemas repeat?</text>
</svg>
