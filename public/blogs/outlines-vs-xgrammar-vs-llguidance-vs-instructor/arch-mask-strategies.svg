<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where each approach intervenes in generation</title>
  <desc id="d">Two rows. The upper row shows constrained decoding: the schema is compiled to a grammar, and at every decoding step a token mask zeroes out any token that would break the grammar before sampling, so invalid output is never produced. The lower row shows validate-and-retry: the model generates freely, the result is parsed and validated against a schema, and on failure the error is sent back as a new request.</desc>
  <style>
    .box      { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero     { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj      { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper, #fff); text-anchor: middle; }
    .sub      { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .sub-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .9; text-anchor: middle; }
    .head     { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: start; }
    .foot     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--muted, #888); text-anchor: middle; }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
    .rule     { stroke: var(--border-soft, #ddd); stroke-width: 1; }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="24" y="30">Constrained decoding — Outlines, XGrammar, llguidance</text>

  <rect class="box" x="24" y="52" width="150" height="62" rx="8" ry="8" />
  <text class="label" x="99" y="78">JSON Schema</text>
  <text class="sub" x="99" y="97">or CFG</text>

  <rect class="adj" x="214" y="52" width="150" height="62" rx="8" ry="8" />
  <text class="label" x="289" y="78">Grammar compile</text>
  <text class="sub" x="289" y="97">once, or per request</text>

  <rect class="hero" x="404" y="52" width="170" height="62" rx="8" ry="8" />
  <text class="label-inv" x="489" y="78">Token mask</text>
  <text class="sub-inv" x="489" y="97">applied every step</text>

  <rect class="box" x="614" y="52" width="120" height="62" rx="8" ry="8" />
  <text class="label" x="674" y="86">Sample</text>

  <rect class="box" x="774" y="52" width="102" height="62" rx="8" ry="8" />
  <text class="label" x="825" y="78">Output</text>
  <text class="sub" x="825" y="97">always valid</text>

  <path class="arrow" d="M 174 83 L 210 83" />
  <path class="arrow" d="M 364 83 L 400 83" />
  <path class="arrow" d="M 574 83 L 610 83" />
  <path class="arrow" d="M 734 83 L 770 83" />
  <path class="arrow" d="M 674 118 L 674 148 L 489 148 L 489 118" />
  <text class="foot" x="582" y="168">next step</text>

  <line class="rule" x1="24" y1="204" x2="876" y2="204" />

  <text class="head" x="24" y="240">Validate and retry — Instructor</text>

  <rect class="box" x="24" y="262" width="150" height="62" rx="8" ry="8" />
  <text class="label" x="99" y="288">Pydantic model</text>
  <text class="sub" x="99" y="307">to a prompt or tool</text>

  <rect class="box" x="214" y="262" width="150" height="62" rx="8" ry="8" />
  <text class="label" x="289" y="288">Free generation</text>
  <text class="sub" x="289" y="307">any provider</text>

  <rect class="hero" x="404" y="262" width="170" height="62" rx="8" ry="8" />
  <text class="label-inv" x="489" y="288">Parse + validate</text>
  <text class="sub-inv" x="489" y="307">after the fact</text>

  <rect class="adj" x="614" y="262" width="120" height="62" rx="8" ry="8" />
  <text class="label" x="674" y="288">Retry</text>
  <text class="sub" x="674" y="307">error fed back</text>

  <rect class="box" x="774" y="262" width="102" height="62" rx="8" ry="8" />
  <text class="label" x="825" y="288">Output</text>
  <text class="sub" x="825" y="307">or exception</text>

  <path class="arrow" d="M 174 293 L 210 293" />
  <path class="arrow" d="M 364 293 L 400 293" />
  <path class="arrow" d="M 574 293 L 610 293" />
  <path class="arrow" d="M 734 293 L 770 293" />
  <path class="arrow" d="M 674 328 L 674 358 L 289 358 L 289 328" />
  <text class="foot" x="482" y="378">another full generation</text>

  <rect class="adj" x="214" y="410" width="472" height="62" rx="8" ry="8" />
  <text class="label" x="450" y="436">Semantic rules live here — and only here</text>
  <text class="sub" x="450" y="456">cross-field invariants a grammar cannot express</text>
  <path class="arrow" d="M 489 328 L 489 406" />
</svg>
