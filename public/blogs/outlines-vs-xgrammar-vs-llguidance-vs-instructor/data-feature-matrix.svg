<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Capability matrix across the four structured-output tools</title>
  <desc id="d">A four-by-five grid scoring Outlines, XGrammar, llguidance and Instructor on well-formedness guarantee, recursive schema support, per-request unique schemas, semantic and cross-field validation, and whether the tool works against a hosted API you do not run. Each is strong where its design premise points and weak against the grain.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: start; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">Where each tool leans hardest</text>

  <text class="body-text" x="238" y="58" style="font-weight:600">Well-formed</text>
  <text class="body-text" x="238" y="72" style="font-weight:600">by construction</text>
  <text class="body-text" x="378" y="58" style="font-weight:600">Recursive</text>
  <text class="body-text" x="378" y="72" style="font-weight:600">schemas</text>
  <text class="body-text" x="518" y="58" style="font-weight:600">Unique schema</text>
  <text class="body-text" x="518" y="72" style="font-weight:600">per request</text>
  <text class="body-text" x="658" y="58" style="font-weight:600">Semantic /</text>
  <text class="body-text" x="658" y="72" style="font-weight:600">cross-field rules</text>
  <text class="body-text" x="798" y="58" style="font-weight:600">Works on a</text>
  <text class="body-text" x="798" y="72" style="font-weight:600">hosted API</text>

  <text class="row-head" x="154" y="118">Outlines</text>
  <rect class="card-accent" x="171" y="88" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="238" y="114">Guaranteed</text>
  <rect class="card-neutral" x="311" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="378" y="109">Bounded depth</text>
  <text class="body-text" x="378" y="123">or rejected</text>
  <rect class="card-neutral" x="451" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="518" y="109">Precompute cost</text>
  <text class="body-text" x="518" y="123">on every new one</text>
  <rect class="card-neutral" x="591" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="658" y="114">Out of scope</text>
  <rect class="card-neutral" x="731" y="88" width="134" height="52" rx="6" />
  <text class="body-text" x="798" y="114">Self-hosted only</text>

  <text class="row-head" x="154" y="182">XGrammar</text>
  <rect class="card-accent" x="171" y="152" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="238" y="178">Guaranteed</text>
  <rect class="card-accent" x="311" y="152" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="378" y="178">Full CFG</text>
  <rect class="card-soft" x="451" y="152" width="134" height="52" rx="6" />
  <text class="body-text" x="518" y="173">JIT + cache;</text>
  <text class="body-text" x="518" y="187">repeats are free</text>
  <rect class="card-neutral" x="591" y="152" width="134" height="52" rx="6" />
  <text class="body-text" x="658" y="178">Out of scope</text>
  <rect class="card-neutral" x="731" y="152" width="134" height="52" rx="6" />
  <text class="body-text" x="798" y="178">Self-hosted only</text>

  <text class="row-head" x="154" y="246">llguidance</text>
  <rect class="card-accent" x="171" y="216" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="238" y="242">Guaranteed</text>
  <rect class="card-accent" x="311" y="216" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="378" y="242">Full CFG</text>
  <rect class="card-accent" x="451" y="216" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="518" y="237">Lazy build;</text>
  <text class="body-text-inv" x="518" y="251">no startup cost</text>
  <rect class="card-neutral" x="591" y="216" width="134" height="52" rx="6" />
  <text class="body-text" x="658" y="242">Out of scope</text>
  <rect class="card-neutral" x="731" y="216" width="134" height="52" rx="6" />
  <text class="body-text" x="798" y="242">Self-hosted only</text>

  <text class="row-head" x="154" y="310">Instructor</text>
  <rect class="card-neutral" x="171" y="280" width="134" height="52" rx="6" />
  <text class="body-text" x="238" y="301">Only via the</text>
  <text class="body-text" x="238" y="315">provider, if offered</text>
  <rect class="card-soft" x="311" y="280" width="134" height="52" rx="6" />
  <text class="body-text" x="378" y="301">Whatever Pydantic</text>
  <text class="body-text" x="378" y="315">expresses</text>
  <rect class="card-accent" x="451" y="280" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="518" y="306">No compile step</text>
  <rect class="card-accent" x="591" y="280" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="658" y="301">Arbitrary Python</text>
  <text class="body-text-inv" x="658" y="315">validators</text>
  <rect class="card-accent" x="731" y="280" width="134" height="52" rx="6" />
  <text class="body-text-inv" x="798" y="306">Any provider</text>

  <rect class="card-accent" x="171" y="356" width="16" height="16" rx="3" />
  <text class="legend-text" x="195" y="369">Strong</text>
  <rect class="card-soft" x="311" y="356" width="16" height="16" rx="3" />
  <text class="legend-text" x="335" y="369">Conditional</text>
  <rect class="card-neutral" x="471" y="356" width="16" height="16" rx="3" />
  <text class="legend-text" x="495" y="369">Weak or not applicable</text>
</svg>
