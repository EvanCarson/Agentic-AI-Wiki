<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="raT raD">
  <title id="raT">Reviewer-hours needed per day at three pull-request arrival rates</title>
  <desc id="raD">Horizontal bar chart assuming twenty minutes of genuine review per pull request. Twenty pull requests a day needs 6.7 reviewer-hours. Fifty needs 16.7 reviewer-hours. One hundred needs 33.3 reviewer-hours, slightly more than four full-time reviewers doing nothing else. A dotted line marks one reviewer's eight-hour day.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .lbl   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .val   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val-a { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--accent, #d4421e); }
    .grid  { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .mark  { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 5 4; opacity: .55; }
    .b-hi  { fill: var(--accent, #d4421e); rx: 4; ry: 4; }
    .b-mid { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .b-lo  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
  </style>

  <text class="ttl" x="0" y="22">Reviewer-hours needed per day</text>
  <text class="sub" x="0" y="44">Assumes 20 minutes of genuine review per pull request</text>

  <line class="grid" x1="230" y1="70" x2="230" y2="316" />
  <line class="grid" x1="390" y1="70" x2="390" y2="316" />
  <line class="grid" x1="550" y1="70" x2="550" y2="316" />
  <line class="grid" x1="710" y1="70" x2="710" y2="316" />
  <line class="grid" x1="870" y1="70" x2="870" y2="316" />

  <text class="lbl" x="0" y="112">20 PRs/day</text>
  <rect class="b-lo" x="230" y="92" width="107" height="30" />
  <text class="val" x="349" y="113">6.7 h</text>

  <text class="lbl" x="0" y="192">50 PRs/day</text>
  <rect class="b-mid" x="230" y="172" width="267" height="30" />
  <text class="val" x="509" y="193">16.7 h</text>

  <text class="lbl" x="0" y="272">100 PRs/day</text>
  <rect class="b-hi" x="230" y="252" width="533" height="30" />
  <text class="val-a" x="775" y="273">33.3 h</text>

  <line class="mark" x1="358" y1="70" x2="358" y2="316" />
  <text class="sub" x="366" y="332">one reviewer, 8 h</text>

  <text class="sub" x="230" y="360">0</text>
  <text class="sub" x="390" y="360">10</text>
  <text class="sub" x="550" y="360">20</text>
  <text class="sub" x="710" y="360">30</text>
  <text class="sub" x="852" y="360">40 h</text>

  <text class="sub" x="0" y="388">At 100 PRs a day that is slightly more than four full-time reviewers doing nothing else.</text>
</svg>
