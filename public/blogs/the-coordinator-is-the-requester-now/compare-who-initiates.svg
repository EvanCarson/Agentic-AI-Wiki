<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="wiT wiD">
  <title id="wiT">Who starts a unit of work, across three generations of coding agent</title>
  <desc id="wiD">Three columns. IDE assistant: a human types every request and reviews the diff in front of them. Background and cloud agents: a human files a task, the agent runs unattended and returns a pull request. Coordinator with triggers: a Slack message, a schedule or a pull-request event starts the work, the coordinator plans and delegates to subagents, and the pull request arrives with no requesting human recorded anywhere.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .92; }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Who starts the work</text>

  <rect class="box" x="35" y="48" width="250" height="96" />
  <text class="hd" x="160" y="76" text-anchor="middle">IDE assistant</text>
  <text class="cell" x="160" y="100" text-anchor="middle">A human types every</text>
  <text class="cell" x="160" y="118" text-anchor="middle">request and reads the</text>
  <text class="cell" x="160" y="136" text-anchor="middle">diff in front of them.</text>

  <rect class="adj" x="325" y="48" width="250" height="96" />
  <text class="hd" x="450" y="76" text-anchor="middle">Background agents</text>
  <text class="cell" x="450" y="100" text-anchor="middle">A human files a task.</text>
  <text class="cell" x="450" y="118" text-anchor="middle">The agent runs alone</text>
  <text class="cell" x="450" y="136" text-anchor="middle">and returns a PR.</text>

  <rect class="hero" x="625" y="48" width="250" height="96" />
  <text class="hd-inv" x="750" y="76" text-anchor="middle">Coordinator + triggers</text>
  <text class="cell-inv" x="750" y="100" text-anchor="middle">Slack, a schedule or a PR</text>
  <text class="cell-inv" x="750" y="118" text-anchor="middle">event starts the work and</text>
  <text class="cell-inv" x="750" y="136" text-anchor="middle">the coordinator delegates.</text>

  <text class="lane" x="160" y="176" text-anchor="middle">Who asked?</text>
  <text class="lane" x="450" y="176" text-anchor="middle">Who asked?</text>
  <text class="lane" x="750" y="176" text-anchor="middle">Who asked?</text>

  <rect class="box" x="35" y="186" width="250" height="80" />
  <text class="cell" x="160" y="214" text-anchor="middle">The person at the</text>
  <text class="cell" x="160" y="236" text-anchor="middle">keyboard, per turn.</text>

  <rect class="box" x="325" y="186" width="250" height="80" />
  <text class="cell" x="450" y="214" text-anchor="middle">The person who filed</text>
  <text class="cell" x="450" y="236" text-anchor="middle">the task, per task.</text>

  <rect class="box" x="625" y="186" width="250" height="80" />
  <text class="cell" x="750" y="214" text-anchor="middle">Not recorded. A trigger</text>
  <text class="cell" x="750" y="236" text-anchor="middle">fired; nobody asked.</text>
</svg>
