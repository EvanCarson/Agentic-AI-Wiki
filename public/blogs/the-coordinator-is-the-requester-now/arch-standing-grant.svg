<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="sgT sgD">
  <title id="sgT">A trigger list as a standing grant</title>
  <desc id="sgD">Three trigger sources on the left — a Slack channel, a schedule and pull-request events — feed a coordinator in the centre that holds a plan and months of retained context. The coordinator fans out to subagents that produce pull requests into a review queue. On the right, the four fields a grant normally carries — who granted it, what scope, until when, and for what purpose — are each marked as not recorded.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ghost  { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1.25; stroke-dasharray: 4 3; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .85; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#sgArr); }
  </style>
  <defs>
    <marker id="sgArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="20">Triggers originate work; the grant is a settings pane</text>

  <text class="lane" x="20" y="52">Origination triggers</text>
  <rect class="adj" x="20" y="64" width="190" height="52" />
  <text class="cell" x="115" y="95" text-anchor="middle">Slack channel</text>
  <rect class="adj" x="20" y="130" width="190" height="52" />
  <text class="cell" x="115" y="161" text-anchor="middle">Schedule</text>
  <rect class="adj" x="20" y="196" width="190" height="52" />
  <text class="cell" x="115" y="227" text-anchor="middle">Pull-request events</text>

  <path class="arrow" d="M 214 90 L 294 148" />
  <path class="arrow" d="M 214 156 L 294 156" />
  <path class="arrow" d="M 214 222 L 294 166" />

  <rect class="hero" x="300" y="100" width="250" height="120" />
  <text class="hd-inv" x="425" y="132" text-anchor="middle">Coordinator</text>
  <text class="cell-inv" x="425" y="158" text-anchor="middle">Plans. Does not write code.</text>
  <text class="cell-inv" x="425" y="180" text-anchor="middle">Holds months of context</text>
  <text class="cell-inv" x="425" y="202" text-anchor="middle">that nobody diffs.</text>

  <path class="arrow" d="M 425 224 L 425 264" />

  <text class="lane" x="300" y="288">Fan-out</text>
  <rect class="box" x="300" y="298" width="74" height="46" />
  <text class="cell" x="337" y="326" text-anchor="middle">agent</text>
  <rect class="box" x="388" y="298" width="74" height="46" />
  <text class="cell" x="425" y="326" text-anchor="middle">agent</text>
  <rect class="box" x="476" y="298" width="74" height="46" />
  <text class="cell" x="513" y="326" text-anchor="middle">agent…</text>

  <path class="arrow" d="M 425 348 L 425 388" />

  <rect class="box" x="300" y="398" width="250" height="62" />
  <text class="hd" x="425" y="424" text-anchor="middle">Review queue</text>
  <text class="cell" x="425" y="446" text-anchor="middle">20–100 PRs a day, one project</text>

  <text class="lane" x="620" y="52">What a grant normally records</text>
  <rect class="ghost" x="620" y="64" width="260" height="52" />
  <text class="cell" x="750" y="88" text-anchor="middle">Who granted it</text>
  <text class="lane" x="750" y="106" text-anchor="middle">not recorded</text>
  <rect class="ghost" x="620" y="130" width="260" height="52" />
  <text class="cell" x="750" y="154" text-anchor="middle">What scope it covers</text>
  <text class="lane" x="750" y="172" text-anchor="middle">not recorded</text>
  <rect class="ghost" x="620" y="196" width="260" height="52" />
  <text class="cell" x="750" y="220" text-anchor="middle">Until when</text>
  <text class="lane" x="750" y="238" text-anchor="middle">not recorded</text>
  <rect class="ghost" x="620" y="262" width="260" height="52" />
  <text class="cell" x="750" y="286" text-anchor="middle">For what purpose</text>
  <text class="lane" x="750" y="304" text-anchor="middle">not recorded</text>

  <rect class="box" x="620" y="360" width="260" height="100" />
  <text class="hd" x="750" y="388" text-anchor="middle">What is recorded</text>
  <text class="cell" x="750" y="412" text-anchor="middle">A toggle in a settings pane,</text>
  <text class="cell" x="750" y="432" text-anchor="middle">enabled once, reviewed by</text>
  <text class="cell" x="750" y="452" text-anchor="middle">nobody, expiring never.</text>
</svg>
