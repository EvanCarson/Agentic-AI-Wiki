<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="vt vd">
  <title id="vt">Where each vendor left the plugin-pin check</title>
  <desc id="vd">A four-by-three matrix. Rows are Claude Code, OpenAI Codex, GitHub Copilot and Gemini CLI. Columns are a client-side commit check, reliance on the git host forbidding forty-hex ref names, and retiring the client. Claude Code and Codex added the client-side check; Copilot relies on the host rules; Gemini CLI was deprecated.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .medium { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="title" x="20" y="26">Which layer holds the check, per vendor</text>

  <text class="col" x="330" y="58" text-anchor="middle">Commit checked in the client</text>
  <text class="col" x="560" y="58" text-anchor="middle">Host forbids the ref name</text>
  <text class="col" x="785" y="58" text-anchor="middle">Client retired</text>

  <text class="row" x="20" y="95">Claude Code</text>
  <rect class="strong" x="220" y="76" width="220" height="30" />
  <text class="label-inv" x="330" y="96" text-anchor="middle">Yes — 2.1.179</text>
  <rect class="weak" x="450" y="76" width="220" height="30" />
  <text class="label" x="560" y="96" text-anchor="middle">not relied on</text>
  <rect class="weak" x="680" y="76" width="200" height="30" />
  <text class="label" x="780" y="96" text-anchor="middle">—</text>

  <text class="row" x="20" y="145">OpenAI Codex</text>
  <rect class="strong" x="220" y="126" width="220" height="30" />
  <text class="label-inv" x="330" y="146" text-anchor="middle">Yes — 0.146.0</text>
  <rect class="weak" x="450" y="126" width="220" height="30" />
  <text class="label" x="560" y="146" text-anchor="middle">not relied on</text>
  <rect class="weak" x="680" y="126" width="200" height="30" />
  <text class="label" x="780" y="146" text-anchor="middle">—</text>

  <text class="row" x="20" y="195">GitHub Copilot</text>
  <rect class="weak" x="220" y="176" width="220" height="30" />
  <text class="label" x="330" y="196" text-anchor="middle">No</text>
  <rect class="medium" x="450" y="176" width="220" height="30" />
  <text class="label" x="560" y="196" text-anchor="middle">Yes — stated defence</text>
  <rect class="weak" x="680" y="176" width="200" height="30" />
  <text class="label" x="780" y="196" text-anchor="middle">—</text>

  <text class="row" x="20" y="245">Gemini CLI</text>
  <rect class="weak" x="220" y="226" width="220" height="30" />
  <text class="label" x="330" y="246" text-anchor="middle">No</text>
  <rect class="weak" x="450" y="226" width="220" height="30" />
  <text class="label" x="560" y="246" text-anchor="middle">not stated</text>
  <rect class="medium" x="680" y="226" width="200" height="30" />
  <text class="label" x="780" y="246" text-anchor="middle">Deprecated</text>

  <rect class="strong" x="20" y="292" width="16" height="16" />
  <text class="sub" x="44" y="305">Check lives in the client — inspectable, travels with the artefact</text>
  <rect class="medium" x="20" y="320" width="16" height="16" />
  <text class="sub" x="44" y="333">Defence owned elsewhere — real where it applies, invisible in your manifest</text>
  <rect class="weak" x="20" y="348" width="16" height="16" />
  <text class="sub" x="44" y="361">Absent or not applicable</text>
</svg>
