<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="ct cd">
  <title id="ct">Three places the pin check can live</title>
  <desc id="cd">Three columns — verify in the client, forbid the ref name at the git host, and retire the client — each showing what it buys, who owns it, and where it stops holding, with a closing note that only the client-side check is a property of the artefact you can inspect.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .rule   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .45; }
  </style>

  <text class="title" x="20" y="28">Same attack, three defences, three owners</text>

  <rect class="hero" x="30" y="50" width="250" height="46" />
  <text class="label-inv" x="155" y="79" text-anchor="middle">Verify in the client</text>
  <rect class="adj" x="325" y="50" width="250" height="46" />
  <text class="label" x="450" y="79" text-anchor="middle">Forbid the name at the host</text>
  <rect class="box" x="620" y="50" width="250" height="46" />
  <text class="label" x="745" y="79" text-anchor="middle">Retire the client</text>

  <text class="sub" x="155" y="126" text-anchor="middle">Buys: a pin that is binding</text>
  <text class="sub" x="155" y="143" text-anchor="middle">everywhere, for one line of code</text>
  <text class="sub" x="450" y="126" text-anchor="middle">Buys: protection for every</text>
  <text class="sub" x="450" y="143" text-anchor="middle">unverified client on that platform</text>
  <text class="sub" x="745" y="126" text-anchor="middle">Buys: nothing until the</text>
  <text class="sub" x="745" y="143" text-anchor="middle">last install is gone</text>

  <path class="rule" d="M 30 160 L 870 160" />

  <text class="sub" x="155" y="186" text-anchor="middle">Owned by: you, or your</text>
  <text class="sub" x="155" y="203" text-anchor="middle">agent vendor</text>
  <text class="sub" x="450" y="186" text-anchor="middle">Owned by: GitHub, GitLab —</text>
  <text class="sub" x="450" y="203" text-anchor="middle">as a usability guard</text>
  <text class="sub" x="745" y="186" text-anchor="middle">Owned by: whoever still</text>
  <text class="sub" x="745" y="203" text-anchor="middle">has it installed</text>

  <text class="sub" x="155" y="228" text-anchor="middle">Stops holding: never</text>
  <text class="sub" x="450" y="228" text-anchor="middle">Stops holding: mirrors, self-hosted</text>
  <text class="sub" x="450" y="245" text-anchor="middle">forges, older instances</text>
  <text class="sub" x="745" y="228" text-anchor="middle">Stops holding: immediately,</text>
  <text class="sub" x="745" y="245" text-anchor="middle">on every unupgraded laptop</text>

  <rect class="box" x="30" y="258" width="840" height="34" />
  <text class="label" x="450" y="280" text-anchor="middle">Only the first column is a property of the artefact you can inspect.</text>
</svg>
