<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="pt pd">
  <title id="pt">How a pinned commit SHA resolves to a branch</title>
  <desc id="pd">A flow from a marketplace manifest holding a pinned forty-hex commit SHA, through a shallow clone and a checkout of that string, to git's ambiguous resolution: either the commit object the reviewer approved, or a branch created with the same forty-hex name. Both paths reach the working tree, and the verification step comparing HEAD against the pin is marked as missing before the plugin executes with the developer's permissions.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .miss   { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; stroke-dasharray: 6 5; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .mono-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#pa); }
  </style>
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="hero" x="24" y="40" width="240" height="56" />
  <text class="label-inv" x="144" y="64" text-anchor="middle">Marketplace manifest</text>
  <text class="mono-inv" x="144" y="83" text-anchor="middle">sha: 3f9c…a71b</text>

  <path class="arrow" d="M 268 68 L 316 68" />

  <rect class="box" x="320" y="40" width="230" height="56" />
  <text class="label" x="435" y="64" text-anchor="middle">Shallow clone</text>
  <text class="mono" x="435" y="83" text-anchor="middle">git clone --depth 1</text>

  <path class="arrow" d="M 554 68 L 602 68" />

  <rect class="adj" x="606" y="40" width="262" height="56" />
  <text class="label" x="737" y="64" text-anchor="middle">Checkout the pinned string</text>
  <text class="mono" x="737" y="83" text-anchor="middle">git checkout 3f9c…a71b</text>

  <text class="sub" x="737" y="126" text-anchor="middle">git resolves an ambiguous 40-hex name</text>

  <path class="arrow" d="M 700 136 L 420 176" />
  <path class="arrow" d="M 770 136 L 740 176" />

  <rect class="box" x="140" y="182" width="300" height="64" />
  <text class="label" x="290" y="206" text-anchor="middle">The commit object</text>
  <text class="sub" x="290" y="228" text-anchor="middle">the snapshot the reviewer approved</text>

  <rect class="adj" x="520" y="182" width="320" height="64" />
  <text class="label" x="680" y="206" text-anchor="middle">A ref of the same name</text>
  <text class="mono" x="680" y="228" text-anchor="middle">refs/heads/3f9c…a71b</text>

  <path class="arrow" d="M 290 250 L 420 292" />
  <path class="arrow" d="M 680 250 L 520 292" />

  <rect class="box" x="300" y="298" width="340" height="50" />
  <text class="label" x="470" y="328" text-anchor="middle">Working tree the agent loads</text>

  <path class="arrow" d="M 470 352 L 470 378" />

  <rect class="miss" x="250" y="382" width="440" height="52" />
  <text class="mono" x="470" y="404" text-anchor="middle">rev-parse HEAD == 3f9c…a71b ?</text>
  <text class="sub" x="470" y="424" text-anchor="middle">this box was not in any of the four clients</text>

  <path class="arrow" d="M 470 438 L 470 456" />

  <rect class="hero" x="270" y="460" width="400" height="34" />
  <text class="label-inv" x="470" y="482" text-anchor="middle">Plugin executes with the developer's permissions</text>
</svg>
