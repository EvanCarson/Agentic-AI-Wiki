<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where agent state lives in four frameworks</title>
  <desc id="d">LangGraph checkpoints a typed graph state to an external store at every superstep. Google ADK holds session state in a session service with pluggable backends. CrewAI threads flow state through event handlers with opt-in persistence. The OpenAI Agents SDK keeps run context in memory with sessions for conversation history.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .name  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper); text-anchor: middle; }
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink); opacity: .68; text-anchor: middle; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.3; marker-end: url(#arr4); }
    .tag   { font-family: var(--font-mono); font-size: 10px; fill: currentColor; opacity: .75; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="chart-title" x="450" y="26">Four answers to one question: where does the run live?</text>

  <rect class="hero" x="30" y="48" width="190" height="34" rx="7" />
  <text class="name" x="125" y="70">LangGraph</text>
  <rect class="box" x="30" y="94" width="190" height="52" rx="7" />
  <text class="label" x="125" y="116">Typed graph state</text>
  <text class="sub" x="125" y="134">nodes + conditional edges</text>
  <path class="arrow" d="M 125 150 L 125 176" />
  <rect class="adj" x="30" y="184" width="190" height="60" rx="7" />
  <text class="label" x="125" y="206">Checkpointer</text>
  <text class="sub" x="125" y="224">external store, written</text>
  <text class="sub" x="125" y="238">at every superstep</text>
  <text class="tag" x="125" y="266">resume &#183; fork &#183; interrupt()</text>

  <rect class="hero" x="255" y="48" width="190" height="34" rx="7" />
  <text class="name" x="350" y="70">Google ADK</text>
  <rect class="box" x="255" y="94" width="190" height="52" rx="7" />
  <text class="label" x="350" y="116">Hierarchical agent tree</text>
  <text class="sub" x="350" y="134">Sequential / Parallel / Loop</text>
  <path class="arrow" d="M 350 150 L 350 176" />
  <rect class="adj" x="255" y="184" width="190" height="60" rx="7" />
  <text class="label" x="350" y="206">Session service</text>
  <text class="sub" x="350" y="224">shared state + events,</text>
  <text class="sub" x="350" y="238">pluggable backend</text>
  <text class="tag" x="350" y="266">shared keys &#183; temp: scope</text>

  <rect class="hero" x="480" y="48" width="190" height="34" rx="7" />
  <text class="name" x="575" y="70">CrewAI</text>
  <rect class="box" x="480" y="94" width="190" height="52" rx="7" />
  <text class="label" x="575" y="116">Crews inside Flows</text>
  <text class="sub" x="575" y="134">@start / @listen / @router</text>
  <path class="arrow" d="M 575 150 L 575 176" />
  <rect class="adj" x="480" y="184" width="190" height="60" rx="7" />
  <text class="label" x="575" y="206">Flow state</text>
  <text class="sub" x="575" y="224">dict or Pydantic model,</text>
  <text class="sub" x="575" y="238">persisted where you ask</text>
  <text class="tag" x="575" y="266">@persist &#183; opt-in</text>

  <rect class="hero" x="705" y="48" width="190" height="34" rx="7" />
  <text class="name" x="800" y="70">OpenAI Agents SDK</text>
  <rect class="box" x="705" y="94" width="190" height="52" rx="7" />
  <text class="label" x="800" y="116">Agents + handoffs</text>
  <text class="sub" x="800" y="134">runner drives the loop</text>
  <path class="arrow" d="M 800 150 L 800 176" />
  <rect class="adj" x="705" y="184" width="190" height="60" rx="7" />
  <text class="label" x="800" y="206">Run context</text>
  <text class="sub" x="800" y="224">in memory; sessions hold</text>
  <text class="sub" x="800" y="238">conversation history</text>
  <text class="tag" x="800" y="266">tracing to the platform</text>

  <rect class="box" x="30" y="300" width="840" height="72" rx="8" />
  <text class="label" x="450" y="326">The question that separates them is not &#8220;graph or crew or handoff&#8221;.</text>
  <text class="label" x="450" y="348">It is: after a crash mid-run, what does the framework let you reconstruct &#8212; and from where?</text>

  <rect class="adj" x="30" y="392" width="410" height="76" rx="8" />
  <text class="label" x="235" y="418">State externalised by default</text>
  <text class="sub" x="235" y="438">Resume, fork and human approval are properties</text>
  <text class="sub" x="235" y="454">of the runtime. You inherit them.</text>

  <rect class="box" x="460" y="392" width="410" height="76" rx="8" />
  <text class="label" x="665" y="418">State in the process by default</text>
  <text class="sub" x="665" y="438">Durability is yours to build, and retrofitting it</text>
  <text class="sub" x="665" y="454">means re-drawing the control flow.</text>
</svg>
