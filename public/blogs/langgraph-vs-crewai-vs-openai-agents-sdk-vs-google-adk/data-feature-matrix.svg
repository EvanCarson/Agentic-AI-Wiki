<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Where each agent framework leans hardest</title>
  <desc id="d">A matrix of four frameworks against five axes: built-in durability, human-in-the-loop pause and resume, model portability, multi-agent shape, and out-of-the-box observability.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-head { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cv     { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink); text-anchor: middle; }
    .cv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--paper); text-anchor: middle; }
    .legend { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; }
  </style>

  <text class="chart-title" x="450" y="26">Five axes, four bets</text>

  <text class="col-head" x="298" y="58">Built-in</text><text class="col-head" x="298" y="71">durability</text>
  <text class="col-head" x="424" y="58">Pause for</text><text class="col-head" x="424" y="71">a human</text>
  <text class="col-head" x="550" y="58">Model</text><text class="col-head" x="550" y="71">portability</text>
  <text class="col-head" x="676" y="58">Multi-agent</text><text class="col-head" x="676" y="71">shape</text>
  <text class="col-head" x="802" y="58">Tracing out</text><text class="col-head" x="802" y="71">of the box</text>

  <text class="row-head" x="24" y="110">LangGraph</text>
  <rect class="strong" x="240" y="86" width="116" height="40" rx="5" /><text class="cv-inv" x="298" y="111">Checkpointer</text>
  <rect class="strong" x="366" y="86" width="116" height="40" rx="5" /><text class="cv-inv" x="424" y="111">interrupt()</text>
  <rect class="strong" x="492" y="86" width="116" height="40" rx="5" /><text class="cv-inv" x="550" y="111">Agnostic</text>
  <rect class="mid" x="618" y="86" width="116" height="40" rx="5" /><text class="cv" x="676" y="111">Explicit graph</text>
  <rect class="mid" x="744" y="86" width="116" height="40" rx="5" /><text class="cv" x="802" y="111">Vendor suite</text>

  <text class="row-head" x="24" y="172">Google ADK</text>
  <rect class="mid" x="240" y="148" width="116" height="40" rx="5" /><text class="cv" x="298" y="173">Session store</text>
  <rect class="mid" x="366" y="148" width="116" height="40" rx="5" /><text class="cv" x="424" y="173">Callbacks</text>
  <rect class="mid" x="492" y="148" width="116" height="40" rx="5" /><text class="cv" x="550" y="173">Gemini-first</text>
  <rect class="strong" x="618" y="148" width="116" height="40" rx="5" /><text class="cv-inv" x="676" y="173">Agent tree</text>
  <rect class="mid" x="744" y="148" width="116" height="40" rx="5" /><text class="cv" x="802" y="173">Cloud-native</text>

  <text class="row-head" x="24" y="234">CrewAI</text>
  <rect class="mid" x="240" y="210" width="116" height="40" rx="5" /><text class="cv" x="298" y="235">@persist</text>
  <rect class="weak" x="366" y="210" width="116" height="40" rx="5" /><text class="cv" x="424" y="235">Roll your own</text>
  <rect class="strong" x="492" y="210" width="116" height="40" rx="5" /><text class="cv-inv" x="550" y="235">Agnostic</text>
  <rect class="strong" x="618" y="210" width="116" height="40" rx="5" /><text class="cv-inv" x="676" y="235">Role crews</text>
  <rect class="weak" x="744" y="210" width="116" height="40" rx="5" /><text class="cv" x="802" y="235">Bring your own</text>

  <text class="row-head" x="24" y="296">OpenAI SDK</text>
  <rect class="weak" x="240" y="272" width="116" height="40" rx="5" /><text class="cv" x="298" y="297">In-process</text>
  <rect class="mid" x="366" y="272" width="116" height="40" rx="5" /><text class="cv" x="424" y="297">Approval hook</text>
  <rect class="weak" x="492" y="272" width="116" height="40" rx="5" /><text class="cv" x="550" y="297">OpenAI-first</text>
  <rect class="mid" x="618" y="272" width="116" height="40" rx="5" /><text class="cv" x="676" y="297">Handoffs</text>
  <rect class="strong" x="744" y="272" width="116" height="40" rx="5" /><text class="cv-inv" x="802" y="297">Built in</text>

  <rect class="strong" x="240" y="336" width="15" height="15" rx="3" />
  <text class="legend" x="262" y="348">Strong</text>
  <rect class="mid" x="400" y="336" width="15" height="15" rx="3" />
  <text class="legend" x="422" y="348">Present, with work</text>
  <rect class="weak" x="620" y="336" width="15" height="15" rx="3" />
  <text class="legend" x="642" y="348">Not the framework's job</text>

  <text class="legend" x="24" y="384" style="opacity:.7">No row is best. Column one is the one you cannot add later without redrawing the other four.</text>
</svg>
