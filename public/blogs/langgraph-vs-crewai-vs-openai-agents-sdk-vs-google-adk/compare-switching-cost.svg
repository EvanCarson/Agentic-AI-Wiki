<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What it costs to change your mind, by layer</title>
  <desc id="d">Prompts and tool definitions port between frameworks in hours. Orchestration shape ports in weeks. The state and persistence contract does not port at all, because everything above it is written against its assumptions.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-title { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); text-anchor: middle; opacity: .9; }
    .weak { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .mid  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">The layer you pick a framework for is the layer you cannot re-pick</text>

  <rect class="weak" x="35" y="52" width="250" height="92" rx="8" />
  <text class="col-title" x="160" y="80" fill="var(--ink)">Prompts &amp; tool defs</text>
  <text class="label" x="160" y="104">Function schemas, system text,</text>
  <text class="label" x="160" y="122">MCP servers you already run</text>
  <text class="label" x="160" y="140" style="opacity:.7">Hours</text>

  <rect class="mid" x="325" y="52" width="250" height="92" rx="8" />
  <text class="col-title" x="450" y="80" fill="var(--ink)">Orchestration shape</text>
  <text class="label" x="450" y="104">Graph, crew, tree or handoff &#8212;</text>
  <text class="label" x="450" y="122">a rewrite, but a mechanical one</text>
  <text class="label" x="450" y="140" style="opacity:.7">Weeks</text>

  <rect class="hero" x="615" y="52" width="250" height="92" rx="8" />
  <text class="col-title" x="740" y="80" fill="var(--paper)">State &amp; persistence contract</text>
  <text class="label-inv" x="740" y="104">Where the run lives, what resume</text>
  <text class="label-inv" x="740" y="122">means, how a human pauses it</text>
  <text class="label-inv" x="740" y="140">Everything above is written against it</text>

  <rect class="weak" x="35" y="176" width="830" height="66" rx="8" />
  <text class="label" x="450" y="202">Teams evaluate frameworks on the first two columns because those are what a tutorial shows.</text>
  <text class="label" x="450" y="224">The migration that hurts eighteen months later is always the third.</text>

  <text class="label" x="450" y="274" style="opacity:.7">Pick for the state model. The metaphor is the part you will stop noticing by week three.</text>
</svg>
