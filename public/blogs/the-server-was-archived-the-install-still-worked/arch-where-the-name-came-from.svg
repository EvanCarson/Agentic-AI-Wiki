<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="wnt wnd">
  <title id="wnt">Two paths to the same install command</title>
  <desc id="wnd">Two parallel pipelines ending at the same npx resolution step. The upper, governed path runs from a developer declaring a dependency, through package.json, a lockfile and a dependency scanner, to the install. The lower, ungoverned path runs from the model's training data recalling a package name, through an agent writing an MCP client config, straight to the same npx resolution and then to a server process holding the developer's filesystem and tokens. None of the upper path's controls sit on the lower path.</desc>
  <style>
    .wn-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .wn-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .wn-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .wn-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wn-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .wn-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wn-sub  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .65; }
    .wn-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#wnarr); }
  </style>
  <defs>
    <marker id="wnarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="wn-ttl" x="20" y="28">Governed: a dependency you declared</text>

  <rect class="wn-box" x="20"  y="48" width="150" height="54" rx="8" />
  <text class="wn-lab" x="95"  y="72" text-anchor="middle">Developer picks</text>
  <text class="wn-lab" x="95"  y="90" text-anchor="middle">a package</text>

  <rect class="wn-box" x="210" y="48" width="150" height="54" rx="8" />
  <text class="wn-sub" x="285" y="72" text-anchor="middle">package.json</text>
  <text class="wn-sub" x="285" y="90" text-anchor="middle">+ lockfile</text>

  <rect class="wn-adj" x="400" y="48" width="150" height="54" rx="8" />
  <text class="wn-lab" x="475" y="72" text-anchor="middle">SCA scan,</text>
  <text class="wn-lab" x="475" y="90" text-anchor="middle">review, audit</text>

  <path class="wn-arr" d="M 170 75 L 205 75" />
  <path class="wn-arr" d="M 360 75 L 395 75" />
  <path class="wn-arr" d="M 550 75 L 640 148" />

  <text class="wn-ttl" x="20" y="200">Ungoverned: a name the model remembered</text>

  <rect class="wn-hero" x="20"  y="220" width="150" height="54" rx="8" />
  <text class="wn-inv" x="95"  y="244" text-anchor="middle">Training data</text>
  <text class="wn-inv" x="95"  y="262" text-anchor="middle">recalls a name</text>

  <rect class="wn-box" x="210" y="220" width="150" height="54" rx="8" />
  <text class="wn-lab" x="285" y="244" text-anchor="middle">Agent writes</text>
  <text class="wn-sub" x="285" y="262" text-anchor="middle">mcp.json</text>

  <rect class="wn-box" x="400" y="220" width="150" height="54" rx="8" />
  <text class="wn-lab" x="475" y="244" text-anchor="middle">No gate here</text>
  <text class="wn-sub" x="475" y="262" text-anchor="middle">(nothing to scan)</text>

  <path class="wn-arr" d="M 170 247 L 205 247" />
  <path class="wn-arr" d="M 360 247 L 395 247" />
  <path class="wn-arr" d="M 550 247 L 640 175" />

  <rect class="wn-adj" x="645" y="130" width="235" height="62" rx="8" />
  <text class="wn-sub" x="762" y="156" text-anchor="middle">npx @scope/pkg</text>
  <text class="wn-lab" x="762" y="178" text-anchor="middle">resolves, downloads, runs</text>

  <path class="wn-arr" d="M 762 192 L 762 300" />

  <rect class="wn-box" x="645" y="305" width="235" height="88" rx="8" />
  <text class="wn-lab" x="762" y="331" text-anchor="middle">Server process holding</text>
  <text class="wn-lab" x="762" y="351" text-anchor="middle">your filesystem, your</text>
  <text class="wn-lab" x="762" y="371" text-anchor="middle">tokens, your network</text>

  <text class="wn-sub" x="20" y="440">Same resolution step. Same privileges. One of the two paths has a gate on it.</text>
  <text class="wn-sub" x="20" y="462">An archived package installs exactly as fast as a maintained one.</text>
</svg>
