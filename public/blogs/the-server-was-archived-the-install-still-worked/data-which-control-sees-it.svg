<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="wct wcd">
  <title id="wct">Which existing control sees an agent-initiated MCP server install</title>
  <desc id="wcd">Five rows of supply-chain controls, each scored on whether it sees an agent-initiated MCP server install and whether it blocks one. Lockfiles and pinning see nothing and block nothing because the package was never declared. A repository dependency scan sees nothing for the same reason. Endpoint inventory may see the process but does not block it. An npm deprecation warning is printed but does not stop npx. Only a pre-resolution allowlist both sees and blocks.</desc>
  <style>
    .wc-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .wc-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .wc-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .wc-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wc-col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .wc-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wc-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .wc-cellin { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .wc-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="wc-ttl" x="20" y="30">What your existing controls do about it</text>

  <text class="wc-col" x="505" y="66" text-anchor="middle">SEES THE INSTALL</text>
  <text class="wc-col" x="755" y="66" text-anchor="middle">BLOCKS IT</text>

  <text class="wc-row" x="20" y="101">Lockfile and version pinning</text>
  <rect class="wc-weak"   x="400" y="80" width="210" height="32" />
  <text class="wc-cell"   x="505" y="101" text-anchor="middle">No</text>
  <rect class="wc-weak"   x="650" y="80" width="210" height="32" />
  <text class="wc-cell"   x="755" y="101" text-anchor="middle">No</text>

  <text class="wc-row" x="20" y="149">Dependency scan of the repository</text>
  <rect class="wc-weak"   x="400" y="128" width="210" height="32" />
  <text class="wc-cell"   x="505" y="149" text-anchor="middle">No</text>
  <rect class="wc-weak"   x="650" y="128" width="210" height="32" />
  <text class="wc-cell"   x="755" y="149" text-anchor="middle">No</text>

  <text class="wc-row" x="20" y="197">Endpoint inventory or EDR</text>
  <rect class="wc-med"    x="400" y="176" width="210" height="32" />
  <text class="wc-cell"   x="505" y="197" text-anchor="middle">Sometimes</text>
  <rect class="wc-weak"   x="650" y="176" width="210" height="32" />
  <text class="wc-cell"   x="755" y="197" text-anchor="middle">No</text>

  <text class="wc-row" x="20" y="245">npm deprecation warning</text>
  <rect class="wc-med"    x="400" y="224" width="210" height="32" />
  <text class="wc-cell"   x="505" y="245" text-anchor="middle">Printed, unread</text>
  <rect class="wc-weak"   x="650" y="224" width="210" height="32" />
  <text class="wc-cell"   x="755" y="245" text-anchor="middle">No</text>

  <text class="wc-row" x="20" y="293">Pre-resolution allowlist</text>
  <rect class="wc-strong" x="400" y="272" width="210" height="32" />
  <text class="wc-cellin" x="505" y="293" text-anchor="middle">Yes</text>
  <rect class="wc-strong" x="650" y="272" width="210" height="32" />
  <text class="wc-cellin" x="755" y="293" text-anchor="middle">Yes</text>

  <rect class="wc-strong" x="20"  y="348" width="16" height="14" />
  <text class="wc-leg" x="44"  y="360" text-anchor="start">Effective</text>
  <rect class="wc-med"    x="140" y="348" width="16" height="14" />
  <text class="wc-leg" x="164" y="360" text-anchor="start">Partial</text>
  <rect class="wc-weak"   x="250" y="348" width="16" height="14" />
  <text class="wc-leg" x="274" y="360" text-anchor="start">Does nothing here</text>
</svg>
