<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="aep-t aep-d">
  <title id="aep-t">Where the environment sits in an agentic RL rollout</title>
  <desc id="aep-d">Two architectures side by side. In the trainer-generator shape the environment is a tool callback inside the generator, so a slow tool blocks the generation slot. In the trainer-generator-environment shape the environment is a separately scheduled service, so generation and tool execution overlap and finished trajectories flow into a bounded queue the trainer consumes.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .frame  { fill: none; stroke: var(--border-soft); stroke-width: 1.25; stroke-dasharray: 4 4; rx: 10; ry: 10; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .8; }
    .note   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .55; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#aep-arr); }
  </style>
  <defs>
    <marker id="aep-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="frame" x="20" y="36" width="400" height="430" />
  <text class="head" x="36" y="26">Trainer — Generator</text>
  <text class="note" x="36" y="62">THE ENVIRONMENT IS A CALLBACK</text>

  <rect class="box" x="48" y="80" width="150" height="60" />
  <text class="label" x="62" y="106">Trainer</text>
  <text class="sub" x="62" y="124">Waits for a full batch</text>

  <rect class="hero" x="48" y="186" width="344" height="130" />
  <text class="label-inv" x="62" y="212">Generator (GPU)</text>
  <text class="sub-inv" x="62" y="234">Decode, then call the tool, then decode</text>
  <text class="sub-inv" x="62" y="252">The slot is held for the whole turn</text>
  <rect class="adj" x="206" y="266" width="172" height="36" />
  <text class="sub" x="218" y="289">tool call — 90s, GPU idle</text>

  <rect class="box" x="48" y="366" width="344" height="68" />
  <text class="label" x="62" y="392">Cost of the shape</text>
  <text class="sub" x="62" y="412">Tail latency of one tool sets the step time</text>
  <text class="sub" x="62" y="428">Strictly on-policy, and mostly waiting</text>

  <path class="arrow" d="M 123 140 L 123 178" />
  <path class="arrow" d="M 300 316 L 300 358" />

  <rect class="frame" x="470" y="36" width="410" height="430" />
  <text class="head" x="486" y="26">Trainer — Generator — Environment</text>
  <text class="note" x="486" y="62">THE ENVIRONMENT IS SCHEDULED</text>

  <rect class="box" x="498" y="80" width="150" height="60" />
  <text class="label" x="512" y="106">Trainer</text>
  <text class="sub" x="512" y="124">Consumes from a queue</text>

  <rect class="hero" x="498" y="186" width="166" height="92" />
  <text class="label-inv" x="512" y="212">Generator</text>
  <text class="sub-inv" x="512" y="234">Never blocks on</text>
  <text class="sub-inv" x="512" y="250">a tool</text>
  <text class="sub-inv" x="512" y="266">Interruptible</text>

  <rect class="adj" x="700" y="186" width="152" height="92" />
  <text class="label" x="714" y="212">Environment</text>
  <text class="sub" x="714" y="234">Own workers</text>
  <text class="sub" x="714" y="250">Own concurrency</text>
  <text class="sub" x="714" y="266">Own timeouts</text>

  <path class="arrow" d="M 664 212 L 692 212" />
  <path class="arrow" d="M 692 252 L 668 252" />

  <rect class="box" x="498" y="326" width="354" height="56" />
  <text class="label" x="512" y="352">Bounded rollout queue</text>
  <text class="sub" x="512" y="371">Capacity is the staleness bound you chose</text>

  <rect class="box" x="498" y="406" width="354" height="48" />
  <text class="sub" x="512" y="436">Throughput paid for in off-policy data — a correctness knob</text>

  <path class="arrow" d="M 580 278 L 580 318" />
  <path class="arrow" d="M 540 326 L 540 148" />
  <path class="arrow" d="M 675 382 L 675 400" />
</svg>
