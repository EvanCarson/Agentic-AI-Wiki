<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="csr-t csr-d">
  <title id="csr-t">Three staleness regimes and what each costs</title>
  <desc id="csr-d">Synchronous rollout keeps data on-policy but leaves GPUs idle behind the slowest tool call. A bounded async queue trades a known amount of off-policy data for throughput. Interruptible rollout with in-flight weight updates gives the lowest staleness at the highest implementation coupling.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .55; }
  </style>

  <text class="cap" x="30" y="30">PAYS IN IDLE GPUS</text>
  <text class="cap" x="330" y="30">PAYS IN BOUNDED STALENESS</text>
  <text class="cap" x="630" y="30">PAYS IN COUPLING</text>

  <rect class="box" x="30" y="46" width="250" height="152" />
  <text class="head" x="46" y="76">Synchronous</text>
  <text class="sub" x="46" y="100">Strictly on-policy</text>
  <text class="sub" x="46" y="120">Step time = slowest tool</text>
  <text class="sub" x="46" y="140">No off-policy correction</text>
  <text class="sub" x="46" y="160">Right for fast verifiers</text>
  <text class="sub" x="46" y="182">Wrong for a real repo</text>

  <rect class="adj" x="330" y="46" width="250" height="152" />
  <text class="head" x="346" y="76">Bounded async queue</text>
  <text class="sub" x="346" y="100">Staleness = queue capacity</text>
  <text class="sub" x="346" y="120">One number to tune and report</text>
  <text class="sub" x="346" y="140">Needs an off-policy loss</text>
  <text class="sub" x="346" y="160">The default worth starting from</text>
  <text class="sub" x="346" y="182">Degrades quietly if unset</text>

  <rect class="hero" x="630" y="46" width="250" height="152" />
  <text class="head-inv" x="646" y="76">Interruptible rollout</text>
  <text class="sub-inv" x="646" y="100">Pause, load weights, resume</text>
  <text class="sub-inv" x="646" y="120">Lowest achievable staleness</text>
  <text class="sub-inv" x="646" y="140">Partial trajectories to handle</text>
  <text class="sub-inv" x="646" y="160">Tightest generator coupling</text>
  <text class="sub-inv" x="646" y="182">Hardest to debug at 3am</text>

  <rect class="box" x="30" y="226" width="850" height="48" />
  <text class="head" x="46" y="256">Report the staleness bound next to the speedup, or the speedup is unreadable.</text>
</svg>
