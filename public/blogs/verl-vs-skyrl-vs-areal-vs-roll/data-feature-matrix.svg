<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="dfm-t dfm-d">
  <title id="dfm-t">Where each library leans hardest</title>
  <desc id="dfm-d">A matrix of four agentic RL libraries against four axes: asynchronous rollout, the environment as a separately scheduled participant, staleness exposed as an explicit control, and reuse of an existing agent harness. AReaL and ROLL lean hardest on asynchrony and staleness control, SkyRL on harness reuse, and verl on breadth of training backends.</desc>
  <style>
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .title  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .colh   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .rowh   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .legend { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="title" x="30" y="32">Four libraries, four axes that actually differ</text>

  <text class="colh" x="180" y="64">ASYNC ROLLOUT</text>
  <text class="colh" x="360" y="64">SCHEDULED ENV</text>
  <text class="colh" x="540" y="64">STALENESS KNOB</text>
  <text class="colh" x="720" y="64">HARNESS REUSE</text>

  <text class="rowh" x="30" y="102">verl</text>
  <rect class="med"    x="175" y="82" width="165" height="34" />
  <text class="cell"     x="187" y="103">Medium — opt-in mode</text>
  <rect class="weak"   x="355" y="82" width="165" height="34" />
  <text class="cell"     x="367" y="103">Weak — tool callback</text>
  <rect class="med"    x="535" y="82" width="165" height="34" />
  <text class="cell"     x="547" y="103">Medium — queue depth</text>
  <rect class="med"    x="715" y="82" width="165" height="34" />
  <text class="cell"     x="727" y="103">Medium — via forks</text>

  <text class="rowh" x="30" y="162">AReaL</text>
  <rect class="strong" x="175" y="142" width="165" height="34" />
  <text class="cell-inv" x="187" y="163">Strong — async-first</text>
  <rect class="strong" x="355" y="142" width="165" height="34" />
  <text class="cell-inv" x="367" y="163">Strong</text>
  <rect class="strong" x="535" y="142" width="165" height="34" />
  <text class="cell-inv" x="547" y="163">Strong — controller</text>
  <rect class="weak"   x="715" y="142" width="165" height="34" />
  <text class="cell"     x="727" y="163">Weak</text>

  <text class="rowh" x="30" y="222">ROLL</text>
  <rect class="strong" x="175" y="202" width="165" height="34" />
  <text class="cell-inv" x="187" y="223">Strong — ROLL Flash</text>
  <rect class="strong" x="355" y="202" width="165" height="34" />
  <text class="cell-inv" x="367" y="223">Strong — env-level</text>
  <rect class="strong" x="535" y="202" width="165" height="34" />
  <text class="cell-inv" x="547" y="223">Strong — queue policy</text>
  <rect class="weak"   x="715" y="202" width="165" height="34" />
  <text class="cell"     x="727" y="223">Weak</text>

  <text class="rowh" x="30" y="282">SkyRL</text>
  <rect class="strong" x="175" y="262" width="165" height="34" />
  <text class="cell-inv" x="187" y="283">Strong — overlapped</text>
  <rect class="med"    x="355" y="262" width="165" height="34" />
  <text class="cell"     x="367" y="283">Medium — gym layer</text>
  <rect class="med"    x="535" y="262" width="165" height="34" />
  <text class="cell"     x="547" y="283">Medium — queue depth</text>
  <rect class="strong" x="715" y="262" width="165" height="34" />
  <text class="cell-inv" x="727" y="283">Strong — OpenHands</text>

  <rect class="weak"   x="30"  y="330" width="18" height="18" />
  <text class="legend" x="56"  y="344">Weak</text>
  <rect class="med"    x="130" y="330" width="18" height="18" />
  <text class="legend" x="156" y="344">Medium</text>
  <rect class="strong" x="250" y="330" width="18" height="18" />
  <text class="legend" x="276" y="344">Strong</text>
  <text class="legend" x="380" y="344">All four are Apache-2.0 and all four ship PPO and GRPO.</text>
</svg>
