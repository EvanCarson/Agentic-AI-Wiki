<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="lmt lmd">
  <title id="lmt">Perplexity Computer in fully local mode, and the approved path off the device</title>
  <desc id="lmd">A dashed boundary marks the Mac. Inside it sit the local model, the agent loop, a sandbox for code and tool execution, and the native Mac apps the agent may read with permission: Notes, Messages, Mail and Numbers. One arrow leaves the boundary to the cloud, gated by a user approval rather than by a network control, for tasks needing current information, browser use or connected apps. The diagram shows that inference moved inside the boundary while the egress path remained.</desc>
  <style>
    .lm-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .lm-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .lm-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .lm-edge { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 6 5; rx: 12; ry: 12; }
    .lm-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .lm-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .lm-head { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lm-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .lm-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#lmarr); }
  </style>
  <defs>
    <marker id="lmarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="lm-edge" x="20" y="44" width="590" height="420" />
  <text class="lm-head" x="36" y="32">The Mac</text>

  <rect class="lm-hero" x="60" y="80" width="220" height="64" />
  <text class="lm-inv" x="170" y="106" text-anchor="middle">local model</text>
  <text class="lm-inv" x="170" y="126" text-anchor="middle">inference on device</text>

  <rect class="lm-adj" x="340" y="80" width="220" height="64" />
  <text class="lm-lbl" x="450" y="106" text-anchor="middle">agent loop</text>
  <text class="lm-lbl" x="450" y="126" text-anchor="middle">planning on device</text>

  <path class="lm-arr" d="M 285 112 L 335 112" />

  <rect class="lm-box" x="340" y="190" width="220" height="64" />
  <text class="lm-lbl" x="450" y="216" text-anchor="middle">sandbox</text>
  <text class="lm-lbl" x="450" y="236" text-anchor="middle">code and tool runs</text>
  <path class="lm-arr" d="M 450 149 L 450 185" />

  <rect class="lm-box" x="60" y="190" width="220" height="64" />
  <text class="lm-lbl" x="170" y="216" text-anchor="middle">local files</text>
  <text class="lm-lbl" x="170" y="236" text-anchor="middle">read with permission</text>

  <rect class="lm-box" x="60" y="300" width="500" height="64" />
  <text class="lm-lbl" x="310" y="326" text-anchor="middle">native Mac apps, granted individually</text>
  <text class="lm-lbl" x="310" y="346" text-anchor="middle">Notes · Messages · Mail · Numbers</text>
  <path class="lm-arr" d="M 310 295 L 310 259" />

  <text class="lm-sub" x="310" y="404" text-anchor="middle">No request leaves this boundary for inference, and no Computer credit is charged.</text>
  <text class="lm-sub" x="310" y="426" text-anchor="middle">Perplexity recommends 36 GB or more of unified memory for this mode.</text>
  <text class="lm-sub" x="310" y="448" text-anchor="middle">There is no network log on this boundary that a security team reads.</text>

  <rect class="lm-adj" x="680" y="190" width="190" height="64" />
  <text class="lm-lbl" x="775" y="216" text-anchor="middle">the cloud</text>
  <text class="lm-lbl" x="775" y="236" text-anchor="middle">Hybrid Compute</text>

  <path class="lm-arr" d="M 565 222 L 675 222" />
  <text class="lm-sub" x="775" y="132" text-anchor="middle">gated by a user approval,</text>
  <text class="lm-sub" x="775" y="152" text-anchor="middle">not by a network control</text>
  <text class="lm-sub" x="775" y="300" text-anchor="middle">needed for current info,</text>
  <text class="lm-sub" x="775" y="320" text-anchor="middle">browser use, connected apps</text>
  <text class="lm-sub" x="775" y="356" text-anchor="middle">the same app holds both</text>
  <text class="lm-sub" x="775" y="376" text-anchor="middle">paths at the same time</text>
</svg>
