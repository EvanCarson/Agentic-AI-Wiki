<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="tft tfd">
  <title id="tft">The three conditions for exfiltration, assembled on one laptop</title>
  <desc id="tfd">Three columns naming the three conditions that together allow data to be exfiltrated by a prompt-injected agent. Untrusted input arrives from Mail and Messages, which the agent may read with permission. Private data is the local files, Notes and Numbers on the same machine. An egress path remains in the same app through the approved cloud route and browser use. Local inference removes none of the three.</desc>
  <style>
    .tf-box  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .tf-src  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .tf-head { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .tf-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .tf-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .tf-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="tf-head" x="160" y="34" text-anchor="middle">Untrusted input</text>
  <rect class="tf-box" x="50" y="50" width="220" height="60" />
  <text class="tf-inv" x="160" y="76" text-anchor="middle">Mail · Messages</text>
  <text class="tf-inv" x="160" y="96" text-anchor="middle">content anyone can send you</text>
  <rect class="tf-src" x="50" y="130" width="220" height="60" />
  <text class="tf-lbl" x="160" y="156" text-anchor="middle">read with permission,</text>
  <text class="tf-lbl" x="160" y="176" text-anchor="middle">per app</text>

  <text class="tf-head" x="450" y="34" text-anchor="middle">Private data</text>
  <rect class="tf-box" x="340" y="50" width="220" height="60" />
  <text class="tf-inv" x="450" y="76" text-anchor="middle">local files · Notes</text>
  <text class="tf-inv" x="450" y="96" text-anchor="middle">Numbers · the whole disk</text>
  <rect class="tf-src" x="340" y="130" width="220" height="60" />
  <text class="tf-lbl" x="450" y="156" text-anchor="middle">on the same machine</text>
  <text class="tf-lbl" x="450" y="176" text-anchor="middle">as the agent</text>

  <text class="tf-head" x="750" y="34" text-anchor="middle">Egress path</text>
  <rect class="tf-box" x="640" y="50" width="220" height="60" />
  <text class="tf-inv" x="750" y="76" text-anchor="middle">approved cloud route</text>
  <text class="tf-inv" x="750" y="96" text-anchor="middle">and browser use</text>
  <rect class="tf-src" x="640" y="130" width="220" height="60" />
  <text class="tf-lbl" x="750" y="156" text-anchor="middle">still in the same app,</text>
  <text class="tf-lbl" x="750" y="176" text-anchor="middle">one approval away</text>

  <text class="tf-sub" x="450" y="232" text-anchor="middle">Running inference on the device removes none of the three. It removes the provider's request log.</text>
  <text class="tf-sub" x="450" y="258" text-anchor="middle">Cutting any one column breaks the chain; the only one a user controls here is the first.</text>
</svg>
