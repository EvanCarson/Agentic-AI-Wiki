<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="int ind">
  <title id="int">Where each agent control lives: provider-served versus on-device inference</title>
  <desc id="ind">Six rows comparing where an agent control lives when inference is served from a provider versus when it runs on the user's Mac. Request logs, a central kill switch, egress control and per-call audit are all server-side and disappear with local inference. Device management and per-app consent gain importance instead, and both are endpoint controls that a security team reaches through the device rather than through the service.</desc>
  <style>
    .in-keep { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .in-gone { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .in-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .in-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .in-cell { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .in-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .in-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>
  <text class="in-ttl" x="20" y="28">What you still hold once inference runs on the user's Mac</text>
  <text class="in-sub" x="300" y="56" text-anchor="middle">served from a provider</text>
  <text class="in-sub" x="620" y="56" text-anchor="middle">running on the device</text>

  <text class="in-row" x="20" y="92">Provider request log</text>
  <rect class="in-keep" x="190" y="74" width="220" height="26" />
  <text class="in-inv" x="300" y="92" text-anchor="middle">yes</text>
  <rect class="in-gone" x="510" y="74" width="220" height="26" />
  <text class="in-cell" x="620" y="92" text-anchor="middle">gone, and that is the point</text>

  <text class="in-row" x="20" y="138">Central kill switch</text>
  <rect class="in-keep" x="190" y="120" width="220" height="26" />
  <text class="in-inv" x="300" y="138" text-anchor="middle">revoke the key</text>
  <rect class="in-gone" x="510" y="120" width="220" height="26" />
  <text class="in-cell" x="620" y="138" text-anchor="middle">gone</text>

  <text class="in-row" x="20" y="184">Egress control</text>
  <rect class="in-keep" x="190" y="166" width="220" height="26" />
  <text class="in-inv" x="300" y="184" text-anchor="middle">network policy</text>
  <rect class="in-gone" x="510" y="166" width="220" height="26" />
  <text class="in-cell" x="620" y="184" text-anchor="middle">the laptop's own network</text>

  <text class="in-row" x="20" y="230">Per-call audit trail</text>
  <rect class="in-keep" x="190" y="212" width="220" height="26" />
  <text class="in-inv" x="300" y="230" text-anchor="middle">centrally collected</text>
  <rect class="in-gone" x="510" y="212" width="220" height="26" />
  <text class="in-cell" x="620" y="230" text-anchor="middle">on the endpoint, if at all</text>

  <text class="in-row" x="20" y="276">Device management</text>
  <rect class="in-gone" x="190" y="258" width="220" height="26" />
  <text class="in-cell" x="300" y="276" text-anchor="middle">irrelevant</text>
  <rect class="in-keep" x="510" y="258" width="220" height="26" />
  <text class="in-inv" x="620" y="276" text-anchor="middle">now your main lever</text>

  <text class="in-row" x="20" y="322">Per-app consent</text>
  <rect class="in-gone" x="190" y="304" width="220" height="26" />
  <text class="in-cell" x="300" y="322" text-anchor="middle">not applicable</text>
  <rect class="in-keep" x="510" y="304" width="220" height="26" />
  <text class="in-inv" x="620" y="322" text-anchor="middle">the user's decision</text>

  <text class="in-sub" x="20" y="372">Accent marks where the control exists. Four of the six move from a place a security team reads to a place it does not.</text>
</svg>
