<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="gct gcd">
  <title id="gct">What a human diff review catches versus what this merge gate catches</title>
  <desc id="gcd">Five rows comparing two review mechanisms. A human reading the diff is strong on idiomatic and maintainable code and weak on wire-shape and real-behaviour conformance. The automated merge gate is the reverse: strong on conformance to the spec and to recorded real behaviour, weak on maintainability. On the final row, behaviour that no fidelity test covers, both mechanisms are weak — neither catches it.</desc>
  <style>
    .gc-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .gc-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .gc-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .gc-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .gc-col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .gc-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .gc-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .gc-cellin { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .gc-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="gc-ttl" x="20" y="30">What each mechanism actually catches</text>

  <text class="gc-col" x="505" y="66" text-anchor="middle">HUMAN READS THE DIFF</text>
  <text class="gc-col" x="755" y="66" text-anchor="middle">THIS MERGE GATE</text>

  <text class="gc-row" x="20" y="100">Wire shape matches the spec</text>
  <rect class="gc-weak"   x="400" y="80" width="210" height="32" />
  <text class="gc-cell"   x="505" y="101" text-anchor="middle">Weak</text>
  <rect class="gc-strong" x="650" y="80" width="210" height="32" />
  <text class="gc-cellin" x="755" y="101" text-anchor="middle">Strong</text>

  <text class="gc-row" x="20" y="148">Behaviour matches recorded real AWS</text>
  <rect class="gc-weak"   x="400" y="128" width="210" height="32" />
  <text class="gc-cell"   x="505" y="149" text-anchor="middle">Weak</text>
  <rect class="gc-strong" x="650" y="128" width="210" height="32" />
  <text class="gc-cellin" x="755" y="149" text-anchor="middle">Strong</text>

  <text class="gc-row" x="20" y="196">Idiomatic, maintainable code</text>
  <rect class="gc-strong" x="400" y="176" width="210" height="32" />
  <text class="gc-cellin" x="505" y="197" text-anchor="middle">Strong</text>
  <rect class="gc-weak"   x="650" y="176" width="210" height="32" />
  <text class="gc-cell"   x="755" y="197" text-anchor="middle">Weak</text>

  <text class="gc-row" x="20" y="244">Security properties of the emulator</text>
  <rect class="gc-med"    x="400" y="224" width="210" height="32" />
  <text class="gc-cell"   x="505" y="245" text-anchor="middle">Medium</text>
  <rect class="gc-med"    x="650" y="224" width="210" height="32" />
  <text class="gc-cell"   x="755" y="245" text-anchor="middle">Adversarial pass</text>

  <text class="gc-row" x="20" y="292">Behaviour no fidelity test covers</text>
  <rect class="gc-weak"   x="400" y="272" width="210" height="32" />
  <text class="gc-cell"   x="505" y="293" text-anchor="middle">Weak</text>
  <rect class="gc-weak"   x="650" y="272" width="210" height="32" />
  <text class="gc-cell"   x="755" y="293" text-anchor="middle">Not verified</text>

  <rect class="gc-strong" x="20"  y="348" width="16" height="14" />
  <text class="gc-leg" x="44"  y="360" text-anchor="start">Strong</text>
  <rect class="gc-med"    x="120" y="348" width="16" height="14" />
  <text class="gc-leg" x="144" y="360" text-anchor="start">Partial</text>
  <rect class="gc-weak"   x="225" y="348" width="16" height="14" />
  <text class="gc-leg" x="249" y="360" text-anchor="start">Weak or out of scope</text>
</svg>
