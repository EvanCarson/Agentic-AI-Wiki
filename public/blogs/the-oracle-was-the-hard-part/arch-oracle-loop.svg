<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="orlt orld">
  <title id="orlt">Where correctness lives in the AWS Emulator build</title>
  <desc id="orld">A pipeline in two rows. On the top row a public Smithy model feeds an agent that writes the service crate, which feeds a merge gate staffed by reviewer and security agents. On the bottom row real AWS, exercised in two sandboxed accounts, produces a fidelity test that asserts resulting state and error codes, and an arrow carries that test up into the merge gate as the thing that decides. Correctness is asserted by a test that read real AWS first, rather than by a human reading the diff.</desc>
  <style>
    .or-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .or-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .or-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .or-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .or-lane { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .6; }
    .or-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .or-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .or-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .or-invs { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .or-arr  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .or-note { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
    .or-line { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#orarr); }
  </style>
  <defs>
    <marker id="orarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="or-ttl" x="20" y="32">Where correctness lives</text>

  <text class="or-lane" x="20" y="108">BUILD</text>
  <rect class="or-box" x="150" y="72" width="190" height="64" />
  <text class="or-lbl" x="245" y="98" text-anchor="middle">Public Smithy model</text>
  <text class="or-sub" x="245" y="118" text-anchor="middle">one per service</text>
  <path class="or-line" d="M 344 104 L 406 104" />
  <rect class="or-hero" x="410" y="72" width="190" height="64" />
  <text class="or-inv" x="505" y="98" text-anchor="middle">Agent writes</text>
  <text class="or-invs" x="505" y="118" text-anchor="middle">the service crate</text>
  <path class="or-line" d="M 604 104 L 666 104" />
  <rect class="or-adj" x="670" y="72" width="190" height="64" />
  <text class="or-lbl" x="765" y="98" text-anchor="middle">Merge gate</text>
  <text class="or-sub" x="765" y="118" text-anchor="middle">reviewer + security agents</text>

  <text class="or-lane" x="20" y="288">ORACLE</text>
  <rect class="or-box" x="150" y="252" width="190" height="64" />
  <text class="or-lbl" x="245" y="278" text-anchor="middle">Real AWS</text>
  <text class="or-sub" x="245" y="298" text-anchor="middle">two sandboxed accounts</text>
  <path class="or-line" d="M 344 284 L 406 284" />
  <rect class="or-adj" x="410" y="252" width="190" height="64" />
  <text class="or-lbl" x="505" y="278" text-anchor="middle">Fidelity test</text>
  <text class="or-sub" x="505" y="298" text-anchor="middle">asserts state and error code</text>

  <path class="or-line" d="M 604 284 L 765 284 L 765 142" />
  <text class="or-arr" x="782" y="218" text-anchor="start">this is what decides</text>

  <text class="or-note" x="20" y="392">No human reads the diff. The test read real AWS first, and the test is the artefact under review.</text>
  <text class="or-note" x="20" y="420">So the published gap list — the behaviours no test covers — is the honest measure of what shipped.</text>
</svg>
