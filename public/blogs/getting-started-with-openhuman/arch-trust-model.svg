<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">OpenHuman trust model: local data vs managed services</title>
  <desc id="d">OpenHuman splits data storage into two zones: your machine holds the Memory Tree, Obsidian vault, SQLite store, and workspace config encrypted locally, while the managed backend handles account sign-in, model routing, web-search, and OAuth brokering.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <style>
    .box       { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .hero      { fill: var(--accent, #d4421e); stroke: none; }
    .adj       { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--ink, #1a1a1a); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--paper, #fff); }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .80; }
    .arrow     { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .col-bg    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; }
    .col-hdr   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: var(--muted, #888); letter-spacing: .06em; }
  </style>

  <!-- Left column background: On your machine -->
  <rect class="col-bg" x="30" y="30" width="390" height="380" rx="10" ry="10" />
  <text class="col-hdr" x="225" y="56" text-anchor="middle">ON YOUR MACHINE</text>

  <!-- Right column background: Managed by default -->
  <rect class="col-bg" x="480" y="30" width="390" height="380" rx="10" ry="10" />
  <text class="col-hdr" x="675" y="56" text-anchor="middle">MANAGED BY DEFAULT</text>

  <!-- Left column boxes -->
  <!-- Memory Tree (hero/accent) -->
  <rect class="hero" x="60" y="72" width="330" height="62" rx="8" ry="8" />
  <text class="label-inv" x="225" y="99" text-anchor="middle">Memory Tree</text>
  <text class="sub-inv" x="225" y="119" text-anchor="middle">Markdown chunks in local SQLite</text>

  <!-- Obsidian vault (adj) -->
  <rect class="adj" x="60" y="150" width="330" height="62" rx="8" ry="8" />
  <text class="label" x="225" y="177" text-anchor="middle">Obsidian vault</text>
  <text class="sub" x="225" y="197" text-anchor="middle">.md files you can read and edit</text>

  <!-- SQLite store (box) -->
  <rect class="box" x="60" y="228" width="330" height="62" rx="8" ry="8" />
  <text class="label" x="225" y="255" text-anchor="middle">SQLite store</text>
  <text class="sub" x="225" y="275" text-anchor="middle">raw events and fetched records</text>

  <!-- workspace config (box) -->
  <rect class="box" x="60" y="306" width="330" height="62" rx="8" ry="8" />
  <text class="label" x="225" y="333" text-anchor="middle">workspace config</text>
  <text class="sub" x="225" y="353" text-anchor="middle">models, connector preferences</text>

  <!-- Encrypted annotation -->
  <text class="sub" x="225" y="388" text-anchor="middle">encrypted locally · stays on device</text>

  <!-- Right column boxes -->
  <!-- Account sign-in -->
  <rect class="box" x="510" y="72" width="330" height="62" rx="8" ry="8" />
  <text class="label" x="675" y="99" text-anchor="middle">Account sign-in</text>
  <text class="sub" x="675" y="119" text-anchor="middle">identity and license verification</text>

  <!-- Model routing -->
  <rect class="box" x="510" y="150" width="330" height="62" rx="8" ry="8" />
  <text class="label" x="675" y="177" text-anchor="middle">Model routing</text>
  <text class="sub" x="675" y="197" text-anchor="middle">auto-selects best model per task</text>

  <!-- Web-search proxy -->
  <rect class="box" x="510" y="228" width="330" height="62" rx="8" ry="8" />
  <text class="label" x="675" y="255" text-anchor="middle">Web-search proxy</text>
  <text class="sub" x="675" y="275" text-anchor="middle">anonymized queries, no raw URL logs</text>

  <!-- Composio OAuth broker -->
  <rect class="box" x="510" y="306" width="330" height="62" rx="8" ry="8" />
  <text class="label" x="675" y="333" text-anchor="middle">Composio OAuth broker</text>
  <text class="sub" x="675" y="353" text-anchor="middle">token exchange for 118+ connectors</text>

  <!-- Footer note -->
  <rect class="box" x="30" y="430" width="840" height="52" rx="8" ry="8" />
  <text class="label" x="450" y="454" text-anchor="middle">Custom/local mode: bring your own model (Ollama), search, or Composio key</text>
  <text class="sub" x="450" y="473" text-anchor="middle">— some real-time triggers still use the managed backend</text>
</svg>
