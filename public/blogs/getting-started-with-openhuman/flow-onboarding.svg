<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">OpenHuman first-run onboarding flow</title>
  <desc id="d">Four sequential stages take a new user from installing the app to asking their first contextual question, with automatic model routing delivering a rich answer on the first prompt.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <style>
    .box       { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .hero      { fill: var(--accent, #d4421e); stroke: none; }
    .adj       { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--ink, #1a1a1a); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--paper, #fff); }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .80; }
    .num       { font-family: 'Inter', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: var(--muted, #888); }
    .num-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: var(--paper, #fff); opacity: .70; }
    .arrow     { fill: none; stroke: currentColor; stroke-width: 1.75; marker-end: url(#arr); opacity: .70; }
  </style>

  <!-- Stage 1: Install & launch -->
  <rect class="box" x="30" y="100" width="180" height="200" rx="10" ry="10" />
  <text class="num" x="120" y="165" text-anchor="middle">1</text>
  <text class="label" x="120" y="197" text-anchor="middle">Install &amp; launch</text>
  <text class="sub" x="120" y="220" text-anchor="middle">download the</text>
  <text class="sub" x="120" y="237" text-anchor="middle">Tauri desktop app</text>

  <!-- Arrow 1→2 -->
  <path class="arrow" d="M 210 200 L 248 200" />

  <!-- Stage 2: Sign in -->
  <rect class="adj" x="255" y="100" width="180" height="200" rx="10" ry="10" />
  <text class="num" x="345" y="165" text-anchor="middle">2</text>
  <text class="label" x="345" y="197" text-anchor="middle">Sign in</text>
  <text class="sub" x="345" y="220" text-anchor="middle">'Let's Cook'</text>
  <text class="sub" x="345" y="237" text-anchor="middle">Advanced → custom RPC</text>

  <!-- Arrow 2→3 -->
  <path class="arrow" d="M 435 200 L 473 200" />

  <!-- Stage 3: Connect a service -->
  <rect class="adj" x="480" y="100" width="180" height="200" rx="10" ry="10" />
  <text class="num" x="570" y="165" text-anchor="middle">3</text>
  <text class="label" x="570" y="197" text-anchor="middle">Connect a service</text>
  <text class="sub" x="570" y="220" text-anchor="middle">one-click OAuth</text>
  <text class="sub" x="570" y="237" text-anchor="middle">in browser</text>

  <!-- Arrow 3→4 -->
  <path class="arrow" d="M 660 200 L 698 200" />

  <!-- Stage 4: Ask your first question (hero/payoff) -->
  <rect class="hero" x="705" y="80" width="175" height="240" rx="10" ry="10" />
  <text class="num-inv" x="793" y="150" text-anchor="middle">4</text>
  <text class="label-inv" x="793" y="182" text-anchor="middle">Ask your first</text>
  <text class="label-inv" x="793" y="201" text-anchor="middle">question</text>
  <text class="sub-inv" x="793" y="228" text-anchor="middle">'What do I need</text>
  <text class="sub-inv" x="793" y="245" text-anchor="middle">to know from the</text>
  <text class="sub-inv" x="793" y="262" text-anchor="middle">last 12 hours?'</text>
  <text class="sub-inv" x="793" y="284" text-anchor="middle">auto model routing</text>

  <!-- Stage number labels at bottom -->
  <text class="sub" x="120" y="330" text-anchor="middle">Stage 1</text>
  <text class="sub" x="345" y="330" text-anchor="middle">Stage 2</text>
  <text class="sub" x="570" y="330" text-anchor="middle">Stage 3</text>
  <text class="sub-inv" x="793" y="345" text-anchor="middle" style="fill:var(--ink,#1a1a1a);opacity:.65;">Stage 4</text>
</svg>
