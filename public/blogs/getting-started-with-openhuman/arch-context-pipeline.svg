<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">How OpenHuman builds context</title>
  <desc id="d">Raw data from 118+ connectors flows through auto-fetch and TokenJuice compression into the Memory Tree, which syncs to an Obsidian vault and is injected as agent context before each prompt.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <style>
    .box       { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .hero      { fill: var(--accent, #d4421e); stroke: none; }
    .adj       { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--ink, #1a1a1a); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--paper, #fff); }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .80; }
    .arrow     { fill: none; stroke: currentColor; stroke-width: 1.75; marker-end: url(#arr); opacity: .70; }
    .pipe-hdr  { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--muted, #888); letter-spacing: .05em; }
  </style>

  <!-- Pipeline header -->
  <text class="pipe-hdr" x="450" y="28" text-anchor="middle">CONTEXT PIPELINE</text>

  <!-- Stage 1: 118+ connectors -->
  <rect class="box" x="18" y="120" width="138" height="120" rx="8" ry="8" />
  <text class="label" x="87" y="162" text-anchor="middle">118+</text>
  <text class="label" x="87" y="181" text-anchor="middle">connectors</text>
  <text class="sub" x="87" y="204" text-anchor="middle">Gmail · GitHub</text>
  <text class="sub" x="87" y="221" text-anchor="middle">Notion · Slack…</text>

  <!-- Arrow 1→2 -->
  <path class="arrow" d="M 156 180 L 192 180" />

  <!-- Stage 2: Auto-fetch -->
  <rect class="adj" x="198" y="120" width="138" height="120" rx="8" ry="8" />
  <text class="label" x="267" y="172" text-anchor="middle">Auto-fetch</text>
  <text class="sub" x="267" y="195" text-anchor="middle">every 20 min</text>
  <text class="sub" x="267" y="212" text-anchor="middle">pulls fresh data</text>

  <!-- Arrow 2→3 -->
  <path class="arrow" d="M 336 180 L 372 180" />

  <!-- Stage 3: TokenJuice compression -->
  <rect class="adj" x="378" y="120" width="144" height="120" rx="8" ry="8" />
  <text class="label" x="450" y="165" text-anchor="middle">TokenJuice</text>
  <text class="label" x="450" y="184" text-anchor="middle">compression</text>
  <text class="sub" x="450" y="207" text-anchor="middle">~80% fewer tokens</text>
  <text class="sub" x="450" y="224" text-anchor="middle">before the model</text>

  <!-- Arrow 3→4 -->
  <path class="arrow" d="M 522 180 L 558 180" />

  <!-- Stage 4: Memory Tree (hero, centerpiece) -->
  <rect class="hero" x="564" y="96" width="150" height="168" rx="10" ry="10" />
  <text class="label-inv" x="639" y="155" text-anchor="middle">Memory Tree</text>
  <text class="sub-inv" x="639" y="178" text-anchor="middle">≤3k-token</text>
  <text class="sub-inv" x="639" y="196" text-anchor="middle">Markdown chunks</text>
  <text class="sub-inv" x="639" y="214" text-anchor="middle">in SQLite</text>
  <text class="sub-inv" x="639" y="238" text-anchor="middle">encrypted locally</text>

  <!-- Arrow 4→5 (Memory Tree → Obsidian vault) -->
  <path class="arrow" d="M 714 180 L 750 180" />

  <!-- Stage 5: Obsidian vault -->
  <rect class="box" x="756" y="120" width="126" height="120" rx="8" ry="8" />
  <text class="label" x="819" y="165" text-anchor="middle">Obsidian</text>
  <text class="label" x="819" y="184" text-anchor="middle">vault</text>
  <text class="sub" x="819" y="207" text-anchor="middle">.md files you</text>
  <text class="sub" x="819" y="224" text-anchor="middle">can edit</text>

  <!-- Downward arrow from Memory Tree to Agent context -->
  <path class="arrow" d="M 639 264 L 639 310" />

  <!-- Stage 6: Agent context (below Memory Tree) -->
  <rect class="adj" x="504" y="316" width="270" height="96" rx="8" ry="8" />
  <text class="label" x="639" y="357" text-anchor="middle">Agent context</text>
  <text class="sub" x="639" y="378" text-anchor="middle">injected before each prompt</text>
  <text class="sub" x="639" y="396" text-anchor="middle">model sees your full self-picture</text>

  <!-- Also draw arrow from Obsidian vault down to Agent context -->
  <path class="arrow" d="M 819 240 Q 819 295 775 330" />
</svg>
