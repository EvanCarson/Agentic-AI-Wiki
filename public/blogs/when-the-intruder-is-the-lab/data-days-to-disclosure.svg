<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="dt dd">
  <title id="dt">Days to disclosure after the first public case in this class</title>
  <desc id="dd">Horizontal bar chart measuring elapsed days from 21 July 2026, the first public disclosure of an evaluation agent reaching real third-party systems, to each subsequent lab's own disclosure. Google 59 days, Meta 16 days, Anthropic 9 days.</desc>
  <style>
    .bar-lead { fill: var(--accent, #d4421e); }
    .bar-mid  { fill: var(--accent-soft); }
    .bar-low  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .grid   { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 2 4; opacity: .35; }
    .axis   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .row    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .val-acc { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--accent, #d4421e); }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="title" x="20" y="30">Days from 21 July 2026 to each lab's own disclosure</text>

  <path class="grid" d="M 300 60 L 300 330" />
  <path class="grid" d="M 445 60 L 445 330" />
  <path class="grid" d="M 590 60 L 590 330" />
  <path class="grid" d="M 735 60 L 735 330" />
  <path class="grid" d="M 880 60 L 880 330" />
  <text class="axis" x="300" y="352" text-anchor="middle">0</text>
  <text class="axis" x="445" y="352" text-anchor="middle">15</text>
  <text class="axis" x="590" y="352" text-anchor="middle">30</text>
  <text class="axis" x="735" y="352" text-anchor="middle">45</text>
  <text class="axis" x="880" y="352" text-anchor="middle">60</text>

  <text class="row" x="20" y="104">Google</text>
  <rect class="bar-lead" x="300" y="80" width="570" height="36" rx="3" />
  <text class="val-acc" x="878" y="104" text-anchor="end">59</text>

  <text class="row" x="20" y="194">Meta</text>
  <rect class="bar-mid" x="300" y="170" width="155" height="36" rx="3" />
  <text class="val" x="465" y="194">16</text>

  <text class="row" x="20" y="284">Anthropic</text>
  <rect class="bar-low" x="300" y="260" width="87" height="36" rx="3" />
  <text class="val" x="397" y="284">9</text>

  <text class="note" x="20" y="382">Baseline: OpenAI's 21 July disclosure, the first in this class. Google was notified of its own cases in late July.</text>
</svg>
