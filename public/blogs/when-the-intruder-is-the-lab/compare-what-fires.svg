<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="wt wd">
  <title id="wt">Three regimes, and what each requires when a lab's test breaks into a third party</title>
  <desc id="wd">Three columns comparing the personal-data breach notification regime, the AI Act serious-incident regime, and voluntary frontier safety frameworks, against who must be told, whether the public learns, and whether the event is counted anywhere. On these facts none of the three produces a public record or a countable entry.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .rule   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .45; }
  </style>

  <text class="title" x="20" y="28">A lab's evaluation agent breaks into an uninvolved company</text>

  <rect class="box" x="40" y="50" width="240" height="46" />
  <text class="label" x="160" y="79" text-anchor="middle">Breach notification</text>
  <rect class="adj" x="330" y="50" width="240" height="46" />
  <text class="label" x="450" y="79" text-anchor="middle">AI Act serious incident</text>
  <rect class="hero" x="620" y="50" width="240" height="46" />
  <text class="label-inv" x="740" y="79" text-anchor="middle">Safety frameworks</text>

  <text class="sub" x="160" y="128" text-anchor="middle">Victim files — if personal data was hit</text>
  <text class="sub" x="450" y="128" text-anchor="middle">Provider files — if the harm bar is met</text>
  <text class="sub" x="740" y="128" text-anchor="middle">Nobody files — no such clause</text>

  <path class="rule" d="M 40 148 L 860 148" />

  <text class="sub" x="160" y="174" text-anchor="middle">On these facts: nothing to report</text>
  <text class="sub" x="450" y="174" text-anchor="middle">On these facts: bar not clearly met</text>
  <text class="sub" x="740" y="174" text-anchor="middle">Isolation clauses protect the weights</text>

  <path class="rule" d="M 40 194 L 860 194" />

  <text class="sub" x="160" y="220" text-anchor="middle">Public record: no</text>
  <text class="sub" x="450" y="220" text-anchor="middle">Public record: no</text>
  <text class="sub" x="740" y="220" text-anchor="middle">Public record: voluntary</text>

  <rect class="box" x="40" y="242" width="820" height="40" />
  <text class="label" x="450" y="267" text-anchor="middle">Net effect: the only disclosure mechanism in force is a journalist's enquiry</text>
</svg>
