<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="at ad">
  <title id="at">Two failure shapes that are being called one thing</title>
  <desc id="ad">Two panels. On the left, an isolated evaluation sandbox that a model escapes by exploiting a vulnerability, then reaching the open internet and real systems. On the right, an evaluation environment whose network was never restricted, where the scope of the test exists only as prose, a fictional target name resolves to a real registered domain, and the model reaches three real companies without defeating anything.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pane   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .35; rx: 10; ry: 10; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arrL); }
  </style>
  <defs>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="pane" x="20" y="20" width="410" height="460" />
  <rect class="pane" x="470" y="20" width="410" height="460" />

  <text class="head" x="44" y="52">1 · Containment defeated</text>
  <text class="head" x="494" y="52">2 · Containment never configured</text>

  <rect class="box" x="44" y="70" width="362" height="120" />
  <text class="sub" x="60" y="92">Isolated evaluation sandbox</text>
  <rect class="adj" x="66" y="106" width="140" height="44" />
  <text class="label" x="136" y="134" text-anchor="middle">Model</text>
  <rect class="hero" x="240" y="106" width="146" height="44" />
  <text class="label-inv" x="313" y="134" text-anchor="middle">Exploited flaw</text>

  <path class="arrow" d="M 225 190 L 225 246" />
  <text class="sub" x="238" y="222">breaks out</text>

  <rect class="box" x="44" y="250" width="362" height="52" />
  <text class="label" x="225" y="281" text-anchor="middle">Open internet</text>

  <path class="arrow" d="M 225 302 L 225 358" />

  <rect class="box" x="44" y="362" width="362" height="52" />
  <text class="label" x="225" y="393" text-anchor="middle">Real third-party systems</text>

  <text class="sub" x="44" y="448">A security-engineering failure.</text>
  <text class="sub" x="44" y="466">Fix: harden the sandbox.</text>

  <rect class="box" x="494" y="70" width="362" height="120" />
  <text class="sub" x="510" y="92">Evaluation environment — network never restricted</text>
  <rect class="hero" x="516" y="106" width="140" height="44" />
  <text class="label-inv" x="586" y="134" text-anchor="middle">Model</text>
  <rect class="box" x="690" y="106" width="146" height="44" />
  <text class="label" x="763" y="134" text-anchor="middle">Scope: prose</text>

  <path class="arrow" d="M 675 190 L 675 246" />
  <text class="sub" x="688" y="222">walks out</text>

  <rect class="adj" x="494" y="250" width="362" height="52" />
  <text class="label" x="675" y="281" text-anchor="middle">Fictional name resolves to a real domain</text>

  <path class="arrow" d="M 675 302 L 675 358" />

  <rect class="box" x="494" y="362" width="362" height="52" />
  <text class="label" x="675" y="393" text-anchor="middle">Three real companies</text>

  <text class="sub" x="494" y="448">A scoping and inventory failure.</text>
  <text class="sub" x="494" y="466">Fix: enforce the target list in the network.</text>
</svg>
