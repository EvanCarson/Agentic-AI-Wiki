<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="vmt2 vmd2">
  <title id="vmt2">Verification and scale capabilities across four synthetic data frameworks</title>
  <desc id="vmd2">A matrix with Distilabel, Bespoke Curator, NeMo Data Designer and Augmentoolkit as rows, scored across four columns: executable validators, built-in LLM judge, scale and fault recovery, and turnkey end-to-end pipelines. NeMo Data Designer is strongest on executable validators, Curator on scale, Augmentoolkit on turnkey pipelines, and Distilabel on judges.</desc>
  <style>
    .cell-w { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .cell-m { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .cell-s { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .ct     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .ct-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .rowlab { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .collab { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: var(--ink); opacity: .75; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink); }
    .leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="title" x="20" y="28">Where each framework is strongest</text>

  <text class="collab" x="270" y="66">EXECUTABLE VALIDATORS</text>
  <text class="collab" x="425" y="66">BUILT-IN JUDGE</text>
  <text class="collab" x="580" y="66">SCALE / RECOVERY</text>
  <text class="collab" x="740" y="66">TURNKEY PIPELINES</text>

  <text class="rowlab" x="20" y="100">Distilabel</text>
  <rect class="cell-w" x="265" y="82" width="145" height="26" />
  <text class="ct" x="275" y="99">Weak — bring your own</text>
  <rect class="cell-s" x="420" y="82" width="145" height="26" />
  <text class="ct-inv" x="430" y="99">Strong</text>
  <rect class="cell-m" x="575" y="82" width="145" height="26" />
  <text class="ct" x="585" y="99">Medium</text>
  <rect class="cell-m" x="730" y="82" width="150" height="26" />
  <text class="ct" x="740" y="99">Medium — recipes</text>

  <text class="rowlab" x="20" y="148">Bespoke Curator</text>
  <rect class="cell-w" x="265" y="130" width="145" height="26" />
  <text class="ct" x="275" y="147">Weak — parse() is yours</text>
  <rect class="cell-w" x="420" y="130" width="145" height="26" />
  <text class="ct" x="430" y="147">Weak</text>
  <rect class="cell-s" x="575" y="130" width="145" height="26" />
  <text class="ct-inv" x="585" y="147">Strong</text>
  <rect class="cell-w" x="730" y="130" width="150" height="26" />
  <text class="ct" x="740" y="147">Weak — examples only</text>

  <text class="rowlab" x="20" y="196">NeMo Data Designer</text>
  <rect class="cell-s" x="265" y="178" width="145" height="26" />
  <text class="ct-inv" x="275" y="195">Strong — Python, SQL</text>
  <rect class="cell-s" x="420" y="178" width="145" height="26" />
  <text class="ct-inv" x="430" y="195">Strong</text>
  <rect class="cell-m" x="575" y="178" width="145" height="26" />
  <text class="ct" x="585" y="195">Medium — via Curator</text>
  <rect class="cell-m" x="730" y="178" width="150" height="26" />
  <text class="ct" x="740" y="195">Medium</text>

  <text class="rowlab" x="20" y="244">Augmentoolkit</text>
  <rect class="cell-m" x="265" y="226" width="145" height="26" />
  <text class="ct" x="275" y="243">Medium — per pipeline</text>
  <rect class="cell-m" x="420" y="226" width="145" height="26" />
  <text class="ct" x="430" y="243">Medium</text>
  <rect class="cell-w" x="575" y="226" width="145" height="26" />
  <text class="ct" x="585" y="243">Weak</text>
  <rect class="cell-s" x="730" y="226" width="150" height="26" />
  <text class="ct-inv" x="740" y="243">Strong</text>

  <rect class="cell-s" x="20" y="300" width="16" height="16" />
  <text class="leg" x="44" y="312">Strong</text>
  <rect class="cell-m" x="110" y="300" width="16" height="16" />
  <text class="leg" x="134" y="312">Medium</text>
  <rect class="cell-w" x="205" y="300" width="16" height="16" />
  <text class="leg" x="229" y="312">Weak / absent</text>

  <text class="leg" x="20" y="352">Read column one first. It is the only column whose weakness cannot be fixed by writing more of your own code —</text>
  <text class="leg" x="20" y="372">because if the framework cannot run a validator, your validator has to run outside the pipeline, and then the</text>
  <text class="leg" x="20" y="392">rejection-sampling loop stops being a loop.</text>
</svg>
