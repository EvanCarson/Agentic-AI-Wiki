<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="vst vsd">
  <title id="vst">The five stages of a synthetic data pipeline, with the verifier highlighted</title>
  <desc id="vsd">A left-to-right pipeline: seed or schema, generation, verification, selection, and export to training. The generation stage is where all four tools compete and is labelled commodity; the verification stage is highlighted as the stage that decides whether the dataset is worth anything, and is the stage the tools differ on. A feedback arrow runs from verification back to generation.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .68; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .hd    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ink); opacity: .75; letter-spacing: .05em; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#vsarr); }
    .back  { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 5 4; marker-end: url(#vsarr); opacity: .6; }
  </style>
  <defs>
    <marker id="vsarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="hd" x="20" y="30">ONE PIPELINE, FIVE STAGES</text>

  <rect class="box" x="20" y="120" width="150" height="110" />
  <text class="label" x="34" y="148">1 · Seed</text>
  <text class="sub" x="34" y="172">documents, a schema,</text>
  <text class="sub" x="34" y="188">a sampler, or nothing</text>
  <text class="sub" x="34" y="212">yours to supply</text>

  <rect class="adj" x="195" y="120" width="170" height="110" />
  <text class="label" x="209" y="148">2 · Generation</text>
  <text class="sub" x="209" y="172">prompt, call, retry,</text>
  <text class="sub" x="209" y="188">cache, batch, parse</text>
  <text class="sub" x="209" y="212">all four do this well</text>

  <rect class="hero" x="390" y="100" width="190" height="150" />
  <text class="label-inv" x="404" y="128">3 · Verification</text>
  <text class="sub-inv" x="404" y="154">does this row hold up</text>
  <text class="sub-inv" x="404" y="170">against something</text>
  <text class="sub-inv" x="404" y="186">outside the generator?</text>
  <text class="sub-inv" x="404" y="214">execute · assert · judge</text>
  <text class="sub-inv" x="404" y="236">the whole decision</text>

  <rect class="box" x="605" y="120" width="140" height="110" />
  <text class="label" x="619" y="148">4 · Selection</text>
  <text class="sub" x="619" y="172">filter, rank, dedupe,</text>
  <text class="sub" x="619" y="188">pair for preference</text>
  <text class="sub" x="619" y="212">as good as stage 3</text>

  <rect class="box" x="770" y="120" width="110" height="110" />
  <text class="label" x="784" y="148">5 · Train</text>
  <text class="sub" x="784" y="172">SFT, DPO,</text>
  <text class="sub" x="784" y="188">RL rollouts</text>

  <path class="arrow" d="M 174 175 L 191 175" />
  <path class="arrow" d="M 369 175 L 386 175" />
  <path class="arrow" d="M 584 175 L 601 175" />
  <path class="arrow" d="M 749 175 L 766 175" />
  <path class="back" d="M 485 254 C 485 300 280 300 280 234" />
  <text class="sub" x="330" y="318">rejection sampling: regenerate what failed</text>

  <rect class="box" x="20" y="366" width="860" height="104" />
  <text class="label" x="36" y="394">Stage 2 is a commodity. Stage 3 is the product.</text>
  <text class="sub" x="36" y="418">A tool that only orchestrates generation hands you stage 3 as an exercise — which is fine if you already have a</text>
  <text class="sub" x="36" y="436">checker, and fatal if your plan was to let an LLM judge decide. For tool-calling and multi-step agent data, the only</text>
  <text class="sub" x="36" y="454">verification that discriminates is one that runs the call and compares the effect.</text>
</svg>
