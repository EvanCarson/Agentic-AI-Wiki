<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="gtt gtd">
  <title id="gtt">Three sources of ground truth in a synthetic data pipeline</title>
  <desc id="gtd">Three columns comparing a same-family LLM judge, a cross-family judge or human sample, and an executable verifier. The first measures style agreement and adds no information, the second is a weak independent signal, and the third is the only one that survives contact with agentic data.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ink); opacity: .75; letter-spacing: .05em; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .68; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .84; }
  </style>

  <text class="hd" x="40" y="30">NO INFORMATION</text>
  <text class="hd" x="330" y="30">WEAK SIGNAL</text>
  <text class="hd" x="620" y="30">DECIDES</text>

  <rect class="box" x="40" y="46" width="240" height="186" />
  <text class="label" x="56" y="74">Same-family judge</text>
  <text class="sub" x="56" y="98">The generator's sibling</text>
  <text class="sub" x="56" y="116">scores the generator's</text>
  <text class="sub" x="56" y="134">output on a rubric.</text>
  <text class="sub" x="56" y="162">Measures: agreement</text>
  <text class="sub" x="56" y="180">with its own priors.</text>
  <text class="sub" x="56" y="208">Filters 50% of rows and</text>
  <text class="sub" x="56" y="226">raises the metric, not</text>

  <rect class="adj" x="330" y="46" width="240" height="186" />
  <text class="label" x="346" y="74">Cross-family or human</text>
  <text class="sub" x="346" y="98">A different model family,</text>
  <text class="sub" x="346" y="116">or a small human-labelled</text>
  <text class="sub" x="346" y="134">calibration sample.</text>
  <text class="sub" x="346" y="162">Measures: something,</text>
  <text class="sub" x="346" y="180">imperfectly, with known</text>
  <text class="sub" x="346" y="198">disagreement rate.</text>
  <text class="sub" x="346" y="226">Cost scales with rows.</text>

  <rect class="hero" x="620" y="46" width="240" height="186" />
  <text class="label-inv" x="636" y="74">Executable verifier</text>
  <text class="sub-inv" x="636" y="98">Run the code. Run the</text>
  <text class="sub-inv" x="636" y="116">query. Make the tool call</text>
  <text class="sub-inv" x="636" y="134">and compare the effect.</text>
  <text class="sub-inv" x="636" y="162">Measures: whether the</text>
  <text class="sub-inv" x="636" y="180">row is true.</text>
  <text class="sub-inv" x="636" y="208">The only kind that works</text>
  <text class="sub-inv" x="636" y="226">for agent trajectories.</text>

  <text class="sub" x="40" y="264">the quality.</text>
  <text class="sub" x="330" y="264">Use it to calibrate the</text>
  <text class="sub" x="330" y="282">verifier, not to replace it.</text>
  <text class="sub" x="620" y="264">Needs an environment, which</text>
  <text class="sub" x="620" y="282">is the real cost of the field.</text>
</svg>
