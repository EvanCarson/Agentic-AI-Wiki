<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three places to put the control on a third-party skill</title>
  <desc id="d">Three columns comparing where a control on an installed skill can sit. An install-time scan is cheap and produces an inventory, but it reads a different artefact than the agent runs and expires the moment the skill updates. A content pin plus a review of what the skill may reach fixes the time-of-check problem and costs one hash and one manifest. Run-time capability and egress limits are the only control that binds what the payload can do rather than what the file appears to say, and cost a real boundary in the runtime.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
  </style>

  <rect class="box" x="24" y="36" width="266" height="212" />
  <text class="head" x="44" y="66">Scan at install</text>
  <text class="sub" x="44" y="100">reads the file as published</text>
  <text class="sub" x="44" y="124">verdict expires on first update</text>
  <text class="sub" x="44" y="148">can itself be talked to</text>
  <line x1="44" y1="172" x2="270" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="44" y="196">WORTH KEEPING AS</text>
  <text class="label" x="44" y="220">an inventory, not a gate</text>

  <rect class="adj" x="314" y="36" width="266" height="212" />
  <text class="head" x="334" y="66">Pin and re-review</text>
  <text class="sub" x="334" y="100">install by content hash</text>
  <text class="sub" x="334" y="124">updates re-enter review</text>
  <text class="sub" x="334" y="148">closes check-versus-use drift</text>
  <line x1="334" y1="172" x2="560" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="334" y="196">COSTS</text>
  <text class="label" x="334" y="220">one hash, one lockfile</text>

  <rect class="hero" x="604" y="36" width="266" height="212" />
  <text class="head-inv" x="624" y="66">Constrain at run time</text>
  <text class="sub-inv" x="624" y="100">binds what the payload can do</text>
  <text class="sub-inv" x="624" y="124">no filesystem, no egress by default</text>
  <text class="sub-inv" x="624" y="148">indifferent to how it was packed</text>
  <line x1="624" y1="172" x2="850" y2="172" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag" x="624" y="196" fill="var(--paper)" opacity=".85">COSTS</text>
  <text class="label-inv" x="624" y="220">a real boundary in the runtime</text>
</svg>
