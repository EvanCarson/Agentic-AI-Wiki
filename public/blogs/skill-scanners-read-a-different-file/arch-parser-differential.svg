<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">A skill bundle read two different ways</title>
  <desc id="d">One published skill bundle on the left contains a SKILL.md file, a Word document in an assets folder, and a compiled Python bytecode file. The scanner path along the top reads only the first slice of the plain text, cannot open the archive or the bytecode, and returns a clean verdict. The agent path along the bottom renders the whole instruction file, unpacks the archive, imports the bytecode, and fetches a further payload at run time, so the malicious code executes. The two readers disagree about what the same bytes contain, and the attacker chooses where they disagree.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .85; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="adj" x="24" y="176" width="204" height="148" />
  <text class="head" x="44" y="206">The published bundle</text>
  <text class="mono" x="44" y="234">SKILL.md</text>
  <text class="mono" x="44" y="256">assets/brief.docx</text>
  <text class="mono" x="44" y="278">lib/format.pyc</text>
  <text class="sub" x="44" y="304">one artefact, two readers</text>

  <path class="arrow" d="M 232 216 C 280 216 276 130 322 130" />
  <path class="arrow" d="M 232 288 C 280 288 276 380 322 380" />

  <rect class="box" x="326" y="58" width="268" height="150" />
  <text class="head" x="346" y="88">What the scanner reads</text>
  <text class="sub" x="346" y="116">the first slice of plain text</text>
  <text class="sub" x="346" y="138">— truncated by a token budget</text>
  <text class="sub" x="346" y="164">no archive, no bytecode</text>
  <text class="sub" x="346" y="186">one verdict, produced once</text>

  <rect class="box" x="326" y="298" width="268" height="164" />
  <text class="head" x="346" y="328">What the agent reads</text>
  <text class="sub" x="346" y="356">the whole instruction file</text>
  <text class="sub" x="346" y="378">unzips the document it is told to</text>
  <text class="sub" x="346" y="400">imports the compiled module</text>
  <text class="sub" x="346" y="422">fetches whatever step three names</text>
  <text class="sub" x="346" y="446">every session, after every update</text>

  <path class="arrow" d="M 598 130 L 646 130" />
  <path class="arrow" d="M 598 380 L 646 380" />

  <rect class="box" x="650" y="96" width="226" height="68" />
  <text class="head" x="670" y="126">Verdict: clean</text>
  <text class="sub" x="670" y="148">a badge on the listing page</text>

  <rect class="hero" x="650" y="336" width="226" height="88" />
  <text class="head-inv" x="670" y="366">Payload runs</text>
  <text class="label-inv" x="670" y="390">credentials, source, backdoor</text>
  <text class="label-inv" x="670" y="412">semantics fully preserved</text>

  <line x1="326" y1="253" x2="876" y2="253" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 5" opacity=".35" />
  <text class="tag" x="330" y="245">THE GAP THE ATTACKER PICKS</text>
</svg>
