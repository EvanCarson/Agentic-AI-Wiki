<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Scanner bypass rate by evasion technique</title>
  <desc id="d">Horizontal bar chart of measured bypass rates against agent skill scanners. Self-extracting skill packing exceeds ninety per cent against every one of the eight scanners tested. Structural obfuscation reaches ninety-six per cent against the single hybrid scanner and exceeds eighty per cent against most purely static scanners. A separate hand-built study, noted below the chart, bypassed the detectors on all three marketplace platforms it tested, with four distinct bypasses.</desc>
  <style>
    .bar-hero { fill: var(--accent, #d4421e); }
    .bar-adj  { fill: var(--accent-soft); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .grid   { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 6; opacity: .28; }
    .axis   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .note   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="head" x="24" y="38">Bypass rate against agent skill scanners</text>

  <line class="grid" x1="330" y1="62" x2="330" y2="280" />
  <line class="grid" x1="465" y1="62" x2="465" y2="280" />
  <line class="grid" x1="600" y1="62" x2="600" y2="280" />
  <line class="grid" x1="735" y1="62" x2="735" y2="280" />
  <text class="axis" x="322" y="300">25%</text>
  <text class="axis" x="457" y="300">50%</text>
  <text class="axis" x="592" y="300">75%</text>
  <text class="axis" x="723" y="300">100%</text>

  <text class="label" x="24" y="88">Self-extracting packing</text>
  <text class="sub" x="24" y="106">every one of 8 scanners</text>
  <rect class="bar-hero" x="195" y="72" width="486" height="34" rx="3" />
  <text class="val" x="691" y="95">&gt;90%</text>

  <text class="label" x="24" y="160">Structural obfuscation</text>
  <text class="sub" x="24" y="178">vs. the hybrid scanner</text>
  <rect class="bar-adj" x="195" y="144" width="518" height="34" rx="3" />
  <text class="val" x="723" y="167">96%</text>

  <text class="label" x="24" y="232">Structural obfuscation</text>
  <text class="sub" x="24" y="250">vs. most static scanners</text>
  <rect class="bar-adj" x="195" y="216" width="432" height="34" rx="3" />
  <text class="val" x="637" y="239">&gt;80%</text>

  <line x1="24" y1="326" x2="876" y2="326" stroke="var(--ink)" stroke-width="1" opacity=".22" />
  <text class="note" x="24" y="352">SEPARATELY, BY HAND: EVERY MARKETPLACE DETECTOR TESTED WAS BYPASSED</text>
  <text class="sub" x="24" y="374">four bypasses across three platforms; three of the four took under an hour each to build</text>
</svg>
