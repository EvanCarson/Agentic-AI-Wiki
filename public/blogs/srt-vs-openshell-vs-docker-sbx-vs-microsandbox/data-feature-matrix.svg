<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Four local agent sandboxes across four axes</title>
  <desc id="d">A matrix with Anthropic srt, NVIDIA OpenShell, Docker Sandboxes and microsandbox as rows, and own kernel, default-deny egress, credential kept outside the sandbox, and open-source licence as columns. Every row is strong on egress; the rows differ most on whether the credential is reachable from inside.</desc>
  <style>
    .hi     { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .lo     { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .colhd  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 12px; fill: var(--ink); text-anchor: middle; }
    .rowhd  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .lg     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="ttl" x="20" y="28">Where the four actually differ</text>

  <text class="colhd" x="325" y="56">Own kernel</text>
  <text class="colhd" x="475" y="56">Egress default</text>
  <text class="colhd" x="625" y="56">Credential outside</text>
  <text class="colhd" x="775" y="56">Licence</text>

  <text class="rowhd" x="20" y="96">Anthropic srt</text>
  <rect class="lo"  x="250" y="70" width="148" height="40" />
  <text class="cell" x="324" y="95">No (shared)</text>
  <rect class="hi"  x="402" y="70" width="148" height="40" />
  <text class="cell-inv" x="476" y="95">Default-deny</text>
  <rect class="lo"  x="554" y="70" width="148" height="40" />
  <text class="cell" x="628" y="95">On disk, read-open</text>
  <rect class="hi"  x="706" y="70" width="148" height="40" />
  <text class="cell-inv" x="780" y="95">Apache-2.0</text>

  <text class="rowhd" x="20" y="166">NVIDIA OpenShell</text>
  <rect class="mid" x="250" y="140" width="148" height="40" />
  <text class="cell" x="324" y="165">Container or VM</text>
  <rect class="hi"  x="402" y="140" width="148" height="40" />
  <text class="cell-inv" x="476" y="165">Per-connection</text>
  <rect class="hi"  x="554" y="140" width="148" height="40" />
  <text class="cell-inv" x="628" y="165">Providers inject</text>
  <rect class="hi"  x="706" y="140" width="148" height="40" />
  <text class="cell-inv" x="780" y="165">Apache-2.0</text>

  <text class="rowhd" x="20" y="236">Docker Sandboxes</text>
  <rect class="hi"  x="250" y="210" width="148" height="40" />
  <text class="cell-inv" x="324" y="235">microVM</text>
  <rect class="hi"  x="402" y="210" width="148" height="40" />
  <text class="cell-inv" x="476" y="235">Gateway allowlist</text>
  <rect class="mid" x="554" y="210" width="148" height="40" />
  <text class="cell" x="628" y="235">Workspace only</text>
  <rect class="lo"  x="706" y="210" width="148" height="40" />
  <text class="cell" x="780" y="235">Product, sign-in</text>

  <text class="rowhd" x="20" y="306">microsandbox</text>
  <rect class="hi"  x="250" y="280" width="148" height="40" />
  <text class="cell-inv" x="324" y="305">microVM (libkrun)</text>
  <rect class="mid" x="402" y="280" width="148" height="40" />
  <text class="cell" x="476" y="305">Host and port lists</text>
  <rect class="hi"  x="554" y="280" width="148" height="40" />
  <text class="cell-inv" x="628" y="305">Never enters VM</text>
  <rect class="hi"  x="706" y="280" width="148" height="40" />
  <text class="cell-inv" x="780" y="305">Apache-2.0</text>

  <rect class="hi"  x="250" y="344" width="16" height="16" />
  <text class="lg" x="274" y="357">Strong</text>
  <rect class="mid" x="340" y="344" width="16" height="16" />
  <text class="lg" x="364" y="357">Partial</text>
  <rect class="lo"  x="430" y="344" width="16" height="16" />
  <text class="lg" x="454" y="357">Weak or not offered</text>

  <text class="lg" x="20" y="386">The egress column is solid across every row, which is why it no longer decides anything.</text>
</svg>
