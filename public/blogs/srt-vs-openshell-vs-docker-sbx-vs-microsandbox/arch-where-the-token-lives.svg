<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where the credential sits, in each of the four designs</title>
  <desc id="d">Four panels. Under Anthropic srt the credential stays on the real filesystem and the sandbox relies on a deny-read list. Under Docker Sandboxes only the mounted workspace crosses into the microVM, so the home directory is absent. Under NVIDIA OpenShell the credential is held by a provider outside the sandbox and attached to approved requests at the proxy. Under microsandbox the secret is scoped to a host and never enters the virtual machine.</desc>
  <style>
    .pane   { fill: none; stroke: var(--ink); stroke-width: 1.25; opacity: .45; rx: 10; ry: 10; }
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .sm     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .sm-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
    .dash   { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 4 4; opacity: .6; }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="28">Four answers to one question: can the agent read the token?</text>

  <rect class="pane" x="20" y="44" width="420" height="200" />
  <text class="hd" x="34" y="68">Anthropic srt</text>
  <rect class="box" x="34" y="84" width="180" height="60" />
  <text class="sm" x="124" y="108">Sandboxed agent</text>
  <text class="sm" x="124" y="126">shared kernel</text>
  <rect class="adj" x="250" y="84" width="176" height="60" />
  <text class="sm" x="338" y="108">~/.aws, ~/.ssh</text>
  <text class="sm" x="338" y="126">on the real disk</text>
  <path class="arrow" d="M 218 114 L 246 114" />
  <text class="note" x="34" y="176">Reads are allowed everywhere by default. The</text>
  <text class="note" x="34" y="194">boundary is a denyRead list you have to write.</text>
  <text class="note" x="34" y="222">Verdict: inside the box unless you say otherwise.</text>

  <rect class="pane" x="460" y="44" width="420" height="200" />
  <text class="hd" x="474" y="68">Docker Sandboxes</text>
  <rect class="box" x="474" y="84" width="180" height="60" />
  <text class="sm" x="564" y="108">Agent in microVM</text>
  <text class="sm" x="564" y="126">its own kernel</text>
  <rect class="box" x="690" y="84" width="176" height="60" />
  <text class="sm" x="778" y="108">Home directory</text>
  <text class="sm" x="778" y="126">not mounted</text>
  <path class="dash" d="M 658 114 L 686 114" />
  <text class="note" x="474" y="176">Only the workspace you mount crosses in, at the</text>
  <text class="note" x="474" y="194">same absolute path. Everything else is absent.</text>
  <text class="note" x="474" y="222">Verdict: outside the box, by topology.</text>

  <rect class="pane" x="20" y="262" width="420" height="200" />
  <text class="hd" x="34" y="286">NVIDIA OpenShell</text>
  <rect class="box" x="34" y="302" width="150" height="60" />
  <text class="sm" x="109" y="326">Agent</text>
  <text class="sm" x="109" y="344">holds no secret</text>
  <rect class="hero" x="214" y="302" width="100" height="60" />
  <text class="sm-inv" x="264" y="326">Policy</text>
  <text class="sm-inv" x="264" y="344">proxy</text>
  <rect class="adj" x="344" y="302" width="82" height="60" />
  <text class="sm" x="385" y="326">Provider</text>
  <text class="sm" x="385" y="344">holds it</text>
  <path class="arrow" d="M 188 332 L 210 332" />
  <path class="arrow" d="M 318 332 L 340 332" />
  <text class="note" x="34" y="394">Credentials are attached only to requests bound</text>
  <text class="note" x="34" y="412">for approved endpoints, outside the sandbox.</text>
  <text class="note" x="34" y="440">Verdict: outside the box, by construction.</text>

  <rect class="pane" x="460" y="262" width="420" height="200" />
  <text class="hd" x="474" y="286">microsandbox</text>
  <rect class="box" x="474" y="302" width="180" height="60" />
  <text class="sm" x="564" y="326">Agent in microVM</text>
  <text class="sm" x="564" y="344">libkrun</text>
  <rect class="hero" x="690" y="302" width="176" height="60" />
  <text class="sm-inv" x="778" y="326">Secret scoped</text>
  <text class="sm-inv" x="778" y="344">to one host</text>
  <path class="arrow" d="M 658 332 L 686 332" />
  <text class="note" x="474" y="394">The project&#8217;s own words: keys that never enter</text>
  <text class="note" x="474" y="412">the VM, usable only against the named host.</text>
  <text class="note" x="474" y="440">Verdict: outside the box, per destination.</text>

  <text class="note" x="20" y="484">Three of the four keep the secret out. The fourth is the one most people are already running.</text>
</svg>
