<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Which layer the published failures were in</title>
  <desc id="d">Three columns for the isolation layer, the hostname matcher and the credential reachability. Both publicly reported bypasses of the Anthropic sandbox runtime were in the hostname matcher, not in Seatbelt or bubblewrap, and the damage in each case was bounded by what the sandbox could read.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .ln     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .ln-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
  </style>

  <text class="ttl" x="20" y="30">Published bypasses, by the layer they were in</text>

  <rect class="box" x="30" y="55" width="260" height="190" />
  <text class="hd" x="160" y="86">Isolation layer</text>
  <text class="ln" x="160" y="114">Seatbelt, bubblewrap,</text>
  <text class="ln" x="160" y="132">network-namespace</text>
  <text class="ln" x="160" y="150">removal, WFP filters</text>
  <text class="ln" x="160" y="204">Reported bypasses:</text>
  <text class="vd" x="160" y="226">0</text>

  <rect class="hero" x="320" y="55" width="260" height="190" />
  <text class="hd-inv" x="450" y="86">Hostname matcher</text>
  <text class="ln-inv" x="450" y="114">Empty allowlist read as</text>
  <text class="ln-inv" x="450" y="132">allow-all; a null byte that</text>
  <text class="ln-inv" x="450" y="150">passed the suffix check</text>
  <text class="ln-inv" x="450" y="204">Reported bypasses:</text>
  <text class="vd-inv" x="450" y="226">2</text>

  <rect class="adj" x="610" y="55" width="260" height="190" />
  <text class="hd" x="740" y="86">What was reachable</text>
  <text class="ln" x="740" y="114">Credentials and source on</text>
  <text class="ln" x="740" y="132">the real filesystem, which</text>
  <text class="ln" x="740" y="150">set the loss either time</text>
  <text class="ln" x="740" y="204">Decides the damage:</text>
  <text class="vd" x="740" y="226">both</text>

  <text class="ln" x="450" y="278">The strong layer was never the one that failed, and the weak one is a string comparison.</text>
</svg>
