<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="cbct cbcd">
  <title id="cbct">Microsoft&#8217;s remediation list, sorted by whose clock it runs on</title>
  <desc id="cbcd">A five by three matrix over the measures Microsoft recommends. Scanning repositories and removing secrets needs detection first, loses a five-minute race, and only narrows future exposure. Rotating on detection needs detection first, loses the race, and arrives after the fact. Push protection needs no detection, is not in the race at all, and prevents the write. Managed identities need no detection, are not in the race, and remove the asset entirely. Honeytokens and tarpits need no prior detection, turn the attacker's speed into a signal, and buy time. Legend: decisive, partial, after the fact.</desc>
  <style>
    .cbc-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .cbc-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .cbc-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cbc-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .cbc-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .cbc-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cbc-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cbc-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .cbc-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="cbc-ttl" x="20" y="30">Five measures, three questions</text>

  <text class="cbc-col" x="330" y="62" text-anchor="middle">Needs detection first</text>
  <text class="cbc-col" x="550" y="62" text-anchor="middle">In the 5-minute race</text>
  <text class="cbc-col" x="770" y="62" text-anchor="middle">Changes the outcome</text>

  <text class="cbc-row" x="20" y="102">Scan repos, remove</text>
  <rect class="cbc-weak" x="230" y="77" width="200" height="40" />
  <text class="cbc-cell" x="330" y="102" text-anchor="middle">Yes</text>
  <rect class="cbc-weak" x="450" y="77" width="200" height="40" />
  <text class="cbc-cell" x="550" y="102" text-anchor="middle">Yes, and loses</text>
  <rect class="cbc-mid" x="670" y="77" width="200" height="40" />
  <text class="cbc-cell" x="770" y="102" text-anchor="middle">Narrows next time</text>

  <text class="cbc-row" x="20" y="154">Rotate on detection</text>
  <rect class="cbc-weak" x="230" y="129" width="200" height="40" />
  <text class="cbc-cell" x="330" y="154" text-anchor="middle">Yes</text>
  <rect class="cbc-weak" x="450" y="129" width="200" height="40" />
  <text class="cbc-cell" x="550" y="154" text-anchor="middle">Yes, and loses</text>
  <rect class="cbc-weak" x="670" y="129" width="200" height="40" />
  <text class="cbc-cell" x="770" y="154" text-anchor="middle">After the fact</text>

  <text class="cbc-row" x="20" y="206">Push protection</text>
  <rect class="cbc-strong" x="230" y="181" width="200" height="40" />
  <text class="cbc-inv" x="330" y="206" text-anchor="middle">No</text>
  <rect class="cbc-strong" x="450" y="181" width="200" height="40" />
  <text class="cbc-inv" x="550" y="206" text-anchor="middle">Not in it</text>
  <rect class="cbc-strong" x="670" y="181" width="200" height="40" />
  <text class="cbc-inv" x="770" y="206" text-anchor="middle">The write never lands</text>

  <text class="cbc-row" x="20" y="258">Managed identities</text>
  <rect class="cbc-strong" x="230" y="233" width="200" height="40" />
  <text class="cbc-inv" x="330" y="258" text-anchor="middle">No</text>
  <rect class="cbc-strong" x="450" y="233" width="200" height="40" />
  <text class="cbc-inv" x="550" y="258" text-anchor="middle">Not in it</text>
  <rect class="cbc-strong" x="670" y="233" width="200" height="40" />
  <text class="cbc-inv" x="770" y="258" text-anchor="middle">No secret to leak</text>

  <text class="cbc-row" x="20" y="310">Honeytokens, tarpits</text>
  <rect class="cbc-strong" x="230" y="285" width="200" height="40" />
  <text class="cbc-inv" x="330" y="310" text-anchor="middle">No</text>
  <rect class="cbc-mid" x="450" y="285" width="200" height="40" />
  <text class="cbc-cell" x="550" y="310" text-anchor="middle">Speed becomes signal</text>
  <rect class="cbc-mid" x="670" y="285" width="200" height="40" />
  <text class="cbc-cell" x="770" y="310" text-anchor="middle">Buys you the window</text>

  <rect class="cbc-strong" x="20" y="352" width="18" height="14" />
  <text class="cbc-leg" x="48" y="364">Decisive</text>
  <rect class="cbc-mid" x="200" y="352" width="18" height="14" />
  <text class="cbc-leg" x="228" y="364">Partial</text>
  <rect class="cbc-weak" x="360" y="352" width="18" height="14" />
  <text class="cbc-leg" x="388" y="364">After the fact</text>
</svg>
