<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="clkt clkd">
  <title id="clkt">Two clocks running on the same leaked credential</title>
  <desc id="clkd">Two lanes. The upper lane is the attacker's: query GitHub for client secrets, sign in as the service principal, enumerate Key Vault and storage and App Service, exfiltrate secret material — marked from t equals zero to t plus five minutes. The lower lane is the defender's: an alert fires if monitoring is on, triage confirms the secret is live, the owner is found and a change is opened, then every consumer is rotated and redeployed — marked from t plus hours to t plus days. The lower lane begins only after the upper lane has finished.</desc>
  <style>
    .clk-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .clk-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .clk-lane { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .clk-in   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .clk-on   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .clk-t    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .clk-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#clkarr); }
  </style>
  <defs>
    <marker id="clkarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="clk-lane" x="40" y="60">The attacker&#8217;s clock</text>

  <rect class="clk-hero" x="40"  y="96" width="170" height="56" />
  <text class="clk-in" x="125" y="118" text-anchor="middle">Query GitHub</text>
  <text class="clk-in" x="125" y="136" text-anchor="middle">for client secrets</text>
  <rect class="clk-hero" x="250" y="96" width="170" height="56" />
  <text class="clk-in" x="335" y="118" text-anchor="middle">Sign in as the</text>
  <text class="clk-in" x="335" y="136" text-anchor="middle">service principal</text>
  <rect class="clk-hero" x="460" y="96" width="170" height="56" />
  <text class="clk-in" x="545" y="118" text-anchor="middle">Enumerate vaults,</text>
  <text class="clk-in" x="545" y="136" text-anchor="middle">storage, app settings</text>
  <rect class="clk-hero" x="670" y="96" width="170" height="56" />
  <text class="clk-in" x="755" y="118" text-anchor="middle">Exfiltrate</text>
  <text class="clk-in" x="755" y="136" text-anchor="middle">secret material</text>

  <path class="clk-arr" d="M 212 124 L 246 124" />
  <path class="clk-arr" d="M 422 124 L 456 124" />
  <path class="clk-arr" d="M 632 124 L 666 124" />

  <text class="clk-t" x="125" y="180" text-anchor="middle">t = 0</text>
  <text class="clk-t" x="755" y="180" text-anchor="middle">t + 5 min</text>

  <text class="clk-lane" x="40" y="222">Your clock</text>

  <rect class="clk-box" x="40"  y="240" width="170" height="56" />
  <text class="clk-on" x="125" y="262" text-anchor="middle">Alert fires, if</text>
  <text class="clk-on" x="125" y="280" text-anchor="middle">monitoring is on</text>
  <rect class="clk-box" x="250" y="240" width="170" height="56" />
  <text class="clk-on" x="335" y="262" text-anchor="middle">Triage: confirm</text>
  <text class="clk-on" x="335" y="280" text-anchor="middle">the secret is live</text>
  <rect class="clk-box" x="460" y="240" width="170" height="56" />
  <text class="clk-on" x="545" y="262" text-anchor="middle">Find the owner,</text>
  <text class="clk-on" x="545" y="280" text-anchor="middle">open a change</text>
  <rect class="clk-box" x="670" y="240" width="170" height="56" />
  <text class="clk-on" x="755" y="262" text-anchor="middle">Rotate, redeploy</text>
  <text class="clk-on" x="755" y="280" text-anchor="middle">every consumer</text>

  <path class="clk-arr" d="M 212 268 L 246 268" />
  <path class="clk-arr" d="M 422 268 L 456 268" />
  <path class="clk-arr" d="M 632 268 L 666 268" />

  <text class="clk-t" x="125" y="324" text-anchor="middle">t + hours</text>
  <text class="clk-t" x="755" y="324" text-anchor="middle">t + days</text>
</svg>
