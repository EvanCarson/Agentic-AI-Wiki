<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="sgt sgd">
  <title id="sgt">How an unpublished emulator gap turns into a change in your own code</title>
  <desc id="sgd">A four-step chain with a return arrow. An agent calls an API the emulator does not implement; the emulator answers with a stub or the wrong error code; the agent concludes its own code is wrong; the agent edits working code until the stub accepts it. The return arrow closes the loop, labelled green suite, broken code.</desc>
  <style>
    .sg-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .sg-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .sg-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .sg-lbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .sg-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .sg-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sg-invs { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .sg-arr  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .sg-note { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
    .sg-line { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#sgarr); }
  </style>
  <defs>
    <marker id="sgarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="sg-ttl" x="20" y="34">The loop a missing feature starts</text>

  <rect class="sg-box" x="20" y="100" width="190" height="70" />
  <text class="sg-lbl" x="115" y="130" text-anchor="middle">Agent calls an API</text>
  <text class="sg-sub" x="115" y="150" text-anchor="middle">the emulator lacks</text>

  <path class="sg-line" d="M 214 135 L 246 135" />

  <rect class="sg-hero" x="250" y="100" width="190" height="70" />
  <text class="sg-inv" x="345" y="130" text-anchor="middle">A stub answers</text>
  <text class="sg-invs" x="345" y="150" text-anchor="middle">or the wrong error code</text>

  <path class="sg-line" d="M 444 135 L 476 135" />

  <rect class="sg-box" x="480" y="100" width="190" height="70" />
  <text class="sg-lbl" x="575" y="130" text-anchor="middle">Agent concludes</text>
  <text class="sg-sub" x="575" y="150" text-anchor="middle">its own code is wrong</text>

  <path class="sg-line" d="M 674 135 L 706 135" />

  <rect class="sg-box" x="710" y="100" width="170" height="70" />
  <text class="sg-lbl" x="795" y="130" text-anchor="middle">Agent edits</text>
  <text class="sg-sub" x="795" y="150" text-anchor="middle">working code</text>

  <path class="sg-line" d="M 795 174 L 795 250 L 115 250 L 115 176" />
  <text class="sg-arr" x="455" y="274" text-anchor="middle">green suite, broken code</text>

  <text class="sg-note" x="20" y="332">The agent cannot tell a gap in the emulator from a bug in your code. Nothing in the loop reports an error.</text>
  <text class="sg-note" x="20" y="358">Which is why the published gap list, not the service count, is the number to choose on.</text>
</svg>
