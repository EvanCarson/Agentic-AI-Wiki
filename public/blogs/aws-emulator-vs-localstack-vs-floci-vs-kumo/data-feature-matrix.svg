<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmt fmd">
  <title id="fmt">Four local AWS emulators across four axes</title>
  <desc id="fmd">A matrix with four projects as rows and four axes as columns. AWS Emulator is the only one that publishes per-service fidelity scores and a tracked gap list, and it has the broadest surface but the heaviest build. LocalStack has the most mature ecosystem but gates some APIs behind its paid tier. Floci matches LocalStack's interface with no feature gates. Kumo has the smallest surface and by far the lightest footprint.</desc>
  <style>
    .fm-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .fm-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .fm-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .fm-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .fm-col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .fm-row    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .fm-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .fm-cellin { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .fm-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="fm-ttl" x="20" y="32">Where each one leans hardest</text>

  <text class="fm-col" x="352" y="74" text-anchor="middle">PUBLISHED GAPS</text>
  <text class="fm-col" x="507" y="74" text-anchor="middle">BREADTH</text>
  <text class="fm-col" x="662" y="74" text-anchor="middle">CI FOOTPRINT</text>
  <text class="fm-col" x="817" y="74" text-anchor="middle">ECOSYSTEM</text>

  <text class="fm-row" x="20" y="117">AWS Emulator</text>
  <rect class="fm-strong" x="280" y="92" width="145" height="40" />
  <text class="fm-cellin" x="352" y="117" text-anchor="middle">Scored per release</text>
  <rect class="fm-strong" x="435" y="92" width="145" height="40" />
  <text class="fm-cellin" x="507" y="117" text-anchor="middle">436 crates</text>
  <rect class="fm-weak"   x="590" y="92" width="145" height="40" />
  <text class="fm-cell"   x="662" y="117" text-anchor="middle">Heavy build</text>
  <rect class="fm-weak"   x="745" y="92" width="145" height="40" />
  <text class="fm-cell"   x="817" y="117" text-anchor="middle">Days old</text>

  <text class="fm-row" x="20" y="177">LocalStack</text>
  <rect class="fm-weak"   x="280" y="152" width="145" height="40" />
  <text class="fm-cell"   x="352" y="177" text-anchor="middle">Not published</text>
  <rect class="fm-med"    x="435" y="152" width="145" height="40" />
  <text class="fm-cell"   x="507" y="177" text-anchor="middle">Pro tier gated</text>
  <rect class="fm-med"    x="590" y="152" width="145" height="40" />
  <text class="fm-cell"   x="662" y="177" text-anchor="middle">One container</text>
  <rect class="fm-strong" x="745" y="152" width="145" height="40" />
  <text class="fm-cellin" x="817" y="177" text-anchor="middle">Mature</text>

  <text class="fm-row" x="20" y="237">Floci</text>
  <rect class="fm-weak"   x="280" y="212" width="145" height="40" />
  <text class="fm-cell"   x="352" y="237" text-anchor="middle">Not published</text>
  <rect class="fm-med"    x="435" y="212" width="145" height="40" />
  <text class="fm-cell"   x="507" y="237" text-anchor="middle">No feature gates</text>
  <rect class="fm-med"    x="590" y="212" width="145" height="40" />
  <text class="fm-cell"   x="662" y="237" text-anchor="middle">One container</text>
  <rect class="fm-med"    x="745" y="212" width="145" height="40" />
  <text class="fm-cell"   x="817" y="237" text-anchor="middle">Growing fast</text>

  <text class="fm-row" x="20" y="297">Kumo</text>
  <rect class="fm-weak"   x="280" y="272" width="145" height="40" />
  <text class="fm-cell"   x="352" y="297" text-anchor="middle">Not published</text>
  <rect class="fm-weak"   x="435" y="272" width="145" height="40" />
  <text class="fm-cell"   x="507" y="297" text-anchor="middle">83 services</text>
  <rect class="fm-strong" x="590" y="272" width="145" height="40" />
  <text class="fm-cellin" x="662" y="297" text-anchor="middle">~17 MB, ~0.12 s</text>
  <rect class="fm-weak"   x="745" y="272" width="145" height="40" />
  <text class="fm-cell"   x="817" y="297" text-anchor="middle">Small</text>

  <rect class="fm-strong" x="20"  y="358" width="16" height="14" />
  <text class="fm-leg" x="44"  y="370" text-anchor="start">Leads this axis</text>
  <rect class="fm-med"    x="180" y="358" width="16" height="14" />
  <text class="fm-leg" x="204" y="370" text-anchor="start">Adequate</text>
  <rect class="fm-weak"   x="320" y="358" width="16" height="14" />
  <text class="fm-leg" x="344" y="370" text-anchor="start">Trails this axis</text>
</svg>
