<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Local vector store capability matrix</title>
  <desc id="d">Heatmap comparing LanceDB, Chroma, sqlite-vec and FAISS across five axes: built-in storage, ANN index, metadata filtering, hybrid or full-text search, and handling corpora larger than RAM. Strength runs from light neutral (weak) through soft accent (medium) to solid accent (strong).</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="32" text-anchor="middle">What each store gives you out of the box</text>

  <!--
    Left margin for row labels: 160px
    5 columns × 136px = 680px; left edges 160/296/432/568/704; centres 228/364/500/636/772
    4 rows × 56px; row tops 76/132/188/244; centres 104/160/216/272
  -->

  <!-- Column headers -->
  <text class="col-head" x="228" y="54">Storage</text>
  <text class="col-head" x="228" y="66">built in</text>

  <text class="col-head" x="364" y="54">ANN</text>
  <text class="col-head" x="364" y="66">index</text>

  <text class="col-head" x="500" y="54">Metadata</text>
  <text class="col-head" x="500" y="66">filtering</text>

  <text class="col-head" x="636" y="54">Hybrid /</text>
  <text class="col-head" x="636" y="66">full-text</text>

  <text class="col-head" x="772" y="54">Larger</text>
  <text class="col-head" x="772" y="66">than RAM</text>

  <!-- ===== Row 1: LanceDB ===== -->
  <text class="row-head" x="152" y="104">LanceDB</text>
  <rect class="cell-strong" x="160" y="76" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="228" y="104">Lance format</text>
  <rect class="cell-strong" x="296" y="76" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="364" y="104">IVF-PQ</text>
  <rect class="cell-strong" x="432" y="76" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="500" y="104">SQL predicates</text>
  <rect class="cell-strong" x="568" y="76" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="636" y="104">FTS + rerank</text>
  <rect class="cell-strong" x="704" y="76" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="772" y="104">Disk-native</text>

  <!-- ===== Row 2: Chroma ===== -->
  <text class="row-head" x="152" y="160">Chroma</text>
  <rect class="cell-strong" x="160" y="132" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="228" y="160">Persistent dir</text>
  <rect class="cell-strong" x="296" y="132" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="364" y="160">HNSW</text>
  <rect class="cell-strong" x="432" y="132" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="500" y="160">where filters</text>
  <rect class="cell-medium" x="568" y="132" width="136" height="56" rx="4" />
  <text class="cell-text" x="636" y="160">Substring only</text>
  <rect class="cell-medium" x="704" y="132" width="136" height="56" rx="4" />
  <text class="cell-text" x="772" y="160">Segments</text>

  <!-- ===== Row 3: sqlite-vec ===== -->
  <text class="row-head" x="152" y="216">sqlite-vec</text>
  <rect class="cell-strong" x="160" y="188" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="228" y="216">SQLite file</text>
  <rect class="cell-weak" x="296" y="188" width="136" height="56" rx="4" />
  <text class="cell-text" x="364" y="216">Brute force</text>
  <rect class="cell-medium" x="432" y="188" width="136" height="56" rx="4" />
  <text class="cell-text" x="500" y="216">Typed columns</text>
  <rect class="cell-medium" x="568" y="188" width="136" height="56" rx="4" />
  <text class="cell-text" x="636" y="216">Join FTS5</text>
  <rect class="cell-medium" x="704" y="188" width="136" height="56" rx="4" />
  <text class="cell-text" x="772" y="216">Paged scan</text>

  <!-- ===== Row 4: FAISS ===== -->
  <text class="row-head" x="152" y="272">FAISS</text>
  <rect class="cell-weak" x="160" y="244" width="136" height="56" rx="4" />
  <text class="cell-text" x="228" y="272">None</text>
  <rect class="cell-strong" x="296" y="244" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="364" y="272">Flat/IVF/HNSW/PQ</text>
  <rect class="cell-weak" x="432" y="244" width="136" height="56" rx="4" />
  <text class="cell-text" x="500" y="272">ID masks only</text>
  <rect class="cell-weak" x="568" y="244" width="136" height="56" rx="4" />
  <text class="cell-text" x="636" y="272">None</text>
  <rect class="cell-medium" x="704" y="244" width="136" height="56" rx="4" />
  <text class="cell-text" x="772" y="272">On-disk IVF</text>

  <!-- Legend -->
  <rect class="legend-box-w" x="160" y="330" width="16" height="16" rx="3" />
  <text class="legend-text" x="182" y="338">Weak</text>

  <rect class="legend-box-m" x="250" y="330" width="16" height="16" rx="3" />
  <text class="legend-text" x="272" y="338">Medium</text>

  <rect class="legend-box-s" x="360" y="330" width="16" height="16" rx="3" />
  <text class="legend-text" x="382" y="338">Strong</text>

</svg>
