<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">sqlite-vec architecture</title>
  <desc id="d">sqlite-vec is a C extension that adds vec0 virtual tables to SQLite. Vectors, typed metadata columns, partition keys and auxiliary payload columns live inside one ordinary SQLite file, queried with SQL alongside FTS5 full-text tables and your existing application rows.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .80; }
    .mono  { font-family: var(--font-mono), monospace; font-size: 11px; fill: var(--ink); opacity: .75; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- The one file (hero) -->
  <rect class="hero" x="40" y="50" width="580" height="396" rx="12" ry="12" />
  <text class="label-inv" x="330" y="80" text-anchor="middle" font-weight="600" font-size="16">One ordinary SQLite file</text>
  <text class="sub-inv" x="330" y="98" text-anchor="middle">pure-C extension, zero dependencies · runs wherever SQLite runs, including WASM</text>

  <!-- vec0 virtual table -->
  <rect class="box" x="68" y="118" width="524" height="128" rx="8" ry="8" />
  <text class="label" x="330" y="142" text-anchor="middle" font-weight="700">vec0 virtual table</text>
  <text class="mono" x="330" y="160" text-anchor="middle">CREATE VIRTUAL TABLE chunks USING vec0(...)</text>

  <rect class="adj" x="88" y="174" width="118" height="56" rx="6" ry="6" />
  <text class="sub" x="147" y="194" text-anchor="middle" font-weight="600">embedding</text>
  <text class="sub" x="147" y="210" text-anchor="middle">float, int8, bit</text>

  <rect class="adj" x="216" y="174" width="118" height="56" rx="6" ry="6" />
  <text class="sub" x="275" y="194" text-anchor="middle" font-weight="600">metadata cols</text>
  <text class="sub" x="275" y="210" text-anchor="middle">filterable, ≤16</text>

  <rect class="adj" x="344" y="174" width="118" height="56" rx="6" ry="6" />
  <text class="sub" x="403" y="194" text-anchor="middle" font-weight="600">partition keys</text>
  <text class="sub" x="403" y="210" text-anchor="middle">shard by tenant</text>

  <rect class="box" x="472" y="174" width="100" height="56" rx="6" ry="6" />
  <text class="sub" x="522" y="194" text-anchor="middle" font-weight="600">+aux columns</text>
  <text class="sub" x="522" y="210" text-anchor="middle">payload only</text>

  <!-- Search behaviour -->
  <rect class="box" x="68" y="262" width="254" height="90" rx="8" ry="8" />
  <text class="label" x="195" y="286" text-anchor="middle" font-weight="700">Brute-force KNN</text>
  <text class="sub" x="195" y="304" text-anchor="middle">every vector scanned, exact recall</text>
  <text class="sub" x="195" y="320" text-anchor="middle">partition keys cut the scan set</text>
  <text class="sub" x="195" y="338" text-anchor="middle">fine to ~10⁵ · slow far beyond</text>

  <!-- Your own tables -->
  <rect class="box" x="338" y="262" width="254" height="90" rx="8" ry="8" />
  <text class="label" x="465" y="286" text-anchor="middle" font-weight="700">Your existing tables</text>
  <text class="sub" x="465" y="304" text-anchor="middle">documents, users, permissions</text>
  <text class="sub" x="465" y="320" text-anchor="middle">+ FTS5 for BM25 keyword search</text>
  <text class="sub" x="465" y="338" text-anchor="middle">joined in the same statement</text>

  <!-- Query line -->
  <rect class="box" x="68" y="368" width="524" height="60" rx="8" ry="8" />
  <text class="label" x="330" y="392" text-anchor="middle" font-weight="700">One SQL query, one transaction</text>
  <text class="mono" x="330" y="412" text-anchor="middle">SELECT … WHERE tenant = ? AND embedding MATCH ? ORDER BY distance LIMIT k</text>

  <line class="arrow" x1="195" y1="352" x2="195" y2="366" />
  <line class="arrow" x1="465" y1="352" x2="465" y2="366" />
  <line class="arrow" x1="330" y1="246" x2="330" y2="260" />

  <!-- Agent side -->
  <rect class="bound" x="650" y="60" width="216" height="376" rx="10" ry="10" />
  <text class="sub" x="758" y="82" text-anchor="middle" font-weight="600">Agent / app</text>

  <rect class="box" x="670" y="104" width="178" height="72" rx="8" ry="8" />
  <text class="label" x="759" y="128" text-anchor="middle" font-weight="600">No server</text>
  <text class="sub" x="759" y="146" text-anchor="middle">the database is a file</text>
  <text class="sub" x="759" y="162" text-anchor="middle">you can copy or ship</text>

  <rect class="box" x="670" y="194" width="178" height="72" rx="8" ry="8" />
  <text class="label" x="759" y="218" text-anchor="middle" font-weight="600">Any language</text>
  <text class="sub" x="759" y="236" text-anchor="middle">Python, Node, Go, Rust,</text>
  <text class="sub" x="759" y="252" text-anchor="middle">Ruby, browser WASM</text>

  <rect class="adj" x="670" y="284" width="178" height="72" rx="8" ry="8" />
  <text class="label" x="759" y="308" text-anchor="middle" font-weight="600">Backups are cp</text>
  <text class="sub" x="759" y="326" text-anchor="middle">whatever you already do</text>
  <text class="sub" x="759" y="342" text-anchor="middle">with a SQLite file</text>

  <rect class="box" x="670" y="374" width="178" height="52" rx="8" ry="8" />
  <text class="label" x="759" y="396" text-anchor="middle" font-weight="600">Still pre-1.0</text>
  <text class="sub" x="759" y="414" text-anchor="middle">expect breaking changes</text>

  <line class="arrow" x1="648" y1="140" x2="624" y2="150" />
</svg>
