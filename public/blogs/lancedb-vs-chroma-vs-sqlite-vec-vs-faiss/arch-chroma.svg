<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Chroma architecture</title>
  <desc id="d">Chroma runs in-process against a persistent directory. Writes append to an immutable write-ahead log; background compaction materializes the log into HNSW segments; reads query the segments. Since version 1.0 the core is Rust, with native bindings for Python, JavaScript, Ruby and Swift.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .80; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Client -->
  <rect class="adj" x="40" y="60" width="184" height="120" rx="10" ry="10" />
  <text class="label" x="132" y="88" text-anchor="middle" font-weight="700">Your code</text>
  <text class="sub" x="132" y="110" text-anchor="middle">one import, one path</text>
  <text class="sub" x="132" y="128" text-anchor="middle">collection.add(...)</text>
  <text class="sub" x="132" y="146" text-anchor="middle">collection.query(...)</text>
  <text class="sub" x="132" y="166" text-anchor="middle">Python · JS · Ruby · Swift</text>

  <!-- Rust core (hero) -->
  <rect class="hero" x="264" y="50" width="596" height="264" rx="12" ry="12" />
  <text class="label-inv" x="562" y="80" text-anchor="middle" font-weight="600" font-size="16">Rust core (since 1.0) — lock-free, multithreaded</text>
  <text class="sub-inv" x="562" y="98" text-anchor="middle">log-structured: writes go to a log, reads go to segments, compaction bridges them</text>

  <!-- Write path -->
  <rect class="box" x="290" y="120" width="168" height="82" rx="8" ry="8" />
  <text class="label" x="374" y="144" text-anchor="middle" font-weight="700">1 · Write-ahead log</text>
  <text class="sub" x="374" y="162" text-anchor="middle">immutable, append-only</text>
  <text class="sub" x="374" y="178" text-anchor="middle">writes acknowledge here</text>
  <text class="sub" x="374" y="194" text-anchor="middle">ingest never blocks</text>

  <rect class="box" x="478" y="120" width="168" height="82" rx="8" ry="8" />
  <text class="label" x="562" y="144" text-anchor="middle" font-weight="700">2 · Compaction</text>
  <text class="sub" x="562" y="162" text-anchor="middle">background, asynchronous</text>
  <text class="sub" x="562" y="178" text-anchor="middle">log becomes segments</text>
  <text class="sub" x="562" y="194" text-anchor="middle">so there is a brief lag</text>

  <rect class="box" x="666" y="120" width="168" height="82" rx="8" ry="8" />
  <text class="label" x="750" y="144" text-anchor="middle" font-weight="700">3 · HNSW segments</text>
  <text class="sub" x="750" y="162" text-anchor="middle">graph index, in memory</text>
  <text class="sub" x="750" y="178" text-anchor="middle">queries read here</text>
  <text class="sub" x="750" y="194" text-anchor="middle">SPANN is distributed-only</text>

  <line class="arrow" x1="460" y1="161" x2="474" y2="161" />
  <line class="arrow" x1="648" y1="161" x2="662" y2="161" />

  <!-- Query path -->
  <rect class="box" x="290" y="222" width="544" height="70" rx="8" ry="8" />
  <text class="label" x="562" y="246" text-anchor="middle" font-weight="700">Query: vector search + metadata where-filters + substring document match</text>
  <text class="sub" x="562" y="266" text-anchor="middle">no BM25 ranking — if you want true hybrid retrieval you add a keyword index yourself</text>
  <text class="sub" x="562" y="282" text-anchor="middle">filters are applied against the segment metadata, not a separate store</text>

  <line class="arrow" x1="228" y1="120" x2="286" y2="140" />
  <line class="arrow" x1="286" y1="250" x2="232" y2="180" />

  <!-- Storage -->
  <rect class="adj" x="264" y="330" width="596" height="72" rx="10" ry="10" />
  <text class="label" x="562" y="354" text-anchor="middle" font-weight="700">A persistent directory on your disk</text>
  <text class="sub" x="562" y="374" text-anchor="middle">no server process in embedded mode</text>
  <text class="sub" x="562" y="390" text-anchor="middle">the same API also talks to a self-hosted server or Chroma Cloud</text>

  <line class="arrow" x1="562" y1="314" x2="562" y2="328" />

  <!-- Consequence strip -->
  <rect class="box" x="40" y="412" width="820" height="72" rx="10" ry="10" />
  <text class="label" x="450" y="436" text-anchor="middle" font-weight="700">The trade</text>
  <text class="sub" x="450" y="456" text-anchor="middle">Shortest distance from nothing to working retrieval. The memory-resident HNSW is also the ceiling:</text>
  <text class="sub" x="450" y="472" text-anchor="middle">comfortable to roughly a million vectors, then memory pressure decides for you.</text>
</svg>
