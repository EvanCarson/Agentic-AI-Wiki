<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">LanceDB architecture</title>
  <desc id="d">LanceDB stores tables in the Lance columnar format on local disk or object storage, queried in-process over memory-mapped files. IVF-PQ vector indexes, full-text and scalar indexes sit beside the data, every write creates a new version, and Arrow-compatible tools read the same files with no copy.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .80; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- In-process query engine -->
  <rect class="adj" x="40" y="50" width="212" height="180" rx="10" ry="10" />
  <text class="label" x="146" y="78" text-anchor="middle" font-weight="700">In-process engine</text>
  <text class="sub" x="146" y="100" text-anchor="middle">Rust core, no server</text>
  <text class="sub" x="146" y="118" text-anchor="middle">Python · TypeScript · Rust · Java</text>
  <text class="sub" x="146" y="140" text-anchor="middle">vector search</text>
  <text class="sub" x="146" y="158" text-anchor="middle">+ full-text search</text>
  <text class="sub" x="146" y="176" text-anchor="middle">+ SQL filters</text>
  <text class="sub" x="146" y="198" text-anchor="middle">= hybrid query with</text>
  <text class="sub" x="146" y="216" text-anchor="middle">reranking, one call</text>

  <!-- Storage (hero) -->
  <rect class="hero" x="276" y="50" width="584" height="230" rx="12" ry="12" />
  <text class="label-inv" x="568" y="80" text-anchor="middle" font-weight="600" font-size="16">Lance columnar format — on disk or object storage</text>
  <text class="sub-inv" x="568" y="98" text-anchor="middle">memory-mapped, read column-by-column; the corpus does not have to fit in RAM</text>

  <rect class="box" x="300" y="118" width="172" height="76" rx="8" ry="8" />
  <text class="label" x="386" y="142" text-anchor="middle" font-weight="700">Data columns</text>
  <text class="sub" x="386" y="160" text-anchor="middle">text, vectors, images,</text>
  <text class="sub" x="386" y="176" text-anchor="middle">audio, arbitrary blobs</text>

  <rect class="box" x="484" y="118" width="172" height="76" rx="8" ry="8" />
  <text class="label" x="570" y="142" text-anchor="middle" font-weight="700">Indexes beside data</text>
  <text class="sub" x="570" y="160" text-anchor="middle">IVF-PQ vector index</text>
  <text class="sub" x="570" y="176" text-anchor="middle">+ full-text + scalar</text>

  <rect class="box" x="668" y="118" width="168" height="76" rx="8" ry="8" />
  <text class="label" x="752" y="142" text-anchor="middle" font-weight="700">Versioned</text>
  <text class="sub" x="752" y="160" text-anchor="middle">every write is a new</text>
  <text class="sub" x="752" y="176" text-anchor="middle">version you can read back</text>

  <rect class="box" x="300" y="206" width="536" height="56" rx="8" ry="8" />
  <text class="label" x="568" y="228" text-anchor="middle" font-weight="700">Filters and vectors resolve against the same files</text>
  <text class="sub" x="568" y="248" text-anchor="middle">no second metadata store to keep in sync — and no sync job to get wrong</text>

  <line class="arrow" x1="256" y1="140" x2="296" y2="150" />
  <line class="arrow" x1="296" y1="226" x2="256" y2="200" />

  <!-- Zero-copy analytics -->
  <rect class="adj" x="276" y="308" width="584" height="76" rx="10" ry="10" />
  <text class="label" x="568" y="332" text-anchor="middle" font-weight="700">Zero-copy to the data stack</text>
  <text class="sub" x="568" y="352" text-anchor="middle">Apache Arrow · Pandas · Polars · DuckDB read the same files directly</text>
  <text class="sub" x="568" y="368" text-anchor="middle">so evaluating your retrieval set is a dataframe query, not an export</text>

  <line class="arrow" x1="568" y1="282" x2="568" y2="306" />

  <!-- Cost strip -->
  <rect class="box" x="40" y="404" width="820" height="66" rx="10" ry="10" />
  <text class="label" x="450" y="428" text-anchor="middle" font-weight="700">The trade</text>
  <text class="sub" x="450" y="448" text-anchor="middle">Scales past RAM on one machine and keeps data, metadata and index in one place — at the cost of a smaller community than</text>
  <text class="sub" x="450" y="464" text-anchor="middle">the server databases, and IVF-PQ's approximation, which loses ground under tight metadata filters.</text>
</svg>
