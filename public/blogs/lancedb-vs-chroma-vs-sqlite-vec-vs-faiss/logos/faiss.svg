<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="FAISS logo">
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Nearest-neighbour cluster: a query point with spokes to its neighbours -->
  <circle cx="16" cy="16" r="2.4" fill="var(--paper)" />
  <line x1="16" y1="16" x2="10" y2="11" stroke="var(--paper)" stroke-width="1.3" opacity=".8" />
  <line x1="16" y1="16" x2="22" y2="10" stroke="var(--paper)" stroke-width="1.3" opacity=".8" />
  <line x1="16" y1="16" x2="9.5" y2="20" stroke="var(--paper)" stroke-width="1.3" opacity=".8" />
  <line x1="16" y1="16" x2="22.5" y2="21" stroke="var(--paper)" stroke-width="1.3" opacity=".8" />
  <circle cx="10" cy="11" r="1.5" fill="var(--paper)" />
  <circle cx="22" cy="10" r="1.5" fill="var(--paper)" />
  <circle cx="9.5" cy="20" r="1.5" fill="var(--paper)" />
  <circle cx="22.5" cy="21" r="1.5" fill="var(--paper)" />
</svg>
