<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="LanceDB logo">
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Columnar format: four stacked column strips of differing length -->
  <rect x="8" y="9" width="16" height="3" rx="1.5" fill="var(--paper)" />
  <rect x="8" y="14.5" width="11" height="3" rx="1.5" fill="var(--paper)" opacity=".85" />
  <rect x="8" y="20" width="16" height="3" rx="1.5" fill="var(--paper)" opacity=".7" />
  <!-- Lance/spear tip suggesting the name -->
  <path d="M 21.5 14.5 L 25 18 L 21.5 21.5" fill="none" stroke="var(--paper)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
