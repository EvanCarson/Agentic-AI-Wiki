<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">How much of the knowledge base you write yourself</title>
  <desc id="d">Four-column comparison of the code you must supply around each store: FAISS leaves you persistence, metadata and lifecycle; sqlite-vec gives you SQL storage but you own the scan budget; Chroma supplies storage, index and filters but no keyword ranking; LanceDB supplies storage, indexes, full-text and hybrid retrieval in one call.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">How much of the knowledge base you still have to write</text>

  <!-- Column 1: FAISS — ACCENT (most work) -->
  <rect class="card-accent" x="10" y="44" width="210" height="220" rx="8" />
  <text class="col-head-inv" x="115" y="72">FAISS</text>
  <text class="body-text-inv" x="115" y="106">Persistence, metadata,</text>
  <text class="body-text-inv" x="115" y="124">collections, deletes —</text>
  <text class="body-text-inv" x="115" y="142">all yours. You get an</text>
  <text class="body-text-inv" x="115" y="160">index, not a database.</text>
  <text class="body-text-inv" x="115" y="196">In exchange: the most</text>
  <text class="body-text-inv" x="115" y="214">tunable ANN there is,</text>
  <text class="body-text-inv" x="115" y="232">and GPU search.</text>

  <!-- Column 2: sqlite-vec — soft -->
  <rect class="card-soft" x="230" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="335" y="72">sqlite-vec</text>
  <text class="body-text" x="335" y="106">Storage, metadata and</text>
  <text class="body-text" x="335" y="124">joins come free with</text>
  <text class="body-text" x="335" y="142">SQLite; BM25 is one</text>
  <text class="body-text" x="335" y="160">FTS5 table away.</text>
  <text class="body-text" x="335" y="196">You own the scan cost:</text>
  <text class="body-text" x="335" y="214">no ANN index, so growth</text>
  <text class="body-text" x="335" y="232">is your problem.</text>

  <!-- Column 3: Chroma — neutral -->
  <rect class="card-neutral" x="450" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="555" y="72">Chroma</text>
  <text class="body-text" x="555" y="106">Storage, HNSW index</text>
  <text class="body-text" x="555" y="124">and metadata filters</text>
  <text class="body-text" x="555" y="142">are supplied. Almost</text>
  <text class="body-text" x="555" y="160">nothing to assemble.</text>
  <text class="body-text" x="555" y="196">You add the keyword</text>
  <text class="body-text" x="555" y="214">half yourself — there is</text>
  <text class="body-text" x="555" y="232">no BM25 ranking.</text>

  <!-- Column 4: LanceDB — neutral -->
  <rect class="card-neutral" x="670" y="44" width="220" height="220" rx="8" />
  <text class="col-head" x="780" y="72">LanceDB</text>
  <text class="body-text" x="780" y="106">Storage, vector index,</text>
  <text class="body-text" x="780" y="124">full-text index and</text>
  <text class="body-text" x="780" y="142">reranking arrive as</text>
  <text class="body-text" x="780" y="160">one hybrid query.</text>
  <text class="body-text" x="780" y="196">You own the format</text>
  <text class="body-text" x="780" y="214">choice and a smaller</text>
  <text class="body-text" x="780" y="232">community of answers.</text>

</svg>
