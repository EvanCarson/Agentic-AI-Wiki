<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">GitHub stars — FAISS, Chroma, LanceDB, sqlite-vec</title>
  <desc id="d">Horizontal bar chart of GitHub stars in thousands, snapshot 26 July 2026: FAISS leads at 40.6k, Chroma 28.9k, LanceDB 11.0k, sqlite-vec 7.9k. FAISS is a search library rather than a database, and sqlite-vec is the youngest project of the four.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .proj-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .proj-sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: end; dominant-baseline: central; }
    .bar-val     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; dominant-baseline: central; }
    .grid-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: middle; }
    .grid-line   { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .bar-accent  { fill: var(--accent, #d4421e); }
    .bar-adj     { fill: var(--accent-soft, #f5c5b8); }
    .bar-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="36" text-anchor="middle">GitHub stars (thousands, 26 Jul 2026)</text>

  <!--
    Chart area: left margin 220, right margin 80, top 68, bottom 55
    Chart width = 600px for max value 50k -> 12 px per 1k
    Grid at 0/10/20/30/40/50 -> x = 220/340/460/580/700/820
    4 rows, bar height 46, gap 18; row tops 75/139/203/267; centres 98/162/226/290
  -->

  <!-- Grid lines -->
  <line class="grid-line" x1="220" y1="68" x2="220" y2="318" />
  <line class="grid-line" x1="340" y1="68" x2="340" y2="318" />
  <line class="grid-line" x1="460" y1="68" x2="460" y2="318" />
  <line class="grid-line" x1="580" y1="68" x2="580" y2="318" />
  <line class="grid-line" x1="700" y1="68" x2="700" y2="318" />
  <line class="grid-line" x1="820" y1="68" x2="820" y2="318" />

  <!-- Baseline -->
  <line x1="220" y1="318" x2="820" y2="318" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" />

  <!-- Grid labels -->
  <text class="grid-label" x="220" y="334">0</text>
  <text class="grid-label" x="340" y="334">10k</text>
  <text class="grid-label" x="460" y="334">20k</text>
  <text class="grid-label" x="580" y="334">30k</text>
  <text class="grid-label" x="700" y="334">40k</text>
  <text class="grid-label" x="820" y="334">50k stars</text>

  <!-- Row 1: FAISS — 40.6k — accent (leader) — width 40.6 * 12 = 487 -->
  <text class="proj-label" x="212" y="91">FAISS</text>
  <text class="proj-sub" x="212" y="107">library, since 2017</text>
  <rect class="bar-accent" x="220" y="75" width="487" height="46" rx="5" ry="5" />
  <text class="bar-val" x="715" y="98" style="fill: var(--accent-ink, #a8331a);">40.6k</text>

  <!-- Row 2: Chroma — 28.9k — accent-soft — width 28.9 * 12 = 347 -->
  <text class="proj-label" x="212" y="155">Chroma</text>
  <text class="proj-sub" x="212" y="171">embedded engine, 2022</text>
  <rect class="bar-adj" x="220" y="139" width="347" height="46" rx="5" ry="5" />
  <text class="bar-val" x="575" y="162" style="fill: var(--ink, #1a1a1a);">28.9k</text>

  <!-- Row 3: LanceDB — 11.0k — neutral — width 11.0 * 12 = 132 -->
  <text class="proj-label" x="212" y="219">LanceDB</text>
  <text class="proj-sub" x="212" y="235">columnar format, 2023</text>
  <rect class="bar-neutral" x="220" y="203" width="132" height="46" rx="5" ry="5" />
  <text class="bar-val" x="360" y="226" style="fill: var(--muted, #888);">11.0k</text>

  <!-- Row 4: sqlite-vec — 7.9k — neutral — width 7.9 * 12 = 95 -->
  <text class="proj-label" x="212" y="283">sqlite-vec</text>
  <text class="proj-sub" x="212" y="299">SQLite extension, 2024</text>
  <rect class="bar-neutral" x="220" y="267" width="95" height="46" rx="5" ry="5" />
  <text class="bar-val" x="323" y="290" style="fill: var(--muted, #888);">7.9k</text>

</svg>
