<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Where each store stops being the right answer</title>
  <desc id="d">Four-column comparison of scale limits on one machine: sqlite-vec's brute-force scan fades past a few hundred thousand vectors; Chroma's memory-resident HNSW is comfortable to about a million; FAISS scales to billions but only as an index you operate; LanceDB reads from disk so corpus size is bounded by storage rather than RAM.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .scale-num   { font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .scale-num-inv{ font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">Comfortable working range on a single machine</text>

  <!-- Column 1: sqlite-vec — neutral (lowest ceiling) -->
  <rect class="card-neutral" x="10" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="115" y="72">sqlite-vec</text>
  <text class="scale-num" x="115" y="112">~100k</text>
  <text class="body-text" x="115" y="142">Brute-force scan is</text>
  <text class="body-text" x="115" y="160">exact and simple, then</text>
  <text class="body-text" x="115" y="178">linear cost catches up.</text>
  <text class="body-text" x="115" y="210">Partition keys extend</text>
  <text class="body-text" x="115" y="228">this when queries are</text>
  <text class="body-text" x="115" y="246">per-tenant.</text>

  <!-- Column 2: Chroma — soft -->
  <rect class="card-soft" x="230" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="335" y="72">Chroma</text>
  <text class="scale-num" x="335" y="112">~1M</text>
  <text class="body-text" x="335" y="142">HNSW lives in memory,</text>
  <text class="body-text" x="335" y="160">so RAM sets the limit</text>
  <text class="body-text" x="335" y="178">and degrades past it.</text>
  <text class="body-text" x="335" y="210">Beyond that the answer</text>
  <text class="body-text" x="335" y="228">is distributed Chroma,</text>
  <text class="body-text" x="335" y="246">which is a service.</text>

  <!-- Column 3: FAISS — soft -->
  <rect class="card-soft" x="450" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="555" y="72">FAISS</text>
  <text class="scale-num" x="555" y="112">billions</text>
  <text class="body-text" x="555" y="142">IVF-PQ compression and</text>
  <text class="body-text" x="555" y="160">GPU search go as far as</text>
  <text class="body-text" x="555" y="178">any library goes.</text>
  <text class="body-text" x="555" y="210">The ceiling is operational,</text>
  <text class="body-text" x="555" y="228">not algorithmic: you are</text>
  <text class="body-text" x="555" y="246">running it all yourself.</text>

  <!-- Column 4: LanceDB — ACCENT (highest practical ceiling for one machine) -->
  <rect class="card-accent" x="670" y="44" width="220" height="220" rx="8" />
  <text class="col-head-inv" x="780" y="72">LanceDB</text>
  <text class="scale-num-inv" x="780" y="112">disk-bound</text>
  <text class="body-text-inv" x="780" y="142">Reads from mapped files,</text>
  <text class="body-text-inv" x="780" y="160">so the corpus may exceed</text>
  <text class="body-text-inv" x="780" y="178">RAM by a wide margin.</text>
  <text class="body-text-inv" x="780" y="210">The cost is approximation:</text>
  <text class="body-text-inv" x="780" y="228">IVF-PQ recall dips under</text>
  <text class="body-text-inv" x="780" y="246">tight metadata filters.</text>

</svg>
