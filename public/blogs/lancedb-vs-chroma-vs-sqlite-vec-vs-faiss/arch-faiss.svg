<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">FAISS architecture</title>
  <desc id="d">FAISS is a search library loaded into your own process: it holds an index of vectors and returns integer IDs with distances. Persistence, metadata, filtering and the join back to documents are all code you write yourself, outside the library.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .80; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Your process boundary -->
  <rect class="bound" x="24" y="40" width="852" height="426" rx="12" ry="12" />
  <text class="sub" x="44" y="62" font-weight="600">Your process — everything here is your code</text>

  <!-- FAISS library (hero) -->
  <rect class="hero" x="48" y="86" width="404" height="248" rx="12" ry="12" />
  <text class="label-inv" x="250" y="116" text-anchor="middle" font-weight="600" font-size="16">FAISS — a search library</text>
  <text class="sub-inv" x="250" y="134" text-anchor="middle">C++ with Python bindings · CPU or GPU · no server, no file format</text>

  <rect class="box" x="72" y="152" width="356" height="72" rx="8" ry="8" />
  <text class="label" x="250" y="176" text-anchor="middle" font-weight="700">Index structures</text>
  <text class="sub" x="250" y="194" text-anchor="middle">Flat (exact) · IVF · HNSW · PQ (compression)</text>
  <text class="sub" x="250" y="210" text-anchor="middle">choose the recall × latency × memory point yourself</text>

  <rect class="box" x="72" y="240" width="356" height="72" rx="8" ry="8" />
  <text class="label" x="250" y="264" text-anchor="middle" font-weight="700">Search returns (id, distance)</text>
  <text class="sub" x="250" y="282" text-anchor="middle">integer IDs only — the library never saw your text</text>
  <text class="sub" x="250" y="298" text-anchor="middle">filtering is an ID bitmask you build and pass in</text>

  <!-- What you build around it -->
  <text class="sub" x="700" y="106" text-anchor="middle" font-weight="600">Everything a database would have given you</text>

  <rect class="adj" x="500" y="122" width="352" height="66" rx="8" ry="8" />
  <text class="label" x="676" y="146" text-anchor="middle" font-weight="600">Persistence</text>
  <text class="sub" x="676" y="164" text-anchor="middle">serialize the index to disk, reload on start,</text>
  <text class="sub" x="676" y="180" text-anchor="middle">decide what happens on crash</text>

  <rect class="adj" x="500" y="200" width="352" height="66" rx="8" ry="8" />
  <text class="label" x="676" y="224" text-anchor="middle" font-weight="600">Metadata store</text>
  <text class="sub" x="676" y="242" text-anchor="middle">a separate table mapping id → text, source,</text>
  <text class="sub" x="676" y="258" text-anchor="middle">tenant, timestamp — kept in sync by you</text>

  <rect class="adj" x="500" y="278" width="352" height="66" rx="8" ry="8" />
  <text class="label" x="676" y="302" text-anchor="middle" font-weight="600">Collections &amp; lifecycle</text>
  <text class="sub" x="676" y="320" text-anchor="middle">adds, deletes, rebuilds, versioning —</text>
  <text class="sub" x="676" y="336" text-anchor="middle">no concept of a &#8220;collection&#8221; exists in the library</text>

  <!-- Bottom: consequence -->
  <rect class="box" x="48" y="360" width="804" height="86" rx="10" ry="10" />
  <text class="label" x="450" y="386" text-anchor="middle" font-weight="700">The trade</text>
  <text class="sub" x="450" y="406" text-anchor="middle">You get the fastest and most tunable ANN implementation available, including GPU search over billions of vectors.</text>
  <text class="sub" x="450" y="424" text-anchor="middle">You also get to write, test and operate the three boxes on the right — which is most of what a vector database is.</text>

  <!-- Arrows from FAISS out to the surrounding code -->
  <line class="arrow" x1="456" y1="155" x2="496" y2="155" />
  <line class="arrow" x1="456" y1="233" x2="496" y2="233" />
  <line class="arrow" x1="456" y1="300" x2="496" y2="311" />
</svg>
