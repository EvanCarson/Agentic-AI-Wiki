<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">MCP monthly SDK downloads growth chart</title>
  <desc id="d">Horizontal bar chart showing MCP SDK monthly download counts at six quarterly snapshots from November 2024 through May 2026, ending at 97 million — a 200× increase in 18 months.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; }
    .bar-strong  { fill: var(--accent, #d4421e); }
    .bar-medium  { fill: var(--accent-soft, #f5c5b8); }
    .bar-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .row-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .bar-value   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; dominant-baseline: central; }
    .bar-value-strong { fill: var(--accent, #d4421e); }
    .bar-value-medium { fill: var(--accent-soft, #f5c5b8); }
    .bar-value-weak   { fill: var(--muted, #888); }
    .grid-line   { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 4 4; }
    .grid-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: middle; }
    .axis-line   { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
  </style>

  <!-- Chart title -->
  <text class="chart-title" x="200" y="32" text-anchor="start">MCP monthly SDK downloads (millions)</text>

  <!--
    Layout:
    Left margin (row labels): 190px
    Bar area: x=200 to x=830, width=630px
    100M maps to 630px → scale = 6.3px per million
    6 rows × 48px row height, starting y=60 (top of first bar), bar height=32
    Row tops: 60, 108, 156, 204, 252, 300
    Row centers: 76, 124, 172, 220, 268, 316
    Gridlines at 0, 25, 50, 75, 100M → x = 200, 357.5, 515, 672.5, 830
    Grid label y: 358
  -->

  <!-- Vertical gridlines (dotted) -->
  <line class="grid-line" x1="200" y1="50" x2="200" y2="345" />
  <line class="grid-line" x1="357.5" y1="50" x2="357.5" y2="345" />
  <line class="grid-line" x1="515" y1="50" x2="515" y2="345" />
  <line class="grid-line" x1="672.5" y1="50" x2="672.5" y2="345" />
  <line class="grid-line" x1="830" y1="50" x2="830" y2="345" />

  <!-- Grid labels -->
  <text class="grid-label" x="200" y="358">0</text>
  <text class="grid-label" x="357.5" y="358">25M</text>
  <text class="grid-label" x="515" y="358">50M</text>
  <text class="grid-label" x="672.5" y="358">75M</text>
  <text class="grid-label" x="830" y="358">100M</text>

  <!-- Axis baseline -->
  <line class="axis-line" x1="200" y1="345" x2="830" y2="345" />

  <!-- ===== Row 1: Nov 2024 — 0.5M (weak) ===== -->
  <text class="row-label" x="190" y="76">Nov 2024</text>
  <rect class="bar-weak" x="200" y="60" width="3.15" height="32" rx="3" />
  <text class="bar-value bar-value-weak" x="210" y="76">&lt;1M</text>

  <!-- ===== Row 2: Mar 2025 — 3M (weak) ===== -->
  <text class="row-label" x="190" y="124">Mar 2025</text>
  <rect class="bar-weak" x="200" y="108" width="18.9" height="32" rx="3" />
  <text class="bar-value bar-value-weak" x="226" y="124">3M</text>

  <!-- ===== Row 3: Jun 2025 — 10M (weak) ===== -->
  <text class="row-label" x="190" y="172">Jun 2025</text>
  <rect class="bar-weak" x="200" y="156" width="63" height="32" rx="3" />
  <text class="bar-value bar-value-weak" x="270" y="172">10M</text>

  <!-- ===== Row 4: Sep 2025 — 28M (weak) ===== -->
  <text class="row-label" x="190" y="220">Sep 2025</text>
  <rect class="bar-weak" x="200" y="204" width="176.4" height="32" rx="3" />
  <text class="bar-value bar-value-weak" x="384" y="220">28M</text>

  <!-- ===== Row 5: Dec 2025 — 55M (medium) ===== -->
  <text class="row-label" x="190" y="268">Dec 2025</text>
  <rect class="bar-medium" x="200" y="252" width="346.5" height="32" rx="3" />
  <text class="bar-value bar-value-medium" x="554" y="268">55M</text>

  <!-- ===== Row 6: May 2026 — 97M (strong / accent) ===== -->
  <text class="row-label" x="190" y="316">May 2026</text>
  <rect class="bar-strong" x="200" y="300" width="611.1" height="32" rx="3" />
  <text class="bar-value bar-value-strong" x="819" y="316" text-anchor="end">97M</text>
</svg>
