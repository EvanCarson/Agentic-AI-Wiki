<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ChatGPT logo">
  <!-- Speech bubble with a chat dot: a rounded rectangle bubble body
       with a tail pointing lower-left, and a single bold dot inside
       evoking a "thinking" or typing indicator.
       Bubble outline in currentColor; dot in accent. -->
  <path d="M 4 5 L 4 22 L 9 22 L 7 28 L 15 22 L 28 22 L 28 5 Z"
        fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linejoin="round" stroke-linecap="round" />
  <circle cx="16" cy="13.5" r="3" fill="var(--accent, #d4421e)" />
</svg>
