<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OpenAI logo">
  <!-- Stylized orbital ring mark: one outer circle, one small inner dot,
       and three radiating arcs at 120° suggesting a spinning geometry
       evocative of OpenAI's rotational mark without reproducing it. -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="currentColor" stroke-width="2.5" />
  <circle cx="16" cy="16" r="3" fill="currentColor" />
  <!-- Three arcs at 0°, 120°, 240° — short curved strokes on the ring -->
  <path d="M 16 4.5 A 11.5 11.5 0 0 1 24.5 8.5" fill="none" stroke="var(--accent, #d4421e)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 27.3 19.5 A 11.5 11.5 0 0 1 19 27.3" fill="none" stroke="var(--accent, #d4421e)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 8.5 27.3 A 11.5 11.5 0 0 1 4.7 19.5" fill="none" stroke="var(--accent, #d4421e)" stroke-width="2.5" stroke-linecap="round" />
</svg>
