<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="GitHub logo">
  <!-- Abstract octocat silhouette: a round head with small ear-nubs and
       four tentacle-like limbs radiating from the lower half.
       Head circle in currentColor; tentacles in accent. -->
  <circle cx="16" cy="13" r="8" fill="currentColor" />
  <!-- Two ear nubs on top of the head -->
  <rect x="10" y="5.5" width="3" height="3" rx="1.5" fill="currentColor" />
  <rect x="19" y="5.5" width="3" height="3" rx="1.5" fill="currentColor" />
  <!-- Four tentacles curving outward from lower head -->
  <path d="M 10 19 Q 6 22 5 27" fill="none" stroke="var(--accent, #d4421e)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 13 21 Q 11 25 10 29" fill="none" stroke="var(--accent, #d4421e)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 19 21 Q 21 25 22 29" fill="none" stroke="var(--accent, #d4421e)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 22 19 Q 26 22 27 27" fill="none" stroke="var(--accent, #d4421e)" stroke-width="2.5" stroke-linecap="round" />
</svg>
