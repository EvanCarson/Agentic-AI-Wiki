<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Cursor logo">
  <!-- Pointer/arrow cursor shape: classic I-beam-free arrow pointing
       upper-left, with a small tail notch. Body in currentColor;
       the tip highlight in accent for recognizability at small sizes. -->
  <path d="M 5 5 L 5 24 L 10 19 L 14 27 L 17 25.5 L 13 18 L 20 18 Z" fill="currentColor" />
  <!-- Accent tip highlight at the arrow's leading corner -->
  <polygon points="5,5 5,10 10,10" fill="var(--accent, #d4421e)" />
</svg>
