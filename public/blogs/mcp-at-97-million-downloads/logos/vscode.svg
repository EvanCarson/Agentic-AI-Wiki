<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="VS Code logo">
  <!-- Code-bracket motif: bold "<" and ">" angle brackets flanking a
       centered forward-slash, evoking the VS Code icon's bracket aesthetic.
       Brackets in currentColor; slash in accent. -->
  <polyline points="12,7 4,16 12,25" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="20,7 28,16 20,25" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="19" y1="6" x2="13" y2="26" stroke="var(--accent, #d4421e)" stroke-width="2.5" stroke-linecap="round" />
</svg>
