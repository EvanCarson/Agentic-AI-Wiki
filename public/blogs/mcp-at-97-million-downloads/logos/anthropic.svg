<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Anthropic logo">
  <!-- Stylized "A" — two angled legs meeting at a sharp apex, with an
       accent crossbar slightly lower than center for optical balance.
       Legs are wider at the base to ground the mark at small sizes. -->
  <path d="M 16 3 L 4 29 L 8.5 29 L 16 12.5 L 23.5 29 L 28 29 Z" fill="currentColor" />
  <rect x="11" y="20" width="10" height="2.5" rx="1.25" fill="var(--accent, #d4421e)" />
</svg>
