<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Vercel logo">
  <!-- Equilateral triangle pointing upward — Vercel's geometric mark.
       Filled in currentColor; accent stroke on the bottom edge for depth. -->
  <path d="M 16 3 L 30 29 L 2 29 Z" fill="currentColor" />
  <line x1="2" y1="29" x2="30" y2="29" stroke="var(--accent, #d4421e)" stroke-width="2.5" stroke-linecap="round" />
</svg>
