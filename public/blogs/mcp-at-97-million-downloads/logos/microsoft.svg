<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Microsoft logo">
  <!-- Four-quadrant grid: the classic Microsoft "window" motif.
       Two squares on top, two on bottom, with a small gutter gap.
       Top-left quadrant in accent for color accent; rest in currentColor. -->
  <rect x="3"  y="3"  width="12" height="12" rx="1.5" fill="var(--accent, #d4421e)" />
  <rect x="17" y="3"  width="12" height="12" rx="1.5" fill="currentColor" />
  <rect x="3"  y="17" width="12" height="12" rx="1.5" fill="currentColor" />
  <rect x="17" y="17" width="12" height="12" rx="1.5" fill="currentColor" opacity="0.65" />
</svg>
