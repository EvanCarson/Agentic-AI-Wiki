  <!-- Legend -->
  <rect class="legend-box-w" x="160" y="362" width="14" height="14" rx="3" />
  <text class="legend-text" x="181" y="369">Weak / No</text>

  <rect class="legend-box-m" x="268" y="362" width="14" height="14" rx="3" />
  <text class="legend-text" x="289" y="369">Medium / Yes</text>

  <rect class="legend-box-s" x="390" y="362" width="14" height="14" rx="3" />
  <text class="legend-text" x="411" y="369">Strong / Native</text>
</svg>
