<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">MCP vendor support matrix</title>
  <desc id="d">Heatmap showing nine vendors (Anthropic, OpenAI, Google, Microsoft, GitHub, Vercel, VS Code, Cursor, ChatGPT) rated across four MCP dimensions: MCP Client, MCP Server, First-party Docs, and Registry Contribution. Fill color encodes level: light for weak, soft orange for medium, solid accent for strong.</desc>
  <style>
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <!--
    Layout:
    Row labels left margin: 160px (text x=152, end-anchored)
    4 columns × 170px = 680px; columns centered at x=245, 415, 585, 755
    Column left edges: 160, 330, 500, 670; right edges: 330, 500, 670, 840
    9 rows × 33px = 297px; rows start y=52
    Row tops: 52, 85, 118, 151, 184, 217, 250, 283, 316
    Row centers: 68.5, 101.5, 134.5, 167.5, 200.5, 233.5, 266.5, 299.5, 332.5
    Legend y: 365
  -->

  <!-- Column headers (two-line where needed) -->
  <text class="col-head" x="245" y="36">MCP Client</text>
  <text class="col-head" x="415" y="36">MCP Server</text>
  <text class="col-head" x="585" y="28">First-party</text>
  <text class="col-head" x="585" y="42">Docs</text>
  <text class="col-head" x="755" y="28">Registry</text>
  <text class="col-head" x="755" y="42">Contribution</text>

  <!-- ===== Row 1: Anthropic ===== -->
  <text class="row-head" x="152" y="68">Anthropic</text>
  <rect class="cell-strong" x="160" y="52" width="170" height="33" rx="4" />
  <text class="cell-text-inv" x="245" y="68">Native</text>
  <rect class="cell-strong" x="330" y="52" width="170" height="33" rx="4" />
  <text class="cell-text-inv" x="415" y="68">Native</text>
  <rect class="cell-strong" x="500" y="52" width="170" height="33" rx="4" />
  <text class="cell-text-inv" x="585" y="68">Strong</text>
  <rect class="cell-strong" x="670" y="52" width="170" height="33" rx="4" />
  <text class="cell-text-inv" x="755" y="68">Strong</text>

  <!-- ===== Row 2: OpenAI ===== -->
  <text class="row-head" x="152" y="101">OpenAI</text>
  <rect class="cell-strong" x="160" y="85" width="170" height="33" rx="4" />
  <text class="cell-text-inv" x="245" y="101">Yes</text>
  <rect class="cell-medium" x="330" y="85" width="170" height="33" rx="4" />
  <text class="cell-text" x="415" y="101">Yes</text>
  <rect class="cell-strong" x="500" y="85" width="170" height="33" rx="4" />
  <text class="cell-text-inv" x="585" y="101">Strong</text>
  <rect class="cell-medium" x="670" y="85" width="170" height="33" rx="4" />
  <text class="cell-text" x="755" y="101">Medium</text>

  <!-- ===== Row 3: Google ===== -->
  <text class="row-head" x="152" y="134">Google</text>
  <rect class="cell-medium" x="160" y="118" width="170" height="33" rx="4" />
  <text class="cell-text" x="245" y="134">Yes</text>
  <rect class="cell-medium" x="330" y="118" width="170" height="33" rx="4" />
  <text class="cell-text" x="415" y="134">Yes</text>
  <rect class="cell-medium" x="500" y="118" width="170" height="33" rx="4" />
  <text class="cell-text" x="585" y="134">Yes</text>
  <rect class="cell-medium" x="670" y="118" width="170" height="33" rx="4" />
  <text class="cell-text" x="755" y="134">Medium</text>

