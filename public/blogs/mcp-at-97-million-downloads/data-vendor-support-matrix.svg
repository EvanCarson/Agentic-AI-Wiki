  <!-- ===== Row 6: Vercel ===== -->
  <text class="row-head" x="152" y="233">Vercel</text>
  <rect class="cell-medium" x="160" y="217" width="170" height="33" rx="4" />
  <text class="cell-text" x="245" y="233">Yes</text>
  <rect class="cell-strong" x="330" y="217" width="170" height="33" rx="4" />
  <text class="cell-text-inv" x="415" y="233">Yes</text>
  <rect class="cell-medium" x="500" y="217" width="170" height="33" rx="4" />
  <text class="cell-text" x="585" y="233">Yes</text>
  <rect class="cell-medium" x="670" y="217" width="170" height="33" rx="4" />
  <text class="cell-text" x="755" y="233">Medium</text>

  <!-- ===== Row 7: VS Code ===== -->
  <text class="row-head" x="152" y="266">VS Code</text>
  <rect class="cell-strong" x="160" y="250" width="170" height="33" rx="4" />
  <text class="cell-text-inv" x="245" y="266">Native</text>
  <rect class="cell-weak" x="330" y="250" width="170" height="33" rx="4" />
  <text class="cell-text" x="415" y="266">No</text>
  <rect class="cell-strong" x="500" y="250" width="170" height="33" rx="4" />
  <text class="cell-text-inv" x="585" y="266">Strong</text>
  <rect class="cell-medium" x="670" y="250" width="170" height="33" rx="4" />
  <text class="cell-text" x="755" y="266">Medium</text>

  <!-- ===== Row 8: Cursor ===== -->
  <text class="row-head" x="152" y="299">Cursor</text>
  <rect class="cell-strong" x="160" y="283" width="170" height="33" rx="4" />
  <text class="cell-text-inv" x="245" y="299">Native</text>
  <rect class="cell-weak" x="330" y="283" width="170" height="33" rx="4" />
  <text class="cell-text" x="415" y="299">No</text>
  <rect class="cell-strong" x="500" y="283" width="170" height="33" rx="4" />
  <text class="cell-text-inv" x="585" y="299">Strong</text>
  <rect class="cell-medium" x="670" y="283" width="170" height="33" rx="4" />
  <text class="cell-text" x="755" y="299">Medium</text>

  <!-- ===== Row 9: ChatGPT ===== -->
  <text class="row-head" x="152" y="332">ChatGPT</text>
  <rect class="cell-medium" x="160" y="316" width="170" height="33" rx="4" />
  <text class="cell-text" x="245" y="332">Yes</text>
  <rect class="cell-weak" x="330" y="316" width="170" height="33" rx="4" />
  <text class="cell-text" x="415" y="332">No</text>
  <rect class="cell-medium" x="500" y="316" width="170" height="33" rx="4" />
  <text class="cell-text" x="585" y="332">Medium</text>
  <rect class="cell-weak" x="670" y="316" width="170" height="33" rx="4" />
