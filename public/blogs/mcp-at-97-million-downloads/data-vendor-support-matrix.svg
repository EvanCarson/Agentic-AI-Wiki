  <text class="row-head" x="152" y="167">Microsoft</text>
  <rect class="cell-strong" x="160" y="151" width="170" height="33" rx="4" />
  <text class="cell-text-inv" x="245" y="167">Yes</text>
  <rect class="cell-strong" x="330" y="151" width="170" height="33" rx="4" />
  <text class="cell-text-inv" x="415" y="167">Yes</text>
  <rect class="cell-strong" x="500" y="151" width="170" height="33" rx="4" />
  <text class="cell-text-inv" x="585" y="167">Strong</text>
  <rect class="cell-strong" x="670" y="151" width="170" height="33" rx="4" />
  <text class="cell-text-inv" x="755" y="167">Strong</text>

  <!-- ===== Row 5: GitHub ===== -->
  <text class="row-head" x="152" y="200">GitHub</text>
  <rect class="cell-medium" x="160" y="184" width="170" height="33" rx="4" />
  <text class="cell-text" x="245" y="200">Yes</text>
  <rect class="cell-strong" x="330" y="184" width="170" height="33" rx="4" />
  <text class="cell-text-inv" x="415" y="200">Native</text>
  <rect class="cell-medium" x="500" y="184" width="170" height="33" rx="4" />
  <text class="cell-text" x="585" y="200">Yes</text>
  <rect class="cell-strong" x="670" y="184" width="170" height="33" rx="4" />
