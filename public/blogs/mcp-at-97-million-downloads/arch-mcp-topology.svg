<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">MCP topology — host, JSON-RPC, server, target</title>
  <desc id="d">Three-column diagram of the Model Context Protocol: an MCP Host on the left contains an LLM and three MCP Clients; bidirectional JSON-RPC connections cross the middle to three MCP Servers; each server connects to a real backing system on the right.</desc>
  <style>
    .box      { fill: var(--paper-2, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero-env { fill: var(--accent, #d4421e); stroke: none; rx: 12; ry: 12; }
    .adj      { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: var(--ink, #1a1a1a); }
    .label-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: var(--paper, #fff); }
    .label-sm { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: var(--ink, #1a1a1a); }
    .env-label{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: var(--paper, #fff); letter-spacing: .08em; text-anchor: middle; }
    .col-head { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: var(--muted, #888); letter-spacing: .06em; text-anchor: middle; }
    .proto-label { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: middle; }
    .sub      { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); marker-start: url(#arr-rev); }
    .arrow-r  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .llm-box  { fill: var(--paper, #fff); stroke: var(--ink, #1a1a1a); stroke-width: 1.5; }
    .client-box { fill: var(--paper, #fff); stroke: var(--paper, #fff); stroke-width: 1; opacity: .92; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
    <marker id="arr-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!--
    Layout:
    Col 1 (HOST envelope): x=30..250, center=140
    Col 2 (SERVERS): x=420..620, center=520
    Col 3 (REAL SYSTEMS): x=680..860, center=770
    Gap between col1 and col2: x=250..420 (protocol label centered at x=335)
    Gap between col2 and col3: x=620..680 (arrows)

    Row heights: rows at y=140, 240, 340 (three server/client pairs)
    LLM box: y=70..130

    HOST envelope: x=28, y=40, w=228, h=400
    Column headers: y=22
  -->

  <!-- Column headers -->
  <text class="col-head" x="142" y="22">MCP HOST</text>
  <text class="col-head" x="520" y="22">MCP SERVERS</text>
  <text class="col-head" x="770" y="22">REAL SYSTEMS</text>

  <!-- ===== LEFT COLUMN: MCP HOST envelope (hero accent) ===== -->
  <rect class="hero-env" x="28" y="38" width="228" height="412" rx="12" />
  <text class="env-label" x="142" y="58">MCP HOST</text>

  <!-- LLM box inside envelope -->
  <rect class="llm-box" x="54" y="68" width="176" height="60" rx="8" />
  <text class="label" x="142" y="99" text-anchor="middle" font-size="14" font-weight="600">LLM</text>
  <text class="sub" x="142" y="117" text-anchor="middle">reasoning engine</text>

  <!-- MCP Client 1 -->
  <rect class="client-box" x="54" y="160" width="176" height="54" rx="6" />
  <text class="label-inv" x="142" y="187" text-anchor="middle" font-size="12">MCP Client 1</text>
  <text class="label-inv" x="142" y="203" text-anchor="middle" font-size="10" opacity=".75">Filesystem</text>

  <!-- MCP Client 2 -->
  <rect class="client-box" x="54" y="228" width="176" height="54" rx="6" />
  <text class="label-inv" x="142" y="255" text-anchor="middle" font-size="12">MCP Client 2</text>
  <text class="label-inv" x="142" y="271" text-anchor="middle" font-size="10" opacity=".75">GitHub</text>

  <!-- MCP Client 3 -->
  <rect class="client-box" x="54" y="296" width="176" height="54" rx="6" />
  <text class="label-inv" x="142" y="323" text-anchor="middle" font-size="12">MCP Client 3</text>
  <text class="label-inv" x="142" y="339" text-anchor="middle" font-size="10" opacity=".75">Internal</text>

  <!-- Protocol label in middle gap -->
  <text class="proto-label" x="335" y="68">JSON-RPC over</text>
  <text class="proto-label" x="335" y="82">stdio / HTTP+SSE</text>

  <!-- ===== Bidirectional arrows: clients ↔ servers ===== -->
  <!-- Client 1 ↔ Server 1 (y=187) -->
  <line class="arrow" x1="256" y1="187" x2="418" y2="187" />

  <!-- Client 2 ↔ Server 2 (y=255) -->
  <line class="arrow" x1="256" y1="255" x2="418" y2="255" />

  <!-- Client 3 ↔ Server 3 (y=323) -->
  <line class="arrow" x1="256" y1="323" x2="418" y2="323" />

  <!-- ===== MIDDLE-RIGHT COLUMN: MCP SERVERS (adj / accent-soft) ===== -->
  <!-- Server 1: Filesystem server -->
  <rect class="adj" x="420" y="160" width="200" height="54" rx="8" />
  <text class="label" x="520" y="183" text-anchor="middle" font-weight="600">Filesystem server</text>
  <text class="sub" x="520" y="201" text-anchor="middle">tools: read, write, list</text>

  <!-- Server 2: GitHub server -->
  <rect class="adj" x="420" y="228" width="200" height="54" rx="8" />
  <text class="label" x="520" y="251" text-anchor="middle" font-weight="600">GitHub server</text>
  <text class="sub" x="520" y="269" text-anchor="middle">tools: repos, PRs, issues</text>

  <!-- Server 3: Pinterest internal server -->
  <rect class="adj" x="420" y="296" width="200" height="54" rx="8" />
  <text class="label" x="520" y="315" text-anchor="middle" font-weight="600">Pinterest internal</text>
  <text class="sub" x="520" y="333" text-anchor="middle">server (custom)</text>

  <!-- ===== Arrows: servers → real systems ===== -->
  <line class="arrow-r" x1="622" y1="187" x2="678" y2="187" />
  <line class="arrow-r" x1="622" y1="255" x2="678" y2="255" />
  <line class="arrow-r" x1="622" y1="323" x2="678" y2="323" />

  <!-- ===== RIGHT COLUMN: REAL SYSTEMS (paper-2 / neutral) ===== -->
  <!-- System 1: /path/to/repo -->
  <rect class="box" x="680" y="160" width="188" height="54" rx="8" />
  <text class="label" x="774" y="183" text-anchor="middle">/path/to/repo</text>
  <text class="sub" x="774" y="201" text-anchor="middle">local filesystem</text>

  <!-- System 2: api.github.com -->
  <rect class="box" x="680" y="228" width="188" height="54" rx="8" />
  <text class="label" x="774" y="251" text-anchor="middle">api.github.com</text>
  <text class="sub" x="774" y="269" text-anchor="middle">REST / GraphQL API</text>

  <!-- System 3: Pinterest data warehouse -->
  <rect class="box" x="680" y="296" width="188" height="54" rx="8" />
  <text class="label" x="774" y="315" text-anchor="middle">Pinterest data</text>
  <text class="sub" x="774" y="333" text-anchor="middle">warehouse</text>

  <!-- LLM → Client connector lines (dashed, inside envelope) -->
  <line stroke="var(--paper, #fff)" stroke-width="1" stroke-dasharray="4 3" x1="142" y1="128" x2="142" y2="160" />
  <line stroke="var(--paper, #fff)" stroke-width="1" stroke-dasharray="4 3" x1="142" y1="214" x2="142" y2="228" />
  <line stroke="var(--paper, #fff)" stroke-width="1" stroke-dasharray="4 3" x1="142" y1="282" x2="142" y2="296" />
</svg>
