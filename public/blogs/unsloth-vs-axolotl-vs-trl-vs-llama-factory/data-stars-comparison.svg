<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="stars-title stars-desc">
  <title id="stars-title">GitHub stars comparison</title>
  <desc id="stars-desc">Horizontal bar chart of GitHub stars observed on 4 August 2026: LlamaFactory 73,738, Unsloth 69,508, TRL 18,994, Axolotl 12,303.</desc>
  <defs>
    <filter id="shadow-bar" x="-2%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--ink, #1a1a1a)" flood-opacity="0.10" />
    </filter>
  </defs>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .proj-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .bar-val      { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; dominant-baseline: central; }
    .grid-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: middle; }
    .grid-line    { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .bar-primary  { fill: var(--accent, #d4421e); filter: url(#shadow-bar); }
    .bar-secondary{ fill: var(--accent-soft, #f5c5b8); filter: url(#shadow-bar); }
    .bar-tertiary { fill: var(--surface, #f0ede8); filter: url(#shadow-bar); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
  </style>

  <text class="chart-title" x="450" y="38" text-anchor="middle">GitHub stars, observed 4 Aug 2026</text>

  <line class="grid-line" x1="368" y1="70" x2="368" y2="326" />
  <line class="grid-line" x1="536" y1="70" x2="536" y2="326" />
  <line class="grid-line" x1="705" y1="70" x2="705" y2="326" />

  <text class="grid-label" x="368" y="341">20K</text>
  <text class="grid-label" x="536" y="341">40K</text>
  <text class="grid-label" x="705" y="341">60K</text>

  <line x1="200" y1="326" x2="820" y2="326" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" />

  <text class="proj-label" x="192" y="112">LlamaFactory</text>
  <rect class="bar-primary" x="200" y="90" width="620" height="44" rx="5" ry="5" />
  <text class="bar-val" x="828" y="112" style="fill: var(--accent, #d4421e);">73,738</text>

  <text class="proj-label" x="192" y="172">Unsloth</text>
  <rect class="bar-secondary" x="200" y="150" width="584" height="44" rx="5" ry="5" />
  <text class="bar-val" x="792" y="172" style="fill: var(--ink, #1a1a1a);">69,508</text>

  <text class="proj-label" x="192" y="232">TRL</text>
  <rect class="bar-tertiary" x="200" y="210" width="160" height="44" rx="5" ry="5" />
  <text class="bar-val" x="368" y="232" style="fill: var(--muted, #888);">18,994</text>

  <text class="proj-label" x="192" y="292">Axolotl</text>
  <rect class="bar-tertiary" x="200" y="270" width="103" height="44" rx="5" ry="5" />
  <text class="bar-val" x="311" y="292" style="fill: var(--muted, #888);">12,303</text>
</svg>
