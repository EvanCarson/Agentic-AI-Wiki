<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Parallelism support matrix</title>
  <desc id="d">Four project rows against five parallelism columns. Axolotl supports DDP, FSDP or ZeRO, tensor parallel, context parallel and expert parallel. TRL supports the first four and has no first-class expert parallelism. LlamaFactory supports the first two fully and offers tensor and context parallel only for full fine-tuning on pretraining and SFT stages. Unsloth supports the first two and has none of the last three as training configuration.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .head { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: var(--ink, #1a1a1a); opacity: .8; text-anchor: middle; }
    .row-label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); text-anchor: middle; dominant-baseline: central; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-mut { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--muted, #888); text-anchor: middle; dominant-baseline: central; }
    .legend { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--muted, #888); dominant-baseline: central; }
    .strong { fill: var(--accent, #d4421e); }
    .medium { fill: var(--accent-soft, #f5c5b8); }
    .weak { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
  </style>

  <text class="chart-title" x="450" y="28">First-class parallelism, as documented by each project</text>

  <text class="head" x="255" y="80">DDP</text>
  <text class="head" x="391" y="72">FSDP /</text>
  <text class="head" x="391" y="88">ZeRO</text>
  <text class="head" x="527" y="72">Tensor</text>
  <text class="head" x="527" y="88">parallel</text>
  <text class="head" x="663" y="72">Context</text>
  <text class="head" x="663" y="88">parallel</text>
  <text class="head" x="799" y="72">Expert</text>
  <text class="head" x="799" y="88">parallel</text>

  <text class="row-label" x="178" y="131">Axolotl</text>
  <rect class="strong" x="190" y="105" width="130" height="52" rx="6" ry="6" />
  <text class="cell-inv" x="255" y="131">Yes</text>
  <rect class="strong" x="326" y="105" width="130" height="52" rx="6" ry="6" />
  <text class="cell-inv" x="391" y="131">FSDP2</text>
  <rect class="strong" x="462" y="105" width="130" height="52" rx="6" ry="6" />
  <text class="cell-inv" x="527" y="131">Yes</text>
  <rect class="strong" x="598" y="105" width="130" height="52" rx="6" ry="6" />
  <text class="cell-inv" x="663" y="131">Yes</text>
  <rect class="strong" x="734" y="105" width="130" height="52" rx="6" ry="6" />
  <text class="cell-inv" x="799" y="131">Yes (MoE)</text>

  <text class="row-label" x="178" y="191">TRL</text>
  <rect class="strong" x="190" y="165" width="130" height="52" rx="6" ry="6" />
  <text class="cell-inv" x="255" y="191">Yes</text>
  <rect class="strong" x="326" y="165" width="130" height="52" rx="6" ry="6" />
  <text class="cell-inv" x="391" y="191">Both</text>
  <rect class="strong" x="462" y="165" width="130" height="52" rx="6" ry="6" />
  <text class="cell-inv" x="527" y="191">Yes</text>
  <rect class="strong" x="598" y="165" width="130" height="52" rx="6" ry="6" />
  <text class="cell-inv" x="663" y="191">Ring + Ulysses</text>
  <rect class="weak" x="734" y="165" width="130" height="52" rx="6" ry="6" />
  <text class="cell-mut" x="799" y="191">None</text>

  <text class="row-label" x="178" y="251">LlamaFactory</text>
  <rect class="strong" x="190" y="225" width="130" height="52" rx="6" ry="6" />
  <text class="cell-inv" x="255" y="251">Yes</text>
  <rect class="strong" x="326" y="225" width="130" height="52" rx="6" ry="6" />
  <text class="cell-inv" x="391" y="251">ZeRO-3</text>
  <rect class="medium" x="462" y="225" width="130" height="52" rx="6" ry="6" />
  <text class="cell" x="527" y="243">Full FT only</text>
  <text class="cell" x="527" y="261">pt / sft</text>
  <rect class="medium" x="598" y="225" width="130" height="52" rx="6" ry="6" />
  <text class="cell" x="663" y="243">Full FT only</text>
  <text class="cell" x="663" y="261">pt / sft</text>
  <rect class="weak" x="734" y="225" width="130" height="52" rx="6" ry="6" />
  <text class="cell-mut" x="799" y="251">None</text>

  <text class="row-label" x="178" y="311">Unsloth</text>
  <rect class="strong" x="190" y="285" width="130" height="52" rx="6" ry="6" />
  <text class="cell-inv" x="255" y="311">Yes</text>
  <rect class="strong" x="326" y="285" width="130" height="52" rx="6" ry="6" />
  <text class="cell-inv" x="391" y="311">Via Accelerate</text>
  <rect class="weak" x="462" y="285" width="130" height="52" rx="6" ry="6" />
  <text class="cell-mut" x="527" y="311">None</text>
  <rect class="weak" x="598" y="285" width="130" height="52" rx="6" ry="6" />
  <text class="cell-mut" x="663" y="311">None</text>
  <rect class="weak" x="734" y="285" width="130" height="52" rx="6" ry="6" />
  <text class="cell-mut" x="799" y="311">None</text>

  <rect class="strong" x="190" y="358" width="16" height="16" rx="3" ry="3" />
  <text class="legend" x="214" y="366">First-class</text>
  <rect class="medium" x="320" y="358" width="16" height="16" rx="3" ry="3" />
  <text class="legend" x="344" y="366">Gated to some stages</text>
  <rect class="weak" x="520" y="358" width="16" height="16" rx="3" ry="3" />
  <text class="legend" x="544" y="366">Not offered for training</text>
</svg>
