<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">How the four fine-tuning projects relate to each other</title>
  <desc id="d">PyTorch, transformers, PEFT and accelerate form the base layer. TRL sits above it as the trainer API. Axolotl and LlamaFactory sit above TRL and import its trainers. Unsloth sits to the side and reaches into both lower layers, patching transformers and rewriting TRL trainer source at import time.</desc>
  <style>
    .col-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .col-title-inv { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .75; text-anchor: middle; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .9; text-anchor: middle; }
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .foot { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--muted, #888); text-anchor: middle; }
    .box { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .cut { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="chart-title" x="450" y="32">What each project does to the layer below</text>

  <rect class="adj" x="60" y="70" width="250" height="85" rx="8" ry="8" />
  <text class="col-title" x="185" y="100">Axolotl</text>
  <text class="sub" x="185" y="124">imports TRL trainers</text>
  <text class="sub" x="185" y="143">plus own Triton kernels</text>

  <rect class="adj" x="340" y="70" width="250" height="85" rx="8" ry="8" />
  <text class="col-title" x="465" y="100">LlamaFactory</text>
  <text class="sub" x="465" y="124">wraps transformers Trainer</text>
  <text class="sub" x="465" y="143">TRL on preference stages</text>

  <rect class="adj" x="650" y="70" width="210" height="280" rx="8" ry="8" />
  <text class="col-title" x="755" y="105">Unsloth</text>
  <text class="sub" x="755" y="140">Triton kernels</text>
  <text class="sub" x="755" y="163">patches transformers</text>
  <text class="sub" x="755" y="186">rewrites TRL source</text>
  <text class="sub" x="755" y="209">at import time</text>
  <text class="sub" x="755" y="240">so it must pin</text>
  <text class="sub" x="755" y="263">what it rewrites</text>

  <rect class="hero" x="60" y="195" width="530" height="85" rx="8" ry="8" />
  <text class="col-title-inv" x="325" y="225">TRL &#183; the trainer API</text>
  <text class="sub-inv" x="325" y="249">SFT &#183; DPO &#183; GRPO &#183; KTO &#183; Reward &#183; RLOO stable</text>
  <text class="sub-inv" x="325" y="268">ORPO &#183; CPO &#183; PPO &#183; PRM in trl.experimental</text>

  <rect class="box" x="60" y="320" width="530" height="70" rx="8" ry="8" />
  <text class="col-title" x="325" y="352">PyTorch &#183; transformers &#183; PEFT &#183; accelerate</text>
  <text class="sub" x="325" y="374">the layer everything ultimately calls</text>

  <path class="arrow" d="M 185 155 L 185 189" />
  <path class="arrow" d="M 465 155 L 465 189" />
  <path class="arrow" d="M 325 280 L 325 314" />

  <path class="cut" d="M 650 237 L 596 237" />
  <path class="cut" d="M 650 300 L 620 300 L 620 355 L 596 355" />

  <text class="foot" x="450" y="440">Three of them stack. One reaches sideways into the libraries it sits on.</text>
  <text class="foot" x="450" y="462">That is why two of the four still pin the TRL 0.x line while TRL ships 1.9.2.</text>
</svg>
