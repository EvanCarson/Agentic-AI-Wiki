<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="st sd">
  <title id="st">Issuer model versus broker model for agent access</title>
  <desc id="sd">In the issuer model an identity provider mints a token that the agent holds and presents to a resource, so revocation only lands when that token expires. In the broker model the agent never receives a secret: it asks a broker, the user approves, and the broker supplies the credential to the resource directly, so revocation lands at the next request.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr3); }
    .rule   { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="sub" x="40" y="30" text-anchor="start">Issuer model — Okta, Entra, Gemini Enterprise</text>

  <rect class="hero" x="40" y="44" width="180" height="56" />
  <text class="label-inv" x="130" y="78" text-anchor="middle">Identity provider</text>

  <path class="arrow" d="M 220 72 L 310 72" />
  <text class="sub" x="265" y="62" text-anchor="middle">mints</text>

  <rect class="adj" x="310" y="44" width="180" height="56" />
  <text class="label" x="400" y="70" text-anchor="middle">Agent holds</text>
  <text class="label" x="400" y="90" text-anchor="middle">a token</text>

  <path class="arrow" d="M 490 72 L 580 72" />
  <text class="sub" x="535" y="62" text-anchor="middle">presents</text>

  <rect class="box" x="580" y="44" width="180" height="56" />
  <text class="label" x="670" y="78" text-anchor="middle">Resource</text>

  <text class="sub" x="400" y="130" text-anchor="middle">Revoke at the provider and the held token keeps working until it expires.</text>

  <path class="rule" d="M 40 160 L 860 160" />

  <text class="sub" x="40" y="194" text-anchor="start">Broker model — 1Password for Agents</text>

  <rect class="adj" x="40" y="208" width="180" height="56" />
  <text class="label" x="130" y="242" text-anchor="middle">Agent asks</text>

  <path class="arrow" d="M 220 236 L 310 236" />

  <rect class="hero" x="310" y="208" width="180" height="56" />
  <text class="label-inv" x="400" y="234" text-anchor="middle">Credential broker</text>
  <text class="label-inv" x="400" y="254" text-anchor="middle">verifies the agent key</text>

  <path class="arrow" d="M 490 236 L 580 236" />
  <text class="sub" x="535" y="226" text-anchor="middle">fills</text>

  <rect class="box" x="580" y="208" width="180" height="56" />
  <text class="label" x="670" y="242" text-anchor="middle">Resource</text>

  <rect class="box" x="310" y="300" width="180" height="48" />
  <text class="label" x="400" y="330" text-anchor="middle">User approves</text>

  <path class="arrow" d="M 400 300 L 400 268" />

  <text class="sub" x="400" y="378" text-anchor="middle">The agent never receives the secret, so revocation lands at the next request.</text>
  <text class="sub" x="400" y="402" text-anchor="middle">Lifetime of what the agent holds is the axis that separates every product here.</text>
</svg>
