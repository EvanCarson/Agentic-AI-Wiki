<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="mt md">
  <title id="mt">Four agent-identity products against four properties</title>
  <desc id="md">Rows are Okta Agent SSO, Microsoft Entra Agent ID, Gemini Enterprise agent identity and 1Password for Agents. Columns ask whether the agent gets a directory principal, whether a token is minted per connection, whether policy is checked at every mint, and whether the secret is withheld from the agent. Okta is strong on the first three; the two directory products leave the per-connection behaviour undocumented; 1Password issues no principal but is the only one that never lets the agent hold the secret.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .cell     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .rowlab { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="head" x="307" y="32" text-anchor="middle">Directory</text>
  <text class="head" x="307" y="50" text-anchor="middle">principal</text>
  <text class="head" x="472" y="32" text-anchor="middle">Token minted</text>
  <text class="head" x="472" y="50" text-anchor="middle">per connection</text>
  <text class="head" x="637" y="32" text-anchor="middle">Policy checked</text>
  <text class="head" x="637" y="50" text-anchor="middle">at every mint</text>
  <text class="head" x="802" y="32" text-anchor="middle">Secret withheld</text>
  <text class="head" x="802" y="50" text-anchor="middle">from the agent</text>

  <text class="rowlab" x="215" y="105" text-anchor="end">Okta Agent SSO</text>
  <rect class="strong" x="230" y="70" width="155" height="60" />
  <text class="cell-inv" x="307" y="105" text-anchor="middle">Universal Directory</text>
  <rect class="strong" x="395" y="70" width="155" height="60" />
  <text class="cell-inv" x="472" y="105" text-anchor="middle">ID-JAG exchange</text>
  <rect class="strong" x="560" y="70" width="155" height="60" />
  <text class="cell-inv" x="637" y="105" text-anchor="middle">IdP decides</text>
  <rect class="mid" x="725" y="70" width="155" height="60" />
  <text class="cell" x="802" y="105" text-anchor="middle">Token, not password</text>

  <text class="rowlab" x="215" y="180" text-anchor="end">Entra Agent ID</text>
  <rect class="strong" x="230" y="145" width="155" height="60" />
  <text class="cell-inv" x="307" y="180" text-anchor="middle">Directory object</text>
  <rect class="weak" x="395" y="145" width="155" height="60" />
  <text class="cell" x="472" y="180" text-anchor="middle">Not documented</text>
  <rect class="mid" x="560" y="145" width="155" height="60" />
  <text class="cell" x="637" y="180" text-anchor="middle">Paid add-on</text>
  <rect class="weak" x="725" y="145" width="155" height="60" />
  <text class="cell" x="802" y="180" text-anchor="middle">Not documented</text>

  <text class="rowlab" x="215" y="255" text-anchor="end">Gemini Enterprise</text>
  <rect class="strong" x="230" y="220" width="155" height="60" />
  <text class="cell-inv" x="307" y="255" text-anchor="middle">Workspace account</text>
  <rect class="weak" x="395" y="220" width="155" height="60" />
  <text class="cell" x="472" y="255" text-anchor="middle">Not documented</text>
  <rect class="mid" x="560" y="220" width="155" height="60" />
  <text class="cell" x="637" y="255" text-anchor="middle">Admin console</text>
  <rect class="weak" x="725" y="220" width="155" height="60" />
  <text class="cell" x="802" y="255" text-anchor="middle">Not documented</text>

  <text class="rowlab" x="215" y="330" text-anchor="end">1Password for Agents</text>
  <rect class="weak" x="230" y="295" width="155" height="60" />
  <text class="cell" x="307" y="330" text-anchor="middle">None issued</text>
  <rect class="mid" x="395" y="295" width="155" height="60" />
  <text class="cell" x="472" y="330" text-anchor="middle">Per request</text>
  <rect class="mid" x="560" y="295" width="155" height="60" />
  <text class="cell" x="637" y="330" text-anchor="middle">User approves</text>
  <rect class="strong" x="725" y="295" width="155" height="60" />
  <text class="cell-inv" x="802" y="330" text-anchor="middle">Filled, never shown</text>

  <rect class="strong" x="230" y="372" width="14" height="14" />
  <text class="leg" x="252" y="384" text-anchor="start">Strong</text>
  <rect class="mid" x="330" y="372" width="14" height="14" />
  <text class="leg" x="352" y="384" text-anchor="start">Partial</text>
  <rect class="weak" x="430" y="372" width="14" height="14" />
  <text class="leg" x="452" y="384" text-anchor="start">Absent or unstated</text>
</svg>
