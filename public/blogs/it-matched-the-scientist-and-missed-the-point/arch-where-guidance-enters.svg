<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="gat gad">
  <title id="gat">Where guidance enters an agent evaluation</title>
  <desc id="gad">A diagram of four channels through which help reaches an agent during an evaluation: the task statement, the method specification, the tool and environment scaffolding, and the grader's tolerance. All four feed the agent loop, which produces a run that is scored. The diagram marks which channels a conventional benchmark holds fixed and which the two new benchmarks vary.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .lab-i { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-i { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .tag   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; letter-spacing: .03em; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#garr); }
    .hd    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); opacity: .65; letter-spacing: .05em; }
  </style>
  <defs>
    <marker id="garr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="hd" x="40" y="40">FOUR CHANNELS OF HELP</text>

  <rect class="box" x="40" y="60" width="240" height="72" />
  <text class="label" x="56" y="88">Task statement</text>
  <text class="sub" x="56" y="110">what counts as done</text>
  <text class="tag" x="56" y="126">usually fixed</text>

  <rect class="adj" x="40" y="152" width="240" height="72" />
  <text class="label" x="56" y="180">Method specification</text>
  <text class="sub" x="56" y="202">parameters, procedure, hints</text>
  <text class="tag" x="56" y="218">CompMat-Bench varies this</text>

  <rect class="box" x="40" y="244" width="240" height="72" />
  <text class="label" x="56" y="272">Tools &amp; environment</text>
  <text class="sub" x="56" y="294">pre-run results, retries, limits</text>
  <text class="tag" x="56" y="310">usually fixed</text>

  <rect class="adj" x="40" y="336" width="240" height="72" />
  <text class="label" x="56" y="364">What the grader rewards</text>
  <text class="sub" x="56" y="386">prediction, or explanation</text>
  <text class="tag" x="56" y="402">EurekaBench splits this</text>

  <rect class="hero" x="390" y="186" width="190" height="110" />
  <text class="lab-i" x="485" y="230" text-anchor="middle">Agent loop</text>
  <text class="sub-i" x="485" y="254" text-anchor="middle">plan, call tools,</text>
  <text class="sub-i" x="485" y="270" text-anchor="middle">read results, write</text>

  <rect class="box" x="670" y="130" width="190" height="80" />
  <text class="label" x="765" y="166" text-anchor="middle">Prediction</text>
  <text class="sub" x="765" y="188" text-anchor="middle">checkable against held-out data</text>

  <rect class="box" x="670" y="272" width="190" height="80" />
  <text class="label" x="765" y="308" text-anchor="middle">Explanation</text>
  <text class="sub" x="765" y="330" text-anchor="middle">checkable against listed insights</text>

  <path class="arrow" d="M 280 96 L 380 210" />
  <path class="arrow" d="M 280 188 L 380 222" />
  <path class="arrow" d="M 280 280 L 380 258" />
  <path class="arrow" d="M 280 372 L 380 272" />
  <path class="arrow" d="M 580 222 L 665 180" />
  <path class="arrow" d="M 580 262 L 665 302" />

  <text class="sub" x="40" y="452">A single reported score is a reading taken with all four channels held at one setting.</text>
  <text class="sub" x="40" y="474">Move the second channel and the number moves; split the fourth and one score becomes two that disagree.</text>
</svg>
