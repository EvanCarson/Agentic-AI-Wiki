<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="cmt cmd">
  <title id="cmt">CompMat-Bench evaluation conditions</title>
  <desc id="cmd">A two-by-two grid of evaluation conditions. Rows are single tasks and multi-step workflows; columns are full and reduced methodological guidance. The single-task, full-guidance cell is the only one carrying the published headline range of 66.0 to 90.4 percent pass rate; pass rates decline toward the workflow and reduced-guidance cells.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); opacity: .7; letter-spacing: .04em; }
    .cell  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .lab   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .lab-i { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-i { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#cmarr); }
    .note  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>
  <defs>
    <marker id="cmarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="40" y="34">94 tasks, four conditions — the headline number lives in one cell</text>

  <text class="hd" x="300" y="78" text-anchor="middle">FULL GUIDANCE</text>
  <text class="hd" x="600" y="78" text-anchor="middle">REDUCED GUIDANCE</text>
  <text class="hd" x="150" y="150" text-anchor="middle">SINGLE TASK</text>
  <text class="hd" x="150" y="270" text-anchor="middle">WORKFLOW</text>

  <rect class="hero" x="210" y="96" width="180" height="90" />
  <text class="lab-i" x="300" y="130" text-anchor="middle">66.0–90.4%</text>
  <text class="sub-i" x="300" y="152" text-anchor="middle">published range,</text>
  <text class="sub-i" x="300" y="168" text-anchor="middle">three LLMs</text>

  <rect class="adj" x="510" y="96" width="180" height="90" />
  <text class="lab" x="600" y="136" text-anchor="middle">lower</text>
  <text class="sub" x="600" y="158" text-anchor="middle">method withheld</text>

  <rect class="adj" x="210" y="216" width="180" height="90" />
  <text class="lab" x="300" y="256" text-anchor="middle">lower</text>
  <text class="sub" x="300" y="278" text-anchor="middle">steps compound</text>

  <rect class="cell" x="510" y="216" width="180" height="90" />
  <text class="lab" x="600" y="256" text-anchor="middle">lowest</text>
  <text class="sub" x="600" y="278" text-anchor="middle">both withdrawn</text>

  <path class="arrow" d="M 400 141 L 500 141" />
  <path class="arrow" d="M 300 196 L 300 208" />
  <text class="note" x="40" y="352">Most remaining failures are scientific-reasoning errors, not software errors — grading is rule-based, with no LLM judge.</text>
</svg>
