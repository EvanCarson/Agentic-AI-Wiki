<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ebt ebd">
  <title id="ebt">EurekaBench: predictive accuracy against insight score</title>
  <desc id="ebd">Grouped bars comparing an agent and a human reference on two axes. On predictive accuracy the agent scores 47.4 percent against the human 48.8 percent, near parity. On the scientific-insight score the agent scores 29.4 percent against the human 69.7 percent, a gap of more than forty points.</desc>
  <style>
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .axis   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .7; }
    .lab    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .grp    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .bar-a  { fill: var(--accent, #d4421e); }
    .bar-h  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .val-a  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--accent, #d4421e); }
    .val-h  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .grid   { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .gap    { stroke: var(--accent, #d4421e); stroke-width: 1.25; stroke-dasharray: 4 3; fill: none; }
  </style>

  <text class="ttl" x="40" y="34">Score (%), agent vs human reference</text>

  <line class="grid" x1="300" y1="60" x2="300" y2="330" />
  <line class="grid" x1="430" y1="60" x2="430" y2="330" />
  <line class="grid" x1="560" y1="60" x2="560" y2="330" />
  <line class="grid" x1="690" y1="60" x2="690" y2="330" />
  <line class="grid" x1="820" y1="60" x2="820" y2="330" />
  <text class="axis" x="300" y="352" text-anchor="middle">20</text>
  <text class="axis" x="430" y="352" text-anchor="middle">40</text>
  <text class="axis" x="560" y="352" text-anchor="middle">60</text>
  <text class="axis" x="690" y="352" text-anchor="middle">80</text>
  <text class="axis" x="820" y="352" text-anchor="middle">100</text>

  <text class="grp" x="40" y="84">Predictive accuracy</text>
  <rect class="bar-a" x="170" y="96" width="308" height="30" />
  <text class="lab" x="46" y="117">agent</text>
  <text class="val-a" x="492" y="117">47.4</text>
  <rect class="bar-h" x="170" y="136" width="317" height="30" />
  <text class="lab" x="46" y="157">human</text>
  <text class="val-h" x="501" y="157">48.8</text>

  <text class="grp" x="40" y="218">Scientific-insight score</text>
  <rect class="bar-a" x="170" y="230" width="191" height="30" />
  <text class="lab" x="46" y="251">agent</text>
  <text class="val-a" x="375" y="251">29.4</text>
  <rect class="bar-h" x="170" y="270" width="453" height="30" />
  <text class="lab" x="46" y="291">human</text>
  <text class="val-h" x="637" y="291">69.7</text>

  <path class="gap" d="M 361 245 L 453 245 M 453 245 L 453 285 M 453 285 L 623 285" />
  <text class="note" x="40" y="384">Same runs, same tasks — 40.3 points apart on the axis the task was built around.</text>
</svg>
