<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="st sd">
  <title id="st">One model string, two computer-tool contracts</title>
  <desc id="sd">A single model box at the top branches into two platform paths. The Claude API path accepts only the computer_toolset_20260801 toolset, with a screenshot ceiling of 2,576 pixels on the long edge and 4,784 visual tokens, and 17 named members including zoom. The Amazon Bedrock path accepts only the earlier computer_20251124 tool version behind a beta header, with a ceiling of 1,568 pixels and about 1.15 megapixels. Neither platform accepts the other's tool version.</desc>
  <style>
    .sbox   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .shero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .sadj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .slabel { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .scode  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .sinv   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); }
    .ssub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sarrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#sarr); }
  </style>
  <defs>
    <marker id="sarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="shero" x="355" y="40" width="190" height="50" />
  <text class="sinv" x="450" y="71" text-anchor="middle">claude-opus-5-5</text>

  <path class="sarrow" d="M 450 90 L 450 120 L 200 120 L 200 146" />
  <path class="sarrow" d="M 450 90 L 450 120 L 700 120 L 700 146" />

  <rect class="sadj" x="85" y="150" width="230" height="50" />
  <text class="slabel" x="200" y="181" text-anchor="middle">Claude API</text>
  <rect class="sadj" x="585" y="150" width="230" height="50" />
  <text class="slabel" x="700" y="181" text-anchor="middle">Amazon Bedrock</text>

  <path class="sarrow" d="M 200 200 L 200 246" />
  <path class="sarrow" d="M 700 200 L 700 246" />

  <rect class="sbox" x="85" y="250" width="230" height="50" />
  <text class="scode" x="200" y="280" text-anchor="middle">computer_toolset_20260801</text>
  <rect class="sbox" x="585" y="250" width="230" height="50" />
  <text class="scode" x="700" y="280" text-anchor="middle">computer_20251124</text>

  <path class="sarrow" d="M 200 300 L 200 346" />
  <path class="sarrow" d="M 700 300 L 700 346" />

  <rect class="sbox" x="85" y="350" width="230" height="50" />
  <text class="slabel" x="200" y="381" text-anchor="middle">2,576px, 4,784 tokens</text>
  <rect class="sbox" x="585" y="350" width="230" height="50" />
  <text class="slabel" x="700" y="381" text-anchor="middle">1,568px, 1.15 MP</text>

  <text class="ssub" x="200" y="428" text-anchor="middle">17 named members, zoom among them</text>
  <text class="ssub" x="700" y="428" text-anchor="middle">beta header required</text>

  <text class="ssub" x="30" y="478">Neither platform accepts the other's tool version, and no model on the Claude API accepts both.</text>
</svg>
