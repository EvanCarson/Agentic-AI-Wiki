<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="pt pd">
  <title id="pt">Computer-tool availability by hosting platform</title>
  <desc id="pd">Five hosting platforms against the two computer tool versions. The Claude API and Google-managed Claude on Google Cloud carry the 2026 toolset at general availability and return an error for the earlier version on Claude 5.5 and later models. Amazon Bedrock, Claude Platform on AWS and Microsoft Foundry do not carry the toolset at all and offer only the earlier version in beta. No platform carries both.</desc>
  <style>
    .pt-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .pt-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .pt-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .pt-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .pt-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .pt-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .pt-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .pt-code   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); opacity: .75; }
    .pt-sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>
  <text class="pt-ttl" x="20" y="28">Which computer tool each platform will accept</text>
  <text class="pt-code" x="460" y="58" text-anchor="middle">computer_toolset_20260801</text>
  <text class="pt-code" x="740" y="58" text-anchor="middle">computer_20251124</text>

  <text class="pt-row" x="20" y="100">Claude API</text>
  <rect class="pt-strong" x="330" y="76" width="260" height="36" />
  <text class="pt-inv" x="460" y="100" text-anchor="middle">GA, the only option</text>
  <rect class="pt-weak" x="610" y="76" width="260" height="36" />
  <text class="pt-cell" x="740" y="100" text-anchor="middle">error on Claude 5.5+</text>

  <text class="pt-row" x="20" y="146">Claude on Google Cloud</text>
  <rect class="pt-strong" x="330" y="122" width="260" height="36" />
  <text class="pt-inv" x="460" y="146" text-anchor="middle">GA, the only option</text>
  <rect class="pt-weak" x="610" y="122" width="260" height="36" />
  <text class="pt-cell" x="740" y="146" text-anchor="middle">error on Claude 5.5+</text>

  <text class="pt-row" x="20" y="192">Amazon Bedrock</text>
  <rect class="pt-weak" x="330" y="168" width="260" height="36" />
  <text class="pt-cell" x="460" y="192" text-anchor="middle">not available</text>
  <rect class="pt-mid" x="610" y="168" width="260" height="36" />
  <text class="pt-cell" x="740" y="192" text-anchor="middle">beta, the only option</text>

  <text class="pt-row" x="20" y="238">Claude Platform on AWS</text>
  <rect class="pt-weak" x="330" y="214" width="260" height="36" />
  <text class="pt-cell" x="460" y="238" text-anchor="middle">not available</text>
  <rect class="pt-mid" x="610" y="214" width="260" height="36" />
  <text class="pt-cell" x="740" y="238" text-anchor="middle">beta, the only option</text>

  <text class="pt-row" x="20" y="284">Microsoft Foundry</text>
  <rect class="pt-weak" x="330" y="260" width="260" height="36" />
  <text class="pt-cell" x="460" y="284" text-anchor="middle">not available</text>
  <rect class="pt-mid" x="610" y="260" width="260" height="36" />
  <text class="pt-cell" x="740" y="284" text-anchor="middle">beta, the only option</text>

  <text class="pt-sub" x="20" y="334">Accent is generally available, the lighter tint is beta, plain is unavailable or rejected.</text>
  <text class="pt-sub" x="20" y="360">No row carries both columns, so a multi-platform deployment runs two tool contracts under one model name.</text>
  <text class="pt-sub" x="20" y="386">The two differ in request shape, in whether a beta header is required, and in the screenshot ceiling.</text>
</svg>
