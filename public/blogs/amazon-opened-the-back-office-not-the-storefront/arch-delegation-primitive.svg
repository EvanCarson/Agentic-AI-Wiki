<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="dt dd">
  <title id="dt">Two sides of one marketplace, one delegation primitive</title>
  <desc id="dd">A marketplace platform in the centre. On the seller side an agent reaches it through a partner account with scoped API credentials, a signed contract and a revocable grant. On the buyer side a third-party agent has only the shopper's own password, so the platform cannot tell delegation from credential sharing and blocks it.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .8; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
    .blocked { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="hero" x="350" y="200" width="200" height="90" />
  <text class="label-inv" x="450" y="238" text-anchor="middle">Marketplace</text>
  <text class="label-inv" x="450" y="262" text-anchor="middle">platform</text>

  <text class="head" x="30" y="40">Seller side — admitted</text>
  <rect class="adj" x="30" y="60" width="240" height="56" />
  <text class="label" x="150" y="84" text-anchor="middle">Seller's agent</text>
  <text class="sub" x="150" y="104" text-anchor="middle">runs in an outside AI client</text>

  <rect class="box" x="30" y="150" width="240" height="96" />
  <text class="label" x="150" y="174" text-anchor="middle">Partner account</text>
  <text class="sub" x="150" y="196" text-anchor="middle">scoped API credential</text>
  <text class="sub" x="150" y="214" text-anchor="middle">signed contract, named party</text>
  <text class="sub" x="150" y="232" text-anchor="middle">grant is revocable per seller</text>

  <path class="arrow" d="M 150 116 L 150 148" />
  <path class="arrow" d="M 270 198 L 346 230" />
  <text class="sub" x="300" y="190">verifiable</text>

  <text class="head" x="630" y="40">Buyer side — blocked</text>
  <rect class="box" x="630" y="60" width="240" height="56" />
  <text class="label" x="750" y="84" text-anchor="middle">Third-party shopping agent</text>
  <text class="sub" x="750" y="104" text-anchor="middle">acting for a consumer</text>

  <rect class="box" x="630" y="150" width="240" height="96" />
  <text class="label" x="750" y="174" text-anchor="middle">The shopper's own login</text>
  <text class="sub" x="750" y="196" text-anchor="middle">no registration, no agent identity</text>
  <text class="sub" x="750" y="214" text-anchor="middle">indistinguishable from the human</text>
  <text class="sub" x="750" y="232" text-anchor="middle">revoking it locks out the customer</text>

  <path class="arrow" d="M 750 116 L 750 148" />
  <path class="blocked" d="M 630 198 L 554 230" />
  <text class="sub" x="560" y="190">refused</text>

  <rect class="box" x="30" y="330" width="840" height="58" />
  <text class="label" x="450" y="354" text-anchor="middle">The difference is not the agent's capability. It is whether a delegation exists that the platform can verify, scope and revoke.</text>
  <text class="sub" x="450" y="376" text-anchor="middle">Seller-side delegation predates agents by a decade. Buyer-side delegation is what the commerce protocols are being built to supply.</text>

  <rect class="adj" x="30" y="410" width="840" height="58" />
  <text class="label" x="450" y="434" text-anchor="middle">Same platform sits on the UCP Tech Council — the body defining buyer-side agent delegation.</text>
  <text class="sub" x="450" y="456" text-anchor="middle">Not anti-agent. Anti-unmediated, and holding a seat where the mediation gets specified.</text>
</svg>
