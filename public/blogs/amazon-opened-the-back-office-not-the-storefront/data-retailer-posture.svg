<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="rt rd">
  <title id="rt">Retailer posture towards agents, by side of the market</title>
  <desc id="rd">A five-by-three matrix. Rows are Amazon, eBay, Walmart, Target and Shopify merchants. Columns are third-party buyer-side agents, an agent-facing seller or merchant API, and a seat on the UCP Tech Council. Amazon and eBay refuse buyer-side agents while Amazon ships a seller-side plugin and holds a council seat; Walmart, Target and Shopify merchants admit buyer-side agents.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .medium { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="title" x="20" y="26">Who is let in, and on which side of the market</text>

  <text class="col" x="340" y="58" text-anchor="middle">Third-party buyer agents</text>
  <text class="col" x="570" y="58" text-anchor="middle">Seller / merchant agent API</text>
  <text class="col" x="785" y="58" text-anchor="middle">UCP council seat</text>

  <text class="row" x="20" y="95">Amazon</text>
  <rect class="weak" x="230" y="76" width="220" height="30" />
  <text class="label" x="340" y="96" text-anchor="middle">Blocked</text>
  <rect class="strong" x="460" y="76" width="220" height="30" />
  <text class="label-inv" x="570" y="96" text-anchor="middle">Yes — beta, Sep 2026</text>
  <rect class="medium" x="690" y="76" width="190" height="30" />
  <text class="label" x="785" y="96" text-anchor="middle">Yes — Apr 2026</text>

  <text class="row" x="20" y="145">eBay</text>
  <rect class="weak" x="230" y="126" width="220" height="30" />
  <text class="label" x="340" y="146" text-anchor="middle">Prohibited in terms</text>
  <rect class="medium" x="460" y="126" width="220" height="30" />
  <text class="label" x="570" y="146" text-anchor="middle">Long-standing seller API</text>
  <rect class="weak" x="690" y="126" width="190" height="30" />
  <text class="label" x="785" y="146" text-anchor="middle">—</text>

  <text class="row" x="20" y="195">Walmart</text>
  <rect class="strong" x="230" y="176" width="220" height="30" />
  <text class="label-inv" x="340" y="196" text-anchor="middle">Integrated</text>
  <rect class="medium" x="460" y="176" width="220" height="30" />
  <text class="label" x="570" y="196" text-anchor="middle">Seller API</text>
  <rect class="medium" x="690" y="176" width="190" height="30" />
  <text class="label" x="785" y="196" text-anchor="middle">Endorser</text>

  <text class="row" x="20" y="245">Target</text>
  <rect class="strong" x="230" y="226" width="220" height="30" />
  <text class="label-inv" x="340" y="246" text-anchor="middle">Integrated</text>
  <rect class="weak" x="460" y="226" width="220" height="30" />
  <text class="label" x="570" y="246" text-anchor="middle">—</text>
  <rect class="medium" x="690" y="226" width="190" height="30" />
  <text class="label" x="785" y="246" text-anchor="middle">Founding member</text>

  <text class="row" x="20" y="295">Shopify merchants</text>
  <rect class="strong" x="230" y="276" width="220" height="30" />
  <text class="label-inv" x="340" y="296" text-anchor="middle">Catalogue opened</text>
  <rect class="strong" x="460" y="276" width="220" height="30" />
  <text class="label-inv" x="570" y="296" text-anchor="middle">Yes — platform-wide</text>
  <rect class="medium" x="690" y="276" width="190" height="30" />
  <text class="label" x="785" y="296" text-anchor="middle">Co-author</text>

  <rect class="strong" x="20" y="332" width="16" height="16" />
  <text class="sub" x="44" y="345">Open to agents through a mechanism the platform controls</text>
  <rect class="medium" x="20" y="358" width="16" height="16" />
  <text class="sub" x="44" y="371">Partial, older or governance-only participation</text>
  <rect class="weak" x="20" y="384" width="16" height="16" />
  <text class="sub" x="44" y="397">Closed, or nothing shipped</text>
</svg>
