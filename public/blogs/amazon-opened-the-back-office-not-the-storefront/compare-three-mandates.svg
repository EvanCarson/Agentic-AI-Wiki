<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="mt md">
  <title id="mt">Three ways an agent can carry a person's authority</title>
  <desc id="md">Three columns — the user's own credential, a scoped partner credential, and a signed per-transaction mandate — each with what the counterparty can verify, what revocation costs, and where each is in use today.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .rule   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .45; }
  </style>

  <text class="title" x="20" y="28">What the counterparty can check, per mechanism</text>

  <rect class="box" x="30" y="50" width="250" height="46" />
  <text class="label" x="155" y="79" text-anchor="middle">The user's own credential</text>
  <rect class="adj" x="325" y="50" width="250" height="46" />
  <text class="label" x="450" y="79" text-anchor="middle">Scoped partner credential</text>
  <rect class="hero" x="620" y="50" width="250" height="46" />
  <text class="label-inv" x="745" y="79" text-anchor="middle">Signed per-task mandate</text>

  <text class="sub" x="155" y="126" text-anchor="middle">Verifies: nothing — the agent</text>
  <text class="sub" x="155" y="143" text-anchor="middle">is the human, by construction</text>
  <text class="sub" x="450" y="126" text-anchor="middle">Verifies: who the agent's</text>
  <text class="sub" x="450" y="143" text-anchor="middle">operator is, and its scope</text>
  <text class="sub" x="745" y="126" text-anchor="middle">Verifies: operator, scope and</text>
  <text class="sub" x="745" y="143" text-anchor="middle">that this user authorised this act</text>

  <path class="rule" d="M 30 160 L 870 160" />

  <text class="sub" x="155" y="186" text-anchor="middle">Revoking it: locks out</text>
  <text class="sub" x="155" y="203" text-anchor="middle">the customer too</text>
  <text class="sub" x="450" y="186" text-anchor="middle">Revoking it: one partner,</text>
  <text class="sub" x="450" y="203" text-anchor="middle">no collateral damage</text>
  <text class="sub" x="745" y="186" text-anchor="middle">Revoking it: per mandate,</text>
  <text class="sub" x="745" y="203" text-anchor="middle">or by expiry</text>

  <text class="sub" x="155" y="228" text-anchor="middle">In use: third-party shopping</text>
  <text class="sub" x="155" y="245" text-anchor="middle">agents — and the reason for blocks</text>
  <text class="sub" x="450" y="228" text-anchor="middle">In use: seller and merchant</text>
  <text class="sub" x="450" y="245" text-anchor="middle">APIs, for a decade</text>
  <text class="sub" x="745" y="228" text-anchor="middle">In use: the commerce protocols,</text>
  <text class="sub" x="745" y="245" text-anchor="middle">still arriving</text>

  <rect class="box" x="30" y="258" width="840" height="34" />
  <text class="label" x="450" y="280" text-anchor="middle">Access follows the mechanism. Where only column one exists, expect to be blocked — and to deserve it.</text>
</svg>
