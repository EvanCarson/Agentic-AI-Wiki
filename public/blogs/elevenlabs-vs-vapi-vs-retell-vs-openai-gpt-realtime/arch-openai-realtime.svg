<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">OpenAI gpt-realtime — single-model audio-native architecture</title>
  <desc id="d">Unlike pipeline-based voice agents that chain separate STT, LLM, and TTS stages, OpenAI gpt-realtime processes audio input and emits audio output directly through one model — eliminating inter-stage latency and transcription artifacts. A SIP or phone adapter sits alongside to bridge telephony.</desc>
  <style>
    .box      { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .hero     { fill: var(--accent, #d4421e); stroke: none; }
    .adj      { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .label    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--ink, #1a1a1a); }
    .label-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--paper, #fff); }
    .sub      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper, #fff); opacity: .80; }
    .anno     { font-family: var(--font-display); font-size: 14px; font-style: italic; fill: var(--muted, #888); }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 2; marker-end: url(#rt-arr); }
    .vs-label { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: middle; }
  </style>
  <defs>
    <marker id="rt-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Contrast: pipeline ghost (top) -->
  <text class="vs-label" x="450" y="32">Traditional pipeline (other vendors)</text>
  <rect x="40" y="42" width="820" height="60" rx="8" ry="8"
        fill="var(--paper-2, #f0ede8)" stroke="var(--border-soft, #d8d4ce)" stroke-width="1" opacity=".6" />
  <text class="sub" x="130" y="72" text-anchor="middle">STT</text>
  <line x1="165" y1="72" x2="295" y2="72" stroke="var(--border-soft, #d8d4ce)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#rt-arr)" />
  <text class="sub" x="360" y="72" text-anchor="middle">LLM (text)</text>
  <line x1="430" y1="72" x2="560" y2="72" stroke="var(--border-soft, #d8d4ce)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#rt-arr)" />
  <text class="sub" x="660" y="72" text-anchor="middle">TTS</text>
  <text class="vs-label" x="450" y="96">three round trips · transcription error surface · accumulated latency</text>

  <!-- Divider -->
  <line x1="40" y1="118" x2="860" y2="118" stroke="var(--border-soft, #d8d4ce)" stroke-width="1" stroke-dasharray="6 4" />
  <text class="anno" x="450" y="136" text-anchor="middle">Audio-native single model</text>

  <!-- Audio Input box -->
  <rect class="box" x="40" y="186" width="150" height="128" rx="8" ry="8" />
  <text class="label" x="115" y="242" text-anchor="middle" font-weight="600">Audio input</text>
  <text class="sub" x="115" y="262" text-anchor="middle">WebRTC stream</text>
  <text class="sub" x="115" y="280" text-anchor="middle">/ PSTN / SIP</text>

  <!-- Arrow in -->
  <path class="arrow" d="M 190 250 L 280 250" />

  <!-- Hero: gpt-realtime model -->
  <rect class="hero" x="280" y="156" width="340" height="188" rx="12" ry="12" />
  <text class="label-inv" x="450" y="202" text-anchor="middle" font-size="16" font-weight="700">gpt-realtime</text>
  <text class="sub-inv" x="450" y="226" text-anchor="middle">audio in → audio out</text>
  <text class="sub-inv" x="450" y="248" text-anchor="middle">no STT · no TTS stage</text>
  <text class="sub-inv" x="450" y="272" text-anchor="middle">native speech understanding</text>
  <text class="sub-inv" x="450" y="294" text-anchor="middle">tool / function call support</text>
  <text class="sub-inv" x="450" y="316" text-anchor="middle">interruption handling built-in</text>

  <!-- Arrow out -->
  <path class="arrow" d="M 620 250 L 710 250" />

  <!-- Audio Output box -->
  <rect class="box" x="710" y="186" width="150" height="128" rx="8" ry="8" />
  <text class="label" x="785" y="242" text-anchor="middle" font-weight="600">Audio output</text>
  <text class="sub" x="785" y="262" text-anchor="middle">streamed speech</text>
  <text class="sub" x="785" y="280" text-anchor="middle">low latency</text>

  <!-- SIP / phone integration side box -->
  <rect class="adj" x="280" y="380" width="340" height="72" rx="8" ry="8" />
  <text class="label" x="450" y="410" text-anchor="middle" font-weight="600">SIP / phone integration</text>
  <text class="sub" x="450" y="430" text-anchor="middle">Twilio · Telnyx · direct SIP trunk</text>
  <text class="sub" x="450" y="448" text-anchor="middle">bridges PSTN → WebRTC</text>

  <!-- Connector from model to SIP -->
  <path fill="none" stroke="currentColor" stroke-width="1.25" stroke-dasharray="5 4" opacity=".60"
        marker-end="url(#rt-arr)" d="M 450 344 L 450 378" />

</svg>
