<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Voice agent feature comparison matrix</title>
  <desc id="d">Heatmap comparing ElevenLabs Conversational AI, Vapi, Retell, and OpenAI gpt-realtime across five axes: Self-hosted, Model freedom, Telephony built-in, Voice quality, and Latency. Strength indicated by fill from light (weak) to solid orange-red (strong).</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="32" text-anchor="middle">Feature strength by platform</text>

  <!--
    Layout:
    Left margin for row labels: 200px
    5 columns × 116px = 580px; start x=200, end=780
    Cols at x: 200, 316, 432, 548, 664 (left edge); centers: 258, 374, 490, 606, 722
    4 rows × 58px = 232px; top area y=48 (header), row start y=80
    Rows at y: 80, 138, 196, 254 (top); centers: 109, 167, 225, 283
  -->

  <!-- Column headers -->
  <text class="col-head" x="258" y="56">Self-</text>
  <text class="col-head" x="258" y="68">hosted?</text>

  <text class="col-head" x="374" y="56">Model</text>
  <text class="col-head" x="374" y="68">freedom</text>

  <text class="col-head" x="490" y="56">Telephony</text>
  <text class="col-head" x="490" y="68">built-in</text>

  <text class="col-head" x="606" y="56">Voice</text>
  <text class="col-head" x="606" y="68">quality</text>

  <text class="col-head" x="722" y="56">Latency</text>

  <!-- ===== Row 1: ElevenLabs ===== -->
  <text class="row-head" x="192" y="109">ElevenLabs</text>
  <!-- Self-hosted: No (weak) -->
  <rect class="cell-weak" x="200" y="80" width="116" height="58" rx="4" />
  <text class="cell-text" x="258" y="109">No</text>
  <!-- Model freedom: High (strong) -->
  <rect class="cell-strong" x="316" y="80" width="116" height="58" rx="4" />
  <text class="cell-text-inv" x="374" y="109">High</text>
  <!-- Telephony built-in: Yes (strong) -->
  <rect class="cell-strong" x="432" y="80" width="116" height="58" rx="4" />
  <text class="cell-text-inv" x="490" y="109">Yes</text>
  <!-- Voice quality: Best (strong) -->
  <rect class="cell-strong" x="548" y="80" width="116" height="58" rx="4" />
  <text class="cell-text-inv" x="606" y="109">Best</text>
  <!-- Latency: Medium (medium) -->
  <rect class="cell-medium" x="664" y="80" width="116" height="58" rx="4" />
  <text class="cell-text" x="722" y="109">Medium</text>

  <!-- ===== Row 2: Vapi ===== -->
  <text class="row-head" x="192" y="167">Vapi</text>
  <!-- Self-hosted: No (weak) -->
  <rect class="cell-weak" x="200" y="138" width="116" height="58" rx="4" />
  <text class="cell-text" x="258" y="167">No</text>
  <!-- Model freedom: High (strong) -->
  <rect class="cell-strong" x="316" y="138" width="116" height="58" rx="4" />
  <text class="cell-text-inv" x="374" y="167">High</text>
  <!-- Telephony built-in: Yes (strong) -->
  <rect class="cell-strong" x="432" y="138" width="116" height="58" rx="4" />
  <text class="cell-text-inv" x="490" y="167">Yes</text>
  <!-- Voice quality: Good (medium) -->
  <rect class="cell-medium" x="548" y="138" width="116" height="58" rx="4" />
  <text class="cell-text" x="606" y="167">Good</text>
  <!-- Latency: Low (strong) -->
  <rect class="cell-strong" x="664" y="138" width="116" height="58" rx="4" />
  <text class="cell-text-inv" x="722" y="167">Low</text>

  <!-- ===== Row 3: Retell ===== -->
  <text class="row-head" x="192" y="225">Retell</text>
  <!-- Self-hosted: No (weak) -->
  <rect class="cell-weak" x="200" y="196" width="116" height="58" rx="4" />
  <text class="cell-text" x="258" y="225">No</text>
  <!-- Model freedom: Medium (medium) -->
  <rect class="cell-medium" x="316" y="196" width="116" height="58" rx="4" />
  <text class="cell-text" x="374" y="225">Medium</text>
  <!-- Telephony built-in: Yes (strong) -->
  <rect class="cell-strong" x="432" y="196" width="116" height="58" rx="4" />
  <text class="cell-text-inv" x="490" y="225">Yes</text>
  <!-- Voice quality: Good (medium) -->
  <rect class="cell-medium" x="548" y="196" width="116" height="58" rx="4" />
  <text class="cell-text" x="606" y="225">Good</text>
  <!-- Latency: Low (strong) -->
  <rect class="cell-strong" x="664" y="196" width="116" height="58" rx="4" />
  <text class="cell-text-inv" x="722" y="225">Low</text>

  <!-- ===== Row 4: OpenAI gpt-realtime ===== -->
  <text class="row-head" x="192" y="276">OpenAI</text>
  <text class="row-head" x="192" y="290">gpt-realtime</text>
  <!-- Self-hosted: No (weak) -->
  <rect class="cell-weak" x="200" y="254" width="116" height="58" rx="4" />
  <text class="cell-text" x="258" y="283">No</text>
  <!-- Model freedom: Low (weak) -->
  <rect class="cell-weak" x="316" y="254" width="116" height="58" rx="4" />
  <text class="cell-text" x="374" y="283">Low</text>
  <!-- Telephony built-in: Yes (strong) -->
  <rect class="cell-strong" x="432" y="254" width="116" height="58" rx="4" />
  <text class="cell-text-inv" x="490" y="283">Yes</text>
  <!-- Voice quality: Good (medium) -->
  <rect class="cell-medium" x="548" y="254" width="116" height="58" rx="4" />
  <text class="cell-text" x="606" y="283">Good</text>
  <!-- Latency: Best (strong) -->
  <rect class="cell-strong" x="664" y="254" width="116" height="58" rx="4" />
  <text class="cell-text-inv" x="722" y="283">Best</text>

  <!-- Legend -->
  <rect class="legend-box-w" x="200" y="336" width="16" height="16" rx="3" />
  <text class="legend-text" x="222" y="344">Weak</text>

  <rect class="legend-box-m" x="290" y="336" width="16" height="16" rx="3" />
  <text class="legend-text" x="312" y="344">Medium</text>

  <rect class="legend-box-s" x="390" y="336" width="16" height="16" rx="3" />
  <text class="legend-text" x="412" y="344">Strong</text>

</svg>
