<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ElevenLabs logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Stylized "11" as two vertical waveform bars with varying heights,
       evoking audio synthesis. Left bar is full height; right bar slightly
       shorter to add rhythm. Small dots at top cap each bar. -->
  <!-- Left bar -->
  <rect x="9" y="8" width="5" height="16" rx="2.5" fill="var(--paper)" />
  <!-- Right bar -->
  <rect x="18" y="11" width="5" height="13" rx="2.5" fill="var(--paper)" opacity="0.85" />
</svg>
