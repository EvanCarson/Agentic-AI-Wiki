<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Vapi logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Phone / call handset icon — evokes voice API.
       Receiver body: rounded rectangle tilted 45°.
       Two small arc caps at ear and mouth ends. -->
  <!-- Handset body (pill shape rotated ~45°) -->
  <rect x="11" y="7" width="10" height="18" rx="5" fill="var(--paper)"
        transform="rotate(-35 16 16)" />
  <!-- Ear cap cutout to suggest classic handset shape -->
  <ellipse cx="10.5" cy="10" rx="3.5" ry="3" fill="var(--accent, #d4421e)" />
  <!-- Mouth cap cutout -->
  <ellipse cx="21.5" cy="22" rx="3.5" ry="3" fill="var(--accent, #d4421e)" />
</svg>
