<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OpenAI logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Rotational / bloom mark evocative of OpenAI's official sigil.
       Six rounded petals arranged radially from center (16,16).
       Each petal is a small rounded rectangle rotated in 60° steps. -->
  <g transform="translate(16,16)">
    <rect x="-2.5" y="-8" width="5" height="7" rx="2.5" fill="var(--paper)" transform="rotate(0)"   />
    <rect x="-2.5" y="-8" width="5" height="7" rx="2.5" fill="var(--paper)" transform="rotate(60)"  />
    <rect x="-2.5" y="-8" width="5" height="7" rx="2.5" fill="var(--paper)" transform="rotate(120)" />
    <rect x="-2.5" y="-8" width="5" height="7" rx="2.5" fill="var(--paper)" transform="rotate(180)" />
    <rect x="-2.5" y="-8" width="5" height="7" rx="2.5" fill="var(--paper)" transform="rotate(240)" />
    <rect x="-2.5" y="-8" width="5" height="7" rx="2.5" fill="var(--paper)" transform="rotate(300)" />
    <!-- Small center disc to unify the petals -->
    <circle cx="0" cy="0" r="3" fill="var(--paper)" />
  </g>
</svg>
