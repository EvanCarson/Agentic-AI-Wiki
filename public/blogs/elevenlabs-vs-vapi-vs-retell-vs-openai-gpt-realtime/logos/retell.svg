<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Retell AI logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Speech bubble with a tail pointing down-left, evoking "re-tell" /
       voice conversation replay. Bubble body is a rounded rect; tail is
       a small triangle. Three dots inside represent an active voice exchange. -->
  <!-- Bubble body -->
  <rect x="6" y="7" width="20" height="14" rx="4" fill="var(--paper)" />
  <!-- Tail (triangle pointing down-left) -->
  <polygon points="9,21 6,27 14,21" fill="var(--paper)" />
  <!-- Three activity dots inside bubble -->
  <circle cx="11" cy="14" r="1.8" fill="var(--accent, #d4421e)" />
  <circle cx="16" cy="14" r="1.8" fill="var(--accent, #d4421e)" />
  <circle cx="21" cy="14" r="1.8" fill="var(--accent, #d4421e)" />
</svg>
