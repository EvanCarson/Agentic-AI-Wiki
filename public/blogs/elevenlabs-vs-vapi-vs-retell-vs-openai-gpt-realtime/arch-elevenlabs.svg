<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">ElevenLabs Conversational AI — TTS-first voice agent</title>
  <desc id="d">ElevenLabs Conversational AI routes call audio through a pluggable STT stage, a pluggable LLM stage, and ElevenLabs' own TTS engine before returning audio. A separate tool-use branch handles function calls. Voice quality via ElevenLabs' proprietary synthesis is the platform's primary moat.</desc>
  <style>
    .box      { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .hero     { fill: var(--accent, #d4421e); stroke: none; }
    .adj      { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1.25; }
    .label    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--ink, #1a1a1a); }
    .label-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--paper, #fff); }
    .sub      { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .80; }
    .anno     { font-family: 'Fraunces', serif; font-size: 13px; font-style: italic; fill: var(--muted, #888); }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 1.75; marker-end: url(#el-arr); opacity: .70; }
    .section-bg { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #d8d4ce); stroke-width: 1; }
  </style>
  <defs>
    <marker id="el-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Hero container: ElevenLabs platform -->
  <rect class="hero" x="30" y="40" width="840" height="380" rx="12" ry="12" />
  <text class="label-inv" x="450" y="72" text-anchor="middle" font-size="16" font-weight="600">ElevenLabs Conversational AI</text>

  <!-- Pipeline background -->
  <rect class="section-bg" x="50" y="90" width="700" height="240" rx="8" ry="8" fill="var(--paper, #fff)" stroke="var(--border-soft, #d8d4ce)" stroke-width="1" opacity="0.18" />

  <!-- Audio In arrow -->
  <text class="sub-inv" x="34" y="225" text-anchor="start" font-size="11">Call audio in</text>
  <path class="arrow" d="M 30 238 L 100 238" stroke="var(--paper, #fff)" />

  <!-- STT box -->
  <rect class="box" x="100" y="196" width="130" height="84" rx="8" ry="8" />
  <text class="label" x="165" y="230" text-anchor="middle" font-weight="600">STT</text>
  <text class="sub" x="165" y="248" text-anchor="middle">pluggable</text>
  <text class="sub" x="165" y="264" text-anchor="middle">Deepgram / custom</text>

  <!-- STT → LLM -->
  <path class="arrow" d="M 230 238 L 290 238" />

  <!-- LLM box -->
  <rect class="box" x="290" y="196" width="140" height="84" rx="8" ry="8" />
  <text class="label" x="360" y="226" text-anchor="middle" font-weight="600">LLM</text>
  <text class="sub" x="360" y="244" text-anchor="middle">pluggable</text>
  <text class="sub" x="360" y="260" text-anchor="middle">GPT-4o / Claude</text>
  <text class="sub" x="360" y="276" text-anchor="middle">/ custom</text>

  <!-- LLM → TTS -->
  <path class="arrow" d="M 430 238 L 490 238" />

  <!-- TTS box (adj — ElevenLabs' strong point) -->
  <rect class="adj" x="490" y="196" width="150" height="84" rx="8" ry="8" />
  <text class="label" x="565" y="226" text-anchor="middle" font-weight="600">TTS</text>
  <text class="sub" x="565" y="244" text-anchor="middle">ElevenLabs voice</text>
  <text class="sub" x="565" y="260" text-anchor="middle">ultra-low latency</text>
  <text class="sub" x="565" y="276" text-anchor="middle">voice cloning</text>

  <!-- TTS → audio out -->
  <path class="arrow" d="M 640 238 L 720 238" />
  <text class="sub-inv" x="730" y="225" font-size="11">Call audio out</text>

  <!-- Tool-use branch from LLM -->
  <!-- LLM down to tool box -->
  <path class="arrow" d="M 360 280 L 360 340" />

  <!-- Tool-use box -->
  <rect class="box" x="280" y="340" width="160" height="64" rx="8" ry="8" />
  <text class="label" x="360" y="366" text-anchor="middle" font-weight="600">Tool use</text>
  <text class="sub" x="360" y="384" text-anchor="middle">function calls / webhooks</text>

  <!-- Tool result back to LLM (dashed loop) -->
  <path fill="none" stroke="currentColor" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#el-arr)" opacity=".60"
        d="M 280 372 C 230 372 210 310 270 290" />

  <!-- Moat annotation -->
  <text class="anno" x="490" y="360" text-anchor="middle">Voice quality is the moat.</text>

</svg>
