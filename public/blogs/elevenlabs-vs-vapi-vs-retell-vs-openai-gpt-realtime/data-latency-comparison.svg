<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Round-trip latency comparison</title>
  <desc id="d">Horizontal bar chart comparing round-trip voice agent latency in milliseconds: OpenAI gpt-realtime leads at 350 ms, followed by Vapi at 600 ms, Retell at 700 ms, and ElevenLabs Conversational AI at 850 ms.</desc>
  <defs>
    <filter id="lat-shadow" x="-2%" y="-10%" width="112%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--ink, #1a1a1a)" flood-opacity="0.10" />
    </filter>
  </defs>
  <style>
    .chart-title  { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; fill: currentColor; }
    .proj-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .bar-val      { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; dominant-baseline: central; }
    .grid-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: middle; }
    .grid-line    { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .bar-accent   { fill: var(--accent, #d4421e); filter: url(#lat-shadow); }
    .bar-adj      { fill: var(--accent-soft, #f5c5b8); filter: url(#lat-shadow); }
    .bar-neutral  { fill: var(--paper-2, #f0ede8); filter: url(#lat-shadow); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="36" text-anchor="middle">Round-trip latency (ms, snapshot)</text>

  <!--
    Chart area: left margin 220, right margin 80, top 70, bottom 55
    Chart width = 900 - 220 - 80 = 600px for max value 1000ms
    Scale: 600 / 1000 = 0.6 px per ms
    Grid lines at 0, 200, 400, 600, 800, 1000
    x positions: 220 + value * 0.6
      0   -> 220
      200 -> 340
      400 -> 460
      600 -> 580
      800 -> 700
      1000 -> 820
    4 rows, bar height 46, gap 18
    Row y starts: 75, 139, 203, 267 (top of each bar)
    Bar center y:  98, 162, 226, 290
  -->

  <!-- Grid lines -->
  <line class="grid-line" x1="220" y1="68" x2="220" y2="318" />
  <line class="grid-line" x1="340" y1="68" x2="340" y2="318" />
  <line class="grid-line" x1="460" y1="68" x2="460" y2="318" />
  <line class="grid-line" x1="580" y1="68" x2="580" y2="318" />
  <line class="grid-line" x1="700" y1="68" x2="700" y2="318" />
  <line class="grid-line" x1="820" y1="68" x2="820" y2="318" />

  <!-- Baseline -->
  <line x1="220" y1="318" x2="820" y2="318" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" />

  <!-- Grid labels -->
  <text class="grid-label" x="220" y="334">0</text>
  <text class="grid-label" x="340" y="334">200</text>
  <text class="grid-label" x="460" y="334">400</text>
  <text class="grid-label" x="580" y="334">600</text>
  <text class="grid-label" x="700" y="334">800</text>
  <text class="grid-label" x="820" y="334">1000 ms</text>

  <!-- Row 1: OpenAI gpt-realtime — 350 ms — accent (leader) -->
  <!-- bar width = 350 * 0.6 = 210 -->
  <text class="proj-label" x="212" y="98">OpenAI gpt-realtime</text>
  <rect class="bar-accent" x="220" y="75" width="210" height="46" rx="5" ry="5" />
  <text class="bar-val" x="438" y="98" style="fill: var(--accent, #d4421e);">350 ms</text>

  <!-- Row 2: Vapi — 600 ms — accent-soft -->
  <!-- bar width = 600 * 0.6 = 360 -->
  <text class="proj-label" x="212" y="162">Vapi</text>
  <rect class="bar-adj" x="220" y="139" width="360" height="46" rx="5" ry="5" />
  <text class="bar-val" x="588" y="162" style="fill: var(--ink, #1a1a1a);">600 ms</text>

  <!-- Row 3: Retell — 700 ms — accent-soft -->
  <!-- bar width = 700 * 0.6 = 420 -->
  <text class="proj-label" x="212" y="226">Retell</text>
  <rect class="bar-adj" x="220" y="203" width="420" height="46" rx="5" ry="5" />
  <text class="bar-val" x="648" y="226" style="fill: var(--ink, #1a1a1a);">700 ms</text>

  <!-- Row 4: ElevenLabs — 850 ms — paper-2 (neutral/trailing) -->
  <!-- bar width = 850 * 0.6 = 510 -->
  <text class="proj-label" x="212" y="290">ElevenLabs Conv. AI</text>
  <rect class="bar-neutral" x="220" y="267" width="510" height="46" rx="5" ry="5" />
  <text class="bar-val" x="738" y="290" style="fill: var(--muted, #888);">850 ms</text>

</svg>
