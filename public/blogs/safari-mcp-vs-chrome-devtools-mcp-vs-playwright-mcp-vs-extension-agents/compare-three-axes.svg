<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="at ad">
  <title id="at">The three axes that separate browser tooling for agents</title>
  <desc id="ad">Three columns — which session the agent holds, what the agent observes, and whether a run is reproducible — each with what it decides and a concrete way to check it, plus a closing note that tool count decides none of them.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .rule   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .45; }
  </style>

  <text class="title" x="20" y="28">Three axes; tool count is not one of them</text>

  <rect class="hero" x="30" y="50" width="250" height="46" />
  <text class="label-inv" x="155" y="79" text-anchor="middle">Which session</text>
  <rect class="adj" x="325" y="50" width="250" height="46" />
  <text class="label" x="450" y="79" text-anchor="middle">What it observes</text>
  <rect class="box" x="620" y="50" width="250" height="46" />
  <text class="label" x="745" y="79" text-anchor="middle">Reproducible state</text>

  <text class="sub" x="155" y="126" text-anchor="middle">Decides: how far an injected</text>
  <text class="sub" x="155" y="143" text-anchor="middle">line on any page can reach</text>
  <text class="sub" x="450" y="126" text-anchor="middle">Decides: reliability across a</text>
  <text class="sub" x="450" y="143" text-anchor="middle">redesign, and trace size</text>
  <text class="sub" x="745" y="126" text-anchor="middle">Decides: whether a failure</text>
  <text class="sub" x="745" y="143" text-anchor="middle">can be re-run and scored</text>

  <path class="rule" d="M 30 160 L 870 160" />

  <text class="sub" x="155" y="186" text-anchor="middle">Check: open the profile and</text>
  <text class="sub" x="155" y="203" text-anchor="middle">list what it is logged into</text>
  <text class="sub" x="450" y="186" text-anchor="middle">Check: is a step an a11y tree,</text>
  <text class="sub" x="450" y="203" text-anchor="middle">a screenshot, or a CDP trace?</text>
  <text class="sub" x="745" y="186" text-anchor="middle">Check: can a colleague re-run</text>
  <text class="sub" x="745" y="203" text-anchor="middle">this failure from a file?</text>

  <text class="sub" x="155" y="228" text-anchor="middle">Isolated → dedicated → yours</text>
  <text class="sub" x="450" y="228" text-anchor="middle">Pixels → tree → protocol data</text>
  <text class="sub" x="745" y="228" text-anchor="middle">Persistent → isolated → seeded</text>

  <rect class="box" x="30" y="250" width="840" height="34" />
  <text class="label" x="450" y="272" text-anchor="middle">Answer these three and the shortlist is one; the tool list never separated them.</text>
</svg>
