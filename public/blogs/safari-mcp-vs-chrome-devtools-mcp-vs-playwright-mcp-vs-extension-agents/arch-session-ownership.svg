<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="ot od">
  <title id="ot">Three session models and what an injected instruction reaches</title>
  <desc id="od">Three columns: a clean automation context holding no credentials, a dedicated profile that accumulates logins over time, and the user's own profile carrying every existing session. Each column lists what the context holds and what an instruction injected into a visited page can therefore reach, with a closing note that the reach is the cookie jar.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .rule   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .45; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#oa); }
  </style>
  <defs>
    <marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="title" x="20" y="26">One injected line, three cookie jars</text>

  <rect class="box" x="30" y="44" width="270" height="44" />
  <text class="label" x="165" y="72" text-anchor="middle">Clean automation context</text>
  <rect class="adj" x="315" y="44" width="270" height="44" />
  <text class="label" x="450" y="72" text-anchor="middle">Dedicated profile</text>
  <rect class="hero" x="600" y="44" width="270" height="44" />
  <text class="label-inv" x="735" y="72" text-anchor="middle">Your own profile</text>

  <text class="head" x="30" y="114">HOLDS</text>
  <text class="sub" x="30" y="136">no cookies, no saved passwords,</text>
  <text class="sub" x="30" y="154">no history, no AutoFill</text>
  <text class="sub" x="315" y="136">whatever you have logged it into,</text>
  <text class="sub" x="315" y="154">accumulating, no lifecycle</text>
  <text class="sub" x="600" y="136">every session you have — mail,</text>
  <text class="sub" x="600" y="154">bank, repos, admin consoles</text>

  <path class="rule" d="M 30 176 L 870 176" />

  <text class="head" x="30" y="202">CAN DO THE ERRAND?</text>
  <text class="sub" x="30" y="224">No — it is not you anywhere</text>
  <text class="sub" x="315" y="224">On the systems you signed it into</text>
  <text class="sub" x="600" y="224">Yes, anywhere you are signed in</text>

  <path class="rule" d="M 30 246 L 870 246" />

  <rect class="box" x="300" y="266" width="300" height="42" />
  <text class="label" x="450" y="292" text-anchor="middle">Page carries an injected instruction</text>

  <path class="arrow" d="M 330 290 L 175 322" />
  <path class="arrow" d="M 450 310 L 450 322" />
  <path class="arrow" d="M 570 290 L 725 322" />

  <text class="head" x="30" y="348">SO THE INJECTION REACHES</text>

  <rect class="box" x="30" y="362" width="270" height="86" />
  <text class="sub" x="165" y="388" text-anchor="middle">public pages, the local</text>
  <text class="sub" x="165" y="406" text-anchor="middle">filesystem if exposed,</text>
  <text class="sub" x="165" y="424" text-anchor="middle">and nothing of yours</text>

  <rect class="adj" x="315" y="362" width="270" height="86" />
  <text class="sub" x="450" y="388" text-anchor="middle">everything that profile</text>
  <text class="sub" x="450" y="406" text-anchor="middle">has ever been logged</text>
  <text class="sub" x="450" y="424" text-anchor="middle">into, reviewed by nobody</text>

  <rect class="hero" x="600" y="362" width="270" height="86" />
  <text class="label-inv" x="735" y="390" text-anchor="middle">account takeover</text>
  <text class="label-inv" x="735" y="412" text-anchor="middle">as you, acting as you</text>

  <text class="sub" x="450" y="478" text-anchor="middle">Capability and exposure are the same variable; the cookie jar is the dial.</text>
</svg>
