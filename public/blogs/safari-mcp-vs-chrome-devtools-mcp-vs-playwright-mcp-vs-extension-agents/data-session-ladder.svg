<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="st sd">
  <title id="st">How much of your identity the agent holds</title>
  <desc id="sd">Horizontal bars for four options. Safari MCP is shortest, running an isolated automation session with no cookies or logins. Chrome DevTools MCP and Playwright MCP are mid-length, each using a dedicated profile that accumulates logins across runs. Extension agents are longest, holding the user's own profile and every existing session.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .medium { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .grid   { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 4; opacity: .3; }
  </style>

  <text class="title" x="20" y="26">Share of your identity the agent holds</text>

  <path class="grid" d="M 230 44 L 230 340" />
  <path class="grid" d="M 390 44 L 390 340" />
  <path class="grid" d="M 550 44 L 550 340" />
  <path class="grid" d="M 710 44 L 710 340" />
  <path class="grid" d="M 870 44 L 870 340" />

  <text class="row" x="20" y="82">Safari MCP</text>
  <rect class="weak" x="230" y="60" width="150" height="40" />
  <text class="label" x="392" y="85">isolated session — no cookies, no logins</text>

  <text class="row" x="20" y="152">Chrome DevTools MCP</text>
  <rect class="medium" x="230" y="130" width="380" height="40" />
  <text class="label" x="420" y="155" text-anchor="middle">dedicated profile, reused across runs</text>

  <text class="row" x="20" y="222">Playwright MCP</text>
  <rect class="medium" x="230" y="200" width="380" height="40" />
  <text class="label" x="420" y="225" text-anchor="middle">dedicated profile, or --isolated</text>

  <text class="row" x="20" y="292">Extension agents</text>
  <rect class="strong" x="230" y="270" width="640" height="40" />
  <text class="label-inv" x="550" y="295" text-anchor="middle">your own profile — every session you have</text>

  <text class="sub" x="230" y="362">less capable, fails safe</text>
  <text class="sub" x="870" y="362" text-anchor="end">more capable, fails open</text>
</svg>
