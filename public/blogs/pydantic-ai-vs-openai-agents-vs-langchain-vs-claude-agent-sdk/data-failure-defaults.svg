<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ft fd">
  <title id="ft">What each SDK does with an invalid structured output</title>
  <desc id="fd">A four by three matrix. Pydantic AI has retry built in and budgeted, a ModelRetry hook for semantic rejection, and raises only after the budget is spent. The OpenAI Agents SDK does not retry and raises by default, offers an opt-in run error handler, and lands in ModelBehaviorError. LangChain create_agent retries only under ToolStrategy, has no built-in semantic hook, and where it lands depends on the strategy. The Claude Agent SDK relies on provider enforcement, has no built-in semantic hook, and surfaces a refusal or a schema error instead.</desc>
  <style>
    .fm-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .fm-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .fm-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .fm-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .fm-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .fm-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .fm-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .fm-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .fm-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="fm-ttl" x="20" y="34">What happens when the output does not fit the type</text>

  <text class="fm-col" x="320" y="76" text-anchor="middle">Retry on invalid</text>
  <text class="fm-col" x="510" y="76" text-anchor="middle">Semantic reject hook</text>
  <text class="fm-col" x="700" y="76" text-anchor="middle">Default lands in</text>

  <text class="fm-row" x="20" y="118">Pydantic AI</text>
  <rect class="fm-strong" x="230" y="92" width="180" height="40" />
  <text class="fm-inv"  x="320" y="117" text-anchor="middle">Built in, budgeted</text>
  <rect class="fm-strong" x="420" y="92" width="180" height="40" />
  <text class="fm-inv"  x="510" y="117" text-anchor="middle">ModelRetry</text>
  <rect class="fm-weak"   x="610" y="92" width="180" height="40" />
  <text class="fm-cell" x="700" y="117" text-anchor="middle">Raise, budget spent</text>

  <text class="fm-row" x="20" y="178">OpenAI Agents SDK</text>
  <rect class="fm-weak"   x="230" y="152" width="180" height="40" />
  <text class="fm-cell" x="320" y="177" text-anchor="middle">No &#8212; raises</text>
  <rect class="fm-mid"    x="420" y="152" width="180" height="40" />
  <text class="fm-cell" x="510" y="177" text-anchor="middle">Opt-in handler</text>
  <rect class="fm-weak"   x="610" y="152" width="180" height="40" />
  <text class="fm-cell" x="700" y="177" text-anchor="middle">ModelBehaviorError</text>

  <text class="fm-row" x="20" y="238">LangChain</text>
  <rect class="fm-mid"    x="230" y="212" width="180" height="40" />
  <text class="fm-cell" x="320" y="237" text-anchor="middle">ToolStrategy only</text>
  <rect class="fm-weak"   x="420" y="212" width="180" height="40" />
  <text class="fm-cell" x="510" y="237" text-anchor="middle">Roll your own</text>
  <rect class="fm-weak"   x="610" y="212" width="180" height="40" />
  <text class="fm-cell" x="700" y="237" text-anchor="middle">Whichever strategy</text>

  <text class="fm-row" x="20" y="298">Claude Agent SDK</text>
  <rect class="fm-weak"   x="230" y="272" width="180" height="40" />
  <text class="fm-cell" x="320" y="297" text-anchor="middle">Provider-enforced</text>
  <rect class="fm-weak"   x="420" y="272" width="180" height="40" />
  <text class="fm-cell" x="510" y="297" text-anchor="middle">Roll your own</text>
  <rect class="fm-weak"   x="610" y="272" width="180" height="40" />
  <text class="fm-cell" x="700" y="297" text-anchor="middle">Refusal or 400</text>

  <rect class="fm-strong" x="20"  y="344" width="18" height="14" />
  <text class="fm-leg" x="48"  y="356">Provided and on</text>
  <rect class="fm-mid"    x="230" y="344" width="18" height="14" />
  <text class="fm-leg" x="258" y="356">Conditional or opt-in</text>
  <rect class="fm-weak"   x="470" y="344" width="18" height="14" />
  <text class="fm-leg" x="498" y="356">Left to the implementer</text>
</svg>
