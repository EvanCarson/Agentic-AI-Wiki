<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="at ad">
  <title id="at">Three exits for an output that does not fit the type</title>
  <desc id="ad">An invalid output on the left branches into three lanes. The first feeds the validation error back to the model, costing a second inference call, as Pydantic AI and LangChain ToolStrategy do. The second raises an exception into the caller's handler, which is the OpenAI Agents SDK default. The third hands the problem onward to your own code or the user, which is what a bare schema on the provider path and a provider-enforced refusal both do.</desc>
  <style>
    .bx    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .lb    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .lbi   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="34">Where a bad structured output actually goes</text>

  <rect class="hero" x="30" y="215" width="170" height="64" />
  <text class="lbi" x="115" y="243" text-anchor="middle">Output does not</text>
  <text class="lbi" x="115" y="262" text-anchor="middle">fit the type</text>

  <path class="arrow" d="M 200 236 C 260 236 260 120 318 120" />
  <path class="arrow" d="M 200 247 L 318 247" />
  <path class="arrow" d="M 200 258 C 260 258 260 374 318 374" />

  <rect class="adj" x="325" y="88" width="190" height="64" />
  <text class="lb" x="420" y="116" text-anchor="middle">Feed the error</text>
  <text class="lb" x="420" y="135" text-anchor="middle">back to the model</text>
  <path class="arrow" d="M 515 120 L 618 120" />
  <rect class="bx" x="625" y="88" width="245" height="64" />
  <text class="lb" x="747" y="116" text-anchor="middle">A second inference call,</text>
  <text class="lb" x="747" y="135" text-anchor="middle">on your token bill</text>
  <text class="sub" x="325" y="176">Pydantic AI &#183; LangChain ToolStrategy</text>

  <rect class="adj" x="325" y="215" width="190" height="64" />
  <text class="lb" x="420" y="243" text-anchor="middle">Raise an</text>
  <text class="lb" x="420" y="262" text-anchor="middle">exception</text>
  <path class="arrow" d="M 515 247 L 618 247" />
  <rect class="bx" x="625" y="215" width="245" height="64" />
  <text class="lb" x="747" y="243" text-anchor="middle">Your exception handler,</text>
  <text class="lb" x="747" y="262" text-anchor="middle">if you wrote one</text>
  <text class="sub" x="325" y="303">OpenAI Agents SDK, by default</text>

  <rect class="adj" x="325" y="342" width="190" height="64" />
  <text class="lb" x="420" y="370" text-anchor="middle">Hand it onward</text>
  <text class="lb" x="420" y="389" text-anchor="middle">unchanged</text>
  <path class="arrow" d="M 515 374 L 618 374" />
  <rect class="bx" x="625" y="342" width="245" height="64" />
  <text class="lb" x="747" y="370" text-anchor="middle">Your own code &#8212;</text>
  <text class="lb" x="747" y="389" text-anchor="middle">or the user</text>
  <text class="sub" x="325" y="430">Bare schema on the provider path</text>
</svg>
