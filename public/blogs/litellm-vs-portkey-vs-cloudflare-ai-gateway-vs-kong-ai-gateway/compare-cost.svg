<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What each gateway choice costs you</title>
  <desc id="d">Four columns naming the real price of each option: operating LiteLLM yourself, sending prompts through Portkey as a third party, tying value to the Cloudflare ecosystem, and accepting that Kong&#x27;s LLM features trail the dedicated tools.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .scale-num    { font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .scale-num-inv{ font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>


  <text class="chart-title" x="450" y="28">The price is never the price — what each one actually costs</text>

  <rect class="card-accent" x="10" y="44" width="210" height="230" rx="8" />
  <text class="col-head-inv" x="115" y="72">LiteLLM</text>
  <text class="scale-num-inv" x="115" y="110">Ops</text>
  <text class="body-text-inv" x="115" y="140">You operate it, scale it</text>
  <text class="body-text-inv" x="115" y="158">and get paged for it.</text>
  <text class="body-text-inv" x="115" y="176"></text>
  <text class="body-text-inv" x="115" y="194">A Python hop in the path</text>
  <text class="body-text-inv" x="115" y="212">of every model call.</text>

  <rect class="card-soft" x="230" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="335" y="72">Portkey</text>
  <text class="scale-num" x="335" y="110">Data</text>
  <text class="body-text" x="335" y="140">Prompts and responses</text>
  <text class="body-text" x="335" y="158">transit a third party.</text>
  <text class="body-text" x="335" y="176"></text>
  <text class="body-text" x="335" y="194">Self-hosting exists but</text>
  <text class="body-text" x="335" y="212">sits behind the paid tier.</text>

  <rect class="card-soft" x="450" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="555" y="72">Cloudflare</text>
  <text class="scale-num" x="555" y="110">Fit</text>
  <text class="body-text" x="555" y="140">Cheapest to adopt if you</text>
  <text class="body-text" x="555" y="158">are already on Cloudflare.</text>
  <text class="body-text" x="555" y="176"></text>
  <text class="body-text" x="555" y="194">Least compelling if you</text>
  <text class="body-text" x="555" y="212">are not.</text>

  <rect class="card-neutral" x="670" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="775" y="72">Kong</text>
  <text class="scale-num" x="775" y="110">Lag</text>
  <text class="body-text" x="775" y="140">One policy engine for</text>
  <text class="body-text" x="775" y="158">REST and LLM traffic.</text>
  <text class="body-text" x="775" y="176"></text>
  <text class="body-text" x="775" y="194">AI features trail the</text>
  <text class="body-text" x="775" y="212">dedicated gateways.</text>
</svg>
