<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What cross-provider failover silently changes</title>
  <desc id="d">Four columns describing what differs the moment a gateway fails traffic over to a second provider: tool-calling dialects, refusal behaviour, a discarded prompt cache, and context limits that may not fit.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .scale-num    { font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .scale-num-inv{ font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>


  <text class="chart-title" x="450" y="28">What changes the moment failover fires</text>

  <rect class="card-accent" x="10" y="44" width="210" height="230" rx="8" />
  <text class="col-head-inv" x="115" y="72">Tool calls</text>
  <text class="scale-num-inv" x="115" y="110">Dialect</text>
  <text class="body-text-inv" x="115" y="140">Schema subsets, parallel-</text>
  <text class="body-text-inv" x="115" y="158">call support and argument</text>
  <text class="body-text-inv" x="115" y="176">coercion all differ.</text>
  <text class="body-text-inv" x="115" y="194"></text>
  <text class="body-text-inv" x="115" y="212">Malformed args, not an</text>
  <text class="body-text-inv" x="115" y="230">outage — harder to spot.</text>

  <rect class="card-soft" x="230" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="335" y="72">Safety</text>
  <text class="scale-num" x="335" y="110">Refusals</text>
  <text class="body-text" x="335" y="140">The fallback may decline</text>
  <text class="body-text" x="335" y="158">work the primary does.</text>
  <text class="body-text" x="335" y="176"></text>
  <text class="body-text" x="335" y="194">Reads to users as an</text>
  <text class="body-text" x="335" y="212">intermittent bug.</text>

  <rect class="card-soft" x="450" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="555" y="72">Caching</text>
  <text class="scale-num" x="555" y="110">Cold</text>
  <text class="body-text" x="555" y="140">The warm prompt cache is</text>
  <text class="body-text" x="555" y="158">gone on the other side.</text>
  <text class="body-text" x="555" y="176"></text>
  <text class="body-text" x="555" y="194">Cost and latency spike</text>
  <text class="body-text" x="555" y="212">exactly under pressure.</text>

  <rect class="card-neutral" x="670" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="775" y="72">Limits</text>
  <text class="scale-num" x="775" y="110">Truncation</text>
  <text class="body-text" x="775" y="140">A prompt that fits the</text>
  <text class="body-text" x="775" y="158">primary may not fit</text>
  <text class="body-text" x="775" y="176">the fallback.</text>
  <text class="body-text" x="775" y="194"></text>
  <text class="body-text" x="775" y="212">Errors, not degradation.</text>
</svg>
