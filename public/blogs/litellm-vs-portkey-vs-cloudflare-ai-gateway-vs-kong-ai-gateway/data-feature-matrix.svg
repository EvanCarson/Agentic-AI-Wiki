<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Capability matrix across the four AI gateways</title>
  <desc id="d">A four-by-five grid scoring LiteLLM, Portkey, Cloudflare AI Gateway and Kong AI Gateway on self-hosting without a vendor, semantic caching, built-in guardrails, cross-provider failover, and reuse of existing API-gateway infrastructure.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: start; }
    .scale-num    { font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .scale-num-inv{ font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>


  <text class="chart-title" x="450" y="28">Where each gateway leans hardest</text>
  <text class="body-text" x="238" y="62" style="font-weight:600">Self-host, no</text>
  <text class="body-text" x="238" y="76" style="font-weight:600">vendor</text>
  <text class="body-text" x="378" y="62" style="font-weight:600">Semantic</text>
  <text class="body-text" x="378" y="76" style="font-weight:600">caching</text>
  <text class="body-text" x="518" y="62" style="font-weight:600">Guardrails</text>
  <text class="body-text" x="518" y="76" style="font-weight:600">built in</text>
  <text class="body-text" x="658" y="62" style="font-weight:600">Cross-provider</text>
  <text class="body-text" x="658" y="76" style="font-weight:600">failover</text>
  <text class="body-text" x="798" y="62" style="font-weight:600">Rides existing</text>
  <text class="body-text" x="798" y="76" style="font-weight:600">infra</text>
  <text class="row-head" x="154" y="128">LiteLLM</text>
  <rect class="card-accent" x="171" y="96" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="238" y="128">MIT, full</text>
  <rect class="card-soft" x="311" y="96" width="134" height="56" rx="6" />
  <text class="body-text" x="378" y="128">Add-on</text>
  <rect class="card-soft" x="451" y="96" width="134" height="56" rx="6" />
  <text class="body-text" x="518" y="128">Hooks</text>
  <rect class="card-accent" x="591" y="96" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="658" y="128">Yes</text>
  <rect class="card-neutral" x="731" y="96" width="134" height="56" rx="6" />
  <text class="body-text" x="798" y="128">New service</text>
  <text class="row-head" x="154" y="192">Portkey</text>
  <rect class="card-soft" x="171" y="160" width="134" height="56" rx="6" />
  <text class="body-text" x="238" y="192">Paid tier</text>
  <rect class="card-accent" x="311" y="160" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="378" y="192">Native</text>
  <rect class="card-accent" x="451" y="160" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="518" y="192">Native</text>
  <rect class="card-accent" x="591" y="160" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="658" y="192">Yes</text>
  <rect class="card-neutral" x="731" y="160" width="134" height="56" rx="6" />
  <text class="body-text" x="798" y="192">New service</text>
  <text class="row-head" x="154" y="256">Cloudflare</text>
  <rect class="card-neutral" x="171" y="224" width="134" height="56" rx="6" />
  <text class="body-text" x="238" y="256">No</text>
  <rect class="card-soft" x="311" y="224" width="134" height="56" rx="6" />
  <text class="body-text" x="378" y="256">Add-on</text>
  <rect class="card-soft" x="451" y="224" width="134" height="56" rx="6" />
  <text class="body-text" x="518" y="256">Partial</text>
  <rect class="card-accent" x="591" y="224" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="658" y="256">Yes</text>
  <rect class="card-soft" x="731" y="224" width="134" height="56" rx="6" />
  <text class="body-text" x="798" y="249">If already</text>
  <text class="body-text" x="798" y="263">on CF</text>
  <text class="row-head" x="154" y="320">Kong</text>
  <rect class="card-soft" x="171" y="288" width="134" height="56" rx="6" />
  <text class="body-text" x="238" y="320">OSS core</text>
  <rect class="card-soft" x="311" y="288" width="134" height="56" rx="6" />
  <text class="body-text" x="378" y="320">Plugin</text>
  <rect class="card-soft" x="451" y="288" width="134" height="56" rx="6" />
  <text class="body-text" x="518" y="320">Plugin</text>
  <rect class="card-soft" x="591" y="288" width="134" height="56" rx="6" />
  <text class="body-text" x="658" y="320">Basic</text>
  <rect class="card-accent" x="731" y="288" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="798" y="320">Your mesh</text>
  <rect class="card-accent" x="300" y="367" width="16" height="14" rx="3" />
  <text class="legend-text" x="322" y="378">Strong</text>
  <rect class="card-soft" x="410" y="367" width="16" height="14" rx="3" />
  <text class="legend-text" x="432" y="378">Partial</text>
  <rect class="card-neutral" x="520" y="367" width="16" height="14" rx="3" />
  <text class="legend-text" x="542" y="378">Not the job</text>
</svg>
