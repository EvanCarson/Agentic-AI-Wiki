<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where a signed passport is actually checked</title>
  <desc id="d">One agent holding a signed passport makes three calls. The call into a step of the issuer's own platform is intercepted and can be refused. The call into a third-party MCP server is checked only if that server was onboarded to the control tower. The call to an outside SaaS API or a partner system carries the passport as a header nothing on the far side reads.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="30">One credential, three calls, one enforcement point.</text>

  <rect class="adj" x="20" y="205" width="200" height="86" />
  <text class="hd" x="120" y="240">Agent</text>
  <text class="vd" x="120" y="265">+ signed passport</text>

  <path class="arrow" d="M 220 230 L 235 230 L 235 113 L 244 113" />
  <path class="arrow" d="M 220 248 L 244 248" />
  <path class="arrow" d="M 220 266 L 235 266 L 235 383 L 244 383" />

  <rect class="box" x="250" y="70" width="240" height="86" />
  <text class="hd" x="370" y="102">Issuer's workflow</text>
  <text class="vd" x="370" y="128">a step in the platform</text>

  <path class="arrow" d="M 490 113 L 594 113" />

  <rect class="hero" x="600" y="70" width="270" height="86" />
  <text class="hd-inv" x="735" y="105">Refusal possible</text>
  <text class="vd-inv" x="735" y="131">the call is intercepted</text>

  <rect class="box" x="250" y="205" width="240" height="86" />
  <text class="hd" x="370" y="237">Registered MCP server</text>
  <text class="vd" x="370" y="263">onboarded to the tower</text>

  <path class="arrow" d="M 490 248 L 594 248" />

  <rect class="adj" x="600" y="205" width="270" height="86" />
  <text class="hd" x="735" y="240">Only if onboarded</text>
  <text class="vd" x="735" y="266">else no verifier exists</text>

  <rect class="box" x="250" y="340" width="240" height="86" />
  <text class="hd" x="370" y="372">Outside API, partner</text>
  <text class="vd" x="370" y="398">a system you do not run</text>

  <path class="arrow" d="M 490 383 L 594 383" />

  <rect class="box" x="600" y="340" width="270" height="86" />
  <text class="hd" x="735" y="375">Nobody checks</text>
  <text class="vd" x="735" y="401">the passport is a header</text>
</svg>
