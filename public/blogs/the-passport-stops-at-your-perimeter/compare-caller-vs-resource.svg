<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Caller-side and resource-side policy compared</title>
  <desc id="d">Two columns. Policy held at the caller covers many resources from one place, and stops at any resource that declines to verify the credential. Policy held at the resource binds every caller including an unapproved one, and must be built once per resource.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="20" y="28">Each one covers the other's blind spot.</text>

  <text class="lbl" x="20" y="96">Covers</text>
  <text class="lbl" x="20" y="206">Blind spot</text>

  <rect class="adj" x="180" y="52" width="320" height="92" />
  <text class="hd" x="340" y="82">Policy at the caller</text>
  <text class="vd" x="340" y="108">many resources governed</text>
  <text class="vd" x="340" y="128">from a single place</text>

  <rect class="hero" x="530" y="52" width="320" height="92" />
  <text class="hd-inv" x="690" y="82">Policy at the resource</text>
  <text class="vd-inv" x="690" y="108">every caller, including</text>
  <text class="vd-inv" x="690" y="128">the one you never approved</text>

  <rect class="box" x="180" y="162" width="320" height="96" />
  <text class="vd" x="340" y="196">stops at any resource</text>
  <text class="vd" x="340" y="218">that declines to verify</text>

  <rect class="adj" x="530" y="162" width="320" height="96" />
  <text class="vd" x="690" y="196">must be built once</text>
  <text class="vd" x="690" y="218">per system of record</text>
</svg>
