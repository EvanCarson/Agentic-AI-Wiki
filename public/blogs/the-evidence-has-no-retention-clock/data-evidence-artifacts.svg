<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="at ad">
  <title id="at">Four evidence artefacts by whether you keep them, what they cost and what they prove</title>
  <desc id="ad">A four-row matrix. Weights and checkpoints are not retained and cost terabytes. Sandbox logs are sampled and partially kept. Allowed tool calls are kept cheaply but only show what the agent did. Rejected tool calls are cheap, prove what the agent tried, and are the one row almost nobody retains.</desc>
  <style>
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 6; ry: 6; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .75; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="label" x="450" y="28" text-anchor="middle">What the guidance asks you to preserve</text>

  <text class="head" x="317" y="60" text-anchor="middle">Kept by default</text>
  <text class="head" x="539" y="60" text-anchor="middle">Cheap to keep</text>
  <text class="head" x="761" y="60" text-anchor="middle">Proves what it tried</text>

  <text class="label" x="196" y="104" text-anchor="end">Weights + checkpoints</text>
  <rect class="weak" x="212" y="76" width="210" height="52" />
  <text class="label" x="317" y="108" text-anchor="middle">No</text>
  <rect class="weak" x="434" y="76" width="210" height="52" />
  <text class="label" x="539" y="108" text-anchor="middle">No — terabytes</text>
  <rect class="mid" x="656" y="76" width="210" height="52" />
  <text class="label" x="761" y="108" text-anchor="middle">Partly</text>

  <text class="label" x="196" y="164" text-anchor="end">Sandbox logs</text>
  <rect class="mid" x="212" y="136" width="210" height="52" />
  <text class="label" x="317" y="168" text-anchor="middle">Sampled</text>
  <rect class="mid" x="434" y="136" width="210" height="52" />
  <text class="label" x="539" y="168" text-anchor="middle">Depends on volume</text>
  <rect class="mid" x="656" y="136" width="210" height="52" />
  <text class="label" x="761" y="168" text-anchor="middle">Partly</text>

  <text class="label" x="196" y="224" text-anchor="end">Allowed tool calls</text>
  <rect class="strong" x="212" y="196" width="210" height="52" />
  <text class="label-inv" x="317" y="228" text-anchor="middle">Yes</text>
  <rect class="strong" x="434" y="196" width="210" height="52" />
  <text class="label-inv" x="539" y="228" text-anchor="middle">Yes</text>
  <rect class="weak" x="656" y="196" width="210" height="52" />
  <text class="label" x="761" y="228" text-anchor="middle">No — only what it did</text>

  <text class="label" x="196" y="284" text-anchor="end">Rejected tool calls</text>
  <rect class="weak" x="212" y="256" width="210" height="52" />
  <text class="label" x="317" y="288" text-anchor="middle">No — a status code</text>
  <rect class="strong" x="434" y="256" width="210" height="52" />
  <text class="label-inv" x="539" y="288" text-anchor="middle">Yes — a few bytes</text>
  <rect class="strong" x="656" y="256" width="210" height="52" />
  <text class="label-inv" x="761" y="288" text-anchor="middle">Yes — the intent</text>

  <rect class="weak" x="212" y="334" width="22" height="16" />
  <text class="label" x="242" y="347" text-anchor="start">No / weak</text>
  <rect class="mid" x="352" y="334" width="22" height="16" />
  <text class="label" x="382" y="347" text-anchor="start">Partial</text>
  <rect class="strong" x="472" y="334" width="22" height="16" />
  <text class="label" x="502" y="347" text-anchor="start">Yes / strong</text>

  <text class="sub" x="450" y="382" text-anchor="middle">The bottom row is the cheapest artefact on the page and the one least often retained.</text>
</svg>
