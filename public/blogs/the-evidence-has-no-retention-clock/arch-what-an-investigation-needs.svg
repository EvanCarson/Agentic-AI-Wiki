<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="et ed">
  <title id="et">From what a run emits to what incident reporting needs</title>
  <desc id="ed">Three columns. An agent run emits model requests, allowed tool calls, rejected tool calls, sandbox logs and weights plus checkpoints. A default stack keeps sampled traces and platform logs on short TTLs, reduces a refused call to a status code with its arguments gone, and does not store weights per run. The third column holds the three reporting practices — identify who was affected, notify government, share publicly — which depend on the artefacts the middle column dropped.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .miss   { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; stroke-dasharray: 6 5; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#ea); }
  </style>
  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="label" x="152" y="34" text-anchor="middle">What the run emits</text>
  <text class="label" x="450" y="34" text-anchor="middle">What you keep by default</text>
  <text class="label" x="748" y="34" text-anchor="middle">What reporting then needs</text>

  <rect class="box" x="24" y="56" width="256" height="40" />
  <text class="label" x="152" y="81" text-anchor="middle">Model requests</text>

  <rect class="box" x="24" y="104" width="256" height="40" />
  <text class="label" x="152" y="129" text-anchor="middle">Allowed tool calls</text>

  <rect class="adj" x="24" y="152" width="256" height="40" />
  <text class="label" x="152" y="177" text-anchor="middle">Rejected tool calls</text>

  <rect class="box" x="24" y="200" width="256" height="40" />
  <text class="label" x="152" y="225" text-anchor="middle">Sandbox logs</text>

  <rect class="box" x="24" y="248" width="256" height="40" />
  <text class="label" x="152" y="273" text-anchor="middle">Weights + checkpoints</text>

  <path class="arrow" d="M 284 120 L 316 120" />
  <path class="arrow" d="M 284 176 L 316 176" />
  <path class="arrow" d="M 284 232 L 316 232" />

  <rect class="box" x="322" y="56" width="256" height="44" />
  <text class="label" x="450" y="76" text-anchor="middle">Traces, sampled</text>
  <text class="sub" x="450" y="94" text-anchor="middle">a TTL measured in days</text>

  <rect class="box" x="322" y="112" width="256" height="44" />
  <text class="label" x="450" y="132" text-anchor="middle">Platform logs</text>
  <text class="sub" x="450" y="150" text-anchor="middle">a shorter TTL</text>

  <rect class="miss" x="322" y="168" width="256" height="44" />
  <text class="label" x="450" y="188" text-anchor="middle">A 403 in a log line</text>
  <text class="sub" x="450" y="206" text-anchor="middle">the arguments are gone</text>

  <rect class="miss" x="322" y="224" width="256" height="44" />
  <text class="label" x="450" y="244" text-anchor="middle">Weights + checkpoints</text>
  <text class="sub" x="450" y="262" text-anchor="middle">not stored per run</text>

  <path class="arrow" d="M 582 134 L 614 134" />
  <path class="arrow" d="M 582 190 L 614 190" />
  <path class="arrow" d="M 582 246 L 614 246" />

  <rect class="box" x="620" y="76" width="256" height="50" />
  <text class="label" x="748" y="100" text-anchor="middle">Who was affected</text>
  <text class="sub" x="748" y="118" text-anchor="middle">practice 8</text>

  <rect class="box" x="620" y="146" width="256" height="50" />
  <text class="label" x="748" y="170" text-anchor="middle">Notify government</text>
  <text class="sub" x="748" y="188" text-anchor="middle">practice 9</text>

  <rect class="box" x="620" y="216" width="256" height="50" />
  <text class="label" x="748" y="240" text-anchor="middle">Share publicly</text>
  <text class="sub" x="748" y="258" text-anchor="middle">practice 10</text>

  <text class="sub" x="450" y="330" text-anchor="middle">Every answer in the third column is reconstructed from the second.</text>

  <rect class="adj" x="180" y="356" width="540" height="46" />
  <text class="label" x="450" y="384" text-anchor="middle">The refused call is the only record of what the agent tried.</text>

  <text class="sub" x="450" y="428" text-anchor="middle">Practice 5 names it. No retention period is set.</text>
</svg>
