<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Four isolation stacks for agent code execution</title>
  <desc id="d">Agent-written code sits at the top of four different stacks over the same host kernel. E2B places a guest kernel inside a Firecracker microVM between them. Modal interposes gVisor, a user-space kernel that filters syscalls before they reach the host. Daytona runs a container from a pre-warmed snapshot over namespaces and cgroups, sharing the host kernel. Cloudflare runs a container attached to a Worker at the edge.</desc>
  <style>
    .box     { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj     { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero    { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .colname   { font-family: var(--font-display); font-size: 14px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink, #1a1a1a); opacity: .72; text-anchor: middle; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--paper, #fff); opacity: .88; text-anchor: middle; }
    .axis      { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .72; }
    .note      { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .72; text-anchor: middle; }
  </style>

  <text class="colname" x="127" y="32">E2B</text>
  <text class="colname" x="342" y="32">Modal</text>
  <text class="colname" x="557" y="32">Daytona</text>
  <text class="colname" x="772" y="32">Cloudflare</text>

  <rect class="adj" x="30" y="48" width="195" height="58" rx="8" ry="8" />
  <text class="label" x="127" y="74">Agent-written code</text>
  <text class="sub" x="127" y="93">untrusted, always</text>

  <rect class="adj" x="245" y="48" width="195" height="58" rx="8" ry="8" />
  <text class="label" x="342" y="74">Agent-written code</text>
  <text class="sub" x="342" y="93">untrusted, always</text>

  <rect class="adj" x="460" y="48" width="195" height="58" rx="8" ry="8" />
  <text class="label" x="557" y="74">Agent-written code</text>
  <text class="sub" x="557" y="93">untrusted, always</text>

  <rect class="adj" x="675" y="48" width="195" height="58" rx="8" ry="8" />
  <text class="label" x="772" y="74">Agent-written code</text>
  <text class="sub" x="772" y="93">untrusted, always</text>

  <rect class="hero" x="30" y="130" width="195" height="86" rx="8" ry="8" />
  <text class="label-inv" x="127" y="164">Guest kernel</text>
  <text class="sub-inv" x="127" y="185">its own, per sandbox</text>

  <rect class="adj" x="245" y="130" width="195" height="86" rx="8" ry="8" />
  <text class="label" x="342" y="164">gVisor</text>
  <text class="sub" x="342" y="185">user-space kernel</text>

  <rect class="box" x="460" y="130" width="195" height="86" rx="8" ry="8" />
  <text class="label" x="557" y="164">Container</text>
  <text class="sub" x="557" y="185">namespaces + cgroups</text>

  <rect class="box" x="675" y="130" width="195" height="86" rx="8" ry="8" />
  <text class="label" x="772" y="164">Container</text>
  <text class="sub" x="772" y="185">attached to a Worker</text>

  <rect class="hero" x="30" y="240" width="195" height="86" rx="8" ry="8" />
  <text class="label-inv" x="127" y="274">Firecracker microVM</text>
  <text class="sub-inv" x="127" y="295">hypervisor boundary</text>

  <rect class="adj" x="245" y="240" width="195" height="86" rx="8" ry="8" />
  <text class="label" x="342" y="268">Syscall filtering</text>
  <text class="sub" x="342" y="289">host kernel reached</text>
  <text class="sub" x="342" y="305">only through gVisor</text>

  <rect class="box" x="460" y="240" width="195" height="86" rx="8" ry="8" />
  <text class="label" x="557" y="268">Pre-warmed snapshot</text>
  <text class="sub" x="557" y="289">fastest start;</text>
  <text class="sub" x="557" y="305">no kernel boundary</text>

  <rect class="box" x="675" y="240" width="195" height="86" rx="8" ry="8" />
  <text class="label" x="772" y="268">Workers runtime</text>
  <text class="sub" x="772" y="289">placed at the edge,</text>
  <text class="sub" x="772" y="305">next to the request</text>

  <rect class="box" x="30" y="360" width="840" height="60" rx="8" ry="8" />
  <text class="label" x="450" y="386">Host kernel · host hardware</text>
  <text class="sub" x="450" y="406">shared by every tenant on the machine</text>

  <text class="axis" x="30" y="342">Distance from the host kernel — top box is the workload, bottom bar is what everyone shares</text>

  <text class="note" x="450" y="458">The boundary you can put in a security questionnaire is the one with its own kernel.</text>
  <text class="note" x="450" y="478">For a single-tenant agent running your own code on your own data, a container is usually enough.</text>
</svg>
