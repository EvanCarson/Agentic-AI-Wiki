<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Where each sandbox platform leans hardest</title>
  <desc id="d">A matrix of E2B, Daytona, Modal and Cloudflare Sandbox against five axes: isolation boundary, whether idle time is billed, session lifetime, egress control granularity and GPU support. No platform leads on every axis, so the choice depends on workload shape rather than overall quality.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-head { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .mid    { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .weak   { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .cv     { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .cv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--paper, #fff); text-anchor: middle; }
    .legend { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; }
  </style>

  <text class="chart-title" x="450" y="26">Five axes, four different bets</text>

  <text class="col-head" x="298" y="58">Isolation</text><text class="col-head" x="298" y="71">boundary</text>
  <text class="col-head" x="424" y="58">Idle time</text><text class="col-head" x="424" y="71">billed?</text>
  <text class="col-head" x="550" y="58">Session</text><text class="col-head" x="550" y="71">lifetime</text>
  <text class="col-head" x="676" y="58">Egress</text><text class="col-head" x="676" y="71">control</text>
  <text class="col-head" x="802" y="58">GPU</text><text class="col-head" x="802" y="71">workloads</text>

  <text class="row-head" x="24" y="110">E2B</text>
  <rect class="strong" x="240" y="86" width="116" height="40" rx="5" /><text class="cv-inv" x="298" y="111">Guest kernel</text>
  <rect class="weak" x="366" y="86" width="116" height="40" rx="5" /><text class="cv" x="424" y="111">While alive</text>
  <rect class="strong" x="492" y="86" width="116" height="40" rx="5" /><text class="cv-inv" x="550" y="111">Hours</text>
  <rect class="strong" x="618" y="86" width="116" height="40" rx="5" /><text class="cv-inv" x="676" y="111">IP · CIDR · domain</text>
  <rect class="weak" x="744" y="86" width="116" height="40" rx="5" /><text class="cv" x="802" y="111">CPU only</text>

  <text class="row-head" x="24" y="172">Daytona</text>
  <rect class="mid" x="240" y="148" width="116" height="40" rx="5" /><text class="cv" x="298" y="173">Container</text>
  <rect class="mid" x="366" y="148" width="116" height="40" rx="5" /><text class="cv" x="424" y="173">Alive + auto-stop</text>
  <rect class="strong" x="492" y="148" width="116" height="40" rx="5" /><text class="cv-inv" x="550" y="173">Until stopped</text>
  <rect class="mid" x="618" y="148" width="116" height="40" rx="5" /><text class="cv" x="676" y="173">Tier-dependent</text>
  <rect class="weak" x="744" y="148" width="116" height="40" rx="5" /><text class="cv" x="802" y="173">CPU only</text>

  <text class="row-head" x="24" y="234">Modal</text>
  <rect class="mid" x="240" y="210" width="116" height="40" rx="5" /><text class="cv" x="298" y="235">gVisor</text>
  <rect class="strong" x="366" y="210" width="116" height="40" rx="5" /><text class="cv-inv" x="424" y="235">Active only</text>
  <rect class="strong" x="492" y="210" width="116" height="40" rx="5" /><text class="cv-inv" x="550" y="235">Until stopped</text>
  <rect class="mid" x="618" y="210" width="116" height="40" rx="5" /><text class="cv" x="676" y="235">Block or CIDR</text>
  <rect class="strong" x="744" y="210" width="116" height="40" rx="5" /><text class="cv-inv" x="802" y="235">Supported</text>

  <text class="row-head" x="24" y="296">Cloudflare</text>
  <rect class="mid" x="240" y="272" width="116" height="40" rx="5" /><text class="cv" x="298" y="297">Edge container</text>
  <rect class="mid" x="366" y="272" width="116" height="40" rx="5" /><text class="cv" x="424" y="297">Until it sleeps</text>
  <rect class="weak" x="492" y="272" width="116" height="40" rx="5" /><text class="cv" x="550" y="297">10 min default</text>
  <rect class="mid" x="618" y="272" width="116" height="40" rx="5" /><text class="cv" x="676" y="297">On/off + Worker</text>
  <rect class="weak" x="744" y="272" width="116" height="40" rx="5" /><text class="cv" x="802" y="297">CPU only</text>

  <rect class="strong" x="240" y="336" width="15" height="15" rx="3" />
  <text class="legend" x="262" y="348">Strongest here</text>
  <rect class="mid" x="400" y="336" width="15" height="15" rx="3" />
  <text class="legend" x="422" y="348">Workable, with configuration</text>
  <rect class="weak" x="660" y="336" width="15" height="15" rx="3" />
  <text class="legend" x="682" y="348">Weakest here</text>

  <text class="legend" x="24" y="384" style="opacity:.7">Column two is the one that decides an agent workload's bill, and it is the one no benchmark reports.</text>
</svg>
