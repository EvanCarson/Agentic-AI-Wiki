<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Two billing shapes over the same agent loop</title>
  <desc id="d">A multi-step agent loop is drawn as alternating spans: long model-inference waits separated by short code executions. Under a bill-while-alive model the whole 280-second lifetime is charged. Under a bill-while-active model only the 40 seconds of execution are charged. The ratio is set by inference latency, which rises as reasoning effort rises.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .rowlab { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; }
    .tot    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .72; }
    .noteC  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .72; text-anchor: middle; }
    .idle   { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .exec   { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .full   { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .empty  { fill: none; stroke: var(--ink, #1a1a1a); stroke-width: 1.25; stroke-dasharray: 5 4; opacity: .55; }
    .inbar  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
  </style>

  <text class="chart-title" x="450" y="24">Same work, same wall clock, two bills</text>

  <text class="note" x="190" y="52">One agent task — 6 of 20 steps shown. Each step: ~12 s of model inference, ~2 s of execution.</text>

  <text class="rowlab" x="24" y="84">The loop</text>
  <rect class="idle" x="190" y="62" width="87" height="34" rx="4" />
  <rect class="exec" x="277" y="62" width="15" height="34" rx="2" />
  <rect class="idle" x="292" y="62" width="87" height="34" rx="4" />
  <rect class="exec" x="379" y="62" width="15" height="34" rx="2" />
  <rect class="idle" x="393" y="62" width="87" height="34" rx="4" />
  <rect class="exec" x="480" y="62" width="15" height="34" rx="2" />
  <rect class="idle" x="495" y="62" width="87" height="34" rx="4" />
  <rect class="exec" x="582" y="62" width="15" height="34" rx="2" />
  <rect class="idle" x="597" y="62" width="87" height="34" rx="4" />
  <rect class="exec" x="684" y="62" width="15" height="34" rx="2" />
  <rect class="idle" x="698" y="62" width="87" height="34" rx="4" />
  <rect class="exec" x="785" y="62" width="15" height="34" rx="2" />
  <text class="note" x="896" y="84" style="text-anchor:end">waiting · running</text>

  <text class="rowlab" x="24" y="154">Billed while alive</text>
  <rect class="full" x="190" y="132" width="610" height="34" rx="4" />
  <text class="inbar" x="495" y="154">the sandbox existed for all of it</text>
  <text class="tot" x="812" y="154">280 s</text>

  <text class="rowlab" x="24" y="218">Billed while active</text>
  <rect class="empty" x="190" y="196" width="610" height="34" rx="4" />
  <rect class="exec" x="277" y="196" width="15" height="34" rx="2" />
  <rect class="exec" x="379" y="196" width="15" height="34" rx="2" />
  <rect class="exec" x="480" y="196" width="15" height="34" rx="2" />
  <rect class="exec" x="582" y="196" width="15" height="34" rx="2" />
  <rect class="exec" x="684" y="196" width="15" height="34" rx="2" />
  <rect class="exec" x="785" y="196" width="15" height="34" rx="2" />
  <text class="tot" x="812" y="218">40 s</text>

  <text class="noteC" x="450" y="262">The gap is inference latency — a variable you do not control, and one that grows as reasoning effort goes up.</text>
  <text class="noteC" x="450" y="282">Per-vCPU-hour rates are not comparable until you normalise them by which of these two rules applies.</text>
</svg>
