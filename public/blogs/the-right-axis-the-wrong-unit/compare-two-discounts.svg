<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t3 d3">
  <title id="t3">Three discounts on the same twenty-step trajectory</title>
  <desc id="d3">Three columns giving the modelled bill for one twenty-step task. The baseline verbose model costs 31.1 cents. Writing three times fewer tokens brings it to 18.1 cents, a 1.7 times saving. Paying a third of the token price brings it to 10.4 cents, the full 3 times saving. Brevity passes through only part of its advantage because the prefix and the tool results do not shrink.</desc>
  <style>
    .col   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .colh  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .colhh { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .big   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 22px; fill: var(--ink); }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="ttl" x="20" y="28">Modelled bill for one 20-step task: 4k prefix, 600-token tool results</text>

  <rect class="col" x="20" y="48" width="270" height="34" rx="6" />
  <text class="hd" x="36" y="71">Baseline — 1,200 tokens/step</text>
  <rect class="col" x="20" y="88" width="270" height="140" rx="6" />
  <text class="big" x="36" y="128">$0.311</text>
  <text class="label" x="36" y="156">422k input, 24k output</text>
  <text class="sub" x="36" y="184">Input is 81% of the bill, and</text>
  <text class="sub" x="36" y="202">most of it is re-read transcript.</text>

  <rect class="colh" x="310" y="48" width="270" height="34" rx="6" />
  <text class="hd" x="326" y="71">3× fewer tokens written</text>
  <rect class="col" x="310" y="88" width="270" height="140" rx="6" />
  <text class="big" x="326" y="128">$0.181</text>
  <text class="label" x="326" y="156">270k input, 8k output — 1.7×</text>
  <text class="sub" x="326" y="184">The prefix and the tool results</text>
  <text class="sub" x="326" y="202">did not shrink, so 3× became 1.7×.</text>

  <rect class="colhh" x="600" y="48" width="280" height="34" rx="6" />
  <text class="hd-inv" x="616" y="71">3× cheaper tokens</text>
  <rect class="col" x="600" y="88" width="280" height="140" rx="6" />
  <text class="big" x="616" y="128">$0.104</text>
  <text class="label" x="616" y="156">same 422k / 24k — 3.0×</text>
  <text class="sub" x="616" y="184">A price cut applies to every</text>
  <text class="sub" x="616" y="202">token, including the re-reads.</text>

  <text class="sub" x="20" y="262">Turn prompt caching on and brevity does better, not worse: the cached prefix stops being a floor, so</text>
  <text class="sub" x="20" y="282">the brief model's advantage widens from 1.7× to about 2.1× on the same trajectory.</text>
</svg>
