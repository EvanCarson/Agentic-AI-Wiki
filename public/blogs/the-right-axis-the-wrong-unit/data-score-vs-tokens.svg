<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Terminal-Bench 2.1 score against tokens generated per attempt</title>
  <desc id="d">Two paired bars. On score, Beam is reported at 80.1 percent and GLM-5.2 at 81.0 percent, a difference of under one point. On tokens generated per attempt, Beam is reported at roughly 25,000 and GLM-5.2 at roughly 80,000, a difference of more than three times. Both sets of figures are the vendor's own.</desc>
  <style>
    .track { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; }
    .hero  { fill: var(--accent, #d4421e); }
    .adj   { fill: var(--accent-soft); }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .75; }
    .row   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .val   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .rule  { stroke: var(--border-soft); stroke-width: 1; }
  </style>

  <text class="ttl" x="20" y="32">Under a point apart on the score. Three times apart on the tokens.</text>

  <text class="hd" x="20" y="66">Terminal-Bench 2.1 — pass rate, 100% scale</text>
  <text class="row" x="20" y="98">Beam</text>
  <rect class="track" x="150" y="80" width="600" height="26" rx="4" />
  <rect class="adj" x="150" y="80" width="481" height="26" rx="4" />
  <text class="val" x="762" y="99">80.1%</text>
  <text class="row" x="20" y="136">GLM-5.2</text>
  <rect class="track" x="150" y="118" width="600" height="26" rx="4" />
  <rect class="adj" x="150" y="118" width="486" height="26" rx="4" />
  <text class="val" x="762" y="137">81.0%</text>

  <line class="rule" x1="20" y1="172" x2="880" y2="172" />

  <text class="hd" x="20" y="204">Tokens generated per attempt — 100k scale</text>
  <text class="row" x="20" y="236">Beam</text>
  <rect class="track" x="150" y="218" width="600" height="26" rx="4" />
  <rect class="hero" x="150" y="218" width="150" height="26" rx="4" />
  <text class="val" x="762" y="237">~25,000</text>
  <text class="row" x="20" y="274">GLM-5.2</text>
  <rect class="track" x="150" y="256" width="600" height="26" rx="4" />
  <rect class="hero" x="150" y="256" width="480" height="26" rx="4" />
  <text class="val" x="762" y="275">~80,000</text>

  <text class="sub" x="20" y="326">Scores are Reflection's own and were not independently reproduced at launch; the FP8 and NVFP4</text>
  <text class="sub" x="20" y="346">builds are reported lower, at 78.9% and 78.4%. The token figures come from one outlet's reading</text>
  <text class="sub" x="20" y="366">of Reflection's chart, so treat them as the right order of magnitude rather than measurements.</text>
</svg>
