<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t2 d2">
  <title id="t2">Why a generated token is billed more than once in an agent loop</title>
  <desc id="d2">A twenty-step loop drawn as a growing stack. A token written at step three is paid for once at the output rate, then re-sent as input on every one of the seventeen later steps. The marginal cost of a token written at step i in an N-step task is the output price plus N minus i times the effective input price.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="30">The transcript sent as input at each step</text>

  <rect class="box" x="20" y="48" width="120" height="30" rx="4" />
  <text class="label" x="34" y="68">prefix</text>
  <text class="sub" x="150" y="68">step 1 — the stable prefix only</text>

  <rect class="box" x="20" y="92" width="120" height="30" rx="4" />
  <text class="label" x="34" y="112">prefix</text>
  <rect class="adj" x="146" y="92" width="110" height="30" rx="4" />
  <text class="label" x="160" y="112">steps 1–2</text>
  <text class="sub" x="266" y="112">step 3 — and now the token below is written</text>

  <rect class="box" x="20" y="136" width="120" height="30" rx="4" />
  <text class="label" x="34" y="156">prefix</text>
  <rect class="adj" x="146" y="136" width="110" height="30" rx="4" />
  <text class="label" x="160" y="156">steps 1–2</text>
  <rect class="hero" x="262" y="136" width="150" height="30" rx="4" />
  <text class="label-inv" x="274" y="156">written at step 3</text>
  <text class="sub" x="422" y="156">step 4 — paid again, as input</text>

  <rect class="box" x="20" y="180" width="120" height="30" rx="4" />
  <text class="label" x="34" y="200">prefix</text>
  <rect class="adj" x="146" y="180" width="110" height="30" rx="4" />
  <text class="label" x="160" y="200">steps 1–2</text>
  <rect class="hero" x="262" y="180" width="150" height="30" rx="4" />
  <text class="label-inv" x="274" y="200">written at step 3</text>
  <rect class="adj" x="418" y="180" width="110" height="30" rx="4" />
  <text class="label" x="432" y="200">step 4</text>
  <text class="sub" x="538" y="200">step 5 — paid again</text>

  <path class="arrow" d="M 337 224 L 337 268" />
  <text class="sub" x="352" y="252">…seventeen times in a twenty-step task</text>

  <rect class="box" x="20" y="276" width="508" height="30" rx="4" />
  <text class="label" x="34" y="296">prefix + every step so far, including the step-3 token</text>
  <text class="sub" x="538" y="296">step 20</text>

  <text class="ttl" x="20" y="358">So the marginal cost of one generated token is not its output price</text>
  <rect class="box" x="20" y="374" width="620" height="44" rx="6" />
  <text class="mono" x="36" y="402">cost(token at step i) = p_out + (N - i) × p_in_effective</text>
  <text class="sub" x="20" y="444">At N=20 with input at $0.60 and output at $2.40 per million, a token written mid-trajectory costs about</text>
  <text class="sub" x="20" y="464">$8.10 per million — roughly 3.4× its sticker output price. Prompt caching is what collapses that multiplier.</text>
</svg>
