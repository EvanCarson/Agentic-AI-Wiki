<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="cbT cbD">
  <title id="cbT">Three controls and the stage each one removes</title>
  <desc id="cbD">Three columns. Splitting the reader from the actor removes the ability to act on an injected instruction, leaving an agent that can only write words; it does not stop the payload arriving. Egress default-deny removes exfiltration and second-stage payload fetches; it does not stop a local state change. Approving on the concrete diff rather than the stated intent removes the silent change; it costs an interruption and depends on the reviewer reading the diff.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Where the demonstrated chain breaks</text>

  <rect class="hero" x="35" y="44" width="250" height="180" />
  <text class="hd-inv" x="160" y="76" text-anchor="middle">Reader / actor split</text>
  <text class="cell-inv" x="160" y="110" text-anchor="middle">Telemetry is read by an agent</text>
  <text class="cell-inv" x="160" y="128" text-anchor="middle">with read-only credentials</text>
  <text class="cell-inv" x="160" y="146" text-anchor="middle">and no state-changing tools.</text>
  <text class="cell-inv" x="160" y="176" text-anchor="middle">Removes: acting on the</text>
  <text class="cell-inv" x="160" y="194" text-anchor="middle">injected instruction at all.</text>
  <text class="sub" x="160" y="248" text-anchor="middle">Does not stop delivery.</text>
  <text class="sub" x="160" y="266" text-anchor="middle">Costs a second run and a human.</text>

  <rect class="adj" x="325" y="44" width="250" height="180" />
  <text class="hd" x="450" y="76" text-anchor="middle">Egress default-deny</text>
  <text class="cell" x="450" y="110" text-anchor="middle">The agent process reaches</text>
  <text class="cell" x="450" y="128" text-anchor="middle">an allowlist and nothing else;</text>
  <text class="cell" x="450" y="146" text-anchor="middle">a new destination is an incident.</text>
  <text class="cell" x="450" y="176" text-anchor="middle">Removes: exfiltration and</text>
  <text class="cell" x="450" y="194" text-anchor="middle">second-stage payload fetches.</text>
  <text class="sub" x="450" y="248" text-anchor="middle">Does not stop a local change.</text>
  <text class="sub" x="450" y="266" text-anchor="middle">Costs allowlist maintenance.</text>

  <rect class="box" x="625" y="44" width="250" height="180" />
  <text class="hd" x="750" y="76" text-anchor="middle">Approve on the diff</text>
  <text class="cell" x="750" y="110" text-anchor="middle">The prompt shows the concrete</text>
  <text class="cell" x="750" y="128" text-anchor="middle">effect — this DNS record,</text>
  <text class="cell" x="750" y="146" text-anchor="middle">this policy, this command.</text>
  <text class="cell" x="750" y="176" text-anchor="middle">Removes: the silent state</text>
  <text class="cell" x="750" y="194" text-anchor="middle">change nobody reviewed.</text>
  <text class="sub" x="750" y="248" text-anchor="middle">Fails if intent is shown instead.</text>
  <text class="sub" x="750" y="266" text-anchor="middle">Costs an interruption per action.</text>
</svg>
