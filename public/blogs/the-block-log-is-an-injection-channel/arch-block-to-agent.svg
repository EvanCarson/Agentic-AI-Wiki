<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="bcT bcD">
  <title id="bcT">How a blocked request reaches an agent's tools</title>
  <desc id="bcD">An attacker sends a request that the edge web application firewall blocks. The firewall writes the payload verbatim into the block log alongside error tracker and APM data. A triage agent reads that log while holding the operator's credentials plus shell, cloud API and package installation tools, and from there the demonstrated actions follow: a DNS change, a credential read and an outbound request. The attacker's text crosses the perimeter once as evidence and a second time as instruction.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arrBc); }
    .edge   { fill: none; stroke: var(--border-soft); stroke-width: 1.25; stroke-dasharray: 5 5; }
  </style>
  <defs>
    <marker id="arrBc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="20">One payload, two crossings</text>

  <path class="edge" d="M 196 44 L 196 470" />
  <text class="sub" x="202" y="60">your perimeter</text>

  <rect class="box" x="14" y="190" width="150" height="70" />
  <text class="label" x="89" y="220" text-anchor="middle">Attacker</text>
  <text class="sub" x="89" y="238" text-anchor="middle">unlimited attempts</text>

  <path class="arrow" d="M 168 225 L 208 225" />

  <rect class="adj" x="214" y="190" width="170" height="70" />
  <text class="label" x="299" y="220" text-anchor="middle">Edge / WAF</text>
  <text class="sub" x="299" y="238" text-anchor="middle">request blocked</text>

  <path class="arrow" d="M 388 225 L 424 225" />

  <rect class="box" x="430" y="182" width="180" height="86" />
  <text class="label" x="520" y="210" text-anchor="middle">Block log</text>
  <text class="sub" x="520" y="228" text-anchor="middle">payload stored verbatim</text>
  <text class="sub" x="520" y="246" text-anchor="middle">error tracker · APM · SIEM</text>

  <path class="arrow" d="M 614 225 L 650 225" />

  <rect class="hero" x="656" y="190" width="210" height="70" />
  <text class="label-inv" x="761" y="220" text-anchor="middle">Triage agent</text>
  <text class="sub-inv" x="761" y="238" text-anchor="middle">"review blocked traffic"</text>

  <path class="arrow" d="M 761 264 L 761 300" />

  <rect class="box" x="656" y="306" width="210" height="80" />
  <text class="label" x="761" y="334" text-anchor="middle">Operator's credentials</text>
  <text class="sub" x="761" y="354" text-anchor="middle">shell · cloud API</text>
  <text class="sub" x="761" y="372" text-anchor="middle">package installation</text>

  <path class="arrow" d="M 656 346 L 596 346 L 596 404" />
  <path class="arrow" d="M 656 360 L 430 360 L 430 404" />
  <path class="arrow" d="M 656 374 L 264 374 L 264 404" />

  <rect class="adj" x="194" y="410" width="140" height="56" />
  <text class="label" x="264" y="443" text-anchor="middle">DNS change</text>

  <rect class="adj" x="360" y="410" width="140" height="56" />
  <text class="label" x="430" y="443" text-anchor="middle">Credential read</text>

  <rect class="adj" x="526" y="410" width="140" height="56" />
  <text class="label" x="596" y="443" text-anchor="middle">Outbound request</text>

  <text class="sub" x="0" y="490">Every action inside policy, so nothing in the EDR, WAF or IAM stack has anything to fire on.</text>
</svg>
