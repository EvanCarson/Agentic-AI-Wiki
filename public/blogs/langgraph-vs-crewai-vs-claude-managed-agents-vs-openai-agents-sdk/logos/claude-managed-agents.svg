<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Claude Managed Agents logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Cloud/server outer rounded rectangle enclosing the agent dot -->
  <rect x="6" y="9" width="20" height="14" rx="5" fill="none" stroke="var(--paper)" stroke-width="2" />
  <!-- Server line detail suggesting a hosted box -->
  <line x1="6" y1="16" x2="26" y2="16" stroke="var(--paper)" stroke-width="1.25" opacity="0.5" />
  <!-- Agent dot held inside the server -->
  <circle cx="16" cy="12.5" r="2.5" fill="var(--paper)" />
  <!-- Small indicator dot below the line -->
  <circle cx="16" cy="20" r="1.5" fill="var(--paper)" opacity="0.65" />
</svg>
