<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CrewAI logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Crew of three agent dots arranged in a triangle formation -->
  <!-- Top leader dot (larger) -->
  <circle cx="16" cy="9" r="3.5" fill="var(--paper)" />
  <!-- Bottom-left crew member -->
  <circle cx="10" cy="22" r="2.5" fill="var(--paper)" opacity="0.85" />
  <!-- Bottom-right crew member -->
  <circle cx="22" cy="22" r="2.5" fill="var(--paper)" opacity="0.85" />
  <!-- Middle row connector dots -->
  <circle cx="13" cy="16" r="1.8" fill="var(--paper)" opacity="0.65" />
  <circle cx="19" cy="16" r="1.8" fill="var(--paper)" opacity="0.65" />
</svg>
