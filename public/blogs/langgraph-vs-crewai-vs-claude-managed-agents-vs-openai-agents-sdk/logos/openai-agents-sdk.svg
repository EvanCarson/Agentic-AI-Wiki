<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OpenAI Agents SDK logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Left agent shape: square -->
  <rect x="5" y="12" width="8" height="8" rx="2" fill="var(--paper)" />
  <!-- Right agent shape: circle (different shape = handoff between distinct agents) -->
  <circle cx="23" cy="16" r="4" fill="var(--paper)" />
  <!-- Arrow from square to circle indicating SDK handoff -->
  <line x1="14" y1="16" x2="18.2" y2="16" stroke="var(--paper)" stroke-width="1.75" stroke-linecap="round" />
  <!-- Arrowhead -->
  <path d="M17 13.5 L20 16 L17 18.5" fill="none" stroke="var(--paper)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
</svg>
