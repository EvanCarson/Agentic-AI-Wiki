<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="LangGraph logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Three graph nodes: top-left, top-right, bottom-center -->
  <circle cx="9" cy="10" r="3" fill="var(--paper)" />
  <circle cx="23" cy="10" r="3" fill="var(--paper)" />
  <circle cx="16" cy="22" r="3" fill="var(--paper)" />
  <!-- Edges connecting the nodes -->
  <line x1="11.6" y1="11.2" x2="20.4" y2="11.2" stroke="var(--paper)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="10.1" y1="12.6" x2="14.5" y2="19.6" stroke="var(--paper)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="21.9" y1="12.6" x2="17.5" y2="19.6" stroke="var(--paper)" stroke-width="1.5" stroke-linecap="round" />
</svg>
