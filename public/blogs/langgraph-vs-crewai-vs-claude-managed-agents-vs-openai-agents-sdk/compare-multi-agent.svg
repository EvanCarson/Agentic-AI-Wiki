<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Multi-agent stance</title>
  <desc id="d">Four-column comparison of multi-agent approaches: LangGraph supports subgraphs and supervisor patterns, CrewAI is multi-agent by construction with native crews, Claude Managed Agents uses a single autonomous harness not designed for multi-agent, OpenAI Agents SDK enables multi-agent via handoffs between agents.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="28">Multi-agent stance</text>

  <!-- Column 1: LangGraph — soft (strong but not the MOST native) -->
  <rect class="card-soft" x="10" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="115" y="72">LangGraph</text>
  <text class="body-text" x="115" y="106">Subgraphs /</text>
  <text class="body-text" x="115" y="124">supervisor patterns</text>

  <!-- Column 2: CrewAI — ACCENT (most native multi-agent) -->
  <rect class="card-accent" x="230" y="44" width="210" height="220" rx="8" />
  <text class="col-head-inv" x="335" y="72">CrewAI</text>
  <text class="body-text-inv" x="335" y="106">Native crews —</text>
  <text class="body-text-inv" x="335" y="124">multi-agent by</text>
  <text class="body-text-inv" x="335" y="142">construction</text>

  <!-- Column 3: Claude Managed Agents — neutral (single harness, NOT multi-agent-first) -->
  <rect class="card-neutral" x="450" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="555" y="72">Claude Managed</text>
  <text class="col-head" x="555" y="90">Agents</text>
  <text class="body-text" x="555" y="118">Single autonomous</text>
  <text class="body-text" x="555" y="136">harness — NOT</text>
  <text class="body-text" x="555" y="154">multi-agent-first</text>

  <!-- Column 4: OpenAI Agents SDK — soft -->
  <rect class="card-soft" x="670" y="44" width="220" height="220" rx="8" />
  <text class="col-head" x="780" y="72">OpenAI Agents</text>
  <text class="col-head" x="780" y="90">SDK</text>
  <text class="body-text" x="780" y="124">Handoffs between</text>
  <text class="body-text" x="780" y="142">agents</text>

</svg>
