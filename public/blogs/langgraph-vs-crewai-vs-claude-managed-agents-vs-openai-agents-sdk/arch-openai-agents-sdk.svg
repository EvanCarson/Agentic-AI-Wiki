<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">OpenAI Agents SDK architecture</title>
  <desc id="d">A thin Runner loop drives an Agent with tools, hands off to peer agents, and applies input/output guardrails; session state is process-local and in-memory unless you persist it yourself.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .dash  { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Runner Loop container -->
  <rect class="hero" x="40" y="46" width="820" height="206" rx="10" ry="10" />
  <text class="label-inv" x="135" y="74" text-anchor="middle" font-weight="600">Runner Loop</text>

  <rect class="box" x="72" y="92" width="178" height="120" rx="8" ry="8" />
  <text class="label" x="161" y="120" text-anchor="middle" font-weight="600">Agent</text>
  <text class="sub" x="161" y="139" text-anchor="middle">instructions (prompt)</text>
  <text class="sub" x="161" y="155" text-anchor="middle">model: GPT / Claude…</text>
  <text class="sub" x="161" y="171" text-anchor="middle">tools list</text>
  <text class="sub" x="161" y="187" text-anchor="middle">handoffs list</text>

  <rect class="box" x="290" y="92" width="178" height="120" rx="8" ry="8" />
  <text class="label" x="379" y="120" text-anchor="middle" font-weight="600">Tools</text>
  <text class="sub" x="379" y="139" text-anchor="middle">function_tool decorator</text>
  <text class="sub" x="379" y="155" text-anchor="middle">web / file search</text>
  <text class="sub" x="379" y="171" text-anchor="middle">custom fns</text>
  <text class="sub" x="379" y="187" text-anchor="middle">hosted MCP tools</text>

  <rect class="box" x="508" y="92" width="178" height="120" rx="8" ry="8" />
  <text class="label" x="597" y="120" text-anchor="middle" font-weight="600">Peer Agent</text>
  <text class="sub" x="597" y="139" text-anchor="middle">handoff target</text>
  <text class="sub" x="597" y="155" text-anchor="middle">own tools + instructions</text>
  <text class="sub" x="597" y="171" text-anchor="middle">runner re-enters loop</text>
  <text class="sub" x="597" y="187" text-anchor="middle">with new active agent</text>

  <rect class="adj" x="726" y="92" width="106" height="120" rx="8" ry="8" />
  <text class="label" x="779" y="120" text-anchor="middle" font-weight="600">Guardrails</text>
  <text class="sub" x="779" y="139" text-anchor="middle">input check</text>
  <text class="sub" x="779" y="155" text-anchor="middle">output check</text>
  <text class="sub" x="779" y="171" text-anchor="middle">run in parallel</text>
  <text class="sub" x="779" y="187" text-anchor="middle">raise tripwire</text>

  <!-- Agent <-> Tools -->
  <line class="arrow" x1="250" y1="144" x2="288" y2="144" />
  <line class="dash" x1="288" y1="162" x2="250" y2="162" />

  <!-- Peer Agent -> Guardrails -->
  <line class="arrow" x1="686" y1="152" x2="724" y2="152" />

  <!-- Agent -> Peer Agent handoff: arc clear above the Tools box -->
  <path class="arrow" d="M 250 104 C 330 70, 470 70, 540 90" />
  <text class="sub" x="395" y="74" text-anchor="middle">handoff</text>

  <!-- Below the runner: Session State + Lifecycle hooks (left), Model adapter + Tracing (right) -->
  <rect class="box" x="60" y="286" width="330" height="92" rx="8" ry="8" />
  <text class="label" x="225" y="312" text-anchor="middle" font-weight="600">Session State</text>
  <text class="sub" x="225" y="331" text-anchor="middle">process-local · in-memory by default</text>
  <text class="sub" x="225" y="347" text-anchor="middle" font-weight="600">NO built-in checkpoint or replay</text>
  <text class="sub" x="225" y="363" text-anchor="middle">persist it yourself for durability</text>
  <line class="arrow" x1="225" y1="252" x2="225" y2="284" />

  <rect class="box" x="60" y="398" width="330" height="52" rx="8" ry="8" />
  <text class="label" x="225" y="421" text-anchor="middle" font-weight="600">Lifecycle hooks</text>
  <text class="sub" x="225" y="438" text-anchor="middle">on_tool_start / on_agent_end</text>
  <line class="arrow" x1="225" y1="378" x2="225" y2="396" />

  <rect class="adj" x="510" y="286" width="330" height="76" rx="8" ry="8" />
  <text class="label" x="675" y="312" text-anchor="middle" font-weight="600">Model adapter</text>
  <text class="sub" x="675" y="331" text-anchor="middle">OpenAI models (default)</text>
  <text class="sub" x="675" y="347" text-anchor="middle">Claude / Gemini via LiteLLM adapter</text>
  <line class="arrow" x1="675" y1="252" x2="675" y2="284" />

  <rect class="box" x="510" y="382" width="330" height="68" rx="8" ry="8" />
  <text class="label" x="675" y="408" text-anchor="middle" font-weight="600">Tracing</text>
  <text class="sub" x="675" y="427" text-anchor="middle">built-in spans → dashboard</text>
  <text class="sub" x="675" y="443" text-anchor="middle">agent · tool · handoff chain</text>
  <line class="arrow" x1="675" y1="362" x2="675" y2="380" />
</svg>
