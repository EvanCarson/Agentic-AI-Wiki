<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">OpenAI Agents SDK architecture</title>
  <desc id="d">A thin Runner loop drives an Agent with tools, hands off to peer agents, and applies input/output guardrails; session state is process-local and in-memory unless you persist it yourself.</desc>
  <style>
    .box{fill:var(--paper-2,#f0ede8);stroke:var(--ink,#1a1a1a);stroke-width:1.25;}
    .hero{fill:var(--accent,#d4421e);stroke:var(--ink,#1a1a1a);stroke-width:1.25;}
    .adj{fill:var(--accent-soft,#f5c5b8);stroke:var(--ink,#1a1a1a);stroke-width:1.25;}
    .label{font-family:'Inter',system-ui,sans-serif;font-size:14px;fill:var(--ink,#1a1a1a);}
    .label-inv{font-family:'Inter',system-ui,sans-serif;font-size:14px;fill:var(--paper,#fff);}
    .label-inv-b{font-family:'Inter',system-ui,sans-serif;font-size:14px;font-weight:700;fill:var(--paper,#fff);}
    .sub{font-family:'Inter',system-ui,sans-serif;font-size:12px;fill:var(--ink,#1a1a1a);opacity:.65;}
    .sub-inv{font-family:'Inter',system-ui,sans-serif;font-size:12px;fill:var(--paper,#fff);opacity:.80;}
    .arrow{fill:none;stroke:currentColor;stroke-width:1.25;marker-end:url(#arr);}
    .arrow-back{fill:none;stroke:currentColor;stroke-width:1.25;stroke-dasharray:3 3;marker-end:url(#arr);}
    .bound{fill:none;stroke:currentColor;stroke-width:1.25;stroke-dasharray:5 4;}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Runner (hero) -->
  <rect class="hero" x="30" y="30" width="840" height="200" rx="14" ry="14"/>
  <text class="label-inv-b" x="450" y="58" text-anchor="middle" font-size="16">Runner Loop</text>

  <!-- Agent box -->
  <rect class="box" x="60" y="80" width="200" height="120" rx="8" ry="8"/>
  <text class="label" x="160" y="110" text-anchor="middle" font-weight="700">Agent</text>
  <text class="sub" x="160" y="130" text-anchor="middle">instructions (system prompt)</text>
  <text class="sub" x="160" y="148" text-anchor="middle">model (GPT-4o, Claude…)</text>
  <text class="sub" x="160" y="166" text-anchor="middle">tools list</text>
  <text class="sub" x="160" y="184" text-anchor="middle">handoffs list</text>

  <!-- Tools -->
  <rect class="box" x="300" y="80" width="180" height="120" rx="8" ry="8"/>
  <text class="label" x="390" y="110" text-anchor="middle" font-weight="700">Tools</text>
  <text class="sub" x="390" y="130" text-anchor="middle">function_tool decorator</text>
  <text class="sub" x="390" y="148" text-anchor="middle">web search / file</text>
  <text class="sub" x="390" y="166" text-anchor="middle">custom Python fns</text>
  <text class="sub" x="390" y="184" text-anchor="middle">hosted MCP tools</text>

  <!-- Agent → Tools -->
  <line class="arrow" x1="260" y1="140" x2="296" y2="140"/>
  <line class="arrow-back" x1="296" y1="158" x2="260" y2="158"/>

  <!-- Handoff Agent (peer) -->
  <rect class="box" x="520" y="80" width="180" height="120" rx="8" ry="8"/>
  <text class="label" x="610" y="110" text-anchor="middle" font-weight="700">Peer Agent</text>
  <text class="sub" x="610" y="130" text-anchor="middle">handoff target</text>
  <text class="sub" x="610" y="148" text-anchor="middle">own instructions + tools</text>
  <text class="sub" x="610" y="166" text-anchor="middle">Runner re-enters loop</text>
  <text class="sub" x="610" y="184" text-anchor="middle">with new active agent</text>

  <!-- Agent → Handoff arrow -->
  <line class="arrow" x1="484" y1="140" x2="516" y2="140"/>
  <text class="sub-inv" x="500" y="132" text-anchor="middle">handoff</text>

  <!-- Guardrails -->
  <rect class="adj" x="738" y="80" width="112" height="120" rx="8" ry="8"/>
  <text class="label" x="794" y="110" text-anchor="middle" font-weight="700">Guardrails</text>
  <text class="sub" x="794" y="130" text-anchor="middle">input check</text>
  <text class="sub" x="794" y="148" text-anchor="middle">output check</text>
  <text class="sub" x="794" y="166" text-anchor="middle">run in parallel</text>
  <text class="sub" x="794" y="184" text-anchor="middle">raise tripwire</text>

  <!-- Runner → Guardrails -->
  <line class="arrow" x1="700" y1="140" x2="734" y2="140"/>

  <!-- Session state box (process-local, no checkpoint) -->
  <rect class="box" x="30" y="268" width="400" height="130" rx="10" ry="10"/>
  <text class="label" x="230" y="298" text-anchor="middle" font-weight="700" font-size="15">Session State</text>
  <text class="sub" x="230" y="318" text-anchor="middle">process-local · in-memory by default</text>
  <text class="sub" x="230" y="338" text-anchor="middle">NO built-in checkpoint or replay</text>
  <text class="sub" x="230" y="358" text-anchor="middle">conversation history in Runner.run()</text>
  <text class="sub" x="230" y="378" text-anchor="middle">persist it yourself for durability</text>

  <!-- Runner → Session state -->
  <line class="arrow" x1="230" y1="230" x2="230" y2="264"/>

  <!-- Model adapter note -->
  <rect class="adj" x="462" y="268" width="408" height="80" rx="10" ry="10"/>
  <text class="label" x="666" y="298" text-anchor="middle" font-weight="700">Model adapter</text>
  <text class="sub" x="666" y="318" text-anchor="middle">OpenAI models (default)</text>
  <text class="sub" x="666" y="336" text-anchor="middle">Claude / Gemini / etc. via LiteLLM adapter</text>

  <!-- Runner → Model adapter -->
  <line class="arrow" x1="666" y1="230" x2="666" y2="264"/>

  <!-- Tracing / observability -->
  <rect class="box" x="462" y="378" width="408" height="70" rx="10" ry="10"/>
  <text class="label" x="666" y="406" text-anchor="middle" font-weight="700">Tracing</text>
  <text class="sub" x="666" y="424" text-anchor="middle">built-in trace spans → OpenAI dashboard or custom processor</text>
  <text class="sub" x="666" y="442" text-anchor="middle">agent name · tool name · handoff chain</text>

  <!-- Model adapter → Tracing -->
  <line class="arrow" x1="666" y1="348" x2="666" y2="374"/>

  <!-- Lifecycle hooks note -->
  <rect class="box" x="30" y="428" width="400" height="50" rx="8" ry="8"/>
  <text class="label" x="230" y="452" text-anchor="middle" font-weight="700">Lifecycle hooks</text>
  <text class="sub" x="230" y="468" text-anchor="middle">on_tool_start / on_agent_end / custom RunHooks</text>

  <!-- Session state → hooks -->
  <line class="arrow" x1="230" y1="398" x2="230" y2="424"/>
</svg>
