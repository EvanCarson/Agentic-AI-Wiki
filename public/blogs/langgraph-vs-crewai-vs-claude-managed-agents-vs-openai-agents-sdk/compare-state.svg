<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Where state lives &amp; durability</title>
  <desc id="d">Four-column comparison of state durability: LangGraph checkpoints state you own (most durable), CrewAI keeps state in-memory with optional explicit state via Flows, Claude Managed Agents holds sessions server-side on Anthropic infrastructure, OpenAI Agents SDK uses process-local in-memory sessions with no built-in checkpoint.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="28">Where state lives &amp; durability</text>

  <!-- Column 1: LangGraph — ACCENT (hero) -->
  <rect class="card-accent" x="10" y="44" width="210" height="220" rx="8" />
  <text class="col-head-inv" x="115" y="72">LangGraph</text>
  <text class="body-text-inv" x="115" y="100">Explicit checkpointed</text>
  <text class="body-text-inv" x="115" y="118">state object you own;</text>
  <text class="body-text-inv" x="115" y="136">durable, replayable</text>

  <!-- Column 2: CrewAI — neutral -->
  <rect class="card-neutral" x="230" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="335" y="72">CrewAI</text>
  <text class="body-text" x="335" y="100">In-memory in the crew;</text>
  <text class="body-text" x="335" y="118">Flows add explicit state</text>

  <!-- Column 3: Claude Managed Agents — soft -->
  <rect class="card-soft" x="450" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="555" y="72">Claude Managed</text>
  <text class="col-head" x="555" y="90">Agents</text>
  <text class="body-text" x="555" y="118">Server-held sessions on</text>
  <text class="body-text" x="555" y="136">Anthropic infra;</text>
  <text class="body-text" x="555" y="154">resumable</text>

  <!-- Column 4: OpenAI Agents SDK — neutral -->
  <rect class="card-neutral" x="670" y="44" width="220" height="220" rx="8" />
  <text class="col-head" x="780" y="72">OpenAI Agents</text>
  <text class="col-head" x="780" y="90">SDK</text>
  <text class="body-text" x="780" y="118">Process-local session;</text>
  <text class="body-text" x="780" y="136">in-memory by default;</text>
  <text class="body-text" x="780" y="154">no built-in checkpoint</text>

</svg>
