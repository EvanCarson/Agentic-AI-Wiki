<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Orchestration feature matrix</title>
  <desc id="d">Heatmap comparing LangGraph, CrewAI, Claude Managed Agents, and OpenAI Agents SDK across six axes: State durability, Control-flow, Multi-agent, Streaming, Human-in-loop, and Hosting. Strength indicated by fill color from light (weak) to dark orange-red (strong).</desc>
  <style>
    .chart-title  { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; fill: currentColor; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="32" text-anchor="middle">Orchestration feature matrix</text>

  <!--
    Layout:
    - Left margin for row labels: 160px
    - 6 columns of width 123px each ≈ 738px total
    - Col x centers: 160 + 61.5 = 221.5, 344.5, 467.5, 590.5, 713.5, 836.5
    - Rows: 4 rows of height 72px
    - Header text y≈57/70, row tops: 80, 152, 224, 296
    - Legend at y≈400
  -->

  <!-- Column headers -->
  <text class="col-head" x="222" y="55">State</text>
  <text class="col-head" x="222" y="68">durability</text>

  <text class="col-head" x="345" y="55">Control-</text>
  <text class="col-head" x="345" y="68">flow</text>

  <text class="col-head" x="468" y="55">Multi-</text>
  <text class="col-head" x="468" y="68">agent</text>

  <text class="col-head" x="591" y="55">Streaming</text>

  <text class="col-head" x="714" y="55">Human-</text>
  <text class="col-head" x="714" y="68">in-loop</text>

  <text class="col-head" x="837" y="55">Hosting</text>

  <!-- === Row 1: LangGraph === -->
  <text class="row-head" x="152" y="116">LangGraph</text>
  <!-- State: strong -->
  <rect class="cell-strong" x="160" y="80" width="123" height="72" rx="4" />
  <text class="cell-text-inv" x="222" y="112">Checkpointed</text>
  <!-- Control-flow: strong -->
  <rect class="cell-strong" x="283" y="80" width="123" height="72" rx="4" />
  <text class="cell-text-inv" x="345" y="116">Graph</text>
  <!-- Multi-agent: strong -->
  <rect class="cell-strong" x="406" y="80" width="123" height="72" rx="4" />
  <text class="cell-text-inv" x="468" y="116">Subgraphs</text>
  <!-- Streaming: strong -->
  <rect class="cell-strong" x="529" y="80" width="123" height="72" rx="4" />
  <text class="cell-text-inv" x="591" y="116">Yes</text>
  <!-- Human-in-loop: strong -->
  <rect class="cell-strong" x="652" y="80" width="123" height="72" rx="4" />
  <text class="cell-text-inv" x="714" y="116">Yes</text>
  <!-- Hosting: medium -->
  <rect class="cell-medium" x="775" y="80" width="123" height="72" rx="4" />
  <text class="cell-text" x="837" y="110">Self /</text>
  <text class="cell-text" x="837" y="124">Platform</text>

  <!-- === Row 2: CrewAI === -->
  <text class="row-head" x="152" y="188">CrewAI</text>
  <!-- State: weak -->
  <rect class="cell-weak" x="160" y="152" width="123" height="72" rx="4" />
  <text class="cell-text" x="222" y="188">In-memory</text>
  <!-- Control-flow: medium -->
  <rect class="cell-medium" x="283" y="152" width="123" height="72" rx="4" />
  <text class="cell-text" x="345" y="182">Roles +</text>
  <text class="cell-text" x="345" y="196">tasks</text>
  <!-- Multi-agent: strong -->
  <rect class="cell-strong" x="406" y="152" width="123" height="72" rx="4" />
  <text class="cell-text-inv" x="468" y="182">Native</text>
  <text class="cell-text-inv" x="468" y="196">crews</text>
  <!-- Streaming: medium -->
  <rect class="cell-medium" x="529" y="152" width="123" height="72" rx="4" />
  <text class="cell-text" x="591" y="188">Partial</text>
  <!-- Human-in-loop: weak -->
  <rect class="cell-weak" x="652" y="152" width="123" height="72" rx="4" />
  <text class="cell-text" x="714" y="188">Limited</text>
  <!-- Hosting: medium -->
  <rect class="cell-medium" x="775" y="152" width="123" height="72" rx="4" />
  <text class="cell-text" x="837" y="188">Self</text>

  <!-- === Row 3: Claude Managed Agents === -->
  <text class="row-head" x="152" y="256">Claude</text>
  <text class="row-head" x="152" y="272">Managed</text>
  <!-- State: strong -->
  <rect class="cell-strong" x="160" y="224" width="123" height="72" rx="4" />
  <text class="cell-text-inv" x="222" y="254">Server-</text>
  <text class="cell-text-inv" x="222" y="268">held</text>
  <!-- Control-flow: medium -->
  <rect class="cell-medium" x="283" y="224" width="123" height="72" rx="4" />
  <text class="cell-text" x="345" y="254">Server</text>
  <text class="cell-text" x="345" y="268">loop</text>
  <!-- Multi-agent: weak -->
  <rect class="cell-weak" x="406" y="224" width="123" height="72" rx="4" />
  <text class="cell-text" x="468" y="254">Single</text>
  <text class="cell-text" x="468" y="268">harness</text>
  <!-- Streaming: strong -->
  <rect class="cell-strong" x="529" y="224" width="123" height="72" rx="4" />
  <text class="cell-text-inv" x="591" y="260">Yes</text>
  <!-- Human-in-loop: medium -->
  <rect class="cell-medium" x="652" y="224" width="123" height="72" rx="4" />
  <text class="cell-text" x="714" y="254">Steer via</text>
  <text class="cell-text" x="714" y="268">events</text>
  <!-- Hosting: strong -->
  <rect class="cell-strong" x="775" y="224" width="123" height="72" rx="4" />
  <text class="cell-text-inv" x="837" y="260">Managed</text>

  <!-- === Row 4: OpenAI Agents SDK === -->
  <text class="row-head" x="152" y="328">OpenAI</text>
  <text class="row-head" x="152" y="344">Agents SDK</text>
  <!-- State: medium -->
  <rect class="cell-medium" x="160" y="296" width="123" height="72" rx="4" />
  <text class="cell-text" x="222" y="332">Session</text>
  <!-- Control-flow: medium -->
  <rect class="cell-medium" x="283" y="296" width="123" height="72" rx="4" />
  <text class="cell-text" x="345" y="322">Code +</text>
  <text class="cell-text" x="345" y="336">handoffs</text>
  <!-- Multi-agent: medium -->
  <rect class="cell-medium" x="406" y="296" width="123" height="72" rx="4" />
  <text class="cell-text" x="468" y="332">Handoffs</text>
  <!-- Streaming: strong -->
  <rect class="cell-strong" x="529" y="296" width="123" height="72" rx="4" />
  <text class="cell-text-inv" x="591" y="332">Yes</text>
  <!-- Human-in-loop: medium -->
  <rect class="cell-medium" x="652" y="296" width="123" height="72" rx="4" />
  <text class="cell-text" x="714" y="332">Guardrails</text>
  <!-- Hosting: medium -->
  <rect class="cell-medium" x="775" y="296" width="123" height="72" rx="4" />
  <text class="cell-text" x="837" y="332">Self</text>

  <!-- Legend -->
  <rect class="legend-box-w" x="250" y="420" width="18" height="18" rx="3" />
  <text class="legend-text" x="275" y="429">Weak</text>

  <rect class="legend-box-m" x="370" y="420" width="18" height="18" rx="3" />
  <text class="legend-text" x="395" y="429">Medium</text>

  <rect class="legend-box-s" x="500" y="420" width="18" height="18" rx="3" />
  <text class="legend-text" x="525" y="429">Strong</text>

</svg>
