<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Control-flow model</title>
  <desc id="d">Four-column comparison of control-flow models: LangGraph uses a graph of nodes with conditional edges, CrewAI uses role and task declaration with Flows for events, Claude Managed Agents uses a server-side autonomous loop, OpenAI Agents SDK uses plain code with handoffs.</desc>
  <style>
    .chart-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="28">Control-flow model</text>

  <!-- Column 1: LangGraph — ACCENT (most explicit, graph-native) -->
  <rect class="card-accent" x="10" y="44" width="210" height="220" rx="8" />
  <text class="col-head-inv" x="115" y="72">LangGraph</text>
  <text class="body-text-inv" x="115" y="106">Graph of nodes +</text>
  <text class="body-text-inv" x="115" y="124">conditional edges</text>

  <!-- Column 2: CrewAI — soft -->
  <rect class="card-soft" x="230" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="335" y="72">CrewAI</text>
  <text class="body-text" x="335" y="106">Role + task declaration</text>
  <text class="body-text" x="335" y="124">(Crews); Flows for</text>
  <text class="body-text" x="335" y="142">events</text>

  <!-- Column 3: Claude Managed Agents — soft -->
  <rect class="card-soft" x="450" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="555" y="72">Claude Managed</text>
  <text class="col-head" x="555" y="90">Agents</text>
  <text class="body-text" x="555" y="124">Server-side</text>
  <text class="body-text" x="555" y="142">autonomous loop</text>

  <!-- Column 4: OpenAI Agents SDK — neutral -->
  <rect class="card-neutral" x="670" y="44" width="220" height="220" rx="8" />
  <text class="col-head" x="780" y="72">OpenAI Agents</text>
  <text class="col-head" x="780" y="90">SDK</text>
  <text class="body-text" x="780" y="124">Plain code +</text>
  <text class="body-text" x="780" y="142">handoffs</text>

</svg>
