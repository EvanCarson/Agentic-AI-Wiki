<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">LangGraph architecture</title>
  <desc id="d">Nodes in a cyclic graph read and write a single explicit state object you own; a pluggable checkpointer persists that state to memory, SQLite, or Postgres for durable execution and replay.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .dash  { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Compiled graph (hero container) -->
  <rect class="hero" x="40" y="50" width="490" height="400" rx="10" ry="10" />
  <text class="label-inv" x="285" y="80" text-anchor="middle" font-weight="600">LangGraph — Compiled Graph</text>

  <rect class="box" x="70" y="104" width="150" height="46" rx="8" ry="8" />
  <text class="label" x="145" y="132" text-anchor="middle" font-weight="600">START</text>

  <rect class="box" x="70" y="206" width="128" height="66" rx="8" ry="8" />
  <text class="label" x="134" y="234" text-anchor="middle" font-weight="600">Node A</text>
  <text class="sub" x="134" y="252" text-anchor="middle">read + write</text>

  <rect class="box" x="222" y="206" width="128" height="66" rx="8" ry="8" />
  <text class="label" x="286" y="234" text-anchor="middle" font-weight="600">Node B</text>
  <text class="sub" x="286" y="252" text-anchor="middle">route / branch</text>

  <rect class="box" x="374" y="206" width="128" height="66" rx="8" ry="8" />
  <text class="label" x="438" y="234" text-anchor="middle" font-weight="600">Node C</text>
  <text class="sub" x="438" y="252" text-anchor="middle">tool call / LLM</text>

  <rect class="box" x="374" y="330" width="128" height="50" rx="8" ry="8" />
  <text class="label" x="438" y="360" text-anchor="middle" font-weight="600">END</text>

  <line class="arrow" x1="145" y1="150" x2="145" y2="204" />
  <line class="arrow" x1="198" y1="239" x2="220" y2="239" />
  <line class="arrow" x1="350" y1="239" x2="372" y2="239" />
  <line class="arrow" x1="438" y1="272" x2="438" y2="328" />
  <!-- single conditional loop arc: Node C -> Node A -->
  <path class="dash" d="M 374 218 C 300 168, 210 168, 136 204" />
  <text class="sub" x="255" y="176" text-anchor="middle">conditional edge (loop)</text>

  <!-- Explicit State Object -->
  <rect class="adj" x="566" y="80" width="296" height="130" rx="8" ry="8" />
  <text class="label" x="714" y="108" text-anchor="middle" font-weight="600">Explicit State Object</text>
  <text class="sub" x="714" y="128" text-anchor="middle">TypedDict / Pydantic — you own the schema</text>
  <text class="sub" x="714" y="148" text-anchor="middle">nodes READ &amp; WRITE</text>
  <text class="sub" x="714" y="168" text-anchor="middle">channel reducers merge updates</text>
  <text class="sub" x="714" y="190" text-anchor="middle">the one inspectable source of truth</text>

  <!-- graph <-> state (short read/write pair) -->
  <line class="arrow" x1="530" y1="138" x2="564" y2="138" />
  <line class="arrow" x1="564" y1="156" x2="530" y2="156" />

  <!-- Checkpointer -->
  <rect class="box" x="566" y="244" width="296" height="106" rx="8" ry="8" />
  <text class="label" x="714" y="272" text-anchor="middle" font-weight="600">Checkpointer</text>
  <text class="sub" x="714" y="292" text-anchor="middle">durable · replayable</text>
  <text class="sub" x="714" y="312" text-anchor="middle">in-memory / SQLite / Postgres</text>
  <text class="sub" x="714" y="332" text-anchor="middle">persists every state snapshot</text>
  <line class="arrow" x1="714" y1="210" x2="714" y2="242" />

  <!-- HITL -->
  <rect class="box" x="566" y="384" width="296" height="52" rx="8" ry="8" />
  <text class="label" x="714" y="415" text-anchor="middle" font-weight="600">Human-in-the-loop / interrupt</text>
  <line class="arrow" x1="714" y1="350" x2="714" y2="382" />
</svg>
