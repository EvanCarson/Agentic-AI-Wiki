<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">LangGraph architecture</title>
  <desc id="d">Nodes in a cyclic graph read and write a single explicit state object you own; a pluggable checkpointer persists that state to memory, SQLite, or Postgres for durable execution and replay.</desc>
  <style>
    .box{fill:var(--paper-2,#f0ede8);stroke:var(--ink,#1a1a1a);stroke-width:1.25;}
    .hero{fill:var(--accent,#d4421e);stroke:var(--ink,#1a1a1a);stroke-width:1.25;}
    .adj{fill:var(--accent-soft,#f5c5b8);stroke:var(--ink,#1a1a1a);stroke-width:1.25;}
    .label{font-family:'Inter',system-ui,sans-serif;font-size:14px;fill:var(--ink,#1a1a1a);}
    .label-inv{font-family:'Inter',system-ui,sans-serif;font-size:14px;fill:var(--paper,#fff);}
    .label-inv-b{font-family:'Inter',system-ui,sans-serif;font-size:14px;font-weight:600;fill:var(--paper,#fff);}
    .sub{font-family:'Inter',system-ui,sans-serif;font-size:12px;fill:var(--ink,#1a1a1a);opacity:.65;}
    .sub-inv{font-family:'Inter',system-ui,sans-serif;font-size:12px;fill:var(--paper,#fff);opacity:.80;}
    .arrow{fill:none;stroke:currentColor;stroke-width:1.25;marker-end:url(#arr);}
    .arrow-cycle{fill:none;stroke:currentColor;stroke-width:1.25;stroke-dasharray:4 3;marker-end:url(#arr);}
    .bound{fill:none;stroke:currentColor;stroke-width:1.25;stroke-dasharray:5 4;}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Graph outer boundary (hero) -->
  <rect class="hero" x="30" y="30" width="560" height="430" rx="14" ry="14"/>
  <text class="label-inv-b" x="310" y="60" text-anchor="middle" font-size="16">LangGraph — Compiled Graph</text>

  <!-- START node -->
  <rect class="box" x="60" y="90" width="110" height="52" rx="8" ry="8"/>
  <text class="label" x="115" y="120" text-anchor="middle" font-weight="600">START</text>

  <!-- Node A -->
  <rect class="box" x="60" y="200" width="130" height="60" rx="8" ry="8"/>
  <text class="label" x="125" y="228" text-anchor="middle" font-weight="600">Node A</text>
  <text class="sub" x="125" y="248" text-anchor="middle">read + write state</text>

  <!-- Node B -->
  <rect class="box" x="240" y="200" width="130" height="60" rx="8" ry="8"/>
  <text class="label" x="305" y="228" text-anchor="middle" font-weight="600">Node B</text>
  <text class="sub" x="305" y="248" text-anchor="middle">conditional edge</text>

  <!-- Node C -->
  <rect class="box" x="420" y="200" width="130" height="60" rx="8" ry="8"/>
  <text class="label" x="485" y="228" text-anchor="middle" font-weight="600">Node C</text>
  <text class="sub" x="485" y="248" text-anchor="middle">tool call / LLM</text>

  <!-- END node -->
  <rect class="box" x="420" y="340" width="130" height="52" rx="8" ry="8"/>
  <text class="label" x="485" y="370" text-anchor="middle" font-weight="600">END</text>

  <!-- START → Node A -->
  <line class="arrow" x1="115" y1="142" x2="115" y2="196"/>

  <!-- Node A → Node B -->
  <line class="arrow" x1="190" y1="230" x2="236" y2="230"/>

  <!-- Node B → Node C (straight) -->
  <line class="arrow" x1="370" y1="230" x2="416" y2="230"/>

  <!-- Node C → END -->
  <line class="arrow" x1="485" y1="260" x2="485" y2="336"/>

  <!-- Cycle: Node C back to Node A (conditional loop) -->
  <path class="arrow-cycle" d="M 485 200 C 485 140, 125 140, 125 196"/>
  <text class="sub-inv" x="310" y="155" text-anchor="middle">conditional loop</text>

  <!-- Node B back to Node A (branch) -->
  <path class="arrow-cycle" d="M 305 200 C 305 168, 125 168, 125 200"/>

  <!-- State object — prominent, adj styled -->
  <rect class="adj" x="628" y="80" width="242" height="150" rx="10" ry="10"/>
  <text class="label" x="749" y="110" text-anchor="middle" font-weight="700" font-size="15">Explicit State Object</text>
  <text class="sub" x="749" y="132" text-anchor="middle">TypedDict / Pydantic</text>
  <text class="sub" x="749" y="152" text-anchor="middle">nodes READ &amp; WRITE</text>
  <text class="sub" x="749" y="172" text-anchor="middle">you own the schema</text>
  <text class="sub" x="749" y="192" text-anchor="middle">channel reducers merge updates</text>

  <!-- State ↔ Graph arrows -->
  <line class="arrow" x1="628" y1="135" x2="594" y2="230"/>
  <line class="arrow" x1="594" y1="230" x2="628" y2="175"/>

  <!-- Checkpointer -->
  <rect class="box" x="628" y="270" width="242" height="100" rx="10" ry="10"/>
  <text class="label" x="749" y="300" text-anchor="middle" font-weight="700" font-size="15">Checkpointer</text>
  <text class="sub" x="749" y="320" text-anchor="middle">durable · replayable</text>
  <text class="sub" x="749" y="340" text-anchor="middle">in-memory / SQLite / Postgres</text>
  <text class="sub" x="749" y="358" text-anchor="middle">persists every state snapshot</text>

  <!-- State → Checkpointer -->
  <line class="arrow" x1="749" y1="230" x2="749" y2="266"/>

  <!-- Checkpointer → State (restore) -->
  <path class="arrow" d="M 628 310 C 595 290, 595 190, 628 175"/>

  <!-- Input label -->
  <rect class="box" x="628" y="400" width="242" height="50" rx="8" ry="8"/>
  <text class="label" x="749" y="430" text-anchor="middle">Human-in-the-loop / interrupt</text>

  <!-- Checkpointer → interrupt -->
  <line class="arrow" x1="749" y1="370" x2="749" y2="396"/>
</svg>
