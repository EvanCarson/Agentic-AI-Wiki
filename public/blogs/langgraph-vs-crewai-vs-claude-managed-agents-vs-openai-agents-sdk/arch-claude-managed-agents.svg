<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Claude Managed Agents architecture</title>
  <desc id="d">The client submits a goal and streams results via SSE; Anthropic's server runs the agent loop and holds all session state — a single managed harness, not a multi-agent framework.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- CLIENT (left, dashed) -->
  <rect class="bound" x="28" y="58" width="250" height="332" rx="10" ry="10" />
  <text class="sub" x="153" y="80" text-anchor="middle" font-weight="600">CLIENT</text>
  <rect class="box" x="46" y="94" width="214" height="46" rx="6" ry="6" />
  <text class="label" x="153" y="114" text-anchor="middle" font-weight="600" font-size="13">Submit goal</text>
  <text class="sub" x="153" y="130" text-anchor="middle">POST /v1/agents/sessions</text>
  <rect class="box" x="46" y="152" width="214" height="46" rx="6" ry="6" />
  <text class="label" x="153" y="172" text-anchor="middle" font-weight="600" font-size="13">Steer via events</text>
  <text class="sub" x="153" y="188" text-anchor="middle">human-in-the-loop / cancel</text>
  <rect class="box" x="46" y="210" width="214" height="46" rx="6" ry="6" />
  <text class="label" x="153" y="230" text-anchor="middle" font-weight="600" font-size="13">Poll / Stream (SSE)</text>
  <text class="sub" x="153" y="246" text-anchor="middle">event stream — non-blocking</text>
  <rect class="box" x="46" y="300" width="214" height="72" rx="6" ry="6" />
  <text class="label" x="153" y="324" text-anchor="middle" font-weight="600" font-size="13">Single harness</text>
  <text class="sub" x="153" y="342" text-anchor="middle">NOT multi-agent-first</text>
  <text class="sub" x="153" y="358" text-anchor="middle">one loop · env can self-host</text>

  <!-- SERVER (right, hero) -->
  <rect class="hero" x="430" y="50" width="442" height="400" rx="10" ry="10" />
  <text class="label-inv" x="651" y="80" text-anchor="middle" font-weight="600">Anthropic Server</text>

  <rect class="box" x="458" y="100" width="190" height="96" rx="8" ry="8" />
  <text class="label" x="553" y="124" text-anchor="middle" font-weight="600">Agent Loop</text>
  <text class="sub" x="553" y="142" text-anchor="middle">plan → act → observe</text>
  <text class="sub" x="553" y="158" text-anchor="middle">managed by Anthropic</text>
  <text class="sub" x="553" y="174" text-anchor="middle">Claude model calls</text>

  <rect class="adj" x="668" y="100" width="186" height="130" rx="8" ry="8" />
  <text class="label" x="761" y="124" text-anchor="middle" font-weight="600">State lives here</text>
  <text class="sub" x="761" y="143" text-anchor="middle">sessions on Anthropic infra</text>
  <text class="sub" x="761" y="159" text-anchor="middle">resumable · history</text>
  <text class="sub" x="761" y="175" text-anchor="middle">tool outputs + context</text>
  <text class="sub" x="761" y="195" text-anchor="middle" font-weight="600">client holds NO state</text>

  <rect class="box" x="458" y="234" width="190" height="76" rx="8" ry="8" />
  <text class="label" x="553" y="262" text-anchor="middle" font-weight="600">Tool Execution</text>
  <text class="sub" x="553" y="280" text-anchor="middle">bash · web · file · custom</text>
  <text class="sub" x="553" y="296" text-anchor="middle">sandboxed environment</text>

  <rect class="box" x="458" y="350" width="396" height="76" rx="8" ry="8" />
  <text class="label" x="656" y="378" text-anchor="middle" font-weight="600">Event / Result Stream</text>
  <text class="sub" x="656" y="396" text-anchor="middle">SSE events → client poll / stream</text>
  <text class="sub" x="656" y="412" text-anchor="middle">tool_use · text · done · error</text>

  <!-- Internal server arrows -->
  <line class="arrow" x1="648" y1="138" x2="666" y2="138" />
  <line class="arrow" x1="666" y1="156" x2="648" y2="156" />
  <line class="arrow" x1="553" y1="196" x2="553" y2="232" />
  <line class="arrow" x1="553" y1="310" x2="553" y2="348" />

  <!-- Cross-boundary: client -> server (submit / steer) -->
  <line class="arrow" x1="280" y1="126" x2="456" y2="126" />
  <text class="sub" x="368" y="116" text-anchor="middle">submit · steer</text>

  <!-- Cross-boundary: server -> client (stream) -->
  <path class="arrow" d="M 456 388 L 360 388 L 360 233 L 262 233" />
  <text class="sub" x="392" y="316" text-anchor="middle" transform="rotate(-90 392 316)">stream (SSE)</text>
</svg>
