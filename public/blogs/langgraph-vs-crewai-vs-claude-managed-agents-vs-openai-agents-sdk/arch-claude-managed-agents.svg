<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Claude Managed Agents architecture</title>
  <desc id="d">The client submits a goal and streams results via SSE; Anthropic's server runs the agent loop and holds all session state — a single managed harness, not a multi-agent framework.</desc>
  <style>
    .box{fill:var(--paper-2,#f0ede8);stroke:var(--ink,#1a1a1a);stroke-width:1.25;}
    .hero{fill:var(--accent,#d4421e);stroke:var(--ink,#1a1a1a);stroke-width:1.25;}
    .adj{fill:var(--accent-soft,#f5c5b8);stroke:var(--ink,#1a1a1a);stroke-width:1.25;}
    .label{font-family:'Inter',system-ui,sans-serif;font-size:14px;fill:var(--ink,#1a1a1a);}
    .label-inv{font-family:'Inter',system-ui,sans-serif;font-size:14px;fill:var(--paper,#fff);}
    .label-inv-b{font-family:'Inter',system-ui,sans-serif;font-size:14px;font-weight:700;fill:var(--paper,#fff);}
    .sub{font-family:'Inter',system-ui,sans-serif;font-size:12px;fill:var(--ink,#1a1a1a);opacity:.65;}
    .sub-inv{font-family:'Inter',system-ui,sans-serif;font-size:12px;fill:var(--paper,#fff);opacity:.80;}
    .arrow{fill:none;stroke:currentColor;stroke-width:1.25;marker-end:url(#arr);}
    .arrow-back{fill:none;stroke:currentColor;stroke-width:1.25;stroke-dasharray:3 3;marker-end:url(#arr);}
    .bound{fill:none;stroke:currentColor;stroke-width:1.5;stroke-dasharray:5 4;}
    .zone-label{font-family:'Inter',system-ui,sans-serif;font-size:11px;fill:var(--ink,#1a1a1a);opacity:.50;letter-spacing:.06em;}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- CLIENT zone (left) -->
  <rect class="bound" x="20" y="30" width="280" height="440" rx="12" ry="12"/>
  <text class="zone-label" x="160" y="52" text-anchor="middle">CLIENT</text>

  <!-- Submit goal -->
  <rect class="box" x="44" y="70" width="232" height="58" rx="8" ry="8"/>
  <text class="label" x="160" y="97" text-anchor="middle" font-weight="700">Submit goal</text>
  <text class="sub" x="160" y="115" text-anchor="middle">POST /v1/agents/sessions</text>

  <!-- Poll / stream -->
  <rect class="box" x="44" y="168" width="232" height="58" rx="8" ry="8"/>
  <text class="label" x="160" y="195" text-anchor="middle" font-weight="700">Poll / Stream (SSE)</text>
  <text class="sub" x="160" y="213" text-anchor="middle">event stream — non-blocking</text>

  <!-- Steer via events -->
  <rect class="box" x="44" y="270" width="232" height="58" rx="8" ry="8"/>
  <text class="label" x="160" y="297" text-anchor="middle" font-weight="700">Steer via events</text>
  <text class="sub" x="160" y="315" text-anchor="middle">human-in-the-loop / cancel</text>

  <!-- Note: not multi-agent-first -->
  <rect class="adj" x="44" y="368" width="232" height="80" rx="8" ry="8"/>
  <text class="label" x="160" y="392" text-anchor="middle" font-weight="700">Single harness</text>
  <text class="sub" x="160" y="410" text-anchor="middle">NOT multi-agent-first</text>
  <text class="sub" x="160" y="428" text-anchor="middle">one autonomous agent loop</text>
  <text class="sub" x="160" y="446" text-anchor="middle">env can be self-hosted</text>

  <!-- Boundary line (dashed) -->
  <line class="bound" x1="316" y1="30" x2="316" y2="470" stroke-dasharray="6 5"/>
  <text class="zone-label" x="316" y="488" text-anchor="middle">trust boundary</text>

  <!-- SERVER zone (right, hero) -->
  <rect class="hero" x="340" y="30" width="540" height="440" rx="12" ry="12"/>
  <text class="label-inv-b" x="610" y="58" text-anchor="middle" font-size="16">Anthropic Server</text>

  <!-- Agent loop -->
  <rect class="adj" x="370" y="80" width="220" height="110" rx="10" ry="10"/>
  <text class="label" x="480" y="108" text-anchor="middle" font-weight="700">Agent Loop</text>
  <text class="sub" x="480" y="128" text-anchor="middle">plan → act → observe</text>
  <text class="sub" x="480" y="148" text-anchor="middle">managed by Anthropic infra</text>
  <text class="sub" x="480" y="166" text-anchor="middle">Claude model calls</text>

  <!-- Tool execution -->
  <rect class="box" x="370" y="230" width="220" height="80" rx="10" ry="10"/>
  <text class="label" x="480" y="258" text-anchor="middle" font-weight="700">Tool Execution</text>
  <text class="sub" x="480" y="276" text-anchor="middle">bash · web · file · custom</text>
  <text class="sub" x="480" y="294" text-anchor="middle">sandboxed environment</text>

  <!-- Agent loop ↔ Tool execution -->
  <line class="arrow" x1="480" y1="190" x2="480" y2="226"/>
  <line class="arrow-back" x1="460" y1="226" x2="460" y2="190"/>

  <!-- State held server-side (prominent) -->
  <rect class="adj" x="618" y="80" width="238" height="170" rx="10" ry="10"/>
  <text class="label" x="737" y="110" text-anchor="middle" font-weight="700" font-size="15">State lives here</text>
  <text class="sub" x="737" y="132" text-anchor="middle">sessions on Anthropic infra</text>
  <text class="sub" x="737" y="152" text-anchor="middle">resumable across turns</text>
  <text class="sub" x="737" y="172" text-anchor="middle">conversation history</text>
  <text class="sub" x="737" y="192" text-anchor="middle">tool outputs + context</text>
  <text class="sub" x="737" y="212" text-anchor="middle">client holds NO state</text>

  <!-- Agent loop → State -->
  <line class="arrow" x1="590" y1="135" x2="614" y2="135"/>
  <line class="arrow-back" x1="614" y1="155" x2="590" y2="155"/>

  <!-- Tool execution → State -->
  <line class="arrow" x1="590" y1="265" x2="737" y2="252"/>

  <!-- Results stream back -->
  <rect class="box" x="370" y="360" width="480" height="80" rx="10" ry="10"/>
  <text class="label" x="610" y="388" text-anchor="middle" font-weight="700">Event / Result Stream</text>
  <text class="sub" x="610" y="408" text-anchor="middle">SSE events → client poll/stream</text>
  <text class="sub" x="610" y="428" text-anchor="middle">tool_use · text · done · error</text>

  <!-- Agent loop → Results -->
  <line class="arrow" x1="480" y1="310" x2="480" y2="356"/>

  <!-- CLIENT ↔ SERVER request/response arrows -->
  <!-- Submit goal → Agent loop -->
  <line class="arrow" x1="276" y1="95" x2="366" y2="120"/>
  <!-- Results stream → Client poll -->
  <line class="arrow" x1="366" y1="395" x2="276" y2="190"/>
  <!-- Steer → Agent loop -->
  <line class="arrow" x1="276" y1="290" x2="366" y2="170"/>
</svg>
