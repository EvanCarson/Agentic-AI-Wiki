<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">CrewAI architecture</title>
  <desc id="d">A crew of role-based agents runs an ordered task list with context threaded implicitly between agents; Flows add an event-driven path with explicit state when needed.</desc>
  <style>
    .box{fill:var(--paper-2,#f0ede8);stroke:var(--ink,#1a1a1a);stroke-width:1.25;}
    .hero{fill:var(--accent,#d4421e);stroke:var(--ink,#1a1a1a);stroke-width:1.25;}
    .adj{fill:var(--accent-soft,#f5c5b8);stroke:var(--ink,#1a1a1a);stroke-width:1.25;}
    .label{font-family:'Inter',system-ui,sans-serif;font-size:14px;fill:var(--ink,#1a1a1a);}
    .label-inv{font-family:'Inter',system-ui,sans-serif;font-size:14px;fill:var(--paper,#fff);}
    .label-inv-b{font-family:'Inter',system-ui,sans-serif;font-size:14px;font-weight:700;fill:var(--paper,#fff);}
    .sub{font-family:'Inter',system-ui,sans-serif;font-size:12px;fill:var(--ink,#1a1a1a);opacity:.65;}
    .sub-inv{font-family:'Inter',system-ui,sans-serif;font-size:12px;fill:var(--paper,#fff);opacity:.80;}
    .arrow{fill:none;stroke:currentColor;stroke-width:1.25;marker-end:url(#arr);}
    .arrow-implicit{fill:none;stroke:currentColor;stroke-width:1.0;opacity:.45;marker-end:url(#arr);}
    .bound{fill:none;stroke:currentColor;stroke-width:1.25;stroke-dasharray:5 4;}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Crew outer boundary (hero) -->
  <rect class="hero" x="30" y="50" width="540" height="390" rx="14" ry="14"/>
  <text class="label-inv-b" x="300" y="80" text-anchor="middle" font-size="16">Crew</text>
  <text class="sub-inv" x="300" y="98" text-anchor="middle">independent framework — no vendor lock-in</text>

  <!-- Process selector box -->
  <rect class="adj" x="60" y="110" width="480" height="46" rx="8" ry="8"/>
  <text class="label" x="300" y="132" text-anchor="middle" font-weight="700">Process</text>
  <text class="sub" x="300" y="148" text-anchor="middle">sequential  |  hierarchical (manager LLM)</text>

  <!-- Role-agent: Researcher -->
  <rect class="box" x="60" y="190" width="140" height="72" rx="8" ry="8"/>
  <text class="label" x="130" y="218" text-anchor="middle" font-weight="700">Researcher</text>
  <text class="sub" x="130" y="236" text-anchor="middle">role-based agent</text>
  <text class="sub" x="130" y="252" text-anchor="middle">goal + backstory + tools</text>

  <!-- Role-agent: Writer -->
  <rect class="box" x="230" y="190" width="140" height="72" rx="8" ry="8"/>
  <text class="label" x="300" y="218" text-anchor="middle" font-weight="700">Writer</text>
  <text class="sub" x="300" y="236" text-anchor="middle">role-based agent</text>
  <text class="sub" x="300" y="252" text-anchor="middle">goal + backstory + tools</text>

  <!-- Role-agent: Reviewer -->
  <rect class="box" x="400" y="190" width="140" height="72" rx="8" ry="8"/>
  <text class="label" x="470" y="218" text-anchor="middle" font-weight="700">Reviewer</text>
  <text class="sub" x="470" y="236" text-anchor="middle">role-based agent</text>
  <text class="sub" x="470" y="252" text-anchor="middle">goal + backstory + tools</text>

  <!-- Implicit context arrows between agents (lighter) -->
  <line class="arrow-implicit" x1="200" y1="226" x2="226" y2="226"/>
  <line class="arrow-implicit" x1="370" y1="226" x2="396" y2="226"/>

  <!-- Implicit context label -->
  <text class="sub-inv" x="300" y="290" text-anchor="middle">context threaded implicitly — NO external state store</text>

  <!-- Tasks list -->
  <rect class="box" x="60" y="315" width="480" height="60" rx="8" ry="8"/>
  <text class="label" x="300" y="342" text-anchor="middle" font-weight="700">Tasks</text>
  <text class="sub" x="300" y="360" text-anchor="middle">ordered list · expected_output · assigned agent</text>

  <!-- Process → Agents -->
  <line class="arrow" x1="300" y1="156" x2="300" y2="186"/>

  <!-- Agents → Tasks -->
  <line class="arrow" x1="300" y1="262" x2="300" y2="311"/>

  <!-- Output -->
  <rect class="box" x="60" y="405" width="480" height="25" rx="6" ry="6"/>
  <text class="label" x="300" y="422" text-anchor="middle" font-size="12">crew.kickoff() → final output</text>

  <!-- Tasks → Output -->
  <line class="arrow" x1="300" y1="375" x2="300" y2="401"/>

  <!-- Flows (opt-in explicit state path) -->
  <rect class="box" x="610" y="100" width="255" height="120" rx="10" ry="10"/>
  <text class="label" x="737" y="128" text-anchor="middle" font-weight="700">Flows</text>
  <text class="sub" x="737" y="148" text-anchor="middle">event-driven, explicit state</text>
  <text class="sub" x="737" y="166" text-anchor="middle">@start / @listen decorators</text>
  <text class="sub" x="737" y="184" text-anchor="middle">opt-in stateful path</text>

  <!-- Dashed boundary for Flows (opt-in) -->
  <rect class="bound" x="606" y="96" width="263" height="128" rx="10" ry="10"/>

  <!-- Crew → Flows opt-in arrow -->
  <line class="arrow" x1="570" y1="160" x2="606" y2="160"/>
  <text class="sub" x="588" y="152" text-anchor="middle" font-size="10">opt-in</text>

  <!-- Memory (optional) -->
  <rect class="box" x="610" y="260" width="255" height="100" rx="10" ry="10"/>
  <text class="label" x="737" y="288" text-anchor="middle" font-weight="700">Memory</text>
  <text class="sub" x="737" y="308" text-anchor="middle">short-term · long-term · entity</text>
  <text class="sub" x="737" y="326" text-anchor="middle">optional — not default</text>
  <text class="sub" x="737" y="344" text-anchor="middle">pluggable storage backends</text>

  <!-- Tools -->
  <rect class="box" x="610" y="390" width="255" height="60" rx="10" ry="10"/>
  <text class="label" x="737" y="418" text-anchor="middle" font-weight="700">Tools</text>
  <text class="sub" x="737" y="436" text-anchor="middle">LangChain-compatible + CrewAI native</text>

  <!-- Agents → Memory -->
  <line class="arrow" x1="570" y1="310" x2="606" y2="310"/>
  <!-- Agents → Tools -->
  <line class="arrow" x1="570" y1="420" x2="606" y2="420"/>
</svg>
