<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Three ways to put an agent on CRM data, compared on four governance axes</title>
  <desc id="d">A matrix with three rows and four columns. Claude inside Agentforce scores strong on permission granularity and on where deliberation is recorded, contained on injection blast radius, and weak on model choice. The Salesforce plugin inside Claude scores weak on permission granularity and on recorded deliberation, wide on blast radius, and strong on model choice within Claude. A self-built agent on the APIs scores medium to strong on all four but only if the team builds the controls itself.</desc>
  <style>
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink); }
    .colhd  { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
    .rowhd  { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; font-weight: 600; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); text-anchor: middle; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper); text-anchor: middle; }
    .leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="title" x="30" y="28">Governance shape of three deployment choices</text>

  <text class="colhd" x="330" y="62">Permission</text>
  <text class="colhd" x="330" y="76">granularity</text>
  <text class="colhd" x="480" y="62">Deliberation</text>
  <text class="colhd" x="480" y="76">recorded in CRM</text>
  <text class="colhd" x="630" y="62">Injection</text>
  <text class="colhd" x="630" y="76">blast radius</text>
  <text class="colhd" x="790" y="62">Model</text>
  <text class="colhd" x="790" y="76">choice</text>

  <text class="rowhd" x="30" y="122">Claude inside Agentforce</text>
  <rect class="strong" x="256" y="96" width="148" height="46" />
  <text class="cell-inv" x="330" y="124">Per-action sharing</text>
  <rect class="strong" x="406" y="96" width="148" height="46" />
  <text class="cell-inv" x="480" y="124">Yes</text>
  <rect class="med" x="556" y="96" width="148" height="46" />
  <text class="cell" x="630" y="124">Salesforce actions</text>
  <rect class="weak" x="716" y="96" width="148" height="46" />
  <text class="cell" x="790" y="124">Default is set</text>

  <text class="rowhd" x="30" y="202">Salesforce plugin in Claude</text>
  <rect class="weak" x="256" y="176" width="148" height="46" />
  <text class="cell" x="330" y="204">One app-wide scope</text>
  <rect class="weak" x="406" y="176" width="148" height="46" />
  <text class="cell" x="480" y="204">No</text>
  <rect class="weak" x="556" y="176" width="148" height="46" />
  <text class="cell" x="630" y="204">Every connector</text>
  <rect class="strong" x="716" y="176" width="148" height="46" />
  <text class="cell-inv" x="790" y="204">Claude&#8217;s catalogue</text>

  <text class="rowhd" x="30" y="282">Your own agent on the APIs</text>
  <rect class="med" x="256" y="256" width="148" height="46" />
  <text class="cell" x="330" y="284">Whatever you build</text>
  <rect class="med" x="406" y="256" width="148" height="46" />
  <text class="cell" x="480" y="284">If you write it back</text>
  <rect class="med" x="556" y="256" width="148" height="46" />
  <text class="cell" x="630" y="284">Your tool catalogue</text>
  <rect class="strong" x="716" y="256" width="148" height="46" />
  <text class="cell-inv" x="790" y="284">Any</text>

  <rect class="strong" x="30" y="336" width="16" height="16" />
  <text class="leg" x="54" y="349">Strong</text>
  <rect class="med" x="120" y="336" width="16" height="16" />
  <text class="leg" x="144" y="349">Medium</text>
  <rect class="weak" x="216" y="336" width="16" height="16" />
  <text class="leg" x="240" y="349">Weak</text>
  <text class="leg" x="320" y="349">Colour reads as governance strength, not product quality.</text>
</svg>
