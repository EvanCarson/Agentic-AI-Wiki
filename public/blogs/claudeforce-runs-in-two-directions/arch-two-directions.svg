<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The two directions of the Claudeforce integration</title>
  <desc id="d">Two panels. On the left, Claude moves into Agentforce: the reasoning model sits inside the Salesforce boundary, its tool calls are Salesforce actions subject to sharing rules, and the prompt, the action and the audit entry all land in the CRM. On the right, Salesforce moves into Claude as a plugin: the conversation, attachments and other connectors live in Claude, an OAuth-scoped connected app reaches back into Salesforce, and only the resulting write lands in the CRM while the deliberation stays outside it.</desc>
  <style>
    .zone   { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 5 4; rx: 10; ry: 10; opacity: .55; }
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .panel  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink); }
    .zlabel { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); text-anchor: middle; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; text-anchor: middle; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="panel" x="30" y="28">Claude into Agentforce</text>
  <rect class="zone" x="30" y="44" width="390" height="392" />
  <text class="zlabel" x="42" y="64">Salesforce boundary</text>

  <rect class="hero" x="60" y="80" width="330" height="52" />
  <text class="label-inv" x="225" y="103">Claude as reasoning model</text>
  <text class="label-inv" x="225" y="122" opacity=".85">Atlas engine · via Bedrock</text>

  <rect class="adj" x="60" y="168" width="330" height="52" />
  <text class="label" x="225" y="191">Tool call = Salesforce action</text>
  <text class="sub" x="225" y="209">Sharing rules and field-level security apply</text>

  <rect class="box" x="60" y="256" width="330" height="52" />
  <text class="label" x="225" y="279">Record written</text>
  <text class="sub" x="225" y="297">Field history, event log, same tenant</text>

  <rect class="box" x="60" y="344" width="330" height="60" />
  <text class="label" x="225" y="368">Prompt, action and audit entry</text>
  <text class="label" x="225" y="388">all inside the boundary</text>

  <path class="arrow" d="M 225 132 L 225 164" />
  <path class="arrow" d="M 225 220 L 225 252" />
  <path class="arrow" d="M 225 308 L 225 340" />

  <text class="panel" x="480" y="28">Salesforce into Claude</text>
  <rect class="zone" x="480" y="44" width="390" height="260" />
  <text class="zlabel" x="492" y="64">Claude</text>

  <rect class="hero" x="510" y="80" width="330" height="70" />
  <text class="label-inv" x="675" y="104">Conversation, attachments,</text>
  <text class="label-inv" x="675" y="124">other connected tools</text>
  <text class="label-inv" x="675" y="142" opacity=".85">the deliberation lives here</text>

  <rect class="adj" x="510" y="196" width="330" height="70" />
  <text class="label" x="675" y="220">Salesforce plugin</text>
  <text class="sub" x="675" y="240">One OAuth-scoped connected app,</text>
  <text class="sub" x="675" y="258">scope sized for every bundled skill</text>

  <rect class="zone" x="480" y="330" width="390" height="106" />
  <text class="zlabel" x="492" y="350">Salesforce boundary</text>
  <rect class="box" x="510" y="360" width="330" height="56" />
  <text class="label" x="675" y="384">Record written</text>
  <text class="sub" x="675" y="403">The write is here; the reasoning is not</text>

  <path class="arrow" d="M 675 150 L 675 192" />
  <path class="arrow" d="M 675 266 L 675 356" />

  <text class="sub" x="450" y="470" style="font-size:12px; opacity:.75">Same partnership, opposite answers to where the deliberation behind a change is recorded.</text>
</svg>
