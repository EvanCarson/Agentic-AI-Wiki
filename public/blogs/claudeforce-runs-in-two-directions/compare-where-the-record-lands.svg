<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Where the three parts of an agent decision are recorded</title>
  <desc id="d">Three columns for the three artefacts of a decision. The request and the deliberation land in Salesforce when Claude runs inside Agentforce, and in Claude when Salesforce runs as a plugin. The action taken lands in Salesforce in both directions. The link between the two, joining a written record to the reasoning that produced it, exists in neither direction unless someone builds it.</desc>
  <style>
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .head  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
    .head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--paper); text-anchor: middle; }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; text-anchor: middle; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; text-anchor: middle; }
    .title { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink); }
  </style>

  <text class="title" x="40" y="32">What survives the decision, and where</text>

  <rect class="adj" x="40" y="52" width="240" height="188" />
  <text class="head" x="160" y="82">The deliberation</text>
  <text class="sub" x="160" y="110">Claude in Agentforce:</text>
  <text class="sub" x="160" y="130">inside the CRM tenant.</text>
  <text class="sub" x="160" y="158">Salesforce in Claude:</text>
  <text class="sub" x="160" y="178">inside the Claude workspace,</text>
  <text class="sub" x="160" y="198">beside every other connector</text>
  <text class="sub" x="160" y="218">the user has enabled.</text>

  <rect class="box" x="330" y="52" width="240" height="188" />
  <text class="head" x="450" y="82">The action</text>
  <text class="sub" x="450" y="110">Both directions: a write</text>
  <text class="sub" x="450" y="130">to a Salesforce record.</text>
  <text class="sub" x="450" y="158">Field history and event</text>
  <text class="sub" x="450" y="178">monitoring capture what</text>
  <text class="sub" x="450" y="198">changed and who changed it.</text>
  <text class="sub" x="450" y="222">This half is solved.</text>

  <rect class="hero" x="620" y="52" width="240" height="188" />
  <text class="head-inv" x="740" y="82">The join between them</text>
  <text class="sub-inv" x="740" y="110">Neither direction gives you</text>
  <text class="sub-inv" x="740" y="130">a record that answers</text>
  <text class="sub-inv" x="740" y="150">&#8220;on what basis?&#8221; next to</text>
  <text class="sub-inv" x="740" y="170">the field that changed.</text>
  <text class="sub-inv" x="740" y="198">Someone has to write the</text>
  <text class="sub-inv" x="740" y="218">reason back as a record.</text>

  <text class="sub" x="450" y="278">The column that is nobody&#8217;s feature is the one your auditor asks about.</text>
</svg>
