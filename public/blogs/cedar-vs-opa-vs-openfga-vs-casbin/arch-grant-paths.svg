<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="gpt gpd">
  <title id="gpt">Two paths by which a grant reaches an authorization decision</title>
  <desc id="gpd">An agent request reaches a policy engine by one of two paths. The upper path carries the grant as context on the request itself: fresh, but filled in by the agent and therefore forgeable. The lower path reads a grant stored earlier by the platform: trustworthy, but stale by whatever the cache or polling interval is. The engine choice is which of the two paths it can read without the caller's help.</desc>
  <style>
    .gp-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .gp-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .gp-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .gp-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .gp-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .gp-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .gp-ttl  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .gp-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#gparr); }
  </style>
  <defs>
    <marker id="gparr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="gp-ttl" x="450" y="32" text-anchor="middle">Two ways the grant reaches the decision</text>

  <rect class="gp-box" x="30" y="215" width="160" height="70" rx="8" ry="8" />
  <text class="gp-lab" x="110" y="256" text-anchor="middle">Agent request</text>

  <path class="gp-arr" d="M 190 235 L 246 142" />
  <path class="gp-arr" d="M 190 265 L 246 358" />

  <text class="gp-sub" x="250" y="86">the agent fills this in</text>
  <rect class="gp-adj" x="250" y="100" width="300" height="80" rx="8" ry="8" />
  <text class="gp-lab" x="400" y="134" text-anchor="middle">Context on the request</text>
  <text class="gp-sub" x="400" y="158" text-anchor="middle">fresh · forgeable by the caller</text>

  <rect class="gp-hero" x="250" y="320" width="300" height="80" rx="8" ry="8" />
  <text class="gp-inv" x="400" y="354" text-anchor="middle">Stored grant, written earlier</text>
  <text class="gp-sub" x="250" y="422">you fill this in, ahead of time</text>

  <path class="gp-arr" d="M 550 140 L 616 232" />
  <path class="gp-arr" d="M 550 360 L 616 268" />

  <rect class="gp-box" x="620" y="215" width="240" height="70" rx="8" ry="8" />
  <text class="gp-lab" x="740" y="256" text-anchor="middle">Policy engine · decide</text>

  <rect class="gp-box" x="30" y="444" width="830" height="46" rx="8" ry="8" />
  <text class="gp-lab" x="445" y="474" text-anchor="middle">Pick the engine on which path it can read without the caller's help</text>
</svg>
