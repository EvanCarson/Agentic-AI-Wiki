<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="gst gsd">
  <title id="gst">Where each engine keeps the policy and the grant data</title>
  <desc id="gsd">A matrix of four authorization engines against three questions. Cedar keeps a policy set and takes entities from the caller or a separate entity store, so a caller can supply the facts. OPA evaluates a Rego module against bundle data it polls for, so mostly it cannot be forged. OpenFGA stores relationship tuples in its own database. Casbin loads a model and policy rows from your database in process. Forgeable means the agent fills in the facts the decision rests on.</desc>
  <style>
    .gs-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .gs-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .gs-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .gs-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .gs-cell { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .gs-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .gs-ttl  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .gs-hd   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="gs-ttl" x="450" y="30" text-anchor="middle">Where the policy lives, and who supplies the facts</text>

  <text class="gs-hd" x="390" y="68" text-anchor="middle">Policy artefact</text>
  <text class="gs-hd" x="585" y="68" text-anchor="middle">Grant / relation data</text>
  <text class="gs-hd" x="775" y="68" text-anchor="middle">Caller can forge it?</text>

  <text class="gs-lab" x="288" y="119" text-anchor="end">Cedar 4.15.0</text>
  <rect class="gs-box" x="300" y="88" width="180" height="52" rx="8" ry="8" />
  <text class="gs-cell" x="390" y="119" text-anchor="middle">Policy set</text>
  <rect class="gs-box" x="495" y="88" width="180" height="52" rx="8" ry="8" />
  <text class="gs-cell" x="585" y="119" text-anchor="middle">Caller / entity store</text>
  <rect class="gs-hero" x="690" y="88" width="170" height="52" rx="8" ry="8" />
  <text class="gs-inv" x="775" y="119" text-anchor="middle">Yes, by default</text>

  <text class="gs-lab" x="288" y="181" text-anchor="end">OPA 1.22.4</text>
  <rect class="gs-box" x="300" y="150" width="180" height="52" rx="8" ry="8" />
  <text class="gs-cell" x="390" y="181" text-anchor="middle">Rego module</text>
  <rect class="gs-box" x="495" y="150" width="180" height="52" rx="8" ry="8" />
  <text class="gs-cell" x="585" y="181" text-anchor="middle">Bundle, polled</text>
  <rect class="gs-adj" x="690" y="150" width="170" height="52" rx="8" ry="8" />
  <text class="gs-cell" x="775" y="181" text-anchor="middle">Only if you let it</text>

  <text class="gs-lab" x="288" y="243" text-anchor="end">OpenFGA 1.22.1</text>
  <rect class="gs-box" x="300" y="212" width="180" height="52" rx="8" ry="8" />
  <text class="gs-cell" x="390" y="243" text-anchor="middle">Model DSL</text>
  <rect class="gs-box" x="495" y="212" width="180" height="52" rx="8" ry="8" />
  <text class="gs-cell" x="585" y="243" text-anchor="middle">Tuples in its own DB</text>
  <rect class="gs-box" x="690" y="212" width="170" height="52" rx="8" ry="8" />
  <text class="gs-cell" x="775" y="243" text-anchor="middle">No</text>

  <text class="gs-lab" x="288" y="305" text-anchor="end">Casbin 3.11.0</text>
  <rect class="gs-box" x="300" y="274" width="180" height="52" rx="8" ry="8" />
  <text class="gs-cell" x="390" y="305" text-anchor="middle">Model + rows</text>
  <rect class="gs-box" x="495" y="274" width="180" height="52" rx="8" ry="8" />
  <text class="gs-cell" x="585" y="305" text-anchor="middle">Your DB, in process</text>
  <rect class="gs-box" x="690" y="274" width="170" height="52" rx="8" ry="8" />
  <text class="gs-cell" x="775" y="305" text-anchor="middle">No</text>

  <rect class="gs-box" x="40" y="346" width="820" height="40" rx="8" ry="8" />
  <text class="gs-lab" x="450" y="371" text-anchor="middle">Forgeable means the agent fills in the facts the decision rests on</text>
</svg>
