<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The five layers of a managed agent runtime, and which one does not port</title>
  <desc id="d">A layered diagram of a managed agent runtime. Your agent code sits above four vendor-operated layers: the orchestration loop, the tool gateway, the identity broker, and the conversation state store. The first three are marked as portable in a sprint because they are code or configuration; the conversation state store is highlighted as accumulated vendor-shaped data that grows with the deployment and cannot be rewritten.</desc>
  <style>
    .box       { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero      { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj       { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .frame     { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; opacity: .55; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper, #fff); opacity: .85; text-anchor: middle; }
    .side      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: currentColor; opacity: .7; text-anchor: start; }
    .side-lead { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--accent, #d4421e); text-anchor: start; }
    .caption   { font-family: var(--font-display); font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: start; }
    .arrow     { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="adj" x="60" y="40" width="480" height="52" rx="8" />
  <text class="label" x="300" y="63">Your agent code</text>
  <text class="sub" x="300" y="80">prompts, business logic, framework of your choice</text>

  <path class="arrow" d="M 300 92 L 300 118" />

  <text class="caption" x="60" y="136">Vendor-operated</text>
  <rect class="frame" x="52" y="146" width="496" height="316" rx="10" />

  <rect class="box" x="76" y="166" width="448" height="56" rx="8" />
  <text class="label" x="300" y="190">Orchestration loop</text>
  <text class="sub" x="300" y="207">call the model, pick a tool, feed the result back, terminate</text>

  <rect class="box" x="76" y="238" width="448" height="56" rx="8" />
  <text class="label" x="300" y="262">Tool gateway</text>
  <text class="sub" x="300" y="279">discovery, schemas, invocation, retries</text>

  <rect class="box" x="76" y="310" width="448" height="56" rx="8" />
  <text class="label" x="300" y="334">Identity broker</text>
  <text class="sub" x="300" y="351">whose credentials the tool call travels on</text>

  <rect class="hero" x="76" y="382" width="448" height="60" rx="8" />
  <text class="label-inv" x="300" y="408">Conversation state</text>
  <text class="sub-inv" x="300" y="425">threads, sessions, extracted memories — grows every day</text>

  <path class="arrow" d="M 560 194 L 596 194" />
  <text class="side" x="606" y="184">Rewritable. If you wrote against a</text>
  <text class="side" x="606" y="200">framework rather than the vendor's</text>
  <text class="side" x="606" y="216">loop, mostly already portable.</text>

  <path class="arrow" d="M 560 266 L 596 266" />
  <text class="side" x="606" y="264">Configuration. Re-point it.</text>

  <path class="arrow" d="M 560 338 L 596 338" />
  <text class="side" x="606" y="330">Re-issue credentials, re-bind</text>
  <text class="side" x="606" y="346">scopes. A sprint, not a project.</text>

  <path class="arrow" d="M 560 412 L 596 412" />
  <text class="side-lead" x="606" y="396">Not code. Accumulated data in</text>
  <text class="side-lead" x="606" y="412">the vendor's shape — the only</text>
  <text class="side-lead" x="606" y="428">layer that gets worse with time.</text>
</svg>
