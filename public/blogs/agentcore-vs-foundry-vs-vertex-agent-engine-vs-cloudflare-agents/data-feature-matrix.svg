<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Where each managed agent runtime leans hardest</title>
  <desc id="d">A four-by-four matrix scoring Bedrock AgentCore, Microsoft Foundry Agent Service, Vertex AI Agent Engine and Cloudflare Agents on compute metering, who owns conversation state, whether the primitives are separately usable, and whether a config-defined loop is offered. Foundry leads on state ownership, AgentCore on unbundled primitives, Cloudflare on per-agent state, and Vertex on managed memory extraction.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-inv     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: start; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28">Four runtimes, four axes</text>

  <text class="col-head" x="300" y="64">Meters agent compute</text>
  <text class="col-head" x="450" y="64">You own the state</text>
  <text class="col-head" x="610" y="64">Primitives sold apart</text>
  <text class="col-head" x="770" y="64">Config-defined loop</text>

  <text class="row-head" x="215" y="104">AgentCore</text>
  <rect class="card-soft" x="230" y="78" width="140" height="40" rx="6" />
  <text class="body-text" x="300" y="97">$0.0895 vCPU-hr,</text>
  <text class="body-text" x="300" y="111">active CPU only</text>
  <rect class="card-neutral" x="380" y="78" width="140" height="40" rx="6" />
  <text class="body-text" x="450" y="103">Managed Memory</text>
  <rect class="card-accent" x="530" y="78" width="140" height="40" rx="6" />
  <text class="body-inv" x="600" y="97">Nine primitives,</text>
  <text class="body-inv" x="600" y="111">each callable</text>
  <rect class="card-soft" x="680" y="78" width="140" height="40" rx="6" />
  <text class="body-text" x="750" y="97">Harness, GA</text>
  <text class="body-text" x="750" y="111">June 2026</text>

  <text class="row-head" x="215" y="164">Foundry</text>
  <rect class="card-neutral" x="230" y="138" width="140" height="40" rx="6" />
  <text class="body-text" x="300" y="157">No runtime charge;</text>
  <text class="body-text" x="300" y="171">tokens and storage</text>
  <rect class="card-accent" x="380" y="138" width="140" height="40" rx="6" />
  <text class="body-inv" x="450" y="157">Your own Cosmos DB</text>
  <text class="body-inv" x="450" y="171">on Standard setup</text>
  <rect class="card-soft" x="530" y="138" width="140" height="40" rx="6" />
  <text class="body-text" x="600" y="163">Tools and models split</text>
  <rect class="card-accent" x="680" y="138" width="140" height="40" rx="6" />
  <text class="body-inv" x="750" y="157">Prompts and</text>
  <text class="body-inv" x="750" y="171">workflows, no code</text>

  <text class="row-head" x="215" y="224">Vertex Agent Engine</text>
  <rect class="card-soft" x="230" y="198" width="140" height="40" rx="6" />
  <text class="body-text" x="300" y="217">$0.0864 vCPU-hr,</text>
  <text class="body-text" x="300" y="231">free tier included</text>
  <rect class="card-neutral" x="380" y="198" width="140" height="40" rx="6" />
  <text class="body-text" x="450" y="217">Managed Sessions;</text>
  <text class="body-text" x="450" y="231">$0.25 per 1k events</text>
  <rect class="card-soft" x="530" y="198" width="140" height="40" rx="6" />
  <text class="body-text" x="600" y="217">Sessions and Memory</text>
  <text class="body-text" x="600" y="231">billed separately</text>
  <rect class="card-neutral" x="680" y="198" width="140" height="40" rx="6" />
  <text class="body-text" x="750" y="223">Code-first</text>

  <text class="row-head" x="215" y="284">Cloudflare Agents</text>
  <rect class="card-neutral" x="230" y="258" width="140" height="40" rx="6" />
  <text class="body-text" x="300" y="277">Folded into Workers</text>
  <text class="body-text" x="300" y="291">duration and requests</text>
  <rect class="card-accent" x="380" y="258" width="140" height="40" rx="6" />
  <text class="body-inv" x="450" y="277">SQLite per agent,</text>
  <text class="body-inv" x="450" y="291">yours to query</text>
  <rect class="card-accent" x="530" y="258" width="140" height="40" rx="6" />
  <text class="body-inv" x="600" y="277">Durable Objects</text>
  <text class="body-inv" x="600" y="291">predate the SDK</text>
  <rect class="card-neutral" x="680" y="258" width="140" height="40" rx="6" />
  <text class="body-text" x="750" y="283">Code-first</text>

  <rect class="card-accent" x="180" y="340" width="14" height="14" rx="3" />
  <text class="legend-text" x="202" y="352">Leads on this axis</text>
  <rect class="card-soft" x="380" y="340" width="14" height="14" rx="3" />
  <text class="legend-text" x="402" y="352">Competitive</text>
  <rect class="card-neutral" x="580" y="340" width="14" height="14" rx="3" />
  <text class="legend-text" x="602" y="352">Not where it competes</text>
</svg>
