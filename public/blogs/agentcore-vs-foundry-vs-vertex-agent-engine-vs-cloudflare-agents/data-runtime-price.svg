<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Published agent-runtime compute rates, US dollars per vCPU-hour</title>
  <desc id="d">Horizontal bar chart of published agent-runtime compute rates. Bedrock AgentCore Runtime charges 0.0895 dollars per vCPU-hour and Vertex AI Agent Engine charges 0.0864, a gap of 3.6 percent. Microsoft Foundry Agent Service charges nothing for running an agent and Cloudflare Agents folds the cost into Workers duration and requests, so neither has a per-vCPU-hour rate to plot.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: start; }
    .axis-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .6; text-anchor: middle; }
    .row-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .row-sub     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .6; text-anchor: end; }
    .value       { font-family: var(--font-mono); font-size: 13px; font-weight: 600; text-anchor: start; }
    .value-lead  { fill: var(--accent, #d4421e); }
    .value-mute  { fill: currentColor; opacity: .55; }
    .note        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: currentColor; opacity: .65; text-anchor: start; }
    .grid        { stroke: currentColor; stroke-width: 1; opacity: .18; stroke-dasharray: 2 4; }
    .bar-lead    { fill: var(--accent, #d4421e); }
    .bar-soft    { fill: var(--accent-soft, #f5c5b8); }
    .bar-none    { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="60" y="34">Compute rate, USD per vCPU-hour</text>

  <line class="grid" x1="250" y1="60" x2="250" y2="330" />
  <line class="grid" x1="387" y1="60" x2="387" y2="330" />
  <line class="grid" x1="525" y1="60" x2="525" y2="330" />
  <line class="grid" x1="662" y1="60" x2="662" y2="330" />
  <line class="grid" x1="800" y1="60" x2="800" y2="330" />
  <text class="axis-label" x="250" y="352">$0</text>
  <text class="axis-label" x="387" y="352">$0.025</text>
  <text class="axis-label" x="525" y="352">$0.05</text>
  <text class="axis-label" x="662" y="352">$0.075</text>
  <text class="axis-label" x="800" y="352">$0.10</text>

  <text class="row-head" x="236" y="86">Bedrock AgentCore</text>
  <text class="row-sub" x="236" y="102">Runtime</text>
  <rect class="bar-lead" x="250" y="70" width="492" height="34" rx="4" />
  <text class="value value-lead" x="754" y="93">$0.0895</text>

  <text class="row-head" x="236" y="156">Vertex AI Agent Engine</text>
  <text class="row-sub" x="236" y="172">50 vCPU-hr free monthly</text>
  <rect class="bar-soft" x="250" y="140" width="475" height="34" rx="4" />
  <text class="value value-mute" x="737" y="163">$0.0864</text>

  <text class="row-head" x="236" y="226">Foundry Agent Service</text>
  <text class="row-sub" x="236" y="242">tokens and storage only</text>
  <rect class="bar-none" x="250" y="210" width="200" height="34" rx="4" />
  <text class="value value-mute" x="462" y="233">no runtime charge</text>

  <text class="row-head" x="236" y="296">Cloudflare Agents</text>
  <text class="row-sub" x="236" y="312">Workers duration, requests</text>
  <rect class="bar-none" x="250" y="280" width="200" height="34" rx="4" />
  <text class="value value-mute" x="462" y="303">not metered as agents</text>

  <text class="note" x="60" y="384">Both metered rates bill active CPU only — time blocked on a model or tool call is not charged.</text>
</svg>
