<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="wcd wcdd">
  <title id="wcd">Powers of the three Entra Agent ID administrative relationships</title>
  <desc id="wcdd">A matrix of the sponsor, owner and manager relationships in Microsoft Entra Agent ID against four powers. The sponsor is the only one required when an agent is created, cannot configure the agent, can disable and soft-delete it, and cannot restore it. The owner is optional and holds every power including restore. The manager is optional and holds none of the four.</desc>
  <style>
    .wd-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .wd-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .wd-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .wd-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wd-col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .wd-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wd-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .wd-cellin { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .wd-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="wd-ttl" x="20" y="30">Who must exist, and who can do what</text>

  <text class="wd-col" x="282" y="66" text-anchor="middle">REQUIRED?</text>
  <text class="wd-col" x="457" y="66" text-anchor="middle">CONFIGURE</text>
  <text class="wd-col" x="632" y="66" text-anchor="middle">STOP</text>
  <text class="wd-col" x="807" y="66" text-anchor="middle">RESTORE</text>

  <text class="wd-row" x="20" y="103">Sponsor</text>
  <rect class="wd-strong" x="200" y="80" width="165" height="36" />
  <text class="wd-cellin" x="282" y="103" text-anchor="middle">Yes, at creation</text>
  <rect class="wd-weak" x="375" y="80" width="165" height="36" />
  <text class="wd-cell" x="457" y="103" text-anchor="middle">No</text>
  <rect class="wd-strong" x="550" y="80" width="165" height="36" />
  <text class="wd-cellin" x="632" y="103" text-anchor="middle">Disable, soft-delete</text>
  <rect class="wd-weak" x="725" y="80" width="165" height="36" />
  <text class="wd-cell" x="807" y="103" text-anchor="middle">No</text>

  <text class="wd-row" x="20" y="159">Owner</text>
  <rect class="wd-weak" x="200" y="136" width="165" height="36" />
  <text class="wd-cell" x="282" y="159" text-anchor="middle">Optional</text>
  <rect class="wd-med" x="375" y="136" width="165" height="36" />
  <text class="wd-cell" x="457" y="159" text-anchor="middle">Yes</text>
  <rect class="wd-med" x="550" y="136" width="165" height="36" />
  <text class="wd-cell" x="632" y="159" text-anchor="middle">Yes</text>
  <rect class="wd-med" x="725" y="136" width="165" height="36" />
  <text class="wd-cell" x="807" y="159" text-anchor="middle">Yes, only this role</text>

  <text class="wd-row" x="20" y="215">Manager</text>
  <rect class="wd-weak" x="200" y="192" width="165" height="36" />
  <text class="wd-cell" x="282" y="215" text-anchor="middle">Optional</text>
  <rect class="wd-weak" x="375" y="192" width="165" height="36" />
  <text class="wd-cell" x="457" y="215" text-anchor="middle">No</text>
  <rect class="wd-weak" x="550" y="192" width="165" height="36" />
  <text class="wd-cell" x="632" y="215" text-anchor="middle">No</text>
  <rect class="wd-weak" x="725" y="192" width="165" height="36" />
  <text class="wd-cell" x="807" y="215" text-anchor="middle">No</text>

  <text class="wd-col" x="20" y="262">THE REQUIRED ROW AND THE POWERFUL ROW ARE DIFFERENT ROWS</text>

  <rect class="wd-strong" x="20" y="306" width="16" height="13" />
  <text class="wd-leg" x="44" y="317">required, or the only holder</text>
  <rect class="wd-med" x="260" y="306" width="16" height="13" />
  <text class="wd-leg" x="284" y="317">holds the power</text>
  <rect class="wd-weak" x="440" y="306" width="16" height="13" />
  <text class="wd-leg" x="464" y="317">does not</text>
</svg>
