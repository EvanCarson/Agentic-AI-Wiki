<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="aad aadd">
  <title id="aad">The Entra Agent ID default inactivity policy timeline</title>
  <desc id="aadd">A left-to-right timeline. An agent identity in use enters the policy at sixty days of inactivity, when sponsors and owners are notified; it is disabled at ninety days, when only an owner or administrator can restore it; and it is deleted at four hundred and fifty-five days. A branch below the notify step shows that when no sponsor or owner is assigned, the notice goes to fallback recipients supplied by the administrator instead.</desc>
  <style>
    .ad-box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ad-hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ad-adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ad-dash  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 5 4; rx: 8; ry: 8; }
    .ad-ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .ad-day   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .ad-lab   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .ad-labin { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .ad-sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .ad-arrow { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#adarr); }
  </style>
  <defs>
    <marker id="adarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ad-ttl" x="20" y="30">Accountability binds at creation and decays afterwards</text>

  <text class="ad-day" x="120" y="72" text-anchor="middle">DAY 0</text>
  <text class="ad-day" x="330" y="72" text-anchor="middle">DAY 60</text>
  <text class="ad-day" x="540" y="72" text-anchor="middle">DAY 90</text>
  <text class="ad-day" x="750" y="72" text-anchor="middle">DAY 455</text>

  <rect class="ad-box" x="30" y="88" width="180" height="46" />
  <text class="ad-lab" x="120" y="117" text-anchor="middle">In use</text>
  <rect class="ad-adj" x="240" y="88" width="180" height="46" />
  <text class="ad-lab" x="330" y="117" text-anchor="middle">Notify</text>
  <rect class="ad-adj" x="450" y="88" width="180" height="46" />
  <text class="ad-lab" x="540" y="117" text-anchor="middle">Disabled</text>
  <rect class="ad-hero" x="660" y="88" width="180" height="46" />
  <text class="ad-labin" x="750" y="117" text-anchor="middle">Deleted</text>

  <path class="ad-arrow" d="M 212 111 L 236 111" />
  <path class="ad-arrow" d="M 422 111 L 446 111" />
  <path class="ad-arrow" d="M 632 111 L 656 111" />

  <text class="ad-sub" x="120" y="153" text-anchor="middle">last activity</text>
  <text class="ad-sub" x="330" y="153" text-anchor="middle">sponsors and owners</text>
  <text class="ad-sub" x="540" y="153" text-anchor="middle">only owner or admin restores</text>
  <text class="ad-sub" x="750" y="153" text-anchor="middle">identity removed</text>

  <path class="ad-arrow" d="M 330 160 L 330 194" />
  <rect class="ad-dash" x="240" y="198" width="180" height="46" />
  <text class="ad-lab" x="330" y="227" text-anchor="middle">Fallback recipients</text>
  <text class="ad-sub" x="450" y="227">when no sponsor or owner is assigned</text>

  <text class="ad-day" x="20" y="283">ACTIONS AND TIMEFRAMES NOT CUSTOMISABLE ON THE DEFAULT POLICY</text>
</svg>
