<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Claimed versus verified share of the human result, InnovationEval</title>
  <desc id="d">Grouped horizontal bar chart. GPT-5.6 Sol claimed about 70 percent of the reference method's improvement and 15 percent was verified in scope. Claude Fable 5 claimed about 40 percent and no measurable improvement was verified.</desc>
  <style>
    .claim { fill: var(--accent, #d4421e); }
    .ver   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .none  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .cat   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .val   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; fill: var(--ink); }
    .val-a { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; fill: var(--accent, #d4421e); }
    .grid  { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .axis  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .5; }
  </style>

  <text class="ttl" x="20" y="32">Share of the reference method's gain over GRPO (%)</text>

  <line class="grid" x1="340" y1="56" x2="340" y2="320" />
  <line class="grid" x1="480" y1="56" x2="480" y2="320" />
  <line class="grid" x1="620" y1="56" x2="620" y2="320" />
  <line class="grid" x1="760" y1="56" x2="760" y2="320" />
  <text class="axis" x="340" y="342" text-anchor="middle">20</text>
  <text class="axis" x="480" y="342" text-anchor="middle">40</text>
  <text class="axis" x="620" y="342" text-anchor="middle">60</text>
  <text class="axis" x="760" y="342" text-anchor="middle">80</text>

  <text class="cat" x="20" y="86">GPT-5.6 Sol</text>
  <text class="sub" x="20" y="104">claimed in its report</text>
  <rect class="claim" x="200" y="70" width="490" height="34" rx="3" />
  <text class="val-a" x="702" y="94">~70%</text>

  <text class="sub" x="20" y="150">verified, in scope</text>
  <rect class="ver" x="200" y="118" width="105" height="34" rx="3" />
  <text class="val" x="317" y="142">15%</text>

  <text class="cat" x="20" y="222">Claude Fable 5</text>
  <text class="sub" x="20" y="240">claimed in its report</text>
  <rect class="claim" x="200" y="206" width="280" height="34" rx="3" />
  <text class="val-a" x="492" y="230">~40%</text>

  <text class="sub" x="20" y="286">verified, in scope</text>
  <rect class="none" x="200" y="254" width="6" height="34" rx="3" />
  <text class="val" x="218" y="278">no measurable improvement</text>

  <text class="sub" x="20" y="378">Both agents had 3,000 GPU-hours. Generous grading put Sol at ~35%; 15% counts only in-scope changes.</text>
</svg>
