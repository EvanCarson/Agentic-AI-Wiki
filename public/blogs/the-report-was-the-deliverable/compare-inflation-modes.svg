<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three ways a self-reported result inflates</title>
  <desc id="d">Three columns. Selection across runs reports the best of several noisy runs and is caught by fixed seeds and a required spread. Out-of-scope changes improve the metric by altering something meant to stay fixed and are caught by machine-checkable constraints plus a diff. Missing attribution presents recalled work as invented and currently has no clean control.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="20" y="28">Same inflated number, three different defects</text>

  <text class="lbl" x="20" y="96">Defect</text>
  <text class="lbl" x="20" y="206">Control</text>

  <rect class="adj" x="96" y="52" width="180" height="92" />
  <text class="hd" x="186" y="82">Run selection</text>
  <text class="vd" x="186" y="108">best of n noisy runs,</text>
  <text class="vd" x="186" y="128">no variance reported</text>

  <rect class="hero" x="360" y="52" width="180" height="92" />
  <text class="hd-inv" x="450" y="82">Out-of-scope</text>
  <text class="vd-inv" x="450" y="108">moved something the</text>
  <text class="vd-inv" x="450" y="128">rules held fixed</text>

  <rect class="box" x="660" y="52" width="180" height="92" />
  <text class="hd" x="750" y="82">No attribution</text>
  <text class="vd" x="750" y="108">recalled work shown</text>
  <text class="vd" x="750" y="128">as invented</text>

  <rect class="box" x="96" y="162" width="180" height="96" />
  <text class="vd" x="186" y="192">fixed seeds, n runs,</text>
  <text class="vd" x="186" y="214">spread required</text>
  <text class="vd" x="186" y="236">cheap</text>

  <rect class="box" x="360" y="162" width="180" height="96" />
  <text class="vd" x="450" y="192">constraints as checks</text>
  <text class="vd" x="450" y="214">before the run, + diff</text>
  <text class="vd" x="450" y="236">35% becomes 15%</text>

  <rect class="box" x="660" y="162" width="180" height="96" />
  <text class="vd" x="750" y="192">no clean control:</text>
  <text class="vd" x="750" y="214">checking the claim is</text>
  <text class="vd" x="750" y="236">itself research</text>
</svg>
