<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Grading the report versus re-executing the artifact</title>
  <desc id="d">Two harness designs compared. In the upper path the agent emits a report that goes straight to a grader reading prose, producing a verdict that inherits the agent's own errors. In the lower path the agent's committed artifact is re-executed from a clean checkout under machine-checkable constraints, and the verdict comes from the run while the report is attached only as commentary.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .ln     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .ln-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .88; text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .sec    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .65; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="28">What the harness actually grades</text>

  <text class="sec" x="20" y="62">Reading the sentence</text>

  <rect class="box" x="20" y="76" width="160" height="78" />
  <text class="hd" x="100" y="108">Agent run</text>
  <text class="vd" x="100" y="132">3,000 GPU-hours</text>

  <path class="arrow" d="M 180 115 L 218 115" />

  <rect class="adj" x="220" y="76" width="180" height="78" />
  <text class="hd" x="310" y="108">Final report</text>
  <text class="vd" x="310" y="132">"~70% of the gain"</text>

  <path class="arrow" d="M 400 115 L 438 115" />

  <rect class="box" x="440" y="76" width="180" height="78" />
  <text class="hd" x="530" y="108">Grader reads prose</text>
  <text class="vd" x="530" y="132">same context, same errors</text>

  <path class="arrow" d="M 620 115 L 658 115" />

  <rect class="box" x="660" y="76" width="210" height="78" />
  <text class="hd" x="765" y="108">Verdict: 70%</text>
  <text class="vd" x="765" y="132">a restatement, not a measurement</text>

  <text class="sec" x="20" y="252">Running the artifact</text>

  <rect class="box" x="20" y="266" width="160" height="110" />
  <text class="hd" x="100" y="298">Agent run</text>
  <text class="vd" x="100" y="322">same 3,000 hours</text>
  <text class="vd" x="100" y="344">commits an artifact</text>

  <path class="arrow" d="M 180 320 L 218 320" />

  <rect class="adj" x="220" y="266" width="180" height="110" />
  <text class="hd" x="310" y="298">Clean re-execution</text>
  <text class="vd" x="310" y="322">fresh checkout, fixed</text>
  <text class="vd" x="310" y="344">seeds, n runs</text>

  <path class="arrow" d="M 400 320 L 438 320" />

  <rect class="adj" x="440" y="266" width="180" height="110" />
  <text class="hd" x="530" y="298">Scope diff</text>
  <text class="vd" x="530" y="322">what changed against</text>
  <text class="vd" x="530" y="344">what was allowed to</text>

  <path class="arrow" d="M 620 320 L 658 320" />

  <rect class="hero" x="660" y="266" width="210" height="110" />
  <text class="hd-inv" x="765" y="298">Verdict: 15%</text>
  <text class="ln-inv" x="765" y="322">plus a spread</text>
  <text class="ln-inv" x="765" y="344">report attached as commentary</text>

  <text class="ln" x="450" y="432">The agent is identical in both rows. Only the graded object changed.</text>
</svg>
