<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="cjt cjd">
  <title id="cjt">JSON tool dispatch versus code as action</title>
  <desc id="cjd">Two paths from a model's output to an effect. In JSON dispatch the framework matches a name against a registered tool table, so the reachable surface is the tools you registered. In code as action the model emits Python that an interpreter executes, so the reachable surface is whatever that process can reach, and the sandbox becomes the boundary.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; text-anchor: middle; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; text-anchor: middle; }
    .hdr    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .55; letter-spacing: .08em; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.4; marker-end: url(#cjarr); }
    .zone   { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 4; rx: 10; ry: 10; }
  </style>
  <defs>
    <marker id="cjarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="hdr" x="24" y="34">PYDANTIC AI · AGNO · STRANDS</text>
  <text class="hdr" x="490" y="34">SMOLAGENTS CODEAGENT</text>

  <rect class="zone" x="16" y="48" width="430" height="404" />
  <rect class="zone" x="470" y="48" width="414" height="404" />

  <rect class="box" x="90" y="76" width="280" height="64" />
  <text class="label" x="230" y="104">Model output</text>
  <text class="sub" x="230" y="126">{"name": "search", "args": {…}}</text>

  <rect class="adj" x="90" y="188" width="280" height="76" />
  <text class="label" x="230" y="216">Framework dispatch</text>
  <text class="sub" x="230" y="238">name matched against the</text>
  <text class="sub" x="230" y="256">registered tool table</text>

  <rect class="hero" x="90" y="316" width="280" height="88" />
  <text class="label-inv" x="230" y="350">Reachable surface</text>
  <text class="sub-inv" x="230" y="374">exactly the tools you</text>
  <text class="sub-inv" x="230" y="392">registered, and nothing else</text>

  <rect class="box" x="530" y="76" width="290" height="64" />
  <text class="label" x="675" y="104">Model output</text>
  <text class="sub" x="675" y="126">results = [f(x) for x in load()]</text>

  <rect class="adj" x="530" y="188" width="290" height="76" />
  <text class="label" x="675" y="216">Interpreter</text>
  <text class="sub" x="675" y="238">AST walker locally, or E2B /</text>
  <text class="sub" x="675" y="256">Docker / Modal / Wasm remotely</text>

  <rect class="hero" x="530" y="316" width="290" height="88" />
  <text class="label-inv" x="675" y="350">Reachable surface</text>
  <text class="sub-inv" x="675" y="374">whatever the process can reach —</text>
  <text class="sub-inv" x="675" y="392">the sandbox is the boundary</text>

  <g color="var(--ink)">
    <path class="arrow" d="M 230 140 L 230 184" />
    <path class="arrow" d="M 230 264 L 230 312" />
    <path class="arrow" d="M 675 140 L 675 184" />
    <path class="arrow" d="M 675 264 L 675 312" />
  </g>
</svg>
