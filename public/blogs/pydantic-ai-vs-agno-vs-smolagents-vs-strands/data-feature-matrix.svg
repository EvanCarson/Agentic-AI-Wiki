<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmt fmd">
  <title id="fmt">Where each library places its weight</title>
  <desc id="fmd">A matrix over four axes — typed contracts, code as action, owning persistent state, and an opinion about deployment. Pydantic AI leans hardest on typed contracts, smolagents on code as action, Agno on owning state, and Strands on deployment.</desc>
  <style>
    .cell-s { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .cell-m { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .cell-w { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .ct     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); text-anchor: middle; }
    .ct-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); text-anchor: middle; }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; text-anchor: middle; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="title" x="24" y="30">Where each library places its weight</text>

  <text class="col" x="345" y="70">Typed contract</text>
  <text class="col" x="510" y="70">Code as action</text>
  <text class="col" x="675" y="70">Owns your state</text>
  <text class="col" x="840" y="70">Deployment opinion</text>

  <text class="row" x="24" y="112">Pydantic AI</text>
  <rect class="cell-s" x="270" y="90" width="150" height="34" />
  <text class="ct-inv" x="345" y="112">Strong</text>
  <rect class="cell-w" x="435" y="90" width="150" height="34" />
  <text class="ct" x="510" y="112">No</text>
  <rect class="cell-w" x="600" y="90" width="150" height="34" />
  <text class="ct" x="675" y="112">No</text>
  <rect class="cell-w" x="765" y="90" width="110" height="34" />
  <text class="ct" x="820" y="112">None</text>

  <text class="row" x="24" y="166">smolagents</text>
  <rect class="cell-w" x="270" y="144" width="150" height="34" />
  <text class="ct" x="345" y="166">Light</text>
  <rect class="cell-s" x="435" y="144" width="150" height="34" />
  <text class="ct-inv" x="510" y="166">Its whole thesis</text>
  <rect class="cell-w" x="600" y="144" width="150" height="34" />
  <text class="ct" x="675" y="166">No</text>
  <rect class="cell-m" x="765" y="144" width="110" height="34" />
  <text class="ct" x="820" y="166">Sandbox</text>

  <text class="row" x="24" y="220">Agno</text>
  <rect class="cell-m" x="270" y="198" width="150" height="34" />
  <text class="ct" x="345" y="220">Medium</text>
  <rect class="cell-w" x="435" y="198" width="150" height="34" />
  <text class="ct" x="510" y="220">No</text>
  <rect class="cell-s" x="600" y="198" width="150" height="34" />
  <text class="ct-inv" x="675" y="220">Sessions, memory</text>
  <rect class="cell-m" x="765" y="198" width="110" height="34" />
  <text class="ct" x="820" y="220">AgentOS</text>

  <text class="row" x="24" y="274">Strands Agents</text>
  <rect class="cell-m" x="270" y="252" width="150" height="34" />
  <text class="ct" x="345" y="274">Medium</text>
  <rect class="cell-w" x="435" y="252" width="150" height="34" />
  <text class="ct" x="510" y="274">No</text>
  <rect class="cell-m" x="600" y="252" width="150" height="34" />
  <text class="ct" x="675" y="274">Partial</text>
  <rect class="cell-s" x="765" y="252" width="110" height="34" />
  <text class="ct-inv" x="820" y="274">AWS-shaped</text>

  <rect class="cell-s" x="24" y="330" width="18" height="18" />
  <text class="leg" x="50" y="344">Where its weight sits</text>
  <rect class="cell-m" x="270" y="330" width="18" height="18" />
  <text class="leg" x="296" y="344">Present</text>
  <rect class="cell-w" x="510" y="330" width="18" height="18" />
  <text class="leg" x="536" y="344">Deliberately left to you</text>
</svg>
