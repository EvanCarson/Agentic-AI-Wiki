<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="pst psd">
  <title id="pst">GitHub stars, four Python agent libraries</title>
  <desc id="psd">Horizontal bar chart of approximate GitHub star counts in late August 2026: Agno about 41,800, smolagents about 28,900, Pydantic AI about 19,400, and Strands Agents above 2,000.</desc>
  <style>
    .bar-s  { fill: var(--accent, #d4421e); }
    .bar-m  { fill: var(--accent-soft); }
    .bar-w  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .name   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .val    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .axis   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .55; text-anchor: middle; }
    .grid   { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="title" x="24" y="34">GitHub stars (thousands)</text>

  <line class="grid" x1="240" y1="60" x2="240" y2="312" />
  <line class="grid" x1="390" y1="60" x2="390" y2="312" />
  <line class="grid" x1="540" y1="60" x2="540" y2="312" />
  <line class="grid" x1="690" y1="60" x2="690" y2="312" />
  <line class="grid" x1="840" y1="60" x2="840" y2="312" />
  <text class="axis" x="240" y="332">0</text>
  <text class="axis" x="390" y="332">12</text>
  <text class="axis" x="540" y="332">24</text>
  <text class="axis" x="690" y="332">36</text>
  <text class="axis" x="840" y="332">48</text>

  <text class="name" x="24" y="94">Agno</text>
  <rect class="bar-s" x="240" y="74" width="523" height="28" rx="3" />
  <text class="val" x="775" y="94">41.8k</text>

  <text class="name" x="24" y="154">smolagents</text>
  <rect class="bar-m" x="240" y="134" width="361" height="28" rx="3" />
  <text class="val" x="613" y="154">28.9k</text>

  <text class="name" x="24" y="214">Pydantic AI</text>
  <rect class="bar-m" x="240" y="194" width="243" height="28" rx="3" />
  <text class="val" x="495" y="214">19.4k</text>

  <text class="name" x="24" y="274">Strands Agents</text>
  <rect class="bar-w" x="240" y="254" width="26" height="28" rx="3" />
  <text class="val" x="278" y="274">2k+</text>

  <text class="note" x="24" y="366">Approximate counts, late August 2026. Strands also reports 150k+ monthly PyPI downloads,</text>
  <text class="note" x="24" y="384">which is the number that does not appear on this axis at all.</text>
</svg>
