<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Published catalog size, in each vendor's own unit</title>
  <desc id="d">Horizontal bars comparing published catalog sizes for four agent connector platforms. Pipedream Connect reports more than 10,000 tools across more than 3,000 APIs. Arcade reports more than 7,500 tools across 81 MCP servers. Composio reports around 1,000 applications. Nango reports more than 900 APIs with more than 700 pre-built connectors. The units differ, so the bars are not directly comparable.</desc>
  <style>
    .chart-t { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; }
    .name    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .unit    { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink, #1a1a1a); opacity: .6; }
    .val     { font-family: var(--font-mono); font-size: 12.5px; fill: var(--ink, #1a1a1a); }
    .val-acc { font-family: var(--font-mono); font-size: 12.5px; fill: var(--accent, #d4421e); }
    .grid    { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .tick    { font-family: var(--font-mono); font-size: 10.5px; fill: currentColor; opacity: .45; text-anchor: middle; }
    .bar-a   { fill: var(--accent, #d4421e); }
    .bar-s   { fill: var(--accent-soft, #f5c5b8); }
    .bar-m   { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .foot    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: currentColor; opacity: .6; }
  </style>

  <text class="chart-t" x="30" y="30">Catalog size, counted the way each vendor counts it</text>

  <line class="grid" x1="250" y1="58" x2="250" y2="322" />
  <line class="grid" x1="405" y1="58" x2="405" y2="322" />
  <line class="grid" x1="560" y1="58" x2="560" y2="322" />
  <line class="grid" x1="715" y1="58" x2="715" y2="322" />
  <line class="grid" x1="870" y1="58" x2="870" y2="322" />
  <text class="tick" x="250" y="342">0</text>
  <text class="tick" x="405" y="342">2,500</text>
  <text class="tick" x="560" y="342">5,000</text>
  <text class="tick" x="715" y="342">7,500</text>
  <text class="tick" x="870" y="342">10,000</text>

  <text class="name" x="30" y="80">Pipedream Connect</text>
  <text class="unit" x="30" y="98">tools · 3,000+ APIs</text>
  <rect class="bar-a" x="250" y="66" width="620" height="34" rx="4" />
  <text class="val-acc" x="700" y="122">10,000+ tools</text>

  <text class="name" x="30" y="150">Arcade</text>
  <text class="unit" x="30" y="168">tools · 81 MCP servers</text>
  <rect class="bar-s" x="250" y="136" width="465" height="34" rx="4" />
  <text class="val" x="545" y="192">7,500+ tools</text>

  <text class="name" x="30" y="220">Composio</text>
  <text class="unit" x="30" y="238">applications</text>
  <rect class="bar-m" x="250" y="206" width="62" height="34" rx="4" />
  <text class="val" x="322" y="228">~1,000 apps</text>

  <text class="name" x="30" y="290">Nango</text>
  <text class="unit" x="30" y="308">APIs · 700+ connectors</text>
  <rect class="bar-m" x="250" y="276" width="56" height="34" rx="4" />
  <text class="val" x="316" y="298">900+ APIs</text>

  <text class="foot" x="30" y="376">A tool is one callable operation; an app or API may expose fifty of them, or three.</text>
</svg>
