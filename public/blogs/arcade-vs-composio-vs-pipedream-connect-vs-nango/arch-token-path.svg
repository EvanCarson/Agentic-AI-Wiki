<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where the user's token lives during an authorised tool call</title>
  <desc id="d">The agent loop asks the connector platform for a tool by name and a user identifier. The platform looks up an encrypted per-user, per-provider credential in its vault; if none is valid it sends the user through an OAuth challenge and stores the result. The token is injected into the outbound call to the upstream API at execution time, and only the result is returned to the model, so the credential never enters the context window.</desc>
  <style>
    .box     { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero    { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj     { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label   { font-family: var(--font-display); font-size: 14px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-i { font-family: var(--font-display); font-size: 14px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub     { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink, #1a1a1a); opacity: .65; text-anchor: middle; }
    .sub-i   { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper, #fff); opacity: .85; text-anchor: middle; }
    .edge    { font-family: var(--font-mono); font-size: 11px; fill: currentColor; opacity: .7; text-anchor: middle; }
    .arrow   { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr3); }
    .arrow-d { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arr3a); }
    .fence   { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 4 5; opacity: .5; }
    .fence-t { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: currentColor; opacity: .6; }
  </style>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
    <marker id="arr3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent, #d4421e)" />
    </marker>
  </defs>

  <text class="fence-t" x="30" y="42">left of the line: what the model can see</text>
  <text class="fence-t" x="272" y="42">right of the line: what it never sees</text>
  <path class="fence" d="M 258 54 L 258 420" />

  <rect class="box" x="30" y="152" width="180" height="80" rx="8" />
  <text class="label" x="120" y="186">Agent loop</text>
  <text class="sub" x="120" y="206">tool name + user id</text>

  <path class="arrow" d="M 212 178 L 288 178" />
  <text class="edge" x="250" y="168">call</text>

  <rect class="hero" x="292" y="142" width="220" height="100" rx="8" />
  <text class="label-i" x="402" y="180">Connector platform</text>
  <text class="sub-i" x="402" y="200">resolves the credential</text>
  <text class="sub-i" x="402" y="218">before anything runs</text>

  <path class="arrow-d" d="M 516 178 L 690 178" />
  <text class="edge" x="603" y="168">token injected here</text>

  <rect class="adj" x="694" y="142" width="176" height="100" rx="8" />
  <text class="label" x="782" y="180">Upstream API</text>
  <text class="sub" x="782" y="200">acts as the user,</text>
  <text class="sub" x="782" y="218">with that user's scopes</text>

  <path class="arrow" d="M 690 230 L 516 230" />
  <text class="edge" x="603" y="248">result only</text>

  <path class="arrow" d="M 380 246 L 380 306" />
  <path class="arrow" d="M 424 306 L 424 248" />
  <text class="edge" x="402" y="284">look up</text>

  <rect class="adj" x="292" y="310" width="220" height="80" rx="8" />
  <text class="label" x="402" y="344">Per-user token vault</text>
  <text class="sub" x="402" y="364">encrypted, per provider</text>

  <path class="arrow" d="M 500 250 L 668 306" />
  <text class="edge" x="600" y="290">no valid token?</text>

  <rect class="box" x="672" y="310" width="198" height="80" rx="8" />
  <text class="label" x="771" y="344">OAuth challenge</text>
  <text class="sub" x="771" y="364">the user consents once</text>

  <path class="arrow" d="M 668 350 L 518 350" />
  <text class="edge" x="592" y="368">store · refresh · rotate</text>

  <text class="fence-t" x="30" y="452">A credential the model never saw is one a poisoned document cannot talk it into revealing.</text>
</svg>
