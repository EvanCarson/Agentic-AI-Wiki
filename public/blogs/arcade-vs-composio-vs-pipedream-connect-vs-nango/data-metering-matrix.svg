<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Four connector platforms across metering, branding, hosting and the agent shape each meter penalises</title>
  <desc id="d">A matrix with one row per platform. Arcade meters authorization challenges and executions separately, supports bring-your-own OAuth client, offers a self-hosted engine, and penalises high user churn. Composio meters tool calls, is platform-branded by default, offers an MIT SDK with a self-hostable MCP server, and penalises chatty loops. Pipedream Connect meters execution credits plus external users, is platform-branded by default, is managed only, and penalises long or heavy calls with wide consumer bases. Nango meters connections and requests, is white-label by default, offers a free self-hosted auth edition, and penalises large numbers of lightly used accounts.</desc>
  <style>
    .chart-t { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; }
    .col-h   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; opacity: .6; text-anchor: middle; }
    .row-h   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .cell    { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .cell-i  { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper, #fff); text-anchor: middle; }
    .s-hi    { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .s-mid   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .s-low   { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .foot    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: currentColor; opacity: .6; }
    .key     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .6; }
  </style>

  <text class="chart-t" x="30" y="28">What each one charges for, and what that charges you for</text>

  <text class="col-h" x="290" y="60">THE METER RUNS ON</text>
  <text class="col-h" x="480" y="60">CONSENT SCREEN</text>
  <text class="col-h" x="640" y="60">SELF-HOST THE VAULT</text>
  <text class="col-h" x="800" y="60">PENALISES</text>

  <text class="row-h" x="30" y="100">Arcade</text>
  <rect class="s-hi"  x="190" y="74" width="200" height="44" rx="5" />
  <text class="cell-i" x="290" y="101">challenges + executions</text>
  <rect class="s-mid" x="400" y="74" width="160" height="44" rx="5" />
  <text class="cell" x="480" y="101">bring your own client</text>
  <rect class="s-hi"  x="570" y="74" width="140" height="44" rx="5" />
  <text class="cell-i" x="640" y="101">yes, incl. air-gapped</text>
  <rect class="s-low" x="720" y="74" width="150" height="44" rx="5" />
  <text class="cell" x="795" y="101">user churn</text>

  <text class="row-h" x="30" y="172">Composio</text>
  <rect class="s-mid" x="190" y="146" width="200" height="44" rx="5" />
  <text class="cell" x="290" y="173">tool calls</text>
  <rect class="s-low" x="400" y="146" width="160" height="44" rx="5" />
  <text class="cell" x="480" y="173">platform-branded</text>
  <rect class="s-mid" x="570" y="146" width="140" height="44" rx="5" />
  <text class="cell" x="640" y="173">MIT SDK, partial</text>
  <rect class="s-low" x="720" y="146" width="150" height="44" rx="5" />
  <text class="cell" x="795" y="173">chatty loops</text>

  <text class="row-h" x="30" y="244">Pipedream</text>
  <rect class="s-mid" x="190" y="218" width="200" height="44" rx="5" />
  <text class="cell" x="290" y="239">execution credits</text>
  <text class="cell" x="290" y="254">+ per external user</text>
  <rect class="s-low" x="400" y="218" width="160" height="44" rx="5" />
  <text class="cell" x="480" y="245">platform-branded</text>
  <rect class="s-low" x="570" y="218" width="140" height="44" rx="5" />
  <text class="cell" x="640" y="245">managed only</text>
  <rect class="s-low" x="720" y="218" width="150" height="44" rx="5" />
  <text class="cell" x="795" y="239">long calls,</text>
  <text class="cell" x="795" y="254">wide user bases</text>

  <text class="row-h" x="30" y="316">Nango</text>
  <rect class="s-mid" x="190" y="290" width="200" height="44" rx="5" />
  <text class="cell" x="290" y="317">connections + requests</text>
  <rect class="s-hi"  x="400" y="290" width="160" height="44" rx="5" />
  <text class="cell-i" x="480" y="317">white-label default</text>
  <rect class="s-hi"  x="570" y="290" width="140" height="44" rx="5" />
  <text class="cell-i" x="640" y="317">yes, free edition</text>
  <rect class="s-low" x="720" y="290" width="150" height="44" rx="5" />
  <text class="cell" x="795" y="311">many lightly</text>
  <text class="cell" x="795" y="326">used accounts</text>

  <rect class="s-hi"  x="30" y="352" width="14" height="14" rx="3" />
  <text class="key" x="52" y="364">strongest on this axis</text>
  <rect class="s-mid" x="196" y="352" width="14" height="14" rx="3" />
  <text class="key" x="218" y="364">workable</text>
  <rect class="s-low" x="300" y="352" width="14" height="14" rx="3" />
  <text class="key" x="322" y="364">constraint to design around</text>

  <text class="foot" x="30" y="390">The last column is not a flaw list. It is which agent shape each meter makes expensive.</text>
</svg>
