<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="tct tcd">
  <title id="tct">Public task count per web-research benchmark</title>
  <desc id="tcd">A horizontal bar chart of publicly available items. BrowseComp has 1,266 questions, Gaia2 about 800 public validation scenarios, Mind2Web 2 has 130 tasks of which 10 are a public development set, and DeepResearch Bench has 100 tasks. Grading depth runs the opposite way: the two smallest sets grade dozens to hundreds of rubric nodes per task, while the largest grades one short string.</desc>
  <style>
    .tc-lead { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .tc-mid  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .tc-low  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .tc-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .tc-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .tc-num  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .tc-ax   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .tc-note { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .tc-grid { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 4; opacity: .3; }
  </style>

  <text class="tc-ttl" x="20" y="30">Public items per benchmark</text>

  <line class="tc-grid" x1="350" y1="56" x2="350" y2="312" />
  <line class="tc-grid" x1="500" y1="56" x2="500" y2="312" />
  <line class="tc-grid" x1="650" y1="56" x2="650" y2="312" />
  <line class="tc-grid" x1="800" y1="56" x2="800" y2="312" />

  <text class="tc-row" x="20" y="95">BrowseComp</text>
  <rect class="tc-lead" x="200" y="70" width="584" height="40" />
  <text class="tc-num" x="792" y="95">1,266</text>

  <text class="tc-row" x="20" y="160">Gaia2</text>
  <rect class="tc-mid" x="200" y="135" width="369" height="40" />
  <text class="tc-num" x="577" y="160">~800</text>

  <text class="tc-row" x="20" y="225">Mind2Web 2</text>
  <rect class="tc-low" x="200" y="200" width="60" height="40" />
  <text class="tc-num" x="268" y="225">130</text>

  <text class="tc-row" x="20" y="290">DeepResearch Bench</text>
  <rect class="tc-low" x="200" y="265" width="46" height="40" />
  <text class="tc-num" x="254" y="290">100</text>

  <text class="tc-ax" x="350" y="332" text-anchor="middle">325</text>
  <text class="tc-ax" x="500" y="332" text-anchor="middle">650</text>
  <text class="tc-ax" x="650" y="332" text-anchor="middle">975</text>
  <text class="tc-ax" x="800" y="332" text-anchor="middle">1,300</text>

  <text class="tc-note" x="20" y="372">Grading depth runs the other way: the two smallest sets score dozens to hundreds of rubric nodes per task.</text>
</svg>
