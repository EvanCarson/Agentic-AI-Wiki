<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="wgt wgd">
  <title id="wgt">What each web-research benchmark treats as the answer</title>
  <desc id="wgd">A four by three matrix. BrowseComp: the answer is a short string, graded by a semantic-equivalence checker, and a fabricated citation is invisible to it. Gaia2: the answer is a trajectory across seven capabilities, graded by a model judge plus exact match, and attribution is out of scope. Mind2Web 2: the answer is a claim plus its sources, graded by task-specific judge agents over tree-structured rubrics, and attribution is scored directly. DeepResearch Bench: the answer is a written report, graded by RACE for quality and FACT for citations, and attribution is a separate score. Legend: attribution scored, partly in scope, not visible.</desc>
  <style>
    .wg-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .wg-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .wg-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .wg-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .wg-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
    .wg-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .wg-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .wg-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .wg-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="wg-ttl" x="20" y="30">What counts as the answer</text>

  <text class="wg-col" x="330" y="66" text-anchor="middle">The graded object</text>
  <text class="wg-col" x="550" y="66" text-anchor="middle">Who grades it</text>
  <text class="wg-col" x="770" y="66" text-anchor="middle">Sees a fake citation?</text>

  <text class="wg-row" x="20" y="113">BrowseComp</text>
  <rect class="wg-weak" x="230" y="84" width="200" height="48" />
  <text class="wg-cell" x="330" y="113" text-anchor="middle">A short string</text>
  <rect class="wg-weak" x="450" y="84" width="200" height="48" />
  <text class="wg-cell" x="550" y="113" text-anchor="middle">Equivalence checker</text>
  <rect class="wg-weak" x="670" y="84" width="200" height="48" />
  <text class="wg-cell" x="770" y="113" text-anchor="middle">No</text>

  <text class="wg-row" x="20" y="175">Gaia2</text>
  <rect class="wg-mid" x="230" y="146" width="200" height="48" />
  <text class="wg-cell" x="330" y="175" text-anchor="middle">A trajectory</text>
  <rect class="wg-mid" x="450" y="146" width="200" height="48" />
  <text class="wg-cell" x="550" y="175" text-anchor="middle">Judge + exact match</text>
  <rect class="wg-weak" x="670" y="146" width="200" height="48" />
  <text class="wg-cell" x="770" y="175" text-anchor="middle">Out of scope</text>

  <text class="wg-row" x="20" y="237">Mind2Web 2</text>
  <rect class="wg-strong" x="230" y="208" width="200" height="48" />
  <text class="wg-inv" x="330" y="237" text-anchor="middle">A claim and its sources</text>
  <rect class="wg-strong" x="450" y="208" width="200" height="48" />
  <text class="wg-inv" x="550" y="237" text-anchor="middle">Rubric judge agents</text>
  <rect class="wg-strong" x="670" y="208" width="200" height="48" />
  <text class="wg-inv" x="770" y="237" text-anchor="middle">Yes, scored directly</text>

  <text class="wg-row" x="20" y="299">DeepResearch Bench</text>
  <rect class="wg-mid" x="230" y="270" width="200" height="48" />
  <text class="wg-cell" x="330" y="299" text-anchor="middle">A written report</text>
  <rect class="wg-mid" x="450" y="270" width="200" height="48" />
  <text class="wg-cell" x="550" y="299" text-anchor="middle">RACE and FACT</text>
  <rect class="wg-strong" x="670" y="270" width="200" height="48" />
  <text class="wg-inv" x="770" y="299" text-anchor="middle">Yes, a separate score</text>

  <rect class="wg-strong" x="20" y="352" width="18" height="14" />
  <text class="wg-leg" x="48" y="364">Attribution scored</text>
  <rect class="wg-mid" x="240" y="352" width="18" height="14" />
  <text class="wg-leg" x="268" y="364">Partly in scope</text>
  <rect class="wg-weak" x="450" y="352" width="18" height="14" />
  <text class="wg-leg" x="478" y="364">Not visible</text>
</svg>
