<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Four prompt-management tools against four operational properties</title>
  <desc id="d">A matrix with Langfuse, PromptLayer, Agenta and LaunchDarkly AI Configs as rows and four properties as columns: self-hostable core, where the prompt is at request time, the rollback mechanism, and what happens when the service is unreachable. Langfuse and Agenta have self-hostable cores, PromptLayer and LaunchDarkly do not; the first three fetch a version by label or commit while LaunchDarkly evaluates a streamed ruleset locally.</desc>
  <style>
    .cellW  { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cellM  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .cellS  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .colh   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .8; text-anchor: middle; }
    .rowh   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cv     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .cv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .lg     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="20" y="28">Where they actually differ</text>

  <text class="colh" x="281" y="62">self-hostable</text>
  <text class="colh" x="281" y="76">core</text>
  <text class="colh" x="455" y="62">prompt at</text>
  <text class="colh" x="455" y="76">request time</text>
  <text class="colh" x="629" y="62">rollback</text>
  <text class="colh" x="629" y="76">mechanism</text>
  <text class="colh" x="803" y="62">service</text>
  <text class="colh" x="803" y="76">unreachable</text>

  <text class="rowh" x="20" y="120">Langfuse</text>
  <rect class="cellS" x="196" y="92" width="170" height="46" />
  <text class="cv-inv" x="281" y="120">Yes, OSS core</text>
  <rect class="cellM" x="370" y="92" width="170" height="46" />
  <text class="cv" x="455" y="120">Fetched by label</text>
  <rect class="cellM" x="544" y="92" width="170" height="46" />
  <text class="cv" x="629" y="120">Move the label</text>
  <rect class="cellW" x="718" y="92" width="170" height="46" />
  <text class="cv" x="803" y="120">Your own constant</text>

  <text class="rowh" x="20" y="174">PromptLayer</text>
  <rect class="cellW" x="196" y="146" width="170" height="46" />
  <text class="cv" x="281" y="174">No, closed</text>
  <rect class="cellM" x="370" y="146" width="170" height="46" />
  <text class="cv" x="455" y="174">Fetched by label</text>
  <rect class="cellS" x="544" y="146" width="170" height="46" />
  <text class="cv-inv" x="629" y="174">Label + approvals</text>
  <rect class="cellW" x="718" y="146" width="170" height="46" />
  <text class="cv" x="803" y="174">Your own constant</text>

  <text class="rowh" x="20" y="228">Agenta</text>
  <rect class="cellS" x="196" y="200" width="170" height="46" />
  <text class="cv-inv" x="281" y="228">Yes, OSS core</text>
  <rect class="cellM" x="370" y="200" width="170" height="46" />
  <text class="cv" x="455" y="228">Fetched by env</text>
  <rect class="cellS" x="544" y="200" width="170" height="46" />
  <text class="cv-inv" x="629" y="228">Deployment history</text>
  <rect class="cellW" x="718" y="200" width="170" height="46" />
  <text class="cv" x="803" y="228">Your own constant</text>

  <text class="rowh" x="20" y="282">LaunchDarkly</text>
  <rect class="cellW" x="196" y="254" width="170" height="46" />
  <text class="cv" x="281" y="282">No, closed</text>
  <rect class="cellS" x="370" y="254" width="170" height="46" />
  <text class="cv-inv" x="455" y="282">Evaluated locally</text>
  <rect class="cellS" x="544" y="254" width="170" height="46" />
  <text class="cv-inv" x="629" y="282">Targeting change</text>
  <rect class="cellM" x="718" y="254" width="170" height="46" />
  <text class="cv" x="803" y="282">Last ruleset held</text>

  <rect class="cellS" x="196" y="314" width="18" height="14" />
  <text class="lg" x="222" y="326">Strong</text>
  <rect class="cellM" x="286" y="314" width="18" height="14" />
  <text class="lg" x="312" y="326">Workable</text>
  <rect class="cellW" x="390" y="314" width="18" height="14" />
  <text class="lg" x="416" y="326">You build it</text>

  <text class="note" x="20" y="358">Shading is an operational judgement, not a feature count: &#8220;strong&#8221; means the product does the work, &#8220;you build it&#8221; means your code does.</text>
  <text class="note" x="20" y="376">All four version prompts immutably and deploy by moving a pointer; the fourth column is the one nobody demos.</text>
  <text class="note" x="20" y="394">Tiers, licences and SDK behaviour move; verify against current documentation before a procurement decision.</text>
</svg>
