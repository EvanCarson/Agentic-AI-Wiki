<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three rollback paths for a bad prompt</title>
  <desc id="d">Three columns comparing how a bad prompt is withdrawn: moving a registry label, which reaches running instances after the client cache expires; changing a targeting rule, which reaches instances over the streamed connection; and redeploying code, which requires a build and release cycle.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .ln     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .ln-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
  </style>

  <text class="ttl" x="20" y="30">How fast you can take a bad prompt back</text>

  <rect class="adj" x="30" y="55" width="260" height="190" />
  <text class="hd" x="160" y="86">Move a label</text>
  <text class="ln" x="160" y="114">Registry points &#8216;production&#8217;</text>
  <text class="ln" x="160" y="132">at the previous immutable</text>
  <text class="ln" x="160" y="150">version</text>
  <text class="ln" x="160" y="186">Reaches instances after</text>
  <text class="vd" x="160" y="210">the client cache expires</text>

  <rect class="hero" x="320" y="55" width="260" height="190" />
  <text class="hd-inv" x="450" y="86">Change a rule</text>
  <text class="ln-inv" x="450" y="114">Targeting serves the</text>
  <text class="ln-inv" x="450" y="132">baseline variation to</text>
  <text class="ln-inv" x="450" y="150">everyone again</text>
  <text class="ln-inv" x="450" y="186">Reaches instances over</text>
  <text class="vd-inv" x="450" y="210">the open connection</text>

  <rect class="box" x="610" y="55" width="260" height="190" />
  <text class="hd" x="740" y="86">Redeploy code</text>
  <text class="ln" x="740" y="114">The prompt was a string</text>
  <text class="ln" x="740" y="132">in the repository, so the</text>
  <text class="ln" x="740" y="150">fix is a release</text>
  <text class="ln" x="740" y="186">Reaches instances on</text>
  <text class="vd" x="740" y="210">your normal deploy clock</text>

  <text class="ln" x="450" y="278">The third column is the one everyone is leaving, and the one with the clearest audit trail.</text>
</svg>
