<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Two places a managed prompt can be at request time</title>
  <desc id="d">Two architectures side by side. In the registry-fetch model the running process asks a prompt registry for the version carrying a label, caches it locally for a time-to-live, and serves a stale copy while revalidating, so a label change reaches the process roughly one TTL later. In the local-evaluation model a ruleset is streamed to the process and evaluated in memory on every request, so a targeting change propagates on the open connection and an unreachable service leaves the last ruleset in place.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .ln     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .ln-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .mn     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .8; }
    .sec    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="28">Same promise, two propagation paths</text>

  <text class="sec" x="30" y="62">Registry fetch</text>
  <rect class="adj" x="30" y="76" width="390" height="70" />
  <text class="hd" x="46" y="102">Prompt registry</text>
  <text class="ln" x="46" y="124">immutable versions; a label points to exactly one</text>
  <text class="mn" x="46" y="140">move label &#8216;production&#8217; = deploy</text>

  <path class="arrow" d="M 225 146 L 225 180" />
  <text class="ln" x="238" y="170">fetch by label</text>

  <rect class="box" x="30" y="184" width="390" height="86" />
  <text class="hd" x="46" y="210">SDK client cache</text>
  <text class="ln" x="46" y="232">default TTL 60s; stale copy served immediately</text>
  <text class="ln" x="46" y="250">while a background refresh runs</text>
  <text class="mn" x="46" y="266">ttl = 0 disables caching</text>

  <path class="arrow" d="M 225 270 L 225 304" />

  <rect class="hero" x="30" y="308" width="390" height="70" />
  <text class="hd-inv" x="46" y="334">Running process</text>
  <text class="ln-inv" x="46" y="356">a label change lands ~one TTL later, per instance</text>
  <text class="ln-inv" x="46" y="372">registry unreachable: your own code is the fallback</text>

  <text class="sec" x="480" y="62">Local evaluation</text>
  <rect class="adj" x="480" y="76" width="390" height="70" />
  <text class="hd" x="496" y="102">Config service</text>
  <text class="ln" x="496" y="124">variations plus targeting rules; rollback is a rule</text>
  <text class="mn" x="496" y="140">change targeting = deploy</text>

  <path class="arrow" d="M 675 146 L 675 180" />
  <text class="ln" x="688" y="170">stream the ruleset</text>

  <rect class="box" x="480" y="184" width="390" height="86" />
  <text class="hd" x="496" y="210">In-process store</text>
  <text class="ln" x="496" y="232">whole ruleset held in memory; evaluated per</text>
  <text class="ln" x="496" y="250">request against the caller&#8217;s context</text>
  <text class="mn" x="496" y="266">no per-request network hop</text>

  <path class="arrow" d="M 675 270 L 675 304" />

  <rect class="hero" x="480" y="308" width="390" height="70" />
  <text class="hd-inv" x="496" y="334">Running process</text>
  <text class="ln-inv" x="496" y="356">a rule change lands on the open connection</text>
  <text class="ln-inv" x="496" y="372">service unreachable: last ruleset stays in force</text>

  <text class="note" x="20" y="424">Both call the operation &#8220;deploy without a release&#8221;. Only the left-hand path makes your rollback time a function of a cache setting,</text>
  <text class="note" x="20" y="442">and only the right-hand path requires the whole decision to be expressible as rules the SDK can evaluate offline.</text>
  <text class="note" x="20" y="470">SDK modes vary by language and by product tier; confirm whether yours streams, polls, or proxies before you quote a propagation time.</text>
</svg>
