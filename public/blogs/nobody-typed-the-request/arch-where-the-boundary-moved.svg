<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="bt bd">
  <title id="bt">Where the boundary sits in a proactive agent</title>
  <desc id="bd">Three kinds of input reach a proactive coding agent: an allowed person addressing it directly, a rule the team wrote, and ordinary comments or bot messages. All three arrive at a host-enforced policy and mandate layer, which is the only place authority is decided; the third kind supplies context but no authority. Below it, an executor session with its own directory runs commands as the operator's own user account without approval, so the execution layer is a set of defaults rather than a boundary.</desc>
  <style>
    .bw-box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .bw-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .bw-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .bw-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .bw-lab  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .bw-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .bw-sub  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .7; }
    .bw-subi { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .9; }
    .bw-note { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
    .bw-arr  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#bwarr); }
    .bw-dash { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#bwarr); }
  </style>
  <defs>
    <marker id="bwarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="bw-ttl" x="20" y="32">Three ways work can start, one place authority is decided</text>

  <rect class="bw-adj" x="20"  y="56" width="260" height="68" />
  <text class="bw-lab" x="150" y="86"  text-anchor="middle">Allowed person, addressed</text>
  <text class="bw-sub" x="150" y="106" text-anchor="middle">explicit — works in every mode</text>
  <rect class="bw-adj" x="320" y="56" width="260" height="68" />
  <text class="bw-lab" x="450" y="86"  text-anchor="middle">A rule the team wrote</text>
  <text class="bw-sub" x="450" y="106" text-anchor="middle">inferred — needs an assessment</text>
  <rect class="bw-box" x="620" y="56" width="260" height="68" />
  <text class="bw-lab" x="750" y="86"  text-anchor="middle">Comment, bot, quoted text</text>
  <text class="bw-sub" x="750" y="106" text-anchor="middle">not admitted</text>

  <path class="bw-arr"  d="M 150 128 L 150 182" />
  <path class="bw-arr"  d="M 450 128 L 450 182" />
  <path class="bw-dash" d="M 750 128 L 750 182" />
  <text class="bw-note" x="735" y="160" text-anchor="end">context, never authority</text>

  <rect class="bw-hero" x="60"  y="188" width="780" height="82" />
  <text class="bw-inv"  x="450" y="220" text-anchor="middle">Host-enforced policy and mandate</text>
  <text class="bw-subi" x="450" y="246" text-anchor="middle">revalidated before a ticket resumes; accept mode defaults to observe</text>

  <path class="bw-arr" d="M 450 274 L 450 320" />

  <rect class="bw-box" x="250" y="326" width="400" height="68" />
  <text class="bw-lab" x="450" y="356" text-anchor="middle">Executor session, its own directory</text>
  <text class="bw-sub" x="450" y="376" text-anchor="middle">commands run as the operator, approval skipped</text>

  <text class="bw-note" x="20" y="434">The execution layer claims nothing: its own design document calls the wrappers and directories</text>
  <text class="bw-note" x="20" y="454">defaults, not a security boundary. Which leaves one box above carrying every control that is a control.</text>
</svg>
