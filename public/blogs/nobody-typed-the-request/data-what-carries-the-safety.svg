<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="st sd">
  <title id="st">Which layer of a proactive agent actually carries the safety</title>
  <desc id="sd">A four by four matrix. The trigger allowlist is host-enforced, is claimed as a boundary, is restrictive by default and survives a hostile comment. Observe mode is host-enforced, is partly a boundary, is the shipped default and survives a hostile comment. The worker session is only partly host-enforced, is explicitly not claimed as a boundary, has no restrictive default and does not survive a hostile comment on its own. Branch protection is enforced by the forge rather than the agent, is a real boundary, depends on configuration and survives a hostile comment.</desc>
  <style>
    .sm-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .sm-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .sm-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .sm-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .sm-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .sm-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .sm-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .sm-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sm-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="sm-ttl" x="20" y="34">Which layer carries the safety</text>

  <text class="sm-col" x="295" y="76" text-anchor="middle">Host enforces</text>
  <text class="sm-col" x="465" y="76" text-anchor="middle">Called a boundary</text>
  <text class="sm-col" x="635" y="76" text-anchor="middle">Safe by default</text>
  <text class="sm-col" x="805" y="76" text-anchor="middle">Survives a comment</text>

  <text class="sm-row" x="20" y="118">Trigger allowlist</text>
  <rect class="sm-strong" x="215" y="92" width="160" height="40" />
  <text class="sm-inv"  x="295" y="117" text-anchor="middle">Yes</text>
  <rect class="sm-strong" x="385" y="92" width="160" height="40" />
  <text class="sm-inv"  x="465" y="117" text-anchor="middle">Yes</text>
  <rect class="sm-strong" x="555" y="92" width="160" height="40" />
  <text class="sm-inv"  x="635" y="117" text-anchor="middle">Deny unless listed</text>
  <rect class="sm-strong" x="725" y="92" width="160" height="40" />
  <text class="sm-inv"  x="805" y="117" text-anchor="middle">Yes</text>

  <text class="sm-row" x="20" y="178">Observe mode</text>
  <rect class="sm-strong" x="215" y="152" width="160" height="40" />
  <text class="sm-inv"  x="295" y="177" text-anchor="middle">Yes</text>
  <rect class="sm-mid"    x="385" y="152" width="160" height="40" />
  <text class="sm-cell" x="465" y="177" text-anchor="middle">Partly</text>
  <rect class="sm-strong" x="555" y="152" width="160" height="40" />
  <text class="sm-inv"  x="635" y="177" text-anchor="middle">Shipped default</text>
  <rect class="sm-strong" x="725" y="152" width="160" height="40" />
  <text class="sm-inv"  x="805" y="177" text-anchor="middle">Yes</text>

  <text class="sm-row" x="20" y="238">Worker session</text>
  <rect class="sm-mid"    x="215" y="212" width="160" height="40" />
  <text class="sm-cell" x="295" y="237" text-anchor="middle">Partly</text>
  <rect class="sm-weak"   x="385" y="212" width="160" height="40" />
  <text class="sm-cell" x="465" y="237" text-anchor="middle">Explicitly not</text>
  <rect class="sm-weak"   x="555" y="212" width="160" height="40" />
  <text class="sm-cell" x="635" y="237" text-anchor="middle">No</text>
  <rect class="sm-weak"   x="725" y="212" width="160" height="40" />
  <text class="sm-cell" x="805" y="237" text-anchor="middle">Not alone</text>

  <text class="sm-row" x="20" y="298">Branch protection</text>
  <rect class="sm-weak"   x="215" y="272" width="160" height="40" />
  <text class="sm-cell" x="295" y="297" text-anchor="middle">The forge does</text>
  <rect class="sm-strong" x="385" y="272" width="160" height="40" />
  <text class="sm-inv"  x="465" y="297" text-anchor="middle">Yes</text>
  <rect class="sm-mid"    x="555" y="272" width="160" height="40" />
  <text class="sm-cell" x="635" y="297" text-anchor="middle">If configured</text>
  <rect class="sm-strong" x="725" y="272" width="160" height="40" />
  <text class="sm-inv"  x="805" y="297" text-anchor="middle">Yes</text>

  <rect class="sm-strong" x="20"  y="344" width="18" height="14" />
  <text class="sm-leg" x="48"  y="356">Carries weight</text>
  <rect class="sm-mid"    x="230" y="344" width="18" height="14" />
  <text class="sm-leg" x="258" y="356">Partly</text>
  <rect class="sm-weak"   x="400" y="344" width="18" height="14" />
  <text class="sm-leg" x="428" y="356">Carries none</text>
</svg>
