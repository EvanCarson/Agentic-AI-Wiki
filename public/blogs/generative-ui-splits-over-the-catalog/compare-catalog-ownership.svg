<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">A2UI and MCP Apps compared on authorship, enumerability and ownership</title>
  <desc id="d">A two-column comparison across three properties. Under A2UI the agent authors the interface at run time, a reviewer can enumerate the component vocabulary but not the compositions, and the defect belongs to whoever shipped the components. Under MCP Apps a developer authors the interface ahead of time, a reviewer can enumerate every template, and the defect belongs to the server author while arriving through your product.</desc>
  <style>
    .col-head  { font-family: var(--font-display); font-size: 16px; font-weight: 600; text-anchor: middle; }
    .head-lead { fill: var(--accent, #d4421e); }
    .head-mute { fill: currentColor; }
    .row-head  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; opacity: .6; text-anchor: end; }
    .cell      { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .cell-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-soft { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-hero { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-mute { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="col-head head-lead" x="450" y="32">A2UI</text>
  <text class="col-head head-mute" x="750" y="32">MCP Apps</text>

  <text class="row-head" x="286" y="80">Who authors the screen</text>
  <rect class="card-hero" x="300" y="52" width="290" height="42" rx="6" />
  <text class="cell-inv" x="445" y="78">The agent, at run time</text>
  <rect class="card-soft" x="610" y="52" width="240" height="42" rx="6" />
  <text class="cell" x="730" y="78">A developer, ahead of time</text>

  <text class="row-head" x="286" y="148">What you can enumerate</text>
  <rect class="card-hero" x="300" y="120" width="290" height="42" rx="6" />
  <text class="cell-inv" x="445" y="146">The vocabulary, not the sentences</text>
  <rect class="card-soft" x="610" y="120" width="240" height="42" rx="6" />
  <text class="cell" x="730" y="146">Every template, by version</text>

  <text class="row-head" x="286" y="216">Whose defect it is</text>
  <rect class="card-mute" x="300" y="188" width="290" height="42" rx="6" />
  <text class="cell" x="445" y="214">Yours — you shipped the components</text>
  <rect class="card-mute" x="610" y="188" width="240" height="42" rx="6" />
  <text class="cell" x="730" y="214">Theirs, with your name on it</text>

  <text class="cell" x="450" y="272">One outsources the composition and keeps the interface. The other outsources the interface and keeps the boundary.</text>
</svg>
