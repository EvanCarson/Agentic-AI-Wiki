<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Four agent output surfaces and where each moves the review</title>
  <desc id="d">Four rows ordered by how much authorship the agent holds. Plain text or Markdown is authored by the model and reviewed only as prose. A2UI has the agent compose components you own, moving the review into your design system. An MCP Apps template is authored by a server developer, moving the review out to the server boundary and the sandbox. Raw HTML from the model is authored by nobody accountable and has no review point at all.</desc>
  <style>
    .card    { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .card-a  { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .card-h  { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .col-h   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; opacity: .6; }
    .name    { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .name-i  { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--paper, #fff); }
    .cell    { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; fill: var(--ink, #1a1a1a); }
    .cell-i  { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; fill: var(--paper, #fff); }
    .sub     { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink, #1a1a1a); opacity: .65; }
    .sub-i   { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper, #fff); opacity: .85; }
    .axis    { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: currentColor; opacity: .55; }
    .rail    { fill: none; stroke: currentColor; stroke-width: 1.25; opacity: .45; marker-end: url(#arr2); }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="col-h" x="46" y="34">SURFACE</text>
  <text class="col-h" x="316" y="34">WHO AUTHORS IT</text>
  <text class="col-h" x="596" y="34">WHERE THE REVIEW HAPPENS</text>

  <path class="rail" d="M 18 48 L 18 452" />
  <text class="axis" x="13" y="250" transform="rotate(-90 13 250)" style="text-anchor:middle">agent authorship increases</text>

  <rect class="card" x="34" y="48" width="250" height="86" rx="8" />
  <text class="name" x="52" y="82">Text / Markdown</text>
  <text class="sub" x="52" y="104">the production default</text>
  <rect class="card" x="300" y="48" width="270" height="86" rx="8" />
  <text class="cell" x="318" y="82">The model, one string at a time</text>
  <text class="sub" x="318" y="104">no structure to get wrong</text>
  <rect class="card" x="586" y="48" width="280" height="86" rx="8" />
  <text class="cell" x="604" y="82">Nowhere — and nothing to review</text>
  <text class="sub" x="604" y="104">the user retypes the structured answer</text>

  <rect class="card-a" x="34" y="150" width="250" height="86" rx="8" />
  <text class="name" x="52" y="184">A2UI component list</text>
  <text class="sub" x="52" y="206">JSON, your widgets</text>
  <rect class="card-a" x="300" y="150" width="270" height="86" rx="8" />
  <text class="cell" x="318" y="184">The agent, composing your catalog</text>
  <text class="sub" x="318" y="206">vocabulary fixed, sentences are not</text>
  <rect class="card-h" x="586" y="150" width="280" height="86" rx="8" />
  <text class="cell-i" x="604" y="184">Inside your design system</text>
  <text class="sub-i" x="604" y="206">every component becomes a public API</text>

  <rect class="card-a" x="34" y="252" width="250" height="86" rx="8" />
  <text class="name" x="52" y="286">MCP Apps template</text>
  <text class="sub" x="52" y="308">HTML in a sandbox</text>
  <rect class="card-a" x="300" y="252" width="270" height="86" rx="8" />
  <text class="cell" x="318" y="286">A developer you did not hire</text>
  <text class="sub" x="318" y="308">versioned on their release schedule</text>
  <rect class="card-h" x="586" y="252" width="280" height="86" rx="8" />
  <text class="cell-i" x="604" y="286">At the server boundary</text>
  <text class="sub-i" x="604" y="308">pin it, diff it, sandbox it</text>

  <rect class="card" x="34" y="354" width="250" height="86" rx="8" />
  <text class="name" x="52" y="388">Raw model HTML</text>
  <text class="sub" x="52" y="410">the tempting shortcut</text>
  <rect class="card" x="300" y="354" width="270" height="86" rx="8" />
  <text class="cell" x="318" y="388">Nobody accountable</text>
  <text class="sub" x="318" y="410">unbounded output, no catalog</text>
  <rect class="card" x="586" y="354" width="280" height="86" rx="8" />
  <text class="cell" x="604" y="388">No review point exists</text>
  <text class="sub" x="604" y="410">why both standards were written</text>

  <text class="axis" x="34" y="472">Standards do not delete the review step. They choose which team owns it.</text>
</svg>
