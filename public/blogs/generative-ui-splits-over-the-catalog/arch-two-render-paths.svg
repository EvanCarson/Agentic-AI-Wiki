<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Two paths from a tool result to pixels</title>
  <desc id="d">The A2UI path: the agent emits a flat JSON list of components, the client maps each abstract component type onto a widget from its own trusted catalog, and the client renders. The MCP Apps path: the server pre-declares an HTML bundle as a ui:// resource, the tool result names it, and the host renders it inside a sandboxed iframe that calls back over JSON-RPC on postMessage.</desc>
  <style>
    .box     { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero    { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj     { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .lane    { fill: none; stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; stroke-dasharray: 4 4; }
    .lane-t  { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; }
    .label   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-i { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper, #fff); text-anchor: middle; }
    .sub     { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink, #1a1a1a); opacity: .65; text-anchor: middle; }
    .sub-i   { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper, #fff); opacity: .85; text-anchor: middle; }
    .mono    { font-family: var(--font-mono); font-size: 11.5px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .arrow   { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="box" x="30" y="215" width="130" height="60" rx="8" />
  <text class="label" x="95" y="240">Tool result</text>
  <text class="sub" x="95" y="258">the same data</text>

  <path class="arrow" d="M 162 232 L 205 150" />
  <path class="arrow" d="M 162 258 L 205 340" />

  <rect class="lane" x="210" y="40" width="660" height="180" rx="10" />
  <text class="lane-t" x="228" y="66">A2UI</text>

  <rect class="adj" x="228" y="86" width="180" height="66" rx="8" />
  <text class="label" x="318" y="112">Agent composes</text>
  <text class="sub" x="318" y="130">flat JSON component list</text>

  <path class="arrow" d="M 410 119 L 452 119" />

  <rect class="hero" x="456" y="86" width="180" height="66" rx="8" />
  <text class="label-i" x="546" y="112">Your widget catalog</text>
  <text class="sub-i" x="546" y="130">Card · Button · TextField</text>

  <path class="arrow" d="M 638 119 L 680 119" />

  <rect class="box" x="684" y="86" width="164" height="66" rx="8" />
  <text class="label" x="766" y="112">Native render</text>
  <text class="sub" x="766" y="130">React · Flutter · SwiftUI</text>

  <text class="mono" x="546" y="188">review happens inside your design system</text>

  <rect class="lane" x="210" y="256" width="660" height="196" rx="10" />
  <text class="lane-t" x="228" y="282">MCP Apps</text>

  <rect class="box" x="228" y="302" width="180" height="66" rx="8" />
  <text class="label" x="318" y="328">Server bundle</text>
  <text class="sub" x="318" y="346">HTML declared ahead of time</text>

  <path class="arrow" d="M 410 335 L 452 335" />

  <rect class="adj" x="456" y="302" width="180" height="66" rx="8" />
  <text class="label" x="546" y="328">ui:// resource</text>
  <text class="sub" x="546" y="346">named by the tool</text>

  <path class="arrow" d="M 638 335 L 680 335" />

  <rect class="hero" x="684" y="302" width="164" height="66" rx="8" />
  <text class="label-i" x="766" y="328">Sandboxed iframe</text>
  <text class="sub-i" x="766" y="346">host-rendered</text>

  <path class="arrow" d="M 684 380 L 546 380" />
  <text class="mono" x="546" y="400">JSON-RPC over postMessage, auditable</text>
  <text class="mono" x="546" y="428">review happens at the server boundary</text>
</svg>
