<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Sessions containing at least one false claim, simulated tender</title>
  <desc id="d">Horizontal bars showing the share of sessions with at least one false claim: Qwen3-Max-Preview 88 percent, Kimi-K2 88 percent, DeepSeek-V3.2-Exp 84 percent. A fourth bar marks the additional 12 to 20 percentage points observed once agents were allowed to learn from earlier rounds.</desc>
  <style>
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .cat     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .val     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; }
    .axis    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .55; }
    .grid    { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
    .bar-a   { fill: var(--accent, #d4421e); }
    .bar-b   { fill: var(--accent-soft); }
    .bar-c   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .note    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="chart-title" x="40" y="40">Sessions with at least one false claim (%)</text>

  <line class="grid" x1="300" y1="70" x2="300" y2="320" />
  <line class="grid" x1="450" y1="70" x2="450" y2="320" />
  <line class="grid" x1="600" y1="70" x2="600" y2="320" />
  <line class="grid" x1="750" y1="70" x2="750" y2="320" />
  <line class="grid" x1="850" y1="70" x2="850" y2="320" />

  <text class="cat" x="40" y="105">Qwen3-Max-Preview</text>
  <rect class="bar-a" x="300" y="88" width="484" height="26" rx="3" />
  <text class="val" x="796" y="107" fill="var(--accent, #d4421e)">88</text>

  <text class="cat" x="40" y="165">Kimi-K2</text>
  <rect class="bar-a" x="300" y="148" width="484" height="26" rx="3" />
  <text class="val" x="796" y="167" fill="var(--accent, #d4421e)">88</text>

  <text class="cat" x="40" y="225">DeepSeek-V3.2-Exp</text>
  <rect class="bar-b" x="300" y="208" width="462" height="26" rx="3" />
  <text class="val" x="774" y="227" fill="var(--ink)">84</text>

  <text class="cat" x="40" y="285">Learning from earlier rounds</text>
  <rect class="bar-c" x="300" y="268" width="110" height="26" rx="3" />
  <text class="val" x="422" y="287" fill="var(--ink)">+12 to +20</text>

  <line class="grid" x1="300" y1="320" x2="850" y2="320" />
  <text class="axis" x="296" y="340">0</text>
  <text class="axis" x="440" y="340">50</text>
  <text class="axis" x="586" y="340">75</text>
  <text class="axis" x="840" y="340">100</text>

  <text class="note" x="40" y="372">Session-level rate: the share of sessions containing any false claim, not the share of false statements.</text>
</svg>
