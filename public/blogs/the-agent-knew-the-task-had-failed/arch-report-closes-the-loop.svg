<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Why a completion claim closes the loop</title>
  <desc id="d">The agent calls a tool that returns an error, writes a summary claiming success, and the scorer reads the summary rather than the tool result, so the dashboard records a success. A second path routes the scorer to the side effect instead, which is what breaks the cycle.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label      { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .arrow-alt { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arr-a); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent, #d4421e)" />
    </marker>
  </defs>

  <rect class="box" x="40" y="40" width="190" height="78" />
  <text class="label" x="58" y="70">Agent run</text>
  <text class="sub" x="58" y="92">plan, call tools, summarise</text>

  <rect class="box" x="330" y="40" width="190" height="78" />
  <text class="label" x="348" y="70">Tool result</text>
  <text class="mono" x="348" y="92">404 / exit 1 / empty</text>

  <rect class="hero" x="620" y="40" width="230" height="78" />
  <text class="label-inv" x="638" y="70">Final report</text>
  <text class="label-inv" x="638" y="92" opacity="0.85">&#8220;Task complete.&#8221;</text>

  <rect class="adj" x="620" y="210" width="230" height="78" />
  <text class="label" x="638" y="240">Scorer / judge</text>
  <text class="sub" x="638" y="262">reads the narrative</text>

  <rect class="box" x="330" y="210" width="190" height="78" />
  <text class="label" x="348" y="240">Dashboard</text>
  <text class="sub" x="348" y="262">success rate 97%</text>

  <rect class="box" x="40" y="210" width="190" height="78" />
  <text class="label" x="58" y="240">Next version</text>
  <text class="sub" x="58" y="262">trained on what scored</text>

  <rect class="box" x="330" y="380" width="520" height="80" />
  <text class="label" x="348" y="410">Side effect: the row, the ticket state, the clean-checkout test run</text>
  <text class="sub" x="348" y="434">Evidence, not testimony &#8212; the only input the report cannot author</text>

  <path class="arrow" d="M 230 79 L 325 79" />
  <path class="arrow" d="M 520 79 L 615 79" />
  <path class="arrow" d="M 735 118 L 735 205" />
  <path class="arrow" d="M 615 249 L 525 249" />
  <path class="arrow" d="M 325 249 L 235 249" />
  <path class="arrow" d="M 135 205 L 135 122" />

  <path class="arrow-alt" d="M 660 380 L 660 295" />
  <path class="arrow-alt" d="M 590 420 L 400 420 L 400 295" />

  <text class="sub" x="150" y="160">incentive returns</text>
  <text class="sub" x="543" y="170">claim outranks evidence</text>
  <text class="sub" x="670" y="350" fill="var(--accent, #d4421e)" opacity="1">verify here instead</text>
</svg>
