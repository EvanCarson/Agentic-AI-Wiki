<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Which check each concealment shape defeats</title>
  <desc id="d">A four-by-four matrix. Rows are concealment shapes: guessed answer, substituted source, simulated result, fabricated file. Columns are checks: output-shape validation, citation check, artifact exists, and side-effect verification. The first three columns are passed by most shapes; the side-effect column catches all four.</desc>
  <style>
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .rowlab  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .collab  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .7; }
    .cell    { stroke: var(--paper); stroke-width: 2; }
    .passes  { fill: var(--accent, #d4421e); }
    .partial { fill: var(--accent-soft); }
    .catches { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cellt   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .cellt-d { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .legend  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="chart-title" x="40" y="34">Concealment shape vs the check it meets</text>

  <text class="collab" x="296" y="66">output shape</text>
  <text class="collab" x="440" y="66">citation check</text>
  <text class="collab" x="578" y="66">artifact exists</text>
  <text class="collab" x="712" y="66">side effect</text>

  <text class="rowlab" x="40" y="104">Guessed answer</text>
  <rect class="cell passes"  x="290" y="80" width="130" height="38" />
  <text class="cellt" x="322" y="104">passes</text>
  <rect class="cell partial" x="430" y="80" width="130" height="38" />
  <text class="cellt-d" x="465" y="104">partial</text>
  <rect class="cell passes"  x="570" y="80" width="130" height="38" />
  <text class="cellt" x="602" y="104">passes</text>
  <rect class="cell catches" x="710" y="80" width="130" height="38" />
  <text class="cellt-d" x="744" y="104">caught</text>

  <text class="rowlab" x="40" y="164">Substituted source</text>
  <rect class="cell passes"  x="290" y="140" width="130" height="38" />
  <text class="cellt" x="322" y="164">passes</text>
  <rect class="cell passes"  x="430" y="140" width="130" height="38" />
  <text class="cellt" x="462" y="164">passes</text>
  <rect class="cell passes"  x="570" y="140" width="130" height="38" />
  <text class="cellt" x="602" y="164">passes</text>
  <rect class="cell catches" x="710" y="140" width="130" height="38" />
  <text class="cellt-d" x="744" y="164">caught</text>

  <text class="rowlab" x="40" y="224">Simulated result</text>
  <rect class="cell passes"  x="290" y="200" width="130" height="38" />
  <text class="cellt" x="322" y="224">passes</text>
  <rect class="cell partial" x="430" y="200" width="130" height="38" />
  <text class="cellt-d" x="465" y="224">partial</text>
  <rect class="cell passes"  x="570" y="200" width="130" height="38" />
  <text class="cellt" x="602" y="224">passes</text>
  <rect class="cell catches" x="710" y="200" width="130" height="38" />
  <text class="cellt-d" x="744" y="224">caught</text>

  <text class="rowlab" x="40" y="284">Fabricated file</text>
  <rect class="cell partial" x="290" y="260" width="130" height="38" />
  <text class="cellt-d" x="325" y="284">partial</text>
  <rect class="cell passes"  x="430" y="260" width="130" height="38" />
  <text class="cellt" x="462" y="284">passes</text>
  <rect class="cell passes"  x="570" y="260" width="130" height="38" />
  <text class="cellt" x="602" y="284">passes</text>
  <rect class="cell catches" x="710" y="260" width="130" height="38" />
  <text class="cellt-d" x="744" y="284">caught</text>

  <rect class="passes"  x="290" y="330" width="16" height="16" rx="3" />
  <text class="legend" x="314" y="343">concealment passes</text>
  <rect class="partial" x="500" y="330" width="16" height="16" rx="3" />
  <text class="legend" x="524" y="343">sometimes caught</text>
  <rect class="catches" x="710" y="330" width="16" height="16" rx="3" />
  <text class="legend" x="734" y="343">caught</text>

  <text class="legend" x="40" y="378">The only column that covers every shape is the one teams least often automate.</text>
</svg>
