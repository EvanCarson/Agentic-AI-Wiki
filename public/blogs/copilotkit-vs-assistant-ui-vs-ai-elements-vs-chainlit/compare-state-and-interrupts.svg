<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="siT siD">
  <title id="siT">Where run state lives, and what an interrupt costs</title>
  <desc id="siD">Four columns. CopilotKit keeps state shared between the agent and the application, with human-in-the-loop interrupts as a protocol feature. assistant-ui keeps thread state in React and leaves interrupts to whatever your transport implements. AI Elements keeps state in the AI SDK stream, modelling an interrupt as a tool call awaiting input, which survives a reload only if the server can resume the stream. Chainlit keeps state in the Python session, with a built-in ask-user step that disappears when the session ends.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">"The user reloads mid-approval" — four answers</text>

  <rect class="hero" x="10" y="44" width="205" height="176" />
  <text class="hd-inv" x="112" y="74" text-anchor="middle">CopilotKit</text>
  <text class="cell-inv" x="112" y="106" text-anchor="middle">State shared between</text>
  <text class="cell-inv" x="112" y="124" text-anchor="middle">agent and application</text>
  <text class="cell-inv" x="112" y="156" text-anchor="middle">Interrupt is a</text>
  <text class="cell-inv" x="112" y="174" text-anchor="middle">protocol feature</text>
  <text class="cell-inv" x="112" y="202" text-anchor="middle">Cost: a runtime to run</text>

  <rect class="box" x="235" y="44" width="205" height="176" />
  <text class="hd" x="337" y="74" text-anchor="middle">assistant-ui</text>
  <text class="cell" x="337" y="106" text-anchor="middle">Thread state lives</text>
  <text class="cell" x="337" y="124" text-anchor="middle">in the React tree</text>
  <text class="cell" x="337" y="156" text-anchor="middle">Interrupt is whatever</text>
  <text class="cell" x="337" y="174" text-anchor="middle">your transport does</text>
  <text class="cell" x="337" y="202" text-anchor="middle">Cost: you design it</text>

  <rect class="adj" x="460" y="44" width="205" height="176" />
  <text class="hd" x="562" y="74" text-anchor="middle">AI Elements</text>
  <text class="cell" x="562" y="106" text-anchor="middle">State rides the</text>
  <text class="cell" x="562" y="124" text-anchor="middle">AI SDK stream</text>
  <text class="cell" x="562" y="156" text-anchor="middle">Interrupt is a tool call</text>
  <text class="cell" x="562" y="174" text-anchor="middle">awaiting input</text>
  <text class="cell" x="562" y="202" text-anchor="middle">Cost: resumable streams</text>

  <rect class="box" x="685" y="44" width="205" height="176" />
  <text class="hd" x="787" y="74" text-anchor="middle">Chainlit</text>
  <text class="cell" x="787" y="106" text-anchor="middle">State lives in the</text>
  <text class="cell" x="787" y="124" text-anchor="middle">Python session</text>
  <text class="cell" x="787" y="156" text-anchor="middle">Interrupt is a built-in</text>
  <text class="cell" x="787" y="174" text-anchor="middle">ask-user step</text>
  <text class="cell" x="787" y="202" text-anchor="middle">Cost: it ends with the session</text>

  <text class="sub" x="0" y="252">Only one of the four answers the durability question for you; the other three inherit whatever your backend already does.</text>
  <text class="sub" x="0" y="272">Which is the right order anyway: decide the resumable-run design first, then let the UI layer follow it.</text>
</svg>
