<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="omT omD">
  <title id="omT">What you own, per project</title>
  <desc id="omD">A matrix with four projects as rows and four columns: a wire you could re-implement, UI source living in your repository, your design system winning over the library's, and how salvageable the work is if the project goes unmaintained. CopilotKit is strong on the wire, partial on UI source, partial on the design system and partial on salvage. assistant-ui is partial on the wire, partial on UI source, strong on the design system and strong on salvage. AI Elements is partial on the wire, strong on UI source, strong on the design system and strong on salvage. Chainlit is weak on the wire, weak on UI source, weak on the design system and partial on salvage.</desc>
  <style>
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .row   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .cell  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cellv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .yes   { fill: var(--accent, #d4421e); stroke: none; }
    .part  { fill: var(--accent-soft); stroke: var(--border-soft); stroke-width: 1; }
    .no    { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; }
  </style>

  <text class="ttl" x="0" y="20">What is still yours afterwards</text>

  <text class="hd" x="325" y="56" text-anchor="middle">Wire you could</text>
  <text class="hd" x="325" y="70" text-anchor="middle">re-implement</text>
  <text class="hd" x="490" y="56" text-anchor="middle">UI source in</text>
  <text class="hd" x="490" y="70" text-anchor="middle">your repo</text>
  <text class="hd" x="655" y="56" text-anchor="middle">Your design</text>
  <text class="hd" x="655" y="70" text-anchor="middle">system wins</text>
  <text class="hd" x="820" y="56" text-anchor="middle">Salvageable if</text>
  <text class="hd" x="820" y="70" text-anchor="middle">unmaintained</text>

  <text class="row" x="0" y="118">CopilotKit</text>
  <rect class="yes"  x="250" y="92" width="150" height="42" rx="6" />
  <text class="cellv" x="325" y="118" text-anchor="middle">Strong</text>
  <rect class="part" x="415" y="92" width="150" height="42" rx="6" />
  <text class="cell" x="490" y="118" text-anchor="middle">Partial</text>
  <rect class="part" x="580" y="92" width="150" height="42" rx="6" />
  <text class="cell" x="655" y="118" text-anchor="middle">Partial</text>
  <rect class="part" x="745" y="92" width="150" height="42" rx="6" />
  <text class="cell" x="820" y="118" text-anchor="middle">Partial</text>

  <text class="row" x="0" y="180">assistant-ui</text>
  <rect class="part" x="250" y="154" width="150" height="42" rx="6" />
  <text class="cell" x="325" y="180" text-anchor="middle">Partial</text>
  <rect class="part" x="415" y="154" width="150" height="42" rx="6" />
  <text class="cell" x="490" y="180" text-anchor="middle">Partial</text>
  <rect class="yes"  x="580" y="154" width="150" height="42" rx="6" />
  <text class="cellv" x="655" y="180" text-anchor="middle">Strong</text>
  <rect class="yes"  x="745" y="154" width="150" height="42" rx="6" />
  <text class="cellv" x="820" y="180" text-anchor="middle">Strong</text>

  <text class="row" x="0" y="242">AI Elements</text>
  <rect class="part" x="250" y="216" width="150" height="42" rx="6" />
  <text class="cell" x="325" y="242" text-anchor="middle">Partial</text>
  <rect class="yes"  x="415" y="216" width="150" height="42" rx="6" />
  <text class="cellv" x="490" y="242" text-anchor="middle">Strong</text>
  <rect class="yes"  x="580" y="216" width="150" height="42" rx="6" />
  <text class="cellv" x="655" y="242" text-anchor="middle">Strong</text>
  <rect class="yes"  x="745" y="216" width="150" height="42" rx="6" />
  <text class="cellv" x="820" y="242" text-anchor="middle">Strong</text>

  <text class="row" x="0" y="304">Chainlit</text>
  <rect class="no"   x="250" y="278" width="150" height="42" rx="6" />
  <text class="cell" x="325" y="304" text-anchor="middle">Weak</text>
  <rect class="no"   x="415" y="278" width="150" height="42" rx="6" />
  <text class="cell" x="490" y="304" text-anchor="middle">Weak</text>
  <rect class="no"   x="580" y="278" width="150" height="42" rx="6" />
  <text class="cell" x="655" y="304" text-anchor="middle">Weak</text>
  <rect class="part" x="745" y="278" width="150" height="42" rx="6" />
  <text class="cell" x="820" y="304" text-anchor="middle">Partial</text>

  <text class="sub" x="0" y="352">Weak is not a criticism: Chainlit trades ownership for the shortest path from a Python function to a usable UI.</text>
  <text class="sub" x="0" y="372">The last column is what a bake-off never scores, and the only one that changes what you do in year two.</text>
</svg>
