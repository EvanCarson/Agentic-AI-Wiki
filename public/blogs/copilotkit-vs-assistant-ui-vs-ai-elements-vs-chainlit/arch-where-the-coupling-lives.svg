<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="clT clD">
  <title id="clT">Which layer each project claims</title>
  <desc id="clD">Four lanes, each with three stacked layers: agent backend, wire, and interface. CopilotKit claims the wire through the AG-UI protocol and its runtime, and also ships React surfaces. assistant-ui claims the interface primitives and leaves the wire to you. AI Elements claims the interface as source copied into your repository and rides the AI SDK stream as the wire. Chainlit claims both the wire and the interface inside its own server, leaving you only the Python handlers.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .name   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cellv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .side   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">The layer each project claims is the layer you inherit its roadmap on</text>

  <text class="name" x="197" y="56" text-anchor="middle">CopilotKit</text>
  <text class="name" x="400" y="56" text-anchor="middle">assistant-ui</text>
  <text class="name" x="603" y="56" text-anchor="middle">AI Elements</text>
  <text class="name" x="806" y="56" text-anchor="middle">Chainlit</text>

  <text class="side" x="0" y="126">Agent backend</text>
  <text class="side" x="0" y="246">Wire</text>
  <text class="side" x="0" y="376">Interface</text>

  <rect class="box" x="105" y="76" width="185" height="90" />
  <text class="cell" x="197" y="114" text-anchor="middle">Any agent runtime</text>
  <text class="cell" x="197" y="136" text-anchor="middle">yours to choose</text>

  <rect class="hero" x="105" y="186" width="185" height="110" />
  <text class="cellv" x="197" y="228" text-anchor="middle">AG-UI protocol</text>
  <text class="cellv" x="197" y="250" text-anchor="middle">+ its runtime</text>
  <text class="cellv" x="197" y="272" text-anchor="middle">state and interrupts</text>

  <rect class="adj" x="105" y="316" width="185" height="110" />
  <text class="cell" x="197" y="362" text-anchor="middle">React surfaces</text>
  <text class="cell" x="197" y="384" text-anchor="middle">from the library</text>

  <rect class="box" x="308" y="76" width="185" height="90" />
  <text class="cell" x="400" y="114" text-anchor="middle">Any agent runtime</text>
  <text class="cell" x="400" y="136" text-anchor="middle">yours to choose</text>

  <rect class="box" x="308" y="186" width="185" height="110" />
  <text class="cell" x="400" y="228" text-anchor="middle">Your transport</text>
  <text class="cell" x="400" y="250" text-anchor="middle">route handler or</text>
  <text class="cell" x="400" y="272" text-anchor="middle">AI SDK useChat</text>

  <rect class="hero" x="308" y="316" width="185" height="110" />
  <text class="cellv" x="400" y="362" text-anchor="middle">Headless primitives</text>
  <text class="cellv" x="400" y="384" text-anchor="middle">as a dependency</text>

  <rect class="box" x="511" y="76" width="185" height="90" />
  <text class="cell" x="603" y="114" text-anchor="middle">Any agent runtime</text>
  <text class="cell" x="603" y="136" text-anchor="middle">yours to choose</text>

  <rect class="adj" x="511" y="186" width="185" height="110" />
  <text class="cell" x="603" y="228" text-anchor="middle">AI SDK stream</text>
  <text class="cell" x="603" y="250" text-anchor="middle">message parts</text>

  <rect class="hero" x="511" y="316" width="185" height="110" />
  <text class="cellv" x="603" y="362" text-anchor="middle">Components copied</text>
  <text class="cellv" x="603" y="384" text-anchor="middle">into your repo</text>

  <rect class="adj" x="714" y="76" width="185" height="90" />
  <text class="cell" x="806" y="114" text-anchor="middle">Your Python</text>
  <text class="cell" x="806" y="136" text-anchor="middle">handlers</text>

  <rect class="hero" x="714" y="186" width="185" height="110" />
  <text class="cellv" x="806" y="228" text-anchor="middle">Chainlit's own</text>
  <text class="cellv" x="806" y="250" text-anchor="middle">session transport</text>

  <rect class="hero" x="714" y="316" width="185" height="110" />
  <text class="cellv" x="806" y="362" text-anchor="middle">Chainlit's UI</text>
  <text class="cellv" x="806" y="384" text-anchor="middle">configured, not composed</text>

  <text class="sub" x="0" y="462">Solid accent marks the layer the project owns. Everything else stays replaceable.</text>
  <text class="sub" x="0" y="482">Forking cost rises with the claimed block: a library is a weekend, a runtime a quarter, an application a rewrite.</text>
</svg>
