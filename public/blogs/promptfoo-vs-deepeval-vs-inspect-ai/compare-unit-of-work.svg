<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">The unit of work in each framework</title>
  <desc id="d">Three columns comparing what each framework makes you write first: promptfoo takes a declared config and generates attacks, DeepEval takes a hand-written case and asserts a metric threshold, Inspect AI takes a dataset and runs it through a solver and scorer into a log.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .noun        { font-family: var(--font-display); font-size: 22px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .noun-dark   { font-family: var(--font-display); font-size: 22px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="30" text-anchor="middle">What each framework makes you type first</text>

  <text class="col-head" x="160" y="66" text-anchor="middle">promptfoo</text>
  <rect class="card-accent" x="35" y="82" width="250" height="72" rx="8" />
  <text class="noun" x="160" y="126" text-anchor="middle">an attack</text>
  <text class="body-text" x="160" y="180" text-anchor="middle">You declare a target and a</text>
  <text class="body-text" x="160" y="196" text-anchor="middle">risk category; the cases are</text>
  <text class="body-text" x="160" y="212" text-anchor="middle">manufactured for you.</text>
  <text class="body-text" x="160" y="244" text-anchor="middle" style="opacity:.7">Answers: what did I fail</text>
  <text class="body-text" x="160" y="260" text-anchor="middle" style="opacity:.7">to think of?</text>

  <text class="col-head" x="450" y="66" text-anchor="middle">DeepEval</text>
  <rect class="card-soft" x="325" y="82" width="250" height="72" rx="8" />
  <text class="noun-dark" x="450" y="126" text-anchor="middle">an assertion</text>
  <text class="body-text" x="450" y="180" text-anchor="middle">You write the case, attach a</text>
  <text class="body-text" x="450" y="196" text-anchor="middle">metric, and the threshold</text>
  <text class="body-text" x="450" y="212" text-anchor="middle">either clears or fails.</text>
  <text class="body-text" x="450" y="244" text-anchor="middle" style="opacity:.7">Answers: did this change</text>
  <text class="body-text" x="450" y="260" text-anchor="middle" style="opacity:.7">make us worse?</text>

  <text class="col-head" x="750" y="66" text-anchor="middle">Inspect AI</text>
  <rect class="card-neutral" x="625" y="82" width="250" height="72" rx="8" />
  <text class="noun-dark" x="750" y="126" text-anchor="middle">an experiment</text>
  <text class="body-text" x="750" y="180" text-anchor="middle">You bind a dataset to a solver</text>
  <text class="body-text" x="750" y="196" text-anchor="middle">and a scorer; every run emits</text>
  <text class="body-text" x="750" y="212" text-anchor="middle">a log you can re-derive from.</text>
  <text class="body-text" x="750" y="244" text-anchor="middle" style="opacity:.7">Answers: can anyone else</text>
  <text class="body-text" x="750" y="260" text-anchor="middle" style="opacity:.7">reproduce this number?</text>
</svg>
