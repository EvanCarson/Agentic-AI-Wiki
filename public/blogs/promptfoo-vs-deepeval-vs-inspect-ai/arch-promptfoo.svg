<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">promptfoo architecture</title>
  <desc id="d">A YAML config declares the target providers, prompts and red-team plugins. The promptfoo generator manufactures adversarial cases from those categories, runs them against the target, and returns a local results viewer plus a CI exit code.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .lane        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; opacity: .6; text-anchor: middle; letter-spacing: .06em; }
    .box         { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj         { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero        { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label       { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub         { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .sub-inv     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .85; text-anchor: middle; }
    .arrow       { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .arrow-note  { font-family: var(--font-mono), ui-monospace, monospace; font-size: 10px; fill: currentColor; opacity: .65; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="chart-title" x="450" y="30" text-anchor="middle">promptfoo — you declare the surface, it writes the cases</text>

  <text class="lane" x="140" y="72" text-anchor="middle">YOU DECLARE</text>
  <rect class="box" x="15" y="92" width="250" height="96" rx="8" />
  <text class="label" x="140" y="120" text-anchor="middle">promptfooconfig.yaml</text>
  <text class="sub" x="140" y="142" text-anchor="middle">Targets: prompt, endpoint,</text>
  <text class="sub" x="140" y="158" text-anchor="middle">or agent behind a shim</text>
  <text class="sub" x="140" y="174" text-anchor="middle">Plus the risk categories</text>

  <rect class="box" x="15" y="212" width="250" height="96" rx="8" />
  <text class="label" x="140" y="240" text-anchor="middle">Red-team plugins</text>
  <text class="sub" x="140" y="262" text-anchor="middle">Jailbreak · injection · PII</text>
  <text class="sub" x="140" y="278" text-anchor="middle">Exfiltration · tool misuse</text>
  <text class="sub" x="140" y="294" text-anchor="middle">Supply chain</text>

  <text class="lane" x="450" y="72" text-anchor="middle">PROMPTFOO GENERATES</text>
  <rect class="hero" x="325" y="92" width="250" height="216" rx="8" />
  <text class="label-inv" x="450" y="132" text-anchor="middle">Case generator</text>
  <text class="sub-inv" x="450" y="158" text-anchor="middle">Synthesises probes per</text>
  <text class="sub-inv" x="450" y="174" text-anchor="middle">category, then escalates</text>
  <text class="sub-inv" x="450" y="190" text-anchor="middle">across turns</text>
  <text class="sub-inv" x="450" y="222" text-anchor="middle">The test set is OUTPUT,</text>
  <text class="sub-inv" x="450" y="238" text-anchor="middle">not a fixture you keep</text>
  <text class="sub-inv" x="450" y="270" text-anchor="middle">Graders decide whether</text>
  <text class="sub-inv" x="450" y="286" text-anchor="middle">the probe landed</text>

  <text class="lane" x="760" y="72" text-anchor="middle">WHAT YOU GET</text>
  <rect class="adj" x="635" y="92" width="250" height="96" rx="8" />
  <text class="label" x="760" y="120" text-anchor="middle">Findings by category</text>
  <text class="sub" x="760" y="142" text-anchor="middle">Local web viewer,</text>
  <text class="sub" x="760" y="158" text-anchor="middle">grouped by severity</text>
  <text class="sub" x="760" y="174" text-anchor="middle">and reproducible probe</text>

  <rect class="box" x="635" y="212" width="250" height="96" rx="8" />
  <text class="label" x="760" y="240" text-anchor="middle">CI exit code</text>
  <text class="sub" x="760" y="262" text-anchor="middle">A weekly sweep against</text>
  <text class="sub" x="760" y="278" text-anchor="middle">the deployed surface —</text>
  <text class="sub" x="760" y="294" text-anchor="middle">not a per-PR gate</text>

  <path class="arrow" d="M 268 140 L 322 140" />
  <path class="arrow" d="M 268 260 L 322 260" />
  <path class="arrow" d="M 578 140 L 632 140" />
  <path class="arrow" d="M 578 260 L 632 260" />

  <rect class="box" x="325" y="356" width="250" height="76" rx="8" />
  <text class="label" x="450" y="384" text-anchor="middle">Your system under test</text>
  <text class="sub" x="450" y="406" text-anchor="middle">Treated as a black box</text>
  <text class="sub" x="450" y="422" text-anchor="middle">with an attack surface</text>
  <path class="arrow" d="M 430 312 L 430 352" />
  <path class="arrow" d="M 470 352 L 470 312" />
  <text class="arrow-note" x="450" y="336" text-anchor="middle">probe / response</text>
</svg>
