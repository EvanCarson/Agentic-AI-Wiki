<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Inspect AI architecture</title>
  <desc id="d">An Inspect Task binds a dataset of labelled samples to a solver and a scorer. The solver ranges from a single generate call to a full tool-using agent whose model-written code executes inside a Docker sandbox. Every run writes a complete eval log holding messages, tool calls, scores and config.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .lane        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; opacity: .6; text-anchor: middle; letter-spacing: .06em; }
    .box         { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj         { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero        { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label       { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub         { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .sub-inv     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .85; text-anchor: middle; }
    .arrow       { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .arrow-note  { font-family: var(--font-mono), ui-monospace, monospace; font-size: 10px; fill: currentColor; opacity: .65; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="chart-title" x="450" y="30" text-anchor="middle">Inspect AI — a Task is an experiment, and the log is the deliverable</text>

  <text class="lane" x="140" y="72" text-anchor="middle">DATASET</text>
  <rect class="box" x="15" y="92" width="250" height="96" rx="8" />
  <text class="label" x="140" y="120" text-anchor="middle">Labelled samples</text>
  <text class="sub" x="140" y="142" text-anchor="middle">Input, target, metadata —</text>
  <text class="sub" x="140" y="158" text-anchor="middle">versioned and fixed, so</text>
  <text class="sub" x="140" y="174" text-anchor="middle">two runs are comparable</text>

  <text class="lane" x="450" y="72" text-anchor="middle">SOLVER</text>
  <rect class="hero" x="325" y="92" width="250" height="96" rx="8" />
  <text class="label-inv" x="450" y="120" text-anchor="middle">Produces an answer</text>
  <text class="sub-inv" x="450" y="142" text-anchor="middle">One generate() call, or a</text>
  <text class="sub-inv" x="450" y="158" text-anchor="middle">full tool-using agent</text>
  <text class="sub-inv" x="450" y="174" text-anchor="middle">running many steps</text>

  <text class="lane" x="760" y="72" text-anchor="middle">SCORER</text>
  <rect class="adj" x="635" y="92" width="250" height="96" rx="8" />
  <text class="label" x="760" y="120" text-anchor="middle">Grades the answer</text>
  <text class="sub" x="760" y="142" text-anchor="middle">Text comparison up to</text>
  <text class="sub" x="760" y="158" text-anchor="middle">model grading — the</text>
  <text class="sub" x="760" y="174" text-anchor="middle">judge is declared, not hidden</text>

  <path class="arrow" d="M 268 140 L 322 140" />
  <path class="arrow" d="M 578 140 L 632 140" />

  <rect class="box" x="325" y="222" width="250" height="86" rx="8" />
  <text class="label" x="450" y="250" text-anchor="middle">Docker sandbox</text>
  <text class="sub" x="450" y="272" text-anchor="middle">Provisioned by the framework</text>
  <text class="sub" x="450" y="288" text-anchor="middle">when the solver runs code</text>
  <path class="arrow" d="M 450 192 L 450 218" />

  <rect class="adj" x="215" y="360" width="470" height="96" rx="8" />
  <text class="label" x="450" y="390" text-anchor="middle">Eval log</text>
  <text class="sub" x="450" y="412" text-anchor="middle">Messages · tool calls · scores · model and config · sample-level detail</text>
  <text class="sub" x="450" y="434" text-anchor="middle">Complete enough to re-derive the number instead of re-running on faith</text>
  <path class="arrow" d="M 140 192 L 140 400 L 211 400" />
  <path class="arrow" d="M 760 192 L 760 400 L 689 400" />
  <path class="arrow" d="M 450 312 L 450 356" />
</svg>
