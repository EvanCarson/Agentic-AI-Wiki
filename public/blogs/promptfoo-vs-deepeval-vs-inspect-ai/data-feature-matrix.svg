<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Capability matrix across the three eval harnesses</title>
  <desc id="d">A three-by-five grid scoring promptfoo, DeepEval and Inspect AI on adversarial case generation, CI ergonomics, agent trajectory detail, sandboxed code execution, and reproducible run logs. Each project is strong in the columns its theory of evaluation cares about and weak in the others.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: start; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28" text-anchor="middle">Where each one leans hardest</text>

  <text class="body-text" x="238" y="62" text-anchor="middle" style="font-weight:600">Adversarial</text>
  <text class="body-text" x="238" y="76" text-anchor="middle" style="font-weight:600">generation</text>
  <text class="body-text" x="378" y="62" text-anchor="middle" style="font-weight:600">CI</text>
  <text class="body-text" x="378" y="76" text-anchor="middle" style="font-weight:600">ergonomics</text>
  <text class="body-text" x="518" y="62" text-anchor="middle" style="font-weight:600">Trajectory</text>
  <text class="body-text" x="518" y="76" text-anchor="middle" style="font-weight:600">detail</text>
  <text class="body-text" x="658" y="62" text-anchor="middle" style="font-weight:600">Sandboxed</text>
  <text class="body-text" x="658" y="76" text-anchor="middle" style="font-weight:600">execution</text>
  <text class="body-text" x="798" y="62" text-anchor="middle" style="font-weight:600">Reproducible</text>
  <text class="body-text" x="798" y="76" text-anchor="middle" style="font-weight:600">log</text>

  <text class="row-head" x="154" y="128" text-anchor="end">promptfoo</text>
  <rect class="card-accent" x="171" y="96" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="238" y="121" text-anchor="middle">Generates</text>
  <text class="body-text-inv" x="238" y="135" text-anchor="middle">the cases</text>
  <rect class="card-soft" x="311" y="96" width="134" height="56" rx="6" />
  <text class="body-text" x="378" y="121" text-anchor="middle">Exit code,</text>
  <text class="body-text" x="378" y="135" text-anchor="middle">config-driven</text>
  <rect class="card-neutral" x="451" y="96" width="134" height="56" rx="6" />
  <text class="body-text" x="518" y="121" text-anchor="middle">Black box</text>
  <text class="body-text" x="518" y="135" text-anchor="middle">by design</text>
  <rect class="card-neutral" x="591" y="96" width="134" height="56" rx="6" />
  <text class="body-text" x="658" y="128" text-anchor="middle">Out of scope</text>
  <rect class="card-neutral" x="731" y="96" width="134" height="56" rx="6" />
  <text class="body-text" x="798" y="121" text-anchor="middle">Cases move</text>
  <text class="body-text" x="798" y="135" text-anchor="middle">run to run</text>

  <text class="row-head" x="154" y="192" text-anchor="end">DeepEval</text>
  <rect class="card-neutral" x="171" y="160" width="134" height="56" rx="6" />
  <text class="body-text" x="238" y="185" text-anchor="middle">Hand-written</text>
  <text class="body-text" x="238" y="199" text-anchor="middle">only</text>
  <rect class="card-accent" x="311" y="160" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="378" y="185" text-anchor="middle">Native</text>
  <text class="body-text-inv" x="378" y="199" text-anchor="middle">pytest</text>
  <rect class="card-soft" x="451" y="160" width="134" height="56" rx="6" />
  <text class="body-text" x="518" y="185" text-anchor="middle">Agentic</text>
  <text class="body-text" x="518" y="199" text-anchor="middle">metrics</text>
  <rect class="card-neutral" x="591" y="160" width="134" height="56" rx="6" />
  <text class="body-text" x="658" y="192" text-anchor="middle">Yours to build</text>
  <rect class="card-soft" x="731" y="160" width="134" height="56" rx="6" />
  <text class="body-text" x="798" y="185" text-anchor="middle">Test report,</text>
  <text class="body-text" x="798" y="199" text-anchor="middle">not a record</text>

  <text class="row-head" x="154" y="256" text-anchor="end">Inspect AI</text>
  <rect class="card-neutral" x="171" y="224" width="134" height="56" rx="6" />
  <text class="body-text" x="238" y="249" text-anchor="middle">Possible,</text>
  <text class="body-text" x="238" y="263" text-anchor="middle">manual</text>
  <rect class="card-soft" x="311" y="224" width="134" height="56" rx="6" />
  <text class="body-text" x="378" y="249" text-anchor="middle">Works, but</text>
  <text class="body-text" x="378" y="263" text-anchor="middle">heavier</text>
  <rect class="card-accent" x="451" y="224" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="518" y="249" text-anchor="middle">Whole run</text>
  <text class="body-text-inv" x="518" y="263" text-anchor="middle">in the log</text>
  <rect class="card-accent" x="591" y="224" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="658" y="249" text-anchor="middle">Docker by</text>
  <text class="body-text-inv" x="658" y="263" text-anchor="middle">default</text>
  <rect class="card-accent" x="731" y="224" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="798" y="249" text-anchor="middle">The whole</text>
  <text class="body-text-inv" x="798" y="263" text-anchor="middle">point</text>

  <rect class="card-accent" x="171" y="322" width="18" height="18" rx="4" />
  <text class="legend-text" x="197" y="336" text-anchor="start">Strong — this is what the design is for</text>
  <rect class="card-soft" x="451" y="322" width="18" height="18" rx="4" />
  <text class="legend-text" x="477" y="336" text-anchor="start">Workable</text>
  <rect class="card-neutral" x="631" y="322" width="18" height="18" rx="4" />
  <text class="legend-text" x="657" y="336" text-anchor="start">Against the grain</text>
</svg>
