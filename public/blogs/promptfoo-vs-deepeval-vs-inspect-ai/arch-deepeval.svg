<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">DeepEval architecture</title>
  <desc id="d">Pytest collects test cases written by hand. Each case attaches metrics such as G-Eval, DAG metrics or agent tool-call metrics, which call a judge model and compare the result against a threshold. The outcome is an ordinary pytest pass or fail inside the existing CI pipeline.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .lane        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; opacity: .6; text-anchor: middle; letter-spacing: .06em; }
    .box         { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj         { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero        { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label       { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub         { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .sub-inv     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .85; text-anchor: middle; }
    .arrow       { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .arrow-note  { font-family: var(--font-mono), ui-monospace, monospace; font-size: 10px; fill: currentColor; opacity: .65; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="chart-title" x="450" y="30" text-anchor="middle">DeepEval — the eval is an assertion, the comparator is a model</text>

  <text class="lane" x="140" y="72" text-anchor="middle">YOUR TEST SUITE</text>
  <rect class="box" x="15" y="92" width="250" height="96" rx="8" />
  <text class="label" x="140" y="120" text-anchor="middle">pytest collection</text>
  <text class="sub" x="140" y="142" text-anchor="middle">Ordinary test functions,</text>
  <text class="sub" x="140" y="158" text-anchor="middle">ordinary fixtures,</text>
  <text class="sub" x="140" y="174" text-anchor="middle">ordinary parametrize</text>

  <rect class="box" x="15" y="212" width="250" height="96" rx="8" />
  <text class="label" x="140" y="240" text-anchor="middle">Golden set</text>
  <text class="sub" x="140" y="262" text-anchor="middle">Hand-written cases you</text>
  <text class="sub" x="140" y="278" text-anchor="middle">own and version —</text>
  <text class="sub" x="140" y="294" text-anchor="middle">nothing is generated</text>

  <text class="lane" x="450" y="72" text-anchor="middle">METRICS ATTACH TO CASES</text>
  <rect class="hero" x="325" y="92" width="250" height="216" rx="8" />
  <text class="label-inv" x="450" y="126" text-anchor="middle">Metric objects</text>
  <text class="sub-inv" x="450" y="152" text-anchor="middle">G-Eval — rubric judgement</text>
  <text class="sub-inv" x="450" y="176" text-anchor="middle">DAG — decision tree, so a</text>
  <text class="sub-inv" x="450" y="192" text-anchor="middle">flat score cannot hide why</text>
  <text class="sub-inv" x="450" y="216" text-anchor="middle">Agentic — tool correctness,</text>
  <text class="sub-inv" x="450" y="232" text-anchor="middle">task completion</text>
  <text class="sub-inv" x="450" y="264" text-anchor="middle">Each returns a score and</text>
  <text class="sub-inv" x="450" y="280" text-anchor="middle">compares it to a threshold</text>

  <text class="lane" x="760" y="72" text-anchor="middle">WHAT YOU GET</text>
  <rect class="adj" x="635" y="92" width="250" height="96" rx="8" />
  <text class="label" x="760" y="120" text-anchor="middle">Pass or fail</text>
  <text class="sub" x="760" y="142" text-anchor="middle">A red build, in the same</text>
  <text class="sub" x="760" y="158" text-anchor="middle">place as every other</text>
  <text class="sub" x="760" y="174" text-anchor="middle">failing test</text>

  <rect class="box" x="635" y="212" width="250" height="96" rx="8" />
  <text class="label" x="760" y="240" text-anchor="middle">Everything CI knows</text>
  <text class="sub" x="760" y="262" text-anchor="middle">Parallelism, selection,</text>
  <text class="sub" x="760" y="278" text-anchor="middle">reporting, retries —</text>
  <text class="sub" x="760" y="294" text-anchor="middle">inherited, not rebuilt</text>

  <path class="arrow" d="M 268 140 L 322 140" />
  <path class="arrow" d="M 268 260 L 322 260" />
  <path class="arrow" d="M 578 140 L 632 140" />
  <path class="arrow" d="M 578 260 L 632 260" />

  <rect class="box" x="325" y="356" width="250" height="76" rx="8" />
  <text class="label" x="450" y="384" text-anchor="middle">Judge model</text>
  <text class="sub" x="450" y="406" text-anchor="middle">Pin the snapshot, or your</text>
  <text class="sub" x="450" y="422" text-anchor="middle">threshold moves silently</text>
  <path class="arrow" d="M 430 312 L 430 352" />
  <path class="arrow" d="M 470 352 L 470 312" />
  <text class="arrow-note" x="450" y="336" text-anchor="middle">grade request</text>
</svg>
