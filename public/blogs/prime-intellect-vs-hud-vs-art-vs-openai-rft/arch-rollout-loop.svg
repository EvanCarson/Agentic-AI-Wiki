<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The agentic RL loop, and which box each vendor sells</title>
  <desc id="d">A cycle of four boxes. A policy inference pool generates tokens and hands a proposed action to the environment, drawn as the large accent box in the centre right: it executes the tool call against real software, returns an observation, and at the end of an episode runs a verifier that emits a scalar reward. Completed trajectories flow into a rollout buffer, and the trainer pool consumes the buffer to update weights, then publishes new weights back to the inference pool. Annotations mark that the inference pool and trainer pool are rented commodities, that the buffer is plumbing, and that the environment plus its verifier is the only box that survives a change of base model, trainer or cloud. A footer band notes that a single slow episode stalls a synchronous batch, which is why the inference and trainer pools are disaggregated and run concurrently.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .tag-inv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--paper); opacity: .85; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="box" x="24" y="44" width="232" height="128" />
  <text class="head" x="44" y="76">Inference pool</text>
  <text class="sub" x="44" y="104">generates the next action</text>
  <text class="sub" x="44" y="126">vLLM or SGLang, rented</text>
  <text class="tag" x="44" y="154">COMMODITY</text>

  <path class="arrow" d="M 264 108 L 508 108" />
  <text class="sub" x="316" y="96">proposed tool call</text>

  <rect class="hero" x="516" y="24" width="360" height="212" />
  <text class="head-inv" x="540" y="58">Environment</text>
  <text class="sub-inv" x="540" y="88">executes against real software</text>
  <text class="sub-inv" x="540" y="112">returns the observation</text>
  <text class="sub-inv" x="540" y="136">resets deterministically</text>
  <text class="sub-inv" x="540" y="160">verifier emits the scalar reward</text>
  <line x1="540" y1="184" x2="852" y2="184" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag-inv" x="540" y="208">THE ONLY BOX THAT OUTLIVES THE RUN</text>

  <path class="arrow" d="M 690 244 L 690 288" />
  <text class="sub" x="702" y="272">finished trajectories</text>

  <rect class="adj" x="516" y="296" width="360" height="104" />
  <text class="head" x="540" y="328">Rollout buffer</text>
  <text class="sub" x="540" y="356">decouples generation from training</text>
  <text class="sub" x="540" y="378">so one slow episode stalls nothing</text>

  <path class="arrow" d="M 508 348 L 264 348" />

  <rect class="box" x="24" y="296" width="232" height="128" />
  <text class="head" x="44" y="328">Trainer pool</text>
  <text class="sub" x="44" y="356">GRPO and descendants</text>
  <text class="sub" x="44" y="378">publishes new weights</text>
  <text class="tag" x="44" y="406">COMMODITY</text>

  <path class="arrow" d="M 140 288 L 140 180" />
  <text class="sub" x="152" y="240">updated weights</text>

  <rect class="box" x="24" y="440" width="852" height="46" />
  <text class="label" x="44" y="470">Rent the two commodity boxes. Write the accent one — it is the asset, and it is also your eval harness.</text>
</svg>
