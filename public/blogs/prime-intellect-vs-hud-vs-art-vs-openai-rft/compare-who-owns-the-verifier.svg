<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three answers to who writes the reward</title>
  <desc id="d">Three columns comparing where the reward function comes from. In the first, you write a programmatic verifier that checks the artifact — tests pass, the row was written, the invariant holds; Prime Intellect and HUD both take this route, it gives the sharpest signal, and the labour is yours. In the second, drawn as the accent column, a judge model ranks a group of trajectories against each other rather than scoring them absolutely; OpenPipe's RULER works this way, it removes the hand-written reward and works on open-ended tasks, and the cost is that correctness now depends on a judge you have to calibrate. In the third, the vendor supplies the grader schema and you fill it in, as with OpenAI reinforcement fine-tuning; it is the least work and the least portable, and it grades outputs rather than a tool-using trajectory.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .tag-inv{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--paper); opacity: .85; }
  </style>

  <rect class="box" x="24" y="36" width="266" height="228" />
  <text class="head" x="44" y="66">You write it</text>
  <text class="sub" x="44" y="100">the tests pass</text>
  <text class="sub" x="44" y="124">the row was written</text>
  <text class="sub" x="44" y="148">the invariant holds</text>
  <line x1="44" y1="176" x2="270" y2="176" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="44" y="200">PRIME INTELLECT / HUD</text>
  <text class="label" x="44" y="228">sharpest signal available,</text>
  <text class="label" x="44" y="248">and the labour is yours</text>

  <rect class="hero" x="314" y="36" width="266" height="228" />
  <text class="head-inv" x="334" y="66">A judge ranks it</text>
  <text class="sub-inv" x="334" y="100">group of trajectories, ordered</text>
  <text class="sub-inv" x="334" y="124">no rubric, no labels</text>
  <text class="sub-inv" x="334" y="148">works on open-ended tasks</text>
  <line x1="334" y1="176" x2="560" y2="176" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag-inv" x="334" y="200">OPENPIPE RULER</text>
  <text class="label-inv" x="334" y="228">correctness now rests on</text>
  <text class="label-inv" x="334" y="248">a judge you must calibrate</text>

  <rect class="box" x="604" y="36" width="266" height="228" />
  <text class="head" x="624" y="66">The vendor's schema</text>
  <text class="sub" x="624" y="100">graders in their format</text>
  <text class="sub" x="624" y="124">grades the output, not the run</text>
  <text class="sub" x="624" y="148">least work to start</text>
  <line x1="624" y1="176" x2="850" y2="176" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="624" y="200">OPENAI RFT</text>
  <text class="label" x="624" y="228">and the least portable</text>
  <text class="label" x="624" y="248">thing you could have built</text>
</svg>
