<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Where each platform leans</title>
  <desc id="d">A four by four matrix. Rows are Prime Intellect, HUD, OpenPipe ART and OpenAI RFT. Columns are open-source core, portable environment artifact, wraps your real software, and open to new users. Prime Intellect is strong on an open core with the verifiers library, strong on portability because environments ship as installable Python wheels, medium on wrapping real software, and open to new users. HUD is strong on an open core with hud-python, medium on portability because environments are MCP servers run through a hosted gateway, strong on wrapping real software since that is its whole premise, and open to new users. OpenPipe ART is strong on an open core, weak on portability because the rollout is code inside your own application rather than a distributable artifact, strong on wrapping real software since it trains on your production task, and open to new users. OpenAI reinforcement fine-tuning is weak on an open core with nothing published, weak on portability because graders follow a proprietary schema, weak on wrapping real software since it grades outputs rather than running a tool loop, and closed to new users as the fine-tuning platform winds down.</desc>
  <style>
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); }
    .col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .8; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .key    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .8; }
    .s      { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .m      { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .w      { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
  </style>

  <text class="head" x="24" y="34">Where each one leans</text>

  <text class="col" x="212" y="70">OPEN CORE</text>
  <text class="col" x="376" y="70">PORTABLE ENV</text>
  <text class="col" x="552" y="70">YOUR SOFTWARE</text>
  <text class="col" x="726" y="70">OPEN TO NEW USERS</text>

  <text class="label" x="24" y="108">Prime Intellect</text>
  <rect class="s" x="204" y="86" width="156" height="34" />
  <text class="cell-inv" x="216" y="108">Strong · verifiers</text>
  <rect class="s" x="368" y="86" width="156" height="34" />
  <text class="cell-inv" x="380" y="108">Strong · wheels</text>
  <rect class="m" x="532" y="86" width="156" height="34" />
  <text class="cell" x="544" y="108">Medium</text>
  <rect class="s" x="696" y="86" width="156" height="34" />
  <text class="cell-inv" x="708" y="108">Yes</text>

  <text class="label" x="24" y="164">HUD</text>
  <rect class="s" x="204" y="142" width="156" height="34" />
  <text class="cell-inv" x="216" y="164">Strong · hud-python</text>
  <rect class="m" x="368" y="142" width="156" height="34" />
  <text class="cell" x="380" y="164">Medium · MCP</text>
  <rect class="s" x="532" y="142" width="156" height="34" />
  <text class="cell-inv" x="544" y="164">Strong · the premise</text>
  <rect class="s" x="696" y="142" width="156" height="34" />
  <text class="cell-inv" x="708" y="164">Yes</text>

  <text class="label" x="24" y="220">OpenPipe ART</text>
  <rect class="s" x="204" y="198" width="156" height="34" />
  <text class="cell-inv" x="216" y="220">Strong · ART, RULER</text>
  <rect class="w" x="368" y="198" width="156" height="34" />
  <text class="cell" x="380" y="220">Weak · in-app code</text>
  <rect class="s" x="532" y="198" width="156" height="34" />
  <text class="cell-inv" x="544" y="220">Strong · your task</text>
  <rect class="s" x="696" y="198" width="156" height="34" />
  <text class="cell-inv" x="708" y="220">Yes</text>

  <text class="label" x="24" y="276">OpenAI RFT</text>
  <rect class="w" x="204" y="254" width="156" height="34" />
  <text class="cell" x="216" y="276">Weak · none</text>
  <rect class="w" x="368" y="254" width="156" height="34" />
  <text class="cell" x="380" y="276">Weak · own schema</text>
  <rect class="w" x="532" y="254" width="156" height="34" />
  <text class="cell" x="544" y="276">Weak · grades output</text>
  <rect class="w" x="696" y="254" width="156" height="34" />
  <text class="cell" x="708" y="276">No · winding down</text>

  <line x1="24" y1="314" x2="876" y2="314" stroke="var(--ink)" stroke-width="1" opacity=".2" />
  <rect class="s" x="24" y="332" width="18" height="18" />
  <text class="key" x="50" y="346">Strong</text>
  <rect class="m" x="120" y="332" width="18" height="18" />
  <text class="key" x="146" y="346">Medium</text>
  <rect class="w" x="228" y="332" width="18" height="18" />
  <text class="key" x="254" y="346">Weak</text>
  <text class="key" x="340" y="346">Strong is not better — it marks where a platform commits, and every commitment costs something elsewhere.</text>
</svg>
