<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What the agent actually sees</title>
  <desc id="d">Four-column comparison of the runtime surface presented to the agent. E2B and Modal expose a full Linux environment with arbitrary network and package install. Daytona exposes a developer workspace with the project source mounted and the language toolchain installed. Anthropic Code Execution exposes a curated Jupyter-like Python environment with the scientific stack preinstalled, pip restricted to PyPI, and outbound network limited to an allowlist.</desc>
  <style>
    .chart-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="28">What the agent actually sees</text>

  <!-- Column 1: E2B — ACCENT (widest surface) -->
  <rect class="card-accent" x="10" y="44" width="210" height="220" rx="8" />
  <text class="col-head-inv" x="115" y="72">E2B</text>
  <text class="body-text-inv" x="115" y="110">Full Linux VM</text>
  <text class="body-text-inv" x="115" y="128">arbitrary apt + pip</text>
  <text class="body-text-inv" x="115" y="146">arbitrary network</text>
  <text class="body-text-inv" x="115" y="180">any language</text>

  <!-- Column 2: Modal — SOFT (full container) -->
  <rect class="card-soft" x="230" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="335" y="72">Modal</text>
  <text class="body-text" x="335" y="110">Full container</text>
  <text class="body-text" x="335" y="128">Modal Image layers</text>
  <text class="body-text" x="335" y="146">arbitrary network + GPU</text>
  <text class="body-text" x="335" y="180">any language</text>

  <!-- Column 3: Daytona — SOFT (workspace shape) -->
  <rect class="card-soft" x="450" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="555" y="72">Daytona</text>
  <text class="body-text" x="555" y="110">Project + toolchain</text>
  <text class="body-text" x="555" y="128">git, shell, tests ready</text>
  <text class="body-text" x="555" y="146">arbitrary network</text>
  <text class="body-text" x="555" y="180">IDE-shaped</text>

  <!-- Column 4: Anthropic Code Execution — NEUTRAL (curated, narrow) -->
  <rect class="card-neutral" x="670" y="44" width="220" height="220" rx="8" />
  <text class="col-head" x="780" y="72">Anthropic</text>
  <text class="col-head" x="780" y="90">Code Execution</text>
  <text class="body-text" x="780" y="118">Python 3 only</text>
  <text class="body-text" x="780" y="136">scipy stack preinstalled</text>
  <text class="body-text" x="780" y="154">pip → PyPI · no inbound</text>
  <text class="body-text" x="780" y="188">curated · narrow</text>
</svg>
