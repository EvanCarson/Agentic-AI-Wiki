<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Lifecycle ownership</title>
  <desc id="d">Four-column comparison of who owns the sandbox lifecycle. E2B is app-owned — your application code calls create, set_timeout, kill, and reattach. Modal is platform-owned — warm pools and per-call provisioning are the platform's job. Daytona is workspace-owned with long-lived sessions measured in hours and days. Anthropic Code Execution is API-owned — the container exists for the duration of a single conversation, then is gone.</desc>
  <style>
    .chart-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="28">Lifecycle ownership</text>

  <!-- Column 1: E2B — NEUTRAL (you own it = you operate it) -->
  <rect class="card-neutral" x="10" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="115" y="72">E2B</text>
  <text class="body-text" x="115" y="110">App-owned</text>
  <text class="body-text" x="115" y="128">create() · kill()</text>
  <text class="body-text" x="115" y="146">set_timeout · reattach</text>
  <text class="body-text" x="115" y="180">forget kill = your bill</text>

  <!-- Column 2: Modal — SOFT (platform pool) -->
  <rect class="card-soft" x="230" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="335" y="72">Modal</text>
  <text class="body-text" x="335" y="110">Platform-owned</text>
  <text class="body-text" x="335" y="128">warm pool · autoscale</text>
  <text class="body-text" x="335" y="146">per-call provisioning</text>
  <text class="body-text" x="335" y="180">leaks are platform's problem</text>

  <!-- Column 3: Daytona — SOFT (workspace = long-lived) -->
  <rect class="card-soft" x="450" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="555" y="72">Daytona</text>
  <text class="body-text" x="555" y="110">Workspace-owned</text>
  <text class="body-text" x="555" y="128">long-lived (hours, days)</text>
  <text class="body-text" x="555" y="146">survives across sessions</text>
  <text class="body-text" x="555" y="180">shaped like a dev env</text>

  <!-- Column 4: Anthropic Code Execution — ACCENT (zero work) -->
  <rect class="card-accent" x="670" y="44" width="220" height="220" rx="8" />
  <text class="col-head-inv" x="780" y="72">Anthropic</text>
  <text class="col-head-inv" x="780" y="90">Code Execution</text>
  <text class="body-text-inv" x="780" y="118">API-owned</text>
  <text class="body-text-inv" x="780" y="136">per conversation</text>
  <text class="body-text-inv" x="780" y="154">~1 hr · ~1 GB</text>
  <text class="body-text-inv" x="780" y="188">zero infra code</text>
</svg>
