<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Daytona architecture</title>
  <desc id="d">A workspace definition is provisioned as a long-lived container or VM with the project source mounted and the language toolchain installed. The same workspace is exposed to a developer over SSH or the IDE, and to an agent over the Daytona SDK; the workspace filesystem persists across many calls and many sessions.</desc>
  <style>
    .box      { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero     { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj      { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound    { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- LEFT: developer + agent as joint consumers -->
  <rect class="bound" x="28" y="48" width="270" height="180" rx="10" ry="10" />
  <text class="sub" x="163" y="70" text-anchor="middle" font-weight="600">DEVELOPER</text>
  <rect class="box" x="46" y="86" width="234" height="60" rx="8" ry="8" />
  <text class="label" x="163" y="110" text-anchor="middle" font-weight="600">IDE / SSH</text>
  <text class="sub" x="163" y="128" text-anchor="middle">VS Code · JetBrains · terminal</text>
  <rect class="box" x="46" y="156" width="234" height="60" rx="8" ry="8" />
  <text class="label" x="163" y="180" text-anchor="middle" font-weight="600">Live editing</text>
  <text class="sub" x="163" y="198" text-anchor="middle">edit while agent works</text>

  <rect class="bound" x="28" y="252" width="270" height="180" rx="10" ry="10" />
  <text class="sub" x="163" y="274" text-anchor="middle" font-weight="600">AGENT</text>
  <rect class="adj" x="46" y="290" width="234" height="60" rx="8" ry="8" />
  <text class="label" x="163" y="314" text-anchor="middle" font-weight="600">Daytona SDK</text>
  <text class="sub" x="163" y="332" text-anchor="middle">create · exec · files · stop</text>
  <rect class="box" x="46" y="360" width="234" height="60" rx="8" ry="8" />
  <text class="label" x="163" y="384" text-anchor="middle" font-weight="600">Definition (yaml)</text>
  <text class="sub" x="163" y="402" text-anchor="middle">devcontainer / Dockerfile</text>

  <!-- WORKSPACE (right, hero — long-lived) -->
  <rect class="hero" x="360" y="50" width="512" height="400" rx="10" ry="10" />
  <text class="label-inv" x="616" y="80" text-anchor="middle" font-weight="600">Workspace (long-lived, hours to days)</text>

  <rect class="box" x="388" y="100" width="220" height="68" rx="8" ry="8" />
  <text class="label" x="498" y="124" text-anchor="middle" font-weight="600">Project source</text>
  <text class="sub" x="498" y="142" text-anchor="middle">already checked out</text>
  <text class="sub" x="498" y="158" text-anchor="middle">git history available</text>

  <rect class="box" x="628" y="100" width="220" height="68" rx="8" ry="8" />
  <text class="label" x="738" y="124" text-anchor="middle" font-weight="600">Toolchain installed</text>
  <text class="sub" x="738" y="142" text-anchor="middle">node · python · go · cargo</text>
  <text class="sub" x="738" y="158" text-anchor="middle">per workspace definition</text>

  <rect class="box" x="388" y="184" width="220" height="68" rx="8" ry="8" />
  <text class="label" x="498" y="208" text-anchor="middle" font-weight="600">Shell · tests · build</text>
  <text class="sub" x="498" y="226" text-anchor="middle">agent runs commands</text>
  <text class="sub" x="498" y="242" text-anchor="middle">like a developer would</text>

  <rect class="box" x="628" y="184" width="220" height="68" rx="8" ry="8" />
  <text class="label" x="738" y="208" text-anchor="middle" font-weight="600">Persistent FS</text>
  <text class="sub" x="738" y="226" text-anchor="middle">state survives many calls</text>
  <text class="sub" x="738" y="242" text-anchor="middle">survives many sessions</text>

  <rect class="box" x="388" y="268" width="460" height="60" rx="8" ry="8" />
  <text class="label" x="618" y="290" text-anchor="middle" font-weight="600">Container or VM (workspace-defined)</text>
  <text class="sub" x="618" y="308" text-anchor="middle">standard container isolation by default — harden with k8s policies</text>

  <rect class="box" x="388" y="344" width="460" height="76" rx="8" ry="8" />
  <text class="label" x="618" y="368" text-anchor="middle" font-weight="600">Daytona platform (open source, AGPL)</text>
  <text class="sub" x="618" y="386" text-anchor="middle">self-host on Kubernetes or use managed cloud</text>
  <text class="sub" x="618" y="402" text-anchor="middle">workspace = sandbox = dev env (shared design)</text>

  <!-- Cross-boundary arrows: dev -->
  <line class="arrow" x1="280" y1="116" x2="386" y2="200" />
  <text class="sub" x="335" y="150" text-anchor="middle" font-weight="600">SSH · IDE</text>

  <!-- Cross-boundary: agent -->
  <line class="arrow" x1="280" y1="320" x2="386" y2="232" />
  <text class="sub" x="335" y="290" text-anchor="middle" font-weight="600">SDK calls</text>
</svg>
