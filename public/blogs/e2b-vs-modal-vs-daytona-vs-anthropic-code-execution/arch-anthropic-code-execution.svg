<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Anthropic Code Execution architecture</title>
  <desc id="d">A Messages API call declares the code_execution tool in the tools array. The model emits code_execution_tool_use blocks; Anthropic's server runs them in a sandboxed container that persists across turns within a single conversation, up to one hour or about a gigabyte of state, and returns stdout, files, and final text in the response. No sandbox object exists in the client.</desc>
  <style>
    .box      { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero     { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj      { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound    { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- CLIENT (left, dashed — thin) -->
  <rect class="bound" x="28" y="58" width="270" height="370" rx="10" ry="10" />
  <text class="sub" x="163" y="80" text-anchor="middle" font-weight="600">CLIENT (thin)</text>

  <rect class="box" x="46" y="100" width="234" height="76" rx="8" ry="8" />
  <text class="label" x="163" y="124" text-anchor="middle" font-weight="600">Messages API call</text>
  <text class="sub" x="163" y="142" text-anchor="middle">tools: [{ type:</text>
  <text class="sub" x="163" y="158" text-anchor="middle">"code_execution_20250522" }]</text>

  <rect class="adj" x="46" y="194" width="234" height="76" rx="8" ry="8" />
  <text class="label" x="163" y="218" text-anchor="middle" font-weight="600">No SDK · No sandbox obj</text>
  <text class="sub" x="163" y="236" text-anchor="middle">declare the tool · send prompt</text>
  <text class="sub" x="163" y="252" text-anchor="middle">parse content blocks back</text>

  <rect class="box" x="46" y="290" width="234" height="86" rx="8" ry="8" />
  <text class="label" x="163" y="314" text-anchor="middle" font-weight="600">Receives interleaved</text>
  <text class="sub" x="163" y="332" text-anchor="middle">text · tool_use · tool_result</text>
  <text class="sub" x="163" y="348" text-anchor="middle">model plan + code + stdout</text>
  <text class="sub" x="163" y="364" text-anchor="middle">no infrastructure code</text>

  <!-- ANTHROPIC SERVER (right, hero) -->
  <rect class="hero" x="360" y="50" width="512" height="400" rx="10" ry="10" />
  <text class="label-inv" x="616" y="80" text-anchor="middle" font-weight="600">Anthropic server (API-owned)</text>

  <rect class="box" x="388" y="100" width="220" height="76" rx="8" ry="8" />
  <text class="label" x="498" y="124" text-anchor="middle" font-weight="600">Model loop</text>
  <text class="sub" x="498" y="142" text-anchor="middle">Claude decides when</text>
  <text class="sub" x="498" y="158" text-anchor="middle">to call code_execution</text>

  <rect class="box" x="628" y="100" width="220" height="76" rx="8" ry="8" />
  <text class="label" x="738" y="124" text-anchor="middle" font-weight="600">Sandboxed container</text>
  <text class="sub" x="738" y="142" text-anchor="middle">internals not documented</text>
  <text class="sub" x="738" y="158" text-anchor="middle">opaque to caller</text>

  <rect class="box" x="388" y="192" width="220" height="76" rx="8" ry="8" />
  <text class="label" x="498" y="216" text-anchor="middle" font-weight="600">Python 3 + scipy stack</text>
  <text class="sub" x="498" y="234" text-anchor="middle">numpy · pandas · matplotlib</text>
  <text class="sub" x="498" y="250" text-anchor="middle">pip install (PyPI)</text>

  <rect class="box" x="628" y="192" width="220" height="76" rx="8" ry="8" />
  <text class="label" x="738" y="216" text-anchor="middle" font-weight="600">Network policy</text>
  <text class="sub" x="738" y="234" text-anchor="middle">outbound: docs allowlist</text>
  <text class="sub" x="738" y="250" text-anchor="middle">inbound: none</text>

  <rect class="box" x="388" y="284" width="460" height="76" rx="8" ry="8" />
  <text class="label" x="618" y="308" text-anchor="middle" font-weight="600">Container persists across turns within one conversation</text>
  <text class="sub" x="618" y="326" text-anchor="middle">up to ~1 hr · ~1 GB · Jupyter-kernel-like state</text>
  <text class="sub" x="618" y="344" text-anchor="middle">vanishes when conversation ages out</text>

  <rect class="box" x="388" y="376" width="460" height="56" rx="8" ry="8" />
  <text class="label" x="618" y="400" text-anchor="middle" font-weight="600">Outputs flow back as response content blocks</text>
  <text class="sub" x="618" y="418" text-anchor="middle">stdout · stderr · files (via Files API)</text>

  <!-- Internal server arrows -->
  <line class="arrow" x1="608" y1="138" x2="626" y2="138" />
  <line class="arrow" x1="498" y1="176" x2="498" y2="190" />
  <line class="arrow" x1="738" y1="176" x2="738" y2="190" />

  <!-- Cross-boundary -->
  <line class="arrow" x1="280" y1="138" x2="386" y2="138" />
  <text class="sub" x="332" y="128" text-anchor="middle" font-weight="600">POST /v1/messages</text>

  <line class="arrow" x1="386" y1="408" x2="280" y2="340" />
  <text class="sub" x="332" y="392" text-anchor="middle" font-weight="600">response · SSE</text>
</svg>
