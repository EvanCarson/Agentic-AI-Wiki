<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Sandbox runtime feature matrix</title>
  <desc id="d">Heatmap comparing E2B, Modal, Daytona, and Anthropic Code Execution across six axes: isolation strength, lifecycle ownership, persistent filesystem, network reach, package install, and managed-vs-self. Strength indicated by fill color from light (weak) through medium to dark accent (strong).</desc>
  <style>
    .chart-title  { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; fill: currentColor; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="28" text-anchor="middle">Sandbox runtime feature matrix</text>

  <!--
    Layout:
    - Left margin for row labels: 170px
    - 6 columns of width 120px each ≈ 720px total → x runs 170..890
    - Col x centers: 230, 350, 470, 590, 710, 830
    - Rows: 4 rows of height 56px starting y=70
    - Row centers: 98, 154, 210, 266
    - Header text y≈54/67
    - Legend at y≈338
  -->

  <!-- Column headers -->
  <text class="col-head" x="230" y="54">Isolation</text>
  <text class="col-head" x="230" y="67">strength</text>

  <text class="col-head" x="350" y="54">Lifecycle</text>
  <text class="col-head" x="350" y="67">owner</text>

  <text class="col-head" x="470" y="54">Persistent</text>
  <text class="col-head" x="470" y="67">FS</text>

  <text class="col-head" x="590" y="54">Network</text>
  <text class="col-head" x="590" y="67">reach</text>

  <text class="col-head" x="710" y="54">Package</text>
  <text class="col-head" x="710" y="67">install</text>

  <text class="col-head" x="830" y="54">Self-host</text>
  <text class="col-head" x="830" y="67">option</text>

  <!-- === Row 1: E2B === -->
  <text class="row-head" x="162" y="98">E2B</text>
  <!-- Isolation: strong (Firecracker microVM) -->
  <rect class="cell-strong" x="170" y="70" width="120" height="56" rx="4" />
  <text class="cell-text-inv" x="230" y="92">microVM</text>
  <text class="cell-text-inv" x="230" y="106">(Firecracker)</text>
  <!-- Lifecycle owner: medium (app-owned — power to you) -->
  <rect class="cell-strong" x="290" y="70" width="120" height="56" rx="4" />
  <text class="cell-text-inv" x="350" y="98">App-owned</text>
  <!-- Persistent FS: medium (within sandbox life) -->
  <rect class="cell-medium" x="410" y="70" width="120" height="56" rx="4" />
  <text class="cell-text" x="470" y="92">Within</text>
  <text class="cell-text" x="470" y="106">sandbox life</text>
  <!-- Network: strong (full) -->
  <rect class="cell-strong" x="530" y="70" width="120" height="56" rx="4" />
  <text class="cell-text-inv" x="590" y="98">Full</text>
  <!-- Package install: strong (apt + pip + anything) -->
  <rect class="cell-strong" x="650" y="70" width="120" height="56" rx="4" />
  <text class="cell-text-inv" x="710" y="92">apt + pip +</text>
  <text class="cell-text-inv" x="710" y="106">anything</text>
  <!-- Self-host: strong (OSS) -->
  <rect class="cell-strong" x="770" y="70" width="120" height="56" rx="4" />
  <text class="cell-text-inv" x="830" y="98">Yes (OSS)</text>

  <!-- === Row 2: Modal === -->
  <text class="row-head" x="162" y="154">Modal</text>
  <!-- Isolation: medium (gVisor) -->
  <rect class="cell-medium" x="170" y="126" width="120" height="56" rx="4" />
  <text class="cell-text" x="230" y="148">gVisor</text>
  <text class="cell-text" x="230" y="162">container</text>
  <!-- Lifecycle: medium (platform pools warm) -->
  <rect class="cell-medium" x="290" y="126" width="120" height="56" rx="4" />
  <text class="cell-text" x="350" y="148">Platform</text>
  <text class="cell-text" x="350" y="162">(warm pool)</text>
  <!-- Persistent FS: weak (volumes optional) -->
  <rect class="cell-weak" x="410" y="126" width="120" height="56" rx="4" />
  <text class="cell-text" x="470" y="148">Volumes</text>
  <text class="cell-text" x="470" y="162">opt-in</text>
  <!-- Network: strong (full) -->
  <rect class="cell-strong" x="530" y="126" width="120" height="56" rx="4" />
  <text class="cell-text-inv" x="590" y="154">Full</text>
  <!-- Package install: strong (Modal Image) -->
  <rect class="cell-strong" x="650" y="126" width="120" height="56" rx="4" />
  <text class="cell-text-inv" x="710" y="148">Modal Image</text>
  <text class="cell-text-inv" x="710" y="162">layer</text>
  <!-- Self-host: weak (hosted only) -->
  <rect class="cell-weak" x="770" y="126" width="120" height="56" rx="4" />
  <text class="cell-text" x="830" y="148">Hosted</text>
  <text class="cell-text" x="830" y="162">only</text>

  <!-- === Row 3: Daytona === -->
  <text class="row-head" x="162" y="210">Daytona</text>
  <!-- Isolation: weak (container default) -->
  <rect class="cell-weak" x="170" y="182" width="120" height="56" rx="4" />
  <text class="cell-text" x="230" y="204">Container</text>
  <text class="cell-text" x="230" y="218">(default)</text>
  <!-- Lifecycle: medium (workspace-owned) -->
  <rect class="cell-medium" x="290" y="182" width="120" height="56" rx="4" />
  <text class="cell-text" x="350" y="204">Workspace</text>
  <text class="cell-text" x="350" y="218">(long-lived)</text>
  <!-- Persistent FS: strong (workspace FS persists) -->
  <rect class="cell-strong" x="410" y="182" width="120" height="56" rx="4" />
  <text class="cell-text-inv" x="470" y="204">Workspace</text>
  <text class="cell-text-inv" x="470" y="218">FS persists</text>
  <!-- Network: strong (full) -->
  <rect class="cell-strong" x="530" y="182" width="120" height="56" rx="4" />
  <text class="cell-text-inv" x="590" y="210">Full</text>
  <!-- Package install: strong (devcontainer) -->
  <rect class="cell-strong" x="650" y="182" width="120" height="56" rx="4" />
  <text class="cell-text-inv" x="710" y="204">devcontainer</text>
  <text class="cell-text-inv" x="710" y="218">+ runtime</text>
  <!-- Self-host: strong (OSS) -->
  <rect class="cell-strong" x="770" y="182" width="120" height="56" rx="4" />
  <text class="cell-text-inv" x="830" y="204">Yes (OSS,</text>
  <text class="cell-text-inv" x="830" y="218">AGPL)</text>

  <!-- === Row 4: Anthropic Code Execution === -->
  <text class="row-head" x="162" y="262">Anthropic</text>
  <text class="row-head" x="162" y="278">Code Exec.</text>
  <!-- Isolation: medium (sandboxed container, opaque) -->
  <rect class="cell-medium" x="170" y="238" width="120" height="56" rx="4" />
  <text class="cell-text" x="230" y="260">Server</text>
  <text class="cell-text" x="230" y="274">sandbox</text>
  <!-- Lifecycle: strong (API-owned, zero work) -->
  <rect class="cell-strong" x="290" y="238" width="120" height="56" rx="4" />
  <text class="cell-text-inv" x="350" y="260">API-owned</text>
  <text class="cell-text-inv" x="350" y="274">(per convo)</text>
  <!-- Persistent FS: weak (1h, 1GB) -->
  <rect class="cell-weak" x="410" y="238" width="120" height="56" rx="4" />
  <text class="cell-text" x="470" y="260">1 hr,</text>
  <text class="cell-text" x="470" y="274">~1 GB</text>
  <!-- Network: weak (PyPI + allowlist) -->
  <rect class="cell-weak" x="530" y="238" width="120" height="56" rx="4" />
  <text class="cell-text" x="590" y="260">PyPI +</text>
  <text class="cell-text" x="590" y="274">allowlist</text>
  <!-- Package install: medium (pip only) -->
  <rect class="cell-medium" x="650" y="238" width="120" height="56" rx="4" />
  <text class="cell-text" x="710" y="266">pip only</text>
  <!-- Self-host: weak (no) -->
  <rect class="cell-weak" x="770" y="238" width="120" height="56" rx="4" />
  <text class="cell-text" x="830" y="266">No</text>

  <!-- Legend -->
  <rect class="legend-box-w" x="290" y="350" width="18" height="18" rx="3" />
  <text class="legend-text" x="315" y="359">Weak</text>

  <rect class="legend-box-m" x="410" y="350" width="18" height="18" rx="3" />
  <text class="legend-text" x="435" y="359">Medium</text>

  <rect class="legend-box-s" x="540" y="350" width="18" height="18" rx="3" />
  <text class="legend-text" x="565" y="359">Strong</text>
</svg>
