<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Isolation primitive</title>
  <desc id="d">Four-column comparison of the isolation primitive each sandbox runtime relies on. E2B uses Firecracker microVMs — a hypervisor boundary with no shared kernel. Modal uses gVisor-protected containers, a userspace kernel that intercepts syscalls. Daytona uses standard container or VM workspace isolation, configured for trusted developer code by default. Anthropic Code Execution uses an undocumented server-side sandboxed container.</desc>
  <style>
    .chart-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="28">Isolation primitive</text>

  <!-- Column 1: E2B — ACCENT (strongest boundary) -->
  <rect class="card-accent" x="10" y="44" width="210" height="220" rx="8" />
  <text class="col-head-inv" x="115" y="72">E2B</text>
  <text class="body-text-inv" x="115" y="110">Firecracker microVM</text>
  <text class="body-text-inv" x="115" y="128">(hypervisor boundary,</text>
  <text class="body-text-inv" x="115" y="146">own kernel per sandbox)</text>
  <text class="body-text-inv" x="115" y="180">strongest</text>

  <!-- Column 2: Modal — SOFT (gVisor) -->
  <rect class="card-soft" x="230" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="335" y="72">Modal</text>
  <text class="body-text" x="335" y="110">gVisor (runsc)</text>
  <text class="body-text" x="335" y="128">userspace kernel</text>
  <text class="body-text" x="335" y="146">intercepts syscalls</text>
  <text class="body-text" x="335" y="180">software boundary</text>

  <!-- Column 3: Daytona — NEUTRAL (relaxed default) -->
  <rect class="card-neutral" x="450" y="44" width="210" height="220" rx="8" />
  <text class="col-head" x="555" y="72">Daytona</text>
  <text class="body-text" x="555" y="110">Standard container</text>
  <text class="body-text" x="555" y="128">(or VM) workspace</text>
  <text class="body-text" x="555" y="146">trusted dev code by default</text>
  <text class="body-text" x="555" y="180">harden with policies</text>

  <!-- Column 4: Anthropic Code Execution — SOFT (opaque) -->
  <rect class="card-soft" x="670" y="44" width="220" height="220" rx="8" />
  <text class="col-head" x="780" y="72">Anthropic</text>
  <text class="col-head" x="780" y="90">Code Execution</text>
  <text class="body-text" x="780" y="118">"Secure, sandboxed"</text>
  <text class="body-text" x="780" y="136">internals undocumented</text>
  <text class="body-text" x="780" y="154">trust the vendor story</text>
  <text class="body-text" x="780" y="188">opaque</text>
</svg>
