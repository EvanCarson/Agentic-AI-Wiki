<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Daytona logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- IDE workspace window: outer frame with title bar -->
  <rect x="5" y="7" width="22" height="18" rx="2" fill="none" stroke="var(--paper)" stroke-width="1.75" />
  <!-- Title bar line -->
  <line x1="5" y1="11.5" x2="27" y2="11.5" stroke="var(--paper)" stroke-width="1.5" />
  <!-- Three traffic-light dots in the title bar -->
  <circle cx="7.5" cy="9.25" r="0.85" fill="var(--paper)" opacity="0.7" />
  <circle cx="10" cy="9.25" r="0.85" fill="var(--paper)" opacity="0.7" />
  <circle cx="12.5" cy="9.25" r="0.85" fill="var(--paper)" opacity="0.7" />
  <!-- Code lines inside the workspace -->
  <line x1="8" y1="15" x2="15" y2="15" stroke="var(--paper)" stroke-width="1.4" stroke-linecap="round" />
  <line x1="8" y1="18" x2="20" y2="18" stroke="var(--paper)" stroke-width="1.4" stroke-linecap="round" />
  <line x1="8" y1="21" x2="13" y2="21" stroke="var(--paper)" stroke-width="1.4" stroke-linecap="round" />
</svg>
