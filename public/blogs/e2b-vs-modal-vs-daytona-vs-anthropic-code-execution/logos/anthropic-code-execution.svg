<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Anthropic Code Execution logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Outer container suggesting server-side sandbox -->
  <rect x="5" y="8" width="22" height="16" rx="3" fill="none" stroke="var(--paper)" stroke-width="1.75" />
  <!-- Code brackets inside the container: { } -->
  <path d="M 11 13 Q 9 13 9 14.5 L 9 15.5 Q 9 16 8 16 Q 9 16 9 16.5 L 9 17.5 Q 9 19 11 19" fill="none" stroke="var(--paper)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 21 13 Q 23 13 23 14.5 L 23 15.5 Q 23 16 24 16 Q 23 16 23 16.5 L 23 17.5 Q 23 19 21 19" fill="none" stroke="var(--paper)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Three running dots in middle suggesting executing code -->
  <circle cx="14" cy="16" r="1.1" fill="var(--paper)" />
  <circle cx="16" cy="16" r="1.1" fill="var(--paper)" opacity="0.7" />
  <circle cx="18" cy="16" r="1.1" fill="var(--paper)" opacity="0.45" />
</svg>
