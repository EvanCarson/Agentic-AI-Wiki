<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Modal logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Three stacked function blocks suggesting serverless function pool -->
  <rect x="7" y="7" width="18" height="5" rx="1.5" fill="var(--paper)" opacity="0.95" />
  <rect x="7" y="13.5" width="18" height="5" rx="1.5" fill="var(--paper)" opacity="0.75" />
  <rect x="7" y="20" width="18" height="5" rx="1.5" fill="var(--paper)" opacity="0.55" />
  <!-- Pool indicator dots on left side -->
  <circle cx="10" cy="9.5" r="1" fill="var(--accent, #d4421e)" />
  <circle cx="10" cy="16" r="1" fill="var(--accent, #d4421e)" />
  <circle cx="10" cy="22.5" r="1" fill="var(--accent, #d4421e)" />
</svg>
