<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Modal architecture</title>
  <desc id="d">Your agent deploys a Modal app — a Python file with @app.function decorators and an optional Sandbox primitive. Modal's platform pools warm gVisor-isolated containers; calls hit a warm container if available, scale up otherwise. The platform owns provisioning, scheduling, and warm pool eviction.</desc>
  <style>
    .box      { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero     { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj      { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound    { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- AGENT APP (left, dashed) -->
  <rect class="bound" x="28" y="58" width="270" height="370" rx="10" ry="10" />
  <text class="sub" x="163" y="80" text-anchor="middle" font-weight="600">YOUR AGENT APP</text>

  <rect class="box" x="46" y="100" width="234" height="60" rx="8" ry="8" />
  <text class="label" x="163" y="124" text-anchor="middle" font-weight="600">Agent loop</text>
  <text class="sub" x="163" y="142" text-anchor="middle">tool call → modal function / Sandbox</text>

  <rect class="adj" x="46" y="180" width="234" height="120" rx="8" ry="8" />
  <text class="label" x="163" y="204" text-anchor="middle" font-weight="600">Modal app (Python)</text>
  <text class="sub" x="163" y="224" text-anchor="middle">@app.function(image=...)</text>
  <text class="sub" x="163" y="240" text-anchor="middle">def run(code): exec(code)</text>
  <text class="sub" x="163" y="258" text-anchor="middle">modal.Sandbox.create()</text>
  <text class="sub" x="163" y="276" text-anchor="middle">deploy once · call many</text>

  <rect class="box" x="46" y="320" width="234" height="60" rx="8" ry="8" />
  <text class="label" x="163" y="344" text-anchor="middle" font-weight="600">Platform owns lifecycle</text>
  <text class="sub" x="163" y="362" text-anchor="middle">you write code · Modal runs it</text>

  <!-- MODAL PLATFORM (right, hero) -->
  <rect class="hero" x="360" y="50" width="512" height="400" rx="10" ry="10" />
  <text class="label-inv" x="616" y="80" text-anchor="middle" font-weight="600">Modal platform (managed)</text>

  <rect class="box" x="388" y="100" width="220" height="60" rx="8" ry="8" />
  <text class="label" x="498" y="124" text-anchor="middle" font-weight="600">Scheduler · queue</text>
  <text class="sub" x="498" y="142" text-anchor="middle">routes the call</text>

  <rect class="box" x="628" y="100" width="220" height="60" rx="8" ry="8" />
  <text class="label" x="738" y="124" text-anchor="middle" font-weight="600">Image builder</text>
  <text class="sub" x="738" y="142" text-anchor="middle">layered Modal Image</text>

  <!-- Warm pool of three containers -->
  <rect class="box" x="388" y="176" width="460" height="120" rx="8" ry="8" />
  <text class="label" x="618" y="200" text-anchor="middle" font-weight="600">Warm container pool (gVisor-isolated)</text>

  <rect class="box" x="408" y="216" width="130" height="60" rx="6" ry="6" />
  <text class="label" x="473" y="240" text-anchor="middle" font-weight="600" font-size="12">Container</text>
  <text class="sub" x="473" y="258" text-anchor="middle">warm</text>

  <rect class="box" x="552" y="216" width="130" height="60" rx="6" ry="6" />
  <text class="label" x="617" y="240" text-anchor="middle" font-weight="600" font-size="12">Container</text>
  <text class="sub" x="617" y="258" text-anchor="middle">warm</text>

  <rect class="box" x="696" y="216" width="130" height="60" rx="6" ry="6" />
  <text class="label" x="761" y="240" text-anchor="middle" font-weight="600" font-size="12">Container</text>
  <text class="sub" x="761" y="258" text-anchor="middle">scaling up</text>

  <!-- Sandbox primitive + GPU pool -->
  <rect class="box" x="388" y="312" width="220" height="60" rx="8" ry="8" />
  <text class="label" x="498" y="336" text-anchor="middle" font-weight="600">Sandbox primitive</text>
  <text class="sub" x="498" y="354" text-anchor="middle">long-lived shell + exec</text>

  <rect class="box" x="628" y="312" width="220" height="60" rx="8" ry="8" />
  <text class="label" x="738" y="336" text-anchor="middle" font-weight="600">GPU pool</text>
  <text class="sub" x="738" y="354" text-anchor="middle">A10 / A100 / H100 on demand</text>

  <rect class="box" x="388" y="388" width="460" height="44" rx="8" ry="8" />
  <text class="label" x="618" y="414" text-anchor="middle" font-weight="600" font-size="13">gVisor (runsc) — userspace kernel intercepts syscalls</text>

  <!-- Internal arrows -->
  <line class="arrow" x1="498" y1="160" x2="498" y2="174" />
  <line class="arrow" x1="738" y1="160" x2="738" y2="174" />

  <!-- Cross-boundary arrows: two L-paths on different columns so they never
       overlap each other or their labels. -->
  <path class="arrow" d="M 280 200 L 315 200 L 315 130 L 386 130" />
  <text class="sub" x="335" y="112" text-anchor="middle" font-weight="600">function call</text>

  <path class="arrow" d="M 386 146 L 355 146 L 355 252 L 280 252" />
  <text class="sub" x="335" y="270" text-anchor="middle" font-weight="600">result</text>
</svg>
