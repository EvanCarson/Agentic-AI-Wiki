<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">E2B architecture</title>
  <desc id="d">The agent process on the left holds the SDK; it calls create, run_code, and kill on a Firecracker microVM provisioned by E2B. Inside the VM, a runtime daemon hosts the Python kernel, a shell, and a filesystem. The app owns every lifecycle decision.</desc>
  <style>
    .box      { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero     { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj      { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .bound    { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
    <marker id="arrStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- AGENT APP (left, dashed boundary — your code) -->
  <rect class="bound" x="28" y="58" width="270" height="370" rx="10" ry="10" />
  <text class="sub" x="163" y="80" text-anchor="middle" font-weight="600">YOUR AGENT APP</text>

  <rect class="box" x="46" y="100" width="234" height="60" rx="8" ry="8" />
  <text class="label" x="163" y="124" text-anchor="middle" font-weight="600">Agent loop</text>
  <text class="sub" x="163" y="142" text-anchor="middle">LangGraph / OpenAI SDK / yours</text>

  <rect class="adj" x="46" y="180" width="234" height="92" rx="8" ry="8" />
  <text class="label" x="163" y="204" text-anchor="middle" font-weight="600">E2B SDK</text>
  <text class="sub" x="163" y="222" text-anchor="middle">Sandbox.create()</text>
  <text class="sub" x="163" y="238" text-anchor="middle">sandbox.run_code()</text>
  <text class="sub" x="163" y="254" text-anchor="middle">sandbox.kill()</text>

  <rect class="box" x="46" y="296" width="234" height="80" rx="8" ry="8" />
  <text class="label" x="163" y="320" text-anchor="middle" font-weight="600">App owns lifecycle</text>
  <text class="sub" x="163" y="338" text-anchor="middle">create · timeout · reattach</text>
  <text class="sub" x="163" y="354" text-anchor="middle">forget kill() = your bill</text>

  <!-- E2B MICROVM (right, hero) -->
  <rect class="hero" x="360" y="50" width="512" height="400" rx="10" ry="10" />
  <text class="label-inv" x="616" y="80" text-anchor="middle" font-weight="600">Firecracker microVM (hypervisor-isolated)</text>

  <rect class="box" x="388" y="100" width="220" height="68" rx="8" ry="8" />
  <text class="label" x="498" y="124" text-anchor="middle" font-weight="600">Runtime daemon</text>
  <text class="sub" x="498" y="142" text-anchor="middle">RPC over the SDK channel</text>
  <text class="sub" x="498" y="158" text-anchor="middle">code / shell / files</text>

  <rect class="box" x="628" y="100" width="220" height="68" rx="8" ry="8" />
  <text class="label" x="738" y="124" text-anchor="middle" font-weight="600">Python kernel</text>
  <text class="sub" x="738" y="142" text-anchor="middle">long-running, stateful</text>
  <text class="sub" x="738" y="158" text-anchor="middle">imports persist across calls</text>

  <rect class="box" x="388" y="184" width="220" height="68" rx="8" ry="8" />
  <text class="label" x="498" y="208" text-anchor="middle" font-weight="600">Shell / bash</text>
  <text class="sub" x="498" y="226" text-anchor="middle">apt install · curl · npm</text>
  <text class="sub" x="498" y="242" text-anchor="middle">full Linux userspace</text>

  <rect class="box" x="628" y="184" width="220" height="68" rx="8" ry="8" />
  <text class="label" x="738" y="208" text-anchor="middle" font-weight="600">VM filesystem</text>
  <text class="sub" x="738" y="226" text-anchor="middle">/home/user · /tmp</text>
  <text class="sub" x="738" y="242" text-anchor="middle">files.read / files.write</text>

  <rect class="box" x="388" y="268" width="460" height="60" rx="8" ry="8" />
  <text class="label" x="618" y="290" text-anchor="middle" font-weight="600">Own kernel · own init · own /proc</text>
  <text class="sub" x="618" y="308" text-anchor="middle">no shared kernel with peers — KVM boundary</text>

  <rect class="box" x="388" y="344" width="460" height="76" rx="8" ry="8" />
  <text class="label" x="618" y="368" text-anchor="middle" font-weight="600">Template image (bring-your-own)</text>
  <text class="sub" x="618" y="386" text-anchor="middle">pre-baked deps cut boot to ~200ms</text>
  <text class="sub" x="618" y="402" text-anchor="middle">self-host control plane (Apache-2.0)</text>

  <!-- Cross-boundary arrows (SDK ↔ runtime daemon): two L-paths on different
       columns so they never overlap each other or their labels. -->
  <!-- Request: SDK out top-right → runtime daemon left, routed via x=315 -->
  <path class="arrow" d="M 280 200 L 315 200 L 315 134 L 386 134" />
  <text class="sub" x="335" y="116" text-anchor="middle" font-weight="600">SDK RPC</text>

  <!-- Response: runtime daemon left → SDK bottom-right, routed via x=355 -->
  <path class="arrow" d="M 386 152 L 355 152 L 355 252 L 280 252" />
  <text class="sub" x="335" y="270" text-anchor="middle" font-weight="600">stdout · files</text>
</svg>
