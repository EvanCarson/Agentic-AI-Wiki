<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where the graph store sits in an agent memory loop</title>
  <desc id="d">An agent turn produces a transcript that an extraction step turns into entities and relations. Those are written into the graph store on every turn, from many concurrent sessions at once, which is the hot path. Retrieval reads the same store with a combined vector and traversal query inside the turn's latency budget. The write path, not the read benchmark, is what the concurrency model of the store has to survive.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="box" x="24" y="52" width="216" height="96" />
  <text class="head" x="44" y="82">Agent turns</text>
  <text class="sub" x="44" y="108">many sessions at once</text>
  <text class="sub" x="44" y="130">each one ends in a transcript</text>

  <path class="arrow" d="M 244 100 L 300 100" />

  <rect class="adj" x="304" y="52" width="216" height="96" />
  <text class="head" x="324" y="82">Extraction</text>
  <text class="sub" x="324" y="108">entities, relations, episodes</text>
  <text class="sub" x="324" y="130">plus an embedding per node</text>

  <path class="arrow" d="M 412 152 L 412 214" />
  <text class="tag" x="424" y="188">WRITE, EVERY TURN</text>

  <rect class="hero" x="264" y="218" width="376" height="120" />
  <text class="head-inv" x="288" y="250">The graph store</text>
  <text class="sub-inv" x="288" y="278">concurrent writers from every session</text>
  <text class="sub-inv" x="288" y="300">plus deletes, merges and re-embeds</text>
  <text class="sub-inv" x="288" y="322">this is the hot path, and it is a write path</text>

  <path class="arrow" d="M 412 342 L 412 404" />
  <text class="tag" x="424" y="378">READ, INSIDE THE TURN</text>

  <rect class="box" x="264" y="408" width="376" height="72" />
  <text class="head" x="288" y="438">Hybrid retrieval</text>
  <text class="sub" x="288" y="464">vector entry point, then traversal, in one query</text>

  <path class="arrow" d="M 264 444 C 160 444 130 300 130 172" />
  <text class="sub" x="24" y="196">back into the</text>
  <text class="sub" x="24" y="216">next turn's context</text>

  <rect class="box" x="664" y="218" width="212" height="120" />
  <text class="head" x="684" y="248">What the benchmarks</text>
  <text class="head" x="684" y="268">measure</text>
  <text class="sub" x="684" y="296">read latency on a static graph</text>
  <text class="sub" x="684" y="318">loaded once, by one writer</text>
  <line x1="640" y1="278" x2="660" y2="278" stroke="var(--ink)" stroke-width="1" stroke-dasharray="3 4" opacity=".5" />
</svg>
