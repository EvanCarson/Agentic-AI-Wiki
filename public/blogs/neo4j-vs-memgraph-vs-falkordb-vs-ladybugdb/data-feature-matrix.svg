<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Four graph stores across the five axes that decide the pick</title>
  <desc id="d">A matrix with four rows for Neo4j, Memgraph, FalkorDB and LadybugDB, and five columns for licence freedom, embedded deployment, concurrent multi-writer support, first-party agent-memory framework drivers, and a managed cloud offering. Neo4j is medium on licence and strong on concurrency, drivers and cloud, but cannot be embedded. Memgraph is weak on licence and drivers, strong on concurrency. FalkorDB is weak on licence but strong on concurrency, drivers and cloud, and only partially embeddable. LadybugDB is the only strong licence and the only truly embedded engine, and is weak on concurrency, drivers and cloud.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); }
    .medium { fill: var(--accent-soft); }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cell-l   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .row    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .col    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; text-anchor: middle; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="head" x="24" y="32">What actually decides the pick</text>

  <text class="col" x="248" y="60">LICENCE</text>
  <text class="col" x="388" y="60">EMBEDDED</text>
  <text class="col" x="528" y="60">MULTI-WRITER</text>
  <text class="col" x="668" y="60">MEMORY DRIVERS</text>
  <text class="col" x="808" y="60">MANAGED CLOUD</text>

  <text class="row" x="24" y="100">Neo4j</text>
  <rect class="medium" x="180" y="70" width="136" height="50" rx="4" />
  <text class="cell-l" x="248" y="94">GPLv3 core</text>
  <text class="cell-l" x="248" y="108">closed EE</text>
  <rect class="weak" x="320" y="70" width="136" height="50" rx="4" />
  <text class="cell-l" x="388" y="100">server only</text>
  <rect class="strong" x="460" y="70" width="136" height="50" rx="4" />
  <text class="cell-inv" x="528" y="100">yes</text>
  <rect class="strong" x="600" y="70" width="136" height="50" rx="4" />
  <text class="cell-inv" x="668" y="94">every</text>
  <text class="cell-inv" x="668" y="108">framework</text>
  <rect class="strong" x="740" y="70" width="136" height="50" rx="4" />
  <text class="cell-inv" x="808" y="100">Aura</text>

  <text class="row" x="24" y="156">Memgraph</text>
  <rect class="weak" x="180" y="126" width="136" height="50" rx="4" />
  <text class="cell-l" x="248" y="150">BSL 1.1</text>
  <text class="cell-l" x="248" y="164">no DBaaS</text>
  <rect class="weak" x="320" y="126" width="136" height="50" rx="4" />
  <text class="cell-l" x="388" y="156">server only</text>
  <rect class="strong" x="460" y="126" width="136" height="50" rx="4" />
  <text class="cell-inv" x="528" y="150">yes</text>
  <text class="cell-inv" x="528" y="164">in-memory MVCC</text>
  <rect class="medium" x="600" y="126" width="136" height="50" rx="4" />
  <text class="cell-l" x="668" y="150">Mem0 yes</text>
  <text class="cell-l" x="668" y="164">Graphiti no</text>
  <rect class="medium" x="740" y="126" width="136" height="50" rx="4" />
  <text class="cell-l" x="808" y="150">yes, no</text>
  <text class="cell-l" x="808" y="164">public prices</text>

  <text class="row" x="24" y="212">FalkorDB</text>
  <rect class="weak" x="180" y="182" width="136" height="50" rx="4" />
  <text class="cell-l" x="248" y="206">SSPL</text>
  <text class="cell-l" x="248" y="220">not OSI</text>
  <rect class="medium" x="320" y="182" width="136" height="50" rx="4" />
  <text class="cell-l" x="388" y="206">Redis module</text>
  <text class="cell-l" x="388" y="220">lite bundles it</text>
  <rect class="strong" x="460" y="182" width="136" height="50" rx="4" />
  <text class="cell-inv" x="528" y="206">yes</text>
  <text class="cell-inv" x="528" y="220">Rust MVCC</text>
  <rect class="strong" x="600" y="182" width="136" height="50" rx="4" />
  <text class="cell-inv" x="668" y="206">Graphiti default</text>
  <text class="cell-inv" x="668" y="220">Mem0 plugin</text>
  <rect class="strong" x="740" y="182" width="136" height="50" rx="4" />
  <text class="cell-inv" x="808" y="206">free tier</text>
  <text class="cell-inv" x="808" y="220">published price</text>

  <text class="row" x="24" y="268">LadybugDB</text>
  <rect class="strong" x="180" y="238" width="136" height="50" rx="4" />
  <text class="cell-inv" x="248" y="268">MIT</text>
  <rect class="strong" x="320" y="238" width="136" height="50" rx="4" />
  <text class="cell-inv" x="388" y="262">in-process</text>
  <text class="cell-inv" x="388" y="276">one file</text>
  <rect class="weak" x="460" y="238" width="136" height="50" rx="4" />
  <text class="cell-l" x="528" y="262">one RW process</text>
  <text class="cell-l" x="528" y="276">or many RO</text>
  <rect class="weak" x="600" y="238" width="136" height="50" rx="4" />
  <text class="cell-l" x="668" y="268">none first-party</text>
  <rect class="weak" x="740" y="238" width="136" height="50" rx="4" />
  <text class="cell-l" x="808" y="268">none</text>

  <rect class="strong" x="180" y="330" width="22" height="14" rx="3" />
  <text class="leg" x="210" y="342">strong</text>
  <rect class="medium" x="290" y="330" width="22" height="14" rx="3" />
  <text class="leg" x="320" y="342">partial</text>
  <rect class="weak" x="400" y="330" width="22" height="14" rx="3" />
  <text class="leg" x="430" y="342">weak or absent</text>
  <text class="leg" x="580" y="342">as of August 2026</text>
</svg>
