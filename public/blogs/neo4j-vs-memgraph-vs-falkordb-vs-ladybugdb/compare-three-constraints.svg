<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Which store wins under which binding constraint</title>
  <desc id="d">Three columns, one per binding constraint. If the memory must run in-process with no server, LadybugDB is the only real answer and you accept that no memory framework ships a driver for it. If many sessions write concurrently to one shared graph, the server engines are the answer and the embedded one is disqualified by its single-writer rule. If you want the framework integration to already exist, FalkorDB and Neo4j are the answer, and the licence is the cost you pay.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
  </style>

  <rect class="adj" x="24" y="36" width="266" height="212" />
  <text class="head" x="44" y="66">It must be in-process</text>
  <text class="sub" x="44" y="100">no server, one file, ships</text>
  <text class="sub" x="44" y="122">inside the application</text>
  <text class="label" x="44" y="150">LadybugDB</text>
  <line x1="44" y1="172" x2="270" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="44" y="196">WHAT IT COSTS</text>
  <text class="label" x="44" y="220">you write the driver</text>

  <rect class="box" x="314" y="36" width="266" height="212" />
  <text class="head" x="334" y="66">Many writers, one graph</text>
  <text class="sub" x="334" y="100">every session writes on</text>
  <text class="sub" x="334" y="122">every turn, concurrently</text>
  <text class="label" x="334" y="150">Neo4j · Memgraph · FalkorDB</text>
  <line x1="334" y1="172" x2="560" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="334" y="196">WHAT IT COSTS</text>
  <text class="label" x="334" y="220">a server to operate</text>

  <rect class="hero" x="604" y="36" width="266" height="212" />
  <text class="head-inv" x="624" y="66">It must already plug in</text>
  <text class="sub-inv" x="624" y="100">the memory framework you</text>
  <text class="sub-inv" x="624" y="122">picked ships a driver</text>
  <text class="label-inv" x="624" y="150">FalkorDB · Neo4j</text>
  <line x1="624" y1="172" x2="850" y2="172" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag" x="624" y="196" fill="var(--paper)" opacity=".85">WHAT IT COSTS</text>
  <text class="label-inv" x="624" y="220">SSPL, or GPL plus a bill</text>
</svg>
