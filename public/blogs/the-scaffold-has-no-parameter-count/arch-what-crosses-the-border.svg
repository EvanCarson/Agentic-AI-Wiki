<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t1 d1">
  <title id="t1">What the draft reaches and what it exempts</title>
  <desc id="d1">A panel on the left lists what the draft places inside the controlled perimeter: model weights, key checkpoints, underlying source code, architecture designs, training and inference methods, AI agents that plan long horizons or coordinate other agents, computing clusters and information processing. Three arrows lead to three routes out. Hosted access through an API, website, app or software-as-a-service is reported as not an export. Public release as open-source weights or published papers is excluded. A private transfer of weights, checkpoints, code or methods, or an installation on overseas servers, is the route that needs a licence or is prohibited.</desc>
  <style>
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .box   { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr1); }
  </style>
  <defs>
    <marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="28">Announcement No. 48 — the exemptions define the control</text>

  <rect class="box" x="40" y="70" width="300" height="300" rx="8" />
  <text class="hd" x="58" y="98">Inside the perimeter</text>
  <text class="label" x="58" y="128">model weights</text>
  <text class="label" x="58" y="152">key checkpoints</text>
  <text class="label" x="58" y="176">underlying source code</text>
  <text class="label" x="58" y="200">architecture designs</text>
  <text class="label" x="58" y="224">training and inference methods</text>
  <text class="label" x="58" y="252">AI agents — long-horizon planning,</text>
  <text class="label" x="58" y="270">coordinating other agents</text>
  <text class="label" x="58" y="298">computing clusters</text>
  <text class="label" x="58" y="322">information processing</text>

  <path class="arrow" d="M 344 120 L 414 120" />
  <path class="arrow" d="M 344 240 L 414 240" />
  <path class="arrow" d="M 344 360 L 414 360" />

  <rect class="box" x="420" y="70" width="440" height="100" rx="8" />
  <text class="hd" x="440" y="100">Hosted access</text>
  <text class="label" x="440" y="126">API, website, app, software-as-a-service</text>
  <text class="label" x="440" y="150">Reported as not an export — out of scope.</text>

  <rect class="adj" x="420" y="190" width="440" height="100" rx="8" />
  <text class="hd" x="440" y="220">Public release</text>
  <text class="label" x="440" y="246">open-source weights, published research</text>
  <text class="label" x="440" y="270">Excluded. Publication is the fast track.</text>

  <rect class="hero" x="420" y="310" width="440" height="100" rx="8" />
  <text class="hd-inv" x="440" y="340">Private transfer</text>
  <text class="label-inv" x="440" y="366">weights, checkpoints, code, methods — or an</text>
  <text class="label-inv" x="440" y="390">install on overseas servers. Licence or ban.</text>

  <text class="sub" x="20" y="450">23 of the 40 proposed items are AI; across all 40, 14 would be banned outright and 26 would need a licence.</text>
  <text class="sub" x="20" y="470">Draft published 16 October 2026; public comment runs to 15 November. Scope and thresholds may change.</text>
</svg>
