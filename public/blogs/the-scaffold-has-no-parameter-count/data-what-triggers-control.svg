<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t2 d2">
  <title id="t2">What triggers control, and who controls the trigger</title>
  <desc id="d2">A four-row matrix. The training-compute test at ten to the twenty-sixth FLOPs is measurable only if published, does not move on its own, and is about your own artefact. The two-trillion-parameter test is measurable by you, does not move on its own, and is about your artefact. The global capability ranking is not measurable by you, moves on its own as other models are scored, and is about other people's scores. The AI-agent listing is a judgement rather than a measurement, moves on its own, and is about your scaffold. Three of the twelve cells are inside your control.</desc>
  <style>
    .in    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .out   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .ttl   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .colh  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 12px; fill: var(--ink); text-anchor: middle; }
    .rowl  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); text-anchor: middle; }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
  </style>

  <text class="ttl" x="20" y="28">Four ways into scope, and who holds each trigger</text>

  <text class="colh" x="445" y="64">Measurable by you</text>
  <text class="colh" x="625" y="64">Moves on its own</text>
  <text class="colh" x="800" y="64">About your artefact</text>

  <text class="rowl" x="20" y="115">Training compute at or above 10^26 FLOPs</text>
  <rect class="out" x="360" y="80" width="170" height="60" rx="6" />
  <text class="cell" x="445" y="115">Only if published</text>
  <rect class="in"  x="540" y="80" width="170" height="60" rx="6" />
  <text class="cell" x="625" y="115">No</text>
  <rect class="in"  x="720" y="80" width="160" height="60" rx="6" />
  <text class="cell" x="800" y="115">Yes</text>

  <text class="rowl" x="20" y="185">Two trillion parameters or more</text>
  <rect class="in"  x="360" y="150" width="170" height="60" rx="6" />
  <text class="cell" x="445" y="185">Yes</text>
  <rect class="in"  x="540" y="150" width="170" height="60" rx="6" />
  <text class="cell" x="625" y="185">No</text>
  <rect class="in"  x="720" y="150" width="160" height="60" rx="6" />
  <text class="cell" x="800" y="185">Yes</text>

  <text class="rowl" x="20" y="246">A global capability ranking</text>
  <text class="rowl" x="20" y="264">(reported as a top-ten placement)</text>
  <rect class="out" x="360" y="220" width="170" height="60" rx="6" />
  <text class="cell" x="445" y="255">No</text>
  <rect class="out" x="540" y="220" width="170" height="60" rx="6" />
  <text class="cell" x="625" y="255">Yes</text>
  <rect class="out" x="720" y="220" width="160" height="60" rx="6" />
  <text class="cell" x="800" y="255">Others' scores</text>

  <text class="rowl" x="20" y="316">Listed as an AI agent: plans long</text>
  <text class="rowl" x="20" y="334">horizons, coordinates other agents</text>
  <rect class="out" x="360" y="290" width="170" height="60" rx="6" />
  <text class="cell" x="445" y="325">A judgement</text>
  <rect class="out" x="540" y="290" width="170" height="60" rx="6" />
  <text class="cell" x="625" y="325">Yes</text>
  <rect class="out" x="720" y="290" width="160" height="60" rx="6" />
  <text class="cell" x="800" y="325">Your scaffold</text>

  <rect class="in" x="20" y="366" width="14" height="14" rx="3" />
  <text class="sub" x="44" y="378">A property of your artefact</text>
  <rect class="out" x="250" y="366" width="14" height="14" rx="3" />
  <text class="sub" x="274" y="378">Outside your control</text>
</svg>
