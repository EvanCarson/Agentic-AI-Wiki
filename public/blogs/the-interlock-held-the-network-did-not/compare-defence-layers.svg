<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Three defence layers and the assumption each one makes</title>
  <desc id="d">Three columns. Obscurity assumes reconnaissance is expensive and failed when the models mapped the plant from subnet boundaries alone. Segmentation assumes the boundary device is trustworthy and delayed rather than stopped the pivot. Hardware mode state assumes nothing about the network and held.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="20" y="28">What each layer assumes about the attacker</text>

  <text class="lbl" x="20" y="96">Assumes</text>
  <text class="lbl" x="20" y="206">Result</text>

  <rect class="hero" x="96" y="52" width="180" height="92" />
  <text class="hd-inv" x="186" y="82">Obscurity</text>
  <text class="vd-inv" x="186" y="108">recon is slow and</text>
  <text class="vd-inv" x="186" y="128">needs a specialist</text>

  <rect class="adj" x="360" y="52" width="180" height="92" />
  <text class="hd" x="450" y="82">Segmentation</text>
  <text class="vd" x="450" y="108">the boundary device</text>
  <text class="vd" x="450" y="128">stays trustworthy</text>

  <rect class="box" x="660" y="52" width="180" height="92" />
  <text class="hd" x="750" y="82">Hardware mode</text>
  <text class="vd" x="750" y="108">nothing about the</text>
  <text class="vd" x="750" y="128">network at all</text>

  <rect class="box" x="96" y="162" width="180" height="96" />
  <text class="vd" x="186" y="192">failed outright:</text>
  <text class="vd" x="186" y="214">arm limits derived</text>
  <text class="vd" x="186" y="236">from scratch</text>

  <rect class="box" x="360" y="162" width="180" height="96" />
  <text class="vd" x="450" y="192">bought 16 minutes</text>
  <text class="vd" x="450" y="214">and a trail;</text>
  <text class="vd" x="450" y="236">friction, not a wall</text>

  <rect class="box" x="660" y="162" width="180" height="96" />
  <text class="vd" x="750" y="192">held: remote start</text>
  <text class="vd" x="750" y="214">impossible while</text>
  <text class="vd" x="750" y="236">the switch is local</text>
</svg>
