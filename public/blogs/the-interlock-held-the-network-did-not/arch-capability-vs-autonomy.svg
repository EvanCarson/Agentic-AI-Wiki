<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">What the approval gate bounded, and what it did not</title>
  <desc id="d">The exercise chain runs from reconnaissance through target selection and exploitation path to physical action, with a human approval gate before each exploit and each physical effect. The gate bounded the exercise, but the reconnaissance, target selection and exploitation path were produced by the models, so the measurement is of capability rather than autonomy.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); text-anchor: middle; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .note   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--accent, #d4421e); }
    .brace  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .gate   { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="32">Capability was measured. Autonomy was supplied by the rules.</text>

  <rect class="hero" x="20" y="92" width="170" height="70" />
  <text class="label-inv" x="105" y="122">Reconnaissance</text>
  <text class="sub" x="105" y="142" style="fill: var(--paper); opacity: .8;">from subnets alone</text>
  <path class="arrow" d="M 194 127 L 236 127" />

  <rect class="hero" x="240" y="92" width="170" height="70" />
  <text class="label-inv" x="325" y="122">Target selection</text>
  <text class="sub" x="325" y="142" style="fill: var(--paper); opacity: .8;">production-linked</text>
  <path class="arrow" d="M 414 127 L 456 127" />

  <rect class="hero" x="460" y="92" width="170" height="70" />
  <text class="label-inv" x="545" y="122">Exploitation path</text>
  <text class="sub" x="545" y="142" style="fill: var(--paper); opacity: .8;">weaknesses chained</text>
  <path class="arrow" d="M 634 127 L 676 127" />

  <rect class="adj" x="680" y="92" width="200" height="70" />
  <text class="label" x="780" y="122">Physical action</text>
  <text class="sub" x="780" y="142">arm moved, zones mapped</text>

  <rect class="gate" x="20" y="200" width="860" height="64" rx="8" />
  <text class="label" x="450" y="226">Human approval before every exploit and every physical effect</text>
  <text class="sub" x="450" y="248">lab-safety control — present in this exercise, absent in an adversary's</text>

  <path class="arrow" d="M 105 196 L 105 172" />
  <path class="arrow" d="M 545 196 L 545 172" />
  <path class="arrow" d="M 780 196 L 780 172" />

  <text class="brace" x="20" y="316">Produced by the models</text>
  <rect class="box" x="20" y="332" width="610" height="56" />
  <text class="label" x="325" y="356">Recon, target choice, exploit chain — no code, docs or OT guidance given</text>
  <text class="sub" x="325" y="376">this is the part that transfers to an attacker who keeps no gate</text>

  <text class="brace" x="20" y="430">Supplied by the exercise</text>
  <rect class="box" x="20" y="446" width="610" height="44" />
  <text class="label" x="325" y="472">Sequencing across steps, recovery from dead ends, restraint</text>

  <text class="note" x="660" y="356">16 min</text>
  <text class="sub" x="762" y="356">net compromise</text>
  <text class="sub" x="762" y="374">to in-ICS action,</text>
  <text class="sub" x="762" y="392">with the gate on</text>
</svg>
