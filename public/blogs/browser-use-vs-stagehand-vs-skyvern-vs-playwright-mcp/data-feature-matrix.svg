<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Browser-agent framework feature comparison matrix</title>
  <desc id="d">Heatmap comparing browser-use, Stagehand, Skyvern, and Playwright MCP across five axes: structured (DOM/a11y) perception, vision perception, determinism and caching, RPA workflows, and permissive license. Strength shown from light neutral (weak) to solid accent (strong).</desc>
  <style>
    .chart-title  { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; fill: currentColor; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="32" text-anchor="middle">Feature strength by project</text>

  <!--
    Left margin for row labels: 160px
    5 columns × 136px = 680px; left edges 160/296/432/568/704; centers 228/364/500/636/772
    4 rows × 56px; header y=50-72; row tops 76/132/188/244; centers 104/160/216/272
  -->

  <!-- Column headers -->
  <text class="col-head" x="228" y="54">Structured</text>
  <text class="col-head" x="228" y="66">perception</text>

  <text class="col-head" x="364" y="54">Vision</text>
  <text class="col-head" x="364" y="66">perception</text>

  <text class="col-head" x="500" y="54">Determinism</text>
  <text class="col-head" x="500" y="66">&amp; caching</text>

  <text class="col-head" x="636" y="54">RPA</text>
  <text class="col-head" x="636" y="66">workflows</text>

  <text class="col-head" x="772" y="54">Permissive</text>
  <text class="col-head" x="772" y="66">license</text>

  <!-- ===== Row 1: browser-use ===== -->
  <text class="row-head" x="152" y="104">browser-use</text>
  <rect class="cell-strong" x="160" y="76" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="228" y="104">DOM-first</text>
  <rect class="cell-medium" x="296" y="76" width="136" height="56" rx="4" />
  <text class="cell-text" x="364" y="104">Optional</text>
  <rect class="cell-medium" x="432" y="76" width="136" height="56" rx="4" />
  <text class="cell-text" x="500" y="104">Partial</text>
  <rect class="cell-medium" x="568" y="76" width="136" height="56" rx="4" />
  <text class="cell-text" x="636" y="104">General</text>
  <rect class="cell-strong" x="704" y="76" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="772" y="104">MIT</text>

  <!-- ===== Row 2: Stagehand ===== -->
  <text class="row-head" x="152" y="160">Stagehand</text>
  <rect class="cell-strong" x="160" y="132" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="228" y="160">DOM + code</text>
  <rect class="cell-medium" x="296" y="132" width="136" height="56" rx="4" />
  <text class="cell-text" x="364" y="160">Hybrid</text>
  <rect class="cell-strong" x="432" y="132" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="500" y="160">Cache + code</text>
  <rect class="cell-medium" x="568" y="132" width="136" height="56" rx="4" />
  <text class="cell-text" x="636" y="160">Extract / act</text>
  <rect class="cell-strong" x="704" y="132" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="772" y="160">MIT</text>

  <!-- ===== Row 3: Skyvern ===== -->
  <text class="row-head" x="152" y="216">Skyvern</text>
  <rect class="cell-medium" x="160" y="188" width="136" height="56" rx="4" />
  <text class="cell-text" x="228" y="216">Secondary</text>
  <rect class="cell-strong" x="296" y="188" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="364" y="216">Vision-first</text>
  <rect class="cell-medium" x="432" y="188" width="136" height="56" rx="4" />
  <text class="cell-text" x="500" y="216">Workflows</text>
  <rect class="cell-strong" x="568" y="188" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="636" y="216">Purpose-built</text>
  <rect class="cell-weak" x="704" y="188" width="136" height="56" rx="4" />
  <text class="cell-text" x="772" y="216">AGPL-3.0</text>

  <!-- ===== Row 4: Playwright MCP ===== -->
  <text class="row-head" x="152" y="272">Playwright MCP</text>
  <rect class="cell-strong" x="160" y="244" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="228" y="272">a11y-tree</text>
  <rect class="cell-weak" x="296" y="244" width="136" height="56" rx="4" />
  <text class="cell-text" x="364" y="272">Opt-in caps</text>
  <rect class="cell-strong" x="432" y="244" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="500" y="272">Tool calls</text>
  <rect class="cell-weak" x="568" y="244" width="136" height="56" rx="4" />
  <text class="cell-text" x="636" y="272">No loop</text>
  <rect class="cell-strong" x="704" y="244" width="136" height="56" rx="4" />
  <text class="cell-text-inv" x="772" y="272">Apache-2.0</text>

  <!-- Legend -->
  <rect class="legend-box-w" x="160" y="330" width="16" height="16" rx="3" />
  <text class="legend-text" x="182" y="338">Weak</text>

  <rect class="legend-box-m" x="250" y="330" width="16" height="16" rx="3" />
  <text class="legend-text" x="272" y="338">Medium</text>

  <rect class="legend-box-s" x="360" y="330" width="16" height="16" rx="3" />
  <text class="legend-text" x="382" y="338">Strong</text>

</svg>
