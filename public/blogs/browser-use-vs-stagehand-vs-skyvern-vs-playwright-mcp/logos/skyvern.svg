<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Skyvern logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- A wyvern's swept wings — two chevron strokes suggesting flight (the "sky") -->
  <path d="M6 12 Q11 15 16 12 Q21 15 26 12" fill="none" stroke="var(--paper, #faf9f7)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M8 18 Q12 20.5 16 18 Q20 20.5 24 18" fill="none" stroke="var(--paper, #faf9f7)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <!-- Eye/head node at the apex -->
  <circle cx="16" cy="13" r="1.6" fill="var(--paper, #faf9f7)" />
</svg>
