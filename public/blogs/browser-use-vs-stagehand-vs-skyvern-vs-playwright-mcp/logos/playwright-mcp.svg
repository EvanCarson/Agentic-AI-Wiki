<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Playwright MCP logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- A connector/plug — MCP standardizes the browser as a pluggable tool surface -->
  <!-- Socket body -->
  <rect x="12" y="15" width="8" height="9" rx="2" fill="none" stroke="var(--paper, #faf9f7)" stroke-width="2" />
  <!-- Two prongs into the socket -->
  <line x1="14" y1="15" x2="14" y2="10" stroke="var(--paper, #faf9f7)" stroke-width="2" stroke-linecap="round" />
  <line x1="18" y1="15" x2="18" y2="10" stroke="var(--paper, #faf9f7)" stroke-width="2" stroke-linecap="round" />
  <!-- Cable out the bottom -->
  <line x1="16" y1="24" x2="16" y2="26" stroke="var(--paper, #faf9f7)" stroke-width="2" stroke-linecap="round" />
</svg>
