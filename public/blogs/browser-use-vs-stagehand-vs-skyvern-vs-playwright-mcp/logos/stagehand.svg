<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Stagehand logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Stage: a curtain arch framing the action -->
  <path d="M7 8 Q16 6 25 8" fill="none" stroke="var(--paper, #faf9f7)" stroke-width="1.8" stroke-linecap="round" />
  <!-- Automation cursor/pointer — the "hand" that acts on the stage -->
  <path d="M13 12 L13 24 L16 21 L18 25 L20 24 L18 20 L22 20 Z" fill="var(--paper, #faf9f7)" />
</svg>
