<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Two integration models: self-contained framework vs MCP server</title>
  <desc id="d">Left: a self-contained agent framework (browser-use, Stagehand, Skyvern) bundles the LLM, the agent loop, and the browser driver into one component your code calls, which drives the browser. Right: the MCP-server model (Playwright MCP) — a separate client agent owns the reasoning loop and calls the Playwright MCP server over MCP; the server exposes browser tools only and has no loop of its own, then drives the browser.</desc>
  <style>
    .title   { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .colhead { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .box     { fill: var(--paper-2, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero    { fill: var(--accent, #d4421e); }
    .soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: var(--ink, #1a1a1a); text-anchor: middle; dominant-baseline: central; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--paper, #faf9f7); text-anchor: middle; dominant-baseline: central; }
    .sub     { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink, #1a1a1a); opacity: 0.62; text-anchor: middle; dominant-baseline: central; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper, #faf9f7); opacity: 0.92; text-anchor: middle; dominant-baseline: central; }
    .arrow   { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .arrlbl  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-style: italic; fill: var(--ink, #1a1a1a); opacity: 0.7; }
    .caption { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; fill: var(--ink, #1a1a1a); opacity: 0.7; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="title" x="450" y="32">Two ways to wire an LLM to a browser</text>

  <!-- ================= LEFT: self-contained framework ================= -->
  <text class="colhead" x="250" y="74">Self-contained framework</text>

  <!-- Box 1: your code -->
  <rect class="box" x="100" y="92" width="300" height="50" rx="8" />
  <text class="label" x="250" y="117">Your application code</text>
  <line class="arrow" x1="250" y1="142" x2="250" y2="178" />

  <!-- Box 2: hero framework (bundled) -->
  <rect class="hero" x="100" y="180" width="300" height="78" rx="8" />
  <text class="label-inv" x="250" y="205">Agent framework</text>
  <text class="sub-inv" x="250" y="228">LLM + agent loop + browser driver</text>
  <text class="sub-inv" x="250" y="244">— bundled in one component —</text>
  <line class="arrow" x1="250" y1="258" x2="250" y2="294" />

  <!-- Box 3: browser -->
  <rect class="box" x="100" y="296" width="300" height="50" rx="8" />
  <text class="label" x="250" y="321">Browser (Chromium)</text>

  <!-- ================= RIGHT: MCP-server model ================= -->
  <text class="colhead" x="650" y="74">MCP-server model</text>

  <!-- Box 1: client agent owns the loop -->
  <rect class="soft" x="500" y="92" width="300" height="66" rx="8" />
  <text class="label" x="650" y="113">Client agent</text>
  <text class="sub" x="650" y="134">Claude · Cursor · your model</text>
  <text class="sub" x="650" y="149">owns the reasoning + planning loop</text>
  <line class="arrow" x1="650" y1="158" x2="650" y2="194" />
  <text class="arrlbl" x="662" y="180">MCP (JSON-RPC)</text>

  <!-- Box 2: hero MCP server (tools only) -->
  <rect class="hero" x="500" y="196" width="300" height="66" rx="8" />
  <text class="label-inv" x="650" y="217">Playwright MCP server</text>
  <text class="sub-inv" x="650" y="240">browser tools only — no loop of its own</text>
  <line class="arrow" x1="650" y1="262" x2="650" y2="298" />

  <!-- Box 3: browser -->
  <rect class="box" x="500" y="300" width="300" height="50" rx="8" />
  <text class="label" x="650" y="325">Browser (Chromium)</text>

  <!-- Caption -->
  <text class="caption" x="450" y="404">Left — browser-use, Stagehand, Skyvern bundle the model, the loop, and the driver together.</text>
  <text class="caption" x="450" y="424">Right — Playwright MCP exposes only browser tools; whichever client model you plug in brings the loop.</text>

</svg>
