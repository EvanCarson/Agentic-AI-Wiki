<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">The perception spectrum: structured to visual</title>
  <desc id="d">A horizontal axis from structured DOM/accessibility-tree perception on the left to visual screenshot perception on the right. Playwright MCP and browser-use sit toward the structured end, Stagehand in the hybrid middle, and Skyvern toward the visual end. The structured end is faster, cheaper, and brittle to layout change; the visual end generalizes across redesigns but is slower and pricier.</desc>
  <style>
    .title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .endcap { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .endsub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: 0.6; }
    .toolbox{ fill: var(--accent, #d4421e); }
    .toollbl{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #faf9f7); text-anchor: middle; dominant-baseline: central; }
    .stem   { stroke: currentColor; stroke-width: 1.25; }
    .marker { fill: var(--paper, #faf9f7); stroke: var(--accent, #d4421e); stroke-width: 2.5; }
  </style>
  <defs>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--accent, #d4421e)" />
      <stop offset="1" stop-color="var(--accent-soft, #f5c5b8)" />
    </linearGradient>
  </defs>

  <text class="title" x="450" y="34">How each project perceives the page</text>

  <!-- End-caption headers (top corners, clear of everything) -->
  <text class="endcap" x="110" y="72">STRUCTURED</text>
  <text class="endsub" x="110" y="89">DOM · accessibility tree</text>
  <text class="endcap" x="790" y="72" text-anchor="end">VISUAL</text>
  <text class="endsub" x="790" y="89" text-anchor="end">screenshots · pixels</text>

  <!-- ===== Tool labels (all above the axis) with short stems ===== -->
  <!-- Playwright MCP @ x=180 -->
  <rect class="toolbox" x="118" y="150" width="124" height="28" rx="6" />
  <text class="toollbl" x="180" y="165">Playwright MCP</text>
  <line class="stem" x1="180" y1="178" x2="180" y2="204" />
  <!-- browser-use @ x=320 -->
  <rect class="toolbox" x="268" y="150" width="104" height="28" rx="6" />
  <text class="toollbl" x="320" y="165">browser-use</text>
  <line class="stem" x1="320" y1="178" x2="320" y2="204" />
  <!-- Stagehand @ x=470 -->
  <rect class="toolbox" x="424" y="150" width="92" height="28" rx="6" />
  <text class="toollbl" x="470" y="165">Stagehand</text>
  <line class="stem" x1="470" y1="178" x2="470" y2="204" />
  <!-- Skyvern @ x=690 -->
  <rect class="toolbox" x="648" y="150" width="84" height="28" rx="6" />
  <text class="toollbl" x="690" y="165">Skyvern</text>
  <line class="stem" x1="690" y1="178" x2="690" y2="204" />

  <!-- Spectrum bar -->
  <rect x="110" y="210" width="680" height="14" rx="7" fill="url(#spec)" />
  <!-- Markers sit on the bar -->
  <circle class="marker" cx="180" cy="217" r="8" />
  <circle class="marker" cx="320" cy="217" r="8" />
  <circle class="marker" cx="470" cy="217" r="8" />
  <circle class="marker" cx="690" cy="217" r="8" />

  <!-- End descriptors (below the bar, at the two ends — no stems here) -->
  <text class="endsub" x="110" y="256">faster · cheaper</text>
  <text class="endsub" x="110" y="272">brittle to layout change</text>
  <text class="endsub" x="790" y="256" text-anchor="end">robust to redesigns</text>
  <text class="endsub" x="790" y="272" text-anchor="end">slower · pricier per step</text>

</svg>
