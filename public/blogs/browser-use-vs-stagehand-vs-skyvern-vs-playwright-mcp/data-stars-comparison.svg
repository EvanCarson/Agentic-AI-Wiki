<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">GitHub stars comparison — browser-use, Playwright MCP, Stagehand, Skyvern</title>
  <desc id="d">Horizontal bar chart comparing approximate GitHub stars in thousands (snapshot 2026-07-14): browser-use leads at ~105k, followed by Playwright MCP at ~35k, Stagehand at ~23.5k, and Skyvern at ~22k.</desc>
  <style>
    .chart-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; fill: currentColor; }
    .proj-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .bar-val     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; dominant-baseline: central; }
    .grid-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--muted, #888); text-anchor: middle; }
    .grid-line   { stroke: var(--border-soft, #e0e0e0); stroke-width: 1; stroke-dasharray: 3 4; }
    .bar-accent  { fill: var(--accent, #d4421e); }
    .bar-adj     { fill: var(--accent-soft, #f5c5b8); }
    .bar-neutral { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="36" text-anchor="middle">GitHub stars (thousands, snapshot 2026-07-14)</text>

  <!--
    Chart area: left margin 220, right margin 80, top 68, bottom 55
    Max value 120k over 600px  ->  5 px per 1k
    Grid x: 0->220, 20k->320, 40k->420, 60k->520, 80k->620, 100k->720, 120k->820
    4 rows, bar height 46, gap 18; row tops 75/139/203/267; centers 98/162/226/290
  -->

  <!-- Grid lines -->
  <line class="grid-line" x1="220" y1="68" x2="220" y2="318" />
  <line class="grid-line" x1="320" y1="68" x2="320" y2="318" />
  <line class="grid-line" x1="420" y1="68" x2="420" y2="318" />
  <line class="grid-line" x1="520" y1="68" x2="520" y2="318" />
  <line class="grid-line" x1="620" y1="68" x2="620" y2="318" />
  <line class="grid-line" x1="720" y1="68" x2="720" y2="318" />
  <line class="grid-line" x1="820" y1="68" x2="820" y2="318" />

  <!-- Baseline -->
  <line x1="220" y1="318" x2="820" y2="318" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" />

  <!-- Grid labels -->
  <text class="grid-label" x="220" y="334">0</text>
  <text class="grid-label" x="320" y="334">20k</text>
  <text class="grid-label" x="420" y="334">40k</text>
  <text class="grid-label" x="520" y="334">60k</text>
  <text class="grid-label" x="620" y="334">80k</text>
  <text class="grid-label" x="720" y="334">100k</text>
  <text class="grid-label" x="820" y="334">120k stars</text>

  <!-- Row 1: browser-use — 105k — accent (leader). width = 105 * 5 = 525 -->
  <text class="proj-label" x="212" y="98">browser-use</text>
  <rect class="bar-accent" x="220" y="75" width="525" height="46" rx="5" ry="5" />
  <text class="bar-val" x="753" y="98" style="fill: var(--accent, #d4421e);">~105k</text>

  <!-- Row 2: Playwright MCP — 35k — accent-soft. width = 35 * 5 = 175 -->
  <text class="proj-label" x="212" y="162">Playwright MCP</text>
  <rect class="bar-adj" x="220" y="139" width="175.5" height="46" rx="5" ry="5" />
  <text class="bar-val" x="404" y="162" style="fill: var(--ink, #1a1a1a);">~35.1k</text>

  <!-- Row 3: Stagehand — 23.5k — paper-2 (neutral). width = 23.5 * 5 = 117.5 -->
  <text class="proj-label" x="212" y="226">Stagehand</text>
  <rect class="bar-neutral" x="220" y="203" width="117.5" height="46" rx="5" ry="5" />
  <text class="bar-val" x="345.5" y="226" style="fill: var(--muted, #888);">~23.5k</text>

  <!-- Row 4: Skyvern — 22k — paper-2 (neutral). width = 22 * 5 = 110 -->
  <text class="proj-label" x="212" y="290">Skyvern</text>
  <rect class="bar-neutral" x="220" y="267" width="111" height="46" rx="5" ry="5" />
  <text class="bar-val" x="339" y="290" style="fill: var(--muted, #888);">~22.2k</text>

</svg>
