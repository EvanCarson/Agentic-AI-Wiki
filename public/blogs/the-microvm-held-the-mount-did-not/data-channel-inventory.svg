<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="ct cd">
  <title id="ct">Exposure of each channel a coding-agent sandbox opens through its boundary</title>
  <desc id="cd">A four-by-four matrix. Rows are the workspace file share, the host socket relay, network egress, and credential passthrough. Columns are whether the channel can be removed, how much of its input the guest controls, whether host-side code parses that input, and what a failure reaches. The workspace share is high exposure on all four: it can never be removed, the guest controls it fully, host code parses it, and failure reaches the host filesystem. The socket relay is optional but otherwise high. Network egress is restrictable and medium. Credential passthrough is avoidable and guest-opaque, but a failure reaches accounts directly.</desc>
  <style>
    .hi   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .mid  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .lo   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .cell     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .row  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .col  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .ttl  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .leg  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
  </style>

  <text class="ttl" x="20" y="26">Exposure of each channel, by how much guest-controlled input reaches host code</text>

  <text class="col" x="335" y="62" text-anchor="middle">Can you remove it?</text>
  <text class="col" x="495" y="62" text-anchor="middle">Guest controls input</text>
  <text class="col" x="655" y="62" text-anchor="middle">Host-side parser</text>
  <text class="col" x="815" y="62" text-anchor="middle">Failure reaches</text>

  <text class="row" x="20" y="112">Workspace file share</text>
  <rect class="hi"  x="262" y="76" width="146" height="54" />
  <text class="cell-inv" x="335" y="108" text-anchor="middle">Never</text>
  <rect class="hi"  x="422" y="76" width="146" height="54" />
  <text class="cell-inv" x="495" y="108" text-anchor="middle">Fully</text>
  <rect class="hi"  x="582" y="76" width="146" height="54" />
  <text class="cell-inv" x="655" y="108" text-anchor="middle">Yes</text>
  <rect class="hi"  x="742" y="76" width="146" height="54" />
  <text class="cell-inv" x="815" y="108" text-anchor="middle">Host filesystem</text>

  <text class="row" x="20" y="180">Host socket relay</text>
  <rect class="lo"  x="262" y="144" width="146" height="54" />
  <text class="cell" x="335" y="176" text-anchor="middle">Optional</text>
  <rect class="hi"  x="422" y="144" width="146" height="54" />
  <text class="cell-inv" x="495" y="176" text-anchor="middle">Fully</text>
  <rect class="hi"  x="582" y="144" width="146" height="54" />
  <text class="cell-inv" x="655" y="176" text-anchor="middle">Yes</text>
  <rect class="mid" x="742" y="144" width="146" height="54" />
  <text class="cell" x="815" y="176" text-anchor="middle">Local services</text>

  <text class="row" x="20" y="248">Network egress</text>
  <rect class="mid" x="262" y="212" width="146" height="54" />
  <text class="cell" x="335" y="244" text-anchor="middle">Restrictable</text>
  <rect class="hi"  x="422" y="212" width="146" height="54" />
  <text class="cell-inv" x="495" y="244" text-anchor="middle">Fully</text>
  <rect class="mid" x="582" y="212" width="146" height="54" />
  <text class="cell" x="655" y="244" text-anchor="middle">Partly</text>
  <rect class="mid" x="742" y="212" width="146" height="54" />
  <text class="cell" x="815" y="244" text-anchor="middle">Exfiltration</text>

  <text class="row" x="20" y="316">Credential passthrough</text>
  <rect class="lo"  x="262" y="280" width="146" height="54" />
  <text class="cell" x="335" y="312" text-anchor="middle">Avoidable</text>
  <rect class="lo"  x="422" y="280" width="146" height="54" />
  <text class="cell" x="495" y="312" text-anchor="middle">No</text>
  <rect class="lo"  x="582" y="280" width="146" height="54" />
  <text class="cell" x="655" y="312" text-anchor="middle">No</text>
  <rect class="hi"  x="742" y="280" width="146" height="54" />
  <text class="cell-inv" x="815" y="312" text-anchor="middle">Accounts</text>

  <rect class="lo"  x="262" y="358" width="18" height="18" />
  <text class="leg" x="288" y="372">Low exposure</text>
  <rect class="mid" x="404" y="358" width="18" height="18" />
  <text class="leg" x="430" y="372">Medium</text>
  <rect class="hi"  x="524" y="358" width="18" height="18" />
  <text class="leg" x="550" y="372">High — where both CVEs landed</text>
</svg>
