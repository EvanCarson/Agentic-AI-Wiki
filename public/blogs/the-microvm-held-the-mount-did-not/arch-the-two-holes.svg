<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="mt md">
  <title id="mt">Where the two Docker Sandboxes escapes crossed the boundary</title>
  <desc id="md">A coding agent runs as root inside a microVM with its own kernel and Docker daemon. A hardware virtualisation boundary separates it from the host, and neither vulnerability crossed that boundary directly. Two channels pass through it by design: the virtio-fs workspace share and the guest-to-host Unix domain socket relay. Both are serviced by a virtual machine monitor process running as the ordinary desktop user, and both were the location of a symlink race. Behind that process sit the rest of the home directory, credentials and other repositories.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .wall   { fill: var(--ink); opacity: .85; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .7; letter-spacing: .06em; }
    .cve    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--accent, #d4421e); }
    .frame  { fill: none; stroke: var(--border-soft); stroke-width: 1.25; rx: 10; ry: 10; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#marr); marker-start: url(#marr); }
  </style>
  <defs>
    <marker id="marr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="30" y="34">GUEST</text>
  <text class="head" x="540" y="34">HOST (macOS)</text>

  <rect class="frame" x="20" y="48" width="360" height="420" />
  <rect class="frame" x="520" y="48" width="360" height="420" />

  <rect class="adj" x="48" y="84" width="304" height="76" />
  <text class="label" x="200" y="116" text-anchor="middle">Coding agent, running as root</text>
  <text class="sub" x="200" y="138" text-anchor="middle">permission prompts disabled, unattended</text>

  <rect class="box" x="48" y="184" width="144" height="64" />
  <text class="label" x="120" y="212" text-anchor="middle">Guest kernel</text>
  <text class="sub" x="120" y="232" text-anchor="middle">its own</text>

  <rect class="box" x="208" y="184" width="144" height="64" />
  <text class="label" x="280" y="212" text-anchor="middle">Docker daemon</text>
  <text class="sub" x="280" y="232" text-anchor="middle">its own</text>

  <rect class="box" x="48" y="272" width="304" height="64" />
  <text class="label" x="200" y="300" text-anchor="middle">Workspace, mounted read-write</text>
  <text class="sub" x="200" y="320" text-anchor="middle">guest controls every path inside it</text>

  <text class="sub" x="200" y="380" text-anchor="middle">Treat as hostile on some fraction of runs:</text>
  <text class="sub" x="200" y="400" text-anchor="middle">one injected instruction is enough</text>

  <rect class="wall" x="440" y="48" width="14" height="420" rx="4" ry="4" />
  <text class="head" x="447" y="40" text-anchor="middle">BOUNDARY</text>
  <text class="sub" x="447" y="486" text-anchor="middle">hardware virtualisation — not crossed by either CVE</text>

  <path class="arrow" d="M 356 206 L 538 206" />
  <text class="label" x="447" y="182" text-anchor="middle">virtio-fs workspace share</text>
  <text class="cve" x="447" y="232" text-anchor="middle">CVE-2026-77179</text>

  <path class="arrow" d="M 356 304 L 538 304" />
  <text class="label" x="447" y="280" text-anchor="middle">Unix socket relay</text>
  <text class="cve" x="447" y="330" text-anchor="middle">CVE-2026-79994</text>

  <rect class="hero" x="548" y="160" width="304" height="88" />
  <text class="label-inv" x="700" y="194" text-anchor="middle">Virtual machine monitor process</text>
  <text class="sub-inv" x="700" y="216" text-anchor="middle">parses guest-controlled paths;</text>
  <text class="sub-inv" x="700" y="232" text-anchor="middle">runs as your desktop user</text>

  <path class="arrow" d="M 700 254 L 700 300" />

  <rect class="box" x="548" y="308" width="304" height="120" />
  <text class="label" x="700" y="340" text-anchor="middle">Everything that user can read or write</text>
  <text class="sub" x="700" y="364" text-anchor="middle">SSH keys · cloud credentials · browser profiles</text>
  <text class="sub" x="700" y="384" text-anchor="middle">every other repository on the machine</text>
  <text class="sub" x="700" y="408" text-anchor="middle">this is the part you get to make smaller</text>
</svg>
