<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="LangSmith logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Magnifying glass on a trace timeline: trace bars at top, magnifier below -->
  <line x1="7" y1="9" x2="20" y2="9" stroke="var(--paper)" stroke-width="1.6" stroke-linecap="round" opacity="0.85" />
  <line x1="10" y1="13" x2="22" y2="13" stroke="var(--paper)" stroke-width="1.6" stroke-linecap="round" opacity="0.6" />
  <!-- Magnifier handle -->
  <line x1="22" y1="22.5" x2="26" y2="26.5" stroke="var(--paper)" stroke-width="2.2" stroke-linecap="round" />
  <!-- Magnifier lens -->
  <circle cx="17" cy="19" r="5" fill="none" stroke="var(--paper)" stroke-width="2" />
</svg>
