<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Arize Phoenix logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Stylized phoenix bird: ascending V wings with flame tail -->
  <!-- Body (small disc) -->
  <circle cx="16" cy="18" r="2" fill="var(--paper)" />
  <!-- Left wing -->
  <path d="M16 18 L8 11 L11 17 L7 16 Z" fill="var(--paper)" />
  <!-- Right wing -->
  <path d="M16 18 L24 11 L21 17 L25 16 Z" fill="var(--paper)" />
  <!-- Tail flame -->
  <path d="M16 20 L13.5 26 L16 24 L18.5 26 Z" fill="var(--paper)" opacity="0.85" />
  <!-- Head -->
  <circle cx="16" cy="13" r="1.6" fill="var(--paper)" />
</svg>
