<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Helicone logo">
  <!-- Rounded background square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent, #d4421e)" />
  <!-- Gateway / proxy: two stacked arrows passing through a vertical bar -->
  <!-- Vertical proxy bar -->
  <rect x="15" y="6" width="2" height="20" fill="var(--paper)" rx="1" />
  <!-- Top arrow: left -> right -->
  <line x1="6" y1="11" x2="22" y2="11" stroke="var(--paper)" stroke-width="1.8" stroke-linecap="round" />
  <polyline points="20,8.5 22.5,11 20,13.5" fill="none" stroke="var(--paper)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom arrow: right -> left -->
  <line x1="10" y1="21" x2="26" y2="21" stroke="var(--paper)" stroke-width="1.8" stroke-linecap="round" />
  <polyline points="12,18.5 9.5,21 12,23.5" fill="none" stroke="var(--paper)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
