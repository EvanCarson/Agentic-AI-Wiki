<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Evals + observability feature matrix</title>
  <desc id="d">Heatmap comparing LangSmith, Braintrust, Helicone, and Arize Phoenix across six axes: Dev-loop fit, CI eval workflow, Production telemetry, Drift/monitoring, OTel-native instrumentation, and Open-source self-host. Strength shown by fill from light (weak) to dark accent (strong).</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: currentColor; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: currentColor; text-anchor: end; dominant-baseline: central; }
    .cell-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
    .cell-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: var(--paper, #fff); text-anchor: middle; dominant-baseline: central; }
    .cell-weak    { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-medium  { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .cell-strong  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-w { fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-m { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-box-s { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; dominant-baseline: central; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="32" text-anchor="middle">Evals + observability feature matrix</text>

  <!--
    Layout:
    - Left margin for row labels: 160px
    - 6 columns of width 123px each ≈ 738px total
    - Col x centers: 222, 345, 468, 591, 714, 837
    - 4 rows of height 58px
    - Row tops: 80, 138, 196, 254
  -->

  <!-- Column headers -->
  <text class="col-head" x="222" y="55">Dev-loop</text>
  <text class="col-head" x="222" y="68">fit</text>

  <text class="col-head" x="345" y="55">CI eval</text>
  <text class="col-head" x="345" y="68">workflow</text>

  <text class="col-head" x="468" y="55">Prod</text>
  <text class="col-head" x="468" y="68">telemetry</text>

  <text class="col-head" x="591" y="55">Drift /</text>
  <text class="col-head" x="591" y="68">monitoring</text>

  <text class="col-head" x="714" y="55">OTel-</text>
  <text class="col-head" x="714" y="68">native</text>

  <text class="col-head" x="837" y="55">OSS self-</text>
  <text class="col-head" x="837" y="68">host</text>

  <!-- === Row 1: LangSmith === -->
  <text class="row-head" x="152" y="109">LangSmith</text>
  <!-- Dev-loop: strong -->
  <rect class="cell-strong" x="160" y="80" width="123" height="58" rx="4" />
  <text class="cell-text-inv" x="222" y="109">Hero</text>
  <!-- CI eval: medium -->
  <rect class="cell-medium" x="283" y="80" width="123" height="58" rx="4" />
  <text class="cell-text" x="345" y="109">SDK + UI</text>
  <!-- Prod telemetry: medium -->
  <rect class="cell-medium" x="406" y="80" width="123" height="58" rx="4" />
  <text class="cell-text" x="468" y="109">Online evals</text>
  <!-- Drift: weak -->
  <rect class="cell-weak" x="529" y="80" width="123" height="58" rx="4" />
  <text class="cell-text" x="591" y="109">Limited</text>
  <!-- OTel-native: medium -->
  <rect class="cell-medium" x="652" y="80" width="123" height="58" rx="4" />
  <text class="cell-text" x="714" y="109">Supports</text>
  <!-- OSS: weak -->
  <rect class="cell-weak" x="775" y="80" width="123" height="58" rx="4" />
  <text class="cell-text" x="837" y="109">SaaS-first</text>

  <!-- === Row 2: Braintrust === -->
  <text class="row-head" x="152" y="167">Braintrust</text>
  <!-- Dev-loop: medium -->
  <rect class="cell-medium" x="160" y="138" width="123" height="58" rx="4" />
  <text class="cell-text" x="222" y="167">Playground</text>
  <!-- CI eval: strong -->
  <rect class="cell-strong" x="283" y="138" width="123" height="58" rx="4" />
  <text class="cell-text-inv" x="345" y="167">Hero</text>
  <!-- Prod telemetry: medium -->
  <rect class="cell-medium" x="406" y="138" width="123" height="58" rx="4" />
  <text class="cell-text" x="468" y="167">Online logs</text>
  <!-- Drift: weak -->
  <rect class="cell-weak" x="529" y="138" width="123" height="58" rx="4" />
  <text class="cell-text" x="591" y="167">Limited</text>
  <!-- OTel-native: medium -->
  <rect class="cell-medium" x="652" y="138" width="123" height="58" rx="4" />
  <text class="cell-text" x="714" y="167">OTLP in</text>
  <!-- OSS: weak -->
  <rect class="cell-weak" x="775" y="138" width="123" height="58" rx="4" />
  <text class="cell-text" x="837" y="167">SaaS-first</text>

  <!-- === Row 3: Helicone === -->
  <text class="row-head" x="152" y="225">Helicone</text>
  <!-- Dev-loop: medium -->
  <rect class="cell-medium" x="160" y="196" width="123" height="58" rx="4" />
  <text class="cell-text" x="222" y="225">Replay</text>
  <!-- CI eval: medium -->
  <rect class="cell-medium" x="283" y="196" width="123" height="58" rx="4" />
  <text class="cell-text" x="345" y="225">Experiments</text>
  <!-- Prod telemetry: strong -->
  <rect class="cell-strong" x="406" y="196" width="123" height="58" rx="4" />
  <text class="cell-text-inv" x="468" y="225">Hero</text>
  <!-- Drift: medium -->
  <rect class="cell-medium" x="529" y="196" width="123" height="58" rx="4" />
  <text class="cell-text" x="591" y="225">Cost + latency</text>
  <!-- OTel-native: weak -->
  <rect class="cell-weak" x="652" y="196" width="123" height="58" rx="4" />
  <text class="cell-text" x="714" y="225">Gateway-first</text>
  <!-- OSS: strong -->
  <rect class="cell-strong" x="775" y="196" width="123" height="58" rx="4" />
  <text class="cell-text-inv" x="837" y="225">Apache-2</text>

  <!-- === Row 4: Arize Phoenix === -->
  <text class="row-head" x="152" y="276">Arize</text>
  <text class="row-head" x="152" y="292">Phoenix</text>
  <!-- Dev-loop: medium -->
  <rect class="cell-medium" x="160" y="254" width="123" height="58" rx="4" />
  <text class="cell-text" x="222" y="283">Notebook</text>
  <!-- CI eval: medium -->
  <rect class="cell-medium" x="283" y="254" width="123" height="58" rx="4" />
  <text class="cell-text" x="345" y="283">Local evals</text>
  <!-- Prod telemetry: medium -->
  <rect class="cell-medium" x="406" y="254" width="123" height="58" rx="4" />
  <text class="cell-text" x="468" y="283">Self-host</text>
  <!-- Drift: strong -->
  <rect class="cell-strong" x="529" y="254" width="123" height="58" rx="4" />
  <text class="cell-text-inv" x="591" y="283">Hero (Arize)</text>
  <!-- OTel-native: strong -->
  <rect class="cell-strong" x="652" y="254" width="123" height="58" rx="4" />
  <text class="cell-text-inv" x="714" y="283">OpenInference</text>
  <!-- OSS: strong -->
  <rect class="cell-strong" x="775" y="254" width="123" height="58" rx="4" />
  <text class="cell-text-inv" x="837" y="283">Elastic-2</text>

  <!-- Legend -->
  <rect class="legend-box-w" x="250" y="345" width="18" height="18" rx="3" />
  <text class="legend-text" x="275" y="354">Weak</text>

  <rect class="legend-box-m" x="370" y="345" width="18" height="18" rx="3" />
  <text class="legend-text" x="395" y="354">Medium</text>

  <rect class="legend-box-s" x="500" y="345" width="18" height="18" rx="3" />
  <text class="legend-text" x="525" y="354">Strong</text>

</svg>
