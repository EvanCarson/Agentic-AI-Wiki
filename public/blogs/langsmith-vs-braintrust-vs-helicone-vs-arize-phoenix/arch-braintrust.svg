<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Braintrust architecture</title>
  <desc id="d">Braintrust treats evals as code: developers write Eval() definitions in TypeScript or Python, CI runs them on every PR, results are diffed against the baseline, and a regression blocks the merge — the CI loop is the hero.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .dash  { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Dev / Code repo (top-left) -->
  <rect class="box" x="40" y="60" width="220" height="80" rx="8" ry="8" />
  <text class="label" x="150" y="90" text-anchor="middle" font-weight="600">eval.ts / eval.py</text>
  <text class="sub" x="150" y="108" text-anchor="middle">Eval(data, task, scorers)</text>
  <text class="sub" x="150" y="124" text-anchor="middle">code-first, in your repo</text>

  <!-- Pull Request -->
  <rect class="box" x="40" y="170" width="220" height="60" rx="8" ry="8" />
  <text class="label" x="150" y="195" text-anchor="middle" font-weight="600">Pull Request</text>
  <text class="sub" x="150" y="212" text-anchor="middle">git diff · CI trigger</text>

  <!-- CI runner -->
  <rect class="adj" x="40" y="260" width="220" height="76" rx="8" ry="8" />
  <text class="label" x="150" y="286" text-anchor="middle" font-weight="600">CI runner</text>
  <text class="sub" x="150" y="304" text-anchor="middle">braintrust eval ./eval.ts</text>
  <text class="sub" x="150" y="320" text-anchor="middle">runs full eval suite</text>

  <!-- Braintrust hero (right) -->
  <rect class="hero" x="320" y="40" width="540" height="420" rx="10" ry="10" />
  <text class="label-inv" x="590" y="70" text-anchor="middle" font-weight="600">Braintrust — CI Eval Loop</text>

  <!-- Datasets -->
  <rect class="box" x="348" y="90" width="230" height="80" rx="8" ry="8" />
  <text class="label" x="463" y="114" text-anchor="middle" font-weight="600">Datasets</text>
  <text class="sub" x="463" y="132" text-anchor="middle">versioned · forked per PR</text>
  <text class="sub" x="463" y="148" text-anchor="middle">golden + edge cases</text>

  <!-- Scorers -->
  <rect class="box" x="600" y="90" width="232" height="80" rx="8" ry="8" />
  <text class="label" x="716" y="114" text-anchor="middle" font-weight="600">Scorers (code)</text>
  <text class="sub" x="716" y="132" text-anchor="middle">autoevals · LLM-judge · custom</text>
  <text class="sub" x="716" y="148" text-anchor="middle">TypeScript / Python functions</text>

  <!-- Experiments -->
  <rect class="adj" x="348" y="186" width="484" height="80" rx="8" ry="8" />
  <text class="label" x="590" y="210" text-anchor="middle" font-weight="600">Experiments</text>
  <text class="sub" x="590" y="228" text-anchor="middle">one run = dataset × task × scorers</text>
  <text class="sub" x="590" y="244" text-anchor="middle">stored as immutable build artifact</text>

  <!-- Regression diff -->
  <rect class="box" x="348" y="282" width="484" height="78" rx="8" ry="8" />
  <text class="label" x="590" y="306" text-anchor="middle" font-weight="600">Regression Diff vs Baseline</text>
  <text class="sub" x="590" y="324" text-anchor="middle">side-by-side per-example deltas</text>
  <text class="sub" x="590" y="340" text-anchor="middle">summary: accuracy + cost + latency</text>

  <!-- Online logs (smaller) -->
  <rect class="box" x="348" y="376" width="484" height="68" rx="8" ry="8" />
  <text class="label" x="590" y="400" text-anchor="middle" font-weight="600">Online Logs + Playground</text>
  <text class="sub" x="590" y="418" text-anchor="middle">production traces feed back as new dataset rows</text>
  <text class="sub" x="590" y="434" text-anchor="middle">prompt iteration in the UI</text>

  <!-- Arrows: CI -> Braintrust -->
  <line class="arrow" x1="262" y1="290" x2="346" y2="226" />
  <text class="sub" x="310" y="218" text-anchor="middle">push run</text>

  <!-- Internal -->
  <line class="arrow" x1="578" y1="130" x2="598" y2="130" />
  <line class="arrow" x1="463" y1="170" x2="463" y2="184" />
  <line class="arrow" x1="716" y1="170" x2="716" y2="184" />
  <line class="arrow" x1="590" y1="266" x2="590" y2="280" />
  <line class="arrow" x1="590" y1="360" x2="590" y2="374" />

  <!-- Regression diff -> PR status (loop back) -->
  <path class="dash" d="M 348 318 C 270 330, 200 270, 150 232" />
  <text class="sub" x="220" y="350" text-anchor="middle">pass / fail · PR check</text>

  <!-- Code -> PR flow on left side -->
  <line class="arrow" x1="150" y1="140" x2="150" y2="168" />
  <line class="arrow" x1="150" y1="230" x2="150" y2="258" />
</svg>
