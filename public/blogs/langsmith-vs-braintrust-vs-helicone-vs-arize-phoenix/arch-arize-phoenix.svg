<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Arize Phoenix architecture</title>
  <desc id="d">Arize Phoenix is OpenTelemetry-native: instrumentors emit OpenInference spans from any framework (LangChain, LlamaIndex, OpenAI), an OTLP collector ingests them into Phoenix, where traces, datasets, evaluators, and embedding drift sit alongside one another in a self-hostable OSS server.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .dash  { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- App + instrumentors (left) -->
  <rect class="box" x="40" y="60" width="220" height="76" rx="8" ry="8" />
  <text class="label" x="150" y="84" text-anchor="middle" font-weight="600">Your app</text>
  <text class="sub" x="150" y="102" text-anchor="middle">LangChain · LlamaIndex</text>
  <text class="sub" x="150" y="118" text-anchor="middle">OpenAI · Anthropic · Bedrock</text>

  <rect class="adj" x="40" y="156" width="220" height="84" rx="8" ry="8" />
  <text class="label" x="150" y="180" text-anchor="middle" font-weight="600">OpenInference</text>
  <text class="sub" x="150" y="198" text-anchor="middle">auto-instrumentors</text>
  <text class="sub" x="150" y="214" text-anchor="middle">emit OTel spans</text>
  <text class="sub" x="150" y="230" text-anchor="middle">vendor-neutral schema</text>

  <rect class="box" x="40" y="260" width="220" height="64" rx="8" ry="8" />
  <text class="label" x="150" y="284" text-anchor="middle" font-weight="600">OTLP exporter</text>
  <text class="sub" x="150" y="302" text-anchor="middle">gRPC / HTTP · OpenTelemetry</text>

  <!-- Phoenix server (hero) -->
  <rect class="hero" x="320" y="40" width="540" height="420" rx="10" ry="10" />
  <text class="label-inv" x="590" y="70" text-anchor="middle" font-weight="600">Phoenix (OSS self-host or Cloud)</text>

  <!-- OTel collector -->
  <rect class="box" x="348" y="90" width="484" height="60" rx="8" ry="8" />
  <text class="label" x="590" y="114" text-anchor="middle" font-weight="600">OTel-compatible ingest</text>
  <text class="sub" x="590" y="132" text-anchor="middle">accepts OTLP from any OTel client</text>

  <!-- Traces store -->
  <rect class="box" x="348" y="166" width="230" height="86" rx="8" ry="8" />
  <text class="label" x="463" y="190" text-anchor="middle" font-weight="600">Traces</text>
  <text class="sub" x="463" y="208" text-anchor="middle">RAG · agent · LLM spans</text>
  <text class="sub" x="463" y="224" text-anchor="middle">SQLite / Postgres backend</text>
  <text class="sub" x="463" y="240" text-anchor="middle">queryable via SDK</text>

  <!-- Datasets + Evaluators -->
  <rect class="adj" x="600" y="166" width="232" height="86" rx="8" ry="8" />
  <text class="label" x="716" y="190" text-anchor="middle" font-weight="600">Datasets + Evaluators</text>
  <text class="sub" x="716" y="208" text-anchor="middle">phoenix.evals (Python lib)</text>
  <text class="sub" x="716" y="224" text-anchor="middle">notebook-friendly</text>
  <text class="sub" x="716" y="240" text-anchor="middle">runs offline against traces</text>

  <!-- Embedding drift -->
  <rect class="box" x="348" y="268" width="484" height="80" rx="8" ry="8" />
  <text class="label" x="590" y="292" text-anchor="middle" font-weight="600">Embedding + Vector Drift</text>
  <text class="sub" x="590" y="310" text-anchor="middle">UMAP clustering · embedding similarity drift</text>
  <text class="sub" x="590" y="326" text-anchor="middle">RAG retrieval quality monitoring</text>

  <!-- Production monitoring -->
  <rect class="box" x="348" y="364" width="484" height="80" rx="8" ry="8" />
  <text class="label" x="590" y="388" text-anchor="middle" font-weight="600">Arize AX (paid prod tier)</text>
  <text class="sub" x="590" y="406" text-anchor="middle">scaling, drift dashboards, alerts</text>
  <text class="sub" x="590" y="422" text-anchor="middle">graduates Phoenix into ML-obs heritage</text>

  <!-- Internal arrows -->
  <line class="arrow" x1="590" y1="150" x2="590" y2="164" />
  <line class="arrow" x1="578" y1="208" x2="598" y2="208" />
  <line class="arrow" x1="463" y1="252" x2="463" y2="266" />
  <line class="arrow" x1="716" y1="252" x2="716" y2="266" />
  <line class="arrow" x1="590" y1="348" x2="590" y2="362" />

  <!-- App -> instr -> exporter -> collector -->
  <line class="arrow" x1="150" y1="136" x2="150" y2="154" />
  <line class="arrow" x1="150" y1="240" x2="150" y2="258" />
  <line class="arrow" x1="262" y1="292" x2="346" y2="120" />
  <text class="sub" x="302" y="200" text-anchor="middle" transform="rotate(-30 302 200)">OTLP spans</text>
</svg>
