<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Open-source vs SaaS deployment</title>
  <desc id="d">Four-column comparison of deployment posture: LangSmith is SaaS-first with a paid self-hosted tier, Braintrust is SaaS with an enterprise self-host, Helicone is Apache-2.0 open source with a hosted offering, Arize Phoenix is Elastic-2.0 open source designed to run anywhere with optional Phoenix Cloud / Arize AX upgrade.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="28">Open-source vs SaaS</text>

  <!-- Column 1: LangSmith — neutral (SaaS-first) -->
  <rect class="card-neutral" x="10" y="44" width="210" height="240" rx="8" />
  <text class="col-head" x="115" y="72">LangSmith</text>
  <text class="body-text" x="115" y="104">SaaS-first.</text>
  <text class="body-text" x="115" y="122">Self-hosted tier</text>
  <text class="body-text" x="115" y="140">behind an</text>
  <text class="body-text" x="115" y="158">enterprise contract.</text>
  <text class="body-text" x="115" y="186">Closed source;</text>
  <text class="body-text" x="115" y="204">SDK is OSS.</text>

  <!-- Column 2: Braintrust — neutral (SaaS-first) -->
  <rect class="card-neutral" x="230" y="44" width="210" height="240" rx="8" />
  <text class="col-head" x="335" y="72">Braintrust</text>
  <text class="body-text" x="335" y="104">SaaS, with</text>
  <text class="body-text" x="335" y="122">an enterprise</text>
  <text class="body-text" x="335" y="140">self-host (BYO-cloud).</text>
  <text class="body-text" x="335" y="168">Open-source SDK +</text>
  <text class="body-text" x="335" y="186">autoevals lib;</text>
  <text class="body-text" x="335" y="204">backend is closed.</text>

  <!-- Column 3: Helicone — soft (OSS Apache-2) -->
  <rect class="card-soft" x="450" y="44" width="210" height="240" rx="8" />
  <text class="col-head" x="555" y="72">Helicone</text>
  <text class="body-text" x="555" y="104">Apache-2.0 OSS</text>
  <text class="body-text" x="555" y="122">end-to-end, including</text>
  <text class="body-text" x="555" y="140">the gateway and UI.</text>
  <text class="body-text" x="555" y="168">Hosted cloud is</text>
  <text class="body-text" x="555" y="186">the easy path;</text>
  <text class="body-text" x="555" y="204">docker self-host works.</text>

  <!-- Column 4: Arize Phoenix — accent (the OSS hero — strongest) -->
  <rect class="card-accent" x="670" y="44" width="220" height="240" rx="8" />
  <text class="col-head-inv" x="780" y="72">Arize Phoenix</text>
  <text class="body-text-inv" x="780" y="104">Elastic-2.0 OSS,</text>
  <text class="body-text-inv" x="780" y="122">designed to run</text>
  <text class="body-text-inv" x="780" y="140">anywhere — laptop,</text>
  <text class="body-text-inv" x="780" y="158">k8s, notebook.</text>
  <text class="body-text-inv" x="780" y="186">Phoenix Cloud (hosted)</text>
  <text class="body-text-inv" x="780" y="204">+ Arize AX (paid prod).</text>

</svg>
