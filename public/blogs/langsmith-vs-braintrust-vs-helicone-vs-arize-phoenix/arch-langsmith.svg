<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">LangSmith architecture</title>
  <desc id="d">A LangChain or LangGraph app sends traces and runs to LangSmith, where the dev loop closes: prompts and datasets, offline evals, online evals on production traces, and a Playground that pushes prompt changes back into the app.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .8; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .dash  { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- App side (left) -->
  <rect class="box" x="40" y="70" width="220" height="80" rx="8" ry="8" />
  <text class="label" x="150" y="100" text-anchor="middle" font-weight="600">Your app</text>
  <text class="sub" x="150" y="118" text-anchor="middle">LangChain / LangGraph</text>
  <text class="sub" x="150" y="134" text-anchor="middle">(or any SDK via tracing)</text>

  <rect class="box" x="40" y="380" width="220" height="80" rx="8" ry="8" />
  <text class="label" x="150" y="410" text-anchor="middle" font-weight="600">Prompt &amp; chain code</text>
  <text class="sub" x="150" y="428" text-anchor="middle">edit · commit · deploy</text>
  <text class="sub" x="150" y="444" text-anchor="middle">(prompt hub pulls in)</text>

  <!-- LangSmith hero (right) -->
  <rect class="hero" x="320" y="50" width="540" height="400" rx="10" ry="10" />
  <text class="label-inv" x="590" y="80" text-anchor="middle" font-weight="600">LangSmith — Dev Loop</text>

  <!-- Traces / Runs -->
  <rect class="box" x="348" y="100" width="230" height="86" rx="8" ry="8" />
  <text class="label" x="463" y="124" text-anchor="middle" font-weight="600">Traces &amp; Runs</text>
  <text class="sub" x="463" y="142" text-anchor="middle">tree of LLM / tool / chain calls</text>
  <text class="sub" x="463" y="158" text-anchor="middle">inputs · outputs · latency · cost</text>
  <text class="sub" x="463" y="174" text-anchor="middle">tags + feedback annotations</text>

  <!-- Datasets -->
  <rect class="adj" x="600" y="100" width="232" height="86" rx="8" ry="8" />
  <text class="label" x="716" y="124" text-anchor="middle" font-weight="600">Datasets</text>
  <text class="sub" x="716" y="142" text-anchor="middle">examples promoted from traces</text>
  <text class="sub" x="716" y="158" text-anchor="middle">versioned · splits · golden sets</text>
  <text class="sub" x="716" y="174" text-anchor="middle">power offline runs</text>

  <!-- Offline Evals -->
  <rect class="box" x="348" y="206" width="230" height="80" rx="8" ry="8" />
  <text class="label" x="463" y="230" text-anchor="middle" font-weight="600">Offline Evaluators</text>
  <text class="sub" x="463" y="248" text-anchor="middle">LLM-judge · heuristic · custom</text>
  <text class="sub" x="463" y="264" text-anchor="middle">run a chain over a dataset</text>

  <!-- Online Evals -->
  <rect class="box" x="600" y="206" width="232" height="80" rx="8" ry="8" />
  <text class="label" x="716" y="230" text-anchor="middle" font-weight="600">Online Evaluators</text>
  <text class="sub" x="716" y="248" text-anchor="middle">score live production traces</text>
  <text class="sub" x="716" y="264" text-anchor="middle">sampled · async</text>

  <!-- Playground / Prompt Hub -->
  <rect class="adj" x="348" y="306" width="484" height="84" rx="8" ry="8" />
  <text class="label" x="590" y="330" text-anchor="middle" font-weight="600">Prompt Hub + Playground</text>
  <text class="sub" x="590" y="348" text-anchor="middle">edit prompt · re-run dataset · compare versions</text>
  <text class="sub" x="590" y="364" text-anchor="middle">"the dev loop closes here"</text>
  <text class="sub" x="590" y="380" text-anchor="middle">promote winning prompt → app</text>

  <!-- Deployment -->
  <rect class="box" x="348" y="404" width="484" height="38" rx="8" ry="8" />
  <text class="label" x="590" y="427" text-anchor="middle" font-weight="600">LangSmith Deployment (managed LangGraph runtime)</text>

  <!-- Internal arrows (LangSmith) -->
  <line class="arrow" x1="578" y1="143" x2="598" y2="143" />
  <line class="arrow" x1="463" y1="186" x2="463" y2="204" />
  <line class="arrow" x1="716" y1="186" x2="716" y2="204" />
  <line class="arrow" x1="463" y1="286" x2="463" y2="304" />
  <line class="arrow" x1="716" y1="286" x2="716" y2="304" />

  <!-- App -> LangSmith traces -->
  <line class="arrow" x1="262" y1="110" x2="346" y2="125" />
  <text class="sub" x="305" y="105" text-anchor="middle">traces</text>

  <!-- Playground -> code (prompt push back) -->
  <path class="dash" d="M 348 360 C 280 360, 220 360, 200 380" />
  <text class="sub" x="245" y="354" text-anchor="middle">prompt push</text>

  <!-- Code -> App -->
  <line class="arrow" x1="150" y1="378" x2="150" y2="152" />
  <text class="sub" x="158" y="270" text-anchor="start" transform="rotate(-90 158 270)">deploy</text>
</svg>
