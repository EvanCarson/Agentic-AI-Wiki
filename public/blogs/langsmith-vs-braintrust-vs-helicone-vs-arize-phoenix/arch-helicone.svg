<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Helicone architecture</title>
  <desc id="d">Helicone is gateway-first: your app points its OpenAI/Anthropic base URL at Helicone, every request flows through as a transparent proxy, and traces, cost, latency, caching, and rate limits land in the dashboard with zero SDK changes.</desc>
  <style>
    .box   { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.25; }
    .hero  { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arr); }
    .dash  { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- App (left) -->
  <rect class="box" x="40" y="180" width="180" height="140" rx="8" ry="8" />
  <text class="label" x="130" y="218" text-anchor="middle" font-weight="600">Your app</text>
  <text class="sub" x="130" y="238" text-anchor="middle">openai · anthropic · etc.</text>
  <text class="sub" x="130" y="258" text-anchor="middle">base_url =</text>
  <text class="sub" x="130" y="276" text-anchor="middle">"oai.helicone.ai/v1"</text>
  <text class="sub" x="130" y="298" text-anchor="middle">+ Helicone-Auth header</text>

  <!-- Helicone gateway (hero) -->
  <rect class="hero" x="280" y="70" width="340" height="380" rx="10" ry="10" />
  <text class="label-inv" x="450" y="100" text-anchor="middle" font-weight="600">Helicone Gateway (Proxy)</text>

  <!-- Proxy block -->
  <rect class="box" x="308" y="120" width="284" height="76" rx="8" ry="8" />
  <text class="label" x="450" y="144" text-anchor="middle" font-weight="600">Transparent HTTP proxy</text>
  <text class="sub" x="450" y="162" text-anchor="middle">forwards · streams · retries</text>
  <text class="sub" x="450" y="178" text-anchor="middle">no SDK change required</text>

  <!-- Gateway features -->
  <rect class="box" x="308" y="206" width="138" height="60" rx="8" ry="8" />
  <text class="label" x="377" y="230" text-anchor="middle" font-weight="600" font-size="13">Cache</text>
  <text class="sub" x="377" y="248" text-anchor="middle">deterministic replay</text>
  <text class="sub" x="377" y="262" text-anchor="middle">cost savings</text>

  <rect class="box" x="454" y="206" width="138" height="60" rx="8" ry="8" />
  <text class="label" x="523" y="230" text-anchor="middle" font-weight="600" font-size="13">Rate limit + retry</text>
  <text class="sub" x="523" y="248" text-anchor="middle">per-user / per-key</text>
  <text class="sub" x="523" y="262" text-anchor="middle">PII filter · keys vault</text>

  <!-- Observability layer -->
  <rect class="adj" x="308" y="276" width="284" height="78" rx="8" ry="8" />
  <text class="label" x="450" y="300" text-anchor="middle" font-weight="600">Traces · Sessions · Cost</text>
  <text class="sub" x="450" y="318" text-anchor="middle">every request + response captured</text>
  <text class="sub" x="450" y="334" text-anchor="middle">grouped by session_id · user_id</text>

  <!-- Experiments / Replay -->
  <rect class="box" x="308" y="362" width="284" height="76" rx="8" ry="8" />
  <text class="label" x="450" y="386" text-anchor="middle" font-weight="600">Experiments · Replay · Evaluators</text>
  <text class="sub" x="450" y="404" text-anchor="middle">re-run a captured prompt</text>
  <text class="sub" x="450" y="422" text-anchor="middle">score with LLM-judge / custom</text>

  <!-- Provider (right) -->
  <rect class="box" x="680" y="180" width="180" height="140" rx="8" ry="8" />
  <text class="label" x="770" y="216" text-anchor="middle" font-weight="600">LLM provider</text>
  <text class="sub" x="770" y="236" text-anchor="middle">OpenAI · Anthropic</text>
  <text class="sub" x="770" y="252" text-anchor="middle">Gemini · Bedrock</text>
  <text class="sub" x="770" y="272" text-anchor="middle">Together · OpenRouter …</text>
  <text class="sub" x="770" y="296" text-anchor="middle">(Helicone AI Gateway can</text>
  <text class="sub" x="770" y="312" text-anchor="middle">route across providers)</text>

  <!-- Arrows app -> gateway -> provider -->
  <line class="arrow" x1="222" y1="240" x2="278" y2="158" />
  <line class="arrow" x1="592" y1="158" x2="678" y2="240" />
  <text class="sub" x="252" y="195" text-anchor="middle">request</text>
  <text class="sub" x="648" y="195" text-anchor="middle">forward</text>

  <!-- return path -->
  <path class="dash" d="M 680 280 C 640 280, 600 320, 592 314" />
  <path class="dash" d="M 308 314 C 250 314, 220 290, 222 270" />
  <text class="sub" x="640" y="345" text-anchor="middle">response</text>

  <!-- Internal arrows -->
  <line class="arrow" x1="377" y1="266" x2="420" y2="274" />
  <line class="arrow" x1="523" y1="266" x2="480" y2="274" />
  <line class="arrow" x1="450" y1="354" x2="450" y2="360" />
</svg>
