<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Evaluation model</title>
  <desc id="d">Four-column comparison of how each platform models evaluation: LangSmith centers offline + online evals around the Prompt Hub dev loop, Braintrust treats Eval() as a first-class CI artifact with regression diffs, Helicone offers replay + experiments anchored to captured production traces, Arize Phoenix runs notebook-style phoenix.evals over OTel traces with embedding-drift extensions.</desc>
  <style>
    .chart-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="28">Evaluation model</text>

  <!-- Column 1: LangSmith — soft (dev loop) -->
  <rect class="card-soft" x="10" y="44" width="210" height="240" rx="8" />
  <text class="col-head" x="115" y="72">LangSmith</text>
  <text class="body-text" x="115" y="104">Dev loop:</text>
  <text class="body-text" x="115" y="122">Prompt Hub +</text>
  <text class="body-text" x="115" y="140">offline runs over</text>
  <text class="body-text" x="115" y="158">curated datasets;</text>
  <text class="body-text" x="115" y="186">online evals</text>
  <text class="body-text" x="115" y="204">sample prod traces</text>

  <!-- Column 2: Braintrust — accent (CI is hero) -->
  <rect class="card-accent" x="230" y="44" width="210" height="240" rx="8" />
  <text class="col-head-inv" x="335" y="72">Braintrust</text>
  <text class="body-text-inv" x="335" y="104">Eval() as code:</text>
  <text class="body-text-inv" x="335" y="122">runs in CI per PR,</text>
  <text class="body-text-inv" x="335" y="140">diffs vs baseline,</text>
  <text class="body-text-inv" x="335" y="158">blocks merge on</text>
  <text class="body-text-inv" x="335" y="186">regression. Scorers</text>
  <text class="body-text-inv" x="335" y="204">are TS / Py fns.</text>

  <!-- Column 3: Helicone — neutral (replay + experiments on prod) -->
  <rect class="card-neutral" x="450" y="44" width="210" height="240" rx="8" />
  <text class="col-head" x="555" y="72">Helicone</text>
  <text class="body-text" x="555" y="104">Replay + experiments</text>
  <text class="body-text" x="555" y="122">over captured</text>
  <text class="body-text" x="555" y="140">production requests.</text>
  <text class="body-text" x="555" y="168">Evals live alongside</text>
  <text class="body-text" x="555" y="186">cost / latency dashboards,</text>
  <text class="body-text" x="555" y="204">not in CI.</text>

  <!-- Column 4: Arize Phoenix — soft (notebook + drift) -->
  <rect class="card-soft" x="670" y="44" width="220" height="240" rx="8" />
  <text class="col-head" x="780" y="72">Arize Phoenix</text>
  <text class="body-text" x="780" y="104">phoenix.evals</text>
  <text class="body-text" x="780" y="122">runs as a Python lib</text>
  <text class="body-text" x="780" y="140">over OTel traces</text>
  <text class="body-text" x="780" y="158">(notebook-first);</text>
  <text class="body-text" x="780" y="186">embedding + retrieval</text>
  <text class="body-text" x="780" y="204">drift as ML-obs add-ons</text>

</svg>
