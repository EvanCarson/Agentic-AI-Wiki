<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Instrumentation shape</title>
  <desc id="d">Four-column comparison of how each platform gets data: LangSmith via LangChain-native SDK callbacks, Braintrust via TypeScript/Python wrappers around model calls, Helicone via a transparent HTTP proxy (no SDK change), and Arize Phoenix via OpenTelemetry/OpenInference instrumentors.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral{ fill: var(--paper-2, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft   { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <!-- Title -->
  <text class="chart-title" x="450" y="28">Instrumentation shape</text>

  <!-- Column 1: LangSmith — soft -->
  <rect class="card-soft" x="10" y="44" width="210" height="240" rx="8" />
  <text class="col-head" x="115" y="72">LangSmith</text>
  <text class="body-text" x="115" y="104">LangChain-native</text>
  <text class="body-text" x="115" y="122">tracing callback;</text>
  <text class="body-text" x="115" y="140">@traceable decorator</text>
  <text class="body-text" x="115" y="158">for arbitrary Python</text>
  <text class="body-text" x="115" y="186">framework-aware</text>
  <text class="body-text" x="115" y="204">graph + node spans</text>

  <!-- Column 2: Braintrust — neutral -->
  <rect class="card-neutral" x="230" y="44" width="210" height="240" rx="8" />
  <text class="col-head" x="335" y="72">Braintrust</text>
  <text class="body-text" x="335" y="104">SDK wrappers</text>
  <text class="body-text" x="335" y="122">around model calls:</text>
  <text class="body-text" x="335" y="140">wrapOpenAI() · @traced</text>
  <text class="body-text" x="335" y="168">code-first eval</text>
  <text class="body-text" x="335" y="186">harness is the</text>
  <text class="body-text" x="335" y="204">primary surface</text>

  <!-- Column 3: Helicone — accent (hero — the differentiator) -->
  <rect class="card-accent" x="450" y="44" width="210" height="240" rx="8" />
  <text class="col-head-inv" x="555" y="72">Helicone</text>
  <text class="body-text-inv" x="555" y="104">Transparent</text>
  <text class="body-text-inv" x="555" y="122">HTTP proxy.</text>
  <text class="body-text-inv" x="555" y="140">Change base_url,</text>
  <text class="body-text-inv" x="555" y="158">add a header.</text>
  <text class="body-text-inv" x="555" y="186">No SDK swap.</text>
  <text class="body-text-inv" x="555" y="204">Works with any client.</text>

  <!-- Column 4: Arize Phoenix — soft (OTel-native) -->
  <rect class="card-soft" x="670" y="44" width="220" height="240" rx="8" />
  <text class="col-head" x="780" y="72">Arize Phoenix</text>
  <text class="body-text" x="780" y="104">OpenTelemetry +</text>
  <text class="body-text" x="780" y="122">OpenInference</text>
  <text class="body-text" x="780" y="140">auto-instrumentors.</text>
  <text class="body-text" x="780" y="168">Vendor-neutral spans;</text>
  <text class="body-text" x="780" y="186">any OTel backend</text>
  <text class="body-text" x="780" y="204">can also receive them.</text>

</svg>
