<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Where text-to-speech sits in a voice agent turn, and what happens on barge-in</title>
  <desc id="d">Top row: after the caller stops speaking, endpointing runs, then the language model produces its first token, then text-to-speech produces its first audio, then the media jitter buffer holds two to four hundred milliseconds, and only then does the caller hear a reply. A marker notes that a reply stops feeling conversational beyond roughly three hundred milliseconds of silence, and a brace marks the text-to-speech and buffer stages as the slice this vendor choice changes. Bottom row: when the caller interrupts, playback stops, the buffer is flushed, in-flight synthesis is cancelled and the microphone returns to speech recognition, all of which must complete within roughly two hundred milliseconds.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .pane   { fill: none; stroke: var(--ink); stroke-width: 1.25; opacity: .35; rx: 10; ry: 10; stroke-dasharray: 5 5; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr3); }
    .brace  { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="head" x="24" y="34">The silence the caller hears is four latencies, composed</text>

  <rect class="box" x="24" y="58" width="150" height="72" />
  <text class="label" x="40" y="90">Caller stops</text>
  <text class="label" x="40" y="110">speaking</text>

  <path class="arrow" d="M 176 94 L 198 94" />

  <rect class="box" x="200" y="58" width="150" height="72" />
  <text class="label" x="216" y="90">Endpointing</text>
  <text class="sub" x="216" y="110">was that the end?</text>

  <path class="arrow" d="M 352 94 L 374 94" />

  <rect class="box" x="376" y="58" width="150" height="72" />
  <text class="label" x="392" y="90">Model first token</text>
  <text class="sub" x="392" y="110">TTFT</text>

  <path class="arrow" d="M 528 94 L 550 94" />

  <rect class="hero" x="552" y="58" width="150" height="72" />
  <text class="label-inv" x="568" y="90">TTS first audio</text>
  <text class="sub-inv" x="568" y="110">TTFA + its variance</text>

  <path class="arrow" d="M 704 94 L 726 94" />

  <rect class="adj" x="728" y="58" width="148" height="72" />
  <text class="label" x="744" y="90">Jitter buffer</text>
  <text class="sub" x="744" y="110">200–400 ms held</text>

  <path class="brace" d="M 552 146 L 552 158 L 876 158 L 876 146" />
  <text class="tag" x="552" y="180">THE SLICE THIS COMPARISON CHANGES</text>
  <text class="label" x="552" y="204">and all of its variance</text>

  <rect class="box" x="24" y="150" width="502" height="80" />
  <text class="tag" x="40" y="176">CONVERSATIONAL THRESHOLD</text>
  <text class="label" x="40" y="202">past roughly 300 ms of silence, the caller stops</text>
  <text class="label" x="40" y="220">experiencing a conversation and starts waiting</text>

  <rect class="pane" x="24" y="266" width="852" height="210" />
  <text class="head" x="44" y="300">…and then the caller interrupts</text>

  <rect class="box" x="44" y="322" width="182" height="66" />
  <text class="label" x="60" y="352">Caller speaks over</text>
  <text class="sub" x="60" y="372">barge-in detected</text>

  <path class="arrow" d="M 228 355 L 250 355" />

  <rect class="adj" x="252" y="322" width="182" height="66" />
  <text class="label" x="268" y="352">Flush the buffer</text>
  <text class="sub" x="268" y="372">audio already paid for</text>

  <path class="arrow" d="M 436 355 L 458 355" />

  <rect class="hero" x="460" y="322" width="182" height="66" />
  <text class="label-inv" x="476" y="352">Cancel synthesis</text>
  <text class="sub-inv" x="476" y="372">WebSocket close, mid-stream</text>

  <path class="arrow" d="M 644 355 L 666 355" />

  <rect class="box" x="668" y="322" width="188" height="66" />
  <text class="label" x="684" y="352">Mic back to STT</text>
  <text class="sub" x="684" y="372">turn handed over</text>

  <text class="tag" x="44" y="424">BUDGET FOR THE WHOLE BOTTOM ROW</text>
  <text class="label" x="44" y="450">about 200 ms, or the agent is talking over the caller</text>
</svg>
