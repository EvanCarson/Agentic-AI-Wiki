<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Advertised time-to-first-audio against measured cloud medians and spread</title>
  <desc id="d">Four models measured on an independent harness in 2026. Cartesia Sonic-3 has a median near 188 milliseconds with about 100 milliseconds of interquartile spread, against an advertised figure under 90. ElevenLabs Turbo v2.5 is near 264 milliseconds with about 28 milliseconds of spread. ElevenLabs Flash v2.5 is near 288 milliseconds with about 28 milliseconds of spread, against an advertised 75. Deepgram Aura-2 is near 313 milliseconds with about 68 milliseconds of spread, against an advertised figure under 200. Every advertised marker sits far to the left of the measured median.</desc>
  <style>
    .bar    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .spread { stroke: var(--accent, #d4421e); stroke-width: 6; stroke-linecap: round; }
    .claim  { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 3; opacity: .8; }
    .rowlab { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .rowsub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .axis   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .grid   { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 2 4; }
  </style>

  <text class="head" x="24" y="30">Time to first audio: claimed, measured, and how much it moves</text>
  <text class="sub" x="24" y="50">milliseconds, cloud endpoints, independent harness 2026</text>

  <line class="grid" x1="300" y1="76" x2="300" y2="344" />
  <line class="grid" x1="457" y1="76" x2="457" y2="344" />
  <line class="grid" x1="614" y1="76" x2="614" y2="344" />
  <line class="grid" x1="771" y1="76" x2="771" y2="344" />
  <text class="axis" x="294" y="364">0</text>
  <text class="axis" x="443" y="364">100</text>
  <text class="axis" x="600" y="364">200</text>
  <text class="axis" x="757" y="364">300</text>

  <text class="rowlab" x="24" y="118">Cartesia Sonic-3</text>
  <text class="rowsub" x="24" y="136">claimed sub-90 ms</text>
  <rect class="bar" x="300" y="100" width="295" height="34" />
  <line class="claim" x1="441" y1="96" x2="441" y2="138" />
  <line class="spread" x1="517" y1="117" x2="674" y2="117" />
  <text class="val" x="684" y="122">188 ± 100</text>

  <text class="rowlab" x="24" y="186">ElevenLabs Turbo v2.5</text>
  <text class="rowsub" x="24" y="204">tightest spread in the group</text>
  <rect class="bar" x="300" y="168" width="415" height="34" />
  <line class="spread" x1="693" y1="185" x2="737" y2="185" />
  <text class="val" x="747" y="190">264 ± 28</text>

  <text class="rowlab" x="24" y="254">ElevenLabs Flash v2.5</text>
  <text class="rowsub" x="24" y="272">claimed ~75 ms</text>
  <rect class="bar" x="300" y="236" width="452" height="34" />
  <line class="claim" x1="418" y1="232" x2="418" y2="274" />
  <line class="spread" x1="730" y1="253" x2="774" y2="253" />
  <text class="val" x="784" y="258">288 ± 28</text>

  <text class="rowlab" x="24" y="322">Deepgram Aura-2</text>
  <text class="rowsub" x="24" y="340">claimed sub-200 ms</text>
  <rect class="bar" x="300" y="304" width="492" height="34" />
  <line class="claim" x1="614" y1="300" x2="614" y2="342" />
  <line class="spread" x1="739" y1="321" x2="846" y2="321" />
  <text class="val" x="640" y="326">313 ± 68</text>

  <text class="axis" x="24" y="386">BAR = MEASURED P50   ·   THICK LINE = SPREAD (IQR)   ·   DASHED TICK = ADVERTISED</text>
</svg>
