<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Who owns your p99, under three deployment shapes</title>
  <desc id="d">Three columns. A cloud or vendor-run VPC endpoint means the vendor owns your tail latency and you buy their region, queue and neighbours. Generally available self-hosted containers next to your media server mean you own the GPUs, the upgrades and the tail, and network variance largely disappears. An on-premises path gated behind early access or a large minimum commitment means the option exists but not this quarter.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .head   { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .head-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .tag    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .75; }
  </style>

  <rect class="box" x="24" y="36" width="266" height="212" />
  <text class="head" x="44" y="66">Cloud or vendor-run VPC</text>
  <text class="sub" x="44" y="100">the default for every vendor here</text>
  <text class="sub" x="44" y="124">no capacity planning</text>
  <text class="sub" x="44" y="148">their region, queue, neighbours</text>
  <line x1="44" y1="172" x2="270" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="44" y="196">WHO OWNS YOUR p99</text>
  <text class="label" x="44" y="220">the vendor does</text>

  <rect class="hero" x="314" y="36" width="266" height="212" />
  <text class="head-inv" x="334" y="66">Self-hosted, generally available</text>
  <text class="sub-inv" x="334" y="100">Rime, Deepgram</text>
  <text class="sub-inv" x="334" y="124">runs beside your media server</text>
  <text class="sub-inv" x="334" y="148">network variance mostly gone</text>
  <line x1="334" y1="172" x2="560" y2="172" stroke="var(--paper)" stroke-width="1" opacity=".4" />
  <text class="tag" x="334" y="196" fill="var(--paper)" opacity=".85">WHO OWNS YOUR p99</text>
  <text class="label-inv" x="334" y="220">you do — GPUs and upgrades too</text>

  <rect class="adj" x="604" y="36" width="266" height="212" />
  <text class="head" x="624" y="66">On-prem, gated</text>
  <text class="sub" x="624" y="100">Cartesia and ElevenLabs</text>
  <text class="sub" x="624" y="124">early access, or a large commit</text>
  <text class="sub" x="624" y="148">on-device paths as well</text>
  <line x1="624" y1="172" x2="850" y2="172" stroke="var(--ink)" stroke-width="1" opacity=".25" />
  <text class="tag" x="624" y="196">WHO OWNS YOUR p99</text>
  <text class="label" x="624" y="220">you do, once you qualify</text>
</svg>
