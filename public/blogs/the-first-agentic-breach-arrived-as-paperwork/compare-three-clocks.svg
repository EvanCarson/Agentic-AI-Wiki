<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="ct cd">
  <title id="ct">Three reporting regimes, three clocks, no shared flag</title>
  <desc id="cd">Three columns comparing the personal-data breach regime, the AI Act serious-incident regime and the network-security regime. Each has a different deadline, a different recipient and a different form, and all three record the cause in free text with no enumerated field for whether an autonomous agent executed the incident.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .rule   { fill: none; stroke: currentColor; stroke-width: 1; opacity: .45; }
  </style>

  <text class="title" x="20" y="28">One intrusion, three filings</text>

  <rect class="hero" x="40" y="50" width="240" height="46" />
  <text class="label-inv" x="160" y="79" text-anchor="middle">Personal-data breach</text>
  <rect class="adj" x="330" y="50" width="240" height="46" />
  <text class="label" x="450" y="79" text-anchor="middle">AI Act serious incident</text>
  <rect class="box" x="620" y="50" width="240" height="46" />
  <text class="label" x="740" y="79" text-anchor="middle">Network-security incident</text>

  <text class="sub" x="160" y="128" text-anchor="middle">72 hours from awareness</text>
  <text class="sub" x="450" y="128" text-anchor="middle">Outer bound 15 days, less for the worst</text>
  <text class="sub" x="740" y="128" text-anchor="middle">Early warning in 24 hours</text>

  <path class="rule" d="M 40 148 L 860 148" />

  <text class="sub" x="160" y="174" text-anchor="middle">To the data protection authority</text>
  <text class="sub" x="450" y="174" text-anchor="middle">To the market surveillance authority</text>
  <text class="sub" x="740" y="174" text-anchor="middle">To the national CSIRT</text>

  <path class="rule" d="M 40 194 L 860 194" />

  <text class="sub" x="160" y="220" text-anchor="middle">Its own form</text>
  <text class="sub" x="450" y="220" text-anchor="middle">Its own form</text>
  <text class="sub" x="740" y="220" text-anchor="middle">Its own form</text>

  <rect class="box" x="40" y="242" width="820" height="40" />
  <text class="label" x="450" y="267" text-anchor="middle">Cause recorded as free text — no enumerated field for "an autonomous agent executed this"</text>
</svg>
