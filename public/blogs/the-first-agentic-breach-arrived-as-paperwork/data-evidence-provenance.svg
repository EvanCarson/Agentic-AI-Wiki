<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="pt pd">
  <title id="pt">Provenance of agentic-attack evidence</title>
  <desc id="pd">A matrix of four evidence sources against four properties: compelled by law, produced by the defender, independent of the attacker's cooperation, and structured enough to count. Model-provider disruption reports and sensor telemetry are voluntary and vendor-side; a leaked operator directory is accidental and depends entirely on attacker carelessness; only a statutory breach notification is compelled, defender-side and adversary-independent, and it is the one source with no structured field to count.</desc>
  <style>
    .cell-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .cell-med    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .cell-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 5; ry: 5; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .cellt  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cellt-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
  </style>

  <text class="title" x="20" y="30">Provenance of agentic-attack evidence</text>

  <text class="head" x="392" y="68" text-anchor="middle">Compelled</text>
  <text class="head" x="552" y="68" text-anchor="middle">Defender-side</text>
  <text class="head" x="712" y="68" text-anchor="middle">Adversary-independent</text>
  <text class="head" x="855" y="68" text-anchor="middle">Countable</text>

  <text class="row" x="20" y="105">Model-provider disruption report</text>
  <rect class="cell-weak" x="318" y="82" width="148" height="34" />
  <text class="cellt" x="392" y="104" text-anchor="middle">Voluntary</text>
  <rect class="cell-weak" x="478" y="82" width="148" height="34" />
  <text class="cellt" x="552" y="104" text-anchor="middle">Vendor</text>
  <rect class="cell-med" x="638" y="82" width="148" height="34" />
  <text class="cellt" x="712" y="104" text-anchor="middle">Own API only</text>
  <rect class="cell-weak" x="798" y="82" width="82" height="34" />
  <text class="cellt" x="839" y="104" text-anchor="middle">No</text>

  <text class="row" x="20" y="151">Honeypot / sensor telemetry</text>
  <rect class="cell-weak" x="318" y="128" width="148" height="34" />
  <text class="cellt" x="392" y="150" text-anchor="middle">Voluntary</text>
  <rect class="cell-med" x="478" y="128" width="148" height="34" />
  <text class="cellt" x="552" y="150" text-anchor="middle">Third party</text>
  <rect class="cell-strong" x="638" y="128" width="148" height="34" />
  <text class="cellt-inv" x="712" y="150" text-anchor="middle">Yes</text>
  <rect class="cell-med" x="798" y="128" width="82" height="34" />
  <text class="cellt" x="839" y="150" text-anchor="middle">Per vendor</text>

  <text class="row" x="20" y="197">Leaked operator directory</text>
  <rect class="cell-weak" x="318" y="174" width="148" height="34" />
  <text class="cellt" x="392" y="196" text-anchor="middle">Accidental</text>
  <rect class="cell-weak" x="478" y="174" width="148" height="34" />
  <text class="cellt" x="552" y="196" text-anchor="middle">Neither</text>
  <rect class="cell-weak" x="638" y="174" width="148" height="34" />
  <text class="cellt" x="712" y="196" text-anchor="middle">Needs sloppiness</text>
  <rect class="cell-weak" x="798" y="174" width="82" height="34" />
  <text class="cellt" x="839" y="196" text-anchor="middle">No</text>

  <text class="row" x="20" y="243">Statutory breach notification</text>
  <rect class="cell-strong" x="318" y="220" width="148" height="34" />
  <text class="cellt-inv" x="392" y="242" text-anchor="middle">72 hours</text>
  <rect class="cell-strong" x="478" y="220" width="148" height="34" />
  <text class="cellt-inv" x="552" y="242" text-anchor="middle">The victim</text>
  <rect class="cell-strong" x="638" y="220" width="148" height="34" />
  <text class="cellt-inv" x="712" y="242" text-anchor="middle">Yes</text>
  <rect class="cell-weak" x="798" y="220" width="82" height="34" />
  <text class="cellt" x="839" y="242" text-anchor="middle">Prose only</text>

  <text class="row" x="20" y="300">What a base rate needs</text>
  <rect class="cell-strong" x="318" y="277" width="148" height="34" />
  <text class="cellt-inv" x="392" y="299" text-anchor="middle">Required</text>
  <rect class="cell-strong" x="478" y="277" width="148" height="34" />
  <text class="cellt-inv" x="552" y="299" text-anchor="middle">Required</text>
  <rect class="cell-strong" x="638" y="277" width="148" height="34" />
  <text class="cellt-inv" x="712" y="299" text-anchor="middle">Required</text>
  <rect class="cell-strong" x="798" y="277" width="82" height="34" />
  <text class="cellt-inv" x="839" y="299" text-anchor="middle">Required</text>

  <rect class="cell-strong" x="318" y="346" width="16" height="16" />
  <text class="head" x="342" y="359">Holds</text>
  <rect class="cell-med" x="410" y="346" width="16" height="16" />
  <text class="head" x="434" y="359">Partial</text>
  <rect class="cell-weak" x="500" y="346" width="16" height="16" />
  <text class="head" x="524" y="359">Fails</text>
</svg>
