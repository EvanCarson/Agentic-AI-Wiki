<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="st sd">
  <title id="st">The intrusion as the victim's logs recorded it</title>
  <desc id="sd">One authenticated session containing four phases in sequence: probing generic files, a valid login, an autonomous vulnerability search inside the application, and then modification of personal data plus access to invoices. A detection threshold line sits at the bottom, crossed only by the write; the reads and the reconnaissance sit below it, inside the entitlements the credentials already carried.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .session { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 5 4; rx: 12; ry: 12; opacity: .8; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
    .thresh { fill: none; stroke: var(--accent, #d4421e); stroke-width: 1.5; stroke-dasharray: 8 5; }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="title" x="20" y="30">The intrusion as the victim's logs recorded it</text>

  <rect class="box" x="20" y="180" width="150" height="90" />
  <text class="label" x="95" y="215" text-anchor="middle">Probe generic</text>
  <text class="label" x="95" y="233" text-anchor="middle">files</text>
  <text class="sub" x="95" y="253" text-anchor="middle">Pre-auth, noisy</text>

  <path class="arrow" d="M 175 225 L 205 225" />

  <rect class="session" x="212" y="70" width="668" height="300" />
  <text class="sub" x="228" y="95">One authenticated session — one identity, one set of entitlements</text>

  <rect class="adj" x="232" y="180" width="150" height="90" />
  <text class="label" x="307" y="215" text-anchor="middle">Valid login</text>
  <text class="sub" x="307" y="240" text-anchor="middle">Nothing to detect</text>

  <path class="arrow" d="M 387 225 L 417 225" />

  <rect class="adj" x="424" y="180" width="180" height="90" />
  <text class="label" x="514" y="208" text-anchor="middle">Autonomous search</text>
  <text class="label" x="514" y="226" text-anchor="middle">for vulnerabilities</text>
  <text class="sub" x="514" y="248" text-anchor="middle">Reads only — looks</text>
  <text class="sub" x="514" y="263" text-anchor="middle">like a thorough user</text>

  <path class="arrow" d="M 609 225 L 639 225" />

  <rect class="hero" x="646" y="150" width="214" height="60" />
  <text class="label-inv" x="753" y="176" text-anchor="middle">Modify personal data</text>
  <text class="sub-inv" x="753" y="196" text-anchor="middle">The write — this is what surfaced</text>

  <rect class="box" x="646" y="240" width="214" height="60" />
  <text class="label" x="753" y="266" text-anchor="middle">Access invoices</text>
  <text class="sub" x="753" y="286" text-anchor="middle">A read — quiet</text>

  <path class="thresh" d="M 20 420 L 880 420" />
  <text class="sub" x="20" y="442">Detection threshold actually configured: writes only</text>
</svg>
