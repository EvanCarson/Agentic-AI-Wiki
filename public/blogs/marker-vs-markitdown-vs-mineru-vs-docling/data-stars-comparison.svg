<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="st sd">
  <title id="st">GitHub stars, thousands</title>
  <desc id="sd">A horizontal bar chart of GitHub star counts in thousands, read on 1 November 2026. MarkItDown has 193.3 thousand, MinerU 82.9 thousand, Docling 69.9 thousand and Marker 40.7 thousand.</desc>
  <style>
    .bc-lead { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .bc-mid  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .bc-tail { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .bc-ttl  { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .bc-row  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .bc-val  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .bc-tick { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .bc-grid { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 4; }
  </style>

  <text class="bc-ttl" x="20" y="34">GitHub stars (thousands)</text>

  <line class="bc-grid" x1="350" y1="88" x2="350" y2="320" />
  <line class="bc-grid" x1="500" y1="88" x2="500" y2="320" />
  <line class="bc-grid" x1="650" y1="88" x2="650" y2="320" />
  <line class="bc-grid" x1="800" y1="88" x2="800" y2="320" />

  <text class="bc-row" x="20" y="121">MarkItDown</text>
  <rect class="bc-lead" x="200" y="96" width="580" height="38" />
  <text class="bc-val" x="790" y="121">193.3k</text>

  <text class="bc-row" x="20" y="181">MinerU</text>
  <rect class="bc-mid" x="200" y="156" width="249" height="38" />
  <text class="bc-val" x="459" y="181">82.9k</text>

  <text class="bc-row" x="20" y="241">Docling</text>
  <rect class="bc-mid" x="200" y="216" width="210" height="38" />
  <text class="bc-val" x="420" y="241">69.9k</text>

  <text class="bc-row" x="20" y="301">Marker</text>
  <rect class="bc-tail" x="200" y="276" width="122" height="38" />
  <text class="bc-val" x="332" y="301">40.7k</text>

  <text class="bc-tick" x="350" y="340" text-anchor="middle">50k</text>
  <text class="bc-tick" x="500" y="340" text-anchor="middle">100k</text>
  <text class="bc-tick" x="650" y="340" text-anchor="middle">150k</text>
  <text class="bc-tick" x="800" y="340" text-anchor="middle">200k</text>
</svg>
