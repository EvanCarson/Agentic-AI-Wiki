<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="mt md">
  <title id="mt">Licensing and provenance across the four converters</title>
  <desc id="md">A four by four matrix. MarkItDown is MIT, bundles no model weights, emits a page comment on one path only, and publishes no score. MinerU uses Apache 2.0 with extra terms for code and the same licence for weights, provides per-element locators, and publishes no score. Docling is MIT with per-model licences, does not state per-element bounding boxes, and publishes no score. Marker is Apache 2.0 for code with Open Rail-M weights, provides a polygon per block, and publishes a 76.0 percent score.</desc>
  <style>
    .mx-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .mx-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .mx-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .mx-ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .mx-col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .mx-row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .mx-cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .mx-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .mx-leg    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
  </style>

  <text class="mx-ttl" x="20" y="34">What the repository actually commits to</text>

  <text class="mx-col" x="295" y="76" text-anchor="middle">Code licence</text>
  <text class="mx-col" x="465" y="76" text-anchor="middle">Weights licence</text>
  <text class="mx-col" x="635" y="76" text-anchor="middle">Per-element bbox</text>
  <text class="mx-col" x="805" y="76" text-anchor="middle">Publishes own score</text>

  <text class="mx-row" x="20" y="118">MarkItDown</text>
  <rect class="mx-strong" x="215" y="92" width="160" height="40" />
  <text class="mx-inv"  x="295" y="117" text-anchor="middle">MIT</text>
  <rect class="mx-mid"    x="385" y="92" width="160" height="40" />
  <text class="mx-cell" x="465" y="117" text-anchor="middle">None bundled</text>
  <rect class="mx-mid"    x="555" y="92" width="160" height="40" />
  <text class="mx-cell" x="635" y="117" text-anchor="middle">Page comment</text>
  <rect class="mx-weak"   x="725" y="92" width="160" height="40" />
  <text class="mx-cell" x="805" y="117" text-anchor="middle">No</text>

  <text class="mx-row" x="20" y="178">MinerU</text>
  <rect class="mx-mid"    x="215" y="152" width="160" height="40" />
  <text class="mx-cell" x="295" y="177" text-anchor="middle">Apache + terms</text>
  <rect class="mx-mid"    x="385" y="152" width="160" height="40" />
  <text class="mx-cell" x="465" y="177" text-anchor="middle">Same licence</text>
  <rect class="mx-strong" x="555" y="152" width="160" height="40" />
  <text class="mx-inv"  x="635" y="177" text-anchor="middle">Yes, locators</text>
  <rect class="mx-weak"   x="725" y="152" width="160" height="40" />
  <text class="mx-cell" x="805" y="177" text-anchor="middle">No</text>

  <text class="mx-row" x="20" y="238">Docling</text>
  <rect class="mx-strong" x="215" y="212" width="160" height="40" />
  <text class="mx-inv"  x="295" y="237" text-anchor="middle">MIT</text>
  <rect class="mx-mid"    x="385" y="212" width="160" height="40" />
  <text class="mx-cell" x="465" y="237" text-anchor="middle">Per model</text>
  <rect class="mx-weak"   x="555" y="212" width="160" height="40" />
  <text class="mx-cell" x="635" y="237" text-anchor="middle">Not stated</text>
  <rect class="mx-weak"   x="725" y="212" width="160" height="40" />
  <text class="mx-cell" x="805" y="237" text-anchor="middle">No</text>

  <text class="mx-row" x="20" y="298">Marker</text>
  <rect class="mx-strong" x="215" y="272" width="160" height="40" />
  <text class="mx-inv"  x="295" y="297" text-anchor="middle">Apache-2.0</text>
  <rect class="mx-weak"   x="385" y="272" width="160" height="40" />
  <text class="mx-cell" x="465" y="297" text-anchor="middle">Open Rail-M</text>
  <rect class="mx-strong" x="555" y="272" width="160" height="40" />
  <text class="mx-inv"  x="635" y="297" text-anchor="middle">Yes, polygon</text>
  <rect class="mx-strong" x="725" y="272" width="160" height="40" />
  <text class="mx-inv"  x="805" y="297" text-anchor="middle">76.0% balanced</text>

  <rect class="mx-strong" x="20"  y="344" width="18" height="14" />
  <text class="mx-leg" x="48"  y="356">Strong</text>
  <rect class="mx-mid"    x="190" y="344" width="18" height="14" />
  <text class="mx-leg" x="218" y="356">Partial</text>
  <rect class="mx-weak"   x="360" y="344" width="18" height="14" />
  <text class="mx-leg" x="388" y="356">Absent or restricted</text>
</svg>
