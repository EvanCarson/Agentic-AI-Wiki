<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-labelledby="t-rc d-rc">
  <title id="t-rc">Billed calls per valid object under retry-based validation</title>
  <desc id="d-rc">Horizontal bar chart of the expected number of billed model calls needed to obtain one schema-valid object when validation is enforced by retrying: 1.05 calls at a 95 percent first-pass rate, 1.25 at 80 percent, 1.67 at 60 percent, 2.50 at 40 percent, and exactly 1.00 for token-masked decoding at any rate.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .value-label { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: start; }
    .axis-note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .6; text-anchor: middle; }
  </style>


  <text class="chart-title" x="490" y="30">What a retry loop costs, per valid object</text>
  <line x1="412" y1="52" x2="412" y2="282" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="575" y1="52" x2="575" y2="282" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="737" y1="52" x2="737" y2="282" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="900" y1="52" x2="900" y2="282" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" stroke-dasharray="3 4" />
  <rect x="250" y="62" width="260" height="30" rx="4" fill="var(--accent, #d4421e)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="row-label" x="236" y="82">Token-masked decoding, any rate</text>
  <text class="value-label" x="522" y="82">1.00</text>
  <rect x="250" y="108" width="273" height="30" rx="4" fill="var(--surface, #f0ede8)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="row-label" x="236" y="128">Retry, 95% valid first pass</text>
  <text class="value-label" x="535" y="128">1.05</text>
  <rect x="250" y="154" width="325" height="30" rx="4" fill="var(--surface, #f0ede8)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="row-label" x="236" y="174">Retry, 80% valid first pass</text>
  <text class="value-label" x="587" y="174">1.25</text>
  <rect x="250" y="200" width="434" height="30" rx="4" fill="var(--accent-soft, #f5c5b8)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="row-label" x="236" y="220">Retry, 60% valid first pass</text>
  <text class="value-label" x="696" y="220">1.67</text>
  <rect x="250" y="246" width="650" height="30" rx="4" fill="var(--accent-soft, #f5c5b8)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="row-label" x="236" y="266">Retry, 40% valid first pass</text>
  <text class="value-label" x="912" y="266">2.50</text>
  <text class="axis-note" x="490" y="304">Expected billed calls per valid object, 1 divided by the first-pass validity rate. Retries also add a full round trip each.</text>
</svg>
