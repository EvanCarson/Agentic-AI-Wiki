<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t-fm2 d-fm2">
  <title id="t-fm2">Capability matrix across four approaches to structured output</title>
  <desc id="d-fm2">Matrix comparing Instructor, Outlines, BAML and provider structured outputs on provider portability, whether validity is guaranteed by construction, multi-language type generation, whether a new toolchain is required, and how much of JSON Schema is supported.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-name    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .cell        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .cell-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .legend      { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .75; text-anchor: start; }
  </style>


