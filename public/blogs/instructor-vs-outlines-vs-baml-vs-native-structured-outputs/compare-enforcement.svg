<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t-ce d-ce">
  <title id="t-ce">Where each approach enforces the schema</title>
  <desc id="d-ce">Four columns showing that Instructor enforces the schema after generation by retrying, Outlines enforces it during generation by masking tokens, BAML enforces it around generation with its own compiler and parser, and provider structured outputs enforce it upstream inside the vendor API.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .scale-num    { font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .scale-num-inv{ font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>


  <text class="chart-title" x="450" y="28">Where the constraint is actually enforced</text>
  <rect class="card-neutral" x="10" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="115" y="72">Instructor</text>
  <text class="scale-num" x="115" y="110">After</text>
  <text class="body-text" x="115" y="140">The model answers, you</text>
  <text class="body-text" x="115" y="158">validate, and a failure</text>
  <text class="body-text" x="115" y="176">buys another billed call</text>
  <text class="body-text" x="115" y="194">with the error attached.</text>
  <rect class="card-accent" x="230" y="44" width="210" height="230" rx="8" />
  <text class="col-head-inv" x="335" y="72">Outlines</text>
  <text class="scale-num-inv" x="335" y="110">During</text>
  <text class="body-text-inv" x="335" y="140">A mask over the logits</text>
  <text class="body-text-inv" x="335" y="158">makes an invalid token</text>
  <text class="body-text-inv" x="335" y="176">unsamplable. Needs the</text>
  <text class="body-text-inv" x="335" y="194">sampler, so: local.</text>
  <rect class="card-soft" x="450" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="555" y="72">BAML</text>
  <text class="scale-num" x="555" y="110">Around</text>
  <text class="body-text" x="555" y="140">A compiler owns the</text>
  <text class="body-text" x="555" y="158">prompt, the parser and</text>
  <text class="body-text" x="555" y="176">the types, and repairs</text>
  <text class="body-text" x="555" y="194">output a parser can fix.</text>
  <rect class="card-soft" x="670" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="775" y="72">Provider native</text>
  <text class="scale-num" x="775" y="110">Upstream</text>
  <text class="body-text" x="775" y="140">The vendor runs the</text>
  <text class="body-text" x="775" y="158">grammar server-side,</text>
  <text class="body-text" x="775" y="176">inside their own schema</text>
  <text class="body-text" x="775" y="194">subset. Nothing to install.</text>
</svg>
