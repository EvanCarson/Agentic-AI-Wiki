<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t-ins d-ins">
  <title id="t-ins">Instructor architecture</title>
  <desc id="d-ins">Instructor wraps an existing provider client, validates the model response against a Pydantic model, and on failure re-asks the model with the validation error attached, so each retry is another billed call.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .lane        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; opacity: .6; text-anchor: middle; letter-spacing: .06em; }
    .box         { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero        { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label       { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub         { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .sub-inv     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .85; text-anchor: middle; }
    .arrow       { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>


  <text class="chart-title" x="450" y="30">Instructor — validate the answer, then ask again</text>
  <text class="lane" x="140" y="62">WHAT YOU WRITE</text>
  <text class="lane" x="450" y="62">WHERE IT RUNS</text>
  <text class="lane" x="760" y="62">WHAT YOU GET</text>
  <rect class="box" x="15" y="82" width="250" height="80" rx="8" />
  <text class="label" x="140" y="108">A Pydantic model</text>
  <text class="sub" x="140" y="128">A schema in the language</text>
  <text class="sub" x="140" y="144">you already use</text>
  <rect class="hero" x="325" y="82" width="250" height="112" rx="8" />
  <text class="label-inv" x="450" y="106">Instructor</text>
  <text class="sub-inv" x="450" y="126">Wraps the provider client</text>
  <text class="sub-inv" x="450" y="142">Validates the response</text>
  <text class="sub-inv" x="450" y="158">Re-asks with the error text</text>
  <text class="sub-inv" x="450" y="174">Works across many providers</text>
  <rect class="box" x="635" y="82" width="250" height="80" rx="8" />
  <text class="label" x="760" y="108">A typed object</text>
  <text class="sub" x="760" y="128">Or an exception once</text>
  <text class="sub" x="760" y="144">max_retries runs out</text>
  <rect class="box" x="635" y="184" width="250" height="80" rx="8" />
  <text class="label" x="760" y="210">What it costs</text>
  <text class="sub" x="760" y="230">Every retry is another</text>
  <text class="sub" x="760" y="246">fully billed call</text>
  <path class="arrow" d="M 268 138 L 322 138" />
  <path class="arrow" d="M 578 138 L 632 138" />
</svg>
