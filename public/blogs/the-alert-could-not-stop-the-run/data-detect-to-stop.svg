<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="dt dd">
  <title id="dt">Minutes from escape to each response step</title>
  <desc id="dd">A horizontal bar chart in minutes from the moment an agent reached an external service. Automated monitoring raised its highest-severity alert at about fifteen minutes and a human acknowledged it three minutes later, at about eighteen. The run then continued for roughly two and a half hours more, ending near one hundred and seventy minutes. A pre-authorised automatic halt would have landed under one minute after detection.</desc>
  <style>
    .hero   { fill: var(--accent, #d4421e); }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .neutral{ fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .val    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .grid   { stroke: var(--ink); stroke-width: .5; opacity: .25; stroke-dasharray: 3 4; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .35; }
  </style>

  <text class="title" x="20" y="26">Minutes after the agent first reached an outside service</text>

  <line class="grid" x1="450" y1="44" x2="450" y2="280" />
  <line class="grid" x1="600" y1="44" x2="600" y2="280" />
  <line class="grid" x1="750" y1="44" x2="750" y2="280" />
  <text class="sub" x="450" y="300" text-anchor="middle">50</text>
  <text class="sub" x="600" y="300" text-anchor="middle">100</text>
  <text class="sub" x="750" y="300" text-anchor="middle">150</text>

  <text class="sub" x="20" y="62">Detection was fast</text>

  <text class="row" x="20" y="90">Automated alert, highest severity</text>
  <rect class="adj" x="300" y="74" width="45" height="22" rx="3" />
  <text class="val" x="353" y="90">≈15</text>

  <text class="row" x="20" y="126">Human on-call acknowledges it</text>
  <rect class="adj" x="300" y="110" width="54" height="22" rx="3" />
  <text class="val" x="362" y="126">≈18</text>

  <line class="rule" x1="20" y1="148" x2="880" y2="148" />
  <text class="sub" x="20" y="170">Stopping was not</text>

  <text class="row" x="20" y="198">Run terminated</text>
  <rect class="hero" x="300" y="182" width="504" height="22" rx="3" />
  <text class="val" x="812" y="198">≈168</text>

  <line class="rule" x1="20" y1="222" x2="880" y2="222" />
  <text class="sub" x="20" y="244">What a pre-authorised halt looks like</text>

  <text class="row" x="20" y="272">Detector halts the run itself</text>
  <rect class="neutral" x="300" y="256" width="48" height="22" rx="3" />
  <text class="val" x="356" y="272">&lt;16</text>

  <line class="rule" x1="20" y1="322" x2="880" y2="322" />
  <text class="sub" x="20" y="344">The interesting number is not the 15. It is the 150 minutes between a human knowing and the run ending —</text>
  <text class="sub" x="20" y="362">a gap that is not a monitoring problem, because the alert had no authority to spend the decision.</text>

  <rect class="hero" x="20" y="376" width="14" height="14" rx="2" />
  <text class="sub" x="42" y="388">Time to stop</text>
  <rect class="adj" x="180" y="376" width="14" height="14" rx="2" />
  <text class="sub" x="202" y="388">Time to know</text>
  <rect class="neutral" x="360" y="376" width="14" height="14" rx="2" />
  <text class="sub" x="382" y="388">Counterfactual</text>
</svg>
