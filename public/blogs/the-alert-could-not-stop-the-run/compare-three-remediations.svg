<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="rt rd">
  <title id="rt">Three tiers a lab can remediate at, and what each one can fix</title>
  <desc id="rd">Three columns comparing remediation at the weights, at the environment and at the capability. Changing the weights cannot fix a reachable resolver; changing the environment fixes the instance and needs proof; pausing the capability is the only lever that acts immediately across every run, and it is the one that was pulled.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .item   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .item-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: var(--ink); opacity: .6; }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>

  <text class="head" x="20" y="26">A containment failure can be answered at three tiers — only one of them acts today</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <rect class="box" x="30" y="58" width="260" height="196" rx="8" />
  <text class="cap" x="46" y="80">TIER 1 — THE WEIGHTS</text>
  <text class="head" x="46" y="104">Retrain or fine-tune</text>
  <text class="item" x="46" y="132">Fixes: a propensity</text>
  <text class="item" x="46" y="154">Cannot fix: a reachable</text>
  <text class="item" x="46" y="170">resolver</text>
  <text class="item" x="46" y="198">Latency: weeks</text>
  <text class="item" x="46" y="228">Not what was done, and</text>
  <text class="item" x="46" y="244">correctly not</text>

  <rect class="adj" x="320" y="58" width="260" height="196" rx="8" />
  <text class="cap" x="336" y="80">TIER 2 — THE ENVIRONMENT</text>
  <text class="head" x="336" y="104">Close the gap</text>
  <text class="item" x="336" y="132">Fixes: this path, verifiably</text>
  <text class="item" x="336" y="154">Cannot fix: the class, unless</text>
  <text class="item" x="336" y="170">you scope it to the class</text>
  <text class="item" x="336" y="198">Latency: days, plus proof</text>
  <text class="item" x="336" y="228">The stated condition for</text>
  <text class="item" x="336" y="244">resuming training</text>

  <rect class="hero" x="610" y="58" width="260" height="196" rx="8" />
  <text class="cap" x="626" y="80" fill="var(--paper)" opacity=".7">TIER 3 — THE CAPABILITY</text>
  <text class="head-inv" x="626" y="104">Pause tool use</text>
  <text class="item-inv" x="626" y="132">Fixes: nothing</text>
  <text class="item-inv" x="626" y="154">Stops: everything, across</text>
  <text class="item-inv" x="626" y="170">every run, at once</text>
  <text class="item-inv" x="626" y="198">Latency: minutes</text>
  <text class="item-inv" x="626" y="228">The only lever with a</text>
  <text class="item-inv" x="626" y="244">same-day effect</text>

  <text class="cap" x="30" y="284">Reading the choice of tier tells you where the operator believes the control lives. Here it was never in the weights.</text>
</svg>
