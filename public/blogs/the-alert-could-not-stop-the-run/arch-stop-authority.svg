<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="st sd">
  <title id="st">Where detection sits and where the authority to stop sits</title>
  <desc id="sd">Two paths from a detector. In the deployed arrangement the detector raises an alert, the alert pages a human, and only the human can ask the orchestrator to halt the run, so the stop waits on a costly judgement call. In the arrangement the incident argues for, a named class of detection is pre-authorised to halt the run directly and the page to the human happens in parallel, after the fact.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13.5px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13.5px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--ink); opacity: .65; }
    .sub-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: var(--paper); opacity: .85; }
    .cap    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: var(--ink); opacity: .7; }
    .cost   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--accent, #d4421e); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr2); }
    .arrow-soft { fill: none; stroke: currentColor; stroke-width: 1; opacity: .45; stroke-dasharray: 4 4; marker-end: url(#arr2); }
    .rule   { stroke: var(--ink); stroke-width: .75; opacity: .3; }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="cap" x="20" y="26">AS DEPLOYED — THE STOP WAITS ON A JUDGEMENT CALL</text>
  <line class="rule" x1="20" y1="38" x2="880" y2="38" />

  <rect class="adj" x="20" y="60" width="160" height="72" rx="8" />
  <text class="label" x="34" y="88">Detector</text>
  <text class="sub" x="34" y="108">unexpected egress</text>
  <text class="sub" x="34" y="124">from a sandbox</text>

  <rect class="box" x="240" y="60" width="160" height="72" rx="8" />
  <text class="label" x="254" y="88">Alert</text>
  <text class="sub" x="254" y="108">highest severity</text>
  <text class="sub" x="254" y="124">no authority attached</text>

  <rect class="box" x="460" y="60" width="160" height="72" rx="8" />
  <text class="label" x="474" y="88">Human on call</text>
  <text class="sub" x="474" y="108">acknowledges, then</text>
  <text class="sub" x="474" y="124">weighs the cost</text>

  <rect class="box" x="680" y="60" width="185" height="72" rx="8" />
  <text class="label" x="694" y="88">Orchestrator</text>
  <text class="sub" x="694" y="108">halts the run when</text>
  <text class="sub" x="694" y="124">someone asks it to</text>

  <g color="currentColor">
    <path class="arrow" d="M 180 96 L 236 96" />
    <path class="arrow" d="M 400 96 L 456 96" />
    <path class="arrow" d="M 620 96 L 676 96" />
  </g>
  <text class="cost" x="196" y="86">15m</text>
  <text class="cost" x="416" y="86">3m</text>
  <text class="cost" x="630" y="86">150m</text>

  <text class="sub" x="474" y="164">The 150 minutes are not inattention. Halting a</text>
  <text class="sub" x="474" y="180">training run costs money that has to be re-spent,</text>
  <text class="sub" x="474" y="196">so the decision belonged to someone senior enough</text>
  <text class="sub" x="474" y="212">to spend it — which is a queue, not a control.</text>

  <line class="rule" x1="20" y1="248" x2="880" y2="248" />
  <text class="cap" x="20" y="276">AS IT SHOULD BE — A NAMED CLASS IS PRE-AUTHORISED</text>

  <rect class="adj" x="20" y="300" width="160" height="72" rx="8" />
  <text class="label" x="34" y="328">Detector</text>
  <text class="sub" x="34" y="348">matches a class on</text>
  <text class="sub" x="34" y="364">the stop-authority list</text>

  <rect class="hero" x="240" y="300" width="230" height="72" rx="8" />
  <text class="label-inv" x="254" y="328">Halt, then page</text>
  <text class="sub-inv" x="254" y="348">the detector stops the run;</text>
  <text class="sub-inv" x="254" y="364">the human reviews a stopped run</text>

  <rect class="box" x="530" y="300" width="160" height="72" rx="8" />
  <text class="label" x="544" y="328">Orchestrator</text>
  <text class="sub" x="544" y="348">checkpoint kept,</text>
  <text class="sub" x="544" y="364">resume is a decision</text>

  <rect class="box" x="705" y="300" width="160" height="72" rx="8" />
  <text class="label" x="719" y="328">Human on call</text>
  <text class="sub" x="719" y="348">decides whether to</text>
  <text class="sub" x="719" y="364">resume, not whether to stop</text>

  <g color="currentColor">
    <path class="arrow" d="M 180 336 L 236 336" />
    <path class="arrow" d="M 470 336 L 526 336" />
    <path class="arrow-soft" d="M 690 336 L 701 336" />
  </g>
  <text class="cost" x="192" y="326">&lt;1m</text>

  <text class="sub" x="20" y="420">The whole design question is which detections are allowed to spend your money without asking. Answer it in advance,</text>
  <text class="sub" x="20" y="438">in writing, per class — because the alternative is that the answer is decided during the incident, by whoever is awake.</text>
  <text class="sub" x="20" y="466">Note what does not change between the two rows: the detector, the alert and the human are identical. Only the arrow that</text>
  <text class="sub" x="20" y="484">reaches the orchestrator moves, and moving it is a policy decision rather than an engineering one.</text>
</svg>
