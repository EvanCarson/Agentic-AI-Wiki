<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t-fm d-fm">
  <title id="t-fm">Capability matrix across four document parsers</title>
  <desc id="d-fm">Matrix comparing Docling, Unstructured, LlamaParse and Mistral OCR 4 on whether they can be self-hosted, table fidelity, reading order on complex layouts, whether boxes and confidence scores are returned, and licence permissiveness.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-name    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .cell        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .cell-inv    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .legend      { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .75; text-anchor: start; }
  </style>


  <text class="chart-title" x="450" y="28">Where each one is actually strong</text>
  <text class="col-head" x="254" y="58">Self-</text>
  <text class="col-head" x="254" y="73">hostable</text>
  <text class="col-head" x="396" y="58">Table</text>
  <text class="col-head" x="396" y="73">fidelity</text>
  <text class="col-head" x="538" y="58">Reading</text>
  <text class="col-head" x="538" y="73">order</text>
  <text class="col-head" x="680" y="58">Boxes and</text>
  <text class="col-head" x="680" y="73">confidence</text>
  <text class="col-head" x="822" y="58">Permissive</text>
  <text class="col-head" x="822" y="73">licence</text>
  <text class="row-name" x="172" y="118">Docling</text>
  <rect x="186" y="86" width="136" height="54" rx="6" fill="var(--accent, #d4421e)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="cell-inv" x="254" y="118">Strong</text>
  <rect x="328" y="86" width="136" height="54" rx="6" fill="var(--accent, #d4421e)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="cell-inv" x="396" y="118">Strong</text>
  <rect x="470" y="86" width="136" height="54" rx="6" fill="var(--accent-soft, #f5c5b8)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="cell" x="538" y="118">Partial</text>
