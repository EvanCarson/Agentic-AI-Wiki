  <text class="cell" x="680" y="118">Partial</text>
  <rect x="754" y="86" width="136" height="54" rx="6" fill="var(--accent, #d4421e)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="cell-inv" x="822" y="118">Strong</text>
