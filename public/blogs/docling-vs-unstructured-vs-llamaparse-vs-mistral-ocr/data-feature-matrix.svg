<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Capability matrix across the four document parsers</title>
  <desc id="d">A four-by-five grid scoring Docling, Unstructured, LlamaParse and Mistral OCR on running fully offline, fidelity on complex tables, handling of handwriting and scans, breadth of supported formats, and whether the tool can fabricate content that was not on the page.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .row-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .legend-text  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: start; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28" text-anchor="middle">Where each one leans hardest</text>

  <text class="body-text" x="238" y="62" text-anchor="middle" style="font-weight:600">Runs fully</text>
  <text class="body-text" x="238" y="76" text-anchor="middle" style="font-weight:600">offline</text>
  <text class="body-text" x="378" y="62" text-anchor="middle" style="font-weight:600">Hard tables</text>
  <text class="body-text" x="378" y="76" text-anchor="middle" style="font-weight:600">and layout</text>
  <text class="body-text" x="518" y="62" text-anchor="middle" style="font-weight:600">Scans and</text>
  <text class="body-text" x="518" y="76" text-anchor="middle" style="font-weight:600">handwriting</text>
  <text class="body-text" x="658" y="62" text-anchor="middle" style="font-weight:600">Format</text>
  <text class="body-text" x="658" y="76" text-anchor="middle" style="font-weight:600">breadth</text>
  <text class="body-text" x="798" y="62" text-anchor="middle" style="font-weight:600">Cannot</text>
  <text class="body-text" x="798" y="76" text-anchor="middle" style="font-weight:600">fabricate</text>

  <text class="row-head" x="154" y="128" text-anchor="end">Docling</text>
  <rect class="card-accent" x="171" y="96" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="238" y="121" text-anchor="middle">Yes — local</text>
  <text class="body-text-inv" x="238" y="135" text-anchor="middle">by design</text>
  <rect class="card-soft" x="311" y="96" width="134" height="56" rx="6" />
  <text class="body-text" x="378" y="121" text-anchor="middle">Good; VLM</text>
  <text class="body-text" x="378" y="135" text-anchor="middle">mode better</text>
  <rect class="card-soft" x="451" y="96" width="134" height="56" rx="6" />
  <text class="body-text" x="518" y="121" text-anchor="middle">VLM mode</text>
  <text class="body-text" x="518" y="135" text-anchor="middle">needed</text>
  <rect class="card-soft" x="591" y="96" width="134" height="56" rx="6" />
  <text class="body-text" x="658" y="128" text-anchor="middle">Document-first</text>
  <rect class="card-soft" x="731" y="96" width="134" height="56" rx="6" />
  <text class="body-text" x="798" y="121" text-anchor="middle">Pipeline safe,</text>
  <text class="body-text" x="798" y="135" text-anchor="middle">VLM not</text>

  <text class="row-head" x="154" y="192" text-anchor="end">Unstructured</text>
  <rect class="card-soft" x="171" y="160" width="134" height="56" rx="6" />
  <text class="body-text" x="238" y="185" text-anchor="middle">Library yes,</text>
  <text class="body-text" x="238" y="199" text-anchor="middle">platform no</text>
  <rect class="card-soft" x="311" y="160" width="134" height="56" rx="6" />
  <text class="body-text" x="378" y="192" text-anchor="middle">Solid</text>
  <rect class="card-neutral" x="451" y="160" width="134" height="56" rx="6" />
  <text class="body-text" x="518" y="185" text-anchor="middle">OCR only,</text>
  <text class="body-text" x="518" y="199" text-anchor="middle">no reading</text>
  <rect class="card-accent" x="591" y="160" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="658" y="185" text-anchor="middle">Widest —</text>
  <text class="body-text-inv" x="658" y="199" text-anchor="middle">the long tail</text>
  <rect class="card-accent" x="731" y="160" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="798" y="185" text-anchor="middle">Relocates,</text>
  <text class="body-text-inv" x="798" y="199" text-anchor="middle">never writes</text>

  <text class="row-head" x="154" y="256" text-anchor="end">LlamaParse</text>
  <rect class="card-neutral" x="171" y="224" width="134" height="56" rx="6" />
  <text class="body-text" x="238" y="256" text-anchor="middle">Hosted only</text>
  <rect class="card-accent" x="311" y="224" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="378" y="249" text-anchor="middle">Strong on</text>
  <text class="body-text-inv" x="378" y="263" text-anchor="middle">top tiers</text>
  <rect class="card-accent" x="451" y="224" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="518" y="256" text-anchor="middle">Strong</text>
  <rect class="card-soft" x="591" y="224" width="134" height="56" rx="6" />
  <text class="body-text" x="658" y="256" text-anchor="middle">Document-first</text>
  <rect class="card-neutral" x="731" y="224" width="134" height="56" rx="6" />
  <text class="body-text" x="798" y="249" text-anchor="middle">Top tiers</text>
  <text class="body-text" x="798" y="263" text-anchor="middle">generate</text>

  <text class="row-head" x="154" y="320" text-anchor="end">Mistral OCR</text>
  <rect class="card-neutral" x="171" y="288" width="134" height="56" rx="6" />
  <text class="body-text" x="238" y="313" text-anchor="middle">Hosted; on-prem</text>
  <text class="body-text" x="238" y="327" text-anchor="middle">for enterprise</text>
  <rect class="card-accent" x="311" y="288" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="378" y="320" text-anchor="middle">Strong</text>
  <rect class="card-accent" x="451" y="288" width="134" height="56" rx="6" />
  <text class="body-text-inv" x="518" y="320" text-anchor="middle">Strong</text>
  <rect class="card-neutral" x="591" y="288" width="134" height="56" rx="6" />
  <text class="body-text" x="658" y="313" text-anchor="middle">Documents</text>
  <text class="body-text" x="658" y="327" text-anchor="middle">and images</text>
  <rect class="card-neutral" x="731" y="288" width="134" height="56" rx="6" />
  <text class="body-text" x="798" y="313" text-anchor="middle">Generates —</text>
  <text class="body-text" x="798" y="327" text-anchor="middle">verify numerics</text>

  <rect class="card-accent" x="171" y="364" width="18" height="18" rx="4" />
  <text class="legend-text" x="197" y="378" text-anchor="start">Strong</text>
  <rect class="card-soft" x="371" y="364" width="18" height="18" rx="4" />
  <text class="legend-text" x="397" y="378" text-anchor="start">Workable</text>
  <rect class="card-neutral" x="591" y="364" width="18" height="18" rx="4" />
  <text class="legend-text" x="617" y="378" text-anchor="start">Weak or not offered</text>
</svg>
