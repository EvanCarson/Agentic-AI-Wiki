<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Layout pipeline parsing architecture</title>
  <desc id="d">A document is split into pages, a layout model detects and classifies regions, OCR runs only on regions with no embedded text layer, a table model recovers cell structure from geometry, and the output is assembled in reading order. Every output span traces back to a bounding box on a page.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .lane        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; opacity: .6; text-anchor: middle; letter-spacing: .06em; }
    .box         { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj         { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero        { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label       { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub         { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .sub-inv     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .85; text-anchor: middle; }
    .arrow       { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .arrow-note  { font-family: var(--font-mono), ui-monospace, monospace; font-size: 10px; fill: currentColor; opacity: .65; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="chart-title" x="450" y="30" text-anchor="middle">Layout pipeline — narrow models in a chain</text>

  <text class="lane" x="110" y="76" text-anchor="middle">INPUT</text>
  <rect class="box" x="20" y="96" width="180" height="86" rx="8" />
  <text class="label" x="110" y="124" text-anchor="middle">Page image</text>
  <text class="sub" x="110" y="146" text-anchor="middle">Plus the embedded text</text>
  <text class="sub" x="110" y="162" text-anchor="middle">layer, when one exists</text>

  <text class="lane" x="450" y="76" text-anchor="middle">THE CHAIN</text>
  <rect class="adj" x="248" y="96" width="180" height="86" rx="8" />
  <text class="label" x="338" y="124" text-anchor="middle">Layout detection</text>
  <text class="sub" x="338" y="146" text-anchor="middle">Regions boxed and</text>
  <text class="sub" x="338" y="162" text-anchor="middle">classified by type</text>

  <rect class="adj" x="476" y="96" width="180" height="86" rx="8" />
  <text class="label" x="566" y="124" text-anchor="middle">OCR, selectively</text>
  <text class="sub" x="566" y="146" text-anchor="middle">Only where there is no</text>
  <text class="sub" x="566" y="162" text-anchor="middle">text layer to reuse</text>

  <rect class="adj" x="248" y="228" width="180" height="86" rx="8" />
  <text class="label" x="338" y="256" text-anchor="middle">Table structure</text>
  <text class="sub" x="338" y="278" text-anchor="middle">Recovered from ruling</text>
  <text class="sub" x="338" y="294" text-anchor="middle">lines and cell geometry</text>

  <rect class="adj" x="476" y="228" width="180" height="86" rx="8" />
  <text class="label" x="566" y="256" text-anchor="middle">Reading order</text>
  <text class="sub" x="566" y="278" text-anchor="middle">Spans serialised into</text>
  <text class="sub" x="566" y="294" text-anchor="middle">a linear document</text>

  <text class="lane" x="790" y="76" text-anchor="middle">OUTPUT</text>
  <rect class="hero" x="700" y="96" width="180" height="218" rx="8" />
  <text class="label-inv" x="790" y="132" text-anchor="middle">Structured text</text>
  <text class="sub-inv" x="790" y="158" text-anchor="middle">Every character came</text>
  <text class="sub-inv" x="790" y="174" text-anchor="middle">from somewhere on</text>
  <text class="sub-inv" x="790" y="190" text-anchor="middle">the page</text>
  <text class="sub-inv" x="790" y="222" text-anchor="middle">Each span traces to a</text>
  <text class="sub-inv" x="790" y="238" text-anchor="middle">bounding box</text>
  <text class="sub-inv" x="790" y="270" text-anchor="middle">Runs on CPU;</text>
  <text class="sub-inv" x="790" y="286" text-anchor="middle">marginal cost ≈ 0</text>

  <path class="arrow" d="M 203 139 L 244 139" />
  <path class="arrow" d="M 431 139 L 472 139" />
  <path class="arrow" d="M 566 185 L 566 224" />
  <path class="arrow" d="M 431 271 L 472 271" />
  <path class="arrow" d="M 659 271 L 696 271" />

  <rect class="box" x="248" y="376" width="408" height="76" rx="8" />
  <text class="label" x="452" y="404" text-anchor="middle">How it fails: omission and disorder</text>
  <text class="sub" x="452" y="426" text-anchor="middle">Dropped footnote · merged columns · cell in the wrong row · table split at a page break</text>
  <text class="arrow-note" x="452" y="352" text-anchor="middle">loud failures — a missing value looks missing</text>
</svg>
