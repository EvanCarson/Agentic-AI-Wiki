<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Monthly parsing cost by volume, three cost regimes</title>
  <desc id="d">Illustrative monthly cost on a logarithmic scale for a hosted VLM API, a self-hosted GPU VLM and a self-hosted CPU layout pipeline, at fifty thousand, five hundred thousand and five million pages per month. The hosted bill grows in a straight line with volume while the self-hosted costs stay nearly flat, so the two cross somewhere in the hundreds of thousands of pages.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .group-head   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: start; }
    .row-label    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: end; }
    .value-label  { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: start; }
    .axis-label   { font-family: var(--font-mono), ui-monospace, monospace; font-size: 11px; fill: currentColor; opacity: .7; text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .bar-neutral  { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .bar-soft     { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .bar-accent   { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>

  <text class="chart-title" x="450" y="28" text-anchor="middle">Monthly cost to parse, at three volumes (log scale)</text>

  <line x1="250" y1="56" x2="250" y2="340" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="450" y1="56" x2="450" y2="340" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="650" y1="56" x2="650" y2="340" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="850" y1="56" x2="850" y2="340" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" stroke-dasharray="3 4" />

  <text class="group-head" x="20" y="66" text-anchor="start">50,000 pages / month</text>
  <rect class="bar-soft" x="250" y="74" width="200" height="18" rx="4" />
  <text class="row-label" x="242" y="87" text-anchor="end">Hosted VLM API</text>
  <text class="value-label" x="458" y="87" text-anchor="start">$100</text>
  <rect class="bar-neutral" x="250" y="98" width="369" height="18" rx="4" />
  <text class="row-label" x="242" y="111" text-anchor="end">Self-host GPU VLM</text>
  <text class="value-label" x="627" y="111" text-anchor="start">$700</text>
  <rect class="bar-accent" x="250" y="122" width="156" height="18" rx="4" />
  <text class="row-label" x="242" y="135" text-anchor="end">Self-host CPU pipeline</text>
  <text class="value-label" x="414" y="135" text-anchor="start">$60</text>

  <text class="group-head" x="20" y="162" text-anchor="start">500,000 pages / month</text>
  <rect class="bar-neutral" x="250" y="170" width="400" height="18" rx="4" />
  <text class="row-label" x="242" y="183" text-anchor="end">Hosted VLM API</text>
  <text class="value-label" x="658" y="183" text-anchor="start">$1,000</text>
  <rect class="bar-soft" x="250" y="194" width="369" height="18" rx="4" />
  <text class="row-label" x="242" y="207" text-anchor="end">Self-host GPU VLM</text>
  <text class="value-label" x="627" y="207" text-anchor="start">$700</text>
  <rect class="bar-accent" x="250" y="218" width="216" height="18" rx="4" />
  <text class="row-label" x="242" y="231" text-anchor="end">Self-host CPU pipeline</text>
  <text class="value-label" x="474" y="231" text-anchor="start">$120</text>

  <text class="group-head" x="20" y="258" text-anchor="start">5,000,000 pages / month</text>
  <rect class="bar-neutral" x="250" y="266" width="600" height="18" rx="4" />
  <text class="row-label" x="242" y="279" text-anchor="end">Hosted VLM API</text>
  <text class="value-label" x="858" y="279" text-anchor="start">$10k</text>
  <rect class="bar-soft" x="250" y="290" width="464" height="18" rx="4" />
  <text class="row-label" x="242" y="303" text-anchor="end">Self-host GPU VLM</text>
  <text class="value-label" x="722" y="303" text-anchor="start">$2,100</text>
  <rect class="bar-accent" x="250" y="314" width="356" height="18" rx="4" />
  <text class="row-label" x="242" y="327" text-anchor="end">Self-host CPU pipeline</text>
  <text class="value-label" x="614" y="327" text-anchor="start">$600</text>

  <text class="axis-label" x="250" y="358" text-anchor="middle">$10</text>
  <text class="axis-label" x="450" y="358" text-anchor="middle">$100</text>
  <text class="axis-label" x="650" y="358" text-anchor="middle">$1,000</text>
  <text class="axis-label" x="850" y="358" text-anchor="middle">$10,000</text>

  <text class="body-text" x="450" y="384" text-anchor="middle" style="opacity:.7">The CPU pipeline is only in the running for documents it can actually read — capability first, then this chart.</text>
</svg>
