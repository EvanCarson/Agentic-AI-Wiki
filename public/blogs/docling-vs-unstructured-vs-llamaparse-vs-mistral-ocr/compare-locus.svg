<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t-cl d-cl">
  <title id="t-cl">What each document parser is really selling</title>
  <desc id="d-cl">Four columns showing that Docling sells control of the compute, Unstructured sells breadth of file-type coverage, LlamaParse sells a vision model priced by mode, and Mistral OCR 4 sells page geometry and confidence scores.</desc>
  <style>
    .chart-title  { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .body-text    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .body-text-inv{ font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); text-anchor: middle; }
    .scale-num    { font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .scale-num-inv{ font-family: var(--font-display); font-size: 20px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .card-neutral { fill: var(--surface, #f0ede8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-soft    { fill: var(--accent-soft, #f5c5b8); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
    .card-accent  { fill: var(--accent, #d4421e); stroke: var(--border-soft, #e0e0e0); stroke-width: 1.25; }
  </style>


  <text class="chart-title" x="450" y="28">What you are actually choosing between</text>
  <rect class="card-neutral" x="10" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="115" y="72">Docling</text>
  <text class="scale-num" x="115" y="110">Control</text>
  <text class="body-text" x="115" y="140">You own the compute, the</text>
  <text class="body-text" x="115" y="158">model versions and the</text>
  <text class="body-text" x="115" y="176">upgrade schedule. No page</text>
  <text class="body-text" x="115" y="194">fee; your GPU, your ops.</text>
  <rect class="card-soft" x="230" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="335" y="72">Unstructured</text>
  <text class="scale-num" x="335" y="110">Breadth</text>
  <text class="body-text" x="335" y="140">One interface over a very</text>
  <text class="body-text" x="335" y="158">wide set of file types.</text>
  <text class="body-text" x="335" y="176">The library is AGPL, which</text>
  <text class="body-text" x="335" y="194">is the real decision here.</text>
  <rect class="card-soft" x="450" y="44" width="210" height="230" rx="8" />
  <text class="col-head" x="555" y="72">LlamaParse</text>
  <text class="scale-num" x="555" y="110">A VLM</text>
  <text class="body-text" x="555" y="140">A vision model reads the</text>
  <text class="body-text" x="555" y="158">page. Quality and price</text>
  <text class="body-text" x="555" y="176">both follow the mode you</text>
  <text class="body-text" x="555" y="194">pick — a 30x spread.</text>
  <rect class="card-accent" x="670" y="44" width="210" height="230" rx="8" />
  <text class="col-head-inv" x="775" y="72">Mistral OCR 4</text>
  <text class="scale-num-inv" x="775" y="110">Geometry</text>
  <text class="body-text-inv" x="775" y="140">Bounding boxes, block</text>
  <text class="body-text-inv" x="775" y="158">classes and per-block</text>
  <text class="body-text-inv" x="775" y="176">confidence: the one that</text>
  <text class="body-text-inv" x="775" y="194">hands you a routing signal.</text>
</svg>
