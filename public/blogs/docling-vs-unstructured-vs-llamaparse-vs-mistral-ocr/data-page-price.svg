<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-labelledby="t-pp d-pp">
  <title id="t-pp">List price per thousand pages across four document parsers</title>
  <desc id="d-pp">Horizontal bar chart of approximate list price per 1,000 pages: self-hosted Docling or Marker $0 in licence fees, Unstructured serverless from about $1, Mistral OCR 4 batch $2, LlamaParse cheapest mode about $3, Mistral OCR 4 standard $4, Unstructured pay-as-you-go about $30, and LlamaParse agentic mode about $90.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-label   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: end; }
    .value-label { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; text-anchor: start; }
    .axis-note   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: .6; text-anchor: middle; }
  </style>


  <text class="chart-title" x="490" y="30">Roughly what a thousand pages costs, in list price</text>
  <line x1="412" y1="52" x2="412" y2="374" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="575" y1="52" x2="575" y2="374" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="737" y1="52" x2="737" y2="374" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="900" y1="52" x2="900" y2="374" stroke="var(--border-soft, #e0e0e0)" stroke-width="1" stroke-dasharray="3 4" />
  <rect x="250" y="62" width="6" height="30" rx="4" fill="var(--surface, #f0ede8)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="row-label" x="236" y="82">Docling / Marker, self-hosted</text>
  <text class="value-label" x="268" y="82">$0</text>
  <rect x="250" y="108" width="7" height="30" rx="4" fill="var(--surface, #f0ede8)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="row-label" x="236" y="128">Unstructured serverless, from</text>
  <text class="value-label" x="269" y="128">$1</text>
  <rect x="250" y="154" width="14" height="30" rx="4" fill="var(--surface, #f0ede8)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="row-label" x="236" y="174">Mistral OCR 4, batch</text>
  <text class="value-label" x="276" y="174">$2</text>
  <rect x="250" y="200" width="22" height="30" rx="4" fill="var(--surface, #f0ede8)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="row-label" x="236" y="220">LlamaParse, cheapest mode</text>
  <text class="value-label" x="284" y="220">$3</text>
  <rect x="250" y="246" width="29" height="30" rx="4" fill="var(--surface, #f0ede8)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="row-label" x="236" y="266">Mistral OCR 4, standard</text>
  <text class="value-label" x="291" y="266">$4</text>
  <rect x="250" y="292" width="217" height="30" rx="4" fill="var(--accent-soft, #f5c5b8)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="row-label" x="236" y="312">Unstructured, pay as you go</text>
  <text class="value-label" x="479" y="312">$30</text>
  <rect x="250" y="338" width="650" height="30" rx="4" fill="var(--accent, #d4421e)" stroke="var(--border-soft, #e0e0e0)" stroke-width="1.25" />
  <text class="row-label" x="236" y="358">LlamaParse, agentic mode</text>
  <text class="value-label" x="912" y="358">$90</text>
  <text class="axis-note" x="490" y="396">US dollars per 1,000 pages at list price. Self-hosting moves the cost to hardware and ops, it does not remove it.</text>
</svg>
