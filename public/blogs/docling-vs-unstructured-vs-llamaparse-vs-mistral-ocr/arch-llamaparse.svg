<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t-llp d-llp">
  <title id="t-llp">LlamaParse architecture</title>
  <desc id="d-llp">LlamaParse is a hosted service in which a vision model reads each page image and returns Markdown, with quality and price both set by the mode you select, from roughly $0.003 to $0.09 per page.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .lane        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; opacity: .6; text-anchor: middle; letter-spacing: .06em; }
    .box         { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero        { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label       { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub         { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .sub-inv     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .85; text-anchor: middle; }
    .arrow       { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>


  <text class="chart-title" x="450" y="30">LlamaParse — a hosted vision model, priced by mode</text>
  <text class="lane" x="140" y="62">WHAT YOU FEED IT</text>
  <text class="lane" x="450" y="62">THE PARSER</text>
  <text class="lane" x="760" y="62">WHAT COMES BACK</text>
  <rect class="box" x="15" y="82" width="250" height="80" rx="8" />
  <text class="label" x="140" y="108">Your documents</text>
  <text class="sub" x="140" y="128">Uploaded, then polled</text>
  <text class="sub" x="140" y="144">for the result</text>
  <rect class="hero" x="325" y="82" width="250" height="112" rx="8" />
  <text class="label-inv" x="450" y="106">LlamaParse</text>
  <text class="sub-inv" x="450" y="126">Hosted; a VLM reads the page</text>
  <text class="sub-inv" x="450" y="142">Modes from cheap to agentic</text>
  <text class="sub-inv" x="450" y="158">About $0.003 to $0.09 a page</text>
  <text class="sub-inv" x="450" y="174">Billed in credits</text>
  <rect class="box" x="635" y="82" width="250" height="80" rx="8" />
  <text class="label" x="760" y="108">Markdown per page</text>
  <text class="sub" x="760" y="128">Tables rendered as</text>
  <text class="sub" x="760" y="144">Markdown or HTML</text>
  <rect class="box" x="635" y="184" width="250" height="80" rx="8" />
  <text class="label" x="760" y="210">Optional target schema</text>
  <text class="sub" x="760" y="230">Extraction against a</text>
  <text class="sub" x="760" y="246">JSON shape you supply</text>
  <path class="arrow" d="M 268 138 L 322 138" />
  <path class="arrow" d="M 578 138 L 632 138" />
</svg>
