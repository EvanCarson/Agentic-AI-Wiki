<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Vision-language model parsing architecture</title>
  <desc id="d">Each page is rendered to an image and passed whole to a vision-language model, which generates Markdown directly from what it sees. There is no per-span provenance back to the page, so unreadable regions are completed with plausible content rather than reported as missing.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .lane        { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; opacity: .6; text-anchor: middle; letter-spacing: .06em; }
    .box         { fill: var(--surface, #f0ede8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .adj         { fill: var(--accent-soft, #f5c5b8); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .hero        { fill: var(--accent, #d4421e); stroke: var(--ink, #1a1a1a); stroke-width: 1.25; }
    .label       { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); text-anchor: middle; }
    .label-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper, #fff); text-anchor: middle; }
    .sub         { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink, #1a1a1a); opacity: .7; text-anchor: middle; }
    .sub-inv     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper, #fff); opacity: .85; text-anchor: middle; }
    .arrow       { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .arrow-note  { font-family: var(--font-mono), ui-monospace, monospace; font-size: 10px; fill: currentColor; opacity: .65; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="chart-title" x="450" y="30" text-anchor="middle">VLM per page — one model, no chain, no provenance</text>

  <text class="lane" x="140" y="76" text-anchor="middle">INPUT</text>
  <rect class="box" x="15" y="96" width="250" height="86" rx="8" />
  <text class="label" x="140" y="124" text-anchor="middle">Page rendered to an image</text>
  <text class="sub" x="140" y="146" text-anchor="middle">The whole page at once —</text>
  <text class="sub" x="140" y="162" text-anchor="middle">no regions, no crops</text>

  <text class="lane" x="450" y="76" text-anchor="middle">ONE MODEL CALL</text>
  <rect class="hero" x="325" y="96" width="250" height="218" rx="8" />
  <text class="label-inv" x="450" y="132" text-anchor="middle">Vision-language model</text>
  <text class="sub-inv" x="450" y="158" text-anchor="middle">Reads layout, tables, charts</text>
  <text class="sub-inv" x="450" y="174" text-anchor="middle">and handwriting together</text>
  <text class="sub-inv" x="450" y="206" text-anchor="middle">Generates Markdown token</text>
  <text class="sub-inv" x="450" y="222" text-anchor="middle">by token, conditioned on</text>
  <text class="sub-inv" x="450" y="238" text-anchor="middle">the image</text>
  <text class="sub-inv" x="450" y="270" text-anchor="middle">Usually transcription.</text>
  <text class="sub-inv" x="450" y="286" text-anchor="middle">Sometimes completion.</text>

  <text class="lane" x="760" y="76" text-anchor="middle">OUTPUT</text>
  <rect class="adj" x="635" y="96" width="250" height="86" rx="8" />
  <text class="label" x="760" y="124" text-anchor="middle">Clean Markdown</text>
  <text class="sub" x="760" y="146" text-anchor="middle">Reads like prose, which is</text>
  <text class="sub" x="760" y="162" text-anchor="middle">what retrieval wants</text>

  <rect class="box" x="635" y="228" width="250" height="86" rx="8" />
  <text class="label" x="760" y="256" text-anchor="middle">No bounding boxes</text>
  <text class="sub" x="760" y="278" text-anchor="middle">Nothing to check the</text>
  <text class="sub" x="760" y="294" text-anchor="middle">output back against</text>

  <path class="arrow" d="M 268 139 L 322 139" />
  <path class="arrow" d="M 578 139 L 632 139" />
  <path class="arrow" d="M 578 271 L 632 271" />

  <rect class="box" x="215" y="376" width="470" height="76" rx="8" />
  <text class="label" x="450" y="404" text-anchor="middle">How it fails: plausible completion</text>
  <text class="sub" x="450" y="426" text-anchor="middle">A smudged figure becomes a figure that fits · a total that did not sum is repaired · a header is normalised</text>
  <text class="arrow-note" x="450" y="352" text-anchor="middle">quiet failures — the output looks better than the input</text>
</svg>
