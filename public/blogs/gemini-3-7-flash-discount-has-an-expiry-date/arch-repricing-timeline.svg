<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">The discount window and what teams do inside it</title>
  <desc id="d">Timeline diagram. A discount window runs from the 13 August 2026 launch of Gemini 3.7 Flash to 31 December 2026, after which the price doubles to the standard rate on 1 January 2027. Below the timeline, two lanes show the trap: during the cheap window teams raise thinking budgets and accept longer trajectories, and those same tuned-up trajectories are what gets repriced at twice the rate on the step date.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .axis   { stroke: var(--ink); stroke-width: 1.5; opacity: .55; }
    .tickline { stroke: var(--ink); stroke-width: 1; opacity: .35; stroke-dasharray: 3 4; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub       { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .sub-inv   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .8; }
    .date      { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .lane-title { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .note   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="chart-title" x="30" y="34">A price with a date on it, and the habit it encourages</text>

  <rect class="adj" x="60" y="62" width="500" height="58" rx="8" />
  <text class="label" x="80" y="88">Introductory rate — $0.75 / $3.75</text>
  <text class="sub" x="80" y="106">13 Aug 2026 through 31 Dec 2026</text>

  <rect class="hero" x="576" y="62" width="264" height="58" rx="8" />
  <text class="label-inv" x="596" y="88">Standard — $1.50 / $7.50</text>
  <text class="sub-inv" x="596" y="106">unchanged from 3.6 Flash</text>

  <line class="axis" x1="60" y1="150" x2="840" y2="150" />
  <line class="tickline" x1="60" y1="120" x2="60" y2="164" />
  <line class="tickline" x1="560" y1="120" x2="560" y2="164" />
  <line class="tickline" x1="576" y1="120" x2="576" y2="164" />

  <text class="date" x="60" y="182">13 AUG 2026</text>
  <text class="date" x="560" y="182" text-anchor="end">31 DEC 2026</text>
  <text class="date" x="840" y="182" text-anchor="end">1 JAN 2027 — 2×</text>

  <text class="lane-title" x="30" y="222">WHAT THE CHEAP WINDOW ENCOURAGES</text>

  <rect class="box" x="30" y="238" width="230" height="84" rx="8" />
  <text class="label" x="48" y="266">Raise the thinking budget</text>
  <text class="sub" x="48" y="286">quality is up and the bill</text>
  <text class="sub" x="48" y="302">still looks fine</text>

  <path class="arrow" d="M 266 280 L 306 280" />

  <rect class="box" x="312" y="238" width="230" height="84" rx="8" />
  <text class="label" x="330" y="266">Accept longer trajectories</text>
  <text class="sub" x="330" y="286">more steps, more retries,</text>
  <text class="sub" x="330" y="302">bigger transcripts</text>

  <path class="arrow" d="M 548 280 L 588 280" />

  <rect class="adj" x="594" y="238" width="246" height="84" rx="8" />
  <text class="label" x="612" y="266">This becomes the baseline</text>
  <text class="sub" x="612" y="286">prompts, evals and budgets</text>
  <text class="sub" x="612" y="302">all calibrated to it</text>

  <path class="arrow" d="M 717 328 L 717 362" />

  <rect class="hero" x="312" y="368" width="528" height="76" rx="8" />
  <text class="label-inv" x="332" y="396">On 1 January, the trajectories you tuned during the discount</text>
  <text class="label-inv" x="332" y="416">are the ones that reprice — at twice the rate, on more tokens</text>
  <text class="sub-inv" x="332" y="434">The step is known in advance. Almost nothing else about it is under your control.</text>

  <text class="note" x="30" y="478">PRICES AS PUBLISHED ON 17 AUGUST 2026. INTRODUCTORY WINDOWS CAN BE EXTENDED — PLAN AS IF THIS ONE IS NOT</text>
</svg>
