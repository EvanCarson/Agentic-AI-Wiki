<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Gemini 3.7 Flash introductory and standard token prices against 3.6 Flash</title>
  <desc id="d">Horizontal bar chart of price per million tokens. For input, Gemini 3.6 Flash lists at one dollar fifty, Gemini 3.7 Flash is seventy-five cents through the end of 2026, and returns to one dollar fifty from January 2027. For output, 3.6 Flash lists at seven dollars fifty, 3.7 Flash is three dollars seventy-five through the end of 2026, and returns to seven dollars fifty. The standard rates are identical to the previous generation; only the introductory window is new.</desc>
  <style>
    .bar-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .bar-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .bar-mute { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .grid     { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 3 4; }
    .axis     { stroke: var(--ink); stroke-width: 1.25; opacity: .5; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .group    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .7; }
    .key      { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .val      { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .val-inv  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--paper); }
    .tick     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .55; }
    .note     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="chart-title" x="30" y="32">USD per million tokens — the list price never moved</text>

  <line class="grid" x1="409" y1="48" x2="409" y2="322" />
  <line class="grid" x1="559" y1="48" x2="559" y2="322" />
  <line class="grid" x1="708" y1="48" x2="708" y2="322" />

  <text class="group" x="30" y="60">INPUT</text>

  <text class="key" x="30" y="84">3.6 Flash, list</text>
  <rect class="bar-mute" x="260" y="66" width="112" height="30" rx="4" />
  <text class="val" x="384" y="87">$1.50</text>

  <text class="key" x="30" y="126">3.7 Flash, to 31 Dec 2026</text>
  <rect class="bar-adj" x="260" y="108" width="56" height="30" rx="4" />
  <text class="val" x="328" y="129">$0.75</text>

  <text class="key" x="30" y="168">3.7 Flash, from 1 Jan 2027</text>
  <rect class="bar-hero" x="260" y="150" width="112" height="30" rx="4" />
  <text class="val" x="384" y="171">$1.50</text>

  <text class="group" x="30" y="206">OUTPUT</text>

  <text class="key" x="30" y="230">3.6 Flash, list</text>
  <rect class="bar-mute" x="260" y="212" width="560" height="30" rx="4" />
  <text class="val-inv" x="806" y="233" text-anchor="end">$7.50</text>

  <text class="key" x="30" y="272">3.7 Flash, to 31 Dec 2026</text>
  <rect class="bar-adj" x="260" y="254" width="280" height="30" rx="4" />
  <text class="val" x="552" y="275">$3.75</text>

  <text class="key" x="30" y="314">3.7 Flash, from 1 Jan 2027</text>
  <rect class="bar-hero" x="260" y="296" width="560" height="30" rx="4" />
  <text class="val-inv" x="806" y="317" text-anchor="end">$7.50</text>

  <line class="axis" x1="260" y1="340" x2="820" y2="340" />
  <text class="tick" x="260" y="358">$0</text>
  <text class="tick" x="409" y="358">$2</text>
  <text class="tick" x="559" y="358">$4</text>
  <text class="tick" x="708" y="358">$6</text>
  <text class="tick" x="820" y="358" text-anchor="end">$8</text>

  <text class="note" x="30" y="384">PUBLISHED RATES AS OF 17 AUGUST 2026. THE FILLED BARS ARE THE PRICE YOU SHOULD BE BUDGETING AGAINST</text>
</svg>
