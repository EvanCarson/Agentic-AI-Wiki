<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Relative cost of the same agent workload across the repricing date</title>
  <desc id="d">Horizontal bar chart of relative cost per completed task, indexed to today. The same workload at the introductory rate is one times. On 1 January 2027 at the standard rate with unchanged effort it is two times. If output tokens per task grew forty-five percent during the discount window because the thinking budget was raised, the same workload lands near two point nine times. The doubling is contractual; the extra is self-inflicted.</desc>
  <style>
    .bar-hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .bar-adj  { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .bar-mute { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .grid     { stroke: var(--ink); stroke-width: 1; opacity: .18; stroke-dasharray: 3 4; }
    .axis     { stroke: var(--ink); stroke-width: 1.25; opacity: .5; }
    .chart-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; fill: var(--ink); }
    .key      { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .keysub   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .val      { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; fill: var(--ink); }
    .val-inv  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; fill: var(--paper); }
    .tick     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .55; }
    .note     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="chart-title" x="30" y="34">Cost per completed task, indexed to what you pay today</text>

  <line class="grid" x1="433" y1="52" x2="433" y2="290" />
  <line class="grid" x1="627" y1="52" x2="627" y2="290" />
  <line class="grid" x1="820" y1="52" x2="820" y2="290" />

  <text class="key" x="30" y="102">Today</text>
  <text class="keysub" x="30" y="118">introductory rate, current effort</text>
  <rect class="bar-mute" x="240" y="80" width="193" height="48" rx="4" />
  <text class="val" x="445" y="111">1.0×</text>

  <text class="key" x="30" y="174">1 Jan 2027</text>
  <text class="keysub" x="30" y="190">standard rate, effort unchanged</text>
  <rect class="bar-adj" x="240" y="152" width="387" height="48" rx="4" />
  <text class="val" x="639" y="183">2.0×</text>

  <text class="key" x="30" y="246">1 Jan 2027</text>
  <text class="keysub" x="30" y="262">standard rate, after tuning up in the window</text>
  <rect class="bar-hero" x="240" y="224" width="561" height="48" rx="4" />
  <text class="val-inv" x="789" y="255" text-anchor="end">~2.9×</text>

  <line class="axis" x1="240" y1="304" x2="820" y2="304" />
  <text class="tick" x="240" y="322">0×</text>
  <text class="tick" x="433" y="322">1×</text>
  <text class="tick" x="627" y="322">2×</text>
  <text class="tick" x="820" y="322" text-anchor="end">3×</text>

  <text class="note" x="30" y="356">THE 2.0× IS ARITHMETIC FROM THE PUBLISHED RATES. THE THIRD BAR IS ILLUSTRATIVE AND ASSUMES OUTPUT</text>
  <text class="note" x="30" y="374">TOKENS PER TASK GREW 45% DURING THE DISCOUNT — SUBSTITUTE YOUR OWN NUMBER, WHICH YOU CAN MEASURE</text>
  <text class="note" x="30" y="392">THE DOUBLING IS CONTRACTUAL AND DATED. EVERYTHING ABOVE IT IS A CHOICE YOU MADE WHILE IT WAS CHEAP</text>
</svg>
