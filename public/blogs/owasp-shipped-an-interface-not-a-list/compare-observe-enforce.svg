<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="oeT oeD">
  <title id="oeT">Three postures for the same hook: observing, advisory and enforcing</title>
  <desc id="oeD">Three columns. Observing: the hook fires, the event is logged, the action proceeds unchanged, and the result is telemetry with no control and no added latency. Advisory: a verdict is computed but not applied, so the latency is paid and the outcome is identical to observing. Enforcing: the verdict is inline, deterministic and blocking, the action is stopped or rewritten before it reaches a production system, and the costs are per-call latency and a false-positive budget.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .8; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Same hook, three postures</text>

  <rect class="box" x="0" y="40" width="286" height="196" />
  <text class="hd" x="143" y="70" text-anchor="middle">Observing</text>
  <text class="cell" x="143" y="98" text-anchor="middle">The hook fires.</text>
  <text class="cell" x="143" y="118" text-anchor="middle">The event is logged.</text>
  <text class="cell" x="143" y="138" text-anchor="middle">The action proceeds.</text>
  <text class="cell" x="143" y="170" text-anchor="middle">You get: a dashboard of</text>
  <text class="cell" x="143" y="188" text-anchor="middle">everything you did not stop.</text>
  <text class="cell" x="143" y="216" text-anchor="middle">Cost: none.</text>

  <rect class="adj" x="306" y="40" width="286" height="196" />
  <text class="hd" x="449" y="70" text-anchor="middle">Advisory</text>
  <text class="cell" x="449" y="98" text-anchor="middle">A verdict is computed.</text>
  <text class="cell" x="449" y="118" text-anchor="middle">It is not applied.</text>
  <text class="cell" x="449" y="138" text-anchor="middle">The action proceeds.</text>
  <text class="cell" x="449" y="170" text-anchor="middle">You get: the same outcome</text>
  <text class="cell" x="449" y="188" text-anchor="middle">as observing.</text>
  <text class="cell" x="449" y="216" text-anchor="middle">Cost: the full latency.</text>

  <rect class="hero" x="612" y="40" width="286" height="196" />
  <text class="hd-inv" x="755" y="70" text-anchor="middle">Enforcing</text>
  <text class="cell-inv" x="755" y="98" text-anchor="middle">Inline, deterministic,</text>
  <text class="cell-inv" x="755" y="118" text-anchor="middle">blocking.</text>
  <text class="cell-inv" x="755" y="138" text-anchor="middle">Stopped or rewritten first.</text>
  <text class="cell-inv" x="755" y="170" text-anchor="middle">You get: a control, and a</text>
  <text class="cell-inv" x="755" y="188" text-anchor="middle">verdict log an auditor reads.</text>
  <text class="cell-inv" x="755" y="216" text-anchor="middle">Cost: latency plus false positives.</text>

  <text class="sub" x="0" y="268">Advisory is a way station, not a destination: it buys the appearance of the control at the full price of it.</text>
  <text class="sub" x="0" y="290">Size the false-positive rate there, then switch to blocking — the middle column is the one to leave.</text>
</svg>
