<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="hkT hkD">
  <title id="hkT">Where ACS hooks fire inside one agent step, and the paths that avoid them</title>
  <desc id="hkD">A left-to-right agent step: input arrives, the model selects a tool, the call is issued, a result returns, and an effect lands on a production system. A hook fires at each of those points and calls out to a Guardian Agent that evaluates declarative policy and returns allow, deny or modify before the action proceeds. Beneath the step sits a band listing paths that never pass a hook: a shell command spawned by generated code, HTTP requests made inside a tool implementation, a sub-agent running in another framework, and a script outside the framework holding its own API key.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .7; }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .8; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .9; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#hkArr); }
    .dash   { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; opacity: .55; marker-end: url(#hkArr); }
  </style>
  <defs>
    <marker id="hkArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="20">One agent step, with the Instrument layer attached</text>

  <text class="lane" x="0" y="52">The step</text>

  <rect class="box" x="0" y="66" width="168" height="80" />
  <text class="hd" x="84" y="96" text-anchor="middle">Input</text>
  <text class="cell" x="84" y="118" text-anchor="middle">User turn, prior</text>
  <text class="cell" x="84" y="134" text-anchor="middle">context, goal.</text>

  <path class="arrow" d="M 173 106 L 190 106" />
  <rect class="adj" x="195" y="66" width="168" height="80" />
  <text class="hd" x="279" y="96" text-anchor="middle">Tool selection</text>
  <text class="cell" x="279" y="118" text-anchor="middle">Which tool, which</text>
  <text class="cell" x="279" y="134" text-anchor="middle">arguments.</text>

  <path class="arrow" d="M 368 106 L 385 106" />
  <rect class="hero" x="390" y="66" width="168" height="80" />
  <text class="hd-inv" x="474" y="96" text-anchor="middle">Call and result</text>
  <text class="cell-inv" x="474" y="118" text-anchor="middle">Request out,</text>
  <text class="cell-inv" x="474" y="134" text-anchor="middle">content back in.</text>

  <path class="arrow" d="M 563 106 L 580 106" />
  <rect class="adj" x="585" y="66" width="168" height="80" />
  <text class="hd" x="669" y="96" text-anchor="middle">Memory, sub-agent,</text>
  <text class="cell" x="669" y="118" text-anchor="middle">code execution.</text>
  <text class="cell" x="669" y="134" text-anchor="middle">Each fires a hook.</text>

  <path class="arrow" d="M 758 106 L 775 106" />
  <rect class="box" x="780" y="66" width="118" height="80" />
  <text class="hd" x="839" y="96" text-anchor="middle">Effect</text>
  <text class="cell" x="839" y="118" text-anchor="middle">Production</text>
  <text class="cell" x="839" y="134" text-anchor="middle">system.</text>

  <path class="dash" d="M 279 216 L 279 152" />
  <path class="dash" d="M 474 216 L 474 152" />
  <path class="dash" d="M 669 216 L 669 152" />

  <rect class="box" x="150" y="220" width="600" height="86" />
  <text class="lane" x="174" y="248">Guardian Agent — one hook contract, any policy engine</text>
  <text class="hd" x="174" y="276">allow</text>
  <text class="hd" x="264" y="276">deny</text>
  <text class="hd" x="354" y="276">modify</text>
  <text class="hd" x="464" y="276">ask</text>
  <text class="hd" x="554" y="276">defer</text>
  <text class="cell" x="174" y="296">Inline and blocking, or it is telemetry rather than a control.</text>

  <text class="sub" x="0" y="344">Every hook above fires inside the step. Everything below leaves by another door.</text>

  <rect class="box" x="0" y="362" width="898" height="104" />
  <text class="lane" x="24" y="390">Unhooked paths</text>
  <text class="hd" x="24" y="418">A shell command spawned by generated code</text>
  <text class="hd" x="470" y="418">HTTP calls inside a tool implementation</text>
  <text class="hd" x="24" y="444">A sub-agent running in another framework</text>
  <text class="hd" x="470" y="444">A script outside the framework, own API key</text>

  <text class="sub" x="0" y="492">The metric is a denominator: what share of externally visible effects passed a hooked call site?</text>
</svg>
