<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="mvT mvD">
  <title id="mvT">OWASP Top 10 for LLM Applications 2026, with movement from 2025</title>
  <desc id="mvD">Ten ranked rows. Prompt Injection holds first place and Sensitive Information Disclosure second. Excessive Agency rises three places from sixth to third. Supply Chain falls to fourth and Data and Model Poisoning to fifth. Unbounded Consumption is sixth, Misinformation seventh, Hidden Context Exposure eighth after being broadened from system-prompt leakage, Vector and Embedding Weaknesses ninth, and Improper Output Handling falls to tenth.</desc>
  <style>
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .rank   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: var(--ink); opacity: .65; }
    .name   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .name-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .move   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .move-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .row    { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; rx: 6; ry: 6; }
    .rowA   { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .rowH   { fill: var(--accent, #d4421e); stroke: none; rx: 6; ry: 6; }
  </style>

  <text class="ttl" x="0" y="20">Top 10 for LLM Applications 2026</text>
  <text class="sub" x="0" y="40">Rank, and movement against the 2025 edition.</text>

  <rect class="rowA" x="0" y="56" width="640" height="28" />
  <text class="rank" x="12" y="75">LLM01</text>
  <text class="name" x="66" y="75">Prompt Injection</text>
  <text class="move" x="560" y="75" text-anchor="end">held 1st</text>

  <rect class="rowA" x="0" y="90" width="640" height="28" />
  <text class="rank" x="12" y="109">LLM02</text>
  <text class="name" x="66" y="109">Sensitive Information Disclosure</text>
  <text class="move" x="560" y="109" text-anchor="end">held 2nd</text>

  <rect class="rowH" x="0" y="124" width="640" height="28" />
  <text class="rank" x="12" y="143" fill="var(--paper)" opacity="0.85">LLM03</text>
  <text class="name-inv" x="66" y="143">Excessive Agency</text>
  <text class="move-inv" x="628" y="143" text-anchor="end">up 3, from 6th</text>

  <rect class="row" x="0" y="158" width="640" height="28" />
  <text class="rank" x="12" y="177">LLM04</text>
  <text class="name" x="66" y="177">Supply Chain</text>
  <text class="move" x="560" y="177" text-anchor="end">down 1</text>

  <rect class="row" x="0" y="192" width="640" height="28" />
  <text class="rank" x="12" y="211">LLM05</text>
  <text class="name" x="66" y="211">Data and Model Poisoning</text>
  <text class="move" x="560" y="211" text-anchor="end">down 1</text>

  <rect class="row" x="0" y="226" width="640" height="28" />
  <text class="rank" x="12" y="245">LLM06</text>
  <text class="name" x="66" y="245">Unbounded Consumption</text>
  <text class="move" x="560" y="245" text-anchor="end">down 1</text>

  <rect class="row" x="0" y="260" width="640" height="28" />
  <text class="rank" x="12" y="279">LLM07</text>
  <text class="name" x="66" y="279">Misinformation</text>
  <text class="move" x="560" y="279" text-anchor="end">down 1</text>

  <rect class="row" x="0" y="294" width="640" height="28" />
  <text class="rank" x="12" y="313">LLM08</text>
  <text class="name" x="66" y="313">Hidden Context Exposure</text>
  <text class="move" x="560" y="313" text-anchor="end">scope widened</text>

  <rect class="row" x="0" y="328" width="640" height="28" />
  <text class="rank" x="12" y="347">LLM09</text>
  <text class="name" x="66" y="347">Vector and Embedding Weaknesses</text>
  <text class="move" x="560" y="347" text-anchor="end">held 9th</text>

  <rect class="row" x="0" y="362" width="640" height="28" />
  <text class="rank" x="12" y="381">LLM10</text>
  <text class="name" x="66" y="381">Improper Output Handling</text>
  <text class="move" x="560" y="381" text-anchor="end">down 5</text>

  <text class="sub" x="676" y="75">Ranked for the first time</text>
  <text class="sub" x="676" y="93">against incident data:</text>
  <text class="sub" x="676" y="111">the expert vote carries</text>
  <text class="sub" x="676" y="129">75%, and roughly 6,639</text>
  <text class="sub" x="676" y="147">recorded incidents carry</text>
  <text class="sub" x="676" y="165">the remaining quarter.</text>

  <text class="sub" x="676" y="205">Excessive Agency is the</text>
  <text class="sub" x="676" y="223">entry where the vote and</text>
  <text class="sub" x="676" y="241">the incident record agree</text>
  <text class="sub" x="676" y="259">most closely — a claim</text>
  <text class="sub" x="676" y="277">about deployments, not</text>
  <text class="sub" x="676" y="295">about models.</text>
</svg>
