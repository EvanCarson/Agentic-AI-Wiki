<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">The campaign funnel, as reported</title>
  <desc id="d">Four reported stages shown as bars. About two dozen Cairn deployments used maliciously; one cluster holding more than 1,100 attack projects across 14 dashboards; more than 1,200 sites attempted; more than 100 breached, a success rate near one in twelve at a reported fifty dollars in tokens per success.</desc>
  <style>
    .bar     { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 4; ry: 4; }
    .bar-mid { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 4; ry: 4; }
    .bar-top { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 4; ry: 4; }
    .ttl     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lbl     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .num     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .note    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
    .grid    { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>

  <text class="ttl" x="20" y="28">Reported scale, stage by stage.</text>

  <path class="grid" d="M 300 52 L 300 352" />
  <path class="grid" d="M 480 52 L 480 352" />
  <path class="grid" d="M 660 52 L 660 352" />

  <text class="lbl" x="20" y="86">Deployments</text>
  <rect class="bar" x="190" y="68" width="24" height="26" />
  <text class="num" x="228" y="88">~24 used maliciously</text>

  <text class="lbl" x="20" y="158">Projects</text>
  <rect class="bar-mid" x="190" y="140" width="580" height="26" />
  <text class="num" x="190" y="196">1,100+ across 14 dashboards</text>

  <text class="lbl" x="20" y="252">Attempted</text>
  <rect class="bar-top" x="190" y="234" width="630" height="26" />
  <text class="num" x="190" y="290">1,200+ sites, mostly e-commerce</text>

  <text class="lbl" x="20" y="334">Breached</text>
  <rect class="bar" x="190" y="316" width="53" height="26" />
  <text class="num" x="257" y="336">100+ — about one in twelve</text>

  <text class="note" x="190" y="374">Bars scale with the reported counts; the deployment and breach bars are small on purpose.</text>
</svg>
