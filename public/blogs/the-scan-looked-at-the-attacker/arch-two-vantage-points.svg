<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Two vantage points on one campaign</title>
  <desc id="d">Left: the target side, where each of more than 1,200 sites sees a few ordinary probes and one unlucky site sees a web shell appear, with no view of any other target and no shared identifier to correlate. Right: the operator side, where a single internet scan reaches fourteen unauthenticated dashboards listing every project, target and outcome at once.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arr); }
    .split  { fill: none; stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 4 5; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="20" y="28">Where the campaign was visible as a campaign.</text>
  <path class="split" d="M 455 46 L 455 460" />

  <rect class="box" x="100" y="52" width="300" height="46" />
  <text class="hd" x="250" y="81">From a target</text>

  <rect class="box" x="100" y="128" width="140" height="70" />
  <text class="vd" x="170" y="158">site 0001</text>
  <text class="vd" x="170" y="180">a few probes</text>

  <rect class="box" x="260" y="128" width="140" height="70" />
  <text class="vd" x="330" y="158">site 0002</text>
  <text class="vd" x="330" y="180">a few probes</text>

  <rect class="adj" x="100" y="214" width="140" height="70" />
  <text class="vd" x="170" y="244">site 0097</text>
  <text class="vd" x="170" y="266">a shell appears</text>

  <rect class="box" x="260" y="214" width="140" height="70" />
  <text class="vd" x="330" y="244">…1,200 more</text>
  <text class="vd" x="330" y="266">each in the dark</text>

  <rect class="box" x="100" y="320" width="300" height="76" />
  <text class="vd" x="250" y="350">no shared identifier</text>
  <text class="vd" x="250" y="372">nothing says "campaign"</text>

  <rect class="hero" x="510" y="52" width="300" height="46" />
  <text class="hd-inv" x="660" y="81">From the operator</text>

  <rect class="box" x="510" y="128" width="300" height="70" />
  <text class="vd" x="660" y="158">one internet-wide scan</text>
  <text class="vd" x="660" y="180">for exposed deployments</text>
  <path class="arrow" d="M 660 198 L 660 224" />

  <rect class="adj" x="510" y="228" width="300" height="70" />
  <text class="vd" x="660" y="258">14 dashboards</text>
  <text class="vd" x="660" y="280">no credential needed</text>
  <path class="arrow" d="M 660 298 L 660 324" />

  <rect class="hero" x="510" y="328" width="300" height="76" />
  <text class="vd-inv" x="660" y="358">every project, target</text>
  <text class="vd-inv" x="660" y="380">and outcome, in one place</text>

  <rect class="adj" x="100" y="424" width="710" height="40" />
  <text class="vd" x="455" y="449">the complete view existed only on the attacker's side</text>
</svg>
