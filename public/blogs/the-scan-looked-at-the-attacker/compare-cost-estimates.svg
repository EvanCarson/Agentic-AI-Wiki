<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">The two published cost estimates compared</title>
  <desc id="d">Two columns. Fifty dollars per successful intrusion, roughly five thousand dollars for the campaign, counting only the hundred attempts that worked. Five dollars per task, counting all twelve hundred attempts, which the researchers call considerably uncertain because token usage was never observed.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hd     { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .hd-inv { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; fill: var(--paper); text-anchor: middle; }
    .vd     { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .vd-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="20" y="28">Same spend, two denominators.</text>

  <text class="lbl" x="20" y="96">Per unit</text>
  <text class="lbl" x="20" y="206">Divides by</text>

  <rect class="hero" x="180" y="52" width="320" height="92" />
  <text class="hd-inv" x="340" y="82">$50 per intrusion</text>
  <text class="vd-inv" x="340" y="108">about $5,000 for the</text>
  <text class="vd-inv" x="340" y="128">whole campaign</text>

  <rect class="adj" x="530" y="52" width="320" height="92" />
  <text class="hd" x="690" y="82">$5 per task</text>
  <text class="vd" x="690" y="108">the researchers' own</text>
  <text class="vd" x="690" y="128">report, with a caveat</text>

  <rect class="box" x="180" y="162" width="320" height="96" />
  <text class="vd" x="340" y="196">the 100+ that worked</text>
  <text class="vd" x="340" y="218">successes only</text>

  <rect class="box" x="530" y="162" width="320" height="96" />
  <text class="vd" x="690" y="196">all 1,200+ attempts</text>
  <text class="vd" x="690" y="218">failures included</text>
</svg>
