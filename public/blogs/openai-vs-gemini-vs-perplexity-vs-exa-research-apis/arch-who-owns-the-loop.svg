<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="lt ld">
  <title id="lt">Where the research loop lives</title>
  <desc id="ld">Two panels. On the left, over a search API, your process owns the plan, search, read, judge and synthesise steps and calls the search API once per query, producing five trace spans you own. On the right, over a research API, your process sends one question and receives one report plus a URL list, while plan, search, read, judge and stop all run inside the vendor boundary.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .shell  { fill: none; stroke: var(--ink); stroke-width: 1; stroke-dasharray: 5 5; opacity: .6; rx: 10; ry: 10; }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .85; }
    .panel  { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); font-weight: 600; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#larr); }
  </style>
  <defs>
    <marker id="larr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="panel" x="30" y="34">Search API — you own the loop</text>
  <rect class="shell" x="30" y="52" width="380" height="352" />
  <text class="sub" x="44" y="74">your process</text>

  <rect class="box" x="56" y="86" width="200" height="40" />
  <text class="label" x="156" y="111" text-anchor="middle">Plan the sub-questions</text>
  <path class="arrow" d="M 156 128 L 156 146" />
  <rect class="adj" x="56" y="150" width="200" height="40" />
  <text class="label" x="156" y="175" text-anchor="middle">Issue a query</text>
  <path class="arrow" d="M 156 192 L 156 210" />
  <rect class="box" x="56" y="214" width="200" height="40" />
  <text class="label" x="156" y="239" text-anchor="middle">Fetch and read</text>
  <path class="arrow" d="M 156 256 L 156 274" />
  <rect class="box" x="56" y="278" width="200" height="40" />
  <text class="label" x="156" y="303" text-anchor="middle">Enough evidence?</text>
  <path class="arrow" d="M 156 320 L 156 338" />
  <rect class="box" x="56" y="342" width="200" height="40" />
  <text class="label" x="156" y="367" text-anchor="middle">Synthesise</text>

  <path class="arrow" d="M 258 170 L 282 170" />
  <rect class="box" x="286" y="150" width="104" height="40" />
  <text class="label" x="338" y="175" text-anchor="middle">search API</text>

  <text class="sub" x="30" y="428">Five spans in your trace.</text>
  <text class="sub" x="30" y="446">Every stopping decision is yours.</text>

  <text class="panel" x="470" y="34">Research API — the vendor owns it</text>
  <rect class="shell" x="470" y="52" width="400" height="352" />
  <text class="sub" x="484" y="74">your process</text>

  <rect class="box" x="496" y="86" width="348" height="40" />
  <text class="label" x="670" y="111" text-anchor="middle">One question</text>
  <path class="arrow" d="M 670 128 L 670 156" />

  <rect class="hero" x="496" y="160" width="348" height="148" />
  <text class="label-inv" x="670" y="196" text-anchor="middle">Vendor boundary</text>
  <text class="sub-inv" x="670" y="224" text-anchor="middle">plan · expand · fetch · read · judge · stop</text>
  <text class="sub-inv" x="670" y="250" text-anchor="middle">query budget, depth and stopping rule</text>
  <text class="sub-inv" x="670" y="276" text-anchor="middle">set by the service, not by your request</text>

  <path class="arrow" d="M 670 310 L 670 338" />
  <rect class="box" x="496" y="342" width="348" height="40" />
  <text class="label" x="670" y="367" text-anchor="middle">One report, plus a list of sources</text>

  <text class="sub" x="470" y="428">One span. The report is a summary</text>
  <text class="sub" x="470" y="446">written by the system you would debug.</text>
</svg>
