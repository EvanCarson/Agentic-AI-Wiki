<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="bt bd">
  <title id="bt">How many meters each service runs</title>
  <desc id="bd">Four columns of billing meters. OpenAI runs two: input tokens and output tokens. Gemini runs one headline per-task price with a search-grounding line item underneath it. Perplexity runs five: input tokens, output tokens, citation tokens, reasoning tokens and search queries. Exa runs one: a fixed price per request or per run mode.</desc>
  <style>
    .band-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .band-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .band-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .chip   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 4; ry: 4; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); font-weight: 600; }
    .name     { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .name-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .meter  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); }
    .foot   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="title" x="20" y="28">Meters you are billed on</text>

  <rect class="band-mid" x="45" y="52" width="170" height="34" />
  <text class="name" x="130" y="74" text-anchor="middle">OpenAI</text>
  <rect class="chip" x="45" y="100" width="170" height="26" />
  <text class="meter" x="130" y="118" text-anchor="middle">input tokens</text>
  <rect class="chip" x="45" y="132" width="170" height="26" />
  <text class="meter" x="130" y="150" text-anchor="middle">output tokens</text>
  <text class="foot" x="130" y="288" text-anchor="middle">2 meters, uncapped</text>

  <rect class="band-strong" x="255" y="52" width="170" height="34" />
  <text class="name-inv" x="340" y="74" text-anchor="middle">Gemini</text>
  <rect class="chip" x="255" y="100" width="170" height="26" />
  <text class="meter" x="340" y="118" text-anchor="middle">per task</text>
  <rect class="chip" x="255" y="132" width="170" height="26" />
  <text class="meter" x="340" y="150" text-anchor="middle">search $14 / 1K</text>
  <text class="foot" x="340" y="288" text-anchor="middle">1 headline, 1 line item</text>

  <rect class="band-weak" x="465" y="52" width="170" height="34" />
  <text class="name" x="550" y="74" text-anchor="middle">Perplexity</text>
  <rect class="chip" x="465" y="100" width="170" height="26" />
  <text class="meter" x="550" y="118" text-anchor="middle">input tokens</text>
  <rect class="chip" x="465" y="132" width="170" height="26" />
  <text class="meter" x="550" y="150" text-anchor="middle">output tokens</text>
  <rect class="chip" x="465" y="164" width="170" height="26" />
  <text class="meter" x="550" y="182" text-anchor="middle">citation tokens</text>
  <rect class="chip" x="465" y="196" width="170" height="26" />
  <text class="meter" x="550" y="214" text-anchor="middle">reasoning tokens</text>
  <rect class="chip" x="465" y="228" width="170" height="26" />
  <text class="meter" x="550" y="246" text-anchor="middle">search queries</text>
  <text class="foot" x="550" y="288" text-anchor="middle">5 meters, two invisible</text>

  <rect class="band-strong" x="675" y="52" width="170" height="34" />
  <text class="name-inv" x="760" y="74" text-anchor="middle">Exa</text>
  <rect class="chip" x="675" y="100" width="170" height="26" />
  <text class="meter" x="760" y="118" text-anchor="middle">per request / run</text>
  <text class="foot" x="760" y="288" text-anchor="middle">1 meter, capped by mode</text>

  <text class="foot" x="20" y="322">Accent marks a bill you can forecast before the run; the forecast costs you the ability to let one question run long.</text>
</svg>
