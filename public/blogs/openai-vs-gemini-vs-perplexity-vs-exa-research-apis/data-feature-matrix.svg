<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="mt md">
  <title id="mt">Research APIs across four axes</title>
  <desc id="md">A four-by-four matrix. OpenAI: bibliography-level citations, private corpus via MCP, token billing, some loop control through tool choice. Gemini: per-claim sourcing, private corpus via MCP and file search, fixed per-task billing, no loop control. Perplexity: bibliography-level citations, web-only corpus, five billing meters, no loop control. Exa: field-level grounding with confidence, web-only corpus, fixed per-request billing, effort modes.</desc>
  <style>
    .strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .medium { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .title  { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); font-weight: 600; }
    .head   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .row    { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; fill: var(--ink); }
    .cell     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .foot   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="title" x="20" y="28">What separates the four</text>

  <text class="head" x="265" y="74" text-anchor="middle">Citation granularity</text>
  <text class="head" x="445" y="74" text-anchor="middle">Private corpus</text>
  <text class="head" x="625" y="74" text-anchor="middle">Bill predictability</text>
  <text class="head" x="805" y="74" text-anchor="middle">Loop control</text>

  <text class="row" x="20" y="120">OpenAI</text>
  <rect class="weak"   x="180" y="88" width="170" height="48" />
  <text class="cell"     x="265" y="117" text-anchor="middle">Bibliography</text>
  <rect class="strong" x="360" y="88" width="170" height="48" />
  <text class="cell-inv" x="445" y="117" text-anchor="middle">Via MCP</text>
  <rect class="weak"   x="540" y="88" width="170" height="48" />
  <text class="cell"     x="625" y="117" text-anchor="middle">Token-metered</text>
  <rect class="medium" x="720" y="88" width="170" height="48" />
  <text class="cell"     x="805" y="117" text-anchor="middle">Tool choice</text>

  <text class="row" x="20" y="184">Gemini</text>
  <rect class="medium" x="180" y="152" width="170" height="48" />
  <text class="cell"     x="265" y="181" text-anchor="middle">Per claim</text>
  <rect class="strong" x="360" y="152" width="170" height="48" />
  <text class="cell-inv" x="445" y="181" text-anchor="middle">Via MCP + files</text>
  <rect class="strong" x="540" y="152" width="170" height="48" />
  <text class="cell-inv" x="625" y="181" text-anchor="middle">Per task</text>
  <rect class="weak"   x="720" y="152" width="170" height="48" />
  <text class="cell"     x="805" y="181" text-anchor="middle">Fixed</text>

  <text class="row" x="20" y="248">Perplexity</text>
  <rect class="weak"   x="180" y="216" width="170" height="48" />
  <text class="cell"     x="265" y="245" text-anchor="middle">Bibliography</text>
  <rect class="weak"   x="360" y="216" width="170" height="48" />
  <text class="cell"     x="445" y="245" text-anchor="middle">Web only</text>
  <rect class="weak"   x="540" y="216" width="170" height="48" />
  <text class="cell"     x="625" y="245" text-anchor="middle">Five meters</text>
  <rect class="weak"   x="720" y="216" width="170" height="48" />
  <text class="cell"     x="805" y="245" text-anchor="middle">Fixed</text>

  <text class="row" x="20" y="312">Exa</text>
  <rect class="strong" x="180" y="280" width="170" height="48" />
  <text class="cell-inv" x="265" y="309" text-anchor="middle">Field-level</text>
  <rect class="weak"   x="360" y="280" width="170" height="48" />
  <text class="cell"     x="445" y="309" text-anchor="middle">Web only</text>
  <rect class="strong" x="540" y="280" width="170" height="48" />
  <text class="cell-inv" x="625" y="309" text-anchor="middle">Per request</text>
  <rect class="medium" x="720" y="280" width="170" height="48" />
  <text class="cell"     x="805" y="309" text-anchor="middle">Effort modes</text>

  <rect class="strong" x="180" y="356" width="16" height="16" />
  <text class="foot" x="204" y="369">Strong</text>
  <rect class="medium" x="300" y="356" width="16" height="16" />
  <text class="foot" x="324" y="369">Partial</text>
  <rect class="weak" x="420" y="356" width="16" height="16" />
  <text class="foot" x="444" y="369">Weak or absent</text>
</svg>
