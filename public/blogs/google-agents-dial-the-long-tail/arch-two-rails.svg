<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Two rails an agent can use to reach a merchant</title>
  <desc id="d">The structured rail carries a signed mandate to a merchant endpoint and returns a machine-readable receipt. The voice rail carries only audio to a human, and returns a summary the agent wrote itself.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .rail-title  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; }
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .hero   { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); text-anchor: middle; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; text-anchor: middle; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.4; marker-end: url(#arr); }
    .divider { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="chart-title" x="450" y="28">The same errand, down two different rails</text>

  <text class="rail-title" x="30" y="66">Structured rail — merchants who implemented a protocol</text>

  <rect class="hero" x="30" y="82" width="170" height="70" rx="8" />
  <text class="label-inv" x="115" y="110">Agent</text>
  <text class="label-inv" x="115" y="130" style="opacity:.85">acting for a user</text>

  <rect class="adj" x="255" y="82" width="200" height="70" rx="8" />
  <text class="label" x="355" y="104">Signed mandate</text>
  <text class="sub" x="355" y="124">intent · cart · payment,</text>
  <text class="sub" x="355" y="140">cryptographically bound</text>

  <rect class="box" x="510" y="82" width="170" height="70" rx="8" />
  <text class="label" x="595" y="112">Merchant endpoint</text>
  <text class="sub" x="595" y="132">authenticated API</text>

  <rect class="box" x="735" y="82" width="135" height="70" rx="8" />
  <text class="label" x="802" y="112">Receipt</text>
  <text class="sub" x="802" y="132">machine-readable</text>

  <path class="arrow" d="M 204 117 L 250 117" />
  <path class="arrow" d="M 459 117 L 505 117" />
  <path class="arrow" d="M 684 117 L 730 117" />

  <text class="sub" x="450" y="182" style="opacity:.8">Identity, authorisation, replay protection and proof of outcome all travel with the request.</text>

  <line class="divider" x1="30" y1="212" x2="870" y2="212" />

  <text class="rail-title" x="30" y="252">Voice rail — everyone else</text>

  <rect class="hero" x="30" y="268" width="150" height="70" rx="8" />
  <text class="label-inv" x="105" y="296">Agent</text>
  <text class="label-inv" x="105" y="316" style="opacity:.85">acting for a user</text>

  <rect class="box" x="228" y="268" width="150" height="70" rx="8" />
  <text class="label" x="303" y="298">PSTN</text>
  <text class="sub" x="303" y="318">audio only</text>

  <rect class="box" x="426" y="268" width="160" height="70" rx="8" />
  <text class="label" x="506" y="292">Shop phone</text>
  <text class="sub" x="506" y="312">a person, mid-shift,</text>
  <text class="sub" x="506" y="328">no idea who is calling</text>

  <rect class="box" x="634" y="268" width="150" height="70" rx="8" />
  <text class="label" x="709" y="292">Spoken answer</text>
  <text class="sub" x="709" y="312">&#8220;yeah, a couple left,</text>
  <text class="sub" x="709" y="328">I think&#8221;</text>

  <path class="arrow" d="M 184 303 L 223 303" />
  <path class="arrow" d="M 382 303 L 421 303" />
  <path class="arrow" d="M 590 303 L 629 303" />

  <path class="arrow" d="M 709 342 L 709 378" />
  <rect class="adj" x="594" y="386" width="230" height="58" rx="8" />
  <text class="label" x="709" y="410">Summary text to the user</text>
  <text class="sub" x="709" y="430">written by the agent, from itself</text>

  <text class="sub" x="330" y="410" style="opacity:.85">No caller identity. No mandate. No idempotency key.</text>
  <text class="sub" x="330" y="430" style="opacity:.85">Nothing the user can verify independently.</text>

  <text class="sub" x="450" y="478" style="opacity:.75">The rail an errand takes is decided by the merchant's integration budget, not by how much the outcome matters.</text>
</svg>
