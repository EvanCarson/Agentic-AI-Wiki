<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Which guarantees survive on each agent-to-merchant channel</title>
  <desc id="d">A matrix of three channels against five guarantees. The protocol rail carries all five, a browser agent on a web checkout carries some, and a phone call carries almost none.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-head { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .row-head { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; }
    .cell-strong { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1; }
    .cell-mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; }
    .cell-weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .cv     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .cv-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); text-anchor: middle; }
    .legend { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; }
  </style>

  <text class="chart-title" x="450" y="26">What each channel can actually promise</text>

  <text class="col-head" x="330" y="62">Caller</text><text class="col-head" x="330" y="76">identity</text>
  <text class="col-head" x="450" y="62">Scoped</text><text class="col-head" x="450" y="76">authorisation</text>
  <text class="col-head" x="570" y="62">Replay</text><text class="col-head" x="570" y="76">protection</text>
  <text class="col-head" x="690" y="62">Verifiable</text><text class="col-head" x="690" y="76">receipt</text>
  <text class="col-head" x="810" y="62">Callee</text><text class="col-head" x="810" y="76">opt-out</text>

  <text class="row-head" x="30" y="118">Protocol rail</text>
  <rect class="cell-strong" x="272" y="94" width="114" height="42" rx="5" />
  <text class="cv-inv" x="329" y="120">Signed</text>
  <rect class="cell-strong" x="393" y="94" width="114" height="42" rx="5" />
  <text class="cv-inv" x="450" y="120">Mandate</text>
  <rect class="cell-strong" x="514" y="94" width="114" height="42" rx="5" />
  <text class="cv-inv" x="571" y="120">Nonce</text>
  <rect class="cell-strong" x="635" y="94" width="114" height="42" rx="5" />
  <text class="cv-inv" x="692" y="120">Yes</text>
  <rect class="cell-mid" x="756" y="94" width="114" height="42" rx="5" />
  <text class="cv" x="813" y="120">Don't integrate</text>

  <text class="row-head" x="30" y="188">Browser agent</text>
  <text class="row-head" x="30" y="204" style="font-weight:400;opacity:.7">on a web checkout</text>
  <rect class="cell-mid" x="272" y="164" width="114" height="42" rx="5" />
  <text class="cv" x="329" y="190">Session only</text>
  <rect class="cell-mid" x="393" y="164" width="114" height="42" rx="5" />
  <text class="cv" x="450" y="190">User's own</text>
  <rect class="cell-mid" x="514" y="164" width="114" height="42" rx="5" />
  <text class="cv" x="571" y="190">Order ID</text>
  <rect class="cell-strong" x="635" y="164" width="114" height="42" rx="5" />
  <text class="cv-inv" x="692" y="190">Order page</text>
  <rect class="cell-mid" x="756" y="164" width="114" height="42" rx="5" />
  <text class="cv" x="813" y="190">Bot rules</text>

  <text class="row-head" x="30" y="258">Phone call</text>
  <text class="row-head" x="30" y="274" style="font-weight:400;opacity:.7">agent to a human</text>
  <rect class="cell-weak" x="272" y="234" width="114" height="42" rx="5" />
  <text class="cv" x="329" y="260">Claimed</text>
  <rect class="cell-weak" x="393" y="234" width="114" height="42" rx="5" />
  <text class="cv" x="450" y="260">None</text>
  <rect class="cell-weak" x="514" y="234" width="114" height="42" rx="5" />
  <text class="cv" x="571" y="260">None</text>
  <rect class="cell-weak" x="635" y="234" width="114" height="42" rx="5" />
  <text class="cv" x="692" y="260">Self-reported</text>
  <rect class="cell-weak" x="756" y="234" width="114" height="42" rx="5" />
  <text class="cv" x="813" y="260">Per-vendor</text>

  <rect class="cell-strong" x="272" y="316" width="16" height="16" rx="3" />
  <text class="legend" x="296" y="329">Carried by the channel</text>
  <rect class="cell-mid" x="452" y="316" width="16" height="16" rx="3" />
  <text class="legend" x="476" y="329">Partial or borrowed</text>
  <rect class="cell-weak" x="632" y="316" width="16" height="16" rx="3" />
  <text class="legend" x="656" y="329">Absent</text>

  <text class="legend" x="30" y="368" style="opacity:.7">Every row below the first is a downgrade the user never chose and cannot see.</text>
</svg>
