<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">What the business on the receiving end can do about agent calls</title>
  <desc id="d">Three controls a called business would need — knowing who is calling, refusing future calls, and verifying what was agreed — and what is actually available for each today.</desc>
  <style>
    .chart-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: currentColor; text-anchor: middle; }
    .col-title { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--paper); text-anchor: middle; }
    .label     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: currentColor; text-anchor: middle; }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); text-anchor: middle; opacity: .88; }
    .hero { fill: var(--accent, #d4421e); stroke: var(--ink); stroke-width: 1.25; }
    .box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.4; marker-end: url(#arr3); }
  </style>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="chart-title" x="450" y="28">The callee's three questions, and where each answer lives</text>

  <rect class="hero" x="35" y="50" width="250" height="80" rx="8" />
  <text class="col-title" x="160" y="78">Who is calling me?</text>
  <text class="label-inv" x="160" y="100">The agent says so, out loud.</text>
  <text class="label-inv" x="160" y="116">Nothing signs the claim.</text>

  <rect class="hero" x="325" y="50" width="250" height="80" rx="8" />
  <text class="col-title" x="450" y="78">Can I refuse the next one?</text>
  <text class="label-inv" x="450" y="100">Yes &#8212; per vendor,</text>
  <text class="label-inv" x="450" y="116">through that vendor's channel.</text>

  <rect class="hero" x="615" y="50" width="250" height="80" rx="8" />
  <text class="col-title" x="740" y="78">What did I agree to?</text>
  <text class="label-inv" x="740" y="100">Whatever the transcript says.</text>
  <text class="label-inv" x="740" y="116">You do not hold a copy.</text>

  <path class="arrow" d="M 160 136 L 160 168" />
  <path class="arrow" d="M 450 136 L 450 168" />
  <path class="arrow" d="M 740 136 L 740 168" />

  <rect class="box" x="35" y="176" width="250" height="66" rx="8" />
  <text class="label" x="160" y="200">Would need: a signed caller</text>
  <text class="label" x="160" y="218">identity the callee can check</text>

  <rect class="box" x="325" y="176" width="250" height="66" rx="8" />
  <text class="label" x="450" y="200">Would need: one registry</text>
  <text class="label" x="450" y="218">every agent operator honours</text>

  <rect class="box" x="615" y="176" width="250" height="66" rx="8" />
  <text class="label" x="740" y="200">Would need: a receipt issued</text>
  <text class="label" x="740" y="218">to both sides of the call</text>

  <text class="label" x="450" y="274" style="opacity:.7">None of the three exists as a standard. All three exist on the rail the same companies built for merchants with an API.</text>
</svg>
