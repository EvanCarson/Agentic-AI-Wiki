<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fmT2 fmD2">
  <title id="fmT2">Four sensitive-data tools against four axes</title>
  <desc id="fmD2">A matrix. Presidio is weak on giving a guarantee without detection, strong on self-hosting, medium on reversible re-identification, and weak on coverage beyond the model call. Limina is weak on guarantee without detection, medium on self-hosting, strong on reversible re-identification, and weak on coverage beyond the model call. Skyflow is strong on guarantee without detection, weak on self-hosting, strong on reversible re-identification, and medium on coverage beyond the model call. Nightfall is weak on guarantee without detection, weak on self-hosting, weak on reversible re-identification, and strong on coverage beyond the model call.</desc>
  <style>
    .weak   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .mid    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1; rx: 6; ry: 6; }
    .strong { fill: var(--accent, #d4421e); stroke: none; rx: 6; ry: 6; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .row    { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .col    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .lg     { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .65; }
  </style>

  <text class="ttl" x="0" y="18">What each one is actually good at</text>

  <text class="col" x="284" y="48" text-anchor="middle">Guarantee without</text>
  <text class="col" x="284" y="63" text-anchor="middle">detection</text>
  <text class="col" x="457" y="48" text-anchor="middle">Self-host or</text>
  <text class="col" x="457" y="63" text-anchor="middle">open source</text>
  <text class="col" x="630" y="48" text-anchor="middle">Reversible</text>
  <text class="col" x="630" y="63" text-anchor="middle">re-identification</text>
  <text class="col" x="803" y="48" text-anchor="middle">Coverage beyond</text>
  <text class="col" x="803" y="63" text-anchor="middle">the model call</text>

  <text class="row" x="0" y="105">Presidio</text>
  <rect class="weak" x="200" y="78" width="168" height="44" />
  <text class="cell" x="284" y="105" text-anchor="middle">Weak</text>
  <rect class="strong" x="373" y="78" width="168" height="44" />
  <text class="cell-inv" x="457" y="105" text-anchor="middle">Strong (MIT)</text>
  <rect class="mid" x="546" y="78" width="168" height="44" />
  <text class="cell" x="630" y="105" text-anchor="middle">Medium</text>
  <rect class="weak" x="719" y="78" width="168" height="44" />
  <text class="cell" x="803" y="105" text-anchor="middle">Weak</text>

  <text class="row" x="0" y="183">Limina</text>
  <rect class="weak" x="200" y="156" width="168" height="44" />
  <text class="cell" x="284" y="183" text-anchor="middle">Weak</text>
  <rect class="mid" x="373" y="156" width="168" height="44" />
  <text class="cell" x="457" y="183" text-anchor="middle">Medium (container)</text>
  <rect class="strong" x="546" y="156" width="168" height="44" />
  <text class="cell-inv" x="630" y="183" text-anchor="middle">Strong</text>
  <rect class="weak" x="719" y="156" width="168" height="44" />
  <text class="cell" x="803" y="183" text-anchor="middle">Weak</text>

  <text class="row" x="0" y="261">Skyflow</text>
  <rect class="strong" x="200" y="234" width="168" height="44" />
  <text class="cell-inv" x="284" y="261" text-anchor="middle">Strong</text>
  <rect class="weak" x="373" y="234" width="168" height="44" />
  <text class="cell" x="457" y="261" text-anchor="middle">Weak</text>
  <rect class="strong" x="546" y="234" width="168" height="44" />
  <text class="cell-inv" x="630" y="261" text-anchor="middle">Strong</text>
  <rect class="mid" x="719" y="234" width="168" height="44" />
  <text class="cell" x="803" y="261" text-anchor="middle">Medium</text>

  <text class="row" x="0" y="339">Nightfall</text>
  <rect class="weak" x="200" y="312" width="168" height="44" />
  <text class="cell" x="284" y="339" text-anchor="middle">Weak</text>
  <rect class="weak" x="373" y="312" width="168" height="44" />
  <text class="cell" x="457" y="339" text-anchor="middle">Weak</text>
  <rect class="weak" x="546" y="312" width="168" height="44" />
  <text class="cell" x="630" y="339" text-anchor="middle">Weak</text>
  <rect class="strong" x="719" y="312" width="168" height="44" />
  <text class="cell-inv" x="803" y="339" text-anchor="middle">Strong</text>

  <rect class="weak" x="200" y="376" width="16" height="16" />
  <text class="lg" x="224" y="389">Weak</text>
  <rect class="mid" x="290" y="376" width="16" height="16" />
  <text class="lg" x="314" y="389">Medium</text>
  <rect class="strong" x="396" y="376" width="16" height="16" />
  <text class="lg" x="420" y="389">Strong</text>
</svg>
