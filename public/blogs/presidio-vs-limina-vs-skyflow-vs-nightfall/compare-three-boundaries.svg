<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="tbT tbD">
  <title id="tbT">Three boundaries where sensitive data can be stopped</title>
  <desc id="tbD">Three columns. At collection, a vault such as Skyflow substitutes a token before the value ever enters your systems, which is a guarantee rather than a detection, but requires control over the point of entry. On the wire, a detector such as Presidio or Limina transforms the text on its way to the model, which works on data you did not collect but is a classifier and therefore misses some of it. After the fact, a DLP platform such as Nightfall finds sensitive data already sitting in SaaS, browsers and endpoints, which bounds how long an exposure lasts rather than whether it happens.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .92; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
    .sub-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .85; }
  </style>

  <text class="ttl" x="0" y="20">Where the sensitive value is stopped</text>

  <rect class="hero" x="35" y="44" width="250" height="186" />
  <text class="hd-inv" x="160" y="76" text-anchor="middle">At collection — the vault</text>
  <text class="cell-inv" x="160" y="108" text-anchor="middle">Skyflow. The value never</text>
  <text class="cell-inv" x="160" y="126" text-anchor="middle">enters your systems; a</text>
  <text class="cell-inv" x="160" y="144" text-anchor="middle">token does.</text>
  <text class="cell-inv" x="160" y="176" text-anchor="middle">Buys: a guarantee, not</text>
  <text class="cell-inv" x="160" y="194" text-anchor="middle">a detection.</text>
  <text class="sub-inv" x="160" y="220" text-anchor="middle">Needs control of the entry point.</text>

  <rect class="adj" x="325" y="44" width="250" height="186" />
  <text class="hd" x="450" y="76" text-anchor="middle">On the wire — the detector</text>
  <text class="cell" x="450" y="108" text-anchor="middle">Presidio, Limina. Text is</text>
  <text class="cell" x="450" y="126" text-anchor="middle">transformed on its way</text>
  <text class="cell" x="450" y="144" text-anchor="middle">to the model.</text>
  <text class="cell" x="450" y="176" text-anchor="middle">Buys: coverage of data</text>
  <text class="cell" x="450" y="194" text-anchor="middle">you did not collect.</text>
  <text class="sub" x="450" y="220" text-anchor="middle">It is a classifier. It misses some.</text>

  <rect class="box" x="615" y="44" width="250" height="186" />
  <text class="hd" x="740" y="76" text-anchor="middle">After the fact — DLP</text>
  <text class="cell" x="740" y="108" text-anchor="middle">Nightfall. Finds sensitive</text>
  <text class="cell" x="740" y="126" text-anchor="middle">data already sitting in</text>
  <text class="cell" x="740" y="144" text-anchor="middle">SaaS, browser, endpoint.</text>
  <text class="cell" x="740" y="176" text-anchor="middle">Buys: a bound on how</text>
  <text class="cell" x="740" y="194" text-anchor="middle">long exposure lasts.</text>
  <text class="sub" x="740" y="220" text-anchor="middle">Not on whether it happens.</text>

  <text class="sub" x="450" y="266" text-anchor="middle">The three are stackable and priced independently. Picking two is common; picking by benchmark recall is the mistake.</text>
</svg>
