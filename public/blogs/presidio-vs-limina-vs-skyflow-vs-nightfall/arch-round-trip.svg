<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="rtT rtD">
  <title id="rtT">The redact-and-restore round trip, and the three places it leaks value</title>
  <desc id="rtD">A pipeline. A source record containing real identifiers passes through a transform that replaces them with placeholders and stores a mapping. The placeholder text goes to the model, the model's answer comes back referring to placeholders, and a restore step puts the real values back before the user sees them. Below the pipeline, three annotations: a miss in the transform sends the real value onward and nothing reports it; the trace store keeps the redacted copy, so incident response reads the version with the evidence removed; and the placeholder map becomes the most sensitive store in the system.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .label  { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .label-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--paper); }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--ink); opacity: .75; }
    .mono-inv { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: var(--paper); opacity: .9; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .7; }
    .hdr    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#arrR); }
    .dash   { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arrR); opacity: .7; }
  </style>
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="20">The round trip nobody scores</text>

  <rect class="box" x="20" y="48" width="155" height="86" />
  <text class="label" x="97" y="76" text-anchor="middle">Source record</text>
  <text class="mono" x="97" y="100" text-anchor="middle">Jane Alvarez</text>
  <text class="mono" x="97" y="118" text-anchor="middle">acct 8842</text>

  <path class="arrow" d="M 175 91 L 196 91" />

  <rect class="hero" x="200" y="48" width="155" height="86" />
  <text class="label-inv" x="277" y="76" text-anchor="middle">Transform</text>
  <text class="mono-inv" x="277" y="100" text-anchor="middle">vault, or detect</text>
  <text class="mono-inv" x="277" y="118" text-anchor="middle">and replace</text>

  <path class="arrow" d="M 355 91 L 376 91" />

  <rect class="adj" x="380" y="48" width="155" height="86" />
  <text class="label" x="457" y="76" text-anchor="middle">Model sees</text>
  <text class="mono" x="457" y="100" text-anchor="middle">PERSON_1</text>
  <text class="mono" x="457" y="118" text-anchor="middle">ACCT_1</text>

  <path class="arrow" d="M 535 91 L 556 91" />

  <rect class="adj" x="560" y="48" width="155" height="86" />
  <text class="label" x="637" y="76" text-anchor="middle">Answer returns</text>
  <text class="mono" x="637" y="100" text-anchor="middle">"PERSON_1 owes</text>
  <text class="mono" x="637" y="118" text-anchor="middle">on ACCT_1"</text>

  <path class="arrow" d="M 715 91 L 736 91" />

  <rect class="box" x="740" y="48" width="155" height="86" />
  <text class="label" x="817" y="76" text-anchor="middle">Restore</text>
  <text class="mono" x="817" y="100" text-anchor="middle">user sees the</text>
  <text class="mono" x="817" y="118" text-anchor="middle">real values</text>

  <path class="dash" d="M 277 134 L 277 196" />
  <rect class="box" x="20" y="200" width="335" height="120" />
  <text class="hdr" x="187" y="228" text-anchor="middle">1 · A miss goes straight through</text>
  <text class="sub" x="187" y="256" text-anchor="middle">A detector is a classifier. The identifier it</text>
  <text class="sub" x="187" y="276" text-anchor="middle">did not recognise is forwarded verbatim,</text>
  <text class="sub" x="187" y="296" text-anchor="middle">and nothing in the pipeline reports it.</text>

  <path class="dash" d="M 457 134 L 457 196" />
  <rect class="box" x="380" y="200" width="335" height="120" />
  <text class="hdr" x="547" y="228" text-anchor="middle">2 · The trace keeps the redacted copy</text>
  <text class="sub" x="547" y="256" text-anchor="middle">Incident response, debugging and evaluation</text>
  <text class="sub" x="547" y="276" text-anchor="middle">all read the version with the evidence</text>
  <text class="sub" x="547" y="296" text-anchor="middle">removed. That loss is permanent.</text>

  <path class="dash" d="M 817 134 L 817 358" />
  <rect class="box" x="280" y="362" width="537" height="110" />
  <text class="hdr" x="548" y="390" text-anchor="middle">3 · The placeholder map is now your most sensitive store</text>
  <text class="sub" x="548" y="418" text-anchor="middle">Restoring the answer requires a durable mapping from token to value. It is a re-identification</text>
  <text class="sub" x="548" y="438" text-anchor="middle">key for every conversation that used it, it needs its own access policy and retention rule,</text>
  <text class="sub" x="548" y="458" text-anchor="middle">and it is the artefact most redaction evaluations never mention.</text>
</svg>
