<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="amT amD">
  <title id="amT">Which artefact answers which attribution question</title>
  <desc id="amD">A four-by-four matrix. Rows are the OAuth access token, the MCP tool call, the e-signature certificate of completion, and a per-act delegation record. Columns ask whether each names the human principal, names the acting agent, bounds this specific act, and survives as history after revocation. The token and the tool call name only a client id and keep no durable history. The certificate names the signer and the document strongly but says nothing about an agent or a delegation. Only the delegation record answers all four, and it is the row nobody currently issues.</desc>
  <style>
    .lbl    { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); }
    .hdr    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .75; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .weak   { fill: var(--surface); stroke: var(--border-soft); stroke-width: 1; rx: 6; ry: 6; }
    .med    { fill: var(--accent-soft); stroke: var(--border-soft); stroke-width: 1; rx: 6; ry: 6; }
    .strong { fill: var(--accent, #d4421e); stroke: none; rx: 6; ry: 6; }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">Attribution coverage by artefact</text>

  <text class="hdr" x="312" y="52" text-anchor="middle">Names the</text>
  <text class="hdr" x="312" y="68" text-anchor="middle">human principal</text>
  <text class="hdr" x="477" y="52" text-anchor="middle">Names the</text>
  <text class="hdr" x="477" y="68" text-anchor="middle">acting agent</text>
  <text class="hdr" x="642" y="52" text-anchor="middle">Bounds this</text>
  <text class="hdr" x="642" y="68" text-anchor="middle">specific act</text>
  <text class="hdr" x="807" y="52" text-anchor="middle">Survives as</text>
  <text class="hdr" x="807" y="68" text-anchor="middle">history</text>

  <text class="lbl" x="0" y="112">OAuth access token</text>
  <rect class="weak" x="235" y="88" width="155" height="42" />
  <text class="cell" x="312" y="114" text-anchor="middle">No</text>
  <rect class="med" x="400" y="88" width="155" height="42" />
  <text class="cell" x="477" y="114" text-anchor="middle">Client id only</text>
  <rect class="weak" x="565" y="88" width="155" height="42" />
  <text class="cell" x="642" y="114" text-anchor="middle">No</text>
  <rect class="weak" x="730" y="88" width="155" height="42" />
  <text class="cell" x="807" y="114" text-anchor="middle">Overwritten</text>

  <text class="lbl" x="0" y="182">MCP tool call</text>
  <rect class="weak" x="235" y="158" width="155" height="42" />
  <text class="cell" x="312" y="184" text-anchor="middle">No</text>
  <rect class="med" x="400" y="158" width="155" height="42" />
  <text class="cell" x="477" y="184" text-anchor="middle">Client id only</text>
  <rect class="weak" x="565" y="158" width="155" height="42" />
  <text class="cell" x="642" y="184" text-anchor="middle">No</text>
  <rect class="med" x="730" y="158" width="155" height="42" />
  <text class="cell" x="807" y="184" text-anchor="middle">If you trace it</text>

  <text class="lbl" x="0" y="252">Certificate of completion</text>
  <rect class="strong" x="235" y="228" width="155" height="42" />
  <text class="cell-inv" x="312" y="254" text-anchor="middle">Strong</text>
  <rect class="weak" x="400" y="228" width="155" height="42" />
  <text class="cell" x="477" y="254" text-anchor="middle">Silent</text>
  <rect class="strong" x="565" y="228" width="155" height="42" />
  <text class="cell-inv" x="642" y="254" text-anchor="middle">Document hash</text>
  <rect class="strong" x="730" y="228" width="155" height="42" />
  <text class="cell-inv" x="807" y="254" text-anchor="middle">Retained</text>

  <text class="lbl" x="0" y="322">Per-act delegation record</text>
  <rect class="strong" x="235" y="298" width="155" height="42" />
  <text class="cell-inv" x="312" y="324" text-anchor="middle">Strong</text>
  <rect class="strong" x="400" y="298" width="155" height="42" />
  <text class="cell-inv" x="477" y="324" text-anchor="middle">Strong</text>
  <rect class="strong" x="565" y="298" width="155" height="42" />
  <text class="cell-inv" x="642" y="324" text-anchor="middle">Scope + expiry</text>
  <rect class="strong" x="730" y="298" width="155" height="42" />
  <text class="cell-inv" x="807" y="324" text-anchor="middle">Append-only</text>

  <rect class="weak" x="0" y="366" width="18" height="18" />
  <text class="sub" x="26" y="380">Absent</text>
  <rect class="med" x="110" y="366" width="18" height="18" />
  <text class="sub" x="136" y="380">Partial</text>
  <rect class="strong" x="220" y="366" width="18" height="18" />
  <text class="sub" x="246" y="380">Answers the question</text>
  <text class="sub" x="470" y="380">The bottom row is the one no vendor issues for you.</text>
</svg>
