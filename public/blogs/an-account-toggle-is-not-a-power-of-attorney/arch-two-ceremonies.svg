<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="acT acD">
  <title id="acT">Two paths to the same signed agreement</title>
  <desc id="acD">The upper path is the classic signing ceremony: a named person authenticates, is shown the document, performs a deliberate act, and the certificate of completion binds identity, authentication method, timestamp and document hash to that person. The lower path is the agent path: a prompt, a model decision, an MCP tool call carrying an OAuth client credential, and the same envelope produced — but the record names an integration, and the human intent that permitted it sits far upstream in an account setting an administrator made months earlier.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .lane   { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--ink); opacity: .7; }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .8; }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--paper); opacity: .9; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); opacity: .6; }
    .arrow  { fill: none; stroke: currentColor; stroke-width: 1.25; marker-end: url(#acArr); }
    .dash   { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-dasharray: 5 4; opacity: .55; marker-end: url(#acArr); }
  </style>
  <defs>
    <marker id="acArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text class="ttl" x="0" y="20">Where the act of intent sits</text>

  <text class="lane" x="0" y="52">Signing ceremony</text>
  <rect class="box" x="0" y="64" width="185" height="88" />
  <text class="hd" x="92" y="94" text-anchor="middle">Named signer</text>
  <text class="cell" x="92" y="116" text-anchor="middle">Authenticates as herself,</text>
  <text class="cell" x="92" y="132" text-anchor="middle">is shown the document.</text>

  <path class="arrow" d="M 190 108 L 228 108" />
  <rect class="adj" x="233" y="64" width="185" height="88" />
  <text class="hd" x="325" y="94" text-anchor="middle">Deliberate act</text>
  <text class="cell" x="325" y="116" text-anchor="middle">A click that means</text>
  <text class="cell" x="325" y="132" text-anchor="middle">&#8220;I intend to sign this.&#8221;</text>

  <path class="arrow" d="M 423 108 L 461 108" />
  <rect class="hero" x="466" y="64" width="185" height="88" />
  <text class="hd-inv" x="558" y="94" text-anchor="middle">Certificate of completion</text>
  <text class="cell-inv" x="558" y="116" text-anchor="middle">Identity, auth method,</text>
  <text class="cell-inv" x="558" y="132" text-anchor="middle">timestamp, document hash.</text>

  <path class="arrow" d="M 656 108 L 694 108" />
  <rect class="box" x="699" y="64" width="185" height="88" />
  <text class="hd" x="791" y="94" text-anchor="middle">Attributable</text>
  <text class="cell" x="791" y="116" text-anchor="middle">The record names the</text>
  <text class="cell" x="791" y="132" text-anchor="middle">person to be bound.</text>

  <text class="sub" x="0" y="196">The pre-authorisation and the act are the same event, seconds apart, on one record.</text>

  <text class="lane" x="0" y="266">Agent path via the open MCP server</text>
  <rect class="box" x="0" y="278" width="185" height="88" />
  <text class="hd" x="92" y="308" text-anchor="middle">Prompt in a client</text>
  <text class="cell" x="92" y="330" text-anchor="middle">Slack, ChatGPT, Claude &#8212;</text>
  <text class="cell" x="92" y="346" text-anchor="middle">whichever the user installed.</text>

  <path class="arrow" d="M 190 322 L 228 322" />
  <rect class="adj" x="233" y="278" width="185" height="88" />
  <text class="hd" x="325" y="308" text-anchor="middle">Model decides</text>
  <text class="cell" x="325" y="330" text-anchor="middle">Reads clauses and policy,</text>
  <text class="cell" x="325" y="346" text-anchor="middle">picks terms and a recipient.</text>

  <path class="arrow" d="M 423 322 L 461 322" />
  <rect class="hero" x="466" y="278" width="185" height="88" />
  <text class="hd-inv" x="558" y="308" text-anchor="middle">MCP tool call</text>
  <text class="cell-inv" x="558" y="330" text-anchor="middle">Carries an OAuth client id</text>
  <text class="cell-inv" x="558" y="346" text-anchor="middle">and a scope. Nothing more.</text>

  <path class="arrow" d="M 656 322 L 694 322" />
  <rect class="box" x="699" y="278" width="185" height="88" />
  <text class="hd" x="791" y="308" text-anchor="middle">Same envelope</text>
  <text class="cell" x="791" y="330" text-anchor="middle">The record names an</text>
  <text class="cell" x="791" y="346" text-anchor="middle">integration, not an intent.</text>

  <rect class="box" x="0" y="412" width="418" height="72" />
  <text class="hd" x="209" y="440" text-anchor="middle">Account-level admin control</text>
  <text class="cell" x="209" y="462" text-anchor="middle">Set once, months earlier, by someone not in the room.</text>

  <path class="dash" d="M 209 412 L 209 380 L 325 380 L 325 370" />
  <text class="sub" x="440" y="444">The only human decision in the lower lane is up here &#8212;</text>
  <text class="sub" x="440" y="466">a class permission, standing in for a per-act intent.</text>
</svg>
