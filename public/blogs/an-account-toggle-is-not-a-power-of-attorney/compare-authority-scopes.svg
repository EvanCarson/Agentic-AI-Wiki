<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="asT asD">
  <title id="asT">Three units of authority</title>
  <desc id="asD">Three columns comparing units of authority for an agent-initiated agreement. The account toggle is granted once by an administrator, scopes every agreement in the tenant, is bounded by nothing the record captures, and answers only whether agents may act here. The OAuth scope is granted by a user at connect time, scopes an API surface, is bounded by token lifetime, and answers what a client may call. The per-act delegation record is granted by the principal for a named matter, scopes a counterparty and a value ceiling with an expiry, is bounded to the artefact, and answers whether this person authorised this agreement.</desc>
  <style>
    .box    { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .hero   { fill: var(--accent, #d4421e); stroke: none; rx: 8; ry: 8; }
    .adj    { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.25; rx: 8; ry: 8; }
    .ttl    { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; fill: var(--ink); }
    .hd     { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--ink); }
    .hd-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: var(--paper); }
    .cell   { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
    .cell-inv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--paper); opacity: .9; }
    .sub    { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--ink); opacity: .6; }
  </style>

  <text class="ttl" x="0" y="20">What each unit of authority actually says</text>

  <rect class="box" x="35" y="44" width="250" height="180" />
  <text class="hd" x="160" y="76" text-anchor="middle">Account toggle</text>
  <text class="cell" x="160" y="108" text-anchor="middle">Granted by: an administrator,</text>
  <text class="cell" x="160" y="126" text-anchor="middle">once, in advance.</text>
  <text class="cell" x="160" y="152" text-anchor="middle">Scope: every agreement</text>
  <text class="cell" x="160" y="170" text-anchor="middle">in the tenant.</text>
  <text class="cell" x="160" y="198" text-anchor="middle">Answers: may agents act here?</text>
  <text class="sub" x="160" y="250" text-anchor="middle">A class permission over a class</text>
  <text class="sub" x="160" y="268" text-anchor="middle">nobody has enumerated.</text>

  <rect class="adj" x="325" y="44" width="250" height="180" />
  <text class="hd" x="450" y="76" text-anchor="middle">OAuth scope</text>
  <text class="cell" x="450" y="108" text-anchor="middle">Granted by: a user, at</text>
  <text class="cell" x="450" y="126" text-anchor="middle">connect time.</text>
  <text class="cell" x="450" y="152" text-anchor="middle">Scope: an API surface,</text>
  <text class="cell" x="450" y="170" text-anchor="middle">bounded by token lifetime.</text>
  <text class="cell" x="450" y="198" text-anchor="middle">Answers: what may this client call?</text>
  <text class="sub" x="450" y="250" text-anchor="middle">Overwritten on every refresh,</text>
  <text class="sub" x="450" y="268" text-anchor="middle">so it keeps no history.</text>

  <rect class="hero" x="615" y="44" width="250" height="180" />
  <text class="hd-inv" x="740" y="76" text-anchor="middle">Per-act delegation record</text>
  <text class="cell-inv" x="740" y="108" text-anchor="middle">Granted by: the principal,</text>
  <text class="cell-inv" x="740" y="126" text-anchor="middle">for a named matter.</text>
  <text class="cell-inv" x="740" y="152" text-anchor="middle">Scope: counterparty, ceiling,</text>
  <text class="cell-inv" x="740" y="170" text-anchor="middle">expiry, artefact hash.</text>
  <text class="cell-inv" x="740" y="198" text-anchor="middle">Answers: did she authorise this one?</text>
  <text class="sub" x="740" y="250" text-anchor="middle">The row no vendor issues</text>
  <text class="sub" x="740" y="268" text-anchor="middle">and every dispute asks for.</text>
</svg>
