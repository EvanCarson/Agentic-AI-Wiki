# Search demand: once a week, harvest what people ask about agents and rank it
# against what the site already says. The daily content routine downloads the
# result and starts from it (docs/routines/daily-content-batch.prompt.md, §2a).
# Design: docs/superpowers/specs/2026-10-18-search-demand-queue-design.md
#
# THE OUTPUT IS AN ARTIFACT, NOT A COMMIT, ON PURPOSE. A pull request opened with
# the Actions GITHUB_TOKEN does not trigger other workflows, so the required
# `gates` check (ci.yml) would never report and the PR would sit blocked forever.
# Pushing to main directly is forbidden by the "Protect Main" ruleset. An artifact
# needs neither: the routine fetches the latest one with `gh run download`.
# That is also why this job only needs `contents: read`.
#
# MISSING SECRETS ARE FINE. Every source is optional. Without GSC_SA_KEY/GSC_SITE
# or BING_API_KEY/BING_SITE the harvester skips that source, records why in the
# file's `sources` block, and still ranks the public Stack Exchange and Hacker
# News questions; weakPages and lowClickPages come out empty with a `reason`.
# A source that errors is recorded the same way. The job fails only on a defect
# in the harvester itself. Setting up the secrets is the one-off owner task in
# the design doc ("The owner's one-off setup").

name: Search demand

on:
  schedule:
    # Monday 06:00 UTC: fresh for the week's first daily batch (08:00 UTC).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A manual run started while the scheduled one is in flight replaces it.
concurrency:
  group: search-demand
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # No `npm ci`: the harvester uses only Node built-ins, and the coverage
      # index is read from the source tree, so there is nothing to install or build.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Harvest the search-demand queue
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          BING_SITE: ${{ secrets.BING_SITE }}
        run: node scripts/search-demand/harvest.mjs --out search-queue.json

      - uses: actions/upload-artifact@v4
        with:
          name: search-queue
          path: search-queue.json
          retention-days: 90
          if-no-files-found: error
