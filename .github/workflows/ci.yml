# CI: the two verification gates the Vercel build does not run.
#
# Vercel's buildCommand runs build, verify, search:index and test:search on every
# push and reports its own check. This job adds `npm test` and the Playwright
# design guard (`npm run test:design`), which needs a browser Vercel's build image
# does not have. Design and rationale:
#   docs/superpowers/specs/2026-07-29-ci-verification-gates-design.md
#
# THE JOB NAME `gates` IS AN INTERFACE, NOT A LABEL. The "Protect Main" ruleset
# requires a status check with exactly this name before anything merges. Rename
# the job and the ruleset keeps waiting for a check that never reports: every
# pull request shows the check as "Expected" and is blocked from merging until
# someone notices. Change the name here and in the ruleset together, or not at all.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The browser download is ~150MB; cache it on the exact Playwright version
      # so a dependency bump invalidates it and nothing else does.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Only Chromium: the guard launches it explicitly (scripts/__tests__/design/system.mjs).
      - run: npx playwright install --with-deps chromium

      # The unit tests that read dist/ (llms.txt link resolution, the OG catalogue)
      # skip without a build, and a skipped guard is a green check that guards nothing.
      - run: npm run build

      - run: npm test

      # TEMPORARY: answers whether this runner measures with Inter or a fallback.
      # Remove once the answer is recorded in the spec.
      - name: Diagnose font loading
        run: node scripts/lib/font-diagnostic.mjs

      # Rebuilds internally, then renders every page's inlined SVGs in Chromium.
      - run: npm run test:design
